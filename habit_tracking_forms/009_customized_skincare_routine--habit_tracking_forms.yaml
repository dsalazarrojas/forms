inputSchema:
  type: object
  properties:
    title: Customized Skincare Routine
    pages:
    - id: 1
      name: routine_type
      label: Customized Skincare
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: products
      label: Selected Products
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: routine_duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: frequency
      label: Frequency
      hint: null
      type: select_one
      options:
      - '{''label'': ''Daily''}'
      - '{''label'': ''Weekly''}'
      - '{''label'': ''Bi-Weekly''}'
      - '{''label'': ''Monthly''}'
      - '{''label'': ''Quarterly''}'
      required: false
    - id: 5
      name: time_of_day
      label: Time of Day
      hint: null
      type: select_one
      options:
      - '{''label'': ''Morning''}'
      - '{''label'': ''Afternoon''}'
      - '{''label'': ''Evening''}'
      - '{''label'': ''Night''}'
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
