inputSchema:
  type: object
  properties:
    title: Dietary Habits And Frequency Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: section_1
      label: Breakfast, Lunch, and Dinner Frequency
      hint: null
      type: select_multiple
      options:
      - Breakfast
      - Lunch
      - Dinner
      required: true
    - id: 3
      name: section_2
      label: Food Allergies
      hint: null
      type: select_multiple
      options:
      - I have food allergies
      - I do not have food allergies
      required: false
    - id: 4
      name: section_3
      label: Types of Food Eaten
      hint: null
      type: select_multiple
      options:
      - Meat and fish
      - Fruits and vegetables
      - Grains
      - Dairy
      - Other
      required: false
    - id: 5
      name: section_4
      label: Fruit and Vegetable Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Occasionally
      - Rarely
      required: true
    - id: 6
      name: section_5
      label: Meat and Fish Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Occasionally
      - Rarely
      required: true
    - id: 7
      name: section_6
      label: Time of Eating
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - All day
      required: true
    - id: 8
      name: section_7
      label: Time Spent on Food Preparation
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: section_8
      label: Eating Out Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Occasionally
      - Rarely
      required: true
    - id: 10
      name: section_9
      label: Leftovers Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Occasionally
      - Rarely
      required: true
    - id: 11
      name: section_10
      label: Favorite Food
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: section_11
      label: Eating Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Occasionally
      - Rarely
      required: true
