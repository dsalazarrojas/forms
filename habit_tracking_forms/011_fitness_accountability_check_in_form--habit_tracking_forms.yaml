inputSchema:
  type: object
  properties:
    title: Fitness Accountability Check In Form
    pages:
    - id: 1
      name: user_name
      label: first_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: workout_plan
      label: current_workout_plan
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: workout_days
      label: what_days_did_you_workout
      hint: null
      type: select_multiple
      options:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      - SUNDAY
      required: false
    - id: 5
      name: exercises
      label: exercises_completed
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: sets_rep
      label: sets_completed
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 7
      name: weight_used
      label: weight_used
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: weight_used_unit
      label: what_unit_of_measurement_used
      hint: null
      type: select_one
      options:
      - KILOGRAMS
      - GRAMS
      - LBS
      - POUNDS
      - KG
      - OUNCE
      required: false
    - id: 9
      name: time_spent_exercising
      label: time_spent_exercising
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
