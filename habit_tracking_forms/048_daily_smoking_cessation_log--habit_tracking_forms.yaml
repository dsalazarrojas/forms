inputSchema:
  type: object
  properties:
    title: Daily Smoking Cessation Log
    pages:
    - id: 1
      name: cigarettes_consumed
      label: cigarettes_consumed
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: cravings_level
      label: cravings_level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 3
      name: triggers
      label: triggers
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: coping_strategies
      label: coping_strategies
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: mood
      label: mood
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: cigarettes_consumed_time
      label: cigarettes_consumed_time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
