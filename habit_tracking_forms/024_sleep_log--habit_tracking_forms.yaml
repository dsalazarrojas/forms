inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: bedtime_routine
      label: Bedtime Routine
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: bedtime_time
      label: Bedtime
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: sleep_quality
      label: Sleep Quality
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 4
      name: sleep_duration
      label: Sleep Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: wake_up_time
      label: Wake-up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: rating_sleep
      label: Sleep Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 7
      name: sleep_notes
      label: Notes
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: user_id
      label: User ID
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: created_by
      label: Created By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: form_submitted_by
      label: Form Submitted By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
