inputSchema:
  type: object
  properties:
    title: Construction Safety Standards Petition Form
    pages:
    - id: 1
      name: section_petitioner_information
      label: -- Petitioner Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: signer_name
      label: Signer name
      hint: Full name of petitioner
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Employer or affiliation if applicable
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact email
      hint: For updates about the petition
      type: email
      options: []
      required: false
    - id: 5
      name: support_statement
      label: Support statement
      hint: Reason for supporting the safety standard change
      type: text
      options: []
      required: true
    - id: 6
      name: region
      label: Region
      hint: Jurisdiction or area this petition pertains to
      type: text
      options: []
      required: false
    - id: 7
      name: permission_to_publish
      label: Permission to publish name
      hint: Allow your name to be published with petition signatures
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
