inputSchema:
  type: object
  properties:
    title: Campus Vehicle Policy Petition
    pages:
    - id: 1
      name: header
      label: -- Petition Header --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: supporter_name
      label: Supporter Name
      hint: Full name for petition signatory
      type: text
      options: []
      required: true
    - id: 3
      name: supporter_email
      label: Supporter Email
      hint: Optional email for updates
      type: email
      options: []
      required: false
    - id: 4
      name: supporter_affiliation
      label: Affiliation
      hint: Student, faculty, staff, or community
      type: select_one
      options:
      - Student
      - Faculty
      - Staff
      - Community member
      required: true
    - id: 5
      name: signature_location
      label: Signature Location
      hint: City or campus location
      type: text
      options: []
      required: false
    - id: 6
      name: position_statement
      label: Position Statement
      hint: Optional brief statement or reason for signing
      type: text
      options: []
      required: false
    - id: 7
      name: consent_to_publish
      label: Consent to Publish Name
      hint: Permit name to be published with petition results
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 8
      name: postal_code
      label: Postal Code
      hint: Optional for demographic tracking
      type: text
      options: []
      required: false
    - id: 9
      name: newsletter_opt_in
      label: Opt in for updates
      hint: Receive updates about petition progress
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
