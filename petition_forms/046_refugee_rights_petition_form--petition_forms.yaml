inputSchema:
  type: object
  properties:
    title: Refugee Rights Petition Form
    pages:
    - id: 1
      name: user_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: country
      label: Country
      hint: null
      type: select_one
      options:
      - Afghanistan
      - Albania
      - Algeria
      - Angola
      - Antigua and Barbuda
      - Argentina
      - Armenia
      - Australia
      - Austria
      - Azerbaijan
      - Bahamas
      - Bahrain
      - Bangladesh
      required: true
    - id: 6
      name: state_province
      label: State or Province
      hint: null
      type: select_multiple
      options:
      - Afrikaans
      - Amhárait
      - Arabic
      - Cantonese
      - Catalan
      - English
      - French
      - Igbo
      - Ilocano
      - Indonesian
      - Kiswahili
      - Kreyòl
      - Pуський
      - Portuguese
      - Romanian
      - Somali
      - Sran Tana
      - Swahili
      - Thai
      - Tsong
      required: false
    - id: 7
      name: refugee_rights
      label: I am aware of my rights as a refugee
      hint: null
      type: select_one
      options:
      - I do not know
      - I am aware
      - I am not aware
      - Refused to answer
      - Prefer not to answer
      required: false
    - id: 8
      name: refugee_status
      label: What is your current refugee status?
      hint: null
      type: select_one
      options:
      - Refugee
      - Asylum Seeker
      - Asylum Granted
      - Not a refugee or asylum seeker
      required: false
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: role
      label: Role
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: message_for_organizers
      label: Message for Organizers
      hint: null
      type: select_multiple
      options:
      - I support the refugee rights movement
      - I need help with filling this form
      - I have a suggestion
      - I have feedback
      required: false
    - id: 13
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 16
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: language
      label: Language
      hint: null
      type: select_one
      options:
      - English
      - French
      - Spanish
      - Hindi
      - Arabic
      - Portuguese
      - Kreyòl
      - Somali
      required: false
