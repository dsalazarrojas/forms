inputSchema:
  type: object
  properties:
    title: Petition For Road Repair Form
    pages:
    - id: 1
      name: road_petition_form
      label: Road Conditions
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: road_condition
      label: Condition of the Road
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: road_location
      label: Location of the Road
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: road_description
      label: Description of the Issue
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: road_request
      label: What do you want us to fix?
      hint: null
      type: select_one
      options:
      - Potholes
      - Cracks
      - Flooding
      - Traffic Signals
      - Road Signs
      required: false
    - id: 6
      name: road_priority
      label: Priority
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: contact_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
