inputSchema:
  type: object
  properties:
    title: Patient Discharge Form
    pages:
    - id: 1
      name: page_one
      label: Patient Information
      hint: Enter patient information
      type: text
      options: []
      required: false
    - id: 2
      name: medical_facility
      label: Medical Facility
      hint: null
      type: select_one
      options:
      - Hospital
      - Clinic
      - Urgent Care
      required: false
    - id: 3
      name: primary_care_provider
      label: Primary Care Provider
      hint: null
      type: select_multiple
      options:
      - PCP
      - NP
      - EP
      required: false
    - id: 4
      name: date_of_discharge
      label: Date of Discharge
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: discharge_status
      label: Discharge Status
      hint: null
      type: select_one
      options:
      - Discharged
      - Transferred
      - Deceased
      required: false
    - id: 6
      name: medication_list
      label: Medication List
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: medications
      label: Medications
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
