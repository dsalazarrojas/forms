inputSchema:
  type: object
  properties:
    title: Chronic Care Program Lead Form
    pages:
    - id: 1
      name: patient_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: Select your gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Prefer to self-describe
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: For program communication
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: For appointment reminders
      type: text
      options: []
      required: true
    - id: 6
      name: section_patient_info
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: address_line1
      label: Street Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state_province
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: postal_code
      label: Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: section_address
      label: -- Address --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: insurance_provider
      label: Insurance Provider
      hint: Your insurance company
      type: text
      options: []
      required: true
    - id: 13
      name: insurance_id
      label: Insurance ID Number
      hint: Your member ID number
      type: text
      options: []
      required: true
    - id: 14
      name: primary_care_physician
      label: Primary Care Physician
      hint: Name of your PCP
      type: text
      options: []
      required: true
    - id: 15
      name: pcp_phone
      label: PCP Phone Number
      hint: Doctor office phone
      type: text
      options: []
      required: false
    - id: 16
      name: section_insurance
      label: -- Insurance Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: chronic_conditions
      label: Chronic Conditions
      hint: Select all that apply
      type: select_multiple
      options:
      - Type 1 Diabetes
      - Type 2 Diabetes
      - Hypertension
      - Heart Disease
      - COPD
      - Asthma
      - Chronic Kidney Disease
      - Arthritis
      - Depression
      - Anxiety
      - Obesity
      - High Cholesterol
      - Other
      required: true
    - id: 18
      name: condition_duration
      label: How Long Diagnosed
      hint: Time since first diagnosis
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 19
      name: current_medications
      label: Current Medications
      hint: List your current medications
      type: text
      options: []
      required: true
    - id: 20
      name: section_medical_history
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: program_interest
      label: Interest in Program
      hint: Why are you interested
      type: select_one
      options:
      - Better disease management
      - Reduce symptoms
      - Prevent complications
      - Learn more about condition
      - Support from care team
      - Physician referral
      - Other
      required: true
    - id: 22
      name: program_goals
      label: Program Goals
      hint: What do you hope to achieve
      type: select_multiple
      options:
      - Better symptom control
      - Reduce medication side effects
      - Improve daily functioning
      - Lose weight
      - Exercise more
      - Eat healthier
      - Reduce stress
      - Better sleep
      - Avoid hospital visits
      required: true
    - id: 23
      name: section_program_interest
      label: -- Program Interest --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Phone Call
      - Text Message
      - Email
      - Mail
      - Patient Portal
      required: true
    - id: 25
      name: best_time_to_contact
      label: Best Time to Contact
      hint: When are you available
      type: select_one
      options:
      - Morning 8am-12pm
      - Afternoon 12pm-4pm
      - Evening 4pm-8pm
      - Any time
      required: true
    - id: 26
      name: language_preference
      label: Language Preference
      hint: Preferred language for communication
      type: select_one
      options:
      - English
      - Spanish
      - Chinese
      - Vietnamese
      - Korean
      - Other
      required: true
    - id: 27
      name: section_communication
      label: -- Communication Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 28
      name: transportation_needs
      label: Transportation Needs
      hint: Do you need transportation help
      type: select_one
      options:
      - No I have transportation
      - Yes need assistance
      - Sometimes need help
      required: true
    - id: 29
      name: caregiver_support
      label: Caregiver Support
      hint: Do you have a caregiver
      type: select_one
      options:
      - Yes family member
      - Yes professional caregiver
      - No I manage alone
      - Sometimes have help
      required: true
    - id: 30
      name: section_support
      label: -- Support System --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: consent_to_participate
      label: Consent to Participate
      hint: I agree to participate in the program
      type: select_one
      options:
      - Yes I consent
      - No I do not consent
      required: true
    - id: 32
      name: privacy_acknowledgment
      label: Privacy Acknowledgment
      hint: I understand my privacy rights
      type: select_one
      options:
      - Yes I understand
      - No I need more info
      required: true
    - id: 33
      name: additional_comments
      label: Additional Comments
      hint: Anything else we should know
      type: text
      options: []
      required: false
