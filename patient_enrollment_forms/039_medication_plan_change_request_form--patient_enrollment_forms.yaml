inputSchema:
  type: object
  properties:
    title: Medication Plan Change Request Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: medication_name
      label: Medication Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: dosage_change
      label: Dosage Change
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: frequency_change
      label: Frequency Change
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: reason_for_change
      label: Reason for Change
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: physician_comments
      label: Physician Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: patient_comments
      label: Patient Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: medication_plan
      label: Medication Plan
      hint: null
      type: select_one
      options:
