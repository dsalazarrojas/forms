inputSchema:
  type: object
  properties:
    title: Adult New Patient Enrollment Form
    pages:
    - id: 1
      name: patient_info_header
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: Use YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: Street, city, state, postal code
      type: text
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: Mobile preferred
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email address
      hint: For appointment reminders
      type: email
      options: []
      required: false
    - id: 7
      name: insurance_provider
      label: Insurance provider
      hint: Name of insurer and policy number
      type: text
      options: []
      required: false
    - id: 8
      name: primary_complaint
      label: Primary medical complaint
      hint: Brief description of reason for visit
      type: text
      options: []
      required: true
    - id: 9
      name: existing_conditions
      label: Existing medical conditions
      hint: List chronic conditions and allergies
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Required contact details
      type: text
      options: []
      required: true
