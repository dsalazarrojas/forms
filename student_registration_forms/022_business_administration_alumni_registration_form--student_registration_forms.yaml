inputSchema:
  type: object
  properties:
    title: Business Administration Alumni Registration Form
    pages:
    - id: 1
      name: personal_info
      label: Personal Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Your full name as it appeared at graduation
      type: text
      options: []
      required: true
    - id: 3
      name: maiden_name
      label: Maiden or Previous Name
      hint: If different from current name
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: false
    - id: 5
      name: gender
      label: Gender
      hint: Your gender
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      - Other
      required: false
    - id: 6
      name: contact_info
      label: Contact Information
      hint: How to reach you
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email Address
      hint: Your current email
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: false
    - id: 9
      name: mailing_address
      label: Mailing Address
      hint: Your full address
      type: text
      options: []
      required: false
    - id: 10
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: false
    - id: 11
      name: state_province
      label: State or Province
      hint: Your state or province
      type: text
      options: []
      required: false
    - id: 12
      name: country
      label: Country
      hint: Your country of residence
      type: text
      options: []
      required: false
    - id: 13
      name: zip_code
      label: ZIP or Postal Code
      hint: Your postal code
      type: text
      options: []
      required: false
    - id: 14
      name: academic_info
      label: Academic Information
      hint: Your program details
      type: note
      options: []
      required: false
    - id: 15
      name: program_name
      label: Program Name
      hint: Which program did you complete
      type: select_one
      options:
      - Bachelor of Business Administration
      - Master of Business Administration
      - Executive MBA
      - PhD in Business Administration
      - Certificate Program
      - Other
      required: true
    - id: 16
      name: graduation_year
      label: Graduation Year
      hint: When did you graduate
      type: number
      options: []
      required: true
    - id: 17
      name: concentration
      label: Concentration or Major
      hint: Your area of specialization
      type: select_one
      options:
      - Finance
      - Marketing
      - Management
      - Human Resources
      - Operations
      - Information Systems
      - Entrepreneurship
      - International Business
      - Other
      required: true
    - id: 18
      name: professional_info
      label: Professional Information
      hint: Your career details
      type: note
      options: []
      required: false
    - id: 19
      name: current_employer
      label: Current Employer
      hint: Name of your organization
      type: text
      options: []
      required: false
    - id: 20
      name: job_title
      label: Current Job Title
      hint: Your position
      type: text
      options: []
      required: false
    - id: 21
      name: industry
      label: Industry
      hint: Your industry sector
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Manufacturing
      - Retail
      - Education
      - Government
      - Non-Profit
      - Self-Employed
      - Other
      required: false
    - id: 22
      name: years_experience
      label: Years of Experience
      hint: Total years of professional experience
      type: select_one
      options:
      - 0-2 years
      - 3-5 years
      - 6-10 years
      - 11-15 years
      - 16-20 years
      - More than 20 years
      required: false
    - id: 23
      name: linkedin_profile
      label: LinkedIn Profile
      hint: URL to your LinkedIn profile
      type: text
      options: []
      required: false
    - id: 24
      name: alumni_engagement
      label: Alumni Engagement
      hint: How would you like to stay connected
      type: note
      options: []
      required: false
    - id: 25
      name: newsletter_subscription
      label: Subscribe to Alumni Newsletter
      hint: Would you like to receive our newsletter
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 26
      name: mentorship_interest
      label: Mentorship Interest
      hint: Would you like to participate in mentorship
      type: select_one
      options:
      - Yes - As a Mentor
      - Yes - As a Mentee
      - Yes - Both
      - 'False'
      - Maybe
      required: true
    - id: 27
      name: event_interest
      label: Event Interest
      hint: Types of events you are interested in
      type: select_multiple
      options:
      - Networking Events
      - Professional Development
      - Guest Lectures
      - Reunions
      - Career Fairs
      - Webinars
      - Regional Meetups
      - None
      required: false
    - id: 28
      name: volunteering_interest
      label: Volunteering Interest
      hint: Would you like to volunteer
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 29
      name: additional_comments
      label: Additional Comments
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
