inputSchema:
  type: object
  properties:
    title: Student Parking Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: parking_permit
      label: Parking Permit
      hint: null
      type: select_one
      options:
      - '{1: ''On Campus''}'
      - '{2: ''Off Campus''}'
      required: false
    - id: 5
      name: parking_hours
      label: Parking Hours
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - '{1: ''Phone''}'
      - '{2: ''Email''}'
      - '{3: ''Text''}'
      - '{4: ''In Person''}'
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
