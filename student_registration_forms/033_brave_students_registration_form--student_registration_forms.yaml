inputSchema:
  type: object
  properties:
    title: BRAVE Students Registration Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: section_school_info
      label: -- School Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - Grade 6
      - Grade 7
      - Grade 8
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      - Other
      required: true
    - id: 10
      name: section_guardian_info
      label: -- Parent/Guardian Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: guardian_name
      label: Parent/Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 12
      name: relationship
      label: Relationship to Student
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: guardian_email
      label: Parent/Guardian Email
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 14
      name: guardian_phone
      label: Parent/Guardian Phone
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 15
      name: section_program_info
      label: -- Program Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: program_interest
      label: Program of Interest
      hint: What is the student interested in?
      type: text
      options: []
      required: true
    - id: 17
      name: academic_strengths
      label: Academic Strengths
      hint: Subject areas where student excels
      type: text
      options: []
      required: false
    - id: 18
      name: areas_for_improvement
      label: Areas for Growth
      hint: Subject areas needing support
      type: text
      options: []
      required: false
    - id: 19
      name: special_needs
      label: Special Needs or Accommodations
      hint: Learning disabilities, accessibility needs, etc.
      type: text
      options: []
      required: false
    - id: 20
      name: prior_participation
      label: Prior BRAVE Program Participation?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not sure
      required: false
    - id: 21
      name: goals
      label: What Are Your Goals?
      hint: What do you hope to achieve?
      type: text
      options: []
      required: false
    - id: 22
      name: consent_agreement
      label: Parent/Guardian Consent
      hint: Do you agree to program terms and conditions?
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
