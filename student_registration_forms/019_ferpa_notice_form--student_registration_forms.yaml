inputSchema:
  type: object
  properties:
    title: FERPA Notice Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Enter your name as it appears on your student record.
      type: text
      options: []
      required: true
    - id: 2
      name: student_email
      label: Student Email
      hint: Your university email address.
      type: email
      options: []
      required: true
    - id: 3
      name: student_phone_number
      label: Student Phone Number
      hint: Your phone number as it appears on your student record.
      type: text
      options: []
      required: true
    - id: 4
      name: school_records
      label: School Records
      hint: Enter school records as it appears on your student record.
      type: select_multiple
      options:
      - School Records 1
      - School Records 2
      - School Records 3
      required: false
    - id: 5
      name: data_purposes
      label: Data Purposes
      hint: Select the data purposes.
      type: select_one
      options:
      - Data Purposes 1
      - Data Purposes 2
      - Data Purposes 3
      required: false
    - id: 6
      name: ferpa_consent
      label: FERPA Consent
      hint: Check the box if you consent to data sharing.
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: Any additional comments about your student record.
      type: text
      options: []
      required: true
    - id: 8
      name: date
      label: Date
      hint: Enter the date as it appears on your student record.
      type: date
      options: []
      required: true
    - id: 9
      name: time
      label: Time
      hint: Enter the time as it appears on your student record.
      type: time
      options: []
      required: true
    - id: 10
      name: student_signature
      label: Student Signature
      hint: Your signature as it appears on your student record.
      type: text
      options: []
      required: true
    - id: 11
      name: school_signature
      label: School Signature
      hint: School signature as it appears on your student record.
      type: text
      options: []
      required: true
    - id: 12
      name: agreements
      label: Agreements
      hint: Check the box if you agree to data sharing.
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 13
      name: ferpa_agreement_1
      label: FERPA Agreement 1
      hint: Check the box if you agree to data sharing.
      type: radio
      options:
      - I agree
      - I do not agree
      required: true
    - id: 14
      name: ferpa_agreement_2
      label: FERPA Agreement 2
      hint: Check the box if you agree to data sharing.
      type: radio
      options:
      - I agree
      - I do not agree
      required: true
    - id: 15
      name: ferpa_acknowledgement_1
      label: FERPA Acknowledgement 1
      hint: Check the box if you agree to data sharing.
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 16
      name: ferpa_acknowledgement_2
      label: FERPA Acknowledgement 2
      hint: Check the box if you agree to data sharing.
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
