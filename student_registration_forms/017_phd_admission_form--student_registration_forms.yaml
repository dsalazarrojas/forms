      type: number
      options: []
      required: false
    - id: 6
      name: research_area
      label: Research Area
      hint: null
      type: select_multiple
      options:
      - Area A
      - Area B
      - Area C
      required: false
    - id: 7
      name: submit_date
      label: Submit Date
      hint: null
      type: date
      options: []
