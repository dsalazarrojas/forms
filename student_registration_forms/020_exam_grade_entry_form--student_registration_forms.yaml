      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: assignment_type
      label: Assignment Type
      hint: null
      type: select_one
      options:
      - '{''label'': ''Assignment 1'', ''value'': ''Assignment 1''}'
      - '{''label'': ''Assignment 2'', ''value'': ''Assignment 2''}'
      - '{''label'': ''Other'', ''value'': ''Other''}'
      - '{''label'': ''Not Applicable'', ''value'': ''Not Applicable''}'
      required: true
    - id: 4
      name: grade
      label: Grade
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: grade_type
      label: Grade Type
      hint: null
      type: select_one
      options:
      - '{''label'': ''Letter Grade'', ''value'': ''letter''}'
      - '{''label'': ''Percent'', ''value'': ''percent''}'
      required: true
    - id: 6
      name: grade_date
      label: Grade Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: teacher_comments
      label: Teacher Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
