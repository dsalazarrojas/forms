      required: true
    - id: 12
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: grade_scale
      label: Grade Scale
      hint: null
      type: select_one
      options:
      - '{''label'': ''A+'', ''value'': ''A+''}'
      - '{''label'': ''A'', ''value'': ''A''}'
