inputSchema:
  type: object
  properties:
    title: Exam Grade Entry Form
    pages:
    - id: 1
      name: exam_grade_entry_form
      label: Exam Grade Entry
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_id
      label: Student Id
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: assignment_type
      label: Assignment Type
      hint: null
      type: select_one
      options:
      - Assignment 1
      - Assignment 2
      - Other
      - Not Applicable
      required: true
    - id: 4
      name: grade
      label: Grade
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: grade_type
      label: Grade Type
      hint: null
      type: select_one
      options:
      - Letter Grade
      - Percent
      required: true
    - id: 6
      name: grade_date
      label: Grade Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: teacher_comments
      label: Teacher Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: school_year
      label: School Year
      hint: null
      type: select_multiple
      options:
      - Fall 2022
      - Spring 2023
      required: true
    - id: 12
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: grade_scale
      label: Grade Scale
      hint: null
      type: select_one
      options:
      - A+
      - A
      - B
      - C
      - D
      - F
      required: true
    - id: 14
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
