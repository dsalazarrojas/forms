inputSchema:
  type: object
  properties:
    title: High School AP Course Enrollment Form
    pages:
    - id: 1
      name: user_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 4
      name: course_id
      label: Course ID
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: course_request_date
      label: Course Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: course_requested
      label: Course Requested
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: course_approved
      label: Course Approved
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
