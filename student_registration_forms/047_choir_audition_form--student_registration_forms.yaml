inputSchema:
  type: object
  properties:
    title: Choir Audition Form
    pages:
    - id: 1
      name: student_information
      label: -- Student Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Current Grade Level
      hint: null
      type: select_one
      options:
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      - Other
      required: true
    - id: 5
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_information
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: parent_phone
      label: Parent Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: musical_experience
      label: -- Musical Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: voice_type
      label: Vocal Range or Voice Type
      hint: null
      type: select_one
      options:
      - Soprano
      - Alto
      - Tenor
      - Bass
      - Unsure
      required: true
    - id: 13
      name: singing_experience
      label: Years of Singing Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: choir_experience
      label: Previous Choir Experience
      hint: null
      type: select_one
      options:
      - None
      - School choir
      - Church choir
      - Community choir
      - Multiple choirs
      required: true
    - id: 15
      name: music_reading
      label: Can you read music
      hint: null
      type: select_one
      options:
      - Yes, proficiently
      - Yes, basic level
      - 'No'
      required: true
    - id: 16
      name: instruments_played
      label: Other Instruments Played
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: audition_details
      label: -- Audition Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: prepared_piece
      label: Prepared Song or Piece Title
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: piece_genre
      label: Genre of Prepared Piece
      hint: null
      type: select_one
      options:
      - Classical
      - Musical Theater
      - Jazz
      - Pop
      - Sacred
      - Folk
      - Other
      required: true
    - id: 20
      name: accompaniment_type
      label: Accompaniment for Audition
      hint: null
      type: select_one
      options:
      - A cappella
      - Piano accompaniment
      - Recorded backing track
      - Accompanist provided
      required: true
    - id: 21
      name: audition_availability
      label: -- Audition Availability --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: preferred_audition_date
      label: Preferred Audition Date
      hint: null
      type: date
      options: []
      required: true
    - id: 23
      name: preferred_audition_time
      label: Preferred Audition Time
      hint: null
      type: select_one
      options:
      - Morning (8am-12pm)
      - Afternoon (12pm-5pm)
      - Evening (5pm-8pm)
      - Flexible
      required: true
    - id: 24
      name: additional_information
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments or Interests
      hint: null
      type: text
      options: []
      required: false
