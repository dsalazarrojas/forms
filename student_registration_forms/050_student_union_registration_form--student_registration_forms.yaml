inputSchema:
  type: object
  properties:
    title: Student Union Registration Form
    pages:
    - id: 1
      name: student_union_registration_form_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_union_registration_form_email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: student_union_registration_form_date_of_birth
      label: date_of_birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: student_union_registration_form_program
      label: program
      hint: null
      type: select_one
      options:
      - 'D1: Undergraduate'
      - 'D2: Graduate'
      - 'P1: Postgraduate'
      - 'P2: Postgraduate'
      - 'P3: Postgraduate'
      required: false
    - id: 5
      name: student_union_registration_form_semester
      label: semester
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: student_union_registration_form_campus
      label: campus
      hint: null
      type: select_one
      options:
      - Campus 1
      - Campus 2
      - Campus 3
      - Campus 4
      - Campus 5
      required: false
    - id: 7
      name: student_union_registration_form_phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: student_union_registration_form_note
      label: note
      hint: null
      type: note
      options: []
      required: false
