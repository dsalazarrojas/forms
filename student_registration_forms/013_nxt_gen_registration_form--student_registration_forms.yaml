inputSchema:
  type: object
  properties:
    title: nxt_gen_registration_form
    pages:
    - id: 1
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: interests
      label: Participant Interests
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: consent
      label: Participant Consent
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: true
    - id: 4
      name: school_info
      label: School Info
      hint: Enter school name and contact info
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: date
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
