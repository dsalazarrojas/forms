inputSchema:
  type: object
  properties:
    title: Returning High School Student Application
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: grade
      label: Grade
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: parent_email
      label: Parent Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: parent_phone
      label: Parent Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: student_address
      label: Student Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: student_grade_level
      label: Student Grade Level
      hint: null
      type: select_multiple
      options:
      - High
      - Low
      required: false
    - id: 9
      name: student_start_date
      label: Student Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: student_end_date
      label: Student End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: student_status
      label: Student Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 12
      name: staff_name
      label: Staff Name
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
