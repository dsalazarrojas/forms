inputSchema:
  type: object
  properties:
    title: Daycare Medical Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_dob
      label: Student DOB
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: student_gender
      label: Student Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 4
      name: student_allergies
      label: Student Allergies
      hint: null
      type: select_multiple
      options:
      - Peanuts
      - Eggs
      - Dairy
      required: true
    - id: 5
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_relationship
      label: Contact Relationship
      hint: Specify relationship (mother, father, etc.)
      type: select_one
      options:
      - Mother
      - Father
      - Other
      required: true
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: Please enter a valid phone number
      type: text
      options: []
      required: true
    - id: 8
      name: contact_address
      label: Contact Address
      hint: Address is required for emergency contact
      type: text
      options: []
      required: true
