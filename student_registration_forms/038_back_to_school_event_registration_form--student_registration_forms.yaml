inputSchema:
  type: object
  properties:
    title: Back To School Event Registration Form
    pages:
      - id: 1
        name: parent_name
        label: Parent name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 2
        name: student_name
        label: Student name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 3
        name: grade
        label: Grade level
        hint: Student grade
        type: text
        options: []
        required: true
      - id: 4
        name: email
        label: Contact email
        hint: For event updates
        type: email
        options: []
        required: false
      - id: 5
        name: attending_sessions
        label: Sessions attending
        hint: Select sessions student will attend
        type: select_multiple
        options: [Orientation, Curriculum fair, Meet the teacher, Clubs fair]
        required: false
      - id: 6
        name: accommodations_needed
        label: Any accommodations needed
        hint: Accessibility or other supports
        type: text
        options: []
        required: false
      - id: 7
        name: emergency_contact
        label: Emergency contact name and phone
        hint: For student safety
        type: text
        options: []
        required: true
      - id: 8
        name: pickup_arrangements
        label: Pickup arrangements
        hint: Who will pick up the student
        type: text
        options: []
        required: false
      - id: 9
        name: media_consent
        label: Consent for photos and media
        hint: For school publications
        type: select_one
        options: [Yes, No]
        required: false
      - id: 10
        name: registration_date
        label: Registration date
        hint: Date of registration
        type: date
        options: []
        required: true
