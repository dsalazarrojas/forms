      required: false
    - id: 6
      name: musician_experience
      label: Musician Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: musician_experience_length
      label: Length
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: music_instrument
      label: Music Instrument
      hint: null
      type: select_one
      options:
      - Instrument 1
      - Instrument 2
      - Instrument 3
      required: false
    - id: 9
