inputSchema:
  type: object
  properties:
    title: Horse Riding Instructor Recommendation Form
    pages:
    - id: 1
      name: prophets
      label: What is the horse riding instructor's primary focus
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: instructor_id
      label: Recommended Riding Instructor
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - Bob Smith
      required: true
    - id: 3
      name: feedback_notes
      label: Feedback
      hint: Please provide prophets feedback about their riding instruction
      type: note
      options: []
      required: true
    - id: 4
      name: instructor_rating
      label: Instructor Rating (1-5)
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: instructor_evaluation
      label: Instructor Evaluation
      hint: Please provide a brief evaluation of the riding instructors effectiveness
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_riding
      label: Date of Riding
      hint: Please provide the date of the riding lesson or session
      type: date
      options: []
      required: true
    - id: 7
      name: time_of_riding
      label: Time of Riding
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: riding_duration
      label: Riding Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: number_of_students
      label: Number of Students
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: instructor_education
      label: Riding Instructor Education
      hint: null
      type: select_one
      options:
      - B.S. or Associate
      - B.S. or Doctorate
      - Other
      - Unknown
      required: true
    - id: 11
      name: instructor_certification
      label: Riding Instructor Certification
      hint: null
      type: select_multiple
      options:
      - Equine
      - Equine or Other
      - Other
      - Unknown
      required: true
    - id: 12
      name: instructor_equipment
      label: Instructor Equipment
      hint: null
      type: select_one
      options:
