inputSchema:
  type: object
  properties:
    title: student_recommendation_form
    pages:
    - id: 1
      name: student_id
      label: Student Id
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: student_grade
      label: Student Grade
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      required: true
    - id: 5
      name: student_class
      label: Student Class
      hint: null
      type: select_multiple
      options:
      - A
      - B
      - C
      - D
      required: true
    - id: 6
      name: teacher_comment
      label: Teacher Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - other
      required: false
    - id: 10
      name: teacher_signature
      label: Teacher Signature
      hint: null
      type: note
      options: []
      required: true
