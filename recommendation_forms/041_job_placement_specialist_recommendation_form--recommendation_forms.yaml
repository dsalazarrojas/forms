inputSchema:
  type: object
  properties:
    title: job_placement_specialist_recommendation_form
    pages:
    - id: 1
      name: job_title
      label: job_title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: candidate_first_name
      label: candidate_first_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: candidate_last_name
      label: candidate_last_name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: job_start_date
      label: job_start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: job_end_date
      label: job_end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: job_description
      label: job_description
      hint: A description of the job that the candidate is applying for.
      type: text
      options: []
      required: false
    - id: 7
      name: job_status
      label: job_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: false
    - id: 8
      name: job_type
      label: job_type
      hint: null
      type: select_multiple
      options:
      - Entry Level
      - Mid-Level
      - Senior
      - Intern
      required: false
    - id: 9
      name: recommendation_type
      label: recommendation_type
      hint: null
      type: select_multiple
      options:
      - Academic
      - Professional
      - Reference
      - Other
      required: false
    - id: 10
      name: contact_name
      label: contact_name
      hint: The name of the contact person providing the recommendation.
      type: text
      options: []
      required: false
    - id: 11
      name: contact_email
      label: contact_email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: contact_phone
      label: contact_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: recommendation
      label: recommendation
      hint: A brief description of the relationship between you and the candidate
        and a description of how you can speak to the candidate's abilities and characteristics.
      type: text
      options: []
      required: false
