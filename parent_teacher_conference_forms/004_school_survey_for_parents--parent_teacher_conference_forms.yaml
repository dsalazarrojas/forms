inputSchema:
  type: object
  properties:
    title: School Survey For Parents
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: parent_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: parent_education_level
      label: Parent Education Level
      hint: null
      type: select_one
      options:
      - High School
      - Some College
      - College
      - Some Postgraduate
      required: false
    - id: 5
      name: student_grade
      label: Student Grade
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: student_attendance
      label: Student Attendance
      hint: null
      type: select_multiple
      options:
      - Regular
      - Irregular
      - Unavailable
      required: false
    - id: 7
      name: parent_participation
      label: Parent Participation
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 8
      name: parent_occupation
      label: Parent Occupation
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: student_interests
      label: Student Interests
      hint: null
      type: select_multiple
      options:
      - Music
      - Art
      - Sports
      - Reading
      required: false
    - id: 10
      name: student_hobbies
      label: Student Hobbies
      hint: null
      type: select_multiple
      options:
      - Reading
      - Playing Sports
      - Playing Music
      - Hiking
      required: false
    - id: 11
      name: student_homeschooled
      label: Student Homeschooled
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 12
      name: student_languages
      label: Student Languages
      hint: null
      type: select_multiple
      options:
      - English
      - Mandarin
      - Spanish
      - French
      required: false
    - id: 13
      name: student_languages_other
      label: Other
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: student_interests_other
      label: Other Interests
      hint: null
      type: text
      options: []
      required: false
