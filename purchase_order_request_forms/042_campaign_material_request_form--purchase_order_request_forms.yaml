inputSchema:
  type: object
  properties:
    title: Campaign Material Request Form
    pages:
    - id: 1
      name: requester_name
      label: Requester Name
      hint: Name of the person requesting materials
      type: text
      options: []
      required: true
    - id: 2
      name: campaign_name
      label: Campaign Name
      hint: Which campaign the materials are for
      type: text
      options: []
      required: true
    - id: 3
      name: item_description
      label: Item Description
      hint: Description of the materials requested
      type: text
      options: []
      required: true
    - id: 4
      name: quantity
      label: Quantity
      hint: Number of units required
      type: number
      options: []
      required: true
    - id: 5
      name: delivery_deadline
      label: Delivery Deadline
      hint: Date materials are needed by
      type: date
      options: []
      required: false
    - id: 6
      name: budget_code
      label: Budget Code
      hint: Internal budget or account code
      type: text
      options: []
      required: false
    - id: 7
      name: approval_needed
      label: Approval Needed
      hint: Does this request require manager approval
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: vendor_preference
      label: Vendor Preference
      hint: Preferred supplier if any
      type: text
      options: []
      required: false
    - id: 9
      name: shipping_address
      label: Shipping Address
      hint: Where materials should be delivered
      type: text
      options: []
      required: true
    - id: 10
      name: special_instructions
      label: Special Instructions
      hint: Any additional notes for ordering or delivery
      type: text
      options: []
      required: false
