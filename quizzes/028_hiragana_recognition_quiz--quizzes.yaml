inputSchema:
  type: object
  properties:
    title: Hiragana Recognition Quiz
    pages:
    - id: 1
      name: question_1
      label: How many Hiragana letters do you recognize?
      hint: null
      type: select_multiple
      options:
      - 1. 1-5 letters
      - 2. 6-10 letters
      - 3. More than 10 letters
      required: false
    - id: 2
      name: question_2
      label: Which Hiragana letter represents the sound /a/?
      hint: null
      type: select_one
      options:
      - A
      - Ka
      - Other (Please specify)
      required: false
    - id: 3
      name: question_3
      label: How often do you practice writing Hiragana characters?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Rarely
      required: false
    - id: 4
      name: question_4
      label: What is your favorite Hiragana character?
      hint: Please specify your favorite Hiragana character.
      type: text
      options: []
      required: false
    - id: 5
      name: question_5
      label: What is your level of proficiency in reading Hiragana?
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 6
      name: question_6
      label: What is your favorite resource for learning Hiragana?
      hint: null
      type: select_multiple
      options:
      - Online courses
      - Practice apps
      - Books
      required: false
    - id: 7
      name: question_7
      label: Have you used Hiragana in a professional setting?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: question_8
      label: When did you start learning Hiragana?
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: question_9
      label: How would you rate your knowledge of Hiragana?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      required: false
    - id: 10
      name: question_10
      label: What motivates you to learn Hiragana?
      hint: Please specify your motivation for learning Hiragana.
      type: text
      options: []
      required: false
    - id: 11
      name: question_11
      label: How long does it take to learn Hiragana?
      hint: null
      type: select_one
      options:
      - Less than a month
      - Several months
      - More than a year
      required: false
    - id: 12
      name: question_12
      label: Do you prefer learning Hiragana from a book or online resources?
      hint: null
      type: select_one
      options:
      - Book
      - Online resources
      - Both
      required: false
