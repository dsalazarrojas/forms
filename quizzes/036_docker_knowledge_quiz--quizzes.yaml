inputSchema:
  type: object
  properties:
    title: Docker Knowledge Quiz
    pages:
    - id: 1
      name: quiz_question_1
      label: What is Docker?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: description
      label: Description
      hint: Please provide a brief description of the question
      type: text
      options: []
      required: true
    - id: 3
      name: category
      label: Category
      hint: Select the category of the question
      type: select_one
      options:
      - Docker
      - Kubernetes
      - Containerization
      required: false
    - id: 4
      name: assigned_tool
      label: Assigned Tool
      hint: Select the tool used to create this quiz
      type: select_one
      options:
      - chatjimmy
      - other
      - Not Applicable
      required: false
    - id: 5
      name: output_file
      label: Output File
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: form_ids
      label: Form IDs
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: description_field_7
      label: Description Field 7
      hint: Please provide a brief description for the following question
      type: text
      options: []
      required: false
    - id: 8
      name: quiz_question_2
      label: What is Kubernetes?
      hint: null
      type: text
      options: []
      required: false
