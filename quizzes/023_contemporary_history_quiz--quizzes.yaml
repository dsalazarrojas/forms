inputSchema:
  type: object
  properties:
    title: Contemporary History Quiz
    pages:
      - id: 1
        name: section_student_info
        label: -- Student Details --
        hint: Please provide your information below.
        type: note
        options: []
        required: false
      - id: 2
        name: student_name
        label: Student Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: student_id
        label: Student Identification Number
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: quiz_date
        label: Quiz Date
        hint: null
        type: date
        options: []
        required: true
      - id: 5
        name: section_history_questions
