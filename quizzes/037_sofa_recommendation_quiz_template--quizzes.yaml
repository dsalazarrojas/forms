inputSchema:
  type: object
  properties:
    title: Sofa Recommendation Quiz Template
    pages:
    - id: 1
      name: size
      label: What is the customer's preferred size for the sofa?
      hint: Please select a size
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - Extra Large
      required: true
    - id: 2
      name: material
      label: What material does the customer prefer for the sofa?
      hint: Please select a material
      type: select_one
      options:
      - Leather
      - Fabric
      - Faux Leather
      - Velvet
      required: true
    - id: 3
      name: color
      label: What color does the customer prefer for the sofa?
      hint: Please select a color
      type: select_one
      options:
      - Red
      - Blue
      - Green
      - Yellow
      required: true
    - id: 4
      name: style
      label: What style does the customer prefer for the sofa?
      hint: Please select a style
      type: select_one
      options:
      - Modern
      - Classic
      - Rustic
      - Contemporary
      required: true
    - id: 5
      name: pattern
      label: What pattern does the customer prefer for the sofa?
      hint: Please select a pattern
      type: select_one
      options:
      - Small Pattern
      - Large Pattern
      - No Pattern
      - Random Pattern
      required: true
    - id: 6
      name: comfort
      label: What comfort level is the customer expecting?
      hint: Please select a comfort level
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 7
      name: fabric_type_1
      label: What type of fabric does the customer prefer?
      hint: Please select a fabric type
      type: select_multiple
      options:
      - Cotton
      - Polyester
      - Linen
      - Silk
      required: true
    - id: 8
      name: fabric_type_2
      label: What other type of fabric does the customer prefer?
      hint: Please select another fabric type
      type: select_multiple
      options:
      - Microfiber
      - Faux Fur
      - Velvet
      - Leather
      required: true
    - id: 9
      name: fabric_type_3
      label: What is another type of fabric the customer prefers?
      hint: Please select another fabric type
      type: select_multiple
      options:
      - Denim
      - Chenille
      - Rayon
      - Lace
      required: true
    - id: 10
      name: other_fabrics
      label: Are there any other fabrics the customer would like to add?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submit_note
      label: A short note about the recommended sofa
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: additional_info
      label: Additional information for the customer
      hint: null
      type: text
      options: []
      required: false
