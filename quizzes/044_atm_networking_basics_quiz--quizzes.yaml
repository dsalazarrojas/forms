inputSchema:
  type: object
  properties:
    title: ATM Networking Basics Quiz
    pages:
    - id: 1
      name: quiz_header
      label: ATM Networking Basics Quiz
      hint: Please answer all questions to the best of your ability
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: Enter your student identification number
      type: text
      options: []
      required: false
    - id: 4
      name: course_name
      label: Course Name
      hint: Enter the name of the course this quiz is for
      type: text
      options: []
      required: false
    - id: 5
      name: quiz_date
      label: Quiz Date
      hint: The date you are taking this quiz
      type: date
      options: []
      required: true
    - id: 6
      name: question_1
      label: What does ATM stand for in networking terminology
      hint: Select the correct answer
      type: select_one
      options: ['Automatic Teller Machine', 'Asynchronous Transfer Mode', 'Active Transport Mechanism', 'Advanced Transmission Method']
      required: true
    - id: 7
      name: question_2
      label: Which layer of the OSI model does ATM operate at
      hint: Select the correct OSI layer
      type: select_one
      options: [Physical, Data Link, Network, Transport]
      required: true
    - id: 8
      name: question_3
      label: What is the standard cell size in ATM networks
      hint: Select the correct cell size in bytes
      type: select_one
      options: ['48 bytes', '53 bytes', '64 bytes', '128 bytes']
      required: true
    - id: 9
      name: question_4
      label: Which of these is a characteristic of ATM technology
      hint: Select the most accurate characteristic
      type: select_one
      options: ['Variable packet sizes', 'Connection-oriented service', 'Best-effort delivery only', 'Designed exclusively for voice']
      required: true
    - id: 10
      name: question_5
      label: What does VPI stand for in ATM networks
      hint: Select the correct expansion
      type: select_one
      options: ['Virtual Path Identifier', 'Voice Packet Interface', 'Variable Protocol Implementation', 'Virtual Port Indicator']
      required: true
    - id: 11
      name: question_6
      label: What does VCI stand for in ATM networks
      hint: Select the correct expansion
      type: select_one
      options: ['Virtual Circuit Interface', 'Virtual Channel Identifier', 'Voice Communication Interface', 'Variable Connection Indicator']
      required: true
    - id: 12
      name: question_7
      label: Which ATM service category is designed for real-time traffic with constant bit rate
      hint: Select the appropriate service category
      type: select_one
      options: ['CBR (Constant Bit Rate)', 'VBR (Variable Bit Rate)', 'ABR (Available Bit Rate)', 'UBR (Unspecified Bit Rate)']
      required: true
    - id: 13
      name: question_8
      label: What is the primary advantage of ATM technology
      hint: Select the most significant advantage
      type: select_one
      options: ['Low cost', 'Support for multiple traffic types', 'Simple implementation', 'High speed only']
      required: true
    - id: 14
      name: question_9
      label: Which protocol is commonly used to carry ATM cells over SONET/SDH
      hint: Select the correct protocol
      type: select_one
      options: ['ATM Adaptation Layer', 'AAL5', 'ATM Cell Relay', 'SONET Encapsulation Protocol']
      required: true
    - id: 15
      name: question_10
      label: True or False - ATM guarantees quality of service for different traffic types
      hint: Select whether this statement is true or false
      type: select_one
      options: [True, False]
      required: true
    - id: 16
      name: question_11
      label: Which ATM adaptation layer is typically used for connection-oriented data services
      hint: Select the correct AAL
      type: select_one
      options: ['AAL1', 'AAL2', 'AAL3/4', 'AAL5']
      required: true
    - id: 17
      name: question_12
      label: What is the maximum theoretical throughput of a single ATM connection
      hint: Select the closest value
      type: select_one
      options: ['155 Mbps', '622 Mbps', 'Depends on the physical medium', '1 Gbps']
      required: true
    - id: 18
      name: question_13
      label: In ATM networks, what is the purpose of the HEC field
      hint: Select the correct purpose
      type: select_one
      options: ['Header Error Control', 'Host Endpoint Control', 'High Efficiency Coding', 'Hardware Encryption Control']
      required: true
    - id: 19
      name: question_14
      label: Which ATM service category is best suited for data traffic with bursty characteristics
      hint: Select the appropriate service category
      type: select_one
      options: ['CBR', 'rt-VBR', 'nrt-VBR', 'ABR']
      required: true
    - id: 20
      name: question_15
      label: What is the main difference between PVC and SVC in ATM networks
      hint: Select the correct distinction
      type: select_one
      options: ['PVC is permanent, SVC is temporary', 'PVC is faster than SVC', 'SVC uses more bandwidth', 'There is no difference']
      required: true
    - id: 21
      name: additional_comments
      label: Any additional comments or feedback about the quiz
      hint: Share any thoughts about the quiz content or difficulty
      type: text
      options: []
      required: false
    - id: 22
      name: instructor_notes
      label: Instructor Notes
      hint: For instructor use only
      type: text
      options: []
      required: false
