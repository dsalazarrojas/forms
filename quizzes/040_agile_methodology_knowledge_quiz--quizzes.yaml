inputSchema:
  type: object
  properties:
    title: Agile Methodology Knowledge Quiz
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_email
      label: Participant Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 3
      name: quiz_date
      label: Quiz Date
      hint: Enter the date you are taking this quiz
      type: date
      options: []
      required: true
    - id: 4
      name: quiz_duration
      label: Quiz Duration
      hint: You have 45 minutes to complete this quiz
      type: note
      options: []
      required: false
    - id: 5
      name: question_1
      label: "Question 1: What are the four core values of the Agile Manifesto?"
      hint: Select the correct combination of values
      type: select_one
      options: ["Individuals and interactions, Working software, Customer collaboration, Responding to change", "Processes and tools, Comprehensive documentation, Contract negotiation, Following a plan", "Planning and design, Testing, Deployment, Maintenance", "Leadership, Communication, Execution, Review"]
      required: true
    - id: 6
      name: question_2
      label: "Question 2: How long should a typical Scrum sprint last?"
      hint: Select the standard sprint duration
      type: select_one
      options: ["1-2 weeks", "2-4 weeks", "4-6 weeks", "6-8 weeks"]
      required: true
    - id: 7
      name: question_3
      label: "Question 3: Which of the following is NOT one of the three pillars of Scrum?"
      hint: Identify the incorrect pillar
      type: select_one
      options: ["Transparency", "Inspection", "Adaptation", "Documentation"]
      required: true
    - id: 8
      name: question_4
      label: "Question 4: What is the primary responsibility of the Product Owner?"
      hint: Select the main role of the Product Owner
      type: select_one
      options: ["Facilitating meetings", "Managing the team", "Maximizing the value of the product", "Writing code"]
      required: true
    - id: 9
      name: question_5
      label: "Question 5: What happens during the Daily Standup?"
      hint: Select the primary purpose of the Daily Standup
      type: select_one
      options: ["Detailed project status report", "Review of completed tasks", "Planning for the next sprint", "Brief synchronization of work and identification of impediments"]
      required: true
    - id: 10
      name: question_6
      label: "Question 6: What is the purpose of the Sprint Retrospective?"
      hint: Select the main goal of the Sprint Retrospective
      type: select_one
      options: ["Reviewing the product increment", "Planning the next sprint", "Improving team processes", "Updating the product backlog"]
      required: true
    - id: 11
      name: question_7
      label: "Question 7: Which of the following is a key principle of Agile?"
      hint: Select the correct Agile principle
      type: select_one
      options: ["Following the plan rigidly", "Comprehensive upfront planning", "Responding to change over following a plan", "Minimizing customer interaction"]
      required: true
    - id: 12
      name: question_8
      label: "Question 8: What is the Definition of Done?"
      hint: Select the correct definition
      type: select_one
      options: ["When the sprint ends", "When the product owner accepts the work", "A shared understanding of what it means for work to be complete", "When all tasks are marked as finished"]
      required: true
    - id: 13
      name: question_9
      label: "Question 9: Who is responsible for removing impediments for the Scrum team?"
      hint: Select the role responsible for impediment removal
      type: select_one
      options: ["Product Owner", "Scrum Master", "Development Team", "Project Manager"]
      required: true
    - id: 14
      name: question_10
      label: "Question 10: What is the purpose of the Product Backlog?"
      hint: Select the main purpose of the Product Backlog
      type: select_one
      options: ["Track team performance", "List of requirements ordered by priority", "Schedule of sprints", "Budget tracking document"]
      required: true
    - id: 15
      name: question_11
      label: "Question 11: What is the ideal size for a Scrum Development Team?"
      hint: Select the recommended team size
      type: select_one
      options: ["3-5 members", "5-9 members", "8-12 members", "10-15 members"]
      required: true
    - id: 16
      name: question_12
      label: "Question 12: What is a User Story in Agile?"
      hint: Select the correct definition
      type: select_one
      options: ["A narrative of the project history", "A software testing scenario", "A description of functionality from the user perspective", "A team member's experience report"]
      required: true
    - id: 17
      name: question_13
      label: "Question 13: What does INVEST stand for in relation to User Stories?"
      hint: Select the correct acronym meaning
      type: select_one
      options: ["Independent, Negotiable, Valuable, Estimable, Small, Testable", "Integrated, Necessary, Verified, Essential, Scalable, Timely", "Initiative, Network, Vision, Execution, Strategy, Tactics", "Innovation, Navigation, Validation, Exploration, Solution, Technology"]
      required: true
    - id: 18
      name: question_14
      label: "Question 14: What is the purpose of the Sprint Review?"
      hint: Select the main purpose of the Sprint Review
      type: select_one
      options: ["Review team performance", "Demonstrate the increment and get feedback", "Plan the next project phase", "Update project documentation"]
      required: true
    - id: 19
      name: question_15
      label: "Question 15: Which Agile framework focuses on visualizing work and limiting work in progress?"
      hint: Select the correct framework
      type: select_one
      options: ["Scrum", "Kanban", "XP", "SAFe"]
      required: true
    - id: 20
      name: quiz_score
      label: Quiz Score
      hint: Calculated based on your answers
      type: note
      options: []
      required: false
