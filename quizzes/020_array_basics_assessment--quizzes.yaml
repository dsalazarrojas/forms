inputSchema:
  type: object
  properties:
    title: Array Basics Assessment
    pages:
    - id: 1
      name: section_info
      label: -- Student Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: class_section
      label: Class Section
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: assessment_date
      label: Date of Assessment
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: section_questions
      label: -- Array Concepts Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: q1_array_definition
      label: What is an array in programming
      hint: null
      type: select_one
      options:
      - A collection of elements stored in contiguous memory locations
      - A function that stores data
      - A type of loop structure
      - A conditional statement
      required: true
    - id: 8
      name: q2_array_indexing
      label: In most programming languages, array indexing starts at
      hint: null
      type: select_one
      options:
      - '0'
      - '1'
      - '-1'
      - Depends on the language
      required: true
    - id: 9
      name: q3_array_operations
      label: Which operations are commonly performed on arrays
      hint: null
      type: select_multiple
      options:
      - Insertion
      - Deletion
      - Searching
      - Sorting
      - Traversal
      required: true
    - id: 10
      name: q4_time_complexity
      label: What is the time complexity of accessing an element by index
      hint: null
      type: select_one
      options:
      - O(1)
      - O(n)
      - O(log n)
      - O(n^2)
      required: true
    - id: 11
      name: q5_multidimensional
      label: What is a multidimensional array
      hint: null
      type: select_one
      options:
      - An array of arrays
      - An array with multiple data types
      - An array stored in multiple locations
      - An array that changes size dynamically
      required: true
    - id: 12
      name: q6_array_advantages
      label: What are advantages of using arrays
      hint: null
      type: select_multiple
      options:
      - Fast random access
      - Efficient memory usage
      - Easy to sort
      - Dynamic resizing
      required: false
    - id: 13
      name: q7_array_disadvantages
      label: What are disadvantages of arrays
      hint: null
      type: select_multiple
      options:
      - Fixed size
      - Insertion and deletion are slow
      - Requires contiguous memory
      - Cannot store different data types
      required: false
    - id: 14
      name: q8_code_output
      label: What is the output of this code - arr = [1,2,3], print arr[1]
      hint: null
      type: select_one
      options:
      - '2'
      - '1'
      - '3'
      required: true
    - id: 15
      name: section_practice
      label: -- Practical Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: q9_loop_arrays
      label: Write a simple loop to print all elements of an array
      hint: Pseudocode or actual code is acceptable
      type: text
      options: []
      required: false
    - id: 17
      name: q10_search_element
      label: How would you search for a specific element in an array
      hint: Describe the algorithm or method
      type: text
      options: []
      required: false
    - id: 18
      name: section_confidence
      label: -- Confidence and Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: confidence_level
      label: Overall Confidence with Array Basics
      hint: null
      type: select_one
      options:
      - Very confident
      - Confident
      - Somewhat confident
      - Not confident
      - Very not confident
      required: true
    - id: 20
      name: topics_need_help
      label: Topics where you need more help
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional Comments or Questions
      hint: null
      type: text
      options: []
      required: false
