inputSchema:
  type: object
  properties:
    title: Watch Recommendation Quiz
    pages:
    - id: 1
      name: intro_page
      label: Watch Recommendation Quiz
      hint: Welcome to our watch recommendation quiz!
      type: note
      options: []
      required: false
    - id: 2
      name: budget
      label: What is your budget range?
      hint: Select one of the following options
      type: select_one
      options:
      - Under $100
      - $500-$1000
      - Over $1000
      required: true
    - id: 3
      name: style
      label: What is your preferred watch style?
      hint: null
      type: select_one
      options:
      - Classic
      - Minimalist
      - Sporty
      required: true
    - id: 4
      name: occasion
      label: For which occasion do you want to wear the watch?
      hint: null
      type: select_one
      options:
      - Formal
      - Casual
      - Special
      required: true
    - id: 5
      name: watch_type
      label: What type of watch do you prefer?
      hint: null
      type: select_one
      options:
      - Luxury
      - Fashion
      - Casual
      required: true
    - id: 6
      name: brand
      label: Which watch brand do you like?
      hint: null
      type: select_multiple
      options:
      - Rolex
      - Omega
      - Patek
      required: true
    - id: 7
      name: time_period
      label: How long do you want to wear the watch?
      hint: null
      type: select_one
      options:
      - Short-term
      - Long-term
      - Daily
      required: true
    - id: 8
      name: style_range
      label: Which style range do you prefer?
      hint: null
      type: select_multiple
      options:
      - Classic
      - Minimalist
      - Sporty
      required: true
    - id: 9
      name: additional_features
      label: Do you have any additional features in mind?
      hint: null
      type: select_multiple
      options:
      - Waterproof
      - GPS
      - Other
      required: false
    - id: 10
      name: strap_or_band
      label: What is your preferred strap or band material?
      hint: null
      type: select_multiple
      options:
      - Leather
      - Metal
      - Other
      required: false
    - id: 11
      name: movement_mechanism
      label: What is your preferred watch movement or mechanism?
      hint: null
      type: select_multiple
      options:
      - Quartz
      - Mechanical
      - Automatic
      required: false
