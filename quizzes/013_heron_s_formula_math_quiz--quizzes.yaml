      type: number
      options: []
      required: false
    - id: 5
      name: side_c_length
      label: Side C Length
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: height
      label: Height
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: answer
      label: Answer
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: first_note
      label: First Note
      hint: null
