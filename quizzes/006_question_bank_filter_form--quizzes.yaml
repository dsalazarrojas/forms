inputSchema:
  type: object
  properties:
    title: Question Bank Filter Form
    pages:
    - id: 1
      name: subject
      label: Subject
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 3
      name: instructional_needs
      label: Instructional Needs
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: subject_areas
      label: Subject Areas
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: tags
      label: Tags
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: question_bank_id
      label: Question Bank
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: quiz_id
      label: Quiz
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: sort_by
      label: Sort By
      hint: null
      type: select_one
      options:
      - subject
      - grade level
      - instructional needs
      required: false
