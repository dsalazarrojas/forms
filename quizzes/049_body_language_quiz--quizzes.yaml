inputSchema:
  type: object
  properties:
    title: Body Language Quiz
    pages:
      - id: 1
        name: participant_name
        label: Participant Name
        hint: Your name
        type: text
        options: []
        required: true
      - id: 2
        name: participant_email
        label: Participant Email
        hint: Contact email
        type: email
        options: []
        required: false
      - id: 3
        name: quiz_date
        label: Quiz Date
        hint: Date of quiz
        type: date
        options: []
        required: true
      - id: 4
        name: experience_level
        label: Experience Level
        hint: Your familiarity with body language
        type: select_one
        options:
          - Beginner
          - Intermediate
          - Advanced
          - Expert
        required: false
      - id: 5
        name: question_1
        label: Question 1 - Crossed Arms
        hint: What do crossed arms typically indicate?
        type: select_one
        options:
          - Openness and receptivity
          - Defensiveness or discomfort
          - Excitement
          - Boredom
        required: true
      - id: 6
        name: question_2
        label: Question 2 - Eye Contact
        hint: What does sustained eye contact usually suggest?
        type: select_one
        options:
          - Disinterest
          - Interest and engagement
          - Confusion
          - Agreement only
        required: true
      - id: 7
        name: question_3
        label: Question 3 - Leaning Forward
        hint: What does leaning forward during conversation indicate?
        type: select_one
        options:
          - Discomfort
          - Interest and engagement
          - Aggression
          - Boredom
        required: true
      - id: 8
        name: question_4
        label: Question 4 - Fidgeting
        hint: What does fidgeting typically suggest?
        type: select_one
        options:
          - Confidence
          - Nervousness or anxiety
          - Agreement
          - Understanding
        required: true
      - id: 9
        name: question_5
        label: Question 5 - Mirroring
        hint: What is mirroring in body language?
        type: select_one
        options:
          - Copying someone's words
          - Matching another's posture or gestures
          - Repeating questions
          - Speaking in unison
        required: true
      - id: 10
        name: question_6
        label: Question 6 - Handshake
        hint: What does a firm handshake typically convey?
        type: select_one
        options:
          - Aggression
          - Confidence and professionalism
          - Weakness
          - Indifference
        required: true
      - id: 11
        name: question_7
        label: Question 7 - Touching Face
        hint: What might touching the face indicate?
        type: select_one
        options:
          - Confidence
          - Deception or uncertainty
          - Agreement
          - Happiness
        required: true
      - id: 12
        name: question_8
        label: Question 8 - Personal Space
        hint: What is the typical comfortable personal space distance?
        type: select_one
        options:
          - 6 inches
          - 1-4 feet
          - 10 feet
          - 20 feet
        required: true
      - id: 13
        name: question_9
        label: Question 9 - Nodding
        hint: What does nodding typically indicate?
        type: select_one
        options:
          - Confusion
          - Agreement or understanding
          - Disagreement
          - Impatience
        required: true
      - id: 14
        name: question_10
        label: Question 10 - Feet Direction
        hint: What do feet pointing toward the exit suggest?
        type: select_one
        options:
          - Interest in staying
          - Desire to leave
          - Comfort
          - Agreement
        required: true
      - id: 15
        name: question_11
        label: Question 11 - Open Palms
        hint: What do open palms typically communicate?
        type: select_one
        options:
          - Aggression
          - Honesty and openness
          - Deception
          - Nervousness
        required: true
      - id: 16
        name: question_12
        label: Question 12 - Raised Eyebrows
        hint: What do quickly raised eyebrows indicate?
        type: select_one
        options:
          - Anger
          - Surprise or recognition
          - Boredom
          - Disagreement
        required: true
      - id: 17
        name: question_13
        label: Question 13 - Clenched Fists
        label: Question 13 - Clenched Fists
        hint: What do clenched fists typically suggest?
        type: select_one
        options:
          - Relaxation
          - Anger or tension
          - Happiness
          - Agreement
        required: true
      - id: 18
        name: question_14
        label: Question 14 - Head Tilt
        hint: What does a slight head tilt indicate?
        type: select_one
        options:
          - Aggression
          - Interest and attentiveness
          - Boredom
          - Disagreement
        required: true
      - id: 19
        name: question_15
        label: Question 15 - Proximity
        hint: What does standing close to someone suggest?
        type: select_one
        options:
          - Discomfort
          - Familiarity or attraction
          - Professionalism
          - Indifference
        required: true
      - id: 20
        name: question_16
        label: Question 16 - Dilated Pupils
        hint: What can dilated pupils indicate?
        type: select_one
        options:
          - Boredom
          - Interest or attraction
          - Anger
          - Confusion
        required: true
      - id: 21
        name: question_17
        label: Question 17 - Posture
        hint: What does slouched posture typically communicate?
        type: select_one
        options:
          - Confidence
          - Low energy or low confidence
          - Aggression
          - Alertness
        required: true
      - id: 22
        name: question_18
        label: Question 18 - Genuine Smile
        hint: What distinguishes a genuine smile?
        type: select_one
        options:
          - Only mouth movement
          - Eyes crinkle at corners
          - Teeth showing
          - Duration of smile
        required: true
      - id: 23
        name: question_19
        label: Question 19 - Pointing Feet
        hint: Where do people typically point their feet during conversation?
        type: select_one
        options:
          - Away from the person
          - Toward the person of interest
          - Randomly
          - Toward the exit
        required: true
      - id: 24
        name: question_20
        label: Question 20 - Context Importance
        hint: Why is context important in reading body language?
        type: select_one
        options:
          - It is not important
          - Gestures can have different meanings in different situations
          - Only facial expressions matter
          - Body language is universal
        required: true
      - id: 25
        name: additional_comments
        label: Additional Comments
        hint: Any thoughts on the quiz
        type: text
        options: []
        required: false
