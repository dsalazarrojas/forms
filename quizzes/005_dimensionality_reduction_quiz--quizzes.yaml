      label: What is Dimensionality Reduction?
      hint: This quiz will cover various aspects of dimensionality reduction.
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: Question 1
      hint: A way to simplify complex data by reducing its dimensionality.
      type: select_one
      options:
      - Dimensionality reduction is a process of reducing the number of variables
        or features in a dataset.
      - Dimensionality reduction is a machine learning technique used for data preprocessing.
      required: false
