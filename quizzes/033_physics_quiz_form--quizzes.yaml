inputSchema:
  type: object
  properties:
    title: Physics Quiz Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: A brief introduction to the physics concepts being assessed.
      type: text
      options: []
      required: true
    - id: 2
      name: question_1
      label: What is the speed of light?
      hint: Provide your answer in meters per second.
      type: number
      options: []
      required: true
    - id: 3
      name: answer_1
      label: Answer
      hint: Provide your response to the question above.
      type: text
      options: []
      required: true
    - id: 4
      name: score
      label: Scoring
      hint: Rate your understanding of the concept from 0 to 10.
      type: number
      options: []
      required: true
    - id: 5
      name: date
      label: Date
      hint: When did you last study physics?
      type: date
      options: []
      required: false
    - id: 6
      name: select_one
      label: Select One - Yes/No
      hint: Do you believe Einstein's theory of relativity is correct?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: select_multiple
      label: Select Multiple - Yes/No/Both
      hint: Which of the following statements are true about quantum mechanics?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Both
      required: false
    - id: 8
      name: phone_number
      label: Phone Number
      hint: What is your contact phone number?
      type: text
      options: []
      required: false
    - id: 9
      name: select_one_1
      label: Another Select One - Yes/No
      hint: Do you think black holes exist?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: select_multiple_1
      label: Another Select Multiple - Yes/No/Both
      hint: Which of the following are types of waves?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Both
      required: false
    - id: 11
      name: email
      label: Email
      hint: Provide your email address.
      type: email
      options: []
      required: false
    - id: 12
      name: phone_1
      label: Phone
      hint: Another phone number.
      type: text
      options: []
      required: false
