      hint: Your quiz results
      type: note
      options: []
      required: false
    - id: 32
      name: total_questions
      label: Total Questions Answered
      hint: Number of questions
      type: number
      options: []
      required: false
    - id: 33
      name: correct_answers
      label: Correct Answers
      hint: Number correct
      type: number
      options: []
      required: false
    - id: 34
      name: percentage_score
      label: Percentage Score
      hint: Your score percentage
      type: number
      options: []
      required: false
    - id: 35
      name: pass_fail
      label: Pass or Fail
      hint: Result based on 70 percent passing
      type: select_one
      options:
      - Pass
      - Fail
      required: false
    - id: 36
      name: additional_comments
      label: Additional Comments
      hint: Any notes about the quiz
      type: text
      options: []
      required: false
    - id: 37
      name: academic_honesty
      label: Academic Honesty
      hint: I completed this quiz honestly
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 38
      name: submitter_signature
      label: Participant Signature
      hint: Digital signature
      type: text
      options: []
      required: true
