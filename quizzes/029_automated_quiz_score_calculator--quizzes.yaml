      name: q11
      label: Question 11 - What is 15 multiplied by 8
      hint: Select the correct answer
      type: select_one
      options:
      - '120'
      - '100'
      - '140'
      - '110'
      required: true
    - id: 23
      name: q12
      label: Question 12 - What is the square root of 144
      hint: Select the correct answer
      type: select_one
      options:
      - '12'
      - '10'
      - '14'
      - '16'
      required: true
    - id: 24
      name: q13
      label: Question 13 - What is 25 percent of 200
      hint: Select the correct answer
      type: select_one
      options:
      - '50'
      - '25'
      - '75'
      - '100'
      required: true
    - id: 25
      name: q14
      label: Question 14 - What is the value of pi to 2 decimal places
      hint: Select the correct answer
      type: select_one
      options:
      - '3.14'
      - '3.12'
      - '3.16'
      - '3.18'
      required: true
    - id: 26
      name: q15
      label: Question 15 - What is 144 divided by 12
      hint: Select the correct answer
      type: select_one
      options:
      - '12'
      - '10'
      - '14'
      - '11'
      required: true
