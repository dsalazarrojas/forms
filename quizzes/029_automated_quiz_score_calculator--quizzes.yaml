      name: quiz_section_4
      label: Section 4 - Bonus Questions
      hint: Optional extra credit
      type: note
      options: []
      required: false
    - id: 28
      name: q16
      label: Question 16 - In what year did World War II end
      hint: Select the correct answer
      type: select_one
      options:
      - '1945'
      - '1944'
      - '1946'
      - '1943'
      required: false
    - id: 29
      name: q17
      label: Question 17 - What is the smallest prime number
      hint: Select the correct answer
      type: select_one
      options:
      - '2'
      - '1'
      - '3'
      - '5'
      required: false
    - id: 30
      name: q18
      label: Question 18 - Who painted the Mona Lisa
      hint: Select the correct answer
      type: select_one
      options:
      - Leonardo da Vinci
      - Michelangelo
      - Raphael
      - Donatello
      required: false
    - id: 31
      name: scoring_info
