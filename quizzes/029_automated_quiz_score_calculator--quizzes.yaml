inputSchema:
  type: object
  properties:
    title: Automated Quiz Score Calculator
    pages:
    - id: 1
      name: introduction
      label: Automated Quiz Score Calculator
      hint: Complete this quiz and get your score calculated automatically
      type: note
      options: []
      required: false
    - id: 2
      name: participant_info
      label: Participant Information
      hint: Provide your details
      type: note
      options: []
      required: false
    - id: 3
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 4
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 6
      name: participant_id
      label: Participant ID
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: quiz_name
      label: Quiz Name
      hint: Title of this quiz
      type: text
      options: []
      required: true
    - id: 8
      name: quiz_date
      label: Quiz Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 9
      name: quiz_section_1
      label: Section 1 - General Knowledge
      hint: Answer the following questions
      type: note
      options: []
      required: false
    - id: 10
      name: q1
      label: Question 1 - What is the capital of France
      hint: Select the correct answer
      type: select_one
      options:
      - Paris
      - London
      - Berlin
      - Madrid
      required: true
    - id: 11
      name: q2
      label: Question 2 - Which planet is known as the Red Planet
      hint: Select the correct answer
      type: select_one
      options:
      - Mars
      - Venus
      - Jupiter
      - Saturn
      required: true
    - id: 12
      name: q3
      label: Question 3 - What is the largest ocean on Earth
      hint: Select the correct answer
      type: select_one
      options:
      - Pacific Ocean
      - Atlantic Ocean
      - Indian Ocean
      - Arctic Ocean
      required: true
    - id: 13
      name: q4
      label: Question 4 - Who wrote Romeo and Juliet
      hint: Select the correct answer
      type: select_one
      options:
      - William Shakespeare
      - Charles Dickens
      - Jane Austen
      - Mark Twain
      required: true
    - id: 14
      name: q5
      label: Question 5 - What is the chemical symbol for gold
      hint: Select the correct answer
      type: select_one
      options:
      - Au
      - Ag
      - Fe
      - Cu
      required: true
    - id: 15
      name: quiz_section_2
      label: Section 2 - Science and Technology
      hint: Continue with science questions
      type: note
      options: []
      required: false
    - id: 16
      name: q6
      label: Question 6 - What is the speed of light approximately
      hint: Select the correct answer
      type: select_one
      options:
      - 300000 km per second
      - 150000 km per second
      - 500000 km per second
      - 100000 km per second
      required: true
    - id: 17
      name: q7
      label: Question 7 - What does CPU stand for
      hint: Select the correct answer
      type: select_one
      options:
      - Central Processing Unit
      - Computer Personal Unit
      - Central Program Utility
      - Computer Processing Utility
      required: true
    - id: 18
      name: q8
      label: Question 8 - What is H2O commonly known as
      hint: Select the correct answer
      type: select_one
      options:
      - Water
      - Salt
      - Sugar
      - Air
      required: true
    - id: 19
      name: q9
      label: Question 9 - Which gas do plants absorb from the atmosphere
      hint: Select the correct answer
      type: select_one
      options:
      - Carbon Dioxide
      - Oxygen
      - Nitrogen
      - Hydrogen
      required: true
    - id: 20
      name: q10
      label: Question 10 - What is the hardest natural substance
      hint: Select the correct answer
      type: select_one
      options:
      - Diamond
      - Gold
      - Iron
      - Quartz
      required: true
