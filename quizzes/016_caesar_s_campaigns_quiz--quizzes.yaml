inputSchema:
  type: object
  properties:
    title: Caesar's Campaigns Quiz
    pages:
      - id: 1
        name: student_name
        label: Student Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: class_period
        label: Class Period
        hint: Your class period or section
        type: select_one
        options:
          - Period 1
          - Period 2
          - Period 3
          - Period 4
          - Period 5
          - Period 6
        required: true
      - id: 3
        name: date_taken
        label: Date Taken
        hint: Today's date
        type: date
        options: []
        required: true
      - id: 4
        name: question_1
        label: Question 1 - In what year did Julius Caesar begin his Gallic Wars
        hint: Select the correct year
        type: select_one
        options:
          - 60 BC
          - 58 BC
          - 55 BC
          - 50 BC
          - 49 BC
        required: true
      - id: 5
        name: question_2
        label: Question 2 - What famous phrase did Caesar say when crossing the Rubicon
        hint: The famous Latin phrase
        type: select_one
        options:
          - Veni Vidi Vici
          - Alea Iacta Est
          - Carthago Delenda Est
          - Et Tu Brute
          - Sic Semper Tyrannis
        required: true
      - id: 6
        name: question_3
        label: Question 3 - Who was Caesar's main rival in the Roman Civil War
        hint: The opposing general
        type: select_one
        options:
          - Mark Antony
          - Cicero
          - Pompey the Great
          - Brutus
          - Cassius
        required: true
      - id: 7
        name: question_4
        label: Question 4 - What position did Caesar hold when he was assassinated
        hint: His political title
        type: select_one
        options:
          - Consul
          - Senator
          - Dictator Perpetuo
          - Tribune
          - Augur
        required: true
      - id: 8
        name: question_5
        label: Question 5 - In what year was Julius Caesar assassinated
        hint: The year of his death
        type: select_one
        options:
          - 46 BC
          - 45 BC
          - 44 BC
          - 43 BC
          - 42 BC
        required: true
      - id: 9
        name: question_6
        label: Question 6 - What was the name of Caesar's adopted heir and successor
        hint: His great-nephew and adopted son
        type: select_one
        options:
          - Mark Antony
          - Lepidus
          - Octavian
          - Tiberius
          - Caligula
        required: true
      - id: 10
        name: question_7
        label: Question 7 - Which battle marked Caesar's decisive victory over Pompey
        hint: The major battle in Greece
        type: select_one
        options:
          - Battle of Pharsalus
          - Battle of Alesia
          - Battle of Gergovia
          - Battle of Dyrrhachium
          - Battle of Munda
        required: true
      - id: 11
        name: question_8
        label: Question 8 - What was the First Triumvirate
        hint: The political alliance
        type: select_one
        options:
          - Three Roman generals
          - Political alliance between Caesar, Pompey, and Crassus
          - Three Roman provinces
          - Three military legions
          - Three consuls
        required: true
      - id: 12
        name: question_9
        label: Question 9 - What calendar reform is Caesar credited with
        hint: The calendar he introduced
        type: select_one
        options:
          - Gregorian Calendar
          - Julian Calendar
          - Roman Lunar Calendar
          - Egyptian Calendar
          - Solar Calendar
        required: true
      - id: 13
        name: question_10
        label: Question 10 - Who led the conspiracy to assassinate Caesar
        hint: The primary conspirator
        type: select_one
        options:
          - Mark Antony
          - Marcus Brutus
          - Gaius Cassius Longinus
          - Decimus Brutus
          - Trebonius
        required: true
      - id: 14
        name: bonus_question
        label: Bonus Question - Name one of Caesar's major written works
        hint: His famous commentary
        type: text
        options: []
        required: false
      - id: 15
        name: confidence_level
        label: Confidence Level
        hint: How confident are you in your answers
        type: select_one
        options:
          - Very confident
          - Somewhat confident
          - Not very confident
          - Just guessing
        required: false
      - id: 16
        name: study_time
        label: Study Time
        hint: How long did you study for this quiz
        type: select_one
        options:
          - Did not study
          - Less than 30 minutes
          - 30 minutes to 1 hour
          - 1-2 hours
          - Over 2 hours
        required: false
