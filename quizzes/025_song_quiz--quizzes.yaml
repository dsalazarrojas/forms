inputSchema:
  type: object
  properties:
    title: Song Quiz
    pages:
    - id: 1
      name: song_quiz_1
      label: Music Trivia
      hint: null
      type: select_one
      options:
      - What is the genre of this song?
      - Rock
      - Pop
      - Jazz
      - Classical
      - Country
      required: true
    - id: 2
      name: song_quiz_2
      label: Year of Release
      hint: Enter the year the song was released
      type: number
      options: []
      required: false
    - id: 3
      name: song_quiz_3
      label: Artist
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: song_quiz_4
      label: song_quiz_4
      hint: null
      type: select_multiple
      options:
      - Rock
      - Pop
      - Jazz
      - Classical
      - Country
      required: false
    - id: 5
      name: song_quiz_5
      label: Release Date
      hint: null
      type: date
      options: []
      required: false
