inputSchema:
  type: object
  properties:
    title: Ancient Egypt Architecture Quiz
    pages:
    - id: 1
      name: instructions
      label: -- Quiz Instructions --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: question_1
      label: What is the primary purpose of pyramids
      hint: Choose one
      type: select_one
      options:
      - Tomb
      - Fortress
      - Temple
      required: true
    - id: 4
      name: question_2
      label: Name a famous ancient Egyptian monument
      hint: Short answer
      type: text
      options: []
      required: false
    - id: 5
      name: confidence
      label: Confidence level
      hint: Rate from 1 to 5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: Optional feedback
      type: text
      options: []
      required: false
