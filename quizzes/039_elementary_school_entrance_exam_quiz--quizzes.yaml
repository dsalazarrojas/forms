inputSchema:
  type: object
  properties:
    title: Elementary School Entrance Exam Quiz
    pages:
    - id: 1
      name: applicant_info
      label: Applicant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: Enter applicant's name
      type: text
      options: []
      required: false
    - id: 3
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: school_name
      label: School Name
      hint: Enter school name
      type: text
      options: []
      required: false
    - id: 7
      name: school_level
      label: School Level
      hint: null
      type: select_one
      options:
      - Primary
      - Secondary
      - High School
      - College
      - University
      required: true
    - id: 8
      name: subject_interest
      label: Subject Interest
      hint: Enter subject of interest
      type: text
      options: []
      required: false
    - id: 9
      name: grade_level
      label: Grade Level
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: quiz_section_1
      label: Section 1
      hint: Section 1 description
      type: time
      options: []
      required: false
    - id: 11
      name: quiz_section_2
      label: Section 2
      hint: Section 2 description
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: note
      label: Note
      hint: Any additional note
      type: note
      options: []
      required: false
