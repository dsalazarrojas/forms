      hint: null
      type: select_multiple
      options:
      - knife skills
      - knife safety
      - knife handling
      required: false
    - id: 8
      name: kitchen_skills
      label: Kitchen Skills
      hint: null
      type: select_multiple
      options:
      - prep
      - cooking
      - food safety
      required: false
    - id: 9
      name: kitchen_equipment
      label: Kitchen Equipment
      hint: null
