inputSchema:
  type: object
  properties:
    title: kitchen_task_assessment_form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: assessment_type
      label: Assessment Type
      hint: null
      type: select_one
      options:
      - Basic
      - Intermediate
      - Advanced
      required: true
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: assessed_by
      label: Assessed By
      hint: null
      type: select_one
      options:
      - Chef
      - Cook
      - Restaurateur
      required: true
    - id: 5
      name: score
      label: Score
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: recommended_training
