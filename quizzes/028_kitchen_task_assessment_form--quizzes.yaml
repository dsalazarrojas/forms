      - efficiency
      required: false
    - id: 11
      name: food_quality
      label: Food Quality
      hint: null
      type: select_multiple
      options:
      - presentation
      - taste
      - consistency
      required: false
    - id: 12
      name: team_work
      label: Team Work
      hint: null
      type: select_multiple
      options:
      - communication
      - cooperation
      - leadership
      required: false
    - id: 13
      name: time_management
      label: Time Management
      hint: null
      type: select_multiple
      options:
      - scheduling
      - prioritization
      - pacing
      required: false
