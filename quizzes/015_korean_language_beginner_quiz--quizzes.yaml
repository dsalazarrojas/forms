inputSchema:
  type: object
  properties:
    title: Korean Language Beginner Quiz
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: teacher_id
      label: Teacher ID
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: level
      label: Level
      hint: Beginner, intermediate or advanced
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 6
      name: score
      label: Score
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: quiz_type
      label: Quiz Type
      hint: null
      type: select_one
      options:
      - Multiple Choice
      - True/False
      - Short Answer
      required: false
    - id: 8
      name: question_type
      label: Question Type
      hint: null
      type: select_one
      options:
      - Grammar
      - Vocabulary
      - Reading
      required: false
    - id: 9
      name: score_range
      label: Score Range
      hint: null
      type: select_multiple
      options:
      - 1-5
      - 6-10
      - 11-15
      - 16-20
      - 21-25
      required: true
    - id: 10
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: submission_note
      label: Submission Note
      hint: null
      type: note
      options: []
      required: false
