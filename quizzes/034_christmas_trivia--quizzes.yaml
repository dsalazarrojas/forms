inputSchema:
  type: object
  properties:
    title: Christmas Trivia
    pages:
    - id: 1
      name: participant_name
      label: Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For results notification
      type: email
      options: []
      required: true
    - id: 3
      name: age_group
      label: Age Group
      hint: Select your age range
      type: select_one
      options:
      - Under 12
      - 12-17 years
      - 18-24 years
      - 25-34 years
      - 35-44 years
      - 45-54 years
      - 55-64 years
      - 65 or older
      required: true
    - id: 4
      name: team_name
      label: Team Name
      hint: If playing as a team
      type: text
      options: []
      required: false
    - id: 5
      name: section_participant_info
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: question_1
      label: Question 1 - In what year was Christmas first declared a federal holiday
        in the USA
      hint: Select your answer
      type: select_one
      options:
      - '1856'
      - '1870'
      - '1891'
      - '1905'
      required: true
    - id: 7
      name: question_2
      label: Question 2 - Which country started the tradition of putting up a Christmas
        tree
      hint: Select your answer
      type: select_one
      options:
      - United States
      - Germany
      - England
      - Sweden
      required: true
    - id: 8
      name: question_3
      label: Question 3 - What is the name of the Grinchs dog
      hint: Select your answer
      type: select_one
      options:
      - Max
      - Rex
      - Buddy
      - Spot
      required: true
    - id: 9
      name: question_4
      label: Question 4 - How many reindeer does Santa have including Rudolph
      hint: Select your answer
      type: select_one
      options:
      - '8'
      - '9'
      - '10'
      - '12'
      required: true
    - id: 10
      name: question_5
      label: Question 5 - What is the best selling Christmas song of all time
      hint: Select your answer
      type: select_one
      options:
      - Jingle Bells
      - Silent Night
      - White Christmas
      - All I Want for Christmas Is You
      required: true
    - id: 11
      name: section_trivia_round_1
      label: -- Trivia Round 1 --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: question_6
      label: Question 6 - In the song Twelve Days of Christmas what are there six
        of
      hint: Select your answer
      type: select_one
      options:
      - Six geese a-laying
      - Six swans a-swimming
      - Six lords a-leaping
      - Six drummers drumming
      required: true
    - id: 13
      name: question_7
      label: Question 7 - What is the traditional Christmas flower
      hint: Select your answer
      type: select_one
      options:
      - Rose
      - Poinsettia
      - Holly
      - Mistletoe
      required: true
    - id: 14
      name: question_8
      label: Question 8 - Which Santa movie features Tim Allen
      hint: Select your answer
      type: select_one
      options:
      - Elf
      - The Santa Clause
      - Santa Paws
      - Christmas with the Kranks
      required: true
    - id: 15
      name: question_9
      label: Question 9 - What do children in Iceland leave in their shoes on Christmas
        Eve
      hint: Select your answer
      type: select_one
      options:
      - Cookies
      - Candy
      - A candle
      - A letter
      required: true
    - id: 16
      name: question_10
      label: Question 10 - What is the name of the snowman in Frozen
      hint: Select your answer
      type: select_one
      options:
      - Sven
      - Kristoff
      - Olaf
      - Hans
      required: true
    - id: 17
      name: section_trivia_round_2
      label: -- Trivia Round 2 --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: question_11
      label: Question 11 - What color is a holly berry
      hint: Select your answer
      type: select_one
      options:
      - Blue
      - White
      - Red
      - Green
      required: true
    - id: 19
      name: question_12
      label: Question 12 - Which country does eggnog come from
      hint: Select your answer
      type: select_one
      options:
      - France
      - Germany
      - England
      - Italy
      required: true
    - id: 20
      name: question_13
      label: Question 13 - What is the main ingredient in traditional Christmas pudding
      hint: Select your answer
      type: select_one
      options:
      - Flour
      - Dried fruits
      - Chocolate
      - Nuts
      required: true
    - id: 21
      name: question_14
      label: Question 14 - Who wrote A Christmas Carol
      hint: Select your answer
      type: select_one
      options:
      - Mark Twain
      - Charles Dickens
      - Jane Austen
      - Leo Tolstoy
      required: true
    - id: 22
      name: question_15
      label: Question 15 - What is the name of the department store in Miracle on
        34th Street
      hint: Select your answer
      type: select_one
      options:
      - Sears
      - Macys
      - Gimbels
      - Nordstrom
      required: true
    - id: 23
      name: section_trivia_round_3
      label: -- Trivia Round 3 --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: bonus_question
      label: Bonus Question - What year did Rudolph the Red-Nosed Reindeer first appear
      hint: Type your answer
      type: text
      options: []
      required: false
    - id: 25
      name: favorite_christmas_movie
      label: Favorite Christmas Movie
      hint: Share your favorite
      type: text
      options: []
      required: false
    - id: 26
      name: trivia_experience
      label: Trivia Experience Level
      hint: How would you rate your knowledge
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 27
      name: enjoyed_trivia
      label: Did You Enjoy This Trivia
      hint: Your feedback
      type: select_one
      options:
      - Yes loved it
      - Yes it was good
      - It was okay
      - No not really
      - No I did not like it
      required: true
