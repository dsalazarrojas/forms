inputSchema:
  type: object
  properties:
    title: Matchmaking Quiz
    pages:
    - id: 1
      name: intro_page
      label: Matchmaking Quiz
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: age
      label: age
      hint: How old are you?
      type: number
      options: []
      required: false
    - id: 3
      name: relationship_status
      label: Relationship Status
      hint: null
      type: select_one
      options:
      - Single
      - In a relationship
      - In a relationship and looking to start a new relationship
      required: false
    - id: 4
      name: match_goal
      label: What are you looking for?
      hint: Select one or more of the below options
      type: select_multiple
      options:
      - Friendship
      - Casual Relationship
      - Long-Term Partnership
      - Serious Relationship
      required: false
    - id: 5
      name: partner_attributes
      label: What are the most important attributes for you?
