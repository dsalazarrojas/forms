      label: Who is the main character of the Pokemon series?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: favorite_animated_series_text
      label: Favorite Animated Series of all time
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: quiz_total_score_calc
      label: Total Score
      hint: Calculated after submission
      type: number
      options: []
      required: false
