      options:
      - Brian
      - Stewie
      - Peter
      - Chris
      required: true
    - id: 4
      name: question_portal_gun_series
      label: Which animated series features a portal gun?
      hint: null
      type: select_one
      options:
      - Rick and Morty
      - Futurama
      - The Simpsons
      - South Park
      required: true
    - id: 5
      name: question_mystery_van
      label: The mystery solving gang travels in which vehicle?
