inputSchema:
  type: object
  properties:
    title: Network Security Quiz
    pages:
    - id: 1
      name: general_knowledge
      label: General Knowledge
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: risk_assessment
      label: Risk Assessment
      hint: Think about the potential risks of a security threat.
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 3
      name: network_security
      label: Network Security
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: threat_mitigation
      label: Threat Mitigation
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: incident_response
      label: Incident Response
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: security_standards
      label: Security Standards
      hint: null
      type: select_multiple
      options:
      - NIST
      - ISO 27001
      - HIPAA
      required: false
    - id: 7
      name: security_best_practices
      label: Security Best Practices
      hint: null
      type: select_multiple
      options:
      - Network segmentation
      - Regular patching
      - Secure configuration
      required: false
    - id: 8
      name: security_consequences
      label: Security Consequences
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: security_measures
      label: Security Measures
      hint: null
      type: select_multiple
      options:
      - Firewalls
      - Intrusion detection
      - Secure password management
      required: false
    - id: 10
      name: quiz_completed
      label: Quiz Completed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: quiz_comments
      label: Quiz Comments
      hint: null
      type: note
      options: []
      required: false
