inputSchema:
  type: object
  properties:
    title: Laboratory Management Trends Quiz
    pages:
    - id: 1
      name: current_laboratory_roles
      label: Current Laboratory Roles
      hint: Describe the current state of laboratory roles in your hospital
      type: select_multiple
      options:
      - Clinical Laboratory
      - Research Laboratory
      - Testing and Validation Laboratory
      - Other (Please Specify)
      required: false
    - id: 2
      name: key_trends
      label: Key Trends in Laboratory Management
      hint: Describe the key trends in your laboratory management
      type: text
      options: []
      required: false
    - id: 3
      name: challenges
      label: Challenges in Laboratory Management
      hint: Describe the current challenges in your laboratory management
      type: text
      options: []
      required: false
    - id: 4
      name: technology_adoption
      label: Hospital Technology Adoption
      hint: Rate your hospital's technology adoption in the laboratory
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: hospital_size
      label: Hospital Size
      hint: Describe your hospital's size
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 6
      name: hospital_type
      label: Hospital Type
      hint: Describe the type of hospital you work in
      type: select_one
      options:
      - Academic
      - Teaching
      - Research
      - Community
      required: false
    - id: 7
      name: hospital_tier
      label: Hospital Tier
      hint: Describe the hospital's tier
      type: select_one
      options:
      - Tier 1
      - Tier 2
      - Tier 3
      required: false
    - id: 8
      name: hospital_department
      label: Hospital Department
      hint: Describe the department you work in
      type: select_multiple
      options:
      - Clinical Laboratory
      - Research Laboratory
      - Testing and Validation Laboratory
      - Other (Please Specify)
      required: false
    - id: 9
      name: technology_adoption_description
      label: Technology Adoption Description
      hint: Describe your hospital's technology adoption in the laboratory
      type: text
      options: []
      required: false
    - id: 10
      name: challenges_description
      label: Challenges Description
      hint: Describe the current challenges in your laboratory management
      type: text
      options: []
      required: false
    - id: 11
      name: laboratory_management_trends
      label: Laboratory Management Trends
      hint: Describe the current trends in your laboratory management
      type: text
      options: []
      required: false
    - id: 12
      name: hospital_name
      label: Hospital Name
      hint: Please specify your hospital's name
      type: text
      options: []
      required: false
    - id: 13
      name: roles_description
      label: Roles Description
      hint: Describe the current state of laboratory roles
      type: text
      options: []
      required: false
    - id: 14
      name: key_trends_description
      label: Key Trends Description
      hint: Describe the current key trends in laboratory management
      type: text
      options: []
      required: false
    - id: 15
      name: hospital_size_description
      label: Hospital Size Description
      hint: Describe the size of your hospital
      type: text
      options: []
      required: false
    - id: 16
      name: hospital_type_description
      label: Hospital Type Description
      hint: Describe the type of hospital you work in
      type: text
      options: []
      required: false
    - id: 17
      name: hospital_tier_description
      label: Hospital Tier Description
      hint: Describe the hospital's tier
      type: text
      options: []
      required: false
