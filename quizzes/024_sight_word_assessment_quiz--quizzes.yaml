inputSchema:
  type: object
  properties:
    title: Sight Word Assessment Quiz
    pages:
    - id: 1
      name: student_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: grade_level
      label: What is your grade level?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: experience_with_sight_words
      label: Have you ever seen this kind of words?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: correct_sight_words_read
      label: Which sight words have you read correctly?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: time_spent_reading_sight_words
      label: How many minutes have you spent reading these words?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: total_time_spent_reading
      label: Total time spent reading (minutes)?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: total_words_read
      label: Total words read?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: sight_words_missed
      label: Which sight words have you missed?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: time_spent_reading_total
      label: Time Spent Reading Total
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: total_sight_words
      label: Total sight words?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: correct_sight_words_read_2
      label: Which correct sight words have you read?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: time_spent_reading_sight_words_2
      label: Time Spent Reading Sight Words 2
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: sight_words_read
      label: Which sight words have you read?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: student_id
      label: Your ID?
      hint: null
      type: text
      options: []
      required: true
