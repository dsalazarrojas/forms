inputSchema:
  type: object
  properties:
    title: Recruitment Strategies Quiz
    pages:
    - id: 1
      name: job_opening
      label: Job Opening
      hint: null
      type: select_one
      options:
      - Internal
      - External
      required: true
    - id: 2
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: interview_process
      label: Interview Process
      hint: What is the interview process for this job opening?
      type: select_multiple
      options:
      - In-person
      - Video conference
      - Phone call
      - Online application
      required: true
    - id: 4
      name: job_location
      label: Job Location
      hint: null
      type: select_one
      options:
      - Office
      - Remote
      - Hybrid
      required: false
    - id: 5
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      required: true
    - id: 6
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: salary_range
      label: Salary Range
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: work_experience
      label: Work Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: education_background
      label: Education Background
      hint: null
      type: select_one
      options:
      - Bachelor's degree
      - Master's degree
      - PhD
      required: true
    - id: 10
      name: language
      label: Language
      hint: null
      type: select_multiple
      options:
      - English
      - French
      - Spanish
      required: true
    - id: 11
      name: notice_period
      label: Notice Period
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: applicationdeadline
      label: Application Deadline
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: applicationprocess
      label: Application Process
      hint: null
      type: select_one
      options:
      - Email
      - Online form
      - Phone call
      - In-person
      required: true
    - id: 14
      name: contactinformation
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: submissionguidelines
      label: Submission Guidelines
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: submissionrequirements
      label: Submission Requirements
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: contactperson
      label: Contact Person
      hint: Who is the contact person?
      type: select_one
      options:
      - Hiring Manager
      - Recruitment Manager
      - HR Manager
      required: true
    - id: 18
      name: contactemail
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 19
      name: contactphone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: contactaddress
      label: Contact Address
      hint: null
      type: text
      options: []
      required: true
    - id: 21
      name: jobdescription
      label: Job Description
      hint: null
      type: text
      options: []
      required: true
    - id: 22
      name: jobrequirements
      label: Job Requirements
      hint: null
      type: text
      options: []
      required: true
    - id: 23
      name: jobresponsibilities
      label: Job Responsibilities
      hint: null
      type: text
      options: []
      required: true
    - id: 24
      name: jobbenefits
