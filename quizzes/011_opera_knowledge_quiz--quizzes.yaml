inputSchema:
  type: object
  properties:
    title: Opera Knowledge Quiz
    pages:
    - id: 1
      name: form_control_starting_points
      label: Starting Points
      hint: null
      type: select_multiple
      options:
      - Verdi, Rossini, and Puccini
      - Bellini
      - Puccini
      - Mozart
      - Massenet
      - Massenet and Offenbach
      - Offenbach and Strauss
      required: true
    - id: 2
      name: form_control_musical_styles
      label: Musical Styles
      hint: null
      type: select_one
      options:
      - Serious
      - Comic
      - Lyric
      - Tragic
      - Melodrama
      - Serious and Comic
      - Serious and Tragic
      - Melodrama and Comic
      required: true
    - id: 3
      name: form_control_musical_periods
      label: Musical Periods
      hint: null
      type: select_multiple
      options:
      - Baroque
      - Classical
      - Romantic
      - Impressionist
      - Modern
      - Contemporary
      required: false
    - id: 4
      name: form_control_knowledge_questions
      label: Knowledge Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_control_interests
      label: Interests
      hint: null
      type: select_multiple
      options:
      - Verdi
      - Mozart
      - Puccini
      - Puccini and Offenbach
      - Operatic
      - Offenbach and Strauss
      - Offenbach and Massenet
      required: true
    - id: 6
      name: form_control_familiarity
      label: Familiarity
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
