      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: user_select_one
      label: select-one
      hint: null
      type: select_one
      options:
      - option-one
      - option-two
      - option-three
      required: false
    - id: 6
      name: user_date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: user_time
      label: time
      hint: null
