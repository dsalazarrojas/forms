inputSchema:
  type: object
  properties:
    title: Cotton Knowledge Quiz
    pages:
    - id: 1
      name: introduction
      label: Welcome to the Cotton Knowledge Quiz
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: What is cotton?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: question_2
      label: What is the primary use of cotton in the textile industry?
      hint: null
      type: select_one
      options:
      - fiber
      - fabric
      - yarn
      required: false
    - id: 4
      name: question_3
      label: How many types of cotton fiber are there?
      hint: null
      type: select_multiple
      options:
      - long-staple
      - short-staple
      - extral-long
      required: false
    - id: 5
      name: question_4
      label: What is the process of treating cotton to make it more durable?
      hint: null
      type: select_one
      options:
      - bleaching
      - printing
      - dyeing
      required: false
    - id: 6
      name: question_5
      label: How many steps are involved in the cotton production process?
      hint: null
      type: select_multiple
      options:
      - ginning
      - carding
      - weaving
      - spinning
      required: false
    - id: 7
      name: question_6
      label: What is the main difference between natural and synthetic fibers?
      hint: null
      type: select_multiple
      options:
      - breathability
      - elasticity
      - water-resistance
      required: false
    - id: 8
      name: question_7
      label: What is the term for the natural fiber that is used to create cotton
        fabric?
      hint: null
      type: select_one
      options:
      - thread
      - yarn
      - thread-count
      required: false
    - id: 9
      name: question_8
      label: How does cotton get its unique texture and durability?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: question_9
      label: How can cotton be treated to make it more resistant to wrinkles?
      hint: null
      type: select_one
      options:
      - starching
      - bleaching
      - ironing
      required: false
    - id: 11
      name: question_10
      label: What are some common uses of cotton in daily life?
      hint: null
      type: select_multiple
      options:
      - clothing
      - bedding
      - towels
      required: false
    - id: 12
      name: last_question
      label: What is the final score of the quiz?
      hint: null
      type: number
      options: []
      required: true
