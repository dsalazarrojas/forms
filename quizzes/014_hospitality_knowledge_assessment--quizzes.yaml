inputSchema:
  type: object
  properties:
    title: hospitality_knowledge_assessment
    pages:
    - id: 1
      name: category
      label: What is your category of work?
      hint: null
      type: select_one
      options:
      - Front Desk
      - Housekeeping
      - F&B
      - Engineering
      - Management
      required: false
    - id: 2
      name: role
      label: Can you describe your role in our organization?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: assigned_tool
      label: What tools have you been assigned to use?
      hint: null
      type: select_one
      options:
      - Front Desk Console
      - Housekeeping System
      - F&B Software
      - Engineering Tools
      - Management Dashboard
      required: false
    - id: 4
      name: score
      label: What is your current score?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: comments
      label: Do you have any comments or suggestions?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: submitted
      label: Have you submitted the form previously?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: form_id
      label: What is your form ID?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: form_url
      label: Where can you access your form output?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: form_description
      label: Can you describe your form?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_tool_2
      label: Who assigned this form to you?
      hint: null
      type: select_one
      options:
      - Front Desk Manager
      - Housekeeping Manager
      - F&B Manager
      - Engineering Manager
      - Management
      required: false
    - id: 11
      name: form_status
      label: What is the status of your form?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: form_location
      label: Where is your form located?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: created_by
      label: Who created this form?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: updated_at
      label: When was the form updated?
      hint: null
      type: text
      options: []
      required: false
