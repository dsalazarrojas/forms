inputSchema:
  type: object
  properties:
    title: Community Project Evaluation Quiz
    pages:
      - id: 1
        name: quiz_intro
        label: Community Project Evaluation Quiz
        hint: Test your knowledge about community project evaluation
        type: note
        options: []
        required: false
      - id: 2
        name: participant_name
        label: Your Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email Address
        hint: For results delivery
        type: email
        options: []
        required: true
      - id: 4
        name: organization
        label: Organization
        hint: If applicable
        type: text
        options: []
        required: false
      - id: 5
        name: role
        label: Your Role
        hint: null
        type: select_one
        options:
        - Project Manager
        - Program Coordinator
        - Volunteer
        - Community Member
        - Student
        - Other
        required: true
      - id: 6
        name: experience_level
        label: Experience with Project Evaluation
        hint: null
        type: select_one
        options:
        - Beginner
        - Intermediate
        - Advanced
        - Expert
        required: true
      - id: 7
        name: question_1
        label: Question 1 - What is the primary purpose of project evaluation
        hint: Select the best answer
        type: select_one
        options:
        - To justify funding
        - To assess effectiveness and improve outcomes
        - To find faults
        - To complete paperwork
        required: true
      - id: 8
        name: question_2
        label: Question 2 - Which of the following is a quantitative data collection method
        hint: Select one
        type: select_one
        options:
        - Focus groups
        - Surveys with rating scales
        - Open-ended interviews
        - Case studies
        required: true
      - id: 9
        name: question_3
        label: Question 3 - What does SMART stand for in goal setting
        hint: Select the correct definition
        type: select_one
        options:
        - Simple, Measurable, Achievable, Relevant, Time-bound
        - Specific, Measurable, Achievable, Relevant, Time-bound
        - Specific, Meaningful, Actionable, Realistic, Timely
        - Strategic, Measurable, Attainable, Relevant, Trackable
        required: true
      - id: 10
        name: question_4
        label: Question 4 - When should evaluation planning begin
        hint: Select the best timing
        type: select_one
        options:
        - At the end of the project
        - During project implementation
        - At the beginning of project planning
        - After funding is secured
        required: true
      - id: 11
        name: question_5
        label: Question 5 - What is a logic model
        hint: Select the best description
        type: select_one
        options:
        - A computer program for evaluation
        - A visual representation of how a program works
        - A type of survey
        - A budget template
        required: true
      - id: 12
        name: question_6
        label: Question 6 - Which is an example of an outcome measure
        hint: Select one
        type: select_one
        options:
        - Number of workshops held
        - Number of participants attending
        - Improved knowledge or behavior change
        - Hours of staff time
        required: true
      - id: 13
        name: question_7
        label: Question 7 - What is formative evaluation
        hint: Select the correct definition
        type: select_one
        options:
        - Evaluation at the end of a project
        - Evaluation conducted during implementation to improve
        - Evaluation of financial records
        - Evaluation by external reviewers
        required: true
      - id: 14
        name: question_8
        label: Question 8 - What is summative evaluation
        hint: Select the correct definition
        type: select_one
        options:
        - Ongoing assessment during the project
        - Assessment of overall impact at project end
        - Budget review
        - Staff performance evaluation
        required: true
      - id: 15
        name: question_9
        label: Question 9 - Why is stakeholder engagement important in evaluation
        hint: Select the best reason
        type: select_one
        options:
        - It is required by funders
        - It ensures evaluation addresses relevant questions and increases buy-in
        - It makes the report longer
        - It reduces costs
        required: true
      - id: 16
        name: question_10
        label: Question 10 - What is a baseline measurement
        hint: Select the correct definition
        type: select_one
        options:
        - The final measurement
        - The initial measurement before intervention
        - The average of all measurements
        - The minimum acceptable score
        required: true
      - id: 17
        name: question_11
        label: Question 11 - Which sampling method gives every member an equal chance of selection
        hint: Select one
        type: select_one
        options:
        - Convenience sampling
        - Random sampling
        - Purposive sampling
        - Snowball sampling
        required: true
      - id: 18
        name: question_12
        label: Question 12 - What is triangulation in evaluation
        hint: Select the best definition
        type: select_one
        options:
        - Using three evaluators
        - Using multiple methods or data sources
        - Creating three reports
        - Measuring three outcomes
        required: true
      - id: 19
        name: question_13
        label: Question 13 - What is the response rate
        hint: Select the correct definition
        type: select_one
        options:
        - How quickly surveys are returned
        - The percentage of people who respond to a survey
        - The number of questions answered
        - The speed of data analysis
        required: true
      - id: 20
        name: question_14
        label: Question 14 - Which is a qualitative data analysis method
        hint: Select one
        type: select_one
        options:
        - Statistical regression
        - Thematic analysis
        - Mean calculation
        - Correlation analysis
        required: true
      - id: 21
        name: question_15
        label: Question 15 - What should an evaluation report include
        hint: Select the most comprehensive answer
        type: select_one
        options:
        - Only positive findings
        - Executive summary, methodology, findings, conclusions, and recommendations
        - Just the budget
        - Only participant quotes
        required: true
      - id: 22
        name: submit_quiz
        label: Are You Ready to Submit
        hint: Review your answers
        type: select_one
        options:
        - Yes - Submit My Quiz
        - No - I Need to Review
        required: true
      - id: 23
        name: feedback_request
        label: Would You Like Detailed Feedback
        hint: null
        type: select_one
        options:
        - Yes - Send Me Feedback
        - No - Just My Score
        required: true
      - id: 24
        name: additional_comments
        label: Comments About This Quiz
        hint: Optional feedback
        type: text
        options: []
        required: false
