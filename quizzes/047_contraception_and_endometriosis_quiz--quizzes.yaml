inputSchema:
  type: object
  properties:
    title: Contraception And Endometriosis Quiz
    pages:
    - id: 1
      name: quiz_intro_header
      label: -- Knowledge Check - Contraception and Endometriosis --
      hint: Assessing understanding of endometriosis management
      type: note
      options: []
      required: false
    - id: 2
      name: student_participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: section_1_endo_basics
      label: -- Part 1 - Understanding Endometriosis --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: question_endo_definition
      label: Which best describes Endometriosis
      hint: null
      type: select_one
      options:
      - Inflammation of the uterine lining
      - Tissue similar to the uterine lining growing outside the uterus
      - A type of uterine cancer
      - Regular heavy menstrual bleeding
      required: true
    - id: 5
      name: question_common_symptoms
      label: What are common symptoms of endometriosis
      hint: Select all that apply
      type: select_multiple
      options:
      - Pelvic pain (chronic)
      - Painful periods (dysmenorrhea)
      - Pain during or after intercourse
      - Heavy bleeding
      - Fatigue and nausea
      required: true
    - id: 6
      name: section_2_contraception
      label: -- Part 2 - Contraceptive Management --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: question_pill_mechanism
      label: How does the combined oral contraceptive pill help manage endometriosis
      hint: null
      type: select_one
      options:
      - By permanently removing lesions
      - By suppressing ovulation and thinning the endometrium
      - By increasing estrogen levels significantly
      - It has no effect on symptoms
      required: true
    - id: 8
      name: question_iud_management
      label: Which type of IUD is specifically used for endometriosis symptom control
      hint: null
      type: select_one
      options:
      - Copper IUD (non-hormonal)
      - Hormonal IUD (progestogen-releasing)
      - Both are equally effective
      - Neither should be used
      required: true
    - id: 9
      name: section_3_professional_care
      label: -- Part 3 - Seeking Care --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: question_when_to_see_specialist
      label: When should a person with suspected endometriosis see a specialist
      hint: null
      type: select_one
      options:
      - Only if they want to conceive
      - When symptoms interfere with daily life or work
      - After the age of 35
      - Only after a surgical diagnosis
      required: true
    - id: 11
      name: confidence_score_endo
      label: How confident are you in discussing these topics with a healthcare provider
      hint: 1 = Not confident, 5 = Very confident
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 12
      name: additional_learning_topics
      label: What other health topics would you like to learn about
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: quiz_timestamp
      label: Date Completed
      hint: null
      type: date
      options: []
      required: true
