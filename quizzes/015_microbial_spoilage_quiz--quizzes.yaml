inputSchema:
  type: object
  properties:
    title: Microbial Spoilage Quiz
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: food_type
      label: Food Type
      hint: null
      type: select_one
      options:
      - Baked
      - Cured
      - Cooked
      - Dried
      - Pickled
      - Smoked
      - Sprouted
      - Thawed
      required: false
    - id: 3
      name: spoilage_level
      label: Spoilage Level
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - High
      required: false
    - id: 4
      name: time_spoilage_began
      label: Time Spoilage Began
      hint: YYYY-MM-dd
      type: date
      options: []
      required: false
    - id: 5
      name: time_spoilage_detected
      label: Time Spoilage Detected
      hint: YYYY-MM-dd
      type: date
      options: []
      required: false
    - id: 6
      name: temperature
      label: Temperature
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: follow_up
      label: Follow Up
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
