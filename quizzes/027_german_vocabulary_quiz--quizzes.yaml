inputSchema:
  type: object
  properties:
    title: German Vocabulary Quiz
    pages:
    - id: 1
      name: quiz_start
      label: Quiz Start
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question
      label: question
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 3
      name: answer
      label: answer
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: next_question
      label: next question
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 5
      name: submit_button
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: false
    - id: 6
      name: quiz_complete
      label: Quiz Complete
      hint: null
      type: text
      options: []
      required: false
