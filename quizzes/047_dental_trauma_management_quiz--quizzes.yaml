inputSchema:
  type: object
  properties:
    title: Dental Trauma Management Quiz
    pages:
    - id: 1
      name: dental_trauma_management_quiz_form_1
      label: What is the primary concern when managing a dental trauma patient?
      hint: This question is for testing the primary concern.
      type: text
      options: []
      required: true
    - id: 2
      name: patient_age
      label: Patient age
      hint: Enter patient age.
      type: number
      options: []
      required: true
    - id: 3
      name: medical_history
      label: Medical history
      hint: Enter patient medical history.
      type: text
      options: []
      required: false
    - id: 4
      name: dental_history
      label: Dental history
      hint: Enter dental history.
      type: text
      options: []
      required: false
    - id: 5
      name: dental_trauma_management_1
      label: Which of the following is the most likely treatment for a patient with
        a dental avulsion?
      hint: Select one treatment option.
      type: select_one
      options:
      - splint
      - extraction
      - observation
      - other
      required: true
    - id: 6
      name: dental_trauma_management_2
