inputSchema:
  type: object
  properties:
    title: Weekdays Knowledge Quiz
    pages:
    - id: 1
      name: select_weekday_1
      label: Best Weekday
      hint: Select the best weekday
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 2
      name: score_monday_1
      label: Score for Monday
      hint: Enter a score for Monday
      type: number
      options: []
      required: true
    - id: 3
      name: score_tuesday_1
      label: Score for Tuesday
      hint: Enter a score for Tuesday
      type: number
      options: []
      required: true
    - id: 4
      name: score_wednesday_1
      label: Score for Wednesday
      hint: Enter a score for Wednesday
      type: number
      options: []
      required: true
    - id: 5
      name: score_thursday_1
      label: Score for Thursday
      hint: Enter a score for Thursday
      type: number
      options: []
      required: true
    - id: 6
      name: score_friday_1
      label: Score for Friday
      hint: Enter a score for Friday
      type: number
      options: []
      required: true
    - id: 7
      name: comments_1
      label: Comments
      hint: Enter comments for the week
      type: text
      options: []
      required: true
    - id: 8
      name: submitted_by_1
      label: Submitted By
      hint: Select the person who submitted
      type: select_one
      options:
      - John
      - Jane
      - Jimmy
      required: true
