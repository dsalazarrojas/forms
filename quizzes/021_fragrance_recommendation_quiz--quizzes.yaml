inputSchema:
  type: object
  properties:
    title: Fragrance Recommendation Quiz
    pages:
    - id: 1
      name: scent_type
      label: What type of scent do you typically enjoy?
      hint: null
      type: select_one
      options:
      - Floral
      - Oriental
      - Woody
      - Fruity
      - Citrus
      required: true
    - id: 2
      name: family_size
      label: What size of fragrance family do you usually choose?
      hint: Choose 1-3 options
      type: select_multiple
      options:
      - Top
      - Middle
      - Base
      required: true
    - id: 3
      name: concentration_level
      label: How concentrated would you like your fragrances to be?
      hint: Choose 1-2 options
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 4
      name: wear_time
      label: How long do you usually wear your fragrance?
      hint: null
      type: select_one
      options:
      - Less than 2 hours
      - 2-4 hours
      - 4-6 hours
      - 6-8 hours
      - More than 8 hours
      required: true
    - id: 5
      name: after_activities
      label: When do you usually wear your fragrance after?
      hint: Choose 1-3 options
      type: select_multiple
      options:
      - After showering
      - After exercising
      - After eating
      - After smoking
      - After drinking
      required: true
    - id: 6
      name: fragrance_usage
      label: What will you be doing with the fragrance?
      hint: Choose 1-2 options
      type: select_multiple
      options:
      - Wearing
      - Giving as a gift
      - Using for a special occasion
      - Using for everyday
      required: true
    - id: 7
      name: purpose
      label: What is the purpose of the fragrance for you?
      hint: Choose 1 option
      type: select_one
      options:
      - Personal use
      - Business use
      required: true
    - id: 8
      name: contact_method
      label: How would you like to receive fragrance recommendations?
      hint: Choose 1 option
      type: select_one
      options:
      - Email
      - Phone
      - Text message
      required: true
    - id: 9
      name: additional_info
      label: Do you have any other preferences or information about your fragrance
        preferences?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: special_occasion
      label: If you're planning to use the fragrance for a special occasion, what
        is it?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: gift_recipient
      label: If you're giving the fragrance as a gift, who is the recipient?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: notes
      label: Is there anything else you'd like to share about your preferences?
      hint: null
      type: text
      options: []
      required: false
