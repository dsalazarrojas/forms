        name: quiz_date
        label: Quiz Date
        hint: Date of this quiz
        type: date
        options: []
        required: true
      - id: 5
        name: question_1
        label: Question 1 - What is chemical carcinogenesis
        hint: Select the best answer
        type: select_one
        options:
          - The process by which chemicals cause cancer
          - The treatment of cancer with chemicals
          - The prevention of cancer through diet
          - The study of cancer cells
        required: true
      - id: 6
        name: question_2
        label: Question 2 - Which of the following is a known carcinogen
        hint: Select the best answer
        type: select_one
        options:
          - Benzene
          - Water
          - Oxygen
          - Glucose
        required: true
      - id: 7
        name: question_3
        label: Question 3 - What is the initiation phase in carcinogenesis
        hint: Select the best answer
        type: select_one
        options:
          - The initial DNA damage that starts the cancer process
          - The final stage of cancer development
          - The treatment phase
          - The recovery phase
        required: true
      - id: 8
        name: question_4
        label: Question 4 - What is a promoter in carcinogenesis
        hint: Select the best answer
        type: select_one
        options:
          - A substance that enhances cancer development after initiation
          - A cancer treatment drug
          - A type of cancer cell
          - A preventive measure
        required: true
