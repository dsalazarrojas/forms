inputSchema:
  type: object
  properties:
    title: Chemical Carcinogenesis Knowledge Quiz
    pages:
      - id: 1
        name: student_name
        label: Full Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: email_address
        label: Email Address
        hint: Your email address
        type: email
        options: []
        required: true
      - id: 3
        name: course_name
