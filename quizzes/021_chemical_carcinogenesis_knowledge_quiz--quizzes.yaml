        name: question_5
        label: Question 5 - Which organ is most commonly affected by chemical carcinogens
        hint: Select the best answer
        type: select_one
        options:
          - Liver
          - Heart
          - Brain
          - Kidney
        required: true
      - id: 10
        name: question_6
        label: Question 6 - What is the latency period in chemical carcinogenesis
        hint: Select the best answer
        type: select_one
        options:
