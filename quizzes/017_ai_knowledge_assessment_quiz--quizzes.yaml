inputSchema:
  type: object
  properties:
    title: AI Knowledge Assessment Quiz
    pages:
    - id: 1
      name: instructions
      label: -- Quiz Instructions --
      hint: Complete all questions to assess AI knowledge
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Participant email
      hint: Optional for results
      type: email
      options: []
      required: false
    - id: 4
      name: q1_understanding
      label: What is machine learning
      hint: Short answer
      type: text
      options: []
      required: true
    - id: 5
      name: q2_supervised
      label: Which scenario is supervised learning
      hint: Choose the best option
      type: select_one
      options: [Labeled data training,Unlabeled data clustering,Reinforcement agent learning]
      required: true
    - id: 6
      name: q3_model_eval
      label: Best metric for imbalanced classification
      hint: Choose the best metric
      type: select_one
      options: [Accuracy,Precision recall,AUC ROC]
      required: true
    - id: 7
      name: q4_bias
      label: How to mitigate dataset bias
      hint: Short answer
      type: text
      options: []
      required: false
    - id: 8
      name: q5_regulations
      label: Key compliance consideration
      hint: Short answer
      type: text
      options: []
      required: false
    - id: 9
      name: overall_score
      label: Self assessment of AI knowledge
      hint: 1 low to 5 high
      type: select_one
      options: [1,2,3,4,5]
      required: true
