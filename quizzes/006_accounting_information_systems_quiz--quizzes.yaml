inputSchema:
  type: object
  properties:
    title: Accounting Information Systems Quiz
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Full name of the student taking the quiz
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: Unique identifier for the student
      type: text
      options: []
      required: true
    - id: 3
      name: course_name
      label: Course Name
      hint: Name of the course this quiz is for
      type: text
      options: []
      required: true
    - id: 4
      name: quiz_date
      label: Quiz Date
      hint: Date when the quiz is taken
      type: date
      options: []
      required: true
    - id: 5
      name: question_1
      label: What is the primary purpose of an Accounting Information System (AIS)
      hint: Select the best answer
      type: select_one
      options: ["To store financial data securely", "To collect, store, and process financial and accounting data", "To generate reports for management", "To comply with regulatory requirements"]
      required: true
    - id: 6
      name: question_2
      label: Which of the following is NOT a component of an AIS
      hint: Select the incorrect option
      type: select_one
      options: ["People", "Procedures", "Data", "Marketing strategies"]
      required: true
    - id: 7
      name: question_3
      label: What does ERP stand for in the context of accounting systems
      hint: Select the correct acronym
      type: select_one
      options: ["Enterprise Resource Planning", "Electronic Record Processing", "Efficient Reporting Platform", "Enterprise Risk Prevention"]
      required: true
    - id: 8
      name: question_4
      label: Which internal control principle involves dividing responsibility for a transaction between two or more people
      hint: Select the correct principle
      type: select_one
      options: ["Documentation procedures", "Establishment of responsibility", "Segregation of duties", "Independent internal verification"]
      required: true
    - id: 9
      name: question_5
      label: What is the main advantage of cloud-based accounting systems
      hint: Select the best answer
      type: select_one
      options: ["Lower initial cost", "Accessibility from anywhere", "Automatic updates", "All of the above"]
      required: true
    - id: 10
      name: question_6
      label: Which of the following is a common risk in accounting information systems
      hint: Select the correct risk
      type: select_one
      options: ["Data breaches", "System failures", "Unauthorized access", "All of the above"]
      required: true
    - id: 11
      name: question_7
      label: What is the purpose of audit trails in an AIS
      hint: Select the best answer
      type: select_one
      options: ["To improve system performance", "To track who accessed the system and what changes were made", "To reduce storage costs", "To automate financial reporting"]
      required: true
    - id: 12
      name: question_8
      label: True or False - Real-time processing means transactions are processed immediately as they occur
      hint: Select True or False
      type: select_one
      options: ["True", "False"]
      required: true
    - id: 13
      name: question_9
      label: Which of the following is an example of source data automation
      hint: Select the best example
      type: select_one
      options: ["Bar code scanners", "Manual data entry", "Paper invoices", "Spreadsheet calculations"]
      required: true
    - id: 14
      name: question_10
      label: Briefly explain the difference between batch processing and real-time processing
      hint: Provide a concise explanation
      type: text
      options: []
      required: false
