inputSchema:
  type: object
  properties:
    title: html_knowledge_quiz
    pages:
    - id: 1
      name: quiz_questions
      label: quiz questions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: quiz_type
      label: quiz type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: quiz_difficulty
      label: difficulty level
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: submission_time
      label: submission time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: email_confirmation
      label: email confirmation
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone_confirmation
      label: phone confirmation
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: user_info
      label: user information
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: submission_comments
      label: submission comments
      hint: null
      type: text
      options: []
      required: false
