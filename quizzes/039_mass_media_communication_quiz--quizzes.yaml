inputSchema:
  type: object
  properties:
    title: mass_media_communication_quiz
    pages:
    - id: 1
      name: welcome_message
      label: Welcome message
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: introduction
      label: What is mass media?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: mass_media_definition
      label: What is mass media?
      hint: Define mass media
      type: select_one
      options:
      - Mass media refers to a medium that reaches a large audience.
      - Mass media refers to an individualized experience.
      - Mass media refers to a specific group of people.
      required: false
    - id: 4
      name: mass_media_channels
      label: Which of the following are mass media channels?
      hint: Select all that apply
      type: select_multiple
      options:
      - Radio
      - Television
      - Newspapers
      - Internet
      - Print media
      - Outdoor advertising
      required: false
    - id: 5
      name: mass_media_impact
      label: How does mass media impact society?
      hint: Select all that apply
      type: select_multiple
      options:
      - It helps to raise awareness about a product or service.
      - It helps to influence opinions and attitudes.
      - It helps to promote cultural identity.
      - It helps to shape public policy.
      required: false
    - id: 6
      name: mass_media_future
      label: What does the future hold for mass media?
      hint: Select all that apply
      type: select_multiple
      options:
      - It will become more personalized.
      - It will become more interactive.
      - It will become less interactive.
      - It will disappear.
      required: false
    - id: 7
      name: mass_media_and_society
      label: How does mass media affect society?
      hint: Select all that apply
      type: select_multiple
      options:
      - Mass media helps to shape opinions and attitudes.
      - Mass media influences cultural identity.
      - Mass media promotes cultural homogenization.
      - Mass media is a threat to democracy.
      required: false
    - id: 8
      name: mass_media_and_technology
      label: How does mass media use technology?
      hint: Select all that apply
      type: select_multiple
      options:
      - Mass media uses social media.
      - Mass media uses search engines.
      - Mass media uses online video platforms.
      required: false
    - id: 9
      name: conclusion
      label: What did you learn from the quiz?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: feedback
      label: What would you like to say about the quiz?
      hint: null
      type: note
      options: []
      required: false
