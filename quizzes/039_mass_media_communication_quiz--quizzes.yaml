inputSchema:
  type: object
  properties:
    title: mass_media_communication_quiz
    pages:
    - id: 1
      name: welcome_message
      label: Welcome message
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: introduction
      label: What is mass media?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: mass_media_definition
      label: What is mass media?
      hint: Define mass media
      type: select_one
      options:
      - '{''id'': 1, ''text'': ''Mass media refers to a medium that reaches a large
        audience.''}'
      - '{''id'': 2, ''text'': ''Mass media refers to an individualized experience.''}'
      - '{''id'': 3, ''text'': ''Mass media refers to a specific group of people.''}'
      required: false
    - id: 4
      name: mass_media_channels
      label: Which of the following are mass media channels?
      hint: Select all that apply
      type: select_multiple
      options:
      - '{''id'': 1, ''text'': ''Radio''}'
      - '{''id'': 2, ''text'': ''Television''}'
      - '{''id'': 3, ''text'': ''Newspapers''}'
      - '{''id'': 4, ''text'': ''Internet''}'
      - '{''id'': 5, ''text'': ''Print media''}'
      - '{''id'': 6, ''text'': ''Outdoor advertising''}'
      required: false
    - id: 5
      name: mass_media_impact
      label: How does mass media impact society?
      hint: Select all that apply
      type: select_multiple
      options:
      - '{''id'': 1, ''text'': ''It helps to raise awareness about a product or service.''}'
      - '{''id'': 2, ''text'': ''It helps to influence opinions and attitudes.''}'
      - '{''id'': 3, ''text'': ''It helps to promote cultural identity.''}'
      - '{''id'': 4, ''text'': ''It helps to shape public policy.''}'
      required: false
    - id: 6
      name: mass_media_future
      label: What does the future hold for mass media?
      hint: Select all that apply
      type: select_multiple
      options:
      - '{''id'': 1, ''text'': ''It will become more personalized.''}'
      - '{''id'': 2, ''text'': ''It will become more interactive.''}'
      - '{''id'': 3, ''text'': ''It will become less interactive.''}'
      - '{''id'': 4, ''text'': ''It will disappear.''}'
      required: false
    - id: 7
      name: mass_media_and_society
      label: How does mass media affect society?
      hint: Select all that apply
      type: select_multiple
      options:
      - '{''id'': 1, ''text'': ''Mass media helps to shape opinions and attitudes.''}'
      - '{''id'': 2, ''text'': ''Mass media influences cultural identity.''}'
      - '{''id'': 3, ''text'': ''Mass media promotes cultural homogenization.''}'
      - '{''id'': 4, ''text'': ''Mass media is a threat to democracy.''}'
      required: false
    - id: 8
      name: mass_media_and_technology
      label: How does mass media use technology?
      hint: Select all that apply
      type: select_multiple
      options:
      - '{''id'': 1, ''text'': ''Mass media uses social media.''}'
      - '{''id'': 2, ''text'': ''Mass media uses search engines.''}'
      - '{''id'': 3, ''text'': ''Mass media uses online video platforms.''}'
      required: false
