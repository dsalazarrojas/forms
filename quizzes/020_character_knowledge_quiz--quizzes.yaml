inputSchema:
  type: object
  properties:
    title: Character Knowledge Quiz
    pages:
    - id: 1
      name: header
      label: -- Character Knowledge Quiz --
      hint: Short quiz to test knowledge of a character or story
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: participant name
      hint: optional for anonymous quizzes
      type: text
      options: []
      required: false
    - id: 3
      name: question_1
      label: question 1
      hint: who is the protagonist
      type: text
      options: []
      required: true
    - id: 4
      name: question_2
      label: question 2
      hint: what is the protagonist primary trait
      type: select_one
      options:
      - Brave
      - Cautious
      - Curious
      - Selfish
      required: true
    - id: 5
      name: question_3
      label: question 3
      hint: where does the story take place
      type: text
      options: []
      required: true
    - id: 6
      name: question_4
      label: question 4
      hint: identify a key supporting character
      type: text
      options: []
      required: false
    - id: 7
      name: question_5
      label: question 5
      hint: what is the main conflict
      type: text
      options: []
      required: true
    - id: 8
      name: score_submission
      label: score submission
      hint: optional internal use for scoring
      type: number
      options: []
      required: false
    - id: 9
      name: feedback
      label: feedback
      hint: optional feedback about the quiz
      type: text
      options: []
      required: false
    - id: 10
      name: completion_date
      label: completion date
      hint: date quiz was finished
      type: date
      options: []
      required: false
