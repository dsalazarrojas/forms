inputSchema:
  type: object
  properties:
    title: Quiz Badge Submission Form
    pages:
    - id: 1
      name: introduction
      label: What's your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: quiz_completion
      label: Have you completed the quiz?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 3
      name: quiz_type
      label: What type of quiz are you submitting?
      hint: null
      type: select_one
      options:
      - Math
      - Science
      - History
      required: true
    - id: 4
      name: feedback
      label: How would you rate the quiz difficulty?
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: submission_date
      label: When did you submit the quiz?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: badge_level
      label: What level of badge are you earning?
      hint: null
      type: select_multiple
      options:
      - Bronze
      - Silver
      - Gold
      required: true
    - id: 7
      name: email
      label: What's your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: score
      label: What's your score?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: confirmation
      label: Are you sure you've submitted the quiz?
      hint: null
      type: radio
      options:
      - Option A
      - Option B
      required: true
