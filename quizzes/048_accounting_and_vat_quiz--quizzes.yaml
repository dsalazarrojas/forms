      label: In double-entry bookkeeping, every transaction affects at least
      hint: null
      type: select_one
      options:
        - One account
        - Two accounts
        - Three accounts
        - Four accounts
      required: true
    - id: 7
      name: q2_debit_increase
      label: A debit increases which of the following account types
      hint: null
      type: select_one
      options:
        - Revenue
        - Liabilities
        - Assets
        - Equity
      required: true
    - id: 8
      name: q3_income_statement
      label: Which financial statement shows revenue and expenses over a period
      hint: null
      type: select_one
