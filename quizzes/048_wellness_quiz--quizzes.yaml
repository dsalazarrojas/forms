inputSchema:
  type: object
  properties:
    title: wellness_quiz
    pages:
    - id: 1
      name: intro
      label: Welcome to the Quiz
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: age
      label: age
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: sleep_habit
      label: How often do you get enough sleep?
      hint: null
      type: select_one
      options:
      - Every night
      - Most nights
      - Rarely
      - Never
      required: false
    - id: 4
      name: nutrition_habit
      label: How often do you eat fruits and vegetables?
      hint: null
      type: select_multiple
      options:
      - Most days
      - 2-3 times a week
      - Rarely
      - Never
      required: true
    - id: 5
      name: exercise_habit
      label: exercise_frequency
      hint: null
      type: select_one
      options:
      - Daily
      - 2-3 times a week
      - 1-2 times a week
      - Rarely
      required: true
    - id: 6
      name: stress_levels
      label: stress_levels
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      - Extremely High
      required: false
    - id: 7
      name: emotional_health
      label: how_do_you_feel
      hint: null
      type: select_multiple
      options:
      - Happy
      - Neutral
      - Sad
      - Very sad
      required: true
    - id: 8
      name: mental_health
      label: mental_health
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: physical_health
      label: physical_health
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: overall_wellness
      label: how_do_you_rate_your_wellness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: submit
      label: submit
      hint: null
      type: text
      options: []
      required: false
