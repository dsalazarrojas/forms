inputSchema:
  type: object
  properties:
    title: Housekeeping Attendance Sheet
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: shift
      label: Shift
      hint: null
      type: select_one
      options:
      - '{''label'': ''Morning''}'
      - '{''label'': ''Afternoon''}'
      - '{''label'': ''Night''}'
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: attendance
      label: Attendance
      hint: null
      type: select_one
      options:
      - '{''label'': ''Present''}'
      - '{''label'': ''Absent''}'
      - '{''label'': ''Late''}'
      required: false
    - id: 8
      name: reason
      label: Reason
      hint: Optional
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
