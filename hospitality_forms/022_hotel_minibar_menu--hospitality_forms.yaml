inputSchema:
  type: object
  properties:
    title: Hotel Minibar Menu
    pages:
    - id: 1
      name: minibar_order
      label: Hotel Minibar Order
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: drink_ordered
      label: Drink Ordered
      hint: null
      type: select_one
      options:
      - Coca Cola
      - Sprite
      - Water
      - Juice
      required: true
    - id: 3
      name: additional_info
      label: Additional Information
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: guest_feedback
      label: Guest Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: confirmation
      label: Confirm
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
