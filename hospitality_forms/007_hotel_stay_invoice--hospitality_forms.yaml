inputSchema:
  type: object
  properties:
    title: Hotel Stay Invoice
    pages:
    - id: 1
      name: hotel_name
      label: Hotel Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: room_service
      label: Room Service
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: services_rendered
      label: Services Rendered
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_stayed
      label: Date Stayed
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: checkin_check_out
      label: Checkin/Check-out
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Pay Pal
      - Bank Transfer
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
