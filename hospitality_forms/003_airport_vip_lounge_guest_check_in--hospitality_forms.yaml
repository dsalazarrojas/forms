inputSchema:
  type: object
  properties:
    title: Airport VIP Lounge Guest Check In
    pages:
    - id: 1
      name: guest_full_name
      label: Guest Full Name
      hint: Name as it appears on boarding pass
      type: text
      options: []
      required: true
    - id: 2
      name: membership_number
      label: Membership Number
      hint: VIP lounge membership ID if applicable
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: For receipt and confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact number during travel
      type: text
      options: []
      required: true
    - id: 5
      name: airline_name
      label: Airline Name
      hint: Operating carrier for your flight
      type: text
      options: []
      required: true
    - id: 6
      name: flight_number
      label: Flight Number
      hint: Your departing flight number
      type: text
      options: []
      required: true
    - id: 7
      name: departure_time
      label: Flight Departure Time
      hint: Scheduled departure time
      type: time
      options: []
      required: true
    - id: 8
      name: boarding_pass_number
      label: Boarding Pass Number
      hint: Gate agent may verify this
      type: text
      options: []
      required: true
    - id: 9
      name: travel_class
      label: Travel Class
      hint: Class of service booked
      type: select_one
      options:
      - Economy
      - Premium Economy
      - Business Class
      - First Class
      required: true
    - id: 10
      name: access_method
      label: Access Method
      hint: How are you accessing the lounge?
      type: select_one
      options:
      - First/Business Class Ticket
      - Lounge Membership
      - Day Pass Purchase
      - Credit Card Benefit
      - Airline Status
      - Guest of Member
      required: true
    - id: 11
      name: number_of_guests
      label: Number of Additional Guests
      hint: Guests accompanying you
      type: number
      options: []
      required: false
    - id: 12
      name: guest_names
      label: Guest Names
      hint: Names of accompanying guests
      type: text
      options: []
      required: false
    - id: 13
      name: lounge_location
      label: Lounge Location
      hint: Which lounge are you checking into?
      type: select_one
      options:
      - Terminal 1 - Gate A
      - Terminal 1 - Gate B
      - Terminal 2 - International
      - Terminal 3 - Domestic
      - Concourse C
      required: true
    - id: 14
      name: check_in_time
      label: Check-in Time
      hint: Time of lounge entry
      type: time
      options: []
      required: true
    - id: 15
      name: special_dietary_needs
      label: Special Dietary Requirements
      hint: Allergies or dietary restrictions
      type: select_multiple
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Kosher
      - Halal
      - Nut Allergy
      required: false
    - id: 16
      name: beverage_preference
      label: Beverage Preferences
      hint: Select your preferences
      type: select_multiple
      options:
      - Coffee
      - Tea
      - Fresh Juice
      - Soft Drinks
      - Wine
      - Beer
      - Spirits
      - Champagne
      required: false
    - id: 17
      name: purpose_of_visit
      label: Purpose of Visit
      hint: Reason for travel
      type: select_one
      options:
      - Business
      - Leisure
      - Family Visit
      - Medical
      - Other
      required: false
    - id: 18
      name: feedback_consent
      label: Receive Follow-up Survey
      hint: May we send a brief feedback survey?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
