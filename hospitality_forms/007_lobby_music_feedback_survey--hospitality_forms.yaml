inputSchema:
  type: object
  properties:
    title: Lobby Music Feedback Survey
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating_1
      label: How would you rate our lobby music
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: rating_2
      label: How would you rate the volume of our lobby music
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: preference
      label: What music genre do you prefer
      hint: null
      type: select_multiple
      options:
      - Jazz
      - Classical
      - Pop
      - Rock
      - Electronic
      required: false
    - id: 5
      name: preference_2
      label: What music tempo do you prefer
      hint: null
      type: select_one
      options:
      - Fast
      - Slow
      - Medium
      required: false
    - id: 6
      name: note
      label: Any notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
