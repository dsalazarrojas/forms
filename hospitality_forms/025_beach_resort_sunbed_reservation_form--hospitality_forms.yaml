inputSchema:
  type: object
  properties:
    title: Beach Resort Sunbed Reservation Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: room_number
      label: Room Number
      hint: Your room if staying at resort
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: reservation_date
      label: Reservation Date
      hint: Date for sunbed
      type: date
      options: []
      required: true
    - id: 6
      name: time_slot
      label: Time Slot
      hint: Preferred time
      type: select_one
      options:
      - Morning - 8 AM to 12 PM
      - Afternoon - 12 PM to 5 PM
      - Full Day - 8 AM to 5 PM
      - Sunset - 5 PM to 8 PM
      required: true
    - id: 7
      name: sunbed_type
      label: Sunbed Type
      hint: What type of bed
      type: select_one
      options:
      - Standard Sunbed
      - Premium Cabana
      - Beach Lounger
      - Daybed
      - VIP Cabana
      required: true
    - id: 8
      name: number_of_sunbeds
      label: Number of Sunbeds
      hint: How many needed
      type: number
      options: []
      required: true
    - id: 9
      name: location_preference
      label: Location Preference
      hint: Where on beach
      type: select_one
      options:
      - Front Row - Waterfront
      - Second Row
      - Shaded Area
      - Pool Side
      - No Preference
      required: true
    - id: 10
      name: umbrella_needed
      label: Umbrella Needed
      hint: Do you want umbrella
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: towel_service
      label: Towel Service
      hint: Do you need towels
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: additional_services
      label: Additional Services
      hint: Select all that apply
      type: select_multiple
      options:
      - Beverage Service
      - Food Service
      - Massage Service
      - Water Sports Equipment
      - None
      required: false
    - id: 13
      name: special_occasion
      label: Special Occasion
      hint: Celebrating something
      type: select_one
      options:
      - None
      - Birthday
      - Anniversary
      - Honeymoon
      - Other
      required: false
    - id: 14
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any requirements
      type: text
      options: []
      required: false
    - id: 15
      name: total_cost
      label: Estimated Total Cost
      hint: Total price
      type: number
      options: []
      required: false
    - id: 16
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Room Charge
      - Credit Card
      - Debit Card
      - Cash
      required: true
    - id: 17
      name: cancellation_policy
      label: I Understand Cancellation Policy
      hint: Must accept
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
