inputSchema:
  type: object
  properties:
    title: Cocktail Bar Booking Inquiry
    pages:
    - id: 1
      name: section_contact
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company or Organization
      hint: If booking for business
      type: text
      options: []
      required: false
    - id: 6
      name: section_event
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_date
      label: Preferred Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: event_time
      label: Event Time
      hint: Start time for your event
      type: time
      options: []
      required: true
    - id: 9
      name: event_type
      label: Type of Event
      hint: null
      type: select_one
      options:
      - Corporate Event
      - Wedding Reception
      - Birthday Party
      - Private Celebration
      - Other
      required: true
    - id: 10
      name: event_duration
      label: Estimated Event Duration - hours
      hint: How long will the event last
      type: number
      options: []
      required: true
    - id: 11
      name: expected_guests
      label: Expected Number of Guests
      hint: Approximate guest count
      type: number
      options: []
      required: true
    - id: 12
      name: section_service
      label: -- Service Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: service_type
      label: Type of Service Needed
      hint: null
      type: select_multiple
      options:
      - Full Bar Service
      - Cocktail Menu Only
      - Mobile Bar
      - Mixologist Service
      - Setup and Cleanup
      required: true
    - id: 14
      name: bar_location
      label: Bar Location
      hint: Where will the bar be set up
      type: select_one
      options:
      - On premises
      - Off premises
      - TBD
      required: true
    - id: 15
      name: venue_address
      label: Event Venue Address
      hint: Full address or venue name
      type: text
      options: []
      required: true
    - id: 16
      name: section_preferences
      label: -- Drink Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: drink_preferences
      label: Preferred Drink Styles
      hint: Select all that apply
      type: select_multiple
      options:
      - Classic Cocktails
      - Modern Mixology
      - Craft Spirits
      - Wine Selection
      - Non-alcoholic
      - Beer
      - Champagne
      required: true
    - id: 18
      name: signature_drink
      label: Signature Cocktail Interest
      hint: Want a signature drink for your event
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Undecided
      required: true
    - id: 19
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: Any ingredients to avoid
      type: text
      options: []
      required: false
    - id: 20
      name: section_special
      label: -- Special Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: special_requests
      label: Special Requests or Customizations
      hint: Any custom requirements
      type: text
      options: []
      required: false
    - id: 22
      name: budget
      label: Approximate Budget per Person
      hint: Helps with menu recommendations
      type: select_one
      options:
      - Under 15 dollars
      - 15-25 dollars
      - 25-40 dollars
      - 40-60 dollars
      - Over 60 dollars
      required: false
    - id: 23
      name: additional_info
      label: Additional Information
      hint: Anything else we should know
      type: text
      options: []
      required: false
