      name: arrival_notes
      label: Arrival Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: special_requests
      label: Special Requests
      hint: null
      type: select_multiple
      options:
      - Breakfast
      - Lunch
      - Dinner
      - Other
      required: false
    - id: 12
      name: special_request_details
      label: Special Request Details
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: parking_details
      label: Parking Details
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - English
