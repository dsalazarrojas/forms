inputSchema:
  type: object
  properties:
    title: Guest Preparation Survey
    pages:
    - id: 1
      name: guest_type
      label: Guest Type
      hint: null
      type: select_one
      options:
      - Guest
      - Staff
      - Vendor
      - Other
      required: false
    - id: 2
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: accommodation_type
      label: Accommodation Type
      hint: null
      type: select_multiple
      options:
      - Hotel
      - Resort
      - Motel
      - Other
      required: false
    - id: 6
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: arrival_method
      label: Arrival Method
      hint: null
      type: select_one
      options:
