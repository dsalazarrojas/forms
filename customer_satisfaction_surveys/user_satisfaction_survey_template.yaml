description: A survey to gather feedback on employee satisfaction and overall workplace
  experience.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate communication from management?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel supported in your professional development?
  type: single
- options:
  - Communication
  - Work-life balance
  - Recognition
  - Career development
  - Resources
  - Management support
  text: Which of the following areas do you believe need improvement? (select all
    that apply)
  type: multiple
- text: What specific changes could improve your daily work experience?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: User satisfaction survey
