title: Customer feedback form
description: Generate a Customer feedback form survey for the "Customer satisfaction surveys" category. Use the template name: "Customer feedback form template".
questions:
  - text: Overall, how satisfied are you with customer feedback form?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Customer, Feedback, Form, Satisfaction]
  - text: How often do you interact with customer feedback form?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
