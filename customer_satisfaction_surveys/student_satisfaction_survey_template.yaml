description: Gather feedback to understand student satisfaction with various aspects
  of their academic experience and identify areas for improvement.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your academic experience at this institution?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate the clarity and timeliness of communication from the institution
    (e.g., faculty, administration)?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel adequately supported in your academic and career development?
  type: single
- options:
  - Quality of teaching
  - Course content
  - Campus facilities
  - Student support services
  - Social opportunities
  - Career services
  text: Which of the following aspects contribute most to your satisfaction? (select
    all that apply)
  type: multiple
- text: What is the most significant area you believe could improve your student experience?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: Student satisfaction survey
