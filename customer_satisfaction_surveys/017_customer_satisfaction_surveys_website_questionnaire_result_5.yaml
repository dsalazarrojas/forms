title: Website questionnaire
description: Generate a Website questionnaire survey for the "Customer satisfaction surveys" category. Use the template name: "Website questionnaire template".
questions:
  - text: Overall, how satisfied are you with website questionnaire?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Website, Questionnaire, Customer, Satisfaction]
  - text: How often do you interact with website questionnaire?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
