title: Customer service satisfaction survey
description: Generate a Customer service satisfaction survey survey for the "Customer satisfaction surveys" category. Use the template name: "Customer service satisfaction survey template".
questions:
  - text: Overall, how satisfied are you with customer service satisfaction survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Customer, Service, Satisfaction, Survey]
  - text: How often do you interact with customer service satisfaction survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
