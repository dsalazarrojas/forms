title: New member questionnaire
description: Generate a New member questionnaire survey for the "Customer satisfaction surveys" category. Use the template name: "New member questionnaire template".
questions:
  - text: Overall, how satisfied are you with new member questionnaire?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [New, Member, Questionnaire, Customer]
  - text: How often do you interact with new member questionnaire?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
