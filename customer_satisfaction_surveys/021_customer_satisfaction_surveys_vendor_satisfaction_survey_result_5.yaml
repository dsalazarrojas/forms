title: Vendor satisfaction survey
description: Generate a Vendor satisfaction survey survey for the "Customer satisfaction surveys" category. Use the template name: "Vendor satisfaction survey template".
questions:
  - text: Overall, how satisfied are you with vendor satisfaction survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Vendor, Satisfaction, Survey, Customer]
  - text: How often do you interact with vendor satisfaction survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
