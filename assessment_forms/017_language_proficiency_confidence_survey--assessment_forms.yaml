inputSchema:
  type: object
  properties:
    title: language_proficiency_confidence_survey
    pages:
    - id: 1
      name: intro
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: lang_abilities
      label: What are your language abilities?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: lang_skills_report
      label: How well do you feel about your language skills?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: confidence_levels
      label: What do you feel confident about your language level?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: lang_skills_assessment
      label: Which skills do you feel confident in?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: lang_skills_improvement
      label: Which skills do you feel need improvement?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: lang_skills_difficult
      label: What skills do you feel are difficult for you?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: lang_skills_improvement_areas
      label: What areas do you feel need improvement?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
