inputSchema:
  type: object
  properties:
    title: Construction Safety Training Quiz
    pages:
    - id: 1
      name: quiz_date
      label: Quiz Date
      hint: Date of assessment
      type: date
      options: []
      required: true
    - id: 2
      name: training_program
      label: Training Program
      hint: Which training is this quiz for
      type: select_one
      options:
      - General Safety Orientation
      - Fall Protection
      - Scaffolding Safety
      - Excavation Safety
      - Electrical Safety
      - Lockout Tagout
      - Confined Space
      - Crane and Rigging
      - Forklift Safety
      - Hazard Communication
      required: true
    - id: 3
      name: participant_name
      label: Participant Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 4
      name: employee_id
      label: Employee ID
      hint: Your employee number
      type: text
      options: []
      required: false
    - id: 5
      name: company_name
      label: Company Name
      hint: Your employer
      type: text
      options: []
      required: true
    - id: 6
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 7
      name: question_1
      label: What Is the Leading Cause of Death in Construction
      hint: Select the correct answer
      type: select_one
      options:
      - Electrocution
      - Falls
      - Struck-By Objects
      - Caught-In Between
      required: true
    - id: 8
      name: question_2
      label: At What Height Is Fall Protection Required
      hint: General industry standard
      type: select_one
      options:
      - 4 feet
      - 6 feet
      - 8 feet
      - 10 feet
      required: true
    - id: 9
      name: question_3
      label: What Are the Three Components of a Personal Fall Arrest System
      hint: Select the correct combination
      type: select_one
      options:
      - Harness, Lanyard, Anchor
      - Helmet, Gloves, Boots
      - Vest, Glasses, Mask
      - Rope, Belt, Hook
      required: true
    - id: 10
      name: question_4
      label: What Is the Required Slope for a Protective System in Type A Soil
      hint: Excavation safety
      type: select_one
      options:
      - 1 to 1
      - 1.5 to 1
      - 2 to 1
      - 3 to 1
      required: true
    - id: 11
      name: question_5
      label: What Minimum Distance Should Be Maintained from Overhead Power Lines
      hint: For lines up to 50kV
      type: select_one
      options:
      - 5 feet
      - 10 feet
      - 15 feet
      - 20 feet
      required: true
    - id: 12
      name: question_6
      label: What Does Lockout Tagout Protect Against
      hint: Select the primary hazard
      type: select_one
      options:
      - Chemical Exposure
      - Unexpected Equipment Energization
      - Falling Objects
      - Noise Exposure
      required: true
    - id: 13
      name: question_7
      label: What Is the Oxygen Level Considered Safe for Confined Space Entry
      hint: Percentage range
      type: select_one
      options:
      - 15.5 to 19.5 percent
      - 19.5 to 23.5 percent
      - 23.5 to 27.5 percent
      - Any Level Is Safe
      required: true
    - id: 14
      name: question_8
      label: What Is the Maximum Allowable Span for a 2x10 Scaffold Plank
      hint: Scaffold safety
      type: select_one
      options:
      - 6 feet
      - 8 feet
      - 10 feet
      - 12 feet
      required: true
    - id: 15
      name: question_9
      label: Who Can Operate a Crane on a Construction Site
      hint: Select the requirement
      type: select_one
      options:
      - Any Worker
      - Only Supervisors
      - Certified and Qualified Operator
      - Anyone with Experience
      required: true
    - id: 16
      name: question_10
      label: What Class of Fire Extinguisher Is Used for Electrical Fires
      hint: Fire safety classification
      type: select_one
      options:
      - Class A
      - Class B
      - Class C
      - Class D
      required: true
    - id: 17
      name: question_11
      label: What Is the Purpose of a Competent Person on Site
      hint: Select the definition
      type: select_one
      options:
      - To Do All the Work
      - To Identify Hazards and Take Corrective Action
      - To Train New Employees
      - To Write Reports
      required: true
    - id: 18
      name: question_12
      label: How Often Should Scaffolding Be Inspected
      hint: Select the frequency
      type: select_one
      options:
      - Weekly
      - Before Each Shift
      - Monthly
      - Only After Accidents
      required: true
    - id: 19
      name: question_13
      label: What Is the Maximum Load a Scaffold Can Hold
      hint: Select the correct capacity
      type: select_one
      options:
      - 2 Times the Maximum Intended Load
      - 3 Times the Maximum Intended Load
      - 4 Times the Maximum Intended Load
      - 5 Times the Maximum Intended Load
      required: true
    - id: 20
      name: question_14
      label: What Should Be Done Before Digging
      hint: Utility safety
      type: select_one
      options:
      - Start Digging Immediately
      - Call 811 to Locate Utilities
      - Ask a Coworker
      - Use a Metal Detector
      required: true
    - id: 21
      name: question_15
      label: True or False - You Can Remove Guardrails If They Are in the Way
      hint: Select true or false
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: total_correct
      label: Total Correct Answers
      hint: Number of questions answered correctly
      type: number
      options: []
      required: false
    - id: 23
      name: percentage_score
      label: Percentage Score
      hint: Final score percentage
      type: number
      options: []
      required: false
    - id: 24
      name: passing_grade
      label: Passing Grade
      hint: Did you achieve passing score
      type: select_one
      options:
      - Yes, Passed
      - No, Failed
      required: false
    - id: 25
      name: retake_required
      label: Retake Required
      hint: Is a retake needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 26
      name: participant_signature
      label: Participant Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 27
      name: proctor_name
      label: Proctor Name
      hint: Name of quiz proctor
      type: text
      options: []
      required: false
    - id: 28
      name: proctor_signature
      label: Proctor Signature
      hint: Type full name as signature
      type: text
      options: []
      required: false
