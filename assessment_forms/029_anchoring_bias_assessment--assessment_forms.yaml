inputSchema:
  type: object
  properties:
    title: Anchoring Bias Assessment
    pages:
    - id: 1
      name: section_instructions
      label: -- Assessment Instructions --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_id
      label: Participant ID
      hint: For anonymous tracking use a code
      type: text
      options: []
      required: false
    - id: 3
      name: initial_anchor
      label: Initial anchor presented
      hint: Numeric anchor provided in scenario
      type: number
      options: []
      required: true
    - id: 4
      name: estimate_after_anchor
      label: Participant estimate after anchor
      hint: Numeric response to the question
      type: number
      options: []
      required: true
    - id: 5
      name: reasoning
      label: Brief reasoning for estimate
      hint: Short explanation
      type: text
      options: []
      required: false
    - id: 6
      name: confidence_level
      label: Confidence level
      hint: Select from 1 to 5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 7
      name: demographics
      label: Demographic notes
      hint: Optional demographics for analysis
      type: text
      options: []
      required: false
    - id: 8
      name: consent
      label: Consent to use data for research
      hint: Select yes to consent
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
