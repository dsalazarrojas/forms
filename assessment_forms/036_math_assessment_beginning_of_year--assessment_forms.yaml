inputSchema:
  type: object
  properties:
    title: Math Assessment Beginning Of Year
    pages:
    - id: 1
      name: student_name
      label: Student's Name
      hint: Enter student's name
      type: text
      options: []
      required: true
    - id: 2
      name: correct_answers
      label: Number of Correct Answers
      hint: Enter number of correct answers
      type: number
      options: []
      required: true
    - id: 3
      name: addition_facts
      label: Does student understand addition facts?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: subtraction_facts
      label: Does student understand subtraction facts?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: current_grade
      label: Current Grade Level
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: contact_info
      label: Contact Information
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: problems_answered_correct
      label: Number of problems answered correctly
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: test_completion_time
      label: Time of Test Completion
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: multiplication_facts
      label: Does student understand multiplication facts?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: division_facts
      label: Does student understand division facts?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: new_student
      label: Is new student?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
