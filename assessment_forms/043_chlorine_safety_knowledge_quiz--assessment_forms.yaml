inputSchema:
  type: object
  properties:
    title: Chlorine Safety Knowledge Quiz
    pages:
    - id: 1
      name: participant_info
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department or Work Area
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: quiz_date
      label: Quiz Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: trainer_name
      label: Trainer or Supervisor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: chlorine_basics
      label: -- Chlorine Basics --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: question_1
      label: What is chlorine primarily used for in pool facilities
      hint: null
      type: select_one
      options:
      - Water disinfection
      - pH adjustment
      - Algae growth
      - Temperature control
      required: true
    - id: 9
      name: question_2
      label: Chlorine is a gas at room temperature
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: question_3
      label: What color gas does chlorine produce
      hint: null
      type: select_one
      options:
      - Clear
      - Yellow-green
      - White
      - Brown
      required: true
    - id: 11
      name: safety_hazards
      label: -- Safety Hazards --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: question_4
      label: What is the primary health hazard of chlorine exposure
      hint: null
      type: select_one
      options:
      - Respiratory irritation
      - Skin numbness
      - Vision loss
      - Hair loss
      required: true
    - id: 13
      name: question_5
      label: Chlorine exposure can cause
      hint: Select all that apply
      type: select_multiple
      options:
      - Coughing
      - Eye irritation
      - Shortness of breath
      - Chest pain
      - Increased energy
      required: true
    - id: 14
      name: question_6
      label: The lethal dose of chlorine gas is generally reached at concentrations
        above
      hint: null
      type: select_one
      options:
      - 1 ppm
      - 10 ppm
      - 100 ppm
      - 1000 ppm
      required: true
    - id: 15
      name: emergency_response
      label: -- Emergency Response --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: question_7
      label: If someone is exposed to chlorine gas, first aid is to
      hint: null
      type: select_one
      options:
      - Move to fresh air immediately
      - Give them water
      - Apply ice packs
      - Keep them warm
      required: true
    - id: 17
      name: question_8
      label: In case of chlorine spill, the area should be
      hint: null
      type: select_one
      options:
      - Evacuated and ventilated
      - Cleaned immediately
      - Left as is
      - Sealed off
      required: true
    - id: 18
      name: storage_handling
      label: -- Storage and Handling --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: question_9
      label: Chlorine should be stored
      hint: null
      type: select_one
      options:
      - In cool, dry, well-ventilated areas
      - Near heat sources for purity
      - In direct sunlight
      - Mixed with other chemicals
      required: true
    - id: 20
      name: question_10
      label: What protective equipment is needed when handling chlorine
      hint: null
      type: select_multiple
      options:
      - Gloves
      - Eye protection
      - Respiratory protection
      - Face shield
      - Apron
      required: true
    - id: 21
      name: compliance
      label: -- Compliance and Knowledge --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: question_11
      label: I have read and understand the chlorine safety manual
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: question_12
      label: I understand my workplace chlorine safety responsibilities
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: confidence_level
      label: How confident are you in your chlorine safety knowledge
      hint: Rate 1 (not confident) to 5 (very confident)
      type: number
      options: []
      required: true
    - id: 25
      name: quiz_completion
      label: I have completed this quiz
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
