inputSchema:
  type: object
  properties:
    title: Legitimate Interest Assessment Questionnaire
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: employment_status
      label: Employment status
      hint: null
      type: select_one
      options:
      - Employed
      - Self-employed
      - Unemployed
      - Student
      required: false
    - id: 7
      name: address
      label: Address
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: nationality
      label: Nationality
      hint: null
      type: select_multiple
      options:
      - US Citizen
      - Non-US Citizen
      - International
      required: false
    - id: 9
      name: employment_type
      label: Employment type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Freelance
      required: false
    - id: 10
      name: employment_length
      label: Employment length
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: date_of_hire
      label: Date of hire
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: employment_history
      label: Employment history
      hint: null
      type: select_multiple
      options:
      - 10 years
      - 5 years
      - 1-5 years
      - Less than 1 year
      required: false
