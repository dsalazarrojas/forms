inputSchema:
  type: object
  properties:
    title: Blood Draw Skills Assessment
    pages:
    - id: 1
      name: assessment_header
      label: Blood Draw Skills Assessment
      hint: Evaluate phlebotomy competency
      type: note
      options: []
      required: false
    - id: 2
      name: candidate_name
      label: Candidate Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: Staff ID number
      type: text
      options: []
      required: false
    - id: 4
      name: assessor_name
      label: Assessor Name
      hint: Evaluator name
      type: text
      options: []
      required: true
    - id: 5
      name: assessment_date
      label: Assessment Date
      hint: Date of evaluation
      type: date
      options: []
      required: true
    - id: 6
      name: candidate_experience
      label: Candidate Experience Level
      hint: Training status
      type: select_one
      options:
      - Student
      - New Hire
      - Less than 1 Year
      - 1-3 Years
      - Over 3 Years
      required: true
    - id: 7
      name: hand_hygiene
      label: Hand Hygiene
      hint: Proper hand washing technique
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 8
      name: ppe_usage
      label: PPE Usage
      hint: Proper glove and equipment use
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 9
      name: patient_identification
      label: Patient Identification
      hint: Correct ID verification
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 10
      name: vein_selection
      label: Vein Selection
      hint: Ability to locate suitable vein
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 11
      name: site_preparation
      label: Site Preparation
      hint: Proper cleaning technique
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 12
      name: equipment_setup
      label: Equipment Setup
      hint: Proper preparation of supplies
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 13
      name: needle_insertion
      label: Needle Insertion
      hint: Technique and angle
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 14
      name: tube_filling
      label: Tube Filling
      hint: Proper order and filling
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 15
      name: needle_removal
      label: Needle Removal
      hint: Safe withdrawal technique
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 16
      name: post_draw_care
      label: Post-Draw Care
      hint: Pressure and bandaging
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 17
      name: sample_labeling
      label: Sample Labeling
      hint: Accurate tube labeling
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 18
      name: safety_compliance
      label: Safety Compliance
      hint: Adherence to safety protocols
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 19
      name: patient_communication
      label: Patient Communication
      hint: Bedside manner and explanation
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 20
      name: overall_performance
      label: Overall Performance
      hint: General assessment
      type: select_one
      options:
      - Competent
      - Needs Practice
      - Not Competent
      required: true
    - id: 21
      name: areas_of_strength
      label: Areas of Strength
      hint: What did candidate do well
      type: text
      options: []
      required: true
    - id: 22
      name: areas_for_improvement
      label: Areas for Improvement
      hint: What needs work
      type: text
      options: []
      required: true
    - id: 23
      name: reassessment_needed
      label: Reassessment Needed
      hint: Is follow-up required
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 24
      name: assessor_signature
      label: Assessor Signature
      hint: Type name as signature
      type: text
      options: []
      required: true
    - id: 25
      name: candidate_signature
      label: Candidate Signature
      hint: Acknowledgment of results
      type: text
      options: []
      required: true
