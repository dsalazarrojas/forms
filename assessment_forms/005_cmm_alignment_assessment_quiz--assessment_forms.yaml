          - "Minimal management"
          - "Informal management"
          - "Formal procedures"
          - "Comprehensive management"
        required: false
      - id: 12
        name: process_improvement
        label: Is there a formal process improvement program?
        hint: null
        type: select_one
        options:
          - "No improvement program"
          - "Ad-hoc improvements"
          - "Some improvement initiatives"
          - "Formal improvement process"
          - "Continuous improvement culture"
        required: true
      - id: 13
        name: metrics_collection
        label: Are metrics actively collected and analyzed?
        hint: null
        type: select_one
        options:
          - "No metrics"
          - "Minimal metrics"
          - "Some metrics collected"
          - "Regular metrics program"
          - "Comprehensive metrics analysis"
        required: false
      - id: 14
        name: risk_management
        label: Are risks identified and managed proactively?
        hint: null
        type: select_one
        options:
          - "No risk management"
          - "Minimal risk awareness"
          - "Basic risk identification"
          - "Formal risk processes"
          - "Comprehensive risk management"
        required: true
      - id: 15
        name: training_program
