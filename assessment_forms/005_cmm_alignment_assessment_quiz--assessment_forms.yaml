          - "Level 2 - Repeatable"
          - "Level 3 - Defined"
          - "Level 4 - Managed"
          - "Level 5 - Optimizing"
        required: true
      - id: 17
        name: improvement_priorities
        label: Top areas needing improvement
        hint: List your recommendations for improvement
        type: text
        options: []
        required: false
      - id: 18
        name: additional_comments
        label: Additional Assessment Comments
        hint: null
        type: text
        options: []
        required: false
