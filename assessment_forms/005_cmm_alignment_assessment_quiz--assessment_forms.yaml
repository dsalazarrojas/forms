inputSchema:
  type: object
  properties:
    title: CMM Alignment Assessment Quiz
    pages:
      - id: 1
        name: assessor_name
        label: Assessor Name
        hint: Full name of the person conducting this assessment
        type: text
        options: []
        required: true
      - id: 2
        name: organization_name
        label: Organization Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: assessment_date
        label: Assessment Date
        hint: null
        type: date
        options: []
        required: true
      - id: 4
        name: department_assessed
        label: Department or Team Being Assessed
        hint: null
        type: text
        options: []
        required: true
      - id: 5
        name: process_documentation
        label: Does your organization have documented processes?
        hint: null
        type: select_one
        options:
          - "Not at all"
          - "Minimal documentation"
          - "Some documentation"
          - "Most processes documented"
          - "All processes documented"
        required: true
      - id: 6
        name: process_communication
        label: Are processes effectively communicated to the team?
        hint: null
        type: select_one
        options:
          - "Not communicated"
          - "Poorly communicated"
          - "Somewhat communicated"
          - "Well communicated"
          - "Excellently communicated"
        required: true
      - id: 7
        name: process_adherence
        label: How well does the team adhere to documented processes?
        hint: null
        type: select_one
        options:
          - "Not followed"
          - "Rarely followed"
          - "Sometimes followed"
          - "Usually followed"
          - "Consistently followed"
        required: true
      - id: 8
        name: process_monitoring
        label: Are processes monitored and measured?
        hint: null
        type: select_one
        options:
          - "No monitoring"
          - "Minimal monitoring"
          - "Some monitoring"
          - "Adequate monitoring"
          - "Comprehensive monitoring"
        required: true
      - id: 9
        name: quality_assurance
        label: Is there a quality assurance function in place?
        hint: null
        type: select_one
        options:
          - "No QA function"
          - "Minimal QA"
          - "Basic QA activities"
          - "Formal QA processes"
          - "Comprehensive QA program"
        required: true
      - id: 10
        name: requirements_management
        label: How well are requirements managed and tracked?
        hint: null
        type: select_one
        options:
