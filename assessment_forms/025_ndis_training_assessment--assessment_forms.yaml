inputSchema:
  type: object
  properties:
    title: NDIS Training Assessment
    pages:
    - id: 1
      name: session_feedback
      label: Session Feedback
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: session_outcomes
      label: Session Outcomes
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: training_provider
      label: Training Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: evaluation_form
      label: Evaluation Form
      hint: null
      type: text
      options: []
      required: false
