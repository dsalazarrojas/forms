      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: skills_assessment
      label: Skills Assessment
      hint: Select all skills that apply
      type: select_multiple
      options:
      - skill 1
      - skill 2
      - skill 3
