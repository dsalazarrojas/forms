inputSchema:
  type: object
  properties:
    title: Filter Theory Questionnaire
    pages:
    - id: 1
      name: familiarity
      label: How familiar are you with filter theory?
      hint: Please describe your experience with filter theory.
      type: text
      options: []
      required: true
    - id: 2
      name: understanding
      label: Can you briefly describe filter theory in your own words?
      hint: Please keep it concise.
      type: text
      options: []
      required: true
    - id: 3
      name: application
      label: How do you apply filter theory in your work or studies?
      hint: Please provide a specific example.
      type: text
      options: []
      required: true
    - id: 4
      name: submission_results
      label: What do you believe are the most important results of applying filter
        theory?
      hint: Think about your work or studies.
      type: select_one
      options:
      - Consistent Results
      - Inconsistent Results
      - None
      required: true
    - id: 5
      name: educators
      label: Which group do you think is most interested in filter theory?
      hint: Please choose one.
      type: select_one
      options:
      - Educators
      - Trainers
      - Researchers
      required: true
    - id: 6
      name: trainers
      label: Which group is most likely to use filter theory in their work?
      hint: Please choose one.
      type: select_one
      options:
      - Trainers
      - Educators
      - Researchers
      required: true
    - id: 7
      name: ideal_users
      label: Which group do you think would benefit most from filter theory?
      hint: Please choose one.
      type: select_one
      options:
      - For Educators
      - For Trainers
      - For Researchers
      required: true
    - id: 8
      name: submission_results_ideal
      label: What ideal results would you expect from applying filter theory?
      hint: Think about your ideal outcomes.
      type: text
      options: []
      required: true
    - id: 9
      name: consistent_results_ideal
      label: What ideal results would you expect to be consistent from applying filter
        theory?
      hint: Think about your ideal outcomes.
      type: text
      options: []
      required: true
    - id: 10
      name: real_world_ideal
      label: How would you apply filter theory in real-world scenarios?
      hint: Please describe a real-world example.
      type: text
      options: []
      required: true
