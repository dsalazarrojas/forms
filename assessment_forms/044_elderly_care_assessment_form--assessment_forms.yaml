inputSchema:
  type: object
  properties:
    title: Elderly Care Assessment Form
    pages:
    - id: 1
      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: medications
      label: Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: physical_functioning
      label: Physical Functioning
      hint: null
      type: select_one
      options:
      - Very Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - Arthritis
      - Diabetes
      - High Blood Pressure
      - Heart Disease
      - Stroke
      required: false
    - id: 5
      name: contact_information
      label: Contact Information
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: caregiver_support_system
      label: Caregiver Support System
      hint: null
      type: select_multiple
      options:
      - Formal
      - Informal
      - Both
      required: false
    - id: 8
      name: home_environment
      label: Home Environment
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: living_arrangements
      label: Living Arrangements
      hint: null
      type: select_multiple
      options:
      - Live with Family
      - Live Alone
      - Live in Facility
      required: false
