inputSchema:
  type: object
  properties:
    title: Vascular Health Assessment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: height
      label: Height
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: symptom_1
      label: Symptom 1
      hint: null
      type: select_one
      options:
      - Chest Pain
      - Dizziness
      required: false
    - id: 6
      name: symptom_2
      label: Symptom 2
      hint: null
      type: select_one
      options:
      - Headache
      - Shortness of Breath
      required: false
    - id: 7
      name: symptom_3
      label: Symptom 3
      hint: null
      type: select_multiple
      options:
      - Chest Pain
      - Dizziness
      - Headache
      required: false
    - id: 8
      name: consent_to_share_data
      label: Consent to Share Data
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
