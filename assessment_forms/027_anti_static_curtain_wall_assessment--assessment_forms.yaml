inputSchema:
  type: object
  properties:
    title: Anti Static Curtain Wall Assessment
    pages:
    - id: 1
      name: section_assessment
      label: -- Assessment Summary --
      hint: Document findings related to curtain wall ESD performance
      type: note
      options: []
      required: false
    - id: 2
      name: site_name
      label: Site name or location
      hint: Building or room identifier
      type: text
      options: []
      required: true
    - id: 3
      name: assessor
      label: Assessor name
      hint: Person conducting the assessment
      type: text
      options: []
      required: true
    - id: 4
      name: assessment_date
      label: Assessment date
      hint: Date assessment performed
      type: date
      options: []
      required: true
    - id: 5
      name: curtain_wall_condition
      label: Curtain wall condition
      hint: Visual and tactile inspection results
      type: select_one
      options:
      - Compliant
      - Minor issues
      - Major issues
      - Requires replacement
      required: true
    - id: 6
      name: esd_resistance_test
      label: ESD resistance test result
      hint: Measured resistance value or pass fail
      type: text
      options: []
      required: false
    - id: 7
      name: recommended_actions
      label: Recommended corrective actions
      hint: Steps to remediate any issues found
      type: text
      options: []
      required: false
    - id: 8
      name: follow_up_required
      label: Follow up required
      hint: Indicate if further inspections are needed
      type: select_one
      options:
      - 'False'
      - Yes schedule follow up
      required: false
