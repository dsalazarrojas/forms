inputSchema:
  type: object
  properties:
    title: Wheelchair Usage Assessment Checklist
    pages:
    - id: 1
      name: patient_details
      label: Patient Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: mobility_level
      label: Mobility Level
      hint: null
      type: select_one
      options:
      - Wheelchair User
      - Non-Wheelchair User
      required: false
    - id: 3
      name: wheelchair_usage
      label: Wheelchair Usage
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: user_capacities
      label: User Capacities
      hint: null
      type: select_multiple
      options:
      - Wheelchair User
      - Independent
      - Needs Assistance
      - Has Difficulty
      - Has Limitations
      - Has a Medical Condition
      required: false
    - id: 5
      name: support_needs
      label: Support Needs
      hint: null
      type: select_multiple
      options:
      - Needs Assistance
      - Has Difficulty
      - No Support Needed
      required: false
    - id: 6
      name: equipment_needs
      label: Equipment Needs
      hint: null
      type: select_multiple
      options:
      - Manual Wheelchair
      - Power Wheelchair
      - Tilt Wheelchair
      - Other
      required: false
    - id: 7
      name: safety_concerns
      label: Safety Concerns
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: other_notes
      label: Other Notes
      hint: null
      type: note
      options: []
