      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: healthcare_provider_comments
      label: Health Care Provider Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: healthcare_provider_recommendations
      label: Health Care Provider Recommendations
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: follow_up_plan
      label: Follow-Up Plan
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: follow_up_date
      label: Follow-Up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: follow_up_time
