inputSchema:
  type: object
  properties:
    title: Startup Progress Assessment
    pages:
    - id: 1
      name: startup_stage
      label: Current Stage
      hint: null
      type: select_one
      options:
      - Early Stage
      - Growth Stage
      - Established Stage
      - Mature Stage
      required: false
    - id: 2
      name: milestones_achieved
      label: Milestones Achieved
      hint: null
      type: select_multiple
      options:
      - Product-Market Fit
      - Revenue Runway Established
      - Traction
      - Regulatory Approval
      - Funding
      - User Acquisition
      - Market Share
      - Product Development
      required: false
    - id: 3
      name: challenges
      label: Challenges Faced
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: short_term_goals
      label: Short-Term Goals
      hint: null
      type: select_multiple
      options:
      - Product Development
      - Revenue Growth
      - Team Building
      - Marketing
      - Sales
      - Customer Acquisition
      required: false
    - id: 5
      name: startup_progress
      label: Self-Assessment of Progress
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: review_frequency
      label: Review Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Biweekly
      - Monthly
      - Quarterly
      - Biannually
      - Annually
      required: false
    - id: 7
      name: mentoring_needed
      label: Mentoring Needs
      hint: null
      type: select_multiple
      options:
      - Strategy
      - Operations
      - Product Development
      - Funding
      - Regulatory
      - Team Building
      - Marketing
      - Sales
      - Customer Acquisition
      required: false
    - id: 8
      name: review_comments
      label: Review Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: reviewer_comments
      label: Reviewer Comments
      hint: null
      type: text
      options: []
      required: false
