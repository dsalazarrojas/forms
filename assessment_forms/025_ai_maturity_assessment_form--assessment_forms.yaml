inputSchema:
  type: object
  properties:
    title: AI Maturity Assessment Form
    pages:
    - id: 1
      name: org_info_header
      label: '--- Organizational Context ---'
      hint: Define the scope of the assessment.
      type: note
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization / Department Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_role
      label: Respondent's Role
      hint: e.g., CTO, Head of AI, Operations Manager
      type: text
      options: []
      required: true
    - id: 4
      name: industry_type
      label: Industry Sector
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_data_header
      label: '--- Dimension 1: Data Maturity ---'
      hint: Evaluate your organization's data readiness.
      type: note
      options: []
      required: false
    - id: 6
      name: data_accessibility_rating
      label: Data Accessibility & Silos
      hint: 1 = Highly siloed/inaccessible, 5 = Centrally accessible data lake
      type: select_one
      options:
      - 1 - Minimal/No access
      - 2 - Difficult/Manual access
      - 3 - Moderate/Partial centralization
      - 4 - Good/Most data accessible
      - 5 - Optimal/Automated data pipelines
      required: true
    - id: 7
      name: data_quality_rating
      label: Data Quality & Governance
      hint: 1 = Poor/Noisy, 5 = High accuracy/Standardized
      type: select_one
      options:
      - 1 - Ad-hoc/Poor
      - 2 - Basic/Manual checks
      - 3 - Consistent/Defined standards
      - 4 - High Quality/Validated
      - 5 - Exceptional/Automated validation
      required: true
    - id: 8
      name: section_infra_header
      label: '--- Dimension 2: Infrastructure & Technology ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: mlops_maturity_rating
      label: MLOps & Lifecycle Management
      hint: Ability to deploy, monitor, and retrain models.
      type: select_one
      options:
      - 1 - No MLOps (Manual only)
      - 2 - Basic version control
      - 3 - Repeatable deployment process
      - 4 - Automated CI/CD for models
      - 5 - Advanced/Self-healing systems
      required: true
    - id: 10
      name: section_talent_header
      label: '--- Dimension 3: Talent & Culture ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: ai_skills_availability
      label: In-house AI Expertise
      hint: Availability of data scientists, ML engineers, etc.
      type: select_one
      options:
      - None (Outsourced only)
      - Small/Incubating team
      - Growing/Core capabilities
      - Strong/Distributed expertise
      - World-class/Industry leading
      required: true
    - id: 12
      name: leadership_ai_literacy
      label: Executive AI Literacy & Support
      hint: Do leaders understand AI value and risks?
      type: select_one
      options:
      - 1 - Low/Skeptical
      - 2 - Interested/Basic understanding
      - 3 - Supportive/Strategic focus
      - 4 - Highly literate/Actively driving
      - 5 - Visionary/Core to identity
      required: true
    - id: 13
      name: section_strategy_header
      label: '--- Dimension 4: Strategy & Governance ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: ai_roadmap_existence
      label: AI Vision and Roadmap
      hint: Clear plan for AI implementation over time.
      type: select_one
      options:
      - No roadmap exists
      - Short-term/Project-based only
      - Defined 1-3 year roadmap
      - Integrated multi-year transformational plan
      required: true
    - id: 15
      name: ethical_guidelines_status
      label: Ethical AI & Compliance Framework
      hint: Processes for bias audit, privacy, and safety.
      type: select_one
      options:
      - None
      - Informally followed
      - Formally documented & training provided
      - Strict enforcement & auditing in place
      required: true
    - id: 16
      name: current_models_count
      label: Current Number of AI Models in Production
      hint: null
      type: integer
      options: []
      required: true
    - id: 17
      name: biggest_scaling_bottleneck
      label: Primary Bottleneck to Scaling AI
      hint: null
      type: select_one
      options:
      - Data Quality / Availability
      - Budget / Funding
      - Talent / Skill Gap
      - Legacy Infrastructure
      - Culture / Resistance to Change
      - Regulatory / Legal Concerns
      required: true
    - id: 18
      name: assessment_summary
      label: Additional Comments on Organizational Readiness
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: date_of_assessment
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: report_request_email
      label: Email for Detailed Maturity Report
      hint: null
      type: email
      options: []
      required: true
