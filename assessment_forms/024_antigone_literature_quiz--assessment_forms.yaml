inputSchema:
  type: object
  properties:
    title: Antigone Literature Quiz
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: ID number if applicable
      type: text
      options: []
      required: false
    - id: 3
      name: course_name
      label: Course Name
      hint: Class or course
      type: text
      options: []
      required: true
    - id: 4
      name: instructor_name
      label: Instructor Name
      hint: Teacher or professor
      type: text
      options: []
      required: true
    - id: 5
      name: quiz_date
      label: Quiz Date
      hint: Date of quiz
      type: date
      options: []
      required: true
    - id: 6
      name: question_1
      label: Who is the author of Antigone
      hint: Select the correct answer
      type: select_one
      options:
      - Sophocles
      - Euripides
      - Aeschylus
      - Aristophanes
      required: true
    - id: 7
      name: question_2
      label: In which ancient city is Antigone set
      hint: Select the correct answer
      type: select_one
      options:
      - Athens
      - Thebes
      - Sparta
      - Corinth
      required: true
    - id: 8
      name: question_3
      label: Who is Antigone's father
      hint: Select the correct answer
      type: select_one
      options:
      - Creon
      - Oedipus
      - Polynices
      - Haemon
      required: true
    - id: 9
      name: question_4
      label: What does Antigone want to do that is forbidden
      hint: Select the correct answer
      type: select_one
      options:
      - Marry Creon
      - Bury her brother Polynices
      - Leave Thebes
      - Kill Haemon
      required: true
    - id: 10
      name: question_5
      label: Who is the ruler of Thebes at the start of the play
      hint: Select the correct answer
      type: select_one
      options:
      - Oedipus
      - Polynices
      - Creon
      - Eteocles
      required: true
    - id: 11
      name: question_6
      label: What is Antigone's relationship to Ismene
      hint: Select the correct answer
      type: select_one
      options:
      - Mother and daughter
      - Sisters
      - Cousins
      - Friends
      required: true
    - id: 12
      name: question_7
      label: Who is Haemon
      hint: Select the correct answer
      type: select_one
      options:
      - Antigone's brother
      - Creon's son
      - The prophet
      - The guard
      required: true
    - id: 13
      name: question_8
      label: What punishment does Creon decree for burying Polynices
      hint: Select the correct answer
      type: select_one
      options:
      - Exile
      - Death by stoning
      - Imprisonment
      - Fine
      required: true
    - id: 14
      name: question_9
      label: Who tries to persuade Creon to change his mind
      hint: Select the correct answer
      type: select_one
      options:
      - Ismene only
      - Haemon and Tiresias
      - The Chorus only
      - No one
      required: true
    - id: 15
      name: question_10
      label: What happens to Antigone at the end of the play
      hint: Select the correct answer
      type: select_one
      options:
      - She escapes
      - She is pardoned
      - She hangs herself
      - She marries Haemon
      required: true
    - id: 16
      name: question_11
      label: Who is Tiresias
      hint: Select the correct answer
      type: select_one
      options:
      - A soldier
      - A blind prophet
      - A priest
      - A messenger
      required: true
    - id: 17
      name: question_12
      label: What theme is central to Antigone
      hint: Select the correct answer
      type: select_one
      options:
      - Love and romance
      - Duty vs personal conscience
      - War and peace
      - Wealth and poverty
      required: true
    - id: 18
      name: question_13
      label: What happens to Haemon
      hint: Select the correct answer
      type: select_one
      options:
      - He exiles himself
      - He kills himself
      - He kills Creon
      - He marries Ismene
      required: true
    - id: 19
      name: question_14
      label: What happens to Creon's wife Eurydice
      hint: Select the correct answer
      type: select_one
      options:
      - She exiles herself
      - She kills herself
      - She forgives Creon
      - She becomes ruler
      required: true
    - id: 20
      name: question_15
      label: What literary device is used extensively in Antigone
      hint: Select the correct answer
      type: select_one
      options:
      - Metaphor
      - Dramatic irony
      - Simile
      - Alliteration
      required: true
    - id: 21
      name: essay_question
      label: Essay Question - Discuss the conflict between divine law and human law
        in Antigone
      hint: Write a short essay response
      type: text
      options: []
      required: true
    - id: 22
      name: confidence_level
      label: Confidence Level
      hint: How confident are you in your answers
      type: select_one
      options:
      - Very confident
      - Confident
      - Somewhat confident
      - Not confident
      required: true
    - id: 23
      name: time_spent
      label: Time Spent on Quiz
      hint: Approximate minutes
      type: number
      options: []
      required: false
    - id: 24
      name: additional_comments
      label: Additional Comments
      hint: Any thoughts on the quiz
      type: text
      options: []
      required: false
