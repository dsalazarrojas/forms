inputSchema:
  type: object
  properties:
    title: Step Hazard Assessment
    pages:
    - id: 1
      name: hazard_rating
      label: Hazard rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: stairway_condition
      label: Stairway condition
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: hazard_description
      label: Hazard description
      hint: null
      type: text
      options: []
