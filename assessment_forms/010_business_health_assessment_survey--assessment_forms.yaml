inputSchema:
  type: object
  properties:
    title: Business Health Assessment Survey
    pages:
      - id: 1
        name: header
        label: -- Company Overview --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: organization_name
        label: Organization name
        hint: Name of the company
        type: text
        options: []
        required: true
      - id: 3
        name: respondent_role
        label: Respondent role
        hint: Job title or position
        type: text
        options: []
        required: true
      - id: 4
        name: financial_stability
        label: Financial stability
        hint: Rate current financial stability
        type: select_one
        options:
          - Poor
          - Fair
          - Good
          - Excellent
        required: true
      - id: 5
        name: operational_efficiency
        label: Operational efficiency
        hint: Rate operational efficiency
        type: select_one
        options:
          - Poor
          - Fair
          - Good
          - Excellent
        required: true
      - id: 6
        name: customer_satisfaction
        label: Customer satisfaction
        hint: Rate customer satisfaction levels
        type: select_one
        options:
          - Low
          - Moderate
          - High
        required: true
      - id: 7
        name: major_challenges
        label: Major challenges
        hint: List the main challenges facing the business
        type: text
        options: []
        required: false
      - id: 8
        name: strategic_priorities
        label: Strategic priorities
        hint: Select up to three strategic priorities
        type: select_multiple
        options:
          - Revenue growth
          - Cost reduction
          - Talent development
          - Digital transformation
          - Market expansion
        required: false
      - id: 9
        name: readiness_for_change
        label: Readiness for change
        hint: Rate organizational readiness for change
        type: select_one
        options:
          - Not ready
          - Somewhat ready
          - Ready
          - Very ready
        required: true
      - id: 10
        name: additional_comments
        label: Additional comments
        hint: Any other notes for the consultant
        type: text
        options: []
        required: false
