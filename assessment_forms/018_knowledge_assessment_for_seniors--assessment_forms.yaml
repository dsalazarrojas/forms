inputSchema:
  type: object
  properties:
    title: Knowledge Assessment For Seniors
    pages:
    - id: 1
      name: physical_health
      label: How would you rate your overall health?
      hint: Please select one of the options below.
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: mental_health
      label: How would you rate your mental health?
      hint: Please select one of the options below.
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: medication
      label: Do you take any prescription medication?
      hint: Please answer "Yes" or "No".
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 4
      name: daily_activity
      label: Are you able to perform daily activities like bathing, dressing, and
        cooking?
      hint: Please answer "Yes" or "No".
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: social_support
      label: How much support do you have from family and friends?
      hint: Please select one of the options below.
      type: select_multiple
      options:
      - Family members often visit me
      - I visit family members often
      - Friends often visit me
      - I visit friends often
      - None
      required: true
    - id: 6
      name: memory_function
      label: How would you rate your memory function?
      hint: Please select one of the options below.
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: cognitive_status
      label: Are you experiencing any cognitive decline?
      hint: Please answer "Yes" or "No".
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: hearing
      label: Do you have difficulty hearing?
      hint: Please answer "Yes" or "No".
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: vision
      label: Do you have difficulty seeing?
      hint: Please answer "Yes" or "No".
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: note
      label: Additional notes
      hint: Please provide any additional comments or concerns.
      type: note
      options: []
      required: false
