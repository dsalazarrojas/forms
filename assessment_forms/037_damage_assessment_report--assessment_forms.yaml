inputSchema:
  type: object
  properties:
    title: Damage Assessment Report
    pages:
    - id: 1
      name: damage_assessment_form
      label: Assessment Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: assessor_name
      label: Assessor Name
      hint: Enter the name of the individual or organization conducting the assessment
      type: text
      options: []
      required: false
    - id: 3
      name: assessor_email
      label: Assessor Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: assessor_phone
      label: Assessor Phone
      hint: Enter the phone number of the Assessor
      type: text
      options: []
      required: false
    - id: 5
      name: damage_type
      label: Damage Type
      hint: Select one of the following options
      type: select_one
      options:
      - Physical Damage
      - Property Damage
      - Financial Loss
      required: true
    - id: 6
      name: damage_date
      label: Damage Date
      hint: Date the damage occurred
      type: date
      options: []
      required: false
    - id: 7
      name: damage_time
