inputSchema:
  type: object
  properties:
    title: Business Resilience Assessment Survey
    pages:
    - id: 1
      name: respondent_name
      label: Assessment Respondent Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: business_name
      label: Business Name
      hint: Name of the organization
      type: text
      options: []
      required: true
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: Date of this assessment
      type: date
      options: []
      required: true
    - id: 4
      name: business_size
      label: Business Size
      hint: Number of employees
      type: select_one
      options:
      - Micro (1-9 employees)
      - Small (10-49 employees)
      - Medium (50-249 employees)
      - Large (250+ employees)
      required: true
    - id: 5
      name: years_operating
      label: Years in Operation
      hint: How long has the business existed
      type: number
      options: []
      required: false
    - id: 6
      name: strategic_planning
      label: Strategic Planning and Goals
      hint: How clear are your strategic goals
      type: select_one
      options:
      - Well Defined
      - Clear
      - Somewhat Clear
      - Unclear
      - Not Defined
      required: true
    - id: 7
      name: risk_assessment
      label: Risk Assessment and Mitigation
      hint: Do you have risk management in place
      type: select_one
      options:
      - Comprehensive Plan
      - Good Plan
      - Basic Plan
      - Limited Plan
      - No Plan
      required: true
    - id: 8
      name: crisis_management
      label: Crisis Management Procedures
      hint: Do you have crisis procedures
      type: select_one
      options:
      - Well Established
      - Established
      - Developing
      - Minimal
      - None
      required: true
    - id: 9
      name: financial_reserves
      label: Financial Reserves
      hint: Do you have emergency financial reserves
      type: select_one
      options:
      - 6+ months
      - 3-6 months
      - 1-3 months
      - Less than 1 month
      - None
      required: true
    - id: 10
      name: supply_chain_resilience
      label: Supply Chain Resilience
      hint: How resilient is your supply chain
      type: select_one
      options:
      - Very Resilient
      - Resilient
      - Adequately Resilient
      - Somewhat Vulnerable
      - Very Vulnerable
      required: true
    - id: 11
      name: technology_backup
      label: Technology and Data Backup Systems
      hint: Do you have backup systems
      type: select_one
      options:
      - Comprehensive
      - Good
      - Adequate
      - Limited
      - None
      required: true
    - id: 12
      name: workforce_capability
      label: Workforce Capability and Skills
      hint: Can your team handle disruptions
      type: select_one
      options:
      - Highly Capable
      - Capable
      - Adequately Capable
      - Somewhat Limited
      - Limited
      required: true
    - id: 13
      name: leadership_strength
      label: Leadership Strength
      hint: Is your leadership prepared for challenges
      type: select_one
      options:
      - Very Strong
      - Strong
      - Adequate
      - Weak
      - Very Weak
      required: true
    - id: 14
      name: stakeholder_relationships
      label: Stakeholder Relationships
      hint: Strength of relationships with partners
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 15
      name: adaptability
      label: Business Adaptability
      hint: Can you quickly adapt to changes
      type: select_one
      options:
      - Very Adaptable
      - Adaptable
      - Moderately Adaptable
      - Limited Adaptability
      - Rigid
      required: true
    - id: 16
      name: recovery_time_objective
      label: Recovery Time Objective (RTO)
      hint: How quickly can you recover from disruption
      type: select_one
      options:
      - Hours
      - 1 day
      - 2-3 days
      - 1 week
      - More than 1 week
      required: false
    - id: 17
      name: resilience_score_self
      label: Self-assessed Resilience Score (1-10)
      hint: Rate your overall resilience
      type: number
      options: []
      required: true
    - id: 18
      name: improvement_priorities
      label: Top Resilience Improvement Priorities
      hint: What areas need most improvement
      type: text
      options: []
      required: true
    - id: 19
      name: resource_needs
      label: Resources Needed for Improvement
      hint: What support would help
      type: select_multiple
      options:
      - Consulting Services
      - Training Programs
      - Technology Investment
      - Financial Support
      - Process Improvement
      - Other
      required: false
