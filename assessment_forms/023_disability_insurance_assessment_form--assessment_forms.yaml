inputSchema:
  type: object
  properties:
    title: Disability Insurance Assessment Form
    pages:
    - id: 1
      name: assessment
      label: Assessment
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: insurance_agent
      label: Insurance Agent
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: client
      label: Client
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: medical_condition
      label: Medical Condition
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: disability_start_date
      label: Disability Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: insurance_provider
      label: Insurance Provider
      hint: null
      type: select_multiple
      options:
      - State Farm
      - New York Life
      - Pacific Life
      required: true
    - id: 8
      name: other_providers
      label: Other Providers
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: medical_history
      label: Medical History
      hint: Please list medical conditions that have impacted your ability to work
      type: text
      options: []
      required: true
    - id: 10
      name: income
      label: Income
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: occupation
      label: Occupation
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Employed
      - Self-Employed
      - Unemployed
      required: true
    - id: 13
      name: investment
      label: Investment
      hint: How much do you want to invest per month in disability insurance?
      type: number
      options: []
      required: true
    - id: 14
      name: investment_frequency
      label: Frequency
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-Weekly
      - Monthly
      required: true
    - id: 15
      name: investment_option
      label: Option
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: true
    - id: 16
      name: consent
      label: I do not agree
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 17
      name: consent_other
      label: Other
      hint: null
      type: text
      options: []
      required: false
