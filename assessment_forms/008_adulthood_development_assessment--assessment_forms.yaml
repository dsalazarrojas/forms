inputSchema:
  type: object
  properties:
    title: Adulthood Development Assessment
    pages:
    - id: 1
      name: assessment_overview_section
      label: -- Assessment Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: assessed_individual_name
      label: Assessed Individual Name
      hint: Full name of the person being assessed
      type: text
      options: []
      required: true
    - id: 3
      name: assessor_name
      label: Assessor Name
      hint: Name of the professional conducting the assessment
      type: text
      options: []
      required: true
    - id: 4
      name: assessment_date
      label: Assessment Date
      hint: Date when the assessment is being conducted
      type: date
      options: []
      required: true
    - id: 5
      name: demographic_information_section
      label: -- Demographic Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: age_group
      label: Age Group
      hint: Select the age range of the individual being assessed
      type: select_one
      options: ["Early adulthood (18-25)", "Young adulthood (26-35)", "Middle adulthood (36-50)", "Late middle adulthood (51-65)", "Late adulthood (65+)"]
      required: true
    - id: 7
      name: education_level
      label: Education Level
      hint: Highest level of education completed
      type: select_one
      options: ["High school diploma", "Some college", "Bachelor's degree", "Master's degree", "Doctoral degree", "Other"]
      required: true
    - id: 8
      name: employment_status
      label: Employment Status
      hint: Current employment situation
      type: select_one
      options: ["Employed full-time", "Employed part-time", "Self-employed", "Unemployed", "Student", "Retired"]
      required: true
    - id: 9
      name: independence_assessment_section
      label: -- Independence Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: financial_management
      label: Financial Management
      hint: Ability to manage personal finances independently
      type: select_one
      options: ["Completely independent", "Mostly independent", "Needs occasional support", "Needs frequent support", "Dependent on others"]
      required: true
    - id: 11
      name: household_management
      label: Household Management
      hint: Ability to manage daily household tasks
      type: select_one
      options: ["Completely independent", "Mostly independent", "Needs occasional support", "Needs frequent support", "Dependent on others"]
      required: true
    - id: 12
      name: transportation_independence
      label: Transportation Independence
      hint: Ability to navigate transportation systems independently
      type: select_one
      options: ["Completely independent", "Mostly independent", "Needs occasional support", "Needs frequent support", "Dependent on others"]
      required: true
