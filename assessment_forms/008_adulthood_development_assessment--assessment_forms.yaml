      hint: Ability to form and maintain healthy relationships
      type: select_one
      options: ["Strong abilities", "Good abilities", "Developing abilities", "Needs support", "Significant challenges"]
      required: true
    - id: 15
      name: communication_skills
      label: Communication Skills
      hint: Effectiveness in verbal and non-verbal communication
      type: select_one
      options: ["Excellent", "Good", "Adequate", "Needs improvement", "Poor"]
      required: true
    - id: 16
      name: emotional_regulation
      label: Emotional Regulation
      hint: Ability to manage emotions appropriately
      type: select_one
      options: ["Excellent", "Good", "Adequate", "Needs improvement", "Poor"]
      required: true
    - id: 17
      name: career_development_section
      label: -- Career Development --
      hint: null
      type: note
      options: []
