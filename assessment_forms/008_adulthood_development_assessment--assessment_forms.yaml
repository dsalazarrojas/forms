    - id: 19
      name: professional_skills
      label: Professional Skills
      hint: Competency in workplace-relevant skills
      type: select_one
      options: ["Advanced", "Proficient", "Competent", "Developing", "Needs significant development"]
      required: true
    - id: 20
      name: assessment_summary
      label: Assessment Summary
      hint: Overall summary and recommendations from the assessment
      type: text
      options: []
      required: false
