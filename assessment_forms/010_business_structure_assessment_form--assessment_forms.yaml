inputSchema:
  type: object
  properties:
    title: Business Structure Assessment Form
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_email
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company Name
      hint: Organization or department name
      type: text
      options: []
      required: true
    - id: 4
      name: your_role
      label: Your Role or Title
      hint: Position in the organization
      type: text
      options: []
      required: true
    - id: 5
      name: tenure_years
      label: How long have you been with the company?
      hint: In years
      type: number
      options: []
      required: false
    - id: 6
      name: organizational_level
      label: Your Organizational Level
      hint: null
      type: select_one
      options:
      - Executive or C-suite
      - Senior management
      - Middle management
      - Team lead or supervisor
      - Individual contributor
      - Other
      required: true
    - id: 7
      name: current_structure_clarity
      label: How clearly defined is the current organizational structure?
      hint: null
      type: select_one
      options:
      - Very clear
      - Clear
      - Somewhat clear
      - Unclear
      - Very unclear
      required: true
    - id: 8
      name: reporting_relationships
      label: Are reporting relationships well understood?
      hint: null
      type: select_one
      options:
      - Completely understood
      - Mostly understood
      - Partially understood
      - Poorly understood
      - Not understood at all
      required: true
    - id: 9
      name: structure_effectiveness
      label: How effective is the current structure?
      hint: null
      type: select_one
      options:
      - Very effective
      - Effective
      - Neutral
      - Ineffective
      - Very ineffective
      required: true
    - id: 10
      name: structure_issues
      label: What are the main structural issues?
      hint: Select all that apply
      type: select_multiple
      options:
      - Unclear roles and responsibilities
      - Inefficient decision-making
      - Silos between departments
      - Overlapping responsibilities
      - Too many management layers
      - Lack of accountability
      - Poor communication channels
      - No significant issues
      required: true
    - id: 11
      name: decision_speed
      label: How quickly are decisions made?
      hint: null
      type: select_one
      options:
      - Too fast - lacks proper review
      - Appropriately fast
      - Too slow - bureaucratic
      - Varies widely
      required: true
    - id: 12
      name: communication_effectiveness
      label: How effective is internal communication?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Adequate
      - Poor
      - Very poor
      required: true
    - id: 13
      name: collaboration_across_teams
      label: How well do teams collaborate across departments?
      hint: null
      type: select_one
      options:
      - Excellent collaboration
      - Good collaboration
      - Some collaboration
      - Limited collaboration
      - No collaboration
      required: true
    - id: 14
      name: management_efficiency
      label: Are you appropriately managed?
      hint: null
      type: select_one
      options:
      - Over-managed
      - Appropriately managed
      - Under-managed
      - No clear management
      required: true
    - id: 15
      name: accountability_clarity
      label: Is accountability clear in your area?
      hint: null
      type: select_one
      options:
      - Very clear
      - Clear
      - Somewhat clear
      - Unclear
      - Not at all clear
      required: true
    - id: 16
      name: suggested_improvements
      label: What structural improvements would you recommend?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: restructuring_concerns
      label: What concerns do you have about potential restructuring?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: change_readiness
      label: How ready is the organization for change?
      hint: null
      type: select_one
      options:
      - Very ready
      - Ready
      - Somewhat ready
      - Not very ready
      - Not ready
      required: true
    - id: 19
      name: employee_morale
      label: How would you rate current employee morale?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 20
      name: additional_feedback
      label: Any additional feedback or suggestions?
      hint: null
      type: text
      options: []
      required: false
