inputSchema:
  type: object
  properties:
    title: Angles and Scales Assessment
    pages:
    - id: 1
      name: student_name
      label: Student Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: Student number or ID
      type: text
      options: []
      required: true
    - id: 3
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - Other
      required: true
    - id: 4
      name: assessment_date
      label: Assessment Date
      hint: Date of assessment
      type: date
      options: []
      required: true
    - id: 5
      name: teacher_name
      label: Teacher Name
      hint: Instructor name
      type: text
      options: []
      required: true
    - id: 6
      name: assessment_intro
      label: Angles and Scales Assessment
      hint: This assessment evaluates your understanding of angles, measurements, and scale concepts. Read each question carefully.
      type: note
      options: []
      required: false
    - id: 7
      name: section_angles_intro
      label: Section 1 - Angle Identification
      hint: Identify and classify different types of angles
      type: note
      options: []
      required: false
    - id: 8
      name: question_1
      label: An angle that measures exactly 90 degrees is called a
      hint: Select the correct answer
      type: select_one
      options:
      - Acute angle
      - Right angle
      - Obtuse angle
      - Straight angle
      required: true
    - id: 9
      name: question_2
      label: An angle that measures less than 90 degrees is called a
      hint: Select the correct answer
      type: select_one
      options:
      - Acute angle
      - Right angle
      - Obtuse angle
      - Reflex angle
      required: true
    - id: 10
      name: question_3
      label: An angle that measures more than 90 degrees but less than 180 degrees is called a
      hint: Select the correct answer
      type: select_one
      options:
      - Acute angle
      - Right angle
      - Obtuse angle
      - Straight angle
      required: true
    - id: 11
      name: question_4
      label: A straight angle measures how many degrees
      hint: Select the correct answer
      type: select_one
      options:
      - 90 degrees
      - 180 degrees
      - 270 degrees
      - 360 degrees
      required: true
    - id: 12
      name: question_5
      label: A full rotation or complete circle measures how many degrees
      hint: Select the correct answer
      type: select_one
      options:
      - 90 degrees
      - 180 degrees
      - 270 degrees
      - 360 degrees
      required: true
    - id: 13
      name: section_scales_intro
      label: Section 2 - Scale and Measurement
      hint: Answer questions about scales, ratios, and measurements
      type: note
      options: []
      required: false
    - id: 14
      name: question_6
      label: If a map scale is 1 inch equals 10 miles, how many miles does 3 inches represent
      hint: Select the correct answer
      type: select_one
      options:
      - 10 miles
      - 20 miles
      - 30 miles
      - 40 miles
      required: true
    - id: 15
      name: question_7
      label: A scale drawing uses a ratio of 1 to 50. If the drawing shows 2 cm, what is the actual length
      hint: Select the correct answer
      type: select_one
      options:
      - 50 cm
      - 100 cm
      - 150 cm
      - 200 cm
      required: true
    - id: 16
      name: question_8
      label: Which tool is best for measuring angles
      hint: Select the correct answer
      type: select_one
      options:
      - Ruler
      - Compass
      - Protractor
      - Scale
      required: true
    - id: 17
      name: question_9
      label: Two angles that add up to 90 degrees are called
      hint: Select the correct answer
      type: select_one
      options:
      - Supplementary angles
      - Complementary angles
      - Vertical angles
      - Adjacent angles
      required: true
    - id: 18
      name: question_10
      label: Two angles that add up to 180 degrees are called
      hint: Select the correct answer
      type: select_one
      options:
      - Supplementary angles
      - Complementary angles
      - Corresponding angles
      - Alternate angles
      required: true
    - id: 19
      name: question_11
      label: On a scale of 1 to 100, if a model car is 5 cm long and the scale is 1 to 24, approximately how long is the real car
      hint: Select the closest answer
      type: select_one
      options:
      - 1.2 meters
      - 2.4 meters
      - 3.6 meters
      - 4.8 meters
      required: true
    - id: 20
      name: question_12
      label: An angle that measures more than 180 degrees but less than 360 degrees is called a
      hint: Select the correct answer
      type: select_one
      options:
      - Obtuse angle
      - Straight angle
      - Reflex angle
      - Full angle
      required: true
    - id: 21
      name: show_work
      label: Show Your Work Section
      hint: Describe how you solved one of the scale problems
      type: text
      options: []
      required: false
    - id: 22
      name: confidence_level
      label: How confident do you feel about angles and scales
      hint: Self-assessment
      type: select_one
      options:
      - Very confident
      - Somewhat confident
      - Neutral
      - Somewhat unsure
      - Very unsure
      required: false
    - id: 23
      name: areas_needing_help
      label: Which areas do you need more practice with
      hint: Select all that apply
      type: select_multiple
      options:
      - Identifying angle types
      - Measuring angles
      - Understanding scale ratios
      - Converting scale measurements
      - Angle relationships
      - None - I understand well
      required: false
