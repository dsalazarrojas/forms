inputSchema:
  type: object
  properties:
    title: Product System Assessment Questionnaire
    pages:
    - id: 1
      name: product_system_assessment_questionnaire
      label: Product System Assessment Questionnaire
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: product_system_satisfaction
      label: Product System Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Very Satisfied
      - Not At All Satisfied
      required: false
    - id: 3
      name: product_system_satisfaction_scale
      label: Product System Satisfaction Scale
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
