      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: lighting_conditions
      label: Lighting Conditions
      hint: Please provide a description of the lighting conditions in the area.
      type: text
      options: []
      required: false
    - id: 4
      name: lighting_type
      label: Lighting Type
      hint: Select one of the options.
      type: select_one
      options:
      - LED
      - CFL
      - Halogen
      - Other
      required: false
    - id: 5
      name: fixture_status
      label: Fixture Status
      hint: Select one of the options.
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: lighting_level
      label: Lighting Level
      hint: Select one of the options.
      type: select_one
      options:
      - Very Low
      - Low
      - Medium
      - High
      required: false
    - id: 7
      name: color_temperature
      label: Color Temperature
      hint: Select one of the options.
      type: select_one
      options:
      - Warm
      - Neutral
      - Cool
