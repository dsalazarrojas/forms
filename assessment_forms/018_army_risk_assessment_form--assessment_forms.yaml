inputSchema:
  type: object
  properties:
    title: Army Risk Assessment Form
    pages:
    - id: 1
      name: section_soldier_info
      label: -- Soldier Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: soldier_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: soldier_rank
      label: Rank
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: unit_assignment
      label: Unit Assignment
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: years_of_service
      label: Years of Service
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: assessing_officer
      label: Assessing Officer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_behavior
      label: -- Behavior Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: overall_behavior
      label: Overall behavior in unit
      hint: null
      type: select_one
      options:
      - Exemplary
      - Good
      - Satisfactory
      - Needs improvement
      - Poor
      required: true
    - id: 10
      name: discipline_history
      label: Discipline or conduct incidents
      hint: null
      type: select_one
      options:
      - None
      - Minor incidents
      - Multiple incidents
      - Serious incidents
      - Severe incidents
      required: true
    - id: 11
      name: incident_details
      label: If yes, describe incidents
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: insubordination
      label: Insubordination or defiance
      hint: null
      type: select_one
      options:
      - Never
      - Rarely
      - Occasionally
      - Frequently
      - Chronically
      required: true
    - id: 13
      name: section_interpersonal
      label: -- Interpersonal Relations --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: peer_relationships
      label: Relationships with peers
      hint: null
      type: select_one
      options:
      - Positive and supportive
      - Generally good
      - Neutral
      - Occasionally conflicted
      - Frequently conflicted
      required: true
    - id: 15
      name: authority_relationship
      label: Relationship with authority
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Acceptable
      - Poor
      - Very poor
      required: true
    - id: 16
      name: conflict_history
      label: History of conflicts with others
      hint: null
      type: select_one
      options:
      - None
      - Minimal
      - Moderate
      - Frequent
      - Severe pattern
      required: true
    - id: 17
      name: section_mental_status
      label: -- Mental and Emotional Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: emotional_stability
      label: Emotional stability
      hint: null
      type: select_one
      options:
      - Stable
      - Generally stable
      - Somewhat unstable
      - Unstable
      - Very unstable
      required: true
    - id: 19
      name: anger_management
      label: Anger management and impulse control
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 20
      name: section_risk_factors
      label: -- Risk Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: risk_factors
      label: Identified risk factors
      hint: null
      type: select_multiple
      options:
      - Substance use
      - Mental health issues
      - Aggressive tendencies
      - Financial problems
      - Family stress
      - Poor judgment
      - Lack of motivation
      - Health issues
      - None identified
      required: false
    - id: 22
      name: violence_risk
      label: Risk of violence toward others
      hint: null
      type: select_one
      options:
      - Low risk
      - Minimal risk
      - Moderate risk
      - High risk
      - Very high risk
      required: true
    - id: 23
      name: section_recommendations
      label: -- Recommendations --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: monitoring_level
      label: Recommended monitoring level
      hint: null
      type: select_one
      options:
      - Standard
      - Increased
      - Close monitoring
      - Intensive supervision
      - Removal from unit
      required: true
    - id: 25
      name: intervention_needed
      label: Intervention or counseling needed
      hint: null
      type: select_one
      options:
      - false
      - Yes - recommended
      - Yes - required
      required: true
    - id: 26
      name: additional_comments
      label: Additional comments or observations
      hint: null
      type: text
      options: []
      required: false
