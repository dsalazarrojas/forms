inputSchema:
  type: object
  properties:
    title: Cupping Knowledge Quiz
    pages:
    - id: 1
      name: cupping_therapy_understanding
      label: What is cupping therapy and what does it entail?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: cupping_therapy_risks
      label: Are you aware of the risks associated with cupping therapy?
      hint: null
      type: select_one
      options:
      - I am aware of the risks of cupping therapy
      - I am not aware of the risks of cupping therapy
      required: false
    - id: 3
      name: cupping_therapy_practice
      label: How long have you practiced cupping therapy?
      hint: null
      type: select_multiple
      options:
      - Never
      - Less than 1 year
      - 1-5 years
      - More than 5 years
      required: false
    - id: 4
      name: cupping_therapy_certification
      label: Have you received any training or certification in cupping therapy?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: cupping_therapy_practice_patients
      label: Have you ever practiced cupping therapy on patients?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: cupping_therapy_certification_date
      label: What is your certification date for cupping therapy?
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: cupping_therapy_certification_time
      label: What is your certification time for cupping therapy?
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: Do you have any notes about cupping therapy?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: other_comments
      label: Do you have any other comments about cupping therapy?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: other_questions
      label: Do you have any other questions about cupping therapy?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: other_notes
      label: Do you have any other notes about cupping therapy?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: cupping_therapy_frequency
      label: How often do you practice cupping therapy?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 13
      name: cupping_therapy_experience
      label: How much experience do you have with cupping therapy?
      hint: null
      type: select_one
      options:
      - No experience
      - Some experience
      - Significant experience
      required: false
    - id: 14
      name: cupping_therapy_certification_level
      label: What level of certification do you have in cupping therapy?
      hint: null
      type: select_one
      options:
      - Basic
      - Advanced
      required: false
    - id: 15
      name: cupping_therapy_certification_status
      label: Are you certified in cupping therapy?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
