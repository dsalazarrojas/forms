inputSchema:
  type: object
  properties:
    title: Agency Ownership Assessment
    pages:
    - id: 1
      name: business_identity
      label: -- Business Identity --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: agency_name
      label: Agency name
      hint: Legal registered name
      type: text
      options: []
      required: true
    - id: 3
      name: ownership_structure
      label: Ownership structure
      hint: Describe owners and percentages
      type: text
      options: []
      required: true
    - id: 4
      name: primary_owner
      label: Primary owner name
      hint: Name of majority stakeholder
      type: text
      options: []
      required: true
    - id: 5
      name: ownership_percentages
      label: Ownership percentages
      hint: Provide breakdown by owner
      type: text
      options: []
      required: true
    - id: 6
      name: controlling_interest
      label: Is there a controlling interest
      hint: Indicate if one party controls the agency
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: changes_in_ownership
      label: Recent changes in ownership
      hint: Describe any transfers or sales
      type: text
      options: []
      required: false
    - id: 8
      name: legal_documents_on_file
      label: Legal documents on file
      hint: List articles or agreements available
      type: text
      options: []
      required: false
    - id: 9
      name: verification_contact
      label: Verification contact person
      hint: Contact for ownership verification
      type: text
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any other relevant ownership details
      type: text
      options: []
      required: false
