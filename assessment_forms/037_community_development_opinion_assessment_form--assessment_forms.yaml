inputSchema:
  type: object
  properties:
    title: Development Opinion Assessment
    pages:
      - id: 1
        name: respondent_role
        label: Respondent role
        hint: Resident business owner or stakeholder
        type: select_one
        options:
          - Resident
          - Business owner
          - Community leader
          - Other
        required: true
      - id: 2
        name: level_of_impact
        label: Perceived level of impact
        hint: How much will the project affect you
        type: select_one
        options:
          - High
          - Moderate
          - Low
          - None
        required: true
      - id: 3
        name: anticipated_benefits
        label: Anticipated benefits
        hint: Select expected positive outcomes
        type: select_multiple
        options:
          - Job creation
          - Improved infrastructure
          - More housing
          - Increased services
        required: false
      - id: 4
        name: main_concerns
        label: Main concerns about development
        hint: Select any concerns you have
        type: select_multiple
        options:
          - Displacement
          - Traffic congestion
          - Environmental impact
          - Noise or disruption
        required: false
      - id: 5
        name: overall_opinion
        label: Overall opinion of proposed development
        hint: Short summary of stance
        type: text
        options: []
        required: false
      - id: 6
        name: contact_for_follow_up
        label: Contact for follow up
        hint: Optional if you want to be contacted
        type: email
        options: []
        required: false
