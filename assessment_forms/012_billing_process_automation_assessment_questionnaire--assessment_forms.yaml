inputSchema:
  type: object
  properties:
    title: Billing Process Automation Assessment Questionnaire
    pages:
    - id: 1
      name: organization_information
      label: Organization Information
      hint: Enter your company details
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 3
      name: industry
      label: Industry
      hint: Primary industry sector
      type: select_one
      options:
      - Healthcare
      - Finance
      - Technology
      - Retail
      - Manufacturing
      - Professional Services
      - Education
      - Government
      - Non-Profit
      - Other
      required: true
    - id: 4
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - 1-10 employees
      - 11-50 employees
      - 51-200 employees
      - 201-500 employees
      - 501-1000 employees
      - 1000+ employees
      required: true
    - id: 5
      name: annual_revenue
      label: Annual Revenue Range
      hint: Approximate annual revenue
      type: select_one
      options:
      - Under $1M
      - $1M - $10M
      - $10M - $50M
      - $50M - $100M
      - $100M - $500M
      - $500M+
      required: true
    - id: 6
      name: respondent_information
      label: Respondent Information
      hint: Enter your contact details
      type: note
      options: []
      required: false
    - id: 7
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 8
      name: respondent_title
      label: Job Title
      hint: Your position in the company
      type: text
      options: []
      required: true
    - id: 9
      name: respondent_email
      label: Email Address
      hint: Work email address
      type: email
      options: []
      required: true
    - id: 10
      name: respondent_department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Finance
      - Accounting
      - IT
      - Operations
      - Executive
      - Other
      required: true
    - id: 11
      name: current_billing_process
      label: Current Billing Process
      hint: Questions about your current billing workflow
      type: note
      options: []
      required: false
    - id: 12
      name: current_billing_system
      label: Current Billing System
      hint: What system do you currently use
      type: select_one
      options:
      - Manual Spreadsheets
      - Basic Accounting Software
      - Dedicated Billing Software
      - ERP System
      - Custom Built Solution
      - Multiple Systems
      required: true
    - id: 13
      name: invoices_per_month
      label: Invoices Generated Per Month
      hint: Average monthly invoice volume
      type: select_one
      options:
      - Less than 100
      - 100-500
      - 501-1000
      - 1001-5000
      - 5000+
      required: true
    - id: 14
      name: billing_staff_count
      label: Billing Staff Count
      hint: Number of staff handling billing
      type: number
      options: []
      required: true
    - id: 15
      name: time_per_invoice
      label: Average Time Per Invoice
      hint: Time spent processing each invoice
      type: select_one
      options:
      - Less than 5 minutes
      - 5-15 minutes
      - 15-30 minutes
      - 30-60 minutes
      - Over 1 hour
      required: true
    - id: 16
      name: automation_readiness
      label: Automation Readiness
      hint: Assess your readiness for automation
      type: note
      options: []
      required: false
    - id: 17
      name: process_standardization
      label: Process Standardization
      hint: How standardized are your billing processes
      type: select_one
      options:
      - Fully Documented and Standardized
      - Mostly Standardized
      - Some Variation
      - Highly Variable
      - No Standard Process
      required: true
    - id: 18
      name: data_quality
      label: Data Quality
      hint: How would you rate your billing data quality
      type: select_one
      options:
      - Excellent - Clean and Complete
      - Good - Minor Issues
      - Fair - Some Problems
      - Poor - Significant Issues
      - Unknown
      required: true
    - id: 19
      name: integration_needs
      label: Integration Needs
      hint: What systems need to integrate
      type: select_multiple
      options:
      - CRM System
      - ERP System
      - Accounting Software
      - Payment Gateway
      - Customer Portal
      - Inventory System
      - None
      required: true
    - id: 20
      name: pain_points
      label: Current Pain Points
      hint: What are your biggest billing challenges
      type: select_multiple
      options:
      - Manual Data Entry
      - Billing Errors
      - Late Payments
      - Slow Processing
      - Lack of Visibility
      - Customer Complaints
      - Compliance Issues
      - High Labor Costs
      required: true
    - id: 21
      name: automation_goals
      label: Automation Goals
      hint: What do you hope to achieve with automation
      type: select_multiple
      options:
      - Reduce Processing Time
      - Reduce Errors
      - Improve Cash Flow
      - Better Reporting
      - Cost Reduction
      - Improve Customer Experience
      - Compliance Requirements
      required: true
    - id: 22
      name: budget_range
      label: Budget Range
      hint: Expected budget for automation solution
      type: select_one
      options:
      - Under $10,000
      - $10,000 - $50,000
      - $50,000 - $100,000
      - $100,000 - $500,000
      - $500,000+
      - Not Determined
      required: false
    - id: 23
      name: timeline
      label: Implementation Timeline
      hint: When do you want to implement automation
      type: select_one
      options:
      - Immediate - Within 1 Month
      - Short Term - 1-3 Months
      - Medium Term - 3-6 Months
      - Long Term - 6-12 Months
      - Just Exploring Options
      required: true
    - id: 24
      name: decision_makers
      label: Decision Makers Involved
      hint: Who will be involved in the decision
      type: select_multiple
      options:
      - CFO
      - Controller
      - IT Director
      - Operations Manager
      - CEO
      - External Consultants
      required: false
    - id: 25
      name: previous_automation_attempts
      label: Previous Automation Attempts
      hint: Have you tried automation before
      type: select_one
      options:
      - No - First Time
      - Yes - Unsuccessful
      - Yes - Partially Successful
      - Yes - Fully Successful
      required: true
    - id: 26
      name: additional_requirements
      label: Additional Requirements
      hint: Any specific requirements or considerations
      type: text
      options: []
      required: false
    - id: 27
      name: follow_up_preference
      label: Follow-up Preference
      hint: How would you like to proceed
      type: select_one
      options:
      - Schedule Consultation Call
      - Send Written Assessment
      - Provide Product Demo
      - Send Pricing Information
      - No Follow-up Needed
      required: true
