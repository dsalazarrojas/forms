inputSchema:
  type: object
  properties:
    title: Training Pre Assessment Survey
    pages:
    - id: 1
      name: training_preassessment_survey
      label: Training Pre-Assessment
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: training_level
      label: Training Level
      hint: null
      type: number
      options: []
      required: false
