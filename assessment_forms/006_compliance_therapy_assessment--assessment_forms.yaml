inputSchema:
  type: object
  properties:
    title: Compliance Therapy Assessment
    pages:
    - id: 1
      name: client_full_name
      label: Client Full Name
      hint: Enter your complete name
      type: text
      options: []
      required: true
    - id: 2
      name: client_id
      label: Client ID Number
      hint: Your unique client identification number
      type: text
      options: []
      required: true
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: Date of this therapy assessment
      type: date
      options: []
      required: true
    - id: 4
      name: therapist_name
      label: Therapist Name
      hint: Name of your assigned therapist
      type: text
      options: []
      required: true
    - id: 5
      name: session_number
      label: Session Number
      hint: Which session number is this
      type: number
      options: []
      required: true
    - id: 6
      name: mood_rating
      label: Current Mood Rating
      hint: Rate your overall mood since last session
      type: select_one
      options:
      - 1 - Very Poor
      - 2 - Poor
      - 3 - Fair
      - 4 - Good
      - 5 - Very Good
      required: true
    - id: 7
      name: anxiety_level
      label: Anxiety Level
      hint: Rate your anxiety level over the past week
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Extreme
      required: true
    - id: 8
      name: depression_level
      label: Depression Level
      hint: Rate your depression level over the past week
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Extreme
      required: true
    - id: 9
      name: sleep_quality
      label: Sleep Quality
      hint: How would you rate your sleep quality
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 10
      name: medication_compliance
      label: Medication Compliance
      hint: Have you been taking medications as prescribed
      type: select_one
      options:
      - Yes, always
      - Most of the time
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 11
      name: therapy_goals_progress
      label: Progress on Therapy Goals
      hint: How much progress have you made on your goals
      type: select_one
      options:
      - Significant Progress
      - Moderate Progress
      - Some Progress
      - Little Progress
      - No Progress
      required: true
    - id: 12
      name: barriers_to_engagement
      label: Barriers to Engagement
      hint: Select any barriers affecting your therapy engagement
      type: select_multiple
      options:
      - Transportation Issues
      - Financial Constraints
      - Time Conflicts
      - Lack of Motivation
      - Anxiety About Sessions
      - Family Responsibilities
      - Work Schedule
      - Health Issues
      - None
      required: false
    - id: 13
      name: support_system_quality
      label: Support System Quality
      hint: How would you rate your current support system
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - No Support System
      required: true
    - id: 14
      name: coping_strategies_used
      label: Coping Strategies Used
      hint: Which coping strategies have you used this week
      type: select_multiple
      options:
      - Deep Breathing Exercises
      - Meditation
      - Physical Exercise
      - Journaling
      - Talking to Friends or Family
      - Hobbies
      - Professional Support
      - None
      required: false
    - id: 15
      name: suicidal_ideation
      label: Suicidal Thoughts
      hint: Have you had thoughts of self-harm or suicide
      type: select_one
      options:
      - false
      - Yes, passive thoughts
      - Yes, with a plan
      - Yes, with intent
      required: true
    - id: 16
      name: substance_use
      label: Substance Use
      hint: Have you used alcohol or recreational drugs this week
      type: select_one
      options:
      - false
      - Yes, alcohol only
      - Yes, drugs only
      - Yes, both
      required: true
    - id: 17
      name: significant_events
      label: Significant Events This Week
      hint: Describe any significant events or changes
      type: text
      options: []
      required: false
    - id: 18
      name: therapy_satisfaction
      label: Satisfaction with Therapy
      hint: How satisfied are you with your current therapy
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 19
      name: consent_for_followup
      label: Consent for Follow Up Contact
      hint: Do you consent to be contacted between sessions if needed
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other information you want to share with your therapist
      type: text
      options: []
      required: false
