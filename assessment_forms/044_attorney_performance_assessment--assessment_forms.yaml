      name: client_service
      label: Client Service and Communication
      hint: Rate client interaction skills
      type: select_one
      options:
      - Exceptional
      - Strong
      - Satisfactory
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 18
      name: client_satisfaction
      label: Client Satisfaction
      hint: Based on feedback received
      type: select_one
      options:
      - Exceptional
      - Strong
      - Satisfactory
      - Needs Improvement
      - Unsatisfactory
