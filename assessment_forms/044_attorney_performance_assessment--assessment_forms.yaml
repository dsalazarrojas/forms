    - id: 22
      name: teamwork_collaboration
      label: Teamwork and Collaboration
      hint: Working with colleagues
      type: select_one
      options:
      - Exceptional
      - Strong
      - Satisfactory
      - Needs Improvement
      - Unsatisfactory
