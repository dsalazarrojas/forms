      type: text
      options: []
      required: true
    - id: 24
      name: development_areas
      label: Areas for Development
      hint: Skills to improve
      type: text
      options: []
      required: true
    - id: 25
      name: overall_rating
      label: Overall Performance Rating
      hint: Final overall rating
      type: select_one
      options:
      - Exceptional
      - Strong
      - Satisfactory
      - Needs Improvement
      - Unsatisfactory
      required: true
