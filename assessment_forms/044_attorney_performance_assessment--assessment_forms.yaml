      hint: Beginning of review period
      type: date
      options: []
      required: true
    - id: 4
      name: evaluation_period_end
      label: Evaluation Period End
      hint: End of review period
      type: date
      options: []
      required: true
    - id: 5
      name: reviewer_name
      label: Reviewer Name
      hint: Name of evaluating partner or manager
      type: text
      options: []
      required: true
    - id: 6
      name: attorney_information
      label: -- Attorney Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: attorney_name
      label: Attorney Name
      hint: Full name of attorney being reviewed
      type: text
      options: []
      required: true
    - id: 8
      name: bar_number
      label: Bar Number
      hint: State bar number
      type: text
      options: []
      required: true
