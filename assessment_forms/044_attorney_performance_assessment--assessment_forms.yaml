inputSchema:
  type: object
  properties:
    title: Attorney Performance Assessment
    pages:
    - id: 1
      name: evaluation_information
      label: -- Evaluation Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: evaluation_date
      label: Evaluation Date
      hint: Date of this assessment
      type: date
      options: []
      required: true
    - id: 3
      name: evaluation_period_start
