      required: true
    - id: 11
      name: gcp_knowledge
      label: Google Cloud Platform (GCP) Knowledge
      hint: null
      type: select_one
      options:
      - Expert
      - Advanced
      - Intermediate
      - Beginner
      - No knowledge
      required: true
    - id: 12
      name: virtualization_knowledge
      label: Virtualization (VMware, Hyper-V) Knowledge
      hint: null
      type: select_one
      options:
      - Expert
      - Advanced
      - Intermediate
      - Beginner
      - No knowledge
      required: true
    - id: 13
      name: container_knowledge
      label: Container Technology (Docker, Kubernetes) Knowledge
      hint: null
      type: select_one
      options:
      - Expert
      - Advanced
      - Intermediate
      - Beginner
      - No knowledge
