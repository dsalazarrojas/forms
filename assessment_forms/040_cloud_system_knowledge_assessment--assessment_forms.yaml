inputSchema:
  type: object
  properties:
    title: Cloud System Knowledge Assessment
    pages:
    - id: 1
      name: candidate_name
      label: Candidate or Employee Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: candidate_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: Date taking this assessment
      type: date
      options: []
      required: true
    - id: 4
      name: section_background
      label: -- Background and Experience --
      hint: Your experience level
      type: note
      options: []
      required: false
    - id: 5
      name: years_experience
      label: Years of IT Experience
      hint: Total years in IT field
      type: number
      options: []
      required: true
    - id: 6
      name: cloud_experience
      label: Years of Cloud Experience
      hint: Years working with cloud platforms
      type: number
      options: []
      required: false
    - id: 7
      name: current_role
      label: Current Role or Position
      hint: Your current job title
      type: text
      options: []
      required: true
    - id: 8
      name: section_knowledge
      label: -- Cloud Knowledge Assessment --
      hint: Rate your knowledge in these areas
      type: note
      options: []
      required: false
    - id: 9
      name: aws_knowledge
      label: Amazon Web Services (AWS) Knowledge
      hint: null
      type: select_one
      options:
      - Expert
      - Advanced
      - Intermediate
      - Beginner
      - No knowledge
      required: true
    - id: 10
      name: azure_knowledge
      label: Microsoft Azure Knowledge
      hint: null
