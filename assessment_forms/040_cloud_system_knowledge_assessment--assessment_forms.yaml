      hint: null
      type: select_one
      options:
      - Expert
      - Advanced
      - Intermediate
      - Beginner
      - No knowledge
      required: true
    - id: 17
      name: cicd_knowledge
      label: CI/CD Pipelines (Jenkins, GitLab)
      hint: null
      type: select_one
      options:
      - Expert
      - Advanced
      - Intermediate
      - Beginner
      - No knowledge
      required: true
    - id: 18
      name: security_knowledge
      label: Cloud Security Knowledge
      hint: null
      type: select_one
      options:
      - Expert
      - Advanced
