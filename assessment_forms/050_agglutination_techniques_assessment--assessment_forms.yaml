    - id: 13
      name: efficiency_rating
      label: Speed and efficiency of testing process
      hint: null
      type: select_one
      options:
      - Fast and efficient
      - Within expected timeframes
      - Excessively slow
      required: true
    - id: 14
      name: practical_comments
      label: Comments on practical performance
      hint: specific technical feedback
      type: text
      options: []
      required: false
    - id: 15
      name: assessment_result
      label: Final Assessment Result - Pass, Fail, Retraining Required
      hint: final decision on proficiency
      type: select_one
      options:
      - Pass (Qualified)
      - Fail (Not Qualified)
      - Retraining Required
      required: true
