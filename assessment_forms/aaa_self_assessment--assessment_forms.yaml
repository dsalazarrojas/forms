      label: Email address
      hint: Used for follow‑up communication
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone number
      hint: Optional, for urgent updates
      type: phone
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of birth
      hint: For HR records only
      type: date
      options: []
      required: false
    - id: 7
      name: department
      label: Department
