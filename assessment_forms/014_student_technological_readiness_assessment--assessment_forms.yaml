inputSchema:
  type: object
  properties:
    title: Student Technological Readiness Assessment
    pages:
    - id: 1
      name: student_device_access
      label: Student Device Access
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: internet_reliability
      label: Internet Reliability
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Never
      required: false
    - id: 3
      name: digital_confidence
      label: Digital Confidence
      hint: null
      type: select_one
      options:
      - Highly Confident
      - Somewhat Confident
      - Not Very Confident
      required: false
    - id: 4
      name: device_type
      label: What type of device do you have?
      hint: null
      type: select_one
      options:
      - Desktop or Laptop
      - Tablet
      - Smartphone
      - None
      required: false
    - id: 5
      name: internet_access
      label: How do you typically access the internet?
      hint: null
      type: select_one
      options:
      - Home
      - School
      - Public Wi-Fi
      - Mobile Network (cellphone data)
      - Other (please specify)
      required: false
    - id: 6
      name: internet_speed
      label: How fast is your internet?
      hint: null
      type: select_one
      options:
      - 25mb or faster
      - 10-24mb
      - 1-9mb
      - None
      required: false
    - id: 7
      name: device_age
      label: How old is your device?
      hint: null
      type: select_one
      options:
      - Less than 2 years old
      - 2-5 years old
      - 5-10 years old
      - More than 10 years old
      required: false
    - id: 8
      name: support
      label: What type of support do you receive?
      hint: null
      type: select_one
      options:
      - Parent or guardian
      - School staff
      - Self
      required: false
    - id: 9
      name: note
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: student_device_access
      label: Does your school provide devices for students?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: teacher_device_access
      label: Does your teacher use their own device?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: teacher_device_access
      label: Does your teacher have a school-issued device?
      hint: null
