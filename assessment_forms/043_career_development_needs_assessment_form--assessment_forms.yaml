inputSchema:
  type: object
  properties:
    title: Career Development Needs Assessment Form
    pages:
      - id: 1
        name: header
        label: -- Needs Assessment --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: employee_name
        label: Employee name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 3
        name: current_skill_level
        label: Current skill level
        hint: Self rated competency
        type: select_one
        options:
          - Advanced
          - Intermediate
          - Beginner
        required: true
      - id: 4
        name: target_skills
        label: Target skills for development
        hint: Skills employee wants to develop
        type: text
        options: []
        required: true
      - id: 5
        name: preferred_learning_format
        label: Preferred learning format
        hint: How employee prefers to learn
        type: select_one
        options:
          - Workshops
          - Online courses
          - Mentoring
          - On the job training
        required: false
      - id: 6
        name: expected_outcome
        label: Expected outcome
        hint: What success looks like
        type: text
        options: []
        required: true
      - id: 7
        name: timeline
        label: Timeline for development
        hint: When skills should be improved
        type: select_one
        options:
          - 3 months
          - 6 months
          - 12 months
        required: false
      - id: 8
        name: available_resources
        label: Available resources
        hint: Training budget time and mentors
        type: text
        options: []
        required: false
      - id: 9
        name: manager_support_needed
        label: Manager support needed
        hint: What manager can provide
        type: text
        options: []
        required: false
      - id: 10
        name: additional_comments
        label: Additional comments
        hint: Any other information
        type: text
        options: []
        required: false
