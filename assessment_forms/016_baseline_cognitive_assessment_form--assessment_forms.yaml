inputSchema:
  type: object
  properties:
    title: Baseline Cognitive Assessment Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_id
      label: Participant ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: section_header_2
      label: -- Assessment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assessment_date
      label: Assessment date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: assessor_name
      label: Assessor name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: section_header_3
      label: -- Cognitive Screening Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: attention
      label: Attention and concentration level
      hint: Scale 1-5 (1=Poor, 5=Excellent)
      type: number
      options: []
      required: true
    - id: 13
      name: memory_recent
      label: Recent memory function
      hint: Scale 1-5
      type: number
      options: []
      required: true
    - id: 14
      name: memory_distant
      label: Distant memory function
      hint: Scale 1-5
      type: number
      options: []
      required: true
    - id: 15
      name: orientation
      label: Orientation to time, place, and person
      hint: Scale 1-5
      type: number
      options: []
      required: true
    - id: 16
      name: language_fluency
      label: Language fluency and comprehension
      hint: Scale 1-5
      type: number
      options: []
      required: true
    - id: 17
      name: problem_solving
      label: Problem-solving and reasoning ability
      hint: Scale 1-5
      type: number
      options: []
      required: true
    - id: 18
      name: executive_function
      label: Executive function (planning, organization)
      hint: Scale 1-5
      type: number
      options: []
      required: true
    - id: 19
      name: section_header_4
      label: -- General Health Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: current_medications
      label: Currently taking medications?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 21
      name: medication_list
      label: If yes, please list
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: sleep_quality
      label: Sleep quality (past month)
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 23
      name: stress_level
      label: Stress level
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Very High
      required: false
    - id: 24
      name: section_header_5
      label: -- Consent and Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: consent
      label: I consent to participate in this cognitive assessment
      hint: null
      type: select_one
      options:
      - I Consent
      - I Do Not Consent
      required: true
    - id: 26
      name: data_privacy
      label: I understand my data will be kept confidential
      hint: null
      type: select_one
      options:
      - I Acknowledge
      - I Do Not Acknowledge
      required: true
