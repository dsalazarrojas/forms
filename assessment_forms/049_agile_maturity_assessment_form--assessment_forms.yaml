inputSchema:
  type: object
  properties:
    title: Agile Maturity Assessment Form
    pages:
    - id: 1
      name: organization_info
      label: -- Organization Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization name
      hint: Legal or common name
      type: text
      options: []
      required: true
    - id: 3
      name: assessment_date
      label: Assessment date
      hint: Date the assessment was completed
      type: date
      options: []
      required: true
    - id: 4
      name: leadership_commitment
      label: Leadership commitment level
      hint: Rate executive support for agile
      type: select_one
      options: [Strong, Moderate, Weak, None]
      required: true
    - id: 5
      name: team_autonomy
      label: Team autonomy
      hint: Degree of decision making by teams
      type: select_one
      options: [High, Medium, Low]
      required: true
    - id: 6
      name: agile_practices_adopted
      label: Agile practices adopted
      hint: List practices currently in use
      type: select_multiple
      options: [Scrum, Kanban, XP, Lean, DevOps]
      required: true
    - id: 7
      name: metrics_and_measurement
      label: Metrics and measurement
      hint: Use of outcome and flow metrics
      type: select_one
      options: [Robust, Basic, Minimal, None]
      required: true
    - id: 8
      name: continuous_improvement
      label: Continuous improvement culture
      hint: Evidence of regular retrospectives and learning
      type: select_one
      options: [Strong, Moderate, Weak]
      required: true
    - id: 9
      name: overall_maturity_level
      label: Overall maturity level
      hint: Select the assessed maturity band
      type: select_one
      options: [Level 1, Level 2, Level 3, Level 4, Level 5]
      required: true
    - id: 10
      name: recommendations
      label: Recommendations
      hint: Suggested next steps to advance maturity
      type: text
      options: []
      required: false
