inputSchema:
  type: object
  properties:
    title: English Proficiency Assessment
    pages:
    - id: 1
      name: language_skills_assessment
      label: Language Skills Assessment
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: reading_comprehension_assessment
      label: Reading Comprehension
      hint: null
      type: select_one
      options:
      - '{1: ''Reading Comprehension''}'
      - '{2: ''Reading Comprehension 2''}'
      - '{3: ''Reading Comprehension 3''}'
      required: false
    - id: 3
      name: writing_expression_assessment
      label: Writing Expression
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: listening_comprehension_assessment
      label: Listening Comprehension
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: speaking_expression_assessment
      label: Speaking Expression
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: grammar_assessment
      label: Grammar
      hint: null
      type: select_one
      options:
      - '{1: ''Grammar 1''}'
      - '{2: ''Grammar 2''}'
      - '{3: ''Grammar 3''}'
      required: false
    - id: 7
      name: vocabulary_assessment
      label: Vocabulary
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: english_proficiency_score
      label: English Proficiency Score
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: overall_english_proficiency_level
      label: Overall English Proficiency Level
      hint: null
      type: select_one
      options:
      - '{1: ''Level 1''}'
      - '{2: ''Level 2''}'
      - '{3: ''Level 3''}'
      required: false
    - id: 10
      name: recommended_actions
      label: Recommended Actions
      hint: null
      type: select_multiple
      options:
      - '{1: ''Recommended Action 1''}'
      - '{2: ''Recommended Action 2''}'
      - '{3: ''Recommended Action 3''}'
      required: false
