inputSchema:
  type: object
  properties:
    title: Physical Skills Assessment Form
    pages:
    - id: 1
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_rating
      label: Participant Skill Assessment
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: assessment_notes
      label: Assessment Notes
      hint: null
      type: text
      options: []
      required: false
