inputSchema:
  type: object
  properties:
    title: Present Tense Grammar Quiz
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: present_tense_verb_choice_1
      label: What is the correct form of the verb 'go' in present simple tense?
      hint: null
      type: select_one
      options:
      - I go
      - you go
      - he/she/it goes
      required: false
    - id: 3
      name: present_tense_verb_choice_2
      label: Which is the correct form of the verb 'eat' in present simple tense?
      hint: null
      type: select_one
      options:
      - I eat
      - you eat
      - he/she/it eats
      required: false
    - id: 4
      name: present_tense_subjunctive_mood_choice
      label: Is the sentence 'If it rains, I will study.' in the present subjunctive
        mood?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: present_tense_aspects_of_the_tense_choice
      label: What are the three main aspects of the present tense?
      hint: null
      type: select_multiple
      options:
      - Present Simple
      - Present Continuous
      - Present Perfect
      required: false
    - id: 6
      name: time
      label: What is the current date and time?
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: present_tense_verb_form_choice
      label: What is the correct form of the verb 'read' in present simple tense?
      hint: null
      type: select_one
      options:
      - I read
      - you read
      - he/she/it reads
      required: false
    - id: 8
      name: present_tense_verb_form_choice_2
      label: Which is the correct form of the verb 'write' in present simple tense?
      hint: null
      type: select_one
      options:
      - I write
      - you write
      - he/she/it writes
      required: false
    - id: 9
      name: present_tense_aspects_of_the_tense_choice_2
      label: What are the two main tenses in present perfect tense?
      hint: null
      type: select_multiple
      options:
      - Present Perfect
      - Present Continuous
      required: false
    - id: 10
      name: present_tense_aspects_of_the_tense_choice_3
      label: Which tense is used for actions that started in the past and still continue
        to the present?
      hint: null
      type: select_one
      options:
      - Present Continuous
      - Past Simple
      required: false
    - id: 11
      name: present_tense_aspects_of_the_tense_choice_4
      label: What is the tense used for actions that started in the past and are completed?
      hint: null
      type: select_one
      options:
      - Past Perfect
      - Past Simple
      required: false
    - id: 12
      name: present_tense_aspects_of_the_tense_choice_5
      label: Which tense is used for actions that are completed in the future?
      hint: null
      type: select_one
      options:
      - Future Simple
      - Future Perfect
      required: false
    - id: 13
      name: submit
      label: Submit
      hint: null
      type: note
      options: []
      required: false
