inputSchema:
  type: object
  properties:
    title: Lawn Mower Safety Assessment
    pages:
    - id: 1
      name: operator_readiness
      label: Operator Readiness
      hint: null
      type: select_multiple
      options:
      - Operator is alert and attentive
      - Operator has knowledge of mowing equipment safety procedures
      - Operator has knowledge of mowing practices and techniques
      - Operator is familiar with safe work practices for mowing and maintenance
      - Operator has access to personal protective equipment PPE
      - Operator has received training on mowing and maintenance
      - Operator has knowledge of emergency procedures
      - Operator has knowledge of safe work practices for the environment
      required: true
    - id: 2
      name: equipment_condition
      label: Equipment Condition
      hint: null
      type: select_multiple
      options:
      - Good working order
      - Minor issues
      - Needs repair
      - Needs replacement
      required: false
    - id: 3
      name: safe_mowing_practices
      label: Safe Mowing Practices
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: safe_practice_checklist
      label: Safe Mowing Practices Checklist
      hint: null
      type: select_multiple
      options:
      - Check for any obstacles such as obstacles in the path
      - Check equipment and controls for damage
      - Check for uneven terrain
      - Check the weather forecast
      - Check for obstacles under the mower
      - Check for uneven mower deck
      - Check for overgrown vegetation
      - Check the mower for damage
      - Check for loose items in the path
      - Check for uneven ground
      required: true
    - id: 5
      name: emergency_procedures
      label: Emergency Procedures
      hint: null
      type: select_one
      options:
      - Emergency procedures in place for fire
      - Emergency procedures in place for accidents
      - Emergency procedures in place for other incidents
      - No emergency procedures in place
      required: true
    - id: 6
      name: mowing_equipment
      label: Mowing Equipment
      hint: null
      type: select_one
      options:
      - Gas mower
      - Electric mower
      - Other - please describe
      required: false
    - id: 7
      name: operator_instructions
      label: Operator Instructions
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: operator_name
      label: Operator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: date_submitted
      label: Date Submitted
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: time_submitted
      label: Time Submitted
      hint: null
      type: time
      options: []
      required: true
    - id: 15
      name: operator_email
      label: Operator E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 16
      name: operator_phone
      label: Operator Phone
      hint: null
      type: text
      options: []
      required: true
