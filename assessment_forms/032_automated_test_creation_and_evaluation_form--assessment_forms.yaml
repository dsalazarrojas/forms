inputSchema:
  type: object
  properties:
    title: Automated Test Creation and Evaluation Form
    pages:
    - id: 1
      name: introduction
      label: Automated Test Creation and Evaluation
      hint: Create and evaluate your assessment test
      type: note
      options: []
      required: false
    - id: 2
      name: test_info
      label: Test Information
      hint: Basic test details
      type: note
      options: []
      required: false
    - id: 3
      name: test_name
      label: Test Name
      hint: Title of the test
      type: text
      options: []
      required: true
    - id: 4
      name: test_description
      label: Test Description
      hint: Brief description
      type: text
      options: []
      required: true
    - id: 5
      name: test_type
      label: Test Type
      hint: What kind of test
      type: select_one
      options:
      - Knowledge Assessment
      - Skills Test
      - Certification Exam
      - Practice Quiz
      - Pre-Test
      - Post-Test
      - Final Exam
      - Other
      required: true
    - id: 6
      name: subject_area
      label: Subject Area
      hint: What subject
      type: text
      options: []
      required: true
    - id: 7
      name: creator_info
      label: Creator Information
      hint: Who is creating this
      type: note
      options: []
      required: false
    - id: 8
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 9
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 10
      name: email
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 11
      name: organization
      label: Organization
      hint: School or company
      type: text
      options: []
      required: false
    - id: 12
      name: test_parameters
      label: Test Parameters
      hint: Test settings
      type: note
      options: []
      required: false
    - id: 13
      name: total_questions
      label: Total Questions
      hint: Number of questions
      type: number
      options: []
      required: true
    - id: 14
      name: time_limit
      label: Time Limit
      hint: In minutes
      type: number
      options: []
      required: false
    - id: 15
      name: passing_score
      label: Passing Score
      hint: Percentage needed
      type: number
      options: []
      required: true
    - id: 16
      name: randomize_questions
      label: Randomize Questions
      hint: Shuffle order
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: show_correct_answers
      label: Show Correct Answers
      hint: After completion
      type: select_one
      options:
      - Yes Immediately
      - Yes After Test Closes
      - false
      required: true
    - id: 18
      name: question_types
      label: Question Types
      hint: Types to include
      type: select_multiple
      options:
      - Multiple Choice
      - True or False
      - Short Answer
      - Essay
      - Matching
      - Fill in the Blank
      - Ordering
      required: true
    - id: 19
      name: difficulty_level
      label: Difficulty Level
      hint: Overall difficulty
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Mixed
      required: true
    - id: 20
      name: topic_distribution
      label: Topic Distribution
      hint: How to distribute topics
      type: text
      options: []
      required: false
