    - id: 25
      name: answer_2
      label: Answer 2
      hint: Correct answer
      type: text
      options: []
      required: false
    - id: 26
      name: question_3
      label: Question 3
      hint: Enter your question
      type: text
      options: []
      required: false
    - id: 27
      name: answer_3
      label: Answer 3
      hint: Correct answer
      type: text
      options: []
      required: false
    - id: 28
      name: question_4
      label: Question 4
      hint: Enter your question
      type: text
      options: []
      required: false
    - id: 29
      name: answer_4
      label: Answer 4
      hint: Correct answer
      type: text
      options: []
      required: false
    - id: 30
      name: question_5
      label: Question 5
      hint: Enter your question
      type: text
      options: []
      required: false
    - id: 31
      name: answer_5
      label: Answer 5
      hint: Correct answer
      type: text
      options: []
      required: false
    - id: 32
      name: evaluation_criteria
      label: Evaluation Criteria
      hint: How to evaluate
      type: note
      options: []
      required: false
    - id: 33
      name: grading_method
      label: Grading Method
      hint: How to grade
      type: select_one
      options:
      - Automatic
      - Manual Review
      - Both
      required: true
    - id: 34
      name: partial_credit
      label: Partial Credit
      hint: Allow partial credit
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 35
      name: feedback_type
      label: Feedback Type
      hint: What feedback to give
      type: select_one
      options:
      - Score Only
      - Score and Correct Answers
      - Score and Explanations
      - Detailed Analysis
      required: true
    - id: 36
      name: retake_policy
      label: Retake Policy
      hint: Can students retake
      type: select_one
      options:
      - Unlimited Retakes
      - Limited Retakes
      - No Retakes
      - Instructor Approval
