inputSchema:
  type: object
  properties:
    title: Brand Risk Assessment Form
    pages:
      - id: 1
        name: assessment_date
        label: Assessment date
        hint: Date of risk assessment
        type: date
        options: []
        required: true
      - id: 2
        name: assessor_name
        label: Assessor name
        hint: Person conducting assessment
        type: text
        options: []
        required: true
      - id: 3
        name: risk_area
        label: Risk area
        hint: Select area of brand risk
        type: select_one
        options:
          - Reputation
          - Compliance
          - Financial
          - Operational
        required: true
      - id: 4
        name: likelihood
        label: Likelihood
        hint: Probability of risk occurring
        type: select_one
        options:
          - High
          - Medium
          - Low
        required: true
      - id: 5
        name: impact
        label: Impact
        hint: Potential impact if risk occurs
        type: select_one
        options:
          - Severe
          - Moderate
          - Minor
        required: true
      - id: 6
        name: mitigation_actions
        label: Mitigation actions
        hint: Actions to reduce risk
        type: text
        options: []
        required: false
      - id: 7
        name: owner
        label: Risk owner
        hint: Person responsible for mitigation
        type: text
        options: []
        required: true
      - id: 8
        name: review_date
        label: Review date
        hint: Date for follow up review
        type: date
        options: []
        required: false
