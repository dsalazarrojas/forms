inputSchema:
  type: object
  properties:
    title: Emergency Medical Simulation Evaluation Form
    pages:
    - id: 1
      name: emergency_medical_simulation_evaluation_form
      label: Emergency Medical Simulation Evaluation Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: simulation_details
      label: simulation_details
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: medical_team
      label: medical_team
      hint: null
      type: select_multiple
      options:
      - Doctor
      - Nurse
      - Other
      required: false
    - id: 4
      name: assessment_type
      label: assessment_type
      hint: null
      type: select_one
      options:
      - Verbal
      - Written
      - Practical
      required: false
    - id: 5
      name: evaluation_scale
      label: evaluation_scale
      hint: null
      type: select_one
      options:
      - Pass
      - Fail
      - Needs Improvement
      required: false
    - id: 6
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: emergency_contact_name
      label: emergency_contact_name
      hint: null
      type: text
      options: []
      required: false
