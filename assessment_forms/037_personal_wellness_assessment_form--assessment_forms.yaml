inputSchema:
  type: object
  properties:
    title: Personal Wellness Assessment Form
    pages:
    - id: 1
      name: physical_condition
      label: physical_condition
      hint: null
      type: select_one
      options:
      - Physical Health
      - Mental Health
      - Emotional Health
      required: false
    - id: 2
      name: sleep_pattern
      label: sleep_pattern
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: exercise_frequency
      label: exercise_frequency
      hint: How often do you exercise?
      type: select_one
      options:
      - 1-2 times a week
      - 3-4 times a week
      - 5 or more times a week
      - Never
      required: false
    - id: 4
      name: healthy_eating
      label: healthy_eating
      hint: Do you eat healthy?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: mental_mood
      label: mental_mood
      hint: null
      type: select_one
      options:
      - Good
      - Bad
      - Neutral
      required: false
    - id: 6
      name: stress_level
      label: stress_level
      hint: How do you feel about your stress levels?
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 7
      name: emotional_state
      label: emotional_state
      hint: How do you feel about your emotional state?
      type: select_one
      options:
      - Happy
      - Unhappy
      - Neutral
      required: false
