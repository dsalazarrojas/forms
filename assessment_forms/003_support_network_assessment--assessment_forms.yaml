inputSchema:
  type: object
  properties:
    title: Support Network Assessment
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: years_of_service
      label: Years of Service
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: support_systems
      label: Support Systems
      hint: null
      type: select_one
      options:
      - Spouse
      - Family
      - Friends
      - Colleagues
      - Community
      - Self
      required: false
    - id: 9
      name: support_systems_other
      label: Other Support Systems
      hint: This is not a comprehensive list.
      type: text
      options: []
      required: false
    - id: 10
      name: communication_channels
      label: Communication Channels
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Video
      - Text
      - Video Call
      - Meeting
      - Online Community
      - In-Person
      required: false
    - id: 11
      name: communication_frequency
      label: How often do you communicate with these systems?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: false
    - id: 12
      name: communication_quality
      label: What is the quality of communication with these systems?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 13
      name: communication_barriers
      label: What are some barriers you face when communicating with these systems?
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: support_systems_barriers
      label: What are some barriers you face when relying on these systems?
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: emotional_intelligence
      label: How would you rate your Emotional Intelligence?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 16
      name: self_care
      label: Do you take care of yourself?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
