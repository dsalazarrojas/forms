inputSchema:
  type: object
  properties:
    title: Travel Package Experience Assessment
    pages:
    - id: 1
      name: introduction_page
      label: Preface
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rating_page
      label: Overall Rating
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 3
      name: section_1
      label: What did you enjoy most about the trip?
      hint: Please provide a brief description of what you enjoyed most about the
        trip.
      type: text
      options: []
      required: false
    - id: 4
      name: section_1_1
      label: Activities
      hint: null
      type: select_multiple
      options:
      - Guided Hikes
      - Kayak or Canoe Trips
      - Scenic Flights
      - Wildlife Tours
      - Other (please specify)
      required: false
    - id: 5
      name: section_2
      label: What did you least enjoy about the trip?
      hint: Please provide a brief description of what you least enjoyed about the
        trip.
      type: text
      options: []
      required: false
    - id: 6
      name: section_2_1
      label: Section 2 1
      hint: null
      type: select_multiple
      options:
      - Guided Hikes
      - Kayak or Canoe Trips
      - Scenic Flights
      - Wildlife Tours
      - Other (please specify)
      required: false
    - id: 7
      name: section_3
      label: What type of transportation did you use during the trip?
      hint: Please select all that apply.
      type: select_multiple
      options:
      - Guided Transportation
      - Self-Guided Transportation
      - Other (please specify)
      required: false
    - id: 8
      name: comments
      label: Additional Comments
      hint: Please provide any additional comments or suggestions for improving the
        experience.
      type: note
      options: []
      required: false
    - id: 9
      name: submission_page
      label: Submission
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: confirmation_page
      label: Confirmation
      hint: null
      type: text
      options: []
      required: false
