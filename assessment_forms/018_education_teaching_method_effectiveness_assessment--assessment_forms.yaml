inputSchema:
  type: object
  properties:
    title: Education Teaching Method Effectiveness Assessment
    pages:
    - id: 1
      name: method_name
      label: What is the name of your teaching method?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: teaching_style
      label: What style of teaching approach do you use most often?
      hint: For example, lectures, discussions, project-based, problem-based, etc.
      type: select_multiple
      options:
      - Lectures
      - Discussions
      - Project-Based
      - Problem-Based
      - Others
      required: false
    - id: 3
      name: student_involvement
      label: How often do you involve students in class activities?
      hint: null
      type: select_one
      options:
      - Frequently
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 4
      name: assessment
      label: What types of assessment methods do you use?
      hint: Multiple responses are allowed
      type: select_multiple
      options:
      - Formative
      - Summative
      - Both
      - Other
      required: false
    - id: 5
      name: feedback
      label: How do you collect student feedback on teaching quality?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: training_method
      label: What type of training do you usually give to learners?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: learning_goals
      label: What are your learning goals for this course?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: evaluation
      label: What evaluation methods do you use to measure student progress?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: student_outcomes
      label: What are the student learning outcomes for this course?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: course_objectives
      label: What are the course objectives?
      hint: null
      type: text
      options: []
      required: false
