inputSchema:
  type: object
  properties:
    title: Travel Risk Assessment Form
    pages:
    - id: 1
      name: travel_risk_assessment
      label: What is your health status?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical history?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: travel_risk_assessment2
      label: Are you fit for travel?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: medical_history2
      label: Are you a diabetic?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: travel_risk_assessment3
      label: Are you taking any medications?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: medical_history3
      label: Do you have any allergies?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: travel_risk_assessment4
      label: Are you a smoker?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: medical_history4
      label: Have you ever had an asthma attack?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
