inputSchema:
  type: object
  properties:
    title: Office Software Skills Quiz
    pages:
    - id: 1
      name: office_software_skills_quiz_form
      label: Office Software Skills Quiz Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Assessment Forms
      - Quizzes
      required: true
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: description_form
      label: Description Form
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: supports_consistent_skills_assessment
      label: Supports consistent skills assessment
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: collects_quiz_responses_online
      label: Collects quiz responses online
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: easy_review_and_comparison
      label: Easy review and comparison
      hint: null
      type: select_one
      options:
      - across candidates
      - across employees
      - both
      required: true
    - id: 8
      name: supports_hiring_and_training
      label: Supports hiring and training
      hint: null
      type: select_one
      options:
      - hiring
      - training
      required: true
