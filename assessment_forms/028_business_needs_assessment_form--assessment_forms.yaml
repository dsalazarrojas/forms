inputSchema:
  type: object
  properties:
    title: Business Needs Assessment Form
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Legal name of your business
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Name
      hint: Primary contact person
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 5
      name: industry
      label: Industry
      hint: Primary business category
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Manufacturing
      - Retail
      - Hospitality
      - Professional services
      - Education
      - Non-profit
      - Other
      required: true
    - id: 6
      name: years_in_business
      label: Years in Business
      hint: How long operating
      type: number
      options: []
      required: true
    - id: 7
      name: number_of_employees
      label: Number of Employees
      hint: Total employees
      type: number
      options: []
      required: true
    - id: 8
      name: annual_revenue
      label: Annual Revenue Range
      hint: Approximate gross revenue
      type: select_one
      options:
      - Under $500K
      - $500K to $1M
      - $1M to $5M
      - $5M to $10M
      - $10M to $50M
      - Over $50M
      required: true
    - id: 9
      name: assessment_areas
      label: Areas Needing Assessment
      hint: Select all areas you want assessed
      type: select_multiple
      options:
      - Strategy and planning
      - Operations
      - Finance
      - Marketing and sales
      - Human resources
      - Technology
      - Customer service
      - Supply chain
      required: true
    - id: 10
      name: primary_challenges
      label: Primary Business Challenges
      hint: What are your biggest challenges
      type: select_multiple
      options:
      - Revenue growth
      - Profitability
      - Cash flow
      - Customer acquisition
      - Customer retention
      - Employee retention
      - Competition
      - Technology adoption
      - Process efficiency
      - Market expansion
      required: true
    - id: 11
      name: challenge_description
      label: Challenge Description
      hint: Describe your main challenge in detail
      type: text
      options: []
      required: true
    - id: 12
      name: goals_objectives
      label: Business Goals and Objectives
      hint: What are your main business goals
      type: text
      options: []
      required: true
    - id: 13
      name: timeline_for_goals
      label: Timeline for Achieving Goals
      hint: When do you want to achieve these goals
      type: select_one
      options:
      - Within 3 months
      - Within 6 months
      - Within 1 year
      - Within 2 years
      - Long-term - 3 plus years
      required: true
    - id: 14
      name: previous_improvement_efforts
      label: Previous Improvement Efforts
      hint: Have you tried to address these issues before
      type: select_one
      options:
      - Yes - multiple attempts
      - Yes - one attempt
      - No - first time addressing
      required: true
    - id: 15
      name: previous_efforts_description
      label: Previous Efforts Description
      hint: Describe what you have tried
      type: text
      options: []
      required: false
    - id: 16
      name: budget_for_improvement
      label: Budget for Improvement Initiatives
      hint: Available budget for improvements
      type: select_one
      options:
      - Under $10K
      - $10K to $25K
      - $25K to $50K
      - $50K to $100K
      - $100K to $250K
      - Over $250K
      required: false
    - id: 17
      name: stakeholder_buy_in
      label: Stakeholder Buy-in Level
      hint: How supportive is leadership
      type: select_one
      options:
      - Fully committed
      - Mostly supportive
      - Somewhat supportive
      - Neutral
      - Resistant
      required: true
    - id: 18
      name: change_readiness
      label: Organizational Change Readiness
      hint: How ready is your organization for change
      type: select_one
      options:
      - Very ready - eager for change
      - Ready - willing to change
      - Neutral - open to discussion
      - Hesitant - prefer status quo
      - Resistant - against change
      required: true
    - id: 19
      name: success_metrics
      label: How Will You Measure Success
      hint: What metrics will indicate improvement
      type: text
      options: []
      required: true
    - id: 20
      name: additional_information
      label: Additional Information
      hint: Any other relevant details
      type: text
      options: []
      required: false
