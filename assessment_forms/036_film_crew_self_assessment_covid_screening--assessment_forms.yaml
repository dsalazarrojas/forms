      hint: null
      type: select_multiple
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 6
      name: testing_info
      label: Testing
      hint: null
      type: select_multiple
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 7
      name: vaccination_info
      label: Vaccination status
      hint: null
      type: select_multiple
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 8
      name: other_info
      label: Other Information
      hint: null
      type: text
