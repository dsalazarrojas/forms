inputSchema:
  type: object
  properties:
    title: Youth Empowerment Assessment
    pages:
    - id: 1
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: school_email
      label: School Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: school_contact_person
      label: School Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: program_name
      label: Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: program_contact_person
      label: Program Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: how_long
      label: How long have you participated in this program?
      hint: null
      type: select_one
      options:
      - 1-3 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - 5+ years
      required: false
    - id: 7
      name: empowerment_level
      label: On a scale from 1-5, how would you rate your sense of empowerment?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: participation_level
      label: On a scale from 1-5, how would you rate your level of participation?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall satisfaction with your experience in the program
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: program_feedback
      label: Additional feedback or suggestions
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: demographic_info
      label: Demographic Information
      hint: null
      type: select_multiple
      options:
      - Age
      - Sex
      - Ethnicity
      - Language
      - Disability Status
      - Geographic Location
      - Other (please specify)
      required: false
