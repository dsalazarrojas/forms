inputSchema:
  type: object
  properties:
    title: internet_listening_assessment
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: internet_use
      label: Internet Use
      hint: How often do you use the internet?
      type: select_one
      options:
      - Never
      - Less than 5 hours a day
      - 5-10 hours a day
      - More than 10 hours a day
      required: false
    - id: 3
      name: internet_use_frequency
      label: Internet Use Frequency
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: skills
      label: Internet Skills
      hint: What skills do you have that help you use the internet effectively?
      type: select_multiple
      options:
      - Browsing and navigating
      - Online searching and research
      - Online communication and interaction
      - Online learning and education
      - Other (please specify)
      required: false
    - id: 5
      name: challenges
      label: Challenges
      hint: What challenges do you face when using the internet?
      type: select_multiple
      options:
      - Limited internet access
      - Slow internet speed
      - Difficulty understanding online content
      - Other (please specify)
      required: false
    - id: 6
      name: online_communication
      label: Online Communication
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: online_communication_frequency
      label: Online Communication Frequency
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: learning_and_education
      label: Learning and Education
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: online_learning_and_education
      label: Online Learning and Education
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: note
      label: Additional Comments
      hint: Additional comments
      type: note
      options: []
      required: false
