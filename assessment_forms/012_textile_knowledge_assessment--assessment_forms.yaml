inputSchema:
  type: object
  properties:
    title: Textile Knowledge Assessment
    pages:
    - id: 1
      name: quiz_form
      label: What is the primary function of fibers in textiles?
      hint: null
      type: select_multiple
      options:
      - Polyester
      - Cotton
      - Nylon
      required: false
    - id: 2
      name: fiber_characteristics
      label: Which of the following describes a key characteristic of fibers?
      hint: null
      type: select_one
      options:
      - Fiber length
      - Fiber thickness
      - Crimp
      - Fiber fineness
      - Fiber fineness and crimp
      required: false
    - id: 3
      name: fabric_structures
      label: What is the term for a woven fabric made up of yarns with the warp yarns
        floating over and under each other?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: fabric_structures_2
      label: What is the term for a fabric structure with the warp yarns interlaced
        with weft yarns at regular intervals?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: textile_processes
      label: What is a process that involves the application of heat to change the
        properties of a textile?
      hint: null
      type: select_one
      options:
      - Heat treatment
      - Chemical treatments
      - Physical treatments
      required: false
    - id: 6
      name: textile_processes_2
      label: What is a process that involves the addition of substances to the textile?
      hint: null
      type: select_one
      options:
      - Dyeing
      - Printing
      - Finishing
      required: false
    - id: 7
      name: textile_processes_3
      label: What is a process that involves the manipulation of fibers or yarns to
        create a specific fabric structure?
      hint: null
      type: select_one
      options:
      - Weaving
      - Knitting
      - Interlacing
      required: false
    - id: 8
      name: textile_industry
      label: Who is the primary target of the textile industry?
      hint: null
      type: select_one
      options:
      - Schools
      - Trainers
      - Textile businesses
      required: false
    - id: 9
      name: textile_industry_2
      label: Who are the secondary targets of the textile industry?
      hint: null
      type: select_multiple
      options:
      - Home textiles manufacturers
      - Fashion designers
      - Interior designers
      required: false
    - id: 10
      name: knowledge_level
      label: What is the level of knowledge that this assessment evaluates?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: knowledge_level_2
      label: What is the type of assessment that this form is used for?
      hint: null
      type: text
      options: []
      required: false
