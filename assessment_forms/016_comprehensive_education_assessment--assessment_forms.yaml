inputSchema:
  type: object
  properties:
    title: Comprehensive Education Assessment
    pages:
      - id: 1
        name: section_student_information
        label: -- Student Information --
        hint: Basic student details for the assessment
        type: note
        options: []
        required: false
      - id: 2
        name: student_name
        label: Student name
        hint: Full name of learner
        type: text
        options: []
        required: true
      - id: 3
        name: student_id
        label: Student id
        hint: School or program identifier
        type: text
        options: []
        required: false
      - id: 4
        name: assessment_date
        label: Assessment date
        hint: Date of the assessment
        type: date
        options: []
        required: true
      - id: 5
        name: subject_area
        label: Subject area
        hint: e.g., Mathematics, Science, Writing
        type: text
        options: []
        required: true
      - id: 6
        name: competency_levels
        label: Competency levels
        hint: Rate competencies using provided scale
        type: select_one
        options: [Advanced, Proficient, Basic, Below basic]
        required: true
      - id: 7
        name: evidence_collected
        label: Evidence collected
        hint: Describe evidence or attach links
        type: text
        options: []
        required: false
      - id: 8
        name: teacher_comments
        label: Teacher comments
        hint: Observations and recommendations
        type: text
        options: []
        required: false
      - id: 9
        name: recommended_support
        label: Recommended support
        hint: Interventions or resources to support learning
        type: text
        options: []
        required: false
