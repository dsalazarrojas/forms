inputSchema:
  type: object
  properties:
    title: emotional_and_behavioral_self_assessment_form
    pages:
    - id: 1
      name: self_assessment
      label: How do you feel about yourself
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: frequency_of_emotions
      label: How often do you experience the following emotions?
      hint: null
      type: select_multiple
      options:
      - sadness
      - anxiety
      - anger
      - frustration
      - excitement
      - happiness
      - fear
      - guilt
      - disgust
      required: true
    - id: 3
      name: emotional_state
      label: What is your current emotional state?
      hint: null
      type: select_one
      options:
      - happy
      - sad
      - anxious
      - frustrated
      - angry
      required: true
    - id: 4
      name: emotional_intensity
      label: How often do you experience emotional intensity?
      hint: null
      type: select_one
      options:
      - Rarely
      - Occasionally
      - Frequently
      - Almost Daily
      required: true
    - id: 5
      name: behavioral_patterns
      label: Do you engage in the following behavioral patterns?
      hint: null
      type: select_multiple
      options:
      - avoiding
      - emotional
      - behavioral
      - social
      - interpersonal
      - cognitive
      required: true
    - id: 6
      name: emotional_state_2
      label: What is your emotional state when you experience emotional intensity?
      hint: null
      type: select_one
      options:
      - happy
      - sad
      - anxious
      - frustrated
      - angry
      required: true
    - id: 7
      name: date_of_last_occurrence
      label: Date of last occurrence
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time_of_last_occurrence
      label: Time of last occurrence
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: frequency_of_last_occurrence
      label: Frequency of last occurrence
      hint: null
      type: select_one
      options:
      - Rarely
      - Occasionally
      - Frequently
      - Almost Daily
      required: true
    - id: 10
      name: note
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: submitted_by
      label: Submitted by
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: contact_info
      label: Contact information
      hint: null
      type: email
      options: []
      required: true
