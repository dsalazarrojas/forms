inputSchema:
  type: object
  properties:
    title: Behavioral Concepts Assessment
    pages:
    - id: 1
      name: learner_name
      label: Learner Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: course_title
      label: Course or Training Title
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: concept_1_understanding
      label: Understanding of Habit Loops
      hint: How well do you understand this concept
      type: select_one
      options:
      - Not at All
      - Minimal
      - Moderate
      - Good
      - Excellent
      required: true
    - id: 5
      name: concept_1_confidence
      label: Confidence in Applying Habit Loops
      hint: How confident are you in applying it
      type: select_one
      options:
      - Not at All Confident
      - Slightly Confident
      - Moderately Confident
      - Very Confident
      - Extremely Confident
      required: true
    - id: 6
      name: concept_2_understanding
      label: Understanding of Behavioral Triggers
      hint: null
      type: select_one
      options:
      - Not at All
      - Minimal
      - Moderate
      - Good
      - Excellent
      required: true
    - id: 7
      name: concept_2_confidence
      label: Confidence in Identifying Triggers
      hint: null
      type: select_one
      options:
      - Not at All Confident
      - Slightly Confident
      - Moderately Confident
      - Very Confident
      - Extremely Confident
      required: true
    - id: 8
      name: concept_3_understanding
      label: Understanding of Reinforcement and Rewards
      hint: null
      type: select_one
      options:
      - Not at All
      - Minimal
      - Moderate
