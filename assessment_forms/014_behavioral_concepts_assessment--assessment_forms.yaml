      name: concept_3_confidence
      label: Confidence in Using Rewards Effectively
      hint: null
      type: select_one
      options:
      - Not at All Confident
      - Slightly Confident
      - Moderately Confident
      - Very Confident
      - Extremely Confident
      required: true
    - id: 10
      name: concept_4_understanding
      label: Understanding of Motivation Theories
      hint: null
      type: select_one
      options:
      - Not at All
      - Minimal
      - Moderate
      - Good
      - Excellent
      required: true
    - id: 11
      name: concept_4_confidence
      label: Confidence in Applying Motivation Strategies
      hint: null
      type: select_one
      options:
      - Not at All Confident
      - Slightly Confident
      - Moderately Confident
      - Very Confident
      - Extremely Confident
      required: true
    - id: 12
      name: concept_5_understanding
      label: Understanding of Change Resistance
      hint: null
      type: select_one
      options:
      - Not at All
      - Minimal
      - Moderate
