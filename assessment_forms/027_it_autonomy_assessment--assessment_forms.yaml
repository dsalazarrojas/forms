inputSchema:
  type: object
  properties:
    title: it_autonomy_assessment
    pages:
    - id: 1
      name: intro_page
      label: Intro
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: manager_rating
      label: Manager Rating
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: false
    - id: 3
