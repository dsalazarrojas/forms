      name: surgical_details
      label: Surgical Details
      hint: Provide information about the surgical evaluation
      type: text
      options: []
      required: true
    - id: 4
      name: patient_info
      label: Patient Information
      hint: Enter patient name, date of birth, etc.
      type: text
      options: []
      required: true
    - id: 5
      name: surgical_findings
      label: Surgical Findings
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Unknown
      required: true
    - id: 6
      name: surgical_recommendations
      label: Surgical Recommendations
      hint: null
      type: select_multiple
      options:
