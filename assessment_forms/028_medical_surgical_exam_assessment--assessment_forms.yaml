inputSchema:
  type: object
  properties:
    title: Medical Surgical Exam Assessment
    pages:
    - id: 1
      name: patient_status
      label: Patient Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Stable
      - Unstable
      required: true
    - id: 2
      name: vital_signs
      label: Vital Signs
      hint: null
      type: number
      options: []
      required: true
