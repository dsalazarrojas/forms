inputSchema:
  type: object
  properties:
    title: Health Assessment
    pages:
    - id: 1
      name: page_1
      label: Physical Health
      hint: Please rate your current physical health status
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: page_2
      label: Sleep Habits
      hint: How often do you get enough sleep?
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: page_3
      label: Date of Birth
      hint: Please enter your date of birth
      type: date
      options: []
      required: true
    - id: 4
      name: page_4
      label: Time
      hint: What time do you usually go to bed?
      type: time
      options: []
      required: true
    - id: 5
      name: page_5
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: page_6
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: page_7
      label: Contact Information
      hint: Is there anything else you'd like to add or discuss?
      type: text
      options: []
      required: false
    - id: 8
      name: page_8
      label: Additional Comments
      hint: Is there anything else you'd like to add or discuss?
      type: text
      options: []
      required: false
