inputSchema:
  type: object
  properties:
    title: Preliminary Risk Assessment Form
    pages:
    - id: 1
      name: page_1
      label: 1. Patient Safety
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: page_2
      label: 2. Medical Equipment
      hint: null
      type: select_multiple
      options:
      - Risk of Mechanical Failure
      - Risk of Electrical Shock
      required: false
    - id: 3
      name: page_3
      label: 3. Emergency Procedures
      hint: null
      type: select_multiple
      options:
      - Risk of Delayed Response
      - Insufficient Training
      required: false
    - id: 4
      name: page_4
      label: 4. Medical Conditions
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: page_5
      label: 5. Risk Factors
      hint: null
      type: select_multiple
      options:
      - Age
      - Health Status
      required: false
    - id: 6
      name: page_6
      label: 6. Patient Information
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: page_7
      label: 7. Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: page_8
      label: 8. Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: page_9
      label: 9. Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: page_10
      label: 10. Date of Last Update
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: page_11
      label: 11. Note
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: page_12
      label: 12. Email
      hint: null
      type: email
      options: []
      required: false
