inputSchema:
  type: object
  properties:
    title: Event Environmental Impact Assessment Form
    pages:
    - id: 1
      name: event_name
      label: event_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: location
      label: event_location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date
      label: event_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_start
      label: event_time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: size_of_event
      label: number_of_people
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: duration
      label: event_duration
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: event_type
      label: event_type
      hint: null
      type: select_one
      options:
      - small
      - medium
      - large
      required: false
    - id: 8
      name: waste_management
      label: waste_management
      hint: null
      type: select_one
      options:
      - 'no'
      - 'yes'
      required: false
    - id: 9
      name: recycling_programs
      label: recycling_programs
      hint: null
      type: select_multiple
      options:
      - 'no'
      - 'yes'
      required: false
    - id: 10
      name: energy_efficiency
      label: energy_efficiency
      hint: null
      type: select_one
      options:
      - low
      - moderate
      - high
      required: false
    - id: 11
      name: transportation
      label: transportation
      hint: null
      type: select_multiple
      options:
      - car
      - bus
      - train
      - flight
      required: false
