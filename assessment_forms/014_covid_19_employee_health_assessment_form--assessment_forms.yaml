inputSchema:
  type: object
  properties:
    title: COVID 19 Employee Health Assessment Form
    pages:
    - id: 1
      name: employee_header
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: health_section
      label: -- Health Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: overall_health
      label: Overall Health Status
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: covid_symptoms
      label: Any COVID-19 symptoms currently
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: symptom_list
      label: Symptoms present
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: covid_exposure
      label: Known COVID-19 exposure in past 14 days
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: true
    - id: 12
      name: covid_testing
      label: Have you been tested for COVID-19
      hint: null
      type: select_one
      options:
      - Yes, Positive
      - Yes, Negative
      - Yes, Results Pending
      - 'False'
      required: true
    - id: 13
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      required: true
    - id: 14
      name: medical_conditions
      label: Pre-existing Medical Conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: condition_details
      label: Describe medical conditions if applicable
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: work_readiness
      label: -- Work Readiness --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: ready_to_work
      label: Employee ready to work in-person
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Conditional
      required: true
    - id: 18
      name: work_from_home
      label: Requiring work-from-home accommodation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: accommodation_reason
      label: Reason for accommodation if applicable
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: mental_health
      label: -- Mental Health --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: stress_level
      label: Stress Level
      hint: Rate 1-10
      type: number
      options: []
      required: true
    - id: 22
      name: support_needed
      label: Support or resources needed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: additional_notes
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
