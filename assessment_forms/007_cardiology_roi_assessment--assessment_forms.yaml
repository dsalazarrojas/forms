      type: text
      options: []
      required: true
    - id: 6
      name: cost_of_program
      label: Cost of program
      hint: Total program cost in local currency
      type: number
      options: []
      required: true
    - id: 7
      name: measurable_outcomes
      label: Measurable outcomes
      hint: Key metrics used to evaluate value
      type: text
      options: []
      required: true
    - id: 8
      name: estimated_savings
      label: Estimated savings
      hint: Estimated financial benefit over assessment period
      type: number
      options: []
      required: false
    - id: 9
      name: roi_calculation_method
      label: ROI calculation method
      hint: Brief description of method used
      type: text
      options: []
      required: false
    - id: 10
      name: recommendations
      label: Recommendations based on findings
      hint: Actionable next steps
      type: text
      options: []
      required: false
