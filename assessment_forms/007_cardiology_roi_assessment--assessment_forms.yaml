inputSchema:
  type: object
  properties:
    title: Cardiology ROI Assessment
    pages:
    - id: 1
      name: assessment_context
      label: -- Assessment Context --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: facility_name
      label: Facility name
      hint: Organization performing the assessment
      type: text
      options: []
      required: true
    - id: 3
      name: assessment_period_start
      label: Assessment period start
      hint: Start date for measurement period
      type: date
      options: []
      required: true
    - id: 4
      name: assessment_period_end
      label: Assessment period end
      hint: End date for measurement period
      type: date
      options: []
      required: true
    - id: 5
      name: intervention_description
