inputSchema:
  type: object
  properties:
    title: Computer Systems Knowledge Assessment
    pages:
    - id: 1
      name: assessment_id
      label: Assessment ID
      hint: Unique assessment identifier
      type: text
      options: []
      required: true
    - id: 2
      name: assessment_date
      label: Assessment Date
      hint: Date of assessment
      type: date
      options: []
      required: true
    - id: 3
      name: candidate_name
      label: Candidate Name
      hint: Full name of candidate
      type: text
      options: []
      required: true
    - id: 4
      name: candidate_email
      label: Candidate Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 5
      name: current_role
      label: Current Role
      hint: Your current job title
      type: text
      options: []
      required: true
    - id: 6
      name: years_experience
      label: Years of IT Experience
      hint: How many years of IT experience
      type: select_one
      options:
      - Less than 1 Year
      - 1 to 3 Years
      - 3 to 5 Years
      - 5 to 10 Years
      - More than 10 Years
      required: true
    - id: 7
      name: operating_systems_knowledge
      label: Operating Systems Knowledge
      hint: Rate your knowledge of operating systems
      type: select_one
      options:
      - 5 - Expert
      - 4 - Advanced
      - 3 - Intermediate
      - 2 - Basic
      - 1 - No Knowledge
      required: true
    - id: 8
      name: windows_proficiency
      label: Windows Proficiency
      hint: Rate your Windows skills
      type: select_one
