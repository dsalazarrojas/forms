inputSchema:
  type: object
  properties:
    title: Children Mood Assessment Questionnaire
    pages:
      - id: 1
        name: child_name
        label: Child Name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 2
        name: respondent_role
        label: Respondent Role
        hint: Select your relationship to the child
        type: select_one
        options:
          - Parent
          - Teacher
          - Caregiver
          - Clinician
        required: true
      - id: 3
        name: current_mood
        label: Current Mood
        hint: Choose best description
        type: select_one
        options:
          - Happy
          - Sad
          - Anxious
          - Irritable
        required: true
      - id: 4
        name: mood_frequency
        label: Frequency of Mood Changes
        hint: How often mood shifts occur
        type: select_one
        options:
          - Rarely
          - Sometimes
          - Often
          - Very Often
        required: true
      - id: 5
        name: sleep_changes
        label: Changes in Sleep
        hint: Note any changes in sleep patterns
        type: select_one
        options:
          - No change
          - Less sleep
          - More sleep
          - Interrupted sleep
        required: false
      - id: 6
        name: appetite_changes
        label: Appetite Changes
        hint: Any significant appetite changes
        type: select_one
        options:
          - No change
          - Decreased
          - Increased
        required: false
      - id: 7
        name: functional_impact
        label: Impact on Daily Functioning
        hint: Does mood affect school or relationships
        type: select_one
        options:
          - No impact
          - Mild impact
          - Moderate impact
          - Severe impact
        required: true
      - id: 8
        name: additional_observations
        label: Additional Observations
        hint: Any other details to report
        type: text
        options: []
        required: false
