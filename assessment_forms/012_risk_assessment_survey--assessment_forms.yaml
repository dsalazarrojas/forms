inputSchema:
  type: object
  properties:
    title: Risk Assessment Survey
    pages:
    - id: 1
      name: risk_assessment_survey_page_1
      label: 1. What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: risk_assessment_survey_page_2
      label: 2. What is your email address?
      hint: Please enter a valid email address
      type: text
      options: []
      required: true
    - id: 3
      name: risk_assessment_survey_page_3
      label: 3. What are your concerns about the risk assessment?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: risk_assessment_survey_page_4
      label: 4. Which of the following risk factors are you concerned about?
      hint: null
      type: select_one
      options:
      - Safety
      - Equipment malfunction
      - Human error
      required: true
    - id: 5
      name: risk_assessment_survey_page_5
      label: 5. Do you have any medical conditions that may impact your ability to
        perform the task?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: risk_assessment_survey_page_6
      label: 6. How often do you perform this task?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 7
      name: risk_assessment_survey_page_7
      label: 7. What is the expected duration of the task?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: risk_assessment_survey_page_8
      label: 8. What is your expected time of completion?
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: risk_assessment_survey_page_9
      label: 9. Do you have any allergies or sensitivities that may impact your ability
        to perform the task?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: risk_assessment_survey_page_10
      label: 10. Have you had any previous injuries or accidents while performing
        this task?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
