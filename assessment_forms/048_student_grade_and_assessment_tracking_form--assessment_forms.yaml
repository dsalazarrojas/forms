inputSchema:
  type: object
  properties:
    title: Student Grade And Assessment Tracking Form
    pages:
    - id: 1
      name: student_identifier
      label: Student Identifier
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: assessor_identifier
      label: Assessor Identifier
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: grade
      label: Grade
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: assessment_type
      label: Assessment Type
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: grade_scale
      label: Grade Scale
      hint: null
      type: select_multiple
      options:
      - Scale A
      - Scale B
      - Scale C
      required: false
    - id: 8
      name: student_comments
      label: Student Comments
      hint: null
      type: text
      options: []
      required: false
