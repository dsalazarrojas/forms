inputSchema:
  type: object
  properties:
    title: Academic Exchange Program Impact Assessment
    pages:
    - id: 1
      name: assessment_intro
      label: Academic Exchange Program Impact Assessment
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Full name of the exchange program participant
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email Address
      hint: Contact email for follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: home_institution
      label: Home Institution
      hint: University or institution where you are enrolled
      type: text
      options: []
      required: true
    - id: 5
      name: host_institution
      label: Host Institution
      hint: University or institution where you completed the exchange
      type: text
      options: []
      required: true
    - id: 6
      name: exchange_duration
      label: Duration of Exchange
      hint: How long was your exchange program?
      type: select_one
      options:
      - One semester
      - Two semesters
      - One academic year
      - Summer program
      - Winter program
      - Other
      required: true
    - id: 7
      name: academic_discipline
      label: Academic Discipline
      hint: Your field of study during the exchange
      type: text
      options: []
      required: true
    - id: 8
      name: cultural_integration_rating
      label: Cultural Integration Experience
      hint: Rate how well you integrated into the host culture (1-5 scale)
      type: number
      options: []
      required: true
    - id: 9
      name: academic_quality_rating
      label: Academic Quality
      hint: Rate the quality of academic experience during the exchange (1-5 scale)
      type: number
      options: []
      required: true
    - id: 10
      name: language_improvement_rating
      label: Language Skill Improvement
      hint: Rate improvement in language skills during the exchange (1-5 scale)
      type: number
      options: []
      required: true
    - id: 11
      name: professional_networking_rating
      label: Professional Networking
      hint: Rate opportunities for professional networking during the exchange (1-5
        scale)
      type: number
      options: []
      required: true
    - id: 12
      name: personal_growth_rating
      label: Personal Growth
      hint: Rate the extent of personal growth experienced during the exchange (1-5
        scale)
      type: number
      options: []
      required: true
    - id: 13
      name: career_impact_rating
      label: Career Impact
      hint: Rate how the exchange impacted your career prospects (1-5 scale)
      type: number
      options: []
      required: true
    - id: 14
      name: recommendation_likelihood
      label: Would You Recommend This Program?
      hint: How likely are you to recommend this exchange program to others? (1-5
        scale)
      type: number
      options: []
      required: true
    - id: 15
      name: challenges_faced
      label: Major Challenges Faced
      hint: What were the biggest challenges during your exchange? (Select all that
        apply)
      type: select_multiple
      options:
      - Language barrier
      - Cultural differences
      - Academic system differences
      - Housing issues
      - Financial constraints
      - Homesickness
      - Academic workload
      - None
      required: false
    - id: 16
      name: support_services_rating
      label: Support Services Quality
      hint: Rate the quality of support services provided (1-5 scale)
      type: number
      options: []
      required: true
    - id: 17
      name: overall_satisfaction_rating
      label: Overall Satisfaction
      hint: Rate your overall satisfaction with the exchange program (1-5 scale)
      type: number
      options: []
      required: true
