      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: medical_specialty
      label: Medical Specialty
      hint: null
      type: select_one
      options:
      - Cardiology
      - Dermatology
      - Gastroenterology
      - Nephrology
      - Urology
      required: false
