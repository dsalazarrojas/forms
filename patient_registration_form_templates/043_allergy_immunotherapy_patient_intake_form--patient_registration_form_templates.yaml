inputSchema:
  type: object
  properties:
    title: Allergy Immunotherapy Patient Intake Form
    pages:
    - id: 1
      name: patient_first_name
      label: First Name
      hint: Patient first name
      type: text
      options: []
      required: true
    - id: 2
      name: patient_last_name
      label: Last Name
      hint: Patient last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: mailing_address
      label: Mailing Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Who to call in emergency?
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency number
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to patient
      type: text
      options: []
      required: true
    - id: 11
      name: insurance_provider
      label: Insurance Provider
      hint: Insurance company
      type: text
      options: []
      required: true
    - id: 12
      name: insurance_id
      label: Insurance ID
      hint: Policy number
      type: text
      options: []
      required: true
    - id: 13
      name: insurance_group_number
      label: Group Number
      hint: Group number
      type: text
      options: []
      required: false
    - id: 14
      name: primary_care_physician
      label: Primary Care Physician
      hint: PCP name
      type: text
      options: []
      required: true
    - id: 15
      name: pcp_phone
      label: PCP Phone
      hint: Doctor contact
      type: text
      options: []
      required: true
    - id: 16
      name: referring_physician
      label: Referring Physician
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 17
      name: reason_for_immunotherapy
      label: Reason for Immunotherapy
      hint: Why are you seeking treatment?
      type: text
      options: []
      required: true
    - id: 18
      name: allergy_duration
      label: How Long Have You Had Allergies?
      hint: Duration
      type: select_one
      options:
      - Less than 1 year
      - 1-5 years
      - 6-10 years
      - 11-20 years
      - Over 20 years
      - Since childhood
      required: true
    - id: 19
      name: allergy_types
      label: Types of Allergies
      hint: Select all that apply
      type: select_multiple
      options:
      - Seasonal allergies
      - Perennial allergies
      - Pet allergies
      - Dust mite allergies
      - Mold allergies
      - Pollen allergies
      - Insect sting allergies
      - Other
      required: true
    - id: 20
      name: specific_triggers
      label: Specific Allergy Triggers
      hint: List known triggers
      type: text
      options: []
      required: true
    - id: 21
      name: symptom_severity
      label: Symptom Severity
      hint: Rate your symptoms
      type: select_one
      options:
      - Mild
      - Moderate
      - Severe
      - Debilitating
      required: true
    - id: 22
      name: current_symptoms
      label: Current Symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - Sneezing
      - Runny nose
      - Stuffy nose
      - Itchy eyes
      - Watery eyes
      - Coughing
      - Wheezing
      - Shortness of breath
      - Skin rash
      - Hives
      - Fatigue
      - Headache
      - Other
      required: true
    - id: 23
      name: previous_allergy_treatments
      label: Previous Allergy Treatments
      hint: What have you tried?
      type: select_multiple
      options:
      - Antihistamines
      - Decongestants
      - Nasal sprays
      - Eye drops
      - Asthma medications
      - Previous immunotherapy
      - Alternative therapies
      - None
      required: true
    - id: 24
      name: current_medications
      label: Current Medications
      hint: List all medications
      type: text
      options: []
      required: true
    - id: 25
      name: medication_allergies
      label: Medication Allergies
      hint: Any drug allergies?
      type: text
      options: []
      required: true
    - id: 26
      name: asthma_diagnosis
      label: Asthma Diagnosis
      hint: Do you have asthma?
      type: select_one
      options:
      - Yes, well-controlled
      - Yes, not well-controlled
      - false
      - Not sure
      required: true
    - id: 27
      name: asthma_medications
      label: Asthma Medications
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 28
      name: heart_conditions
      label: Heart Conditions
      hint: Any heart problems?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 29
      name: lung_conditions
      label: Lung Conditions
      hint: Any lung problems?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 30
      name: immune_system_disorders
      label: Immune System Disorders
      hint: Any immune conditions?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 31
      name: cancer_history
      label: Cancer History
      hint: Any history of cancer?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 32
      name: pregnancy_status
      label: Pregnancy Status
      hint: Are you pregnant or nursing?
      type: select_one
      options:
      - Yes, pregnant
      - Yes, nursing
      - false
      - Not applicable
      required: true
    - id: 33
      name: previous_immunotherapy
      label: Previous Immunotherapy
      hint: Have you had allergy shots before?
      type: select_one
      options:
      - Yes, completed treatment
      - Yes, discontinued
      - No, first time
      required: true
    - id: 34
      name: previous_immunotherapy_reason_stop
      label: Reason for Stopping
      hint: If discontinued
      type: text
      options: []
      required: false
    - id: 35
      name: beta_blocker_use
      label: Beta-Blocker Use
      hint: Do you take beta-blockers?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 36
      name: ace_inhibitor_use
      label: ACE Inhibitor Use
      hint: Do you take ACE inhibitors?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 37
      name: ability_to_communicate_symptoms
      label: Ability to Communicate Symptoms
      hint: Can you report reactions?
      type: select_one
      options:
      - Yes, clearly
      - Yes, with assistance
      - false
      required: true
    - id: 38
      name: transportation_available
      label: Transportation Available
      hint: Can you get to appointments?
      type: select_one
      options:
      - Yes, own vehicle
      - Yes, family/friend
      - Yes, public transportation
      - No, need assistance
      required: true
    - id: 39
      name: availability_for_treatment
      label: Availability for Treatment
      hint: When can you come?
      type: select_multiple
      options:
      - Weekday mornings
      - Weekday afternoons
      - Weekday evenings
      - Saturday mornings
      - Flexible schedule
      required: true
    - id: 40
      name: treatment_goals
      label: Treatment Goals
      hint: What do you hope to achieve?
      type: text
      options: []
      required: true
    - id: 41
      name: questions_concerns
      label: Questions or Concerns
      hint: Anything you want to ask?
      type: text
      options: []
      required: false
    - id: 42
      name: how_hear_about_clinic
      label: How Did You Hear About Us?
      hint: Source
      type: select_one
      options:
      - Physician referral
      - Internet search
      - Friend/family
      - Insurance directory
      - Advertisement
      - Other
      required: false
    - id: 43
      name: consent_to_treatment
      label: Consent to Treatment
      hint: Do you consent?
      type: select_one
      options:
      - Yes, I consent
      - false
      required: true
    - id: 44
      name: hipaa_acknowledgment
      label: HIPAA Acknowledgment
      hint: Have you read HIPAA notice?
      type: select_one
      options:
      - Yes, I acknowledge
      - false
      required: true
    - id: 45
      name: patient_signature
      label: Patient Signature
      hint: Signature confirmation
      type: select_one
      options:
      - I certify this information is accurate
      - Not yet signed
      required: true
    - id: 46
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
