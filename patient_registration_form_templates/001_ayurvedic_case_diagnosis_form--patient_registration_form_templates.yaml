        hint: null
        type: select_one
        options:
          - Male
          - Female
          - Other
        required: true
      - id: 5
        name: section_ayurvedic_profile
        label: -- Ayurvedic Profile Assessment --
        hint: null
        type: note
        options: []
        required: false
