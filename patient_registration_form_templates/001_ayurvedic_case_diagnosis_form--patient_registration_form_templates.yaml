        name: primary_complaint
        label: Primary Health Concern or Complaint
        hint: Briefly describe why you are seeking Ayurvedic consultation
        type: text
        options: []
        required: true
      - id: 7
        name: body_frame
        label: Body Frame and Build
        hint: Describe your natural physical build
        type: select_one
        options:
