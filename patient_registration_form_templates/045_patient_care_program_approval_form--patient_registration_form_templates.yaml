inputSchema:
  type: object
  properties:
    title: Patient Care Program Approval Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: program_name
      label: Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: program_type
      label: Program Type
      hint: null
      type: select_one
      options:
      - Medication Management
      - Disease Management
      - Wound Care
      required: false
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: status
      label: Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 7
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: provider_name
      label: Provider Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: provider_phone
      label: Provider Phone
      hint: null
      type: text
      options: []
      required: false
