inputSchema:
  type: object
  properties:
    title: Functional Analysis Screening Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: functional_status
      label: Functional Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 3
      name: bathing_ability
      label: Bathing Ability
      hint: null
      type: select_one
      options:
      - Bathing with minimal assistance
      - Bathing with moderate assistance
      - Bathing with maximal assistance
      - Unable to bathe
      required: true
    - id: 4
      name: eating_ability
      label: Eating Ability
      hint: null
      type: select_one
      options:
      - Eating with minimal assistance
      - Eating with moderate assistance
      - Eating with maximal assistance
      - Unable to eat
      required: true
    - id: 5
      name: dressing_ability
      label: Dressing Ability
      hint: null
      type: select_one
      options:
      - Dressing with minimal assistance
      - Dressing with moderate assistance
      - Dressing with maximal assistance
      - Unable to dress
      required: true
    - id: 6
      name: personal_care
      label: Personal Care
      hint: null
      type: select_one
      options:
      - Bathing
      - Dressing
      - Toilet Use
      - Grooming
      - Unable to perform personal care
      required: true
    - id: 7
      name: mobility
      label: Mobility
      hint: null
      type: select_one
      options:
      - Limited mobility in the bed
      - Limited mobility outside of bed
      - Normal mobility
      - Unable to walk
      required: true
    - id: 8
      name: transferability
      label: Transferability
      hint: null
      type: select_one
      options:
      - Needs to be transferred
      - Able to transfer
      - Unable to transfer
      required: true
    - id: 9
      name: continence
      label: Continence
      hint: null
      type: select_one
      options:
      - Normal
      - Limited
      - Frequent
      - Incontinent
      required: true
    - id: 10
      name: communication
      label: Communication
      hint: null
      type: select_one
      options:
      - Normal
      - Limited
      - No response
      required: true
    - id: 11
      name: vision
      label: Vision
      hint: null
      type: select_one
      options:
      - Normal
      - Limited
      - Blind
      required: true
    - id: 12
      name: hearing
      label: Hearing
      hint: null
      type: select_one
      options:
      - Normal
      - Limited
      - Deaf
      required: true
    - id: 13
      name: cognition
      label: Cognition
      hint: null
      type: select_one
      options:
      - Normal
      - Limited
      - Confused
      - Unable to recognize people
      required: true
    - id: 14
      name: emotional_status
      label: Emotional Status
      hint: null
      type: select_one
      options:
      - Normal
      - Limited
      - Depressed
      - Unable to cope
      required: true
    - id: 15
      name: safety
      label: Safety
      hint: null
      type: select_one
      options:
      - Safe
      - Not safe
      required: true
    - id: 16
      name: medication_management
      label: Medication Management
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: medication_side_effects
      label: Medication Side Effects
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: pain_level
      label: Pain Level
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: overall_status
      label: Overall Status
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: date_last_screening
      label: Date Last Screening
      hint: null
      type: date
      options: []
      required: false
    - id: 22
      name: time_last_screening
      label: Time Last Screening
      hint: null
      type: time
      options: []
      required: false
    - id: 23
      name: total_days_in_care
      label: Total Days in Care
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: screening_status
      label: Screening Status
      hint: null
      type: select_one
      options:
      - Active
      - Discontinued
      required: true
