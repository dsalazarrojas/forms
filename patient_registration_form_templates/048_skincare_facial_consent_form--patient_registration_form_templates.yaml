inputSchema:
  type: object
  properties:
    title: Skincare Facial Consent Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: Please enter a phone number
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: expected_visit_date
      label: Expected Visit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: visit_time
      label: Visit Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: therapist_name
      label: Therapist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Massage
      - Chemical Peel
      - Microdermabrasion
      - Skincare Routine
      - Other
      required: false
    - id: 8
      name: service_area
      label: Service Area
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: consent_time
      label: Consent Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
