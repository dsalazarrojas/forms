      - id: 2
        name: patient_name
        label: Patient Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: patient_id
        label: Patient ID/Medical Record Number
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: hospital_number
        label: Hospital/Unit Number
        hint: null
        type: text
        options: []
        required: false
      - id: 5
        name: date_of_birth
        label: Date of Birth
        hint: null
        type: date
        options: []
        required: true
      - id: 6
        name: verification_date
        label: Verification Date
        hint: null
        type: date
        options: []
        required: true
      - id: 7
        name: verification_time
        label: Verification Time
        hint: null
        type: time
        options: []
        required: true
      - id: 8
