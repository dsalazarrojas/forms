inputSchema:
  type: object
  properties:
    title: Blood Transfusion Verification Checklist
    pages:
      - id: 1
        name: verification_intro
        label: -- Blood Transfusion Safety Checklist --
        hint: Pre-transfusion verification procedures
        type: note
        options: []
