        hint: null
        type: select_one
        options: ["Yes", "No"]
        required: true
      - id: 12
        name: unit_identification_correct
        label: Blood unit identification matches patient record
        hint: null
        type: select_one
        options: ["Yes", "No"]
        required: true
      - id: 13
        name: unit_blood_type_matches
        label: Unit blood type matches patient blood type
        hint: null
        type: select_one
        options: ["Yes", "No"]
