inputSchema:
  type: object
  properties:
    title: health_services_availability_form
    pages:
    - id: 1
      name: service_name
      label: Services Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_category
      label: Services Category
      hint: null
      type: select_one
      options:
      - General
      - Specialist
      required: true
    - id: 3
      name: provider_name
      label: Provider Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: schedule
      label: Schedule
      hint: null
      type: select_multiple
      options:
      - Mon
      - Tue
      - Wed
      - Thu
      - Fri
      - Sat
      - Sun
      required: true
    - id: 5
      name: availability
      label: Availability
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: service_description
      label: Service Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
