inputSchema:
  type: object
  properties:
    title: dropbox_patient_intake_form
    pages:
    - id: 1
      name: user_first_name
      label: User First Name
      hint: Enter the user's first name
      type: text
      options: []
      required: true
    - id: 2
      name: user_last_name
      label: User Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: user_email
      label: User Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: user_phone
      label: User Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: medical_record_id
      label: Medical Record ID
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: medical_provider
      label: Medical Provider
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: uploaded_medical_record
      label: Upload Medical Record
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: consent
      label: User Consent
      hint: null
      type: note
      options: []
      required: true
