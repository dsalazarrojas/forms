inputSchema:
  type: object
  properties:
    title: School Project Evaluation Form For Parents
    pages:
    - id: 1
      name: parent_feedback
      label: Parent Feedback
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: project_details
      label: Project Details
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: student_performance
      label: Student Performance
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: teacher_comments
      label: Teacher Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: parent_comments
      label: Parent Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: project_grade
      label: Project Grade
      hint: null
      type: select_one
      options:
      - A
      - B
      - C
      - D
      required: true
    - id: 7
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: parent_contact
      label: Parent Contact
      hint: null
      type: text
      options: []
      required: true
