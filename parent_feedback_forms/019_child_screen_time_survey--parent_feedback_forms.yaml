inputSchema:
  type: object
  properties:
    title: Child Screen Time Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: Date of survey completion
      type: date
      options: []
      required: true
    - id: 2
      name: parent_guardian_first_name
      label: Parent or Guardian First Name
      hint: Legal first name of parent or guardian
      type: text
      options: []
      required: true
    - id: 3
      name: parent_guardian_last_name
      label: Parent or Guardian Last Name
      hint: Legal last name of parent or guardian
      type: text
      options: []
      required: true
    - id: 4
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Primary email address for contact
      type: email
      options: []
      required: true
    - id: 5
      name: child_first_name
      label: Child First Name
      hint: Legal first name of the child
      type: text
      options: []
      required: true
    - id: 6
      name: child_last_name
      label: Child Last Name
      hint: Legal last name of the child
      type: text
      options: []
      required: true
    - id: 7
      name: child_age
      label: Child Age
      hint: Current age of the child in years
      type: number
      options: []
      required: true
    - id: 8
      name: child_grade_level
      label: Child Grade Level
      hint: Current grade level of the child
      type: select_one
      options:
      - Pre-K
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 9
      name: devices_owned
      label: Devices Child Uses
      hint: Select all devices the child regularly uses
      type: select_multiple
      options:
      - Tablet
      - Smartphone
      - Computer or laptop
      - Gaming console
      - Smart TV
      - E-reader
      - None
      required: true
    - id: 10
      name: weekday_screen_time
      label: Average Weekday Screen Time
      hint: How many hours per day on weekdays?
      type: select_one
      options:
      - Less than 1 hour
      - 1 to 2 hours
      - 2 to 3 hours
      - 3 to 4 hours
      - 4 to 5 hours
      - More than 5 hours
      required: true
    - id: 11
      name: weekend_screen_time
      label: Average Weekend Screen Time
      hint: How many hours per day on weekends?
      type: select_one
      options:
      - Less than 1 hour
      - 1 to 2 hours
      - 2 to 3 hours
      - 3 to 4 hours
      - 4 to 5 hours
      - More than 5 hours
      required: true
    - id: 12
      name: primary_screen_activities
      label: Primary Screen Activities
      hint: What does the child primarily do on screens?
      type: select_multiple
      options:
      - Educational apps or websites
      - Watching videos or shows
      - Playing games
      - Social media
      - Video calls with family or friends
      - Homework or schoolwork
      - Reading
      - Creating content
      - Other
      required: true
    - id: 13
      name: screen_time_rules
      label: Screen Time Rules
      hint: Do you have rules about screen time in your home?
      type: select_one
      options:
      - Yes, strict time limits
      - Yes, moderate guidelines
      - Yes, minimal rules
      - No formal rules
      - Rules are inconsistently enforced
      required: true
    - id: 14
      name: screen_free_zones
      label: Screen-Free Zones
      hint: Are there areas in your home where screens are not allowed?
      type: select_multiple
      options:
      - Bedrooms
      - Dining room or kitchen
      - Car
      - Outdoor play areas
      - No screen-free zones
      - Other
      required: true
    - id: 15
      name: screen_time_before_bed
      label: Screen Time Before Bed
      hint: Is the child allowed screen time before bedtime?
      type: select_one
      options:
      - Yes, unlimited
      - Yes, with time limits
      - Yes, but only calm activities
      - No, screens off 1 hour before bed
      - No, screens off 2 hours before bed
      required: true
    - id: 16
      name: behavioral_changes_observed
      label: Behavioral Changes Observed
      hint: Have you noticed behavioral changes related to screen time?
      type: select_multiple
      options:
      - Irritability when screens are removed
      - Difficulty transitioning to other activities
      - Sleep disturbances
      - Decreased interest in outdoor play
      - Improved learning or skills
      - Better hand-eye coordination
      - No noticeable changes
      - Other
      required: true
    - id: 17
      name: sleep_quality
      label: Child Sleep Quality
      hint: How would you rate your child's sleep quality?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 18
      name: physical_activity_level
      label: Physical Activity Level
      hint: How active is your child physically each day?
      type: select_one
      options:
      - Very active (2+ hours outdoor play)
      - Moderately active (1-2 hours)
      - Somewhat active (30 min to 1 hour)
      - Minimally active (less than 30 min)
      - Sedentary
      required: true
    - id: 19
      name: social_interaction_impact
      label: Impact on Social Interaction
      hint: How does screen time affect your child's social interactions?
      type: select_one
      options:
      - Very positive
      - Somewhat positive
      - No noticeable impact
      - Somewhat negative
      - Very negative
      required: true
    - id: 20
      name: academic_performance_impact
      label: Impact on Academic Performance
      hint: How does screen time affect your child's schoolwork?
      type: select_one
      options:
      - Very positive
      - Somewhat positive
      - No noticeable impact
      - Somewhat negative
      - Very negative
      required: true
    - id: 21
      name: parental_controls_used
      label: Parental Controls Used
      hint: Do you use parental controls or monitoring software?
      type: select_one
      options:
      - Yes, comprehensive controls
      - Yes, basic controls
      - Yes, time limits only
      - No, but considering it
      - false
      required: true
    - id: 22
      name: content_monitoring
      label: Content Monitoring
      hint: How do you monitor what your child views online?
      type: select_one
      options:
      - Actively monitor all content
      - Periodically check browsing history
      - Use filtering software
      - Rely on trust and conversations
      - Minimal monitoring
      required: true
    - id: 23
      name: screen_time_concerns
      label: Screen Time Concerns
      hint: What are your main concerns about your child's screen time?
      type: text
      options: []
      required: false
    - id: 24
      name: support_needed
      label: Support Needed
      hint: What support or resources would help you manage screen time?
      type: text
      options: []
      required: false
