inputSchema:
  type: object
  properties:
    title: School Event Parent Feedback Questionnaire
    pages:
    - id: 1
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - School Event
      - School Field Trip
      - School Assembly
      - School Festival
      - School Camp
      - Other (Specify)
      required: false
    - id: 5
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: parent_contact_method
      label: Parent Contact Method
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Text
      - In-person
      - Other (Specify)
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: event_satisfaction
      label: Event Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
