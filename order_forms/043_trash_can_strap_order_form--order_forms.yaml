inputSchema:
  type: object
  properties:
    title: Trash Can Strap Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: strap_size
      label: Strap Size
      hint: null
      type: select_multiple
      options:
      - Large
      - Medium
      - Small
      required: true
    - id: 4
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 6
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
