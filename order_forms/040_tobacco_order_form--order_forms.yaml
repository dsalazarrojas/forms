inputSchema:
  type: object
  properties:
    title: tobacco_order_form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_selection
      label: Product Selection
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - card
      - echeck
      - paypal
      required: false
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: total_amount
      label: Total Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - New
      - Pending
      - Confirmed
      required: false
    - id: 9
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Not Paid
      - Partially Paid
      required: false
