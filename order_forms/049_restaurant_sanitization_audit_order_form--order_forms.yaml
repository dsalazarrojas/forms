inputSchema:
  type: object
  properties:
    title: Restaurant Sanitization Audit Order Form
    pages:
    - id: 1
      name: restaurant_sanitization_audit_order_form_page_1
      label: Restaurant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: restaurant_sanitization_audit_order_form_page_2
      label: Date of Last Inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: restaurant_sanitization_audit_order_form_page_3
      label: Is the restaurant currently open?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: kitchen_cleanliness
      label: Is the kitchen clean and organized?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: kitchen_temperature
      label: What is the current temperature of the kitchen?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: last_water_test_date
      label: When was the last time the restaurant's water was tested?
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: sanitization
      label: Is the restaurant's dishwashing station properly sanitized?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: equipment_cleaning_date
      label: What is the current date of the last time the restaurant's equipment
        was cleaned?
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: waste_disposal_area_cleanliness
      label: Is the restaurant's waste disposal area clean and well-maintained?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
