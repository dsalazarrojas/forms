inputSchema:
  type: object
  properties:
    title: Commission Order Form
    pages:
    - id: 1
      name: section_client_info
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: section_project_details
      label: -- Project Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: project_type
      label: Type of Work to be Commissioned
      hint: null
      type: select_one
      options:
      - Digital Art
      - Software Development
      - Graphic Design
      - Writing/Editing
      - Research
      required: true
    - id: 7
      name: project_title
      label: Project Title or Short Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: detailed_description
      label: Detailed Project Description
      hint: Provide as much detail as possible to ensure accuracy
      type: text
      options: []
      required: true
    - id: 9
      name: project_deadline
      label: Requested Deadline
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: project_budget
      label: Estimated Budget
      hint: If applicable, otherwise enter 0
      type: number
      options: []
      required: false
    - id: 11
      name: section_specifications
      label: -- Specifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: file_format_preference
      label: Preferred Final File Format
      hint: e.g., PNG, PDF, ZIP, etc.
      type: text
      options: []
      required: true
    - id: 13
      name: usage_rights
      label: Intended Usage Rights
      hint: null
      type: select_one
      options:
      - Personal Use Only
      - Commercial Use
      - Full Rights Ownership
      required: true
    - id: 14
      name: additional_requirements
      label: Any Additional Requirements or Constraints
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: section_agreement
      label: -- Terms and Conditions --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: terms_acceptance
      label: I agree to the commission terms and payment schedule
      hint: null
      type: select_one
      options:
      - I agree
      - Other
      required: true
    - id: 17
      name: order_date
      label: Order Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 18
      name: client_signature
      label: Digital Signature
      hint: Type your full name to sign
      type: text
      options: []
      required: true
