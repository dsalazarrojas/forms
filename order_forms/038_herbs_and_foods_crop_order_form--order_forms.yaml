inputSchema:
  type: object
  properties:
    title: herbs_and_foods_crop_order_form
    pages:
    - id: 1
      name: order_information
      label: order_information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: crop_information
      label: crops
      hint: null
      type: select_multiple
      options:
      - Herbs
      - Vegetables
      - Fruits
      required: true
    - id: 3
      name: crop_quantities
      label: quantities
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: order_details
      label: order_details
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: customer_info
      label: customer_info
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      - Other
      required: true
    - id: 6
      name: payment_info
      label: payment_info
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Bank Transfer
      required: false
    - id: 7
      name: delivery_info
      label: delivery_info
      hint: null
      type: select_one
      options:
      - Same Day
      - Next Day
      - Later
      required: true
    - id: 8
      name: submit_info
      label: submit_info
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
