      type: number
      options: []
      required: false
    - id: 9
      name: customer_note
      label: Customer Note
      hint: Customer's note to seller
      type: text
      options: []
      required: false
    - id: 10
      name: color_stations_2
      label: Color Stations 2
      hint: null
      type: select_multiple
      options:
      - Color Station A
      - Color Station B
      - Color Station C
      required: false
    - id: 11
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: color_stations_3
      label: Color Stations 3
      hint: null
      type: select_multiple
      options:
      - Color Station A
      - Color Station B
      - Color Station C
      required: false
    - id: 14
      name: customer_zip
      label: Customer Zip
      hint: Zip Code with no dashes
      type: text
      options: []
      required: false
