      type: text
      options: []
      required: false
    - id: 4
      name: order_details
      label: Order Details
      hint: Any additional notes about this order
      type: note
      options: []
      required: false
    - id: 5
      name: customer_email
      label: Customer E-Mail
      hint: Customer's e-mail
      type: email
      options: []
      required: false
    - id: 6
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: quantity
      label: Quantity
