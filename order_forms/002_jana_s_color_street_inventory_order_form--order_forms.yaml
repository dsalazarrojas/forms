      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: color_stations
      label: Color Stations
      hint: null
      type: select_multiple
      options:
      - Color Station A
      - Color Station B
      - Color Station C
      required: false
    - id: 3
      name: customer_address
      label: Customer Address
