inputSchema:
  type: object
  properties:
    title: Clone Of Nail Art & Designs By Cassandra Powers On Hand Inventory Orders
    pages:
    - id: 1
      name: header
      label: -- Inventory Order Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: stylist_name
      label: Stylist name
      hint: Full name for order processing
      type: text
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Contact phone
      hint: Phone number for delivery questions
      type: text
      options: []
      required: false
    - id: 4
      name: item_description
      label: Item description
      hint: Product name and variant
      type: text
      options: []
      required: true
    - id: 5
      name: sku_or_code
      label: SKU or code
      hint: Internal product code
      type: text
      options: []
      required: false
    - id: 6
      name: quantity
      label: Quantity requested
      hint: Whole number of units
      type: number
      options: []
      required: true
    - id: 7
      name: unit_cost
      label: Unit cost
      hint: Enter decimal if needed
      type: number
      options: []
      required: false
    - id: 8
      name: supplier_preference
      label: Supplier preference
      hint: Choose preferred supplier
      type: select_one
      options:
      - Default supplier
      - Alternate supplier
      - No preference
      required: false
    - id: 9
      name: delivery_date_needed
      label: Delivery date needed
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 10
      name: special_handling
      label: Special handling instructions
      hint: Packaging or temperature notes
      type: text
      options: []
      required: false
