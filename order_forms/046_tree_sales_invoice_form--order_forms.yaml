inputSchema:
  type: object
  properties:
    title: Tree Sales Invoice Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: Customer's name, address, and phone number
      type: text
      options: []
      required: true
    - id: 2
      name: tree_type
      label: Tree Type
      hint: Is this a sale or lease?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: tree_quantity
      label: Tree Quantity
      hint: Number of trees sold
      type: number
      options: []
      required: true
    - id: 4
      name: delivery_date
      label: Delivery Date
      hint: Date of delivery
      type: date
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: How will the customer pay?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: payment_status
      label: Payment Status
      hint: Status of payment
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 7
      name: delivery_status
      label: Delivery Status
      hint: Status of delivery
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 8
      name: total_cost
      label: Total Cost
      hint: Total cost of the trees sold
      type: number
      options: []
      required: true
    - id: 9
      name: note
      label: Note
      hint: Any special notes or instructions
      type: note
      options: []
      required: false
    - id: 10
      name: customer_email
      label: Customer Email
      hint: Customer email address
      type: email
      options: []
      required: false
    - id: 11
      name: customer_phone
      label: Customer Phone
      hint: Customer phone number
      type: text
      options: []
      required: true
    - id: 12
      name: customer_address
      label: Customer Address
      hint: Customer's address
      type: text
      options: []
      required: true
