inputSchema:
  type: object
  properties:
    title: Student Monthly Food Order Form
    pages:
    - id: 1
      name: meal_preferences
      label: Meal Preferences
      hint: null
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Rarely
      required: false
    - id: 2
      name: meal_frequency
      label: Meal Frequency
      hint: null
      type: select_one
      options:
      - 1-2
      - 3-4
      - 5-6
      required: false
    - id: 3
      name: meal_cuisine
      label: Meal Cuisine
      hint: null
      type: select_one
      options:
      - Indian
      - Chinese
      - Italian
      - Others
      required: false
    - id: 4
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: discount
      label: Discount
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: contact_info_email
      label: Contact Information - Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: contact_info_phone
      label: Contact Information - Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: special_requests
      label: Special Requests
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: payment_online
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Online
      - Offline
      required: false
    - id: 12
      name: receipt
      label: Receipt
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
