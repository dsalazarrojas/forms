inputSchema:
  type: object
  properties:
    title: Accounting Software Subscription Form
    pages:
    - id: 1
      name: subscriber_info
      label: -- Subscriber information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company name
      hint: Legal or trading name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Contact name
      hint: Primary contact for account setup
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email
      hint: Email for billing and license delivery
      type: email
      options: []
      required: true
    - id: 5
      name: plan_selected
      label: Plan selected
      hint: Choose subscription tier
      type: select_one
      options:
      - Starter
      - Professional
      - Enterprise
      required: true
    - id: 6
      name: number_of_users
      label: Number of users
      hint: Licenses required
      type: number
      options: []
      required: true
    - id: 7
      name: billing_cycle
      label: Billing cycle
      hint: Frequency of payment
      type: select_one
      options:
      - Monthly
      - Annual
      required: true
    - id: 8
      name: payment_method
      label: Payment method
      hint: Enter preferred payment method
      type: select_one
      options:
      - Credit card
      - Bank transfer
      - Invoice
      required: true
    - id: 9
      name: billing_contact_phone
      label: Billing contact phone
      hint: Phone for billing inquiries
      type: text
      options: []
      required: false
    - id: 10
      name: start_date
      label: Subscription start date
      hint: Requested start date for subscription
      type: date
      options: []
      required: false
    - id: 11
      name: integrations_required
      label: Integrations required
      hint: List any platforms to integrate with
      type: text
      options: []
      required: false
    - id: 12
      name: terms_and_conditions
      label: Terms and conditions acceptance
      hint: Agree to license and service terms
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 13
      name: purchase_order_number
      label: Purchase order number
      hint: Optional PO for billing
      type: text
      options: []
      required: false
    - id: 14
      name: additional_notes
      label: Additional notes
      hint: Any other information for provisioning
      type: text
      options: []
      required: false
