inputSchema:
  type: object
  properties:
    title: Online Buyers Order Form
    pages:
    - id: 1
      name: payment_method
      label: LBC
      hint: null
      type: select_one
      options:
      - LBC
      - Cebuana Lhuillier
      - M Lhuillier
      - Western Union
      required: false
    - id: 2
      name: name
      label: customer_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: phone
      label: customer_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: address
      label: customer_address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: customer_email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: order_details
      label: order_details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: payment_method2
      label: payment_method2
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: order_amount
      label: order_amount
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: order_date
      label: order_date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: order_time
      label: order_time
      hint: null
      type: time
      options: []
      required: false
