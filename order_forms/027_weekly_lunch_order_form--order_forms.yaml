inputSchema:
  type: object
  properties:
    title: Weekly Lunch Order Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: lunch_location
      label: Lunch Location
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: meal_selection
      label: Meal Selection
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: special_instructions
      label: Special Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: employee_phone
      label: Employee Phone
      hint: null
      type: text
      options: []
      required: true
