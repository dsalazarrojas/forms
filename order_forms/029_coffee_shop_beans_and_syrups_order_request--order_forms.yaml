      name: section_syrups
      label: -- Syrups and Flavorings Order --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: syrup_type
      label: Syrup Type
      hint: Flavor preference
      type: select_one
      options:
      - Vanilla
      - Caramel
      - Hazelnut
      - French vanilla
      - Cinnamon
      - Mocha
      - Butterscotch
      - Sugar-free options
      - Other
      required: true
    - id: 20
      name: syrup_quantity
      label: Quantity - bottles or liters
      hint: How much syrup
      type: number
      options: []
      required: true
    - id: 21
      name: bottle_size
      label: Bottle Size
      hint: null
      type: select_one
      options:
