      name: section_business
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: business_name
      label: Business Name
      hint: Café or coffee shop name
      type: text
      options: []
      required: true
    - id: 3
      name: owner_name
      label: Owner or Manager Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: business_address
      label: Business Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_delivery
      label: -- Delivery Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: delivery_method
      label: Preferred Delivery Method
      hint: null
      type: select_one
      options:
      - Pickup
      - Delivery
      - Either
      required: true
    - id: 9
      name: delivery_date
      label: Requested Delivery Date
      hint: null
      type: date
      options: []
      required: true
