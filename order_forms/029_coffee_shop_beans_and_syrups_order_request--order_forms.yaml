      name: bean_type
      label: Coffee Bean Type
      hint: Variety or blend
      type: select_one
      options:
      - Single Origin
      - Blend
      - Dark Roast
      - Medium Roast
      - Light Roast
      - Decaf
      - Espresso
      required: true
    - id: 12
      name: bean_quantity
      label: Quantity - pounds
      hint: How many pounds of beans
      type: number
      options: []
      required: true
    - id: 13
      name: bean_origin
      label: Bean Origin or Variety
      hint: Brazil, Ethiopia, Colombia, etc
      type: text
      options: []
      required: false
    - id: 14
      name: grind_option
      label: Grind Option
      hint: null
      type: select_one
      options:
      - Whole beans
      - Finely ground
      - Medium grind
      - Coarse grind
      required: true
    - id: 15
      name: add_more_beans
      label: Order Additional Coffee Beans
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 16
      name: bean_type_2
      label: Second Coffee Bean Type
      hint: Optional additional variety
      type: select_one
      options:
      - Single Origin
      - Blend
      - Dark Roast
      - Medium Roast
      - Light Roast
      - Decaf
      - Espresso
      required: false
    - id: 17
      name: bean_quantity_2
      label: Quantity - pounds
      hint: null
      type: number
      options: []
      required: false
