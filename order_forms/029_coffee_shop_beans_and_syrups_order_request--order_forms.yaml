      - 'No'
      required: false
    - id: 23
      name: syrup_type_2
      label: Second Syrup Type
      hint: Optional additional flavor
      type: select_one
      options:
      - Vanilla
      - Caramel
      - Hazelnut
      - French vanilla
      - Cinnamon
      - Mocha
      - Butterscotch
      - Sugar-free options
      - Other
      required: false
    - id: 24
      name: syrup_quantity_2
      label: Quantity - bottles or liters
      hint: null
      type: number
      options: []
      required: false
    - id: 25
      name: section_special
      label: -- Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: special_requests
      label: Special Requests or Notes
      hint: Any specific preferences or requirements
      type: text
      options: []
      required: false
