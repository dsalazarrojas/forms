inputSchema:
  type: object
  properties:
    title: Adventures Hiking Trip Pre Order Form
    pages:
    - id: 1
      name: preorder_header
      label: -- Trip Pre Order --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organizer_name
      label: Organizer name
      hint: For booking records
      type: text
      options: []
      required: true
    - id: 3
      name: trip_date
      label: Trip date
      hint: Date of hiking trip
      type: date
      options: []
      required: true
    - id: 4
      name: group_size
      label: Group size
      hint: Number of participants
      type: number
      options: []
      required: true
    - id: 5
      name: meal_options
      label: Meal options and counts
      hint: Indicate vegetarian or special meals
      type: text
      options: []
      required: false
    - id: 6
      name: equipment_rental
      label: Equipment rental required
      hint: Tents, trekking poles, or none
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: pickup_location
      label: Pickup location
      hint: Meeting point for trip
      type: text
      options: []
      required: true
    - id: 8
      name: payment_status
      label: Payment status
      hint: Paid or pending
      type: select_one
      options:
      - Paid
      - Pending
      - Invoice
      required: true
    - id: 9
      name: special_requirements
      label: Special requirements
      hint: Accessibility or dietary needs
      type: text
      options: []
      required: false
    - id: 10
      name: contact_phone
      label: Contact phone
      hint: For trip coordination
      type: text
      options: []
      required: true
