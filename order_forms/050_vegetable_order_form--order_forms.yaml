inputSchema:
  type: object
  properties:
    title: Vegetable Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: customer_address
      label: Customer Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: select_vegetables
      label: Select Vegetables
      hint: null
      type: select_multiple
      options:
      - Broccoli
      - Carrot
      - Kale
      - Spinach
      required: false
    - id: 7
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: false
