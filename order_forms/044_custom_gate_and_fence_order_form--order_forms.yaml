inputSchema:
  type: object
  properties:
    title: Custom Gate And Fence Order Form
    pages:
    - id: 1
      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: gate_type
      label: Gate Type
      hint: null
      type: select_one
      options:
      - Gate
      - Other
      required: true
    - id: 4
      name: fence_type
      label: Fence Type
      hint: null
      type: select_multiple
      options:
      - Post
      - Panel
      required: false
    - id: 5
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: home_address
      label: Home Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: project_description
      label: Project Description
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
