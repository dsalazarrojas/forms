inputSchema:
  type: object
  properties:
    title: 3 Meal Order Form
    pages:
    - id: 1
      name: section_header_order
      label: "--- Order Details ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Contact phone
      hint: Include area code
      type: phone
      options: []
      required: true
    - id: 4
      name: customer_email
      label: Contact email
      hint: For order confirmation (optional)
      type: email
      options: []
      required: false
    - id: 5
      name: delivery_address
      label: Delivery address
      hint: Street, city, ZIP/postal code
      type: text
      options: []
      required: true
    - id: 6
      name: delivery_date
      label: Delivery date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: delivery_time
      label: Preferred delivery time
      hint: "e.g., 12:30"
      type: time
      options: []
      required: true
    - id: 8
      name: breakfast_choice
      label: Breakfast selection
      hint: Choose one breakfast per order slot
      type: select_one
      options:
        - Continental (pastry, fruit)
        - Full English
        - Vegan Bowl
        - Pancake Stack
      required: true
    - id: 9
      name: breakfast_quantity
      label: Breakfast quantity
      hint: Number of portions
      type: integer
      options: []
      required: true
    - id: 10
      name: lunch_choice
      label: Lunch selection
      hint: Choose one
      type: select_one
      options:
        - Grilled Chicken Plate
        - Veggie Wrap
        - Pasta Primavera
        - Sushi Box
      required: true
    - id: 11
      name: lunch_quantity
      label: Lunch quantity
      hint: Number of portions
      type: integer
      options: []
      required: true
    - id: 12
      name: dinner_choice
      label: Dinner selection
      hint: Choose one
      type: select_one
      options:
        - Salmon Fillet
        - Steak & Vegetables
        - Buddha Bowl
        - Tofu Stir-fry
      required: true
    - id: 13
      name: dinner_quantity
      label: Dinner quantity
      hint: Number of portions
      type: integer
      options: []
