inputSchema:
  type: object
  properties:
    title: Phone Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: shipping_method
      label: Shipping Method
      hint: null
      type: select_one
      options:
      - Cash
      - Pickup
      - Shipping
      required: true
