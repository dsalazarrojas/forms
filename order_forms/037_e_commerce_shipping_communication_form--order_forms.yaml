    - id: 4
      name: shipping_date
      label: Shipping Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: shipping_time
      label: Shipping Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: tracking_number
      label: Tracking Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
