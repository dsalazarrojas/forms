      name: customer_details
      label: Customer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: delivery_details
      label: Delivery Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: sign_orders
      label: Sign Orders
