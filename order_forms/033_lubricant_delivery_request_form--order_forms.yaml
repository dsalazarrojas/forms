inputSchema:
  type: object
  properties:
    title: Lubricant Delivery Request Form
    pages:
    - id: 1
      name: delivery_request
      label: Delivery Request
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: lubricant_type
      label: Lubricant Type
      hint: null
      type: select_multiple
      options:
      - Lubricant A
      - Lubricant B
      - Lubricant C
      required: true
    - id: 3
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: recurring_delivery
      label: Recurring Delivery
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: maintenance_team
      label: Maintenance Team
      hint: null
      type: select_one
      options:
      - Team A
      - Team B
      - Team C
      required: true
    - id: 8
      name: supplier
      label: Supplier
      hint: null
      type: select_multiple
      options:
      - Supplier A
      - Supplier B
      - Supplier C
      required: false
    - id: 9
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
