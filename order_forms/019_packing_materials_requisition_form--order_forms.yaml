      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: shipping_state
      label: shipping state
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: shipping_zip
      label: shipping zip
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_to
      label: assigned to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - jenny
      required: true
    - id: 12
      name: assigned_date
      label: assigned date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: review_comments
      label: review comments
      hint: null
      type: text
      options: []
      required: false
