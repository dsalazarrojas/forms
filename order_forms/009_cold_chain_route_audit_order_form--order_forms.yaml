inputSchema:
  type: object
  properties:
    title: Cold Chain Route Audit Order Form
    pages:
    - id: 1
      name: section_request
      label: -- Audit Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requesting_org
      label: Requesting Organization
      hint: Company name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Primary Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: section_route
      label: -- Route Specification --
      hint: Define the route to be audited
      type: note
      options: []
      required: false
    - id: 6
      name: origin_location
      label: Origin City and Country
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: destination_location
      label: Destination City and Country
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: cargo_type
      label: Type of Cargo
      hint: Select the primary goods
      type: select_one
      options:
      - Pharma
      - Food
      - Biological
      - Chemicals
      - Electronics
      - Other
      required: true
    - id: 9
      name: temperature_req
      label: Temperature Requirement
      hint: Temperature range for the cargo
      type: select_one
      options:
      - Deep Frozen (-20C)
      - Frozen (-18C)
      - Chilled (+2C to +8C)
      - Controlled Ambient (+15C to +25C)
      required: true
    - id: 10
      name: preferred_audit_date
      label: Preferred Audit Date
      hint: Start date for the route audit
      type: date
      options: []
      required: true
    - id: 11
      name: route_duration
      label: Estimated Duration of Route
      hint: Number of hours
      type: number
      options: []
      required: true
    - id: 12
      name: data_loggers_needed
      label: Required Data Loggers
      hint: Number of temperature monitoring devices
      type: number
      options: []
      required: true
    - id: 13
      name: handling_instructions
      label: Special Handling Instructions
      hint: Any specific requirements for the audit team
      type: text
      options: []
      required: false
