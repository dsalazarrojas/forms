inputSchema:
  type: object
  properties:
    title: Bundle Order Form
    pages:
    - id: 1
      name: section_customer_info
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_full_name
      label: Full Name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: example@domain.com
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Include area code
      type: text
      options: []
      required: true
    - id: 5
      name: section_order_details
      label: -- Order Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: bundle_selection
      label: Select Bundle Type
      hint: Choose the bundle that best fits your needs
      type: select_one
      options:
      - Starter Pack Bundle
      - Business Growth Bundle
      - Enterprise Solutions Bundle
      - Custom Multi-Service Bundle
      required: true
    - id: 7
      name: order_quantity
      label: Quantity
      hint: Number of bundles requested
      type: number
      options: []
      required: true
    - id: 8
      name: preferred_delivery_date
      label: Preferred Delivery Date
      hint: select a date for fulfillment
      type: date
      options: []
      required: true
    - id: 9
      name: delivery_address
      label: Delivery Address
      hint: Full street address, city, state, and zip
      type: text
      options: []
      required: true
    - id: 10
      name: special_instructions
      label: Special Instructions or Notes
      hint: Any specific requirements for this order
      type: text
      options: []
      required: false
    - id: 11
      name: payment_method_preference
      label: Preferred Payment Method
      hint: How would you like to pay
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Purchase Order
      - Monthly Invoicing
      required: true
