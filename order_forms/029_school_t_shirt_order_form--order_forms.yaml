      name: tshirt_color_blue
      label: Blue
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: tshirt_color_black
      label: Black
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
