inputSchema:
  type: object
  properties:
    title: Scarf Pre Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: scarf_type
      label: Scarf Style
      hint: null
      type: select_one
      options:
      - style1
      - style2
      - style3
      required: false
    - id: 3
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: scarf_size
      label: Scarf Size
      hint: null
      type: select_multiple
      options:
      - small
      - medium
      - large
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
