inputSchema:
  type: object
  properties:
    title: Adventure Map Order Form
    pages:
    - id: 1
      name: order_header
      label: -- Map Order --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer name
      hint: For shipping details
      type: text
      options: []
      required: true
    - id: 3
      name: shipping_address
      label: Shipping address
      hint: Street, city, state, postal code
      type: text
      options: []
      required: true
    - id: 4
      name: map_type
      label: Map type
      hint: Select map product
      type: select_one
      options:
      - Trail map
      - Topographic map
      - Region overview
      - Custom map
      required: true
    - id: 5
      name: quantity
      label: Quantity ordered
      hint: Enter whole number
      type: number
      options: []
      required: true
    - id: 6
      name: shipping_method
      label: Shipping method
      hint: Choose delivery speed
      type: select_one
      options:
      - Standard
      - Express
      - Overnight
      required: true
    - id: 7
      name: billing_email
      label: Billing email
      hint: For invoice and receipt
      type: email
      options: []
      required: true
    - id: 8
      name: special_instructions
      label: Special instructions
      hint: Any additional shipping notes
      type: text
      options: []
      required: false
    - id: 9
      name: order_date
      label: Order date
      hint: Date of submission
      type: date
      options: []
      required: true
