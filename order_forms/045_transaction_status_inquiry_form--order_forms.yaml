inputSchema:
  type: object
  properties:
    title: Transaction Status Inquiry Form
    pages:
    - id: 1
      name: form_title
      label: Transaction Status Inquiry Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: transaction_id
      label: Transaction ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: transaction_date
      label: Transaction Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: transaction_time
      label: Transaction Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: transaction_status
      label: Transaction Status
      hint: null
      type: select_one
      options:
      - Processing
      - Successful
      - Failed
      required: false
    - id: 6
      name: transaction_message
      label: Transaction Message
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: form_submit
      label: Submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - chatjimmy2
      required: false
    - id: 9
      name: form_category
      label: Category
      hint: null
      type: select_one
      options:
      - Order Forms
      - Other
      required: false
