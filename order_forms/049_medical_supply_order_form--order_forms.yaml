inputSchema:
  type: object
  properties:
    title: Medical Supply Order Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: medical_supply_id
      label: Medical Supply Id
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: order_status
      label: Order Status
      hint: Choose all that apply
      type: select_multiple
      options:
      - New Order
      - In Progress
      - Completed
      required: false
    - id: 6
      name: supplier_info
      label: Supplier Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: Select one of the following options
      type: select_one
      options:
      - Cash
      - Credit Card
      - Bank Transfer
      required: false
    - id: 9
      name: payment_status
      label: Payment Status
      hint: Select one of the following options
      type: select_one
      options:
      - Paid
      - Unpaid
      required: false
