inputSchema:
  type: object
  properties:
    title: AA Technique Generic
    pages:
    - id: 1
      name: section_header_customer
      label: '--- Customer Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: We'll use this for order confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Optional, for delivery updates
      type: phone
      options: []
      required: false
    - id: 5
      name: company_name
      label: Company or organization name
      hint: If ordering on behalf of a business
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_order_details
      label: '--- Order Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: order_date
      label: Order date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: item_name
      label: Item or product name
      hint: Specify the exact product or service
      type: text
      options: []
      required: true
    - id: 9
      name: item_description
      label: Item description
      hint: Brief description of the product or service
      type: text
      options: []
      required: false
    - id: 10
      name: quantity
      label: Quantity
      hint: Enter number of items
      type: integer
      options: []
      required: true
    - id: 11
      name: unit_price
      label: Unit price
      hint: Price per item in USD
      type: decimal
      options: []
      required: true
    - id: 12
      name: total_amount
      label: Total amount
      hint: Calculated as quantity × unit price
      type: decimal
      options: []
      required: true
    - id: 13
      name: section_header_delivery
      label: '--- Delivery Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: delivery_method
      label: Preferred delivery method
      hint: null
      type: select_one
      options:
      - Standard shipping
      - Express shipping
      - Pickup
      - Local delivery
      required: true
    - id: 15
      name: delivery_address
      label: Delivery address
      hint: Full address for delivery
      type: text
      options: []
      required: false
    - id: 16
      name: delivery_date
      label: Requested delivery date
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: special_instructions
      label: Special instructions or customization notes
      hint: Any specific requirements or customizations
      type: text
      options: []
      required: false
    - id: 18
      name: section_header_payment
      label: '--- Payment Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: payment_method
      label: Payment method
      hint: null
      type: select_one
      options:
      - Credit card
      - Cash
      - Bank transfer
      - PayPal
      - Invoice
      required: true
    - id: 20
      name: tax_rate
      label: Tax rate percentage
      hint: Applicable tax rate for the order
      type: decimal
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional comments or notes
      hint: Any other information about the order
      type: text
      options: []
      required: false
    - id: 22
      name: terms_accepted
      label: I accept the terms and conditions
      hint: Please confirm before submitting
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
