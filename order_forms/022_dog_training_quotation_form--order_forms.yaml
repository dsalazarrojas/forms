      - Cash
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
