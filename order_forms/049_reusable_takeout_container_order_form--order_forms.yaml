inputSchema:
  type: object
  properties:
    title: Reusable Takeout Container Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Please enter customer's name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_phone
      label: Customer Phone
      hint: Please enter customer's phone number
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Customer Email
      hint: Please enter customer's email
      type: email
      options: []
      required: true
    - id: 4
      name: restaurant_name
      label: Restaurant Name
      hint: Please select restaurant for takeout
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 5
      name: container_type
      label: Container Type
      hint: Please select container type
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 6
      name: delivery_window
      label: Delivery Window
      hint: Please select delivery window
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 7
      name: pickup_window
      label: Pickup Window
      hint: Please select pickup window
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 8
      name: order_total
      label: Order Total
      hint: Please enter order total
      type: number
      options: []
      required: true
    - id: 9
      name: restaurant_email
      label: Restaurant Email
      hint: Please enter restaurant's email
      type: email
      options: []
      required: true
    - id: 10
      name: restaurant_phone
      label: Restaurant Phone
      hint: Please enter restaurant's phone number
      type: text
      options: []
      required: true
    - id: 11
      name: delivery_address
      label: Delivery Address
      hint: Please enter delivery address
      type: text
      options: []
      required: true
    - id: 12
      name: payment_method
      label: Payment Method
      hint: Please select payment method
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
