inputSchema:
  type: object
  properties:
    title: Safety Floor Marking Supply Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: delivery_details
      label: Delivery Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: confirm_details
      label: Confirm Details
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: confirm_order
      label: Confirm Order
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: repeat_order
      label: Is this a repeat order?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: confirm_button
      label: Confirm
      hint: null
      type: radio
      options:
      - Confirm
      - Cancel
      required: false
