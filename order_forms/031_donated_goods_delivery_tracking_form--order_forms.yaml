      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: delivered_by
      label: Delivered By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: tracking_number
      label: Tracking Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: delivered_to
      label: Delivered To
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: delivery_status
      label: Delivery Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 7
      name: delivery_note
      label: Delivery Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: assigned_user_id
      label: Assigned User ID
      hint: null
      type: number
      options: []
      required: false
