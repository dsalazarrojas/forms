inputSchema:
  type: object
  properties:
    title: Shipping Order Payment Form
    pages:
    - id: 1
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Visa
      - Mastercard
      - PayoneTouch
      - PayPal
      - American Express
      - Discover
      required: false
    - id: 5
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
