inputSchema:
  type: object
  properties:
    title: Color Street Nail Order Form
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: mailing_address
      label: Mailing Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: section_order
      label: -- Order Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: sets_ordered
      label: Name of Sets Ordered
      hint: Please list the names of the nail sets you want
      type: text
      options: []
      required: true
    - id: 7
      name: quantity_of_sets
      label: Total Number of Sets
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: sample_request
      label: Would you like a free sample?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 9
      name: section_payment
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: payment_type
      label: Payment Method
      hint: null
      type: select_one
      options:
      - PayPal
      - Venmo
      - Credit Card
      required: true
    - id: 11
      name: tax_included_consent
      label: I understand that sales tax will be added to my total
      hint: null
      type: select_one
      options:
      - I Understand
      - Other
      required: true
    - id: 12
      name: shipping_speed
      label: Shipping Speed
      hint: null
      type: select_one
      options:
      - Standard ($3.00)
      - Priority ($8.00)
      required: true
    - id: 13
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
