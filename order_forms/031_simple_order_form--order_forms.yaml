inputSchema:
  type: object
  properties:
    title: Simple Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: items
      label: Select Items
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - Meetups
      required: true
    - id: 4
      name: delivery_method
      label: Delivery Method
      hint: null
      type: select_one
      options:
      - Local Mail
      - Known Couriers
      required: false
    - id: 5
      name: shop_rating
      label: Rate Our Shop
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      required: true
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
