inputSchema:
  type: object
  properties:
    title: Access Card Requisition Form
    pages:
    - id: 1
      name: form_header
      label: -- Access Card Requisition Form --
      hint: Submit a request for a new or replacement access card. All required fields
        must be completed for processing.
      type: note
      options: []
      required: false
    - id: 2
      name: requester_full_name
      label: Full name of the person requiring the access card
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: requester_phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: employee_id
      label: Employee or contractor ID number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: job_title
      label: Job title
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: card_type
      label: Type of access card request
      hint: null
      type: select_one
      options:
      - New employee card
      - Replacement (lost or damaged)
      - Temporary visitor card
      - Contractor card
      - Upgraded access card
      required: true
    - id: 9
      name: reason_for_request
      label: Reason for the request
      hint: null
      type: select_one
      options:
      - New hire
      - Lost card
      - Damaged or malfunctioning card
      - Change in access level
      - Temporary access needed
      - Other
      required: true
    - id: 10
      name: areas_requiring_access
      label: Areas or buildings requiring access (select all that apply)
      hint: null
      type: select_multiple
      options:
      - Main building entrance
      - Office floors
      - Server room or data center
      - Parking garage
      - Laboratory
      - Warehouse or storage
      - Executive floor
      required: true
    - id: 11
      name: access_schedule
      label: Access schedule needed
      hint: null
      type: select_one
      options:
      - Standard business hours only
      - Extended hours (6am - 10pm)
      - 24/7 access
      - Custom schedule
      required: true
    - id: 12
      name: start_date
      label: Date access is needed from
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: end_date
      label: Access end date (for temporary cards)
      hint: Leave blank for permanent access
      type: date
      options: []
      required: false
    - id: 14
      name: supervisor_name
      label: Approving supervisor or manager name
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: supervisor_email
      label: Supervisor email address
      hint: null
      type: email
      options: []
      required: true
    - id: 16
      name: old_card_returned
      label: Has the old card been returned (if applicable)
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: true
    - id: 17
      name: request_date
      label: Date of request
      hint: null
      type: date
      options: []
      required: true
