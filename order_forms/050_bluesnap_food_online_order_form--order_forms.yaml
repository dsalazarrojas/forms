inputSchema:
  type: object
  properties:
    title: BlueSnap Food Online Order Form
    pages:
    - id: 1
      name: food_intro
      label: -- Order Food Online --
      hint: Delicious meals delivered to your door
      type: note
      options: []
      required: false
    - id: 2
      name: customer_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone_contact
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: delivery_street_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: delivery_city_name
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: delivery_postal_code
      label: ZIP/Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: preferred_delivery_time
      label: Preferred Delivery Time
      hint: null
      type: select_one
      options:
      - ASAP
      - Within 1 hour
      - Within 2 hours
      - Schedule for later
      required: true
    - id: 9
      name: scheduled_delivery_time
      label: Scheduled Delivery Time (if later)
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: meal_category_selection
      label: Meal Category
      hint: null
      type: select_multiple
      options:
      - Appetizers
      - Main courses
      - Salads
      - Sides
      - Desserts
      - Beverages
      required: true
    - id: 11
      name: entree_selection
      label: Entrees Selected
      hint: List entrees or choose from menu
      type: text
      options: []
      required: true
    - id: 12
      name: side_dishes
      label: Side Dishes
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: beverage_choice
      label: Beverages
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: special_requests_food
      label: Special Requests or Dietary Restrictions
      hint: Allergies, preferences, substitutions
      type: text
      options: []
      required: false
    - id: 15
      name: quantity_meals
      label: Number of Meals
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: subtotal_amount
      label: Subtotal
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: delivery_fee
      label: Delivery Fee
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: tax_amount
      label: Tax
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: total_order_amount
      label: Total Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: payment_method_food
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Cash on delivery
      required: true
    - id: 21
      name: tip_amount
      label: Tip Amount (optional)
      hint: null
      type: number
      options: []
      required: false
    - id: 22
      name: delivery_instructions
      label: Delivery Instructions
      hint: Gate codes, buzzer, etc.
      type: text
      options: []
      required: false
    - id: 23
      name: order_submission_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
