inputSchema:
  type: object
  properties:
    title: Chemical Requisition Form
    pages:
    - id: 1
      name: requester_name
      label: Requester Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: requester_id
      label: Requester ID
      hint: Your employee or student ID
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Chemistry
      - Biology
      - Research and Development
      - Quality Control
      - Production
      - Education
      - Other
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: Date of this request
      type: date
      options: []
      required: true
    - id: 7
      name: required_date
      label: Required Date
      hint: When do you need the chemicals
      type: date
      options: []
      required: true
    - id: 8
      name: project_name
      label: Project Name
      hint: Name of project or experiment
      type: text
      options: []
      required: true
    - id: 9
      name: chemical_1_name
      label: Chemical 1 Name
      hint: Name of first chemical
      type: text
      options: []
      required: true
    - id: 10
      name: chemical_1_quantity
      label: Chemical 1 Quantity
      hint: Amount needed
      type: text
      options: []
      required: true
    - id: 11
      name: chemical_1_concentration
      label: Chemical 1 Concentration
      hint: Required concentration or purity
      type: text
      options: []
      required: false
    - id: 12
      name: chemical_2_name
      label: Chemical 2 Name
      hint: Name of second chemical
      type: text
      options: []
      required: false
    - id: 13
      name: chemical_2_quantity
      label: Chemical 2 Quantity
      hint: Amount needed
      type: text
      options: []
      required: false
    - id: 14
      name: chemical_2_concentration
      label: Chemical 2 Concentration
      hint: Required concentration or purity
      type: text
      options: []
      required: false
    - id: 15
      name: chemical_3_name
      label: Chemical 3 Name
      hint: Name of third chemical
      type: text
      options: []
      required: false
    - id: 16
      name: chemical_3_quantity
      label: Chemical 3 Quantity
      hint: Amount needed
      type: text
      options: []
      required: false
    - id: 17
      name: chemical_3_concentration
      label: Chemical 3 Concentration
      hint: Required concentration or purity
      type: text
      options: []
      required: false
    - id: 18
      name: additional_chemicals
      label: Additional Chemicals
      hint: List any other chemicals needed
      type: text
      options: []
      required: false
    - id: 19
      name: purpose_of_use
      label: Purpose of Use
      hint: How will these chemicals be used
      type: text
      options: []
      required: true
    - id: 20
      name: storage_location
      label: Storage Location
      hint: Where will chemicals be stored
      type: text
      options: []
      required: true
    - id: 21
      name: safety_precautions
      label: Safety Precautions Required
      hint: What safety measures are needed
      type: text
      options: []
      required: true
    - id: 22
      name: hazardous_materials
      label: Are Any Chemicals Hazardous
      hint: Do any require special handling
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not sure
      required: true
    - id: 23
      name: hazardous_details
      label: Hazardous Material Details
      hint: Describe any hazardous materials
      type: text
      options: []
      required: false
    - id: 24
      name: previous_inventory_check
      label: Have You Checked Existing Inventory
      hint: Confirm you checked current stock
      type: select_one
      options:
      - Yes, checked
      - No, not checked
      required: true
    - id: 25
      name: budget_code
      label: Budget Code
      hint: Budget or account code for this request
      type: text
      options: []
      required: false
    - id: 26
      name: supervisor_approval
      label: Supervisor Approval
      hint: Has your supervisor approved this request
      type: select_one
      options:
      - Yes, approved
      - Pending approval
      - Not yet requested
      required: true
    - id: 27
      name: supervisor_name
      label: Supervisor Name
      hint: Name of approving supervisor
      type: text
      options: []
      required: false
    - id: 28
      name: safety_officer_review
      label: Safety Officer Review Required
      hint: Does this request need safety review
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not sure
      required: true
    - id: 29
      name: special_instructions
      label: Special Instructions
      hint: Any special handling or delivery requirements
      type: text
      options: []
      required: false
    - id: 30
      name: requester_signature
      label: Requester Signature
      hint: I confirm this request is accurate
      type: select_one
      options:
      - Yes, I confirm
      - 'False'
      required: true
