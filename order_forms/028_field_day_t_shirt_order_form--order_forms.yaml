inputSchema:
  type: object
  properties:
    title: Field Day T Shirt Order Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: shirt_size
      label: Shirt Size
      hint: null
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      required: false
    - id: 5
      name: shirt_color
      label: Color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      - Yellow
      required: false
    - id: 6
      name: order_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: payment_type
      label: Payment Type
      hint: null
      type: select_one
      options:
      - Card
      - Bank Transfer
      - Check
      required: false
    - id: 8
      name: tshirt_text
      label: T-Shirt Text
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: total_shirts
      label: Total Shirts
      hint: null
      type: number
      options: []
      required: false
