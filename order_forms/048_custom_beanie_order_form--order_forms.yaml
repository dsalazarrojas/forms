inputSchema:
  type: object
  properties:
    title: Custom Beanie Order Form
    pages:
    - id: 1
      name: order_form
      label: Order Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_details
      label: Customer Details
      hint: null
      type: select_one
      options:
      - Customer Name
      - Customer Email
      - Customer Phone
      required: false
    - id: 3
      name: order_details
      label: Order Details
      hint: null
      type: select_multiple
      options:
      - Color
      - Size
      - Beanie Type
      - Beanie Color
      - Beanie Style
      required: false
    - id: 4
      name: order_confirmation
      label: Order Confirmation
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: order_confirmation_2
      label: Order Confirmation 2
      hint: null
      type: number
      options: []
      required: false
