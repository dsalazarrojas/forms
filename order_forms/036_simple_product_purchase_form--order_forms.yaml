inputSchema:
  type: object
  properties:
    title: Simple Product Purchase Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: product_id
      label: Product ID
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: false
    - id: 9
      name: payment_terms
      label: Payment Terms
      hint: null
      type: select_multiple
      options:
      - 1 time payment
      - 2 times payment
      - 3 times payment
      required: false
    - id: 10
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: confirm
      label: Confirm
      hint: null
      type: select_one
      options:
      - I confirm the above information is correct
      - No, I do not confirm the above information
      required: false
