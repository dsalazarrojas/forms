inputSchema:
  type: object
  properties:
    title: Deep Cleaning Service Payment Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_provider
      label: Service Provider
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: service_price
      label: Service Price
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - PayPal
      - Card
      required: false
    - id: 10
      name: total_price
      label: Total Price
      hint: null
      type: number
      options: []
      required: false
