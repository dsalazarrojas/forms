      - Attach Photos
      - Attach Videos
      required: false
    - id: 6
      name: email
      label: Email
      hint: example@example.com
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: 123-456-1234
      type: text
      options: []
      required: false
