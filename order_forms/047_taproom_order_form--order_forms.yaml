inputSchema:
  type: object
  properties:
    title: Taproom Order Form
    pages:
    - id: 1
      name: order_form
      label: Order Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: beer_type
      label: Beer Type
      hint: null
      type: select_one
      options:
      - Lager
      - IPA
      - Ale
      - Pilsner
      - Sour
      required: false
    - id: 3
      name: beer_size
