inputSchema:
  type: object
  properties:
    title: Protein Bar Order Form
    pages:
    - id: 1
      name: order_form_1
      label: Is delivery available?
      hint: Yes/No
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: order_form_2
      label: How would you like to pay?
      hint: Select payment method
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 3
      name: order_form_3
      label: Select a date
      hint: DD/MM/YY
      type: date
      options: []
      required: true
    - id: 4
      name: order_form_4
      label: Protein bar name
      hint: Enter the name of the protein bar
      type: text
      options: []
      required: true
    - id: 5
      name: order_form_5
      label: Quantity
      hint: Enter the quantity
      type: number
      options: []
      required: true
    - id: 6
      name: order_form_6
      label: Select options
      hint: Select options
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 7
      name: order_form_7
      label: Text without colons
      hint: Enter a text without colons
      type: text
      options: []
      required: true
    - id: 8
      name: order_form_8
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 9
      name: order_form_9
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 10
      name: order_form_10
      label: Note
      hint: Enter any additional notes
      type: note
      options: []
      required: true
    - id: 11
      name: order_form_11
      label: Text with quotes
      hint: Enter a text with quotes
      type: text
      options: []
      required: true
    - id: 12
      name: order_form_12
      label: Time
      hint: Select a time
      type: time
      options: []
      required: true
