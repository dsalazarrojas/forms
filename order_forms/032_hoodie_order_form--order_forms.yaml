      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: delivery_method
      label: How would you like to receive your order?
      hint: null
      type: select_multiple
      options:
      - Delivery Method 1
      - Delivery Method 2
      - Delivery Method 3
      required: false
    - id: 12
      name: note
      label: Can you provide a note?
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
