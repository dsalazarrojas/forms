      name: customer_info
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: order_type
      label: What is your order type?
      hint: null
      type: select_one
      options:
      - Order Type 1
      - Order Type 2
      - Order Type 3
      required: true
    - id: 3
      name: contact_info
      label: How would you like to be contacted?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Message
      required: true
    - id: 4
      name: order_description
      label: Can you provide a brief description of your order?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_method
      label: What is your payment method?
      hint: null
      type: select_one
      options:
      - Payment Method 1
      - Payment Method 2
      - Payment Method 3
      required: true
    - id: 6
      name: delivery_address
      label: What is your delivery address?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: contact_phone
      label: Can you provide a contact phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: additional_comments
      label: Is there anything else you would like to include in your order?
      hint: null
      type: text
      options: []
      required: false
