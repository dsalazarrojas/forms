inputSchema:
  type: object
  properties:
    title: down_payment_form
    pages:
    - id: 1
      name: client_info
      label: Client Info
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: payment_date
      label: Payment Due Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - cash
      - credit_card
      - bank_transfer
      required: true
    - id: 5
      name: payment_details
      label: Payment Details
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: client_signature
      label: Client Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - paid
      - pending
      - declined
      required: true
    - id: 8
      name: note
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
