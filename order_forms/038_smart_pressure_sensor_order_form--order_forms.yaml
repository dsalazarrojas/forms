inputSchema:
  type: object
  properties:
    title: Smart Pressure Sensor Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: shipping_info
      label: Shipping Info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: order_info
      label: Order Info
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Visa
      - Mastercard
      - Amex
      required: true
    - id: 5
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: product_info
      label: Product Info
      hint: null
      type: select_one
      options:
      - Sensor A
      - Sensor B
      - Sensor C
      required: true
    - id: 7
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: unit_price
      label: Unit Price
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: shipping_cost
      label: Shipping Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: customer_notes
      label: Customer Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: shipping_notes
      label: Shipping Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Pending
      - Cancelled
      required: true
