inputSchema:
  type: object
  properties:
    title: Athlete Apparel Design Brief Form
    pages:
    - id: 1
      name: client_info_header
      label: -- Client and Project Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: team_club_name
      label: Team or Club Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: primary_contact
      label: Primary Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email Address
      hint: example@domain.com
      type: email
      options: []
      required: true
    - id: 5
      name: project_deadline
      label: Required Delivery Date
      hint: Please allow 4-6 weeks for custom production
      type: date
      options: []
      required: true
    - id: 6
      name: design_specs_header
      label: -- Apparel Specifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: apparel_types
      label: Types of Apparel Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Jersey
      - Shorts
      - Warm-up Suit
      - Socks
      - Headwear
      - Hoodie / Fleece
      required: true
    - id: 8
      name: primary_color
      label: Primary Team Color
      hint: Include Pantone code if known
      type: text
      options: []
      required: true
    - id: 9
      name: secondary_color
      label: Secondary Team Color
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: accent_color
      label: Accent Color
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: logo_placement
      label: Primary Logo Placement
      hint: Where should the main logo be located?
      type: select_one
      options:
      - Center Chest
      - Left Chest
      - Upper Back
      - Right Sleeve
      - Left Sleeve
      required: true
    - id: 12
      name: fabric_preference
      label: Fabric Preference
      hint: Select based on performance needs
      type: select_one
      options:
      - Performance Mesh
      - Moisture-wicking Polyester
      - Cotton Blend
      - Compression Fabric
      - Lightweight Ripstop
      required: true
    - id: 13
      name: sizing_range
      label: Sizing Requirements
      hint: e.g. Youth S-XL, Adult S-3XL
      type: text
      options: []
      required: true
    - id: 14
      name: estimated_quantity
      label: Total Estimated Quantity
      hint: Total units across all sizes
      type: number
      options: []
      required: true
    - id: 15
      name: aesthetics_header
      label: -- Aesthetics and Branding --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: style_keywords
      label: Style Keywords
      hint: e.g. Modern, Minimalist, Bold, Retro
      type: text
      options: []
      required: false
    - id: 17
      name: reference_description
      label: Description of Reference Styles
      hint: Describe existing designs you like
      type: text
      options: []
      required: false
    - id: 18
      name: special_requests
      label: Special Design Requests
      hint: Any specific patterns or details?
      type: text
      options: []
      required: false
    - id: 19
      name: budget_range
      label: Estimated Budget Range
      hint: Total project budget
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - Over $10,000
      required: false
    - id: 20
      name: next_steps_note
      label: -- Next Steps --
      hint: Our design team will contact you within 48 hours with initial concepts.
      type: note
      options: []
      required: false
