inputSchema:
  type: object
  properties:
    title: seo_services_payment_form
    pages:
    - id: 1
      name: client_info
      label: Client Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - paypal
      - stripe
      - credit_card
      required: false
    - id: 4
      name: card_info
      label: Card Info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: order_id
      label: Order ID
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - onetime
      - subscription
      required: false
    - id: 7
      name: description
      label: Description
      hint: null
      type: note
      options: []
      required: false
