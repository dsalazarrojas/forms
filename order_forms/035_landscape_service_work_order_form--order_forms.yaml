      options: []
      required: true
    - id: 5
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: service_location
      label: Service Location
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: service_notes
      label: Service Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_user
      label: Assigned User
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''chatjimmy''}'
