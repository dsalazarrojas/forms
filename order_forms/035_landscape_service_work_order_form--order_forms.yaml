inputSchema:
  type: object
  properties:
    title: Landscape Service Work Order Form
    pages:
    - id: 1
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Mowing''}'
      - '{''id'': 2, ''label'': ''Pruning''}'
      - '{''id'': 3, ''label'': ''Planting''}'
