inputSchema:
  type: object
  properties:
    title: Rent Payment Form
    pages:
    - id: 1
      name: tenant_info
      label: Tenant Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: payment_info
      label: Payment Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Card
      - Bank Transfer
      - Check
      required: false
    - id: 5
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_notes
      label: Payment Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: tenant_signature
      label: Tenant Signature
      hint: null
      type: select_multiple
      options:
      - Signature
      - Other
      required: false
    - id: 8
      name: landlord_signature
      label: Landlord Signature
      hint: null
      type: select_multiple
      options:
      - Signature
      - Other
      required: false
