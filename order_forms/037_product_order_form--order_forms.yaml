inputSchema:
  type: object
  properties:
    title: Product Order Form
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: shipping_date
      label: Shipping Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: product_category
      label: Product Category
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: product_description
      label: Product Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
