inputSchema:
  type: object
  properties:
    title: Flower Delivery Form
    pages:
    - id: 1
      name: delivery_form
      label: delivery-form
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: delivery_date
      label: delivery-date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: order_time
      label: order-time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: message
      label: personalized-message
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: delivery_details
      label: delivery-details
      hint: null
      type: select_one
      options:
      - Delivery Time
      - Delivery Date
      required: true
    - id: 6
      name: flower_type
      label: flower-type
      hint: null
      type: select_one
      options:
      - Rose
      - Daisies
      - Lilies
      - Tulips
      required: true
    - id: 7
      name: quantity
      label: quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: price
      label: price
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: payment_method
      label: payment-method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
