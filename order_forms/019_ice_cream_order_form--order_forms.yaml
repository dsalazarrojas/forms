inputSchema:
  type: object
  properties:
    title: Ice Cream Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - credit_card
      - cash
      - paypal
      required: false
    - id: 4
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: customer_notes
      label: Customer Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - Pending
      - Shipped
      - Cancelled
      required: false
    - id: 7
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: customer_address
      label: Customer Address
      hint: Enter a valid address
      type: text
      options: []
      required: false
    - id: 10
      name: order_id
      label: Order Id
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: store_id
      label: Store Id
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: customer_type
      label: Customer Type
      hint: null
      type: select_one
      options:
      - New
      - Returning
      - Regular
      required: false
    - id: 13
      name: order_comments
      label: Order Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
