inputSchema:
  type: object
  properties:
    title: Customer Refund Timeline Request Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Enter your name
      type: text
      options: []
      required: false
    - id: 2
      name: order_id
      label: Order ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: issue_description
      label: Issue Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: refund_amount
      label: Refund Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: refund_type
      label: Refund Type
      hint: null
      type: select_one
      options:
      - Refund Amount
      - Refund Store Credit
      required: false
    - id: 6
      name: date_of_purchase
      label: Date of Purchase
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_purchase
      label: Time of Purchase
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: refund_status
      label: Refund Status
      hint: null
      type: select_multiple
      options:
      - Pending
      - Approved
      - Denied
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
