inputSchema:
  type: object
  properties:
    title: Hamburger Order Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Info
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - John Smith
      required: true
    - id: 3
      name: order_details
      label: Order Details
      hint: null
      type: select_one
      options:
      - Beef patty
      - Veggie patty
      - Chicken patty
      - None
      required: true
    - id: 4
      name: order_options
      label: Order Options
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 5
      name: payment_info
      label: Payment Info
      hint: null
      type: select_multiple
      options:
      - Cash
      - Credit Card
      - Bank Transfer
      required: true
    - id: 6
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: true
