inputSchema:
  type: object
  properties:
    title: Hamburger Order Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Info
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''John Doe''}'
      - '{''id'': 2, ''name'': ''Jane Doe''}'
      - '{''id'': 3, ''name'': ''John Smith''}'
      required: true
    - id: 3
      name: order_details
      label: Order Details
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Beef patty''}'
      - '{''id'': 2, ''name'': ''Veggie patty''}'
      - '{''id'': 3, ''name'': ''Chicken patty''}'
      - '{''id'': 4, ''name'': ''None''}'
      required: true
    - id: 4
      name: order_options
      label: Order Options
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''Small''}'
      - '{''id'': 2, ''name'': ''Medium''}'
      - '{''id'': 3, ''name'': ''Large''}'
      required: false
    - id: 5
      name: payment_info
      label: Payment Info
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''Cash''}'
      - '{''id'': 2, ''name'': ''Credit Card''}'
      - '{''id'': 3, ''name'': ''Bank Transfer''}'
      required: true
    - id: 6
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: true
