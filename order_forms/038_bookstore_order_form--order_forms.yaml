inputSchema:
  type: object
  properties:
    title: Bookstore Order Form
    pages:
    - id: 1
      name: customer_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: We will send order confirmation here
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 4
      name: book_title
      label: Book Title
      hint: Title of the book
      type: text
      options: []
      required: true
    - id: 5
      name: book_author
      label: Author Name
      hint: Author or authors
      type: text
      options: []
      required: true
    - id: 6
      name: isbn
      label: ISBN Number
      hint: ISBN-13 if available
      type: text
      options: []
      required: false
    - id: 7
      name: format
      label: Book Format
      hint: Which format do you want
      type: select_one
      options:
      - Hardcover
      - Paperback
      - E-book
      - Audiobook
      required: true
    - id: 8
      name: quantity
      label: Quantity
      hint: Number of copies
      type: number
      options: []
      required: true
    - id: 9
      name: unit_price
      label: Unit Price
      hint: Price per copy
      type: number
      options: []
      required: true
    - id: 10
      name: shipping_address
      label: Shipping Address
      hint: Full delivery address
      type: text
      options: []
      required: true
    - id: 11
      name: shipping_method
      label: Shipping Method
      hint: How to ship the books
      type: select_one
      options:
      - Standard shipping
      - Expedited shipping
      - Overnight delivery
      - Local pickup
      required: true
    - id: 12
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - PayPal
      - Bank transfer
      - Check
      required: true
    - id: 13
      name: bulk_discount
      label: Bulk Order Discount Applicable
      hint: Do bulk discounts apply
      type: select_one
      options:
      - Yes, apply discount
      - No discount needed
      - Check eligibility
      required: false
    - id: 14
      name: special_requests
      label: Special Requests
      hint: Any special handling or notes
      type: text
      options: []
      required: false
    - id: 15
      name: order_total
      label: Order Total
      hint: Total amount for this order
      type: number
      options: []
      required: true
