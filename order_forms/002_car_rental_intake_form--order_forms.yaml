inputSchema:
  type: object
  properties:
    title: Car Rental Intake Form
    pages:
    - id: 1
      name: personal_info_section
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your name as it appears on your driver's license
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: We will send your rental confirmation here
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Required for pickup coordination
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: Drivers must be 21 or older
      type: date
      options: []
      required: true
    - id: 6
      name: drivers_license_number
      label: Driver's License Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: rental_details_section
      label: -- Rental Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: pickup_date
      label: Pickup Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: pickup_time
      label: Pickup Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: vehicle_type
      label: Vehicle Type Preference
      hint: Select your preferred car category
      type: select_one
      options:
      - Economy (Small)
      - Compact (Medium)
      - SUV (Large)
      - Luxury
      required: true
    - id: 12
      name: insurance_selection
      label: Insurance Selection
      hint: Choose your coverage level
      type: select_one
      options:
      - Full Coverage (Standard)
      - Basic Liability
      - Decline Insurance (Personal Policy)
      required: true
    - id: 13
      name: additional_equipment
      label: Additional Equipment Needed
      hint: Select any extras you require
      type: select_multiple
      options:
      - GPS Navigation
      - Child Safety Seat
      - Roadside Assistance Kit
      required: false
    - id: 14
      name: acknowledgement
      label: I certify that all information provided is accurate
      hint: null
      type: select_one
      options:
      - Yes, I certify
      - Other
      required: true
