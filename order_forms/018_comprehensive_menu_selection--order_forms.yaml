inputSchema:
  type: object
  properties:
    title: Comprehensive Menu Selection
    pages:
    - id: 1
      name: section_catering_info
      label: -- Catering Order --
      hint: Collect menu selections and dietary needs
      type: note
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact name
      hint: Person placing the order
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event date
      hint: Date the catering is required
      type: date
      options: []
      required: true
    - id: 4
      name: number_of_guests
      label: Number of guests
      hint: Estimated headcount
      type: number
      options: []
      required: true
    - id: 5
      name: menu_package
      label: Menu package
      hint: Choose a package
      type: select_one
      options:
      - Standard
      - Premium
      - Vegetarian
      - Custom
      required: true
    - id: 6
      name: dietary_restrictions
      label: Dietary restrictions
      hint: List any allergies or restrictions
      type: text
      options: []
      required: false
    - id: 7
      name: delivery_instructions
      label: Delivery instructions
      hint: Include setup location and time
      type: text
      options: []
      required: false
    - id: 8
      name: special_requests
      label: Special requests
      hint: Any other preferences
      type: text
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact phone
      hint: Phone number for day of event
      type: text
      options: []
      required: true
