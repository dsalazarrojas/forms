inputSchema:
  type: object
  properties:
    title: Fundraiser Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shipping_details
      label: Shipping Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
