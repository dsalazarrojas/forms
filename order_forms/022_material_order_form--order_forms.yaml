inputSchema:
  type: object
  properties:
    title: Material Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: customer email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: material_type
      label: material type
      hint: null
      type: select_one
      options:
      - concrete
      - lumber
      - paints
      - tiles
      required: false
    - id: 4
      name: material_quantity
      label: material quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: material_unit_price
      label: material unit price
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: material_total_price
      label: material total price
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: customer_notes
      label: customer notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: date_ordered
      label: date ordered
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: time_ordered
      label: time ordered
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: customer_phone
      label: customer phone
      hint: null
      type: text
      options: []
      required: false
