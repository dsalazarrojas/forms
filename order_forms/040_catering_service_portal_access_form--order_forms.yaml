inputSchema:
  type: object
  properties:
    title: Catering Service Portal Access Form
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: Your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your company
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: false
    - id: 6
      name: request_date
      label: Request Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 7
      name: access_type
      label: Access Type Requested
      hint: What access do you need
      type: select_one
      options:
      - Client Portal
      - Vendor Portal
      - Event Planner Portal
      - Admin Portal
      - Full Access
      required: true
    - id: 8
      name: access_reason
      label: Reason for Access
      hint: Why do you need access
      type: select_one
      options:
      - Place Orders
      - View Event Details
      - Manage Bookings
      - Access Invoices
      - Update Profile
      - Other
      required: true
    - id: 9
      name: event_access
      label: Event Access Needed
      hint: Which events
      type: text
      options: []
      required: false
    - id: 10
      name: username_preference
      label: Preferred Username
      hint: For your account
      type: text
      options: []
      required: false
    - id: 11
      name: notification_preference
      label: Notification Preference
      hint: How to notify you
      type: select_one
      options:
      - Email Only
      - SMS Only
      - Both Email and SMS
      - No Notifications
      required: true
    - id: 12
      name: two_factor_auth
      label: Two-Factor Authentication
      hint: Do you want 2FA
      type: select_one
      options:
      - Yes - Enable
      - No - Not Needed
      required: false
    - id: 13
      name: data_access_level
      label: Data Access Level
      hint: What data can you access
      type: select_one
      options:
      - Read Only
      - Read and Write
      - Full Access
      - Restricted
      required: true
    - id: 14
      name: terms_accepted
      label: Terms of Service Accepted
      hint: Do you agree to terms
      type: select_one
      options:
      - Yes - I Accept
      - false
      required: true
    - id: 15
      name: privacy_policy_accepted
      label: Privacy Policy Accepted
      hint: Do you accept privacy policy
      type: select_one
      options:
      - Yes - I Accept
      - false
      required: true
    - id: 16
      name: account_manager
      label: Assigned Account Manager
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 17
      name: training_needed
      label: Training Needed
      hint: Do you need portal training
      type: select_one
      options:
      - true
      - No - I am Familiar
      required: false
    - id: 18
      name: training_preference
      label: Training Preference
      hint: How would you like training
      type: select_one
      options:
      - Video Call
      - In-Person
      - Self-Guided Tutorial
      - Documentation Only
      - Not Applicable
      required: false
    - id: 19
      name: emergency_contact
      label: Emergency Contact
      hint: For account issues
      type: text
      options: []
      required: false
    - id: 20
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 21
      name: special_requirements
      label: Special Requirements
      hint: Any accessibility needs
      type: text
      options: []
      required: false
    - id: 22
      name: referral_source
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Website
      - Referral
      - Social Media
      - Advertisement
      - Other
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
