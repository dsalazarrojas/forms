inputSchema:
  type: object
  properties:
    title: Breast Pump Order Form
    pages:
    - id: 1
      name: mother_name
      label: Mother Full Name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: mother_email
      label: Email Address
      hint: For order communications
      type: email
      options: []
      required: true
    - id: 3
      name: mother_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: true
    - id: 5
      name: shipping_address_line1
      label: Shipping Address Line 1
      hint: Street address
      type: text
      options: []
      required: true
    - id: 6
      name: shipping_address_line2
      label: Shipping Address Line 2
      hint: Apartment, suite, unit
      type: text
      options: []
      required: false
    - id: 7
      name: shipping_city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 8
      name: shipping_state
      label: State
      hint: State or Province
      type: text
      options: []
      required: true
    - id: 9
      name: shipping_zip
      label: ZIP Code
      hint: ZIP or Postal Code
      type: text
      options: []
      required: true
    - id: 10
      name: baby_due_date
      label: Baby Due Date
      hint: When is baby due
      type: date
      options: []
      required: true
    - id: 11
      name: baby_birth_date
      label: Baby Birth Date
      hint: If baby is born
      type: date
      options: []
      required: false
    - id: 12
      name: insurance_provider
      label: Insurance Provider
      hint: Name of insurance company
      type: text
      options: []
      required: true
    - id: 13
      name: insurance_member_id
      label: Member ID
      hint: Your insurance member ID
      type: text
      options: []
      required: true
    - id: 14
      name: insurance_group_number
      label: Group Number
      hint: Insurance group number
      type: text
      options: []
      required: false
    - id: 15
      name: pump_type_requested
      label: Breast Pump Type
      hint: Type of pump you need
      type: select_one
      options:
      - Electric Double Pump
      - Manual Pump
      - Battery Operated
      - Hospital Grade Rental
      - Not Sure, Need Recommendation
      required: true
    - id: 16
      name: pump_brand_preference
      label: Brand Preference
      hint: Do you prefer a specific brand
      type: select_one
      options:
      - No Preference
      - Medela
      - Spectra
      - Lansinoh
      - Elvie
      - Willow
      - Other
      required: true
    - id: 17
      name: accessories_needed
      label: Accessories Needed
      hint: Select accessories
      type: select_multiple
      options:
      - Extra Bottles
      - Extra Flanges
      - Storage Bags
      - Cooler Bag
      - Nursing Pillow
      - Breast Pads
      - Nipple Cream
      - Cleaning Supplies
      - None
      required: true
    - id: 18
      name: flange_size
      label: Flange Size
      hint: Do you know your flange size
      type: select_one
      options:
      - 24mm Standard
      - 21mm Small
      - 27mm Large
      - 30mm Extra Large
      - Not Sure, Need Help
      required: true
    - id: 19
      name: prescription_attached
      label: Prescription
      hint: Do you have a prescription
      type: select_one
      options:
      - Yes, Attached
      - Will Send Separately
      - Need Doctor to Send
      - Not Required by Insurance
      required: true
    - id: 20
      name: delivery_urgency
      label: Delivery Urgency
      hint: How soon do you need this
      type: select_one
      options:
      - Before Baby Arrives
      - Within 1 Week
      - Within 2 Weeks
      - Within 1 Month
      - Not Urgent
      required: true
    - id: 21
      name: lactation_consultation
      label: Lactation Consultation
      hint: Would you like consultation
      type: select_one
      options:
      - Yes, Interested
      - No, Not Needed
      required: true
    - id: 22
      name: special_instructions
      label: Special Instructions
      hint: Any special requests
      type: text
      options: []
      required: false
    - id: 23
      name: terms_accepted
      label: Terms and Conditions
      hint: Do you accept our terms
      type: select_one
      options:
      - I Accept
      - I Do Not Accept
      required: true
