inputSchema:
  type: object
  properties:
    title: Computer Accessories Requisition Form
    pages:
    - id: 1
      name: section_requester_info
      label: -- Requester Information --
      hint: Who is requesting accessories
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Department requesting items
      type: text
      options: []
      required: true
    - id: 4
      name: item_requested
      label: Item requested
      hint: Describe the accessory required
      type: text
      options: []
      required: true
    - id: 5
      name: quantity
      label: Quantity
      hint: Whole number requested
      type: number
      options: []
      required: true
    - id: 6
      name: justification
      label: Justification
      hint: Reason for the request
      type: text
      options: []
      required: true
    - id: 7
      name: preferred_vendor
      label: Preferred vendor
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 8
      name: delivery_location
      label: Delivery location
      hint: Where items should be delivered
      type: text
      options: []
      required: true
    - id: 9
      name: approval_status
      label: Approval status
      hint: For internal use
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: false
