        type: select_one
        options:
          - "No known allergies"
          - "Peanut/Tree Nut"
          - "Dairy/Lactose"
          - "Gluten/Celiac"
          - "Egg"
          - "Shellfish"
        required: true
      - id: 14
        name: allergy_details
        label: Provide details on the severity or other allergies
        hint: null
        type: text
        options: []
        required: false
      - id: 15
        name: payment_status
        label: Payment Method
        hint: null
        type: select_one
        options:
          - "Pre-paid Meal Plan"
          - "Pay on Delivery"
          - "Staff Payroll Deduction"
        required: true
      - id: 16
        name: additional_requests
        label: Special Instructions for the Kitchen
        hint: null
        type: text
        options: []
        required: false
