      name: assigned_to
      label: Assigned To
      hint: null
      type: select_multiple
      options:
      - Jimmy
      - Jane
      required: false
    - id: 12
      name: quote_status
      label: Quote Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Rejected
      required: false
    - id: 13
      name: quote_notes
      label: Quote Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: quote_due_date
      label: Quote Due Date
      hint: 'Format: MM/DD/YYYY'
      type: date
      options: []
      required: false
    - id: 15
      name: quote_delivery_date
      label: Quote Delivery Date
      hint: 'Format: MM/DD/YYYY'
      type: date
      options: []
      required: false
    - id: 16
      name: quote_status_date
      label: Quote Status Date
      hint: 'Format: MM/DD/YYYY'
      type: date
      options: []
      required: false
