inputSchema:
  type: object
  properties:
    title: Menu Design Printing Quote Request Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: business_type
      label: Business Type
      hint: Restaurant, food truck, or catering service
      type: select_one
      options:
      - Restaurant
      - Food Truck
      - Catering Service
      required: false
    - id: 3
      name: menu_design_requirements
      label: Menu Design Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: quote_request
      label: Quote Request
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: business_address
      label: Business Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_number
      label: Contact Number
      hint: Phone or email
      type: text
      options: []
      required: false
    - id: 7
      name: quote_request_date
      label: Quote Request Date
      hint: 'Format: MM/DD/YYYY'
      type: date
      options: []
      required: false
    - id: 8
      name: quote_request_time
      label: Quote Request Time
      hint: 'Format: 12H'
      type: time
      options: []
      required: false
    - id: 9
      name: special_requests
      label: Special Requests
      hint: null
      type: note
      options: []
      required: false
