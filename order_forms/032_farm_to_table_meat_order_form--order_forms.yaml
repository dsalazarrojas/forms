inputSchema:
  type: object
  properties:
    title: Farm To Table Meat Order Form
    pages:
    - id: 1
      name: customer_name
      label: customer-name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: product_type
      label: product-type
      hint: null
      type: select_one
      options:
      - Meat
      - Dairy
      - Poultry
      required: false
    - id: 5
      name: product_sub_type
      label: product-sub-type
      hint: null
      type: select_multiple
      options:
      - Ground
      - Sausages
      - Cuts
      required: true
    - id: 6
      name: quantity
      label: quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: price
      label: price
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: delivery_date
      label: delivery-date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: delivery_time
      label: delivery-time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: order_notes
      label: order-notes
      hint: null
      type: note
      options: []
      required: false
