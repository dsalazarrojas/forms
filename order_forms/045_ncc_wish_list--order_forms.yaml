inputSchema:
  type: object
  properties:
    title: NCC_Wish List
    pages:
    - id: 1
      name: customer_name
      label: customer_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: order_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: color
      label: Color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      required: false
    - id: 5
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: product
      label: Product
      hint: null
      type: select_one
      options:
      - Product 1
      - Product 2
      - Product 3
      required: false
    - id: 8
      name: shipping_address
      label: Shipping Address
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
