inputSchema:
  type: object
  properties:
    title: Home Medical Device Order Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: device_info
      label: Device Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: order_date
      label: Date Received
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: order_device
      label: Medical Device
      hint: null
      type: select_one
      options:
      - Ambulatory Walker
      - Blood Glucose Monitor
      - Blood Pressure Monitor
      - Continuous Positive Airway Pressure
      - Hearing Aid
      - Insulin Pump
      - Nebuliser
      - Oxygen Concentrator
      - Portable Defibrillator
      - Sleep Apnea Machine
      - Wheelchair
      required: false
    - id: 7
      name: patient
      label: Patient
      hint: null
      type: select_multiple
      options:
      - Dr. Smith
      - Dr. Johnson
      - Dr. Thompson
      - Dr. Brown
      required: false
    - id: 8
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - Ordered
      - Cancelled
      - Delivered
      - Pending
      required: true
