inputSchema:
  type: object
  properties:
    title: Shipment Status Monitoring Form
    pages:
    - id: 1
      name: shipment_status
      label: Shipment Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 2
      name: shipment_id
      label: Shipment ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: order_id
      label: Order ID
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: shipment_date
      label: Shipment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: shipment_time
      label: Shipment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: status_notes
      label: Status Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_user
      label: Assigned User
      hint: Enter the name of the user assigned to this shipment
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
