      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: payment_gateway
      label: Payment Gateway
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: payment_gateway_url
      label: Payment Gateway URL
      hint: null
      type: text
      options: []
