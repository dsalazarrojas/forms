      name: packet_type
      label: Packet Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: order_quantity
      label: Order Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: delivery_details
      label: Delivery Details
      hint: null
      type: note
      options: []
      required: false
