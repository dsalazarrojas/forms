inputSchema:
  type: object
  properties:
    title: Raw Dog Food Delivery Order Form
    pages:
    - id: 1
      name: raw_dog_food_delivery_order_form
      label: Raw Dog Food
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: delivery_preferences
      label: Delivery Preferences
      hint: null
      type: select_multiple
      options:
      - Delivery Day
      - Pickup Location
      required: true
    - id: 3
      name: payment_info
      label: Payment Info
      hint: null
      type: select_one
      options:
      - Payment Method
      - Payment Type
      required: true
    - id: 4
      name: delivery_schedule
      label: Delivery Schedule
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: raw_food_type
      label: Raw Food Type
      hint: null
      type: select_one
      options:
      - Chicken
      - Fish
      - Beef
      required: true
    - id: 7
      name: raw_dog_food_quantity
      label: Raw Dog Food Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: pet_name
      label: Pet Name
      hint: null
      type: text
      options: []
      required: true
