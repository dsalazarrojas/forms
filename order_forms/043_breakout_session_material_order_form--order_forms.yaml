inputSchema:
  type: object
  properties:
    title: Breakout Session Material Order Form
    pages:
    - id: 1
      name: requestor_name
      label: Requestor Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: requestor_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: requestor_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: company_or_organization
      label: Company or Organization
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 5
      name: event_name
      label: Event Name
      hint: Name of the event or conference
      type: text
      options: []
      required: true
    - id: 6
      name: session_name
      label: Breakout Session Name
      hint: Name or title of your session
      type: text
      options: []
      required: true
    - id: 7
      name: session_date
      label: Session Date
      hint: When is your session
      type: date
      options: []
      required: true
    - id: 8
      name: session_time
      label: Session Time
      hint: What time is your session
      type: time
      options: []
      required: true
    - id: 9
      name: room_number
      label: Room Number
      hint: Room or location of session
      type: text
      options: []
      required: true
    - id: 10
      name: expected_attendees
      label: Expected Number of Attendees
      hint: How many people will attend
      type: number
      options: []
      required: true
    - id: 11
      name: av_equipment
      label: AV Equipment Needed
      hint: Select audio visual equipment
      type: select_multiple
      options:
      - Projector
      - Screen
      - Microphone
      - Speakers
      - Laptop
      - HDMI Cables
      - Laser Pointer
      - Whiteboard
      - Flip Chart
      - None
      required: true
    - id: 12
      name: printing_materials
      label: Printing Materials
      hint: Do you need printed materials
      type: select_one
      options:
      - Yes, Handouts
      - Yes, Workbooks
      - Yes, Name Tags
      - Yes, Certificates
      - No Printing Needed
      required: true
    - id: 13
      name: print_quantity
      label: Print Quantity
      hint: How many copies needed
      type: number
      options: []
      required: false
    - id: 14
      name: stationery_supplies
      label: Stationery Supplies
      hint: Select supplies needed
      type: select_multiple
      options:
      - Pens
      - Pencils
      - Notepads
      - Sticky Notes
      - Markers
      - Highlighters
      - Name Tag Stickers
      - Lanyards
      - None
      required: true
    - id: 15
      name: refreshments
      label: Refreshments
      hint: Do you need refreshments
      type: select_one
      options:
      - Coffee and Tea Service
      - Water Bottles Only
      - Light Snacks
      - Full Catering
      - No Refreshments
      required: true
    - id: 16
      name: room_setup
      label: Room Setup Preference
      hint: How should the room be arranged
      type: select_one
      options:
      - Theater Style
      - Classroom Style
      - U-Shape
      - Round Tables
      - Boardroom Style
      - Hollow Square
      required: true
    - id: 17
      name: signage_needed
      label: Signage Needed
      hint: Do you need directional signs
      type: select_one
      options:
      - Yes, Room Sign
      - Yes, Directional Signs
      - Yes, Both
      - No Signage Needed
      required: true
    - id: 18
      name: special_requirements
      label: Special Requirements
      hint: Any special needs or requests
      type: text
      options: []
      required: false
    - id: 19
      name: setup_time
      label: Required Setup Time
      hint: When should room be ready
      type: time
      options: []
      required: true
    - id: 20
      name: contact_person_onsite
      label: Onsite Contact Person
      hint: Who will be onsite contact
      type: text
      options: []
      required: true
    - id: 21
      name: budget_code
      label: Budget Code or PO Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 22
      name: additional_notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
