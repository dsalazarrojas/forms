inputSchema:
  type: object
  properties:
    title: Sushi Order Form
    pages:
    - id: 1
      name: pickup_date
      label: Pickup Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: pickup_time
      label: Pickup Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: sushi_type
      label: Sushi Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: quantity
      label: Quantity
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: extra_instructions
      label: Extra Instructions
      hint: null
      type: note
      options: []
      required: false
