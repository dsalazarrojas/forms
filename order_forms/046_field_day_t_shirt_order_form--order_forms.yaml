inputSchema:
  type: object
  properties:
    title: Field Day T Shirt Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: tshirt_design
      label: T Shirt Design
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: shirt_type
      label: Shirt Type
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 4
      name: shirt_color
      label: Shirt Color
      hint: null
      type: select_one
      options:
      - Red
      - Blue
      - Green
      - Yellow
      required: false
    - id: 5
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: tshirt_design_size
      label: T Shirt Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 7
      name: order_comments
      label: Order Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: customer_shipping
      label: Customer Shipping
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: customer_school
      label: Customer School
      hint: null
      type: text
      options: []
      required: false
