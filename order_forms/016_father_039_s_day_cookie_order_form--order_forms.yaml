      type: select_one
      options:
      - Circle
      - Square
      - Heart
      - Animal
      - Other
      required: false
    - id: 5
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: father_day
      label: Father
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
