inputSchema:
  type: object
  properties:
    title: Coffee Service Request Form
    pages:
    - id: 1
      name: section_requester
      label: -- Requester Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization or Business
      hint: Name of company or event
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_event
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_date
      label: Event Date
      hint: When is the event
      type: date
      options: []
      required: true
    - id: 8
      name: event_time
      label: Event Time
      hint: Start time
      type: time
      options: []
      required: true
    - id: 9
      name: event_duration
      label: Event Duration - hours
      hint: How long will the event last
      type: number
      options: []
      required: true
    - id: 10
      name: event_location
      label: Event Location
      hint: Full address or venue name
      type: text
      options: []
      required: true
    - id: 11
      name: event_type
      label: Type of Event
      hint: null
      type: select_one
      options:
      - Corporate Meeting
      - Conference
      - Wedding
      - Birthday Party
      - Wedding Reception
      - Gala or Formal Event
      - Casual Gathering
      - Training Session
      - Other
      required: true
    - id: 12
      name: expected_guests
      label: Expected Number of Guests
      hint: Approximate attendee count
      type: number
      options: []
      required: true
    - id: 13
      name: section_service
      label: -- Service Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: coffee_service_type
      label: Coffee Service Type
      hint: null
      type: select_one
      options:
      - Self-service station
      - Full-service barista
      - Mobile coffee cart
      - Equipment rental only
      - Custom catering
      required: true
    - id: 15
      name: service_style
      label: Service Style
      hint: null
      type: select_one
      options:
      - Breakfast service
      - Mid-morning break
      - Afternoon service
      - All-day access
      - Custom timing
      required: true
    - id: 16
      name: coffee_service_setup
      label: Setup and Cleanup Included
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Partial
      required: true
    - id: 17
      name: section_preferences
      label: -- Coffee and Beverage Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: coffee_style
      label: Coffee Style Preference
      hint: null
      type: select_multiple
      options:
      - Specialty espresso drinks
      - Traditional coffee
      - Cold brew
      - Iced coffee
      - Decaf options
      - Hot chocolate
      required: true
    - id: 19
      name: milk_options
      label: Milk Options to Provide
      hint: null
      type: select_multiple
      options:
      - Regular milk
      - Skim milk
      - Soy milk
      - Almond milk
      - Oat milk
      - Coconut milk
      required: true
    - id: 20
      name: sections_preferences
      label: -- Additional Items --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: pastries_included
      label: Include Pastries or Snacks
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Undecided
      required: true
    - id: 22
      name: pastry_type
      label: Pastry or Snack Preferences
      hint: null
      type: select_multiple
      options:
      - Croissants
      - Muffins
      - Cookies
      - Bagels
      - Scones
      - Sandwiches
      required: false
    - id: 23
      name: section_special
      label: -- Special Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: dietary_restrictions
      label: Dietary Restrictions to Accommodate
      hint: null
      type: select_multiple
      options:
      - Vegan options
      - Gluten-free
      - Dairy-free
      - Nut-free
      - Organic only
      - None
      required: false
    - id: 25
      name: special_requests
      label: Special Requests or Preferences
      hint: Any specific needs or preferences
      type: text
      options: []
      required: false
    - id: 26
      name: section_budget
      label: -- Budget and Payment --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: budget_per_person
      label: Budget per Person
      hint: Approximate cost you are willing to spend
      type: select_one
      options:
      - Under 5 dollars
      - 5-10 dollars
      - 10-15 dollars
      - 15-25 dollars
      - Over 25 dollars
      - Flexible
      required: false
