inputSchema:
  type: object
  properties:
    title: Return and Fee Estimation Form
    pages:
    - id: 1
      name: return_request
      label: Return Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_order_id
      label: Customer Order ID
      hint: Enter the Customer Order ID
      type: number
      options: []
      required: false
    - id: 3
      name: return_item_name
      label: Return Item Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: return_item_description
      label: Return Item Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: return_reason
      label: Return Reason
      hint: null
      type: select_one
      options:
      - Defective
      - Missing Item
      - Item Does Not Fit
      - Item Does Not Match Description
      - Order Cancelled
      required: true
    - id: 6
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: return_fee
      label: Return Fee
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: return_status
      label: Return Status
      hint: null
      type: select_multiple
      options:
      - New
      - Open
      - In Progress
      - Completed
      required: true
    - id: 9
      name: estimated_fee_amount
      label: Estimated Fee Amount
      hint: null
      type: number
      options: []
      required: false
