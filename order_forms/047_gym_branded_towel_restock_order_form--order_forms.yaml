inputSchema:
  type: object
  properties:
    title: Gym Branded Towel Restock Order Form
    pages:
    - id: 1
      name: gym_details
      label: Gym Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: towel_selection
      label: Towel Selection
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: delivery_details
      label: Delivery Details
      hint: Please select the desired delivery date and time
      type: date
      options: []
      required: false
    - id: 4
      name: delivery_note
      label: Delivery Note
      hint: Please enter any additional delivery instructions
      type: text
      options: []
      required: false
    - id: 5
      name: order_details
      label: Order Details
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: true
