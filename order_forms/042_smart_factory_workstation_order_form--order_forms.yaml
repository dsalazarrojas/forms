inputSchema:
  type: object
  properties:
    title: Smart Factory Workstation Order Form
    pages:
    - id: 1
      name: workstation_request
      label: Requesting Workstation
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 2
      name: workstation_type
      label: Workstation Type
      hint: null
      type: select_multiple
      options:
      - A
      - B
      - C
      required: false
    - id: 3
      name: workstation_description
      label: Description
