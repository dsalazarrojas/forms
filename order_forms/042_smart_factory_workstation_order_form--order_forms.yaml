    - id: 4
      name: requested_by
      label: Requested By
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Jimmy
      - Jane
      required: false
    - id: 10
      name: submitted_date
      label: Submitted Date
      hint: null
      type: date
      options: []
      required: false
