    - id: 4
      name: bank_account_info
      label: Bank Account Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: other_payment_info
      label: Other Payment Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: zelle_info
      label: Zelle Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
