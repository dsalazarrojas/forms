      name: conley_b3g1_deal
      label: Is this a B3G1 deal?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: section_conley_checkout
      label: -- Checkout --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: conley_payment_id
      label: Payment Method and Handle
