      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: conley_customer_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: conley_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: conley_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_conley_winter_sets
      label: -- Winter Collection Selection --
      hint: null
      type: note
      options: []
      required: false
