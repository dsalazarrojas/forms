inputSchema:
  type: object
  properties:
    title: Club Event Tent And Flag Order Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: Name of your club event
      type: text
      options: []
      required: true
    - id: 2
      name: event_date
      label: Event Date
      hint: When is the event happening
      type: date
      options: []
      required: true
    - id: 3
      name: event_time
      label: Event Time
      hint: Start time of event
      type: time
      options: []
      required: true
    - id: 4
      name: organizer_name
      label: Event Organizer Name
      hint: Person coordinating the event
      type: text
      options: []
      required: true
    - id: 5
      name: organizer_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: organizer_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 7
      name: section_event_location
      label: -- Event Location --
      hint: Where the event will be held
      type: note
      options: []
      required: false
    - id: 8
      name: event_location
      label: Event Location
      hint: Venue name and address
      type: text
      options: []
      required: true
    - id: 9
      name: location_details
      label: Location Details
      hint: Specific area - field, parking lot, etc.
      type: text
      options: []
      required: true
    - id: 10
      name: weather_forecast
      label: Expected Weather Conditions
      hint: Sunny, rainy, windy, etc.
      type: text
      options: []
      required: false
    - id: 11
      name: section_tents
      label: -- Tent Requirements --
      hint: Specifications for tents needed
      type: note
      options: []
      required: false
    - id: 12
      name: tent_needed
      label: Tent Needed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 13
      name: tent_size
      label: Tent Size
      hint: null
      type: select_one
      options:
      - 10x10 feet
      - 10x20 feet
      - 20x20 feet
      - 20x40 feet
      - Custom size
      required: false
    - id: 14
      name: tent_quantity
      label: Number of Tents
      hint: How many tents needed
      type: number
      options: []
      required: false
    - id: 15
      name: tent_color
      label: Tent Color Preference
      hint: White, blue, green, etc.
      type: text
      options: []
      required: false
    - id: 16
      name: tent_features
      label: Tent Features
      hint: null
      type: select_multiple
      options:
      - Sides or walls
      - Clear top
      - Ventilation
      - Lighting hookup
      - Heater hookup
      - Floor
      required: false
    - id: 17
      name: section_flags
      label: -- Flag Requirements --
      hint: Specifications for flags needed
      type: note
      options: []
      required: false
    - id: 18
      name: flag_needed
      label: Flag Needed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 19
      name: flag_type
      label: Flag Type
      hint: null
      type: select_one
      options:
      - Club flag
      - Banner
      - Branded flags
      - Custom design
      - Other
      required: false
    - id: 20
      name: flag_quantity
      label: Number of Flags
      hint: How many flags needed
      type: number
      options: []
      required: false
    - id: 21
      name: flag_design
      label: Flag Design or Logo
      hint: What will be on the flag
      type: text
      options: []
      required: false
    - id: 22
      name: section_setup
      label: -- Setup and Logistics --
      hint: When and how to set up
      type: note
      options: []
      required: false
    - id: 23
      name: setup_time
      label: Setup Time Needed
      hint: When to arrive and set up
      type: time
      options: []
      required: true
    - id: 24
      name: setup_date
      label: Setup Date
      hint: Day before event or day of
      type: date
      options: []
      required: true
    - id: 25
      name: teardown_instructions
      label: Teardown Instructions
      hint: How to dismantle and return
      type: text
      options: []
      required: true
