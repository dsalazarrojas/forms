inputSchema:
  type: object
  properties:
    title: final_step_confirmation
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_details
      label: Payment Details
      hint: Provide payment information
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Other
      required: false
    - id: 3
      name: order_confirmation
      label: Order Confirmation
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: order_summary
      label: Order Summary
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: customer_notes
      label: Customer Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_terms
      label: Payment Terms
      hint: null
      type: select_one
      options:
      - Net 30
      - Proforma
      - Other
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Other
      required: false
    - id: 8
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - Paid
      - Pending Payment
      - Cancelled
      required: false
    - id: 9
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - Completed
      - Cancelled
      - Pending
      required: false
    - id: 10
      name: customer_approval
      label: Customer Approval
      hint: null
      type: select_multiple
      options:
      - Approved
      - Declined
      - Pending Approval
      required: false
