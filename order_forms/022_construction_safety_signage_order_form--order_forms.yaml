inputSchema:
  type: object
  properties:
    title: Construction Safety Signage Order Form
    pages:
    - id: 1
      name: section_order_information
      label: -- Order Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Contact person for the order
      type: text
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Contact phone
      hint: For delivery coordination
      type: text
      options: []
      required: false
    - id: 4
      name: signage_type
      label: Signage type
      hint: Select type of safety signage
      type: select_one
      options:
      - Danger
      - Warning
      - Mandatory
      - Informational
      required: true
    - id: 5
      name: quantity
      label: Quantity
      hint: Number of signs required
      type: number
      options: []
      required: true
    - id: 6
      name: material
      label: Material
      hint: Sign material preference
      type: select_one
      options:
      - Corrugated plastic
      - Aluminum
      - Vinyl
      required: false
    - id: 7
      name: delivery_address
      label: Delivery address
      hint: Where the signs should be delivered
      type: text
      options: []
      required: true
    - id: 8
      name: required_by_date
      label: Required by date
      hint: Date by which signs are needed
      type: date
      options: []
      required: false
