inputSchema:
  type: object
  properties:
    title: Automated Order Routing Pilot Application Form
    pages:
    - id: 1
      name: section_applicant_info
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Registered business name
      type: text
      options: []
      required: true
    - id: 5
      name: current_order_volume
      label: Monthly Order Volume
      hint: Average number of orders per month
      type: number
      options: []
      required: true
    - id: 6
      name: section_operations
      label: -- Operational Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: order_sources
      label: Primary Order Sources
      hint: Select all that apply
      type: select_multiple
      options:
      - Web Store
      - Mobile Application
      - Manual Entry
      - Third Party Marketplaces
      required: true
    - id: 8
      name: routing_method
      label: Current Routing Method
      hint: How are orders currently assigned?
      type: select_one
      options:
      - Manual Assignment
      - Simple Rule-based
      - Basic Automation
      - Hybrid System
      required: true
    - id: 9
      name: pilot_objectives
      label: Pilot Objectives
      hint: What do you hope to achieve?
      type: select_multiple
      options:
      - Increased Routing Speed
      - Improved Accuracy
      - Operational Cost Reduction
      - Better Scalability
      required: false
    - id: 10
      name: participation_reason
      label: Reason for Participating
      hint: Briefly describe why you want to join this pilot
      type: text
      options: []
      required: true
    - id: 11
      name: section_logistics
      label: -- Implementation and Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: implementation_timeline
      label: Target Implementation Timeline
      hint: When are you ready to start?
      type: select_one
      options:
      - Immediate (1-2 weeks)
      - Within 1 month
      - Within 3 months
      - More than 6 months
      required: true
    - id: 13
      name: pilot_start_date
      label: Preferred Pilot Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: technical_contact
      label: Technical Point of Contact
      hint: Person responsible for integration
      type: text
      options: []
      required: true
    - id: 15
      name: terms_agreement
      label: Do you agree to the pilot program terms?
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - No, I need more information
      required: true
