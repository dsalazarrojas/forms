inputSchema:
  type: object
  properties:
    title: Cake Factory Order Form
    pages:
    - id: 1
      name: client_name
      label: Client name
      hint: For order tracking
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact email
      hint: For confirmations
      type: email
      options: []
      required: true
    - id: 3
      name: cake_flavor
      label: Cake flavor
      hint: Select primary flavor
      type: text
      options: []
      required: true
    - id: 4
      name: tiers_and_size
      label: Tiers and size
      hint: Single or multi tier and servings
      type: text
      options: []
      required: true
    - id: 5
      name: delivery_required
      label: Delivery required
      hint: Delivery or pickup
      type: select_one
      options:
      - Pickup
      - Delivery
      required: true
    - id: 6
      name: delivery_address
      label: Delivery address
      hint: Required if delivery selected
      type: text
      options: []
      required: false
    - id: 7
      name: lead_time
      label: Lead time in days
      hint: Number of days needed to prepare order
      type: number
      options: []
      required: true
    - id: 8
      name: special_requests
      label: Special requests
      hint: Custom messages or dietary notes
      type: text
      options: []
      required: false
