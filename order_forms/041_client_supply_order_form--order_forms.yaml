      type: text
      options: []
      required: true
    - id: 12
      name: product_quantity_1
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: product_unit_price_1
      label: Unit Price
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: product_name_2
      label: Additional Product Name
      hint: Second item (optional)
      type: text
      options: []
      required: false
    - id: 15
      name: product_quantity_2
      label: Product Quantity 2
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: product_unit_price_2
      label: Product Unit Price 2
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: product_name_3
      label: Product Name 3
      hint: Third item (optional)
      type: text
      options: []
      required: false
    - id: 18
      name: product_quantity_3
      label: Product Quantity 3
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: product_unit_price_3
      label: Product Unit Price 3
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: special_instructions
      label: Special Instructions or Notes
      hint: Any special requests for this order
      type: text
      options: []
      required: false
    - id: 21
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit card
      - Check
      - Bank transfer
      - Purchase order
      - Other
      required: true
    - id: 22
      name: po_number
      label: Purchase Order Number
      hint: If applicable
      type: text
      options: []
      required: false
