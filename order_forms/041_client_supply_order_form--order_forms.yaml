inputSchema:
  type: object
  properties:
    title: Client Supply Order Form
    pages:
    - id: 1
      name: client_info_header
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: billing_address
      label: Billing Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: shipping_address
      label: Shipping Address
      hint: Leave blank if same as billing
      type: text
      options: []
      required: false
    - id: 8
      name: order_header
      label: -- Order Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
