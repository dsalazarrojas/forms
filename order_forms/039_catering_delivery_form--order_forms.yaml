inputSchema:
  type: object
  properties:
    title: Catering Delivery Form
    pages:
    - id: 1
      name: delivery_basics_header
      label: -- Delivery Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: delivery_date
      label: Date of Delivery
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: requested_arrival_time
      label: Requested Arrival Time
      hint: We recommend arrival 30-45 minutes before service
      type: time
      options: []
      required: true
    - id: 5
      name: service_start_time
      label: Service/Eating Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: section_address
      label: -- Delivery Location --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: delivery_address
      label: Delivery Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: venue_room_suite
      label: Building, Room, or Suite Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: access_instructions
      label: Gate Codes, Elevator Info, or Parking Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: onsite_contact_name
      label: Onsite Contact Name
      hint: The person who will receive the delivery
      type: text
      options: []
      required: true
    - id: 11
      name: onsite_contact_phone
      label: Onsite Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: section_food_setup
      label: -- Food and Setup --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: food_menu_items
      label: List of Items to be Delivered
      hint: e.g. 5x Sandwiches, 2x Salad Bowls
      type: text
      options: []
      required: true
    - id: 14
      name: setup_required_level
      label: Level of Setup Required
      hint: null
      type: select_one
      options:
      - Drop-off only
      - Simple Buffet Setup (Unpacking)
      - Full Professional Setup with Chafers
      required: true
    - id: 15
      name: equipment_to_be_left
      label: Equipment to be left onsite for pickup later
      hint: e.g. Chafing dishes, thermal bags, platters
      type: text
      options: []
      required: false
    - id: 16
      name: warming_instructions_needed
      label: Do you require warming or reheating instructions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: driver_name_internal
      label: Assigned Driver (Internal Use)
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: delivery_status_notes
      label: Delivery Status/Notes
      hint: To be filled upon completion
      type: text
      options: []
      required: false
