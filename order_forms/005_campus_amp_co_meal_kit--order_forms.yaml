inputSchema:
  type: object
  properties:
    title: Campus and Co. Meal Kit
    pages:
    - id: 1
      name: customer_details_section
      label: -- Customer Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: To send your order confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: In case we need to contact you about delivery
      type: text
      options: []
      required: true
    - id: 5
      name: delivery_address
      label: Delivery Address
      hint: Full address for your meal kit delivery
      type: text
      options: []
      required: true
    - id: 6
      name: order_type_section
      label: -- Order Type --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: order_type
      label: Order for Self or Gifting
      hint: Would you like this for yourself or as a gift for someone else
      type: select_one
      options:
      - For Self
      - As a Gift
      required: true
    - id: 8
      name: gift_recipient_name
      label: Gift Recipient Name
      hint: Only if this is a gift order
      type: text
      options: []
      required: false
    - id: 9
      name: gift_recipient_address
      label: Gift Recipient Address
      hint: Only if this is a gift order
      type: text
      options: []
      required: false
    - id: 10
      name: gift_message
      label: Gift Message
      hint: Add a personalized note to your gift
      type: text
      options: []
      required: false
    - id: 11
      name: meal_kit_selection_section
      label: -- Meal Kit Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: meal_kit_type
      label: Select Your Meal Kit
      hint: Choose your favorite menu
      type: select_one
      options:
      - Vegetarian Feast
      - Classic Meat
      - Gluten-Free Gourmet
      - Family Favorite
      - Keto Delight
      required: true
    - id: 13
      name: quantity
      label: Quantity
      hint: How many kits would you like
      type: number
      options: []
      required: true
    - id: 14
      name: delivery_date
      label: Delivery Date
      hint: Pick a date that works for you
      type: date
      options: []
      required: true
    - id: 15
      name: dietary_preferences
      label: Dietary Preferences and Allergies
      hint: Let us know if we need to make any adjustments
      type: text
      options: []
      required: false
    - id: 16
      name: payment_section
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: payment_method
      label: Payment Method
      hint: Choose how you would like to pay
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Campus Card
      - Cash on Delivery
      required: true
    - id: 18
      name: delivery_instructions
      label: Special Instructions for Delivery
      hint: Where should we leave your kit
      type: text
      options: []
      required: false
    - id: 19
      name: terms_agreement
      label: Terms and Conditions
      hint: Confirm that you agree with our delivery policies
      type: select_one
      options:
      - I agree to the terms
      - I do not agree
      required: true
