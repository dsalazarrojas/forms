inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - Credit Card
      - Pay Pal
      - Cash App
      required: false
    - id: 2
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date
      label: Date of Transaction
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time of Transaction
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: description
      label: Description
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Unpaid
      - Partially Paid
      - Pending
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
