inputSchema:
  type: object
  properties:
    title: Frozen Meal Order Form
    pages:
    - id: 1
      name: order_information
      label: Order Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: meal_type
      label: Meal Type
      hint: null
      type: select_one
      options:
      - Beef
      - Chicken
      - Vegetarian
      - Vegan
      required: true
    - id: 4
      name: meal_description
      label: Meal Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: special_instructions
      label: Special Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
