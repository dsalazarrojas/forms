inputSchema:
  type: object
  properties:
    title: Bar Beverage Pump Replacement Order Form
    pages:
    - id: 1
      name: order_date
      label: Order Date
      hint: Date of this replacement order
      type: date
      options: []
      required: true
    - id: 2
      name: establishment_name
      label: Establishment Name
      hint: Name of your bar or restaurant
      type: text
      options: []
      required: true
    - id: 3
      name: establishment_location
      label: Location or Address
      hint: Address of establishment
      type: text
      options: []
      required: true
    - id: 4
      name: manager_name
      label: Manager Name
      hint: Name of manager placing order
      type: text
      options: []
      required: true
    - id: 5
      name: manager_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: manager_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 7
      name: pump_type
      label: Pump Type Needed
      hint: What type of pump?
      type: select_one
      options:
      - Draft Beer Pump
      - Soda Dispenser Pump
      - Juice Pump
      - Mixed Beverage Pump
      - Wine Dispenser Pump
      - Syrup Pump
      - Other Beverage Pump
      required: true
    - id: 8
      name: pump_size
      label: Pump Size
      hint: Size or capacity needed
      type: select_one
      options:
      - Small (1-3 GPM)
      - Medium (3-5 GPM)
      - Large (5-10 GPM)
      - Extra Large (10+ GPM)
      - Not Sure
      required: true
    - id: 9
      name: brand_preference
      label: Brand Preference
      hint: Preferred pump brand or model
      type: text
      options: []
      required: false
    - id: 10
      name: current_pump_model
      label: Current Pump Model
      hint: If replacing, specify current model
      type: text
      options: []
      required: false
    - id: 11
      name: pump_location
      label: Pump Location
      hint: Where is pump installed?
      type: select_one
      options:
      - Front Bar
      - Back Bar
      - Walk-In Cooler
      - Keg Room
      - Multiple Locations
      required: true
    - id: 12
      name: quantity_needed
      label: Quantity Needed
      hint: Number of pumps to order
      type: number
      options: []
      required: true
    - id: 13
      name: reason_for_replacement
      label: Reason for Replacement
      hint: Why is pump replacement needed?
      type: select_one
      options:
      - Pump Failure
      - Wear and Tear
      - System Upgrade
      - Expansion
      - Routine Maintenance
      - Other
      required: true
    - id: 14
      name: pump_condition
      label: Current Pump Condition
      hint: Describe condition or issue
      type: text
      options: []
      required: false
    - id: 15
      name: urgency_level
      label: Order Urgency Level
      hint: How quickly is this needed?
      type: select_one
      options:
      - Routine Order
      - Standard Priority
      - Expedited
      - Emergency
      required: true
    - id: 16
      name: delivery_date_needed
      label: Date Needed By
      hint: When do you need the pump(s)?
      type: date
      options: []
      required: true
    - id: 17
      name: installation_required
      label: Installation Service Required?
      hint: Do you need professional installation?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Self-Install Available
      required: true
    - id: 18
      name: service_contract
      label: Service or Warranty Contract
      hint: Do you have a service contract?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Need More Information
      required: false
    - id: 19
      name: contract_number
      label: Service Contract Number
      hint: If applicable, provide contract number
      type: text
      options: []
      required: false
    - id: 20
      name: budget_amount
      label: Approved Budget Amount
      hint: Maximum approved spending
      type: number
      options: []
      required: false
    - id: 21
      name: purchase_order_number
      label: Purchase Order Number
      hint: If applicable, PO number
      type: text
      options: []
      required: false
    - id: 22
      name: special_instructions
      label: Special Instructions
      hint: Any specific requirements or notes
      type: text
      options: []
      required: false
