inputSchema:
  type: object
  properties:
    title: Coffee Order Form
    pages:
    - id: 1
      name: section_customer
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: section_delivery
      label: -- Delivery Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: delivery_type
      label: Delivery Type
      hint: null
      type: select_one
      options:
      - In-store Pickup
      - Local Delivery
      - Shipping
      required: true
    - id: 7
      name: delivery_address
      label: Delivery Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 8
      name: delivery_date
      label: Desired Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: delivery_time
      label: Preferred Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: section_drink_selection
      label: -- Drink Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: espresso_drink
      label: Espresso-based Drink
      hint: null
      type: select_one
      options:
      - Espresso
      - Americano
      - Latte
      - Cappuccino
      - Macchiato
      - Mocha
      - Flat White
      required: true
    - id: 12
      name: espresso_quantity
      label: Quantity
      hint: Number of drinks
      type: number
      options: []
      required: true
    - id: 13
      name: milk_option
      label: Milk Option
      hint: null
      type: select_one
      options:
      - Regular milk
      - Skim milk
      - Soy milk
      - Almond milk
      - Oat milk
      - Coconut milk
      - No milk
      required: true
    - id: 14
      name: size
      label: Cup Size
      hint: null
      type: select_one
      options:
      - Small (8 oz)
      - Medium (12 oz)
      - Large (16 oz)
      - Extra Large (20 oz)
      required: true
    - id: 15
      name: temperature
      label: Temperature
      hint: null
      type: select_one
      options:
      - Hot
      - Iced
      - Blended
      required: true
    - id: 16
      name: section_customization
      label: -- Customization --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: extra_shots
      label: Extra Espresso Shots
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: flavor_syrup
      label: Flavor Syrup
      hint: Optional flavoring
      type: select_one
      options:
      - None
      - Vanilla
      - Caramel
      - Hazelnut
      - Cinnamon
      - Mocha
      - Other
      required: false
    - id: 19
      name: whipped_cream
      label: Whipped Cream
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 20
      name: section_additional
      label: -- Additional Items --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: pastry_item
      label: Pastry or Food Item
      hint: null
      type: select_one
      options:
      - None
      - Croissant
      - Muffin
      - Cookie
      - Bagel
      - Sandwich
      - Other
      required: false
    - id: 22
      name: pastry_quantity
      label: Pastry Quantity
      hint: Number of items
      type: number
      options: []
      required: false
    - id: 23
      name: section_special
      label: -- Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: special_instructions
      label: Special Instructions
      hint: Allergies, preferences, notes
      type: text
      options: []
      required: false
    - id: 25
      name: section_payment
      label: -- Payment --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Apple Pay
      - Google Pay
      - Cash on delivery
      required: true
