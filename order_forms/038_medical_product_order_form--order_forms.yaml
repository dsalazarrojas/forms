inputSchema:
  type: object
  properties:
    title: Medical Product Order Form
    pages:
    - id: 1
      name: order_form
      label: Order Form
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Card Payments
      - PayPal
      - Stripe
      required: false
    - id: 4
      name: order_items
      label: Order Items
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: shipping_details
      label: Shipping Details
      hint: null
      type: text
      options: []
      required: false
