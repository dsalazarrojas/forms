inputSchema:
  type: object
  properties:
    title: Custom Collar Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: collar_type
      label: Collar Type
      hint: null
      type: select_one
      options:
      - type_a
      - type_b
      - type_c
      required: false
    - id: 4
      name: collar_size
      label: Collar Size
      hint: null
      type: select_one
      options:
      - size_small
      - size_medium
      - size_large
      required: false
    - id: 5
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
