inputSchema:
  type: object
  properties:
    title: Personal Training Package Order Form
    pages:
    - id: 1
      name: package_type
      label: Package Type
      hint: null
      type: select_one
      options:
      - Personal
      - Group
      - Semi-Private
      required: false
    - id: 2
      name: package_duration
      label: Package Duration
      hint: null
      type: select_one
      options:
      - 1 Month
      - 3 Months
      - 6 Months
      required: false
    - id: 3
      name: payment_plan
      label: Payment Plan
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Annually
      required: false
    - id: 4
      name: client_details
      label: Client Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: trainer_details
      label: Trainer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - Credit/Debit Card
      - PayPal
      required: false
    - id: 7
      name: order_note
      label: Order Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
