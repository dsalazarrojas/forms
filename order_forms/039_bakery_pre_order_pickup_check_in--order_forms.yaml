inputSchema:
  type: object
  properties:
    title: Bakery Pre Order Pickup Check In
    pages:
    - id: 1
      name: section_intro
      label: -- Pickup Check-In --
      hint: Confirm your bakery pre-order at pickup
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: order_number
      Label: Order Number or Reference
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: customer_phone
      Label: Phone Number on File
      hint: null
      type: phone
      options: []
      required: false
    - id: 5
      name: pickup_date
      label: Pickup Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: pickup_time
      Label: Arrival Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: section_order_items
      label: -- Order Items Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: items_ordered
      Label: Items in Order
      hint: Confirm what you are picking up
      type: text
      options: []
      required: true
    - id: 9
      name: quantity_confirmation
      Label: Quantities Confirmed
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: section_inspection
      label: -- Product Inspection --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: condition_satisfactory
      Label: Products Condition is Satisfactory
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Needs Adjustment
      required: true
    - id: 12
      name: special_requests_met
      Label: Special Requests Met
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - N/A
      required: false
    - id: 13
      name: quality_rating
      Label: Product Quality Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Acceptable
      - Below Expectations
      required: false
    - id: 14
      name: section_payment
      label: -- Payment Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: payment_method
      Label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Debit Card
      - Already Paid Online
      required: true
    - id: 16
      name: amount_paid
      Label: Amount Paid
      hint: In dollars
      type: decimal
      options: []
      required: false
    - id: 17
      name: receipt_provided
      Label: Receipt Provided
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: section_packaging
      label: -- Packaging and Handling --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: packaging_adequate
      Label: Packaging is Adequate for Transport
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Need Additional Packaging
      required: false
    - id: 20
      name: special_handling_needs
      Label: Special Handling Instructions Provided
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - N/A
      required: false
    - id: 21
      name: section_feedback
      label: -- Customer Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: overall_satisfaction
      Label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 23
      name: feedback_comments
      Label: Additional Comments or Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: staff_name
      Label: Staff Member Name (Assisting with Pickup)
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: checkout_complete
      Label: Pickup Check-In Complete
      hint: null
      type: select_one
      options:
      - Confirmed Complete
      - Other
      required: true
