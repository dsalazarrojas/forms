    - id: 4
      name: sharpening_service
      label: Sharpening Service
      hint: null
      type: select_one
      options:
      - Basic
      - Premium
      - Delux
      required: false
    - id: 5
      name: pick_up_date
      label: Pickup Date
      hint: Select a date
      type: date
      options: []
      required: false
    - id: 6
      name: drop_off_date
      label: Drop-off Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: pick_up_time
      label: Pickup Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: drop_off_time
      label: Drop-off Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: online_payment
      label: Online Payment
      hint: null
      type: select_one
      options:
      - PayPal
      - Stripe
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
