inputSchema:
  type: object
  properties:
    title: Culinary Knife Sharpening Service Order Form
    pages:
    - id: 1
      name: customer
      label: Customer
      hint: null
      type: select_one
      options:
      - Jimmy
      - Bob
      - Alice
      required: false
    - id: 2
      name: knife_type
      label: Knifetype
      hint: null
      type: select_one
      options:
      - Chef's Knife
      - Paring Knife
      - Utility Knife
      required: false
    - id: 3
      name: num_knives
      label: Number of Knives
      hint: null
