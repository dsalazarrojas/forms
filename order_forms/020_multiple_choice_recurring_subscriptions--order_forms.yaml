      required: false
    - id: 4
      name: subscription_end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: customer
      label: Customer
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: subscription_status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
