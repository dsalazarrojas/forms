inputSchema:
  type: object
  properties:
    title: Holiday Meal Planning Form
    pages:
    - id: 1
      name: holiday_meal_preferences
      label: Holiday Meal Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_one
      options:
      - None
      - Gluten-Free
      - Vegan
      - Vegetarian
      - Kosher
      required: false
    - id: 4
      name: meal_preferences
      label: Meal Preferences
      hint: null
      type: select_multiple
      options:
      - Turkey
      - Ham
      - Fish
      - Roast Beef
      - Vegetarian
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
