inputSchema:
  type: object
  properties:
    title: Jet Ski Rental Reservation Form
    pages:
    - id: 1
      name: customer_name
      label: customer_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rental_start_time
      label: start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: rental_end_time
      label: end_date
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: jet_ski_type
      label: jet_ski_model
      hint: null
      type: select_one
      options:
      - Kawasaki
      - Sea-Doo
      - Yamaha
      required: false
    - id: 5
      name: rental_location
      label: location
      hint: null
      type: select_multiple
      options:
      - beach
      - lake
      - river
      required: false
    - id: 6
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - card
      - cash
      required: false
    - id: 7
      name: customer_email
      label: customer_email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: customer_phone
      label: customer_phone
      hint: null
      type: text
      options: []
      required: false
