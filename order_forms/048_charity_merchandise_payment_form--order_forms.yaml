inputSchema:
  type: object
  properties:
    title: Charity Merchandise Payment Form
    pages:
    - id: 1
      name: customer_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: mailing_address
      label: Mailing Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 9
      name: item_selection
      label: Select Merchandise Item
      hint: What you want
      type: select_one
      options:
      - T-shirt
      - Hoodie
      - Tote bag
      - Water bottle
      - Mug
      - Cap or hat
      - Wristband
      - Sticker pack
      required: true
    - id: 10
      name: size_selection
      label: Size
      hint: If apparel
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      - One size
      - Not applicable
      required: true
    - id: 11
      name: color_selection
      label: Color
      hint: Preference
      type: select_one
      options:
      - Black
      - White
      - Navy
      - Gray
      - Red
      - Blue
      - Green
      - No preference
      required: true
    - id: 12
      name: quantity
      label: Quantity
      hint: How many
      type: number
      options: []
      required: true
    - id: 13
      name: unit_price
      label: Unit Price
      hint: Per item
      type: number
      options: []
      required: true
    - id: 14
      name: subtotal
      label: Subtotal
      hint: Before shipping
      type: number
      options: []
      required: true
    - id: 15
      name: shipping_method
      label: Shipping Method
      hint: Delivery option
      type: select_one
      options:
      - Standard shipping
      - Express shipping
      - Overnight shipping
      - Local pickup
      required: true
    - id: 16
      name: shipping_cost
      label: Shipping Cost
      hint: Delivery fee
      type: number
      options: []
      required: true
    - id: 17
      name: donation_add_on
      label: Add a Donation
      hint: Support the cause
      type: select_one
      options:
      - No donation
      - $5
      - $10
      - $25
      - $50
      - Other amount
      required: false
    - id: 18
      name: total_amount
      label: Total Amount
      hint: Final total
      type: number
      options: []
      required: true
    - id: 19
      name: payment_method
      label: Payment Method
      hint: How to pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - PayPal
      - Apple Pay
      - Google Pay
      required: true
    - id: 20
      name: gift_message
      label: Gift Message
      hint: If this is a gift
      type: text
      options: []
      required: false
    - id: 21
      name: special_instructions
      label: Special Instructions
      hint: Order notes
      type: text
      options: []
      required: false
