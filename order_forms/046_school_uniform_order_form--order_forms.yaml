inputSchema:
  type: object
  properties:
    title: School Uniform Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: payment_details
      label: Payment Details
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: school_products
      label: School Products
      hint: null
      type: select_one
      options:
      - Product 1
      - Product 2
      - Product 3
      required: false
    - id: 6
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: confirm_order
      label: Confirm Order
      hint: null
      type: select_one
      options:
      - Confirm
      - Decline
      required: false
    - id: 8
      name: submit_button
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: false
