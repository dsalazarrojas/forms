inputSchema:
  type: object
  properties:
    title: PayU Product Order Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: payu_method
      label: PayU Method
      hint: null
      type: select_one
      options:
      - '{''label'': ''Bank Transfer''}'
      - '{''label'': ''Credit Card''}'
      - '{''label'': ''PayPal''}'
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: products
      label: Products
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: total
      label: Total
      hint: null
      type: number
      options: []
      required: true
