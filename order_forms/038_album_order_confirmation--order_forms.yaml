inputSchema:
  type: object
  properties:
    title: Album Order Confirmation
    pages:
    - id: 1
      name: order_reference
      label: Order Number
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_full_name
      label: Customer Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: album_type_style
      label: Album Type and Style
      hint: e.g. Wedding Album, 12x12 Leather, Layflat
      type: text
      options: []
      required: true
    - id: 4
      name: section_page_reviews
      label: -- Page Layout Review --
      hint: Please review the proofs provided via email/portal
      type: note
      options: []
      required: false
    - id: 5
      name: cover_approval
      label: Cover Design and Material Approval
      hint: null
      type: select_one
      options:
      - Approved as is
      - Revision Requested
      required: true
    - id: 6
      name: cover_revisions
      label: Cover Revision Requests
      hint: Describe changes if 'Revision Requested' was selected
      type: text
      options: []
      required: false
    - id: 7
      name: internal_pages_approval
      label: Internal Pages Layout Approval
      hint: All pages from start to finish
      type: select_one
      options:
      - All Pages Approved
      - Specific Page Revisions Needed
      required: true
    - id: 8
      name: page_revision_details
      label: List Specific Page Numbers and Requested Edits
      hint: e.g. Page 5 - Swap photo with file_012.jpg
      type: text
      options: []
      required: false
    - id: 9
      name: section_finishing
      label: -- Finishing and Paper --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: paper_type_confirmed
      label: Confirm Paper Type
      hint: null
      type: select_one
      options:
      - Lustre
      - Matte
      - Glossy
      - Fine Art (Hahnemühle)
      - Metallic
      required: true
    - id: 11
      name: gilding_options
      label: Edge Gilding Selection
      hint: null
      type: select_one
      options:
      - None (Standard)
      - Gold
      - Silver
      - Black
      required: true
    - id: 12
      name: shipping_address_check
      label: Confirm Delivery Address
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: final_approval_date
      label: Approval Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: approval_authorization
      label: I authorize the printing of this album and understand no further changes
        can be made once submitted
      hint: null
      type: select_one
      options:
      - I authorize and approve
      - Other
      required: true
