inputSchema:
  type: object
  properties:
    title: Coffee Pre Order Form For Pickup
    pages:
    - id: 1
      name: section_customer
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: For pickup confirmation
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Optional
      type: email
      options: []
      required: false
    - id: 5
      name: section_pickup
      label: -- Pickup Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: pickup_date
      label: Pickup Date
      hint: When will you pick up your order
      type: date
      options: []
      required: true
    - id: 7
      name: pickup_time
      label: Preferred Pickup Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: location
      label: Pickup Location
      hint: Which store location
      type: select_one
      options:
      - Downtown Store
      - Mall Location
      - West Side Location
      - North Store
      required: true
