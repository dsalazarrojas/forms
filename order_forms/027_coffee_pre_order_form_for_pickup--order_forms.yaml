      - Latte
      - Cappuccino
      - Macchiato
      - Mocha
      - Flat White
      - Espresso
      - Cold Brew
      - Iced Coffee
      required: true
    - id: 11
      name: drink_1_quantity
      label: Quantity
      hint: Number of drinks
      type: number
      options: []
      required: true
    - id: 12
      name: drink_1_size
      label: Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 13
      name: drink_1_customization
      label: Customizations
      hint: Milk type, extras, flavor
      type: text
      options: []
      required: false
    - id: 14
      name: drink_choice_2
