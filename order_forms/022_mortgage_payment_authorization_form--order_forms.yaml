inputSchema:
  type: object
  properties:
    title: Mortgage Payment Authorization Form
    pages:
    - id: 1
      name: borrower_name
      label: Borrower's Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: loan_amount
      label: Loan Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: address
      label: Address
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: authorization_type
      label: Authorization Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
