      - PayPal
      - Cash
      required: true
    - id: 12
      name: janet_pay_user
      label: Payment Username
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: janet_shipping_type
      label: Delivery Choice
      hint: null
      type: select_one
      options:
      - Standard ($4.00)
      - Priority ($8.50)
      - Janet's Porch Pick-up (Free)
      required: true
    - id: 14
      name: janet_hostess
      label: Party Hostess (if any)
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: janet_notes
      label: Personal Message for Janet
      hint: null
      type: text
      options: []
      required: false
