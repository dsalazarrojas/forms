      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: janet_customer_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: janet_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: janet_shipping
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: janet_phone
      label: Phone (Optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_janet_stock
      label: -- Select from Janet's Stock --
      hint: Please list set names exactly as shown in the album
      type: note
      options: []
      required: false
    - id: 7
      name: janet_sets_ordered
      label: Sets Requested
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: janet_total_sets
      label: Total number of sets
      hint: null
      type: number
      options: []
      required: true
