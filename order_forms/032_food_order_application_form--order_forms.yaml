inputSchema:
  type: object
  properties:
    title: Food Order Application Form
    pages:
    - id: 1
      name: customer_name
      label: Customer name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_type
      label: Event Type
      hint: Select the type of event
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Wedding''}'
      - '{''id'': 2, ''name'': ''Birthday Party''}'
      - '{''id'': 3, ''name'': ''Corporate Event''}'
      required: true
    - id: 5
      name: order_type
      label: Order Type
      hint: Select the types of food you want to order
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''Food''}'
      - '{''id'': 2, ''name'': ''Drinks''}'
      - '{''id'': 4, ''name'': ''Both''}'
      required: true
    - id: 6
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: minimalist
      label: Minimalist List
      hint: Select the type of minimalist options
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Option 1''}'
      - '{''id'': 2, ''name'': ''Option 2''}'
      - '{''id'': 3, ''name'': ''Option 3''}'
      required: false
    - id: 9
      name: special_request
      label: Special Request
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: zip
      label: Zip
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: special_instructions
      label: Special Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
