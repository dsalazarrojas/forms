inputSchema:
  type: object
  properties:
    title: Tax Software Package Selection
    pages:
    - id: 1
      name: tax_professional
      label: Tax Professional
      hint: null
      type: select_one
      options:
      - Tax Consultant
      - Tax Lawyer
      - Tax Accountant
      - Tax Advisor
      required: true
    - id: 2
      name: tax_professional_experience
      label: Professional Experience
      hint: null
      type: select_one
      options:
      - 0-5 years
      - 5-10 years
      - 10-20 years
      - 20 years +
      required: true
    - id: 3
      name: tax_package_features
      label: Package Features
      hint: null
      type: select_multiple
      options:
      - Fast and efficient data collection
      - Smoother online purchases
      - Good customer support
      - Online purchases available
      required: true
    - id: 4
      name: package_benefits
      label: Benefits
      hint: null
      type: select_multiple
      options:
      - Fast and efficient data collection
      - Smoother online purchases
      - Good customer support
      - Online purchases available
      required: true
    - id: 5
      name: software_seller
      label: Software Seller
      hint: null
      type: select_one
      options:
      - Highly rated
      - Neutral
      - Low rated
      required: true
    - id: 6
      name: confidence_level
      label: Confidence Level
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: hours_spent
      label: Hours Spent
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: expected_date_of_purchase
      label: Expected Date of Purchase
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      - Other
      required: true
    - id: 10
      name: purchases_count
      label: Purchases Count
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: hours_spent_per_month
      label: Hours Spent per Month
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: expected_date_of_purchase_2
      label: Expected Date Of Purchase 2
      hint: null
      type: date
      options: []
      required: true
