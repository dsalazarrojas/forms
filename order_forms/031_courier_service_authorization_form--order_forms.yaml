inputSchema:
  type: object
  properties:
    title: Courier Service Authorization Form
    pages:
    - id: 1
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: package_details
      label: Package Details
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: shipping_date
      label: Shipping Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: shipping_time
      label: Shipping Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: courier_service
      label: Courier Service
      hint: null
      type: select_one
      options:
      - Fedex
      - UPS
      - USPS
      required: false
    - id: 6
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
