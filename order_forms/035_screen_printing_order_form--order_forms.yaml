inputSchema:
  type: object
  properties:
    title: Screen Printing Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: order_comments
      label: Order Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 8
      name: customer_notes
      label: Customer Notes
      hint: null
      type: note
      options: []
      required: false
