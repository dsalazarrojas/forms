description: Gathering feedback on the recent course event to improve future offerings.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied were you with the course overall?
  type: single
- options:
  - Introduction
  - Core Concepts
  - Practical Workshop
  - Advanced Topics
  - Q&A Panel
  text: Which sessions did you find most valuable? (select all that apply)
  type: multiple
- options:
  - true
  - false
  - Somewhat
  text: Was the course event well organized?
  type: single
- options:
  - Very likely
  - Somewhat likely
  - Not likely
  - Unsure
  text: How likely are you to attend a similar course again?
  type: single
- text: What was the most impactful takeaway from the course?
  type: text
- text: Do you have any additional comments or feedback?
  type: text
title: Course feedback survey
