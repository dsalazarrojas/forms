title: Course feedback survey
description: Generate a Course feedback survey survey for the "Event surveys" category. Use the template name: "Course feedback survey template".
questions:
  - text: Overall, how satisfied are you with course feedback survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Course, Feedback, Survey, Event]
  - text: How often do you interact with course feedback survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
