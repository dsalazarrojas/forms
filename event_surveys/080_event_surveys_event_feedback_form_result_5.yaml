title: Event feedback form
description: Generate a Event feedback form survey for the "Event surveys" category. Use the template name: "Event feedback form template".
questions:
  - text: Overall, how satisfied are you with event feedback form?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Event, Feedback, Form, Surveys]
  - text: How often do you interact with event feedback form?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
