description: A survey to gather feedback on the recent event and help us improve future
  experiences.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied were you with the event overall?
  type: single
- options:
  - Keynote speeches
  - Breakout sessions
  - Networking opportunities
  - Workshops
  - Exhibitor booths
  - Q&A panels
  text: Which event aspects or sessions did you find most valuable? (select all that
    apply)
  type: multiple
- options:
  - true
  - false
  text: Was the event well organized and managed?
  type: single
- options:
  - Very likely
  - Likely
  - Neutral
  - Unlikely
  - Very unlikely
  text: How likely are you to attend a similar event in the future?
  type: single
- text: Do you have any additional comments or suggestions for improvement?
  type: text
title: Event questionnaire
