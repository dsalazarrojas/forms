title: Post event feedback survey
description: Generate a Post event feedback survey survey for the "Event surveys" category. Use the template name: "Post event feedback survey template".
questions:
  - text: Overall, how satisfied are you with post event feedback survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Post, Event, Feedback, Survey]
  - text: How often do you interact with post event feedback survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
