title: Event satisfaction survey
description: Generate a Event satisfaction survey survey for the "Event surveys" category. Use the template name: "Event satisfaction survey template".
questions:
  - text: Overall, how satisfied are you with event satisfaction survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Event, Satisfaction, Survey, Surveys]
  - text: How often do you interact with event satisfaction survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
