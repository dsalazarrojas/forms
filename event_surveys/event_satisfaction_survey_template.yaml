description: Gather feedback on your experience at our recent event to help us improve
  future events.
questions:
- options:
  - Very satisfied
  - Satisfied
  - Neutral
  - Dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied were you with the event?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate the quality of the presentations and speakers?
  type: single
- options:
  - Presentations
  - Networking opportunities
  - Workshops/Breakout sessions
  - Venue/Logistics
  - Information provided
  text: Which aspects of the event did you find most valuable? (select all that apply)
  type: multiple
- options:
  - true
  - false
  - Somewhat
  text: Did you feel the event was engaging and informative?
  type: single
- text: What could be improved for future events?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: Event satisfaction survey
