title: Pre-event survey
description: Generate a Pre-event survey survey for the "Event surveys" category. Use the template name: "Pre-event survey template".
questions:
  - text: Overall, how satisfied are you with pre-event survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Pre, Event, Survey, Surveys]
  - text: How often do you interact with pre-event survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
