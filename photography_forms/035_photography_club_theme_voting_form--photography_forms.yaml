inputSchema:
  type: object
  properties:
    title: Photography Club Theme Voting Form
    pages:
    - id: 1
      name: user_input
      label: Photography Group
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: theme_description
      label: Event Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: theme_title
      label: Theme Title
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: theme_image
      label: Theme Image
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: theme_location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: event_duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: voting_open
      label: Voting Open
      hint: null
      type: select_multiple
      options:
      - 09:00 - 12:00 AM
      - 12:00 - 03:00 AM
      - 03:00 - 06:00 AM
      - 06:00 - 09:00 AM
      - 09:00 - 12:00 PM
      - 12:00 - 03:00 PM
      - 03:00 - 06:00 PM
      - 06:00 - 09:00 PM
      required: true
    - id: 10
      name: theme_notes
      label: Notes
      hint: Theme notes
      type: text
      options: []
      required: false
    - id: 11
      name: submit_button_label
      label: Submit
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: user_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: user_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: theme_status
      label: Theme Status
      hint: null
      type: select_one
      options:
      - Open for Voting
      - Closed for Voting
      - Cancelled
      required: true
