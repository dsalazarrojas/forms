inputSchema:
  type: object
  properties:
    title: Photo Print Release Form Template
    pages:
    - id: 1
      name: photo_print_release_form_template
      label: Client Name
      hint: Client name
      type: text
      options: []
      required: false
    - id: 2
      name: photo_print_release
      label: Print Release
      hint: null
      type: select_one
      options:
      - print
      - do not print
      required: false
    - id: 3
      name: photo_capture_date
      label: Capture Date
      hint: Date of photo capture
      type: date
      options: []
      required: false
    - id: 4
      name: photo_capture_location
      label: Capture Location
      hint: Location where the photo was captured
      type: text
      options: []
      required: false
    - id: 5
      name: photo_release
      label: Release Permission
      hint: Give permission to client to print photos
      type: select_multiple
      options:
      - print
      - do not print
      - unknown
      required: false
    - id: 6
      name: photo_print_release_date
      label: Release Date
      hint: Date release was signed
      type: date
      options: []
      required: false
    - id: 7
      name: client_signature
      label: Client Signature
      hint: Client signature
      type: text
      options: []
      required: false
    - id: 8
      name: client_signature_date
      label: Signature Date
      hint: Date of client signature
      type: date
      options: []
      required: false
    - id: 9
      name: print_release_agreement
      label: Print Release Agreement
      hint: Client agreement to print photos
      type: select_one
      options:
      - agree
      - disagree
      required: false
    - id: 10
      name: photo_print_restriction
      label: Print Restriction
      hint: Restrictions for printing photos
      type: text
      options: []
      required: false
    - id: 11
      name: photo_print_restriction_details
      label: Print Restriction Details
      hint: Provide details for photo print restriction
      type: text
      options: []
      required: false
    - id: 12
      name: photo_capture_details
      label: Photo Capture Details
      hint: Provide details for photo capture
      type: text
      options: []
      required: false
    - id: 13
      name: photo_release_agreement_terms
      label: Release Agreement Terms
      hint: Print release agreement terms and conditions
      type: text
      options: []
      required: false
