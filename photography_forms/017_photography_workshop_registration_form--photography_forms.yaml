inputSchema:
  type: object
  properties:
    title: Photography Workshop Registration Form
    pages:
    - id: 1
      name: registration_info
      label: registration_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Bank Transfer
      required: true
    - id: 6
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: workshop_info
      label: Workshop Info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: participant_notes
      label: Participant Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submit
      label: submit
      hint: null
      type: text
      options: []
      required: false
