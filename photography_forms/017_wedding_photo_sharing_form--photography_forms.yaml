inputSchema:
  type: object
  properties:
    title: Wedding Photo Sharing Form
    pages:
    - id: 1
      name: form_id
      label: Form ID
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: wedding_photo_sharing_form
      label: Wedding Photo Sharing Form
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: married_or_engaged
      label: Are you married or engaged?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: wedding_date
      label: Date of the wedding
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: wedding_time
      label: Time of the wedding
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: shared_photos
      label: Shared Photos
      hint: null
      type: select_one
      options:
      - Album
      - Video
      required: true
    - id: 7
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: reunion_photos
      label: Reunion Photos
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: false
