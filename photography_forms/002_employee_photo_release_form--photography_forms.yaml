inputSchema:
  type: object
  properties:
    title: Employee Photo Release Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee Id
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: photo_location
      label: Photo Location
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: photo_date
      label: Photo Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: photo_time
      label: Photo Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: photo_description
      label: Photo Description
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: photo_usage
      label: Photo Usage
      hint: null
      type: select_one
      options:
      - For Marketing and Branding
      - For Social Media
      - Other
      required: true
    - id: 11
      name: photo_usage_other
      label: Other
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
