inputSchema:
  type: object
  properties:
    title: Wildlife Photography Permission Form
    pages:
    - id: 1
      name: photographer_information
      label: Photographer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: photo_location
      label: Photo Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: photo_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: photo_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: photo_subjects
      label: Photo Subjects
      hint: List the subjects of the photo(s) taken
      type: select_multiple
      options:
      - Wildlife
      - Landscapes
      - Flora
      - Fauna
      - Other
      required: true
    - id: 7
      name: photo_location_description
      label: Description of Photo Location
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: photo_description
      label: Brief Description of Photos
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: permission_type
      label: Type of Permission
      hint: null
      type: select_one
      options:
      - General
      - Specific Event
      required: true
    - id: 10
      name: permission_expiration_date
      label: Expiration Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: permission_expiration_time
      label: Expiration Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 15
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
