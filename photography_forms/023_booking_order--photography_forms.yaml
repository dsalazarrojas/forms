inputSchema:
  type: object
  properties:
    title: Booking Order
    pages:
    - id: 1
      name: client_full_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: We will send photo details to this email
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: event_type
      label: Event Type
      hint: What type of photography do you need
      type: select_one
      options:
      - Wedding
      - Portrait session
      - Family photos
      - Product photography
      - Event coverage
      - Headshots
      - Real estate
      - Other
      required: true
    - id: 5
      name: event_date
      label: Event Date
      hint: When is your event
      type: date
      options: []
      required: true
    - id: 6
      name: event_time
      label: Event Start Time
      hint: What time does the event start
      type: time
      options: []
      required: true
    - id: 7
      name: event_duration
      label: Photography Duration Needed
      hint: How many hours of photography
      type: select_one
      options:
      - 1-2 hours
      - 2-4 hours
      - 4-6 hours
      - Full day (8 hours)
      - Full day (12 hours)
      - Multiple days
      required: true
    - id: 8
      name: event_location
      label: Event Location
      hint: Address of the event
      type: text
      options: []
      required: true
    - id: 9
      name: number_of_guests
      label: Expected Number of People
      hint: Approximate guest count
      type: number
      options: []
      required: true
    - id: 10
      name: photography_style
      label: Preferred Photography Style
      hint: Select your preferred style
      type: select_multiple
      options:
      - Traditional
      - Candid
      - Photojournalistic
      - Artistic
      - Black and white
      - Color
      - Mixed style
      required: true
    - id: 11
      name: package_type
      label: Package Type
      hint: Select the photography package
      type: select_one
      options:
      - Basic package
      - Standard package
      - Premium package
      - Luxury package
      - Custom package
      required: true
    - id: 12
      name: deliverables
      label: Required Deliverables
      hint: What do you want to receive
      type: select_multiple
      options:
      - Digital photos
      - Printed photos
      - Photo album
      - Slideshow video
      - Engagement announcement
      - DVD
      - USB drive
      required: true
    - id: 13
      name: special_requests
      label: Special Requests
      hint: Any specific shots or requirements
      type: text
      options: []
      required: false
    - id: 14
      name: budget
      label: Photography Budget
      hint: Your budget range
      type: select_one
      options:
      - Under $500
      - $500 - $1,000
      - $1,000 - $2,000
      - $2,000 - $5,000
      - $5,000+
      required: false
    - id: 15
      name: deposit_payment
      label: Deposit Payment
      hint: Ready to secure your date with deposit
      type: select_one
      options:
      - true
      - Need more information
      - Will contact you
      required: true
