inputSchema:
  type: object
  properties:
    title: Photo Upload Form
    pages:
    - id: 1
      name: photo_upload_form_page_1
      label: What's the purpose of the photo upload?
      hint: Briefly describe the purpose of the photo upload
      type: text
      options: []
      required: true
    - id: 2
      name: photo_upload_form_page_2
      label: What's the date of the photo?
      hint: Select the date the photo was taken
      type: date
      options: []
      required: false
    - id: 3
      name: photo_upload_form_page_3
      label: Who is the photographer?
      hint: Select the photographer
      type: select_one
      options:
      - Self
      - Friend
      - Professional
      required: true
    - id: 4
      name: photo_upload_form_page_4
      label: What type of event is the photo related to?
      hint: Select the type of event
      type: select_multiple
      options:
      - Birthday party
      - Wedding
      - Graduation
      - Other
      required: true
    - id: 5
      name: photo_upload_form_page_5
      label: What's the location where the photo was taken?
      hint: Enter the location where the photo was taken
      type: text
      options: []
      required: true
    - id: 6
      name: photo_upload_form_page_6
      label: What's the time of the event?
      hint: Select the time of the event
      type: time
      options: []
      required: true
    - id: 7
      name: photo_upload_form_page_7
      label: What's your email address?
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 8
      name: photo_upload_form_page_8
      label: What's your phone number?
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 9
      name: photo_upload_form_page_9
      label: Upload a photo (max 5MB)
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: photo_upload_form_page_10
      label: Description of the photo
      hint: Enter a description of the photo
      type: text
      options: []
      required: true
