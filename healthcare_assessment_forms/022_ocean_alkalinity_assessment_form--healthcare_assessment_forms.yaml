inputSchema:
  type: object
  properties:
    title: Ocean Alkalinity Assessment Form
    pages:
    - id: 1
      name: sampling_location
      label: Sampling Location
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: sampling_date
      label: Date of Sampling
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: water_temperature
      label: Water Temperature
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: salinity
      label: Salinity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: ocean_alkalinity_level
      label: Ocean Alkalinity Level
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Very Low
      - Very High
      required: false
    - id: 6
      name: has_other_locations
      label: Other Locations
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 7
      name: is_temperature_range
      label: Was Water Temperature within Range?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: is_salinity_range
      label: Was Salinity within Range?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: note
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
