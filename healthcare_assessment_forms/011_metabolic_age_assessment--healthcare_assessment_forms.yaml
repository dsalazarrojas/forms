inputSchema:
  type: object
  properties:
    title: Metabolic Age Assessment
    pages:
    - id: 1
      name: height
      label: height
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: weight
      label: weight
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: age
      label: age
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: activity_level
      label: activity level
      hint: null
      type: select_one
      options:
      - '{''value'': ''sedentary''}'
      - '{''value'': ''lightly_active''}'
      - '{''value'': ''moderately_active''}'
      - '{''value'': ''very_active''}'
      required: false
