      - 'No'
      required: false
    - id: 9
      name: metabolic_age
      label: metabolic age
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: recommendations
      label: recommendations
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: estimated_body_mass_index
      label: estimated body mass index
      hint: null
      type: number
      options: []
      required: false
