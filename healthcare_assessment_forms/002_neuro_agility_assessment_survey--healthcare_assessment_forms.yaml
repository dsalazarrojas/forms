      name: thinking_preferences
      label: Thinking Preferences
      hint: null
      type: select_multiple
      options:
      - '{1: ''Very High''}'
      - '{2: ''High''}'
      - '{3: ''Medium''}'
      - '{4: ''Low''}'
      - '{5: ''Very Low''}'
      required: false
