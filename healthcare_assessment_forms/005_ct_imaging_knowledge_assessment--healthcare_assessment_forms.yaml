inputSchema:
  type: object
  properties:
    title: CT Imaging Knowledge Assessment
    pages:
      - id: 1
        name: trainee_name
        label: Trainee Name
        hint: Full name of the person being assessed
        type: text
        options: []
        required: true
      - id: 2
        name: employee_id
        label: Employee ID
        hint: Your staff identification number
        type: text
        options: []
        required: true
      - id: 3
        name: department
        label: Department
        hint: Your current department
        type: select_one
        options:
          - Radiology
          - Emergency
          - Oncology
          - Cardiology
          - Neurology
          - Other
        required: true
      - id: 4
        name: role_position
        label: Role or Position
        hint: Your current job title
        type: select_one
        options:
          - Radiologic Technologist
          - Radiologist
          - Nurse
          - Physician
          - Student Trainee
          - Other
        required: true
      - id: 5
        name: experience_level
        label: CT Imaging Experience Level
        hint: How much experience do you have with CT imaging
        type: select_one
        options:
          - No experience
          - Less than 1 year
          - 1-3 years
          - 3-5 years
          - Over 5 years
        required: true
      - id: 6
        name: assessment_date
        label: Assessment Date
        hint: Date of this knowledge assessment
        type: date
        options: []
        required: true
      - id: 7
        name: ct_basics_understanding
        label: CT Basics Understanding
        hint: Rate your understanding of CT fundamentals
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Needs improvement
        required: true
      - id: 8
        name: radiation_safety_knowledge
        label: Radiation Safety Knowledge
        hint: Rate your knowledge of radiation safety protocols
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Needs improvement
        required: true
      - id: 9
        name: contrast_agents_familiarity
        label: Contrast Agents Familiarity
        hint: How familiar are you with contrast agents
        type: select_one
        options:
          - Very familiar
          - Somewhat familiar
          - Slightly familiar
          - Not familiar
        required: true
      - id: 10
        name: patient_positioning_skill
        label: Patient Positioning Skill Level
        hint: Rate your patient positioning abilities
        type: select_one
        options:
          - Expert
          - Proficient
          - Competent
          - Novice
        required: true
      - id: 11
        name: protocol_selection_ability
        label: Protocol Selection Ability
        hint: How confident are you selecting scan protocols
        type: select_one
        options:
          - Very confident
          - Confident
          - Somewhat confident
          - Not confident
        required: true
      - id: 12
        name: artifact_identification
        label: Artifact Identification Skill
        hint: Can you identify common CT artifacts
        type: select_one
        options:
          - Yes, all common artifacts
          - Most artifacts
          - Some artifacts
          - Need more training
        required: true
      - id: 13
        name: emergency_procedures_knowledge
        label: Emergency Procedures Knowledge
        hint: Understanding of emergency procedures during CT scans
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Needs improvement
        required: true
      - id: 14
        name: quality_control_understanding
        label: Quality Control Understanding
        hint: Knowledge of CT quality control procedures
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Needs improvement
        required: true
      - id: 15
        name: areas_needing_improvement
        label: Areas Needing Improvement
        hint: Select areas where you need more training
        type: select_multiple
        options:
          - CT physics
          - Radiation dosing
          - Protocol optimization
          - Contrast administration
          - Pediatric imaging
          - Cardiac CT
          - Neuro CT
          - Trauma imaging
          - None
        required: false
      - id: 16
        name: preferred_training_format
        label: Preferred Training Format
        hint: How do you prefer to receive additional training
        type: select_one
        options:
          - Hands-on practice
          - Online modules
          - Classroom instruction
          - Mentorship
          - Video tutorials
        required: false
      - id: 17
        name: additional_comments
        label: Additional Comments
        hint: Any other information about your CT imaging knowledge
        type: text
        options: []
        required: false
