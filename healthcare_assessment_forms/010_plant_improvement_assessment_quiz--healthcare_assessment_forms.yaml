inputSchema:
  type: object
  properties:
    title: Plant Improvement Assessment Quiz
    pages:
    - id: 1
      name: plant_improvement_assessment_quiz_form
      label: Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: plant_performance_rating
      label: Overall
      hint: null
      type: select_one
      options:
      - 0 - 1 (very poor)
      - 2 - 3 (poor)
      - 4 - 5 (average)
      - 6 - 7 (good)
      - 8 - 9 (excellent)
      required: false
    - id: 4
      name: soil_nutrition_rating
      label: Soil
      hint: null
      type: select_one
      options:
      - 0 - 1 (very poor)
      - 2 - 3 (poor)
      - 3 - 4 (fair)
      - 5 - 6 (good)
      - 7 - 8 (excellent)
      required: false
    - id: 5
      name: water_availability_rating
      label: Water
      hint: null
      type: select_one
      options:
      - 0 - 1 (very poor)
      - 2 - 3 (poor)
      - 3 - 4 (fair)
      - 4 - 5 (good)
      - 6 - 7 (excellent)
      required: false
    - id: 6
      name: pest_control_rating
      label: Pest
      hint: null
      type: select_one
      options:
      - 0 - 1 (very poor)
      - 2 - 3 (poor)
      - 3 - 4 (fair)
      - 5 - 6 (good)
      - 7 - 8 (excellent)
      required: false
    - id: 7
      name: nutrient_balance_rating
      label: Nutrient
      hint: null
      type: select_one
      options:
      - 0 - 1 (very poor)
      - 2 - 3 (poor)
      - 3 - 4 (fair)
      - 5 - 6 (good)
      - 7 - 8 (excellent)
      required: false
    - id: 8
      name: comments_and_suggestions
      label: Comments and Suggestions
      hint: null
      type: text
      options: []
      required: false
