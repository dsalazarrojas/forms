inputSchema:
  type: object
  properties:
    title: Respiratory Therapist Skills Checklist
    pages:
    - id: 1
      name: therapist_experience
      label: Therapist Experience
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: licensure
      label: Licensure
      hint: null
      type: select_one
      options:
      - Respiratory Therapist License
      - Certified Pulmonary Rehabilitation Specialist
      - Other (please specify)
      required: false
    - id: 3
      name: core_skills
      label: Core Skills
      hint: null
      type: select_multiple
      options:
      - Cardiac Pulmonary Rehabilitation
      - Pulmonary Rehabilitation
      - Cardiopulmonary Resuscitation
      - Ventilatory Care
      - Other (please specify)
      required: false
    - id: 4
      name: equipment_proficiency
      label: Equipment Proficiency
      hint: null
      type: select_multiple
      options:
      - Incentive Spirometer
      - PFT Spirometer
      - Other (please specify)
      required: false
    - id: 5
      name: hiring_staffing_training
      label: Hiring/Staffing/Training
      hint: null
      type: select_one
      options:
      - New Hire
      - Staffing Decision
      - Training Decision
      - Other (please specify)
      required: false
    - id: 6
      name: other_skills
      label: Other Skills
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
