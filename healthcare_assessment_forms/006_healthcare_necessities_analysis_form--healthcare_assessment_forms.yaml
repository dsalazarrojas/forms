inputSchema:
  type: object
  properties:
    title: Healthcare Necessities Analysis Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: health_context
      label: Health Context
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: access_challenges
      label: Access Challenges
      hint: null
      type: select_one
      options:
      - No challenges
      - Access to medication
      - Access to medical devices
      - Access to healthcare services
      - Other
      required: false
    - id: 4
      name: follow_up
      label: Follow Up
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Decline
      required: false
