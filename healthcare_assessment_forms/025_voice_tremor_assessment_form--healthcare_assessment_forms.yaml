inputSchema:
  type: object
  properties:
    title: Voice Tremor Assessment Form
    pages:
    - id: 1
      name: symptom_history
      label: Symptom History
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: severity_ratings
      label: Severity Ratings
      hint: null
      type: select_one
      options:
      - Mild
      - Moderate
      - Severe
      required: false
    - id: 3
      name: daily_impact
      label: Daily Impact
      hint: null
      type: select_one
      options:
      - Not at all
      - A lot
      - A moderate amount
      - A small amount
      required: false
    - id: 4
      name: voice_samples
      label: Voice Samples
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: voice_sample_uploads
      label: Voice Sample Uploads
      hint: null
      type: select_multiple
      options:
      - Upload 1
      - Other
      required: false
