      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: medical_procedure
      label: Medical Procedure
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: medical_results
      label: Medical Results
      hint: null
      type: text
      options: []
      required: false
    - id: 20
