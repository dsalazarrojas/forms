inputSchema:
  type: object
  properties:
    title: Vascular Health Assessment Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - High Blood Pressure
      - Fatigue
      - Chest Pain
      - Cough
      - Shortness of Breath
      - Nausea and Vomiting
      - Dizziness or Lightheadedness
      - Headache
      required: false
    - id: 3
      name: risk_factors
      label: Risk Factors
      hint: null
      type: select_one
      options:
      - Diabetes
      - High Cholesterol
      - Smoking or tobacco use
      - Family History of Heart Disease
      - High Blood Pressure
      - Obesity
      required: false
    - id: 4
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medication
      label: Medication
      hint: null
      type: select_multiple
      options:
      - Aspirin
      - Amlodipine
      - Atorvastatin
      - Warfarin
      required: false
    - id: 6
      name: test_results
      label: Test Results
      hint: null
      type: select_multiple
      options:
      - Normal
      - Abnormal
      - Inconclusive
      required: false
    - id: 7
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
