inputSchema:
  type: object
  properties:
    title: Cellular Energy Assessment
    pages:
    - id: 1
      name: patient_info_header
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: assessment_date
      label: Date of Assessment
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: energy_fatigue_header
      label: -- Energy and Fatigue --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: daily_energy_scale
      label: Energy Level Rating (1-10)
      hint: 10 is the highest and 1 is the lowest
      type: select_one
      options:
      - 10 - Excellent
      - '9'
      - '8'
      - '7'
      - '6'
      - 5 - Average
      - '4'
      - '3'
      - '2'
      - 1 - Poor
      required: true
    - id: 6
      name: energy_dip_times
      label: Energy Dips
      hint: What times of day do you typically feel a drop in energy
      type: select_multiple
      options:
      - Early Morning
      - Mid-Morning
      - After Lunch
      - Late Afternoon
      - Evening
      required: false
    - id: 7
      name: sleep_patterns_header
      label: -- Sleep Patterns --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: average_sleep_hours
      label: Average Hours of Sleep per Night
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: feel_rested_status
      label: Do you wake up feeling rested
      hint: Select the option that best describes you
      type: select_one
      options:
      - 'True'
      - 'False'
      - Sometimes
      required: true
    - id: 10
      name: activity_header
      label: -- Exercise and Activity --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: activity_frequency
      label: Frequency of Physical Activity
      hint: How often do you engage in exercise
      type: select_one
      options:
      - Daily
      - 3-5 times a week
      - 1-2 times a week
      - Rarely / Never
      required: true
    - id: 12
      name: symptom_checklist_header
      label: -- Symptom Checklist --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: recently_experienced_symptoms
      label: Symptoms Experienced Recently
      hint: Select all that apply
      type: select_multiple
      options:
      - Brain fog
      - Muscle weakness
      - Dizziness
      - Rapid heartbeat
      - Shortness of breath
      - Joint pain
      - Unexplained weight changes
      required: false
    - id: 14
      name: nutrition_hydration_header
      label: -- Nutrition and Hydration --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: daily_water_intake
      label: Glasses of Water Consumed per Day
      hint: Approximately 8 oz per glass
      type: number
      options: []
      required: true
    - id: 16
      name: dietary_habits
      label: Common Dietary Habits
      hint: Select the options that best match your diet
      type: select_multiple
      options:
      - High protein
      - Vegetarian / Vegan
      - High sugar / Processed foods
      - Intermittent fasting
      - Balanced / Mixed
      required: false
    - id: 17
      name: medical_history_header
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: chronic_conditions_meds
      label: Chronic Conditions or Medications
      hint: Please list anything relevant to your energy assessment
      type: text
      options: []
      required: false
    - id: 19
      name: assessment_summary_header
      label: -- Assessment Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: health_perception
      label: Overall Health Perception
      hint: How do you perceive your general health status
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
