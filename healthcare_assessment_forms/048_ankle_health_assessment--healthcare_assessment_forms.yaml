inputSchema:
  type: object
  properties:
    title: Ankle Health Assessment
    pages:
    - id: 1
      name: patient_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: affected_ankle
      label: Which Ankle Is Affected
      hint: null
      type: select_one
      options:
      - Left Ankle
      - Right Ankle
      - Both Ankles
      required: true
    - id: 7
      name: symptom_duration
      label: How Long Have You Had Symptoms
      hint: null
      type: select_one
      options:
      - Less than 1 Week
      - 1-2 Weeks
      - 2-4 Weeks
      - 1-3 Months
      - 3-6 Months
      - 6-12 Months
      - Over 1 Year
      required: true
    - id: 8
      name: pain_level_current
      label: Current Pain Level
      hint: 0-10 scale
      type: select_one
      options:
      - 0 - No Pain
      - 1-2 - Mild
      - 3-4 - Moderate
      - 5-6 - Uncomfortable
      - 7-8 - Painful
      - 9-10 - Severe
      required: true
    - id: 9
      name: pain_level_worst
      label: Worst Pain Level in Past Week
      hint: 0-10 scale
      type: select_one
      options:
      - 0 - No Pain
      - 1-2 - Mild
      - 3-4 - Moderate
      - 5-6 - Uncomfortable
      - 7-8 - Painful
      - 9-10 - Severe
      required: true
    - id: 10
      name: pain_location
      label: Where Is the Pain Located
      hint: Select all that apply
      type: select_multiple
      options:
      - Front of Ankle
      - Back of Ankle
      - Inner Side
      - Outer Side
      - Top of Foot
      - Bottom of Foot
      - Around Entire Ankle
      - Other
      required: true
    - id: 11
      name: pain_type
      label: What Type of Pain Do You Experience
      hint: Select all that apply
      type: select_multiple
      options:
      - Sharp
      - Dull
      - Aching
      - Burning
      - Throbbing
      - Stabbing
      - Numbness
      - Tingling
      - Other
      required: true
    - id: 12
      name: swelling_present
      label: Do You Have Swelling
      hint: null
      type: select_one
      options:
      - Yes - Constant
      - Yes - Intermittent
      - 'False'
      required: true
    - id: 13
      name: swelling_timing
      label: When Is Swelling Worst
      hint: null
      type: select_one
      options:
      - Morning
      - After Activity
      - End of Day
      - Constant
      - Not Applicable
      required: false
    - id: 14
      name: stiffness
      label: Do You Experience Stiffness
      hint: null
      type: select_one
      options:
      - Yes - Morning
      - Yes - After Rest
      - Yes - After Activity
      - 'False'
      required: true
    - id: 15
      name: instability
      label: Does Your Ankle Feel Unstable
      hint: Like it might give way
      type: select_one
      options:
      - Yes - Frequently
      - Yes - Occasionally
      - 'False'
      required: true
    - id: 16
      name: activity_impact
      label: How Do Symptoms Affect Daily Activities
      hint: null
      type: select_one
      options:
      - No Impact
      - Minor Impact
      - Moderate Impact
      - Significant Impact
      - Unable to Perform Activities
      required: true
    - id: 17
      name: walking_ability
      label: Walking Ability
      hint: null
      type: select_one
      options:
      - Normal - No Difficulty
      - Mild Difficulty
      - Moderate Difficulty
      - Severe Difficulty
      - Unable to Walk
      required: true
    - id: 18
      name: stairs_ability
      label: Stair Climbing Ability
      hint: null
      type: select_one
      options:
      - Normal - No Difficulty
      - Mild Difficulty
      - Moderate Difficulty
      - Severe Difficulty
      - Unable to Use Stairs
      required: true
    - id: 19
      name: exercise_limitation
      label: Exercise or Sports Limitations
      hint: null
      type: select_one
      options:
      - No Limitations
      - Minor Limitations
      - Moderate Limitations
      - Severe Limitations
      - Cannot Exercise
      required: true
    - id: 20
      name: aggravating_factors
      label: What Makes Symptoms Worse
      hint: Select all that apply
      type: select_multiple
      options:
      - Walking
      - Running
      - Standing
      - Sitting
      - Stairs
      - Uneven Surfaces
      - Sports Activity
      - Weather Changes
      - Rest
      - Other
      required: true
    - id: 21
      name: relieving_factors
      label: What Makes Symptoms Better
      hint: Select all that apply
      type: select_multiple
      options:
      - Rest
      - Ice
      - Heat
      - Elevation
      - Compression
      - Medication
      - Stretching
      - Supportive Footwear
      - Other
      required: true
    - id: 22
      name: previous_injuries
      label: Previous Ankle Injuries
      hint: null
      type: select_one
      options:
      - Yes - Same Ankle
      - Yes - Other Ankle
      - No Known Injuries
      required: true
    - id: 23
      name: injury_details
      label: Injury Details
      hint: Describe previous injuries
      type: text
      options: []
      required: false
    - id: 24
      name: previous_treatment
      label: Previous Treatments
      hint: Select all that apply
      type: select_multiple
      options:
      - Physical Therapy
      - Medication
      - Bracing or Taping
      - Cortisone Injection
      - Surgery
      - Home Remedies
      - None
      - Other
      required: false
    - id: 25
      name: current_medications
      label: Current Medications
      hint: List all medications
      type: text
      options: []
      required: false
    - id: 26
      name: medical_conditions
      label: Relevant Medical Conditions
      hint: Arthritis diabetes etc
      type: text
      options: []
      required: false
    - id: 27
      name: footwear_type
      label: Typical Footwear
      hint: null
      type: select_one
      options:
      - Athletic Shoes
      - Dress Shoes
      - Boots
      - Sandals
      - High Heels
      - Minimalist Shoes
      - Orthotic Inserts
      - Other
      required: false
    - id: 28
      name: activity_level
      label: General Activity Level
      hint: null
      type: select_one
      options:
      - Sedentary
      - Lightly Active
      - Moderately Active
      - Very Active
      - Athlete
      required: true
    - id: 29
      name: goals
      label: What Are Your Treatment Goals
      hint: Select all that apply
      type: select_multiple
      options:
      - Pain Relief
      - Return to Sports
      - Improved Mobility
      - Prevent Future Injuries
      - Return to Work
      - Daily Activity Improvement
      - Other
      required: true
    - id: 30
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
