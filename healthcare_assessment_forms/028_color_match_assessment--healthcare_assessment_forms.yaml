inputSchema:
  type: object
  properties:
    title: Color Match Assessment
    pages:
    - id: 1
      name: header
      label: -- Color Match Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: assessment_date
      label: Assessment date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 4
      name: skin_tone
      label: Skin tone description
      hint: Warm, cool, neutral
      type: select_one
      options:
      - Warm
      - Cool
      - Neutral
      required: true
    - id: 5
      name: hair_color
      label: Hair color
      hint: Natural or current color
      type: text
      options: []
      required: false
    - id: 6
      name: eye_color
      label: Eye color
      hint: Natural eye color
      type: text
      options: []
      required: false
    - id: 7
      name: recommended_palette
      label: Recommended color palette
      hint: List of suggested colors
      type: text
      options: []
      required: true
    - id: 8
      name: photos_attached
      label: Photos attached
      hint: Indicate if photos are provided
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: additional_recommendations
      label: Additional recommendations
      hint: Styling or product suggestions
      type: text
      options: []
      required: false
    - id: 10
      name: consent
      label: Consent to use images and data
      hint: Client consent for use of photos
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
