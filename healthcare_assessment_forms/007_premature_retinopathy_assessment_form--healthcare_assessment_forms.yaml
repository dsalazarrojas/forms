inputSchema:
  type: object
  properties:
    title: Premature Retinopathy Assessment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: guardian_name
      label: Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - No issue
      - Mild
      - Moderate
      - Severe
      required: true
    - id: 7
      name: treatment
      label: Treatment
      hint: null
      type: select_one
      options:
      - None
      - Medication
      - Surgery
      - Other
      - Unknown
      required: true
    - id: 8
      name: consent_given
      label: Consent Given
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Unknown
      required: true
    - id: 9
      name: consent_explained
      label: Consent Explained
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: retina_position
      label: Retina Position
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: retina_depth
      label: Retina Depth
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: assessment_result
      label: Assessment Result
      hint: null
      type: select_multiple
      options:
      - No issue
      - Possible issue
      - Issue
      required: true
