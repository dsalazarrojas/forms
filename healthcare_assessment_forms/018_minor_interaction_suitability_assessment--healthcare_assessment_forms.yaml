      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: location_interaction
      label: Location Interaction Occurred
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: risk_level
      label: Risk Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      - None
      required: false
    - id: 6
      name: safety_precautions
      label: Safety Precautions Taken
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: youth_response
      label: Youth Response
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: adult_response
      label: Adult Response
      hint: null
      type: note
      options: []
      required: false
