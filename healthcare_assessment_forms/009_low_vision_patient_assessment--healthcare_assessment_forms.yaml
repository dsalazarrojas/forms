inputSchema:
  type: object
  properties:
    title: Low Vision Patient Assessment
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 4
      name: medical_record_number
      label: Medical Record Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: vision_level
      label: Vision Level
      hint: null
      type: select_one
      options:
      - Blind
      - Moderately Blind
      - Mild Low Vision
      - Moderate Low Vision
      - Moderate to Severe Low Vision
      - Severe Low Vision
      required: false
    - id: 6
      name: visual_difficulty
      label: Visual Difficulty
      hint: null
      type: select_multiple
      options:
      - Blindness
      - Difficulty perceiving colors
      - Difficulty perceiving depth
      - Difficulty perceiving textures
      - Difficulty with distance vision
      - Difficulty with near vision
      - Difficulty with peripheral vision
      required: false
