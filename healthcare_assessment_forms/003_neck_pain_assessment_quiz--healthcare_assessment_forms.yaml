inputSchema:
  type: object
  properties:
    title: Neck Pain Assessment Quiz
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: neck_pain_symptoms
      label: Neck Pain Symptoms
      hint: null
      type: select_multiple
      options:
      - Mild
      - Moderate
      - Severe
      required: false
    - id: 3
      name: pain_duration
      label: Pain Duration
      hint: null
      type: select_one
      options:
      - Less than a day
      - 1-4 days
      - 5-7 days
      - More than 7 days
      required: false
    - id: 4
      name: pain_location
      label: Pain Location
      hint: null
