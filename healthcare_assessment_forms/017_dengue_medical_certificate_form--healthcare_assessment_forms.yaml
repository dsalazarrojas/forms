inputSchema:
  type: object
  properties:
    title: Dengue Medical Certificate Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_symptoms
      label: Date Of Symptoms
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: dengue_test_result
      label: Dengue Test Result
      hint: null
      type: select_one
      options:
      - '{''value'': ''Positive''}'
      - '{''value'': ''Negative''}'
      - '{''value'': ''Not Tested''}'
      required: false
    - id: 4
      name: fever_duration
      label: Fever Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: symptoms_description
      label: Symptoms Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: treatment_description
      label: Treatment Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: medical_certificate_type
      label: Medical Certificate Type
      hint: null
      type: select_one
      options:
      - '{''value'': ''Sick Leave''}'
      - '{''value'': ''School Absence''}'
      - '{''value'': ''Insurance''}'
      required: false
    - id: 8
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
