      hint: Your complete legal name
      type: text
      options: []
      required: true
    - id: 3
      name: plasma_date_of_birth
      Label: Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: plasma_donor_email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 5
      name: plasma_donor_phone
      Label: Phone Number
      hint: Your contact phone number
      type: phone
      options: []
      required: true
    - id: 6
      name: plasma_donor_address
      label: Street Address
      hint: Your street address
      type: text
      options: []
      required: true
    - id: 7
