inputSchema:
  type: object
  properties:
    title: Client Clinical Notes Form
    pages:
    - id: 1
      name: clinical_note_header
      label: -- Clinical Encounter Note --
      hint: Secure documentation for telehealth and in-person sessions.
      type: note
      options: []
      required: false
    - id: 2
      name: practitioner_name
      label: Practitioner/Clinician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_full_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: client_dob
      label: Client Date of Birth
      hint: For identity verification
      type: date
      options: []
      required: true
    - id: 5
      name: session_details_header
      label: -- Session Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date_of_session
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: duration_minutes
      label: Duration (Minutes)
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: session_modality
      label: Session Modality
      hint: null
      type: select_one
      options:
      - Telehealth (Video)
      - In-Person
      - Phone Call
      required: true
    - id: 10
      name: clinical_observations_header
      label: -- Observations and Assessment --
      hint: Use SOAP format where applicable
      type: note
      options: []
      required: false
    - id: 11
      name: subjective_notes
      label: Subjective (S) - Client's reports and presentation
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: objective_notes
      label: Objective (O) - Observations and Measurable data
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: assessment_notes
      label: Assessment (A) - Professional impressions and diagnosis
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: plan_notes
      label: Plan (P) - Treatment plan and next steps
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: risk_assessment
      label: Risk Assessment (Harm to Self or Others)
      hint: null
      type: select_one
      options:
      - No Risk Identified
      - Low Risk
      - Moderate Risk
      - High Risk / Immediate Action Taken
      required: true
    - id: 16
      name: billing_codes
      label: ICD-10 or CPT Billing Codes
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: digital_signature_clinician
      label: Clinician Digital Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: electronic_timestamp
      label: Time of Signature
      hint: null
      type: time
      options: []
      required: true
    - id: 19
      name: privacy_compliance_header
      label: -- Privacy Compliance --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: hipaa_compliant_storage_ack
      label: I confirm this note is saved in a HIPAA-compliant secure system
      hint: null
      type: select_one
      options:
      - I confirm
      - Other
      required: true
    - id: 21
      name: note_footer
      label: -- Clinical record locked --
      hint: null
      type: note
      options: []
      required: false
