inputSchema:
  type: object
  properties:
    title: Nutrition Consultation Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: nutrition_needs
      label: Nutrition Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_one
      options:
      - Hypertension
      - Diabetes
      - Other
      required: false
    - id: 4
      name: medication
      label: Medication
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: nutrition_goals
      label: Nutrition Goals
      hint: null
      type: select_multiple
      options:
      - Weight Loss
      - Weight Gain
      - Muscle Gain
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
