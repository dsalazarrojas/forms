inputSchema:
  type: object
  properties:
    title: Outpatient Telehealth Consent Form
    pages:
    - id: 1
      name: consent_to_telehealth_services
      label: Consent to telehealth services
      hint: null
      type: select_one
      options:
      - Telehealth services
      - In-person services
      required: false
    - id: 2
      name: patient_name
      label: Patient name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_consent
      label: Date of consent
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: practitioner_name
      label: Practitioner name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: consent_given
      label: Consent given
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: patient_address
      label: Patient address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_number
      label: Contact number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency contact
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: medical_history
      label: Medical history
      hint: null
      type: text
      options: []
      required: false
