inputSchema:
  type: object
  properties:
    title: Coronavirus Screening Form
    pages:
    - id: 1
      name: screen_1
      label: screen_1
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: question_1
      label: Have you traveled outside the country
      hint: null
      type: select_multiple
      options:
      - 'No'
      - 'Yes'
      required: false
    - id: 3
      name: symptom_1
      label: Fever
      hint: null
      type: select_one
      options:
      - 'No'
      - High
      - Low
      required: false
    - id: 4
      name: symptom_2
      label: Cough
      hint: null
      type: select_one
      options:
      - 'No'
      - High
      - Low
      required: false
    - id: 5
      name: question_2
      label: Do you have a history of respiratory disease
      hint: null
      type: select_multiple
      options:
      - 'No'
      - 'Yes'
      required: false
    - id: 6
      name: symptom_3
      label: Shortness of breath
      hint: null
      type: select_one
      options:
      - 'No'
      - High
      - Low
      required: false
    - id: 7
      name: question_3
      label: How long have you had the symptoms
      hint: null
      type: select_multiple
      options:
      - Less than 2 days
      - 3-4 days
      - 5-7 days
      required: false
    - id: 8
      name: note_1
      label: Note
      hint: null
      type: note
      options: []
      required: false
