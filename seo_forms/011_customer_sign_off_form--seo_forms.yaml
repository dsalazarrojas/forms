inputSchema:
  type: object
  properties:
    title: Customer Sign Off Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_info
      label: Service Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: customer_signed
      label: Customer Signed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: service_provider_signed
      label: Service Provider Signed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
