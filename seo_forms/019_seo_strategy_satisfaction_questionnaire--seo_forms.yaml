inputSchema:
  type: object
  properties:
    title: SEO Strategy Satisfaction Questionnaire
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: agency
      label: Agency
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 4
      name: performance
      label: Performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Poor
      required: false
    - id: 5
      name: service_quality
      label: Service Quality
      hint: null
      type: select_multiple
      options:
      - On time
      - On budget
      - Communication
      - Support
      - Professionalism
      required: false
    - id: 6
      name: time_management
      label: Time Management
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: follow_up
      label: Follow up after submission
      hint: This will help us to follow up on your issue
      type: note
      options: []
      required: false
    - id: 8
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
