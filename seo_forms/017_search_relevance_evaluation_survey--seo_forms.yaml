inputSchema:
  type: object
  properties:
    title: Search Relevance Evaluation Survey
    pages:
    - id: 1
      name: search_relevance
      label: Search Relevance
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: search_satisfaction
      label: Search Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 3
      name: result_clarity
      label: Result Clarity
      hint: null
      type: select_multiple
      options:
      - Clear
      - Somewhat Clear
      - Somewhat Unclear
      - Unclear
      required: false
    - id: 4
      name: search_results
      label: Search Results
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: search_time
      label: Search Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: search_quality
      label: Search Quality
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
