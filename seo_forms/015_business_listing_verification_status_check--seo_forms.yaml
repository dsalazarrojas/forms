inputSchema:
  type: object
  properties:
    title: Business Listing Verification Status Check
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Exact business name as registered
      type: text
      options: []
      required: true
    - id: 2
      name: business_address
      label: Business Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 3
      name: business_city
      label: City
      hint: City location
      type: text
      options: []
      required: true
    - id: 4
      name: business_state
      label: State or Province
      hint: State or province
      type: text
      options: []
      required: true
    - id: 5
      name: business_zip
      label: ZIP or Postal Code
      hint: ZIP or postal code
      type: text
      options: []
      required: true
    - id: 6
      name: business_phone
      label: Business Phone Number
      hint: Primary phone number
      type: text
      options: []
      required: true
    - id: 7
      name: business_website
      label: Business Website
      hint: Full website URL
      type: text
      options: []
      required: false
    - id: 8
      name: contact_name
      label: Contact Name
      hint: Person requesting verification
      type: text
      options: []
      required: true
    - id: 9
      name: contact_email
      label: Contact Email
      hint: Email for verification results
      type: email
      options: []
      required: true
    - id: 10
      name: contact_role
      label: Contact Role
      hint: Your role in the business
      type: select_one
      options:
      - Business owner
      - Marketing manager
      - SEO specialist
      - External agency
      - Authorized representative
      - Other
      required: true
    - id: 11
      name: directories_to_check
      label: Directories to Verify
      hint: Select all directories to check
      type: select_multiple
      options:
      - Google Business Profile
      - Bing Places
      - Apple Maps
      - Yelp
      - Facebook
      - Yellow Pages
      - Industry-specific directories
      - All major directories
      required: true
    - id: 12
      name: verification_status_known
      label: Current Verification Knowledge
      hint: Do you know your current verification status
      type: select_one
      options:
      - Verified on all platforms
      - Verified on some platforms
      - Not verified anywhere
      - Not sure
      required: true
    - id: 13
      name: issues_experienced
      label: Issues Experienced
      hint: Select any issues you have encountered
      type: select_multiple
      options:
      - Listing suspended
      - Information incorrect
      - Unable to claim listing
      - Verification postcard not received
      - Duplicate listings
      - Fake or spam listings
      - No issues
      required: true
    - id: 14
      name: priority_level
      label: Priority Level
      hint: How urgent is this verification check
      type: select_one
      options:
      - Critical - listing down
      - High - major issues
      - Medium - routine check
      - Low - informational
      required: true
    - id: 15
      name: business_category
      label: Business Category
      hint: Primary business category
      type: select_one
      options:
      - Retail
      - Restaurant
      - Professional services
      - Healthcare
      - Home services
      - Automotive
      - Entertainment
      - Other
      required: true
    - id: 16
      name: number_of_locations
      label: Number of Business Locations
      hint: Total locations needing verification
      type: number
      options: []
      required: true
    - id: 17
      name: multi_location_management
      label: Multi-Location Management
      hint: Do you need multi-location management
      type: select_one
      options:
      - Yes - need bulk management
      - Yes - need guidance
      - No - single location only
      required: true
    - id: 18
      name: previous_verification_attempts
      label: Previous Verification Attempts
      hint: Have you attempted verification before
      type: select_one
      options:
      - Yes - successful
      - Yes - failed
      - Yes - pending
      - No - first attempt
      required: true
    - id: 19
      name: documentation_available
      label: Documentation Available
      hint: Select all documents available for verification
      type: select_multiple
      options:
      - Business license
      - Tax documents
      - Utility bills
      - Bank statements
      - Photo ID
      - Business registration
      - None
      required: true
    - id: 20
      name: additional_services
      label: Additional Services Needed
      hint: Select any additional services
      type: select_multiple
      options:
      - Listing optimization
      - Review management
      - Citation building
      - Ongoing monitoring
      - None
      required: false
    - id: 21
      name: additional_notes
      label: Additional Notes
      hint: Any other information to share
      type: text
      options: []
      required: false
