inputSchema:
  type: object
  properties:
    title: Patient Safety Assessment Survey
    pages:
    - id: 1
      name: patient_safety_risks
      label: What are the perceived safety risks to the patient?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_safety_suggestions
      label: How would you suggest patient safety protocols?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: patient_safety_response
      label: How safe do you feel when receiving care from our healthcare team?
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: patient_safety_team_interactions
      label: How safe do you feel when interacting with our healthcare team?
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Rarely
      required: false
    - id: 5
      name: safety_incidents
      label: Have you experienced any safety incidents or near misses?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 6
      name: patient_safety_training
      label: Do you feel we provide adequate training on patient safety?
      hint: null
      type: select_one
      options:
      - Agree
      - Disagree
      - Neutral
      required: false
    - id: 7
      name: safety_issues
      label: Have you noticed any safety-related issues or concerns?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: patient_safety_perception
      label: What is your overall perception of patient safety in our healthcare setting?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: patient_safety_suggestions_improve
      label: What is your experience with reporting safety incidents in our healthcare
        setting?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: patient_safety_protocol_implement
      label: What safety protocols do you suggest we implement to prevent future incidents?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: patient_safety_response_time
      label: Patient Safety Response Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: patient_safety_suggestions_improvement
      label: Do you have any safety-related suggestions for improvement?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: patient_safety_reporting
      label: Patient Safety Reporting
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: patient_safety_response_protocol
      label: How do you feel about our response to patient safety concerns?
      hint: null
      type: select_multiple
      options:
      - Always
      - Mostly
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 15
      name: patient_safety_suggestions_improve_incident
      label: What safety-related incidents have you noticed?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: patient_safety_suggestions_improvement_incident
      label: Patient Safety Suggestions Improvement Incident
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: patient_safety_response_time_protocol
      label: Patient Safety Response Time Protocol
      hint: null
      type: date
      options: []
      required: false
    - id: 18
      name: patient_safety_response_concerns
      label: What is your feedback on our response to patient safety concerns?
      hint: null
      type: text
      options: []
      required: false
