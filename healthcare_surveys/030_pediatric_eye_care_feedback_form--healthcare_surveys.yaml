inputSchema:
  type: object
  properties:
    title: Pediatric Eye Care Feedback Form
    pages:
    - id: 1
      name: patient_name
      label: Parent/guardian name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_date
      label: Feedback Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: eye_clinic_visit
      label: Visit to the eye clinic
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - Very dissatisfied
      - Somewhat dissatisfied
      - Neutral
      - Somewhat satisfied
      - Very satisfied
      required: false
    - id: 5
      name: feedback_comment
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submitted_by
      label: Submitted by
      hint: null
      type: select_one
      options:
      - Parent
      - Guardian
      required: false
    - id: 10
      name: age_group
      label: Age group
      hint: null
      type: select_multiple
      options:
      - 0-1
      - 2-4
      - 5-10
      - 11-16
      - 17-24
      - 25+
      required: false
