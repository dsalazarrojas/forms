inputSchema:
  type: object
  properties:
    title: Dietary Habits And Frequency Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: question_1
      label: How often do you eat breakfast?
      hint: null
      type: select_one
      options:
      - Every day
      - Some days
      - Rarely
      - Never
      required: true
    - id: 6
      name: question_2
      label: What time do you usually eat dinner?
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: question_3
      label: Do you eat any of the following foods?
      hint: null
      type: select_multiple
      options:
      - Fresh fruit
      - Leafy greens
      - Nuts
      - Seeds
      required: true
    - id: 8
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
