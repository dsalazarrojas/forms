      label: How often do you eat breakfast?
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Every day'', ''value'': ''every day''}'
      - '{''id'': 2, ''label'': ''Some days'', ''value'': ''some days''}'
      - '{''id'': 3, ''label'': ''Rarely'', ''value'': ''rarely''}'
      - '{''id'': 4, ''label'': ''Never'', ''value'': ''never''}'
      required: true
    - id: 6
