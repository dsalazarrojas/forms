inputSchema:
  type: object
  properties:
    title: Hospital Emergency System Effectiveness Evaluation
    pages:
    - id: 1
      name: emergency_care
      label: Emergency Care
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: visit_date
      label: Visit Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: visit_time
      label: Visit Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: staff_attendance
      label: Staff Attendance
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: staff_attitude
      label: Staff Attitude
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: facilities_and_equipment
      label: Facilities and Equipment
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
