inputSchema:
  type: object
  properties:
    title: Primary Care Speaker Presentation Survey
    pages:
    - id: 1
      name: speaker_experience
      label: Overall Experience with Speaker
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: speaker_comments
      label: Additional Comments about Speaker
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: speaker_additional_comments
      label: Other Feedback about Speaker
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: topic_rating
      label: How would you rate this topic?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: topic_comments
      label: Additional Comments about Topic
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: session_experience
      label: Overall Experience with Session
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: session_comments
      label: Additional Comments about Session
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: overall_rating
      label: Overall Experience with Presentation
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: other_feedback
      label: Other Feedback about Presentation
      hint: null
      type: text
      options: []
      required: false
