inputSchema:
  type: object
  properties:
    title: Provider Network Onboarding Survey
    pages:
    - id: 1
      name: survey_title
      label: Survey Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: organization_type
      label: Organization Type
      hint: null
      type: select_multiple
      options:
      - HOSPITAL
      - CLINIC
      - MEDICAL GROUP
      - OTHER
      required: false
    - id: 4
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: onboarding_date
      label: Onboarding Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: survey_response
      label: Survey Response
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: onboarding_feedback
      label: Onboarding Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: onboarding_readiness
      label: Onboarding Readiness
      hint: null
      type: select_one
      options:
      - NOT READY
      - READY
      required: true
    - id: 11
      name: follow_up_questions
      label: Follow Up Questions
      hint: null
      type: note
      options: []
      required: true
