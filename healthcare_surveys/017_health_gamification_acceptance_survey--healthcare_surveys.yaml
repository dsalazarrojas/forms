inputSchema:
  type: object
  properties:
    title: Health Gamification Acceptance Survey
    pages:
    - id: 1
      name: form_1
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: form_2
      label: How much do you currently use health related gamification in your daily
        activities?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: form_3
      label: Which health gamification activities do you use currently?
      hint: null
      type: select_multiple
      options:
      - I use health gamification activities
      - I don't use health gamification activities
      - Not sure
      required: false
    - id: 4
      name: form_4
      label: How often do you use health gamification activities in your daily life?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: form_5
      label: Would you like to see more health gamification activities offered by
        your health care provider?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Somewhat
      - Not sure
      - 'No'
      required: false
    - id: 6
      name: form_6
      label: What motivates you about health gamification?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: form_7
      label: Would you like to participate in future studies about health gamification?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Somewhat
      - Not sure
      - 'No'
      required: false
    - id: 8
      name: form_8
      label: How do you feel about using your electronic health records in health
        gamification?
      hint: null
      type: select_one
      options:
      - I like it
      - I don't like it
      - Not sure
      required: false
    - id: 9
      name: form_9
      label: How important is it that health gamification is fun?
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not very important
      - Not at all
      required: false
    - id: 10
      name: form_10
      label: Would you like to be able to share your progress in health gamification
        with friends?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Somewhat
      - Not sure
      - 'No'
      required: false
