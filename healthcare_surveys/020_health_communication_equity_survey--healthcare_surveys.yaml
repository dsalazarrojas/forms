inputSchema:
  type: object
  properties:
    title: Health Prophets Equity Survey
    pages:
    - id: 1
      name: demographic_info
      label: Community Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: demographic_info_2
      label: Age
      hint: How old are you?
      type: number
      options: []
      required: true
    - id: 3
      name: health_info
      label: Health Information
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: communication_channels
      label: Preferred Communication Channels
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Social Media
      - Print Newspaper
      - Television
      - Radio
      - None
      required: true
    - id: 5
      name: contact_info
      label: How often do you get in touch with health information?
      hint: null
      type: select_multiple
      options:
      - Daily
      - 2-3 times a week
      - 1 time a week
      - 2 times a week
      - 1 time a month
      - Less than 1 time a month
      - Never
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 7
      name: race_ethnicity
      label: race/ethnicity
      hint: null
      type: select_multiple
      options:
      - American Indian/Alaska Native
      - Asian
      - Native Hawaiian/Pacific Islander
      - White
      - Black or African American
      - Some other race/ethnicity
      - Prefer not to report
      required: true
    - id: 8
      name: preferred_language
      label: What is your preferred language?
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      required: true
