inputSchema:
  type: object
  properties:
    title: MRI Safety Compliance Survey
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 3
      name: medications
      label: Medications
      hint: null
      type: select_multiple
      options:
      - Aspirin
      - Insulin
      - Other
      required: true
    - id: 4
      name: medical_devices
      label: Medical Devices
      hint: null
      type: select_multiple
      options:
      - Pacemaker
      - Implantable Cardioverter-Defibrillator (ICD)
      - Cochlear Implant
      required: true
    - id: 5
      name: mri_safety
      label: MRI Safety Risks
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: claughts
      label: Claustrophobia
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: scheduling_risks
      label: Scheduling Risks
      hint: null
      type: select_one
      options:
      - '10'
      - '15'
      - '30'
      required: true
    - id: 8
      name: safety_acknowledgements
      label: Safety Acknowledgements
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 9
      name: safety_risks_acknowledged
      label: Safety Risks Acknowledged
      hint: null
      type: select_one
      options:
      - '0'
      - '1'
      required: true
