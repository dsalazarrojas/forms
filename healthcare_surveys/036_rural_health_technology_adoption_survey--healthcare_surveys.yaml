inputSchema:
  type: object
  properties:
    title: Rural Health Technology Adoption Survey
    pages:
    - id: 1
      name: form_page_1
      label: Health Technologies Used
      hint: null
      type: select_multiple
      options:
      - Telehealth
      - Health Information Exchange (HIE)
      - Mobile Health Applications
      - Health Information Systems (HIS)
      - Telephony (e.g., phone, text, video calls)
      - Patient Portal
      - Electronic Health Records (EHRs)
      - Health and Wellness Apps (e.g., fitness, nutrition)
      required: true
    - id: 2
      name: form_page_2
      label: Frequency of Use
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: form_page_3
      label: Access to Digital Technologies
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: form_page_4
      label: Barriers to Use
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_page_5
      label: Impact on Healthcare Outcomes
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 6
      name: form_page_6
      label: Open-ended Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: form_page_7
      label: Other Technologies Used
      hint: null
      type: select_multiple
      options:
      - Telephony (e.g., phone, text, video calls)
      - Health and Wellness Apps (e.g., fitness, nutrition)
      required: false
