      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: insurance_type
      label: Insurance Type
      hint: null
      type: select_one
      options:
      - Private
      - Medicare
      - Medicaid
      - Tricare
      required: false
    - id: 5
      name: treatment_interests
      label: Treatment Interests
      hint: null
      type: select_multiple
      options:
      - In Vitro Fertilization (IVF)
      - Intrauterine Insemination (IUI)
      - Intrauterine Insemination (IUI) with ICSI
      required: false
    - id: 6
      name: treatment_cost
      label: What type of treatment are you interested in?
      hint: null
      type: select_multiple
      options:
      - IVF
      - IUI
      - ICSI
      - Other
      required: false
    - id: 7
      name: insurance_coverage
      label: How many IVF cycles are covered by your insurance coverage?
      hint: null
      type: select_one
      options:
      - Full Coverage
      - Partial Coverage
      - No Coverage
      required: false
    - id: 8
      name: treatment_options
      label: Which treatment options are you interested in for each cycle of IVF?
      hint: null
      type: select_multiple
      options:
      - Frozen Embryo Transfer (FET)
      - Intracytoplasmic Sperm Injection (ICSI)
      - Donor Egg
      - Surrogacy
      required: false
