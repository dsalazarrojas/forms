inputSchema:
  type: object
  properties:
    title: IVF Cost Assessment Survey
    pages:
    - id: 1
      name: intro_page
      label: Intro Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: demographics_info
      label: Demographics Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: insurance_info
