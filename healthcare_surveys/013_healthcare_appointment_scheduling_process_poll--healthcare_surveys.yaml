inputSchema:
  type: object
  properties:
    title: Healthcare Appointment Scheduling Process Poll
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: appointment_type
      label: appointment_type
      hint: null
      type: select_one
      options:
      - Appointment
      - Walk-in
      - No-show
      required: false
    - id: 3
      name: scheduling_method
      label: Scheduling Method
      hint: null
      type: select_multiple
      options:
      - Online Scheduling
      - Call Center
      - Walk-in
      - Email
      - Other (please specify)
      required: false
    - id: 4
      name: preferred_scheduling_time
      label: Preferred Scheduling Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: preferred_scheduling_day
      label: Preferred Scheduling Day
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 6
      name: scheduling_wait_time
      label: Scheduling Wait Time
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neither Satisfied
      required: false
