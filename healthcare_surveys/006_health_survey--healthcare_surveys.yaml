inputSchema:
  type: object
  properties:
    title: health-survey
    pages:
    - id: 1
      name: patient_info
      label: Patient Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: symptoms
      label: Symptoms
      hint: null
      type: select_multiple
      options:
      - Idiopathic
      - Infectious
      - Allergic
      - Autoimmune
      required: true
    - id: 3
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: test_result
      label: Test Result
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Inconclusive
      required: false
    - id: 5
      name: medication
      label: Medication
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - Penicillin
      - Erythromycin
      - Ciprofloxacin
      required: false
