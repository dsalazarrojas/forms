    - id: 9
      name: termination
      label: how would you like to terminate our sessions?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 10
      name: submission
      label: How will you like to submit your responses?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 11
      name: contact
      label: How would you like to be contacted?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 12
