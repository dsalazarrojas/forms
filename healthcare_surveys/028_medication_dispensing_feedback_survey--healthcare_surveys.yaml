inputSchema:
  type: object
  properties:
    title: medication_dispensing_feedback_survey
    pages:
    - id: 1
      name: intro
      label: welcome_to_the_survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_info
      label: contact_details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: visit_type
      label: how_did_you_visit_us
      hint: null
      type: select_one
      options:
      - Doctor
      - Pharmacy
      - Both
      required: false
    - id: 4
      name: medication_info
      label: medication_details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: dispensing_process
      label: how_was_medication_dispensed
      hint: null
      type: select_multiple
      options:
      - On Time
      - Before Expected
      - After Expected
      required: false
    - id: 6
      name: communication
      label: how_were_you_communicated_to
      hint: null
      type: select_one
      options:
      - Very Clear
      - Somewhat Clear
      - Not Clear At All
      required: false
    - id: 7
      name: concerns
      label: do_you_have_any_concerns
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: comments
      label: any_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: rating
      label: how_would_you_rate_your_visit
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: overall_experience
      label: overall_experience
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: false
    - id: 11
      name: submit
      label: submit_your_feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: follow_up
      label: follow_up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
