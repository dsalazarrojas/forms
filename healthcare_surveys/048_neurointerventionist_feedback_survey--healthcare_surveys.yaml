inputSchema:
  type: object
  properties:
    title: neurointerventionist_feedback_survey
    pages:
    - id: 1
      name: current_experience
      label: Can you describe your current experience with this neurointerventionist?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: rating_neurointerventionist
      label: How would you rate the communication skills of the neurointerventionist?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: concerns_addressed
      label: Were your questions and concerns addressed during the session?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: satisfaction
      label: How satisfied are you with the overall session?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: additional_comments
      label: Do you have any additional comments or suggestions for the neurointerventionist?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: recommendation
      label: Would you recommend this neurointerventionist to a friend or family member?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: true
