inputSchema:
  type: object
  properties:
    title: Community Health Data Program Evaluation
    pages:
      - id: 1
        name: respondent_name
        label: Name (Optional)
        hint: Your name if you wish to share
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: For follow-up
        type: email
        options: []
        required: false
      - id: 3
        name: organization
        label: Organization
        hint: Your organization
        type: text
        options: []
        required: false
      - id: 4
        name: role
        label: Your Role
        hint: Position or title
        type: text
        options: []
        required: false
      - id: 5
        name: program_participation
        label: Program Participation
        hint: How were you involved?
        type: select_one
        options:
          - Program Participant
          - Healthcare Provider
          - Program Staff
          - Community Partner
          - Family Member
          - Other
        required: true
      - id: 6
        name: participation_duration
        label: Duration of Participation
        hint: How long were you involved?
        type: select_one
        options:
          - Less than 3 months
          - 3-6 months
          - 6-12 months
          - 1-2 years
          - More than 2 years
        required: true
      - id: 7
        name: program_satisfaction
        label: Overall Program Satisfaction
        hint: Rate your satisfaction
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 8
        name: data_collection_quality
        label: Data Collection Quality
        hint: Rate the data processes
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: program_accessibility
        label: Program Accessibility
        hint: How accessible was the program?
        type: select_one
        options:
          - Very Accessible
          - Accessible
          - Somewhat Accessible
          - Not Accessible
        required: true
      - id: 10
        name: staff_helpfulness
        label: Staff Helpfulness
        hint: Rate the staff support
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 11
        name: communication_quality
        label: Communication Quality
        hint: Rate program communications
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 12
        name: health_outcomes
        label: Health Outcomes Improvement
        hint: Did health improve?
        type: select_one
        options:
          - Significant Improvement
          - Some Improvement
          - No Change
          - Decline
        required: true
      - id: 13
        name: specific_outcomes
        label: Specific Outcomes Achieved
        hint: What improvements did you see?
        type: text
        options: []
        required: false
      - id: 14
        name: program_strengths
        label: Program Strengths
        hint: What worked well?
        type: text
        options: []
        required: false
      - id: 15
        name: program_challenges
        label: Program Challenges
        hint: What difficulties did you encounter?
        type: text
        options: []
        required: false
      - id: 16
        name: barriers_to_participation
        label: Barriers to Participation
        hint: What prevented fuller participation?
        type: select_multiple
        options:
          - Transportation
          - Time Constraints
          - Childcare
          - Language Barriers
          - Health Issues
          - Lack of Information
          - None
        required: false
      - id: 17
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: Your ideas for better program
        type: text
        options: []
        required: false
      - id: 18
        name: would_participate_again
        label: Would You Participate Again
        hint: Future participation interest
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Maybe
          - Probably No
          - Definitely No
        required: true
      - id: 19
        name: would_recommend
        label: Would You Recommend to Others
        hint: Likelihood to recommend
        type: select_one
        options:
          - Very Likely
          - Likely
          - Neutral
          - Unlikely
          - Very Unlikely
        required: true
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
