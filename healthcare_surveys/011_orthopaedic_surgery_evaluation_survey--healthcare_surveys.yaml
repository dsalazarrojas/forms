inputSchema:
  type: object
  properties:
    title: Orthopaedic Surgery Evaluation Survey
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: surgical_details
      label: Surgical Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: post_operative_experience
      label: Post-Operative Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 5
      name: pain_control
      label: Pain Control
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: communication
      label: Communication
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: staff_friendly
      label: Staff Friendly
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: facilities
      label: Facilities
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: clinic_staff
      label: Clinic Staff
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: would_recommend
      label: Would Recommend
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
