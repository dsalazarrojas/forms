inputSchema:
  type: object
  properties:
    title: Local Anesthesia Feedback Survey
    pages:
    - id: 1
      name: procedure_description
      label: Describe the procedure you had
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: comfort_level
      label: How would you rate your comfort level with the anesthesia administered?
      hint: null
      type: select_one
      options:
      - Very Comfortable
      - Somewhat comfortable
      - Neutral
      - Somewhat uncomfortable
      - Very uncomfortable
      required: false
    - id: 3
      name: side_effects
      label: Have you experienced any of the following side effects?
      hint: null
      type: select_multiple
      options:
      - Nausea or vomiting
      - Dizziness or lightheadedness
      - Headache
      - Muscle weakness
      - Tingling or numbness
      - Other
      required: false
    - id: 4
      name: overall_experience
      label: What was your overall experience like?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: additional_comments
      label: Is there anything else you would like to share with us?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: procedure_outcome
      label: How would you rate the outcome of the procedure?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: provider_care
      label: How would you rate the care you received from the provider?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: clinic_service
      label: How would you rate the service from the clinic?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: will_recommend
      label: Would you recommend our clinic to a friend or family member?
      hint: null
      type: select_one
      options:
      - Definitely
      - Probably
      - Not likely
      - 'False'
      required: false
