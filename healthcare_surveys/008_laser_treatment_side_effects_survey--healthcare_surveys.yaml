      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: question_9
      label: Do you experience these symptoms at a specific time of year?
      hint: Check a box
      type: select_one
      options:
      - Only during treatment
      - Only outside of treatment
      - All year round
      required: false
    - id: 11
      name: question_10
      label: How long do you experience these symptoms?
      hint: null
      type: select_one
      options:
      - 1-7 days
      - 8-14 days
      - 15-30 days
      - More than 30 days
      required: false
    - id: 12
      name: question_11
      label: Have you had other treatments?
      hint: Check all that apply
      type: select_multiple
      options:
      - None
      - Chemical peeling
      - Microdermabrasion
      - Micro-needling
