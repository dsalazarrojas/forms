inputSchema:
  type: object
  properties:
    title: Laser Treatment Side Effects Survey
    pages:
    - id: 1
      name: page_1
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: How many laser treatments have you had?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: question_2
      label: Which of the following treatments have you had?
      hint: null
      type: select_one
      options:
      - Laser
      - Chemical peeling
      - Microdermabrasion
      - Micro-needling
      required: false
    - id: 4
      name: question_3
      label: How many of these treatments have you had?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: question_4
      label: Which of the following symptoms are you experiencing?
      hint: null
      type: select_multiple
      options:
      - Redness
      - Blisters
      - Itching
      - Burning
      - Swelling
      required: false
    - id: 6
      name: question_5
      label: How often do you feel these symptoms?
      hint: Choose one of the following
      type: select_one
      options:
      - Rarely
      - Sometimes
      - Often
      - Usually
      required: false
    - id: 7
      name: question_6
      label: How severe are these symptoms?
      hint: null
      type: select_one
      options:
      - 1 - Very mild
      - 2 - Mild
      - 3 - Moderate
      - 4 - Severe
      - 5 - Very severe
      required: false
    - id: 8
      name: question_7
      label: How long have you had these symptoms?
      hint: null
      type: date
      options: []
      required: false
