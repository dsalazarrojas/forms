inputSchema:
  type: object
  properties:
    title: Healthcare Course Evaluation Survey
    pages:
    - id: 1
      name: participant_info
      label: 1. What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: course_title
      label: 2. What is the name of the course you participated in?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: course_satisfaction
      label: 3. How would you rate your satisfaction with the course? (1-5)
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: course_materials
      label: 4. How relevant was the course material? (High, Medium, Low)
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 5
      name: instructor_performance
      label: 5. How would you rate the instructor's performance? (Excellent, Good,
        Fair, Poor)
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: overall_experience
      label: 6. What were your overall experience with the course?
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: feedback
      label: 7. Do you have any feedback or suggestions for improvement?
      hint: null
      type: note
      options: []
      required: false
