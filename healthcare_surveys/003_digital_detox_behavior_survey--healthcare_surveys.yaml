inputSchema:
  type: object
  properties:
    title: Digital Detox Behavior Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Welcome to the Digital Detox Behavior Survey.
      type: text
      options: []
      required: false
    - id: 2
      name: screen_time_habits
      label: How many hours do you spend on screens each day?
      hint: Please provide the exact number of hours spent on screens.
      type: number
      options: []
      required: true
    - id: 3
      name: digital_device_ownership
      label: Do you own a smartphone?
      hint: Do you own a smartphone?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: digital_device_ownership_answer
      label: How many other digital devices do you own?
      hint: Please specify the number of devices you own.
      type: text
      options: []
      required: true
    - id: 5
      name: digital_device_usage
      label: How often do you use your digital devices?
      hint: Please select your usage frequency.
      type: select_multiple
      options:
      - Daily
      - Occasionally
      - Rarely
      required: true
    - id: 6
      name: digital_device_impact_on_routine
      label: Do you feel anxious without a digital device?
      hint: Do you feel anxious without a digital device?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: digital_device_restrictions_effectiveness
      label: Do you feel more focused without digital devices?
      hint: Do you feel more focused without digital devices?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: digital_device_social_usage
      label: Do you use your digital devices during social gatherings?
      hint: Do you use devices during social gatherings?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Occasionally
      required: false
    - id: 9
      name: digital_device_entertainment_usage
      label: Do you use your digital devices for entertainment?
      hint: Do you use devices for entertainment?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: digital_device_owning_multiple_devices
      label: Do you own multiple digital devices?
      hint: Do you own multiple devices?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: digital_device_usage_work_school
      label: Do you use digital devices for work or school?
      hint: Do you use devices for work or school?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Occasionally
      required: false
    - id: 12
      name: digital_device_usage_social_media
      label: Do you use social media often?
      hint: Do you use social media often?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: digital_device_usage_news_information
      label: Do you follow news sources online?
      hint: Do you follow news sources online?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Occasionally
      required: false
    - id: 14
      name: digital_device_usage_learning
      label: Do you use devices for learning?
      hint: Do you use devices for learning?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 15
      name: digital_device_usage_creative_activities
      label: Do you use devices for creative activities?
      hint: Do you use devices for creative activities?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 16
      name: digital_device_usage_for_relaxation
      label: Do you use devices to relax?
      hint: Do you use devices to relax?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 17
      name: conclusion
      label: Conclusion
      hint: Thank you for participating in the Digital Detox Behavior Survey.
      type: text
      options: []
      required: false
    - id: 18
      name: demographics
      label: Demographics
      hint: Are you willing to participate in the survey?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: demographics_answer
      label: What is your age group?
      hint: Please select your age group.
      type: text
      options: []
      required: true
