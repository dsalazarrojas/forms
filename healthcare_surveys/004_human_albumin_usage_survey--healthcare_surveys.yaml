inputSchema:
  type: object
  properties:
    title: Human Albumin Usage Survey
    pages:
    - id: 1
      name: survey_form
      label: Survey Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: department
      label: department
      hint: null
      type: select_one
      options:
      - Cardiology
      - Dermatology
      - Emergency Medicine
      - General Medicine
      - Neurology
      - Oncology
      - Radiology
      - Surgery
      - Urology
      required: true
    - id: 3
      name: albumin_use
      label: Albumin Use
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: frequency_of_use
      label: Frequency of Use
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Rarely
      required: true
    - id: 5
      name: department_staff
      label: Department Staff
      hint: null
      type: select_multiple
      options:
      - Cardiology
      - Dermatology
      - Emergency Medicine
      - General Medicine
      - Neurology
      - Oncology
      - Radiology
      - Surgery
      - Urology
      required: true
    - id: 6
      name: staff_satisfaction
      label: Staff Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
