inputSchema:
  type: object
  properties:
    title: Hospital Community Relations Survey
    pages:
    - id: 1
      name: survey_questions
      label: Survey Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: satisfaction_with_services
      label: Satisfaction with Services
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: services_used
      label: Services Used
      hint: null
      type: select_one
      options:
      - Service 1
      - Service 2
      - Service 3
      - Service 4
      - Service 5
      - Other (please specify)
      required: true
    - id: 4
      name: service_used_other
      label: Service Used Other
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: community_communication
      label: Community Communication
      hint: null
      type: select_multiple
      options:
      - Newsletter
      - Social Media
      - Phone
      - Email
      - Text Message
      - In Person
      required: false
    - id: 6
      name: satisfaction_with_communication
      label: Satisfaction with Communication
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neither Agree nor Disagree
      - Somewhat Disagree
      - Strongly Disagree
      required: true
    - id: 7
      name: submission
      label: Submission
      hint: null
      type: text
      options: []
      required: false
