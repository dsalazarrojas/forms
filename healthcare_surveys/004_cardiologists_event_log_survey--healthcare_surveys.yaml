inputSchema:
  type: object
  properties:
    title: Cardiologists Event Log Survey
    pages:
      - id: 1
        name: event_information
        label: -- Event Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: event_name
        label: Event name
        hint: Official title of the event
        type: text
        options: []
        required: true
      - id: 3
        name: event_date
        label: Event date
        hint: Date when event occurred
        type: date
        options: []
        required: true
      - id: 4
        name: attendee_name
        label: Attendee name
        hint: Name of respondent
        type: text
        options: []
        required: true
      - id: 5
        name: department_affiliation
        label: Department affiliation
        hint: Hospital or clinic department
        type: text
        options: []
        required: false
      - id: 6
        name: satisfaction_overall
        label: Overall satisfaction with event
        hint: Choose the best match
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 7
        name: topics_most_useful
        label: Topics most useful
        hint: Select all that applied
        type: select_multiple
        options:
          - Clinical updates
          - Case studies
          - Research findings
          - Networking
        required: false
      - id: 8
        name: suggestions_for_improvement
        label: Suggestions for improvement
        hint: Practical recommendations for future events
        type: text
        options: []
        required: false
      - id: 9
        name: would_recommend
        label: Would recommend event to colleagues
        hint: Yes or no
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 10
        name: follow_up_consent
        label: Consent to be contacted for follow up
        hint: Allow organizers to contact you
        type: select_one
        options:
          - Yes
          - No
        required: false
