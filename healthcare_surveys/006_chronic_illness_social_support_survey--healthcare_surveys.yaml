inputSchema:
  type: object
  properties:
    title: Chronic Illness Social Support Survey
    pages:
    - id: 1
      name: respondent_id
      label: Respondent ID
      hint: Assigned study ID or leave blank
      type: text
      options: []
      required: false
    - id: 2
      name: age
      label: Age
      hint: In years
      type: number
      options: []
      required: true
    - id: 3
      name: diagnosis
      label: Primary diagnosis
      hint: Short description of chronic condition
      type: text
      options: []
      required: true
    - id: 4
      name: support_sources
      label: Primary sources of social support
      hint: Select all that apply
      type: select_multiple
      options:
      - Family
      - Friends
      - Community groups
      - Healthcare providers
      - Online forums
      required: true
    - id: 5
      name: satisfaction_with_support
      label: Satisfaction with support
      hint: Rate your satisfaction on a scale of 1 to 5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 6
      name: unmet_needs
      label: Unmet support needs
      hint: Describe any areas where you need more help or null
      type: text
      options: []
      required: false
    - id: 7
      name: access_services
      label: Access to services
      hint: Are services easy to access
      type: select_one
      options:
      - 'True'
      - 'False'
      - Sometimes
      required: true
    - id: 8
      name: helpful_resources
      label: Most helpful resources
      hint: Which resources have been most helpful or null
      type: text
      options: []
      required: false
    - id: 9
      name: preferred_communication
      label: Preferred communication method
      hint: How organizations should contact you
      type: select_one
      options:
      - Phone
      - Email
      - SMS
      - In person
      required: true
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Any further information you want to share or null
      type: text
      options: []
      required: false
