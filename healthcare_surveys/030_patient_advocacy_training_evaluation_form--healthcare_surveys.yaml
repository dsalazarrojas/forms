inputSchema:
  type: object
  properties:
    title: patient-advocacy-training-evaluation-form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: consent
      label: Do you consent to participate in this study?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 3
      name: patient_advocacy_training
      label: Has your patient advocacy training been satisfactory?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: patient_advocacy
      label: Was your patient advocacy training relevant to your job?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: patient_advocacy_training_evaluation
      label: Was the patient advocacy training evaluation process clear to you?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: patient_advocacy_training_follow_up
      label: Would you like to have a follow-up meeting?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: patient_advocacy_training_evaluation_form_comments
      label: Comments about the patient advocacy training evaluation form
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: patient_advocacy_training_evaluation_form_suggestions
      label: Suggestions for improving the patient advocacy training evaluation form
      hint: null
      type: text
      options: []
      required: false
