      - Depression
      - Post-traumatic stress disorder (PTSD)
      - Bipolar disorder
      - Schizophrenia
      - Panic disorder
      - Major depressive disorder
      - Substance abuse
      - Traumatic grief
      - Somatoforme
      - Obsessive-compulsive disorder
      - Attention deficit hyperactivity disorder (ADHD)
      - Dissociation
      - Borderline personality disorder
      required: false
