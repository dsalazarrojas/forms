inputSchema:
  type: object
  properties:
    title: Trauma And Oppression Survey
    pages:
    - id: 1
      name: introduction
      label: how_do_you_feel
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: trauma_history
      label: trauma_history
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: trauma_experience
      label: trauma_experience
      hint: Think back to when you first experienced a traumatic event.
      type: date
      options: []
      required: false
    - id: 4
      name: oppression_history
      label: oppression_history
      hint: Think back to when you first experienced a situation or event that made
        you feel oppressed or mistreated.
      type: date
      options: []
      required: false
    - id: 5
      name: support_systems
      label: support_systems
      hint: Think about your personal support system during and after the traumatic
        or oppressive experience.
      type: select_multiple
      options:
      - Family
      - Friends
      - Counselor/Therapist
      - Mental health professional
      - Support group
      required: false
    - id: 6
      name: impact
      label: impact
      hint: Please describe how trauma and oppression have impacted your life.
      type: text
      options: []
      required: false
    - id: 7
      name: trauma_type
      label: traumatic_experience_type
      hint: What type of trauma did you experience?
      type: select_one
      options:
      - Physical
      - Emotional
      - Psychological
      - Sexual
      - Domestic
      - Financial
      required: false
    - id: 8
