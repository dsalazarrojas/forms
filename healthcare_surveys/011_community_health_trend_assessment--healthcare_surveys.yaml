inputSchema:
  type: object
  properties:
    title: Community Health Trend Assessment
    pages:
      - id: 1
        name: survey_intro
        label: -- Health Trend Assessment --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_area
        label: Neighborhood or area
        hint: Town, district, or community name
        type: text
        options: []
        required: true
      - id: 3
        name: top_health_concerns
        label: Top health concerns in community
        hint: Select up to three
        type: select_multiple
        options:
          - Chronic disease management
          - Mental health
          - Substance misuse
          - Infectious disease
          - Nutrition
        required: true
      - id: 4
        name: access_to_care
        label: Access to healthcare services
        hint: Rate accessibility
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 5
        name: preventive_services_usage
        label: Use of preventive services
        hint: Frequency in past year
        type: select_one
        options:
          - Regularly
          - Occasionally
          - Rarely
          - Never
        required: false
      - id: 6
        name: community_resources_known
        label: Known community health resources
        hint: List any known local services
        type: text
        options: []
        required: false
      - id: 7
        name: barriers
        label: Main barriers to better health
        hint: Select all that apply
        type: select_multiple
        options:
          - Cost
          - Transportation
          - Lack of information
          - Language
          - Other
        required: false
      - id: 8
        name: suggested_actions
        label: Suggested actions for improvement
        hint: Open suggestions
        type: text
        options: []
        required: false
      - id: 9
        name: willing_to_participate
        label: Willing to participate in community initiatives
        hint: Select yes if willing to be contacted
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 10
        name: contact_for_involvement
        label: Contact email for involvement
        hint: Optional email for follow up
        type: email
        options: []
        required: false
