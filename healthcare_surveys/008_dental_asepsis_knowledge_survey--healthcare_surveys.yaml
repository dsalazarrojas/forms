inputSchema:
  type: object
  properties:
    title: Dental Asepsis Knowledge Survey
    pages:
    - id: 1
      name: clinic_type
      label: clinic_type
      hint: null
      type: select_one
      options:
      - dental
      - medical
      - other
      required: true
    - id: 2
      name: asepsis_knowledge
      label: Asepsis Knowledge
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: asepsis_training_needs
      label: Asepsis Training Needs
      hint: null
      type: select_multiple
      options:
      - Yes, asepsis training is required
      - No asepsis training is required
      - Not sure
      required: false
    - id: 4
      name: asepsis_training_frequency
      label: Asepsis Training Frequency
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - More than 2 years
      required: true
    - id: 5
      name: asepsis_awareness
      label: Asepsis Awareness
      hint: null
