inputSchema:
  type: object
  properties:
    title: Care Coordination Effectiveness Survey
    pages:
      - id: 1
        name: respondent_header
        label: -- Respondent Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Respondent name
        hint: Optional enter if comfortable
        type: text
        options: []
        required: false
      - id: 3
        name: role_in_care
        label: Role in care coordination
        hint: Select primary role
        type: select_one
        options:
          - Care coordinator
          - Clinician
          - Patient
          - Family member
        required: true
      - id: 4
        name: communication_effectiveness
        label: Communication effectiveness
        hint: Rate on a scale
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 5
        name: access_to_services
        label: Access to services
        hint: Ease of accessing needed services
        type: select_one
        options:
          - Very easy
          - Somewhat easy
          - Difficult
          - Very difficult
        required: true
      - id: 6
        name: timeliness_of_transfers
        label: Timeliness of care transfers
        hint: Were transfers timely and well coordinated
        type: select_one
        options:
          - Always
          - Usually
          - Sometimes
          - Rarely
        required: true
      - id: 7
        name: satisfaction_overall
        label: Overall satisfaction with coordination
        hint: Select best answer
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Unsatisfied
        required: true
      - id: 8
        name: barriers_identified
        label: Barriers identified
        hint: Main obstacles to effective coordination
        type: text
        options: []
        required: false
      - id: 9
        name: suggestions_for_improvement
        label: Suggestions for improvement
        hint: Practical recommendations
        type: text
        options: []
        required: false
      - id: 10
        name: willing_to_participate_in_follow_up
        label: Willing to participate in follow up
        hint: Allow contact for additional details
        type: select_one
        options:
          - Yes
          - No
        required: false
