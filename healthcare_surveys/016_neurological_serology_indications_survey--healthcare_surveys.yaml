inputSchema:
  type: object
  properties:
    title: Neurological Serology Indications Survey
    pages:
    - id: 1
      name: symptoms_page
      label: What are the patient's current symptoms?
      hint: Please describe the patient's current symptoms.
      type: text
      options: []
      required: true
    - id: 2
      name: history_page
      label: Provide the patient's medical history.
      hint: Please describe the patient's medical history.
      type: note
      options: []
      required: true
    - id: 3
      name: neurological_serology_testing_page
      label: Which type of serology test is ordered?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Blood tests
      - Imaging studies
      - Physical exam
      required: true
    - id: 4
      name: frequency_page
      label: How often is the serology test performed?
      hint: Select one option.
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 5
      name: time_page
      label: What is the patient's preferred time for the test?
      hint: Select one option.
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 6
      name: results_page
      label: What are the patient's serology test results?
      hint: Select one option.
      type: select_one
      options:
      - Positive
      - Negative
      - Inconclusive
      required: true
    - id: 7
      name: frequency_page_2
      label: How many times has the patient undergone a serology test?
      hint: Select one option.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 8
      name: age_group_page
      label: What is the patient's age group?
      hint: Select one option.
      type: select_one
      options:
      - 0-10 years
      - 11-20 years
      - 21-30 years
      required: true
    - id: 9
      name: medical_specialty_page
      label: What is the patient's medical specialty?
      hint: Select one option.
      type: select_one
      options:
      - Neurologist
      - Primary care physician
      - Specialist
      required: true
    - id: 10
      name: symptoms_page_2
      label: Which of the following symptoms have the patient experienced?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Headache
      - Dizziness
      - Numbness
      - Tingling sensation in hands and feet
      - Fatigue
      - Weakness
      - Confusion or disorientation
      - Vision changes
      - Hearing loss
      - Speech or language changes
      - Memory loss
      required: true
    - id: 11
      name: last_serology_test_date
      label: What is the date of the last serology test?
      hint: Format is MM/DD/YY.
      type: date
      options: []
      required: true
    - id: 12
      name: last_serology_test_time
      label: What is the time of the last serology test?
      hint: Format is HH -MM AM/PM.
      type: time
      options: []
      required: true
    - id: 13
      name: last_serology_test_note
      label: Additional information about the last serology test.
      hint: Please provide any additional information about the last serology test.
      type: note
      options: []
      required: false
    - id: 14
      name: total_serology_tests
      label: How many serology tests has the patient undergone?
      hint: Select one option.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 15
      name: total_serology_tests_2
      label: What is the total number of serology tests undergone?
      hint: Select one option.
      type: select_one
      options:
      - 1-5
      - 6-10
      - 11-15
      required: true
    - id: 16
      name: total_serology_tests_3
      label: Total Serology Tests 3
      hint: Select one option.
      type: select_one
      options:
      - 1-10
      - 11-20
      - 21 or more
      required: true
