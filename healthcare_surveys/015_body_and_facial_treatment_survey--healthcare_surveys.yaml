inputSchema:
  type: object
  properties:
    title: Body And Facial Treatment Survey
    pages:
    - id: 1
      name: client_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: visit_date
      label: Date of Treatment
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: treatment_type
      label: Type of Treatment Received
      hint: null
      type: select_one
      options:
      - Facial
      - Massage
      - Body Wrap
      - Exfoliation
      - Chemical Peel
      - Microdermabrasion
      - Combination Treatment
      - Other
      required: true
    - id: 6
      name: treatment_specific_name
      label: Specific Treatment Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: therapist_name
      label: Therapist or Technician Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: first_time_client
      label: Is this your first visit
      hint: null
      type: select_one
      options:
      - Yes - First Time
      - No - Returning Client
      required: true
    - id: 9
      name: treatment_duration
      label: Duration of Treatment
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 60 minutes
      - 90 minutes
      - 120 minutes
      - Other
      required: true
    - id: 10
      name: facility_cleanliness
      label: Facility Cleanliness Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: therapist_professionalism
      label: Therapist Professionalism
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: comfort_level
      label: Your Comfort Level During Treatment
      hint: null
      type: select_one
      options:
      - Very Comfortable
      - Comfortable
      - Neutral
      - Uncomfortable
      - Very Uncomfortable
      required: true
    - id: 13
      name: treatment_effectiveness
      label: Effectiveness of Treatment
      hint: Did you see the desired results
      type: select_one
      options:
      - Exceeded Expectations
      - Met Expectations
      - Somewhat Met Expectations
      - Did Not Meet Expectations
      - Fell Short Significantly
      required: true
    - id: 14
      name: skin_condition_improvement
      label: Improvement in Skin Condition
      hint: null
      type: select_one
      options:
      - Significant Improvement
      - Noticeable Improvement
      - Slight Improvement
      - No Change
      - Worsened
      required: true
    - id: 15
      name: product_quality
      label: Quality of Products Used
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Did Not Notice
      required: true
    - id: 16
      name: pain_level
      label: Pain or Discomfort Level
      hint: 1 = None, 10 = Severe
      type: select_one
      options:
      - None
      - Minimal
      - Mild
      - Moderate
      - Significant
      - Severe
      required: true
    - id: 17
      name: post_treatment_instructions
      label: Were post-treatment instructions clear
      hint: null
      type: select_one
      options:
      - Yes, very clear
      - Yes, mostly clear
      - Somewhat clear
      - Not clear
      - No instructions provided
      required: true
    - id: 18
      name: worth_the_price
      label: Was the treatment worth the price
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - true
      - Neutral
      - false
      - Definitely No
      required: true
    - id: 19
      name: future_treatment_interest
      label: Interested in Future Treatments
      hint: Select all that interest you
      type: select_multiple
      options:
      - Same Treatment Again
      - Different Facial
      - Body Treatment
      - Combination Package
      - Specialized Treatment
      - Not Interested
      required: false
    - id: 20
      name: recommendation_likelihood
      label: Would you recommend this salon
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 21
      name: improvements_suggestions
      label: Suggestions for Improvement
      hint: How can we serve you better
      type: text
      options: []
      required: false
    - id: 22
      name: overall_satisfaction
      label: Overall Satisfaction Rating
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
