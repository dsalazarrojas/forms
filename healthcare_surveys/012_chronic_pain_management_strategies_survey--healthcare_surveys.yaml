inputSchema:
  type: object
  properties:
    title: Chronic Pain Management Strategies Survey
    pages:
    - id: 1
      name: header_background
      label: -- Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: condition_type
      label: Primary Condition Causing Chronic Pain
      hint: null
      type: select_one
      options:
      - Fibromyalgia
      - Arthritis
      - Back/Neck Injury
      - Neuropathy
      - Migraines
      - Complex Regional Pain Syndrome
      - Other
      required: true
    - id: 3
      name: other_condition_details
      label: If Other - please specify
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: duration_of_pain
      label: Duration of Chronic Pain
      hint: null
      type: select_one
      options:
      - 3-6 months
      - 6-12 months
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 5
      name: header_strategies
      label: -- Management Strategies --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: pharmacological_strategies
      label: Pharmacological Strategies Currently Used
      hint: null
      type: select_multiple
      options:
      - Over-the-counter NSAIDs
      - Opioids
      - Muscle Relaxants
      - Antidepressants
      - Topical Creams
      - Nerve Blocks/Injections
      required: true
    - id: 7
      name: non_pharmacological_strategies
      label: Non-Pharmacological Strategies Used
      hint: null
      type: select_multiple
      options:
      - Physical Therapy
      - Acupuncture
      - Yoga/Stretching
      - Meditation/Mindfulness
      - Cognitive Behavioral Therapy
      - Massage
      - TENS Machine
      required: true
    - id: 8
      name: most_effective_strategy
      label: Which strategy have you found MOST effective?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: header_barriers
      label: -- Barriers to Management --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: financial_barriers
      label: Have financial costs prevented you from accessing treatment?
      hint: null
      type: select_one
      options:
      - Yes - Often
      - Yes - Occasionally
      - 'False'
      required: true
    - id: 11
      name: geographic_barriers
      label: Is distance to specialists a significant barrier for you?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: support_satisfaction
      label: Rate your satisfaction with your current medical support team
      hint: null
      type: select_one
      options:
      - Highly Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Highly Dissatisfied
      required: true
    - id: 13
      name: unmet_support_needs
      label: What is one thing that would improve your pain management?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: health_literacy
      label: How confident are you in managing your pain on your own?
      hint: null
      type: select_one
      options:
      - Very Confident
      - Somewhat Confident
      - Not Confident
      required: true
    - id: 15
      name: research_interest
      label: Would you be interested in clinical trial information?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
