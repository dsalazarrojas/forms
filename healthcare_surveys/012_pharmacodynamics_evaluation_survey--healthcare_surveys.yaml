inputSchema:
  type: object
  properties:
    title: Pharmacodynamics Evaluation Survey
    pages:
    - id: 1
      name: training_effectiveness
      label: Training Effectiveness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: knowledge_levels
      label: Knowledge Levels
      hint: null
      type: select_multiple
      options:
      - Knowledgeable
      - Not knowledgeable
      - Not sure
      - Unsure
      required: false
    - id: 3
      name: support_needs
      label: Support Needs
      hint: Please specify your support needs.
      type: select_one
      options:
      - Strongly agree
      - Somewhat agree
      - Neutral
      - Somewhat disagree
      - Strongly disagree
      required: false
    - id: 4
      name: training_topics
      label: Training Topics
      hint: null
      type: select_multiple
      options:
      - Pharmacodynamics
      - Clinical Trials
      - Clinical Research
      - Regulatory Compliance
      required: false
    - id: 5
      name: training_outcomes
      label: Training Outcomes
      hint: null
      type: select_multiple
      options:
      - Increased knowledge
      - Increased skills
      - Increased confidence
      - Increased motivation
      required: false
    - id: 6
      name: training_support
      label: Training Support
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Maybe
      required: false
    - id: 7
      name: training_hours
      label: Training Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: false
