inputSchema:
  type: object
  properties:
    title: AI Literacy In Healthcare Evaluation Form
    pages:
    - id: 1
      name: professional_profile_header
      label: '--- Professional Profile ---'
      hint: Details about your role and experience in healthcare.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: job_role
      label: Healthcare Professional Role
      hint: null
      type: select_one
      options:
      - Physician / Specialist
      - Registered Nurse / Practitioner
      - Medical Technician / Radiographer
      - Healthcare Administrator / Management
      - Researcher / Academic
      - Pharmacist
      required: true
    - id: 4
      name: department_unit
      label: Department / Unit
      hint: e.g., Radiology, Oncology, Intensive Care
      type: text
      options: []
      required: true
    - id: 5
      name: years_experience
      label: Years of Clinical Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: ai_familiarity_header
      label: '--- AI Familiarity and Literacy ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: ai_term_knowledge
      label: How familiar are you with general AI terminology (e.g., Deep Learning,
        Neural Networks, NLP)?
      hint: null
      type: select_one
      options:
      - Not familiar at all
      - Slightly familiar (Heard terms)
      - Moderately familiar (Understand basic concepts)
      - Very familiar (Can explain to others)
      required: true
    - id: 8
      name: clinical_ai_usage_freq
      label: Frequency of AI tool usage in your current clinical practice
      hint: null
      type: select_one
      options:
      - Never
      - Rarely (Few times a year)
      - Occasionally (Monthly)
      - Frequently (Weekly)
      - Daily
      required: true
    - id: 9
      name: ai_application_types
      label: Which AI applications have you encountered or used?
      hint: Select all that apply.
      type: select_multiple
      options:
      - AI-assisted Diagnostic Imaging (e.g., X-ray/MRI analysis)
      - Predictive Risk Analytics (e.g., Sepsis prediction)
      - Clinical Decision Support Systems (CDSS)
      - AI Virtual Assistants / Chatbots for Patients
      - Automated Transcription / Scribes
      - Robotic Surgery Assistance
      required: false
    - id: 10
      name: comfort_decision_making
      label: Comfort level with AI-assisted clinical decision making
      hint: 1 = Very Uncomfortable, 5 = Very Comfortable
      type: number
      options: []
      required: true
    - id: 11
      name: perception_and_concerns_header
      label: '--- Perceptions and Concerns ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: perceived_benefits
      label: What are the primary benefits of AI in your field?
      hint: null
      type: select_multiple
      options:
      - Increased Diagnostic Accuracy
      - Reduced Administrative Burden
      - Early Detection of Diseases
      - Personalized Treatment Plans
      - Faster Processing of Lab Results
      required: true
    - id: 13
      name: primary_concerns
      label: What are your primary concerns regarding AI in healthcare?
      hint: null
      type: select_multiple
      options:
      - Patient Data Privacy & Security
      - Algorithmic Bias & Inequality
      - Liability & Accountability for Errors
      - Loss of the 'Human Touch' in care
      - Over-reliance on Technology
      required: true
    - id: 14
      name: training_interest
      label: Would you be interested in participating in advanced AI literacy training?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Yes, if provided during work hours
      - Maybe (Need more information)
      - 'False'
      required: true
    - id: 15
      name: open_feedback_training
      label: What specific AI topics would you like to learn more about?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: agreement_quality_impact
      label: 'Statement: ''AI will significantly improve the quality of patient care
        in my department over the next 5 years.'''
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 17
      name: evaluation_date
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: true
