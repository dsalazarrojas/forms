inputSchema:
  type: object
  properties:
    title: Mental Wellness Among Staff Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question1
      label: how_do_you_rate_your_overall_feelings
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: question2
      label: work_life_balance
      hint: Please answer the following questions to help us assess mental wellness
        among staff
      type: select_one
      options:
      - very good
      - quite good
      - neutral
      - quite bad
      - very bad
      required: false
    - id: 4
      name: question3
      label: stress_levels
      hint: null
      type: select_multiple
      options:
      - very high
      - quite high
      - moderate
      - quite low
      - very low
      required: false
    - id: 5
      name: question4
      label: support_needs
      hint: List the specific supports you would like to receive from your employer
      type: select_multiple
      options:
      - EAP
      - Mental Health Days
      - Employee Assistance Programs
      - Employee Wellness Programs
      - Other
      required: false
    - id: 6
      name: question5
      label: work_family_support
      hint: null
      type: select_multiple
      options:
      - Very Strongly Disagree
      - Somewhat Disagree
      - Neutral
      - Somewhat Agree
      - Very Strongly Agree
      required: false
