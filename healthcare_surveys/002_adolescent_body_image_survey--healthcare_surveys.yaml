inputSchema:
  type: object
  properties:
    title: Adolescent Body Image Survey
    pages:
    - id: 1
      name: section_intro
      label: -- Survey Introduction --
      hint: Please answer honestly - your responses are confidential
      type: note
      options: []
      required: false
    - id: 2
      name: overall_body_satisfaction
      label: Overall Body Satisfaction
      hint: How do you generally feel about your physical appearance?
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 3
      name: influence_sources
      label: Influence Sources
      hint: Which of these influence how you feel about your body?
      type: select_multiple
      options:
      - Social media
      - Peer groups
      - Family
      - Magazines and Ads
      - Television and Movies
      required: false
    - id: 4
      name: media_platform_influence
      label: Media Platform Influence
      hint: Which social media platform impacts you the most?
      type: text
      options: []
      required: false
    - id: 5
      name: frequency_of_comparison
      label: Frequency of Comparison
      hint: How often do you compare your appearance to others?
      type: select_one
      options:
      - Daily
      - Weekly
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 6
      name: focus_on_specific_features
      label: Focus on Specific Features
      hint: Do you find yourself focusing on parts of your body you dislike?
      type: select_one
      options:
      - Always
      - Often
      - Sometimes
      - Seldom
      - Never
      required: true
    - id: 7
      name: impact_on_mood
      label: Impact on Mood
      hint: How much does your body image affect your daily mood?
      type: select_one
      options:
      - Significant impact
      - Moderate impact
      - Neutral
      - Minor impact
      - No impact
      required: true
    - id: 8
      name: positive_body_aspects
      label: Positive Body Aspects
      hint: Describe one thing you appreciate about your body
      type: text
      options: []
      required: false
    - id: 9
      name: pressure_to_change_appearance
      label: Pressure to Change Appearance
      hint: Do you feel pressure from others to look a certain way?
      type: select_one
      options:
      - High pressure
      - Moderate pressure
      - Low pressure
      - No pressure
      required: true
    - id: 10
      name: interest_in_support_groups
      label: Interest in Support Groups
      hint: Would you be interested in body positivity workshops?
      type: select_one
      options:
      - Yes
      - No
      - Maybe
      required: false
    - id: 11
      name: contact_email_optional
      label: Contact Email - Optional
      hint: Only if you would like to be contacted for support
      type: email
      options: []
      required: false
