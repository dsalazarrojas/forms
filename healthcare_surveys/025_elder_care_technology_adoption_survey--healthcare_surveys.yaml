inputSchema:
  type: object
  properties:
    title: Elder Care Technology Adoption Survey
    pages:
    - id: 1
      name: caregiver_identity
      label: Caregiver Identity
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: caregiver_role
      label: Caregiver Role
      hint: null
      type: select_one
      options:
      - primary caregiver
      - secondary caregiver
      - other
      required: false
    - id: 3
      name: care_receiver_identity
      label: Care Receiver Identity
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: care_receiver_care_levels
      label: Care Receiver Care Levels
      hint: null
      type: select_multiple
      options:
      - basic care
      - skilled care
      - custodial care
      required: false
    - id: 5
      name: technology_usage
      label: Technology Usage
      hint: null
      type: select_multiple
      options:
      - smart home
      - telecare
      - video monitoring
      required: false
    - id: 6
      name: technology_impact
      label: Technology Impact
      hint: null
      type: select_multiple
      options:
      - improved quality of care
      - cost savings
      - enhanced caregiver engagement
      required: false
    - id: 7
      name: technology_challenges
      label: Technology Challenges
      hint: null
      type: select_multiple
      options:
      - cost
      - training
      - adoption
      required: false
    - id: 8
      name: care_quality
      label: Care Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: tech_assistance
      label: Tech Assistance
      hint: null
      type: select_multiple
      options:
      - in-person
      - remote
      - both
      required: false
    - id: 10
      name: survey_response
      label: Survey Response
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: survey_completion
      label: Survey Completion
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: tool_used
      label: Tool Used
      hint: null
      type: select_one
      options:
      - chatjimmy
      - carequal
      - other
      required: false
    - id: 13
      name: other_notes
      label: Other Notes
      hint: null
      type: note
      options: []
      required: false
