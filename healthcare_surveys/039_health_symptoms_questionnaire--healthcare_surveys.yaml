inputSchema:
  type: object
  properties:
    title: Health Symptoms Questionnaire
    pages:
    - id: 1
      name: general_symptoms
      label: General Symptoms
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: true
    - id: 2
      name: pain_location
      label: Pain
      hint: null
      type: select_multiple
      options:
      - Head
      - Neck
      - Back
      - Stomach
      - Legs
      required: false
    - id: 3
      name: symptom_1
      label: Cough
      hint: null
      type: select_one
      options:
      - Cough
      - Coughing Up Blood
      - Chest Pain
      - Shortness of Breath
      required: true
    - id: 4
      name: fatigue
      label: Fatigue
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: false
    - id: 5
      name: note
      label: Additional Information
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: fever
      label: Fever
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: false
    - id: 11
      name: nausea
      label: Nausea
      hint: null
      type: select_multiple
      options:
      - Nausea
      - Vomiting
      required: false
    - id: 12
      name: chills
      label: Chills
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: false
