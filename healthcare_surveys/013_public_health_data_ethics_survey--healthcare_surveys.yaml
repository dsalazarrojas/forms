inputSchema:
  type: object
  properties:
    title: public_health_data_ethics_survey
    pages:
    - id: 1
      name: introduction
      label: Public Health Data Ethics Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_information
      label: What do you do in your daily work or activities?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: demographic_information
      label: What are your demographic information (age, gender, occupation)?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: anonymous_data_concerns
      label: How do you feel about using anonymous health data?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: data_privacy_priority
      label: How important do you feel about health data privacy?
      hint: null
      type: select_multiple
      options:
      - Very important
      - Somewhat important
      - Not very important
      required: true
    - id: 6
      name: data_use_concerns
      label: What concerns do you have about using anonymous health data?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: data_use_attitudes
      label: What do you think about the use of anonymous health data?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neither satisfied nor dissatisfied
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 8
      name: likelihood_of_use
      label: How likely are you to use anonymous health data?
      hint: null
      type: select_multiple
      options:
      - Very likely
      - Somewhat likely
      - Not likely
      required: true
    - id: 9
      name: participation_feelings
      label: How do you feel about your own participation in the survey?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: survey_satisfaction
      label: How satisfied are you with the survey?
      hint: null
      type: select_multiple
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neither satisfied nor dissatisfied
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 11
      name: recommendation
      label: Would you like to be informed about any changes in your health data?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: participant_info_2
      label: Would you recommend this survey to others?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: participant_info_3
      label: How would you like to be informed about any changes in your health data?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: participant_info_4
      label: How would you like to be informed about the use of your health data?
      hint: null
      type: text
      options: []
      required: false
