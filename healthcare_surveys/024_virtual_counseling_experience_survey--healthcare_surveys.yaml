inputSchema:
  type: object
  properties:
    title: Virtual Counseling Experience Survey
    pages:
    - id: 1
      name: intro
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: session_satisfaction
      label: Session Satisfation
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: technology_satisfaction
      label: Technology Satisfation
      hint: null
      type: select_multiple
      options:
      - Very Satisfying
      - Somewhat Satisfying
      - Not Satisfying
      required: true
    - id: 4
      name: service_improvement
      label: Service Improvement
      hint: null
      type: select_one
      options:
      - Very Satisfying
      - Somewhat Satisfying
      - Not Satisfying
      required: true
    - id: 5
      name: feedback
      label: Feedback
      hint: Please provide detailed feedback.
      type: text
      options: []
      required: false
    - id: 6
      name: session_format
      label: Session Format
      hint: null
      type: select_multiple
      options:
      - Individual
      - Group
      required: true
    - id: 7
      name: duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: schedule
      label: Schedule
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 9
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: session_type
      label: Session Type
      hint: null
      type: select_one
      options:
      - In-person
      - Virtual
      - Phone
      required: true
    - id: 11
      name: next_steps
      label: Next Steps
      hint: null
      type: note
      options: []
      required: true
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: Please provide any additional comments.
      type: text
      options: []
      required: false
    - id: 13
      name: session_notes
      label: Session Notes
      hint: Please provide any session notes.
      type: text
      options: []
      required: false
    - id: 14
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
