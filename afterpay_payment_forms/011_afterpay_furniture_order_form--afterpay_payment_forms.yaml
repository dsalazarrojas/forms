inputSchema:
  type: object
  properties:
    title: Afterpay Furniture Order Form
    pages:
    - id: 1
      name: customer_full_name
      label: Customer Full Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: Enter your email for order confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Enter your phone number for delivery updates
      type: text
      options: []
      required: true
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: Enter the complete address for delivery
      type: text
      options: []
      required: true
    - id: 5
      name: billing_address_same_as_shipping
      label: Billing Address Same as Shipping
      hint: Is your billing address the same as your shipping address?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: billing_address
      label: Billing Address
      hint: Enter the complete billing address if different from shipping
      type: text
      options: []
      required: false
    - id: 7
      name: room_type_header
      label: -- Room Type and Style --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: room_type
      label: Room Type
      hint: What room is this furniture for?
      type: select_one
      options:
      - Living Room
      - Bedroom
      - Dining Room
      - Office
      - Kitchen
      - Outdoor
      - Other
      required: true
    - id: 9
      name: furniture_style
      label: Furniture Style
      hint: What style of furniture are you looking for?
      type: select_one
      options:
      - Modern
      - Traditional
      - Contemporary
      - Rustic
      - Industrial
      - Mid-Century Modern
      - Scandinavian
      - Bohemian
      - Transitional
      required: true
    - id: 10
      name: furniture_category_header
      label: -- Furniture Category --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: furniture_category
      label: Furniture Category
      hint: Select the category of furniture you're interested in
      type: select_one
      options:
      - Seating
      - Tables
      - Storage
      - Beds
      - Desks
      - Lighting
      - Decorative
      - Other
      required: true
    - id: 12
      name: specific_furniture_item
      label: Specific Furniture Item
      hint: Enter the specific piece of furniture you want to order
      type: text
      options: []
      required: true
    - id: 13
      name: brand_preference
      label: Brand Preference
      hint: Do you have a preferred furniture brand?
      type: text
      options: []
      required: false
    - id: 14
      name: color_material_preference
      label: Color and Material Preference
      hint: Specify your preferred color and material
      type: text
      options: []
      required: false
    - id: 15
      name: dimensions_requirements
      label: Dimensions Requirements
      hint: Enter any specific dimension requirements
      type: text
      options: []
      required: false
    - id: 16
      name: quantity
      label: Quantity
      hint: How many pieces of this furniture would you like to order?
      type: number
      options: []
      required: true
    - id: 17
      name: budget_range
      label: Budget Range
      hint: What is your budget for this furniture purchase?
      type: select_one
      options:
      - Under $200
      - $200-$500
      - $500-$1000
      - $1000-$2000
      - $2000-$5000
      - Over $5000
      required: false
    - id: 18
      name: assembly_preference
      label: Assembly Preference
      hint: Do you prefer pre-assembled or DIY assembly?
      type: select_one
      options:
      - Pre-assembled
      - DIY Assembly
      - Professional Assembly Service
      required: false
    - id: 19
      name: delivery_preference
      label: Delivery Preference
      hint: Select your preferred delivery method
      type: select_one
      options:
      - Standard Delivery
      - White Glove Delivery
      - Curbside Delivery
      - Pick Up at Store
      required: true
    - id: 20
      name: payment_method
      label: Payment Method
      hint: Select Afterpay as your payment method
      type: select_one
      options:
      - Afterpay (Buy Now, Pay Later)
      - Credit Card
      - Debit Card
      - PayPal
      required: true
    - id: 21
      name: terms_agreement
      label: Terms Agreement
      hint: Do you agree to the store's terms and Afterpay conditions?
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
