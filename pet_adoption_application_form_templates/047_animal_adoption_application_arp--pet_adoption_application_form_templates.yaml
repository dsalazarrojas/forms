inputSchema:
  type: object
  properties:
    title: Animal Adoption Application ARP
    pages:
    - id: 1
      name: section_adoption_header
      label: -- Pet Adoption Application (ARP) --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_full_name
      label: Applicant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: occupation
      label: Current Occupation
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_household_info
      label: -- Household Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: housing_type
      label: Current Housing Type
      hint: null
      type: select_one
      options:
      - House
      - Apartment
      - Townhouse
      - Condo
      required: true
    - id: 7
      name: own_or_rent
      label: Do you own or rent your home?
      hint: null
      type: select_one
      options:
      - Own
      - Rent
      required: true
    - id: 8
      name: yard_type
      label: What type of yard do you have?
      hint: null
      type: select_one
      options:
      - Fully Fenced
      - Partially Fenced
      - No Fence
      - No Yard
      required: true
    - id: 9
      name: number_of_adults_in_home
      label: Number of Adults in Home
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: number_of_children_in_home
      label: Number of Children in Home
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: section_current_pets
      label: -- Current Pets --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: do_you_have_other_pets
      label: Do you currently have other pets?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: details_of_current_pets
      label: Details of Current Pets
      hint: Species, age, and temperament
      type: text
      options: []
      required: false
    - id: 14
      name: section_adoption_preferences
      label: -- Adoption Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: why_do_you_want_to_adopt
      label: Why do you want to adopt an animal at this time?
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: what_is_your_experience_with_animals
      label: What is your previous experience with animals?
      hint: null
      type: text
      options: []
      required: true
