inputSchema:
  type: object
  properties:
    title: Client Intake Consent Form
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: section_profile
      label: -- Aesthetic Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: skin_type
      label: What is your primary skin type?
      hint: null
      type: select_one
      options:
      - Dry
      - Oily
      - Normal
      - Sensitive
      - Combination
      required: true
    - id: 6
      name: dermatologist_visit
      label: Are you currently seeing a dermatologist for any condition?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: active_ingredients
      label: Do you use Retin-A, Adapalene, or Glycolic Acid products?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: recent_treatments
      label: Have you had a chemical peel or laser treatment in the last 4 weeks?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: medication_list
      label: Please list any medications you are currently taking
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: section_consent
      label: -- Informed Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: results_ack
      label: I understand that results are not guaranteed and vary by individual
      hint: null
      type: select_one
      options:
      - 'True'
      - I understand
      required: true
    - id: 12
      name: allergy_ack
      label: I have disclosed all known allergies and health conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - I confirm
      required: true
    - id: 13
      name: signature
      label: Signature - Type Full Name
      hint: null
      type: text
      options: []
      required: true
