inputSchema:
  type: object
  properties:
    title: Post Massage Evaluation Form
    pages:
    - id: 1
      name: session_feedback
      label: Session Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: massage_experience
      label: Massage Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: areas_worked
      label: Areas Worked
      hint: null
      type: select_multiple
      options:
      - Back of Neck
      - Back of Shoulders
      - Calf
      - Face
      - Feet
      - Hamstrings
      - Hands
      - Legs
      - Lower Back
      - Neck
      - Shoulders
      - Tight Muscle
      - Upper Back
      required: false
    - id: 4
      name: client_feedback
      label: Client Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: massage_tech_used
      label: Massage Tech Used
      hint: null
      type: select_one
      options:
      - Swedish
      - Deep Tissue
      - Hot Stone
      required: false
    - id: 6
      name: areas_to_focus_on
      label: Areas to Focus On
      hint: null
      type: select_multiple
      options:
      - Back
      - Feet
      - Hamstrings
      - Legs
      - Neck
      - Shoulders
      - Tight Muscle
      required: false
    - id: 7
      name: massage_time
      label: Massage Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: date_of_massage
      label: Date of Massage
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time_of_massage
      label: Time of Massage
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: massage_duration
      label: Massage Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: areas_worked_hands_on
      label: Areas Worked Hands On
      hint: null
      type: select_multiple
      options:
      - Back of Neck
      - Back of Shoulders
      - Calf
      - Face
      - Feet
      - Hamstrings
      - Hands
      - Legs
      - Lower Back
      - Neck
      - Shoulders
      - Tight Muscle
      - Upper Back
      required: false
