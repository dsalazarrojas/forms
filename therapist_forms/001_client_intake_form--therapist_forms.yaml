inputSchema:
  type: object
  properties:
    title: Client Intake Form
    pages:
    - id: 1
      name: client_personal_info
      label: Client Personal Information
      hint: Please provide your basic contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: In case of emergency during sessions
      type: text
      options: []
      required: true
    - id: 8
      name: reason_for_therapy
      label: Primary Reason for Seeking Therapy
      hint: Briefly describe what brings you here today
      type: text
      options: []
      required: true
    - id: 9
      name: previous_therapy_experience
      label: Have you received therapy before
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Prefer not to say
      required: true
    - id: 10
      name: current_mental_health_concerns
      label: Current Mental Health Concerns
      hint: Select all that apply
      type: select_multiple
      options:
      - Anxiety
      - Depression
      - Trauma or PTSD
      - Relationship Issues
      - Grief or Loss
      - Stress Management
      - None
      - Other
      required: true
    - id: 11
      name: medications_currently_taking
      label: Current Medications
      hint: List any medications you are currently taking
      type: text
      options: []
      required: false
    - id: 12
      name: medical_conditions
      label: Relevant Medical Conditions
      hint: Any physical health conditions we should be aware of
      type: text
      options: []
      required: false
    - id: 13
      name: substance_use
      label: Do you currently use alcohol or recreational drugs
      hint: null
      type: select_one
      options:
      - Yes regularly
      - Yes occasionally
      - 'False'
      - Prefer not to say
      required: true
    - id: 14
      name: therapy_goals
      label: What are your goals for therapy
      hint: What would you like to achieve through our sessions
      type: text
      options: []
      required: true
    - id: 15
      name: preferred_session_type
      label: Preferred Session Type
      hint: null
      type: select_one
      options:
      - In-person
      - Video call
      - Phone call
      - No preference
      required: false
    - id: 16
      name: availability
      label: Preferred Days and Times for Sessions
      hint: e.g. Weekday evenings weekends
      type: text
      options: []
      required: true
    - id: 17
      name: how_did_you_hear_about_us
      label: How Did You Hear About Our Practice
      hint: null
      type: select_one
      options:
      - Referral from therapist
      - Referral from doctor
      - Referral from friend or family
      - Online search
      - Social media
      - Insurance directory
      - Other
      required: false
    - id: 18
      name: insurance_provider
      label: Insurance Provider
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments or Questions
      hint: Anything else you would like us to know
      type: text
      options: []
      required: false
    - id: 20
      name: consent_to_treatment
      label: I consent to receive therapy services
      hint: null
      type: select_one
      options:
      - Yes I consent
      - No I do not consent
      required: true
