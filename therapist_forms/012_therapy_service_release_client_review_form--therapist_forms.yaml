inputSchema:
  type: object
  properties:
    title: Therapy Service Release & Client Review Form
    pages:
    - id: 1
      name: client_feedback
      label: Client Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: testimonial_consent
      label: Give Consent
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: testimonial
      label: Testimonial
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Bad
      required: true
    - id: 8
      name: review
      label: Review
      hint: null
      type: text
      options: []
      required: false
