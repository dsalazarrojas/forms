inputSchema:
  type: object
  properties:
    title: Client Progress Notes Template
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: session_date
      label: Date of Session
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: session_time
      label: Time of Session
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: therapist_name
      label: Therapist Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: session_type
      label: Type of Session
      hint: null
      type: select_one
      options:
      - Massage therapy
      - Physical therapy
      - Mental health counseling
      - Medical treatment
      - Other
      required: true
    - id: 6
      name: chief_complaint
      label: Chief Complaint or Focus Area
      hint: Main issue addressed in this session
      type: text
      options: []
      required: true
    - id: 7
      name: subjective_notes
      label: Subjective Notes -- What the client reports
      hint: Pain levels, symptoms, concerns expressed by client
      type: text
      options: []
      required: true
    - id: 8
      name: objective_observations
      label: Objective Observations -- What you observed
      hint: Range of motion, muscle tone, posture, observable symptoms
      type: text
      options: []
      required: true
    - id: 9
      name: assessment_summary
      label: Assessment Summary
      hint: Your professional assessment of client condition and progress
      type: text
      options: []
      required: true
    - id: 10
      name: treatment_provided
      label: Treatment Provided
      hint: Specific techniques or interventions used
      type: text
      options: []
      required: true
    - id: 11
      name: client_response
      label: Client Response to Treatment
      hint: How did the client respond to the treatment?
      type: text
      options: []
      required: false
    - id: 12
      name: progress_towards_goals
      label: Progress Towards Treatment Goals
      hint: Positive changes or improvements noted
      type: text
      options: []
      required: false
    - id: 13
      name: pain_level_before
      label: Pain Level Before Session
      hint: On a scale of 1-10
      type: number
      options: []
      required: false
    - id: 14
      name: pain_level_after
      label: Pain Level After Session
      hint: On a scale of 1-10
      type: number
      options: []
      required: false
    - id: 15
      name: recommendations
      label: Recommendations for Client
      hint: Home care, exercises, lifestyle modifications
      type: text
      options: []
      required: false
    - id: 16
      name: next_session_plan
      label: Plan for Next Session
      hint: Focus areas and treatment approach for follow-up
      type: text
      options: []
      required: false
    - id: 17
      name: notes_additional
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
