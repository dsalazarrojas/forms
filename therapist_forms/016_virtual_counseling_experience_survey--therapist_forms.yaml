inputSchema:
  type: object
  properties:
    title: Virtual Counseling Experience Survey
    pages:
    - id: 1
      name: client_feedback
      label: client_feedback
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: session_type
      label: session_type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: technology_satisfaction
      label: technology_satisfaction
      hint: How was your experience with the technology used during this session?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: improvement_areas
      label: improvement_areas
      hint: What areas would you like to see improved?
      type: text
      options: []
      required: false
    - id: 5
      name: technology_improvements
      label: technology_improvements
      hint: What technology improvements would you recommend?
      type: text
      options: []
      required: false
    - id: 6
      name: session_effectiveness
      label: session_effectiveness
      hint: How effective was the session in meeting your needs?
      type: select_one
      options:
      - Very Effective
      - Somewhat Effective
      - Not Very Effective
      - Not at All Effective
      required: false
    - id: 7
      name: technology_issues
      label: technology_issues
      hint: What technology issues did you experience during the session?
      type: text
      options: []
      required: false
    - id: 8
      name: next_steps
      label: next_steps
      hint: What steps would you like to take in the next session?
      type: text
      options: []
      required: false
