inputSchema:
  type: object
  properties:
    title: Colonic Hydrotherapy Consultation Form Template
    pages:
    - id: 1
      name: section_client_profile
      label: -- Client Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_medical_history
      label: -- Medical History and Health Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: primary_health_concern
      label: Primary health concern for seeking hydrotherapy
      hint: e.g., bloating, constipation, detox
      type: text
      options: []
      required: true
    - id: 7
      name: bowel_movement_frequency
      label: Current frequency of bowel movements
      hint: null
      type: select_one
      options:
      - More than 3 times daily
      - Once or twice daily
      - Every other day
      - 2-3 times per week
      - Once a week or less
      required: true
    - id: 8
      name: hydration_levels
      label: Average daily water intake (liters)
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: contraindications_check
      label: Do you have any of the following contraindications?
      hint: Please check all that apply
      type: select_multiple
      options:
      - Severe Hemorrhoids
      - Heart Disease or Congestive Heart Failure
      - Severe Anemia
      - Abdominal Hernia
      - Recent Colon Surgery (less than 6 months)
      - Pregnancy
      - Kidney Insufficiency
      - Liver Disease
      - None of the above
      required: true
    - id: 10
      name: medication_list
      label: List any current medications or supplements
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: section_lifestyle
      label: -- Lifestyle Habits --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: exercise_frequency
      label: How often do you exercise?
      hint: null
      type: select_one
      options:
      - Daily
      - 3-5 times per week
      - 1-2 times per week
      - Rarely
      - Never
      required: false
    - id: 14
      name: stress_levels
      label: Current stress levels (1-10)
      hint: 1 being low, 10 being high
      type: number
      options: []
      required: true
    - id: 15
      name: section_consent
      label: -- Consent and Declaration --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: informed_consent
      label: I confirm that I have provided accurate medical information and understand
        the nature of the procedure
      hint: null
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 17
      name: signature_confirmation
      label: Signature of Client (Print Name)
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: consultation_date
      label: Date of Consultation
      hint: null
      type: date
      options: []
      required: true
