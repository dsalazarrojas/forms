inputSchema:
  type: object
  properties:
    title: Physical Therapy Time Off Request
    pages:
    - id: 1
      name: employee_id
      label: Employee Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: time_period
      label: Time Period
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: manager_approval
      label: Manager Approval
      hint: null
      type: select_multiple
      options:
      - Approved
      - Denied
      - Pending
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
