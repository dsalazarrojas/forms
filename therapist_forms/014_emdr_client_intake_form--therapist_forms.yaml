inputSchema:
  type: object
  properties:
    title: EMDR Client Intake Form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: consent
      label: consent
      hint: Please enter your consent information
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 3
      name: session_info
      label: Session Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_and_time
      label: Date and Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
