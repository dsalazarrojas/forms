inputSchema:
  type: object
  properties:
    title: Anger Management Evaluation Form
    pages:
    - id: 1
      name: client_name
      label: Client Full Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: client_dob
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 3
      name: evaluation_date
      label: Evaluation Date
      hint: Date of assessment
      type: date
      options: []
      required: true
    - id: 4
      name: evaluator_name
      label: Evaluator Name
      hint: Therapist or counselor name
      type: text
      options: []
      required: true
    - id: 5
      name: evaluation_intro
      label: Anger Management Evaluation
      hint: This evaluation assesses anger patterns, triggers, and management skills.
        Answer honestly for best results.
      type: note
      options: []
      required: false
    - id: 6
      name: referral_reason
      label: Reason for Evaluation
      hint: Why is this evaluation being conducted
      type: select_one
      options:
      - Self-referral
      - Court ordered
      - Employer referral
      - School referral
      - Family recommendation
      - Therapist recommendation
      required: true
    - id: 7
      name: anger_frequency
      label: How often do you experience anger
      hint: Frequency of anger episodes
      type: select_one
      options:
      - Rarely - less than once a month
      - Occasionally - 1-3 times per month
      - Sometimes - 1-2 times per week
      - Often - 3-5 times per week
      - Very often - daily or multiple times daily
      required: true
    - id: 8
      name: anger_duration
      label: How long do your anger episodes typically last
      hint: Average duration
      type: select_one
      options:
      - Less than 5 minutes
      - 5-15 minutes
      - 15-30 minutes
      - 30 minutes to 1 hour
      - Several hours
      - Most of the day
      required: true
    - id: 9
      name: anger_intensity
      label: How intense is your anger typically
      hint: Average intensity level
      type: select_one
      options:
      - Mild - irritation or annoyance
      - Moderate - clearly angry but controlled
      - Strong - difficult to control
      - Severe - often lose control
      - Extreme - complete loss of control
      required: true
    - id: 10
      name: common_triggers
      label: What commonly triggers your anger
      hint: Select all that apply
      type: select_multiple
      options:
      - Being criticized
      - Feeling ignored or dismissed
      - Traffic or delays
      - Work or school stress
      - Relationship conflicts
      - Financial problems
      - Feeling unfairly treated
      - Technology failures
      - Noise or crowds
      - Other
      required: true
    - id: 11
      name: physical_signs
      label: What physical signs do you notice when angry
      hint: Select all that apply
      type: select_multiple
      options:
      - Racing heart
      - Clenched fists or jaw
      - Sweating
      - Trembling
      - Feeling hot
      - Muscle tension
      - Headache
      - Stomach upset
      required: true
    - id: 12
      name: behavioral_responses
      label: How do you typically behave when angry
      hint: Select all that apply
      type: select_multiple
      options:
      - Raise my voice
      - Yell or scream
      - Use harsh language
      - Become silent or withdraw
      - Leave the situation
      - Make threats
      - Break or throw things
      - Physical aggression toward objects
      - Physical aggression toward people
      required: true
    - id: 13
      name: impact_relationships
      label: How has anger affected your relationships
      hint: Impact on personal relationships
      type: select_one
      options:
      - No impact
      - Minor strain
      - Moderate problems
      - Significant damage
      - Lost important relationships
      required: true
    - id: 14
      name: impact_work
      label: How has anger affected your work or school
      hint: Professional or academic impact
      type: select_one
      options:
      - No impact
      - Minor issues
      - Moderate problems
      - Significant difficulties
      - Job loss or academic consequences
      required: true
    - id: 15
      name: legal_issues
      label: Have you had legal issues related to anger
      hint: Legal consequences
      type: select_one
      options:
      - 'False'
      - Yes - minor incidents
      - Yes - charges filed
      - Yes - court mandated treatment
      required: true
    - id: 16
      name: coping_methods
      label: What methods do you currently use to manage anger
      hint: Current coping strategies
      type: select_multiple
      options:
      - Deep breathing
      - Walking away
      - Exercise
      - Talking to someone
      - Meditation or prayer
      - Journaling
      - Substance use
      - None - no effective methods
      required: true
    - id: 17
      name: family_history
      label: Is there a family history of anger issues
      hint: Family background
      type: select_one
      options:
      - No known history
      - Yes - one parent
      - Yes - both parents
      - Yes - other family members
      - Unsure
      required: false
    - id: 18
      name: substance_use
      label: Do you use alcohol or drugs
      hint: Substance use can affect anger
      type: select_one
      options:
      - 'False'
      - Occasionally
      - Regularly
      - Daily
      required: true
    - id: 19
      name: motivation_change
      label: How motivated are you to change your anger patterns
      hint: Readiness for change
      type: select_one
      options:
      - Not motivated - here by requirement
      - Slightly motivated
      - Moderately motivated
      - Very motivated
      - Extremely motivated - ready to start now
      required: true
    - id: 20
      name: goals
      label: What are your goals for anger management
      hint: What do you hope to achieve
      type: text
      options: []
      required: true
    - id: 21
      name: previous_treatment
      label: Have you received anger management treatment before
      hint: Previous therapy or programs
      type: select_one
      options:
      - No - first time
      - Yes - completed program
      - Yes - did not complete
      - Yes - currently in treatment
      required: true
    - id: 22
      name: evaluator_notes
      label: Evaluator Observations
      hint: Professional observations and recommendations
      type: text
      options: []
      required: false
    - id: 23
      name: risk_level
      label: Assessed Risk Level
      hint: For professional use
      type: select_one
      options:
      - Low risk
      - Moderate risk
      - High risk
      - Requires immediate intervention
      required: false
