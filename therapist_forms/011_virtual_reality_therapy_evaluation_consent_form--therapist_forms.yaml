inputSchema:
  type: object
  properties:
    title: Virtual Reality Therapy Evaluation Consent Form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: Please provide your contact information
      type: text
      options: []
      required: true
    - id: 2
      name: treatment_info
      label: Treatment Information
      hint: Provide details about your current treatment
      type: text
      options: []
      required: true
    - id: 3
      name: consent_form
      label: Consent
      hint: Please indicate your consent for therapy
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 4
      name: notes
      label: Notes
      hint: Please provide any relevant notes or observations
      type: note
      options: []
      required: false
    - id: 5
      name: schedule_info
      label: Schedule Information
      hint: Provide your availability for sessions
      type: text
      options: []
      required: true
    - id: 6
      name: schedule_time
      label: Schedule Time
      hint: Specify a preferred time for sessions
      type: time
      options: []
      required: false
    - id: 7
      name: select_one
      label: Select One
      hint: Choose one of the options
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: schedule_date
      label: Schedule Date
      hint: Specify a preferred date for sessions
      type: date
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: Please provide your email address
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone
      hint: Please provide your phone number
      type: text
      options: []
      required: true
    - id: 11
      name: phone2
      label: Phone2
      hint: Please provide your phone number
      type: text
      options: []
      required: false
    - id: 12
      name: email2
      label: Email2
      hint: Please provide your email address
      type: email
      options: []
      required: false
    - id: 13
      name: phone3
      label: Phone3
      hint: Please provide your phone number
      type: text
      options: []
      required: false
    - id: 14
      name: email3
      label: Email3
      hint: Please provide your email address
      type: email
      options: []
      required: false
    - id: 15
      name: select_multiple
      label: Select Multiple
      hint: Choose multiple options
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 16
      name: note
      label: Note
      hint: Please provide any additional notes
      type: note
      options: []
      required: false
    - id: 17
      name: contact_info
      label: Contact Information
      hint: Please provide your contact information
      type: text
      options: []
      required: false
    - id: 18
      name: contact_info_2
      label: Contact Info 2
      hint: Please provide your contact information
      type: text
      options: []
      required: false
