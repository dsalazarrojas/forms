inputSchema:
  type: object
  properties:
    title: Chilled Water System Inspection Checklist
    pages:
    - id: 1
      name: inspection_information
      label: Inspection Information
      hint: Basic details about this inspection
      type: note
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Date of Inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Time of Inspection
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_company
      label: Company or Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: inspector_license
      label: License or Certification Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: facility_information
      label: Facility Information
      hint: Location details
      type: note
      options: []
      required: false
    - id: 8
      name: facility_name
      label: Facility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: facility_address
      label: Facility Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 10
      name: building_contact
      label: Building Contact Person
      hint: On-site contact
      type: text
      options: []
      required: true
    - id: 11
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: system_information
      label: System Information
      hint: Chilled water system details
      type: note
      options: []
      required: false
    - id: 13
      name: system_id
      label: System ID or Tag Number
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: system_location
      label: System Location
      hint: Room or area
      type: text
      options: []
      required: true
    - id: 15
      name: system_type
      label: System Type
      hint: null
      type: select_one
      options:
      - Primary only
      - Primary-secondary
      - Variable primary
      - Secondary only
      - Not sure
      required: true
    - id: 16
      name: system_capacity
      label: System Capacity
      hint: Tons or BTU rating
      type: text
      options: []
      required: false
    - id: 17
      name: visual_inspection
      label: Visual Inspection
      hint: Check all that apply
      type: note
      options: []
      required: false
    - id: 18
      name: piping_condition
      label: Piping Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Critical
      required: true
    - id: 19
      name: insulation_condition
      label: Insulation Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Missing or damaged
      required: true
    - id: 20
      name: leaks_observed
      label: Are there any visible leaks
      hint: null
      type: select_one
      options:
      - No leaks observed
      - Minor seepage
      - Active dripping
      - Significant leakage
      required: true
    - id: 21
      name: corrosion_signs
      label: Signs of Corrosion
      hint: null
      type: select_one
      options:
      - None observed
      - Minor surface corrosion
      - Moderate corrosion
      - Severe corrosion
      required: true
    - id: 22
      name: valve_operation
      label: Valve Operation
      hint: null
      type: select_one
      options:
      - All valves operational
      - Some valves stiff
      - Several valves inoperable
      - Critical valve issues
      required: true
    - id: 23
      name: pump_inspection
      label: Pump Inspection
      hint: Circulating pump status
      type: note
      options: []
      required: false
    - id: 24
      name: pump_condition
      label: Pump Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Failed
      required: true
    - id: 25
      name: pump_vibration
      label: Pump Vibration Level
      hint: null
      type: select_one
      options:
      - Normal
      - Slightly elevated
      - Excessive
      - Critical
      required: true
    - id: 26
      name: pump_noise
      label: Unusual Pump Noises
      hint: null
      type: select_one
      options:
      - No unusual noises
      - Minor noise
      - Moderate noise
      - Loud or concerning noise
      required: true
    - id: 27
      name: temperature_pressure
      label: Temperature and Pressure Readings
      hint: Operational parameters
      type: note
      options: []
      required: false
    - id: 28
      name: supply_temperature
      label: Supply Water Temperature
      hint: Degrees Fahrenheit
      type: number
      options: []
      required: true
    - id: 29
      name: return_temperature
      label: Return Water Temperature
      hint: Degrees Fahrenheit
      type: number
      options: []
      required: true
    - id: 30
      name: system_pressure
      label: System Pressure
      hint: PSI
      type: number
      options: []
      required: true
    - id: 31
      name: flow_rate
      label: Flow Rate
      hint: GPM if measurable
      type: number
      options: []
      required: false
    - id: 32
      name: recommendations
      label: Recommendations and Findings
      hint: Summary and action items
      type: note
      options: []
      required: false
    - id: 33
      name: overall_condition
      label: Overall System Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Critical - Immediate action required
      required: true
    - id: 34
      name: immediate_actions_needed
      label: Immediate Actions Required
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Repair leaks
      - Replace insulation
      - Service pumps
      - Replace valves
      - Chemical treatment
      - System flush
      - Emergency shutdown recommended
      required: true
    - id: 35
      name: follow_up_recommended
      label: Follow-up Recommended
      hint: null
      type: select_one
      options:
      - No follow-up needed
      - Routine follow-up in 6 months
      - Follow-up in 3 months
      - Follow-up in 1 month
      - Urgent follow-up required
      required: true
    - id: 36
      name: inspector_notes
      label: Additional Inspector Notes
      hint: Detailed observations
      type: text
      options: []
      required: false
    - id: 37
      name: inspector_signature
      label: Inspector Signature
      hint: Digital signature or name
      type: text
      options: []
      required: true
