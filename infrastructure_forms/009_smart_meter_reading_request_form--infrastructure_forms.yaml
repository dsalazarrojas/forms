      type: text
      options: []
      required: false
    - id: 6
      name: customer_email
      label: Customer email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: customer_phone
      label: Customer phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: meter_reading_date
      label: Meter reading date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: schedule_reading
      label: Schedule reading
