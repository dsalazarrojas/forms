inputSchema:
  type: object
  properties:
    title: Smart Meter Reading Request Form
    pages:
    - id: 1
      name: customer_info
      label: Customer info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: meter_id
      label: Meter ID
      hint: null
      type: select_one
      options:
      - '123456'
      - '654321'
      - '987654'
