      - Low
      - Medium
      required: false
    - id: 5
      name: issue_location
      label: Issue Location
      hint: null
      type: select_one
      options:
      - Office
      - Home
      - Other
      required: false
    - id: 6
      name: issue_details
      label: Issue Details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: attached_photos
      label: Attached Photos
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: issue_uptime
      label: Issue Uptime
      hint: null
      type: time
      options: []
      required: false
