inputSchema:
  type: object
  properties:
    title: Building Safety Partnership Application
    pages:
    - id: 1
      name: application_date
      label: Application Date
      hint: When submitting this application
      type: date
      options: []
      required: true
    - id: 2
      name: organization_section
      label: -- Organization Information --
      hint: Details about your organization
      type: note
      options: []
      required: false
    - id: 3
      name: organization_name
      label: Organization Name
      hint: Legal name of organization
      type: text
      options: []
      required: true
    - id: 4
      name: organization_type
      label: Organization Type
      hint: What type of organization
      type: select_one
      options:
      - Non-Profit
      - Government Agency
      - Private Company
      - Educational Institution
      - Trade Association
      - Consulting Firm
      - Other
      required: true
    - id: 5
      name: organization_focus
      label: Primary Focus
      hint: Main area of expertise
      type: text
      options: []
      required: true
    - id: 6
      name: headquarters_address
      label: Headquarters Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 7
      name: contact_section
      label: -- Primary Contact --
      hint: Main point of contact
      type: note
      options: []
      required: false
    - id: 8
      name: contact_name
      label: Contact Person Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 9
      name: contact_title
      label: Contact Person Title
      hint: Job title or position
      type: text
      options: []
      required: true
    - id: 10
      name: contact_email
      label: Email Address
      hint: Direct email
      type: email
      options: []
      required: true
    - id: 11
      name: contact_phone
      label: Phone Number
      hint: Direct phone number
      type: text
      options: []
      required: true
    - id: 12
      name: experience_section
      label: -- Experience and Credentials --
      hint: Your safety expertise
      type: note
      options: []
      required: false
    - id: 13
      name: years_in_safety
      label: Years of Experience in Safety
      hint: How long in the industry
      type: number
      options: []
      required: true
    - id: 14
      name: building_safety_experience
      label: Building Safety Expertise
      hint: Specific safety areas
      type: select_multiple
      options:
      - Fire Safety
      - Emergency Response
      - Structural Safety
      - Electrical Safety
      - Fall Protection
      - Hazardous Materials
      - Accessibility
      - Compliance
      required: true
    - id: 15
      name: certifications
      label: Relevant Certifications
      hint: Professional credentials
      type: text
      options: []
      required: false
    - id: 16
      name: case_studies
      label: Describe Previous Safety Initiatives
      hint: Examples of past work
      type: text
      options: []
      required: true
    - id: 17
      name: team_size
      label: Team Size
      hint: Number of staff involved in safety
      type: number
      options: []
      required: false
    - id: 18
      name: partnership_goals
      label: -- Partnership Goals --
      hint: What you hope to achieve
      type: note
      options: []
      required: false
    - id: 19
      name: partnership_focus
      label: Desired Focus Areas for Partnership
      hint: What do you want to work on
      type: select_multiple
      options:
      - Training Programs
      - Inspections
      - Code Compliance
      - Emergency Planning
      - Risk Assessment
      - Incident Investigation
      - Technology Solutions
      required: true
    - id: 20
      name: target_buildings
      label: Target Building Types
      hint: Which building categories
      type: select_multiple
      options:
      - Residential
      - Commercial
      - Industrial
      - Healthcare
      - Educational
      - Government
      - All Types
      required: true
    - id: 21
      name: geographic_scope
      label: Geographic Scope
      hint: Service area
      type: text
      options: []
      required: true
    - id: 22
      name: program_description
      label: Describe Your Safety Program
      hint: Detailed program overview
      type: text
      options: []
      required: true
    - id: 23
      name: expected_outcomes
      label: Expected Outcomes
      hint: What improvements will result
      type: text
      options: []
      required: false
    - id: 24
      name: resource_requirements
      label: Resource Requirements
      hint: Budget, space, equipment needed
      type: text
      options: []
      required: false
    - id: 25
      name: documents_attached
      label: Supporting Documents
      hint: References, credentials included
      type: select_one
      options:
      - true
      - false
      required: false
