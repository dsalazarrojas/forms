inputSchema:
  type: object
  properties:
    title: Digital Infrastructure Development Application
    pages:
    - id: 1
      name: project_title
      label: Project Title
      hint: Enter a brief title for the project.
      type: text
      options: []
      required: true
    - id: 2
      name: project_description
      label: Project Description
      hint: Describe the project in a few sentences.
      type: text
      options: []
      required: true
    - id: 3
      name: technical_requirements
      label: Technical Requirements
      hint: Select the technical requirements of the project.
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 4
      name: project_timelines
      label: Project Timelines
      hint: Enter the project timelines.
      type: date
      options: []
      required: true
    - id: 5
      name: organization
      label: Organization
      hint: Enter the name of the organization.
      type: text
      options: []
      required: true
    - id: 6
      name: contact_person
      label: Contact Person
      hint: Enter the contact person's name.
      type: text
      options: []
      required: true
    - id: 7
      name: contact_email
      label: Contact Email
      hint: Enter the contact person's email.
      type: email
      options: []
      required: true
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: Enter the contact person's phone number.
      type: text
      options: []
      required: true
    - id: 9
      name: review_notes
      label: Review Notes
      hint: Enter any review notes.
      type: note
      options: []
      required: false
    - id: 10
      name: category
      label: Category
      hint: Select the category of the project.
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: Select the assigned tool for the project.
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 12
      name: output_file
      label: Output File
      hint: Upload the output file.
      type: text
      options: []
      required: true
