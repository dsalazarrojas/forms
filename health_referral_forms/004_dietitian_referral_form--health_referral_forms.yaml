inputSchema:
  type: object
  properties:
    title: Dietitian Referral Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: specialty
      label: Specialty
      hint: null
      type: select_one
      options:
      - General Practice
      - Pediatric
      - Clinical
      - Other
      required: true
    - id: 8
      name: referral_name
      label: Referral Name
      hint: null
      type: select_multiple
      options:
      - Primary Care Physician
      - Specialist
      - Surgeon
      required: true
    - id: 9
      name: medical_record
      label: Medical Record
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: medical_condition
      label: Medical Condition
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: referral_reason
      label: Referral Reason
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Fax
      - In Person
      required: false
    - id: 14
      name: follow_up
      label: Follow Up
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
