inputSchema:
  type: object
  properties:
    title: AI Assistant Zoom Meeting Scheduling
    pages:
    - id: 1
      name: scheduling_header
      label: '--- Schedule Your AI Assistant Consultation ---'
      hint: Fill out the details below to book a Zoom meeting with our AI strategy
        team.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Meeting invitation and Zoom link will be sent here.
      type: email
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company/Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: meeting_topic
      label: Meeting Topic
      hint: Briefly describe what you would like to discuss.
      type: text
      options: []
      required: true
    - id: 6
      name: meeting_purpose
      label: Primary Purpose of Meeting
      hint: null
      type: select_one
      options:
      - Initial Consultation
      - Technical Support / Troubleshooting
      - Product Demo
      - Partnership Inquiry
      - Follow-up Session
      required: true
    - id: 7
      name: ai_platform_focus
      label: AI Assistant Platform Interest
      hint: Which platform/service are you using or interested in?
      type: select_multiple
      options:
      - Custom LLM Integration
      - OpenAI / ChatGPT Solutions
      - Anthropic / Claude Integration
      - Open-Source Models (Llama, etc.)
      - Customer Service Chatbots
      - Data Extraction / Analysis
      required: true
    - id: 8
      name: preferred_date
      label: Preferred Meeting Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: preferred_time_slot
      label: Preferred Time Slot
      hint: null
      type: select_one
      options:
      - Morning (9:00 AM - 12:00 PM)
      - Afternoon (12:00 PM - 4:00 PM)
      - Evening (4:00 PM - 6:00 PM)
      required: true
    - id: 10
      name: time_zone
      label: Your Time Zone
      hint: null
      type: select_one
      options:
      - UTC-8 (PST)
      - UTC-5 (EST)
      - UTC+0 (GMT)
      - UTC+1 (CET)
      - UTC+8 (SGT/HKT)
      required: true
    - id: 11
      name: meeting_duration
      label: Desired Meeting Duration
      hint: null
      type: select_one
      options:
      - 15 Minutes (Quick Sync)
      - 30 Minutes (Standard)
      - 60 Minutes (Deep Dive)
      required: true
    - id: 12
      name: number_of_attendees
      label: Estimated Number of Attendees
      hint: From your organization
      type: number
      options: []
      required: true
    - id: 13
      name: agenda_items
      label: Specific Agenda Items or Questions
      hint: Please list any specific points you want to cover.
      type: text
      options: []
      required: false
    - id: 14
      name: previous_experience
      label: Do you have existing AI implementations?
      hint: null
      type: select_one
      options:
      - Yes, currently in production
      - Yes, in development/pilot
      - No, just starting out
      required: true
    - id: 15
      name: phone_number
      label: Mobile Number (Optional for SMS Reminders)
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: confirmation_note
      label: '--- Booking Information ---'
      hint: Once submitted, you will receive an email with the Zoom link and calendar
        invite.
      type: note
      options: []
      required: false
