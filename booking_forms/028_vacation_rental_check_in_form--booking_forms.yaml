inputSchema:
  type: object
  properties:
    title: Vacation Rental Check In Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: guest_email
      label: Guest Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: guest_phone
      label: Guest Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: check_in_date
      label: Check In Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: check_out_date
      label: Check Out Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: guest_arrival_time
      label: Guest Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: guest_notes
      label: Guest Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - House
      - Condo
      - Apt
      - Townhouse
      required: false
    - id: 10
      name: guest_type
      label: Guest Type
      hint: null
      type: select_multiple
      options:
      - Individual
      - Group
      - Corporate
      - Family
      required: false
    - id: 11
      name: check_in_status
      label: Check In Status
      hint: null
      type: select_one
      options:
      - Checked In
      - Checked Out
      - Pending
      required: false
    - id: 12
      name: guest_arrival_vehicle
      label: Guest Arrival Vehicle
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: guest_arrival_mode
      label: Guest Arrival Mode
      hint: null
      type: text
      options: []
      required: false
