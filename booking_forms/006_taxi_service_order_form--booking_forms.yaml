inputSchema:
  type: object
  properties:
    title: Taxi Service Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pickup_date
      label: Pick-up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: pickup_time
      label: Pickup Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: pickup_location
      label: Pickup Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: dropoff_location
      label: Drop-Off Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: special_instructions
      label: Special Instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: taxi_type
      label: Taxi Type
      hint: null
      type: select_one
      options:
      - Economy
      - Luxury
      - Sedan
      - Truck
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - PayPal
      required: false
