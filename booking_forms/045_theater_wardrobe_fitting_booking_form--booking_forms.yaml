inputSchema:
  type: object
  properties:
    title: Theater Wardrobe Fitting Booking Form
    pages:
    - id: 1
      name: full_name
      label: What is your full name?
      hint: Please enter your name as it appears on your ID.
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Phone Number
      hint: Please enter your phone number
      type: text
      options: []
      required: true
    - id: 3
      name: time_slot
      label: Time Slot
      hint: Select a time that suits you best
      type: select_one
      options:
      - 9:00 AM - 12:00 PM
      - 12:00 PM - 3:00 PM
      - 3:00 PM - 6:00 PM
      required: true
    - id: 4
      name: service_time
      label: Service Time
      hint: Select a service time
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 5
      name: additional_services
      label: Additional Services
      hint: Check all that apply
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 6
      name: email
      label: Email
      hint: Enter your email
      type: email
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: Select a date
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 8
      name: notes
      label: Additional Notes
      hint: Any other relevant information
      type: note
      options: []
      required: false
    - id: 9
      name: confirm_notes
      label: Confirm Additional Notes
      hint: Enter your notes
      type: note
      options: []
      required: true
