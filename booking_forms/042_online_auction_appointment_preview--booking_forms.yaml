inputSchema:
  type: object
  properties:
    title: Online Auction Appointment Preview
    pages:
    - id: 1
      name: preview_time_slots
      label: Preview Time Slots
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: contact_details
      label: Contact Details
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 3
      name: auction_category
      label: Auction Category
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: platform_preferences
      label: Platform Preferences
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: no_preferences
      label: No Preferences
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
