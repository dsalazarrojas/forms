inputSchema:
  type: object
  properties:
    title: CAB Transfer Reservation Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: false
    - id: 4
      name: pickup_location
      label: Pickup Location
      hint: Where should we pick you up
      type: text
      options: []
      required: true
    - id: 5
      name: pickup_address
      label: Pickup Street Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: pickup_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: dropoff_location
      label: Dropoff Location
      hint: Where should we take you
      type: text
      options: []
      required: true
    - id: 8
      name: dropoff_address
      label: Dropoff Street Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 9
      name: dropoff_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: reservation_date
      label: Reservation Date
      hint: What date do you need transport
      type: date
      options: []
      required: true
    - id: 11
      name: pickup_time
      label: Pickup Time
      hint: What time should we arrive
      type: time
      options: []
      required: true
    - id: 12
      name: time_flexibility
      label: Time Flexibility
      hint: How flexible are you with timing
      type: select_one
      options:
      - Exact time required
      - Within 15 minutes
      - Within 30 minutes
      - Within 1 hour
      - Flexible
      required: true
    - id: 13
      name: number_of_passengers
      label: Number of Passengers
      hint: How many people
      type: number
      options: []
      required: true
    - id: 14
      name: luggage_items
      label: Luggage or Large Items
      hint: How many bags or items
      type: number
      options: []
      required: false
    - id: 15
      name: vehicle_preference
      label: Vehicle Preference
      hint: Type of vehicle needed
      type: select_one
      options:
      - Standard Sedan
      - SUV
      - Van
      - Luxury Vehicle
      - No preference
      required: true
    - id: 16
      name: special_requirements
      label: Special Requirements
      hint: Any accessibility or other needs
      type: text
      options: []
      required: false
    - id: 17
      name: return_trip
      label: Do You Need a Return Trip
      hint: Round trip or one-way
      type: select_one
      options:
      - One-way only
      - Round trip
      - To be determined
      required: true
    - id: 18
      name: return_date
      label: Return Trip Date and Time
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 19
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Cash
      - Mobile Payment
      required: true
    - id: 20
      name: special_instructions
      label: Special Instructions
      hint: Additional notes for driver
      type: text
      options: []
      required: false
