      - 'No'
      required: false
    - id: 11
      name: session_details
      label: Session Details
      hint: Please enter any additional session details.
      type: text
      options: []
      required: false
    - id: 12
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: note
      options: []
      required: false
