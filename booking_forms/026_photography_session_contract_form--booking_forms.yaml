      name: photography_session_contract_form
      label: Photography Session Contract
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: photography_session_contract_date
      label: Photography Session Date
      hint: Please enter the date of the session.
      type: date
      options: []
      required: false
    - id: 3
      name: photography_session_time
      label: Photography Session Time
      hint: Please enter the time of the session.
      type: time
      options: []
      required: false
    - id: 4
      name: photographer_name
