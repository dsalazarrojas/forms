      hint: Enter your contact number.
      type: text
      options: []
      required: false
    - id: 6
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: contract_date_start
      label: Contract Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: contract_date_end
      label: Contract End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: contract_duration
      label: Contract Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: photography_session_type
      label: Photography Session Type
      hint: null
      type: select_one
      options:
