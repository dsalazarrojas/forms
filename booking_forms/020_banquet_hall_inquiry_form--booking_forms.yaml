inputSchema:
  type: object
  properties:
    title: Banquet Hall Inquiry Form
    pages:
    - id: 1
      name: inquiry_date
      label: Inquiry Date
      hint: Date of this inquiry
      type: date
      options: []
      required: true
    - id: 2
      name: inquirer_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: inquirer_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: inquirer_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: event_type
      label: Type of Event
      hint: What kind of event?
      type: select_one
      options:
      - Wedding
      - Birthday Party
      - Corporate Event
      - Graduation Celebration
      - Anniversary Party
      - Holiday Party
      - Conference
      - Fundraiser
      - Other
      required: true
    - id: 6
      name: event_date
      label: Preferred Event Date
      hint: When would you like the event?
      type: date
      options: []
      required: true
    - id: 7
      name: alternate_dates
      label: Alternate Dates
      hint: If preferred date unavailable
      type: text
      options: []
      required: false
    - id: 8
      name: event_time
      label: Event Start Time
      hint: What time should event begin?
      type: time
      options: []
      required: true
    - id: 9
      name: event_duration
      label: Expected Event Duration
      hint: How long will the event last?
      type: select_one
      options:
      - 2 Hours
      - 3 Hours
      - 4 Hours
      - 5 Hours
      - 6+ Hours
      required: true
    - id: 10
      name: guest_count
      label: Expected Number of Guests
      hint: Total attendees
      type: number
      options: []
      required: true
    - id: 11
      name: guest_count_flexible
      label: Is Guest Count Flexible?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Possibly
      required: false
    - id: 12
      name: room_preference
      label: Room Type Preference
      hint: What layout do you need?
      type: select_one
      options:
      - Theater Style
      - Banquet/Round Tables
      - Classroom Setup
      - Cocktail Reception
      - U-Shape Configuration
      - Custom Layout
      required: false
    - id: 13
      name: room_size_preference
      label: Room Size Preference
      hint: How much space needed?
      type: select_one
      options:
      - Intimate (up to 50)
      - Small (51-100)
      - Medium (101-250)
      - Large (251-500)
      - Extra Large (500+)
      required: true
    - id: 14
      name: catering_included
      label: Is Catering Included?
      hint: Will you use our catering?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Undecided
      - Bringing Own Caterer
      required: true
    - id: 15
      name: budget_per_person
      label: Budget Per Person
      hint: Approximate cost per guest
      type: number
      options: []
      required: false
    - id: 16
      name: total_budget
      label: Total Budget
      hint: Approximate total budget
      type: number
      options: []
      required: false
    - id: 17
      name: bar_service
      label: Bar Service Needed?
      hint: Do you want full bar service?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Only Soft Drinks
      - Beer and Wine Only
      required: false
    - id: 18
      name: audio_visual
      label: Audio/Visual Equipment
      hint: Select what's needed
      type: select_multiple
      options:
      - Projector and Screen
      - Sound System
      - Microphone
      - Lighting
      - Video Display
      - None
      required: false
    - id: 19
      name: parking_available
      label: Parking Important?
      hint: Do you need parking information?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 20
      name: accessibility_requirements
      label: Accessibility Requirements
      hint: Any accommodation needs?
      type: text
      options: []
      required: false
    - id: 21
      name: additional_questions
      label: Additional Questions or Requests
      hint: Anything else we should know?
      type: text
      options: []
      required: false
