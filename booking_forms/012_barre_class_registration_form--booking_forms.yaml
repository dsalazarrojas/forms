inputSchema:
  type: object
  properties:
    title: Barre Class Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For class confirmations and updates
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 5
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of emergency contact
      type: text
      options: []
      required: true
    - id: 6
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergencies
      type: text
      options: []
      required: true
    - id: 7
      name: class_type
      label: Class Type
      hint: Select the barre class you want
      type: select_one
      options:
      - Beginner Barre
      - Intermediate Barre
      - Advanced Barre
      - Barre Fusion
      - Prenatal Barre
      - Senior Barre
      required: true
    - id: 8
      name: preferred_day
      label: Preferred Day of Week
      hint: When would you like to attend
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 9
      name: preferred_time
      label: Preferred Time Slot
      hint: What time works best
      type: select_one
      options:
      - Early morning - 6 AM to 8 AM
      - Morning - 8 AM to 12 PM
      - Afternoon - 12 PM to 4 PM
      - Evening - 4 PM to 7 PM
      - Night - after 7 PM
      required: true
    - id: 10
      name: fitness_level
      label: Fitness Level
      hint: How would you describe your fitness level
      type: select_one
      options:
      - Beginner - new to exercise
      - Intermediate - some experience
      - Advanced - very active
      - Professional - instructor level
      required: true
    - id: 11
      name: barre_experience
      label: Previous Barre Experience
      hint: Have you taken barre classes before
      type: select_one
      options:
      - Never tried barre
      - 1 to 5 classes
      - 6 to 20 classes
      - Regular practitioner
      - Certified instructor
      required: true
    - id: 12
      name: medical_conditions
      label: Medical Conditions or Injuries
      hint: Any conditions we should know about
      type: text
      options: []
      required: false
    - id: 13
      name: pregnancy_status
      label: Are You Currently Pregnant
      hint: For class modifications
      type: select_one
      options:
      - true
      - false
      - Prefer not to say
      required: true
    - id: 14
      name: membership_type
      label: Membership Type
      hint: Select your membership option
      type: select_one
      options:
      - Drop in - single class
      - 5 class package
      - 10 class package
      - Monthly unlimited
      - Annual membership
      required: true
    - id: 15
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - Cash
      - Check
      - Gift card
      required: true
    - id: 16
      name: waiver_agreement
      label: Liability Waiver Agreement
      hint: I understand the risks and agree to participate
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 17
      name: photo_consent
      label: Photo and Video Consent
      hint: May we use photos for marketing
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 18
      name: goals
      label: Fitness Goals
      hint: What do you hope to achieve
      type: select_multiple
      options:
      - Build strength
      - Improve flexibility
      - Lose weight
      - Tone muscles
      - Better posture
      - Stress relief
      - General fitness
      required: true
    - id: 19
      name: referral_source
      label: How Did You Hear About Us
      hint: We appreciate knowing
      type: select_one
      options:
      - Social media
      - Friend referral
      - Google search
      - Walked by
      - Previous client
      - Other
      required: true
    - id: 20
      name: special_requests
      label: Special Requests or Questions
      hint: Anything else we should know
      type: text
      options: []
      required: false
