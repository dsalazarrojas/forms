      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: guest_phone
      label: Guest Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: check_in_date
      label: Check in Date
