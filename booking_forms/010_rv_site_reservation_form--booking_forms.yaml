      required: false
    - id: 9
      name: reservation_status
      label: Reservation Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 12
      name: site_availability
      label: Site Availability
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
