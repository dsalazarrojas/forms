inputSchema:
  type: object
  properties:
    title: Aviation Appointment Scheduling
    pages:
    - id: 1
      name: section_client_info
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: For booking confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: license_number
      label: Pilot License Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 6
      name: section_appointment_details
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_type
      label: Requested Service
      hint: Select the primary purpose of your visit
      type: select_one
      options:
      - Flight Training (Dual)
      - Solo Flight (Rental)
      - Aircraft Maintenance
      - Discovery Flight (Intro)
      - Charter Services Inquiry
      required: true
    - id: 8
      name: aircraft_model
      label: Preferred Aircraft Model
      hint: Select your preferred airframe
      type: select_one
      options:
      - Cessna 172 Skyhawk
      - Piper PA-28 Archer
      - Cirrus SR22
      - Beechcraft Baron G58
      - Diamond DA40
      required: false
    - id: 9
      name: appointment_date
      label: Preferred Date
      hint: Select a date for your appointment
      type: date
      options: []
      required: true
    - id: 10
      name: appointment_time
      label: Preferred Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: appointment_duration
      label: Duration of Appointment
      hint: Approximate time needed
      type: select_one
      options:
      - 1 Hour
      - 2 Hours
      - 3-4 Hours
      - Full Day
      required: true
    - id: 12
      name: personnel_preference
      label: Instructor or Mechanic Preference
      hint: Name of the professional you wish to work with
      type: text
      options: []
      required: false
    - id: 13
      name: fuel_service
      label: Fueling Requirements
      hint: Do you need fueling before or after?
      type: select_one
      options:
      - 100LL (AvGas)
      - Jet A
      - MoGas
      - No fuel needed
      required: false
    - id: 14
      name: additional_requests
      label: Additional Comments or Special Requests
      hint: Please provide any extra details
      type: text
      options: []
      required: false
    - id: 15
      name: safety_agreement
      label: Do you agree to comply with all safety regulations and school policies?
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
