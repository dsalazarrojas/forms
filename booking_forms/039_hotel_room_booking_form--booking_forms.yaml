inputSchema:
  type: object
  properties:
    title: Hotel Room Booking Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: departure_date
      label: Departure Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: room_type
      label: Room Type
      hint: null
      type: select_multiple
      options:
      - Hotel Room
      - Suite Room
      - Other Room Types
      required: false
    - id: 5
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: Your email address for contact
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: booking_message
      label: Booking Message
      hint: null
      type: text
      options: []
      required: false
