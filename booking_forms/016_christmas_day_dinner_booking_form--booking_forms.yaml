inputSchema:
  type: object
  properties:
    title: Christmas Day Dinner Booking Form
    pages:
    - id: 1
      name: diner_info
      label: -- Diner Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: reservation_details
      label: -- Reservation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: party_size
      label: Party Size (number of people)
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: seating_preference
      label: Seating Preference
      hint: null
      type: select_one
      options:
      - Window seating
      - Regular seating
      - Private dining room
      - No preference
      required: false
    - id: 9
      name: arrival_time
      label: Preferred Arrival Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: estimated_departure
      label: Estimated Departure Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: dietary_restrictions
      label: -- Dietary Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: dietary_needs
      label: Dietary Restrictions or Allergies
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-free
      - Nut allergies
      - Shellfish allergies
      - Other allergies
      required: false
    - id: 13
      name: special_requirements
      label: Special Dietary Requirements
      hint: Provide details
      type: text
      options: []
      required: false
    - id: 14
      name: children_section
      label: -- Children Attending --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: number_of_children
      label: Number of Children
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: children_ages
      label: Children Ages
      hint: Comma-separated list
      type: text
      options: []
      required: false
    - id: 17
      name: highchair_needed
      label: Highchair Needed
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 18
      name: special_occasions
      label: -- Special Occasions --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: celebration_type
      label: Is this a special celebration?
      hint: null
      type: select_one
      options:
      - Birthday
      - Anniversary
      - Family reunion
      - Corporate gathering
      - Just a holiday dinner
      required: false
    - id: 20
      name: celebrations_details
      label: Details About Your Celebration
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: payment_section
      label: -- Payment --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: payment_method
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - Credit card
      - Debit card
      - Cash
      - Bank transfer
      required: true
    - id: 23
      name: confirmation
      label: I understand this is a booking confirmation
      hint: null
      type: select_one
      options:
      - Yes, confirm booking
      - false
      required: true
