inputSchema:
  type: object
  properties:
    title: Hair & Makeup Backstage Booking Form
    pages:
    - id: 1
      name: form_info
      label: Form Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_person
      label: contact_person
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: contact_email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: contact_phone
      label: contact_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: show_time
      label: Show Time
      hint: null
      type: select_one
      options:
      - '540'
      - '600'
      - '660'
      required: false
    - id: 6
      name: show_time_ending
      label: Show Time Ending
      hint: null
      type: select_multiple
      options:
      - '600'
      - '900'
      - '1200'
      required: false
    - id: 7
      name: hair_services
      label: Hair Services
      hint: null
