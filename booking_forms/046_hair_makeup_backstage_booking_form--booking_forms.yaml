      options:
      - Haircut
      - Color
      - Style
      required: false
    - id: 8
      name: makeup_services
      label: Makeup Services
      hint: null
      type: select_multiple
      options:
      - Makeup
      - Airbrush
      - Henna
      required: false
    - id: 9
      name: number_of_services
      label: Number of Services
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: booking_date
      label: Booking Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: booking_time
      label: Booking Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: submission
      label: Submission
      hint: null
      type: text
      options: []
      required: false
