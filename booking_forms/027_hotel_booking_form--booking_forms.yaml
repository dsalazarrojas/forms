inputSchema:
  type: object
  properties:
    title: Hotel Booking Form
    pages:
    - id: 1
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: end_date
      label: end_date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: room_type
      label: room_type
      hint: null
      type: select_one
      options:
      - Hotel Single
      - Hotel Double
      - Hotel Twin
      required: false
    - id: 4
      name: guest_count
      label: guest_count
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
