inputSchema:
  type: object
  properties:
    title: Camping Ground Reservation Form
    pages:
    - id: 1
      name: section_reserver_info
      label: -- Reserving Party Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: reserver_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: reserver_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: reserver_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: reserver_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: reserver_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: reserver_state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: reserver_zip
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: section_dates
      label: -- Reservation Dates --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: departure_date
      label: Departure Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: number_of_nights
      label: Number of Nights
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: section_campsite
      label: -- Campsite Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: campsite_type
      label: Campsite Type
      hint: null
      type: select_one
      options:
      - Tent Site
      - RV Site with Full Hookup
      - RV Site with Partial Hookup
      - Cabin
      - Glamping Tent
      - Yurt
      required: true
    - id: 15
      name: preferred_campsite
      label: Preferred Campsite Number
      hint: Leave blank for no preference
      type: text
      options: []
      required: false
    - id: 16
      name: preferred_location
      label: Location Preference
      hint: null
      type: select_one
      options:
      - Waterfront
      - Forest
      - Near Facilities
      - Secluded
      - No Preference
      required: false
    - id: 17
      name: section_party_details
      label: -- Party Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: number_of_adults
      label: Number of Adults
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: number_of_children
      label: Number of Children (ages 5-17)
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: number_of_toddlers
      label: Number of Toddlers (under 5)
      hint: null
      type: number
      options: []
      required: false
    - id: 21
      name: section_equipment
      label: -- Equipment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: vehicle_type
      label: Vehicle Type
      hint: If bringing RV or trailer
      type: text
      options: []
      required: false
    - id: 23
      name: vehicle_length
      label: Vehicle Length (feet)
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: special_requirements
      label: Special Requirements or Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: confirmation_method
      label: Preferred Confirmation Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      required: true
