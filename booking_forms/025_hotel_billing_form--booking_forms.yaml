      name: payment_method
      label: Payment Method
      hint: Select payment method
      type: select_one
      options:
      - Payment Method 1
      - Payment Method 2
      - Payment Method 3
      required: true
    - id: 11
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: assigned_to
      label: Assigned To
      hint: Select assigned user
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
