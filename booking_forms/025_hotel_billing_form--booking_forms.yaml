      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: Enter customer name
      type: text
      options: []
      required: false
    - id: 3
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: billing_address
      label: Billing Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: services_billed
