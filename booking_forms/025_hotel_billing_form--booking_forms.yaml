      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: charges
      label: Charges
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: total_charges
      label: Total Charges
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: date_of_billing
      label: Date Of Billing
      hint: null
      type: date
      options: []
      required: false
