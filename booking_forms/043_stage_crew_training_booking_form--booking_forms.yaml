inputSchema:
  type: object
  properties:
    title: Stage Crew Training Booking Form
    pages:
    - id: 1
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: staff_name
      label: Staff Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: training_session
      label: Training Session
      hint: null
      type: select_one
      options:
      - Session 1
      - Session 2
      required: false
    - id: 8
      name: training_duration
      label: Training Duration
      hint: null
      type: select_multiple
      options:
      - 30 minutes
      - 1 hour
      - 2 hours
      required: false
    - id: 9
      name: training_topic
      label: Training Topic
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: training_status
      label: Training Status
      hint: null
      type: select_one
      options:
      - Booked
      - Not Booked
      required: false
