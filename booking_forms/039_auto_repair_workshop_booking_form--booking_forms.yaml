inputSchema:
  type: object
  properties:
    title: Auto Repair Workshop Booking Form
    pages:
    - id: 1
      name: booking_details_header
      label: -- Booking Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_full_name
      label: Customer Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: For booking confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: vehicle_serviced_header
      label: -- Vehicle to be Serviced --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: make_and_model
      label: Make and Model
      hint: e.g. Chevrolet Equinox
      type: text
      options: []
      required: true
    - id: 7
      name: year
      label: Vehicle Year
      hint: e.g. 2017
      type: number
      options: []
      required: true
    - id: 8
      name: scheduling_header
      label: -- Appointment Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: appointment_date
      label: Appointment Date
      hint: Select your preferred day
      type: date
      options: []
      required: true
    - id: 10
      name: appointment_time
      label: Appointment Time
      hint: Select your preferred time slot
      type: time
      options: []
      required: true
    - id: 11
      name: service_type
      label: Service Type
      hint: Select the primary reason for your visit
      type: select_one
      options:
      - Minor Service
      - Major Service
      - Specific Repair
      - State Inspection
      required: true
    - id: 12
      name: transportation_needs
      label: Transportation Needs
      hint: Do you need help getting around while your car is in the shop?
      type: select_one
      options:
      - 'False'
      - Loaner Car
      - Shuttle Service
      - Towing Required
      required: true
    - id: 13
      name: booking_notes
      label: Special Requirements or Notes
      hint: Note any specific concerns or requests
      type: text
      options: []
      required: false
    - id: 14
      name: notice_preference
      label: Confirmation Notice Preference
      hint: How should we notify you?
      type: select_one
      options:
      - Email
      - SMS
      required: true
