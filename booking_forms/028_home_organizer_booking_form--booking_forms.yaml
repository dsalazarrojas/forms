inputSchema:
  type: object
  properties:
    title: Home Organizer Booking Form
    pages:
    - id: 1
      name: booking_form_category
      label: Booking Form Category
      hint: null
      type: select_one
      options:
      - Home
      - Office
      - Event
      - Other
      - Party
      required: true
    - id: 2
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: contact_form
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: appointment_location
      label: Appointment Location
      hint: null
      type: select_multiple
      options:
      - Home
      - Office
      - Other
      - Hotel
      - Restaurant
      - Park
      - Beach
      - Forest
      - City
      - Town
      - Village
      - School
      - Gym
      required: true
    - id: 6
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_time_slots
      label: Service Time Slots
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - All Day
      - Weekend
      required: true
    - id: 8
      name: service_provider
      label: Service Provider
      hint: null
      type: select_multiple
      options:
      - Service 1
      - Service 2
      - Service 3
      - Service 4
      - Service 5
      required: true
    - id: 9
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: booking_status
      label: Booking Status
      hint: null
      type: select_one
      options:
      - Pending
      - Confirmed
      - Cancelled
      required: true
    - id: 11
      name: booking_confirmation
      label: Booking Confirmation
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
