inputSchema:
  type: object
  properties:
    title: Mountain Yoga Chalet Booking Form
    pages:
    - id: 1
      name: form_first_page
      label: Step 1 - Booking Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: form_payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: form_date
      label: date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: form_start_time
      label: start time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: form_end_time
      label: end time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: form_number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: form_notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: form_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: form_agreed_terms
      label: Agreed Terms
      hint: null
      type: select_multiple
      options:
      - I have read and agreed to the terms and conditions
      - I have not read the terms and conditions
      - I have not read the terms and prophets
      required: true
