inputSchema:
  type: object
  properties:
    title: Thesis Examination Scheduling Form
    pages:
    - id: 1
      name: defense_date
      label: Defense Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: defense_time
      label: Defense Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: thesis_supervisor
      label: Thesis Supervisor
      hint: Select a supervisor from the list
      type: select_one
      options:
      - Supervisor1
      - Supervisor2
      - Supervisor3
      required: false
    - id: 4
      name: graduate_program
      label: Graduate Program
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 5
      name: defense_location
      label: Defense Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: supervisor_approval
      label: Supervisor Approval
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 8
      name: student_approval
      label: Student Approval
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 9
      name: department_chair
      label: Department Chair
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 10
      name: coordinator_approval
      label: Coordinator Approval
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
