inputSchema:
  type: object
  properties:
    title: Luxury Travel Intake Form
    pages:
    - id: 1
      name: destination
      label: Destination
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: travel_dates
      label: Travel Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: preferred_activities
      label: Activities
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: budget
      label: Budget
      hint: null
      type: select_one
      options:
      - Budget
      - Limited
      - Unrestricted
      required: false
    - id: 5
      name: accommodation_type
      label: Accommodation Type
      hint: null
      type: select_multiple
      options:
      - Hotel
      - Resort
      - Lodge
      - Hostel
      required: false
    - id: 6
      name: special_requests
      label: Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: travel_agent
      label: Travel Agent
      hint: null
      type: select_one
      options:
      - Travel Agent 1
      - Travel Agent 2
      - Travel Agent 3
      required: false
    - id: 10
      name: travel_agent_note
      label: Travel Agent Notes
      hint: null
      type: note
      options: []
      required: false
