inputSchema:
  type: object
  properties:
    title: Appointment Link Submission Form
    pages:
    - id: 1
      name: meeting_organizer
      label: -- Meeting Organizer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organizer_name
      label: Organizer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: organizer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: organizer_company
      label: Company or Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: meeting_details
      label: -- Meeting Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: meeting_title
      label: Meeting Title or Topic
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: meeting_description
      label: Meeting Description
      hint: What will be discussed?
      type: text
      options: []
      required: false
    - id: 8
      name: scheduled_date
      label: Scheduled Date and Time
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: scheduled_time
      label: Scheduled Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: timezone
      label: Timezone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: meeting_duration
      label: Expected Duration
      hint: null
      type: select_one
      options:
      - 15 minutes
      - 30 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      - Other
      required: false
    - id: 12
      name: platform_information
      label: -- Virtual Meeting Platform --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: meeting_platform
      label: Meeting Platform
      hint: null
      type: select_one
      options:
      - Zoom
      - Google Meet
      - Microsoft Teams
      - Skype
      - WebEx
      - Other
      required: true
    - id: 14
      name: meeting_link
      label: Meeting Link or URL
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: meeting_password
      label: Meeting Password (if required)
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: participant_information
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: number_of_participants
      label: Number of Expected Participants
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: participant_list
      label: List of Expected Participants
      hint: Names and emails
      type: text
      options: []
      required: false
    - id: 19
      name: access_requirements
      label: Are there any special access requirements?
      hint: null
      type: select_one
      options:
      - Yes - registration required
      - Yes - waiting room enabled
      - No special requirements
      required: false
    - id: 20
      name: additional_information
      label: Additional Information or Notes
      hint: null
      type: text
      options: []
      required: false
