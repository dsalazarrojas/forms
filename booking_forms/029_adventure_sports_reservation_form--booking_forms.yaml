inputSchema:
  type: object
  properties:
    title: Adventure Sports Reservation Form
    pages:
    - id: 1
      name: customer_information_section
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_full_name
      label: Full Name
      hint: Legal full name of the customer
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Valid email for booking confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: number_of_participants
      label: Number of Participants
      hint: How many people will be participating
      type: number
      options: []
      required: true
    - id: 6
      name: ages_of_participants
      label: Ages of Participants
      hint: Ages of all participants (separated by commas)
      type: text
      options: []
      required: true
    - id: 7
      name: activity_details_section
      label: -- Activity Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: activity_type
      label: Activity Type
      hint: Which adventure sport would you like to book
      type: select_one
      options:
      - Rock Climbing
      - Whitewater Rafting
      - Zip Lining
      - Mountain Biking
      - Kayaking
      - Paragliding
      - Bungee Jumping
      - Other
      required: true
    - id: 9
      name: activity_date
      label: Activity Date
      hint: Preferred date for the activity
      type: date
      options: []
      required: true
    - id: 10
      name: activity_time
      label: Activity Time
      hint: Preferred time for the activity
      type: time
      options: []
      required: true
    - id: 11
      name: activity_duration
      label: Activity Duration
      hint: How long is the activity
      type: select_one
      options:
      - Half day (4 hours)
      - Full day (8 hours)
      - Multi-day
      - Custom duration
      required: true
    - id: 12
      name: location_preference
      label: Location Preference
      hint: Do you have a preferred location for the activity
      type: text
      options: []
      required: false
    - id: 13
      name: experience_level_section
      label: -- Experience Level --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: experience_level
      label: Experience Level
      hint: What is your experience level with this activity
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      - First Time
      required: true
    - id: 15
      name: special_requirements
      label: Special Requirements
      hint: Do you have any special requirements or accommodations
      type: text
      options: []
      required: false
    - id: 16
      name: equipment_rental
      label: Equipment Rental
      hint: Do you need to rent equipment
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Some equipment
      required: true
    - id: 17
      name: payment_information_section
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: payment_method
      label: Payment Method
      hint: How would you like to pay for the reservation
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Cash
      - Other
      required: true
    - id: 19
      name: deposit_amount
      label: Deposit Amount
      hint: Amount of deposit required for the reservation
      type: number
      options: []
      required: true
    - id: 20
      name: cancellation_policy_acknowledgment
      label: Cancellation Policy Acknowledgment
      hint: I acknowledge and agree to the cancellation policy
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
