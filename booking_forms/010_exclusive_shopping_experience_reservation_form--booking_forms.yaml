      type: select_one
      options:
      - Option 1
      - Option 2
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: Any additional information about your booking.
      type: note
      options: []
      required: false
    - id: 9
      name: confirm_reservations
      label: Confirm Reservations
      hint: Select a time slot for your appointment.
      type: select_multiple
      options:
      - Option 3
      - Option 4
