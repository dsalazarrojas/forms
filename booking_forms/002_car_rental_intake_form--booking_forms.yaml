inputSchema:
  type: object
  properties:
    title: Car Rental Intake Form
    pages:
    - id: 1
      name: personal_information_header
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter name as on driver license
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: Provide email for booking confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Include area code
      type: text
      options: []
      required: true
    - id: 5
      name: pick_up_date
      label: Pick up date
      hint: Select pickup date
      type: date
      options: []
      required: true
    - id: 6
      name: drop_off_date
      label: Drop off date
      hint: Select planned return date
      type: date
      options: []
      required: true
    - id: 7
      name: vehicle_type
      label: Vehicle type requested
      hint: Choose preferred vehicle class
      type: select_one
      options:
      - Economy
      - Standard
      - SUV
      - Van
      - Luxury
      required: true
    - id: 8
      name: pick_up_location
      label: Pick up location
      hint: Branch or address for pickup
      type: text
      options: []
      required: true
    - id: 9
      name: drop_off_location
      label: Drop off location
      hint: Same as pickup if returning there
      type: text
      options: []
      required: false
    - id: 10
      name: additional_requests
      label: Additional requests
      hint: Child seats GPS accessibility needs
      type: text
      options: []
      required: false
