inputSchema:
  type: object
  properties:
    title: Farm Stay Reservation Form
    pages:
    - id: 1
      name: guest_details
      label: Guest Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: duration
      label: Duration
      hint: null
      type: select_one
      options:
      - One day
      - Two days
      - Three days
      required: true
    - id: 4
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: room_type
      label: Room Type
      hint: null
      type: select_multiple
      options:
      - Private room
      - Shared room
      - Other
      required: true
    - id: 6
      name: accommodation_details
      label: Accommodation Details
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: special_requests
      label: Special Requests
      hint: null
      type: select_one
      options:
      - None
      - 'False'
      - 'True'
      required: false
    - id: 8
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: farm_name
      label: Farm Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - Credit Card
      - PayPal
      required: true
    - id: 14
      name: payment_terms
      label: Payment Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: terms_and_conditions
      label: Terms And Conditions
      hint: null
      type: note
      options: []
      required: true
