inputSchema:
  type: object
  properties:
    title: Library Study Room Reservation Form
    pages:
    - id: 1
      name: booking_date
      label: Booking Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: study_room
      label: Study Room
      hint: null
      type: select_one
      options:
      - 'Group 1: Main Library 1'
      - 'Group 2: Main Library 2'
      - 'Group 3: Quiet Room'
      required: false
    - id: 5
      name: room_number
      label: Room Number
      hint: null
      type: select_multiple
      options:
      - '101'
      - '102'
      - '103'
      - '201'
      - '202'
      - '203'
      required: false
    - id: 6
      name: name
      label: Your Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: reservation_message
      label: Reservation Message
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
