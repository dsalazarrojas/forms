inputSchema:
  type: object
  properties:
    title: Aquarium Group Tour Reservation Form
    pages:
    - id: 1
      name: group_contact
      label: Group Contact Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization or School
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: tour_details
      label: Tour Details
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: tour_date
      label: Preferred Tour Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: tour_time
      label: Preferred Tour Time
      hint: null
      type: select_one
      options:
      - 9:00 AM
      - 10:00 AM
      - 11:00 AM
      - 1:00 PM
      - 2:00 PM
      - 3:00 PM
      required: true
    - id: 9
      name: group_size
      label: Number of Participants
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: age_range
      label: Age Range of Participants
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: tour_type
      label: Type of Tour
      hint: null
      type: select_one
      options:
      - Standard Tour
      - Interactive Tour
      - Educational Program
      - Behind-the-Scenes
      - Custom Tour
      required: true
    - id: 12
      name: special_interests
      label: Special Interests or Focus Areas
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: dietary_info
      label: Dietary Restrictions or Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: accessibility_needs
      label: Accessibility or Accommodation Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: tour_cost
      label: Tour Cost Estimate Acknowledged
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
