inputSchema:
  type: object
  properties:
    title: Base Check In Form
    pages:
    - id: 1
      name: attendee_name
      label: Attendee Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For event communications
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 4
      name: company_organization
      label: Company or Organization
      hint: Where you work or study
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: Your position or role
      type: text
      options: []
      required: false
    - id: 6
      name: event_name
      label: Event Name
      hint: Which event are you attending
      type: select_one
      options:
      - Annual Conference
      - Workshop Series
      - Networking Event
      - Training Session
      - Summit
      - Other
      required: true
    - id: 7
      name: registration_type
      label: Registration Type
      hint: Your registration category
      type: select_one
      options:
      - General admission
      - VIP
      - Speaker
      - Sponsor
      - Staff
      - Press or media
      required: true
    - id: 8
      name: confirmation_number
      label: Registration Confirmation Number
      hint: From your registration email
      type: text
      options: []
      required: false
    - id: 9
      name: check_in_date
      label: Check In Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 10
      name: check_in_time
      label: Check In Time
      hint: Current time
      type: time
      options: []
      required: true
    - id: 11
      name: first_time_attendee
      label: Is This Your First Time
      hint: Have you attended before
      type: select_one
      options:
      - Yes, first time
      - No, returning attendee
      required: true
    - id: 12
      name: events_attending
      label: Sessions or Events Attending
      hint: Select all that apply
      type: select_multiple
      options:
      - Keynote address
      - Breakout sessions
      - Workshops
      - Networking lunch
      - Panel discussions
      - Closing ceremony
      required: true
    - id: 13
      name: meal_preference
      label: Meal Preference
      hint: For catering purposes
      type: select_one
      options:
      - No preference
      - Vegetarian
      - Vegan
      - Gluten free
      - Kosher
      - Halal
      required: true
    - id: 14
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: Any special dietary needs
      type: text
      options: []
      required: false
    - id: 15
      name: t_shirt_size
      label: T-Shirt Size
      hint: For event swag
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - Extra large
      - XXL
      - Do not want shirt
      required: false
    - id: 16
      name: badge_name
      label: Name for Badge
      hint: How should your name appear
      type: text
      options: []
      required: true
    - id: 17
      name: networking_interest
      label: Interested in Networking Opportunities
      hint: Would you like to connect with others
      type: select_one
      options:
      - Yes, definitely
      - Maybe
      - No, just attending sessions
      required: true
    - id: 18
      name: exhibitor_booth_visit
      label: Plan to Visit Exhibitor Booths
      hint: Will you visit sponsor booths
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: session_feedback_interest
      label: Willing to Provide Session Feedback
      hint: Complete surveys after sessions
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: photo_consent
      label: Photo and Video Consent
      hint: May you be included in event photos
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 21
      name: contact_sharing
      label: Share Contact Info With Exhibitors
      hint: Allow sponsors to contact you
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: accessibility_needs
      label: Accessibility Accommodations Needed
      hint: Any special requirements
      type: text
      options: []
      required: false
    - id: 23
      name: parking_needed
      label: Parking Needed
      hint: Do you need parking information
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 24
      name: transportation_method
      label: How Did You Get Here
      hint: Transportation method
      type: select_one
      options:
      - Personal vehicle
      - Rideshare
      - Public transit
      - Walked
      - Shuttle
      required: true
    - id: 25
      name: referral_source
      label: How Did You Hear About This Event
      hint: We appreciate knowing
      type: select_one
      options:
      - Email invitation
      - Social media
      - Colleague referral
      - Website
      - Previous attendee
      - Other
      required: true
    - id: 26
      name: expectations
      label: What Are Your Expectations
      hint: What do you hope to gain
      type: text
      options: []
      required: false
    - id: 27
      name: special_requests
      label: Special Requests or Questions
      hint: Anything we should know
      type: text
      options: []
      required: false
