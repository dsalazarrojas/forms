inputSchema:
  type: object
  properties:
    title: F1 Grand Prix Ticket Booking
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: accessibility
      label: Accessibility
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: ticket_type
      label: Ticket Type
      hint: null
      type: select_one
      options:
      - Grandstand
      - Pitside
      - Pitlane
      required: false
    - id: 5
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      required: false
    - id: 7
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: confirm_payment
      label: Confirm Payment
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: confirm_payment_method
      label: Confirm Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
