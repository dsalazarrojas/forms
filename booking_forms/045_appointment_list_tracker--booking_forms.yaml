inputSchema:
  type: object
  properties:
    title: Appointment List Tracker
    pages:
    - id: 1
      name: appointment_entry
      label: -- Appointment Entry --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Client Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: service_type
      label: -- Service Type --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: service_provided
      label: Service Provided
      hint: null
      type: select_one
      options:
      - Haircut
      - Hair color
      - Massage
      - Facial
      - Nails
      - Consultation
      - Other
      required: true
    - id: 9
      name: service_duration
      label: Service Duration
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      - 3+ hours
      required: false
    - id: 10
      name: assigned_staff
      label: Assigned Staff Member
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: appointment_status
      label: -- Appointment Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: current_status
      label: Current Status
      hint: null
      type: select_one
      options:
      - Scheduled
      - Confirmed
      - In progress
      - Completed
      - Cancelled
      - No-show
      required: true
    - id: 13
      name: notes
      label: Notes or Special Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: pricing_information
      label: -- Pricing Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: service_price
      label: Service Price
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit card
      - Debit card
      - Check
      - Online payment
      - Other
      required: false
    - id: 17
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Pending
      - Partial payment
      - Unpaid
      required: false
    - id: 18
      name: reminder_sent
      label: Reminder sent?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not needed
      required: false
    - id: 19
      name: follow_up_needed
      label: Follow-up needed?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Already done
      required: false
    - id: 20
      name: additional_notes
      label: Additional tracking notes
      hint: null
      type: text
      options: []
      required: false
