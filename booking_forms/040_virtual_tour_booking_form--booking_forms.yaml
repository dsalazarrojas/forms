inputSchema:
  type: object
  properties:
    title: Virtual Tour Booking Form
    pages:
    - id: 1
      name: tour_name
      label: Tour Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tour_provider
      label: Tour Provider
      hint: null
      type: select_one
      options:
      - Provider1
      - Provider2
      - Provider3
      required: false
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: tour_type
      label: Tour Type
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 8
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - default tool
      required: false
