inputSchema:
  type: object
  properties:
    title: Art Studio Reservation Form
    pages:
    - id: 1
      name: reservation_date
      label: Reservation Date
      hint: Date of reservation
      type: date
      options: []
      required: true
    - id: 2
      name: customer_name
      label: Customer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Customer Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone
      label: Customer Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: studio_type
      label: Studio Type
      hint: Type of studio space
      type: select_one
      options:
      - Painting Studio
      - Sculpture Studio
      - Photography Studio
      - Digital Arts Lab
      - Ceramics Studio
      - Printmaking Studio
      - Multi-Purpose Studio
      - Private Studio
      required: true
    - id: 6
      name: session_date
      label: Session Date
      hint: Date of studio session
      type: date
      options: []
      required: true
    - id: 7
      name: session_time
      label: Session Time
      hint: Preferred time slot
      type: select_one
      options:
      - 9:00 AM - 12:00 PM
      - 12:00 PM - 3:00 PM
      - 3:00 PM - 6:00 PM
      - 6:00 PM - 9:00 PM
      - Full Day (9 AM - 6 PM)
      required: true
    - id: 8
      name: duration
      label: Duration
      hint: Length of reservation
      type: select_one
      options:
      - 1 Hour
      - 2 Hours
      - 3 Hours
      - 4 Hours
      - Full Day
      - Multiple Days
      required: true
    - id: 9
      name: number_of_participants
      label: Number of Participants
      hint: Total number of people
      type: number
      options: []
      required: true
    - id: 10
      name: participant_names
      label: Participant Names
      hint: Names of all participants
      type: text
      options: []
      required: false
    - id: 11
      name: experience_level
      label: Experience Level
      hint: Skill level of group
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Mixed Levels
      - Professional
      required: true
    - id: 12
      name: equipment_needed
      label: Equipment Needed
      hint: Select equipment required
      type: select_multiple
      options:
      - Easels
      - Tables
      - Stools
      - Lighting Equipment
      - Camera Equipment
      - Computer Workstations
      - Pottery Wheel
      - Kiln Access
      - Printmaking Press
      - None - Bring My Own
      required: true
    - id: 13
      name: materials_needed
      label: Materials Needed
      hint: Select materials required
      type: select_multiple
      options:
      - Canvas
      - Paints
      - Brushes
      - Clay
      - Photo Paper
      - Printing Materials
      - Sketch Paper
      - None - Bring My Own
      required: false
    - id: 14
      name: instructor_requested
      label: Instructor Requested
      hint: Do you need an instructor
      type: select_one
      options:
      - Yes - Beginner Instruction
      - Yes - Advanced Guidance
      - No - Self-Directed
      required: true
    - id: 15
      name: instructor_name
      label: Instructor Name
      hint: Preferred instructor if any
      type: text
      options: []
      required: false
    - id: 16
      name: project_type
      label: Project Type
      hint: Type of project planned
      type: text
      options: []
      required: false
    - id: 17
      name: special_requirements
      label: Special Requirements
      hint: Any special needs or requests
      type: text
      options: []
      required: false
    - id: 18
      name: accessibility_needs
      label: Accessibility Needs
      hint: Do you need accessibility accommodations
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: accessibility_details
      label: Accessibility Details
      hint: Describe your needs
      type: text
      options: []
      required: false
    - id: 20
      name: parking_needed
      label: Parking Needed
      hint: Will you need parking
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 21
      name: session_cost
      label: Session Cost
      hint: Cost of reservation
      type: number
      options: []
      required: false
    - id: 22
      name: equipment_cost
      label: Equipment Cost
      hint: Equipment rental cost
      type: number
      options: []
      required: false
    - id: 23
      name: materials_cost
      label: Materials Cost
      hint: Materials cost
      type: number
      options: []
      required: false
    - id: 24
      name: total_cost
      label: Total Cost
      hint: Total cost of reservation
      type: number
      options: []
      required: false
    - id: 25
      name: deposit_paid
      label: Deposit Paid
      hint: Have you paid the deposit
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 26
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Cash
      - Check
      - Online Payment
      required: true
    - id: 27
      name: cancellation_policy
      label: Cancellation Policy
      hint: I understand the cancellation policy
      type: select_one
      options:
      - Yes - I Understand
      - No - Need Information
      required: true
    - id: 28
      name: liability_waiver
      label: Liability Waiver
      hint: I agree to the liability waiver
      type: select_one
      options:
      - Yes - I Agree
      - false
      required: true
    - id: 29
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
