inputSchema:
  type: object
  properties:
    title: Dance Class Booking Form
    pages:
    - id: 1
      name: form_submission
      label: Form Submission
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: class_time
      label: Class Time
      hint: null
      type: select_one
      options:
      - 8:00-9:00 am
      - 9:00-10:00 am
      - 10:00-11:00 am
      - 11:00 am-12:00 pm
      - 12:00-1:00 pm
      - 1:00-2:00 pm
      - 2:00-3:00 pm
      - 3:00-4:00 pm
      - 4:00-5:00 pm
      - 5:00-6:00 pm
      - 6:00-7:00 pm
      - 7:00-8:00 pm
      - 8:00-9:00 pm
      required: true
    - id: 3
      name: student_info
      label: Student Information
      hint: Please provide student details for class registration
      type: text
      options: []
      required: false
    - id: 4
      name: instructor_info
      label: Instructor Information
      hint: null
      type: select_multiple
      options:
      - Instructor 1
      - Instructor 2
      - Instructor 3
      - Instructor 4
      - Instructor 5
      - Instructor 6
      - Instructor 7
      - Instructor 8
      - Instructor 9
      - Instructor 10
      - Instructor 11
      - Instructor 12
      required: false
    - id: 5
      name: class_date
      label: Class Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: class_instructor
      label: Class Instructor
      hint: null
      type: select_one
      options:
      - Instructor 1
      - Instructor 2
      - Instructor 3
      - Instructor 4
      - Instructor 5
      - Instructor 6
      - Instructor 7
      - Instructor 8
      - Instructor 9
      - Instructor 10
      - Instructor 11
      - Instructor 12
      required: true
    - id: 7
      name: student_level
      label: Student Level
      hint: Please select your dance class level
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 8
      name: class_type
      label: Class Type
      hint: null
      type: select_one
      options:
      - Ballet
      - Ballroom
      - Hip-Hop
      - Contemporary
      - Latin
      - Jazz
      - Modern
      - Other
      - Tap
      required: true
    - id: 9
      name: additional_info
      label: Additional Information
      hint: Please provide any additional information about student
      type: text
      options: []
      required: false
    - id: 10
      name: form_submission
      label: Form Submission
      hint: null
      type: note
      options: []
      required: false
