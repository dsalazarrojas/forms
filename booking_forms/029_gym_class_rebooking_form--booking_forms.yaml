      options: []
      required: false
    - id: 6
      name: student_id
      label: student_id
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: class_details
      label: class_details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: instructor_name
      label: instructor
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: rebooking_message
      label: rebooking_message
      hint: null
