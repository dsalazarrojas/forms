inputSchema:
  type: object
  properties:
    title: Car Rental Appointment Form
    pages:
    - id: 1
      name: rental_appointment_header
      label: -- Rental Appointment --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rental_pickup_date_appointment
      label: Preferred Pickup Date
      hint: Select the day for pickup
      type: date
      options: []
      required: true
    - id: 3
      name: rental_pickup_time_appointment
      label: Preferred Pickup Time
      hint: Select the time for pickup
      type: time
      options: []
      required: true
    - id: 4
      name: rental_return_date_appointment
      label: Preferred Return Date
      hint: Select the day for return
      type: date
      options: []
      required: true
    - id: 5
      name: rental_return_time_appointment
      label: Preferred Return Time
      hint: Select the time for return
      type: time
      options: []
      required: true
    - id: 6
      name: vehicle_type_appointment
      label: Preferred Vehicle Class
      hint: Select the type of vehicle
      type: select_one
      options:
      - Economy
      - Compact
      - Mid-size
      - Full-size
      - SUV
      - Luxury
      - Minivan
      required: true
    - id: 7
      name: rental_pickup_location_appointment
      label: Preferred Pickup Location
      hint: Select the pickup location
      type: text
      options: []
      required: true
    - id: 8
      name: customer_info_header_appointment
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: customer_full_name_appointment
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 10
      name: customer_email_appointment
      label: Email Address
      hint: For booking confirmation and updates
      type: email
      options: []
      required: true
    - id: 11
      name: customer_phone_appointment
      label: Phone Number
      hint: Primary contact for the appointment
      type: text
      options: []
      required: true
    - id: 12
      name: driver_license_number_appointment
      label: Driver's License Number
      hint: (Valid state license)
      type: text
      options: []
      required: true
    - id: 13
      name: additional_requests_header_appointment
      label: -- Additional Services --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: additional_services_appointment
      label: Additional Services Needed
      hint: Select any additional services
      type: select_multiple
      options:
      - GPS Navigation
      - Child Seat
      - Additional Driver
      - Full Insurance Coverage
      required: false
    - id: 15
      name: appointment_verification_header
      label: -- Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: appointment_acknowledgement
      label: I acknowledge the car rental appointment terms
      hint: See terms of service
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 17
      name: signature_confirmation_appointment
      label: Type your name for rental appointment confirmation
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: additional_appointment_comments
      label: Any additional comments or requests?
      hint: Provide more details for the appointment
      type: text
      options: []
      required: false
