inputSchema:
  type: object
  properties:
    title: Flight Editing Checklist
    pages:
    - id: 1
      name: flight_info
      label: Flight Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: flight_status
      label: Flight Status
      hint: null
      type: select_one
      options:
      - Departed
      - Arrived
      - On Hold
      - Cancelled
      required: false
    - id: 3
      name: flight_details
      label: Flight Details
      hint: Flight Number, Departure Time, Departure Location
      type: text
      options: []
      required: false
    - id: 4
      name: crew_details
      label: Crew Details
      hint: null
      type: select_multiple
      options:
      - Pilot In Command
      - Co Pilot
      - Flight Steward
      - Crew Chief
      required: false
    - id: 5
      name: aircraft_details
      label: Aircraft Details
      hint: null
      type: text
      options: []
      required: false
