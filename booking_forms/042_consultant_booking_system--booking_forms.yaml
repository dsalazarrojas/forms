inputSchema:
  type: object
  properties:
    title: Consultant Booking System
    pages:
    - id: 1
      name: section_client_ident
      label: -- Client Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_full_name_ident
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email_ident
      label: Email Address
      hint: Booking confirmation will be sent here
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone_ident
      label: Phone Number
      hint: Format - (555) 555-5555
      type: text
      options: []
      required: true
    - id: 5
      name: company_organization_ident
      label: Company/Organization Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_booking_details
      label: -- Booking and Service Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: preferred_booking_date
      label: Preferred Date for Consultation
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: preferred_booking_time
      label: Preferred Time Slot
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: consultation_service_ident
      label: Select a Consultation Service
      hint: null
      type: select_one
      options:
      - Strategy Session (60 mins)
      - Project Assessment (Half-day)
      - Full-day Workshop
      - Weekly Check-in (30 mins)
      - Technical Troubleshooting (Hour)
      required: true
    - id: 10
      name: consultation_topic_desc
      label: Primary Topic/Problem to be Discussed
      hint: Brief summary of the meeting goal
      type: text
      options: []
      required: true
    - id: 11
      name: section_meeting_logistics
      label: -- Meeting Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: meeting_format_pref
      label: Preferred Meeting Format
      hint: null
      type: select_one
      options:
      - Video Call (Zoom/Teams)
      - Phone Call
      - In-person (At Client Site)
      - In-person (At Consultant Office)
      required: true
    - id: 13
      name: virtual_meeting_link_req
      label: Request Calendar Invitation with Meeting Link?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: time_zone_ident
      label: Your Current Time Zone
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: section_payment_confirm
      label: -- Payment and Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: booking_fee_ack_ident
      label: Acknowledgment of Booking/Consultation Fee
      hint: Fees are subject to the standard consulting agreement
      type: select_one
      options:
      - I Acknowledge and Agree
      - I Disagree
      required: true
    - id: 17
      name: cancellation_policy_ack
      label: Agreement to 24-hour Cancellation Policy
      hint: Cancellations within 24 hours may incur a fee
      type: select_one
      options:
      - I Agree
      - I Disagree
      required: true
    - id: 18
      name: additional_booking_notes
      label: Additional Information or Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: submission_date
      label: Date of Booking Request
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: booking_status_auto_label
      label: Booking Status (Internal Use Only)
      hint: null
      type: text
      options: []
      required: false
