inputSchema:
  type: object
  properties:
    title: Quick Meeting Scheduler
    pages:
    - id: 1
      name: meeting_request
      label: Meeting Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: preferred_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: attendees
      label: Attendees
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: meeting_details
      label: Meeting Details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: follow_up
      label: Follow Up
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
