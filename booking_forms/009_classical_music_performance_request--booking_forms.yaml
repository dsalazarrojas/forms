inputSchema:
  type: object
  properties:
    title: Classical Music Performance Request
    pages:
    - id: 1
      name: section_header_requester
      label: -- Event Organizer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Name
      hint: Full name of person requesting performance
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Email Address
      hint: Email for communication
      type: email
      options: []
      required: true
    - id: 4
      name: requester_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: organization_name
      label: Organization or Event Name
      hint: Name of the organization or event
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_event
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_type
      label: Event Type
      hint: What kind of event is this?
      type: select_one
      options:
      - Wedding
      - Corporate Event
      - Funeral or Memorial Service
      - Concert or Recital
      - Chamber Music Event
      - Educational Event
      - Private Party
      - Other
      required: true
    - id: 8
      name: event_description
      label: Event Description
      hint: Describe the event and atmosphere desired
      type: text
      options: []
      required: true
    - id: 9
      name: event_date
      label: Event Date
      hint: Preferred date for performance
      type: date
      options: []
      required: true
    - id: 10
      name: event_time
      label: Event Time
      hint: Time the performance should occur
      type: time
      options: []
      required: true
    - id: 11
      name: event_duration
      label: Duration Needed
      hint: How long should the performance be?
      type: select_one
      options:
      - 15 minutes
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      - 2.5 hours
      required: true
    - id: 12
      name: event_location
      label: Event Location
      hint: Street address and venue name
      type: text
      options: []
      required: true
    - id: 13
      name: venue_type
      label: Venue Type
      hint: What is the venue like?
      type: select_one
      options:
      - Concert Hall
      - Church
      - Hotel or Ballroom
      - Private Residence
      - Outdoor Garden
      - Restaurant or Cafe
      - Other
      required: true
    - id: 14
      name: expected_audience_size
      label: Expected Audience Size
      hint: Approximate number of attendees
      type: number
      options: []
      required: false
    - id: 15
      name: section_header_music
      label: -- Music Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: music_preferences
      label: Music Style or Composer Preferences
      hint: Any specific pieces, composers, or styles requested?
      type: text
      options: []
      required: false
    - id: 17
      name: ensemble_type
      label: Ensemble Type Preferred
      hint: What type of musicians do you need?
      type: select_one
      options:
      - Solo Pianist
      - Solo Violinist
      - String Quartet
      - Chamber Ensemble
      - Piano Trio
      - Woodwind Ensemble
      - Mixed Ensemble
      - No Preference
      required: true
    - id: 18
      name: custom_arrangements
      label: Do you need custom arrangements or special pieces?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 19
      name: section_header_technical
      label: -- Technical and Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: piano_availability
      label: Piano or Sound System Available at Venue
      hint: null
      type: select_one
      options:
      - Yes, Acoustic Piano
      - Yes, Digital Piano
      - Yes, Only Sound System
      - No, Will Need to Arrange
      required: true
    - id: 21
      name: parking_available
      label: Parking Available for Performers
      hint: null
      type: select_one
      options:
      - Yes, Free Parking
      - Yes, Paid Parking
      - Limited Parking
      - No Parking
      required: false
    - id: 22
      name: accommodation_needed
      label: Accommodation Needed
      hint: Do performers need lodging?
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 23
      name: budget_range
      label: Performance Budget Range
      hint: What is your budget?
      type: select_one
      options:
      - Under 500
      - 500-1000
      - 1000-2000
      - 2000-5000
      - 5000+
      required: true
    - id: 24
      name: special_requests
      label: Special Requests or Additional Notes
      hint: Any other information we should know
      type: text
      options: []
      required: false
