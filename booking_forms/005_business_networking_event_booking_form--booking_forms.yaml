inputSchema:
  type: object
  properties:
    title: Business Networking Event Booking Form
    pages:
    - id: 1
      name: section_event_selection
      label: -- Event Selection --
      type: note
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: Select the networking event date
      type: date
      required: true
    - id: 3
      name: event_name
      label: Event Name
      hint: Which event are you registering for
      type: select_one
      options:
      - Monthly Networking Breakfast
      - Quarterly Business Summit
      - Industry Mixer
      - Annual Gala
      - Speed Networking Session
      required: true
    - id: 4
      name: event_location
      label: Event Location
      hint: Where the event will be held
      type: text
      required: false
    - id: 5
      name: section_attendee_info
      label: -- Attendee Information --
      type: note
      required: false
    - id: 6
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      required: true
    - id: 7
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      required: true
    - id: 8
      name: email_address
      label: Email Address
      hint: Your email for event updates
      type: email
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: Contact number for event organizers
      type: text
      required: false
    - id: 10
      name: section_business_info
      label: -- Business Information --
      type: note
      required: false
    - id: 11
      name: company_name
      label: Company Name
      hint: Your business name
      type: text
      required: true
    - id: 12
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      required: true
    - id: 13
      name: industry
      label: Industry
      hint: Select your industry
      type: select_one
      options:
      - Technology
      - Finance
      - Healthcare
      - Retail
      - Manufacturing
      - Services
      - Other
      required: true
    - id: 14
      name: section_booking_details
      label: -- Booking Details --
      type: note
      required: false
    - id: 15
      name: number_of_attendees
      label: Number of Attendees
      hint: How many people are attending
      type: number
      required: true
    - id: 16
      name: dietary_requirements
      label: Dietary Requirements
      hint: Any allergies or preferences
      type: text
      required: false
    - id: 17
      name: networking_interests
      label: Networking Interests
      hint: What are you looking to connect on
      type: select_multiple
      options:
      - Business Partnerships
      - Vendor Relationships
      - Investment Opportunities
      - Talent Acquisition
      - Knowledge Sharing
      required: false
    - id: 18
      name: marketing_opt_in
      label: Receive Event Updates and Offers
      hint: Would you like to be added to our mailing list
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: special_requests
      label: Special Requests or Comments
      hint: Any additional information for organizers
      type: text
      required: false
