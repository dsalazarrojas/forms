      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: special_requests
      label: Special Requests
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: true
    - id: 9
      name: restaurant
      label: Restaurant
      hint: null
      type: select_one
      options:
      - Restaurant A
      - Restaurant B
      - Restaurant C
