inputSchema:
  type: object
  properties:
    title: Vineyard Guesthouse Booking Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: checkin_date
      label: Checkin Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: checkout_date
      label: Checkout Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: guest_type
      label: Guest Type
      hint: null
      type: select_one
      options:
      - Adult
      - Child
      - Senior
      required: true
    - id: 6
      name: room_service
      label: Room Service
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      required: true
    - id: 11
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: booking_id
      label: Booking ID
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: date_created
      label: Date Created
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: date_modified
      label: Date Modified
      hint: null
      type: date
      options: []
      required: false
