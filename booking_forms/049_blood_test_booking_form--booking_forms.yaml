inputSchema:
  type: object
  properties:
    title: Blood Test Booking Form
    pages:
    - id: 1
      name: booking_header
      label: Blood Test Booking Form
      hint: Schedule your blood test appointment
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: For records
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: address
      label: Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 11
      name: insurance_provider
      label: Insurance Provider
      hint: Insurance company
      type: text
      options: []
      required: false
    - id: 12
      name: insurance_id
      label: Insurance ID
      hint: Policy number
      type: text
      options: []
      required: false
    - id: 13
      name: referring_doctor
      label: Referring Doctor
      hint: Physician name
      type: text
      options: []
      required: true
    - id: 14
      name: doctor_phone
      label: Doctor Phone
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 15
      name: test_types
      label: Types of Tests
      hint: Select all that apply
      type: select_multiple
      options:
      - Complete Blood Count CBC
      - Basic Metabolic Panel BMP
      - Comprehensive Metabolic Panel CMP
      - Lipid Panel Cholesterol
      - Thyroid Panel TSH
      - HbA1c Diabetes
      - Vitamin D
      - Vitamin B12
      - Iron Studies
      - Liver Function
      - Kidney Function
      - Hormone Panel
      - Other
      required: true
    - id: 16
      name: fasting_required
      label: Fasting Required
      hint: Did doctor say to fast
      type: select_one
      options:
      - true
      - false
      - Not Sure
      required: true
    - id: 17
      name: preferred_location
      label: Preferred Location
      hint: Choose lab location
      type: select_one
      options:
      - Main Laboratory
      - Downtown Branch
      - Westside Clinic
      - Northside Center
      - Home Collection
      required: true
    - id: 18
      name: preferred_date
      label: Preferred Date
      hint: First choice
      type: date
      options: []
      required: true
    - id: 19
      name: preferred_time
      label: Preferred Time
      hint: What time works best
      type: time
      options: []
      required: true
    - id: 20
      name: alternate_date
      label: Alternate Date
      hint: Second choice
      type: date
      options: []
      required: false
    - id: 21
      name: urgency
      label: Test Urgency
      hint: How soon is test needed
      type: select_one
      options:
      - Routine
      - Urgent
      - STAT
      required: true
    - id: 22
      name: difficult_draw
      label: Difficult Blood Draw
      hint: Do you have difficult veins
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 23
      name: special_needs
      label: Special Needs
      hint: Any accommodations
      type: text
      options: []
      required: false
    - id: 24
      name: how_to_receive_results
      label: How to Receive Results
      hint: Preference for results
      type: select_one
      options:
      - Online Portal
      - Email
      - Phone Call
      - Mail
      - Through Doctor
      required: true
    - id: 25
      name: additional_notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
