inputSchema:
  type: object
  properties:
    title: Booking Form With Tip Option
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: We will send booking confirmation here
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: service_type
      label: Service Type
      hint: What service would you like to book
      type: select_one
      options:
      - Cleaning
      - Delivery
      - Consultation
      - Repair
      - Event Setup
      - Other
      required: true
    - id: 5
      name: booking_date
      label: Preferred Booking Date
      hint: When do you need the service
      type: date
      options: []
      required: true
    - id: 6
      name: booking_time
      label: Preferred Time
      hint: What time works best
      type: select_one
      options:
      - 8:00 AM - 10:00 AM
      - 10:00 AM - 12:00 PM
      - 12:00 PM - 2:00 PM
      - 2:00 PM - 4:00 PM
      - 4:00 PM - 6:00 PM
      - 6:00 PM - 8:00 PM
      required: true
    - id: 7
      name: service_duration
      label: Estimated Service Duration
      hint: How long will the service take
      type: select_one
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-3 hours
      - 3-4 hours
      - 4+ hours
      required: true
    - id: 8
      name: location_address
      label: Service Location Address
      hint: Where should we provide the service
      type: text
      options: []
      required: true
    - id: 9
      name: service_description
      label: Service Description
      hint: Tell us what you need
      type: text
      options: []
      required: true
    - id: 10
      name: service_cost
      label: Estimated Service Cost
      hint: Total cost of the service
      type: number
      options: []
      required: true
    - id: 11
      name: tip_percentage
      label: Tip Amount
      hint: Add a tip for excellent service
      type: select_one
      options:
      - No tip
      - 10%
      - 15%
      - 20%
      - 25%
      - Custom amount
      required: false
    - id: 12
      name: custom_tip
      label: Custom Tip Amount
      hint: If you selected custom amount
      type: number
      options: []
      required: false
    - id: 13
      name: payment_method
      label: Payment Method
      hint: How would you like to pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - Cash
      - Bank transfer
      - PayPal
      required: true
    - id: 14
      name: special_instructions
      label: Special Instructions
      hint: Any special requests or notes
      type: text
      options: []
      required: false
    - id: 15
      name: total_amount
      label: Total Amount with Tip
      hint: Final amount to be paid
      type: number
      options: []
      required: true
