inputSchema:
  type: object
  properties:
    title: Playdate Reservation Form
    pages:
    - id: 1
      name: parent_info
      label: Parent Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date
      label: Date
      hint: Format is DD MMM YYYY
      type: date
      options: []
      required: false
    - id: 3
      name: time
      label: Time
      hint: 4 digit time in 24 hour
      type: time
      options: []
      required: false
    - id: 4
      name: child_name
      label: Child Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: age_range
      label: Age Range
      hint: Select the child's age range
      type: select_one
      options:
      - 0-5
      - 6-12
      - 13-18
      required: false
    - id: 6
      name: allergies
      label: Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: parent_email
      label: Parent Email
      hint: Format is email
      type: email
      options: []
      required: false
    - id: 9
      name: parent_phone
      label: Parent Phone
      hint: Format is phone
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - Consent 1
      - Consent 2
      - Consent 3
      required: false
    - id: 12
      name: schedule
      label: Schedule
      hint: Select the schedule
      type: select_multiple
      options:
      - Schedule 1
      - Schedule 2
      - Schedule 3
      required: false
