inputSchema:
  type: object
  properties:
    title: DJ Service Information Form
    pages:
    - id: 1
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Wedding
      - Birthday
      - Party
      - Corporate
      - Other
      required: false
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: event_duration
      label: Event Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: music_preferences
      label: Music Preferences
      hint: null
      type: select_multiple
      options:
      - Rock
      - Pop
      - Hip-Hop
      - Electronic
      required: false
    - id: 8
      name: equipment
      label: Equipment
      hint: null
      type: select_multiple
      options:
      - Sound System
      - Lighting
      - DJ Console
      - Other
      required: false
