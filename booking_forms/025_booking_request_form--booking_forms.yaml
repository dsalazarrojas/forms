inputSchema:
  type: object
  properties:
    title: Booking Request Form
    pages:
    - id: 1
      name: guest_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: guest_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: guest_email
      label: Email Address
      hint: We will send confirmation here
      type: email
      options: []
      required: true
    - id: 4
      name: guest_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: arrival_date
      label: Arrival Date
      hint: When do you plan to arrive
      type: date
      options: []
      required: true
    - id: 6
      name: departure_date
      label: Departure Date
      hint: When do you plan to leave
      type: date
      options: []
      required: true
    - id: 7
      name: number_of_guests
      label: Number of Guests
      hint: Total number of people
      type: number
      options: []
      required: true
    - id: 8
      name: room_type
      label: Preferred Room Type
      hint: What type of room do you want
      type: select_one
      options:
      - Single room
      - Double room
      - Twin room
      - Family room
      - Suite
      - Deluxe room
      - Any available
      required: true
    - id: 9
      name: number_of_rooms
      label: Number of Rooms
      hint: How many rooms do you need
      type: number
      options: []
      required: true
    - id: 10
      name: airport_transfer
      label: Airport Transfer Needed
      hint: Do you need airport transfer
      type: select_one
      options:
      - Yes, arrival only
      - Yes, departure only
      - Yes, both arrival and departure
      - No, not needed
      required: true
    - id: 11
      name: arrival_flight
      label: Arrival Flight Number
      hint: If using airport transfer
      type: text
      options: []
      required: false
    - id: 12
      name: arrival_time
      label: Arrival Time
      hint: When will you arrive
      type: time
      options: []
      required: false
    - id: 13
      name: departure_flight
      label: Departure Flight Number
      hint: If using airport transfer
      type: text
      options: []
      required: false
    - id: 14
      name: special_requests
      label: Special Requests
      hint: Any special needs or preferences
      type: text
      options: []
      required: false
    - id: 15
      name: additional_services
      label: Additional Services Needed
      hint: Select any additional services
      type: select_multiple
      options:
      - Room service
      - Housekeeping
      - Late checkout
      - Early checkin
      - Parking
      - Laundry service
      - Restaurant reservation
      required: false
