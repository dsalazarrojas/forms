inputSchema:
  type: object
  properties:
    title: Book Your Financial Strategy Session
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: We will send confirmation here
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: For session coordination
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: false
    - id: 5
      name: occupation
      label: Occupation
      hint: Your current occupation
      type: text
      options: []
      required: true
    - id: 6
      name: annual_income
      label: Annual Income Range
      hint: Select your income range
      type: select_one
      options:
      - Under $50000
      - $50000-$75000
      - $75000-$100000
      - $100000-$150000
      - $150000-$250000
      - Over $250000
      required: false
    - id: 7
      name: employment_status
      label: Employment Status
      hint: Select your status
      type: select_one
      options:
      - Employed Full-Time
      - Employed Part-Time
      - Self-Employed
      - Business Owner
      - Retired
      - Student
      - Not Currently Employed
      required: true
    - id: 8
      name: marital_status
      label: Marital Status
      hint: Select your status
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      - Domestic Partnership
      required: false
    - id: 9
      name: dependents
      label: Number of Dependents
      hint: How many dependents do you have
      type: number
      options: []
      required: false
    - id: 10
      name: session_type
      label: Type of Session
      hint: Select the session type
      type: select_one
      options:
      - Retirement Planning
      - Investment Strategy
      - Tax Planning
      - Estate Planning
      - Debt Management
      - Budget Planning
      - Comprehensive Financial Plan
      - Other
      required: true
    - id: 11
      name: financial_goals
      label: Your Financial Goals
      hint: Select your primary goals
      type: select_multiple
      options:
      - Save for Retirement
      - Pay Off Debt
      - Build Emergency Fund
      - Save for Education
      - Buy a Home
      - Start a Business
      - Estate Planning
      - Investment Growth
      - Tax Optimization
      required: true
    - id: 12
      name: current_investments
      label: Do You Have Current Investments
      hint: Select if you have investments
      type: select_one
      options:
      - Yes significant portfolio
      - Yes small portfolio
      - 401k or IRA only
      - No investments
      required: false
    - id: 13
      name: risk_tolerance
      label: Risk Tolerance
      hint: How comfortable are you with risk
      type: select_one
      options:
      - Very Conservative
      - Conservative
      - Moderate
      - Aggressive
      - Very Aggressive
      - Not Sure
      required: false
    - id: 14
      name: retirement_timeline
      label: When Do You Plan to Retire
      hint: Your retirement timeline
      type: select_one
      options:
      - Already Retired
      - Within 5 years
      - 5-10 years
      - 10-20 years
      - Over 20 years
      - Not Planning to Retire
      required: false
    - id: 15
      name: preferred_session_date
      label: Preferred Session Date
      hint: When would you like to meet
      type: date
      options: []
      required: true
    - id: 16
      name: preferred_session_time
      label: Preferred Time
      hint: What time works best
      type: time
      options: []
      required: true
    - id: 17
      name: session_format
      label: Session Format
      hint: How would you like to meet
      type: select_one
      options:
      - Video Call
      - Phone Call
      - In Person
      - No Preference
      required: true
    - id: 18
      name: timezone
      label: Your Timezone
      hint: Select your timezone
      type: select_one
      options:
      - Eastern Time
      - Central Time
      - Mountain Time
      - Pacific Time
      - Alaska Time
      - Hawaii Time
      - Other
      required: true
    - id: 19
      name: current_financial_advisor
      label: Do You Currently Have a Financial Advisor
      hint: Your current advisor status
      type: select_one
      options:
      - true
      - false
      - Had One in the Past
      required: false
    - id: 20
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: How did you find our services
      type: select_one
      options:
      - Search Engine
      - Social Media
      - Referral
      - Website
      - Seminar or Event
      - Podcast
      - Other
      required: false
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any other information to share
      type: text
      options: []
      required: false
    - id: 22
      name: terms_agreement
      label: I Agree to Consultation Terms
      hint: By selecting yes you agree to terms
      type: select_one
      options:
      - Yes I agree
      - No I do not agree
      required: true
    - id: 23
      name: privacy_policy_agreement
      label: I Agree to Privacy Policy
      hint: By selecting yes you agree to privacy terms
      type: select_one
      options:
      - Yes I agree
      - No I do not agree
      required: true
    - id: 24
      name: booking_date
      label: Booking Date
      hint: Date of booking
      type: date
      options: []
      required: true
