inputSchema:
  type: object
  properties:
    title: Beauty Hub Booking Confirmation Form
    pages:
    - id: 1
      name: booking_header
      label: -- Booking Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: booking_id
      label: Booking ID
      hint: Reference number
      type: text
      options: []
      required: true
    - id: 6
      name: appointment_header
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Haircut
      - Color
      - Treatment
      - Makeup
      - Skincare
      - Nail
      - Massage
      - Other
      required: true
    - id: 10
      name: duration
      label: Appointment Duration
      hint: null
      type: select_one
      options:
      - 15 minutes
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      required: true
    - id: 11
      name: therapist_stylist
      label: Therapist or Stylist Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: location_header
      label: -- Location Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: salon_location
      label: Salon or Studio Location
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: address
      label: Full Address
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: phone_location
      label: Location Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: parking_available
      label: Parking Available
      hint: null
      type: select_one
      options:
      - Yes - Free
      - Yes - Paid
      - Limited
      - 'No'
      required: true
    - id: 17
      name: payment_header
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: service_cost
      label: Service Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: deposit_paid
      label: Deposit Paid
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Debit Card
      - PayPal
      - Apple Pay
      - Google Pay
      required: true
    - id: 21
      name: cancellation_header
      label: -- Cancellation Policy --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: cancellation_policy
      label: Cancellation Policy
      hint: 24 hours notice required, etc.
      type: text
      options: []
      required: true
    - id: 23
      name: cancellation_understands
      label: I Understand the Cancellation Policy
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: confirmation_header
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: confirmation_method
      label: How Would You Like Confirmation
      hint: null
      type: select_one
      options:
      - Email
      - SMS Text
      - Phone Call
      - Both Email and SMS
      required: true
    - id: 26
      name: special_requests
      label: Special Requests or Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 27
      name: terms_agreement
      label: I Agree to the Terms and Conditions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
