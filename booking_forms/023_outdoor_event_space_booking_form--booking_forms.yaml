inputSchema:
  type: object
  properties:
    title: Outdoor Event Space Booking Form
    pages:
    - id: 1
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Outdoor event
      - Indoor event
      - Conference
      - Meeting
      - Wedding
      required: false
    - id: 2
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: venue_name
      label: Venue Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: space_number
      label: Space Number
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: event_description
      label: Event Description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: event_capacity
      label: Event Capacity
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: event_space_availability
      label: Event Space Availability
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: event_space_booking_fee
      label: Event Space Booking Fee
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: event_terms
      label: Event Terms
      hint: null
      type: text
      options: []
      required: false
