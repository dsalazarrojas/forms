inputSchema:
  type: object
  properties:
    title: Airbnb Guest Check Out Form
    pages:
    - id: 1
      name: guest_first_name
      label: First Name
      hint: Guest first name
      type: text
      options: []
      required: true
    - id: 2
      name: guest_last_name
      label: Last Name
      hint: Guest last name
      type: text
      options: []
      required: true
    - id: 3
      name: reservation_number
      label: Reservation Number
      hint: Booking reference
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: check_out_date
      label: Check-out Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 7
      name: check_out_time
      label: Check-out Time
      hint: Departure time
      type: time
      options: []
      required: true
    - id: 8
      name: number_of_nights
      label: Number of Nights Stayed
      hint: Total nights
      type: number
      options: []
      required: true
    - id: 9
      name: keys_returned
      label: Keys Returned
      hint: Have all keys been returned
      type: select_one
      options:
      - Yes, all keys
      - Yes, keyless entry
      - No, keys lost
      required: true
    - id: 10
      name: appliances_turned_off
      label: Appliances Turned Off
      hint: Are all appliances off
      type: select_one
      options:
      - Yes, all off
      - Yes, except refrigerator
      - 'False'
      required: true
    - id: 11
      name: windows_closed
      label: Windows and Doors Closed
      hint: Are all secured
      type: select_one
      options:
      - Yes, all closed and locked
      - 'False'
      required: true
    - id: 12
      name: lights_turned_off
      label: Lights Turned Off
      hint: Are all lights off
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: ac_heating_adjusted
      label: AC Heating Adjusted
      hint: Thermostat set appropriately
      type: select_one
      options:
      - Yes, set to energy saving
      - Yes, turned off
      - 'False'
      required: true
    - id: 14
      name: trash_disposed
      label: Trash Disposed
      hint: Has trash been taken out
      type: select_one
      options:
      - Yes, all trash removed
      - Yes, placed in bins
      - 'False'
      required: true
    - id: 15
      name: dishes_cleaned
      label: Dishes Cleaned
      hint: Kitchen cleanup status
      type: select_one
      options:
      - Yes, washed and put away
      - Yes, in dishwasher
      - 'False'
      required: true
    - id: 16
      name: towels_used
      label: Used Towels
      hint: Towel handling
      type: select_one
      options:
      - Placed in bathroom floor
      - Placed in bathtub
      - In laundry basket
      - Other
      required: true
    - id: 17
      name: linens_stripped
      label: Bed Linens
      hint: Were linens stripped
      type: select_one
      options:
      - Yes, stripped and placed in basket
      - Yes, left on beds
      - 'False'
      required: false
    - id: 18
      name: food_removed
      label: Food Removed
      hint: Perishables handled
      type: select_one
      options:
      - Yes, all food removed
      - Yes, non-perishables left
      - 'False'
      required: true
    - id: 19
      name: damages_reported
      label: Damages During Stay
      hint: Any damages to report
      type: select_one
      options:
      - No damages
      - Minor damage, reported
      - Damage, not yet reported
      required: true
    - id: 20
      name: damage_description
      label: Damage Description
      hint: Describe any damages
      type: text
      options: []
      required: false
    - id: 21
      name: items_lost
      label: Items Lost or Broken
      hint: Any host items affected
      type: text
      options: []
      required: false
    - id: 22
      name: overall_experience
      label: Overall Experience
      hint: Rate your stay
      type: select_one
      options:
      - Excellent
      - Very good
      - Good
      - Fair
      - Poor
      required: true
    - id: 23
      name: cleanliness_rating
      label: Cleanliness Rating
      hint: Rate property cleanliness
      type: select_one
      options:
      - Excellent
      - Very good
      - Good
      - Fair
      - Poor
      required: true
    - id: 24
      name: accuracy_rating
      label: Accuracy Rating
      hint: Did property match listing
      type: select_one
      options:
      - Exactly as described
      - Mostly as described
      - Somewhat as described
      - Not as described
      required: true
    - id: 25
      name: communication_rating
      label: Host Communication
      hint: Rate host communication
      type: select_one
      options:
      - Excellent
      - Very good
      - Good
      - Fair
      - Poor
      required: true
    - id: 26
      name: location_rating
      label: Location Rating
      hint: Rate the location
      type: select_one
      options:
      - Excellent
      - Very good
      - Good
      - Fair
      - Poor
      required: true
    - id: 27
      name: value_rating
      label: Value Rating
      hint: Rate value for money
      type: select_one
      options:
      - Excellent
      - Very good
      - Good
      - Fair
      - Poor
      required: true
    - id: 28
      name: would_recommend
      label: Would Recommend
      hint: Would you recommend to others
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Not sure
      - Probably no
      - Definitely no
      required: true
    - id: 29
      name: would_return
      label: Would Return
      hint: Would you stay again
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Not sure
      - Probably no
      - Definitely no
      required: true
    - id: 30
      name: highlights
      label: Highlights of Your Stay
      hint: What did you enjoy most
      type: text
      options: []
      required: false
    - id: 31
      name: improvements
      label: Areas for Improvement
      hint: What could be better
      type: text
      options: []
      required: false
    - id: 32
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 33
      name: guest_signature
      label: Guest Signature
      hint: Digital signature
      type: text
      options: []
      required: true
