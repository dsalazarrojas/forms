inputSchema:
  type: object
  properties:
    title: Hotel Booking Quotation Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: dates
      label: Dates
      hint: null
      type: select_multiple
      options:
      - Checkin
      - Checkout
      - Arrival Date
      - Departure Date
      required: false
    - id: 3
      name: guest_info
      label: Guest Info
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: special_requests
      label: Special Requests
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Other
      required: true
    - id: 5
      name: accommodation_preferences
      label: Accommodation Preferences
      hint: null
      type: select_multiple
      options:
      - Single
      - Double
      - Suite
      - Other
      required: true
    - id: 6
      name: payment_terms
      label: Payment Terms
      hint: null
      type: select_multiple
      options:
      - Net
      - Vat
      - Other
      required: true
    - id: 7
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
