inputSchema:
  type: object
  properties:
    title: Pet Boarding Reservation Form
    pages:
    - id: 1
      name: reservation_date
      label: Reservation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: pet_name
      label: pet name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: owner_name
      label: owner name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: pet_breed
      label: pet breed
      hint: null
      type: select_one
      options:
      - Labrador
      - German Shepherd
      - Golden Retriever
      - Poodle
      - Mixed
      required: true
    - id: 5
      name: reservation_length
      label: reservation length
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: boarding_services
      label: boarding services
      hint: null
      type: select_multiple
      options:
      - Standard Boarding
      - Luxury Boarding
      - Both
      required: true
    - id: 7
      name: special_instructions
      label: special instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_number
      label: contact number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: owner_notes
      label: owner notes
      hint: null
      type: text
      options: []
      required: false
