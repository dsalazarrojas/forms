inputSchema:
  type: object
  properties:
    title: Aesthetics Clinic Online Daily Deal Booking Form
    pages:
    - id: 1
      name: deal_selection_header
      label: -- Choose Your Deal --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: daily_deal
      label: Select Today's Deal
      hint: Limited availability per day.
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      required: true
    - id: 3
      name: deal_code
      label: Promo Code (if applicable)
      hint: Enter code from social media or email.
      type: text
      options: []
      required: false
    - id: 4
      name: client_info_header
      label: -- Client Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: email
      label: Email Address
      hint: Confirmation will be sent here.
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: appointment_scheduling_header
      label: -- Schedule Appointment --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: preferred_date
      label: Preferred Date
      hint: Must be within 30 days of purchase.
      type: date
      options: []
      required: true
    - id: 11
      name: preferred_time
      label: Preferred Time
      hint: Select a time slot.
      type: select_one
      options:
      - Morning (9am - 12pm)
      - Afternoon (12pm - 4pm)
      - Evening (4pm - 7pm)
      required: true
    - id: 12
      name: payment_info_header
      label: -- Secure Your Deal --
      hint: Full payment required to book deal.
      type: note
      options: []
      required: false
    - id: 13
      name: total_amount
      label: Total Amount ($)
      hint: Reflects deal price.
      type: number
      options: []
      required: true
    - id: 14
      name: card_number
      label: Credit Card Number
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: expiry_date
      label: Expiry Date (MM/YY)
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: cvv
      label: CVV
      hint: 3 digits on back.
      type: text
      options: []
      required: true
    - id: 17
      name: terms_conditions
      label: Terms & Conditions
      hint: Deals are non-refundable but transferable.
      type: select_one
      options:
      - I Agree
      - Other
      required: true
