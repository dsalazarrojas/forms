inputSchema:
  type: object
  properties:
    title: Bookings Contact Form Salon
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: We will send booking confirmation here
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: preferred_salon_location
      label: Preferred Salon Location
      hint: Which salon location
      type: select_one
      options:
      - Downtown
      - Uptown
      - Shopping mall
      - Suburb location
      required: true
    - id: 5
      name: service_type
      label: Service Type
      hint: What service do you want
      type: select_one
      options:
      - Haircut
      - Hair color
      - Highlights
      - Hair treatment
      - Styling
      - Manicure
      - Pedicure
      - Other
      required: true
    - id: 6
      name: preferred_stylist
      label: Preferred Stylist
      hint: Any specific stylist preference
      type: text
      options: []
      required: false
    - id: 7
      name: appointment_date
      label: Preferred Appointment Date
      hint: When would you like to come
      type: date
      options: []
      required: true
    - id: 8
      name: appointment_time
      label: Preferred Time
      hint: What time works best
      type: select_one
      options:
      - 8:00 AM - 9:00 AM
      - 9:00 AM - 10:00 AM
      - 10:00 AM - 11:00 AM
      - 11:00 AM - 12:00 PM
      - 2:00 PM - 3:00 PM
      - 3:00 PM - 4:00 PM
      - 4:00 PM - 5:00 PM
      - 5:00 PM - 6:00 PM
      required: true
    - id: 9
      name: service_duration
      label: Expected Duration
      hint: How long will the service take
      type: select_one
      options:
      - 30 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      - 2.5 hours
      - 3 hours
      required: true
    - id: 10
      name: first_time_client
      label: Are you a new client
      hint: First time at our salon
      type: select_one
      options:
      - true
      - false
      - Not sure
      required: true
    - id: 11
      name: specific_requests
      label: Specific Requests or Notes
      hint: Any special requests about your service
      type: text
      options: []
      required: false
    - id: 12
      name: hair_type
      label: Hair Type
      hint: Your hair type or texture
      type: select_one
      options:
      - Straight
      - Wavy
      - Curly
      - Coily
      - Not sure
      required: false
    - id: 13
      name: confirmation_method
      label: Confirmation Method
      hint: How should we confirm your appointment
      type: select_one
      options:
      - Phone call
      - Email
      - SMS
      - Either
      required: true
    - id: 14
      name: referral_source
      label: How did you hear about us
      hint: Where did you find our salon
      type: select_one
      options:
      - Google search
      - Social media
      - Friend recommendation
      - Previous visit
      - Advertising
      - Other
      required: false
