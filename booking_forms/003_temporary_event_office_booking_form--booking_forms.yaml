inputSchema:
  type: object
  properties:
    title: Temporary Event Office Booking Form
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: event_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: event_time
      label: event_time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: event_type
      label: event_type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Meeting''}'
      - '{''id'': 2, ''label'': ''Conference''}'
      - '{''id'': 3, ''label'': ''Seminar''}'
      - '{''id'': 4, ''label'': ''Training''}'
      - '{''id'': 5, ''label'': ''Workshop''}'
      required: true
    - id: 5
      name: office_booking
      label: Office Booking
      hint: Please select all that apply, separated by commas.
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''8:00 AM - 9:00 AM''}'
      - '{''id'': 2, ''label'': ''9:00 AM - 12:00 PM''}'
      - '{''id'': 3, ''label'': ''12:00 PM - 3:00 PM''}'
      - '{''id'': 4, ''label'': ''3:00 PM - 6:00 PM''}'
      required: false
    - id: 6
      name: attendee_count
      label: Attendees
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: event_comments
      label: Event Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: event_comments_2
      label: Event Comments 2
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
