inputSchema:
  type: object
  properties:
    title: yoga_class_booking_form
    pages:
    - id: 1
      name: participant_name
      label: participant_name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: participant_email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: start_time
      label: participant_start_time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: class_selection
      label: class_selection
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 5
      name: payment_selection
      label: payment_selection
      hint: null
      type: select_multiple
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 6
      name: note
      label: participant_note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: chat_selection
      label: chat_selection
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Specified
      required: true
    - id: 8
      name: assigned_tool
      label: assigned_tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
