inputSchema:
  type: object
  properties:
    title: Air Duct Cleaning Appointment Request Form
    pages:
    - id: 1
      name: contact_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: address
      label: Property Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: system_details_header
      label: -- System Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: num_vents
      label: Number of Vents (Approx)
      hint: Count supply and return vents
      type: select_one
      options:
      - 1-10
      - 11-20
      - 21-30
      - 31+
      required: true
    - id: 8
      name: system_age
      label: System Age
      hint: Years
      type: select_one
      options:
      - New - 5 years
      - 5 - 10 years
      - 10 - 20 years
      - 20+ years
      required: false
    - id: 9
      name: last_cleaning
      label: Last Cleaning Date
      hint: If known
      type: date
      options: []
      required: false
    - id: 10
      name: scheduling_header
      label: -- Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: preferred_date_1
      label: Preferred Date 1
      hint: First choice
      type: date
      options: []
      required: true
    - id: 12
      name: preferred_date_2
      label: Preferred Date 2
      hint: Backup choice
      type: date
      options: []
      required: false
    - id: 13
      name: comments
      label: Special Instructions
      hint: Pets, gate codes, specific concerns
      type: text
      options: []
      required: false
