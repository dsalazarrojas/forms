inputSchema:
  type: object
  properties:
    title: College Equipment Booking Form
    pages:
    - id: 1
      name: requester_name
      label: Your Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: requester_email
      label: Email Address
      hint: School email preferred
      type: email
      options: []
      required: true
    - id: 3
      name: requester_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: requester_type
      label: Your Status
      hint: Affiliation
      type: select_one
      options:
      - Undergraduate Student
      - Graduate Student
      - Faculty
      - Staff
      - Researcher
      - Other
      required: true
    - id: 5
      name: student_id
      label: Student or Employee ID
      hint: ID number
      type: text
      options: []
      required: true
    - id: 6
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: true
    - id: 7
      name: course_name
      label: Course Name
      hint: If for class
      type: text
      options: []
      required: false
    - id: 8
      name: course_number
      label: Course Number
      hint: Course code
      type: text
      options: []
      required: false
    - id: 9
      name: instructor_name
      label: Instructor Name
      hint: Professor name
      type: text
      options: []
      required: false
    - id: 10
      name: booking_date
      label: Booking Request Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 11
      name: equipment_category
      label: Equipment Category
      hint: Type of equipment
      type: select_one
      options:
      - Audio Equipment
      - Video Equipment
      - Photography Equipment
      - Computing Equipment
      - Laboratory Equipment
      - Presentation Equipment
      - Sports Equipment
      - Other
      required: true
    - id: 12
      name: equipment_items
      label: Specific Equipment Items
      hint: What do you need
      type: select_multiple
      options:
      - Digital Camera
      - Video Camera
      - Tripod
      - Microphone
      - Audio Recorder
      - Projector
      - Laptop
      - Tablet
      - Microscope
      - Telescope
      - 3D Printer
      - Laser Cutter
      - VR Headset
      - Other
      required: true
    - id: 13
      name: equipment_details
      label: Equipment Details
      hint: Specific models or requirements
      type: text
      options: []
      required: false
    - id: 14
      name: quantity
      label: Quantity Needed
      hint: How many items
      type: number
      options: []
      required: true
    - id: 15
      name: pickup_date
      label: Pickup Date
      hint: When collecting
      type: date
      options: []
      required: true
    - id: 16
      name: pickup_time
      label: Pickup Time
      hint: Preferred time
      type: time
      options: []
      required: true
    - id: 17
      name: return_date
      label: Return Date
      hint: When returning
      type: date
      options: []
      required: true
    - id: 18
      name: return_time
      label: Return Time
      hint: Preferred time
      type: time
      options: []
      required: true
    - id: 19
      name: rental_duration
      label: Rental Duration
      hint: Total time
      type: select_one
      options:
      - Same Day
      - 1-3 Days
      - 4-7 Days
      - 1-2 Weeks
      - 2-4 Weeks
      - Over 4 Weeks
      required: true
    - id: 20
      name: purpose_of_use
      label: Purpose of Use
      hint: What for
      type: select_one
      options:
      - Class Project
      - Research
      - Thesis or Dissertation
      - Student Organization Event
      - Personal Project
      - Teaching
      - Department Event
      - Other
      required: true
    - id: 21
      name: purpose_details
      label: Purpose Details
      hint: Describe your project
      type: text
      options: []
      required: true
    - id: 22
      name: location_of_use
      label: Where Will Equipment Be Used
      hint: Location
      type: text
      options: []
      required: true
    - id: 23
      name: off_campus_use
      label: Will Equipment Leave Campus
      hint: Off-campus use
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 24
      name: off_campus_approval
      label: Off-Campus Approval
      hint: If applicable
      type: select_one
      options:
      - Approved by Department
      - Pending Approval
      - Not Applicable
      required: false
    - id: 25
      name: training_required
      label: Equipment Training Required
      hint: Do you need training
      type: select_one
      options:
      - Yes I Need Training
      - No I Am Trained
      - Not Applicable
      required: true
    - id: 26
      name: training_completed
      label: Have You Completed Required Training
      hint: If applicable
      type: select_one
      options:
      - true
      - false
      - Not Required
      required: false
    - id: 27
      name: accessories_needed
      label: Accessories Needed
      hint: Cables, cases, etc
      type: text
      options: []
      required: false
    - id: 28
      name: special_requirements
      label: Special Requirements
      hint: Any special needs
      type: text
      options: []
      required: false
    - id: 29
      name: estimated_value
      label: Estimated Equipment Value Acknowledgment
      hint: You understand equipment value
      type: select_one
      options:
      - Yes I Understand
      - Other
      required: true
    - id: 30
      name: liability_agreement
      label: Liability Agreement
      hint: Responsible for damage
      type: select_one
      options:
      - Yes I Agree
      - false
      required: true
    - id: 31
      name: care_agreement
      label: Equipment Care Agreement
      hint: Will handle with care
      type: select_one
      options:
      - Yes I Agree
      - false
      required: true
    - id: 32
      name: late_fee_acknowledgment
      label: Late Fee Acknowledgment
      hint: Fees for late return
      type: select_one
      options:
      - Yes I Understand
      - false
      required: true
    - id: 33
      name: replacement_cost
      label: Replacement Cost Acknowledgment
      hint: Pay for lost or damaged items
      type: select_one
      options:
      - Yes I Understand
      - false
      required: true
    - id: 34
      name: booking_status
      label: Booking Status
      hint: Request status
      type: select_one
      options:
      - Pending Approval
      - Approved
      - Denied
      required: true
    - id: 35
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
