inputSchema:
  type: object
  properties:
    title: Bike Booking Form
    pages:
    - id: 1
      name: booking_details_header
      label: -- Booking Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rental_start_date
      label: Pick-up Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: rental_end_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: pick_up_time
      label: Preferred Pick-up Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: bike_category
      label: Select Bike Category
      hint: null
      type: select_one
      options:
      - Standard Cruiser
      - Premium Road Bike
      - Mountain Bike
      - Tandem Bike
      - Kids Bike
      required: true
    - id: 6
      name: number_of_bikes
      label: Number of Bikes
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: rider_height
      label: Rider Height
      hint: To help us select the right frame size
      type: text
      options: []
      required: true
    - id: 8
      name: accessories_header
      label: -- Accessories --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: additional_equipment
      label: Additional Equipment Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Helmet
      - Bike Lock
      - Repair Kit
      - Pannier Bags
      - Child Seat
      required: false
    - id: 10
      name: contact_info_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: email_address
      label: Email Address
      hint: For booking confirmation
      type: email
      options: []
      required: true
    - id: 13
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: terms_agreement
      label: I agree to the rental terms and conditions
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
