      options: []
      required: false
    - id: 6
      name: tour_requestor_info
      label: Tour Requestor Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: Email
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: Phone number
      type: text
      options: []
      required: false
    - id: 10
      name: follow_up
      label: Follow-up
      hint: Follow-up method
      type: select_one
      options:
      - Phone
      - Email
      - In-app
      required: false
