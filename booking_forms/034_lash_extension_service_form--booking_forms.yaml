inputSchema:
  type: object
  properties:
    title: Lash Extension Service Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: service
      label: Service
      hint: null
      type: select_one
      options:
      - '{''label'': ''Classic Lashes'', ''value'': 1}'
      - '{''label'': ''Volume Lashes'', ''value'': 2}'
      - '{''label'': ''Hybrid Lashes'', ''value'': 3}'
      required: true
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: technician
      label: Technician
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Technician 1'', ''value'': 1}'
      - '{''label'': ''Technician 2'', ''value'': 2}'
      - '{''label'': ''Technician 3'', ''value'': 3}'
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - '{''label'': ''User'', ''value'': ''User''}'
      - '{''label'': ''Jim'', ''value'': ''Jim''}'
      required: false
    - id: 11
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: service_duration
      label: Service Duration
      hint: null
      type: select_multiple
      options:
      - '{''label'': 15, ''value'': 15}'
      - '{''label'': 30, ''value'': 30}'
      - '{''label'': 60, ''value'': 60}'
      required: false
