inputSchema:
  type: object
  properties:
    title: nick_baldwin_booking_form
    pages:
    - id: 1
      name: artist_info
      label: Artist Information
      hint: Please fill in your information
      type: text
      options: []
      required: false
    - id: 2
      name: contact_request
      label: Request
      hint: Please fill in your contact request
      type: text
      options: []
      required: true
    - id: 3
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - event guest speaker
      - musical performance
      - panel discussion
      required: true
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: note
      label: Note
      hint: Additional information
      type: text
      options: []
      required: false
    - id: 7
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - phone
      - email
      - text
      required: true
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
