inputSchema:
  type: object
  properties:
    title: Artist Booking (Updated)
    pages:
    - id: 1
      name: section_header_1
      label: -- Booking Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_organizer
      label: Event Organizer Name
      hint: Name of person booking the artist
      type: text
      options: []
      required: true
    - id: 3
      name: organizer_email
      label: Organizer Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: organizer_phone
      label: Organizer Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: organization_name
      label: Organization or Venue Name
      hint: Company or venue organizing the event
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_2
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_name
      label: Event Name or Title
      hint: What is the event called?
      type: text
      options: []
      required: true
    - id: 8
      name: event_type
      label: Type of Event
      hint: What kind of event is this?
      type: select_one
      options:
      - Concert or Music Festival
      - Wedding
      - Corporate Event
      - Private Party
      - Club or Bar Performance
      - Fair or Market
      - Charity Event
      - Theatre or Comedy Show
      - Conference
      - Other
      required: true
    - id: 9
      name: event_date
      label: Event Date
      hint: What date is the event?
      type: date
      options: []
      required: true
    - id: 10
      name: event_start_time
      label: Event Start Time
      hint: What time should the event begin?
      type: time
      options: []
      required: true
    - id: 11
      name: performance_time
      label: Requested Performance Time
      hint: What time should you perform?
      type: time
      options: []
      required: true
    - id: 12
      name: performance_duration
      label: Performance Duration
      hint: How long should the performance be?
      type: select_one
      options:
      - 30 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      - 2.5 hours
      - 3 hours
      - Custom duration
      required: true
    - id: 13
      name: section_header_3
      label: -- Venue and Location --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: venue_name
      label: Venue Name
      hint: Name of the location
      type: text
      options: []
      required: true
    - id: 15
      name: venue_address
      label: Venue Address
      hint: Full address of the venue
      type: text
      options: []
      required: true
    - id: 16
      name: venue_city
      label: City
      hint: City where the venue is located
      type: text
      options: []
      required: true
    - id: 17
      name: section_header_4
      label: -- Artist Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: artist_type
      label: Type of Artist Needed
      hint: What kind of artist are you looking for?
      type: select_one
      options:
      - Solo Musician
      - Band
      - DJ
      - Comedian
      - Speaker
      - Dancer
      - Multiple Artists
      - Flexible
      required: true
    - id: 19
      name: genre_preference
      label: Preferred Genre or Style
      hint: What music style or performance type?
      type: text
      options: []
      required: false
    - id: 20
      name: section_header_5
      label: -- Booking Terms --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: budget
      label: Budget for Performance (GBP)
      hint: What is your budget?
      type: number
      options: []
      required: true
    - id: 22
      name: travel_distance
      label: Travel Distance
      hint: How far is the venue?
      type: text
      options: []
      required: false
    - id: 23
      name: additional_details
      label: Additional Event Details or Requirements
      hint: Any special requests or information
      type: text
      options: []
      required: false
    - id: 24
      name: date_confirmation
      label: Is This Date Flexible?
      hint: Can the date be adjusted if needed?
      type: select_one
      options:
      - Fixed date
      - Somewhat flexible
      - Very flexible
      required: false
    - id: 25
      name: followup_instructions
      label: How Would You Like Us to Follow Up?
      hint: Preferred contact method
      type: select_one
      options:
      - Email
      - Phone
      - Text Message
      - Any method
      required: true
