inputSchema:
  type: object
  properties:
    title: Motel Booking Form
    pages:
    - id: 1
      name: basic_info
      label: Basic Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: booking_type
      label: Booking Type
      hint: null
      type: select_one
      options:
      - Hotel Stay
      - Room Service
      - Breakfast Incl
      - Bed & Breakfast
      required: false
    - id: 3
      name: accommodation
      label: Accommodation
      hint: null
      type: select_multiple
      options:
      - Single Room
      - Double Room
      - Family Room
      - Suite
      required: false
    - id: 4
      name: num_rooms
      label: Number of Rooms
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: num_adults
      label: Number of Adults
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: num_children
      label: Number of Children
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: checkin
      label: Check In
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: checkout
      label: Check Out
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: Please provide your comments here
      type: text
      options: []
      required: false
