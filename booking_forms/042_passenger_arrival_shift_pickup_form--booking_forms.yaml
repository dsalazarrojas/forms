inputSchema:
  type: object
  properties:
    title: Passenger Arrival Shift Pickup Form
    pages:
    - id: 1
      name: arrival_details
      label: Arrival Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: passenger_name
      label: Passenger Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: preferred_shift
      label: Preferred Shift
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: arrival_time_zone
      label: Arrival Time Zone
      hint: null
      type: select_one
      options:
      - EST
      - PST
      - CST
      - MST
      required: false
    - id: 8
      name: flight_number
      label: Flight Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: travel_document
      label: Travel Document
      hint: null
      type: text
      options: []
      required: false
