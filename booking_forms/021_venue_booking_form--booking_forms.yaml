      name: event_services
      label: Event Services
      hint: null
      type: select_multiple
      options:
      - catering
      - accommodations
      - other
      required: false
    - id: 12
      name: event_status
      label: Event Status
      hint: null
      type: select_one
      options:
      - booked
      - pending
      - cancelled
      required: false
