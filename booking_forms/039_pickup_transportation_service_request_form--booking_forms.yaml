inputSchema:
  type: object
  properties:
    title: pickup_transportation_service_request_form
    pages:
    - id: 1
      name: pickup_request
      label: Pickup Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pickup_date
      label: pickup_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: pickup_time
      label: pickup_time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: transportation_type
      label: Transportation Type
      hint: null
      type: select_one
      options:
      - Taxi
      - Uber
      - Lyft
      - Public Transit
      required: false
    - id: 5
      name: pickup_address
      label: pickup_address
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: drop_off_location
      label: drop_off_location
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: special_requests
      label: special_requests
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
