inputSchema:
  type: object
  properties:
    title: Book Your UI/UX Mentoring Session
    pages:
    - id: 1
      name: mentee_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: We will send confirmation here
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: For session coordination
      type: text
      options: []
      required: false
    - id: 4
      name: current_role
      label: Current Role or Title
      hint: Your current job title
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Your company or organization
      type: text
      options: []
      required: false
    - id: 6
      name: experience_level
      label: Experience Level
      hint: Select your experience level
      type: select_one
      options:
      - Beginner 0-1 years
      - Intermediate 1-3 years
      - Mid-Level 3-5 years
      - Senior 5-10 years
      - Expert 10 Plus years
      required: true
    - id: 7
      name: current_skills
      label: Current Skills
      hint: Select your current skills
      type: select_multiple
      options:
      - User Research
      - Wireframing
      - Prototyping
      - Visual Design
      - Interaction Design
      - Usability Testing
      - Design Systems
      - Figma
      - Sketch
      - Adobe XD
      required: false
    - id: 8
      name: mentoring_focus
      label: Mentoring Focus Area
      hint: What do you want to focus on
      type: select_one
      options:
      - Career Guidance
      - Portfolio Review
      - Skill Development
      - Design Process
      - Interview Preparation
      - Project Feedback
      - Design Systems
      - Leadership Skills
      required: true
    - id: 9
      name: specific_goals
      label: Your Specific Goals
      hint: What do you want to achieve
      type: text
      options: []
      required: true
    - id: 10
      name: current_challenges
      label: Current Challenges
      hint: What challenges are you facing
      type: text
      options: []
      required: true
    - id: 11
      name: portfolio_url
      label: Portfolio URL
      hint: Link to your portfolio if available
      type: text
      options: []
      required: false
    - id: 12
      name: linkedin_url
      label: LinkedIn Profile URL
      hint: Link to your LinkedIn
      type: text
      options: []
      required: false
    - id: 13
      name: preferred_session_date
      label: Preferred Session Date
      hint: When would you like to meet
      type: date
      options: []
      required: true
    - id: 14
      name: preferred_session_time
      label: Preferred Time
      hint: What time works best
      type: time
      options: []
      required: true
    - id: 15
      name: session_duration
      label: Session Duration
      hint: How long do you want
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      required: true
    - id: 16
      name: session_format
      label: Session Format
      hint: How would you like to meet
      type: select_one
      options:
      - Video Call
      - Phone Call
      - In Person
      - No Preference
      required: true
    - id: 17
      name: timezone
      label: Your Timezone
      hint: Select your timezone
      type: select_one
      options:
      - Eastern Time
      - Central Time
      - Mountain Time
      - Pacific Time
      - Alaska Time
      - Hawaii Time
      - Other
      required: true
    - id: 18
      name: previous_mentoring
      label: Have You Had Mentoring Before
      hint: Your previous experience
      type: select_one
      options:
      - Yes currently have a mentor
      - Yes in the past
      - No this is my first
      required: false
    - id: 19
      name: how_did_you_hear
      label: How Did You Hear About This Mentoring
      hint: How did you find out
      type: select_one
      options:
      - Search Engine
      - Social Media
      - Referral
      - Website
      - LinkedIn
      - Design Community
      - Other
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other information to share
      type: text
      options: []
      required: false
    - id: 21
      name: terms_agreement
      label: I Agree to Mentoring Terms
      hint: By selecting yes you agree to terms
      type: select_one
      options:
      - Yes I agree
      - No I do not agree
      required: true
    - id: 22
      name: booking_date
      label: Booking Date
      hint: Date of booking
      type: date
      options: []
      required: true
