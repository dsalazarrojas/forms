inputSchema:
  type: object
  properties:
    title: Animation Editing Workstation Booking Form
    pages:
    - id: 1
      name: user_info_header
      label: -- User Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: For booking confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: employee_id
      label: Employee ID or Department
      hint: Your ID or department name
      type: text
      options: []
      required: false
    - id: 6
      name: booking_header
      label: -- Workstation Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: workstation_selection
      label: Select Workstation
      hint: Choose the workstation you need
      type: select_one
      options:
      - Workstation A - Color Suite
      - Workstation B - VFX Station
      - Workstation C - Compositing Desk
      - Workstation D - Motion Graphics
      - Workstation E - Audio Editing
      - Workstation F - Preview Theater
      - Any Available Station
      required: true
    - id: 8
      name: workstation_specs
      label: Required Workstation Specifications
      hint: Any specific technical requirements
      type: select_multiple
      options:
      - High-Resolution Monitor
      - Color-Calibrated Display
      - GPU Acceleration
      - Extra RAM
      - Multi-Monitor Setup
      - Audio Equipment
      - Networking Capability
      required: false
    - id: 9
      name: booking_date_header
      label: -- Booking Date and Time --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: booking_date
      label: Booking Date
      hint: Select the date you need the workstation
      type: date
      options: []
      required: true
    - id: 11
      name: start_time
      label: Start Time
      hint: What time do you need to begin
      type: time
      options: []
      required: true
    - id: 12
      name: end_time
      label: End Time
      hint: When will you finish
      type: time
      options: []
      required: true
    - id: 13
      name: duration_header
      label: -- Duration and Purpose --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: booking_purpose
      label: Purpose of Booking
      hint: What will you be doing
      type: select_one
      options:
      - Color Correction
      - Visual Effects Work
      - Compositing
      - Motion Graphics
      - Editing
      - Audio Mixing
      - Client Review
      - Training
      - Rendering Farm Work
      - Other
      required: true
    - id: 15
      name: project_description
      label: Project Description
      hint: Briefly describe your project
      type: text
      options: []
      required: false
    - id: 16
      name: special_requirements_header
      label: -- Special Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: software_needed
      label: Specific Software Required
      hint: What software do you need to use
      type: select_multiple
      options:
      - Adobe Premiere
      - Adobe After Effects
      - Avid Media Composer
      - DaVinci Resolve
      - Nuke
      - Maya
      - Blender
      - Autodesk Flame
      - Pro Tools
      - Other
      required: false
    - id: 18
      name: file_format_needs
      label: File Format Requirements
      hint: What formats will you be working with
      type: select_multiple
      options:
      - ProRes
      - DNxHD
      - H.264
      - RAW
      - DPX
      - EXR
      - Quicktime
      - Other
      required: false
    - id: 19
      name: additional_equipment
      label: Additional Equipment Needed
      hint: Any special equipment or peripherals
      type: text
      options: []
      required: false
    - id: 20
      name: collaboration_header
      label: -- Collaboration and Access --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: number_of_users
      label: Number of People Using Workstation
      hint: How many people will use this workstation
      type: select_one
      options:
      - 1 person
      - 2 people
      - 3 people
      - 4 people
      - 5+ people
      required: true
    - id: 22
      name: access_level
      label: Required Access Level
      hint: What access do you need
      type: select_one
      options:
      - Full Access
      - Read-Only Access
      - Limited Access
      - Client Preview Only
      required: false
    - id: 23
      name: recurring_header
      label: -- Recurring Bookings --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: recurring_booking
      label: Is this a recurring booking
      hint: Do you need this workstation regularly
      type: select_one
      options:
      - One-time booking
      - Weekly recurring
      - Bi-weekly recurring
      - Monthly recurring
      - Multiple dates needed
      required: true
    - id: 25
      name: special_notes
      label: Special Notes or Comments
      hint: Any additional information
      type: text
      options: []
      required: false
