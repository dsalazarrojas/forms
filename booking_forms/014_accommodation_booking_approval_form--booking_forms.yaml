inputSchema:
  type: object
  properties:
    title: Accommodation Booking Approval Form
    pages:
    - id: 1
      name: section_guest_info
      label: -- Guest Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: guest_name
      label: Guest Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: guest_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: guest_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company_or_organization
      label: Company or Organization (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_booking_details
      label: -- Booking Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: property_name
      label: Property or Accommodation Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: room_type
      label: Room Type Requested
      hint: null
      type: select_one
      options:
      - Single room
      - Double room
      - Suite
      - Studio apartment
      - One-bedroom apartment
      - Shared dormitory
      - Other
      required: true
    - id: 9
      name: check_in_date
      label: Check-In Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: check_out_date
      label: Check-Out Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: purpose_of_stay
      label: Purpose of Stay
      hint: null
      type: select_one
      options:
      - Business travel
      - Conference or event
      - Vacation or leisure
      - Relocation
      - Training or workshop
      - Other
      required: true
    - id: 13
      name: special_requests
      label: Special Requests or Requirements
      hint: e.g., accessibility needs, dietary requirements, late check-in
      type: text
      options: []
      required: false
    - id: 14
      name: section_payment
      label: -- Payment and Budget --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: estimated_cost
      label: Estimated Total Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Company credit card
      - Purchase order
      - Personal payment (reimbursable)
      - Direct billing
      - Other
      required: true
    - id: 17
      name: budget_code
      label: Budget Code or Cost Center
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: section_approval
      label: -- Approval --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: approver_name
      label: Approver Name
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: approval_status
      label: Approval Status
      hint: null
      type: select_one
      options:
      - Approved
      - Pending review
      - Denied
      - Requires modification
      required: true
    - id: 21
      name: approval_notes
      label: Approval Notes or Comments
      hint: null
      type: text
      options: []
      required: false
