inputSchema:
  type: object
  properties:
    title: Hotel Booking Form Template
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: guest_email
      label: Guest Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: departure_date
      label: Departure Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: room_type
      label: Room Type
      hint: null
      type: select_one
      options:
      - Single Room
      - Double Room
      - Family Room
      required: false
    - id: 7
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: card_type
      label: Card Type
      hint: null
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      required: false
    - id: 9
      name: card_number
      label: Card Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: cvv
      label: CVV/CVV2
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
