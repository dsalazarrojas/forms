inputSchema:
  type: object
  properties:
    title: Urban Hotel Suite Reservation Form
    pages:
    - id: 1
      name: guest_info_form
      label: Guest Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: room_services_form
      label: Room And Services
      hint: Select the type of room and services you require.
      type: select_one
      options:
      - Double Room
      - Single Room
      - Suite
      required: true
    - id: 3
      name: payment_info_form
      label: Payment Information
      hint: Select the payment method and provide details.
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 4
      name: payment_details_form
      label: Payment Details
      hint: Enter the payment details below.
      type: text
      options: []
      required: true
    - id: 5
      name: confirm_booking_form
      label: Confirm Booking
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: contact_us_form
      label: Contact Us
      hint: We'd love to know about any special requests or questions you have.
      type: text
      options: []
      required: false
    - id: 7
      name: phone_number_form
      label: Phone Number
      hint: Please enter your phone number.
      type: text
      options: []
      required: true
    - id: 8
      name: email_form
      label: Email
      hint: Please enter your email address.
      type: email
      options: []
      required: true
