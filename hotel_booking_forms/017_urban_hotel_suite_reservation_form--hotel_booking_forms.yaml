      type: note
      options: []
      required: false
    - id: 12
      name: confirm_phone_form
      label: Confirm Phone Number
      hint: Confirm the phone number.
      type: text
      options: []
      required: true
    - id: 13
      name: confirm_email_form
      label: Confirm Email
      hint: Confirm the email address.
      type: email
      options: []
      required: true
    - id: 14
      name: confirm_date_form
      label: Confirm Date
      hint: Confirm the date.
      type: date
      options: []
      required: true
    - id: 15
