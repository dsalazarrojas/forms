inputSchema:
  type: object
  properties:
    title: Athlete Evaluation Form
    pages:
      - id: 1
        name: athlete_name
        label: Athlete Full Name
        hint: First and last name
        type: text
        options: []
        required: true
      - id: 2
        name: athlete_id
        label: Athlete ID Number
        hint: Student or team identification number
        type: text
        options: []
        required: false
      - id: 3
        name: evaluation_date
        label: Evaluation Date
        hint: Date of this evaluation
        type: date
        options: []
        required: true
      - id: 4
        name: evaluator_name
        label: Evaluator Name
        hint: Name of coach or evaluator
        type: text
        options: []
        required: true
      - id: 5
        name: evaluator_role
        label: Evaluator Role
        hint: Your role with the team
        type: select_one
        options:
          - Head Coach
          - Assistant Coach
          - Position Coach
          - Athletic Director
          - Scout
          - Other
        required: true
      - id: 6
        name: sport
        label: Sport
        hint: Sport being evaluated
        type: select_one
        options:
          - Football
          - Basketball
          - Soccer
          - Track and Field
          - Swimming
          - Volleyball
          - Baseball
          - Softball
          - Tennis
          - Other
        required: true
      - id: 7
        name: position
        label: Primary Position
        hint: Athlete primary position
        type: text
        options: []
        required: true
      - id: 8
        name: evaluation_type
        label: Type of Evaluation
        hint: What type of evaluation is this
        type: select_one
        options:
          - Pre-Season
          - Mid-Season
          - Post-Season
          - Tryout Evaluation
          - Recruitment Evaluation
          - Periodic Check-in
        required: true
      - id: 9
        name: skill_rating
        label: Technical Skill Rating
        hint: Rate technical abilities
        type: select_one
        options:
          - Excellent
          - Above Average
          - Average
          - Below Average
          - Needs Improvement
        required: true
      - id: 10
        name: physical_rating
        label: Physical Attributes Rating
        hint: Rate physical abilities
        type: select_one
        options:
          - Excellent
          - Above Average
          - Average
          - Below Average
          - Needs Improvement
        required: true
      - id: 11
        name: mental_rating
        label: Mental Toughness Rating
        hint: Rate mental game
        type: select_one
        options:
          - Excellent
          - Above Average
          - Average
          - Below Average
          - Needs Improvement
        required: true
      - id: 12
        name: teamwork_rating
        label: Teamwork Rating
        hint: Rate ability to work with team
        type: select_one
        options:
          - Excellent
          - Above Average
          - Average
          - Below Average
          - Needs Improvement
        required: true
      - id: 13
        name: coachability_rating
        label: Coachability Rating
        hint: Rate responsiveness to coaching
        type: select_one
        options:
          - Excellent
          - Above Average
          - Average
          - Below Average
          - Needs Improvement
        required: true
      - id: 14
        name: work_ethic_rating
        label: Work Ethic Rating
        hint: Rate dedication and effort
        type: select_one
        options:
          - Excellent
          - Above Average
          - Average
          - Below Average
          - Needs Improvement
        required: true
      - id: 15
        name: leadership_qualities
        label: Leadership Qualities
        hint: Does the athlete demonstrate leadership
        type: select_one
        options:
          - Strong Leader
          - Emerging Leader
          - Follows Well
          - Needs Development
        required: true
      - id: 16
        name: strengths
        label: Key Strengths
        hint: List the athlete top strengths
        type: text
        options: []
        required: true
      - id: 17
        name: weaknesses
        label: Areas for Improvement
        hint: List areas needing development
        type: text
        options: []
        required: true
      - id: 18
        name: recommendations
        label: Recommendations
        hint: Suggested next steps for development
        type: text
        options: []
        required: true
      - id: 19
        name: overall_assessment
        label: Overall Assessment
        hint: Summary evaluation of the athlete
        type: text
        options: []
        required: true
      - id: 20
        name: recommendation_level
        label: Overall Recommendation
        hint: Would you recommend this athlete
        type: select_one
        options:
          - Highly Recommend
          - Recommend
          - Recommend with Reservations
          - Do Not Recommend
        required: true
      - id: 21
        name: evaluator_signature
        label: Evaluator Signature
        hint: Type full name as signature
        type: text
        options: []
        required: true
