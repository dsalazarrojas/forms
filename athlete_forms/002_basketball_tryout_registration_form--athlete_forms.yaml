      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: student_grade
      label: Grade Level
      hint: null
      type: select_one
      options:
      - Freshman
      - Sophomore
      - Junior
      - Senior
      required: true
    - id: 6
      name: contact_section
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: parent_name
      label: Parent/Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: parent_phone
      label: Parent/Guardian Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: physical_section
      label: -- Physical Measurements --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: height
      label: Height (inches)
      hint: Approximate height
      type: number
      options: []
      required: true
    - id: 13
      name: weight
      label: Weight (pounds)
      hint: Approximate weight
      type: number
      options: []
      required: true
    - id: 14
      name: basketball_section
      label: -- Basketball Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: position
