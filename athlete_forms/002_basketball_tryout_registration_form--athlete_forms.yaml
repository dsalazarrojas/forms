      name: medical_conditions
      label: Any Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: injuries
      label: Previous Injuries
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any information you'd like us to know
      type: text
      options: []
      required: false
