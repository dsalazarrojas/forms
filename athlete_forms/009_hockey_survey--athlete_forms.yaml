inputSchema:
  type: object
  properties:
    title: Hockey Survey
    pages:
    - id: 1
      name: hockey_survey_form
      label: hockey_survey_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: experience
      label: experience
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 3
      name: training_frequency
      label: training_frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 4
      name: training_time_of_day
      label: training_time_of_day
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 5
      name: equipment
      label: equipment
      hint: null
      type: select_multiple
      options:
      - Stick
      - Puck
      - Skates
      required: false
    - id: 6
      name: training_duration
      label: training_duration
      hint: null
      type: select_multiple
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-4 hours
      required: false
    - id: 7
      name: feedback
      label: feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
