      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: event_checkin_form_2
      label: Event Checkin Form 2
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: athlete_info_form_2
      label: Athlete Info Form 2
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
