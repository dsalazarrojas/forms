inputSchema:
  type: object
  properties:
    title: Baseball League Registration Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: player_first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: player_last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_header_2
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: parent_guardian_name
      label: Parent/Guardian name (if under 18)
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: parent_phone
      label: Parent/Guardian phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact
      label: Emergency contact name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_phone
      label: Emergency contact phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: section_header_3
      label: -- Baseball Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: age_division
      label: Age division or experience level
      hint: null
      type: select_one
      options:
      - Youth (Under 12)
      - Teen (13-17)
      - Adult (18-40)
      - Senior (40+)
      required: true
    - id: 14
      name: position_primary
      label: Primary position
      hint: null
      type: select_one
      options:
      - Pitcher
      - Catcher
      - Infielder
      - Outfielder
      - Designated Hitter
      - Utility
      required: true
    - id: 15
      name: position_secondary
      label: Secondary position
      hint: null
      type: select_one
      options:
      - Pitcher
      - Catcher
      - Infielder
      - Outfielder
      - Designated Hitter
      - Utility
      - None
      required: false
    - id: 16
      name: years_experience
      label: Years of baseball experience
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: section_header_4
      label: -- Team Preference and Availability --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: preferred_team
      label: Preferred team (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: availability
      label: Are you available for all league games and practices?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Most Games
      - Limited Availability
      required: true
    - id: 20
      name: section_header_5
      label: -- Health and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: medical_conditions
      label: Any medical conditions we should know about?
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: insurance_verification
      label: Do you have sports injury insurance?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: false
    - id: 23
      name: waiver_agreement
      label: I agree to the league waiver and terms of play
      hint: null
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 24
      name: confirmation
      label: I confirm all information is accurate
      hint: null
      type: select_one
      options:
      - I Confirm
      - I Need to Review
      required: true
