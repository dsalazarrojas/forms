      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: confirm_enrollment
      label: Confirm Enrollment
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 13
      name: enrollments
      label: Enrollments
      hint: Please confirm enrollment
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
