inputSchema:
  type: object
  properties:
    title: Athletes Support Fundraising Form
    pages:
    - id: 1
      name: donor_name
      label: Donor Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: donor_email
      label: Email Address
      hint: Contact email for receipt
      type: email
      options: []
      required: true
    - id: 3
      name: donor_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 4
      name: donor_address
      label: Street Address
      hint: Mailing address
      type: text
      options: []
      required: false
    - id: 5
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: false
    - id: 6
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: false
    - id: 7
      name: zip_code
      label: ZIP Code
      hint: ZIP or postal code
      type: text
      options: []
      required: false
    - id: 8
      name: athlete_name
      label: Athlete Name to Support
      hint: Which athlete are you supporting
      type: text
      options: []
      required: true
    - id: 9
      name: athlete_team
      label: Athlete Team
      hint: Team name
      type: text
      options: []
      required: true
    - id: 10
      name: sport
      label: Sport
      hint: Sport the athlete plays
      type: select_one
      options:
      - Football
      - Basketball
      - Soccer
      - Track and Field
      - Swimming
      - Volleyball
      - Baseball
      - Softball
      - Tennis
      - Other
      required: true
    - id: 11
      name: fundraising_campaign
      label: Fundraising Campaign
      hint: Which campaign is this for
      type: select_one
      options:
      - General Team Support
      - Equipment Fund
      - Travel Fund
      - Tournament Fees
      - Facility Improvements
      - Scholarship Fund
      - Specific Athlete Support
      - Other
      required: true
    - id: 12
      name: donation_amount
      label: Donation Amount in USD
      hint: Amount to donate
      type: number
      options: []
      required: true
    - id: 13
      name: donation_frequency
      label: Donation Frequency
      hint: Is this a one-time or recurring donation
      type: select_one
      options:
      - One-Time Donation
      - Monthly
      - Quarterly
      - Annually
      required: true
    - id: 14
      name: payment_method
      label: Payment Method
      hint: How would you like to pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Bank Transfer
      - Check
      - Cash
      required: true
    - id: 15
      name: card_type
      label: Card Type
      hint: Type of card
      type: select_one
      options:
      - Visa
      - MasterCard
      - American Express
      - Discover
      - Not Applicable
      required: false
    - id: 16
      name: card_number
      label: Card Number
      hint: Enter card number
      type: text
      options: []
      required: false
    - id: 17
      name: expiration_date
      label: Expiration Date
      hint: MM-YYYY
      type: text
      options: []
      required: false
    - id: 18
      name: cvv
      label: CVV
      hint: Security code
      type: text
      options: []
      required: false
    - id: 19
      name: cardholder_name
      label: Cardholder Name
      hint: Name on card
      type: text
      options: []
      required: false
    - id: 20
      name: billing_address
      label: Billing Address
      hint: Billing address for card
      type: text
      options: []
      required: false
    - id: 21
      name: employer_matching
      label: Employer Matching Gift
      hint: Will your employer match this donation
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Sure
      required: true
    - id: 22
      name: tribute_donation
      label: Tribute Donation
      hint: Is this donation in honor or memory of someone
      type: select_one
      options:
      - 'No'
      - In Honor Of
      - In Memory Of
      required: true
    - id: 23
      name: tribute_name
      label: Tribute Name
      hint: Name of person being honored
      type: text
      options: []
      required: false
    - id: 24
      name: tax_receipt
      label: Tax Receipt
      hint: Would you like a tax-deductible receipt
      type: select_one
      options:
      - Yes - Email
      - Yes - Mail
      - 'No'
      required: true
    - id: 25
      name: newsletter_signup
      label: Newsletter Signup
      hint: Would you like to receive updates
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any message for the athlete or team
      type: text
      options: []
      required: false
    - id: 27
      name: referral_source
      label: How Did You Hear About This Fundraiser
      hint: Source of referral
      type: select_one
      options:
      - Social Media
      - Email
      - Friend or Family
      - Team Website
      - Event
      - Other
      required: false
