inputSchema:
  type: object
  properties:
    title: Commercial Photo Release Form
    pages:
    - id: 1
      name: section_model_info
      label: -- Model/Subject Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: model_name
      label: Model Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: model_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: model_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: model_address
      label: Mailing Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_shoot_details
      label: -- Photography Shoot Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: photographer_name
      label: Photographer or Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: shoot_date
      label: Date of Photography/Recording
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: shoot_location
      label: Location of Shoot
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: section_release_terms
      label: -- Consent and Release Terms --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: usage_rights_consent
      label: I grant permission for commercial use of my image and recordings
      hint: null
      type: select_one
      options:
      - I Grant Permission
      - Other
      required: true
    - id: 12
      name: royalties_waived
      label: I understand that I am waiving any rights to future royalties
      hint: null
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 13
      name: compensation_details
      label: Agreed Compensation
      hint: Flat fee, hourly rate, or TFP (Trade for Print)
      type: text
      options: []
      required: true
    - id: 14
      name: signature_confirmation_model
      label: Model Signature (Type Name)
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: true
