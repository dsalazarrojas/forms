inputSchema:
  type: object
  properties:
    title: Artifact Display Release Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Lender Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: lender_name
      label: Lender Name
      hint: Name of the artifact owner or lender
      type: text
      options: []
      required: true
    - id: 3
      name: lender_contact_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: lender_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: lender_address
      label: Address
      hint: Mailing address
      type: text
      options: []
      required: true
    - id: 6
      name: lender_organization
      label: Organization or Institution (if applicable)
      hint: Company, museum, or other affiliation
      type: text
      options: []
      required: false
    - id: 7
      name: section_header_2
      label: -- Artifact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: artifact_name
      label: Artifact Name or Title
      hint: What is this artifact called?
      type: text
      options: []
      required: true
    - id: 9
      name: artifact_description
      label: Description of Artifact
      hint: Detailed description of the item
      type: text
      options: []
      required: true
    - id: 10
      name: artifact_type
      label: Type of Artifact
      hint: Category or classification
      type: select_one
      options:
      - Painting
      - Sculpture
      - Textile
      - Furniture
      - Historical Document
      - Collectible Item
      - Museum Piece
      - Cultural Object
      - Other
      required: true
    - id: 11
      name: artifact_dimensions
      label: Dimensions or Size
      hint: Height, width, depth, weight as relevant
      type: text
      options: []
      required: false
    - id: 12
      name: artifact_condition
      label: Current Condition
      hint: Describe the condition of the artifact
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Restoration
      required: true
    - id: 13
      name: section_header_3
      label: -- Display Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: display_location
      label: Display Location
      hint: Museum, gallery, school, or event venue
      type: text
      options: []
      required: true
    - id: 15
      name: display_period_start
      label: Display Start Date
      hint: When will the artifact be displayed?
      type: date
      options: []
      required: true
    - id: 16
      name: display_period_end
      label: Display End Date
      hint: Until when will it be displayed?
      type: date
      options: []
      required: true
    - id: 17
      name: section_header_4
      label: -- Permissions and Photography --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: photography_permitted
      label: Photography of Artifact Permitted
      hint: Can photos be taken for display and promotion?
      type: select_one
      options:
      - Yes, unlimited photography
      - Yes, with restrictions
      - No, no photography
      - Flash photography prohibited only
      required: true
    - id: 19
      name: promotional_use
      label: Use of Images for Promotion
      hint: Can images be used in promotional materials?
      type: select_one
      options:
      - Yes, all promotional uses
      - Yes, with conditions
      - No promotional use
      required: true
    - id: 20
      name: section_header_5
      label: -- Insurance and Liability --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: insurance_coverage
      label: Lender Will Provide Insurance
      hint: Will you insure the artifact during display?
      type: select_one
      options:
      - Yes, lender will insure
      - No, venue will insure
      - No insurance needed
      required: true
    - id: 22
      name: estimated_value
      label: Estimated Value of Artifact
      hint: Approximate monetary value
      type: number
      options: []
      required: false
    - id: 23
      name: section_header_6
      label: -- Agreement and Signature --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: lender_consent
      label: I consent to the display of this artifact
      hint: Confirm permission for the display
      type: select_one
      options:
      - Yes, I Consent
      - No, I Do Not Consent
      required: true
    - id: 25
      name: signature_date
      label: Date of Signature
      hint: Date this release is executed
      type: date
      options: []
      required: true
