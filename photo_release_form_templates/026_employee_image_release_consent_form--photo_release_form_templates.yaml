inputSchema:
  type: object
  properties:
    title: Employee Image Release Consent Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_id_number
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_release
      label: Date of Release
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: employee_photo
      label: Employee Photo
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: company_uses
      label: We can use this information for
      hint: null
      type: select_one
      options:
      - Website and marketing materials
      - Email and mail
      - Intranet and social media
      - None of the above
      required: false
    - id: 6
      name: employee_photo_release_consent
      label: I give permission
      hint: null
      type: select_one
      options:
      - to use my name, photo, and image
      - only in the above listed options
      - neither the company nor I
      required: false
    - id: 7
      name: release_date
      label: If yes, the photo will be used until
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: signature
      label: Signature of Employee
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
