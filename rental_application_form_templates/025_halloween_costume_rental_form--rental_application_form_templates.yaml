inputSchema:
  type: object
  properties:
    title: Halloween Costumer Rental Form
    pages:
    - id: 1
      name: customer_information
      label: Customer Information
      hint: Please provide your details
      type: text
      options: []
      required: true
    - id: 2
      name: price
      label: Price
      hint: Select your budget
      type: number
      options: []
      required: false
    - id: 3
      name: preferred_costume
      label: Preferred Costume
      hint: What costume do you like?
      type: select_one
      options:
      - Pumpkin
      - Ghost
      - Zombie
      - Vampire
      - Superman
      required: false
    - id: 4
      name: group_affiliation
      label: Group Affiliation
      hint: Select your group affiliation
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 5
      name: date
      label: Date
      hint: Select your preferred date
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: Select your preferred time
      type: time
      options: []
      required: false
    - id: 7
      name: note
      label: Note
      hint: Any additional information
      type: text
      options: []
      required: false
    - id: 8
      name: contact_information
      label: Contact Information
      hint: Please provide your contact details
      type: text
      options: []
      required: true
