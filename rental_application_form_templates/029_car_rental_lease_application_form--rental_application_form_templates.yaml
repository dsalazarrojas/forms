inputSchema:
  type: object
  properties:
    title: Car Rental & Lease Application Form
    pages:
    - id: 1
      name: applicant_personal_info_header_rental
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_full_name_rental
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_dob_rental
      label: Date of Birth
      hint: To verify age and eligibility
      type: date
      options: []
      required: true
    - id: 4
      name: applicant_email_rental
      label: Email Address
      hint: For rental status updates
      type: email
      options: []
      required: true
    - id: 5
      name: applicant_phone_rental
      label: Phone Number
      hint: Primary contact for the rental
      type: text
      options: []
      required: true
    - id: 6
      name: driver_license_number_rental
      label: Driver's License Number
      hint: (Valid state license)
      type: text
      options: []
      required: true
    - id: 7
      name: rental_details_header
      label: -- Rental Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: rental_pickup_date
      label: Preferred Rental Pickup Date
      hint: Select your preferred day
      type: date
      options: []
      required: true
    - id: 9
      name: rental_return_date
      label: Preferred Rental Return Date
      hint: Select your preferred day
      type: date
      options: []
      required: true
    - id: 10
      name: vehicle_type_rental
      label: Preferred Vehicle Type
      hint: Select the type of vehicle you want to rent
      type: select_one
      options:
      - Economy Sedan
      - Luxury SUV
      - Pickup Truck
      - Passenger Van
      - Electric Vehicle
      required: true
    - id: 11
      name: primary_rental_use
      label: Primary Purpose of Rental
      hint: How will the vehicle be used?
      type: select_one
      options:
      - Personal/Vacation
      - Business
      - Replacement for owned vehicle
      - Special Event
      required: true
    - id: 12
      name: rental_mileage_estimate
      label: Estimated Mileage Needed (Total)
      hint: (If known)
      type: number
      options: []
      required: false
    - id: 13
      name: insurance_info_header_rental
      label: -- Insurance Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: personal_insurance_active
      label: Do you have active personal car insurance?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: insurance_provider_rental
      label: Insurance Provider Name
      hint: (If applicable)
      type: text
      options: []
      required: false
    - id: 16
      name: rental_verification_header
      label: -- Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: rental_acknowledgement_lease
      label: I acknowledge the car rental and lease application terms
      hint: See terms of service
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 18
      name: signature_confirmation_rental
      label: Type your name for rental application confirmation
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: additional_rental_comments
      label: Any additional comments or requests?
      hint: Provide more details for the rental
      type: text
      options: []
      required: false
    - id: 20
      name: lease_interest_status
      label: Are you interested in a long-term lease option?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: true
    - id: 21
      name: lease_term_preference
      label: Preferred Lease Term (Months)
      hint: (If applicable)
      type: select_one
      options:
      - 12 Months
      - 24 Months
      - 36 Months
      - 48 Months
      required: false
