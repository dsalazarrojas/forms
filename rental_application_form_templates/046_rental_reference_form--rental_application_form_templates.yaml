      - Unemployed
      - Retired
      - Student
      required: true
    - id: 25
      name: landlord_income
      label: Landlord income
      hint: null
      type: select_one
      options:
      - Less than 20k
      - 20-40k
      - 40-60k
      - More than 60k
      required: true
