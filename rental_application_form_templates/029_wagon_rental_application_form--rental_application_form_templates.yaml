inputSchema:
  type: object
  properties:
    title: Wagon Rental Application Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: vehicle_requests
      label: Vehicle Requests
      hint: Select one or more vehicles to rent
      type: select_one
      options:
      - Wagon
      - Tractor
      - U-Haul
      required: true
    - id: 4
      name: rent_period
      label: Rent Period
      hint: null
      type: select_multiple
      options:
      - Hour
      - Half-Day
      - Day
      - Month
      required: true
    - id: 5
      name: rental_location
      label: Rental Location
      hint: null
      type: select_multiple
      options:
      - On-site
      - Off-site
      - Delivery
      required: false
    - id: 6
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: special_requests
      label: Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: time_signed
      label: Time Signed
      hint: null
      type: time
      options: []
      required: false
