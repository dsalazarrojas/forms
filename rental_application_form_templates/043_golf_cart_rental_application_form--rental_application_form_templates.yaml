inputSchema:
  type: object
  properties:
    title: Golf Cart Rental Application Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: cart_type
      label: Cart Type
      hint: null
      type: select_multiple
      options:
      - golf cart
      - electric cart
      required: true
    - id: 8
      name: cart_quantity
      label: Cart Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: rental_duration
      label: Rental Duration
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
