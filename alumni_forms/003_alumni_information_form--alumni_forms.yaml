      name: news_interest
      label: I would like to receive alumni news and updates
      hint: null
      type: select_one
      options:
      - Yes - Email
      - Yes - Postal Mail
      - Yes - Both
      - No - Thank you
      required: true
    - id: 35
      name: event_notifications
      label: I want to be notified about upcoming alumni events
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 36
      name: directory_listing
      label: Include my information in the alumni directory
      hint: This allows other alumni to connect with you
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 37
      name: additional_notes
      label: Additional Information or Updates
      hint: Share any other information you would like us to know
      type: text
      options: []
      required: false
