    - id: 9
      name: support_channel
      label: Support Channel
      hint: null
      type: select_one
      options:
      - '{''label'': ''Phone''}'
      - '{''label'': ''Email''}'
      - '{''label'': ''Chat''}'
      - '{''label'': ''In Person''}'
      - '{''label'': ''Other''}'
      required: false
    - id: 10
      name: follow_up
      label: Follow Up
      hint: null
      type: date
      options: []
      required: false
