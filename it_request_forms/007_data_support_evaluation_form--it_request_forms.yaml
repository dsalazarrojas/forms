      name: data_support_interaction
      label: Data Support Interaction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very High''}'
      - '{''label'': ''High''}'
      - '{''label'': ''Neutral''}'
      - '{''label'': ''Low''}'
      - '{''label'': ''Very Low''}'
