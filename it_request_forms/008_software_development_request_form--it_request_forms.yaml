inputSchema:
  type: object
  properties:
    title: Software Development Request Form
    pages:
    - id: 1
      name: project_request
      label: Project Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: project_lead
      label: Project Lead
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: project_description
      label: Project Description
      hint: Brief description of the project
      type: text
      options: []
      required: false
    - id: 5
      name: project_deadline
      label: Project Deadline
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: project_priority
      label: Project Priority
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 7
      name: project_budget
      label: Project Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: project_status
      label: Project Status
      hint: null
      type: select_one
      options:
      - Active
      - On Hold
      - Inactive
      required: false
    - id: 9
      name: project_notes
      label: Project Notes
      hint: Add any additional notes about the project
      type: note
      options: []
      required: false
    - id: 10
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: project_manager
      label: Project Manager
      hint: null
      type: select_one
      options:
      - Jimmy
      - Jane
      - Bob
      required: false
