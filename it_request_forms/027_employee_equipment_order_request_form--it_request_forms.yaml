inputSchema:
  type: object
  properties:
    title: Employee Equipment Order Request Form
    pages:
    - id: 1
      name: new_hire
      label: New Hire
      hint: null
      type: select_one
      options:
      - Laptop
      - Mobile Phone
      - Tablet
      required: true
    - id: 2
      name: replacement
      label: Replacement
      hint: null
      type: select_multiple
      options:
      - Desk
      - Chair
      - Desk Lamp
      required: false
    - id: 3
      name: project
      label: Project
      hint: null
