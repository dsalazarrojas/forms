      options:
      - Marketing Campaign
      - Sales Training
      - Product Launch
      required: true
    - id: 4
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: employee_phone
      label: Employee Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Marketing
      - Sales
      - Finance
      required: true
    - id: 8
      name: equipment_name
      label: Equipment Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: date_ordered
      label: Date Ordered
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: date_delivered
      label: Date Delivered
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: approved_by
      label: Approved By
      hint: null
      type: select_one
      options:
      - Jane Doe
      - John Doe
      - Alice Smith
      required: false
