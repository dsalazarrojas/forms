inputSchema:
  type: object
  properties:
    title: Software Engineer Technical Interview Q&A Guide Request Form
    pages:
    - id: 1
      name: form_title
      label: Form Title
      hint: A concise title for the guide.
      type: text
      options: []
      required: true
    - id: 2
      name: description
      label: Description
      hint: Brief description of the request.
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Please enter a valid email address.
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: A phone number for the submitter (optional).
      type: text
      options: []
      required: false
    - id: 5
      name: submitted_by
      label: Submitted By
      hint: Name of the submitter.
      type: text
      options: []
      required: true
    - id: 6
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - chatjimmy (test)
      required: true
    - id: 7
      name: form_id
      label: Form ID
      hint: A unique identifier for the form.
      type: number
      options: []
      required: true
    - id: 8
      name: submitted_at
      label: Submitted At
      hint: Date and time of submission (will be auto-filled).
      type: date
      options: []
      required: false
    - id: 9
      name: submitted_to
      label: Submitted To
      hint: Name of the person submitted to.
      type: text
      options: []
      required: false
    - id: 10
      name: form_category
      label: Category
      hint: null
      type: select_one
      options:
      - IT Request Forms
      - Other
      required: true
    - id: 11
      name: output_file
      label: Output File
      hint: A file generated for the submission.
      type: text
      options: []
      required: true
    - id: 12
      name: output_name
      label: Output Name
      hint: Name of the output file.
      type: text
      options: []
      required: true
    - id: 13
      name: output_path
      label: Output Path
      hint: Path where the output file is located.
      type: text
      options: []
      required: false
