inputSchema:
  type: object
  properties:
    title: Business Intelligence Enhancement Request Form
    pages:
    - id: 1
      name: header
      label: -- BI Enhancement Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Name of the person requesting BI enhancements
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For follow up about requirements
      type: email
      options: []
      required: true
    - id: 4
      name: current_toolset
      label: Current toolset
      hint: BI tools currently in use
      type: text
      options: []
      required: false
    - id: 5
      name: enhancement_summary
      label: Enhancement summary
      hint: Describe the proposed enhancement or feature
      type: text
      options: []
      required: true
    - id: 6
      name: desired_outcome
      label: Desired outcome
      hint: What will success look like
      type: text
      options: []
      required: true
    - id: 7
      name: priority
      label: Priority
      hint: Select priority level
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 8
      name: estimated_effort_hours
      label: Estimated effort hours
      hint: Rough estimate of work hours required
      type: number
      options: []
      required: false
    - id: 9
      name: data_sources_affected
      label: Data sources affected
      hint: List major data sources involved
      type: text
      options: []
      required: false
    - id: 10
      name: approval_required
      label: Approval required
      hint: Does this change require executive approval
      type: select_one
      options:
      - true
      - false
      required: false
