inputSchema:
  type: object
  properties:
    title: Sound System Upgrade Request Form
    pages:
    - id: 1
      name: main_page
      label: Upgrade Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: audio_equipment
      label: Audio Equipment
      hint: Which type of audio equipment would you like to upgrade?
      type: select_one
      options:
      - Speaker
      - Microphone
      - Headphones
      required: false
    - id: 3
      name: current_status
      label: Current Status
      hint: null
      type: select_multiple
      options:
      - Available
      - Outdated
      - Broken
      required: false
    - id: 4
      name: reason_upgrading
      label: Reason for Upgrading
      hint: Please provide a brief explanation for upgrading your audio equipment.
      type: text
      options: []
      required: false
    - id: 5
      name: budget
      label: Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submitter
      label: Submitter
      hint: null
      type: text
      options: []
      required: false
