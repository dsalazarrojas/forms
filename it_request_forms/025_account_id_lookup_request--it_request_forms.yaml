inputSchema:
  type: object
  properties:
    title: Account ID Lookup Request
    pages:
    - id: 1
      name: section_requester_info
      label: -- Requester Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: requester_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Customer Service
      - IT Support
      - Sales
      - Billing
      - Account Management
      - Other
      required: true
    - id: 6
      name: section_lookup_details
      label: -- Lookup Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: lookup_reason
      label: Reason for Account ID Lookup
      hint: null
      type: select_one
      options:
      - Customer inquiry
      - Account verification
      - Billing issue
      - Technical support
      - Account recovery
      - Audit or compliance
      - Other
      required: true
    - id: 8
      name: account_holder_name
      label: Account Holder Name
      hint: Full name of the person or organization whose account ID is being looked
        up
      type: text
      options: []
      required: true
    - id: 9
      name: account_holder_email
      label: Account Holder Email Address (if known)
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: account_holder_phone
      label: Account Holder Phone Number (if known)
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: system_or_platform
      label: System or Platform
      hint: Which system should be searched for the account
      type: select_one
      options:
      - CRM
      - Billing system
      - User portal
      - Email system
      - ERP
      - Other
      required: true
    - id: 12
      name: additional_identifiers
      label: Additional Identifying Information
      hint: Any other details to help locate the account (e.g., address, company name,
        registration date)
      type: text
      options: []
      required: false
    - id: 13
      name: urgency
      label: Urgency Level
      hint: null
      type: select_one
      options:
      - Low - Within 3 business days
      - Medium - Within 1 business day
      - High - Within 4 hours
      - Critical - Immediate
      required: true
    - id: 14
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
