inputSchema:
  type: object
  properties:
    title: CrowdStrike Fix Request Form
    pages:
    - id: 1
      name: submit_request
      label: Submit Request
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: issue_description
      label: Issue Description
      hint: Please provide a detailed description of the issue
      type: text
      options: []
      required: false
    - id: 3
      name: issue_priority
      label: Issue Priority
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 4
      name: issue_category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Hardware
      - Software
      - Security
      required: false
    - id: 5
      name: issue_tags
      label: Tags
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: issue_reporter
      label: Issue Reporter
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: assigned_group
      label: Assigned Group
      hint: null
      type: select_one
      options:
      - Team A
      - Team B
      - Team C
      required: false
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
