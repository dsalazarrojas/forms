inputSchema:
  type: object
  properties:
    title: IT Service Request Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_email
      label: User Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: user_phone
      label: User Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: it_request_type
      label: IT Request Type
      hint: null
      type: select_one
      options:
      - Request for IT Support
      - Request for IT Service
      - Request for IT Equipment
      - Request for IT Training
      - Request for IT Consulting
      required: true
    - id: 5
      name: it_request_description
      label: IT Request Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: it_request_priority
      label: prophets
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: it_request_status
      label: Status
      hint: null
      type: select_one
      options:
      - Pending
      - In Progress
      - Resolved
      - Closed
      required: true
    - id: 8
      name: assignee
      label: Assignee
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - Other
      required: true
    - id: 9
      name: assigned_date
      label: Assigned Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: created_date
      label: Created Date
      hint: null
      type: date
      options: []
      required: false
