inputSchema:
  type: object
  properties:
    title: Employee File Access Request Form
    pages:
    - id: 1
      name: employee_request
      label: employee_request
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: employee_name
      label: employee_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: file_type
      label: file_type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: access_level
      label: access_level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 5
      name: request_reason
      label: request_reason
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: manager_approvals
      label: manager_approvals
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: employee_manager
      label: employee_manager
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: department
      label: department
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: team
      label: team
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: file_share
      label: file_share
      hint: null
      type: number
      options: []
      required: false
