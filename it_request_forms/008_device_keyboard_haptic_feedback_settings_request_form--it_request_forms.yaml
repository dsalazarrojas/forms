inputSchema:
  type: object
  properties:
    title: Device Keyboard Haptic Feedback Settings Request Form
    pages:
    - id: 1
      name: user_email
      label: user_email
      hint: null
      type: email
      options: []
      required: false
    - id: 2
      name: device_haptic_feedback_type
      label: device_haptic_feedback_type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: keyboard_model
      label: keyboard_model
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: keyboard_haptic_feedback_level
      label: haptic_feedback_level
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: description
      label: description
      hint: null
      type: text
      options: []
      required: false
