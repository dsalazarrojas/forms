inputSchema:
  type: object
  properties:
    title: Time Flow Diagram Improvement Request
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Operations
      - Engineering
      - Quality
      required: true
    - id: 6
      name: team
      label: Team
      hint: null
      type: select_multiple
      options:
      - Operations
      - Engineering
      - Quality
      required: true
    - id: 7
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - On Hold
      - Closed
      required: true
    - id: 8
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 9
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
