inputSchema:
  type: object
  properties:
    title: it_support_check_in_form
    pages:
    - id: 1
      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: issue_description
      label: Issue Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: issue_priority
      label: Issue Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: submit_date
      label: Submit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: resolution
      label: Resolution
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - chatjimmy
      - another itguy
      required: false
    - id: 8
      name: it_ticket_number
      label: IT Ticket Number
      hint: null
      type: number
      options: []
      required: false
