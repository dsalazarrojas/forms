inputSchema:
  type: object
  properties:
    title: Payroll Portal Access Request Form
    pages:
    - id: 1
      name: user_request
      label: User Request
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: department
      label: Department
      hint: Choose the department you belong to
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: job_function
      label: Job Function
      hint: Enter your current job function
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: manager
      label: Manager
      hint: Enter your manager's name
      type: text
      options: []
      required: false
    - id: 5
      name: reason_for_request
      label: Reason for request
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
