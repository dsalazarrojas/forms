inputSchema:
  type: object
  properties:
    title: System Access Code Request Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: job_title
      label: job_title
      hint: Enter your job title
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: department
      hint: null
      type: select_one
      options:
      - Accounting
      - Engineering
      - HR
      - Marketing
      - Sales
      - Support
      required: false
    - id: 4
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: request_time
      label: Request Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: access_code
      label: Access Code
      hint: Enter your access code
      type: text
      options: []
      required: true
    - id: 7
      name: access_level
      label: Access Level
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 8
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
