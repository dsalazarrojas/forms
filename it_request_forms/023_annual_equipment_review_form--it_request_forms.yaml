inputSchema:
  type: object
  properties:
    title: Annual Equipment Review Form
    pages:
    - id: 1
      name: reviewer_name
      label: Reviewer Full Name
      hint: Person conducting the review
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - IT
      - Operations
      - Facilities
      - Production
      - Research and Development
      - Administration
      - Other
      required: true
    - id: 5
      name: review_date
      label: Review Date
      hint: Date of equipment review
      type: date
      options: []
      required: true
    - id: 6
      name: review_year
      label: Review Year
      hint: Which year is this review for?
      type: select_one
      options:
      - '2026'
      - '2025'
      - '2024'
      - '2023'
      required: true
    - id: 7
      name: equipment_category
      label: Equipment Category
      hint: Type of equipment being reviewed
      type: select_one
      options:
      - Computers and Laptops
      - Servers and Network
      - Manufacturing Equipment
      - Office Equipment
      - Vehicles
      - Tools
      - Safety Equipment
      - Other
      required: true
    - id: 8
      name: equipment_id
      label: Equipment ID
      hint: Asset identification number
      type: text
      options: []
      required: true
    - id: 9
      name: equipment_name
      label: Equipment Name
      hint: Name or description
      type: text
      options: []
      required: true
    - id: 10
      name: manufacturer
      label: Manufacturer
      hint: Equipment manufacturer
      type: text
      options: []
      required: false
    - id: 11
      name: model_number
      label: Model Number
      hint: Equipment model
      type: text
      options: []
      required: false
    - id: 12
      name: serial_number
      label: Serial Number
      hint: Equipment serial number
      type: text
      options: []
      required: false
    - id: 13
      name: purchase_date
      label: Purchase Date
      hint: When was it purchased?
      type: date
      options: []
      required: false
    - id: 14
      name: purchase_cost
      label: Purchase Cost
      hint: Original purchase price
      type: number
      options: []
      required: false
    - id: 15
      name: current_value
      label: Current Value
      hint: Estimated current value
      type: number
      options: []
      required: false
    - id: 16
      name: equipment_condition
      label: Equipment Condition
      hint: Current physical condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Failed
      required: true
    - id: 17
      name: operational_status
      label: Operational Status
      hint: Is equipment functional?
      type: select_one
      options:
      - Fully Operational
      - Partially Operational
      - Non-Operational
      - Under Repair
      required: true
    - id: 18
      name: usage_frequency
      label: Usage Frequency
      hint: How often is it used?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Rarely
      - Not in Use
      required: true
    - id: 19
      name: maintenance_status
      label: Maintenance Status
      hint: Current maintenance status
      type: select_one
      options:
      - Up to Date
      - Due Soon
      - Overdue
      - Not Required
      required: true
    - id: 20
      name: last_maintenance_date
      label: Last Maintenance Date
      hint: When was last service?
      type: date
      options: []
      required: false
    - id: 21
      name: next_maintenance_due
      label: Next Maintenance Due
      hint: When is next service due?
      type: date
      options: []
      required: false
    - id: 22
      name: issues_found
      label: Issues Found
      hint: Any problems identified?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: issue_details
      label: Issue Details
      hint: Describe any issues
      type: text
      options: []
      required: false
    - id: 24
      name: replacement_needed
      label: Replacement Needed
      hint: Does equipment need replacement?
      type: select_one
      options:
      - Yes, Urgent
      - Yes, Soon
      - Considering
      - 'False'
      required: true
    - id: 25
      name: replacement_justification
      label: Replacement Justification
      hint: Why is replacement needed?
      type: text
      options: []
      required: false
    - id: 26
      name: estimated_replacement_cost
      label: Estimated Replacement Cost
      hint: Cost to replace equipment
      type: number
      options: []
      required: false
    - id: 27
      name: disposal_required
      label: Disposal Required
      hint: Does equipment need disposal?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending Decision
      required: false
    - id: 28
      name: recommendations
      label: Recommendations
      hint: Suggested actions
      type: text
      options: []
      required: true
    - id: 29
      name: additional_notes
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
