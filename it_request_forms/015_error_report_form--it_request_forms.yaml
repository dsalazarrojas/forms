inputSchema:
  type: object
  properties:
    title: Error Report Form
    pages:
    - id: 1
      name: error_report_form
      label: Error Report Form
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - IT Request Forms
      - Software Issues
      - Hardware Issues
      - '{''Service IssueschartInstance'': None}'
      required: false
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: issue_date
      label: Issue Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: issue_time
      label: Issue Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: issue_details
      label: Issue Details
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: Tool used to reproduce the issue
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 8
      name: report_date
      label: Report Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: reporter
      label: Reporter
      hint: null
      type: text
      options: []
      required: false
