inputSchema:
  type: object
  properties:
    title: energy_meter_reconfiguration_request_form
    pages:
    - id: 1
      name: user_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: user_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: meter_type
      label: Meter Type
      hint: null
      type: select_one
      options:
      - Electricity
      - Gas
      - Water
      - Other
      required: true
    - id: 5
      name: meter_location
      label: Location
      hint: null
      type: select_multiple
      options:
      - Building A
      - Building B
      - Building C
      - Other
      required: true
    - id: 6
      name: meter_serial_number
      label: Meter Serial Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: reconfiguration_request_type
      label: Reconfiguration Request Type
      hint: null
      type: select_one
      options:
      - Change Configuration
      - Replace Meter
      - Upgrade Meter
      - Other
      required: true
    - id: 8
      name: supporting_documentation
      label: Supporting Documentation
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: meter_readings
      label: Meter Readings
      hint: null
      type: time
      options: []
      required: true
