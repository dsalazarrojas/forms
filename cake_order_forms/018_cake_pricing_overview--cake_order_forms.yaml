inputSchema:
  type: object
  properties:
    title: Cake Pricing Overview
    pages:
    - id: 1
      name: customer_info_header
      label: -- Your Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: event_header
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: event_type
      label: Type of Event
      hint: null
      type: select_one
      options:
      - Birthday
      - Wedding
      - Anniversary
      - Graduation
      - Corporate Event
      - Baby Shower
      - Other
      required: true
    - id: 7
      name: event_date
      label: Planned Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: number_of_servings
      label: Number of Servings Needed
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: cake_design_header
      label: -- Cake Design Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: cake_flavor
      label: Preferred Cake Flavor
      hint: null
      type: select_one
      options:
      - Chocolate
      - Vanilla
      - Strawberry
      - Red Velvet
      - Lemon
      - Carrot Cake
      - Custom
      required: true
    - id: 11
      name: cake_size
      label: Cake Size
      hint: null
      type: select_one
      options:
      - 6 inch
      - 8 inch
      - 10 inch
      - 12 inch
      - Sheet cake
      - Custom
      required: true
    - id: 12
      name: cake_layers
      label: Number of Cake Layers
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: frosting_selection
      label: Frosting Type
      hint: null
      type: select_one
      options:
      - Buttercream
      - Cream Cheese
      - Chocolate Ganache
      - Fondant
      - Whipped Cream
      required: true
    - id: 14
      name: design_complexity_header
      label: -- Design Complexity --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: design_complexity
      label: Design Complexity Level
      hint: null
      type: select_one
      options:
      - Simple
      - Moderate
      - Complex
      - Highly Detailed
      required: true
    - id: 16
      name: special_designs
      label: Special Design Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: delivery_header
      label: -- Delivery and Pickup --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: delivery_method
      label: Delivery or Pickup?
      hint: null
      type: select_one
      options:
      - Pickup
      - Delivery
      required: true
    - id: 19
      name: delivery_address
      label: Delivery Address (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: budget_header
      label: -- Budget Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: budget_range
      label: Budget Range
      hint: null
      type: select_one
      options:
      - Under $50
      - $50 - $100
      - $100 - $200
      - $200 - $400
      - $400+
      required: true
