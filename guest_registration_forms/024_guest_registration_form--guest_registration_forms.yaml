inputSchema:
  type: object
  properties:
    title: Guest Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: checkin_date
      label: Checkin Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: room_type
      label: Room Type
      hint: null
      type: select_one
      options:
      - Single Room
      - Double Room
      - Suite Room
      - Other
      required: false
    - id: 7
      name: check_out_date
      label: Check Out Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: room_number
      label: Room Number
      hint: null
      type: number
      options: []
      required: false
