      type: text
      options: []
      required: false
    - id: 19
      name: doctor_info
      label: Doctor and Insurance Information
      hint: Pediatrician contact and insurance
      type: text
      options: []
      required: true
    - id: 20
      name: expected_behavior
      label: Expected Behavior Guidelines
      hint: How to handle discipline issues
      type: text
      options: []
      required: true
    - id: 21
      name: morning_routine
      label: Morning Routine if Applicable
      hint: Instructions for morning care
      type: text
      options: []
      required: false
    - id: 22
      name: additional_notes
      label: Additional Notes
      hint: Any other important information
      type: text
      options: []
      required: false
