      name: medication_instructions
      label: Medication Instructions
      hint: Any medications to administer
      type: text
      options: []
      required: false
    - id: 13
      name: tv_screen_rules
      label: TV and Screen Time Rules
      hint: What is allowed for entertainment
      type: text
      options: []
      required: true
    - id: 14
      name: homework_tasks
      label: Homework or Chore Tasks
