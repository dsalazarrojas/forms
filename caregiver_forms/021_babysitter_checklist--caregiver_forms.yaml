      name: parent_name
      label: Parent or Guardian Name
      hint: Name of parent leaving instructions
      type: text
      options: []
      required: true
    - id: 2
      name: parent_phone
      label: Parent Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 3
      name: alternate_contact
      label: Alternate Emergency Contact
      hint: Name and phone of backup contact
      type: text
      options: []
      required: true
    - id: 4
      name: babysitter_name
      label: Babysitter Name
      hint: Name of caregiver
      type: text
      options: []
      required: true
    - id: 5
      name: care_date
      label: Date of Care
      hint: When is babysitting scheduled
      type: date
      options: []
      required: true
    - id: 6
      name: start_time
      label: Start Time
      hint: When does care begin
      type: time
      options: []
      required: true
    - id: 7
      name: end_time
      label: End Time
      hint: Expected return time
      type: time
      options: []
      required: true
