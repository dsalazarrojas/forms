inputSchema:
  type: object
  properties:
    title: Care Home Health Aide Log
    pages:
    - id: 1
      name: aide_name
      label: Health Aide Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: aide_id
      label: Aide ID Number
      hint: Employee ID
      type: text
      options: []
      required: true
    - id: 3
      name: shift_date
      label: Shift Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: shift_start_time
      label: Shift Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: shift_end_time
      label: Shift End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: resident_name
      label: Resident Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: resident_room_number
      label: Resident Room Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: vital_signs_temperature
      label: Temperature
      hint: In Fahrenheit
      type: number
      options: []
      required: false
    - id: 9
      name: vital_signs_pulse
      label: Pulse
      hint: Beats per minute
      type: number
      options: []
      required: false
    - id: 10
      name: vital_signs_respirations
      label: Respirations
      hint: Breaths per minute
      type: number
      options: []
      required: false
    - id: 11
      name: vital_signs_blood_pressure
      label: Blood Pressure
      hint: Format - systolic over diastolic
      type: text
      options: []
      required: false
    - id: 12
      name: vital_signs_oxygen_saturation
      label: Oxygen Saturation
      hint: Percentage
      type: number
      options: []
      required: false
    - id: 13
      name: vital_signs_weight
      label: Weight
      hint: If measured
      type: number
      options: []
      required: false
    - id: 14
      name: activities_of_daily_living
      label: Activities of Daily Living Assistance
      hint: Select all provided
      type: select_multiple
      options:
      - Bathing
      - Dressing
      - Grooming
      - Oral care
      - Toileting
      - Feeding
      - Ambulation
      - Transfers
      - None required
      required: true
    - id: 15
      name: mobility_status
      label: Mobility Status During Shift
      hint: null
      type: select_one
      options:
      - Independent
      - Supervision needed
      - Minimal assistance
      - Moderate assistance
      - Maximum assistance
      - Dependent
      required: true
    - id: 16
      name: meals_consumed
      label: Meals Consumed
      hint: Select all that apply
      type: select_multiple
      options:
      - Breakfast - full portion
      - Breakfast - partial portion
      - Breakfast - refused
      - Lunch - full portion
      - Lunch - partial portion
      - Lunch - refused
      - Dinner - full portion
      - Dinner - partial portion
      - Dinner - refused
      - Snacks provided
      required: true
    - id: 17
      name: fluid_intake
      label: Fluid Intake
      hint: Approximate amount in ounces
      type: text
      options: []
      required: false
    - id: 18
      name: bowel_movements
      label: Bowel Movements
      hint: null
      type: select_one
      options:
      - None
      - One
      - Two
      - Three or more
      - Incontinent
      required: true
    - id: 19
      name: urinary_output
      label: Urinary Output
      hint: null
      type: select_one
      options:
      - Normal
      - Decreased
      - Increased
      - Incontinent
      - Catheter in place
      - Not applicable
      required: true
    - id: 20
      name: skin_condition
      label: Skin Condition Observed
      hint: Select all that apply
      type: select_multiple
      options:
      - Normal
      - Redness
      - Bruising
      - Dry skin
      - Open areas
      - Pressure ulcers noted
      - Rash
      - Swelling
      - Not assessed
      required: true
    - id: 21
      name: medications_administered
      label: Medications Administered
      hint: List medications and times
      type: text
      options: []
      required: false
    - id: 22
      name: treatments_provided
      label: Treatments Provided
      hint: Select all that apply
      type: select_multiple
      options:
      - Wound care
      - Range of motion exercises
      - Compression stockings
      - Oxygen therapy
      - Suctioning
      - Catheter care
      - Ostomy care
      - None
      required: true
    - id: 23
      name: behavior_observations
      label: Behavior Observations
      hint: Select all that apply
      type: select_multiple
      options:
      - Normal mood
      - Anxious
      - Depressed
      - Agitated
      - Confused
      - Aggressive
      - Withdrawn
      - Cooperative
      - Pain expressed
      - Sleepy or lethargic
      required: true
    - id: 24
      name: social_interactions
      label: Social Interactions
      hint: null
      type: select_one
      options:
      - Very social and engaged
      - Moderately social
      - Minimal interaction
      - Withdrawn
      - Refused interaction
      required: true
    - id: 25
      name: incidents_or_changes
      label: Incidents or Notable Changes
      hint: Describe any falls, injuries, or significant changes
      type: text
      options: []
      required: false
    - id: 26
      name: family_visitors
      label: Family or Visitor Contact
      hint: null
      type: select_one
      options:
      - Yes - family visited
      - Yes - phone call
      - Yes - video call
      - No visitors or contact
      - Resident declined contact
      required: true
    - id: 27
      name: activities_participated
      label: Activities Participated In
      hint: Select all that apply
      type: select_multiple
      options:
      - Group activities
      - Individual activities
      - Outdoor time
      - Exercise
      - Reading
      - Television
      - Music
      - Religious services
      - None
      - Declined activities
      required: true
    - id: 28
      name: sleep_patterns
      label: Sleep Patterns Observed
      hint: null
      type: text
      options: []
      required: false
    - id: 29
      name: supplies_needed
      label: Supplies Needed for Next Shift
      hint: List any low or depleted supplies
      type: text
      options: []
      required: false
    - id: 30
      name: handoff_notes
      label: Handoff Notes for Next Shift
      hint: Important information for oncoming staff
      type: text
      options: []
      required: true
    - id: 31
      name: supervisor_notification
      label: Was Supervisor Notified of Any Concerns
      hint: null
      type: select_one
      options:
      - Yes - see notes
      - No - no concerns
      - Not applicable
      required: true
    - id: 32
      name: log_completed_by
      label: Log Completed By
      hint: Signature or name
      type: text
      options: []
      required: true
    - id: 33
      name: log_completion_time
      label: Log Completion Time
      hint: null
      type: time
      options: []
      required: true
