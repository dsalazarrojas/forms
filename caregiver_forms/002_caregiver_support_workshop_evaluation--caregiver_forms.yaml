inputSchema:
  type: object
  properties:
    title: Caregiver Support Workshop Evaluation
    pages:
    - id: 1
      name: session_header
      label: -- Workshop Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name of attendee
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization or group
      hint: Optional employer or community group
      type: text
      options: []
      required: false
    - id: 4
      name: workshop_date
      label: Workshop date
      hint: Date of the workshop attended
      type: date
      options: []
      required: true
    - id: 5
      name: overall_rating
      label: Overall rating
      hint: Rate the workshop quality
      type: select_one
      options:
      - Very poor
      - Poor
      - Fair
      - Good
      - Very good
      required: true
    - id: 6
      name: topics_most_useful
      label: Topics that were most useful
      hint: Select all that apply
      type: select_multiple
      options:
      - Care strategies
      - Self care
      - Communication
      - Community resources
      - Legal guidance
      required: false
    - id: 7
      name: facilitator_effectiveness
      label: Facilitator effectiveness
      hint: How well did the facilitator present material
      type: select_one
      options:
      - Not effective
      - Somewhat effective
      - Effective
      - Very effective
      required: true
    - id: 8
      name: most_valuable_takeaway
      label: Most valuable takeaway
      hint: Briefly describe one key point you will use
      type: text
      options: []
      required: false
    - id: 9
      name: suggestions_for_improvement
      label: Suggestions for improvement
      hint: Ideas for future workshops or logistics
      type: text
      options: []
      required: false
    - id: 10
      name: would_recommend
      label: Would recommend to other caregivers
      hint: Yes or no response
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
