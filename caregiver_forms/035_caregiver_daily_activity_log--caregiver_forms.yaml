inputSchema:
  type: object
  properties:
    title: Caregiver Daily Activity Log
    pages:
      - id: 1
        name: caregiver_name
        label: Caregiver Name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 2
        name: client_name
        label: Client or Patient Name
        hint: Person being cared for
        type: text
        options: []
        required: true
      - id: 3
        name: log_date
        label: Date of Log Entry
        hint: null
        type: date
        options: []
        required: true
      - id: 4
        name: shift_start_time
        label: Shift Start Time
        hint: null
        type: time
        options: []
        required: true
      - id: 5
        name: shift_end_time
        label: Shift End Time
        hint: null
        type: time
        options: []
        required: true
      - id: 6
        name: overall_condition
        label: Client Overall Condition
        hint: General health and status for the day
        type: select_one
        options:
          - Excellent - no concerns
          - Good - routine day
          - Fair - some concerns noted
          - Poor - significant concerns
          - Emergency - immediate attention needed
        required: true
      - id: 7
        name: morning_routine
        label: Morning Care and Hygiene
        hint: Bathing, grooming, dressing, toileting
        type: text
        options: []
        required: false
