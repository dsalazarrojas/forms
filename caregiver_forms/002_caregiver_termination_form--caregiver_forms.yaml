inputSchema:
  type: object
  properties:
    title: Caregiver Termination Form
    pages:
    - id: 1
      name: form_header
      label: Caregiver Termination Documentation
      hint: Complete all sections for proper record keeping
      type: note
      options: []
      required: false
    - id: 2
      name: caregiver_full_name
      label: Caregiver Full Name
      hint: Legal name of the caregiver being terminated
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 4
      name: termination_date
      label: Termination Date
      hint: Last day of employment
      type: date
      options: []
      required: true
    - id: 5
      name: termination_type
      label: Type of Termination
      hint: Select the appropriate category
      type: select_one
      options:
      - Voluntary resignation
      - Involuntary termination
      - End of contract
      - Retirement
      - Medical leave conversion
      - Position elimination
      required: true
    - id: 6
      name: termination_reason
      label: Reason for Termination
      hint: Provide detailed explanation
      type: select_one
      options:
      - Performance issues
      - Policy violation
      - Attendance problems
      - Client request
      - Budget constraints
      - Relocation
      - Personal reasons
      - Other
      required: true
    - id: 7
      name: reason_details
      label: Termination Reason Details
      hint: Elaborate on the reason selected above
      type: text
      options: []
      required: true
    - id: 8
      name: client_info
      label: Client Information
      hint: Details about assigned clients
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_clients
      label: Assigned Clients or Patients
      hint: List all current assignments
      type: text
      options: []
      required: true
    - id: 10
      name: client_notification
      label: Have clients been notified
      hint: Client communication status
      type: select_one
      options:
      - Yes - all notified
      - Partially notified
      - Not yet notified
      - Not applicable
      required: true
    - id: 11
      name: property_return
      label: Company Property Return
      hint: All items must be returned
      type: note
      options: []
      required: false
    - id: 12
      name: keys_returned
      label: Keys and Access Cards Returned
      hint: All access items
      type: select_one
      options:
      - Yes - all returned
      - Partially returned
      - Not applicable
      required: true
    - id: 13
      name: equipment_returned
      label: Equipment and Devices Returned
      hint: Phones tablets medical equipment
      type: select_one
      options:
      - Yes - all returned
      - Partially returned
      - Not applicable
      required: true
    - id: 14
      name: uniforms_returned
      label: Uniforms and ID Badge Returned
      hint: All company clothing and identification
      type: select_one
      options:
      - Yes - all returned
      - Partially returned
      - Not applicable
      required: true
    - id: 15
      name: final_payroll
      label: Final Payroll Information
      hint: Compensation details
      type: note
      options: []
      required: false
    - id: 16
      name: final_paycheck_date
      label: Final Paycheck Issue Date
      hint: When will final payment be processed
      type: date
      options: []
      required: true
    - id: 17
      name: accrued_vacation
      label: Accrued Vacation Hours
      hint: Remaining PTO hours
      type: number
      options: []
      required: false
    - id: 18
      name: benefits_continuation
      label: Benefits Continuation Options Discussed
      hint: COBRA and other benefits
      type: select_one
      options:
      - Yes - discussed in detail
      - Yes - information provided
      - Not applicable
      - Pending discussion
      required: true
    - id: 19
      name: exit_interview
      label: Exit Interview
      hint: Completion status
      type: select_one
      options:
      - Completed
      - Scheduled
      - Declined by caregiver
      - Not offered
      required: true
    - id: 20
      name: manager_name
      label: Manager Name
      hint: Supervisor completing this form
      type: text
      options: []
      required: true
    - id: 21
      name: manager_signature_date
      label: Manager Signature Date
      hint: Date of completion
      type: date
      options: []
      required: true
    - id: 22
      name: hr_acknowledgment
      label: HR Acknowledgment Required
      hint: Human resources review
      type: select_one
      options:
      - Yes - pending review
      - Yes - completed
      - No - not required
      required: true
