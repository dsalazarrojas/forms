inputSchema:
  type: object
  properties:
    title: Baking Class Signup Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: baking_class
      label: Baking Class
      hint: null
      type: select_one
      options:
      - '{''label'': ''Morning''}'
      - '{''label'': ''Afternoon''}'
      - '{''label'': ''Evening''}'
      required: false
    - id: 6
      name: session_date
      label: Session Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 7
      name: session_time
      label: Session Time
      hint: "12:00 AM"
      type: time
      options: []
      required: false
    - id: 8
      name: participant_count
      label: Participant Count
      hint: null
      type: number
      options: []
      required: false
