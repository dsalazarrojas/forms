inputSchema:
  type: object
  properties:
    title: Intercompany Work Allocation Survey
    pages:
    - id: 1
      name: intercompany_work_allocation_survey
      label: What is your role in the intercompany work allocation process?
      hint: Please describe your role in the intercompany work allocation process.
      type: text
      options: []
      required: false
    - id: 2
      name: intercompany_tasks
      label: What types of intercompany tasks do you currently perform?
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''Option 1'', ''value'': ''Intercompany tasks that
        involve communication with other departments''}'
      - '{''id'': 2, ''name'': ''Option 2'', ''value'': ''Intercompany tasks that
        involve collaboration with other teams''}'
      - '{''id'': 3, ''name'': ''Option 3'', ''value'': ''Intercompany tasks that
        require data sharing''}'
      required: false
    - id: 3
      name: intercompany_time_allocation
      label: How much time do you spend on intercompany tasks?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: challenges
      label: What are some challenges you face when performing intercompany tasks?
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: suggestions
      label: Do you have any suggestions for improving the intercompany work allocation
        process?
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Option 1'', ''value'': ''Improve communication between
        departments''}'
      - '{''id'': 2, ''name'': ''Option 2'', ''value'': ''Increase task allocation
        efficiency''}'
      - '{''id'': 3, ''name'': ''Option 3'', ''value'': ''Enhance data sharing practices''}'
      required: false
