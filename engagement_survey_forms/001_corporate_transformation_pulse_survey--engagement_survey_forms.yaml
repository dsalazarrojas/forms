inputSchema:
  type: object
  properties:
    title: Corporate Transformation Pulse Survey
    pages:
    - id: 1
      name: overall_employee_sentiment
      label: Overall Employee Sentiment
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 2
      name: confidence_in_change_confidence
      label: Confidence in Change
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 3
      name: confidence_in_change_confidence_rating
      label: Confidence in Change Rating
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: communication_effectiveness
      label: Communication Effectiveness
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: confidence_in_change_very_confident
      label: Confidence In Change Very Confident
      hint: null
      type: text
      options: []
      required: false
