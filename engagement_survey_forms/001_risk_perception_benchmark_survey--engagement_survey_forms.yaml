inputSchema:
  type: object
  properties:
    title: Risk Perception Benchmark Survey
    pages:
    - id: 1
      name: overall_risk_perception
      label: Overall Risk Perception
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: risk_data_reviewed
      label: How does it relate to your current situation?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: risk_concerned
      label: Are you concerned about risks in your area?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 4
      name: risk_data_sourced
      label: What kind of risk data do you use to make decisions?
      hint: null
      type: select_multiple
      options:
      - Internal
      - External
      - Both
      required: true
    - id: 5
      name: data_reviewed_frequency
      label: How often do you review data?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: risk_data_sources
      label: What sources do you use to gather risk data?
      hint: null
      type: select_multiple
      options:
      - Internal
      - External
      - Both
      required: true
    - id: 7
      name: risk_factor_description
      label: What is the biggest risk you face?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: risk_level_assessment
      label: What is the risk level of this risk?
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 9
      name: risk_control_status
      label: Do you think this risk is under control?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: major_concern
      label: Is the risk a major concern for you?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: risk_data_availability
      label: Do you have any risk-related data?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: risk_data_kind
      label: What kind of risk data do you have?
      hint: null
      type: select_multiple
      options:
      - Internal
      - External
      - Both
      required: true
    - id: 13
      name: data_reviewed_frequency_2
      label: Data Reviewed Frequency 2
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: risk_factor_description_2
      label: What is the risk factor?
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: risk_level_assessment_2
      label: Risk Level Assessment 2
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 16
      name: risk_control_status_2
      label: Risk Control Status 2
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: major_concern_2
      label: Major Concern 2
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: risk_data_availability_2
      label: Risk Data Availability 2
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 19
      name: risk_data_kind_2
      label: Risk Data Kind 2
      hint: null
      type: select_multiple
      options:
      - Internal
      - External
      - Both
      required: true
    - id: 20
      name: data_reviewed_frequency_3
      label: Data Reviewed Frequency 3
      hint: null
      type: number
      options: []
      required: true
