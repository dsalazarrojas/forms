inputSchema:
  type: object
  properties:
    title: Business Partner Accountability Survey
    pages:
    - id: 1
      name: evaluation_date
      label: Evaluation Date
      hint: Date of this review
      type: date
      options: []
      required: true
    - id: 2
      name: evaluator_name
      label: Evaluator Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 3
      name: evaluator_company
      label: Your Company
      hint: Company you represent
      type: text
      options: []
      required: true
    - id: 4
      name: partner_company_name
      label: Partner Company Name
      hint: Company being evaluated
      type: text
      options: []
      required: true
    - id: 5
      name: partner_contact_name
      label: Partner Primary Contact
      hint: Main contact person
      type: text
      options: []
      required: true
    - id: 6
      name: relationship_duration
      label: Duration of Partnership
      hint: How long have you partnered?
      type: select_one
      options:
      - Less than 3 months
      - 3-6 months
      - 6-12 months
      - 1-3 years
      - 3+ years
      required: true
    - id: 7
      name: delivery_timeliness
      label: On-Time Delivery/Performance
      hint: Rate timeliness (1-5)
      type: number
      options: []
      required: true
    - id: 8
      name: quality_of_work
      label: Quality of Work/Products
      hint: Rate quality (1-5)
      type: number
      options: []
      required: true
    - id: 9
      name: communication_responsiveness
      label: Communication Responsiveness
      hint: How quickly do they respond? (1-5)
      type: number
      options: []
      required: true
    - id: 10
      name: professionalism
      label: Professional Conduct
      hint: Rate professionalism (1-5)
      type: number
      options: []
      required: true
    - id: 11
      name: problem_resolution
      label: Problem Resolution Ability
      hint: How well do they solve issues? (1-5)
      type: number
      options: []
      required: true
    - id: 12
      name: reliability
      label: Overall Reliability
      hint: Can you count on them? (1-5)
      type: number
      options: []
      required: true
    - id: 13
      name: cost_value
      label: Cost Value Assessment
      hint: Is price fair for quality? (1-5)
      type: number
      options: []
      required: true
    - id: 14
      name: innovation_contribution
      label: Innovation and Ideas
      hint: Do they bring fresh ideas? (1-5)
      type: number
      options: []
      required: false
    - id: 15
      name: relationship_strength
      label: Relationship Strength
      hint: Rate relationship (1-5)
      type: number
      options: []
      required: true
    - id: 16
      name: strengths
      label: Partner Strengths
      hint: What are they good at?
      type: text
      options: []
      required: true
    - id: 17
      name: areas_for_improvement
      label: Areas for Improvement
      hint: What could they improve?
      type: text
      options: []
      required: true
    - id: 18
      name: specific_concerns
      label: Specific Concerns or Issues
      hint: Any particular problems?
      type: text
      options: []
      required: false
    - id: 19
      name: future_partnership
      label: Continue Partnership?
      hint: Would you continue working together?
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 20
      name: recommendations
      label: Recommendations for Improvement
      hint: Specific suggestions
      type: text
      options: []
      required: false
    - id: 21
      name: overall_rating
      label: Overall Rating
      hint: Overall score (1-10)
      type: number
      options: []
      required: true
