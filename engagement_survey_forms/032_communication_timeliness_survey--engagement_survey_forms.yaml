          - Sales
          - Marketing
          - Engineering
          - Product
          - Human Resources
          - Finance
          - Operations
          - Customer Support
          - IT
          - Other
        required: true
      - id: 5
        name: role_level
        label: Role Level
        hint: Your level in the organization
        type: select_one
        options:
          - Individual Contributor
          - Team Lead
          - Manager
          - Senior Manager
          - Director
          - Executive
        required: true
      - id: 6
        name: tenure
        label: Tenure
