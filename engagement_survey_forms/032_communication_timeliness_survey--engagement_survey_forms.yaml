      - id: 24
        name: willing_to_improve
        label: Willing to Improve
        hint: Are you willing to participate in improvement initiatives
        type: select_one
        options:
          - "Yes - Very Willing"
          - "Yes - Willing"
          - "Neutral"
          - "No"
        required: false
      - id: 25
        name: survey_date
        label: Survey Date
        hint: Date you completed this survey
        type: date
        options: []
        required: true
