inputSchema:
  type: object
  properties:
    title: Manager Feedback Request
    pages:
    - id: 1
      name: feedback_request
      label: Feedback Request
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: manager_name
      label: manager_name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: feedback_for_manager
      label: Feedback For Manager
      hint: null
      type: select_one
      options:
      - Manager
      - Team Members
      - Department
      required: true
    - id: 4
      name: manager_strengths
      label: Manager Strengths
      hint: null
      type: select_multiple
      options:
      - Communication
      - Leadership
      - Problem Solving
      - Adaptability
      - Other
      required: true
    - id: 5
      name: areas_for_improvement
      label: Areas For Improvement
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: manager_feedback
      label: Manager Feedback
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 7
      name: anonymous_feedback
      label: Anonymous Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: note
      options: []
      required: false
