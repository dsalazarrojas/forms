inputSchema:
  type: object
  properties:
    title: Operator Orientation Survey
    pages:
    - id: 1
      name: current_job_title
      label: What is your current job title/position?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: rate_training_quality
      label: How would you rate the quality of the training provided?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: challenging_part
      label: What was the most challenging part of the onboarding process?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: effectiveness_of_onboarding
      label: How effective was the onboarding process in preparing you?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: helpful_during_onboarding
      label: What did you find most helpful during the onboarding process?
      hint: null
      type: select_multiple
      options:
      - Manual
      - Online Training
      - Mentorship
      - Other (please specify)
      required: true
    - id: 6
      name: least_helpful_during_onboarding
      label: What did you find least helpful or confusing during the onboarding process?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: supportiveness_of_colleagues
      label: How would you rate the supportiveness of your colleagues during the onboarding
        process?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: feel_prepared_for_new_role
      label: Did you feel adequately prepared for your new role at the end of the
        onboarding process?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: confidence_in_job_responsibilities
      label: How confident are you in your ability to perform your new job responsibilities?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: suggestions_for_improvement
      label: What suggestions do you have for improving the onboarding process?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: additional_comments
      label: Any additional comments or suggestions you'd like to share about your
        onboarding experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: would_recommend_onboarding
      label: How likely are you to recommend this onboarding process to a friend or
        colleague?
      hint: null
      type: number
      options: []
      required: true
