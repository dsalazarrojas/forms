inputSchema:
  type: object
  properties:
    title: Internal Process Friction Survey
    pages:
    - id: 1
      name: introduction
      label: What is the primary function of this form?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: process_bottleneck
      label: Where is the primary process bottleneck?
      hint: Where is the biggest problem in your current process?
      type: select_one
      options:
      - Bottleneck 1
      - Bottleneck 2
      - Bottleneck 3
      required: false
    - id: 3
      name: pain_point_description
      label: Describe the pain point in your process
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: impact_on_work
      label: What impact does this process bottleneck have on your work?
      hint: How does this bottleneck affect your productivity or morale?
      type: text
      options: []
      required: false
    - id: 5
      name: suggestions_for_improvement
      label: What suggestions do you have for improving this process?
      hint: Think about what would make the process easier and more efficient.
      type: text
      options: []
      required: false
    - id: 6
      name: current_status
      label: What is the current status of this issue?
      hint: null
      type: select_one
      options:
      - In Progress
      - On Hold
      - Resolved
      required: false
