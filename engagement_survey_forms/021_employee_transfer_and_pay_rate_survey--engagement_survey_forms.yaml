inputSchema:
  type: object
  properties:
    title: Employee Transfer And Pay Rate Survey
    pages:
    - id: 1
      name: transfer_category
      label: Which category does this transfer belong to?
      hint: null
      type: select_one
      options:
      - Employee Development
      - Other
      required: true
    - id: 2
      name: employee_name
      label: What is the employee's name?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: transfer_type
      label: What type of transfer is this?
      hint: null
      type: select_one
      options:
      - Internal
      - External
      required: true
    - id: 4
      name: pay_change
      label: Is this transfer for a pay change?
      hint: yes/no
      type: select_one
      options:
      - 'yes'
      - 'no'
      required: true
    - id: 5
      name: date_of_transfer
      label: On what date did the pay change occur?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: old_pay_rate
      label: What was the old pay rate?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: new_pay_rate
      label: What is the new pay rate?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: reason_for_pay_change
      label: What is the reason for the pay change?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: impact_on_schedule
      label: What is the impact on the employee's work schedule?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: comments
      label: Are there any comments about the transfer or pay change?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: transfer_category_2
      label: What is the category of the transfer?
      hint: null
      type: select_multiple
      options:
      - Employee Development
      - Other
      required: false
    - id: 12
      name: is_transfer_approved
      label: Is the transfer approved?
      hint: yes/no
      type: select_one
      options:
      - 'yes'
      - 'no'
      required: true
