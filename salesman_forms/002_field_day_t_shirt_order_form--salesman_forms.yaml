inputSchema:
  type: object
  properties:
    title: Field Day T Shirt Order Form
    pages:
    - id: 1
      name: tshirt_name
      label: Field Day T Shirt Order Form
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: shirt_size
      label: t_shirt_size
      hint: Select a size
      type: select_one
      options:
      - xs
      - s
      - m
      - l
      - xl
      required: true
    - id: 4
      name: quantity
      label: quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: price
      label: price
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: Enter a valid phone number
      type: text
      options: []
      required: true
    - id: 8
      name: payment_method
      label: Payment Method
      hint: Select a payment method
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 9
      name: order_notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
