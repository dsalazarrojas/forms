inputSchema:
  type: object
  properties:
    title: Seasonal Sales Data Evaluation Report
    pages:
    - id: 1
      name: sales_period
      label: Sales Period
      hint: null
      type: select_one
      options:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
      required: false
    - id: 2
      name: sales_channel
      label: Sales Channel
      hint: null
      type: select_multiple
      options:
      - Online
      - In Store
      - Phone
      - Email
      - Social Media
      required: false
    - id: 3
      name: store_name
      label: Store Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: sales_region
      label: Sales Region
      hint: null
      type: select_one
      options:
      - North
      - South
      - East
      - West
      - Central
      required: false
    - id: 5
      name: sales_amount
      label: Sales Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: sales_manager
      label: Sales Manager
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Joe
      - Jim
      required: false
    - id: 7
      name: store_location
      label: Store Location
      hint: null
      type: select_multiple
      options:
      - City
      - Suburbs
      - Town
      - Country
      required: false
    - id: 8
      name: sales_date
      label: Sales Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: sales_time
      label: Sales Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: sales_note
      label: Sales Note
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: email_address
      label: Email Address
      hint: Your email address for follow-up
      type: email
      options: []
      required: false
    - id: 12
      name: phone_number
      label: Phone Number
      hint: Work, home, or mobile number
      type: text
      options: []
      required: false
    - id: 13
      name: sales_manager_email
      label: Sales Manager Email
      hint: Sales manager email for follow-up
      type: email
      options: []
      required: false
    - id: 14
      name: sales_manager_phone
      label: Sales Manager Phone
      hint: Sales manager phone number for follow-up
      type: text
      options: []
      required: false
