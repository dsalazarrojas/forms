inputSchema:
  type: object
  properties:
    title: Email Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: customer_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: order_item
      label: order_item
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Cash
      - Credit Card
      required: true
    - id: 7
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: confirmation_email
      label: Confirmation Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
