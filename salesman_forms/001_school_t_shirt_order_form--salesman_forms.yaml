inputSchema:
  type: object
  properties:
    title: School T Shirt Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: t_shirt_size
      label: T Shirt Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 5
      name: color
      label: Color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      required: true
    - id: 6
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 8
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
