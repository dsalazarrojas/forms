inputSchema:
  type: object
  properties:
    title: Calories Diet Plan Form
    pages:
    - id: 1
      name: client_name
      label: Client Full Name
      hint: Full name for the diet plan
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Client Email
      hint: Contact email for meal plans and follow up
      type: email
      options: []
      required: true
    - id: 3
      name: target_weight
      label: Target Weight in kg
      hint: Enter target weight goal
      type: number
      options: []
      required: false
    - id: 4
      name: daily_calorie_goal
      label: Daily Calorie Goal
      hint: Recommended target calories per day
      type: number
      options: []
      required: true
    - id: 5
      name: dietary_preferences
      label: Dietary Preferences
      hint: Vegetarian, vegan, gluten free etc
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten Free
      - Dairy Free
      - No Preference
      required: false
    - id: 6
      name: allergies
      label: Food Allergies or Intolerances
      hint: List any allergies or intolerances
      type: text
      options: []
      required: false
    - id: 7
      name: activity_level
      label: Typical Activity Level
      hint: Used to tailor calorie plan
      type: select_one
      options:
      - Sedentary
      - Lightly Active
      - Moderately Active
      - Very Active
      required: true
    - id: 8
      name: current_medications
      label: Current Medications
      hint: Medications that may affect diet
      type: text
      options: []
      required: false
    - id: 9
      name: meal_preferences
      label: Meal Preferences or Restrictions
      hint: Foods you prefer or want to avoid
      type: text
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional Notes for Dietitian
      hint: Anything else relevant to the plan
      type: text
      options: []
      required: false
