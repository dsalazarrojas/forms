inputSchema:
  type: object
  properties:
    title: Food Consumption Survey
    pages:
    - id: 1
      name: fast_food_consumption_frequency
      label: Fast Food Consumption Frequency
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: fast_food_consumption_amount
      label: Fast Food Consumption Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: food_frequency
      label: Food Frequency
      hint: null
      type: select_one
      options:
      - Never
      - Less than once a week
      - 1-2 times a week
      - 3-4 times a week
      - 5 or more times a week
      required: false
    - id: 4
      name: food_amount
      label: Food Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: food_type
      label: Food Type
      hint: null
      type: select_one
      options:
      - Fast Food
      - Fruits
      - Vegetables
      - Meat
      - Dairy
      - Baked Goods
      required: false
    - id: 6
      name: food_group
      label: Food Group
      hint: null
      type: select_one
      options:
      - Sweets
      - Fruits
      - Vegetables
      - Meat
      - Dairy
      - Baked Goods
      required: true
    - id: 7
      name: food_frequency_time
      label: Fast Food Consumption Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: fast_food_consumption_date
      label: Fast Food Consumption Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: other_foods_consumed
      label: Other Foods Consumed
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
