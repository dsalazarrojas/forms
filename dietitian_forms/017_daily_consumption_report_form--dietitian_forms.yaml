inputSchema:
  type: object
  properties:
    title: Daily Consumption Report Form
    pages:
    - id: 1
      name: page_1
      label: What did you eat today?
      hint: Describe your food consumption
      type: text
      options: []
      required: false
    - id: 2
      name: page_2
      label: Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 3
      name: page_3
      label: Time
      hint: HH -MM AM/PM
      type: time
      options: []
      required: true
    - id: 4
      name: page_4
      label: Consumption Amount
      hint: Number of units or amount
      type: number
      options: []
      required: true
    - id: 5
      name: page_5
      label: Notes
      hint: Additional notes about today's consumption
      type: note
      options: []
      required: false
    - id: 6
      name: page_6
      label: Phone
      hint: Phone number or extension
      type: text
      options: []
      required: false
    - id: 7
      name: page_7
      label: Email
      hint: Email address
      type: email
      options: []
      required: false
    - id: 8
      name: page_8
      label: Category
      hint: Select category for this consumption
      type: select_one
      options:
      - Fresh Fruits
      - Cooked Food
      - Snacks
      - Others
      required: true
    - id: 9
      name: page_9
      label: Subcategory
      hint: Select subcategories for this consumption
      type: select_multiple
      options:
      - Fresh Fruits
      - Cooked Food
      - Desserts
      - Beverages
      required: false
    - id: 10
      name: page_10
      label: Submit
      hint: Submit this form
      type: text
      options: []
      required: false
    - id: 11
      name: page_11
      label: Cancel
      hint: Cancel this form
      type: text
      options: []
      required: false
    - id: 12
      name: page_12
      label: Back
      hint: Back to previous page
      type: text
      options: []
      required: false
    - id: 13
      name: page_13
      label: Save
      hint: Save this form
      type: text
      options: []
      required: false
    - id: 14
      name: page_14
      label: Reset
      hint: Reset this form
      type: text
      options: []
      required: false
