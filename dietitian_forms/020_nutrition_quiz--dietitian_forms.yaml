inputSchema:
  type: object
  properties:
    title: Nutrition Quiz
    pages:
    - id: 1
      name: client_intake
      label: Client Intake
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: dietary_habits
      label: Dietary Habits
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Undisclosed
      required: true
    - id: 3
      name: health_goals
      label: Health Goals
      hint: null
      type: select_one
      options:
      - Lose weight
      - Manage blood sugar
      - Improve gut health
      - Other
      required: false
    - id: 4
      name: food_intake
      label: Food Intake
      hint: null
      type: select_one
      options:
      - Omnivore
      - Vegetarian
      - Vegan
      - Raw food
      required: false
    - id: 5
      name: supplements
      label: Supplements
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: medications
      label: Medications
      hint: null
      type: text
      options: []
      required: false
