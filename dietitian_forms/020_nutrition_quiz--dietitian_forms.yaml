      name: client_intake
      label: Client Intake
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: dietary_habits
      label: Dietary Habits
      hint: null
      type: select_multiple
      options:
      - '{''label'': True}'
      - '{''label'': False}'
      - '{''label'': ''Undisclosed''}'
