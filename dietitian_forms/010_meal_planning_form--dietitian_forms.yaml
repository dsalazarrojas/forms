inputSchema:
  type: object
  properties:
    title: Meal Planning Form
    pages:
    - id: 1
      name: general_info
      label: What type of meals do you typically eat?
      hint: null
      type: select_one
      options:
      - Breakfast
      - Lunch
      - Dinner
      - Snacks
      required: true
    - id: 2
      name: dietary_preferences
      label: What are your dietary preferences?
      hint: null
      type: select_multiple
      options:
      - Vegan
      - Gluten-free
      - Dairy-free
      - Low-carb
      required: true
    - id: 3
      name: allergies
      label: Do you have any food allergies or intolerances?
      hint: null
      type: checkbox
      options:
      - Allergy 1
      - Intolerance 1
      required: true
    - id: 4
      name: planning_goals
      label: What are your meal planning goals?
      hint: null
      type: select_one
      options:
      - Weight Loss
      - Weight Gain
      - Health Maintenance
      required: true
    - id: 5
      name: favorites
      label: What are your favorite foods or cuisines?
      hint: null
      type: select_multiple
      options:
      - Italian
      - Mexican
      - Indian
      required: false
    - id: 6
      name: restrictions
      label: Do you have any specific dietary restrictions?
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Low Sodium
      required: false
    - id: 7
      name: eating_out
      label: How often do you eat out or order takeout?
      hint: null
      type: select_one
      options:
      - Never
      - Occasionally
      - Often
      required: false
    - id: 8
      name: planning_method
      label: What is your preferred method of meal planning?
      hint: null
      type: select_one
      options:
      - App
      - Cookbook
      - Online Recipes
      required: false
    - id: 9
      name: needs
      label: Do you have any specific dietary needs or concerns?
      hint: null
      type: select_multiple
      options:
      - Diabetes
      - Kidney Disease
      - Other
      required: false
    - id: 10
      name: meals_per_day
      label: How many meals do you typically eat per day?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: cooking_method
      label: Do you have a preferred cooking method?
      hint: null
      type: select_one
      options:
      - Baking
      - Grilling
      - Sautéing
      required: false
    - id: 12
      name: planning_schedule
      label: Do you have any specific meal planning schedules?
      hint: null
      type: select_multiple
      options:
      - Meal Prep
      - Batch Cooking
      - Other
      required: false
