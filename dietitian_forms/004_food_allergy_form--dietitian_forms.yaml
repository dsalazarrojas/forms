inputSchema:
  type: object
  properties:
    title: Food Allergy Form
    pages:
    - id: 1
      name: food_allergy_form
      label: food_allergy_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: patient_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: allergy_type
      label: food_allergy
      hint: Choose one option
      type: select_one
      options:
      - Dairy
      - Egg
      - Fish
      - Poultry
      - Shellfish
      - Tree nut
      - Wheat
      - Soy
      - Other
      required: false
    - id: 4
      name: allergy_description
      label: allergy_description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: food_allergy_medical_condition
      label: medical_condition
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: allergy_severity
      label: allergy_severity
      hint: null
      type: select_multiple
      options:
      - mild
      - moderate
      - severe
      required: false
    - id: 7
      name: medication_allergy
      label: medication
      hint: null
      type: select_multiple
      options:
      - penicillin
      - epi pen
      - other medication allergy
      required: false
