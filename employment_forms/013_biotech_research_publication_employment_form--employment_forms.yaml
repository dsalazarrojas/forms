inputSchema:
  type: object
  properties:
    title: Biotech Research Publication Employment Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: applicant_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 5
      name: applicant_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 6
      name: applicant_address
      label: Current Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 7
      name: section_position
      label: -- Position Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: position_title
      label: Position Applied For
      hint: Job title or position name
      type: text
      options: []
      required: true
    - id: 9
      name: employment_type
      label: Employment Type
      hint: What type of position
      type: select_one
      options:
      - Full-Time
      - Part-Time
      - Contract
      - Postdoctoral Fellow
      - Graduate Student
      - Visiting Scholar
      required: true
    - id: 10
      name: desired_start_date
      label: Desired Start Date
      hint: When can you begin
      type: date
      options: []
      required: false
    - id: 11
      name: salary_expectations
      label: Salary Expectations
      hint: Expected annual salary range
      type: text
      options: []
      required: false
    - id: 12
      name: section_education
      label: -- Education Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: highest_degree
      label: Highest Degree
      hint: Your highest level of education
      type: select_one
      options:
      - Bachelor's Degree
      - Master's Degree
      - PhD
      - MD
      - Other Professional Degree
      required: true
    - id: 14
      name: degree_field
      label: Field of Study
      hint: Your major or field
      type: text
      options: []
      required: true
    - id: 15
      name: degree_institution
      label: Institution
      hint: University or college name
      type: text
      options: []
      required: true
    - id: 16
      name: graduation_year
      label: Year of Graduation
      hint: When did you graduate
      type: number
      options: []
      required: false
    - id: 17
      name: section_experience
      label: -- Professional Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: years_experience
      label: Years of Relevant Experience
      hint: Years working in biotech or research
      type: number
      options: []
      required: true
    - id: 19
      name: current_employer
      label: Current or Most Recent Employer
      hint: Organization name
      type: text
      options: []
      required: true
    - id: 20
      name: current_title
      label: Current or Most Recent Title
      hint: Job title
      type: text
      options: []
      required: true
    - id: 21
      name: employment_duration
      label: Duration at Current Position
      hint: How long have you been in this role
      type: text
      options: []
      required: false
    - id: 22
      name: section_research
      label: -- Research and Publications --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: research_focus
      label: Research Focus Areas
      hint: Your primary research interests
      type: text
      options: []
      required: true
    - id: 24
      name: publication_count
      label: Number of Publications
      hint: Approximately how many peer-reviewed publications
      type: number
      options: []
      required: true
    - id: 25
      name: first_author_publications
      label: First-Author Publications
      hint: How many as first author
      type: number
      options: []
      required: false
    - id: 26
      name: publications_list
      label: List of Key Publications
      hint: Cite 3-5 most relevant publications
      type: text
      options: []
      required: true
    - id: 27
      name: h_index
      label: H-Index
      hint: If available
      type: number
      options: []
      required: false
    - id: 28
      name: grants_received
      label: Grants or Funding Received
      hint: Funding you have secured
      type: text
      options: []
      required: false
    - id: 29
      name: section_skills
      label: -- Technical Skills --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: technical_skills
      label: Technical or Laboratory Skills
      hint: Select relevant skills
      type: select_multiple
      options:
      - DNA Sequencing
      - Bioinformatics
      - Microscopy
      - Cell Culture
      - Molecular Cloning
      - Protein Purification
      - Flow Cytometry
      - Statistical Analysis
      required: true
    - id: 31
      name: programming_languages
      label: Programming Languages
      hint: Languages you are proficient in
      type: select_multiple
      options:
      - Python
      - R
      - MATLAB
      - Java
      - C++
      - Shell Script
      - SQL
      - None
      required: false
    - id: 32
      name: section_credentials
      label: -- Credentials and Certifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 33
      name: certifications
      label: Professional Certifications
      hint: Relevant certifications you hold
      type: text
      options: []
      required: false
    - id: 34
      name: biohazard_training
      label: Biohazard or Safety Training
      hint: Do you have current safety training
      type: select_one
      options:
      - Yes, Current
      - Yes, Expired
      - false
      required: true
    - id: 35
      name: section_references
      label: -- References --
      hint: null
      type: note
      options: []
      required: false
    - id: 36
      name: references
      label: Professional References
      hint: Provide 3 professional references with names, titles, and contact info
      type: text
      options: []
      required: true
    - id: 37
      name: authorization
      label: I certify that the information provided is true and complete
      hint: Check to confirm
      type: select_one
      options:
      - I Certify
      - I Do Not Certify
      required: true
