inputSchema:
  type: object
  properties:
    title: E Commerce Digital Marketing Interview Form
    pages:
    - id: 1
      name: intro
      label: What is your background in Digital Marketing?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: e_commerce_channels
      label: Which e-commerce channels have you worked with?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: digital_marketing_experience
      label: What is your experience level in Digital Marketing?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: job_title
      label: What is your current Job Title?
      hint: null
      type: select_one
      options:
      - Amazon Seller
      - Brand Manager
      - Content Manager
      - E-commerce Manager
      - Marketing Manager
      - Other
      required: false
    - id: 5
      name: company_name
      label: Company name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: years_of_experience
      label: What is your experience in Digital Marketing (Years)?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: skills
      label: What are your key skills?
      hint: null
      type: select_multiple
      options:
      - Data Analysis
      - E-commerce
      - Email Marketing
      - Marketing Strategy
      - Search Engine Optimization (SEO)
      - Social Media
      - Web Analytics
      - Other
      required: false
    - id: 8
      name: education
      label: What is your educational background?
      hint: null
      type: select_one
      options:
      - Bachelor's degree
      - Master's degree
      - Other
      required: false
    - id: 9
      name: work_experience
      label: What is your work experience in the field of Digital Marketing?
      hint: null
      type: number
      options: []
      required: false
