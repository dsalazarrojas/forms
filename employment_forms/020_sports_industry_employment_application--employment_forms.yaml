inputSchema:
  type: object
  properties:
    title: Sports Industry Employment Application
    pages:
    - id: 1
      name: candidate_information
      label: Candidate Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Employed
      - Not Employed
      - Self-Employed
      required: false
    - id: 4
      name: employment_type
      label: Employment Type
      hint: null
      type: select_multiple
      options:
      - Full-time
      - Part-time
      - Seasonal
      - Project
      required: false
    - id: 5
      name: work_experience
      label: Work Experience
      hint: Please list your previous work experience in the sports industry.
      type: note
      options: []
      required: false
    - id: 6
      name: education
      label: Education
      hint: Please list your relevant education and qualifications.
      type: note
      options: []
      required: false
    - id: 7
      name: skills
      label: Skills
      hint: Please list your relevant skills.
      type: note
      options: []
      required: false
    - id: 8
      name: references
      label: References
      hint: Please list 2 professional references.
      type: note
      options: []
      required: false
    - id: 9
      name: upload_file
      label: Upload File
      hint: null
      type: text
      options: []
      required: false
