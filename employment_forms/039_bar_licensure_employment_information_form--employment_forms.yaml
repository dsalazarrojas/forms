inputSchema:
  type: object
  properties:
    title: Bar Licensure Employment Information Form
    pages:
    - id: 1
      name: application_date
      label: Application Date
      hint: Date of this application
      type: date
      options: []
      required: true
    - id: 2
      name: applicant_first_name
      label: Applicant First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_last_name
      label: Applicant Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: Your email contact
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 7
      name: current_address
      label: Current Residential Address
      hint: Where do you live?
      type: text
      options: []
      required: true
    - id: 8
      name: current_employment_status
      label: Current Employment Status
      hint: Your current job situation
      type: select_one
      options:
      - Employed Full-Time
      - Employed Part-Time
      - Self-Employed
      - Unemployed
      - Student
      - Retired
      required: true
    - id: 9
      name: current_employer
      label: Current Employer Name
      hint: Name of current employer
      type: text
      options: []
      required: false
    - id: 10
      name: current_position
      label: Current Position Title
      hint: Your job title
      type: text
      options: []
      required: false
    - id: 11
      name: current_employment_length
      label: Length of Current Employment
      hint: How long at current job?
      type: text
      options: []
      required: false
    - id: 12
      name: previous_employer_1
      label: Previous Employer (Most Recent)
      hint: Prior employer name
      type: text
      options: []
      required: false
    - id: 13
      name: previous_position_1
      label: Previous Position
      hint: Job title at previous employer
      type: text
      options: []
      required: false
    - id: 14
      name: employment_dates_1
      label: Employment Dates
      hint: From and to dates
      type: text
      options: []
      required: false
    - id: 15
      name: previous_employer_2
      label: Prior Employer (Before That)
      hint: Second previous employer
      type: text
      options: []
      required: false
    - id: 16
      name: previous_position_2
      label: Prior Position
      hint: Job title
      type: text
      options: []
      required: false
    - id: 17
      name: employment_dates_2
      label: Employment Dates
      hint: From and to dates
      type: text
      options: []
      required: false
    - id: 18
      name: bar_related_experience
      label: Bar or Hospitality Experience
      hint: Years in bar or restaurant industry
      type: select_one
      options:
      - No Experience
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 19
      name: bar_positions_held
      label: Bar Positions Held
      hint: Select all applicable
      type: select_multiple
      options:
      - Bartender
      - Barback
      - Server
      - Cocktail Server
      - Bar Manager
      - General Manager
      - Host or Hostess
      - Other
      required: false
    - id: 20
      name: certifications
      label: Relevant Certifications
      hint: TIPS, ServSafe, Mixology, etc.
      type: text
      options: []
      required: false
    - id: 21
      name: criminal_history
      label: Conviction History
      hint: Any criminal convictions?
      type: select_one
      options:
      - false
      - 'Yes'
      - Pending Resolution
      required: true
    - id: 22
      name: conviction_details
      label: If Yes, Provide Details
      hint: Type of conviction and date
      type: text
      options: []
      required: false
    - id: 23
      name: professional_references
      label: Professional References
      hint: List 2-3 references with contact info
      type: text
      options: []
      required: false
    - id: 24
      name: willingness_verification
      label: I Consent to Background Check
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
