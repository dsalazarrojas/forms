inputSchema:
  type: object
  properties:
    title: Biotechnology Sector Job Application Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: Current Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 7
      name: location_willing
      label: Willing to Relocate
      hint: Are you willing to relocate
      type: select_one
      options:
      - true
      - false
      - Depends on Opportunity
      required: true
    - id: 8
      name: section_position
      label: -- Position Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: position_applied
      label: Position Title You Are Applying For
      hint: Job title
      type: text
      options: []
      required: true
    - id: 10
      name: position_category
      label: Position Category
      hint: Type of role
      type: select_one
      options:
      - Research Scientist
      - Quality Assurance
      - Manufacturing
      - Regulatory Affairs
      - Business Development
      - Project Management
      - Other
      required: true
    - id: 11
      name: employment_type_pref
      label: Employment Type Preference
      hint: Type of work arrangement
      type: select_one
      options:
      - Full-Time
      - Part-Time
      - Contract
      - Temporary
      required: true
    - id: 12
      name: available_start_date
      label: Available Start Date
      hint: When can you begin
      type: date
      options: []
      required: true
    - id: 13
      name: section_education
      label: -- Education --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: highest_degree
      label: Highest Degree Earned
      hint: Your highest degree
      type: select_one
      options:
      - Bachelor's Degree
      - Master's Degree
      - PhD
      - Professional Degree
      - Other
      required: true
    - id: 15
      name: degree_field
      label: Field of Study
      hint: Major or specialization
      type: text
      options: []
      required: true
    - id: 16
      name: university_name
      label: University or Institution
      hint: School name
      type: text
      options: []
      required: true
    - id: 17
      name: graduation_date
      label: Graduation Date
      hint: When did you graduate
      type: date
      options: []
      required: false
    - id: 18
      name: gpa
      label: GPA
      hint: Grade point average if recent graduate
      type: number
      options: []
      required: false
    - id: 19
      name: section_experience
      label: -- Professional Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: years_biotech
      label: Years of Biotech Experience
      hint: Total years in biotech field
      type: number
      options: []
      required: true
    - id: 21
      name: current_employer
      label: Current Employer
      hint: Company name
      type: text
      options: []
      required: false
    - id: 22
      name: current_position
      label: Current Position Title
      hint: Your current job title
      type: text
      options: []
      required: false
    - id: 23
      name: previous_roles
      label: Previous Relevant Positions
      hint: Describe past biotech roles
      type: text
      options: []
      required: false
    - id: 24
      name: section_skills
      label: -- Technical Skills --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: technical_skills
      label: Technical Skills and Expertise
      hint: Select relevant skills
      type: select_multiple
      options:
      - DNA Sequencing
      - Bioinformatics
      - Cell Culture
      - Protein Analysis
      - Molecular Cloning
      - Microscopy
      - Flow Cytometry
      - Quality Control
      - Manufacturing
      required: true
    - id: 26
      name: software_tools
      label: Software and Tools Experience
      hint: Software you can use
      type: text
      options: []
      required: false
    - id: 27
      name: laboratory_equipment
      label: Laboratory Equipment Experience
      hint: Equipment you have used
      type: text
      options: []
      required: false
    - id: 28
      name: section_certifications
      label: -- Certifications and Licenses --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: certifications
      label: Relevant Certifications
      hint: List any certifications
      type: text
      options: []
      required: false
    - id: 30
      name: safety_training
      label: Safety Certifications
      hint: Biohazard, safety training, etc.
      type: text
      options: []
      required: false
    - id: 31
      name: section_documents
      label: -- Application Documents --
      hint: null
      type: note
      options: []
      required: false
    - id: 32
      name: resume_upload
      label: Upload Resume or CV
      hint: PDF or Word document
      type: text
      options: []
      required: true
    - id: 33
      name: cover_letter_upload
      label: Upload Cover Letter
      hint: Optional - PDF or Word document
      type: text
      options: []
      required: false
    - id: 34
      name: portfolio_link
      label: Portfolio or Website Link
      hint: Optional - Link to your work
      type: text
      options: []
      required: false
    - id: 35
      name: publications
      label: Publications or Patents
      hint: List any relevant publications
      type: text
      options: []
      required: false
    - id: 36
      name: section_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 37
      name: why_interested
      label: Why Are You Interested in This Position
      hint: Explain your interest
      type: text
      options: []
      required: true
    - id: 38
      name: relevant_achievements
      label: Key Achievements Relevant to This Role
      hint: Describe accomplishments
      type: text
      options: []
      required: false
    - id: 39
      name: background_check_consent
      label: I consent to a background check
      hint: Confirm consent
      type: select_one
      options:
      - I Consent
      - I Do Not Consent
      required: true
    - id: 40
      name: legal_authorization
      label: Are you legally authorized to work in this country
      hint: Confirm work authorization
      type: select_one
      options:
      - true
      - false
      - Pending
      required: true
