inputSchema:
  type: object
  properties:
    title: COVID 19 Work Authorization Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: position
      label: Job Position or Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: work_location
      label: Primary Work Location
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: email
      label: Work Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Work Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: authorization_date
      label: Date of Authorization
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: vaccination_status
      label: Vaccination Status
      hint: COVID-19 vaccine status
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Unvaccinated
      - Recently booster
      - Medical exemption
      - Religious exemption
      required: true
    - id: 11
      name: vaccination_verification
      label: Vaccination Documentation Provided
      hint: null
      type: select_one
      options:
      - true
      - false
      - Pending verification
      required: true
    - id: 12
      name: vaccine_card_uploaded
      label: Vaccine Card or Records Uploaded
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 13
      name: recent_covid_test
      label: Recent COVID-19 Test Required
      hint: Within past 72 hours
      type: select_one
      options:
      - Yes, passed
      - Yes, failed
      - Not required
      - Pending results
      required: true
    - id: 14
      name: exemption_type
      label: Type of Exemption Claimed
      hint: If applicable
      type: select_one
      options:
      - No exemption
      - Medical exemption
      - Religious exemption
      - Other exemption
      required: true
    - id: 15
      name: exemption_documentation
      label: Exemption Documentation Provided
      hint: null
      type: select_one
      options:
      - true
      - false
      - In progress
      required: false
    - id: 16
      name: health_assessment
      label: Health Assessment Completed
      hint: Screening for COVID-19 symptoms
      type: select_one
      options:
      - Yes, cleared to work
      - Yes, symptoms present
      - Not yet completed
      required: true
    - id: 17
      name: safety_agreement
      label: Agreement to Follow Workplace Safety Protocols
      hint: Masks, distancing, sanitization
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 18
      name: authorization_approved
      label: Work Authorization Status
      hint: null
      type: select_one
      options:
      - Approved - may work
      - Conditional approval
      - Denied - cannot work
      - Pending review
      required: true
    - id: 19
      name: authorized_by
      label: Authorized By - Manager or HR Name
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: authorization_notes
      label: Additional Notes or Conditions
      hint: Any special accommodations or restrictions
      type: text
      options: []
      required: false
