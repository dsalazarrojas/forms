inputSchema:
  type: object
  properties:
    title: Production Camera Equipment Proficiency Employment Form
    pages:
    - id: 1
      name: production_camera_equipment_profficiency_form
      label: Production Camera Equipment Proficiency Employment Form
      hint: null
      type: select_one
      options:
      - Camera Operator
      - Production Assistant
      - Cinematographer
      - Sound Mixer
      - Camera Utility
      required: false
    - id: 2
      name: production_camera_equipment_proficiency_form_question_one
      label: Which of the following cameras do you have experience with?
      hint: null
      type: select_multiple
      options:
      - Canon C300
      - Canon C500
      - RED
      - Sony F65
      - Arri Alexa
      - SONY F55
      required: false
    - id: 3
      name: camera_equipment_proficiency_question_two
      label: How many years of experience do you have with the camera?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: camera_equipment_proficiency_question_three
      label: How many years of experience have you had with the camera's accessories?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: camera_equipment_proficiency_question_four
      label: What is the most complicated camera system you have worked with?
      hint: null
      type: select_one
      options:
      - Canon C300
      - Sony F65
      - Arri Alexa
      - RED
      required: false
    - id: 6
      name: camera_equipment_proficiency_question_five
      label: What is your experience level with camera accessories?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: production_camera_equipment_proficiency_question_six
      label: On what type of camera equipment do you need help?
      hint: null
      type: select_multiple
      options:
      - Camera rigging
      - Camera maintenance
      - Camera setup and testing
      - Camera operation and adjustment
      required: false
    - id: 8
      name: production_camera_equipment_proficiency_question_seven
      label: Can you perform camera maintenance, including cleaning and adjustments?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: production_camera_equipment_proficiency_question_eight
      label: Can you perform camera testing?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: production_camera_equipment_proficiency_question_nine
      label: Can you perform camera rigging?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: production_camera_equipment_proficiency_question_ten
      label: Have you performed on-location shoots?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
