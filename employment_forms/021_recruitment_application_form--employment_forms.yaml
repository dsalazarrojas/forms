inputSchema:
  type: object
  properties:
    title: Recruitment Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: job_title
      label: Job Title
      hint: null
      type: select_one
      options:
      - Junior Developer
      - Senior Developer
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: resume
      label: Resume
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: work_history
      label: Work History
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: education
      label: Education
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: job_satisfaction
      label: Job Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 12
      name: available_languages
      label: Available Languages
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      - Arabic
      required: true
    - id: 13
      name: available_technologies
      label: Available Technologies
      hint: null
      type: select_multiple
      options:
      - Html
      - Css
      - JavaScript
      - Python
      required: true
