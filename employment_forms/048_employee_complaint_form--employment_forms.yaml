inputSchema:
  type: object
  properties:
    title: Employee Complaint Form
    pages:
    - id: 1
      name: employee_complaint_form_page_1
      label: Description of the complaint
      hint: Please describe the issue you are experiencing
      type: text
      options: []
      required: true
    - id: 2
      name: employee_complaint_form_page_2
      label: Incident description
      hint: Provide details about what happened
      type: text
      options: []
      required: true
    - id: 3
      name: employee_complaint_form_page_3
      label: Action taken
      hint: Describe the action taken by you
      type: text
      options: []
      required: true
    - id: 4
      name: employee_complaint_form_page_4
      label: Witness
      hint: If there were any witnesses, please list their names
      type: text
      options: []
      required: true
    - id: 5
      name: employee_complaint_form_page_5
      label: Incident date
      hint: Date of the incident
      type: date
      options: []
      required: true
    - id: 6
      name: employee_complaint_form_page_6
      label: Incident time
      hint: Time of the incident
      type: time
      options: []
      required: true
    - id: 7
      name: employee_complaint_form_page_7
      label: Incident location
      hint: Location of the incident
      type: text
      options: []
      required: true
    - id: 8
      name: employee_complaint_form_page_8
      label: Relationship between you and the complainant
      hint: Who was the person you were interacting with?
      type: select_multiple
      options:
      - Other
      - Employee
      - Supervisor
      required: true
    - id: 9
      name: employee_complaint_form_page_9
      label: Type of incident
      hint: Choose the type of incident that occurred
      type: select_multiple
      options:
      - Other
      - Verbal Abuse
      - Physical Threat
      required: true
    - id: 10
      name: employee_complaint_form_page_10
      label: Incident details
      hint: Provide any additional details you think are relevant
      type: text
      options: []
      required: true
    - id: 11
      name: employee_complaint_form_page_11
      label: Supporting documentation
      hint: Upload any supporting documentation for this incident
      type: text
      options: []
      required: false
