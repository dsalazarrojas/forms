inputSchema:
  type: object
  properties:
    title: Recruitment of Managers Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: manager_title
      label: Manager Title
      hint: null
      type: select_multiple
      options:
      - Senior Manager
      - Team Lead
      - Department Head
      required: true
    - id: 5
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: availability
      label: Availability
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: work_hours
      label: Work Hours
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: job_location
      label: Job Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Full Time
      - Part Time
      - Contract
      required: true
    - id: 11
      name: manager_references
      label: Manager References
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: job_status
      label: Job Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      - Pending
      required: true
    - id: 13
      name: employment_type
      label: Employment Type
      hint: Check the employment type that applies to your job
      type: select_multiple
      options:
      - Salary
      - Benefits
      - Other
      required: false
    - id: 14
      name: work_experience
      label: Work Experience
      hint: null
      type: select_one
      options:
      - 0-2 years
      - 2-5 years
      - 5-10 years
      required: true
    - id: 15
      name: skills
      label: Skills
      hint: null
      type: text
      options: []
      required: true
