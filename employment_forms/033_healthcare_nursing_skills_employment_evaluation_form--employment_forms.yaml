inputSchema:
  type: object
  properties:
    title: Healthcare Nursing Skills Employment Evaluation Form
    pages:
    - id: 1
      name: general_info
      label: General Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: List any medical history that might impact the candidate
      type: text
      options: []
      required: false
    - id: 3
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
