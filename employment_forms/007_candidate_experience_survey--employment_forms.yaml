inputSchema:
  type: object
  properties:
    title: Candidate Experience Survey
    pages:
      - id: 1
        name: intro_header
        label: -- Candidate Experience Feedback --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: intro_text
        label: Thank you for applying to our organization. Your feedback helps us improve our hiring process.
        hint: null
        type: note
        options: []
        required: false
      - id: 3
        name: candidate_info_header
        label: -- Candidate Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 4
        name: full_name
        label: Full Name
        hint: Your name
        type: text
        options: []
        required: true
      - id: 5
        name: email_address
        label: Email Address
        hint: Your email
        type: email
        options: []
        required: true
      - id: 6
        name: position_applied
        label: Position(s) Applied For
        hint: Job title
        type: text
        options: []
        required: true
      - id: 7
        name: application_date
        label: Date of Application
        hint: When you applied
        type: date
        options: []
        required: false
      - id: 8
        name: hiring_stage
        label: At which stage of the hiring process are you?
        hint: Select your current stage
        type: select_one
        options:
          - Initial screening
          - Phone interview
          - Technical assessment
          - In-person interview
          - Final round
          - Offer received
          - Rejected
          - Withdrawn
        required: true
      - id: 9
        name: application_experience_header
        label: -- Application Process Experience --
        hint: null
        type: note
        options: []
        required: false
      - id: 10
        name: application_ease
        label: How easy was the application process?
        hint: Rate the difficulty
        type: select_one
        options:
          - Very Easy
          - Easy
          - Neutral
          - Difficult
          - Very Difficult
        required: true
      - id: 11
        name: application_length
        label: Was the application length appropriate?
        hint: Select one
        type: select_one
        options:
          - Too Short
          - Appropriate
          - Too Long
          - Unclear
        required: false
      - id: 12
        name: clarity_of_requirements
        label: How clear were the job requirements?
        hint: Rate clarity
        type: select_one
        options:
          - Very Clear
          - Clear
          - Somewhat Clear
          - Unclear
          - Very Unclear
        required: true
      - id: 13
        name: interview_experience_header
        label: -- Interview Experience --
        hint: null
        type: note
        options: []
        required: false
      - id: 14
        name: interview_scheduling
        label: How was the interview scheduling experience?
        hint: Rate your experience
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Applicable
        required: false
      - id: 15
        name: interviewer_professionalism
        label: How would you rate the professionalism of the interview(s)?
        hint: Rate the interviewers
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Applicable
        required: false
      - id: 16
        name: interview_preparation
        label: Were interviewers well-prepared?
        hint: Select one
        type: select_one
        options:
          - Yes, very prepared
          - Mostly prepared
          - Somewhat prepared
          - Not prepared
          - Not Applicable
        required: false
      - id: 17
        name: communication_header
        label: -- Communication and Feedback --
        hint: null
        type: note
        options: []
        required: false
      - id: 18
        name: communication_frequency
        label: How frequent was communication from the hiring team?
        hint: Rate the communication
        type: select_one
        options:
          - Very Frequent
          - Frequent
          - Adequate
          - Infrequent
          - No Communication
        required: true
      - id: 19
        name: feedback_provided
        label: Did you receive any feedback about your application?
        hint: Select one
        type: select_one
        options:
          - Yes, detailed feedback
          - Yes, some feedback
          - Minimal feedback
          - No feedback
        required: true
      - id: 20
        name: overall_experience_header
        label: -- Overall Experience --
        hint: null
        type: note
        options: []
        required: false
      - id: 21
        name: overall_satisfaction
        label: Overall, how satisfied are you with your candidate experience?
        hint: Rate your experience
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 22
        name: recommend_company
        label: Would you recommend our company as a good place to work?
        hint: Select one
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Unsure
          - Probably not
          - Definitely not
        required: true
      - id: 23
        name: improvement_suggestions
        label: What could we improve about our hiring process?
        hint: Please share your suggestions
        type: text
        options: []
        required: false
      - id: 24
        name: positive_comments
        label: What did you like best about our hiring process?
        hint: Please share positive feedback
        type: text
        options: []
        required: false
      - id: 25
        name: contact_permission
        label: May we contact you for follow-up?
        hint: Select one
        type: select_one
        options:
          - "Yes, email me"
          - "Yes, call me"
          - No, thank you
        required: false
