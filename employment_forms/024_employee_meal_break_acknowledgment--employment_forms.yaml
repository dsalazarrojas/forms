inputSchema:
  type: object
  properties:
    title: Employee Meal Break Acknowledgment
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: role
      label: Job Title
      hint: null
      type: select_one
      options:
      - Manager
      - Supervisor
      - Employee
      required: false
    - id: 3
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - HR
      - IT
      - Management
      - Marketing
      - Operations
      required: false
    - id: 4
      name: meal_break_duration
      label: Meal Break Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: break_schedule
      label: Break Schedule
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: reason_for_break
      label: Reason for Break
      hint: null
      type: select_multiple
      options:
      - Short break
      - Long break
      - Other (please specify)
      required: false
    - id: 9
      name: meal_break_policy
      label: Meal Break Policy
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: signature
      label: Employee Signature
      hint: null
      type: note
      options: []
