inputSchema:
  type: object
  properties:
    title: Adjunct Faculty Employment Application
    pages:
    - id: 1
      name: applicant_information
      label: Applicant information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: As it appears on legal documents
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For recruitment communications
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 5
      name: academic_qualifications
      label: Academic qualifications
      hint: Degrees certifications and institutions
      type: text
      options: []
      required: true
    - id: 6
      name: teaching_experience
      label: Teaching experience summary
      hint: Courses taught and years
      type: text
      options: []
      required: true
    - id: 7
      name: courses_interested
      label: Courses interested in teaching
      hint: List course codes or titles
      type: select_multiple
      options:
      - Introductory
      - Intermediate
      - Advanced
      - Workshops
      required: true
    - id: 8
      name: availability
      label: Availability for semester
      hint: Days and times available to teach
      type: text
      options: []
      required: true
    - id: 9
      name: references
      label: References contact details
      hint: Provide two professional references
      type: text
      options: []
      required: true
    - id: 10
      name: additional_information
      label: Additional information
      hint: Any other relevant details
      type: text
      options: []
      required: false
