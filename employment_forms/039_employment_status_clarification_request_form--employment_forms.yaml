      name: employee_name
      label: employee_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: manager_email
      label: manager_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: manager_phone
      label: manager_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: employment_status
      label: employment_status
      hint: null
