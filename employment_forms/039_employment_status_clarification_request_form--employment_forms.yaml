      - Inactive
      - Terminated
      - Other
      - Resigned
      - Retired
      - Probation
      - Leave of Absence
      required: false
    - id: 5
      name: reason_for_change
      label: reason_for_change
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_change
      label: date_of_change
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: manager_note
      label: manager_note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: hr_note
      label: hr_note
      hint: null
      type: note
      options: []
      required: false
