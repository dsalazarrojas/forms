inputSchema:
  type: object
  properties:
    title: Editorial Staff Employment Onboarding Form
    pages:
    - id: 1
      name: new_hire_details
      label: new hire details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: job title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_hire
      label: date of hire
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: job_description
      label: job description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: salary
      label: salary
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: contract_start_date
      label: contract start date
      hint: null
      type: date
      options: []
      required: false
