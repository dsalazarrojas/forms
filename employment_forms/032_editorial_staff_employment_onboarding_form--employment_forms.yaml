      hint: null
      type: select_one
      options:
      - No reason provided
      - Incomplete information
      - Not submitted
      - Rejected
      - Approved
      required: false
    - id: 24
      name: submission_date_time
      label: submission date and time
      hint: null
      type: time
      options: []
      required: false
    - id: 25
      name: submission_time_zone
      label: submission time zone
      hint: null
      type: select_one
      options:
      - UTC+0
      - Other
      required: false
