      options:
      - Editorial Team Lead
      - Publisher
      - Hiring Manager
      - HR Representative
      - Onboarding Admin
      required: false
    - id: 12
      name: acknowledgement
      label: acknowledgement
      hint: null
      type: select_multiple
      options:
      - I understand and agree
