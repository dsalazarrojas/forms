inputSchema:
  type: object
  properties:
    title: window_cleaning_appointment_form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_selection
      label: Service Selection
      hint: null
      type: select_one
      options:
      - Basic Cleaning
      - Delux Cleaning
      - Premium Cleaning
      required: false
    - id: 3
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time
      label: Time
      hint: null
      type: select_multiple
      options:
      - 08:00
      - '720'
      - '960'
      required: false
