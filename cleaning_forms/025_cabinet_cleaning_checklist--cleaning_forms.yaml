inputSchema:
  type: object
  properties:
    title: Cabinet Cleaning Checklist
    pages:
    - id: 1
      name: cleaner_name
      label: Cleaner name
      hint: Staff member completing checklist
      type: text
      options: []
      required: true
    - id: 2
      name: cleaning_date
      label: Cleaning date
      hint: Date of task completion
      type: date
      options: []
      required: true
    - id: 3
      name: cabinet_location
      label: Cabinet location
      hint: Room or area identifier
      type: text
      options: []
      required: true
    - id: 4
      name: surfaces_cleaned
      label: Surfaces cleaned
      hint: Doors shelves handles
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: disinfectant_used
      label: Disinfectant used
      hint: Product name or code
      type: text
      options: []
      required: false
    - id: 6
      name: condition_after_cleaning
      label: Condition after cleaning
      hint: Any damage or stains
      type: text
      options: []
      required: false
    - id: 7
      name: next_scheduled_cleaning
      label: Next scheduled cleaning date
      hint: Recommended follow up date
      type: date
      options: []
      required: false
    - id: 8
      name: supervisor_signature
      label: Supervisor signature reference
      hint: Name or initials
      type: text
      options: []
      required: false
