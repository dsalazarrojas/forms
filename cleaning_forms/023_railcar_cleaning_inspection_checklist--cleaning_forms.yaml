inputSchema:
  type: object
  properties:
    title: Railcar Cleaning Inspection Checklist
    pages:
    - id: 1
      name: railcar_cleaning_inspection_checklist
      label: Cleaning
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: maintenance_team
      label: Maintenance Team
      hint: null
      type: select_one
      options:
      - Team A
      - Team B
      - Team C
      required: false
    - id: 3
      name: railcar_type
      label: Railcar Type
      hint: null
      type: select_multiple
      options:
      - Railcar 1
      - Railcar 2
      - Railcar 3
      required: false
    - id: 4
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: cleaning_method
      label: Cleaning Method
      hint: null
      type: select_one
      options:
      - Method 1
      - Method 2
      - Method 3
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: railcar_condition
      label: Railcar Condition
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: inspection_frequency
      label: Inspection Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 9
      name: assigned_inspector
      label: Assigned Inspector
      hint: null
      type: select_one
      options:
      - Jimmy
      - John
      - Jane
      required: false
    - id: 10
      name: cleaning_supplies
      label: Cleaning Supplies
      hint: null
      type: select_multiple
      options:
      - Soap
      - Water
      - Rag
      required: false
    - id: 11
      name: railcar_status
      label: Railcar Status
      hint: null
      type: select_multiple
      options:
      - Inactive
      - Active
      - Retired
      required: false
    - id: 12
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - Location 1
      - Location 2
      - Location 3
      required: false
    - id: 13
      name: next_inspection_date
      label: Next Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: completed
      label: Completed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: false
    - id: 15
      name: inspection_status
      label: Inspection Status
      hint: null
      type: select_one
      options:
      - Complete
      - In Progress
      - Not Started
      required: false
    - id: 16
      name: inspection_result
      label: Inspection Result
      hint: null
      type: select_one
      options:
      - Passed
      - Failed
      - Pending
      required: false
