      name: resident_details
      label: resident_details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: housekeeping_changes_requested
      label: housekeeping_changes_requested
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: resident_consent
      label: resident_consent
      hint: null
      type: select_one
      options:
