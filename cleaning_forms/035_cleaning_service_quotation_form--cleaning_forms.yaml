inputSchema:
  type: object
  properties:
    title: Cleaning Service Quotation Form
    pages:
    - id: 1
      name: section_header_request
      label: -- Quote Request Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: quote_date
      label: Date of Quote Request
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 3
      name: quote_id
      label: Quote ID Number
      hint: Internal reference number
      type: text
      options: []
      required: false
    - id: 4
      name: section_header_client
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: client_name
      label: Client Name
      hint: Full name of the prospective client
      type: text
      options: []
      required: true
    - id: 6
      name: client_company
      label: Company Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: client_email
      label: Email Address
      hint: For sending the quote
      type: email
      options: []
      required: true
    - id: 8
      name: client_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 9
      name: client_address
      label: Client Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 10
      name: section_header_property
      label: -- Property Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: property_type
      label: Property Type
      hint: Type of property
      type: select_one
      options:
      - Single Family Home
      - Apartment
      - Condo
      - Office
      - Commercial Building
      - Medical Facility
      - Other
      required: true
    - id: 12
      name: property_address
      label: Property Address
      hint: Address where cleaning is needed
      type: text
      options: []
      required: true
    - id: 13
      name: square_footage
      label: Square Footage
      hint: Approximate size in square feet
      type: number
      options: []
      required: true
    - id: 14
      name: number_bedrooms
      label: Number of Bedrooms
      hint: For residential properties
      type: number
      options: []
      required: false
    - id: 15
      name: number_bathrooms
      label: Number of Bathrooms
      hint: For residential properties
      type: number
      options: []
      required: false
    - id: 16
      name: section_header_service
      label: -- Cleaning Service Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: service_type
      label: Type of Cleaning Service
      hint: What kind of cleaning is needed?
      type: select_one
      options:
      - Regular Cleaning
      - Deep Cleaning
      - Move-In/Move-Out
      - Window Cleaning
      - Carpet Cleaning
      - Tile and Grout Cleaning
      - Post-Construction
      - Other
      required: true
    - id: 18
      name: areas_to_clean
      label: Areas to be Cleaned
      hint: Select all applicable areas
      type: select_multiple
      options:
      - Kitchen
      - Bathrooms
      - Bedrooms
      - Living/Dining Areas
      - Hallways
      - Floors
      - Windows
      - Carpets
      - All Areas
      required: true
    - id: 19
      name: special_services
      label: Special Services or Extras
      hint: Any additional services needed?
      type: text
      options: []
      required: false
    - id: 20
      name: section_header_frequency
      label: -- Service Frequency --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: frequency
      label: Desired Cleaning Frequency
      hint: How often do they need cleaning?
      type: select_one
      options:
      - One-Time Service
      - Weekly
      - Bi-weekly
      - Monthly
      - As Needed
      required: true
    - id: 22
      name: contract_duration
      label: Contract Duration
      hint: Length of the proposed contract
      type: select_one
      options:
      - One-Time Service
      - 3 Months
      - 6 Months
      - 1 Year
      - Flexible
      required: true
    - id: 23
      name: section_header_conditions
      label: -- Special Conditions --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: pets_in_home
      label: Pets in the Property
      hint: null
      type: select_one
      options:
      - No Pets
      - Dogs
      - Cats
      - Other
      required: true
    - id: 25
      name: access_type
      label: Property Access
      hint: How will crew access property?
      type: select_one
      options:
      - Customer Home
      - Hidden Key
      - Keypad Code
      - Building Entrance
      - Other
      required: true
    - id: 26
      name: special_conditions
      label: Special Conditions or Requirements
      hint: Any specific needs or concerns?
      type: text
      options: []
      required: false
    - id: 27
      name: section_header_estimate
      label: -- Quote Estimate --
      hint: null
      type: note
      options: []
      required: false
    - id: 28
      name: estimated_duration
      label: Estimated Service Duration
      hint: Hours needed per visit
      type: number
      options: []
      required: true
    - id: 29
      name: hourly_rate
      label: Hourly Rate
      hint: Cost per hour
      type: number
      options: []
      required: true
    - id: 30
      name: per_service_cost
      label: Cost Per Service
      hint: Total cost per cleaning visit
      type: number
      options: []
      required: true
    - id: 31
      name: monthly_cost
      label: Estimated Monthly Cost
      hint: Based on selected frequency
      type: number
      options: []
      required: false
    - id: 32
      name: validity_period
      label: Quote Validity Period
      hint: How long is this quote valid?
      type: select_one
      options:
      - 7 Days
      - 14 Days
      - 30 Days
      - 60 Days
      - 90 Days
      required: true
    - id: 33
      name: notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
