inputSchema:
  type: object
  properties:
    title: Bathroom Cleaning Form
    pages:
    - id: 1
      name: personnel_header
      label: -- Cleaner Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: staff_full_name
      label: Staff Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: staff_email
      label: Email Address
      hint: For confirmation and reporting
      type: email
      options: []
      required: true
    - id: 4
      name: work_details_header
      label: -- Work Log Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: work_date
      label: Cleaning Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: shift_start_time
      label: Shift Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: shift_end_time
      label: Shift End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: facility_areas_cleaned
      label: Specific areas cleaned during this shift
      hint: Select all that apply
      type: select_multiple
      options:
      - Public Restrooms (Lobby)
      - Employee Restrooms (Level 1)
      - Employee Restrooms (Level 2)
      - Executive Suite Bathrooms
      - Locker Rooms/Showers
      required: true
    - id: 9
      name: cleaning_supplies_used
      label: Cleaning Supplies Used
      hint: null
      type: select_multiple
      options:
      - All-purpose Cleaner
      - Disinfectant Spray
      - Glass Cleaner
      - Floor Sanitizer
      - Bleach Solution
      - Scrubbing Pads
      required: true
    - id: 10
      name: supply_request
      label: Do you need to re-order any supplies?
      hint: Please list items needed
      type: text
      options: []
      required: false
    - id: 11
      name: safety_incidents
      label: Any safety incidents or slips reported?
      hint: If yes, please describe
      type: text
      options: []
      required: false
    - id: 12
      name: work_quality_confirmation
      label: I confirm all areas were cleaned according to company standards
      hint: null
      type: select_one
      options:
      - I Confirm
      - Other
      required: true
    - id: 13
      name: signature_acknowledgment
      label: Digital Signature (Type Full Name)
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: submission_timestamp
      label: Form Submission Date
      hint: null
      type: date
      options: []
      required: true
