        name: tasks_completed
        label: Tasks Completed
        hint: Select all tasks that were completed
        type: select_multiple
        options:
          - Dusting All Surfaces
          - Vacuuming Carpets
          - Sweeping Floors
          - Mopping Hard Floors
          - Cleaning Bathrooms
          - Cleaning Kitchen
          - Wiping Countertops
          - Cleaning Appliances
          - Emptying Trash
          - Making Beds
          - Changing Linens
          - Washing Dishes
