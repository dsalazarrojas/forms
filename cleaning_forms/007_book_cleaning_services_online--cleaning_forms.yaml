inputSchema:
  type: object
  properties:
    title: Book Cleaning Services Online
    pages:
    - id: 1
      name: customer_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: We will send confirmation here
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: For appointment coordination
      type: text
      options: []
      required: true
    - id: 4
      name: service_address
      label: Service Address
      hint: Full address where cleaning is needed
      type: text
      options: []
      required: true
    - id: 5
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 6
      name: postal_code
      label: Postal Code
      hint: Your postal or ZIP code
      type: text
      options: []
      required: true
    - id: 7
      name: property_type
      label: Property Type
      hint: Type of property to clean
      type: select_one
      options:
      - Residential House
      - Apartment
      - Condo
      - Office
      - Retail Space
      - Warehouse
      required: true
    - id: 8
      name: property_size
      label: Property Size
      hint: Approximate square footage
      type: select_one
      options:
      - Small under 1000 sq ft
      - Medium 1000-2000 sq ft
      - Large 2000-3000 sq ft
      - Extra Large over 3000 sq ft
      required: true
    - id: 9
      name: number_of_rooms
      label: Number of Rooms
      hint: Total rooms needing cleaning
      type: number
      options: []
      required: true
    - id: 10
      name: number_of_bathrooms
      label: Number of Bathrooms
      hint: Total bathrooms to clean
      type: number
      options: []
      required: true
    - id: 11
      name: cleaning_type
      label: Type of Cleaning Service
      hint: Select the cleaning service needed
      type: select_one
      options:
      - Standard Cleaning
      - Deep Cleaning
      - Move-In Move-Out Cleaning
      - Post-Construction Cleaning
      - Special Event Cleaning
      - Regular Maintenance
      required: true
    - id: 12
      name: specific_areas
      label: Specific Areas Needing Attention
      hint: Select areas that need extra focus
      type: select_multiple
      options:
      - Kitchen
      - Bathrooms
      - Bedrooms
      - Living Room
      - Dining Room
      - Office Space
      - Windows
      - Carpets
      - Baseboards
      required: false
    - id: 13
      name: preferred_date
      label: Preferred Service Date
      hint: When would you like the cleaning
      type: date
      options: []
      required: true
    - id: 14
      name: preferred_time
      label: Preferred Time
      hint: What time works best
      type: time
      options: []
      required: true
    - id: 15
      name: frequency
      label: Service Frequency
      hint: How often do you need cleaning
      type: select_one
      options:
      - One-Time Service
      - Weekly
      - Bi-Weekly
      - Monthly
      - Quarterly
      required: true
    - id: 16
      name: pets_on_property
      label: Are there pets on the property
      hint: Let us know about pets
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: pet_details
      label: Pet Details
      hint: Describe pets if applicable
      type: text
      options: []
      required: false
    - id: 18
      name: special_instructions
      label: Special Instructions
      hint: Any specific requirements or notes
      type: text
      options: []
      required: false
    - id: 19
      name: access_instructions
      label: Property Access Instructions
      hint: How will cleaners access the property
      type: text
      options: []
      required: false
    - id: 20
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Cash
      - Check
      - Bank Transfer
      required: true
    - id: 21
      name: estimated_budget
      label: Estimated Budget Range
      hint: Your expected budget for service
      type: select_one
      options:
      - Under $100
      - $100-$200
      - $200-$300
      - $300-$500
      - Over $500
      required: false
    - id: 22
      name: terms_agreement
      label: I agree to the service terms
      hint: By selecting yes you agree to terms
      type: select_one
      options:
      - Yes I agree
      - No I do not agree
      required: true
