inputSchema:
  type: object
  properties:
    title: Pool Cleaning Log Form
    pages:
    - id: 1
      name: pool_cleaning_log_form
      label: Pool Cleaning Log Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: maintenance_tasks
      label: Maintenance Tasks
      hint: List of maintenance tasks performed
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: Add comments for this task
      type: text
      options: []
      required: false
    - id: 5
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - Jimmy
      - John
      - Mary
      required: false
    - id: 6
      name: pool_status
      label: Pool Status
      hint: null
      type: select_one
      options:
      - Clean
      - Dirty
      - Overcrowded
      required: false
    - id: 7
      name: pool_cleaning_log_form_status
      label: Pool Cleaning Log Form Status
      hint: null
      type: select_one
      options:
      - In Progress
      - Complete
      - Not Started
      required: false
