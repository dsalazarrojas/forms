inputSchema:
  type: object
  properties:
    title: Clean Completion Survey
    pages:
    - id: 1
      name: section_header_job
      label: -- Job Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: Name of the client
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Customer Email
      hint: Email address for follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone
      label: Customer Phone
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 5
      name: job_address
      label: Service Location/Address
      hint: Address where cleaning was performed
      type: text
      options: []
      required: true
    - id: 6
      name: service_type
      label: Service Type
      hint: Type of cleaning service provided
      type: select_one
      options:
      - Residential Home Cleaning
      - Office/Commercial Cleaning
      - Deep Cleaning
      - Post-Move Cleaning
      - Carpet Cleaning
      - Window Cleaning
      - Janitorial Service
      - Other
      required: true
    - id: 7
      name: service_date
      label: Service Completion Date
      hint: Date the service was completed
      type: date
      options: []
      required: true
    - id: 8
      name: cleaning_crew_lead
      label: Cleaning Crew Lead Name
      hint: Name of the supervisor or crew leader
      type: text
      options: []
      required: false
    - id: 9
      name: section_header_scope
      label: -- Service Scope --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: areas_cleaned
      label: Areas Cleaned
      hint: Select all areas that were serviced
      type: select_multiple
      options:
      - Kitchen
      - Bathrooms
      - Bedrooms
      - Living Areas
      - Hallways
      - Floors
      - Windows
      - Carpets
      - Other
      required: true
    - id: 11
      name: additional_services
      label: Additional Services Performed
      hint: Any extra services beyond standard cleaning?
      type: text
      options: []
      required: false
    - id: 12
      name: section_header_satisfaction
      label: -- Customer Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: overall_satisfaction
      label: Overall Satisfaction with Service
      hint: How satisfied are you with the cleaning?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 14
      name: cleanliness_quality
      label: Quality of Cleaning
      hint: How clean was the work?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: professionalism
      label: Professionalism of Crew
      hint: Professionalism and courtesy of cleaning staff
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: timeliness
      label: Timeliness of Service
      hint: Were they punctual and efficient?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: attention_detail
      label: Attention to Detail
      hint: Did they notice and clean hard-to-reach areas?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 18
      name: product_quality
      label: Quality of Cleaning Products Used
      hint: Were the products effective?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 19
      name: section_header_feedback
      label: -- Feedback and Issues --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: any_issues
      label: Were there any issues or concerns?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: issues_description
      label: Please describe any issues
      hint: What went wrong or could be improved?
      type: text
      options: []
      required: false
    - id: 22
      name: positive_feedback
      label: What did we do well?
      hint: Specific compliments or positive comments
      type: text
      options: []
      required: false
    - id: 23
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: How could we improve our service?
      type: text
      options: []
      required: false
    - id: 24
      name: recommend_service
      label: Would you recommend our service to others?
      hint: null
      type: select_one
      options:
      - Yes, Definitely
      - Probably
      - Not Sure
      - Probably Not
      - 'False'
      required: true
    - id: 25
      name: future_bookings
      label: Will you book our service again?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
