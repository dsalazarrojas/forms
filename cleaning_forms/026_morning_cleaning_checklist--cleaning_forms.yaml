inputSchema:
  type: object
  properties:
    title: morning_cleaning_checklist
    pages:
    - id: 1
      name: morning_cleaning_task
      label: morning_cleaning_task
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: cleaning_status
      label: Is the floor cleaned?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Yet
      required: false
    - id: 3
      name: clean_rooms
      label: Which rooms are cleaned today?
      hint: null
      type: select_multiple
      options:
      - Kitchen
      - Bedroom
      - Living Room
      - Bathroom
      - Hallway
      - Other
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Jim
      required: false
    - id: 6
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
