      - MM/DD/YY
      - MM/DD/YYYY
      - M/D/YY
      required: true
    - id: 13
      name: end_date_format
      label: End Date Format
      hint: null
      type: select_multiple
      options:
      - MM/DD/YY
      - MM/DD/YYYY
      - M/D/YY
