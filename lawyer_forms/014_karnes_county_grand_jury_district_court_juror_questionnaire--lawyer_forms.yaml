inputSchema:
  type: object
  properties:
    title: Karnes County Grand Jury District Court Juror Questionnaire
    pages:
    - id: 1
      name: contact_info
      label: Contact Information
      hint: null
      type: select_one
      options:
      - Name
      - Address
      - City
      - State
      - Zip
      required: false
    - id: 2
      name: contact_methods
      label: Contact Methods
      hint: null
      type: select_one
      options:
      - Work Phone
      - Home Phone
      - Cell Phone
      - Email
      - Other
      required: false
    - id: 3
      name: juror_info
      label: Juror Information
      hint: null
      type: select_one
      options:
      - Do you have previous experience as a juror?
      - How many jury trials have you completed in the past year?
      - How many years have you served as a juror?
      - Have you served as a juror in any other courts besides the district court?
      - Do you have been paid any fee for serving as a juror?
      required: false
