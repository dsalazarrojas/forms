inputSchema:
  type: object
  properties:
    title: Bankruptcy Consultation Form
    pages:
    - id: 1
      name: consultation_date
      label: Consultation Date
      hint: Scheduled appointment date
      type: date
      options: []
      required: true
    - id: 2
      name: client_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: client_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 5
      name: client_phone
      label: Phone Number
      hint: Best contact phone number
      type: text
      options: []
      required: true
    - id: 6
      name: client_address
      label: Street Address
      hint: Current residential address
      type: text
      options: []
      required: true
    - id: 7
      name: client_city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 8
      name: client_state
      label: State
      hint: State of residence
      type: text
      options: []
      required: true
    - id: 9
      name: client_zip
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 10
      name: marital_status
      label: Marital Status
      hint: Current marital situation
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Separated
      - Widowed
      required: true
    - id: 11
      name: spouse_name
      label: Spouse Name (if applicable)
      hint: Name of spouse
      type: text
      options: []
      required: false
    - id: 12
      name: dependents
      label: Number of Dependents
      hint: Number of children and dependents
      type: number
      options: []
      required: true
    - id: 13
      name: occupation
      label: Current Occupation
      hint: Your job title and field
      type: text
      options: []
      required: true
    - id: 14
      name: employer_name
      label: Employer Name
      hint: Name of current employer
      type: text
      options: []
      required: true
    - id: 15
      name: monthly_gross_income
      label: Monthly Gross Income
      hint: Before deductions and taxes
      type: number
      options: []
      required: true
    - id: 16
      name: spouse_income
      label: Spouse Monthly Income
      hint: If married and working
      type: number
      options: []
      required: false
    - id: 17
      name: total_monthly_expenses
      label: Estimated Monthly Expenses
      hint: Housing, food, utilities, etc.
      type: number
      options: []
      required: true
    - id: 18
      name: total_unsecured_debt
      label: Total Unsecured Debt
      hint: Credit cards, medical bills, personal loans
      type: number
      options: []
      required: true
    - id: 19
      name: total_secured_debt
      label: Total Secured Debt
      hint: Mortgage, car loans
      type: number
      options: []
      required: true
    - id: 20
      name: total_assets
      label: Total Assets
      hint: Cash, property, vehicles, retirement
      type: number
      options: []
      required: true
    - id: 21
      name: reason_for_consultation
      label: Reason for Bankruptcy Consultation
      hint: Describe your financial situation
      type: text
      options: []
      required: true
    - id: 22
      name: previous_bankruptcy
      label: Prior Bankruptcy Filing
      hint: Have you filed before?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: chapter_preference
      label: Are You Interested in a Specific Chapter?
      hint: Have you researched bankruptcy options?
      type: select_one
      options:
      - Chapter 7
      - Chapter 11
      - Chapter 13
      - Unsure
      - No Preference
      required: false
    - id: 24
      name: creditor_communication
      label: Have Creditors or Collectors Contacted You?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Frequently
      required: true
    - id: 25
      name: legal_representation
      label: Do You Currently Have Legal Representation?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 26
      name: attorney_questions
      label: Specific Questions for the Attorney
      hint: List your primary concerns
      type: text
      options: []
      required: false
