inputSchema:
  type: object
  properties:
    title: Act Of Donation
    pages:
    - id: 1
      name: donor_information
      label: -- Donor information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: donor_name
      label: Donor name
      hint: Full name of the person donating the asset
      type: text
      options: []
      required: true
    - id: 3
      name: donee_name
      label: Donee name
      hint: Full name of the recipient
      type: text
      options: []
      required: true
    - id: 4
      name: asset_description
      label: Asset description
      hint: Describe the asset being donated
      type: text
      options: []
      required: true
    - id: 5
      name: asset_identification
      label: Asset identification
      hint: Serial number, registration or other ID
      type: text
      options: []
      required: false
    - id: 6
      name: donation_date
      label: Donation date
      hint: Date when the transfer is effective
      type: date
      options: []
      required: true
    - id: 7
      name: consideration_statement
      label: Consideration statement
      hint: Confirm there is no payment consideration
      type: select_one
      options:
      - No consideration
      - Nominal consideration
      required: true
    - id: 8
      name: witnesses
      label: Witnesses
      hint: Names and contact information for witnesses
      type: text
      options: []
      required: false
    - id: 9
      name: notarization_required
      label: Notarization required
      hint: Indicate whether notarization is needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: signatures
      label: Signatures
      hint: Donor and donee typed names for signature
      type: text
      options: []
      required: true
    - id: 11
      name: additional_notes
      label: Additional notes
      hint: Any legal notes or special conditions
      type: text
      options: []
      required: false
