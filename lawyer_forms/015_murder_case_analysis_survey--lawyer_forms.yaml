inputSchema:
  type: object
  properties:
    title: Murder Case Analysis Survey
    pages:
    - id: 1
      name: crime_scene
      label: Crime Scene
      hint: This section will help us understand the circumstances surrounding the
        crime.
      type: text
      options: []
      required: false
    - id: 2
      name: victim_info
      label: Victim Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: suspect_info
      label: Suspect Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: case_status
      label: Case Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 5
      name: crime_details
      label: Crime Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_info
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
