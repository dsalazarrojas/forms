inputSchema:
  type: object
  properties:
    title: Agency Disclosure Form
    pages:
    - id: 1
      name: parties
      label: -- Parties and Relationship --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: agent_name
      label: Agent name
      hint: Agent representing the client
      type: text
      options: []
      required: true
    - id: 3
      name: principal_name
      label: Principal name
      hint: Client represented by the agent
      type: text
      options: []
      required: true
    - id: 4
      name: relationship_type
      label: Type of agency relationship
      hint: Describe scope of authority
      type: select_one
      options: [Seller agent, Buyer agent, Dual agent, Transaction coordinator, Other]
      required: true
    - id: 5
      name: duties_disclosed
      label: Duties and obligations disclosed
      hint: Summary of duties explained to the client
      type: text
      options: []
      required: true
    - id: 6
      name: conflicts_of_interest
      label: Conflicts of interest disclosed
      hint: Note any potential conflicts
      type: text
      options: []
      required: false
    - id: 7
      name: compensation_details
      label: Compensation details
      hint: Commission terms or fees
      type: text
      options: []
      required: true
    - id: 8
      name: date_of_disclosure
      label: Date of disclosure
      hint: When disclosure was provided to client
      type: date
      options: []
      required: true
    - id: 9
      name: client_acknowledgment
      label: Client acknowledgment
      hint: Client confirmation of disclosure
      type: select_one
      options: [Acknowledged, Declined]
      required: true
    - id: 10
      name: attorney_notes
      label: Attorney notes
      hint: For internal legal use
      type: text
      options: []
      required: false
