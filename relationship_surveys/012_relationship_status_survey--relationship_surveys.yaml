    - id: 23
      name: partner_work
      label: What kind of work does your partner do?
      hint: null
      type: select_multiple
      options:
      - Office job
      - Entrepreneur
      - Freelancer
      - Student
      - Other
      required: false
    - id: 24
      name: partner_interest
      label: What are your partner's interests?
      hint: null
      type: select_multiple
      options:
      - Hiking
      - Reading
      - Traveling
      - Music
      - Other
      required: false
    - id: 25
      name: partner_education
      label: What is your partner's education level?
      hint: null
      type: select_multiple
      options:
      - Elementary
      - High school
      - Bachelor's degree
      - Master's degree
      - Some college
      - Other
      required: false
