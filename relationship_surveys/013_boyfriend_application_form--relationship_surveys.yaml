      type: text
      options: []
      required: false
    - id: 6
      name: values_alignment
      label: Values alignment
      hint: Describe your core values briefly
      type: text
      options: []
      required: false
    - id: 7
      name: availability
      label: Availability
      hint: Typical availability for dates or calls
      type: text
      options: []
      required: false
    - id: 8
      name: references
      label: References
      hint: Optional references or social links
      type: text
      options: []
