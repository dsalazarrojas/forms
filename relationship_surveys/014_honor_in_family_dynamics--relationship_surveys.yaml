inputSchema:
  type: object
  properties:
    title: Honor In Family Dynamics
    pages:
    - id: 1
      name: family_structure
      label: How do you describe your current family structure?
      hint: null
      type: select_one
      options:
      - single parent family
      - nuclear family
      - extended family
      - blended family
      - other
      required: false
    - id: 2
      name: decision_making_process_husband
      label: Do you always follow the advice of your husband/partner in decision-making?
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      - sometimes
      required: false
    - id: 3
      name: honor_influence_family
      label: How does the concept of honor influence your relationships within your
        family?
      hint: null
      type: select_multiple
      options:
      - very important
      - somewhat important
      - not very important
      - not at all
      required: false
    - id: 4
      name: conflict_resolution_strategies
      label: What are your conflict resolution strategies when disagreements arise
        within your family?
      hint: null
      type: select_multiple
      options:
      - seek help
      - avoid
      - compromise
      - give in
      - take
      required: true
    - id: 5
      name: relationship_expectations
      label: What do you expect from your relationships within your family?
      hint: null
      type: select_multiple
      options:
      - honesty
      - respect
      - loyalty
      - trust
      - commitment
      - other
      required: false
    - id: 6
      name: emotions_in_conflict
      label: How do you feel when conflicts arise within your family?
      hint: null
      type: select_multiple
      options:
      - angry
      - sad
      - happy
      - neutral
      required: false
    - id: 7
      name: conflict_resolution_effect
      label: How do conflicts affect the dynamics of your family relationships?
      hint: null
      type: select_one
      options:
      - affect family happiness
      - affect relationships with others
      - have no effect
      required: true
    - id: 8
      name: honor_importance
      label: How important is the concept of honor to you in your family relationships?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: honor_characteristics
      label: What are some key characteristics of honor in your family?
      hint: null
      type: select_multiple
      options:
      - trustworthyness
      - respect
      - loyalty
      - other
      required: false
    - id: 10
      name: conflict_resolution_strategies_2
      label: What conflict resolution strategies do you use in your family?
      hint: null
      type: select_multiple
      options:
      - seek help
      - avoid
      - compromise
      - give in
      - take
      required: true
    - id: 11
      name: conflict_resolution_effect_2
      label: How do you resolve conflicts within your family?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: honor_factors
      label: What factors influence the concept of honor in your family?
      hint: null
      type: select_multiple
      options:
      - cultural
      - religious
      - societal
      - personal
      required: false
    - id: 13
      name: conflict_resolution_strategies_3
      label: Conflict Resolution Strategies 3
      hint: null
      type: select_multiple
      options:
      - seek help
      - avoid
      - compromise
      - give in
      - take
      required: true
    - id: 14
      name: family_dynamics_description
      label: What are your family dynamics like?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: honor_concept
      label: What is honor in your family?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: honor_value
      label: What is the value of honor in your family?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: honor_definition
      label: What is the definition of honor in your family?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: honor_importance_2
      label: Why is honor important in your family?
      hint: null
      type: text
      options: []
      required: false
