      type: select_one
      options:
      - '{''option1'': ''Shallow''}'
      - '{''option2'': ''Moderate''}'
      - '{''option3'': ''Deep''}'
      required: false
    - id: 21
      name: relationship_quality_reasons
      label: Why do you describe your relationship as shallow
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: relationship_satisfaction_reasons
      label: Why are you satisfied or dissatisfied with your relationship
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: relationship_attachment
      label: How would you describe your attachment to your group
      hint: null
      type: select_multiple
      options:
      - '{''option1'': ''Secure''}'
      - '{''option2'': ''Anxious-Preoccupied''}'
      - '{''option3'': ''Dismissive-Avoidant''}'
      - '{''option4'': ''Fearful-Avoidant''}'
      required: false
    - id: 24
      name: relationship_investment
      label: How invested do you feel in your relationship with your group
      hint: null
      type: number
      options: []
      required: false
    - id: 25
      name: relationship_duration
      label: How long have you known your group
      hint: null
      type: number
      options: []
      required: false
