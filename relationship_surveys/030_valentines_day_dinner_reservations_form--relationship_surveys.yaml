inputSchema:
  type: object
  properties:
    title: Valentines Day Dinner Reservations Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: party_size
      label: party size
      hint: null
      type: select_multiple
      options:
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 7
      name: time_slot
      label: Time Slot
      hint: null
      type: select_one
      options:
      - 18:00-20:00
      - 20:00-22:00
      - 22:00-00:00
      required: true
    - id: 8
      name: reservation_date
      label: Reservation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: reservation_time
      label: Reservation Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: special_requests
      label: Special Requests
      hint: null
      type: text
      options: []
