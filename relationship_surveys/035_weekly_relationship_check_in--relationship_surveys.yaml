      required: false
    - id: 4
      name: conflict_resolution
      label: How would you describe your resolution of conflicts this week?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emotional_intimacy
      label: How would you describe your emotional intimacy this week?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: relationship_satisfaction
      label: How would you describe your relationship satisfaction this week?
      hint: null
      type: text
      options: []
      required: false
