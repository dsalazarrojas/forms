      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65 or older
      required: true
    - id: 9
      name: education_level
      label: Education level
      hint: null
      type: select_one
      options:
      - Elementary
      - High School
      - Some College
      - Bachelor's
      - Master's
      - Doctoral
      required: true
    - id: 10
      name: income_level
      label: Income level
      hint: null
      type: select_one
      options:
      - Less than $25,000
      - $25,000-$49,999
      - $50,000-$74,999
