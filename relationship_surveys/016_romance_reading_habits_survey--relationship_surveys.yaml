inputSchema:
  type: object
  properties:
    title: Romance Reading Habits Survey
    pages:
    - id: 1
      name: romance_reading_habits_survey
      label: What is your preferred method of reading romance?
      hint: null
      type: select_multiple
      options:
      - Romance
      - Fantasy
      - Mystery
      - Historical
      - Horror
      - Science Fiction
      - Other
      required: true
    - id: 2
      name: favorite_romance_subgenre
      label: Favorite romance subgenre
      hint: null
      type: select_one
      options:
      - Contemporary
      - Historical
      - Fantasy
      - Paranormal
      - Other
      required: true
    - id: 3
      name: reading_frequency
      label: How often do you read romance novels?
      hint: null
      type: select_one
      options:
      - Rarely
      - Occasionally
      - Sometimes
      - Frequently
      - Almost Daily
      required: true
    - id: 4
      name: preferred_reading_format
      label: Preferred reading format
      hint: null
      type: select_multiple
      options:
      - Book
      - Audiobook
      - E-book
      - Graphic Novel
      - Comic Book
      required: true
    - id: 5
      name: romance_reading_habits_survey_note
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email_address
      label: Email Address
      hint: example@example.com
      type: email
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
