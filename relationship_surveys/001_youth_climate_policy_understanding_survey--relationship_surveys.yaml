inputSchema:
  type: object
  properties:
    title: Youth Climate Policy Understanding Survey
    pages:
    - id: 1
      name: survey_participant_information
      label: Survey Participant Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: education_level
      label: Education Level
      hint: null
      type: select_one
      options:
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Non-binary
      required: false
    - id: 5
      name: climate_change_concerns
      label: climate change concerns
      hint: What do you think is the most important issue that the world should be
        focusing on right now?
      type: select_multiple
      options:
      - Climate change and global warming
      - Economic inequality and poverty
      - Racial and social injustice
      - War and conflict
      - Other
      required: false
    - id: 6
      name: policy_priority
      label: What should be the policy priorities for our country?
      hint: Please select one or multiple options.
      type: select_multiple
      options:
      - Reducing greenhouse gas emissions
      - Creating more jobs and opportunities for young people
      - Improving public transportation and urban planning
      - Protecting and conserving natural spaces
      - Increasing public awareness
      required: false
    - id: 7
      name: government_response
      label: What should be the response from the government to climate change?
      hint: Select all the options that apply to you.
      type: select_multiple
      options:
      - Reduce greenhouse gas emissions
      - Create more jobs and opportunities
      - Improve public transportation and urban planning
      - Protect natural spaces
      - Increase public awareness and education
      - Other
      required: false
    - id: 8
      name: policy_recommendation
      label: What do you think would be the best way to address climate change?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: survey_conclusion
      label: Conclusion
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact_information
      label: Contact Information
      hint: null
      type: note
      options: []
      required: false
