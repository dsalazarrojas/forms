inputSchema:
  type: object
  properties:
    title: Foreign Conflict Awareness Survey
    pages:
    - id: 1
      name: introduction_page
      label: Foreign Conflict Awareness Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: general_knowledge
      label: What do you know about foreign conflicts?
      hint: Check all that apply
      type: select_multiple
      options:
      - Afghanistan
      - Syria
      - Yemen
      - South Sudan
      - Ukraine
      required: false
    - id: 3
      name: info_sources_1
      label: What are your main sources of information about foreign conflicts?
      hint: null
      type: select_multiple
      options:
      - Newspapers
      - TV and radio
      - Social media
      - Books
      - Other
      - Online news websites
      - Podcasts
      - None of the above
      required: false
    - id: 4
      name: info_sources_2
      label: Other sources of foreign conflict information
      hint: null
      type: select_multiple
      options:
      - Friends
      - Family
      - Online forums
      - Social media influencers
      - Other
      required: false
    - id: 5
      name: conflict_knowledge
      label: How much do you know about this conflict?
      hint: null
      type: select_one
      options:
      - A lot
      - A little
      - Not much
      - None
      - Unsure
      required: false
    - id: 6
      name: conflict_feeling
      label: How do you feel about this conflict?
      hint: null
      type: select_multiple
      options:
      - Concerned
      - Indifferent
      - Angry
      - Frustrated
      - Sad
      - Scared
      - None
      required: false
    - id: 7
      name: perceived_risk
      label: How much risk do you perceive for the United States?
      hint: null
      type: select_multiple
      options:
      - High
      - Moderate
      - Low
      - None
      - Unsure
      required: false
    - id: 8
      name: perceived_contribution
      label: How much do you think the United States will contribute to a resolution
        of the conflict?
      hint: null
      type: select_multiple
      options:
      - High
      - Moderate
      - Low
      - None
      - Unsure
      required: false
    - id: 9
      name: international_involvement
      label: Should the United States get involved in this conflict?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 10
      name: us_support
      label: Do you support or oppose United States involvement in this conflict?
      hint: null
      type: select_multiple
      options:
      - Support
      - Oppose
      - Unsure
      required: false
    - id: 11
      name: comments
      label: Do you have any additional comments?
      hint: null
      type: note
      options: []
      required: false
