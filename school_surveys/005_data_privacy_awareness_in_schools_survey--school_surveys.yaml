      - Other
      - Unknown
      required: false
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: staff_question_1
      label: Staff Question 1
      hint: null
      type: select_multiple
      options:
      - What is the purpose of data collection and use in schools?
      - Why is data collection and use in schools important?
      - Who has access to data in schools?
      - How accurate and up-to-date is the data stored in school records?
      - Is the data collected and used in school records secure?
      - Is staff training required on data privacy and security best practices?
      - Are there consequences for staff violating data privacy and security best
        practices?
      - How often are data audits conducted at our school?
      required: true
    - id: 5
      name: staff_question_2
      label: Staff Question 2
      hint: null
      type: select_multiple
      options:
      - What are the most common data privacy and security concerns in schools?
      - Who is the primary contact person responsible for data privacy and security
        concerns?
      - Is there a formal data breach response plan in place?
      - How often are staff members reminded of data privacy and security best practices?
      - Are students informed about data collection and use in schools?
      - Who has access to student data outside of school hours?
      - Is student data deleted when it is no longer needed?
      required: true
    - id: 6
      name: staff_question_3
      label: Staff Question 3
      hint: null
      type: select_multiple
      options:
      - Who has access to student data during school hours?
      - Is student data stored locally or in the cloud?
      - Who is the designated Data Protection Officer (DPO) for our school?
      - Are there consequences for accessing or mishandling student data during school
        hours?
      - How often is student data updated during the school year?
      - Is parental consent required for student data collection?
      - Are there data retention and disposal policies for student data?
      required: true
    - id: 7
      name: staff_question_4
      label: Staff Question 4
      hint: null
      type: select_multiple
      options:
      - What is the primary reason for student data collection and use in our school?
      - Who reviews and approves data collection and use in schools?
      - How often are staff trained on data privacy and security best practices?
      - Are there consequences for data mishandling or misuse during school hours?
      - Is student data shared with outside entities during school hours?
      - How often is student data audited during the school year?
      - Is student data used for marketing or fundraising purposes?
      required: true
    - id: 8
      name: staff_question_5
      label: Staff Question 5
      hint: null
      type: select_multiple
      options:
      - What is the data collection and use policy for our school?
      - Who reviews and updates the data collection and use policy?
      - How often is the data collection and use policy updated?
      - Are there consequences for violating data collection and use policy?
      - Is student data protected in case of a data breach?
      - How often is student data backed up during the school year?
      - Is student data encrypted during transmission?
      required: true
