title: Resident satisfaction survey
description: Generate a Resident satisfaction survey survey for the "School surveys" category. Use the template name: "Resident satisfaction survey template".
questions:
  - text: Overall, how satisfied are you with resident satisfaction survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Resident, Satisfaction, Survey, School]
  - text: How often do you interact with resident satisfaction survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
