inputSchema:
  type: object
  properties:
    title: Before And After School Care Registration Form
    pages:
    - id: 1
      name: parent_name
      label: Parent or Guardian Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: parent_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: parent_phone
      label: Phone Number
      hint: Best number to reach you
      type: text
      options: []
      required: true
    - id: 4
      name: home_address
      label: Home Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 5
      name: child_name
      label: Child Name
      hint: Full name of child
      type: text
      options: []
      required: true
    - id: 6
      name: child_dob
      label: Child Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 7
      name: child_gender
      label: Child Gender
      hint: Gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 8
      name: school_name
      label: School Name
      hint: Which school does child attend
      type: text
      options: []
      required: true
    - id: 9
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      required: true
    - id: 10
      name: teacher_name
      label: Teacher Name
      hint: Current teacher name
      type: text
      options: []
      required: false
    - id: 11
      name: care_type
      label: Type of Care Needed
      hint: Select care type
      type: select_one
      options:
      - Before School Only
      - After School Only
      - Before and After School
      - Full Day (No School Days)
      - Occasional or As Needed
      required: true
    - id: 12
      name: days_per_week
      label: Days Per Week
      hint: How many days per week
      type: select_one
      options:
      - 1 day
      - 2 days
      - 3 days
      - 4 days
      - 5 days
      required: true
    - id: 13
      name: specific_days
      label: Specific Days
      hint: Select which days
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: true
    - id: 14
      name: start_date
      label: Start Date
      hint: When do you need care to begin
      type: date
      options: []
      required: true
    - id: 15
      name: arrival_time
      label: Arrival Time
      hint: What time will child arrive
      type: time
      options: []
      required: true
    - id: 16
      name: pickup_time
      label: Pickup Time
      hint: What time will child be picked up
      type: time
      options: []
      required: true
    - id: 17
      name: transportation_method
      label: Transportation Method
      hint: How will child get to program
      type: select_one
      options:
      - Parent Drop-off and Pickup
      - School Bus to Program
      - Program Transport from School
      - Child Walks
      - Other
      required: true
    - id: 18
      name: authorized_pickup
      label: Authorized Pickup Persons
      hint: List all people authorized to pick up child
      type: text
      options: []
      required: true
    - id: 19
      name: medical_conditions
      label: Medical Conditions
      hint: Any medical conditions or allergies
      type: text
      options: []
      required: false
    - id: 20
      name: medications
      label: Current Medications
      hint: List any medications child takes
      type: text
      options: []
      required: false
    - id: 21
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any food allergies or restrictions
      type: text
      options: []
      required: false
    - id: 22
      name: emergency_contact_1
      label: Emergency Contact 1
      hint: Name relationship and phone number
      type: text
      options: []
      required: true
    - id: 23
      name: emergency_contact_2
      label: Emergency Contact 2
      hint: Name relationship and phone number
      type: text
      options: []
      required: true
    - id: 24
      name: physician_name
      label: Physician Name
      hint: Doctor name
      type: text
      options: []
      required: true
    - id: 25
      name: physician_phone
      label: Physician Phone
      hint: Doctor phone number
      type: text
      options: []
      required: true
    - id: 26
      name: health_insurance
      label: Health Insurance
      hint: Provider and policy number
      type: text
      options: []
      required: false
    - id: 27
      name: special_needs
      label: Special Needs or Accommodations
      hint: Any special needs we should know
      type: text
      options: []
      required: false
    - id: 28
      name: behavioral_notes
      label: Behavioral Notes
      hint: Any behavioral considerations
      type: text
      options: []
      required: false
    - id: 29
      name: program_fee
      label: Program Fee Acknowledgment
      hint: I understand the program fees
      type: select_one
      options:
      - I understand
      - I do not understand
      required: true
    - id: 30
      name: terms_acceptance
      label: Terms and Conditions Acceptance
      hint: I agree to all program terms
      type: select_one
      options:
      - I accept
      - I do not accept
      required: true
    - id: 31
      name: registration_date
      label: Registration Date
      hint: Today date
      type: date
      options: []
      required: true
