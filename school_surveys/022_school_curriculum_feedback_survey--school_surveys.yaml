inputSchema:
  type: object
  properties:
    title: School Curriculum Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: What do you think about our school curriculum?
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: overall_effectiveness
      label: How effective do you think this curriculum is?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: subject_specific_feedback
      label: Which subjects do you think are taught well?
      hint: null
      type: select_multiple
      options:
      - Mathematics
      - Language arts
      - Science
      - History
      - Physical education
      required: false
    - id: 4
      name: teacher_performance
      label: How well do you think our teachers perform?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: student_engagement
      label: How engaging do you think our curriculum is?
      hint: null
      type: select_one
      options:
      - Highly engaging
      - Somewhat engaging
      - Not engaging at all
      required: false
    - id: 6
      name: suggestions
      label: Do you have any suggestions for the school administration?
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: parent_involvement
      label: How involved are you as a parent?
      hint: null
      type: select_one
      options:
      - Very involved
      - Somewhat involved
      - Not involved at all
      required: false
    - id: 8
      name: teacher_communication
      label: How good is communication between teachers and students?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: curriculum_evaluation
      label: How important do you think curriculum evaluation is?
      hint: null
      type: select_multiple
      options:
      - Very important
      - Somewhat important
      - Not very important
      required: false
    - id: 10
      name: additional_comments
      label: Do you have any additional comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: demographic_info
      label: Demographic information
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: age
      label: What is your age?
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: gender
      label: What is your gender?
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Prefer not to say
      required: false
    - id: 14
      name: school_attended
      label: Which school do you attend?
      hint: null
      type: select_multiple
      options:
      - Elementary school
      - Middle school
      - High school
      required: false
    - id: 15
      name: student_teacher_relationship
      label: How would you describe your relationship with your teacher?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 16
      name: course_satisfaction
      label: How satisfied are you with the courses offered?
      hint: null
      type: select_one
      options:
      - Highly satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Highly dissatisfied
      required: false
    - id: 17
      name: course_enjoyment
      label: How enjoyable do you find the courses?
      hint: null
      type: select_one
      options:
      - Highly enjoyable
      - Somewhat enjoyable
      - Neutral
      - Somewhat unenjoyable
      - Highly unenjoyable
      required: false
    - id: 18
      name: course_difficulty
      label: How difficult do you find the courses?
      hint: null
      type: select_one
      options:
      - Highly difficult
      - Somewhat difficult
      - Neutral
      - Somewhat easy
      - Highly easy
      required: false
    - id: 19
      name: course_relevance
      label: How relevant are the courses to your life?
      hint: null
      type: select_one
      options:
      - Highly relevant
      - Somewhat relevant
      - Neutral
      - Somewhat irrelevant
      - Highly irrelevant
      required: false
    - id: 20
      name: course_evaluation
      label: How valuable do you think the courses are?
      hint: null
      type: select_one
      options:
      - Highly valuable
      - Somewhat valuable
      - Neutral
      - Somewhat not valuable
      - Highly not valuable
      required: false
    - id: 21
      name: course_satisfaction_2
      label: How satisfied are you with the courses?
      hint: null
      type: select_one
      options:
      - Highly satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Highly dissatisfied
      required: false
    - id: 22
      name: teacher_availability
      label: How available are the teachers?
      hint: null
      type: select_one
      options:
      - Always available
      - Most of the time
      - Some of the time
      - Rarely
      - Never
      required: false
    - id: 23
      name: teacher_competence
      label: How competent do you think the teachers are?
      hint: null
      type: select_one
      options:
      - Highly competent
      - Somewhat competent
      - Neutral
      - Somewhat incompetent
      - Highly incompetent
      required: false
    - id: 24
      name: parent_communication
      label: How good is communication between parents and teachers?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 25
      name: student_participation
      label: How often do you participate in extracurricular activities?
      hint: null
      type: select_multiple
      options:
      - Often
      - Sometimes
      - Rarely
      - Never
      required: false
