title: Art submission form
description: Generate a Art submission form survey for the "School surveys" category. Use the template name: "Art submission form template".
questions:
  - text: Overall, how satisfied are you with art submission form?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Art, Submission, Form, School]
  - text: How often do you interact with art submission form?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
