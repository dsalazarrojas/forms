inputSchema:
  type: object
  properties:
    title: Chinese New Year Student Survey
    pages:
    - id: 1
      name: student_information
      label: Student Information
      hint: Tell us about yourself
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Your Name
      hint: First name is fine
      type: text
      options: []
      required: true
    - id: 3
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 4
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: knowledge_questions
      label: Knowledge About Chinese New Year
      hint: What you know
      type: note
      options: []
      required: false
    - id: 7
      name: heard_of_cny
      label: Had you heard of Chinese New Year before
      hint: null
      type: select_one
      options:
      - Yes, I know a lot
      - Yes, I know some things
      - Yes, but only the name
      - No, never heard of it
      required: true
    - id: 8
      name: know_zodiac
      label: Do you know about the Chinese zodiac animals
      hint: null
      type: select_one
      options:
      - Yes, I know all of them
      - Yes, I know some
      - I know there are animals
      - No, never heard of it
      required: true
    - id: 9
      name: know_current_year
      label: Do you know which animal represents this year
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - I think so
      - Not sure
      - No idea
      required: true
    - id: 10
      name: celebrate_at_home
      label: Does your family celebrate Chinese New Year at home
      hint: null
      type: select_one
      options:
      - Yes, every year
      - Yes, sometimes
      - We have celebrated
      - No, but we might
      - 'False'
      required: true
    - id: 11
      name: interest_level
      label: Interest Level
      hint: How interested are you
      type: note
      options: []
      required: false
    - id: 12
      name: interest_in_learning
      label: How interested are you in learning about Chinese New Year
      hint: null
      type: select_one
      options:
      - Very interested
      - Somewhat interested
      - A little interested
      - Not very interested
      - Not interested at all
      required: true
    - id: 13
      name: interested_activities
      label: What activities would you enjoy most
      hint: Select all that apply
      type: select_multiple
      options:
      - Arts and crafts
      - Learning about zodiac animals
      - Trying Chinese food
      - Watching performances
      - Making decorations
      - Learning greetings
      - Playing games
      - Reading stories
      - Watching videos
      - Other
      required: true
    - id: 14
      name: tried_chinese_food
      label: Have you ever tried Chinese food
      hint: null
      type: select_one
      options:
      - Yes, many times
      - Yes, a few times
      - Once
      - No, but I would like to
      - No, not interested
      required: true
    - id: 15
      name: favorite_chinese_dish
      label: What is your favorite Chinese dish
      hint: If you have one
      type: text
      options: []
      required: false
    - id: 16
      name: school_activities
      label: School Activities
      hint: What you would like at school
      type: note
      options: []
      required: false
    - id: 17
      name: want_school_celebration
      label: Would you like your school to celebrate Chinese New Year
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Yes, it would be fun
      - Maybe
      - No preference
      - 'False'
      required: true
    - id: 18
      name: suggested_activities
      label: What activities should the school organize
      hint: Select all that apply
      type: select_multiple
      options:
      - Cultural assembly
      - Dragon or lion dance
      - Art projects
      - Food tasting
      - Story time
      - Movie or video
      - Guest speaker
      - Craft fair
      - Nothing special
      - Other
      required: true
    - id: 19
      name: want_to_learn_chinese
      label: Would you like to learn to speak Chinese
      hint: null
      type: select_one
      options:
      - Yes, very much
      - Yes, a little
      - Maybe
      - Probably not
      - 'False'
      required: true
    - id: 20
      name: reason_to_learn
      label: Why would you want to learn Chinese
      hint: Select all that apply
      type: select_multiple
      options:
      - To talk to more people
      - For travel
      - For future jobs
      - Because it is interesting
      - My friends speak it
      - Family reasons
      - Not interested
      - Other
      required: false
    - id: 21
      name: cultural_curiosity
      label: Cultural Curiosity
      hint: Your interest in other cultures
      type: note
      options: []
      required: false
    - id: 22
      name: interested_other_cultures
      label: Are you interested in learning about other cultures
      hint: null
      type: select_one
      options:
      - Yes, very interested
      - Yes, somewhat interested
      - A little interested
      - Not very interested
      - Not interested
      required: true
    - id: 23
      name: cultures_interested_in
      label: Which cultures are you interested in learning about
      hint: Select all that apply
      type: select_multiple
      options:
      - Chinese
      - Japanese
      - Korean
      - Indian
      - Mexican
      - Italian
      - African
      - Middle Eastern
      - European
      - Native American
      required: false
    - id: 24
      name: family_traditions
      label: Does your family have special traditions for holidays
      hint: null
      type: select_one
      options:
      - Yes, many traditions
      - Yes, a few traditions
      - Yes, one or two
      - Not really
      - 'False'
      required: true
    - id: 25
      name: share_traditions
      label: Would you like to share your family traditions with the class
      hint: null
      type: select_one
      options:
      - Yes, I would love to
      - Yes, if the teacher asks
      - Maybe
      - Probably not
      - 'False'
      required: true
    - id: 26
      name: additional_comments
      label: Any Other Comments or Questions
      hint: Share your thoughts
      type: text
      options: []
      required: false
