inputSchema:
  type: object
  properties:
    title: School Quality Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please take a few minutes to answer these questions.
      type: text
      options: []
      required: false
    - id: 2
      name: school_rating
      label: School Rating
      hint: Rate your school out of 3 (Good, Fair, Excellent)
      type: select_one
      options:
      - Good
      - Fair
      - Excellent
      required: false
    - id: 3
      name: teachers_quality
      label: Teacher Quality
      hint: Describe what you think about your teachers
      type: select_multiple
      options:
      - Good
      - Poor
      required: false
    - id: 4
      name: facilities_satisfaction
      label: Facilities Satisfaction
      hint: Rate your satisfaction with the school facilities
      type: number
      options: []
      required: false
    - id: 5
      name: school_environment
      label: School Environment
      hint: Describe your experience in the school
      type: text
      options: []
      required: false
    - id: 6
      name: teacher_support
      label: Teacher Support
      hint: Do you feel supported by your teachers?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: student_fellowship
      label: Student Interactions
      hint: How do you feel about student interactions?
      type: select_multiple
      options:
      - Good
      - Bad
      required: false
    - id: 8
      name: student_satisfaction
      label: Student Satisfaction
      hint: Describe your satisfaction level with the school
      type: text
      options: []
      required: false
    - id: 9
      name: teacher_quality_2
      label: Teacher Quality (2)
      hint: Describe what you think about your teachers
      type: select_multiple
      options:
      - Good
      - Poor
      required: false
    - id: 10
      name: facilities
      label: Facilities
      hint: Are the facilities good?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: teacher_satisfaction
      label: Teacher Satisfaction
      hint: How satisfied are you with your teacher?
      type: select_multiple
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 12
      name: student_environment
      label: Student Environment
      hint: Describe your experience in the school environment
      type: text
      options: []
      required: false
    - id: 13
      name: teacher_communication
      label: Teacher Communication
      hint: Describe your experience with teacher communication
      type: text
      options: []
      required: false
    - id: 14
      name: parent_satisfaction
      label: Parent Satisfaction
      hint: Describe your parents' satisfaction
      type: text
      options: []
      required: false
    - id: 15
      name: class_size
      label: Class Size
      hint: Describe your class size
      type: text
      options: []
      required: false
    - id: 16
      name: parent_quality
      label: Parent Quality
      hint: Describe what you think about your parents
      type: select_multiple
      options:
      - Good
      - Poor
      required: false
    - id: 17
      name: student_fellowship_2
      label: Student Fellowship 2
      hint: How do you feel about student interactions?
      type: select_one
      options:
      - Good
      - Bad
      required: false
    - id: 18
      name: school_funding
      label: School Funding
      hint: Is the school well funded?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: teacher_support_2
      label: Teacher Support 2
      hint: Do you feel supported by your teachers?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 20
      name: parent_communication
      label: Parent Communication
      hint: Describe your experience with parent communication
      type: text
      options: []
      required: false
    - id: 21
      name: facilities_quality
      label: Facilities Quality
      hint: Describe the quality of school facilities
      type: text
      options: []
      required: false
    - id: 22
      name: student_satisfaction_2
      label: Student Satisfaction 2
      hint: Describe your satisfaction level with the school
      type: text
      options: []
      required: false
