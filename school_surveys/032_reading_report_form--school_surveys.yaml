inputSchema:
  type: object
  properties:
    title: Reading Report Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_submitted
      label: Date Submitted
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: reading_level
      label: Reading Level
      hint: null
      type: select_one
      options:
      - '{''value'': ''beginner''}'
      - intermediate
      - advanced
      - other
      required: false
    - id: 4
      name: reading_progress
      label: Reading Progress
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
