inputSchema:
  type: object
  properties:
    title: School Wellbeing Space Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please take a few minutes to answer this survey about our school's wellbeing
        spaces.
      type: text
      options: []
      required: false
    - id: 2
      name: frequency
      label: Frequency
      hint: How often do you use our wellbeing spaces?
      type: select_one
      options:
      - Daily
      - 1-2 times a week
      - 3-4 times a week
      - Rarely
      required: true
    - id: 3
      name: satisfaction
      label: Satisfaction
      hint: How satisfied are you with our wellbeing spaces?
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 4
      name: improvement_areas
      label: Improvement Areas
      hint: What areas would you like to see improved in our wellbeing spaces?
      type: select_multiple
      options:
      - More resources
      - More space
      - Better facilities
      - Other (please specify)
      required: true
    - id: 5
      name: support_services
      label: Support Services
      hint: Do we have support services available within the wellbeing spaces?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: Any additional comments or suggestions?
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: E-mail
      hint: Your email for contact purposes
      type: email
      options: []
      required: false
    - id: 8
      name: name
      label: Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone number
      hint: Your phone number
      type: text
      options: []
      required: false
    - id: 10
      name: other_comments
      label: Other comments
      hint: Any other comments or suggestions?
      type: note
      options: []
      required: false
