inputSchema:
  type: object
  properties:
    title: School Wellbeing Space Survey
    pages:
    - id: 1
      name: school_survey_form
      label: School Survey Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: wellbeing_spaces
      label: Wellbeing Spaces
      hint: null
      type: select_multiple
