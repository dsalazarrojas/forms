description: A survey to gather feedback from residents to improve their living experience
  within the school community.
questions:
- options:
  - Very satisfied
  - Satisfied
  - Neutral
  - Dissatisfied
  - Very dissatisfied
  text: How satisfied are you with your overall living experience at the school?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate the quality of the school's facilities (e.g., dorms, common
    areas)?
  type: single
- options:
  - Strongly agree
  - Agree
  - Neutral
  - Disagree
  - Strongly disagree
  text: Do you feel a sense of belonging and support within the school community?
  type: single
- options:
  - Academic workshops
  - Social events
  - Sports/Clubs
  - Volunteer opportunities
  - Wellness programs
  text: Which types of school activities or programs do you most often participate
    in or find valuable? (select all that apply)
  type: multiple
- text: What is one thing that could significantly improve your experience as a resident?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: Resident satisfaction survey
