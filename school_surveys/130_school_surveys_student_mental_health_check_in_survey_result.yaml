title: Student mental health check-in survey
description: Generate a Student mental health check-in survey survey for the "School surveys" category. Use the template name: "Student mental health check-in survey template".
questions:
  - text: Overall, how satisfied are you with student mental health check-in survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Student, Mental, Health, Check]
  - text: How often do you interact with student mental health check-in survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
