inputSchema:
  type: object
  properties:
    title: Parent Satisfaction Survey
    pages:
    - id: 1
      name: school_environment
      label: School Environment
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Poor
      required: true
    - id: 2
      name: teacher_support
      label: Teacher Support
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 3
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: school_events
      label: School Events
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Rarely
      required: false
    - id: 6
      name: parent_involvement
      label: Parent Involvement
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
