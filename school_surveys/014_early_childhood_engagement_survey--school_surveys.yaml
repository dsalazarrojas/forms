inputSchema:
  type: object
  properties:
    title: Early Childhood Engagement Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction to Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: parent_section
      label: Parent Survey Section
      hint: null
      type: select_multiple
      options:
      - Always Engaged
      - Sometimes Engaged
      - Never Engaged
      required: false
    - id: 3
      name: parent_survey_question1
      label: How often do you engage with your child's education?
      hint: null
      type: select_one
      options:
      - Almost Daily
      - Several times a week
      - Rarely
      required: false
    - id: 4
      name: parent_survey_question2
      label: How would you rate the quality of your child's education?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: teacher_section
      label: Teacher Survey Section
      hint: null
      type: select_multiple
      options:
      - Always Available
      - Sometimes Available
      - Rarely Available
      required: false
    - id: 7
      name: teacher_survey_question1
      label: How often do you engage with your child's teachers?
      hint: null
      type: select_one
      options:
      - Almost Daily
      - Several times a week
      - Rarely
      required: false
    - id: 8
      name: teacher_survey_question2
      label: How supportive are you of your child's teacher?
      hint: null
      type: select_one
      options:
      - Very Supportive
      - Somewhat Supportive
      - Not Supportive at All
      required: false
    - id: 9
      name: comments_2
      label: Comments 2
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: school_section
      label: School Survey Section
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      required: false
    - id: 11
      name: school_survey_question1
      label: How would you rate the quality of your school?
      hint: null
      type: select_one
      options:
      - 5-Star
      - 4-Star
      - 3-Star
      required: false
    - id: 12
      name: school_survey_question2
      label: How supportive is your school?
      hint: null
      type: select_one
      options:
      - Very Supportive
      - Somewhat Supportive
      - Not Supportive at All
      required: false
    - id: 13
      name: comments_3
      label: Comments 3
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: school_comments
      label: School Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: submission
      label: Submission
      hint: null
      type: select_multiple
      options:
      - Submit
      - Save and Resume Later
      - Do Not Submit
      required: false
