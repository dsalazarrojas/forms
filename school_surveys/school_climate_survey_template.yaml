description: Gathering insights on the school environment from students, staff, and
  parents.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with the overall school climate?
  type: single
- options:
  - Always
  - Often
  - Sometimes
  - Rarely
  - Never
  text: How often do you feel a sense of belonging at school?
  type: single
- options:
  - Supportive
  - Engaging
  - Challenging
  - Respectful
  - Safe
  - Inclusive
  text: Which of the following best describe the learning environment at school? (select
    all that apply)
  type: multiple
- text: What would you improve or change about the school climate?
  type: text
- text: Do you have any additional comments or feedback regarding the school environment?
  type: text
title: School climate survey
