inputSchema:
  type: object
  properties:
    title: Student Basic Needs Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Female
      - Male
      required: false
    - id: 4
      name: school_name
      label: School
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: student_ethnicity
      label: Ethnicity
      hint: null
      type: select_multiple
      options:
      - White
      - Black
      - Asian
      - Hispanic or Latino
      - Multi-racial
      required: false
    - id: 6
      name: student_age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: student_grade
      label: Grade
      hint: null
      type: select_one
      options:
      - 9th
      - 10th
      - 11th
      - 12th
      required: false
    - id: 8
      name: school_grade
      label: School Grade
      hint: null
      type: select_one
      options:
      - 9th
      - 10th
      - 11th
      - 12th
      required: false
    - id: 9
      name: school_teacher_relationship
      label: How do you feel about your teacher?
      hint: null
      type: select_multiple
      options:
      - I like them very much
      - I don’t like them very much
      - I’m neutral
      required: false
    - id: 10
      name: school_bus_ride
      label: Do you feel safe when boarding or offboarding a school bus?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: student_social_status
      label: Student Social Status
      hint: null
      type: select_multiple
      options:
      - Low income
      - Middle income
      - High income
      - None of the above
      required: false
    - id: 12
      name: student_family_income
      label: Family Income
      hint: null
      type: select_one
      options:
      - Low
      - Middle
      - High
      required: false
    - id: 13
      name: student_parents_education
      label: Parents' Education
      hint: null
      type: select_multiple
      options:
      - Less than high school
      - High school
      - Some college
      - Bachelor's
      - Some graduate
      - Master's
      required: false
    - id: 14
      name: student_ethnicity_2
      label: Ethnicity 2
      hint: null
      type: select_multiple
      options:
      - White
      - Black
      - Asian
      - Hispanic or Latino
      - Multi-racial
      - Other
      required: false
    - id: 15
      name: student_relationship
      label: Relationship with school
      hint: null
      type: select_multiple
      options:
      - Very close
      - Close
      - Neutral
      - Distant
      required: false
    - id: 16
      name: student_communication
      label: How do you prefer to communicate with school?
      hint: null
      type: select_multiple
      options:
      - Text message
      - Email
      - Phone call
      - None of the above
      - Social media
      required: false
    - id: 17
      name: student_transportation
      label: Transportation
      hint: null
      type: select_multiple
      options:
      - Walk
      - Drive
      - Bike
      - Other
      required: false
    - id: 18
      name: student_english_level
      label: English Level
      hint: null
      type: select_one
      options:
      - Basic
      - Intermediate
      - Advanced
      - Proficient
      required: false
    - id: 19
      name: student_math_level
      label: Math Level
      hint: null
      type: select_one
      options:
      - Basic
      - Intermediate
      - Advanced
      - Proficient
      required: false
    - id: 20
      name: student_homework_help
      label: Do you need help with homework?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 21
      name: student_food_insecurity
      label: Food Insecurity
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: student_physical_activity
      label: Physical activity participation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 23
      name: student_mental_health
      label: Mental health support
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 24
      name: student_emotional_support
      label: Emotional support
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 25
      name: student_belonging
      label: Belonging
      hint: null
      type: select_one
      options:
      - Very much
      - Somewhat
      - Not very much
      - Not at all
      required: false
