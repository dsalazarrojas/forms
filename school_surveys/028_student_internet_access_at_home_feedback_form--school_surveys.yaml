      required: false
    - id: 9
      name: feel_important
      label: feel_important
      hint: null
      type: select_multiple
      options:
      - Important
      - Not important
      - Not at all important
      required: false
    - id: 10
      name: parent_knowledge
      label: parent_knowledge
      hint: null
      type: select_one
      options:
      - High
      - Low
      - No answer
      required: false
