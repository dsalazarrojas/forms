description: Gather feedback to improve student experience at the school.
questions:
- options:
  - Very satisfied
  - Satisfied
  - Neutral
  - Dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your academic experience at the school?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  - Very Poor
  text: How would you rate the quality of teaching and instruction?
  type: single
- options:
  - true
  - false
  - Somewhat
  - Not applicable
  text: Do you feel adequately supported by student services (e.g., counseling, career
    services)?
  type: single
- options:
  - Library
  - Study spaces
  - Cafeteria
  - Gym/Recreation
  - Labs/Workshops
  - Student common areas
  text: Which of the following campus facilities do you use regularly? (select all
    that apply)
  type: multiple
- text: What could significantly improve your overall experience at the school?
  type: text
- text: Do you have any further comments or suggestions?
  type: text
title: Student satisfaction survey
