inputSchema:
  type: object
  properties:
    title: Self Awareness Questionnaire
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please take a few minutes to complete this questionnaire to gain a better
        understanding of your self-awareness levels.
      type: note
      options: []
      required: false
    - id: 2
      name: self_rating
      label: How would you rate yourself on a scale of 1-10?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: self_reflection
      label: What do you feel most comfortable with?
      hint: null
      type: select_one
      options:
      - I am very comfortable with myself
      - I am somewhat comfortable with myself
      - I am not very comfortable with myself
      required: true
    - id: 4
      name: major_life_area_of_concern
      label: What is your major life area of concern?
      hint: null
      type: select_multiple
      options:
      - My career
      - My relationships
      - My health
      - My personal growth
      required: true
    - id: 5
      name: feelings_about_self
      label: How do you feel about yourself?
      hint: null
      type: select_multiple
      options:
      - I am very happy with myself
      - I am somewhat happy with myself
      - I am not very happy with myself
      required: false
    - id: 6
      name: rate_your_self
      label: Rate yourself on a scale of 1-10
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: confidence_in_self
      label: How confident are you in yourself?
      hint: null
      type: select_one
      options:
      - I am very confident
      - I am somewhat confident
      - I am not very confident
      required: false
    - id: 8
      name: self_importance
      label: What do you feel is your greatest strength?
      hint: null
      type: select_multiple
      options:
      - My abilities
      - My knowledge
      - My experiences
      - Other
      required: false
    - id: 9
      name: self_growth
      label: What areas do you feel you need to improve on?
      hint: null
      type: select_multiple
      options:
      - My relationships
      - My career
      - My health
      - My personal growth
      required: false
    - id: 10
      name: final_thoughts
      label: Do you have any final thoughts or insights about yourself?
      hint: null
      type: note
      options: []
      required: false
