inputSchema:
  type: object
  properties:
    title: Student Retention Survey
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: Enter student ID
      type: number
      options: []
      required: true
    - id: 2
      name: teacher_name
      label: Teacher Name
      hint: Enter teacher name
      type: text
      options: []
      required: true
    - id: 3
      name: student_reasons_left
      label: Reasons for Students Leaving
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: student_reasons_left_other
      label: Other Reasons for Leaving
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: teacher_reasons_left
      label: Reasons for Teachers Leaving
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: teacher_reasons_left_other
      label: Other Reasons for Teachers Leaving
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: teacher_support
      label: Teacher Support Systems
      hint: null
      type: select_one
      options:
      - Academic Support
      - Mental Health
      - Parental Support
      - Social Support
      - Transportation
      - Other
      required: false
    - id: 8
      name: teacher_support_other
      label: Other Teacher Support System
      hint: Please specify the other teacher support system
      type: text
      options: []
      required: false
    - id: 9
      name: student_support
      label: Student Support Systems
