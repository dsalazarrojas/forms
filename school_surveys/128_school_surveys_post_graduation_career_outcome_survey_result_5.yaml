title: Post-graduation career outcome survey
description: Generate a Post-graduation career outcome survey survey for the "School surveys" category. Use the template name: "Post-graduation career outcome survey template".
questions:
  - text: Overall, how satisfied are you with post-graduation career outcome survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Post, Graduation, Career, Outcome]
  - text: How often do you interact with post-graduation career outcome survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
