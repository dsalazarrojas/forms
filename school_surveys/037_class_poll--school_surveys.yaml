inputSchema:
  type: object
  properties:
    title: Class Poll
    pages:
    - id: 1
      name: respondent_header
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Optional - can be anonymous
      type: text
      options: []
      required: false
    - id: 3
      name: student_id
      label: Student ID
      hint: Optional
      type: text
      options: []
      required: false
    - id: 4
      name: class_name
      label: Class Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: poll_date
      label: Poll Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: poll_topic_header
      label: -- Poll Topic --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: poll_question_1
      label: Question 1 - What is your preference
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      - No preference
      required: true
    - id: 8
      name: poll_question_2
      label: Question 2 - Which would you choose
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      - Not sure
      required: true
    - id: 9
      name: poll_question_3
      label: Question 3 - Rate your agreement - scale 1-5
      hint: 1 = strongly disagree, 5 = strongly agree
      type: number
      options: []
      required: false
    - id: 10
      name: poll_question_4
      label: Question 4 - Select all that apply
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      - Option E
      required: false
    - id: 11
      name: poll_question_5
      label: Question 5 - How satisfied are you
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 12
      name: feedback_header
      label: -- Open Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: open_feedback
      label: Any additional feedback or comments
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: suggestions
      label: Suggestions for improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: concerns
      label: Any concerns or issues to address
      hint: null
      type: text
      options: []
      required: false
