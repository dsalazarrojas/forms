inputSchema:
  type: object
  properties:
    title: Visitor Management Login Form
    pages:
    - id: 1
      name: user_input
      label: user_input
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: email
      label: visitor_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: name
      label: visitor_name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date
      label: visit_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: visit_time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: purpose
      label: visit_purpose
      hint: null
      type: select_one
      options:
      - Visitor
      - Guest
      - Client
      required: false
    - id: 7
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submit
      label: submit
      hint: null
      type: text
      options: []
      required: false
