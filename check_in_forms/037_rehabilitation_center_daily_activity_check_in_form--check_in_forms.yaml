inputSchema:
  type: object
  properties:
    title: Rehabilitation Center Daily Activity Check In Form
    pages:
    - id: 1
      name: session_observation
      label: Session Observation
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: session_notes
      label: Session Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: participant_participation
      label: Participant Participation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: activity
      label: Activity
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 5
      name: resident_name
      label: Resident Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: program
      label: Program
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: staff_member
      label: Staff Member
      hint: null
      type: select_one
      options:
      - Staff Member 1
      - Staff Member 2
      - Staff Member 3
      required: false
    - id: 8
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
