inputSchema:
  type: object
  properties:
    title: 21 Day Weekly Check In
    pages:
    - id: 1
      name: section_header_intro
      label: "--- Weekly Check-In: Participant Details ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant full name
      hint: Enter first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: week_number
      label: Week number (1-3)
      hint: Enter which week of the 21-day program this check-in covers
      type: integer
      options: []
      required: true
    - id: 5
      name: checkin_date
      label: Check-in date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: mood_this_week
      label: How would you rate your overall mood this week?
      hint: Select the option that best matches
      type: select_one
      options:
        - Excellent
        - Good
        - Neutral
        - Poor
        - Very poor
      required: true
    - id: 7
      name: average_sleep_hours
      label: Average sleep per night (hours)
      hint: e.g., 7.5
      type: decimal
      options: []
      required: false
    - id: 8
      name: activity_minutes
      label: Total minutes of planned activity this week
      hint: Sum of structured exercise minutes
      type: integer
      options: []
      required: false
    - id: 9
      name: main_challenges
      label: Main challenges encountered (select all that apply)
      hint: Leave blank if none
      type: select_multiple
      options:
        - Motivation
        - Time constraints
        - Minor injury or pain
        - Diet adherence
        - Sleep disruption
        - Stress or anxiety
      required: false
    - id: 10
      name: progress_notes
      label: Progress notes or observations
      hint: Describe wins, setbacks, or changes
      type: text
      options: []
      required: false
    - id: 11
      name: follow_up_required
      label: Do you want a follow-up check-in or coach contact?
      hint: null
      type: select_one
      options:
        - Yes
        - No
      required: true
