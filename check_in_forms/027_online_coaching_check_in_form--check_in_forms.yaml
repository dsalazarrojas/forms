      options:
      - Active
      - Inactive
      required: false
    - id: 8
      name: client_progress
      label: Client Progress
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: next_check_in_date
      label: Next Check In Date
      hint: null
      type: date
      options: []
