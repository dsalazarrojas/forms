      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: check_in_date
      label: Check In Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: check_in_time
      label: Check In Time
      hint: null
      type: time
      options: []
      required: false
