inputSchema:
  type: object
  properties:
    title: Arrival And Departure Information
    pages:
    - id: 1
      name: section_guest_info
      label: -- Guest Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: guest_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: guest_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: party_size
      label: Party Size - Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: guest_type
      label: Type of Guest
      hint: null
      type: select_one
      options:
      - Individual
      - Family
      - Group
      - Business
      required: true
    - id: 7
      name: section_arrival
      label: -- Arrival Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: arrival_time
      label: Expected Arrival Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: transportation_method
      label: Transportation Method
      hint: How will you arrive
      type: select_one
      options:
      - Car
      - Bus
      - Train
      - Plane
      - Taxi or rideshare
      - Other
      required: false
    - id: 11
      name: arrival_from
      label: Where are you coming from
      hint: City and state or airport code
      type: text
      options: []
      required: false
    - id: 12
      name: section_accommodation
      label: -- Accommodation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: room_or_space
      label: Room Number or Space Assignment
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: room_type
      label: Room or Accommodation Type
      hint: null
      type: select_one
      options:
      - Single room
      - Double room
      - Suite
      - Cabin
      - Tent
      - Other
      required: false
    - id: 15
      name: section_departure
      label: -- Departure Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: departure_date
      label: Departure Date
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: departure_time
      label: Expected Departure Time
      hint: null
      type: time
      options: []
      required: false
    - id: 18
      name: length_of_stay
      label: Length of Stay in Nights
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: early_checkout
      label: Early Checkout Needed
      hint: null
      type: select_one
      options:
      - false
      - Yes - before 10 AM
      - Yes - before 8 AM
      required: false
    - id: 20
      name: section_special
      label: -- Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: special_requests
      label: Special Requests or Accommodations
      hint: Mobility assistance, dietary restrictions, etc.
      type: text
      options: []
      required: false
    - id: 22
      name: section_contact
      label: -- Emergency Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
