inputSchema:
  type: object
  properties:
    title: Consultation Client Arrival Check In
    pages:
    - id: 1
      name: section_client_check_in
      label: -- Client Check In --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client name
      hint: Full name of client arriving
      type: text
      options: []
      required: true
    - id: 3
      name: appointment_time
      label: Appointment time
      hint: Scheduled time for consultation
      type: time
      options: []
      required: true
    - id: 4
      name: arrival_time
      label: Arrival time
      hint: Actual time client arrived
      type: time
      options: []
      required: false
    - id: 5
      name: service_requested
      label: Service requested
      hint: Brief description of the consultation service
      type: text
      options: []
      required: false
    - id: 6
      name: check_in_staff
      label: Check in staff name
      hint: Staff member handling the check in
      type: text
      options: []
      required: false
    - id: 7
      name: waivers_signed
      label: Waivers signed
      hint: Confirm if any consent forms were signed at check in
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
