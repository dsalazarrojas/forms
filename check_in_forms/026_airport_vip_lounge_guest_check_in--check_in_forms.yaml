inputSchema:
  type: object
  properties:
    title: Airport VIP Lounge Guest Check In
    pages:
    - id: 1
      name: full_name
      label: Guest Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: airline_name
      label: Airline
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: flight_number
      label: Flight Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: check_in_time
      label: Check-in Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: section_access
      label: -- Access and Eligibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: access_type
      label: Access Type
      hint: null
      type: select_one
      options:
      - First Class Ticket
      - Business Class Ticket
      - Elite Status (Gold/Platinum)
      - Credit Card Benefit
      - Paid Day Pass
      - Invited Guest
      required: true
    - id: 8
      name: frequent_flyer_number
      label: Frequent Flyer Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: number_of_guests
      label: Number of Additional Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: section_preferences
      label: -- Lounge Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: dietary_requirements
      label: Dietary Requirements
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Nut-Free
      - Halal
      - Kosher
      required: false
    - id: 12
      name: work_zone_requested
      label: Require access to Quiet/Work Zone?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: shower_facilities
      label: Wish to use Shower Facilities?
      hint: Subject to availability
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: estimated_stay_duration
      label: Estimated Stay Duration
      hint: null
      type: select_one
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-4 hours
      - Over 4 hours
      required: true
    - id: 15
      name: staff_signature
      label: Attending Lounge Agent Name
      hint: For internal use
      type: text
      options: []
      required: true
    - id: 16
      name: agreement_terms
      label: I agree to the lounge code of conduct and house rules
      hint: null
      type: select_one
      options:
      - I agree
      - Other
      required: true
