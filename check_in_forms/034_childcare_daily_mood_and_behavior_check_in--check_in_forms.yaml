inputSchema:
  type: object
  properties:
    title: Childcare Daily Mood and Behavior Check-In
    pages:
    - id: 1
      name: check_in_date
      label: Check-In Date
      hint: Date of daily check-in
      type: date
      options: []
      required: true
    - id: 2
      name: check_in_time
      label: Check-In Time
      hint: Time of check-in
      type: time
      options: []
      required: true
    - id: 3
      name: child_first_name
      label: Child First Name
      hint: Legal first name of the child
      type: text
      options: []
      required: true
    - id: 4
      name: child_last_name
      label: Child Last Name
      hint: Legal last name of the child
      type: text
      options: []
      required: true
    - id: 5
      name: child_age
      label: Child Age
      hint: Current age of the child in years
      type: number
      options: []
      required: true
    - id: 6
      name: child_room_or_class
      label: Child Room or Class
      hint: Assigned room or class
      type: text
      options: []
      required: true
    - id: 7
      name: overall_mood
      label: Overall Mood
      hint: How is the child feeling overall today?
      type: select_one
      options:
      - Very happy
      - Happy
      - Calm
      - Neutral
      - Sad
      - Anxious
      - Irritable
      - Angry
      required: true
    - id: 8
      name: energy_level
      label: Energy Level
      hint: What is the child's energy level?
      type: select_one
      options:
      - Very high energy
      - High energy
      - Normal energy
      - Low energy
      - Very low energy
      - Exhausted
      required: true
    - id: 9
      name: social_interaction
      label: Social Interaction
      hint: How is the child interacting with others?
      type: select_one
      options:
      - Very social and friendly
      - Social and engaged
      - Somewhat social
      - Prefers solitary play
      - Withdrawn
      - Avoiding others
      required: true
    - id: 10
      name: interaction_with_peers
      label: Interaction with Peers
      hint: How is the child getting along with peers?
      type: select_one
      options:
      - Playing well with others
      - Mostly cooperative
      - Some conflicts
      - Prefers parallel play
      - Avoiding peers
      - Aggressive toward peers
      required: true
    - id: 11
      name: interaction_with_adults
      label: Interaction with Adults
      hint: How is the child interacting with adults?
      type: select_one
      options:
      - Very responsive and engaged
      - Responsive
      - Somewhat responsive
      - Neutral
      - Resistant
      - Avoidant
      required: true
    - id: 12
      name: emotional_state
      label: Emotional State
      hint: Describe the child's emotional state
      type: select_one
      options:
      - Stable and content
      - Generally positive
      - Fluctuating
      - Tearful
      - Anxious or worried
      - Frustrated
      - Angry or aggressive
      required: true
    - id: 13
      name: separation_from_parent
      label: Separation from Parent or Guardian
      hint: How did the child handle separation today?
      type: select_one
      options:
      - Separated easily
      - Mild protest
      - Moderate distress
      - Significant distress
      - Could not separate
      - Not applicable
      required: true
    - id: 14
      name: appetite
      label: Appetite
      hint: How is the child's appetite today?
      type: select_one
      options:
      - Excellent appetite
      - Good appetite
      - Normal appetite
      - Decreased appetite
      - Poor appetite
      - Refusing food
      required: true
    - id: 15
      name: sleep_quality_previous_night
      label: Sleep Quality Previous Night
      hint: How did the child sleep last night?
      type: select_one
      options:
      - Slept very well
      - Slept well
      - Slept okay
      - Restless sleep
      - Poor sleep
      - Very little sleep
      required: true
    - id: 16
      name: physical_symptoms
      label: Physical Symptoms
      hint: Are there any physical symptoms?
      type: select_multiple
      options:
      - None observed
      - Runny nose
      - Cough
      - Sneezing
      - Rash
      - Upset stomach
      - Headache
      - Fever
      - Other
      required: true
    - id: 17
      name: behavior_concerns
      label: Behavior Concerns
      hint: Are there any behavior concerns today?
      type: select_multiple
      options:
      - No concerns
      - Difficulty following directions
      - Aggression
      - Tantrums
      - Withdrawal
      - Excessive crying
      - Hyperactivity
      - Other
      required: true
    - id: 18
      name: comfort_items_needed
      label: Comfort Items Needed
      hint: Does the child need any comfort items today?
      type: select_one
      options:
      - No comfort items needed
      - Blanket
      - Stuffed animal
      - Pacifier
      - Other toy
      - Multiple items
      required: true
    - id: 19
      name: additional_support_needed
      label: Additional Support Needed
      hint: Does the child need extra support today?
      type: text
      options: []
      required: false
    - id: 20
      name: staff_notes
      label: Staff Notes
      hint: Additional observations from staff
      type: text
      options: []
      required: false
    - id: 21
      name: parent_notification_needed
      label: Parent Notification Needed
      hint: Should parents be notified of any concerns?
      type: select_one
      options:
      - No, all is well
      - Yes, minor concerns
      - Yes, please call
      - Yes, urgent
      required: true
    - id: 22
      name: staff_member_name
      label: Staff Member Name
      hint: Name of staff member completing check-in
      type: text
      options: []
      required: true
