inputSchema:
  type: object
  properties:
    title: Business Strategy Execution Monitoring Survey
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Full name of person responding
      type: text
      options: []
      required: true
    - id: 2
      name: department
      label: Department or Team
      hint: Your department
      type: text
      options: []
      required: true
    - id: 3
      name: role_title
      label: Title or Role
      hint: Your position in the company
      type: text
      options: []
      required: false
    - id: 4
      name: survey_date
      label: Survey Date
      hint: Date of this survey
      type: date
      options: []
      required: true
    - id: 5
      name: strategy_clarity
      label: Clarity of Strategic Goals
      hint: How clear is the strategy
      type: select_one
      options:
      - Extremely Clear
      - Clear
      - Somewhat Clear
      - Unclear
      - Very Unclear
      required: true
    - id: 6
      name: strategy_communication
      label: Strategy Communication Effectiveness
      hint: How well has strategy been communicated
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 7
      name: alignment_understanding
      label: Understanding of Strategy Alignment
      hint: Do you understand how your role aligns
      type: select_one
      options:
      - Fully Understand
      - Well Understand
      - Adequately Understand
      - Partially Understand
      - Do Not Understand
      required: true
    - id: 8
      name: execution_progress
      label: Progress on Strategy Execution
      hint: Are we making progress
      type: select_one
      options:
      - Significantly Ahead
      - Ahead of Schedule
      - On Track
      - Behind Schedule
      - Significantly Behind
      required: true
    - id: 9
      name: key_initiatives
      label: Key Initiatives Status
      hint: List major initiatives and their status
      type: text
      options: []
      required: true
    - id: 10
      name: resource_availability
      label: Resource Availability
      hint: Are resources adequate
      type: select_one
      options:
      - More Than Adequate
      - Adequate
      - Barely Adequate
      - Insufficient
      - Severely Insufficient
      required: true
    - id: 11
      name: obstacles_encountered
      label: Obstacles or Blockers
      hint: What challenges are you facing
      type: text
      options: []
      required: false
    - id: 12
      name: team_engagement
      label: Team Engagement Level
      hint: How engaged is your team
      type: select_one
      options:
      - Highly Engaged
      - Engaged
      - Moderately Engaged
      - Disengaged
      - Highly Disengaged
      required: true
    - id: 13
      name: leadership_support
      label: Leadership Support
      hint: Do you feel supported by leadership
      type: select_one
      options:
      - Excellent Support
      - Good Support
      - Adequate Support
      - Limited Support
      - No Support
      required: true
    - id: 14
      name: timeline_feasibility
      label: Timeline Feasibility
      hint: Is the timeline realistic
      type: select_one
      options:
      - Very Feasible
      - Feasible
      - Moderately Feasible
      - Difficult
      - Not Feasible
      required: true
    - id: 15
      name: success_metrics
      label: Success Metrics Clarity
      hint: Do you understand how success is measured
      type: select_one
      options:
      - Very Clear
      - Clear
      - Somewhat Clear
      - Unclear
      - Not Clear
      required: true
    - id: 16
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: How can we improve execution
      type: text
      options: []
      required: false
    - id: 17
      name: confidence_level
      label: Confidence in Strategy Success
      hint: How confident are you in the strategy
      type: select_one
      options:
      - Very Confident
      - Confident
      - Moderately Confident
      - Not Confident
      - Very Unconfident
      required: true
