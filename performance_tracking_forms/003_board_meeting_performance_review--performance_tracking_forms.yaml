inputSchema:
  type: object
  properties:
    title: Board Meeting Performance Review
    pages:
    - id: 1
      name: reviewer_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: position_title
      label: Your Position on the Board
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: meeting_date
      label: Meeting Date
      hint: Date of the board meeting being reviewed
      type: date
      options: []
      required: true
    - id: 4
      name: attendance_score
      label: Meeting Attendance Rating
      hint: How well was the meeting attended
      type: select_one
      options:
      - Excellent - All members present
      - Good - Most members present
      - Fair - Some members absent
      - Poor - Many absences
      required: true
    - id: 5
      name: agenda_clarity
      label: Was the agenda clear and well-organized
      hint: Rate the meeting structure
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: engagement_level
      label: Overall Board Engagement
      hint: How engaged were board members
      type: select_one
      options:
      - Highly Engaged
      - Mostly Engaged
      - Somewhat Engaged
      - Disengaged
      required: true
    - id: 7
      name: time_management
      label: Was the meeting run on schedule
      hint: null
      type: select_one
      options:
      - Stayed on time
      - Ran slightly over
      - Ran significantly over
      - Finished early
      required: true
    - id: 8
      name: discussion_quality
      label: Quality of Discussions
      hint: How productive were the discussions
      type: select_one
      options:
      - Excellent - Very productive
      - Good - Mostly productive
      - Fair - Some useful discussion
      - Poor - Limited discussion
      required: true
    - id: 9
      name: decision_making
      label: Were decisions made effectively
      hint: null
      type: select_one
      options:
      - Yes - Clear decisions made
      - Mostly - Most decisions made
      - Partially - Some decisions deferred
      - No - No clear decisions
      required: true
    - id: 10
      name: action_items_clarity
      label: Were action items clearly defined
      hint: null
      type: select_one
      options:
      - Yes - Very clear
      - Mostly - Generally clear
      - Somewhat - Could be clearer
      - No - Unclear
      required: true
    - id: 11
      name: leadership_effectiveness
      label: Meeting Leadership Effectiveness
      hint: Rate how well the meeting was led
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Needs Improvement
      required: true
    - id: 12
      name: content_relevance
      label: Was the content relevant to board goals
      hint: null
      type: select_one
      options:
      - Highly relevant
      - Mostly relevant
      - Somewhat relevant
      - Not relevant
      required: true
    - id: 13
      name: strengths
      label: What were the meeting strengths
      hint: List positive aspects of the meeting
      type: text
      options: []
      required: false
    - id: 14
      name: improvements
      label: Areas for Improvement
      hint: Suggestions to improve future meetings
      type: text
      options: []
      required: false
    - id: 15
      name: communication_rating
      label: Communication and Transparency
      hint: How well were matters communicated
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: resources_adequate
      label: Were resources and materials adequate
      hint: null
      type: select_one
      options:
      - 'True'
      - Mostly
      - Partially
      - 'False'
      required: true
    - id: 17
      name: next_meeting_suggestions
      label: Suggestions for Next Meeting
      hint: Any topics or formats you would like
      type: text
      options: []
      required: false
    - id: 18
      name: overall_satisfaction
      label: Overall Meeting Satisfaction
      hint: How satisfied are you with this meeting
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: true
