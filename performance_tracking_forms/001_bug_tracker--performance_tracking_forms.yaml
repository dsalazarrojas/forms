inputSchema:
  type: object
  properties:
    title: Bug Tracker
    pages:
    - id: 1
      name: report_date
      label: Date of Bug Report
      hint: When did you encounter this bug
      type: date
      options: []
      required: true
    - id: 2
      name: bug_title
      label: Bug Title
      hint: Brief summary of the issue
      type: text
      options: []
      required: true
    - id: 3
      name: bug_description
      label: Detailed Description
      hint: Provide complete details about the bug
      type: text
      options: []
      required: true
    - id: 4
      name: severity_level
      label: Severity Level
      hint: How critical is this bug
      type: select_one
      options:
      - Critical
      - High
      - Medium
      - Low
      required: true
    - id: 5
      name: browser_type
      label: Browser Type
      hint: Which browser are you using
      type: select_one
      options:
      - Chrome
      - Firefox
      - Safari
      - Edge
      - Opera
      required: true
    - id: 6
      name: browser_version
      label: Browser Version
      hint: What version number
      type: text
      options: []
      required: false
    - id: 7
      name: operating_system
      label: Operating System
      hint: Which OS are you running
      type: select_one
      options:
      - Windows
      - macOS
      - Linux
      - iOS
      - Android
      required: true
    - id: 8
      name: os_version
      label: Operating System Version
      hint: Example - Windows 10, macOS 12
      type: text
      options: []
      required: false
    - id: 9
      name: steps_to_reproduce
      label: Steps to Reproduce
      hint: Numbered steps to trigger the bug
      type: text
      options: []
      required: true
    - id: 10
      name: expected_behavior
      label: Expected Behavior
      hint: What should happen instead
      type: text
      options: []
      required: true
    - id: 11
      name: actual_behavior
      label: Actual Behavior
      hint: What actually happens
      type: text
      options: []
      required: true
    - id: 12
      name: reporter_name
      label: Your Name
      hint: Full name of bug reporter
      type: text
      options: []
      required: true
    - id: 13
      name: reporter_email
      label: Your Email Address
      hint: How we can contact you for follow-up
      type: email
      options: []
      required: true
    - id: 14
      name: reporter_phone
      label: Your Phone Number
      hint: Optional contact number
      type: text
      options: []
      required: false
    - id: 15
      name: attachments_present
      label: Do you have attachments
      hint: Screenshots or logs
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 16
      name: additional_notes
      label: Additional Notes
      hint: Any other information that might help
      type: text
      options: []
      required: false
