inputSchema:
  type: object
  properties:
    title: Progress Note Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_id
      label: Project
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: project_status
      label: Project Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 4
      name: date_of_completion
      label: Date of Completion
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: employee_comments
      label: Employee Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: project_due_date
      label: Project Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: employer_notes
      label: Employer Notes
      hint: null
      type: note
      options: []
      required: false
