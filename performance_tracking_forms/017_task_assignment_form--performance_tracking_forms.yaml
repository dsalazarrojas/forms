inputSchema:
  type: object
  properties:
    title: Task Assignment Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: assignee_input
      label: Assignee Select
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - Jim Smith
      required: true
    - id: 3
      name: task_input
      label: Task Select
      hint: null
      type: select_one
      options:
      - Task A
      - Task B
      - Task C
      required: true
    - id: 4
      name: task_details
      label: Task Details
      hint: Enter additional task details here
      type: text
      options: []
      required: false
    - id: 5
      name: assign_date
      label: Assignment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 8
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 9
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: Comments on the task status
      type: text
      options: []
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: cancel
      label: Cancel
      hint: null
      type: text
      options: []
      required: false
