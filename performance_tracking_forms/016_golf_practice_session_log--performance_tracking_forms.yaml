inputSchema:
  type: object
  properties:
    title: Golf Practice Session Log
    pages:
    - id: 1
      name: practice_session_date
      label: Practice Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: session_type
      label: Session Type
      hint: null
      type: select_one
      options:
      - Practice
      - Drills
      - Lessons
      - Games
      required: false
    - id: 3
      name: focus_area
      label: Focus Area
      hint: null
      type: select_multiple
      options:
      - Long Game
      - Short Game
      - Chipping
      - Putting
      - Irons
      - Wedges
      - Driver
      required: false
    - id: 4
      name: self_assessment
      label: Self-Assessment
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 5
      name: practice_session_id
      label: Practice Session ID
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: user_input_1
      label: User Input 1
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: user_input_2
      label: User Input 2
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: user_input_3
      label: User Input 3
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: user_input_4
      label: User Input 4
      hint: null
      type: text
      options: []
      required: false
