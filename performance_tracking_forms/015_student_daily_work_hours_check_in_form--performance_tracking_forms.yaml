inputSchema:
  type: object
  properties:
    title: Student Daily Work Hours Check In Form
    pages:
    - id: 1
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 2
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: work_hours
      label: Work Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
