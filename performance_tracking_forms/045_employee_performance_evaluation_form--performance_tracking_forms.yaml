inputSchema:
  type: object
  properties:
    title: Employee Performance Evaluation Form
    pages:
    - id: 1
      name: employee
      label: Employee
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: performance_period
      label: Performance Period
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: goals
      label: Goals
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: ratings
      label: Ratings
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: false
    - id: 7
      name: action_items
      label: Action Items
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: next_eval_date
      label: Next Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: evaluation_type
      label: Evaluation Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
