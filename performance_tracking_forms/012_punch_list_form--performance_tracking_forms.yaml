inputSchema:
  type: object
  properties:
    title: Punch List Form
    pages:
    - id: 1
      name: task_name
      label: Task Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: task_description
      label: Task Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Jim
      required: false
    - id: 6
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Not Started
      - In Progress
      - Done
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
