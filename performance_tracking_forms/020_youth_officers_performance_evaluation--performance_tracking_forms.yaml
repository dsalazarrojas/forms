inputSchema:
  type: object
  properties:
    title: Youth Officers Performance Evaluation
    pages:
    - id: 1
      name: communication_skills
      label: How would you rate the youth officer's communication skills?
      hint: Rate on a scale of 1-5
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 2
      name: leadership_skills
      label: How would you rate the youth officer's leadership skills?
      hint: Rate on a scale of 1-5
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 3
      name: attendance_record
      label: What is the youth officer's average attendance record?
      hint: Enter as number
      type: number
      options: []
      required: false
    - id: 4
      name: last_meeting
      label: When was the last time the youth officer attended a staff meeting?
      hint: Enter date
      type: date
      options: []
      required: false
    - id: 5
      name: start_time
      label: What is the youth officer's average start time for work each day?
      hint: Enter time
      type: time
      options: []
      required: false
    - id: 6
      name: report_submission
      label: How well do you rate the youth officer's ability to write and submit
        reports on time?
      hint: Select all that apply
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: extra_hours
      label: What is the number of hours spent on tasks outside of work hours to help
        with work-related tasks?
      hint: Enter number
      type: number
      options: []
      required: false
    - id: 8
      name: collaboration_skills
      label: How would you rate the youth officer's ability to work with colleagues
        and other departments?
      hint: Select all that apply
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: time_management
      label: How would you rate the youth officer's time management skills?
      hint: Rate on a scale of 1-5
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 10
      name: tasks_completed
      label: What is the number of tasks completed within deadlines?
      hint: Enter number
      type: number
      options: []
      required: false
    - id: 11
      name: problem_solving
      label: How well do you rate the youth officer's problem-solving skills?
      hint: Select all that apply
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: suggestions_for_improvement
      label: Are there any suggestions or areas for improvement for the youth officer?
      hint: Enter text
      type: text
      options: []
      required: false
