inputSchema:
  type: object
  properties:
    title: Employee Performance Monitoring Form
    pages:
    - id: 1
      name: manager_rating
      label: manager_rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: feedback_comments
      label: feedback_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: evaluation_criteria
      label: evaluation_criteria
