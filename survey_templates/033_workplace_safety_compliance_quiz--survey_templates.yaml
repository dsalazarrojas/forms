inputSchema:
  type: object
  properties:
    title: Workplace Safety Compliance Quiz
    pages:
    - id: 1
      name: workplace_safety_environment
      label: What is the most important factor in ensuring a safe work environment?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: evaluate_safety_procedures
      label: How do you evaluate employee knowledge on safety procedures?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: report_incident
      label: What is the process for reporting a workplace accident or injury?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: received_training
      label: Have you received training on workplace safety procedures?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: regular_safety_checks
      label: What is the purpose of regular safety equipment checks?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: follow_safety_procedures
      label: How do you ensure that safety procedures are followed by coworkers?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: near_miss_incident
      label: What is the most effective way to report a near-miss incident?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: feedback_on_safety_performance
      label: Have you ever received feedback on your own safety performance?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: supervisor_role
      label: What is the role of the supervisor in ensuring workplace safety?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: handle_unsafe_behavior
      label: How do you handle a situation where a coworker is not following safety
        procedures?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: address_hazards
      label: What is the procedure for addressing workplace hazards?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: safety_inspection
      label: What is the process for conducting a workplace safety inspection?
      hint: null
      type: text
      options: []
      required: false
