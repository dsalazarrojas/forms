inputSchema:
  type: object
  properties:
    title: Alphabet Writing Practice Survey
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: student_age
      label: Student Age
      hint: Age in years
      type: number
      options: []
      required: true
    - id: 3
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - Pre-K
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      required: true
    - id: 4
      name: survey_date
      label: Survey Date
      hint: Date of survey
      type: date
      options: []
      required: true
    - id: 5
      name: teacher_name
      label: Teacher Name
      hint: Instructor name
      type: text
      options: []
      required: true
    - id: 6
      name: parent_guardian_name
      label: Parent/Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 7
      name: writing_experience
      label: How Long Has Student Been Writing?
      hint: Duration
      type: select_one
      options:
      - Less than 6 months
      - 6 months - 1 year
      - 1-2 years
      - 2-3 years
      - Over 3 years
      required: true
    - id: 8
      name: uppercase_letters_known
      label: Uppercase Letters Known
      hint: How many uppercase letters?
      type: select_one
      options:
      - None
      - 1-10 letters
      - 11-20 letters
      - 21-25 letters
      - All 26 letters
      required: true
    - id: 9
      name: lowercase_letters_known
      label: Lowercase Letters Known
      hint: How many lowercase letters?
      type: select_one
      options:
      - None
      - 1-10 letters
      - 11-20 letters
      - 21-25 letters
      - All 26 letters
      required: true
    - id: 10
      name: letters_can_write
      label: Letters Student Can Write
      hint: Number they can form
      type: select_one
      options:
      - None
      - 1-5 letters
      - 6-15 letters
      - 16-25 letters
      - All 26 letters
      required: true
    - id: 11
      name: letter_reversals
      label: Letter Reversals Common
      hint: Does student reverse letters?
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      - Very often
      required: true
    - id: 12
      name: most_difficult_letters
      label: Most Difficult Letters
      hint: Which letters are hard?
      type: text
      options: []
      required: false
    - id: 13
      name: pencil_grip
      label: Pencil Grip
      hint: How do they hold pencil?
      type: select_one
      options:
      - Mature tripod grip
      - Developing grip
      - Immature grip
      - Unusual grip
      - Needs assistance
      required: true
    - id: 14
      name: writing_hand
      label: Writing Hand
      hint: Dominant hand
      type: select_one
      options:
      - Right hand
      - Left hand
      - Switching hands
      - Undetermined
      required: true
    - id: 15
      name: hand_strength
      label: Hand Strength
      hint: Rate hand strength
      type: select_one
      options:
      - Strong
      - Adequate
      - Weak
      - Very weak
      required: true
    - id: 16
      name: writing_confidence
      label: Writing Confidence
      hint: How confident is student?
      type: select_one
      options:
      - Very confident
      - Confident
      - Somewhat confident
      - Not confident
      - Very unconfident
      required: true
    - id: 17
      name: enjoys_writing
      label: Enjoys Writing Activities
      hint: Do they like writing?
      type: select_one
      options:
      - Loves it
      - Likes it
      - Neutral
      - Dislikes it
      - Hates it
      required: true
    - id: 18
      name: writing_frustration
      label: Writing Frustration Level
      hint: How frustrated do they get?
      type: select_one
      options:
      - Never frustrated
      - Rarely frustrated
      - Sometimes frustrated
      - Often frustrated
      - Always frustrated
      required: true
    - id: 19
      name: letter_size_consistency
      label: Letter Size Consistency
      hint: Are letters uniform?
      type: select_one
      options:
      - Very consistent
      - Mostly consistent
      - Inconsistent
      - Very inconsistent
      required: true
    - id: 20
      name: letter_alignment
      label: Letter Alignment
      hint: Do letters stay on line?
      type: select_one
      options:
      - Always on line
      - Mostly on line
      - Sometimes on line
      - Rarely on line
      required: true
    - id: 21
      name: spacing_between_letters
      label: Spacing Between Letters
      hint: Is spacing appropriate?
      type: select_one
      options:
      - Always appropriate
      - Mostly appropriate
      - Inconsistent
      - Poor spacing
      required: true
    - id: 22
      name: writing_speed
      label: Writing Speed
      hint: How fast do they write?
      type: select_one
      options:
      - Very fast
      - Fast
      - Average
      - Slow
      - Very slow
      required: true
    - id: 23
      name: fine_motor_skills
      label: Fine Motor Skills
      hint: Rate fine motor ability
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 24
      name: practices_at_home
      label: Practices Writing at Home
      hint: Do they practice?
      type: select_one
      options:
      - Daily
      - Weekly
      - Rarely
      - Never
      required: false
    - id: 25
      name: parent_helps_with_writing
      label: Parent Helps with Writing
      hint: Do you help them?
      type: select_one
      options:
      - Yes, daily
      - Yes, weekly
      - Rarely
      - false
      required: false
    - id: 26
      name: areas_of_strength
      label: Areas of Strength
      hint: What are they good at?
      type: text
      options: []
      required: false
    - id: 27
      name: areas_needing_improvement
      label: Areas Needing Improvement
      hint: What needs work?
      type: text
      options: []
      required: true
    - id: 28
      name: specific_challenges
      label: Specific Challenges
      hint: What is difficult?
      type: text
      options: []
      required: false
    - id: 29
      name: recommended_practice
      label: Recommended Practice Time
      hint: How much to practice?
      type: select_one
      options:
      - 5-10 minutes daily
      - 10-15 minutes daily
      - 15-20 minutes daily
      - 20-30 minutes daily
      - As much as possible
      required: false
    - id: 30
      name: additional_support_needed
      label: Additional Support Needed
      hint: Any special needs?
      type: text
      options: []
      required: false
    - id: 31
      name: occupational_therapy_referral
      label: Occupational Therapy Referral Consideration
      hint: Is OT referral needed?
      type: select_one
      options:
      - Yes, recommended
      - Maybe, monitor progress
      - No, not needed
      required: false
    - id: 32
      name: teacher_comments
      label: Teacher Comments
      hint: Additional observations
      type: text
      options: []
      required: false
    - id: 33
      name: parent_comments
      label: Parent Comments
      hint: Any concerns or observations
      type: text
      options: []
      required: false
    - id: 34
      name: goals_for_student
      label: Goals for Student
      hint: What to work on?
      type: text
      options: []
      required: false
