inputSchema:
  type: object
  properties:
    title: Community Development Initiative Poll
    pages:
    - id: 1
      name: section_development_poll_intro
      label: -- Community Development Poll --
      hint: Your voice matters in our community's development!
      type: note
      options: []
      required: false
    - id: 2
      name: resident_full_name_pol
      label: Full Name of Resident
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: resident_email_pol
      label: Email Address
      hint: For follow-up and poll results delivery
      type: email
      options: []
      required: true
    - id: 4
      name: resident_phone_pol
      label: Primary Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: resident_address_pol
      label: Residential Address
      hint: Street, City, State, Zip
      type: text
      options: []
      required: true
    - id: 6
      name: section_development_priorities_pol
      label: -- Development Priorities and Issues --
      hint: Select the areas and issues that matter most to you.
      type: note
      options: []
      required: false
    - id: 7
      name: priority_development_area_pol
      label: Which area in our community needs the most development attention
      hint: Select your top priority
      type: select_one
      options:
      - Housing and Real Estate
      - Public Transportation
      - Parks and Recreation
      - Commercial/Business Zones
      - Education and Schools
      - Public Safety and Infrastructure
      required: true
    - id: 8
      name: top_development_issues_pol
      label: What are the biggest development issues you see
      hint: Select all that apply
      type: select_multiple
      options:
      - Affordable Housing Lack
      - Poor Public Transit
      - Outdated Infrastructure
      - Lack of Green Spaces
      - Declining Business District
      - Unsafe Neighborhood Conditions
      required: true
    - id: 9
      name: section_community_sentiment_pol
      label: -- Community Sentiment and Feedback --
      hint: Tell us about your satisfaction and ideas.
      type: note
      options: []
      required: false
    - id: 10
      name: overall_community_satisfaction_pol
      label: Rate your overall satisfaction with our community's development
      hint: 1 (Very Dissatisfied) to 5 (Very Satisfied)
      type: number
      options: []
      required: true
    - id: 11
      name: development_initiative_satisfaction_pol
      label: Rate your satisfaction with recent development initiatives
      hint: 1 (Very Dissatisfied) to 5 (Very Satisfied)
      type: number
      options: []
      required: true
    - id: 12
      name: future_development_ideas_pol
      label: What are your ideas for future development initiatives
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: development_support_availability_pol
      label: Would you be willing to support a development initiative
      hint: null
      type: select_one
      options:
      - Yes, sign me up!
      - No, thank you
      - Maybe, more info please
      required: true
    - id: 14
      name: section_final_submission_pol
      label: -- Final Submission and Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: resident_signature_digital_pol
      label: Digital Signature (Type Full Name)
      hint: I certify that the information provided is correct.
      type: text
      options: []
      required: true
    - id: 16
      name: submission_date_final_pol
      label: Date of Poll Submission
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: newsletter_opt_in_pol
      label: I would like to receive the community center's newsletter
      hint: Stay updated on our programs and events
      type: select_one
      options:
      - Yes, sign me up!
      - No, thank you
      required: true
    - id: 18
      name: referral_source_pol
      label: How did you hear about this development poll
      hint: null
      type: select_one
      options:
      - Email
      - Social Media
      - Website
      - Friend/Colleague
      - Poster/Flyer
      required: false
    - id: 19
      name: emergency_contact_full_name_pol
      label: Emergency Contact Person
      hint: Someone not living with the resident
      type: text
      options: []
      required: true
    - id: 20
      name: emergency_contact_phone_pol
      label: Emergency Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
