inputSchema:
  type: object
  properties:
    title: Web Application Features Survey
    pages:
    - id: 1
      name: feature_importance
      label: Feature Importance
      hint: null
      type: select_multiple
      options:
      - Very Important
      - Not Important
      required: false
    - id: 2
      name: new_ideas
      label: New Ideas
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very Important''}'
      - '{''label'': ''Important''}'
      - '{''label'': ''Neutral''}'
      - '{''label'': ''Not Important''}'
      - '{''label'': ''Not At All Important''}'
      required: false
    - id: 4
      name: new_feature_requests
      label: New Feature Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: feature_satisfaction
      label: Feature Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: new_feature_improvement_ideas
      label: New Feature Improvement Ideas
      hint: null
      type: text
      options: []
      required: false
