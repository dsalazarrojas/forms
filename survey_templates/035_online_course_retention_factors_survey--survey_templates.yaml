inputSchema:
  type: object
  properties:
    title: Online Course Retention Factors Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: course_factors
      label: What Factors Influence Student Retention
      hint: null
      type: select_multiple
      options:
      - Retention and Engagement
      - Quality of Education
      - Student Support
      - Other
      required: false
    - id: 3
      name: student_satisfaction
      label: How Students Feel About Their Course
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 4
      name: course_improvement
      label: What Would Improve the Course
      hint: null
      type: select_multiple
      options:
      - Online Resources
      - Course Content
      - Instructor Support
      - Other
      required: true
