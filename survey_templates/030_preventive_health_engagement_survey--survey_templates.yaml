inputSchema:
  type: object
  properties:
    title: Preventive Health Engagement Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: age
      label: age
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: income
      label: income
      hint: null
      type: select_one
      options:
      - Less than 20,000
      - 20,000-40,000
      - More than 40,000
      required: false
    - id: 4
      name: occupation
      label: occupation
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: habits
      label: habits
      hint: null
      type: select_multiple
      options:
      - I exercise regularly
      - I eat a balanced diet
      - I get enough sleep
      - I take care of my mental health
      - I get regular check-ups
      - I practice stress management
      - I use relaxation techniques
      - I take my medications as prescribed
      - I have a healthy relationship with food
      - I engage in physical activity
      - I get vaccinated
      - I have a healthy relationship with substances
      required: false
    - id: 6
      name: attitudes
      label: attitudes
      hint: null
      type: select_multiple
      options:
      - I am motivated to make healthy changes
      - I am confident in my abilities
      - I am willing to make changes to improve my health
      - I have the knowledge to make healthy choices
      - I have the resources to make healthy changes
      required: false
    - id: 7
      name: barriers
      label: barriers
      hint: null
      type: text
      options: []
      required: false
