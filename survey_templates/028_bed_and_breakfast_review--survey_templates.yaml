inputSchema:
  type: object
  properties:
    title: Bed And Breakfast Review
    pages:
    - id: 1
      name: section_stay_details
      label: -- Stay Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: guest_name
      label: Guest Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: check_in_date
      label: Check-in Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: check_out_date
      label: Check-out Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: room_name_or_number
      label: Room Name or Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_ratings
      label: -- Experience Ratings --
      hint: Rate from 1 (Poor) to 5 (Excellent)
      type: note
      options: []
      required: false
    - id: 7
      name: cleanliness_rating
      label: Cleanliness of Room and Common Areas
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: comfort_rating
      label: Bed and Room Comfort
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: breakfast_quality_rating
      label: Quality and Selection of Breakfast
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: hospitality_rating
      label: Hospitality and Staff Friendliness
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: location_convenience_rating
      label: Location and Ease of Access
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: section_comments
      label: -- Detailed Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: favorite_part_of_stay
      label: What was the highlight of your stay?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: areas_for_improvement
      label: Any areas where we could improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: recommendation_likelihood
      label: How likely are you to recommend us to others?
      hint: 0 to 10 scale
      type: number
      options: []
      required: true
    - id: 16
      name: return_intent
      label: Would you stay with us again?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Probably
      - Unlikely
      - false
      required: true
    - id: 17
      name: review_submission_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: true
