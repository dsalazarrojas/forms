inputSchema:
  type: object
  properties:
    title: Student Skills And Goals Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_info
      label: Student Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: skills_survey
      label: Skills Survey
      hint: null
      type: select_one
      options:
      - Communication
      - Teamwork
      - Problem Solving
      - Time Management
      - Adaptability
      - Leadership
      - Creativity
      - Critical Thinking
      - Innovation
      required: false
    - id: 4
      name: learning_preferences
      label: Learning Preferences
      hint: null
      type: select_multiple
      options:
      - Online Learning
      - In Person
      - Hybrid
      - Self-Paced
      - Project-Based
      required: false
    - id: 5
      name: school_year_goals
      label: School Year Goals
      hint: null
      type: select_one
      options:
      - Academic Achievement
      - Career Development
      - Character Education
      - Social Responsibility
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
