inputSchema:
  type: object
  properties:
    title: Convention Evaluation Survey Form
    pages:
    - id: 1
      name: attendee_name
      label: Your Name
      hint: Optional - your name
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email Address
      hint: For follow-up if needed
      type: email
      options: []
      required: false
    - id: 3
      name: organization
      label: Organization
      hint: Company or institution
      type: text
      options: []
      required: false
    - id: 4
      name: section_attendance_info
      label: -- Attendance Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: convention_name
      label: Convention Name
      hint: Which convention did you attend
      type: text
      options: []
      required: true
    - id: 6
      name: convention_date
      label: Convention Date
      hint: When was the convention
      type: date
      options: []
      required: true
    - id: 7
      name: attendance_type
      label: Type of Attendance
      hint: How did you attend
      type: select_one
      options:
      - In Person - Full Event
      - In Person - Partial
      - Virtual
      - Hybrid
      required: true
    - id: 8
      name: days_attended
      label: Days Attended
      hint: Number of days you attended
      type: number
      options: []
      required: false
    - id: 9
      name: section_content_quality
      label: -- Content Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: session_quality
      label: Quality of sessions
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: speaker_quality
      label: Quality of speakers
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: content_relevance
      label: Relevance of content to your needs
      hint: null
      type: select_one
      options:
      - Very Relevant
      - Relevant
      - Neutral
      - Not Very Relevant
      - Not Relevant
      required: true
    - id: 13
      name: material_quality
      label: Quality of provided materials
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 14
      name: section_organization
      label: -- Organization --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: registration_process
      label: Registration process
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: venue_quality
      label: Venue quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: logistics_organization
      label: Logistics and organization
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 18
      name: staff_helpfulness
      label: Staff helpfulness
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 19
      name: section_networking
      label: -- Networking --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: networking_opportunities
      label: Networking opportunities
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 21
      name: exhibition_quality
      label: Exhibition or vendor area quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: false
    - id: 22
      name: section_value
      label: -- Value --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: value_for_money
      label: Value for money
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 24
      name: expectations_met
      label: Were your expectations met
      hint: null
      type: select_one
      options:
      - Exceeded
      - Met
      - Partially Met
      - Not Met
      required: true
    - id: 25
      name: knowledge_gained
      label: How much knowledge did you gain
      hint: null
      type: select_one
      options:
      - A Great Deal
      - A Lot
      - Moderate
      - Little
      - None
      required: true
    - id: 26
      name: section_overall
