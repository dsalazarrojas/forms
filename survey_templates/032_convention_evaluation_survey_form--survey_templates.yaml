      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 28
      name: would_recommend
      label: Would you recommend this convention
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 29
      name: attend_again
      label: Would you attend again next year
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 30
      name: section_feedback
      label: -- Additional Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: best_aspect
      label: What was the best aspect of the convention
      hint: null
      type: text
      options: []
      required: false
    - id: 32
      name: areas_for_improvement
      label: What could be improved
      hint: null
      type: text
      options: []
      required: false
    - id: 33
      name: topics_for_future
      label: Topics you would like to see in future
      hint: null
      type: text
      options: []
      required: false
    - id: 34
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
