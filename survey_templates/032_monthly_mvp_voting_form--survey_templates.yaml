inputSchema:
  type: object
  properties:
    title: Monthly MVP Voting Form
    pages:
    - id: 1
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: vote_team_name
      label: Vote Team
      hint: null
      type: select_one
      options:
      - Team A
      - Team B
      - Team C
      required: true
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
