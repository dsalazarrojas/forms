inputSchema:
  type: object
  properties:
    title: Club Performance Evaluation Form
    pages:
    - id: 1
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: evaluator_name
      label: Evaluator Name
      hint: Person conducting the evaluation
      type: text
      options: []
      required: true
    - id: 3
      name: evaluator_role
      label: Evaluator Role
      hint: Your position in the club
      type: text
      options: []
      required: true
    - id: 4
      name: club_name
      label: Club Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: evaluation_period
      label: Evaluation Period
      hint: Start and end dates
      type: text
      options: []
      required: true
    - id: 6
      name: member_attendance
      label: Member Attendance Rate
      hint: Percentage of meetings attended
      type: number
      options: []
      required: false
    - id: 7
      name: goals_achievement
      label: Achievement of Club Goals
      hint: Rate goal accomplishment
      type: select_one
      options:
      - Far Below Expectations
      - Below Expectations
      - Meets Expectations
      - Exceeds Expectations
      - Far Exceeds Expectations
      required: true
    - id: 8
      name: member_engagement
      label: Member Engagement and Participation
      hint: Rate participation levels
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 9
      name: leadership_quality
      label: Quality of Leadership
      hint: Rate leadership effectiveness
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 10
      name: event_execution
      label: Quality of Events and Activities
      hint: Rate execution
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: false
    - id: 11
      name: financial_management
      label: Financial Management
      hint: Rate budget and financial control
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 12
      name: communication_effectiveness
      label: Communication Effectiveness
      hint: Rate internal and external communication
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 13
      name: growth_metrics
      label: Club Growth and Expansion
      hint: Membership growth or reach
      type: text
      options: []
      required: false
    - id: 14
      name: strengths
      label: Key Strengths
      hint: What is the club doing well
      type: text
      options: []
      required: true
    - id: 15
      name: improvement_areas
      label: Areas for Improvement
      hint: What needs improvement
      type: text
      options: []
      required: true
    - id: 16
      name: recommendations
      label: Recommendations for Next Period
      hint: Suggestions for future success
      type: text
      options: []
      required: false
