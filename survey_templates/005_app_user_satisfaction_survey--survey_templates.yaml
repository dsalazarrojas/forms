inputSchema:
  type: object
  properties:
    title: App User Satisfaction Survey
    pages:
    - id: 1
      name: respondent_section
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: user_type
      label: How would you describe yourself?
      hint: null
      type: select_one
      options:
      - Regular daily user
      - Weekly user
      - Occasional user
      - New user
      - Considering the app
      required: true
    - id: 5
      name: overall_satisfaction
      label: -- Overall Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: satisfaction_rating
      label: How satisfied are you with our app?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 7
      name: satisfaction_score
      label: Rate your satisfaction on a scale of 1-10
      hint: 1 being very unsatisfied, 10 being extremely satisfied
      type: number
      options: []
      required: true
    - id: 8
      name: feature_evaluation
      label: -- Feature Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: most_valued_features
      label: Which features do you value the most?
      hint: Select all that apply
      type: select_multiple
      options:
      - User-friendly interface
      - Speed and performance
      - Reliability
      - Customer support
      - Value for money
      required: true
    - id: 10
      name: least_liked_features
      label: What features do you like the least?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: feature_requests
      label: What new features would improve your experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: performance_evaluation
      label: -- Performance & Usability --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: app_speed
      label: How would you rate the app's speed?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 14
      name: reliability
      label: How reliable is the app?
      hint: null
      type: select_one
      options:
      - Always works smoothly
      - Usually works well
      - Occasionally has issues
      - Frequently has issues
      - Very unreliable
      required: true
    - id: 15
      name: recommendation
      label: Would you recommend this app to others?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Yes, probably
      - Maybe
      - Probably not
      - Definitely not
      required: true
    - id: 16
      name: additional_comments
      label: Any additional comments or suggestions?
      hint: null
      type: text
      options: []
      required: false
