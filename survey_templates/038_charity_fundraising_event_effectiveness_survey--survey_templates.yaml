inputSchema:
  type: object
  properties:
    title: Charity Fundraising Event Effectiveness Survey
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: respondent_email
      label: Email Address
      hint: For follow-up
      type: email
      options: []
      required: false
    - id: 3
      name: organization_role
      label: Your Role
      hint: Relationship to event
      type: select_one
      options:
      - Event organizer
      - Staff member
      - Volunteer
      - Donor
      - Attendee
      - Sponsor
      - Other
      required: true
    - id: 4
      name: event_name
      label: Event Name
      hint: Which event
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Event Date
      hint: When held
      type: date
      options: []
      required: true
    - id: 6
      name: fundraising_goal
      label: What Was the Fundraising Goal
      hint: Target amount
      type: number
      options: []
      required: true
    - id: 7
      name: amount_raised
      label: Amount Actually Raised
      hint: Final total
      type: number
      options: []
      required: true
    - id: 8
      name: goal_achievement
      label: Was the Goal Met
      hint: Success level
      type: select_one
      options:
      - Exceeded significantly
      - Exceeded slightly
      - Met exactly
      - Fell short slightly
      - Fell short significantly
      required: true
    - id: 9
      name: total_expenses
      label: Total Event Expenses
      hint: Total costs
      type: number
      options: []
      required: true
    - id: 10
      name: net_proceeds
      label: Net Proceeds
      hint: After expenses
      type: number
      options: []
      required: true
    - id: 11
      name: roi_rating
      label: Return on Investment Rating
      hint: Was it worthwhile
      type: select_one
      options:
      - Excellent ROI
      - Good ROI
      - Average ROI
      - Poor ROI
      - Very poor ROI
      required: true
    - id: 12
      name: attendee_satisfaction
      label: Attendee Satisfaction Level
      hint: Overall feedback
      type: select_one
      options:
      - Very high
      - High
      - Average
      - Low
      - Very low
      required: true
    - id: 13
      name: volunteer_engagement
      label: Volunteer Engagement Level
      hint: Volunteer feedback
      type: select_one
      options:
      - Very engaged
      - Engaged
      - Neutral
      - Disengaged
      - Very disengaged
      required: true
    - id: 14
      name: most_effective_strategy
      label: Most Effective Fundraising Strategy
      hint: What worked best
      type: select_one
      options:
      - Ticket sales
      - Silent auction
      - Live auction
      - Direct appeals
      - Sponsorships
      - Raffle
      - Merchandise
      - Other
      required: true
    - id: 15
      name: least_effective_strategy
      label: Least Effective Strategy
      hint: What did not work
      type: select_one
      options:
      - Ticket sales
      - Silent auction
      - Live auction
      - Direct appeals
      - Sponsorships
      - Raffle
      - Merchandise
      - Other
      required: true
    - id: 16
      name: key_success_factors
      label: Key Success Factors
      hint: What made it work
      type: text
      options: []
      required: true
    - id: 17
      name: main_challenges
      label: Main Challenges Faced
      hint: Obstacles
      type: text
      options: []
      required: true
    - id: 18
      name: would_repeat
      label: Would You Repeat This Event
      hint: Future plans
      type: select_one
      options:
      - Yes exactly the same
      - Yes with modifications
      - Unsure
      - No try something else
      required: true
    - id: 19
      name: recommendations
      label: Recommendations for Future Events
      hint: Your suggestions
      type: text
      options: []
      required: true
    - id: 20
      name: overall_effectiveness
      label: Overall Event Effectiveness
      hint: Rate 1 to 5
      type: select_one
      options:
      - 5 - Highly effective
      - 4 - Effective
      - 3 - Moderately effective
      - 2 - Slightly effective
      - 1 - Not effective
      required: true
