inputSchema:
  type: object
  properties:
    title: Performance Appraisal Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: current_job_title
      label: What is your current job title?
      hint: Please provide your current job title
      type: text
      options: []
      required: true
    - id: 3
      name: self_rating
      label: How do you rate your performance in this role?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: quarterly_accomplishments
      label: List your major accomplishments in the past quarter
      hint: null
      type: select_multiple
      options:
      - Accomplishment 1
      - Accomplishment 2
      - Accomplishment 3
      required: true
    - id: 5
      name: quarterly_goals
      label: What are your top 3 goals for the next quarter?
      hint: null
      type: select_multiple
      options:
      - Goal 1
      - Goal 2
      - Goal 3
      required: true
    - id: 6
      name: goal_strategy
      label: How do you plan to achieve these goals?
      hint: Provide a clear plan of action
      type: text
      options: []
      required: true
    - id: 7
      name: used_tools
      label: What tools do you use for this role?
      hint: null
      type: select_multiple
      options:
      - Tool 1
      - Tool 2
      - Tool 3
      required: true
    - id: 8
      name: assigned_tools
      label: Which tools have been assigned to you?
      hint: null
      type: select_multiple
      options:
      - Tool 1
      - Tool 2
      - Tool 3
      required: true
    - id: 9
      name: manager_feedback
      label: What feedback do you have for your manager?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: role_improvement
      label: What areas for improvement do you suggest for your role?
      hint: null
      type: select_multiple
      options:
      - Area 1
      - Area 2
      - Area 3
      required: true
    - id: 11
      name: output_format
      label: What is the expected output format for the appraisal?
      hint: null
      type: select_one
      options:
      - Format 1
      - Format 2
      - Format 3
      required: true
    - id: 12
      name: output_file_name
      label: What is the name of the output file?
      hint: Please provide the name of the output file
      type: text
      options: []
      required: true
