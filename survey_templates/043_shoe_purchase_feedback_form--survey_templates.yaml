inputSchema:
  type: object
  properties:
    title: Shoe Purchase Feedback Form
    pages:
    - id: 1
      name: first_question
      label: How likely were you to recommend this shoe to a friend?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: purchase_details
      label: What was the price of the shoe?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: product_quality
      label: How would you rate the quality of the shoe?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: purchase_experience
      label: How would you rate your overall purchasing experience?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: suggestions
      label: What suggestions do you have for us?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contact_email
      label: Your contact email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: contact_phone
      label: Your contact phone number
      hint: null
      type: text
      options: []
      required: true
