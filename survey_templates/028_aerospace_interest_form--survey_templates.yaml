inputSchema:
  type: object
  properties:
    title: Aerospace Interest Form
    pages:
    - id: 1
      name: personal_details_header
      label: -- Personal Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: current_status
      label: Current Status
      hint: null
      type: select_one
      options:
      - High School Student
      - Undergraduate Student
      - Graduate Student
      - Researcher
      - Industry Professional
      - Hobbyist
      required: true
    - id: 6
      name: interest_areas_header
      label: -- Areas of Interest --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: primary_interest
      label: Primary Interest Area
      hint: What excites you most?
      type: select_one
      options:
      - Propulsion Systems
      - Aerodynamics
      - Space Exploration
      - Avionics & Systems
      - Materials Science
      - Drone Technology (UAVs)
      required: true
    - id: 8
      name: opportunity_type
      label: Type of Opportunity Sought
      hint: What are you looking for?
      type: select_multiple
      options:
      - Internship / Co-op
      - Full-time Employment
      - Research Collaboration
      - Mentorship
      - Educational Workshops
      - Networking Events
      required: true
    - id: 9
      name: experience_level
      label: Experience Level
      hint: null
      type: select_one
      options:
      - No experience yet
      - Beginner (some projects)
      - Intermediate (academic/internship exp)
      - Advanced (professional exp)
      required: false
    - id: 10
      name: comments
      label: Why Aerospace?
      hint: Briefly tell us about your passion for the field.
      type: text
      options: []
      required: false
    - id: 11
      name: newsletter_optin
      label: Newsletter Subscription
      hint: Keep me updated on aerospace news.
      type: select_one
      options:
      - Subscribe
      - No thanks
      required: false
