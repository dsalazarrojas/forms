inputSchema:
  type: object
  properties:
    title: E Grocery Shopping Survey
    pages:
    - id: 1
      name: shopping_habits
      label: How often do you shop
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: frequency
      label: Frequency
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: shopping_frequency
      label: How often do you grocery shop?
      hint: null
      type: select_one
      options:
      - Online
      - In-store
      - Other
      required: false
    - id: 4
      name: shopping_channels
      label: Shopping channels
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: shopping_channels_online
      label: Online
      hint: null
      type: select_multiple
      options:
      - Amazon
      - Instacart
      - Google
      - Other
      required: false
    - id: 6
      name: shopping_channels_instore
      label: In-store
      hint: null
      type: select_multiple
      options:
      - Grocery store
      - Discount store
      - Pharmacy
      - Other
      required: false
    - id: 7
      name: preferred_store
      label: Preferred store
      hint: null
      type: select_one
      options:
      - Whole Foods
      - Trader Joe's
      - Costco
      - Other
      required: false
    - id: 8
      name: store_experience
      label: Store experience
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: store_experience_online
      label: Store Experience Online
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 10
      name: store_experience_instore
      label: Store Experience Instore
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 11
      name: store_experience_other
      label: Other
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 12
      name: shopping_frequency_frequency
      label: Frequency (per week)
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: age
      label: Age
      hint: null
      type: select_one
      options:
