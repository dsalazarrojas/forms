      - $100k+
      required: false
    - id: 15
      name: household_income
      label: Household income
      hint: null
      type: select_one
      options:
      - Less than $25k
      - $25k-$49k
      - $50k-$74k
      - $75k-$99k
      - $100k+
      required: false
    - id: 16
      name: household_members
