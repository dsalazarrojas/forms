      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 23
      name: employment_status_unemployed
      label: Unemployed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 24
      name: employment_status_other
      label: Employment Status Other
      hint: null
