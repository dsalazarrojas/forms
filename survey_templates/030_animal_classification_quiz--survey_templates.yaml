inputSchema:
  type: object
  properties:
    title: Animal Classification Quiz
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For quiz results
      type: email
      options: []
      required: true
    - id: 3
      name: institution
      label: School or Organization
      hint: Affiliation
      type: text
      options: []
      required: false
    - id: 4
      name: quiz_intro
      label: Animal Classification Quiz
      hint: Test your knowledge of animal taxonomy and classification
      type: note
      options: []
      required: false
    - id: 5
      name: question_1
      label: Which kingdom do animals belong to
      hint: Select the correct answer
      type: select_one
      options:
      - Plantae
      - Animalia
      - Fungi
      - Protista
      required: true
    - id: 6
      name: question_2
      label: What is the basic unit of biological classification
      hint: Select the correct answer
      type: select_one
      options:
      - Genus
      - Family
      - Species
      - Order
      required: true
    - id: 7
      name: question_3
      label: Which of the following is NOT a vertebrate class
      hint: Select the correct answer
      type: select_one
      options:
      - Mammalia
      - Aves
      - Arthropoda
      - Reptilia
      required: true
    - id: 8
      name: question_4
      label: Animals with backbones are called
      hint: Select the correct answer
      type: select_one
      options:
      - Invertebrates
      - Vertebrates
      - Arthropods
      - Mollusks
      required: true
    - id: 9
      name: question_5
      label: Which class of animals is characterized by having feathers
      hint: Select the correct answer
      type: select_one
      options:
      - Mammalia
      - Reptilia
      - Aves
      - Amphibia
      required: true
    - id: 10
      name: question_6
      label: Mammals are characterized by which feature
      hint: Select the correct answer
      type: select_one
      options:
      - Laying eggs
      - Having hair or fur and producing milk
      - Having scales
      - Living in water
      required: true
    - id: 11
      name: question_7
      label: Which of the following is an amphibian
      hint: Select the correct answer
      type: select_one
      options:
      - Lizard
      - Frog
      - Snake
      - Turtle
      required: true
    - id: 12
      name: question_8
      label: Fish belong to which group
      hint: Select the correct answer
      type: select_one
      options:
      - Aquatic vertebrates with gills
      - Marine mammals
      - Invertebrates
      - Reptiles
      required: true
    - id: 13
      name: question_9
      label: Insects belong to which phylum
      hint: Select the correct answer
      type: select_one
      options:
      - Chordata
      - Arthropoda
      - Mollusca
      - Annelida
      required: true
    - id: 14
      name: question_10
      label: Which is the correct order of taxonomic ranks from broadest to most specific
      hint: Select the correct answer
      type: select_one
      options:
      - Kingdom, Phylum, Class, Order, Family, Genus, Species
      - Species, Genus, Family, Order, Class, Phylum, Kingdom
      - Kingdom, Class, Phylum, Order, Family, Genus, Species
      - Phylum, Kingdom, Class, Order, Family, Genus, Species
      required: true
    - id: 15
      name: question_11
      label: Which animal is a marsupial
      hint: Select the correct answer
      type: select_one
      options:
      - Dog
      - Kangaroo
      - Bat
      - Whale
      required: true
    - id: 16
      name: question_12
      label: Reptiles are characterized by
      hint: Select all that apply
      type: select_multiple
      options:
      - Having scales
      - Being cold-blooded
      - Laying eggs on land
      - Having feathers
      - Breathing with lungs
      required: true
    - id: 17
      name: question_13
      label: Which of the following is a cephalopod mollusk
      hint: Select the correct answer
      type: select_one
      options:
      - Clam
      - Snail
      - Octopus
      - Mussel
      required: true
    - id: 18
      name: question_14
      label: Birds are warm-blooded
      hint: Select true or false
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: question_15
      label: Which group has the most species on Earth
      hint: Select the correct answer
      type: select_one
      options:
      - Mammals
      - Birds
      - Insects
      - Fish
      required: true
    - id: 20
      name: question_16
      label: A scientific name consists of which two parts
      hint: Select the correct answer
      type: select_one
      options:
      - Family and Genus
      - Genus and Species
      - Order and Family
      - Kingdom and Phylum
      required: true
    - id: 21
      name: question_17
      label: Which of these animals is a monotreme
      hint: Select the correct answer
      type: select_one
      options:
      - Kangaroo
      - Platypus
      - Koala
      - Wombat
      required: true
    - id: 22
      name: question_18
      label: Arachnids have how many legs
      hint: Select the correct answer
      type: select_one
      options:
      - '6'
      - '8'
      - '10'
      - '12'
      required: true
    - id: 23
      name: question_19
      label: Which phylum includes animals with a notochord
      hint: Select the correct answer
      type: select_one
      options:
      - Arthropoda
      - Chordata
      - Echinodermata
      - Cnidaria
      required: true
    - id: 24
      name: question_20
      label: Coral and jellyfish belong to which phylum
      hint: Select the correct answer
      type: select_one
      options:
      - Porifera
      - Cnidaria
      - Platyhelminthes
      - Nematoda
      required: true
    - id: 25
      name: confidence_level
      label: How Confident Are You in Your Answers
      hint: Self-assessment
      type: select_one
      options:
      - Very confident
      - Somewhat confident
      - Neutral
      - Somewhat unsure
      - Very unsure
      required: false
    - id: 26
      name: difficulty_rating
      label: How Would You Rate the Difficulty of This Quiz
      hint: Feedback
      type: select_one
      options:
      - Very easy
      - Easy
      - Moderate
      - Difficult
      - Very difficult
      required: false
    - id: 27
      name: additional_comments
      label: Additional Comments
      hint: Any thoughts
      type: text
      options: []
      required: false
