inputSchema:
  type: object
  properties:
    title: Business Support Satisfaction Survey
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Full name of respondent
      type: text
      options: []
      required: true
    - id: 2
      name: client_company
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 4
      name: respondent_phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: false
    - id: 5
      name: survey_date
      label: Survey Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 6
      name: service_category
      label: Service Category
      hint: What service did you receive
      type: select_one
      options:
      - Technical Support
      - Customer Service
      - Product Support
      - Account Management
      - Other Support
      required: true
    - id: 7
      name: support_representative
      label: Support Representative Name
      hint: Name of person who helped you
      type: text
      options: []
      required: false
    - id: 8
      name: interaction_channel
      label: How Did You Contact Us
      hint: Communication method used
      type: select_one
      options:
      - Phone
      - Email
      - Chat
      - In-person
      - Video Call
      - Other
      required: true
    - id: 9
      name: response_time
      label: Response Time Rating
      hint: How quickly did we respond
      type: select_one
      options:
      - Excellent
      - Good
      - Acceptable
      - Slow
      - Very Slow
      required: true
    - id: 10
      name: first_contact_resolution
      label: First Contact Resolution
      hint: Was your issue resolved on first contact
      type: select_one
      options:
      - Yes, Fully Resolved
      - Mostly Resolved
      - Partially Resolved
      - No Resolution
      required: true
    - id: 11
      name: representative_knowledge
      label: Support Representative Knowledge
      hint: Was the representative knowledgeable
      type: select_one
      options:
      - Highly Knowledgeable
      - Knowledgeable
      - Adequate
      - Limited
      - Not Knowledgeable
      required: true
    - id: 12
      name: representative_courtesy
      label: Representative Courtesy and Respect
      hint: Was the representative professional
      type: select_one
      options:
      - Excellent
      - Good
      - Acceptable
      - Fair
      - Poor
      required: true
    - id: 13
      name: solution_quality
      label: Quality of Solution Provided
      hint: How effective was the solution
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 14
      name: explanation_clarity
      label: Clarity of Explanation
      hint: Was the explanation clear
      type: select_one
      options:
      - Very Clear
      - Clear
      - Adequately Clear
      - Unclear
      - Very Unclear
      required: true
    - id: 15
      name: follow_up
      label: Appropriate Follow-up
      hint: Was there good follow-up
      type: select_one
      options:
      - Excellent Follow-up
      - Good Follow-up
      - Adequate
      - Minimal
      - No Follow-up
      required: true
    - id: 16
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Overall satisfaction with support
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 17
      name: likelihood_recommend
      label: Likelihood to Recommend
      hint: Would you recommend our support
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 18
      name: improvement_feedback
      label: Feedback for Improvement
      hint: How can we improve our support
      type: text
      options: []
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
