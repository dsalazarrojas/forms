inputSchema:
  type: object
  properties:
    title: Snake Awareness Quiz
    pages:
    - id: 1
      name: snake_awareness_quiz_form
      label: Snake Awareness Quiz Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: quiz_question_1
      label: What is the primary goal of the Snake Awareness Quiz?
      hint: null
      type: select_one
      options:
      - A) To educate students about snake safety
      - B) To entertain students with a fun quiz
      - C) To track student progress and improve training for field activities
      - D) To test student knowledge on outdoor safety
      required: false
    - id: 3
      name: quiz_question_2
      label: How will you typically encounter snakes in the wild?
      hint: null
      type: select_multiple
      options:
      - Hiking or backpacking
      - Near water sources
      - In rocky or brushy areas
      - Near tall grass or weeds
      - In urban areas
      required: false
    - id: 4
      name: quiz_question_3
      label: What is the best way to identify a venomous snake?
      hint: null
      type: select_one
      options:
      - Color and pattern
      - Size and shape
      - Movement and behavior
      - All of the above
      required: false
    - id: 5
      name: quiz_question_4
      label: How would you respond if you encounter a venomous snake?
      hint: null
      type: select_one
      options:
      - Run away quickly
      - Stay calm and observe
      - Slowly back away with a firm but calm voice
      - Fight the snake with a stick or object
      required: false
    - id: 6
      name: quiz_question_5
      label: When encountering a non-venomous snake, how do you handle it?
      hint: null
      type: select_one
      options:
      - Touch it gently with your hands
      - Slowly back away and observe from a distance
      - Try to pick it up
      - Call for help
      required: false
    - id: 7
      name: quiz_question_6
      label: If you see someone else encounter a venomous snake, what do you do?
      hint: null
      type: select_one
      options:
      - Help the person slowly and carefully back away from the snake
      - Stand still and let them handle it
      - Run away from the scene
      - Stay still and observe
      required: false
    - id: 8
      name: quiz_question_7
      label: What is the correct way to wear snake bite protection?
      hint: null
      type: select_multiple
      options:
      - Long pants
      - Long-sleeved shirt
      - Closed-toed boots
      - Gaiters
      required: false
    - id: 9
      name: quiz_question_8
      label: What is the best way to stay safe while walking in the wild?
      hint: null
      type: select_multiple
      options:
      - Wear proper gear and clothing
      - Stay on designated trails
      - Pay attention to your surroundings
      - Stay with a group
      required: false
    - id: 10
      name: quiz_question_9
      label: What should you do if you see a snake in your backyard or living room?
      hint: null
      type: select_one
      options:
      - Call a professional snake removal service
      - Try to handle it yourself
      - Leave it alone and hope it goes away
      - Call a friend or family member for help
      required: false
    - id: 11
      name: quiz_question_10
      label: How often should you check for snakes when walking in the wild?
      hint: null
      type: select_one
      options:
      - Every step
      - Every 5 minutes
      - Every 10 minutes
      - Never
      required: false
    - id: 12
      name: quiz_question_11
      label: What is the most important thing to remember when handling a snake?
      hint: null
      type: select_one
      options:
      - Be calm and stay still
      - Move slowly and carefully
      - Avoid sudden movements
      - None of the above
      required: false
    - id: 13
      name: quiz_question_12
      label: What would you call this form?
      hint: null
      type: select_one
      options:
      - Snake Awareness Quiz
      - Snake Safety Quiz
      - Wild Animal Awareness Quiz
      - Outdoor Safety Quiz
      required: false
    - id: 14
      name: quiz_question_13
      label: Why is it important to fill out this quiz?
      hint: null
      type: select_one
      options:
      - To learn about snakes and stay safe
      - To test my knowledge about snakes
      - To help others learn about snakes
      - To win a prize
      required: false
    - id: 15
      name: quiz_question_14
      label: How did you find this form?
      hint: null
      type: select_one
      options:
      - On Jotform
      - On Google
      - On Facebook
      - On Twitter
      required: false
    - id: 16
      name: quiz_question_15
      label: Would you like to see more educational materials on snakes?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 17
      name: quiz_question_16
      label: Would you like to see more educational forms like this one?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 18
      name: quiz_question_17
      label: Do you have any additional comments or suggestions about this form?
      hint: Optional
      type: text
      options: []
      required: false
    - id: 19
      name: quiz_question_18
      label: How likely are you to recommend this form to a friend?
