      hint: null
      type: number
      options: []
      required: false
    - id: 21
      name: quiz_question_20
      label: What is your profession?
      hint: null
      type: select_one
      options:
      - '{''text'': ''Student''}'
      - '{''text'': ''Teacher''}'
      - '{''text'': ''Parent''}'
      - '{''text'': ''Other''}'
      required: false
    - id: 22
      name: quiz_question_21
      label: What is your level of expertise in snakes?
      hint: null
