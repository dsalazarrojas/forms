      options:
      - '{''text'': ''Very likely''}'
      - '{''text'': ''Somewhat likely''}'
      - '{''text'': ''Not very likely''}'
      - '{''text'': ''Not at all likely''}'
      required: false
    - id: 20
      name: quiz_question_19
