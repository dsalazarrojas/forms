      options:
      - '{''text'': True}'
      - '{''text'': False}'
      required: false
    - id: 17
      name: quiz_question_16
      label: Would you like to see more educational forms like this one?
      hint: null
      type: select_multiple
      options:
      - '{''text'': True}'
      - '{''text'': False}'
      required: false
    - id: 18
