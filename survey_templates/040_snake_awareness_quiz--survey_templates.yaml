      - Teacher
      - Parent
      - Other
      required: false
    - id: 22
      name: quiz_question_21
      label: What is your level of expertise in snakes?
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: false
    - id: 23
      name: quiz_question_22
      label: Which best describes your purpose of visiting the outdoors?
      hint: null
      type: select_one
      options:
      - Recreation
      - Education
      - Work
      - Other
      required: false
    - id: 24
      name: quiz_question_23
      label: Have you ever been bitten by a snake?
      hint: null
