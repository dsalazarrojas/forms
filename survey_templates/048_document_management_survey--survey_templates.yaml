      type: email
      options: []
      required: false
    - id: 6
      name: phone_section
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date_section
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time_section
      label: Time
      hint: null
      type: time
      options: []
