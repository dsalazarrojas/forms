inputSchema:
  type: object
  properties:
    title: philippine_history_quiz
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: This is the introduction page
      type: text
      options: []
      required: true
    - id: 2
      name: category
      label: native_category
      hint: Please select your native category
      type: select_one
      options:
      - History
      - Geography
      - Science
      - Art
      - Culture
      required: true
    - id: 3
      name: age
      label: age
      hint: Please enter your age
      type: number
      options: []
      required: true
    - id: 4
      name: historical_periods
      label: favorite_historical_periods
      hint: Select your favorite historical periods
      type: select_multiple
      options:
      - Pre-Colonial Period
      - Spanish Colonial Era
      - Japanese Occupation
      - American Colonial Era
      - Post-War Period
      - Contemporary Era
      required: true
    - id: 5
      name: favorite_event
      label: favorite_event
      hint: Please select your favorite historical event
      type: select_one
      options:
      - Bataan Death March
      - Battle of Mactan
      - Discovery of the Bicol Region
      - Founding of the Republic of the Philippines
      - Philippine-American War
      required: true
    - id: 6
      name: birthdate
      label: birthdate
      hint: Please enter your birthdate
      type: date
      options: []
      required: true
    - id: 7
      name: goals
      label: short_term_goals
      hint: Select your short-term goals
      type: select_multiple
      options:
      - Personal Development
      - Career Development
      - Social Contribution
      - Financial Security
      - Travel and Leisure
      - Other (please specify)
      required: true
    - id: 8
      name: email
      label: email
      hint: Do you have an email?
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: phone
      hint: Please enter your phone number
      type: text
      options: []
      required: true
    - id: 10
      name: submit
      label: submit
      hint: Please submit the form
      type: text
      options: []
      required: false
