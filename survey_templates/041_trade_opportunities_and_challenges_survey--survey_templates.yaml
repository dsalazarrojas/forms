inputSchema:
  type: object
  properties:
    title: Trade Opportunities And Challenges Survey
    pages:
    - id: 1
      name: trade_page_1
      label: Trade Opportunities and Challenges Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: trade_page_2
      label: What are the main challenges that hinder your ability to trade?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: trade_page_3
      label: What is the current average export value of your products/services?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: trade_page_4
      label: Do you have any other products/services with export value higher than
        $1,000,000?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: trade_page_5
      label: What is the current export value of these products/services higher than
        $1,000,000?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: trade_page_6
      label: What kind of support do you need to trade?
      hint: null
      type: select_multiple
      options:
      - Market access
      - Market research
      - Logistics
      - Other
      required: false
    - id: 7
      name: trade_page_7
      label: What is the primary support area you need?
      hint: null
      type: select_one
      options:
      - Trade Finance
      - Market Access
      - Export Promotion
      - Other
      required: false
    - id: 8
      name: trade_page_8
      label: Have you had any experience using a trade promotion program?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
