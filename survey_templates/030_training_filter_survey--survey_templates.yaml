inputSchema:
  type: object
  properties:
    title: Training Filter Survey
    pages:
    - id: 1
      name: training_filter_survey_form
      label: Training Filter Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_questions_1
      label: What is your role in the company?
      hint: null
      type: select_one
      options:
      - '{''label'': ''CEO''}'
      - '{''label'': ''Manager''}'
      - '{''label'': ''Employee''}'
      - '{''label'': ''None''}'
      required: false
    - id: 3
      name: form_questions_2
      label: How long have you been at the company?
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Less than 1 year''}'
      - '{''label'': ''1-3 years''}'
      - '{''label'': ''3-5 years''}'
      - '{''label'': ''More than 5 years''}'
      required: false
    - id: 4
      name: form_questions_3
      label: How would you rate your overall satisfaction with the training?
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very Dissatisfied''}'
      - '{''label'': ''Somewhat Dissatisfied''}'
      - '{''label'': ''Neutral''}'
      - '{''label'': ''Somewhat Satisfied''}'
      - '{''label'': ''Very Satisfied''}'
      required: false
    - id: 5
      name: form_questions_4
      label: What is the primary purpose of the training program?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: form_questions_5
      label: Would you recommend this training program to a colleague?
      hint: null
      type: select_one
      options:
      - '{''label'': True}'
      - '{''label'': False}'
      required: false
    - id: 7
      name: form_questions_6
      label: What was the most valuable part of the training program?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: form_questions_7
      label: How would you rate the quality of the materials used during the training?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: form_questions_8
      label: How would you rate the trainer's performance?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: form_questions_9
      label: How likely are you to recommend this training program to others?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: form_questions_10
      label: Any additional comments?
      hint: null
      type: text
      options: []
      required: false
