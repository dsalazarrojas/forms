inputSchema:
  type: object
  properties:
    title: Multi Stakeholder Feedback Survey
    pages:
    - id: 1
      name: project_team
      label: Project Team
      hint: null
      type: select_multiple
      options:
      - Project Manager
      - Team Lead
      - Team Member
      - Other
      required: false
    - id: 2
      name: stakeholders
      label: Stakeholders
      hint: null
      type: select_multiple
      options:
      - Client
      - Stakeholder Group
      - Vendor
      - Other
      required: false
    - id: 3
      name: rating_scale
      label: Rating Scale
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: project_status
      label: Project Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 7
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: project_start_date
      label: Project Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: project_end_date
      label: Project End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: project_description
      label: Project Description
      hint: null
      type: text
      options: []
      required: false
