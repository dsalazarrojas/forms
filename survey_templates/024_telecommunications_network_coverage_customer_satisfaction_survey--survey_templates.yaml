inputSchema:
  type: object
  properties:
    title: Telecommunications Network Coverage Customer Satisfaction Survey
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: location
      label: What is your location?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: service_level
      label: How would you rate the overall service quality of your telecom operator?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: signal_quality
      label: How would you rate the quality of your cell phone signal?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: call_quality
      label: How would you rate the quality of your calls?
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 6
      name: call_connectivity
      label: How often do you experience dropped calls?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: call_speed
      label: How would you rate the speed of your calls?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: data_quality
      label: How would you rate the quality of your mobile data?
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 9
      name: coverage_area
      label: What area do you live in?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: network_reliability
      label: How often do you experience network disconnections?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: coverage_quality
      label: How would you rate the coverage area?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 12
      name: signal_reliability
      label: How often do you experience signal outages?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: network_quality
      label: How would you rate the overall network quality?
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 14
      name: coverage_speed
      label: How would you rate the speed of your network coverage?
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: customer_service
      label: How would you rate the quality of your telecoms customer service?
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 16
      name: coverage_issues
      label: Have you experienced any issues with your telecoms services?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 17
      name: issue_description
      label: Please describe the issues you have experienced with your telecoms services
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: issue_resolution
      label: Have you ever contacted your telecoms for any issues with your services?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 19
      name: contact_method
      label: What method do you usually use to contact your telecoms for issues?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 20
      name: resolution_success
      label: Did the issue get resolved?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 21
      name: resolution_time
      label: How long did it take to resolve the issue?
      hint: null
      type: number
      options: []
      required: false
    - id: 22
      name: resolution_method
      label: What method did your telecoms use to resolve the issue?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 23
      name: resolution_outcome
      label: How would you rate the success in resolving the issue?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 24
      name: resolution_satisfaction
      label: How satisfied are you with the resolution of the issue?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 25
      name: additional_comments
      label: Any additional comments?
      hint: null
      type: text
      options: []
      required: false
