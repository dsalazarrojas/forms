      name: staff_courtesy
      label: Staff courtesy and professionalism
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 19
      name: communication_quality
      label: Quality of communication by staff
      hint: null
      type: select_one
