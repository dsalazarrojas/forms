inputSchema:
  type: object
  properties:
    title: Cardiac And Neurological Care Survey
    pages:
    - id: 1
      name: patient_information
      label: -- PATIENT INFORMATION --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_id
      label: Patient ID or Medical Record Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: visit_date
      label: Date of visit
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: service_type
      label: Type of service received
      hint: null
      type: select_one
      options:
      - Cardiac Consultation
      - Neurological Consultation
      - Cardiac Testing
      - Neurological Testing
      - Follow-up Visit
      - Emergency Care
      - Surgical Procedure
      required: true
    - id: 6
      name: provider_name
      label: Provider name
      hint: Physician or healthcare provider
      type: text
      options: []
      required: false
    - id: 7
      name: cardiac_care
      label: -- CARDIAC CARE ASSESSMENT --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: cardiac_care_received
      label: Did you receive cardiac care?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
    - id: 9
      name: cardiac_provider_knowledge
      label: Provider knowledge about cardiac conditions
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 10
      name: cardiac_explanation
      label: Was your cardiac condition explained clearly?
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 11
      name: cardiac_treatment_plan
