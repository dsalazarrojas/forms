inputSchema:
  type: object
  properties:
    title: Data Process Training Survey
    pages:
    - id: 1
      name: training_survey_page_one
      label: Training Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: training_programs
      label: What Training Programs Have You Participated In
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Accounting''}'
      - '{''value'': ''Data Analysis''}'
      - '{''value'': ''Data Management''}'
      - '{''value'': ''Data Science''}'
      - '{''value'': ''Data Visualization''}'
      required: false
    - id: 3
      name: training_survey_rating
      label: How Would You Rate This Training Program
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: training_survey_comment
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: training_survey_recommendation
      label: Would You Recommend This Program
      hint: null
      type: select_one
      options:
      - '{''value'': ''Strongly Agree''}'
      - '{''value'': ''Somewhat Agree''}'
      - '{''value'': ''Neither''}'
      - '{''value'': ''Somewhat Disagree''}'
      - '{''value'': ''Strongly Disagree''}'
      required: false
