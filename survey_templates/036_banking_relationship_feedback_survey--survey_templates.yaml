inputSchema:
  type: object
  properties:
    title: Banking Relationship Feedback Survey
    pages:
    - id: 1
      name: customer_full_name
      label: Customer Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 4
      name: account_type
      label: Account Type
      hint: What accounts do you have
      type: select_multiple
      options:
      - Checking
      - Savings
      - Credit Card
      - Mortgage
      - Auto Loan
      - Personal Loan
      - Investment
      - Business Account
      required: true
    - id: 5
      name: customer_tenure
      label: How Long Have You Been a Customer
      hint: Customer since
      type: select_one
      options:
      - Less than 6 months
      - 6 months to 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: net_promoter_score
      label: Net Promoter Score
      hint: How likely to recommend us
      type: number
      options: []
      required: true
    - id: 8
      name: primary_bank
      label: Are We Your Primary Bank
      hint: Do you mainly bank with us
      type: select_one
      options:
      - Yes, primary bank
      - No, secondary bank
      - One of several banks
      required: true
    - id: 9
      name: number_of_products
      label: How Many Products Do You Use
      hint: Count of products
      type: number
      options: []
      required: true
    - id: 10
      name: online_banking_satisfaction
      label: Online Banking Satisfaction
      hint: Rate digital banking
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Not Used
      required: true
    - id: 11
      name: mobile_app_satisfaction
      label: Mobile App Satisfaction
      hint: Rate mobile app
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Not Used
      required: true
    - id: 12
      name: branch_service_satisfaction
      label: Branch Service Satisfaction
      hint: Rate branch service
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Never Visited
      required: true
    - id: 13
      name: customer_service_satisfaction
      label: Customer Service Satisfaction
      hint: Rate support
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: value_for_money
      label: Value for Money
      hint: Rate value received
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: trust_level
      label: Trust Level
      hint: How much do you trust us
      type: select_one
      options:
      - Complete Trust
      - High Trust
      - Moderate Trust
      - Low Trust
      - No Trust
      required: true
    - id: 16
      name: communication_rating
      label: Communication Rating
      hint: Rate our communication
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: product_variety_satisfaction
      label: Product Variety Satisfaction
      hint: Rate product options
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 18
      name: likelihood_to_recommend
      label: Likelihood to Recommend
      hint: Will you recommend us
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 19
      name: likelihood_to_stay
      label: Likelihood to Stay
      hint: Will you remain a customer
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 20
      name: best_aspect
      label: What Do We Do Best
      hint: Our strength
      type: text
      options: []
      required: false
    - id: 21
      name: improvement_areas
      label: What Should We Improve
      hint: Areas for improvement
      type: text
      options: []
      required: false
    - id: 22
      name: additional_services_interest
      label: Additional Services of Interest
      hint: What else would you like
      type: select_multiple
      options:
      - Wealth Management
      - Insurance
      - Business Services
      - International Banking
      - Merchant Services
      - None
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
