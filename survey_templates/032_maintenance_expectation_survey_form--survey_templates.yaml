inputSchema:
  type: object
  properties:
    title: Maintenance Expectation Survey Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_no
      label: Contact No
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: maintenance_expectation
      label: Maintenance Expectation
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_multiple
      options:
      - Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Dissatisfied
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
