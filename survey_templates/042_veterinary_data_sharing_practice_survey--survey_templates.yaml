inputSchema:
  type: object
  properties:
    title: Veterinary Data Sharing Practice Survey
    pages:
    - id: 1
      name: survey_start
      label: Survey Start
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: data_sharing_habits
      label: Data Sharing Habits
      hint: null
      type: select_multiple
      options:
      - Always share data
      - Sometimes share data
      - Rarely share data
      - Never share data
      required: true
    - id: 3
      name: tools_used
      label: Tools Used
      hint: List any data sharing tools you use for sharing data (e.g. Google Drive,
        Dropbox, Email)
      type: select_one
      options:
      - Google Drive
      - Dropbox
      - Email
      - Other
      - None
      required: true
    - id: 4
      name: barriers_to_data_sharing
      label: Barriers To Data Sharing
      hint: null
      type: select_one
      options:
      - Time constraints
      - Resource limitations
      - Security concerns
      - Data quality issues
      - Other
      required: true
    - id: 5
      name: willingness_to_share_data
      label: Willingness To Share Data
      hint: null
      type: select_one
      options:
      - Strongly willing
      - Somewhat willing
      - Not very willing
      - Not at all willing
      required: true
    - id: 6
      name: reasons_for_not_sharing
      label: Reasons For Not Sharing
      hint: null
      type: select_multiple
      options:
      - Concerns about data misuse
      - Concerns about data security
      - Concerns about data quality
      - Other
      - None
      required: false
    - id: 7
      name: survey_end
      label: Survey End
      hint: null
      type: note
      options: []
      required: false
