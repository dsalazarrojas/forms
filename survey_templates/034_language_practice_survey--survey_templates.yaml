inputSchema:
  type: object
  properties:
    title: language_practice_survey
    pages:
    - id: 1
      name: survey_questions
      label: Language Learning Habits
      hint: Describe your typical language learning activities
      type: text
      options: []
      required: true
    - id: 2
      name: progress_tracking
      label: Progress Tracking Method
      hint: How do you keep track of your progress?
      type: select_one
      options:
      - Calendar or planner
      - Mobile app
      - Paper notebook
      - Other
      required: true
    - id: 3
      name: helpful_resources
      label: Helpful Language Programs or Resources
      hint: Which resources have you found most helpful?
      type: select_multiple
      options:
      - Language exchange websites (e.g., language exchange websites)
      - Language learning apps (e.g., Duolingo, Babbel)
      - Language learning podcasts (e.g., 6 Minute Russian)
      - Language learning YouTube channels (e.g., English Class 101)
      - Other
      required: true
    - id: 4
      name: received_support
      label: Received Support
      hint: Have you ever received support from a language teacher or tutor?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 5
      name: note_taking
      label: Note Taking Method
      hint: How do you take notes during language learning sessions?
      type: select_one
      options:
      - Using a notebook or paper
      - Using a digital note-taking app
      - Recording audio or video
      - Not taking notes at all
      required: false
    - id: 6
      name: practice_frequency
      label: Practice Frequency
      hint: How often do you practice writing or speaking a language for personal
        or professional purposes?
      type: number
      options: []
      required: true
    - id: 7
      name: output_file
      label: Output File
      hint: Is there a specific output file for this survey?
      type: text
      options: []
      required: false
    - id: 8
      name: category_name
      label: Category Name
      hint: What category does this survey belong to?
      type: text
      options: []
      required: false
    - id: 9
      name: description
      label: Description
      hint: Briefly describe the purpose of the survey
      type: text
      options: []
      required: false
    - id: 10
      name: form_ids
      label: Form IDs
      hint: Enter form IDs for this survey
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: Which language learning tool was assigned for this survey?
      type: text
      options: []
      required: false
    - id: 12
      name: category
      label: Category
      hint: Select the category for this survey
      type: select_one
      options:
      - Survey Templates
      - Education Surveys
      - Other
      required: true
