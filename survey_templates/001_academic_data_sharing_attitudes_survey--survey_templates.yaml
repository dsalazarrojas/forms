inputSchema:
  type: object
  properties:
    title: Academic Data Sharing Attitudes Survey
    pages:
      - id: 1
        name: section_personal_information
        label: -- Personal Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Respondent name
        hint: Full name of the respondent
        type: text
        options: []
        required: true
      - id: 3
        name: respondent_email
        label: Respondent email
        hint: Institution or personal email address
        type: email
        options: []
        required: true
      - id: 4
        name: affiliation
        label: Institutional affiliation
        hint: Department or research group
        type: text
        options: []
        required: true
      - id: 5
        name: role
        label: Role in institution
        hint: Select the option that best describes your role
        type: select_one
        options:
          - Faculty
          - Graduate student
          - Postdoctoral researcher
          - Librarian
          - Staff
          - Other
        required: true
      - id: 6
        name: research_area
        label: Primary research area
        hint: Discipline or field of study
        type: text
        options: []
        required: false
      - id: 7
        name: willingness_to_share_data
        label: Willingness to share research data
        hint: Your general willingness to share datasets
        type: select_one
        options:
          - Very willing
          - Somewhat willing
          - Neutral
          - Somewhat unwilling
          - Not willing
        required: true
      - id: 8
        name: perceived_barriers
        label: Barriers to data sharing
        hint: Select all that apply
        type: select_multiple
        options:
          - Privacy concerns
          - Lack of credit or citation
          - Technical barriers
          - Legal or ethical restrictions
          - Time and effort required
          - Other
        required: false
      - id: 9
        name: preferred_sharing_platforms
        label: Preferred data sharing platforms
        hint: Choose platforms you would consider using
        type: select_multiple
        options:
          - Institutional repository
          - Disciplinary repository
          - General data archive
          - Personal or lab website
          - Publisher supplementary materials
        required: false
      - id: 10
        name: data_types_shared
        label: Types of data you would share
        hint: Select all applicable
        type: select_multiple
        options:
          - Raw data
          - Processed data
          - Code and scripts
          - Protocols and methods
          - Metadata only
        required: false
      - id: 11
        name: incentives_for_sharing
        label: Incentives that would increase sharing
        hint: Select up to three
        type: select_multiple
        options:
          - Formal recognition or citation
          - Funding agency requirement
          - Institutional mandate
          - Publisher policy
          - Technical support
        required: false
      - id: 12
        name: additional_comments
        label: Additional comments or suggestions
        hint: Any other thoughts on data sharing practices
        type: text
        options: []
        required: false
