inputSchema:
  type: object
  properties:
    title: Coaching Session Client Feedback Survey
    pages:
      - id: 1
        name: client_name
        label: Client Name
        hint: Your full name optional
        type: text
        options: []
        required: false
      - id: 2
        name: email
        label: Email Address
        hint: Contact email
        type: email
        options: []
        required: false
      - id: 3
        name: coach_name
        label: Coach Name
        hint: Name of your coach
        type: text
        options: []
        required: true
      - id: 4
        name: session_date
        label: Session Date
        hint: Date of the session
        type: date
        options: []
        required: true
      - id: 5
        name: session_number
        label: Session Number
        hint: Which session was this
        type: select_one
        options:
          - Session 1
          - Session 2
          - Session 3
          - Session 4
          - Session 5
          - Session 6 or More
        required: false
      - id: 6
        name: overall_satisfaction
        label: Overall Session Satisfaction
        hint: Rate your satisfaction
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 7
        name: session_helpfulness
        label: How Helpful Was This Session
        hint: Rate the value
        type: select_one
        options:
          - Extremely Helpful
          - Very Helpful
          - Somewhat Helpful
          - Not Very Helpful
          - Not Helpful
        required: true
      - id: 8
        name: coach_listening
        label: Coach Listening Skills
        hint: How well did coach listen
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: coach_understanding
        label: Coach Understanding of Your Issues
        hint: How well did coach understand
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: coach_questions
        label: Quality of Coach Questions
        hint: How effective were the questions
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 11
        name: coach_feedback
        label: Quality of Coach Feedback
        hint: How useful was the feedback
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
