inputSchema:
  type: object
  properties:
    title: image_annotation_survey
    pages:
    - id: 1
      name: upload_image
      label: Upload Image
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: annotation_details
      label: Annotation Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - I agree to the terms and conditions
      - I do not agree to the terms and conditions
      required: false
    - id: 4
      name: upload_url
      label: Upload URL
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: annotation_type
      label: Annotation Type
      hint: null
      type: select_one
      options:
      - Classification
      - Identification
      - Object Detection
      - Segmentation
      required: true
    - id: 6
      name: upload_url_label
      label: Label
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: annotation_status
      label: Annotation Status
      hint: null
      type: select_one
      options:
      - Not Started
      - In Progress
      - Completed
      required: true
