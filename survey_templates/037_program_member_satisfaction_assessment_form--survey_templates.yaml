inputSchema:
  type: object
  properties:
    title: Program Member Satisfaction Assessment Form
    pages:
    - id: 1
      name: program_member_satisfaction
      label: Program Member Satisfaction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: recommendation
      label: How likely are you to recommend our program to a friend?
      hint: null
      type: select_multiple
      options:
      - Very Likely
      - Somewhat Likely
      - Not Likely
      - Not At All Likely
      required: false
    - id: 3
      name: overall_satisfaction
      label: How satisfied are you with the program overall?
