inputSchema:
  type: object
  properties:
    title: Foot Patch Effectiveness Survey
    pages:
    - id: 1
      name: usage_results
      label: What kind of usage results have you experienced?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - None
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: false
    - id: 3
      name: side_effects
      label: What kind of side effects have you experienced?
      hint: null
      type: select_multiple
      options:
      - Skin irritation
      - Redness
      - Burning
      - Itching
      - Numbness
      - None
      required: false
    - id: 4
      name: duration_use
      label: How long have you used the patches?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: frequency_use
      label: How often do you use the patches?
      hint: null
      type: select_multiple
      options:
      - Daily
      - 3-4 times a week
      - 1-2 times a week
      - Rarely
      required: false
    - id: 6
      name: usage_time
      label: How long have you used the patches?
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: results_improvement
      label: How have the results improved?
      hint: null
      type: select_multiple
      options:
      - Greatly
      - Moderately
      - A little
      - None
      required: false
    - id: 8
      name: would_recommend
      label: Would you recommend this product to others?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: comments
