inputSchema:
  type: object
  properties:
    title: Smart Sensor Data Sharing Consent Form
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: data_collection
      label: Data Collection
      hint: null
      type: select_multiple
      options:
      - Sensors installed at home
      - Sensors installed at work
      - Sensors installed in public areas
      - Sensors installed in vehicles
      - Other (please specify)
      required: true
    - id: 3
      name: data_sharing
      label: Data Sharing
      hint: null
      type: select_multiple
      options:
      - With other departments within our organization
      - With external partners
      - With external vendors
      - With government agencies
      - Other (please specify)
      required: true
    - id: 4
      name: sharing_reason
      label: Sharing Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: data_usage
      label: Data Usage
      hint: null
      type: select_one
      options:
      - For research purposes
      - For business development purposes
      - For marketing purposes
      - For other (please specify)
      required: true
    - id: 6
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: sensor_model
      label: Sensor Model
      hint: null
      type: select_one
      options:
      - Model 1
      - Model 2
      - Other (please specify)
      required: true
    - id: 8
      name: user_data
      label: User Data
      hint: null
      type: select_one
      options:
      - Personal data
      - Non-personal data
      required: true
    - id: 9
      name: sharing_method
      label: Sharing Method
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone call
      - SMS
      - Physical document
      - Other (please specify)
      required: true
