inputSchema:
  type: object
  properties:
    title: Streaming Strategy Assessment
    pages:
    - id: 1
      name: creator_info
      label: Creator Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: streaming_goals
      label: What are your streaming goals?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: frequency_of_streaming
      label: Frequency of Streaming
      hint: How often do you stream?
      type: select_one
      options:
      - Streaming 1-2 times a week
      - Streaming 3-4 times a week
      - Streaming 5 or more times a week
      required: false
    - id: 4
      name: streaming_time
      label: Time of Streaming
      hint: What time of day do you typically stream?
      type: time
      options: []
      required: false
    - id: 5
      name: challenges_faced
      label: Challenges Faced
      hint: What challenges do you face while streaming?
      type: select_multiple
      options:
      - Difficulty finding an audience
      - Equipment failure
      - Lack of focus
      - Personal issues
      required: false
    - id: 6
      name: content_planning
      label: Content Planning
      hint: How do you plan your content?
      type: select_one
      options:
      - Scripted content
      - Improvisation
      - A mix of both
      required: false
    - id: 7
      name: performance_improvement
      label: Performance Improvement
      hint: What would help you improve your streaming performance?
      type: select_multiple
      options:
      - Better equipment
      - More practice
      - Coaching/feedback
      - Other (please specify)
      required: false
    - id: 8
      name: evaluation_criteria
      label: Evaluation Criteria
      hint: What criteria do you use to evaluate your performance?
      type: select_multiple
      options:
      - Engagement metrics
      - Viewer retention
      - Audience feedback
      - Other (please specify)
      required: false
    - id: 9
      name: streaming_habits
      label: Streaming Habits
      hint: How do your streaming habits influence your performance?
      type: select_multiple
      options:
      - Regular streaming
      - Consistency
      - Time of day
      - Other (please specify)
      required: false
