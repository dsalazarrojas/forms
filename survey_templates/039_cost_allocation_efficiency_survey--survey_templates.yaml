inputSchema:
  type: object
  properties:
    title: Cost Allocation Efficiency Survey
    pages:
    - id: 1
      name: cost_allocation_efficiency_survey
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: current_processes
      label: What are the current cost processes used in your department?
      hint: null
      type: select_multiple
      options:
      - process1
      - process2
      - process3
      required: false
    - id: 3
      name: challenges
      label: What are the main challenges faced in the current cost processes?
      hint: null
      type: select_multiple
      options:
      - challenge1
      - challenge2
      - challenge3
      required: false
    - id: 4
      name: cost_center
      label: Which cost center should be allocated the highest priority?
      hint: null
      type: select_one
      options:
      - cost center 1
      - cost center 2
      - cost center 3
      required: false
    - id: 5
      name: cost_allocation_process
      label: What is the current cost allocation process used in your department?
      hint: null
      type: select_multiple
      options:
      - process1
      - process2
      - process3
      required: false
    - id: 6
      name: cost_center_performance
      label: What is the current cost center performance?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Do you have any additional comments or suggestions for improving cost
        allocation efficiency?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: Do you have any notes on the cost allocation process?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: transparency
      label: How transparent is the current cost allocation process?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
