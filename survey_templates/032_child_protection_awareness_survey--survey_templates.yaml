inputSchema:
  type: object
  properties:
    title: Child Protection Awareness Survey
    pages:
    - id: 1
      name: section_awareness_assessment
      label: -- Awareness Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: aware_of_signs
      label: Are you aware of the signs of child abuse?
      hint: Physical, emotional, or neglect signs
      type: select_one
      options:
      - Yes - Fully Aware
      - No - Not Aware
      - Unsure - Need Information
      required: true
    - id: 3
      name: know_reporting_contact
      label: Do you know who to contact if you suspect abuse?
      hint: Internal or external reporting lines
      type: select_one
      options:
      - Yes - I know the procedure
      - No - I am unsure
      required: true
    - id: 4
      name: section_training_education
      label: -- Training and Education --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: received_training
      label: Have you received child protection training?
      hint: Official sessions or workshops
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: last_training_date
      label: How recently was your last training?
      hint: Choose most accurate bracket
      type: select_one
      options:
      - Within the last 1 year
      - 1 to 3 years ago
      - Over 3 years ago
      - Never had training
      required: true
    - id: 7
      name: section_policies
      label: -- Institutional Policies --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: policies_visible
      label: Are child protection policies clearly visible?
      hint: At your place of work or organization
      type: select_one
      options:
      - Yes - Clearly Posted
      - No - Hard to Find
      - Not Applicable
      required: true
    - id: 9
      name: reporting_confidence
      label: Do you feel confident in the reporting procedure?
      hint: Level of comfort with the process
      type: select_one
      options:
      - Strongly Agree
      - Agree
      - Neutral
      - Disagree
      required: true
    - id: 10
      name: section_resource_needs
      label: -- Resource Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: additional_resources
      label: What additional resources would help improve awareness?
      hint: Ideas for better education
      type: text
      options: []
      required: false
    - id: 12
      name: preferred_formats
      label: Preferred learning formats
      hint: Select all that apply
      type: select_multiple
      options:
      - Online Training Modules
      - In-person Workshops
      - Print Handouts and Guides
      - Educational Videos
      required: false
    - id: 13
      name: final_comments
      label: Final comments or suggestions
      hint: Anything else you want to share
      type: text
      options: []
      required: false
    - id: 14
      name: survey_date
      label: Date of Survey
      hint: Today date
      type: date
      options: []
      required: true
