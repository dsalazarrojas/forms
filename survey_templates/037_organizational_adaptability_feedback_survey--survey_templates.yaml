inputSchema:
  type: object
  properties:
    title: Organizational Adaptability Feedback Survey
    pages:
    - id: 1
      name: adaptability_question_1
      label: How likely are you to adapt to change?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: adaptability_question_2
      label: How confident are you in your ability to adapt to change?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: open_mindedness_question
      label: How open-minded are you to new ideas?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: risk_taking_question
      label: How willing are you to take calculated risks?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: feedback_question_1
      label: How often do you seek feedback from others?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: communication_question
      label: What is your preferred way of communication (email, phone, or in-person)?
      hint: null
      type: select_one
      options:
      - email
      - phone
      - in-person
      required: true
    - id: 7
      name: ambiguity_question
      label: How comfortable are you with ambiguity and uncertainty?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: challenge_status_quo_question
      label: How willing are you to challenge the status quo?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: innovation_question
      label: How often do you try new things?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: tech_adaptability_question
      label: How likely are you to adapt to new technologies?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: feedback_question_1_2
      label: How often do you receive feedback from others?
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: feedback_rater_question
      label: How do you rate your ability to learn from feedback?
      hint: null
      type: number
      options: []
      required: true
