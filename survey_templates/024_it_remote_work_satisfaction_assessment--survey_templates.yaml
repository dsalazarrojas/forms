inputSchema:
  type: object
  properties:
    title: IT Remote Work Satisfaction Assessment
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: it_remote_work_arrangement
      label: Do you have a remote IT work arrangement?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Don't know
      required: true
    - id: 3
      name: it_remote_work_frequency
      label: How often do you do remote IT work?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Biweekly
      - Monthly
      - Rarely
      - Never
      required: true
    - id: 4
      name: work_from_home
      label: What kind of work environment do you work from?
      hint: null
      type: select_multiple
      options:
      - Home
      - Office
      - Coffee shop/Cafe
      - Public park or outdoor
      - Other
      required: true
    - id: 5
      name: productivity
      label: How would you rate your productivity while working remotely?
      hint: On a scale of 1-5
      type: number
      options: []
      required: true
    - id: 6
      name: collaboration
      label: How would you rate the level of collaboration with your team?
      hint: On a scale of 1-5
      type: number
      options: []
      required: true
    - id: 7
      name: communication
      label: How would you rate the level of communication with your team and team
        members?
      hint: On a scale of 1-5
      type: number
      options: []
      required: true
    - id: 8
      name: work_life_balance
      label: Do you feel you have a good work-life balance while working remotely?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Don't know
      required: true
    - id: 9
      name: challenges
      label: What challenges have you faced while working remotely?
      hint: List specific challenges
      type: text
      options: []
      required: true
    - id: 10
      name: improvements
      label: Are there any improvements you would like to see for the remote work
        arrangement?
      hint: List specific improvements
      type: text
      options: []
      required: true
    - id: 11
      name: support_needs
      label: What support do you need while working remotely?
      hint: List specific needs
      type: text
      options: []
      required: true
    - id: 12
      name: it_support
      label: How important is IT support to you while working remotely?
      hint: On a scale of 1-5
      type: number
      options: []
      required: true
    - id: 13
      name: feedback
      label: How important is your feedback to the remote work arrangement?
      hint: On a scale of 1-5
      type: number
      options: []
      required: true
    - id: 14
      name: technical_issues
      label: Have you experienced technical issues while working remotely?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Don't know
      required: true
    - id: 15
      name: data_security
      label: Do you feel secure while working remotely?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Don't know
      required: true
    - id: 16
      name: communication_channels
      label: What communication channels do you use while working remotely?
      hint: List specific channels
      type: text
      options: []
      required: true
    - id: 17
      name: team_collaboration_tools
      label: What tools do you use for team collaboration while working remotely?
      hint: List specific tools
      type: text
      options: []
      required: true
    - id: 18
      name: remote_work_policies
      label: Are there clear remote work policies in place?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Don't know
      required: true
    - id: 19
      name: manager_support
      label: Does your manager support your remote work arrangement?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Don't know
      required: true
    - id: 20
      name: feedback_mechanisms
      label: Is there a feedback mechanism for remote workers?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Don't know
      required: true
