      label: Professional Demeanor and Conduct
      hint: Overall professionalism
      type: select_one
      options:
        - Excellent
        - Very good
        - Good
        - Fair
        - Poor
      required: true
    - id: 13
      name: feedback_communication_skills
      Label: Communication Skills
      hint: Clarity and effectiveness of communication
      type: select_one
      options:
