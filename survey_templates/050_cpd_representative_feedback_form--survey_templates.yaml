      name: feedback_respondent_header
      label: -- Respondent Information --
      hint: Please provide your details
      type: note
      options: []
      required: false
    - id: 2
      name: feedback_respondent_name
      label: Your Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: feedback_email
      Label: Email Address
      hint: Your email address
      type: email
      options: []
      required: false
    - id: 4
      name: feedback_department
      label: Department or Division
      hint: Your department
      type: text
      options: []
      required: false
    - id: 5
      name: feedback_date
      Label: Date of Feedback
      hint: Date of this survey
      type: date
      options: []
      required: true
    - id: 6
      name: feedback_interaction_header
      label: -- CPD Representative Interaction --
      hint: Information about the representative
      type: note
      options: []
      required: false
    - id: 7
      name: feedback_rep_name
      Label: CPD Representative Name
      hint: Name of the representative
      type: text
      options: []
      required: true
    - id: 8
      name: feedback_interaction_type
      label: Type of Interaction
      hint: What was the purpose of interaction
      type: select_one
