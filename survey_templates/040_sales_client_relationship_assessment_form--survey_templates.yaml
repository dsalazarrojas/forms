inputSchema:
  type: object
  properties:
    title: Sales Client Relationship Assessment Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_assessment_1
      label: What kind of relationship do you have with this client?
      hint: null
      type: select_multiple
      options:
      - Very Strong
      - Strong
      - Fair
      - Weak
      required: false
    - id: 3
      name: client_assessment_2
      label: How would you rate the quality of the communication with this client?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: client_assessment_3
      label: How would you rate the speed of issue resolution with this client?
      hint: null
      type: select_multiple
      options:
      - Less than 1 day
      - 1-3 days
      - 4-7 days
      - 1-2 weeks
      - More than 2 weeks
      required: false
    - id: 5
      name: client_assessment_4
      label: How would you rate the level of effort required to resolve issues with
        this client?
      hint: null
      type: select_multiple
      options:
      - Low
      - Moderate
      - High
      required: false
    - id: 6
      name: client_assessment_5
      label: How would you rate the level of trust you have with this client?
      hint: null
      type: select_multiple
      options:
      - High
      - Moderate
      - Low
      required: false
    - id: 7
      name: client_feedback
      label: Client Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: client_satisfaction
      label: Client Satisfaction
      hint: Please rate your overall satisfaction with the client
      type: number
      options: []
      required: false
    - id: 9
      name: relationship_notes
      label: Relationship Notes
      hint: null
      type: note
      options: []
      required: false
