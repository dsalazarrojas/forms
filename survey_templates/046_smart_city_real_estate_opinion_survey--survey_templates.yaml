inputSchema:
  type: object
  properties:
    title: Smart City Real Estate Opinion Survey
    pages:
    - id: 1
      name: smart_city_features_1
      label: What are the top 3 smart city features you think are most important for
        a city's success?
      hint: null
      type: select_multiple
      options:
      - Public Transportation
      - Green Spaces
      - Community Engagement
      required: true
    - id: 2
      name: satisfaction_levels_1
      label: On a scale of 1-5, how satisfied are you with the current state of smart
        city features in our city?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: desired_improvements_1
      label: What improvements would you like to see in our smart city?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: smart_city_features_2
      label: How do you think smart city features have improved your daily life?
      hint: null
      type: select_one
      options:
      - Significantly
      - Somewhat
      - Not at all
      required: true
    - id: 5
      name: smart_city_features_3
      label: How likely are you to recommend smart city features to others?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Not Likely
      required: true
    - id: 6
      name: smart_city_features_4
      label: How important is smart city features to you?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: smart_city_features_5
      label: How often do you use smart city features?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 8
      name: smart_city_features_6
      label: What do you think is the biggest challenge facing our city's smart city
        development?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: smart_city_features_7
      label: How do you rate the overall quality of smart city features in our city?
      hint: null
      type: number
      options: []
      required: true
