inputSchema:
  type: object
  properties:
    title: Networking Event Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: event_attended
      label: Event attended
      hint: null
      type: select_one
      options:
      - Event 1
      - Event 2
      - Event 3
      required: false
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: rating
      label: Rating
      hint: On a scale of 1-5
      type: number
      options: []
      required: false
    - id: 7
      name: rating_comment
      label: Rating comment
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: suggestions
      label: Suggestions for improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_info
      label: Contact information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: follow_up
      label: Would you like to be contacted for follow up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
