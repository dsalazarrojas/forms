inputSchema:
  type: object
  properties:
    title: Chips Survey
    pages:
    - id: 1
      name: header_customer_info
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: order_number
      label: Order Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: header_product_feedback
      label: -- Chips Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: freshness
      label: How fresh were the chips?
      hint: null
      type: select_one
      options:
      - Very Fresh
      - Fresh
      - Stale
      required: true
    - id: 7
      name: crispiness
      label: Rate the crispiness level
      hint: null
      type: select_one
      options:
      - Perfectly Crunchy
      - Good
      - Soggy
      required: true
    - id: 8
      name: salt_level
      label: How was the saltiness?
      hint: null
      type: select_one
      options:
      - Too Salty
      - Just Right
      - Not Salty Enough
      required: true
    - id: 9
      name: flavor_rating
      label: Rate the flavor profile
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: portion_size
      label: Was the portion size adequate?
      hint: null
      type: select_one
      options:
      - Too Small
      - Just Right
      - Very Generous
      required: true
    - id: 11
      name: header_service_feedback
      label: -- Service and Delivery --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: delivery_speed
      label: Rate the speed of delivery
      hint: null
      type: select_one
      options:
      - Faster than expected
      - On time
      - Delayed
      required: true
    - id: 13
      name: packaging_condition
      label: Was the packaging intact upon arrival?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: recommend_friends
      label: Would you recommend our chips to others?
      hint: null
      type: select_one
      options:
      - Definitely
      - Probably
      - Not sure
      - 'False'
      required: true
    - id: 15
      name: improvement_suggestions
      label: Any suggestions for improvement?
      hint: null
      type: text
      options: []
      required: false
