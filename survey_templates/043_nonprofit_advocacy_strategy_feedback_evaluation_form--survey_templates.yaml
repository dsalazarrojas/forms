inputSchema:
  type: object
  properties:
    title: Nonprofit Advocacy Strategy Feedback Evaluation Form
    pages:
    - id: 1
      name: nonprofit_advocacy_strategy_feedback_evaluation_form
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: nonprofit_advocacy_strategy
      label: What is your role in the organization?
      hint: null
      type: select_one
      options:
      - Executive Director
      - Program Director
      - Community Coordinator
      required: false
    - id: 3
      name: nonprofit_advocacy_strategy_program
      label: What program does your organization focus on?
      hint: null
      type: select_one
      options:
      - Community Development
      - Advocacy
      - Education
      required: false
    - id: 4
      name: nonprofit_advocacy_strategy_objectives
      label: What are the main objectives of your organization's advocacy strategy?
      hint: 'null'
      type: text
      options: []
      required: false
    - id: 5
      name: nonprofit_advocacy_strategy_implementation
      label: How does your organization implement its advocacy strategy?
      hint: null
      type: select_multiple
      options:
      - In-person meetings
      - Email campaigns
      - Social media
      required: false
    - id: 6
      name: nonprofit_advocacy_strategy_outcomes
      label: What are the expected outcomes of your organization's advocacy strategy?
      hint: null
      type: select_multiple
      options:
      - Increased public awareness
      - Policy changes
      - Community engagement
      required: false
    - id: 7
      name: nonprofit_advocacy_strategy_evaluation
      label: Evaluation of the advocacy strategy
      hint: null
      type: select_one
      options:
      - Effective
      - Ineffective
      - Not sure
      required: false
    - id: 8
      name: nonprofit_advocacy_strategy_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
