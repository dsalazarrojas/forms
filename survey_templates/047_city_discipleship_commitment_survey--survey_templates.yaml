      name: prayer_frequency
      label: Daily Prayer Practice
      hint: null
      type: select_one
      options:
      - Daily
      - Several times per week
      - Weekly
      - Monthly
      - Occasionally
      - Never
      required: true
    - id: 16
      name: scripture_study
      label: Scripture Study or Bible Reading
      hint: null
      type: select_one
      options:
      - Daily
      - Several times per week
      - Weekly
      - Monthly
      - Occasionally
      - Never
      required: true
    - id: 17
      name: spiritual_disciplines
      label: Spiritual Disciplines Practiced (Select all that apply)
      hint: null
      type: select_multiple
      options:
      - Bible study
      - Prayer
      - Fasting
      - Worship
      - Journaling
      - Meditation
      - Confession
      - Service
      required: false
    - id: 18
      name: section_header_growth
      label: -- Spiritual Growth --
      hint: null
      type: note
      options: []
      required: false
