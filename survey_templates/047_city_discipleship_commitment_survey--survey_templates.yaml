inputSchema:
  type: object
  properties:
    title: City Discipleship Commitment Survey
    pages:
    - id: 1
      name: section_header_personal
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - 18-25
      - 26-35
      - 36-45
      - 46-55
      - 56-65
      - 65+
      required: false
    - id: 6
      name: section_header_faith_journey
      label: -- Faith Journey --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: faith_background
      label: Your Faith Background
      hint: null
      type: select_one
      options:
      - Lifelong Christian
      - Recent conversion
      - Returning to faith
      - Exploring faith
      - Uncertain
      required: true
    - id: 8
      name: years_faith_commitment
      label: Years of Faith Commitment
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: discipleship_experience
      label: Discipleship Experience Level
      hint: null
      type: select_one
      options:
      - New to discipleship
      - Some experience
      - Growing in discipleship
      - Experienced disciple
      - Disciple-maker
      required: true
    - id: 10
      name: section_header_engagement
      label: -- Current Engagement --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: church_attendance
      label: Church Attendance Frequency
      hint: null
      type: select_one
      options:
      - Every week
      - 2-3 times per month
      - Monthly
      - A few times per year
      - Rarely
      - Never
      required: true
    - id: 12
      name: group_participation
      label: Bible Study or Small Group Participation
      hint: null
      type: select_one
      options:
      - Regularly attend
      - Attend sometimes
      - Have attended
      - Never attended
      - Would be interested
      required: true
    - id: 13
      name: ministry_involvement
      label: Ministry or Service Involvement
      hint: null
      type: select_one
      options:
      - Active volunteer
      - Regular volunteer
      - Occasional volunteer
      - Not currently involved
      - Interested in getting involved
      required: true
