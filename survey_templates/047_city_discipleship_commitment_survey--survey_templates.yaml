      name: spiritual_growth_assessment
      label: Assessment of Your Spiritual Growth
      hint: null
      type: select_one
      options:
      - Growing significantly
      - Growing steadily
      - Growing slowly
      - Stagnant
      - Declining
      required: true
    - id: 20
      name: growth_areas
      label: Areas of Spiritual Growth (Select all that apply)
      hint: null
      type: select_multiple
      options:
      - Faith and trust
      - Love and compassion
      - Holiness and righteousness
      - Knowledge of Scripture
      - Prayer life
      - Witnessing and evangelism
      - Service and justice
      - Community and relationships
      required: false
    - id: 21
      name: growth_challenges
      label: Challenges to Spiritual Growth
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: section_header_commitment
      label: -- Discipleship Commitment --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: commitment_level
      label: Level of Commitment to Discipleship
      hint: null
      type: select_one
      options:
      - Fully committed
      - Mostly committed
      - Somewhat committed
      - Minimally committed
      - Not committed
      required: true
    - id: 24
      name: commitment_obstacles
      label: Obstacles to Deeper Commitment
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: section_header_mentoring
      label: -- Mentoring and Support --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: spiritual_mentor
      label: Have a Spiritual Mentor or Discipler
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Would like one
      required: true
    - id: 27
      name: mentoring_interest
      label: Interest in Being a Disciple-Maker
      hint: null
      type: select_one
      options:
      - Very interested
      - Interested
      - Maybe
      - Not interested
      required: false
    - id: 28
      name: section_header_goals
      label: -- Discipleship Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: spiritual_goals
      label: Spiritual Goals for Next Year
      hint: null
      type: text
      options: []
      required: false
