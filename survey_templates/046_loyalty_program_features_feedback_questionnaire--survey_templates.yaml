inputSchema:
  type: object
  properties:
    title: Loyalty Program Features Feedback Questionnaire
    pages:
    - id: 1
      name: intro_page
      label: Intro Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: program_features
      label: loyalty_program_features
      hint: null
      type: select_multiple
      options:
      - Loyalty Program A
      - Loyalty Program B
      - Loyalty Program C
      required: false
    - id: 3
      name: customer_satisfaction
      label: customer_satisfaction
      hint: Please rate your satisfaction with our loyalty program
      type: number
      options: []
      required: false
    - id: 4
      name: improvement_suggestions
      label: improvement_suggestions
      hint: What do you think could be improved?
      type: text
      options: []
      required: false
    - id: 5
      name: overall_satisfaction
      label: overall_satisfaction
      hint: On a scale from 1-10, how satisfied are you with our loyalty program?
      type: number
      options: []
      required: false
    - id: 6
      name: communication
      label: communication
      hint: How would you rate our communication regarding the loyalty program
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 7
      name: program_enrollment
      label: program_enrollment
      hint: How easy was it for you to enroll in our loyalty program?
      type: number
      options: []
      required: false
    - id: 8
      name: reward_claims
      label: reward_claims
      hint: How easy was it for you to claim rewards from our loyalty program?
      type: number
      options: []
      required: false
    - id: 9
      name: reward_delivery
      label: reward_delivery
      hint: How satisfied are you with the delivery of rewards from our loyalty program?
      type: number
      options: []
      required: false
    - id: 10
      name: program_participation
      label: program_participation
      hint: How likely are you to continue participating in our loyalty program?
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Neutral
      - Somewhat Unlikely
      - Very Unlikely
      required: false
    - id: 11
      name: feedback
      label: feedback
      hint: Do you have any feedback about our loyalty program?
      type: text
      options: []
      required: false
    - id: 12
      name: contact_details
      label: contact_details
      hint: null
      type: email
      options: []
      required: false
