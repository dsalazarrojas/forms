inputSchema:
  type: object
  properties:
    title: Laptop Research Survey Template
    pages:
    - id: 1
      name: intro
      label: Laptop Research Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: laptop_usage
      label: What is your laptop usage?
      hint: null
      type: select_one
      options:
      - Laptop for work
      - Laptop for personal use
      - Both
      required: true
    - id: 3
      name: laptop_type
      label: What type of laptop do you currently use?
      hint: null
      type: select_multiple
      options:
      - Mac
      - PC
      - Linux
      - Other
      required: false
    - id: 4
      name: laptop_brand
      label: Laptop brand
      hint: null
      type: select_multiple
      options:
      - Apple
      - Dell
      - HP
      - Lenovo
      - Other
      required: false
    - id: 5
      name: laptop_model
      label: Laptop model
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: laptop_purchase_year
      label: Year laptop was purchased
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: laptop_use_frequency
      label: How often do you use your laptop?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
