      options:
      - 128 GB
      - 256 GB
      - 512 GB
      - 1 TB
      - 2 TB
      - More than 2 TB
      required: false
    - id: 11
      name: laptop_connectivity
      label: Laptop connectivity options
      hint: null
      type: select_multiple
      options:
      - Wi-Fi
      - Ethernet
      - Both
      - None
      required: false
    - id: 12
      name: laptop_operating_system
      label: Laptop operating system
      hint: null
