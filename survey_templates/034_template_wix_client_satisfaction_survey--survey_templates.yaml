inputSchema:
  type: object
  properties:
    title: Template Wix Client Satisfaction Survey
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
