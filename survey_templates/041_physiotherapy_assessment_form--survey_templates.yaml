inputSchema:
  type: object
  properties:
    title: Physiotherapy Assessment Form
    pages:
    - id: 1
      name: patient_information
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 4
      name: service_quality
      label: Service Quality
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: communication
      label: Communication
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: physical_therapist
      label: Physical Therapist
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: follow_up_care
      label: Follow-up Care
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
