inputSchema:
  type: object
  properties:
    title: Hotel Concierge Feedback Form
    pages:
    - id: 1
      name: form_input_1
      label: What did you like most about your stay
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_input_2
      label: How would you rate your overall experience
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: form_input_3
      label: How would you rate the concierge team
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: form_input_4
      label: What suggestions do you have for us
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_input_5
      label: What time were you checked out of the hotel
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: form_input_6
      label: How likely are you to recommend this hotel
      hint: null
      type: select_one
      options:
      - Extremely Likely
      - Somewhat Likely
      - Not Likely
      - Very Unlikely
      required: true
    - id: 7
      name: form_input_7
      label: What type of room did you stay in
      hint: null
      type: select_one
      options:
      - Single
      - Double
      - Suite
      - Other
      required: false
    - id: 8
      name: form_input_8
      label: How would you rate the hotel location
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: form_input_9
      label: Did you have any issues with your room
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
