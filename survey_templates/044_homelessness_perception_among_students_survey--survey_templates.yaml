inputSchema:
  type: object
  properties:
    title: Homelessness Perception Among Students Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: how_much_do_you_know_about_homelessness
      label: How much do you know about homelessness?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: what_does_homelessness_mean_to_you
      label: What does homelessness mean to you?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: what_could_be_done_to_help_people_who_are_homeless
      label: What could be done to help people who are homeless?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: how_much_do_you_know_about_services_and_resources
      label: How much do you know about services and resources for people who are
        homeless?
      hint: null
      type: select_multiple
      options:
      - Homeless Shelter
      - Food bank
      - Health clinic
      - Job center
      - Mental health service
      required: true
    - id: 6
      name: how_much_time_have_you_spent_learning_about_homelessness
      label: How much time have you spent learning about homelessness?
      hint: null
      type: select_one
      options:
      - Less than 1 hour
      - 1-5 hours
      - 5-10 hours
      - 10-20 hours
      - More than 20 hours
      required: false
    - id: 7
      name: demographics
      label: Demographics
      hint: null
      type: select_multiple
      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65+
      - Male
      - Female
      - Nonbinary
      - White
      - Black
      - Asian
      - Hispanic
      - Other
      required: false
    - id: 8
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
