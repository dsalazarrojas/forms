inputSchema:
  type: object
  properties:
    title: corporate_internal_communication_effectiveness_survey
    pages:
    - id: 1
      name: introduction
      label: Corporate Internal Communication Effectiveness Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: supervisor_communication_frequency
      label: How often do you receive information from your direct supervisor?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: critical_issues_informed
      label: How often do you feel informed about critical issues?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: non_critical_issues_informed
      label: How often do you feel informed about non-critical issues?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: preferred_communication_method
      label: What method of communication do you prefer?
      hint: null
      type: select_one
      options:
      - Email
      - Phone Call
      - In-person Meeting
      - Other
      required: false
    - id: 6
      name: satisfaction_with_communication_methods
      label: How would you rate your overall satisfaction with current communication
        methods?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: liked_communication_methods
      label: What do you like about current communication methods?
      hint: null
      type: select_multiple
      options:
      - Fast
      - Clear
      - Frequent
      - Helpful
      - Other
      required: false
    - id: 8
      name: disliked_communication_methods
      label: What do you dislike about current communication methods?
      hint: null
      type: select_multiple
      options:
      - Slow
      - Unclear
      - Infrequent
      - Not Helpful
      - Not Clear
      - Other
      required: false
    - id: 9
      name: critical_issues_communication_method
      label: What method of communication do you prefer for receiving information
        about critical issues?
      hint: null
      type: select_one
      options:
      - Email
      - Phone Call
      - In-person Meeting
      - Other
      required: false
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned tool
      hint: null
      type: text
      options: []
      required: false
