inputSchema:
  type: object
  properties:
    title: Immunoglobulin A Nephropathy Survey
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: symptoms_1
      label: Have you experienced symptoms such as fatigue or weakness?
      hint: null
      type: select_multiple
      options:
      - Always
      - Frequently
      - Rarely
      - Never
      required: false
    - id: 3
      name: symptoms_2
      label: Have you experienced any other symptoms?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: quality_of_life_1
      label: How has your quality of life been affected by your condition?
      hint: null
      type: select_one
      options:
      - Not at all
      - A little
      - Moderately
      - Severely
      required: false
    - id: 5
      name: quality_of_life_2
      label: How long have you been experiencing symptoms?
      hint: null
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 4-6 months
      - More than 6 months
      required: false
    - id: 6
      name: support_needs
      label: What support needs do you have?
      hint: null
      type: select_multiple
      options:
      - Medical care
      - Emotional support
      - Other
      required: false
    - id: 7
      name: medical_care_1
      label: Do you currently receive any medical care?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: medical_care_2
      label: Where do you currently receive medical care?
      hint: null
      type: select_multiple
      options:
      - Clinic
      - Specialist
      - Hospital
      required: false
    - id: 9
      name: support_needs_1
      label: What kind of support do you currently receive?
      hint: null
      type: select_multiple
      options:
      - Family
      - Friend
      - Other
      required: false
    - id: 10
      name: support_needs_2
      label: How often do you feel supported?
      hint: null
      type: select_one
      options:
      - Frequently
      - Rarely
      - Never
      required: false
    - id: 11
      name: medical_care_3
      label: Do you feel you are receiving adequate care?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: medical_care_4
      label: Why do you feel you are receiving inadequate care?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: general_info_2
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
