inputSchema:
  type: object
  properties:
    title: Voice Agent Evaluation Survey
    pages:
    - id: 1
      name: first_call_experience
      label: First Call Experience
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: communication_style
      label: Communication Style
      hint: null
      type: select_one
      options:
      - Agent is very friendly and approachable
      - Agent is very friendly and approachable but sometimes seems distant
      - Agent is somewhat friendly and approachable
      - Agent is not friendly and not approachable
      required: true
    - id: 3
      name: problem_resolution
      label: Problem Resolution
      hint: null
      type: select_multiple
      options:
      - Very Effective
      - Somewhat Effective
      - Not Very Effective
      required: true
    - id: 4
      name: tone
      label: Tone
      hint: null
      type: select_one
