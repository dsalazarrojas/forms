inputSchema:
  type: object
  properties:
    title: Body Scrub Product Experience Survey
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: respondent_email
      label: Email Address
      hint: Optional
      type: email
      options: []
      required: false
    - id: 3
      name: purchase_date
      label: Date of Product Purchase
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: product_name
      label: Product Name
      hint: Which body scrub did you purchase
      type: text
      options: []
      required: true
    - id: 5
      name: product_scent
      label: Product Scent
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: purchase_location
      label: Where Did You Purchase This
      hint: null
      type: select_one
      options:
      - Online Store
      - Physical Retail Store
      - Beauty Supply Store
      - Pharmacy
      - Department Store
      - Direct from Brand
      - Other
      required: true
    - id: 7
      name: price_paid
      label: Price Paid
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: first_time_product
      label: Is this your first time using this product
      hint: null
      type: select_one
      options:
      - Yes - First Time
      - No - Repeat Purchase
      - No - First Time This Brand
      required: true
    - id: 9
      name: skin_type
      label: Your Skin Type
      hint: null
      type: select_one
      options:
      - Dry
      - Oily
      - Combination
      - Sensitive
      - Normal
      required: true
    - id: 10
      name: packaging_quality
      label: Packaging Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: product_appearance
      label: Product Appearance and Texture
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: fragrance_rating
      label: Fragrance Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - No Strong Scent
      required: true
    - id: 13
      name: exfoliation_effectiveness
      label: Exfoliation Effectiveness
      hint: How well did it remove dead skin
      type: select_one
      options:
      - Excellent - Very Effective
      - Good - Effective
      - Fair - Somewhat Effective
      - Poor - Not Effective
      required: true
    - id: 14
      name: gentleness_on_skin
      label: Gentleness on Skin
      hint: Was it too harsh or irritating
      type: select_one
      options:
      - Very Gentle
      - Gentle
      - Moderate
      - Harsh
      - Very Harsh
      required: true
    - id: 15
      name: moisturizing_quality
      label: Moisturizing Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - None
      required: true
    - id: 16
      name: skin_feeling_after
      label: How Your Skin Feels After Use
      hint: null
      type: select_one
      options:
      - Smooth and Soft
      - Clean and Refreshed
      - Moisturized
      - Dry
      - Tight
      - Irritated
      required: true
    - id: 17
      name: value_for_money
      label: Value for Money
      hint: Is the price reasonable for quality
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Overpriced
      required: true
    - id: 18
      name: frequency_of_use
      label: How Often Do You Use This Product
      hint: null
      type: select_one
      options:
      - Daily
      - 3-5 times per week
      - 1-2 times per week
      - Once a week
      - Less than once a week
      required: true
    - id: 19
      name: would_repurchase
      label: Would You Repurchase This Product
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 20
      name: recommendation_likelihood
      label: Would You Recommend to Others
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 21
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: What could be better
      type: text
      options: []
      required: false
    - id: 22
      name: positive_aspects
      label: What You Liked Most
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: negative_aspects
      label: What You Disliked
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
