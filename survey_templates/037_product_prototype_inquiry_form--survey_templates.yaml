inputSchema:
  type: object
  properties:
    title: product_prototype_inquiry_form
    pages:
    - id: 1
      name: company_details
      label: Company Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_description
      label: Product Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: feedback_on_usability
      label: Feedback on Usability
      hint: null
      type: select_one
      options:
      - Very good
      - Average
      - Poor
      required: false
    - id: 4
      name: feedback_on_usability_issues
      label: What usability issues did you encounter?
      hint: e.g. difficulty navigating the interface, unclear instructions
      type: select_multiple
      options:
      - Difficulty navigating the interface
      - Unclear instructions
      - Other (please specify)
      required: false
    - id: 5
      name: product_improvement_recommendations
      label: Product Improvement Recommendations
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - In-person
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
