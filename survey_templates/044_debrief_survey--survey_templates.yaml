inputSchema:
  type: object
  properties:
    title: debrief_survey
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: A brief welcome message to users.
      type: text
      options: []
      required: false
    - id: 2
      name: team_members
      label: Team members
      hint: List the team members who were present during the event.
      type: select_one
      options:
      - Team Lead
      - Event Coordinator
      - Project Manager
      - Team Member
      - Others
      required: false
    - id: 3
      name: feedback
      label: Feedback
      hint: Provide detailed feedback about the event or project.
      type: note
      options: []
      required: false
    - id: 4
      name: effectiveness_rating
      label: Overall Effectiveness Rating
      hint: null
      type: select_multiple
      options:
      - Highly effective
      - Somewhat effective
      - Not effective
      required: false
    - id: 5
      name: recommendations
      label: Recommendations
      hint: Suggest improvements for future events or projects.
      type: note
      options: []
      required: false
    - id: 6
      name: comments
      label: Additional Comments
      hint: Provide any additional comments or notes.
      type: note
      options: []
      required: false
    - id: 7
      name: form_version
      label: Form Version
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: created_by
      label: Created By
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: updated_by
      label: Updated By
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: updated_at
      label: Updated At
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: form_version_id
      label: Form Version ID
      hint: null
      type: number
      options: []
      required: false
