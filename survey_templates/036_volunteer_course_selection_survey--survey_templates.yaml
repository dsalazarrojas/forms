inputSchema:
  type: object
  properties:
    title: Volunteer Course Selection Survey
    pages:
    - id: 1
      name: course_preferences
      label: What are your preferred courses
      hint: null
      type: select_multiple
      options:
      - course1
      - course2
      - course3
      required: true
    - id: 2
      name: preferred_course_frequency
      label: How often would you like to take courses?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 3
      name: contact_info
      label: Contact info
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: training_location
      label: Where would you like to take the course?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: true
    - id: 5
      name: course_rating
      label: How would you rate the course?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      required: true
    - id: 6
      name: comments
      label: Do you have any other comments?
      hint: null
      type: note
      options: []
      required: false
