inputSchema:
  type: object
  properties:
    title: Community Recreation Participation Survey
    pages:
      - id: 1
        name: recreation_survey_intro_note
        label: -- Community Recreation Participation --
        hint: Help us improve your local parks and recreation services!
        type: note
        options: []
        required: false
      - id: 2
        name: neighborhood_residency_info
        label: Your Neighborhood or General Address
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: survey_voter_age_group
        label: Your Age Group
        hint: For demographic purposes.
        type: select_one
        options: [under 18, 18-24, 25-34, 35-44, 45-54, 55-64, 65+]
        required: true
      - id: 4
        name: activities_participation_selection
        label: What recreational activities have you participated in?
        hint: Select all that apply.
        type: select_multiple
        options: [Public Parks, Community Center Events, Local Sports Leagues, Public Pools, Hiking and Biking Trails, Fitness Classes]
        required: true
      - id: 5
        name: participation_frequency_rating
        label: Frequency of Participation
        hint: How often do you engage in these activities?
        type: select_one
        options: [Daily, Weekly, Monthly, Once a Year, Never]
        required: true
      - id: 6
        name: overall_satisfaction_rating
        label: Overall Satisfaction with Local Recreation Services
        hint: Scale of 1 to 5.
        type: select_one
        options: [5 - Extremely Satisfied, 4, 3, 2, 1 - Not Satisfied]
        required: true
      - id: 7
        name: participation_barriers_selection
        label: What are the main barriers to your participation?
        hint: Select all that apply.
        type: select_multiple
        options: [High Cost, Inconvenient Location, Poor Timing, Lack of Information, Transportation Issues, Accessibility Concerns, No Interest]
        required: true
      - id: 8
        name: barriers_other_specify
        label: If other barriers - please specify
        hint: null
        type: text
        options: []
        required: false
      - id: 9
        name: facility_maintenance_rating
        label: Rate the maintenance of our recreation facilities
        hint: null
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 10
        name: new_activities_suggestions
        label: What new activities or programs would you like to see?
        hint: null
        type: text
        options: []
        required: false
      - id: 11
        name: affordability_perception_check
        label: Do you feel our recreation programs are generally affordable?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 12
        name: information_source_preference
        label: How do you primarily find out about recreation programs?
        hint: null
        type: text
        options: []
        required: true
      - id: 13
        name: general_comments_feedback
        label: Additional comments or suggestions for the Parks and Rec team
        hint: null
        type: text
        options: []
        required: false
      - id: 14
        name: advisory_committee_interest
        label: Would you like to join a recreation advisory committee?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 15
        name: committee_contact_email
        label: Contact Email Address
        hint: Required only if interested in the committee.
        type: email
        options: []
        required: false
      - id: 16
        name: survey_submission_date
        label: Today - s Date
        hint: null
        type: date
        options: []
        required: true
