inputSchema:
  type: object
  properties:
    title: Host Availability Survey
    pages:
    - id: 1
      name: host_availability_survey_form
      label: Availability Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: Please select an event date
      type: date
      options: []
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: availability_start
      label: Availability Start
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: availability_end
      label: Availability End
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: preference_days_off
      label: Days Off
      hint: Please select days that you are unavailable
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 8
      name: preference_mornings
      label: Morning Availability
      hint: null
      type: select_multiple
      options:
      - '8:00'
      - '9:00'
      - '10:00'
      - '11:00'
      - '12:00'
      - '13:00'
      - '14:00'
      - '15:00'
      - '16:00'
      - '17:00'
      - '18:00'
      required: false
    - id: 9
      name: preference_evenings
      label: Evening Availability
      hint: null
      type: select_multiple
      options:
      - '18:00'
      - '19:00'
      - '20:00'
      - '21:00'
      - '22:00'
      required: false
    - id: 10
      name: note
      label: Notes
      hint: Please provide any additional notes about your availability
      type: note
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: preferred_language
      label: Preferred Language
      hint: null
      type: text
      options: []
      required: false
