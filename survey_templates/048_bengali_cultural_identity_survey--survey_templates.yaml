inputSchema:
  type: object
  properties:
    title: Bengali Cultural Identity Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: respondent_name
      label: Respondent Name
      hint: Optional - for follow-up
      type: text
      options: []
      required: false
    - id: 3
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - 18-25
      - 26-35
      - 36-45
      - 46-55
      - 56-65
      - 65+
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer Not to Say
      required: false
    - id: 5
      name: country_of_residence
      label: Country of Current Residence
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: birth_location
      label: Place of Birth
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: bengali_language_fluency
      label: Fluency in Bengali Language
      hint: null
      type: select_one
      options:
      - Native Speaker
      - Fluent
      - Conversational
      - Some Knowledge
      - No Knowledge
      required: true
    - id: 8
      name: bengali_language_use
      label: How Often Do You Speak Bengali
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: true
    - id: 9
      name: cultural_traditions
      label: Participation in Bengali Cultural Traditions
      hint: null
      type: select_one
      options:
      - Very Active
      - Active
      - Somewhat Active
      - Minimal
      - None
      required: true
    - id: 10
      name: festival_celebration
      label: Do You Celebrate Bengali Festivals
      hint: Pohela Boishakh, Durga Puja, etc.
      type: select_one
      options:
      - Yes, Always
      - Yes, Sometimes
      - Occasionally
      - Rarely
      - 'False'
      required: true
    - id: 11
      name: family_language
      label: What Language Is Spoken in Your Family
      hint: null
      type: select_one
      options:
      - Bengali Only
      - Bengali and English
      - Bengali and Other
      - English Only
      - Mixed Languages
      required: true
    - id: 12
      name: cultural_identity_strength
      label: How Strong Is Your Bengali Cultural Identity
      hint: null
      type: select_one
      options:
      - Very Strong
      - Strong
      - Moderate
      - Weak
      - Very Weak
      required: true
    - id: 13
      name: food_traditions
      label: How Important Are Bengali Food Traditions
      hint: null
      type: select_one
      options:
      - Very Important
      - Important
      - Somewhat Important
      - Not Very Important
      - Not Important
      required: true
    - id: 14
      name: religious_practices
      label: Involvement in Bengali Religious Practices
      hint: null
      type: select_one
      options:
      - Very Involved
      - Involved
      - Somewhat Involved
      - Minimally Involved
      - Not Involved
      required: false
    - id: 15
      name: community_connection
      label: Connection to Bengali Community
      hint: null
      type: select_one
      options:
      - Very Connected
      - Connected
      - Somewhat Connected
      - Minimally Connected
      - Not Connected
      required: true
    - id: 16
      name: cultural_pride
      label: Level of Pride in Bengali Heritage
      hint: null
      type: select_one
      options:
      - Very Proud
      - Proud
      - Somewhat Proud
      - Neutral
      - Not Proud
      required: true
    - id: 17
      name: challenges_maintaining
      label: Challenges in Maintaining Cultural Identity
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: hopes_for_heritage
      label: Your Hopes for Passing on the Heritage
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
