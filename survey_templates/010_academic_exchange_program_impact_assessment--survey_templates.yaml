inputSchema:
  type: object
  properties:
    title: Academic Exchange Program Impact Assessment
    pages:
      - id: 1
        name: section_participant_info
        label: -- Participant Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: participant_name
        label: Participant name
        hint: Full name of the participant
        type: text
        options: []
        required: true
      - id: 3
        name: home_institution
        label: Home institution
        hint: Institution of origin
        type: text
        options: []
        required: true
      - id: 4
        name: host_institution
        label: Host institution
        hint: Institution visited during exchange
        type: text
        options: []
        required: false
      - id: 5
        name: program_duration
        label: Program duration
        hint: Length of exchange
        type: text
        options: []
        required: false
      - id: 6
        name: learning_outcomes_met
        label: To what extent were learning outcomes met
        hint: Rate how well objectives were achieved
        type: select_one
        options:
          - Exceeded expectations
          - Met expectations
          - Partially met
          - Did not meet
        required: true
      - id: 7
        name: cultural_experience_rating
        label: Cultural experience rating
        hint: Rate cultural integration and experiences
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: false
      - id: 8
        name: challenges_faced
        label: Challenges faced during exchange
        hint: Select all that applied
        type: select_multiple
        options:
          - Language barriers
          - Housing difficulties
          - Financial constraints
          - Administrative delays
          - Health or safety concerns
        required: false
      - id: 9
        name: impact_on_career
        label: Impact on career or studies
        hint: Describe notable effects
        type: text
        options: []
        required: false
      - id: 10
        name: suggestions
        label: Suggestions for program improvement
        hint: Ideas to enhance future exchanges
        type: text
        options: []
        required: false
