inputSchema:
  type: object
  properties:
    title: Relationship Questionnaire
    pages:
    - id: 1
      name: relationship_status
      label: Relationship Status
      hint: null
      type: select_one
      options:
      - Single
      - In a relationship
      - Married
      - Engaged
      - Widowed
      - Separated
      - It's complicated
      required: false
    - id: 2
      name: relationship_length
      label: Relationship Length
      hint: null
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - More than 5 years
      - Never been in a relationship
      required: false
    - id: 3
      name: relationship_type
      label: Relationship Type
      hint: null
      type: select_multiple
      options:
      - Casual
      - Romantic
      - Friendly
      - Family
      - Other (please specify)
      required: false
    - id: 4
      name: relationship_satisfaction
      label: How Satisfied Are You with Your Relationship?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neither satisfied nor dissatisfied
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 5
      name: relationship_conflicts
      label: Do You Often Have Conflicts?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Rarely
      - Sometimes
      required: false
    - id: 6
      name: relationship_support
      label: Do You Feel Supported?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Somewhat
      - Not sure
      - Don't know
      required: false
    - id: 7
      name: relationship_quality
      label: Relationship Quality
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      - Minimal
      required: false
    - id: 8
      name: relationship_dominance
      label: Do You Feel Dominant?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Somewhat
      - Not sure
      - Don't know
      required: false
    - id: 9
      name: relationship_satisfaction_2
      label: How Satisfied Are You with Your Relationship (Scale 1-10)?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: relationship_conflicts_2
      label: How Often Do You Have Conflicts (Scale 1-10)?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
