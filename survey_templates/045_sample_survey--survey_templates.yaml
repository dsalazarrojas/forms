inputSchema:
  type: object
  properties:
    title: Sample Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: What type of customer service are you most satisfied with?
      hint: null
      type: select_one
      options:
      - phone
      - email
      - chat
      - email and phone
      required: false
    - id: 3
      name: question_2
      label: How would you rate this experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: question_3
      label: Would you like to be contacted again?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - never
      required: false
    - id: 5
      name: question_4
      label: What would you like to see more of?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: question_5
      label: Do you have a website or online presence?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - not applicable
      required: false
