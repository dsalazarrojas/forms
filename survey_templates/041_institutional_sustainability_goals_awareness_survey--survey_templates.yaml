inputSchema:
  type: object
  properties:
    title: Institutional Sustainability Goals Awareness Survey
    pages:
    - id: 1
      name: introduction
      label: Welcome to the survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: awareness
      label: What do you think are the main reasons why we should have a sustainability
        awareness campaign?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: staff_engagement
      label: How engaged are you in sustainability activities?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: channels
      label: Which of the following channels would you prefer to receive sustainability
        information?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: follow_up
      label: How would you like to receive follow-up information on sustainability?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 6
      name: communication
      label: How do you prefer to communicate about sustainability?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Do you prefer emails for sustainability information?
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
