inputSchema:
  type: object
  properties:
    title: Building Process Optimization Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: When completing this survey
      type: date
      options: []
      required: true
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: respondent_role
      label: Your Role
      hint: Job title or position
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department or Team
      hint: Which team do you work with
      type: text
      options: []
      required: false
    - id: 6
      name: project_name
      label: Project Name or Building
      hint: Which project are you evaluating
      type: text
      options: []
      required: true
    - id: 7
      name: project_phase
      label: Current Project Phase
      hint: Planning, construction, completion
      type: select_one
      options:
        - Planning
        - Design
        - Pre-Construction
        - Active Construction
        - Final Stages
        - Completed
      required: true
    - id: 8
      name: planning_process
      label: Effectiveness of Planning Process
      hint: How well planned is the project
      type: select_one
      options:
        - Very Effective
        - Effective
        - Neutral
        - Ineffective
        - Very Ineffective
      required: true
    - id: 9
      name: communication_workflow
      label: Effectiveness of Team Communication
      hint: How well do teams communicate
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Very Poor
      required: true
    - id: 10
      name: coordination_issues
      label: Issues With Task Coordination
      hint: Problems coordinating work
      type: text
      options: []
      required: false
    - id: 11
      name: workflow_bottlenecks
      label: Major Process Bottlenecks
      hint: Where do delays occur
      type: select_multiple
      options:
        - Planning Phase
        - Approval Process
        - Scheduling
        - Material Procurement
        - Labor Availability
        - Inspection Process
        - Communication Delays
        - Budget Constraints
      required: false
    - id: 12
      name: critical_bottleneck
      label: Most Critical Bottleneck
      hint: The biggest process problem
      type: text
      options: []
      required: false
    - id: 13
      name: schedule_adherence
      label: Adherence to Project Schedule
      hint: Are you on schedule
      type: select_one
      options:
        - Ahead of Schedule
        - On Schedule
        - Slightly Behind
        - Significantly Behind
        - Very Behind
      required: true
    - id: 14
      name: budget_adherence
      label: Adherence to Budget
      hint: Are costs on track
      type: select_one
      options:
        - Under Budget
        - On Budget
        - Slightly Over
        - Significantly Over
        - Very Over
      required: true
    - id: 15
      name: quality_standards
      label: Meeting Quality Standards
      hint: Is work quality acceptable
      type: select_one
      options:
        - Exceeding Standards
        - Meeting Standards
        - Below Standards
        - Far Below Standards
      required: true
    - id: 16
      name: process_clarity
      label: Clarity of Process and Procedures
      hint: How clear are the procedures
      type: select_one
      options:
        - Very Clear
        - Clear
        - Somewhat Clear
        - Unclear
        - Very Unclear
      required: true
    - id: 17
      name: tool_effectiveness
      label: Effectiveness of Project Management Tools
      hint: Software and systems being used
      type: select_one
      options:
        - Very Effective
        - Effective
        - Neutral
        - Ineffective
        - Not Using Tools
      required: false
    - id: 18
      name: risk_management
      label: Risk Management Process Effectiveness
      hint: How well are risks managed
      type: select_one
      options:
        - Very Effective
        - Effective
        - Neutral
        - Ineffective
        - Very Ineffective
      required: true
    - id: 19
      name: improvement_ideas
      label: Ideas for Process Optimization
      hint: How to improve the workflow
      type: text
      options: []
      required: false
    - id: 20
      name: priority_improvements
      label: Top Priority Improvements
      hint: What needs to change first
      type: text
      options: []
      required: false
