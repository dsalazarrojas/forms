inputSchema:
  type: object
  properties:
    title: Tournament Venue Experience Survey
    pages:
    - id: 1
      name: parking
      label: parking
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Neutral
      - Bad
      - Very Bad
      required: false
    - id: 2
      name: staff
      label: staff
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: amenities
      label: amenities
      hint: null
      type: select_multiple
      options:
      - Food and beverage services
      - Restrooms and facilities
      - Event staff and volunteers
      - Parking and transportation
      - Overall experience
      required: false
    - id: 4
      name: overall_satisfaction
      label: overall_satisfaction
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Neutral
      - Bad
      - Very Bad
      required: false
    - id: 5
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
