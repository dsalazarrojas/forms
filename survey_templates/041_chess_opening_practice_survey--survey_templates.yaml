inputSchema:
  type: object
  properties:
    title: Chess Opening Practice Survey
    pages:
    - id: 1
      name: player_name
      label: Your Name
      hint: Optional - Your full name
      type: text
      options: []
      required: false
    - id: 2
      name: email_address
      label: Email Address
      hint: Optional - For follow-up
      type: email
      options: []
      required: false
    - id: 3
      name: age_group
      label: Age Group
      hint: Which age group do you belong to
      type: select_one
      options:
      - Under 12
      - 12-17
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65 or older
      required: true
    - id: 4
      name: chess_rating
      label: Chess Rating
      hint: Your current chess rating if known
      type: select_one
      options:
      - Unrated
      - Under 800
      - 800-1200
      - 1200-1600
      - 1600-2000
      - 2000-2400
      - 2400+
      required: true
    - id: 5
      name: years_playing
      label: Years Playing Chess
      hint: How long have you played chess
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - 3-5 years
      - 6-10 years
      - 10+ years
      required: true
    - id: 6
      name: play_frequency
      label: How Often Do You Play
      hint: Frequency of chess play
      type: select_one
      options:
      - Daily
      - Several times a week
      - Once a week
      - Few times a month
      - Rarely
      required: true
    - id: 7
      name: opening_study_time
      label: Time Spent Studying Openings
      hint: How much time do you spend on openings
      type: select_one
      options:
      - None
      - Less than 1 hour per week
      - 1-3 hours per week
      - 3-5 hours per week
      - 5+ hours per week
      required: true
    - id: 8
      name: white_openings
      label: Openings You Play as White
      hint: List your main openings with white
      type: text
      options: []
      required: true
    - id: 9
      name: black_openings_vs_e4
      label: Openings vs e4 as Black
      hint: What do you play against e4
      type: select_multiple
      options:
      - e5 (Open Game)
      - c5 (Sicilian Defense)
      - e6 (French Defense)
      - c6 (Caro-Kann)
      - d6 (Pirc/Modern)
      - Other
      required: true
    - id: 10
      name: black_openings_vs_d4
      label: Openings vs d4 as Black
      hint: What do you play against d4
      type: select_multiple
      options:
      - d5 (Closed Game)
      - Nf6 (Indian Defenses)
      - f5 (Dutch Defense)
      - c5 (Benoni)
      - Other
      required: true
    - id: 11
      name: opening_preparation_method
      label: How Do You Prepare Openings
      hint: Select all methods you use
      type: select_multiple
      options:
      - Books
      - Online courses
      - Video lessons
      - Chess software
      - Coach instruction
      - Game analysis
      - Memorization
      - No preparation
      required: true
    - id: 12
      name: opening_challenges
      label: Biggest Opening Challenges
      hint: What do you struggle with most
      type: select_multiple
      options:
      - Memorizing variations
      - Understanding plans
      - Handling surprises
      - Time management
      - Transitioning to middlegame
      - Remembering theory
      - Knowing when to deviate
      - Other
      required: true
    - id: 13
      name: opening_mistakes
      label: Common Opening Mistakes
      hint: What mistakes do you make
      type: text
      options: []
      required: false
    - id: 14
      name: theory_knowledge
      label: Opening Theory Knowledge
      hint: How would you rate your theory knowledge
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 15
      name: repertoire_stability
      label: Opening Repertoire Stability
      hint: How consistent is your opening repertoire
      type: select_one
      options:
      - Very consistent
      - Mostly consistent
      - Sometimes change
      - Often change
      - No fixed repertoire
      required: true
    - id: 16
      name: coach_guidance
      label: Do You Have a Coach
      hint: Do you receive coaching on openings
      type: select_one
      options:
      - Yes, regular coaching
      - Yes, occasional
      - No, but considering
      - 'False'
      required: true
    - id: 17
      name: opening_success_rate
      label: Opening Success Rate
      hint: How often do you get good positions
      type: select_one
      options:
      - Always
      - Most of the time
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 18
      name: favorite_opening
      label: Favorite Opening
      hint: What is your favorite opening to play
      type: text
      options: []
      required: false
    - id: 19
      name: least_favorite_opening
      label: Least Favorite Opening
      hint: What opening do you dislike facing
      type: text
      options: []
      required: false
    - id: 20
      name: opening_goals
      label: Opening Study Goals
      hint: What are your opening study goals
      type: text
      options: []
      required: false
    - id: 21
      name: resources_needed
      label: Resources You Need
      hint: What would help your opening study
      type: text
      options: []
      required: false
    - id: 22
      name: would_participate_training
      label: Would Participate in Opening Training
      hint: Would you join an opening training program
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Not sure
      - Probably no
      - Definitely no
      required: true
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other thoughts about opening study
      type: text
      options: []
      required: false
