inputSchema:
  type: object
  properties:
    title: Stigma Awareness Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: example@example.com
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: program_type
      label: Program Type
      hint: null
      type: select_one
      options:
      - School
      - Nonprofit
      - Community Group
      required: true
    - id: 6
      name: program_type_other
      label: If other, please specify
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: stigma_perception
      label: Stigma Perception
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neither Agree nor Disagree
      - Strongly Disagree
      - Don't Know
      required: true
    - id: 8
      name: program_impact
      label: Program Impact
      hint: null
      type: select_one
      options:
      - Very Positive
      - Positive
      - Neutral
      - Negative
      - Very Negative
      - None
      required: true
    - id: 9
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
