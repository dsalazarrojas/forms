inputSchema:
  type: object
  properties:
    title: lte_network_performance_evaluation_survey
    pages:
    - id: 1
      name: form_start
      label: start_form
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: section_1
      label: lte_performance
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Very Good
      - Good
      - Neutral
      - Bad
      - Very Bad
      required: true
    - id: 3
      name: section_2
      label: network_issues
      hint: null
      type: select_multiple
      options:
      - signal loss
      - data speed
      - call drop
      - poor coverage
      required: false
    - id: 4
      name: section_3
      label: device_performance
      hint: null
      type: select_one
      options:
      - excellent
      - very good
      - good
      - average
      - poor
      required: false
    - id: 5
      name: section_4
      label: customer_experience
      hint: null
      type: note
      options: []
      required: true
    - id: 6
      name: form_end
      label: submit_form
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
