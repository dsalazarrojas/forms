inputSchema:
  type: object
  properties:
    title: Magnet Information Survey
    pages:
    - id: 1
      name: survey_title
      label: magnet_information_survey
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: category
      label: what_is_your_primary_category
      hint: null
      type: select_one
      options:
      - Magnet
      - Accessories
      - Software
      - Other
      required: true
    - id: 3
      name: usage_frequency
      label: how_often_do_you_use_magnet
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: true
    - id: 4
      name: satisfaction_rating
      label: how_satisfied_are_you
      hint: Rate your satisfaction on a scale from 1-5
      type: number
      options: []
      required: true
    - id: 5
      name: purchase_frequency
      label: how_often_do_you_purchase
      hint: null
      type: select_multiple
      options:
      - Often
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 6
      name: purchase_channel
      label: which_channel_do_you_purchase_from
      hint: null
      type: select_multiple
      options:
      - Online
      - In-store
      - Both
      required: true
    - id: 7
      name: purchase_method
      label: how_do_you_purchase
      hint: null
      type: select_multiple
      options:
      - Online
      - In-store
      - Other
      required: true
    - id: 8
      name: purchase_influencers
      label: what_influences_your_purchases
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Influencers
      - Friends and Family
      - Online Ads
      - Other
      required: true
    - id: 9
      name: survey_comments
      label: any_additional_comments
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: email
      label: email_address
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone
      label: phone_number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
