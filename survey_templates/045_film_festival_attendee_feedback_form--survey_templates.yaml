inputSchema:
  type: object
  properties:
    title: Film Festival Attendee Feedback Form
    pages:
    - id: 1
      name: welcome
      label: Welcome to this feedback form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: attendee_name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: rating
      label: Overall rating of the event
      hint: Rate the event on a scale of 1-5
      type: number
      options: []
      required: true
    - id: 4
      name: satisfaction
      label: How satisfied are you with the event
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: preferences
      label: What are your interests
      hint: Select all that apply
      type: select_multiple
      options:
      - Movie premieres
      - Film festival
      - Live music
      - Art exhibits
      - Food and drinks
      required: true
    - id: 6
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
