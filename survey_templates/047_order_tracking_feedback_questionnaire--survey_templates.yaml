inputSchema:
  type: object
  properties:
    title: Order Tracking Feedback Questionnaire
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: order_id
      label: Order Id
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: feedback_rating
      label: Feedback
      hint: How satisfied are you with your order?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 4
      name: order_status
      label: Order Status
      hint: null
      type: select_multiple
      options:
      - Ordered
      - Shipped
      - Delivered
      - Cancelled
      required: false
    - id: 5
      name: reason_for_cancel
      label: Reason for Cancel
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: customer_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: feedback_message
      label: Additional Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
