inputSchema:
  type: object
  properties:
    title: Instruction And Evaluation Quiz
    pages:
    - id: 1
      name: instruction_section
      label: What is the participant doing?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: evaluation_question
      label: How would you rate this quiz as a whole?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 3
      name: evaluation_score
      label: What is your final score?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: evaluation_comments
      label: Do you have any feedback about this quiz?
      hint: null
      type: text
      options: []
      required: false
