inputSchema:
  type: object
  properties:
    title: ASMR Survey
    pages:
    - id: 1
      name: introduction_note
      label: Introduction to ASMR Survey
      hint: Thank you for participating in our ASMR research study
      type: note
      options: []
      required: false
    - id: 2
      name: age_group
      label: What is your age group
      hint: Select the range that applies to you
      type: select_one
      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65+
      required: true
    - id: 3
      name: gender
      label: What is your gender
      hint: Select your gender identity
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 4
      name: asmr_familiarity
      label: How familiar are you with ASMR
      hint: Rate your familiarity with ASMR triggers and content
      type: select_one
      options:
      - Very familiar
      - Somewhat familiar
      - Slightly familiar
      - Not familiar at all
      required: true
    - id: 5
      name: asmr_frequency
      label: How often do you listen to ASMR content
      hint: Select your typical listening frequency
      type: select_one
      options:
      - Daily
      - Several times a week
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: true
    - id: 6
      name: asmr_triggers
      label: Which ASMR triggers affect you most (select all that apply)
      hint: Choose the triggers that consistently give you ASMR sensations
      type: select_multiple
      options:
      - Whispering
      - Tapping
      - Crinkling sounds
      - Roleplay scenarios
      - Personal attention
      - Eating sounds
      - Hand movements
      required: false
    - id: 7
      name: asmr_effectiveness_rating
      label: On a scale of 1-10, how effective is ASMR for relaxation for you
      hint: 1 being not effective at all, 10 being extremely effective
      type: number
      options: []
      required: true
    - id: 8
      name: sleep_improvement
      label: Does ASMR help improve your sleep quality
      hint: Select yes if you regularly use ASMR for sleep
      type: select_one
      options:
      - 'True'
      - 'False'
      - Sometimes
      required: false
    - id: 9
      name: stress_relief
      label: Do you use ASMR primarily for stress relief
      hint: Select your primary reason for listening to ASMR
      type: select_one
      options:
      - 'True'
      - 'False'
      - Occasionally
      required: false
    - id: 10
      name: trigger_intensity
      label: How intense are your ASMR sensations
      hint: Rate the physical intensity of your ASMR experiences
      type: select_one
      options:
      - Very intense
      - Moderately intense
      - Mild
      - Very weak
      - None
      required: true
    - id: 11
      name: preferred_duration
      label: What is your preferred duration for ASMR videos
      hint: Select the length that works best for you
      type: select_one
      options:
      - Under 10 minutes
      - 10-20 minutes
      - 20-30 minutes
      - 30-60 minutes
      - Over 60 minutes
      required: false
    - id: 12
      name: content_creator_preference
      label: Do you have a preference for ASMR content creators
      hint: Select your preference for content creator characteristics
      type: select_one
      options:
      - Female voices
      - Male voices
      - No preference
      - Specific creators
      required: false
    - id: 13
      name: additional_comments
      label: Additional comments about your ASMR experience
      hint: Share any other thoughts about ASMR that you'd like to mention
      type: text
      options: []
      required: false
