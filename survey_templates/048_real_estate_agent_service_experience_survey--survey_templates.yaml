inputSchema:
  type: object
  properties:
    title: Real Estate Agent Service Experience Survey
    pages:
    - id: 1
      name: real_estate_agent
      label: How would you rate your overall experience with our real estate agent?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: communication
      label: How would you rate the communication from our real estate agent?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: responsiveness
      label: How responsive was your real estate agent?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: follow_up
      label: Did our real estate agent follow up on our offer?
      hint: null
      type: select_one
      options:
      - Not Satisfied
      - Satisfied
      - Very Satisfied
      required: true
    - id: 5
      name: negotiation
      label: Did our real estate agent help with negotiations?
      hint: null
      type: select_multiple
      options:
      - Not Satisfied
      - Satisfied
      - Very Satisfied
      required: true
    - id: 6
      name: knowledge
      label: How knowledgeable was your real estate agent?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: professionalism
      label: How professional was your real estate agent?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: overall_satisfaction
      label: How satisfied are you with the overall service?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: additional_comments
      label: Is there anything else you'd like to share with us?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact_details
      label: What are your contact details?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: follow_up_email
      label: Should we follow up with you via email?
      hint: null
      type: select_one
      options:
      - Not Now
      - 'True'
      - Later
      required: false
    - id: 14
      name: follow_up_phone
      label: Should we follow up with you via phone?
      hint: null
      type: select_one
      options:
      - Never
      - Only Sometimes
      - 'True'
      required: false
