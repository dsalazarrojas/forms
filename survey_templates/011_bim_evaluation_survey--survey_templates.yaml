inputSchema:
  type: object
  properties:
    title: BIM Evaluation Survey
    pages:
    - id: 1
      name: respondent_name
      label: Full Name
      hint: Your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: company_organization
      label: Company or Organization
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 3
      name: job_title
      label: Job Title
      hint: Your position or role
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Business email for follow-up
      type: email
      options: []
      required: true
    - id: 5
      name: industry_sector
      label: Industry Sector
      hint: Select your primary sector
      type: select_one
      options:
      - Architecture
      - Engineering
      - Construction
      - Owner or Developer
      - Facility Management
      - Consulting
      - Other
      required: true
    - id: 6
      name: years_bim_experience
      label: Years of BIM Experience
      hint: How long have you worked with BIM
      type: select_one
      options:
      - Less than 1 year
      - 1 to 3 years
      - 3 to 5 years
      - 5 to 10 years
      - Over 10 years
      required: true
    - id: 7
      name: bim_software_used
      label: BIM Software Used
      hint: Select software you regularly use
      type: select_multiple
      options:
      - Revit
      - ArchiCAD
      - Navisworks
      - AutoCAD
      - Tekla Structures
      - Bentley Systems
      - Rhino
      - Other
      required: true
    - id: 8
      name: bim_implementation_level
      label: BIM Implementation Level
      hint: How would you rate your organization BIM maturity
      type: select_one
      options:
      - Not using BIM
      - Beginning stage
      - Intermediate
      - Advanced
      - Expert level
      required: true
    - id: 9
      name: bim_benefits_realized
      label: BIM Benefits Realized
      hint: Select benefits your organization has experienced
      type: select_multiple
      options:
      - Improved collaboration
      - Reduced errors and rework
      - Cost savings
      - Time savings
      - Better visualization
      - Enhanced documentation
      - Clash detection
      - None yet
      required: true
    - id: 10
      name: bim_challenges
      label: BIM Implementation Challenges
      hint: Select challenges you have faced
      type: select_multiple
      options:
      - High software costs
      - Training requirements
      - Resistance to change
      - Interoperability issues
      - Lack of standards
      - Hardware limitations
      - Time constraints
      - None
      required: true
    - id: 11
      name: collaboration_effectiveness
      label: BIM Collaboration Effectiveness
      hint: How effective is BIM for team collaboration
      type: select_one
      options:
      - Very Effective
      - Effective
      - Neutral
      - Ineffective
      - Very Ineffective
      required: true
    - id: 12
      name: project_types
      label: Project Types Using BIM
      hint: Select project types you work on
      type: select_multiple
      options:
      - Residential
      - Commercial
      - Industrial
      - Healthcare
      - Educational
      - Infrastructure
      - Mixed-use
      required: true
    - id: 13
      name: bim_standards_compliance
      label: BIM Standards Compliance
      hint: Does your organization follow BIM standards
      type: select_one
      options:
      - Yes, strictly
      - Yes, partially
      - Working on it
      - 'False'
      - Not aware of standards
      required: true
    - id: 14
      name: training_investment
      label: Training Investment Level
      hint: How much does your organization invest in BIM training
      type: select_one
      options:
      - High investment
      - Moderate investment
      - Low investment
      - No investment
      required: true
    - id: 15
      name: future_bim_adoption
      label: Future BIM Adoption Plans
      hint: Do you plan to increase BIM usage
      type: select_one
      options:
      - Yes, significantly
      - Yes, slightly
      - Maintain current level
      - Decrease usage
      - Unsure
      required: true
    - id: 16
      name: overall_satisfaction
      label: Overall Satisfaction with BIM
      hint: Rate your satisfaction with BIM technology
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 17
      name: recommendations
      label: Recommendations for BIM Improvement
      hint: What would improve BIM adoption or usage
      type: text
      options: []
      required: false
    - id: 18
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback about BIM practices
      type: text
      options: []
      required: false
