inputSchema:
  type: object
  properties:
    title: home_phone_fundraising_survey
    pages:
    - id: 1
      name: home_phone_use
      label: Do you use phone fundraising?
      hint: null
      type: select_one
      options:
      - Rarely
      - Occasionally
      - Frequently
      - Never
      required: true
    - id: 2
      name: home_phone_use_for
      label: How often do you use phone to fundraise?
      hint: null
      type: select_multiple
      options:
      - To ask for donations
      - To update supporters on progress
      - To share updates and stories
      - To share event information
      required: true
    - id: 3
      name: home_phone_use_concerns
      label: What are the main concerns when using phone to fundraise?
      hint: Select all that apply
      type: select_multiple
      options:
      - Cost
      - Time-consuming
      - Difficulty with donor engagement
      - Other
      required: true
    - id: 4
      name: home_phone_use_other_concerns
      label: What are other concerns when using phone to fundraise?
      hint: Please provide more information
      type: note
      options: []
      required: false
    - id: 5
      name: home_phone_use_email
      label: What is your email?
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: home_phone_use_phone_number
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: home_phone_use_date
      label: What date did you start using phone to fundraise?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: home_phone_use_time
      label: What time of day do you usually use phone to fundraise?
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: home_phone_outreach_improve
      label: What area of outreach do you think needs improvement using phone fundraising?
      hint: Select all that apply
      type: select_multiple
      options:
      - Donor engagement
      - Donor communication
      - Other
      required: true
    - id: 10
      name: home_phone_outreach_improve_other
      label: Other areas for improvement
      hint: Please provide more details
      type: note
      options: []
      required: false
    - id: 11
      name: home_phone_outreach_improve_other_details
      label: More details on other areas for improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: home_phone_outreach_improve_other_details_2
      label: Home Phone Outreach Improve Other Details 2
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: home_phone_outreach_improve_other_details_text
      label: Home Phone Outreach Improve Other Details Text
      hint: null
      type: text
      options: []
      required: false
