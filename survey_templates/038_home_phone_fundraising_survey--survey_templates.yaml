inputSchema:
  type: object
  properties:
    title: home_phone_fundraising_survey
    pages:
    - id: 1
      name: home_phone_use
      label: Do you use phone fundraising?
      hint: null
      type: select_one
      options:
      - No, Never
      - Rarely
      - Occasionally
      - Frequently
      required: false
    - id: 2
