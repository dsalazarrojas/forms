inputSchema:
  type: object
  properties:
    title: Skill Assessment Form
    pages:
    - id: 1
      name: candidate_info
      label: Candidate Information
      hint: First name and Last name of the candidate
      type: text
      options: []
      required: false
    - id: 2
      name: assessment_info
      label: Assessment Information
      hint: Assessment date and time
      type: text
      options: []
      required: false
    - id: 3
      name: scorecard
      label: Scorecard
      hint: Scorecard of the candidate
      type: text
      options: []
      required: false
    - id: 4
      name: review_questions
      label: Review Questions
      hint: Review questions for the candidate
      type: text
      options: []
      required: false
    - id: 5
      name: review
      label: Review
      hint: Review of the candidate
      type: text
      options: []
      required: false
    - id: 6
      name: select_multiple_1
      label: Select Multiple
      hint: Select multiple options
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: true
    - id: 7
      name: note
      label: Note
      hint: Additional information about the candidate
      type: text
      options: []
      required: false
