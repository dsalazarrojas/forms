inputSchema:
  type: object
  properties:
    title: Legislative Meeting Feedback Survey
    pages:
    - id: 1
      name: participant_id
      label: Participant Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: session_location
      label: Session Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: meeting_participants
      label: Meeting Participants
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: participant_attended
      label: Did Participant Attend
      hint: Did the participant attend the meeting?
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 7
      name: participant_feedback
      label: Participant Feedback
      hint: What was your feedback on the meeting?
      type: note
      options: []
      required: false
    - id: 8
      name: follow_up_actions
      label: Follow-up Actions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: next_meeting
      label: Next Meeting
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: follow_up_comments
      label: Follow-up Comments
      hint: null
      type: text
      options: []
      required: false
