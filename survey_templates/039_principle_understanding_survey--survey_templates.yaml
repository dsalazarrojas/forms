inputSchema:
  type: object
  properties:
    title: Principle Understanding Survey
    pages:
    - id: 1
      name: introduction
      label: What is this principle about?
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: team_members_awareness
      label: How many team members are aware of this principle?
      hint: null
      type: select_multiple
      options:
      - Few
      - Some
      - Most
      required: false
    - id: 3
      name: principle_training_needs
      label: What kind of training do you need to understand this principle?
      hint: null
      type: select_one
      options:
      - On-the-job training
      - Classroom training
      - Online training
      - No training needed
      required: false
    - id: 4
      name: feedback_for_leadership
      label: Do you have any feedback for leadership on implementing this principle?
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: principle_implementations
      label: How has this principle been implemented in your team?
      hint: null
      type: select_multiple
      options:
      - Fully implemented
      - Partially implemented
      - Not yet implemented
      required: false
    - id: 6
      name: principle_impact
      label: What is the impact of this principle on your team?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      - No impact
      required: false
    - id: 7
      name: principle_benefit
      label: What benefits does this principle bring to your team?
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      - No benefits
      required: false
    - id: 8
      name: principle_cost
      label: What cost is associated with implementing this principle?
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      - No cost
      required: false
    - id: 9
      name: principle_impact_on_other_teams
      label: How does this principle impact other teams?
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      - No impact
      required: false
