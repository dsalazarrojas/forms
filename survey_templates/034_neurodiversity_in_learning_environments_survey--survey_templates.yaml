inputSchema:
  type: object
  properties:
    title: neurodiversity_in_learning_environments_survey
    pages:
    - id: 1
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: category
      label: What category of education do you work in?
      hint: null
      type: select_one
      options:
      - primary
      - secondary
      - higher
      required: false
    - id: 3
      name: role
      label: What is your role in the school or university?
      hint: null
      type: select_multiple
      options:
      - student
      - teacher
      - staff
      - other
      required: false
    - id: 4
      name: support_neurodivergent_students
      label: How well do you support neurodivergent students in your learning environment?
      hint: null
      type: select_one
      options:
      - excellent
      - good
      - fair
      - poor
      required: false
    - id: 5
      name: support_neurodivergent_students_comments
