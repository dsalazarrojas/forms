inputSchema:
  type: object
  properties:
    title: Netball Finals Venue Feedback Survey
    pages:
    - id: 1
      name: venue_name
      label: Venue Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: feedback_1
      label: What was the quality of the venue's parking facilities?
      hint: null
      type: select_one
      options:
      - Parking was good
      - Parking was poor
      - Parking was fair
      - Parking was not available
      required: false
    - id: 5
      name: feedback_2
      label: How would you rate the quality of the venue's toilet facilities?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: feedback_3
      label: Were there enough staff members available to assist you during the event?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
