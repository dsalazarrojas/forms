inputSchema:
  type: object
  properties:
    title: Coaching Relationship Expectations Survey
    pages:
      - id: 1
        name: client_name
        label: Client Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: email
        label: Email Address
        hint: Contact email address
        type: email
        options: []
        required: true
      - id: 3
        name: coach_name
        label: Coach Name
        hint: Name of your coach
        type: text
        options: []
        required: true
      - id: 4
        name: survey_date
        label: Survey Date
        hint: Date of this survey
        type: date
        options: []
        required: true
      - id: 5
        name: relationship_stage
        label: Stage of Coaching Relationship
        hint: Where are you in the process
        type: select_one
        options:
          - Just Starting
          - 1-3 Sessions In
          - 4-6 Sessions In
          - Long-Term Client
          - Ending Relationship
        required: true
      - id: 6
        name: primary_goal
        label: Primary Goal for Coaching
        hint: What is your main objective
        type: text
        options: []
        required: true
      - id: 7
        name: session_frequency_expectation
        label: Expected Session Frequency
        hint: How often do you want to meet
        type: select_one
        options:
          - Weekly
          - Bi-Weekly
          - Monthly
          - As Needed
          - Intensive
        required: true
      - id: 8
        name: session_duration_expectation
        label: Expected Session Duration
        hint: How long should sessions be
        type: select_one
        options:
          - 30 Minutes
          - 45 Minutes
          - 60 Minutes
          - 90 Minutes
          - Flexible
        required: true
      - id: 9
        name: communication_expectation
        label: Communication Between Sessions
        hint: How much contact do you expect
        type: select_one
        options:
          - Regular Check-Ins
          - Only When Needed
          - Scheduled Calls Only
          - Email Only
          - No Contact Between Sessions
        required: true
      - id: 10
        name: response_time_expectation
        label: Expected Response Time
        hint: How quickly should coach respond
        type: select_one
        options:
          - Within 24 Hours
          - Within 48 Hours
          - Within 1 Week
          - No Urgency
        required: true
      - id: 11
        name: coach_role_expectation
        label: What Role Should Your Coach Play
        hint: How should your coach support you
        type: select_one
        options:
          - Guide and Facilitator
          - Advisor and Expert
          - Accountability Partner
          - Cheerleader and Supporter
          - Challenger
          - Mixed Role
        required: true
      - id: 12
        name: feedback_expectation
        label: Feedback Style Preference
        hint: How do you want feedback
        type: select_one
        options:
          - Direct and Honest
          - Gentle and Supportive
          - Balanced Approach
          - Written Feedback
          - Verbal Feedback
        required: true
      - id: 13
        name: accountability_expectation
        label: Accountability Level Expected
        hint: How much accountability do you want
        type: select_one
        options:
          - High Accountability
          - Moderate Accountability
          - Light Accountability
          - Self-Directed
        required: true
      - id: 14
        name: homework_expectation
        label: Expectations for Between-Session Work
        hint: How much work outside sessions
        type: select_one
        options:
          - Significant Work Expected
          - Moderate Work
          - Light Work
          - No Homework
        required: true
      - id: 15
        name: progress_tracking_expectation
        label: How Should Progress Be Tracked
        hint: Your preference for measurement
        type: select_one
        options:
          - Formal Assessments
          - Goal Milestones
          - Informal Discussion
          - Journal Reviews
          - No Formal Tracking
        required: false
      - id: 16
        name: confidentiality_expectation
        label: Confidentiality Expectations
        hint: What privacy do you expect
        type: select_one
        options:
          - Complete Confidentiality
          - Confidential with Exceptions
          - Open to Sharing Progress
          - No Concerns
        required: true
      - id: 17
        name: challenge_expectation
        label: How Much Do You Want to Be Challenged
        hint: Your comfort with being pushed
        type: select_one
        options:
          - Push Me Hard
          - Moderate Challenge
          - Gentle Approach
          - Let Me Lead
        required: true
      - id: 18
        name: structure_expectation
        label: Session Structure Preference
        hint: How structured should sessions be
        type: select_one
        options:
          - Highly Structured
          - Moderately Structured
          - Flexible Structure
          - Completely Open
        required: true
      - id: 19
        name: goal_setting_expectation
        label: Goal Setting Approach
        hint: How should goals be set
        type: select_one
        options:
          - Coach Sets Goals
          - Collaborative Goal Setting
          - Client Sets Goals
          - Evolving Goals
        required: true
      - id: 20
        name: success_definition
        label: How Do You Define Success
        hint: What does success look like
        type: text
        options: []
        required: true
      - id: 21
        name: relationship_duration_expectation
        label: Expected Relationship Duration
        hint: How long do you expect coaching
        type: select_one
        options:
          - 1-3 Months
          - 3-6 Months
          - 6-12 Months
          - Over 1 Year
          - Indefinite
        required: true
      - id: 22
        name: termination_expectation
        label: How Should the Relationship End
        hint: What ending do you envision
        type: select_one
        options:
          - Clear End Date
          - When Goals Are Met
          - Natural Fade Out
          - Open-Ended
        required: false
      - id: 23
        name: concerns_or_boundaries
        label: Any Concerns or Boundaries
        hint: What should coach know
        type: text
        options: []
        required: false
      - id: 24
        name: additional_expectations
        label: Additional Expectations
        hint: Anything else to share
        type: text
        options: []
        required: false
