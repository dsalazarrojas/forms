inputSchema:
  type: object
  properties:
    title: Residential Soundproofing Satisfaction Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: installation_date
      label: Installation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: soundproofing_system_rating
      label: Soundproofing System
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: false
    - id: 4
      name: satisfaction_level
      label: Your Satisfaction Level
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 5
      name: installation_quality
      label: Quality of Installation
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: customer_support
      label: Customer Support
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: Please provide any other comments or feedback you would like to share.
      type: text
      options: []
      required: false
