inputSchema:
  type: object
  properties:
    title: Property Maintenance Feedback Form
    pages:
    - id: 1
      name: property_maintenance_feedback_form_1
      label: Property Maintenance Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: property_maintenance_feedback_form_2
      label: What would you like to report?
      hint: null
      type: select_one
      options:
      - Maintenance Request
      - Other (please specify)
      required: false
    - id: 3
      name: property_maintenance_feedback_form_3
      label: What maintenance issues do you experience?
      hint: Select all that apply
      type: select_multiple
      options:
      - Bugs and Pests
      - Leak and Water Issues
      - Smell Odor Issues
      - Other (please specify)
      required: false
    - id: 4
      name: property_maintenance_feedback_form_4
      label: What is your preferred communication method?
      hint: null
      type: select_one
      options:
      - Phone Call
      - Text Message
      - Email
      - In-app Messaging
      required: false
    - id: 5
      name: property_maintenance_feedback_form_5
      label: When would you like to schedule the maintenance?
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: property_maintenance_feedback_form_6
      label: What date would you like to schedule the maintenance?
      hint: null
      type: date
      options: []
      required: false
