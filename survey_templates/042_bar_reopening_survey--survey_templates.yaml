inputSchema:
  type: object
  properties:
    title: Bar Reopening Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Your full name
      type: text
      options: []
      required: false
    - id: 3
      name: respondent_email
      label: Email Address
      hint: Your email contact
      type: email
      options: []
      required: false
    - id: 4
      name: respondent_phone
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: false
    - id: 5
      name: customer_frequency
      label: How Often Did You Visit Before Closure?
      hint: null
      type: select_one
      options:
      - Weekly
      - Multiple Times Per Month
      - Monthly
      - Several Times Per Year
      - Occasionally
      - Rarely
      required: true
    - id: 6
      name: visit_likelihood
      label: Will You Visit When We Reopen?
      hint: null
      type: select_one
      options:
      - Definitely
      - Very Likely
      - Likely
      - Unsure
      - Unlikely
      - Would Not Visit
      required: true
    - id: 7
      name: reopening_timing
      label: When Would You Feel Comfortable Visiting?
      hint: null
      type: select_one
      options:
      - Immediately Upon Reopening
      - After a Few Weeks
      - After a Month
      - After Several Months
      - After Vaccine Availability
      - Uncertain
      required: false
    - id: 8
      name: safety_confidence
      label: Confidence in Safety Measures
      hint: How confident in health/safety protocols?
      type: select_one
      options:
      - Very Confident
      - Confident
      - Somewhat Confident
      - Not Confident
      required: true
    - id: 9
      name: safety_concerns
      label: What Safety Concerns Do You Have?
      hint: Select all that apply
      type: select_multiple
      options:
      - Crowd Density
      - Ventilation Quality
      - Hygiene and Cleaning
      - Staff Safety
      - Mask Policies
      - Vaccination Status Checks
      - Table Spacing
      - Sanitation Protocols
      - Other
      required: false
    - id: 10
      name: safety_measures_important
      label: Most Important Safety Measures
      hint: Select top 3 priorities
      type: select_multiple
      options:
      - Hand Sanitizing Stations
      - Regular Cleaning
      - Reduced Capacity
      - Staff Training
      - Air Filtration
      - Touchless Payment
      - Separation Between Customers
      - Face Mask Requirements
      required: false
    - id: 11
      name: vaccination_requirement
      label: Would Vaccination Requirement Make You More Comfortable?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - No Opinion
      required: false
    - id: 12
      name: mask_policy
      label: Preference for Mask Policy
      hint: null
      type: select_one
      options:
      - Required at Entry
      - Required While Moving Around
      - Optional
      - No Masks
      - No Preference
      required: false
    - id: 13
      name: seating_preference
      label: Seating Preference
      hint: null
      type: select_one
      options:
      - Outdoor Seating
      - Well-Spaced Indoor Seating
      - Bar Seating
      - Table Service
      - No Preference
      required: false
    - id: 14
      name: outdoor_seating_important
      label: How Important is Outdoor Seating?
      hint: null
      type: select_one
      options:
      - Very Important
      - Important
      - Somewhat Important
      - Not Important
      required: false
    - id: 15
      name: pricing_tolerance
      label: Would You Accept Higher Prices Due to New Protocols?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Depends on Increase
      - Unsure
      required: false
    - id: 16
      name: special_events_interest
      label: Interest in Reopening Special Event
      hint: Would you attend a reopening party?
      type: select_one
      options:
      - Definitely Interested
      - Possibly Interested
      - Not Interested
      - Would Need More Information
      required: false
    - id: 17
      name: service_changes_feedback
      label: Feedback on Service Changes
      hint: Drinks, food, entertainment preferences
      type: text
      options: []
      required: false
    - id: 18
      name: improvements_suggestions
      label: Suggestions for Improvements
      hint: What could we do better?
      type: text
      options: []
      required: false
    - id: 19
      name: additional_concerns
      label: Additional Concerns or Comments
      hint: Any other feedback?
      type: text
      options: []
      required: false
    - id: 20
      name: contact_permission
      label: May We Contact You About Reopening?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
