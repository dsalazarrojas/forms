      hint: When did you join
      type: date
      options: []
      required: true
    - id: 6
      name: cancellation_date
      label: Cancellation Date
      hint: Date of cancellation
      type: date
      options: []
      required: true
    - id: 7
      name: membership_type
      label: Membership Type
      hint: What type did you have
      type: select_one
      options:
