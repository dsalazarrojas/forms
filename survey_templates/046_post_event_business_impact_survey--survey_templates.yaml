inputSchema:
  type: object
  properties:
    title: Post Event Business Impact Survey
    pages:
    - id: 1
      name: event_name
      label: What was the name of the event?
      hint: Please provide the name of the event.
      type: text
      options: []
      required: true
    - id: 2
      name: event_date
      label: Event Date
      hint: Please provide the date of the event.
      type: date
      options: []
      required: true
    - id: 3
      name: event_organizer
      label: Who organized the event?
      hint: Please specify the name of the event organizer.
      type: text
      options: []
      required: true
    - id: 4
      name: rating
      label: How would you rate the event?
      hint: Please rate the event from 1-5.
      type: number
      options: []
      required: true
    - id: 5
      name: improvement_areas
      label: What areas could we improve?
      hint: Please specify the areas for improvement.
      type: text
      options: []
      required: true
    - id: 6
      name: recommendations
      label: Do you have any recommendations?
      hint: Please provide any recommendations for future events.
      type: text
      options: []
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: Please provide any additional comments.
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: Please provide your email address.
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone Number
      hint: Please provide your phone number.
      type: text
      options: []
      required: true
    - id: 10
      name: event_attendance
      label: How many attendees were present?
      hint: Please select an option.
      type: select_one
      options:
      - 1-10
      - 11-20
      - 21-50
      - 51-100
      - 101 or more
      required: true
    - id: 11
      name: event_satisfaction
      label: How satisfied were you with the event?
      hint: Please select multiple options.
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Very Satisfied
      - Not Satisfied At All
      required: true
    - id: 12
      name: event_effectiveness
      label: How effective was the event?
      hint: Please select one option.
      type: select_one
      options:
      - Highly Effective
      - Somewhat Effective
      - Not Very Effective
      - Not Effective At All
      required: true
    - id: 13
      name: event_value
      label: What value did you receive from the event?
      hint: Please select multiple options.
      type: select_multiple
      options:
      - High Value
      - Medium Value
      - Low Value
      - No Value
      required: true
    - id: 14
      name: improvement_areas_2
      label: What areas could we improve in future events?
      hint: Please select one option.
      type: select_one
      options:
      - Event Content
      - Event Organization
      - Event Promotion
      - Event Follow-up
      required: true
    - id: 15
      name: recommendations_2
      label: Do you have any recommendations for future events?
      hint: Please provide any recommendations.
      type: text
      options: []
      required: true
    - id: 16
      name: comments_2
      label: Comments 2
      hint: Please provide any additional comments.
      type: text
      options: []
      required: true
    - id: 17
      name: event_attendance_2
      label: How many attendees were present at the event?
      hint: Please select an option.
      type: select_one
      options:
      - 1-10
      - 11-20
      - 21-50
      - 51-100
      - 101 or more
      required: true
    - id: 18
      name: event_effectiveness_2
      label: Event Effectiveness 2
      hint: Please select one option.
      type: select_one
      options:
      - Highly Effective
      - Somewhat Effective
      - Not Very Effective
      - Not Effective At All
      required: true
    - id: 19
      name: event_value_2
      label: Event Value 2
      hint: Please select multiple options.
      type: select_multiple
      options:
      - High Value
      - Medium Value
      - Low Value
      - No Value
      required: true
