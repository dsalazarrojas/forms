inputSchema:
  type: object
  properties:
    title: Travel Package Feedback Survey
    pages:
    - id: 1
      name: package_details
      label: Package Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: travel_dates
      label: When did you travel?
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: travel_agency
      label: Travel Agency
      hint: null
      type: select_one
      options:
      - Agency A
      - Agency B
      - Agency C
      required: true
    - id: 4
      name: tour_operator
      label: Tour Operator
      hint: null
      type: select_multiple
      options:
      - Operator A
      - Operator B
      - Operator C
      required: true
    - id: 5
      name: travel_agent
      label: Travel Agent
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: package_improvement
      label: Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_details
      label: Contact Details
      hint: null
      type: note
      options: []
      required: false
