inputSchema:
  type: object
  properties:
    title: Career Development Workshop Feedback Evaluation Form
    pages:
    - id: 1
      name: feedback_header
      label: -- Workshop Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: workshop_date
      label: Workshop date
      hint: Date attended
      type: date
      options: []
      required: true
    - id: 4
      name: overall_satisfaction
      label: Overall satisfaction
      hint: Rate the workshop
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 5
      name: usefulness_of_content
      label: Usefulness of content
      hint: How useful was the material
      type: select_one
      options:
      - Very useful
      - Useful
      - Somewhat useful
      - Not useful
      required: true
    - id: 6
      name: instructor_effectiveness
      label: Instructor effectiveness
      hint: Rate the presenter
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: suggestions_for_improvement
      label: Suggestions for improvement
      hint: Feedback for future workshops
      type: text
      options: []
      required: false
    - id: 8
      name: topics_for_future_workshops
      label: Topics for future workshops
      hint: What topics would you like to see next
      type: select_multiple
      options:
      - Interview skills
      - Networking
      - Resume writing
      - Leadership
      required: false
    - id: 9
      name: would_recommend
      label: Would recommend workshop to colleagues
      hint: Indicate preference
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Any other feedback
      type: text
      options: []
      required: false
