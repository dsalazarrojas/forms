inputSchema:
  type: object
  properties:
    title: Genetic Feedback Loop Research Data Collection Form
    pages:
    - id: 1
      name: study_details
      label: Study Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_info
      label: Participant Info
      hint: null
      type: select_one
      options:
      - Participant Type
      - Control
      - Donor
      required: true
    - id: 3
      name: demographic_data
      label: Demographic Data
      hint: Please provide demographic information
      type: select_multiple
      options:
      - participant age
      - study group
      - gender
      required: false
    - id: 4
      name: survey_data
      label: Survey Data
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: contact_info
      label: Contact Info
      hint: Please provide contact information for study participants
      type: text
      options: []
      required: false
    - id: 6
      name: participant_relationships
      label: Participant Relationships
      hint: null
      type: select_one
      options:
      - relationship 1
      - relationship 2
      - relationship 3
      required: false
    - id: 7
      name: genetic_data_1
      label: Genetic Data 1
      hint: null
      type: select_multiple
      options:
      - genetic info 1
      - genetic info 2
      required: false
    - id: 8
      name: genetic_data_2
      label: Genetic Data 2
      hint: null
      type: select_one
      options:
      - genetic option 1
      - genetic option 2
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
