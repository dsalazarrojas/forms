      name: evaluation_comments
      label: Evaluation Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: participant_experience
      label: Participant Experience
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: program_effectiveness
      label: Program Effectiveness
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: recommendation
      label: Recommend to Others
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: participant_satisfaction
      label: Participant Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 13
      name: training_area
      label: Training Area
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
