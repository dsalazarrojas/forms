      - 'No'
      required: false
    - id: 3
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: training_hours
      label: Hours of Training
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: training_level
      label: Training Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 6
      name: feedback_comments
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: evaluation_score
      label: Evaluation Score
      hint: null
      type: number
      options: []
      required: false
