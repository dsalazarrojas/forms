inputSchema:
  type: object
  properties:
    title: Skin Tone Matching Experience Survey
    pages:
    - id: 1
      name: customer_id
      label: Customer ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: matching_method
      label: What was the matching method used?
      hint: null
      type: select_one
      options:
      - Skin Tone Meter
      - Skin Tone Color Wheel
      - Other
      required: false
    - id: 3
      name: skin_tone_matching_accuracy
      label: How accurate was the skin tone matching?
      hint: null
      type: select_multiple
      options:
      - Very Accurate
      - Somewhat Accurate
      - Not Accurate
      required: false
    - id: 4
      name: satisfaction
      label: How satisfied were you with the skin tone matching?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 5
      name: accuracy_accuracy
      label: How accurate did you feel about the accuracy of your skin tone?
      hint: null
      type: select_multiple
      options:
      - Very Accurate
      - Somewhat Accurate
      - Not Accurate
      required: false
    - id: 6
      name: shade_recommendation
      label: What shade do you think you would be most likely to match with?
      hint: null
      type: select_multiple
      options:
      - Cool Undertones
      - Warm Undertones
      - Neutral
      required: false
