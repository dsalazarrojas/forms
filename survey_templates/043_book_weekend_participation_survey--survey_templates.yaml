inputSchema:
  type: object
  properties:
    title: Book Weekend Participation Survey
    pages:
    - id: 1
      name: attendee_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: We will send updates here
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: For event coordination
      type: text
      options: []
      required: false
    - id: 4
      name: weekend_attended
      label: Which Weekend Did You Attend
      hint: Select the weekend
      type: select_one
      options:
      - March 14-15 2026
      - March 21-22 2026
      - March 28-29 2026
      - April 4-5 2026
      required: true
    - id: 5
      name: days_attended
      label: Which Days Did You Attend
      hint: Select all that apply
      type: select_multiple
      options:
      - Saturday Only
      - Sunday Only
      - Both Days
      required: true
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: event_organization
      label: Event Organization Rating
      hint: Rate how well organized it was
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: venue_rating
      label: Venue Rating
      hint: Rate the venue
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: sessions_attended
      label: Sessions You Attended
      hint: Select sessions you joined
      type: select_multiple
      options:
      - Author Readings
      - Panel Discussions
      - Book Signings
      - Workshops
      - Keynote Speeches
      - Networking Events
      - Children Activities
      - Vendor Booths
      required: true
    - id: 10
      name: favorite_session
      label: Favorite Session
      hint: What did you enjoy most
      type: text
      options: []
      required: false
    - id: 11
      name: least_favorite_session
      label: Least Favorite Session
      hint: What could be improved
      type: text
      options: []
      required: false
    - id: 12
      name: speaker_quality
      label: Speaker Quality Rating
      hint: Rate the speakers
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: vendor_selection
      label: Vendor Selection Rating
      hint: Rate the vendors
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Did Not Visit
      required: false
    - id: 14
      name: value_for_time
      label: Was It Worth Your Time
      hint: Did you feel it was worthwhile
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 15
      name: value_for_money
      label: Was It Worth the Cost
      hint: Rate the value
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Did Not Pay
      required: true
    - id: 16
      name: books_purchased
      label: How Many Books Did You Purchase
      hint: Approximate number
      type: select_one
      options:
      - 0
      - 1-2
      - 3-5
      - 6-10
      - Over 10
      required: false
    - id: 17
      name: would_recommend
      label: Would You Recommend to Others
      hint: Would you recommend this event
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 18
      name: attend_next_year
      label: Will You Attend Next Year
      hint: Your future attendance plans
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 19
      name: improvements_suggested
      label: What Could Be Improved
      hint: Your suggestions
      type: text
      options: []
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 21
      name: how_did_you_hear
      label: How Did You Hear About This Event
      hint: How did you find out
      type: select_one
      options:
      - Social Media
      - Website
      - Friend or Family
      - Email Newsletter
      - Flyer or Poster
      - Media Coverage
      - Other
      required: false
    - id: 22
      name: survey_date
      label: Survey Date
      hint: Date of survey completion
      type: date
      options: []
      required: true
