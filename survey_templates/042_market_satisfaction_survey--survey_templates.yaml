inputSchema:
  type: object
  properties:
    title: Market Satisfaction Survey
    pages:
    - id: 1
      name: customer_satisfaction
      label: What do you think about our service?
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Somewhat Good
      - Neutral
      - Somewhat Bad
      - Very Bad
      required: true
    - id: 2
      name: customer_experience
      label: How would you rate your experience at this store?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: true
    - id: 3
      name: customer_service
      label: How would you rate the service of our staff?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: false
    - id: 4
      name: communication
      label: How often do you receive updates on promotions and new products?
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: product_range
      label: How long have you used our products or services?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: market_reach
      label: Have you told a friend or family member about our brand?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: store_location
      label: How often do you visit our store?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall how satisfied are you with our store?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
