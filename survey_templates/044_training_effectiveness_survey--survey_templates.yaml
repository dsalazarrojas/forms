inputSchema:
  type: object
  properties:
    title: Training Effectiveness Survey
    pages:
    - id: 1
      name: training_effectiveness_survey_1
      label: Training Effectiveness
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: training_effectiveness_survey_2
      label: How would you rate the overall effectiveness of the training?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 3
      name: training_effectiveness_survey_3
      label: How would you rate the trainer's ability to engage and motivate participants?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 4
      name: training_effectiveness_survey_4
      label: How would you rate the relevance of the topics presented during the training?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 5
      name: training_effectiveness_survey_5
      label: Which of the following topics would you like to see presented in future
        sessions?
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      - Option C
      required: false
    - id: 6
      name: training_effectiveness_survey_6
      label: What suggestions do you have for improving future sessions?
      hint: Please provide as much detail as possible
      type: text
      options: []
      required: false
    - id: 7
      name: training_effectiveness_survey_7
      label: Do you have any other comments or concerns about this session?
      hint: Please provide any comments or concerns
      type: text
      options: []
      required: false
    - id: 8
      name: training_effectiveness_survey_8
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: training_effectiveness_survey_9
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: training_effectiveness_survey_10
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: training_effectiveness_survey_11
      label: Date of session
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: training_effectiveness_survey_12
      label: Time of session
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: training_effectiveness_survey_13
      label: Session start time
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: training_effectiveness_survey_14
      label: Session end time
      hint: null
      type: time
      options: []
      required: false
    - id: 15
      name: training_effectiveness_survey_15
      label: Date of next session
      hint: null
      type: date
      options: []
      required: false
