inputSchema:
  type: object
  properties:
    title: Sports Center Survey Form
    pages:
    - id: 1
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55+
      required: true
    - id: 2
      name: frequency_of_visit
      label: Frequency of Visit
      hint: null
      type: select_one
      options:
      - Once a week
      - Twice a week
      - Rarely
      required: true
    - id: 3
      name: sports_activity
      label: Favorite Sports Activity
      hint: null
      type: select_multiple
      options:
      - Basketball
      - Football
      - Tennis
      - Volleyball
      - Golf
      - Hockey
      required: true
