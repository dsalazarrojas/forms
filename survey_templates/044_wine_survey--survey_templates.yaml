inputSchema:
  type: object
  properties:
    title: Wine Survey
    pages:
    - id: 1
      name: introduction
      label: Welcome to the wine survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: wine_preferences
      label: What type of wine do you enjoy?
      hint: null
      type: select_multiple
      options:
      - Red
      - White
      - Rosé
      - Sparkling
      - Dessert
      required: false
    - id: 3
      name: wine_consumption_frequency
      label: How often do you drink wine?
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 4
      name: favorite_wine_type
      label: What is your favorite type of wine?
      hint: null
      type: select_one
      options:
      - Red
      - White
      - Rosé
      - Sparkling
      - Dessert
      required: true
    - id: 5
      name: price_range
      label: What price range do you usually pay for a bottle of wine?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: wine_consumption_preferences
      label: Which of the following wines do you like?
      hint: null
      type: select_multiple
      options:
      - Chardonnay
      - Merlot
      - Pinot
      - Sauvignon Blanc
      - Cabernet
      required: true
    - id: 7
      name: wine_consumption_preferences_other
      label: Is there a wine not listed above that you prefer?
