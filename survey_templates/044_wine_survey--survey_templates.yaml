      name: wine_tasting_frequency
      label: How often do you participate in wine tastings?
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 10
      name: wine_club_membership
      label: Are you a member of a wine club?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: wine_club_frequency
      label: How often do you attend wine club events?
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 12
      name: winery_visits
