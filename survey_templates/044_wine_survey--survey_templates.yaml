      name: wine_purchase_amount
      label: What is your average monthly wine purchase amount?
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: wine_frequency
      label: How often do you drink wine?
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      - Never
      required: true
