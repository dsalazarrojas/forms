inputSchema:
  type: object
  properties:
    title: App Store Feedback Questionnaire
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: app_rating
      label: How would you rate our app overall?
      hint: null
      type: select_one
      options:
      - 5 stars - Excellent
      - 4 stars - Very good
      - 3 stars - Good
      - 2 stars - Fair
      - 1 star - Poor
      required: true
    - id: 5
      name: feature_satisfaction
      label: -- Feature Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: ease_of_use
      label: How easy is the app to use?
      hint: null
      type: select_one
      options:
      - Very easy
      - Easy
      - Neutral
      - Difficult
      - Very difficult
      required: true
    - id: 7
      name: performance_rating
      label: How would you rate the app's performance and speed?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Terrible
      required: true
    - id: 8
      name: features_useful
      label: Which features do you find most useful?
      hint: Select all that apply
      type: select_multiple
      options:
      - User interface
      - Search functionality
      - Notifications
      - Customization options
      - Integration capabilities
      required: false
    - id: 9
      name: missing_features
      label: What features would you like to see added?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: problem_encountered
      label: -- Issues and Support --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: experienced_issues
      label: Have you experienced any technical issues?
      hint: null
      type: select_one
      options:
      - Yes, frequently
      - Yes, occasionally
      - No, none at all
      required: true
    - id: 12
      name: issue_description
      label: Please describe any issues encountered
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: support_experience
      label: How satisfied are you with customer support?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 14
      name: recommendation_likelihood
      label: How likely are you to recommend this app to others?
      hint: On a scale of 0-10
      type: select_one
      options:
      - 10 - Extremely likely
      - 9
      - 8
      - 7
      - 6
      - 5 - Neutral
      - 4
      - 3
      - 2
      - 1
      - 0 - Not likely at all
      required: true
    - id: 15
      name: additional_feedback
      label: Any additional feedback or suggestions?
      hint: null
      type: text
      options: []
      required: false
