inputSchema:
  type: object
  properties:
    title: Earpiece Usage Feedback Form
    pages:
    - id: 1
      name: form_heading
      label: Earpiece Usage Feedback Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: user_email
      label: User Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 4
      name: rating
      label: How would you rate this earpiece?
      hint: On a scale of 1-5
      type: number
      options: []
      required: false
    - id: 5
      name: common_issues
      label: Common Issues
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: product_purchase_decision
      label: Does this form influence your product purchasing decision?
      hint: null
      type: select_one
      options:
      - 'No'
      - Maybe
      - 'Yes'
      required: false
    - id: 7
      name: satisfaction
      label: How satisfied are you with this earpiece?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
