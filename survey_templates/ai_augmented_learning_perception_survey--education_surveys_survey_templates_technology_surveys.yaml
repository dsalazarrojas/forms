      name: effectiveness_rating
      label: How effective do you believe AI is in enhancing learning outcomes?
      hint: 1 = Not effective at all, 10 = Extremely effective
      type: integer
      options: []
      required: true
    - id: 13
      name: satisfaction
      label: How satisfied are you with your experience using AI in learning?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
