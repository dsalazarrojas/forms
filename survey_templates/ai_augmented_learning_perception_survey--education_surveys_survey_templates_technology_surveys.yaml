      - Over-dependence on technology
      - Privacy issues
      - Reduced human interaction
      - Bias in AI systems
      - Lack of regulation
      - None
      required: false
    - id: 15
      name: benefits_select_multiple
      label: What benefits do you see in AI-assisted learning? (Select all that apply)
      hint: null
      type: select_multiple
      options:
      - Personalized learning
      - Immediate feedback
      - Accessibility improvements
      - Efficiency gains
      - Enhanced engagement
      - Better assessment tools
      - Other
      required: false
    - id: 16
