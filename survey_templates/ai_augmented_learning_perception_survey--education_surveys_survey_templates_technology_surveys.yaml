      name: section_header_intro
      label: '--- Introduction ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: We'll never share your email with others
      type: email
      options: []
      required: true
    - id: 4
      name: institution_role
      label: What is your role in education?
      hint: Select the option that best describes you
      type: select_one
      options:
      - Student
      - Teacher
      - Administrator
      - Parent
      - Other
      required: true
    - id: 5
      name: age_group
      label: Age group
      hint: null
      type: select_one
      options:
      - Under 18
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55+
      required: true
    - id: 6
      name: date
      label: Date of survey completion
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: section_header_experience
      label: '--- Experience with AI in Learning ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: ai_learning_experience
      label: How much experience do you have with AI in educational settings?
      hint: null
      type: select_one
      options:
      - No experience
      - Limited experience
      - Moderate experience
      - Extensive experience
      - Expert level
      required: true
    - id: 9
      name: ai_tools_used
      label: Which AI learning tools have you used? (Select all that apply)
      hint: null
      type: select_multiple
      options:
      - ChatGPT
      - Khan Academy AI
      - Duolingo
      - Grammarly
      - Wolfram Alpha
      - Other
      required: false
    - id: 10
      name: hours_per_week
      label: Approximately how many hours per week do you engage with AI-assisted
        learning?
      hint: null
      type: integer
      options: []
      required: false
