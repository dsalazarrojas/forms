inputSchema:
  type: object
  properties:
    title: telecom_service_plan_satisfaction_questionnaire
    pages:
    - id: 1
      name: general_comments
      label: General Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: plan_rating
      label: Plan Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 3
      name: service_quality
      label: Service Quality
      hint: null
      type: select_multiple
      options:
      - Very Poor
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 4
      name: communication_experience
      label: Communication Experience
      hint: null
      type: select_one
      options:
      - Very Poor
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 5
      name: issues_experienced
      label: Issues Experienced
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: issue_description
      label: Issue Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: issue_resolution
      label: Issue Resolution
      hint: null
      type: select_one
      options:
      - Unresolved
      - Resolved
      - Partially Resolved
      required: true
    - id: 8
      name: recommendations
      label: Recommendations
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_info
      label: Contact Information
      hint: Please provide contact information for us to contact you back
      type: text
      options: []
      required: true
    - id: 10
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: Please provide any additional comments or feedback
      type: text
      options: []
      required: false
    - id: 13
      name: service_improvement
      label: Service Improvement
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: follow_up
      label: Follow Up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
