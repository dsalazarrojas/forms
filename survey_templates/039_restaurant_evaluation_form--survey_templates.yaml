inputSchema:
  type: object
  properties:
    title: Restaurant Evaluation Form
    pages:
    - id: 1
      name: general_info
      label: General Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: food_quality
      label: Food Quality
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Bad
      required: false
    - id: 3
      name: order_accuracy
      label: Order Accuracy
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: service_quality
      label: Service Quality
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Bad
      required: false
    - id: 5
      name: cleanliness
      label: Cleanliness
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Bad
      required: false
    - id: 6
      name: speed_of_service
      label: Speed of Service
      hint: null
      type: select_one
      options:
      - Fast
      - Slow
      - Average
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Bad
      required: false
