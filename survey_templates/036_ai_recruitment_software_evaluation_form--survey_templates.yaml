inputSchema:
  type: object
  properties:
    title: AI Recruitment Software Evaluation Form
    pages:
    - id: 1
      name: evaluation_context_header
      label: '--- Software & Vendor Identification ---'
      hint: Standard identifiers for the recruitment technology evaluation.
      type: note
      options: []
      required: false
    - id: 2
      name: evaluator_name
      label: Evaluator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: evaluator_role
      label: Your Primary Role
      hint: null
      type: select_one
      options:
      - HR / Talent Acquisition Manager
      - Recruiter / Sourcer
      - IT / Systems Administrator
      - Procurement / Finance
      - Department Head (Hiring Manager)
      required: true
    - id: 4
      name: vendor_software_name
      label: Software / Vendor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: evaluation_date
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: feature_assessment_header
      label: '--- 1. Core AI Capabilities ---'
      hint: Rate the effectiveness of the AI-driven features.
      type: note
      options: []
      required: false
    - id: 7
      name: resume_parsing_rating
      label: Resume Parsing & Data Extraction
      hint: Accuracy of converting CVs into structured profiles.
      type: number
      options: []
      required: true
    - id: 8
      name: automated_screening_rating
      label: Automated Candidate Screening / Ranking
      hint: Quality of match between candidates and job descriptions.
      type: number
      options: []
      required: true
    - id: 9
      name: interview_automation_rating
      label: Interview Scheduling / Conversational AI
      hint: Effectiveness of chatbots and scheduling logic.
      type: number
      options: []
      required: true
    - id: 10
      name: ux_candidate_header
      label: '--- 2. User & Candidate Experience ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: ux_recruiter_rating
      label: Ease of use for Recruiting Teams
      hint: Intuitiveness of the dashboard and workflows.
      type: number
      options: []
      required: true
    - id: 12
      name: candidate_experience_rating
      label: Candidate Experience
      hint: Friction level for applicants during the process.
      type: number
      options: []
      required: true
    - id: 13
      name: technical_compliance_header
      label: '--- 3. Technical, Ethics & Compliance ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: ats_integration_capability
      label: Integration with existing ATS (Applicant Tracking System)
      hint: null
      type: select_one
      options:
      - Native Integration Available
      - API / Custom Integration Required
      - Not Compatible
      required: true
    - id: 15
      name: bias_mitigation_tools
      label: Does the software include explicit bias mitigation or diversity tools?
      hint: e.g., de-identifying resumes, diversity dashboards.
      type: select_one
      options:
      - Yes, robust features
      - Yes, basic features
      - 'False'
      required: true
    - id: 16
      name: compliance_certification
      label: Data Privacy & Compliance
      hint: GDPR, EEO, etc.
      type: select_multiple
      options:
      - GDPR Compliant
      - SOC 2 Certified
      - EEO / OFCCP Compliant
      - ISO 27001
      required: true
    - id: 17
      name: vendor_pricing_model
      label: Pricing Model
      hint: null
      type: select_one
      options:
      - Per Seat / User
      - Per Hire / Success-based
      - Flat Annual Subscription
      - Usage-based (Per Application)
      required: true
    - id: 18
      name: final_recommendation
      label: Final Recommendation
      hint: null
      type: select_one
      options:
      - Shortlist for Pilot
      - Approved for Purchase
      - Hold / Needs more info
      - Reject
      required: true
    - id: 19
      name: recommendation_justification
      label: Key Reasons for Recommendation
      hint: Strengths and weaknesses.
      type: text
      options: []
      required: true
    - id: 20
      name: action_items
      label: Next Steps / Action Items
      hint: null
      type: text
      options: []
      required: false
