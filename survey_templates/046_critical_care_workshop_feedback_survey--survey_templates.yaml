      - '{''label'': ''Excellent''}'
      - '{''label'': ''Good''}'
      - '{''label'': ''Fair''}'
      - '{''label'': ''Poor''}'
      required: false
    - id: 5
      name: workshop_organizers
      label: Workshop organizers
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: feedback_comments
      label: Feedback comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: additional_comments
