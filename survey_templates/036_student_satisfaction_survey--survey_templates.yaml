inputSchema:
  type: object
  properties:
    title: Student Satisfaction Survey
    pages:
    - id: 1
      name: student_feedback
      label: What did you think of the course?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: overall_rating
      label: Overall Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 3
      name: instructor_feedback
      label: How would you rate your instructor?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: false
    - id: 4
      name: course_feedback
      label: How would you rate your course?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: false
    - id: 5
      name: course_materials
      label: How would you rate the course materials?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: false
    - id: 6
      name: online_support
      label: How would you rate online support?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: false
    - id: 7
      name: communication
      label: How would you rate your instructor's communication?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: false
    - id: 8
      name: student_resources
      label: How would you rate student resources?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: false
    - id: 9
      name: course_length
      label: How long was the course?
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: time_spent_learning
      label: How much time did you spend learning?
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: student_satisfaction
      label: How satisfied are you with the course?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: student_satisfaction_reasons
      label: Why are you satisfied?
      hint: null
      type: note
      options: []
      required: false
