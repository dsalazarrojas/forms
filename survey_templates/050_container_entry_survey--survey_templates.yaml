inputSchema:
  type: object
  properties:
    title: Container Entry Survey
    pages:
    - id: 1
      name: survey_header
      label: Container Entry Survey
      hint: Document entry inspection
      type: note
      options: []
      required: false
    - id: 2
      name: survey_date
      label: Survey Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 3
      name: survey_time
      label: Survey Time
      hint: Time of inspection
      type: time
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_id
      label: Inspector ID
      hint: Employee number
      type: text
      options: []
      required: true
    - id: 6
      name: container_number
      label: Container Number
      hint: Unique ID
      type: text
      options: []
      required: true
    - id: 7
      name: seal_number
      label: Seal Number
      hint: Security seal
      type: text
      options: []
      required: true
    - id: 8
      name: seal_condition
      label: Seal Condition
      hint: On inspection
      type: select_one
      options:
      - Intact
      - Broken
      - Missing
      - Tampered
      required: true
    - id: 9
      name: container_type
      label: Container Type
      hint: Type and size
      type: select_one
      options:
      - Dry Van
      - Refrigerated
      - Open Top
      - Flat Rack
      - Tank
      - Other
      required: true
    - id: 10
      name: exterior_condition
      label: Exterior Condition
      hint: Overall state
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      required: true
    - id: 11
      name: exterior_damage
      label: Exterior Damage Details
      hint: Describe any damage
      type: text
      options: []
      required: false
    - id: 12
      name: interior_condition
      label: Interior Condition
      hint: Inside state
      type: select_one
      options:
      - Clean
      - Mostly Clean
      - Some Debris
      - Dirty
      - Contaminated
      required: true
    - id: 13
      name: interior_damage
      label: Interior Damage Details
      hint: Describe any damage
      type: text
      options: []
      required: false
    - id: 14
      name: odor_present
      label: Odor Present
      hint: Any smells
      type: select_one
      options:
      - Yes - Normal
      - Yes - Unusual
      - 'False'
      required: true
    - id: 15
      name: odor_description
      label: Odor Description
      hint: If present
      type: text
      options: []
      required: false
    - id: 16
      name: pests_evidence
      label: Evidence of Pests
      hint: Any infestation
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: pest_details
      label: Pest Details
      hint: Describe if found
      type: text
      options: []
      required: false
    - id: 18
      name: moisture_present
      label: Moisture or Water Damage
      hint: Any water issues
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: cargo_match
      label: Cargo Matches Documentation
      hint: Verification
      type: select_one
      options:
      - Yes - Exact Match
      - Yes - Minor Variations
      - No - Significant Differences
      required: true
    - id: 20
      name: cargo_description
      label: Cargo Description
      hint: What is inside
      type: text
      options: []
      required: true
    - id: 21
      name: cargo_quantity
      label: Cargo Quantity
      hint: Number of items
      type: number
      options: []
      required: true
    - id: 22
      name: temperature_reading
      label: Temperature Reading
      hint: If refrigerated
      type: number
      options: []
      required: false
    - id: 23
      name: photos_taken
      label: Photos Taken
      hint: Documentation photos
      type: select_one
      options:
      - Yes - Multiple
      - Yes - Few
      - 'False'
      required: true
    - id: 24
      name: inspection_result
      label: Inspection Result
      hint: Pass or fail
      type: select_one
      options:
      - Passed - No Issues
      - Passed - Minor Issues
      - Failed - Major Issues
      - Failed - Critical Issues
      required: true
    - id: 25
      name: corrective_action
      label: Corrective Action Required
      hint: What needs to be done
      type: text
      options: []
      required: false
    - id: 26
      name: follow_up_needed
      label: Follow-up Inspection Needed
      hint: Is reinspection required
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 27
      name: follow_up_date
      label: Follow-up Date
      hint: When to reinspect
      type: date
      options: []
      required: false
    - id: 28
      name: inspector_signature
      label: Inspector Signature
      hint: Digital signature
      type: text
      options: []
      required: true
