inputSchema:
  type: object
  properties:
    title: International Rating Assessment Survey
    pages:
    - id: 1
      name: country
      label: Country
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: satisfaction
      label: How would you rate your overall satisfaction with our service?
      hint: null
      type: select_multiple
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 3
      name: recommendation_intent
      label: On a scale of 1-5, how likely is it that you would recommend our service
        to a colleague or friend?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: service_quality
      label: How would you rate the quality of our service?
      hint: null
      type: select_multiple
      options:
      - Good
      - Poor
      required: false
    - id: 5
      name: improvement_suggestion
      label: Do you have any suggestions for how we can improve?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: comment
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: country_list
      label: Countries
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
