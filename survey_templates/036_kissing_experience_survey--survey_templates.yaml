inputSchema:
  type: object
  properties:
    title: kissing_experience_survey
    pages:
    - id: 1
      name: introduction
      label: What is your current relationship status?
      hint: null
      type: select_one
      options:
      - single
      - in a relationship
      - complicated
      required: true
    - id: 2
      name: relationship_length
      label: How long have you been in a relationship?
      hint: null
      type: select_multiple
      options:
      - 1-2 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - 5+ years
      required: false
    - id: 3
      name: kissing_frequency
      label: How often do you engage in kissing?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: comfort_level
      label: What is your comfort level with kissing?
      hint: null
      type: select_multiple
      options:
      - 1 - 10
      - 11 - 20
      - 21 - 30
      - 31 - 40
      - 41 - 50
      - more
      required: true
    - id: 5
      name: preferred_kissing_style
      label: What is your preferred kissing style?
      hint: null
      type: select_multiple
      options:
      - romantic
      - friendly
      - passionate
      - sensual
      required: false
    - id: 6
      name: kiss_on_the_cheek
      label: Do you enjoy kissing on the cheek?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - occasionally
      required: false
    - id: 7
      name: open_mouth
      label: Do you prefer open-mouthed kissing?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - occasionally
      required: false
    - id: 8
      name: tongue_in_the_mouth
      label: Do you engage in tongue-in-mouth kissing?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - occasionally
      required: false
    - id: 9
      name: duration_of_kiss
      label: How long does your average kiss last?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: number_of_kisses
      label: How many kisses do you give or receive per day?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: favorite_kissing_location
      label: What is your favorite place to get kissed?
      hint: null
      type: select_multiple
