inputSchema:
  type: object
  properties:
    title: Psychology Expert Feedback Form
    pages:
    - id: 1
      name: client_feedback
      label: Client Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: psychologist_feedback
      label: Psychologist Feedback
      hint: What do you think about the psychologist\'s approachability and effectiveness?
      type: note
      options: []
      required: false
    - id: 3
      name: communication_skills
      label: Communication Skills
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: false
    - id: 4
      name: empathy_level
      label: Empathy Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: session_length
      label: Session Length
      hint: How long was the session?
      type: number
      options: []
      required: false
    - id: 6
      name: psychologist_availability
      label: Psychologist Availability
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: date_of_session
      label: Date of Session
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time_of_session
      label: Time of Session
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: psychologist_name
      label: Psychologist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: therapist_rating
      label: Therapist Rating
      hint: null
      type: number
      options: []
      required: false
