inputSchema:
  type: object
  properties:
    title: Storyteller Event Feedback
    pages:
    - id: 1
      name: storytellereventfeedback
      label: What did you think
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: storytellereventfeedbackrating
      label: Overall rating
      hint: Rate on a scale of 1-5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 3
      name: storytellereventfeedbackquestion
      label: How would you like to see this story improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: storytellereventfeedbackratingforstory
      label: Rating for this Storyteller
      hint: Rate on a scale of 1-5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 5
      name: storytellerfeedbackemail
      label: Your Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 6
      name: storytellereventfeedbackphonenumber
      label: Your Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: storytellereventfeedbackdatevisited
      label: Date of visit
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: storytellereventfeedbacktimevisited
      label: Time of visit
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: storytellerfeedbacknotes
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
