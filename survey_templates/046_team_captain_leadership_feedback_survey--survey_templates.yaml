inputSchema:
  type: object
  properties:
    title: Team Captain Leadership Feedback Survey
    pages:
    - id: 1
      name: player_leadership_feedback
      label: Player Leadership Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: current_position
      label: Current Position
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: next_year
      label: What will you do next year
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: skills_developed
      label: What skills have you developed
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: skills_in_training
      label: What skills did you focus on in training
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: leadership_rating
      label: How would you rate your leadership
      hint: Rate on a scale from 1 to 10
      type: number
      options: []
      required: true
    - id: 7
      name: captain_expectations
      label: What do you expect from the captain
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: leadership_improvement
      label: What would you like to improve on leadership
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: next_season_goal
      label: What will be your goal for next season
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: next_season_skills
      label: What skills will you focus on in next season
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: required_skills
      label: What skills will be required from you
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: master_time
      label: How long will it take for you to master these skills
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: good_skills
      label: What skills would be good for your position
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: preferred_role
      label: What would be your preferred role
      hint: null
      type: select_one
      options:
      - Coach
      - Team Player
      - Assistant Coach
      - Other
      required: true
    - id: 15
      name: additional_comments
      label: Do you have any other comments
      hint: null
      type: text
      options: []
      required: false
