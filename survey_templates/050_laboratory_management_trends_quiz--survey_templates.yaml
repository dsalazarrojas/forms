inputSchema:
  type: object
  properties:
    title: Laboratory Management Trends Quiz
    pages:
    - id: 1
      name: role
      label: Your role in laboratory management
      hint: null
      type: select_one
      options:
      - Laboratory Manager
      - Scientist
      - Technician
      - Other
      required: true
    - id: 2
      name: role_type
      label: Your role type in laboratory management
      hint: null
      type: select_multiple
      options:
      - Laboratory Manager
      - Scientist
      - Technician
      - Other
      required: true
    - id: 3
      name: lab_management_trends
      label: What are the key trends in laboratory management?
      hint: null
      type: select_multiple
      options:
      - Automation
      - Data Analysis
      - Quality Control
      - Other
      required: true
    - id: 4
      name: challenges
      label: What are the key challenges in laboratory management?
      hint: null
      type: select_multiple
      options:
      - Time Management
      - Budget Management
      - Resource Management
      - Other
      required: true
    - id: 5
      name: technologies
      label: What technologies are being adopted in laboratory management?
      hint: null
      type: select_multiple
      options:
      - Laboratory Information Management Systems (LIMS)
      - Electronic Laboratory Notebooks (ELN)
      - Laboratory Robotics
      - Other
      required: true
    - id: 6
      name: technology_adoption
      label: Which technologies are being adopted in laboratory management?
      hint: null
      type: select_multiple
      options:
      - LIMS
      - ELN
      - Laboratory Robotics
      - Other
      required: true
    - id: 7
      name: technology_effectiveness
      label: How effective are the technologies in laboratory management?
      hint: null
      type: select_one
      options:
      - Highly effective
      - Somewhat effective
      - Not very effective
      required: true
    - id: 8
      name: benefits
      label: What are the benefits of technology adoption in laboratory management?
      hint: null
      type: select_multiple
      options:
      - Increased efficiency
      - Improved accuracy
      - Reduced costs
      required: true
    - id: 9
      name: challenges_tech
      label: What are the challenges of technology adoption in laboratory management?
      hint: null
      type: select_multiple
      options:
      - High costs
      - Limited accessibility
      - Training requirements
      required: true
    - id: 10
      name: tech_impact
      label: How does technology affect laboratory management?
      hint: null
      type: select_one
      options:
      - Positively
      - Negatively
      - Neutral
      required: true
    - id: 11
      name: future
      label: What is the future of laboratory management?
      hint: null
      type: select_one
      options:
      - Increased automation
      - Improved collaboration
      - Enhanced data analysis
      required: true
    - id: 12
      name: improvement
      label: How can laboratory management be improved?
      hint: null
      type: select_multiple
      options:
      - Improved communication
      - Enhanced training
      - Better resource allocation
      required: true
