      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_multiple
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 4
      name: feature_priorities
      label: Feature priorities
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: additional_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
