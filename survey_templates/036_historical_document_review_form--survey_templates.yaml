inputSchema:
  type: object
  properties:
    title: Historical Document Review Form
    pages:
    - id: 1
      name: document_type
      label: Document Type
      hint: null
      type: select_one
      options:
      - Document
      - Manuscript
      - Artifact
      required: false
    - id: 2
      name: date_of_publication
      label: Date of Publication
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: file_upload
      label: File Upload
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: rating
      label: Rating (out of 5)
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: comment
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: file_url
      label: File URL
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: file_description
      label: File Description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: file_size
      label: File Size (MB)
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: file_type
      label: File Type
      hint: null
      type: select_one
      options:
      - Text
      - Image
      - Audio
      - Video
      - Other
      required: false
    - id: 10
      name: file_format
      label: File Format
      hint: null
      type: select_one
      options:
      - PDF
      - JPEG
      - MP3
      - MP4
      - Other
      required: false
    - id: 11
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: reviewer_name
      label: Reviewer's Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: reviewer_title
      label: Reviewer's Title
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
