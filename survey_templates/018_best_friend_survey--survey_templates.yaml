inputSchema:
  type: object
  properties:
    title: Best Friend Survey
    pages:
      - id: 1
        name: friendship_survey_header
        label: -- Friendship Survey --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: your_full_name
        label: Your Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: friend_full_name
        label: Friend Name
        hint: Who are you taking this survey about
        type: text
        options: []
        required: true
      - id: 4
        name: knowledge_check_header
        label: -- Knowledge and Familiarity --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: middle_name_check
        label: Do you know their middle name
        hint: null
        type: select_one
        options:
          - Yes
          - No
          - I think so
        required: true
      - id: 6
        name: favorite_movie_check
        label: Do you know their favorite movie
        hint: null
        type: select_one
        options:
          - Yes
          - No
          - I think so
        required: true
      - id: 7
        name: favorite_musician_check
        label: Do you know their favorite musician
        hint: null
        type: select_one
        options:
          - Yes
          - No
          - I think so
        required: true
      - id: 8
        name: quality_check_header
        label: -- Friendship Quality --
        hint: null
        type: note
        options: []
        required: false
      - id: 9
        name: communication_frequency
        label: How often do you talk
        hint: Includes messaging and calls
        type: select_one
        options:
          - Every day
          - A few times a week
          - Once a week
          - Monthly
          - Less than monthly
        required: true
      - id: 10
        name: communication_methods
        label: How do you usually communicate
        hint: Select all that apply
        type: select_multiple
        options:
          - Text Messaging
          - Phone calls
          - Social Media DM
          - In-person hanging out
          - Video calls
        required: true
      - id: 11
        name: trust_rating
        label: How much do you trust them
        hint: 1 being not at all, 5 being completely
        type: select_one
        options:
          - 1 - Not at all
          - 2
          - 3
          - 4
          - 5 - Completely
        required: true
      - id: 12
        name: personhood_impact
        label: Do they make you a better person
        hint: In terms of growth and positivity
        type: select_one
        options:
          - Yes - definitely
          - Sometimes
          - No
        required: true
      - id: 13
        name: deep_friendship_header
