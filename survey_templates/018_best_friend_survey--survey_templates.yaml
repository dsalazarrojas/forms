        hint: null
        type: note
        options: []
        required: false
      - id: 14
        name: friendship_quality_priority
        label: What is the most important quality in a friend
        hint: Select one
        type: select_one
        options:
          - Loyalty
          - Honesty
          - Sense of Humor
          - Shared Interests
          - Kindness and Empathy
        required: true
      - id: 15
        name: helper_scenario
        label: If your friend was in trouble, how would you help
        hint: Describe your support style
        type: text
        options: []
        required: true
      - id: 16
        name: appreciation_description
        label: What do you appreciate most about this friend
        hint: null
        type: text
        options: []
        required: true
      - id: 17
        name: fun_header
        label: -- Just for Fun --
        hint: null
        type: note
        options: []
        required: false
      - id: 18
        name: show_characters
        label: If you were both characters in a show, which ones would you be
        hint: Name the show and the characters
        type: text
        options: []
        required: false
      - id: 19
        name: friendship_song
        label: What is your song
        hint: A song that reminds you of each other
        type: text
        options: []
        required: false
      - id: 20
        name: final_thoughts_header
        label: -- Final Thoughts --
        hint: null
        type: note
        options: []
        required: false
