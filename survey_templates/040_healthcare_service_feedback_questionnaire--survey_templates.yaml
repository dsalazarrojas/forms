inputSchema:
  type: object
  properties:
    title: Healthcare Service Feedback Questionnaire
    pages:
    - id: 1
      name: patient_name
      label: Enter patient name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_date
      label: Service date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: service_time
      label: Service time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: doctor_name
      label: Doctor name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Cardiology
      - Dermatology
      - Endocrinology
      - Gastroenterology
      - Internal Medicine
      - Nephrology
      - Neurology
      - Pulmonology
      required: false
    - id: 11
      name: doctor_specialty
      label: Doctor specialty
      hint: null
      type: select_multiple
      options:
      - Cardiology
      - Dermatology
      - Endocrinology
      - Gastroenterology
      - Internal Medicine
      - Nephrology
      - Neurology
      - Pulmonology
      required: false
