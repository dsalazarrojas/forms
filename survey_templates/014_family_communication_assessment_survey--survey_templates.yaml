inputSchema:
  type: object
  properties:
    title: Family Communication Assessment Survey
    pages:
    - id: 1
      name: intro_page
      label: Family Communication Assessment Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: communication_level
      label: How would you describe your family member’s communication level?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 3
      name: emotional_support
      label: Does your family member provide emotional support?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: conflict_level
      label: Conflict Level
      hint: How often do you get into arguments or conflicts with your family member?
      type: select_one
      options:
      - 0-1 time in a month
      - 2-3 times in a month
      - 4 or more times in a month
      required: false
    - id: 5
      name: communication_skills
      label: Communication skills
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: family_dynamics
      label: Family Dynamics
      hint: null
      type: select_one
      options:
      - Cooperative
      - Competitive
      - Independent
      - Authoritative
      required: false
    - id: 7
      name: conflict_resolution
      label: Conflict Resolution
      hint: null
      type: select_one
      options:
      - Collaborative
      - Individual
      - Avoiding
      - Frustrating
      required: false
    - id: 8
      name: emotional_maturity
      label: Emotional Maturity
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: conflict_frequency
      label: How often do you get into conflicts with your family member?
      hint: How often do you get into conflicts with your family member?
      type: select_one
      options:
      - 0-1 time in a month
      - 2-3 times in a month
      - 4 or more times in a month
      required: false
    - id: 10
      name: family_participation
      label: Family Participation
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 11
      name: support_measurement
      label: Support Measurement
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
