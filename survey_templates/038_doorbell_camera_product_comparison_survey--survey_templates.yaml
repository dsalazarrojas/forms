inputSchema:
  type: object
  properties:
    title: Doorbell Camera Product Comparison Survey
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: camera_model
      label: What is your current doorbell camera model?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: camera_features_1
      label: What features do you like about your current doorbell camera?
      hint: null
      type: select_multiple
      options:
      - Motion Detection
      - Night Vision
      - Motion Tracking
      - Face Detection
      - Weather Resistance
      required: false
    - id: 4
      name: connectivity_rating
      label: How would you rate your experience with your doorbell camera's connectivity?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: false
    - id: 5
      name: future_features_1
      label: Which of the following features would you like to see improved in future
        doorbell cameras?
      hint: null
      type: select_multiple
      options:
      - Motion Detection
      - Night Vision
      - Motion Tracking
      - Face Detection
      - Weather Resistance
      required: false
    - id: 6
      name: overall_satisfaction
      label: How would you rate your overall satisfaction with your doorbell camera?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: false
    - id: 7
      name: feedback
      label: Do you have any other comments or feedback about your doorbell camera?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_info_1
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: contact_info_2
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_info_3
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: contact_info_4
      label: How can we contact you?
      hint: null
      type: text
      options: []
      required: false
