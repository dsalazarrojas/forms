inputSchema:
  type: object
  properties:
    title: Participant Networking Feedback Questionnaire
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: event_id
      label: Event ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_time
      label: Date/Time
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: networking_experiences
      label: Networking Experiences
      hint: null
      type: select_multiple
      options:
      - Positive
      - Somewhat positive
      - Neutral
      - Somewhat negative
      - Negative
      required: true
    - id: 8
      name: networking_opportunities
      label: Networking Opportunities
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: improvements
      label: Improvements
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: suggestions
      label: Suggestions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
