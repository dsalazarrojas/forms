      name: support_usage
      label: Have You Used Support Services
      hint: Did you receive support
      type: select_one
      options:
      - Yes, Recently
      - Yes, Previously
      - No
      required: true
    - id: 6
      name: support_type
      label: Type of Support Received
      hint: What kind of support
      type: select_multiple
      options:
      - Consulting Services
      - Financial Advice
      - Training or Workshops
      - Marketing Support
      - Technical Support
      - Networking Events
      - Other
      required: false
    - id: 7
      name: support_accessibility
      label: Accessibility of Support Services
      hint: How easy was it to access support
      type: select_one
      options:
      - Very Easy
      - Easy
      - Adequate
      - Difficult
      - Very Difficult
      required: true
    - id: 8
      name: support_quality
      label: Quality of Support Services
      hint: Quality of service received
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 9
      name: response_timeliness
      label: Response Time and Timeliness
      hint: How quickly was help provided
      type: select_one
      options:
      - Very Timely
      - Timely
      - Acceptable
      - Slow
      - Very Slow
      required: true
    - id: 10
      name: expertise_level
      label: Expertise Level of Support Staff
      hint: Were staff knowledgeable
      type: select_one
      options:
      - Highly Knowledgeable
      - Knowledgeable
      - Adequate
      - Limited Knowledge
      - Lacking
      required: true
    - id: 11
      name: problem_resolution
      label: Problem Resolution
      hint: Were issues resolved
      type: select_one
      options:
      - Fully Resolved
      - Mostly Resolved
      - Partially Resolved
      - Not Resolved
