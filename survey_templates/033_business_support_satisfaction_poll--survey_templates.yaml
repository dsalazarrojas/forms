inputSchema:
  type: object
  properties:
    title: Business Support Satisfaction Poll
    pages:
    - id: 1
      name: business_owner_name
      label: Business Owner Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: business_name
      label: Business Name
      hint: Name of your business
      type: text
      options: []
      required: true
    - id: 3
      name: business_type
      label: Type of Business
      hint: Industry or business sector
      type: text
      options: []
      required: false
    - id: 4
      name: poll_date
      label: Poll Date
      hint: Date of this poll
      type: date
      options: []
      required: true
