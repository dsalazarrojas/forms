inputSchema:
  type: object
  properties:
    title: product-launch-health-survey
    pages:
    - id: 1
      name: survey_intro
      label: Survey Intro
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very High
      - High
      - Medium
      - Low
      - Very Low
      required: false
    - id: 3
      name: recommendation_score
      label: Recommendation Score
      hint: On a 1-5 scale, how likely are you to recommend this product?
      type: number
      options: []
      required: false
    - id: 4
      name: improvement_ideas
      label: What can we improve in our product?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: satisfaction_with_product_features
      label: Satisfaction with Product Features
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: satisfaction_with_product_performance
      label: Satisfaction with Product Performance
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
