inputSchema:
  type: object
  properties:
    title: Shipping Options Feedback Questionnaire
    pages:
    - id: 1
      name: shipping_speed
      label: What is your preferred shipping speed?
      hint: null
      type: select_one
      options:
      - Same Day
      - 1-3 business days
      - 2-5 business days
      required: false
    - id: 2
      name: shipping_frequency
      label: How often do you like to receive shipments?
      hint: null
      type: select_one
      options:
      - Never
      - Monthly
      - Weekly
      - Bi-Weekly
      required: false
    - id: 3
      name: shipping_method
      label: What is your preferred shipping method?
      hint: null
      type: select_one
      options:
      - Standard Shipping
      - Express Shipping
      required: false
    - id: 4
      name: shipping_service_provider
      label: Which shipping service provider do you usually use?
      hint: null
      type: select_one
      options:
      - UPS
      - USPS
      - FedEx
      required: false
    - id: 5
      name: shipping_cost
      label: What is your average shipping cost expectation?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: overall_satisfaction
      label: How satisfied are you overall with the shipping service?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 7
      name: shipping_frequency_2
      label: Shipping Frequency 2
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      - Quarterly
      required: false
    - id: 8
      name: shipping_preferences
      label: What are your shipping preferences?
      hint: null
      type: select_multiple
      options:
      - Fastest
      - Easiest
      - Cheapest
      required: false
    - id: 9
      name: shipping_comments
      label: Do you have any comments on the shipping options?
      hint: null
      type: text
      options: []
      required: false
