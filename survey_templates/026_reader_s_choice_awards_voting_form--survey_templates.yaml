inputSchema:
  type: object
  properties:
    title: Reader's Choice Awards Voting Form
    pages:
    - id: 1
      name: award_category
      label: Award Category
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: award_name
      label: Award Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: nomination_reason
      label: Nomination Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: award_winner
      label: Award Winner
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: nomination_date
      label: Nomination Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: award_year
      label: Year
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: nomination_status
      label: Nomination Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 8
      name: nomination_type
      label: Nomination Type
      hint: null
      type: select_one
      options:
      - Individual
      - Team
      required: false
