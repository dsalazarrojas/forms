inputSchema:
  type: object
  properties:
    title: Wing Walk Participation Survey
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: perceived_safety
      label: Perceived Safety
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: suggestions
      label: Suggestions
      hint: null
      type: select_multiple
      options:
      - Improving safety measures
      - Enhancing overall experience
      - Improving communication
      - Better food and beverages
      - Other
      required: false
    - id: 5
      name: event_safety_measures
      label: Event Safety Measures
      hint: null
      type: select_multiple
      options:
      - Safety briefing provided
      - Emergency contact info provided
      - Safety checks in place
      - Safety equipment available
      - Other
      required: false
    - id: 6
      name: participant_safety
      label: Participant Safety
      hint: null
      type: select_multiple
      options:
      - Received safety instructions
      - Followed safety guidelines
      - Responsible staff available
      - Other
      required: false
    - id: 7
      name: event_satisfaction
      label: Event Satisfaction
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submission
      label: Submission
      hint: null
      type: select_one
      options:
      - I am happy with my experience
      - Not happy with my experience
      - Unhappy with my experience
      - Other
      required: false
    - id: 12
      name: follow_up
      label: Follow up
      hint: null
      type: select_one
      options:
      - Yes, we may follow up with you
      - No, not interested
      - Not sure
      required: false
