inputSchema:
  type: object
  properties:
    title: School Withdrawal Survey
    pages:
    - id: 1
      name: personal_info
      label: Personal Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: grade
      label: Grade Level
      hint: null
      type: select_one
      options:
      - Elementary
      - Middle School
      - High School
      required: false
    - id: 4
      name: reason_for_leaving
      label: Reason For Leaving
      hint: null
      type: select_multiple
      options:
      - I agree
      - I do not agree
      required: false
    - id: 5
      name: thoughts
      label: Thoughts
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
