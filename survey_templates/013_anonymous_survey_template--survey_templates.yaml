inputSchema:
  type: object
  properties:
    title: Anonymous Survey Template
    pages:
    - id: 1
      name: company_role
      label: Your Current Role
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tenure_period
      label: How long have you been with the company?
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 3
      name: management_satisfaction
      label: Satisfaction with Management
      hint: 1 to 5 scale
      type: number
      options: []
      required: true
    - id: 4
      name: work_life_balance
      label: Work-Life Balance Rating
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 5
      name: compensation_satisfaction
      label: Compensation and Benefits Satisfaction
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Dissatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 6
      name: growth_opportunities
      label: Professional Growth Opportunities
      hint: null
      type: select_one
      options:
      - Limited
      - Adequate
      - Plentiful
      required: true
    - id: 7
      name: company_culture
      label: Company Culture Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: resources_adequacy
      label: Are tools and resources adequate for your job?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: change_suggestion
      label: One thing you would change about the company
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: keep_suggestion
      label: One thing we should definitely keep doing
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: overall_morale
      label: How would you describe team morale?
      hint: null
      type: text
      options: []
      required: false
