      type: select_multiple
      options:
      - Very Important
      - Somewhat Important
      - Not Important
      required: false
    - id: 9
      name: follow_up_frequency
      label: Follow-up Frequency
      hint: null
      type: select_one
      options:
      - 1-10
      - 11-20
      - 21-30
      - 31-40
      - 41-50
      required: true
