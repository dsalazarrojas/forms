inputSchema:
  type: object
  properties:
    title: Student Satisfaction With Academic Services Evaluation Form
    pages:
    - id: 1
      name: student_satisfaction_with_academic_services_evaluation_form_1
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: academic_services_importance
      label: Academic Services Importance
      hint: null
      type: select_multiple
      options:
      - Very Important
      - Somewhat Important
      - Not Important
      required: true
    - id: 3
      name: academic_services_quality
      label: Academic Services Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: Please provide more information about your response
      type: note
      options: []
      required: false
    - id: 5
      name: contact_information
      label: Contact Information
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: academic_services_response_time
      label: Academic Services Response Rate
      hint: null
      type: select_one
      options:
      - 1-10
      - 11-20
      - 21-30
      - 31-40
      - 41-50
      required: true
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction (2)
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: academic_services_importance_multiple
      label: Academic Services Importance Multiple
