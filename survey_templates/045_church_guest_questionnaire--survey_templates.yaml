inputSchema:
  type: object
  properties:
    title: Church Guest Questionnaire
    pages:
      - id: 1
        name: guest_name_questionnaire
        label: Your Name
        hint: null
        type: text
        options: []
        required: false
      - id: 2
        name: guest_age_range
        label: Age Range
        hint: null
        type: select_one
        options: [Under 18, 18-30, 31-45, 46-60, 61+]
        required: false
      - id: 3
        name: guest_email_questionnaire
        label: Email Address
        hint: null
        type: email
        options: []
        required: false
      - id: 4
        name: header_referral
        label: -- How You Found Us --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: discovery_source
        label: How did you find the church?
        hint: null
        type: select_one
        options: [Friend/Family, Social Media, Website, Local Ad, Driven By, Other]
        required: true
      - id: 6
        name: first_impression_rating
        label: Rate your first impression upon entering the building
        hint: null
        type: select_one
        options: [Excellent, Good, Average, Poor]
        required: true
      - id: 7
        name: header_service_feedback_guest
        label: -- Service Experience --
        hint: null
        type: note
        options: []
        required: false
      - id: 8
        name: music_experience_rating
        label: Rate the music/worship experience
        hint: Style, quality, volume
        type: select_one
        options: [Excellent, Good, Fair, Not for me]
        required: true
      - id: 9
        name: teaching_quality_rating
        label: Rate the teaching/sermon quality
        hint: Clarity, relevance, engagement
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 10
        name: best_part_reason
        label: What did you like the best? Why?
        hint: null
        type: text
        options: []
        required: true
      - id: 11
        name: greeting_experience
        label: Did someone greet you or speak with you?
        hint: null
        type: select_one
        options: [Yes - Very friendly, Yes - Brief, No - I was not greeted]
        required: true
      - id: 12
        name: header_logistics_guest
        label: -- Logistics and Amenities --
        hint: null
        type: note
        options: []
        required: false
      - id: 13
        name: signage_finding_way
        label: Was it easy to find your way around?
        hint: Signs for restrooms, kids area, etc.
        type: select_one
        options: [Very Easy, Easy, Confusing]
        required: true
      - id: 14
        name: kids_ministry_rating
        label: If you have children - how was their experience?
        hint: Leave blank if not applicable
        type: select_one
        options: [Excellent, Good, Fair, Poor, N/A]
        required: false
      - id: 15
        name: suggestion_box_guest
        label: What is one suggestion you have for us?
        hint: null
        type: text
        options: []
        required: false
      - id: 16
        name: future_contact_permission
        label: Would you like someone from our team to contact you?
        hint: Just to say hello and answer questions
        type: select_one
        options: [Yes - Phone, Yes - Email, No thanks]
        required: true
      - id: 17
        name: question_for_pastor
        label: Do you have a question for the Pastor?
        hint: null
        type: text
        options: []
        required: false
      - id: 18
        name: submission_date_guest
        label: Today's Date
        hint: null
        type: date
        options: []
        required: true
