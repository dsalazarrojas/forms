inputSchema:
  type: object
  properties:
    title: Fire Safety Compliance Feedback Survey
    pages:
    - id: 1
      name: facility_info
      label: Fire Safety Facility Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: fire_equipment
      label: Fire Safety Equipment
      hint: null
      type: select_one
      options:
      - Functional
      - Non-Functional
      - Not Tested
      required: false
    - id: 3
      name: drill_frequency
      label: Fire Drill Frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Less Often
      required: false
    - id: 4
      name: safety_practices
      label: Safety Practices
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
