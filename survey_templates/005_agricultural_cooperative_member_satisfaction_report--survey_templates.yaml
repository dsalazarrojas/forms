inputSchema:
  type: object
  properties:
    title: Agricultural Cooperative Member Satisfaction Report
    pages:
    - id: 1
      name: member_info_header
      label: -- Member Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: member_name
      label: Member Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: member_id
      label: Member ID
      hint: Your unique cooperative ID
      type: text
      options: []
      required: true
    - id: 4
      name: membership_duration
      label: Membership Duration
      hint: How long have you been a member?
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 5
      name: farm_type
      label: Farm Type
      hint: Primary agricultural activity
      type: select_one
      options:
      - Crop Farming
      - Livestock
      - Mixed Farming
      - Dairy
      - Horticulture
      - Other
      required: true
    - id: 6
      name: satisfaction_header
      label: -- Satisfaction Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_satisfaction
      label: Satisfaction with Services
      hint: Overall satisfaction with cooperative services
      type: select_one
      options:
      - Very Dissatisfied
      - Dissatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 8
      name: supplies_quality
      label: Quality of Supplies
      hint: How do you rate the supplies provided?
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      - N/A
      required: true
    - id: 9
      name: pricing_fairness
      label: Pricing Fairness
      hint: Are the prices competitive and fair?
      type: select_one
      options:
      - Unfair
      - Fair
      - Very Fair
      required: true
    - id: 10
      name: support_staff
      label: Support Staff Helpfulness
      hint: Rating of staff interactions
      type: select_one
      options:
      - Not Helpful
      - Somewhat Helpful
      - Very Helpful
      required: true
    - id: 11
      name: communication
      label: Communication Effectiveness
      hint: How well does the co-op keep you informed?
      type: select_one
      options:
      - Ineffective
      - Effective
      - Very Effective
      required: true
    - id: 12
      name: feedback_header
      label: -- Feedback and Comments --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: improvements
      label: Suggestions for Improvement
      hint: What can we do better?
      type: text
      options: []
      required: false
    - id: 14
      name: likelihood_recommend
      label: Likelihood to Recommend
      hint: 1 to 10 scale (10 being most likely)
      type: number
      options: []
      required: true
    - id: 15
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback?
      type: text
      options: []
      required: false
