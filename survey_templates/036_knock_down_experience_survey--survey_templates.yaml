inputSchema:
  type: object
  properties:
    title: Knock Down Experience Survey
    pages:
    - id: 1
      name: survey_header
      label: Knock Down Experience Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: site
      label: Site
      hint: Enter the site address
      type: text
      options: []
      required: false
    - id: 4
      name: team
      label: Team
      hint: Enter the team name
      type: text
      options: []
      required: false
    - id: 5
      name: service_type
      label: Service Type
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: experience_rating
      label: Experience Rating
      hint: Scale 1-5
      type: select_one
      options:
      - Very Poor
      - Poor
      - Average
      - Good
      - Excellent
      required: true
    - id: 7
      name: comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
