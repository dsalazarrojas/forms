inputSchema:
  type: object
  properties:
    title: Insomnia Questionnaire
    pages:
    - id: 1
      name: sleep_history
      label: Sleep History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: sleep_quality
      label: Sleep Quality
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: sleep_onset
      label: Sleep Onset
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: sleep_duration
      label: Sleep Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: sleep_efficiency
      label: Sleep Efficiency
      hint: null
      type: number
      options: []
      required: false
