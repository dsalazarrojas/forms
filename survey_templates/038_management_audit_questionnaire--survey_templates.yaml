inputSchema:
  type: object
  properties:
    title: Management Audit Questionnaire
    pages:
    - id: 1
      name: current_position
      label: What is your current role/position in the company?
      hint: Please specify your role/position.
      type: text
      options: []
      required: true
    - id: 2
      name: short_term_goals
      label: What are your short-term goals?
      hint: Please specify your short-term goals.
      type: text
      options: []
      required: true
    - id: 3
      name: long_term_goals
      label: What are your long-term goals?
      hint: Please specify your long-term goals.
      type: text
      options: []
      required: true
    - id: 4
      name: how_goals_are_achieved
      label: How do you currently achieve your goals?
      hint: Please specify how you currently achieve your goals.
      type: select_multiple
      options:
      - Regularly
      - Sporadically
      - Other
      required: true
    - id: 5
      name: how_goals_are_planned
      label: How often do you plan to achieve your goals?
      hint: Please specify how often you plan to achieve your goals.
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Yearly
      required: true
    - id: 6
      name: evaluation_methods
      label: What are your current evaluation methods?
      hint: Please specify your evaluation methods.
      type: text
      options: []
      required: true
    - id: 7
      name: agreement_statements
      label: How much do you agree or disagree with the following statements?
      hint: Please select an option for each statement.
      type: select_multiple
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neither Agree nor Disagree
      - Somewhat Disagree
      - Strongly Disagree
      required: true
    - id: 8
      name: management_style
      label: What is your current management style?
      hint: Please specify your management style.
      type: text
      options: []
      required: true
    - id: 9
      name: monitoring_frequency
      label: How often do you monitor your performance?
      hint: Please specify how often you monitor your performance.
      type: select_multiple
      options:
      - Regularly
      - Sporadically
      - Other
      required: true
    - id: 10
      name: goal_review
      label: How often do you review and adjust your goals?
      hint: Please specify how often you review and adjust your goals.
      type: select_multiple
      options:
      - Regularly
      - Sporadically
      - Other
      required: true
    - id: 11
      name: performance_comment
      label: What are your comments about your performance?
      hint: Please provide your comments about your performance.
      type: text
      options: []
      required: false
    - id: 12
      name: suggestion_for_improvement
      label: What are your suggestions for improvement?
      hint: Please provide your suggestions for improvement.
      type: text
      options: []
      required: false
    - id: 13
      name: self_rating
      label: How do you rate your overall performance?
      hint: Please rate your overall performance.
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: end_comments
      label: What are your comments?
      hint: Please provide your comments.
      type: text
      options: []
      required: false
