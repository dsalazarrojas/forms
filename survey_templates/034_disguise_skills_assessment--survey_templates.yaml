      - Intermediate
      - Advanced
      - Expert
      required: false
    - id: 5
      name: self_assessment
      label: Self-Assessment
      hint: null
      type: select_multiple
      options:
      - Acting
      - Communication
      - CPR/First Aid
      - Event Planning
      - Improv
      - Leadership
      - Marketing
      - Networking
      - Presentation
      - Teaching
      - Time Management
      - Writing
      required: false
    - id: 6
      name: additional_skills
      label: Additional Skills
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: evaluation_time
      label: Evaluation Time
      hint: null
      type: time
      options: []
      required: false
