inputSchema:
  type: object
  properties:
    title: Disguise Skills Assessment
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_name
      label: event_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: session_length
      label: Session Length
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: skill_level
      label: Self-Assessed Skill Level
      hint: null
      type: select_one
      options:
