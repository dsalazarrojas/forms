inputSchema:
  type: object
  properties:
    title: Software Features And Functions Survey
    pages:
    - id: 1
      name: intro_page
      label: Intro Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: section1
      label: Features
      hint: What are your thoughts about these features?
      type: select_multiple
      options:
      - Feature 1
      - Feature 2
      required: false
    - id: 3
      name: section2
      label: Performance
      hint: How do these features perform?
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: section3
      label: Usability
      hint: How do you rate these features in terms of usability?
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: section4
      label: Comments
      hint: null
      type: note
      options: []
      required: false
