inputSchema:
  type: object
  properties:
    title: Automotive Service Feedback Form
    pages:
    - id: 1
      name: section_header_customer
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: customer_id
      label: Customer ID or Account Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_service
      label: -- Service Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: service_type
      label: Type of Service Performed
      hint: null
      type: select_multiple
      options:
      - Oil Change
      - Tire Service
      - Brake Service
      - General Maintenance
      - Diagnostic Service
      - Repair
      - Inspection
      - Other
      required: true
    - id: 9
      name: service_advisor
      label: Service Advisor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: mechanic_assigned
      label: Mechanic or Technician Assigned
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: section_header_satisfaction
      label: -- Service Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: overall_satisfaction
      label: Overall Satisfaction with Service
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 13
      name: quality_of_work
      label: Quality of Work Performed
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: timeliness
      label: Timeliness of Service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: communication
      label: Communication with Advisor
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: cleanliness
      label: Facility Cleanliness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: value_for_money
      label: Value for Money
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 18
      name: section_header_feedback
      label: -- Detailed Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: what_went_well
      label: What Did We Do Well
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: improvement_areas
      label: Areas for Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: section_header_recommendation
      label: -- Recommendation --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: recommend_service
      label: Would You Recommend Our Service
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably Not
      - Definitely Not
      required: true
    - id: 23
      name: recommend_likelihood
      label: Likelihood of Returning
      hint: null
      type: select_one
      options:
      - Very Likely
      - Likely
      - Uncertain
      - Unlikely
      - Very Unlikely
      required: true
    - id: 24
      name: section_header_followup
      label: -- Follow-up --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: contact_about_feedback
      label: May We Contact You About Your Feedback
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
