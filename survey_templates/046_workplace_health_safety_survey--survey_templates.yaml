inputSchema:
  type: object
  properties:
    title: Workplace Health Safety Survey
    pages:
    - id: 1
      name: page_1
      label: What is your work environment like?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: page_2
      label: Have you experienced any workplace hazards?
      hint: null
      type: select_one
      options:
      - Agreed and reported the incident
      - Not reported the incident
      - Did not experience
      required: true
    - id: 3
      name: page_3
      label: Do you know how to access the company's safety and health policy documents?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: page_4
      label: Have you ever reported a safety or health issue?
      hint: null
      type: select_one
      options:
      - Always
      - Frequently
      - Sometimes
      - Never
      required: true
    - id: 5
      name: page_5
      label: Do you have access to a personal protective equipment (PPE) when needed?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 6
      name: page_6
      label: Do you feel supported by your supervisor or manager regarding workplace
        safety?
      hint: null
      type: select_multiple
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Strongly disagree
      required: true
    - id: 7
      name: page_7
      label: How often do you feel that your work environment is safe?
      hint: null
      type: select_one
      options:
      - Always safe
      - Mostly safe
      - Sometimes safe
      - Not safe
      - Not at all safe
      required: true
    - id: 8
      name: page_8
      label: Would you like to report incidents or concerns regarding work safety
        or health?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 9
      name: page_9
      label: Would you report the incident if you experienced or observed it?
      hint: null
      type: select_one
      options:
      - I would report it
      - Not sure
      - Not report it
      required: true
    - id: 10
      name: page_10
      label: How confident are you in the company's ability to handle reports of incidents
        or concerns?
      hint: null
      type: select_one
      options:
      - Very confident
      - Somewhat confident
      - Neutral
      - Somewhat not confident
      - Not confident at all
      required: true
    - id: 11
      name: page_11
      label: How often do you experience stress or anxiety related to work?
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      - Never
      required: true
