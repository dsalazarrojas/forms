          - Lacerations
          - Burns
          - Fractures
          - Contusions
          - Abrasions
          - Scarring
          - Swelling
          - Other
        required: false
      - id: 18
        name: injury_severity
        label: Overall Injury Severity
        hint: null
        type: select_one
        options:
          - Minor
          - Moderate
          - Severe
          - Critical
          - No Injuries
        required: true
