inputSchema:
  type: object
  properties:
    title: Environmental Workshop Success Questionnaire
    pages:
    - id: 1
      name: session_quality
      label: How did you feel about the session
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: session_impact
      label: What impact did you gain from this session
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: meeting_learning_objectives
      label: Did you achieve the learning objectives
      hint: Please check all that apply
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 4
      name: session_attendance
      label: How many people attended
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: facilitator
      label: How would you rate the facilitator
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: true
    - id: 6
      name: materials
      label: What materials were provided
      hint: Please check all that apply
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: true
    - id: 8
      name: session_satisfaction
      label: How satisfied were you with this session
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: true
    - id: 9
      name: recommendations
      label: What could be improved
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: session_goals
      label: Did the session meet your goals
      hint: Please check all that apply
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 11
      name: time_management
      label: How well did we manage the time
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: true
    - id: 12
      name: follow_up
      label: Would you like to receive follow-up information
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: true
    - id: 13
      name: session_length
      label: How long was the session
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: session_location
      label: Was the location good for you
      hint: Please check all that apply
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: false
    - id: 15
      name: session_notes
      label: Additional notes
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: follow_up_contact
      label: How to contact you
      hint: Please check all that apply
      type: select_multiple
      options:
      - Email
      - Phone
      - Other
      required: false
    - id: 17
      name: follow_up_method
      label: How do you want to be contacted
      hint: Please check all that apply
      type: select_multiple
      options:
      - Email
      - Phone
      - Other
      required: false
    - id: 18
      name: follow_up_frequency
      label: How often would you like to be contacted
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Never
      required: false
    - id: 19
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 20
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: session_date
      label: Session date
      hint: null
      type: date
      options: []
      required: false
    - id: 22
      name: session_start_time
      label: Session start time
      hint: null
      type: time
      options: []
      required: false
    - id: 23
      name: session_end_time
      label: Session end time
      hint: null
      type: time
      options: []
      required: false
    - id: 24
      name: session_duration
      label: Session duration
      hint: null
      type: number
      options: []
      required: false
    - id: 25
      name: follow_up
      label: Follow-up
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: true
