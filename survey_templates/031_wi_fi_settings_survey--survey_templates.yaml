inputSchema:
  type: object
  properties:
    title: Wi-Fi Settings Survey
    pages:
    - id: 1
      name: current_provider
      label: What is your current Wi-Fi network provider?
      hint: Please select your current provider.
      type: select_one
      options:
      - Verizon
      - AT&T
      - T-Mobile
      - Other
      required: false
    - id: 2
      name: devices_connected
      label: How many devices are connected to your Wi-Fi network?
      hint: Please count the number of devices connected to your network.
      type: number
      options: []
      required: false
    - id: 3
      name: preferred_speed
      label: What is your preferred Wi-Fi speed?
      hint: Select your preferred speed.
      type: select_one
      options:
      - Low (1-10 Mbps)
      - Medium (11-50 Mbps)
      - High (51-100 Mbps)
      - Very High (100+ Mbps)
      required: false
    - id: 4
      name: streaming_frequency
      label: How often do you use your Wi-Fi for streaming?
      hint: Select how often you stream.
      type: select_one
      options:
      - Daily
      - Weekly
      - Rarely
      required: false
    - id: 5
      name: connection_issues
      label: Do you have any issues with your current Wi-Fi connection?
      hint: Check the box if you have issues.
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 6
      name: devices_at_home
      label: How many devices do you typically use on your Wi-Fi network at home?
      hint: Please count the devices.
      type: number
      options: []
      required: false
    - id: 7
      name: monthly_data
      label: How much data do you use per month on your Wi-Fi network?
      hint: Estimate your monthly data usage.
      type: number
      options: []
      required: false
    - id: 8
      name: router_or_access_point
      label: Do you use a router or access point for your Wi-Fi?
      hint: Check the box if you use a router.
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: internet_plan_speed
      label: What is your current internet plan speed?
      hint: Please select your speed.
      type: select_one
      options:
      - Low (1-5 Mbps)
      - Medium (6-20 Mbps)
      - High (21-50 Mbps)
      - Very High (51+ Mbps)
      required: false
    - id: 10
      name: users_at_network
      label: How many users are connected to your Wi-Fi network?
      hint: Estimate the number of users.
      type: number
      options: []
      required: false
    - id: 11
      name: wifi_issues_at_home_work
      label: Do you have any Wi-Fi-related issues at home or work?
      hint: Check the box if you have issues.
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 12
      name: plan_to_increase_speed
      label: Do you plan to increase your Wi-Fi speed in the next 6 months?
      hint: Check the box if you plan to increase speed.
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
