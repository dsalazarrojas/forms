inputSchema:
  type: object
  properties:
    title: Air Care Service Feedback Survey
    pages:
    - id: 1
      name: service_details_header
      label: -- Service Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: service_date
      label: Date of Service
      hint: When did we visit?
      type: date
      options: []
      required: true
    - id: 4
      name: technician_name
      label: Technician Name
      hint: Who performed the service?
      type: text
      options: []
      required: false
    - id: 5
      name: service_type
      label: Type of Service
      hint: What work was done?
      type: select_one
      options:
      - Routine Maintenance / Tune-up
      - Emergency Repair
      - New System Installation
      - Duct Cleaning
      - Air Quality Assessment
      required: true
    - id: 6
      name: ratings_header
      label: -- Service Ratings --
      hint: 1 = Poor, 5 = Excellent
      type: note
      options: []
      required: false
    - id: 7
      name: timeliness
      label: Timeliness
      hint: Did the tech arrive on time?
      type: select_one
      options:
      - 1 (Very Late)
      - 2
      - 3
      - 4
      - 5 (On Time)
      required: true
    - id: 8
      name: professionalism
      label: Professionalism
      hint: Was the tech courteous?
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 9
      name: quality_work
      label: Quality of Work
      hint: Was the job done right?
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 10
      name: cleanliness
      label: Cleanliness
      hint: Was the work area left clean?
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 11
      name: issue_resolved
      label: Was your issue resolved?
      hint: Is the system working?
      type: select_one
      options:
      - true
      - false
      - Partially
      required: true
    - id: 12
      name: recommendation
      label: Likelihood to Recommend
      hint: 1 to 10 scale
      type: number
      options: []
      required: true
    - id: 13
      name: comments
      label: Additional Comments
      hint: Any other feedback?
      type: text
      options: []
      required: false
