inputSchema:
  type: object
  properties:
    title: MPH Concentration Change Survey
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: reason_for_request
      label: reason_for_request
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rationale
      label: Rationale
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: advisor_comments
      label: Advisor Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: new_concentration
      label: New Concentration
      hint: null
      type: select_one
      options:
      - Concentration A
      - Concentration B
      - Concentration C
      required: false
    - id: 6
      name: current_concentration
      label: Current Concentration
      hint: null
      type: select_one
      options:
      - Concentration A
      - Concentration B
      - Concentration C
      required: false
    - id: 7
      name: expected_graduation_date
      label: Expected Graduation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: expected_graduation_time
      label: Expected Graduation Time
      hint: null
      type: time
      options: []
      required: false
