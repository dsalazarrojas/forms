inputSchema:
  type: object
  properties:
    title: Technology Access And Attendance Survey
    pages:
    - id: 1
      name: technology_access
      label: What devices do you have access to?
      hint: null
      type: select_multiple
      options:
      - Laptop
      - Desktop
      - Tablet
      - Mobile
      - Other
      required: false
    - id: 2
      name: internet_reliability
      label: How often is your internet unreliable?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Seldom
      - Rarely
      - Never
      required: false
    - id: 3
      name: attendance_barriers
      label: Which of the following tech-related attendance barriers do you have?
      hint: null
      type: select_multiple
      options:
      - Device-related issues
      - Internet connection issues
      - Other (please specify)
      required: false
    - id: 4
      name: tech_issues_other
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: school_attendance
      label: How often do you attend school?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: school_attendance_frequency
      label: What is the frequency of your school attendance?
      hint: null
      type: select_one
      options:
      - Every day
      - 2-3 times a week
      - 1-2 times a month
      - Less than a month
      required: false
    - id: 7
      name: tech_issues_school
      label: What kind of tech issues do you experience at school?
      hint: null
