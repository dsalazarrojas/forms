inputSchema:
  type: object
  properties:
    title: Wildlife Management Strategy Survey
    pages:
    - id: 1
      name: introduction
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: conservation_plan
      label: What is the most critical conservation issue in your area?
      hint: null
      type: select_one
      options:
      - habitat loss
      - pollution
      - overhunting
      - climate change
      - other
      required: true
    - id: 3
      name: conservation_plan_2
      label: How do you think we can best address this issue?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: wildlife_policy
      label: What do you think is the primary goal of wildlife management?
      hint: null
      type: select_one
      options:
      - protecting wildlife
      - managing wildlife populations
      - balancing human wildlife interactions
      - other
      required: true
    - id: 5
      name: wildlife_policy_2
      label: Do you think wildlife management policies are effective?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - undecided
      required: true
    - id: 6
      name: stakeholder_input
      label: How do you think stakeholders should be involved in wildlife management
        decision-making?
      hint: null
      type: select_multiple
      options:
      - local communities
      - conservationists
      - government agencies
      - researchers
      - other
      required: true
    - id: 7
      name: stakeholder_input_2
      label: What role do you think you play in wildlife management decision-making?
      hint: null
      type: select_one
      options:
      - leader
      - advisor
      - participant
      - other
      required: true
    - id: 8
      name: contact_information
      label: How can we reach you for follow-up questions?
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: contact_information_2
      label: What is your phone number (or leave blank if you don't want to be contacted)?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: contact_information_3
      label: What is your location (e.g., country, region, or city)?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: additional_information
      label: Do you have any additional comments or concerns about wildlife management?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: additional_information_2
      label: Is there anything else you would like to share with us?
      hint: null
      type: text
      options: []
      required: false
