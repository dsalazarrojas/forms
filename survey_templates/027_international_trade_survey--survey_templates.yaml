inputSchema:
  type: object
  properties:
    title: International Trade Survey
    pages:
    - id: 1
      name: markets_served
      label: Markets Served
      hint: null
      type: select_multiple
      options:
      - domestic
      - international
      - both
      required: true
    - id: 2
      name: trade_volumes
      label: Trade Volumes
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: trade_challenges
      label: Trade Challenges
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: trade_bodies_served
      label: Trade Bodies Served
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: consultants_involved
      label: Consultants Involved
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: researchers_involved
      label: Researchers Involved
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: research_areas
      label: Research Areas
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: market_characteristics
      label: Market Characteristics
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: trade_partnerships
      label: Trade Partnerships
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: trade_events_participation
      label: Trade Events Participation
      hint: Select the frequency of participation in trade events
      type: select_one
      options:
      - daily
      - weekly
      - monthly
      - quarterly
      required: false
    - id: 11
      name: trade_documentation
      label: Trade Documentation
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
