inputSchema:
  type: object
  properties:
    title: Chiropractic Survey
    pages:
      - id: 1
        name: respondent_name
        label: Respondent Name
        hint: Optional patient name
        type: text
        options: []
        required: false
      - id: 2
        name: visit_date
        label: Visit Date
        hint: Date of service
        type: date
        options: []
        required: false
      - id: 3
        name: satisfaction_level
        label: Satisfaction Level
        hint: Rate overall satisfaction
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
        required: true
      - id: 4
        name: wait_time_experience
        label: Wait Time Experience
        hint: How long did you wait
        type: select_one
        options:
          - Under 10 minutes
          - 10 to 30 minutes
          - Over 30 minutes
        required: false
      - id: 5
        name: staff_professionalism
        label: Staff Professionalism
        hint: Rate staff interactions
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 6
        name: additional_feedback
        label: Additional Feedback
        hint: Any other comments or suggestions
        type: text
        options: []
        required: false
