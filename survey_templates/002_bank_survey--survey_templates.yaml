inputSchema:
  type: object
  properties:
    title: Bank Survey
    pages:
      - id: 1
        name: survey_header
        label: -- Customer Experience Survey
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Respondent Name
        hint: Optional full name
        type: text
        options: []
        required: false
      - id: 3
        name: customer_type
        label: Customer Type
        hint: Select the category that best fits you
        type: select_one
        options:
          - Personal
          - Business
          - Small Business
          - Corporate
        required: true
      - id: 4
        name: primary_channel
        label: Primary Banking Channel Used
        hint: Choose the channel you use most often
        type: select_one
        options:
          - Branch
          - Online Banking
          - Mobile App
          - ATM
        required: true
      - id: 5
        name: satisfaction_overall
        label: Overall Satisfaction
        hint: Rate your overall satisfaction with our services
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 6
        name: service_speed
        label: Service Timeliness
        hint: Rate the speed of service you experienced
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 7
        name: product_satisfaction
        label: Product Satisfaction
        hint: How satisfied are you with the products you use
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
        required: false
      - id: 8
        name: likely_to_recommend
        label: Likelihood to Recommend
        hint: Would you recommend us to others
        type: select_one
        options:
          - Definitely
          - Probably
          - Not sure
          - Probably not
          - Definitely not
        required: true
      - id: 9
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: Share any comments or suggestions
        type: text
        options: []
        required: false
      - id: 10
        name: contact_permission
        label: Permission to Contact
        hint: May we contact you to follow up on feedback
        type: select_one
        options:
          - Yes
          - No
        required: false
