inputSchema:
  type: object
  properties:
    title: Favorite Quotes Survey
    pages:
    - id: 1
      name: favorite_quote
      label: What is your favorite quote?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: quote_author
      label: Who is the author of your favorite quote?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: quote_date
      label: When did you come across this quote?
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: quote_meaning
      label: Why is this quote meaningful to you?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: similar_quotes
      label: List 3 more quotes that are similar to this one
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: quote_inspiration
      label: Do you think this quote has the potential to inspire others?
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: inspiration_reason
      label: Can you explain why you think this quote is inspiring?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: quote_frequency
      label: How often do you come across quotes like this one?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: shared_quote
      label: Have you ever shared this quote with someone else?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 10
      name: quote_tone
      label: What is the tone of the quote?
      hint: null
      type: select_one
      options:
      - Inspiring
      - Humorous
      - Sarcastic
      - Neutral
      required: true
    - id: 11
      name: quote_impact
      label: Rate the impact of this quote on you?
      hint: null
      type: select_multiple
      options:
      - Very High
      - High
      - Medium
      - Low
      required: true
    - id: 12
      name: quote_category
      label: Categorize the quote (e.g., inspirational, motivational, humorous)?
      hint: null
      type: select_multiple
      options:
      - Inspirational
      - Motivational
      - Humorous
      - Neutral
      required: true
