inputSchema:
  type: object
  properties:
    title: Favorite Color Survey
    pages:
    - id: 1
      name: main_page
      label: What is your favorite color?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: main_page_2
      label: Select your favorite color
      hint: null
      type: select_one
      options:
      - Red
      - Blue
      - Green
      - Yellow
      - Purple
      required: true
    - id: 3
      name: main_page_3
      label: Do you like bright colors?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: main_page_4
      label: What is your favorite shade of your favorite color?
      hint: null
      type: select_one
      options:
      - Dark
      - Light
      required: false
    - id: 5
      name: main_page_5
      label: Do you prefer warm or cool colors?
      hint: null
      type: select_one
      options:
      - Warm
      - Cool
      required: false
    - id: 6
      name: main_page_6
      label: Select one or more colors
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      - Yellow
      required: true
    - id: 7
      name: main_page_7
      label: Do you like colors with high saturation?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: main_page_8
      label: Select one or more colors from the palette
      hint: null
      type: select_multiple
      options:
      - Pastel Pink
      - Mint Green
      - Royal Blue
      - Sunshine Yellow
      required: false
    - id: 9
      name: main_page_9
      label: Do you like colors with low saturation?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: main_page_10
      label: Select one or more colors from the range
      hint: null
      type: select_multiple
      options:
      - Orange
      - Red
      - Red-Violet
      - Yellow-Green
      required: false
