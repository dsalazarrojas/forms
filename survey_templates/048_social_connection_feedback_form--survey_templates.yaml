inputSchema:
  type: object
  properties:
    title: Social Connection Feedback Form
    pages:
    - id: 1
      name: community_vibes
      label: Do you regularly visit our community?
      hint: Tell us how often you interact with our community
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      required: true
    - id: 2
      name: belonging_scale
      label: How would you rate your belonging feelings?
      hint: Rate your sense of belonging on a scale
      type: number
      options: []
      required: true
    - id: 3
      name: satisfaction_survey
      label: What is your satisfaction level?
      hint: Rate your overall satisfaction with our community
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 4
      name: barriers_to_connection
      label: What prevents you from connecting with others?
      hint: Share any challenges you face in connecting with others
      type: text
      options: []
      required: true
    - id: 5
      name: self_expression
      label: Can you be yourself in our community?
      hint: Share your experiences
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: feedback_form
      label: Have you had a positive experience in our community?
      hint: Share your thoughts
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: support_system
      label: Is our community support system adequate?
      hint: Tell us about your experiences
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: comments
      label: Do you have any comments or feedback?
      hint: Additional comments or suggestions
      type: note
      options: []
      required: false
