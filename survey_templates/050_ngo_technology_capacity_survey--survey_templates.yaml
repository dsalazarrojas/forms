inputSchema:
  type: object
  properties:
    title: NGO Technology Capacity Survey
    pages:
    - id: 1
      name: organization_id
      label: Organization Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: tech_leads_id
      label: Tech Leads Id
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: has_technology_leads
      label: Has Technology Leads
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: tech_leads_count
      label: Tech Leads Count
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: has_digital_skills
      label: Has Digital Skills
      hint: null
      type: select_one
      options:
      - Some
      - Partial
      - None
      required: false
    - id: 6
      name: has_ict_equipment
      label: Has Ict Equipment
      hint: null
      type: select_multiple
      options:
      - Computers
      - Laptops
      - Tablets
      - Mobile Phones
      required: false
    - id: 7
      name: has_internet_access
      label: Has Internet Access
      hint: null
      type: select_multiple
      options:
      - Fast Internet
      - Medium Internet
      - No Internet
      required: true
    - id: 8
      name: has_support_services
      label: Has Support Services
      hint: null
      type: select_multiple
      options:
      - Email Support
      - Phone Support
      - Online Chat Support
      required: true
    - id: 9
      name: has_technology_support
      label: Has Technology Support
      hint: null
      type: select_multiple
      options:
      - Email Support
      - Phone Support
      - Online Chat Support
      required: false
    - id: 10
      name: has_technology_training
      label: Has Technology Training
      hint: null
      type: select_multiple
      options:
      - Basic Computer Training
      - Advanced Computer Training
      required: false
    - id: 11
      name: has_technology_resources
      label: Has Technology Resources
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: has_digital_security
      label: Has Digital Security
      hint: null
      type: select_multiple
      options:
      - Firewall
      - Anti-virus
      - Encryption
      - Backup
      required: false
    - id: 13
      name: has_digital_storage
      label: Has Digital Storage
      hint: null
      type: select_multiple
      options:
      - Local Server
      - Cloud Storage
      required: false
    - id: 14
      name: has_network_admin
      label: Has Network Admin
      hint: null
      type: select_multiple
      options:
      - Network Admin
      - System Admin
      - IT Manager
      required: true
    - id: 15
      name: has_it_training
      label: Has IT Training
      hint: null
      type: select_multiple
      options:
      - Network Training
      - System Training
      - IT Training
      required: false
    - id: 16
      name: it_skills_level
      label: IT Skills Level
      hint: null
      type: select_multiple
      options:
      - Basic
      - Advanced
      - Expert
      required: true
    - id: 17
      name: has_other_technology
      label: Has Other Technology
      hint: null
      type: select_multiple
      options:
      - Software
      - Hardware
      required: true
