inputSchema:
  type: object
  properties:
    title: Customer Needs Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Enter your first name
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: Enter your last name
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: customer_needs_1
      label: Do you need help with a project?
      hint: Select all that apply
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: customer_needs_2
      label: Do you need assistance with a task?
      hint: Select all that apply
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: customer_needs_3
      label: Do you need information about a service?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 7
      name: customer_needs_4
      label: Do you need help with a product?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 8
      name: customer_needs_5
      label: Do you need to be contacted?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: customer_needs_6
      label: Do you need help with an issue?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 10
      name: preferred_communication_channel
      label: Which channel do you prefer to communicate?
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Social Media
      - In-person
      required: false
    - id: 11
      name: product_or_service_preference
      label: Which product or service would you like to receive?
      hint: null
      type: select_multiple
      options:
      - Product A
      - Product B
      - Service X
      - Service Y
      required: false
    - id: 12
      name: feedback
      label: Any additional feedback?
      hint: Enter your feedback here
      type: text
      options: []
      required: false
    - id: 13
      name: review
      label: How can we improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: confirm
      label: Confirm your answers
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 15
      name: terms_and_conditions
      label: I confirm that I have read and agree to the terms and conditions
      hint: null
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: false
