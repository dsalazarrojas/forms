inputSchema:
  type: object
  properties:
    title: tv_ad_research_survey
    pages:
    - id: 1
      name: intro
      label: What is this survey for
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: demographics
      label: Viewers demographics
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: ad_characteristics
      label: Ad characteristics
      hint: null
      type: select_multiple
      options:
      - Length
      - Music
      - Color
      required: false
    - id: 4
      name: ad_effects
      label: Ad effects
      hint: null
      type: select_one
      options:
      - Appealing
      - Repulsive
      - Neutral
      required: false
    - id: 5
      name: ad_location
      label: Ad location
      hint: null
      type: select_one
      options:
      - Top
      - Middle
      - Bottom
      required: false
    - id: 6
      name: ad_time
      label: Ad time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: ad_repetition
      label: Ad repetition
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: tv_channel
      label: TV channel
      hint: null
      type: select_one
      options:
      - ABC
      - CBS
      - NBC
      required: false
    - id: 9
      name: tv_show
      label: TV show
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: ad_rating
      label: Ad rating
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: viewer_feedback
      label: Viewer feedback
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
