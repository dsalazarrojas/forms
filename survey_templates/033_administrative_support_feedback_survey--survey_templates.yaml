inputSchema:
  type: object
  properties:
    title: Administrative Support Feedback Survey
    pages:
    - id: 1
      name: survey_header
      label: -- Administrative Support Feedback Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Respondent Name
      hint: Your name (optional)
      type: text
      options: []
      required: false
    - id: 3
      name: respondent_department
      label: Your Department
      hint: Which department do you belong to?
      type: select_one
      options:
      - Administration
      - Human Resources
      - Finance
      - Marketing
      - Operations
      - IT
      - Sales
      - Customer Service
      - Executive
      - Other
      required: true
    - id: 4
      name: feedback_date
      label: Feedback Date
      hint: Date of providing feedback
      type: date
      options: []
      required: true
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction with Administrative Support
      hint: How satisfied are you with the administrative support provided?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 6
      name: response_time_rating
      label: Response Time Rating
      hint: How would you rate the response time of administrative support?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: professionalism_rating
      label: Professionalism Rating
      hint: How would you rate the professionalism of administrative staff?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: communication_clarity
      label: Communication Clarity
      hint: How clear is the communication from administrative support?
      type: select_one
      options:
      - Very Clear
      - Clear
      - Neutral
      - Unclear
      - Very Unclear
      required: true
    - id: 9
      name: problem_resolution
      label: Problem Resolution Effectiveness
      hint: How effectively does administrative support resolve issues?
      type: select_one
      options:
      - Very Effective
      - Effective
      - Neutral
      - Ineffective
      - Very Ineffective
      required: true
    - id: 10
      name: resource_availability
      label: Resource Availability
      hint: Are the necessary resources readily available through admin support?
      type: select_one
      options:
      - Always
      - Often
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 11
      name: knowledge_expertise
      label: Knowledge and Expertise
      hint: How knowledgeable is the administrative support staff?
      type: select_one
      options:
      - Extremely Knowledgeable
      - Very Knowledgeable
      - Moderately Knowledgeable
      - Slightly Knowledgeable
      - Not Knowledgeable
      required: true
    - id: 12
      name: accessibility_rating
      label: Accessibility Rating
      hint: How accessible is the administrative support?
      type: select_one
      options:
      - Very Accessible
      - Accessible
      - Neutral
      - Inaccessible
      - Very Inaccessible
      required: true
    - id: 13
      name: support_consistency
      label: Support Consistency
      hint: How consistent is the administrative support provided?
      type: select_one
      options:
      - Very Consistent
      - Consistent
      - Neutral
      - Inconsistent
      - Very Inconsistent
      required: true
    - id: 14
      name: most_helpful_services
      label: Most Helpful Services
      hint: Which administrative services do you find most helpful?
      type: text
      options: []
      required: false
    - id: 15
      name: least_helpful_services
      label: Least Helpful Services
      hint: Which administrative services do you find least helpful?
      type: text
      options: []
      required: false
    - id: 16
      name: improvement_suggestions
      label: Improvement Suggestions
      hint: What improvements would you suggest for administrative support?
      type: text
      options: []
      required: false
    - id: 17
      name: additional_resources_needed
      label: Additional Resources Needed
      hint: What additional resources would improve administrative support?
      type: text
      options: []
      required: false
    - id: 18
      name: training_needs_identified
      label: Training Needs Identified
      hint: What training would benefit the administrative support staff?
      type: text
      options: []
      required: false
    - id: 19
      name: positive_experiences
      label: Positive Experiences
      hint: Share any positive experiences with administrative support
      type: text
      options: []
      required: false
    - id: 20
      name: negative_experiences
      label: Negative Experiences
      hint: Share any negative experiences with administrative support
      type: text
      options: []
      required: false
    - id: 21
      name: likelihood_to_recommend
      label: Likelihood to Recommend Administrative Support
      hint: How likely are you to recommend the administrative support to others?
      type: number
      options: []
      required: true
