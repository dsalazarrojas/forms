inputSchema:
  type: object
  properties:
    title: Virtual Assistant Feedback Form
    pages:
    - id: 1
      name: user_input_1
      label: How often do you interact with Virtual Assistant?
      hint: null
      type: select_multiple
      options:
      - Very often
      - Occasionally
      - Rarely
      required: false
    - id: 2
      name: user_input_2
      label: What features do you like most about Virtual Assistant?
      hint: null
      type: select_one
      options:
      - User interface and design
      - Accuracy of information provided
      - Response time
      - All of the above
      required: false
    - id: 3
      name: user_input_3
      label: What do you dislike most about Virtual Assistant?
      hint: null
      type: select_one
      options:
      - User interface and design
      - Response time
      - Lack of information provided
      - All of the above
      required: false
    - id: 4
      name: user_input_4
      label: Have you experienced any issues while using Virtual Assistant?
      hint: null
      type: select_multiple
      options:
      - Technical issues with Virtual Assistant
      - Difficulty in understanding Virtual Assistant responses
      - Other (please specify)
      required: false
    - id: 5
      name: user_input_5
      label: Would you like to continue using Virtual Assistant?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: user_input_6
      label: What would you like to see improved in Virtual Assistant?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: user_input_7
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: user_input_8
      label: Your email address
      hint: Please enter your email address
      type: email
      options: []
      required: false
    - id: 9
      name: user_input_9
      label: Your phone number
      hint: Please enter your phone number
      type: text
      options: []
      required: false
    - id: 10
      name: user_input_10
      label: How did you hear about Virtual Assistant?
      hint: null
      type: select_multiple
      options:
      - Social media
      - Word of mouth
      - Online advertisement
      - Offline advertisement
      - Other (please specify)
      required: false
    - id: 11
      name: user_input_11
      label: What was your first impression of Virtual Assistant?
      hint: Please provide details of your first impression
      type: text
      options: []
      required: false
    - id: 12
      name: user_input_12
      label: How likely are you to recommend Virtual Assistant to friends or family?
      hint: null
      type: select_one
      options:
      - Not at all likely
      - Somewhat likely
      - Very likely
      - Extremely likely
      required: false
    - id: 13
      name: user_input_13
      label: Would you like to receive occasional email updates from Virtual Assistant?
      hint: Please let us know your preference
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: user_input_14
      label: Would you like to see any additional features in Virtual Assistant?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 15
      name: user_input_15
      label: How would you rate your overall satisfaction with Virtual Assistant?
      hint: Rate your satisfaction on a scale of 1-5
      type: number
      options: []
      required: false
    - id: 16
      name: user_input_16
      label: Is there anything else you would like to tell us about your experience
        with Virtual Assistant?
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: user_input_17
      label: Would you like to give a testimonial about Virtual Assistant?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 18
      name: user_input_18
      label: Would you like Virtual Assistant to contact you?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: user_input_19
      label: How did you use Virtual Assistant?
      hint: null
      type: select_multiple
      options:
      - For entertainment
      - For productivity
      - For information seeking
      - For other (please specify)
      required: false
    - id: 20
      name: user_input_20
      label: Would you like to see any additional information on Virtual Assistant
        usage?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 21
      name: user_input_21
      label: What information would you like to see?
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: user_input_22
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: user_input_23
      label: How would you rate the response time of Virtual Assistant?
      hint: Rate your satisfaction on a scale of 1-5
      type: number
      options: []
      required: false
    - id: 24
      name: user_input_24
      label: How would you rate the accuracy of Virtual Assistant?
      hint: Rate your satisfaction on a scale of 1-5
      type: number
      options: []
      required: false
    - id: 25
      name: user_input_25
      label: Would you like to be contacted by Virtual Assistant for any further assistance?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
