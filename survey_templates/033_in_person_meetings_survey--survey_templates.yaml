      - 60 minutes
      - 90 minutes
      required: false
    - id: 4
      name: meeting_purpose
      label: meeting_purpose
      hint: null
      type: select_multiple
      options:
      - Informational
      - Discussion
      - Planning
      required: false
    - id: 5
      name: feedback_frequency
      label: feedback_frequency
      hint: null
      type: select_multiple
      options:
      - Always
      - Often
      - Rarely
      required: false
    - id: 6
      name: feedback_value
      label: feedback_value
      hint: null
      type: select_multiple
      options:
      - Very Positive
      - Somewhat Positive
      - Neutral
      - Somewhat Negative
      - Very Negative
