      type: select_multiple
      options:
      - Goal 1
      - Goal 2
      required: false
    - id: 2
      name: meeting_frequency
      label: meeting_frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 3
      name: meeting_length
      label: meeting_length
      hint: null
      type: select_multiple
      options:
