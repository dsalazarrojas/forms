inputSchema:
  type: object
  properties:
    title: Network Exit Feedback Survey
    pages:
    - id: 1
      name: offboarding_reason
      label: Why are you leaving?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: current_membership_status
      label: What is your current membership status?
      hint: null
      type: select_one
      options:
      - Active Member
      - Inactive Member
      - Trial Member
      required: false
    - id: 3
      name: reasons_for_leaving
      label: Why are you leaving?
      hint: null
      type: select_multiple
      options:
      - Challenging work environment
      - Limited opportunities
      - Personal reasons
      - Other (please specify)
      required: false
    - id: 4
      name: feedback_on_network_experience
      label: What could we improve on the network experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: how_did_we_miss_it
      label: How could we improve to prevent you from leaving?
      hint: null
      type: select_one
      options:
      - Better support
      - Improved onboarding process
      - Increased opportunities
      - Other (please specify)
      required: false
