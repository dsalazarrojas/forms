inputSchema:
  type: object
  properties:
    title: Post Travel Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: date_of_prophet
      label: Date of Prophets
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_travel
      label: Time of Travel
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: travel_experience
      label: Travel Experience
      hint: Describe your travel experience
      type: note
      options: []
      required: true
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: Please add any additional comments
      type: text
      options: []
      required: true
    - id: 9
      name: travel_location
      label: Travel Location
      hint: null
      type: select_one
      options:
      - New York
      - Chicago
      - San Francisco
      required: true
    - id: 10
      name: travel_date
      label: Travel Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: age_of_traveler
      label: Age of Traveler
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: number_of_days
      label: Number of days
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: travel_type
      label: Type of Travel
      hint: null
      type: select_one
      options:
      - Domestic
      - International
      - Business
      required: true
    - id: 14
      name: travel_mode
      label: Travel Mode
      hint: null
      type: select_multiple
      options:
      - Train
      - Bus
      - Flight
      - Car
      required: true
    - id: 15
      name: travel_frequency
      label: Travel Frequency
      hint: null
      type: number
      options: []
      required: true
    - id: 16
      name: travel_cost
      label: Cost of travel
      hint: null
      type: number
      options: []
      required: true
