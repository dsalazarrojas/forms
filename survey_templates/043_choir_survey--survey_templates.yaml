inputSchema:
  type: object
  properties:
    title: Choir Survey
    pages:
    - id: 1
      name: respondent_information
      label: Respondent Information
      hint: About you
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: member_status
      label: Are you a current choir member
      hint: null
      type: select_one
      options:
      - Yes, current member
      - Yes, former member
      - No, interested in joining
      - No, just curious
      required: true
    - id: 4
      name: voice_part
      label: Voice Part
      hint: If applicable
      type: select_one
      options:
      - Soprano
      - Alto
      - Tenor
      - Bass
      - Not applicable
      required: false
    - id: 5
      name: years_in_choir
      label: How long have you been with the choir
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - 3-5 years
      - 6-10 years
      - More than 10 years
      - Not a member
      required: false
    - id: 6
      name: overall_experience
      label: Overall Experience
      hint: Your general impression
      type: note
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: would_recommend
      label: Would you recommend this choir to others
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Not sure
      - Probably no
      - Definitely no
      required: true
    - id: 9
      name: musical_direction
      label: Musical Direction
      hint: Leadership and repertoire
      type: note
      options: []
      required: false
    - id: 10
      name: conductor_rating
      label: Conductor or Director Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: repertoire_rating
      label: Music Repertoire Rating
      hint: Variety and difficulty
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: repertoire_preference
      label: Preferred Music Styles
      hint: Select all that apply
      type: select_multiple
      options:
      - Classical
      - Sacred
      - Contemporary
      - Gospel
      - Jazz
      - Pop
      - Folk
      - World music
      - Broadway
      - Other
      required: false
    - id: 13
      name: rehearsal_quality
      label: Rehearsal Quality
      hint: Organization and productivity
      type: note
      options: []
      required: false
    - id: 14
      name: rehearsal_organization
      label: Rehearsal Organization
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: rehearsal_pacing
      label: Rehearsal Pacing
      hint: Use of time
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: rehearsal_length
      label: Rehearsal Length
      hint: null
      type: select_one
      options:
      - Too short
      - Just right
      - Too long
      required: true
    - id: 17
      name: rehearsal_frequency
      label: Rehearsal Frequency
      hint: null
      type: select_one
      options:
      - Too infrequent
      - Just right
      - Too frequent
      required: true
    - id: 18
      name: community_atmosphere
      label: Community and Atmosphere
      hint: Choir culture
      type: note
      options: []
      required: false
    - id: 19
      name: sense_of_community
      label: Sense of Community
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 20
      name: inclusivity
      label: Inclusivity and Welcoming Environment
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 21
      name: member_support
      label: Member Support and Camaraderie
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 22
      name: performances
      label: Performances
      hint: Concert quality
      type: note
      options: []
      required: false
    - id: 23
      name: performance_quality
      label: Performance Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 24
      name: performance_venues
      label: Performance Venues
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 25
      name: performance_frequency
      label: Performance Frequency
      hint: null
      type: select_one
      options:
      - Too few
      - Just right
      - Too many
      required: true
    - id: 26
      name: communication
      label: Communication
      hint: Information flow
      type: note
      options: []
      required: false
    - id: 27
      name: communication_rating
      label: Communication from Leadership
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 28
      name: communication_methods
      label: Preferred Communication Methods
      hint: Select all that apply
      type: select_multiple
      options:
      - Email
      - Text messages
      - Social media
      - Phone calls
      - Website
      - Printed materials
      - In-person announcements
      required: false
    - id: 29
      name: administration
      label: Administration
      hint: Organization
      type: note
      options: []
      required: false
    - id: 30
      name: membership_value
      label: Membership Value for Cost
      hint: null
      type: select_one
      options:
      - Excellent value
      - Good value
      - Fair value
      - Poor value
      - Not applicable
      required: true
    - id: 31
      name: registration_process
      label: Registration Process
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Not applicable
      required: false
    - id: 32
      name: suggestions
      label: Suggestions for Improvement
      hint: Your ideas
      type: note
      options: []
      required: false
    - id: 33
      name: what_works_well
      label: What Works Well
      hint: Strengths
      type: text
      options: []
      required: false
    - id: 34
      name: what_needs_improvement
      label: What Needs Improvement
      hint: Areas to work on
      type: text
      options: []
      required: false
    - id: 35
      name: additional_comments
      label: Additional Comments
      hint: Anything else
      type: text
      options: []
      required: false
    - id: 36
      name: future_involvement
      label: Future Involvement
      hint: Your plans
      type: note
      options: []
      required: false
    - id: 37
      name: plan_to_continue
      label: Do you plan to continue with the choir
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Probably yes
      - Not sure
      - Probably no
      - 'False'
      required: true
    - id: 38
      name: interested_leadership
      label: Are you interested in leadership opportunities
      hint: Section leader, board, etc.
      type: select_one
      options:
      - Yes, very interested
      - Maybe
      - 'False'
      required: false
