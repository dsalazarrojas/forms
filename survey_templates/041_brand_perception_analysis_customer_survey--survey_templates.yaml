      - id: 4
        name: positioning_header
        label: -- Market Positioning --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: brand_recall
        label: When you think of our industry, is our brand the first that comes to mind?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 6
        name: competitor_name
        label: Which other brand do you consider our main competitor?
        hint: null
        type: text
        options: []
        required: true
      - id: 7
        name: perception_header
        label: -- Perception Analysis --
        hint: null
        type: note
        options: []
        required: false
      - id: 8
        name: reliability_score
        label: How reliable do you find our brand?
