inputSchema:
  type: object
  properties:
    title: Insurance Customer Satisfaction Request Form
    pages:
    - id: 1
      name: policyholder_feedback
      label: Policyholder Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      - Excellent
      required: false
    - id: 3
      name: best_method_to_contact
      label: Best Method to Contact
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - In-Person
      - Online Form
      required: false
    - id: 4
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: policy_number
      label: Policy Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: policyholder_relationship_status
      label: Policyholder Relationship Status
      hint: null
      type: select_multiple
      options:
      - Policyholder is our client
      - Policyholder is not our client
      - Policyholder is ex-client
      - Policyholder is ex-client in progress
      required: false
    - id: 9
      name: contact_frequency
      label: Contact Frequency
      hint: null
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Never
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_to
      label: Assigned to
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: comments_2
      label: Comments 2
      hint: null
      type: text
      options: []
      required: false
