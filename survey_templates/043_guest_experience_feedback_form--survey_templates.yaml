inputSchema:
  type: object
  properties:
    title: Guest Experience Feedback Form
    pages:
    - id: 1
      name: guest_experience
      label: Guest Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: Rate your experience out of 5
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Bad
      - Terrible
      required: false
    - id: 4
      name: suggestions
      label: Suggestions
      hint: What can we improve on?
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: assigned
      label: Assigned
      hint: null
      type: text
      options: []
      required: false
