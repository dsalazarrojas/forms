inputSchema:
  type: object
  properties:
    title: Community Outreach Program Evaluation Form
    pages:
    - id: 1
      name: program_info
      label: Program Information
      hint: Basic details about the program being evaluated
      type: note
      options: []
      required: false
    - id: 2
      name: program_title
      label: Program Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: program_duration
      label: Program Duration
      hint: null
      type: select_one
      options:
      - One-time Event
      - 1-4 Weeks
      - 1-3 Months
      - 3-6 Months
      - 6-12 Months
      - Over 1 Year
      required: true
    - id: 4
      name: evaluation_period
      label: Evaluation Period
      hint: Start to end date
      type: text
      options: []
      required: true
    - id: 5
      name: program_goals
      label: Primary Program Goals
      hint: List main objectives
      type: text
      options: []
      required: true
    - id: 6
      name: goals_achieved
      label: Were Program Goals Achieved
      hint: null
      type: select_one
      options:
      - Fully Achieved
      - Mostly Achieved
      - Partially Achieved
      - Not Achieved
      required: true
    - id: 7
      name: target_audience
      label: Target Audience Reached
      hint: null
      type: select_one
      options:
      - Yes - Exceeded Target
      - Yes - Met Target
      - Partially
      - 'False'
      required: true
    - id: 8
      name: participant_count
      label: Total Number of Participants
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: budget_section
      label: Budget and Resources
      hint: Financial evaluation
      type: note
      options: []
      required: false
    - id: 10
      name: budget_allocated
      label: Budget Allocated
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 11
      name: budget_spent
      label: Actual Amount Spent
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 12
      name: budget_status
      label: Budget Status
      hint: null
      type: select_one
      options:
      - Under Budget
      - On Budget
      - Over Budget
      required: true
    - id: 13
      name: resource_adequacy
      label: Were Resources Adequate
      hint: Staff, materials, facilities
      type: select_one
      options:
      - More Than Adequate
      - Adequate
      - Somewhat Adequate
      - Inadequate
      required: true
    - id: 14
      name: outcomes_section
      label: Program Outcomes
      hint: Impact assessment
      type: note
      options: []
      required: false
    - id: 15
      name: key_outcomes
      label: Key Outcomes Achieved
      hint: List main results
      type: text
      options: []
      required: true
    - id: 16
      name: outcome_measurement
      label: How Were Outcomes Measured
      hint: null
      type: select_multiple
      options:
      - Surveys
      - Interviews
      - Focus Groups
      - Attendance Records
      - Pre/Post Tests
      - Observation
      - Administrative Data
      required: true
    - id: 17
      name: challenges_faced
      label: Challenges Encountered
      hint: Describe obstacles
      type: text
      options: []
      required: true
    - id: 18
      name: lessons_learned
      label: Lessons Learned
      hint: Key takeaways
      type: text
      options: []
      required: true
    - id: 19
      name: recommendations
      label: Recommendations for Future Programs
      hint: Suggestions for improvement
      type: text
      options: []
      required: true
    - id: 20
      name: continue_program
      label: Should This Program Continue
      hint: null
      type: select_one
      options:
      - Yes - Expand
      - Yes - Maintain Current Level
      - Yes - With Modifications
      - No - Discontinue
      required: true
    - id: 21
      name: evaluator_name
      label: Evaluator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 22
      name: evaluation_date
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: true
