inputSchema:
  type: object
  properties:
    title: feedback_and_reflection_survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: false
    - id: 4
      name: question1
      label: What was the purpose of the event?
      hint: Tell us about it
      type: text
      options: []
      required: false
    - id: 5
      name: question2
      label: What did you learn from the event?
      hint: Be as specific as possible
      type: text
      options: []
      required: false
    - id: 6
      name: question3
      label: What did you like most about the event?
      hint: Tell us about it
      type: text
      options: []
      required: false
    - id: 7
      name: question4
      label: What didn't you like about the event?
      hint: Tell us about it
      type: text
      options: []
      required: false
    - id: 8
      name: goals
      label: Goals
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: recommendation
      label: Any recommendations for the next event?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: feedback
      label: Feedback
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
