inputSchema:
  type: object
  properties:
    title: Sustainability Initiatives Implementation Assessment
    pages:
    - id: 1
      name: organization_name
      label: What is the name of your organization?
      hint: Please enter the name of your organization.
      type: text
      options: []
      required: true
    - id: 2
      name: initiative_type
      label: Which type of sustainability initiative is this for?
      hint: Select one of the following options.
      type: select_one
      options:
      - Green Housekeeping
      - Green Purchasing
      - Green Transportation
      - Green Supply Chain
      required: false
    - id: 3
      name: project_duration
      label: How long has the project been going on?
      hint: Select one of the following options.
      type: select_multiple
      options:
      - Less than 6 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: false
    - id: 4
      name: target_area
      label: Which areas does the initiative target?
      hint: Select all applicable areas.
      type: select_multiple
      options:
      - Community
      - Environment
      - Employees
      - Customers
      required: false
    - id: 5
      name: budget
      label: What budget is associated with the initiative?
      hint: Please enter the budget amount.
      type: number
      options: []
      required: true
    - id: 6
      name: expected_impact
      label: What is the expected impact of the initiative?
      hint: Please enter a number.
      type: number
      options: []
      required: true
    - id: 7
      name: actual_impact
      label: What is the actual impact of the initiative?
      hint: Please enter a number.
      type: number
      options: []
      required: true
    - id: 8
      name: sustainability_committee
      label: Is the organization's sustainability committee involved?
      hint: Please answer with a yes or no.
      type: text
      options: []
      required: false
    - id: 9
      name: greenhouse_gas
      label: Which type of greenhouse gas emissions are being addressed?
      hint: Select all applicable options.
      type: select_multiple
      options:
      - Electricity
      - Heat
      - Water
      - Waste
      required: false
    - id: 10
      name: carbon_offset
      label: How much carbon offset is achieved through this initiative?
      hint: Please enter a number.
      type: text
      options: []
      required: false
    - id: 11
      name: water_conservation
      label: What is the organization's water conservation rate?
      hint: Please enter a number.
      type: text
      options: []
      required: false
    - id: 12
      name: recycling_rate
      label: What is the organization's recycling rate?
      hint: Select one of the following options.
      type: select_one
      options:
      - 0-10%
      - 11-20%
      - 21-30%
      - 31-40%
      - 41-50%
      required: false
    - id: 13
      name: transportation_mode
      label: Which mode of transportation is used for this initiative?
      hint: Select all applicable options.
      type: select_multiple
      options:
      - Bike
      - Bus/Rail
      - Car
      - Other
      required: false
    - id: 14
      name: energy_efficiency
      label: How energy efficient is this initiative?
      hint: Select one of the following options.
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 15
      name: renewable_energy
      label: Which type of renewable energy is used?
      hint: Select all applicable options.
      type: select_multiple
      options:
      - Solar
      - Wind
      - Hydro
      - Other
      required: false
    - id: 16
      name: green_building
      label: Is the building certified as green?
      hint: Please answer with a yes or no.
      type: text
      options: []
      required: false
    - id: 17
      name: green_certification
      label: Which green certification is obtained?
      hint: Select all applicable options.
      type: select_multiple
      options:
      - GBI
      - LEED
      - Other
      required: false
    - id: 18
      name: sustainable_water_sources
      label: Are there sustainable water sources used?
      hint: Please answer with a yes or no.
      type: text
      options: []
      required: false
    - id: 19
      name: green_building_certification
      label: Is the organization's building certified as green?
      hint: Please answer with a yes or no.
      type: text
      options: []
      required: false
    - id: 20
      name: sustainable_land_use
      label: How is the organization's land use managed sustainably?
      hint: Please enter a description.
      type: text
      options: []
      required: false
    - id: 21
      name: transportation_mode_2
      label: Which mode of transportation is used?
      hint: Select all applicable options.
      type: select_multiple
      options:
      - Bus
      - Walk/Bycicle
      - Drive
      - Other
      required: false
    - id: 22
      name: carbon_offset_2
      label: How much carbon offset is achieved?
      hint: Please enter a number.
      type: text
      options: []
      required: false
    - id: 23
      name: green_building_certification_2
      label: Green Building Certification 2
      hint: Select all applicable options.
      type: select_multiple
      options:
      - GBI
      - LEED
      - Other
      required: false
    - id: 24
      name: green_housekeeping
      label: How is the organization's housekeeping managed sustainably?
      hint: Please enter a description.
      type: text
      options: []
      required: false
    - id: 25
      name: transportation_mode_3
      label: Transportation Mode 3
      hint: Select all applicable options.
      type: select_multiple
      options:
      - Bus
      - Walk/Bycicle
      - Drive
      - Other
      required: false
