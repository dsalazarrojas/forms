inputSchema:
  type: object
  properties:
    title: AI Services Feedback Form
    pages:
    - id: 1
      name: service_overview_section
      label: "--- Service Overview ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: service_used
      label: Which AI service did you use?
      hint: null
      type: select_one
      options:
      - Conversational Chatbot
      - Automated Data Analytics
      - AI Image/Video Generation
      - Predictive Modeling & Forecasting
      - NLP / Document Summarization
      - Other
      required: true
    - id: 3
      name: service_date
      label: Date of Service Usage
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: quality_performance_section
      label: "--- Quality & Performance ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: output_quality
      label: Quality of AI output
      hint: Rate the technical quality of the result.
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 6
      name: processing_speed
      label: Speed of processing/response
      hint: null
      type: select_one
      options:
      - Very Fast
      - Fast
      - Acceptable
      - Slow
      - Unacceptably Slow
      required: true
    - id: 7
      name: interface_ease_of_use
      label: Ease of use of the interface
      hint: null
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 8
      name: result_relevance
      label: Relevance of results to your request
      hint: How well did the AI understand your intent?
      type: select_one
      options:
      - Highly Relevant
      - Relevant
      - Neutral
      - Irrelevant
      required: true
    - id: 9
      name: user_satisfaction_section
      label: "--- User Satisfaction ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: overall_satisfaction
      label: Overall satisfaction with the service
      hint: (1 = Very Dissatisfied, 5 = Very Satisfied)
      type: select_one
      options:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      required: true
    - id: 11
      name: expectations_met
      label: Did the service meet your expectations?
      hint: null
      type: select_one
      options:
      - Exceeded Expectations
      - Met Expectations
      - Below Expectations
      required: true
    - id: 12
      name: net_promoter_score
      label: How likely are you to recommend our AI services to a colleague?
      hint: null
      type: select_one
      options:
      - 10 - Extremely Likely
      - 9
      - 8
      - 7
      - 6
      - 5 - Neutral
      - 4
      - 3
      - 2
      - 1
      - 0 - Not at all Likely
      required: true
    - id: 13
      name: positive_aspects
      label: What did you like most?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Accuracy of Results
      - Speed of Service
      - Intuitive UI/UX
      - Value for Money
      - Customer Support Quality
      - Feature Variety
      required: false
    - id: 14
      name: improvement_areas
      label: What needs improvement?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Accuracy/Hallucinations
      - Technical Performance
      - Documentation & Help
      - UI Customization
      - Integration Options
      - Pricing Structure
      required: false
    - id: 15
      name: additional_feedback_section
      label: "--- Additional Feedback ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: issue_description
      label: Please describe any specific issues you encountered
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: feature_requests
      label: What new features or capabilities would you like to see?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: contact_section
      label: "--- Optional Contact ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: contact_email
      label: Email Address
      hint: Provide if you would like a response to your feedback.
      type: email
      options: []
      required: false
    - id: 20
      name: follow_up_permission
      label: May we contact you regarding this feedback?
      hint: null
      type: select_one
      options:
      - "Yes"
      - "No"
      required: true
