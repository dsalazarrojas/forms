inputSchema:
  type: object
  properties:
    title: Conversational Design Feedback Form
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email Address
      hint: For follow-up
      type: email
      options: []
      required: false
    - id: 3
      name: section_experience_info
      label: -- Experience Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: bot_name
      label: Name of Bot or Assistant
      hint: Which bot did you interact with
      type: text
      options: []
      required: true
    - id: 5
      name: platform_used
      label: Platform Used
      hint: Where did you interact
      type: select_one
      options:
      - Website
      - Mobile App
      - Facebook Messenger
      - WhatsApp
      - Slack
      - Voice Assistant
      - SMS
      - Other
      required: true
    - id: 6
      name: interaction_date
      label: Date of Interaction
      hint: When did this occur
      type: date
      options: []
      required: true
    - id: 7
      name: task_attempted
      label: What task were you trying to complete
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_usability
      label: -- Usability --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: ease_of_interaction
      label: Ease of interaction
      hint: null
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 10
      name: understood_requests
      label: How well did the bot understand your requests
      hint: null
      type: select_one
      options:
      - Perfectly
      - Mostly Well
      - Sometimes
      - Poorly
      - Not at All
      required: true
    - id: 11
      name: response_clarity
      label: Clarity of bot responses
      hint: null
      type: select_one
      options:
      - Very Clear
      - Clear
      - Neutral
      - Unclear
      - Very Unclear
      required: true
    - id: 12
      name: response_relevance
      label: Relevance of responses
      hint: null
      type: select_one
      options:
      - Very Relevant
      - Relevant
      - Neutral
      - Irrelevant
      - Completely Irrelevant
      required: true
    - id: 13
      name: section_conversation_quality
      label: -- Conversation Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: naturalness
      label: How natural did the conversation feel
      hint: null
      type: select_one
      options:
      - Very Natural
      - Somewhat Natural
      - Neutral
      - Somewhat Robotic
      - Very Robotic
      required: true
    - id: 15
      name: personality
      label: Did the bot have a pleasant personality
      hint: null
      type: select_one
      options:
      - Yes - Very Much
      - Yes - Somewhat
      - Neutral
      - No - Not Really
      - No - Not at All
      required: true
    - id: 16
      name: context_handling
      label: How well did it handle conversation context
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 17
      name: section_task_completion
      label: -- Task Completion --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: task_completed
      label: Did you complete your task
      hint: null
      type: select_one
      options:
      - Yes - Completely
      - Yes - Partially
      - No - Failed
      - No - Gave Up
      required: true
    - id: 19
      name: time_to_complete
      label: How long did it take
      hint: null
      type: select_one
      options:
      - Very Quick
      - Quick
      - Average
      - Slow
      - Very Slow
      required: true
    - id: 20
      name: steps_required
      label: Number of steps or messages exchanged
      hint: Approximate number
      type: number
      options: []
      required: false
    - id: 21
      name: section_error_handling
      label: -- Error Handling --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: errors_encountered
      label: Did you encounter any errors
      hint: null
      type: select_one
      options:
      - Yes - Multiple
      - Yes - One or Two
      - No - None
      required: true
    - id: 23
      name: error_description
      label: Describe the Errors
      hint: What went wrong
      type: text
      options: []
      required: false
    - id: 24
      name: error_resolution
      label: How were errors handled
      hint: null
      type: select_one
      options:
      - Resolved Quickly
      - Eventually Resolved
      - Not Resolved
      - No Error Recovery Offered
      required: false
    - id: 25
      name: section_human_handoff
      label: -- Human Handoff --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: needed_human_agent
      label: Did you need to speak to a human
      hint: null
      type: select_one
      options:
      - Yes - Requested
      - Yes - Offered
      - No - Not Needed
      - Wanted but Not Available
      required: false
    - id: 27
      name: handoff_smoothness
      label: How smooth was the handoff process
      hint: If applicable
      type: select_one
      options:
      - Very Smooth
      - Smooth
      - Neutral
      - Rough
      - Very Rough
      - Not Applicable
      required: false
    - id: 28
      name: section_satisfaction
      label: -- Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 30
      name: would_use_again
      label: Would you use this bot again
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 31
      name: would_recommend
      label: Would you recommend to others
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 32
      name: section_feedback
      label: -- Additional Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 33
      name: best_aspects
      label: What did you like best
      hint: null
      type: text
      options: []
      required: false
    - id: 34
      name: areas_for_improvement
      label: What needs improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 35
      name: feature_requests
      label: Features you wish it had
      hint: null
      type: text
      options: []
      required: false
    - id: 36
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
