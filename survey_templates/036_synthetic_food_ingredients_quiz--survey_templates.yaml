inputSchema:
  type: object
  properties:
    title: Synthetic Food Ingredients Quiz
    pages:
    - id: 1
      name: participant_info
      label: Participant Info
      hint: Participant information is required.
      type: text
      options: []
      required: false
    - id: 2
      name: synthetic_additive_knowledge
      label: Synthetic Additive Knowledge
      hint: Choose all that apply
      type: select_one
      options:
      - I don’t know
      - Artificial sweeteners and flavor enhancers
      - Food colorants
      - Preservatives and acidulents
      - Other
      required: false
    - id: 3
      name: synthetic_food_items
      label: Synthetic Food Items
      hint: Select all that apply
      type: select_multiple
      options:
      - Monosodium glutamate (MSG)
      - Aspartame
      - Carrageenan
      - Other
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: Additional comments or feedback
      type: note
      options: []
      required: false
    - id: 5
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
