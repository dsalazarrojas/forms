inputSchema:
  type: object
  properties:
    title: Hotel Recommendation Form
    pages:
    - id: 1
      name: name
      label: What is your name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: travel_date
      label: Travel Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 3
      name: budget
      label: Budget
      hint: Please enter your budget
      type: number
      options: []
      required: true
    - id: 4
      name: location
      label: Location
      hint: Select all that apply
      type: select_multiple
      options:
      - City
      - Country
      - Region
      required: true
    - id: 5
      name: hotel_rating
      label: Hotel Rating
      hint: Select a rating
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 6
      name: travel_length
      label: Travel Length
      hint: Select a duration
      type: select_one
      options:
      - 1-3 days
      - 1-7 days
      - More than 7 days
      required: true
    - id: 7
      name: travel_agent
      label: Travel Agent
      hint: Are you a travel agent?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: preferred_hotel
      label: Preferred Hotel
      hint: Select all that apply
      type: select_multiple
      options:
      - Luxury
      - Budget
      - Boutique
      required: true
    - id: 9
      name: travel_mode
      label: Travel Mode
      hint: How do you plan to travel?
      type: select_one
      options:
      - Flight
      - Train
      - Car
      required: true
    - id: 10
      name: prophets_length
      label: Prophets Length
      hint: Select a duration
      type: select_one
      options:
      - 1-3 days
      - 1-7 days
      - More than 7 days
      required: true
    - id: 11
      name: prophets_location
      label: Prophets Location
      hint: null
      type: select_multiple
      options:
      - Beach
      - Mountain
      - City
      required: false
    - id: 12
      name: prophets_budget
      label: Prophets Budget
      hint: Please enter your budget
      type: number
      options: []
      required: true
    - id: 13
      name: travel_date_2
      label: Travel Date 2
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 14
      name: preferred_hotel_2
      label: Preferred Hotel 2
      hint: Select all that apply
      type: select_multiple
      options:
      - Luxury
      - Budget
      - Boutique
      required: true
