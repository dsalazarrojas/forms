inputSchema:
  type: object
  properties:
    title: Training Program Evaluation Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: training_session_date
      label: Training Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: training_session_time
      label: Training Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: rating
      label: Overall Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 6
      name: question_1
      label: What was the most valuable part of the training session?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: question_2
      label: What did you find most challenging about the training session?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: question_3
      label: What suggestions do you have for future training sessions?
      hint: null
      type: note
      options: []
      required: true
