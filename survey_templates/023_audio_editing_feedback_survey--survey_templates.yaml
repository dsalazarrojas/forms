inputSchema:
  type: object
  properties:
    title: Audio Editing Feedback Survey
    pages:
      - id: 1
        name: section_project
        label: -- Project Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: client_name
        label: Client Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: project_title
        label: Project Title or Episode Name
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: completion_date
        label: Date Project Received
        hint: null
        type: date
        options: []
        required: true
      - id: 5
        name: section_quality
        label: -- Audio Quality Evaluation --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: sound_clarity
        label: Clarity and Balance of Sound
        hint: Can you hear all elements clearly?
        type: select_one
        options:
          - 5 - Perfect
          - 4 - Very Good
          - 3 - Average
          - 2 - Poor
          - 1 - Unacceptable
        required: true
      - id: 7
        name: noise_reduction
        label: Background Noise Removal
        hint: How effective was the noise cleanup?
        type: select_one
        options:
          - Extremely Effective
          - Effective
          - Neutral
          - Ineffective
        required: true
      - id: 8
        name: transitions_flow
        label: Smoothness of Transitions and Edits
        hint: Do the cuts feel natural?
        type: select_one
        options:
          - Seamless
          - Mostly Smooth
          - Noticeable Edits
          - Abrupt/Jarring
        required: true
      - id: 9
        name: music_levels
        label: Background Music and FX Levels
        hint: Are they well-balanced with the dialogue?
        type: select_one
        options:
          - Well Balanced
          - Music too loud
          - Voice too loud
          - Needs more FX
        required: true
      - id: 10
        name: section_service
        label: -- Service and Delivery --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: timeliness
        label: Timeliness of Delivery
        hint: Was the project delivered by the deadline?
        type: select_one
        options:
          - Early
          - On Time
          - Slightly Late
          - Very Late
        required: true
      - id: 12
        name: communication_rating
        label: Communication throughout the process
        hint: How was the editor's responsiveness?
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 13
        name: improvement_areas
        label: What specific areas could be improved?
        hint: null
        type: text
        options: []
        required: false
      - id: 14
        name: future_referral
        label: Would you use our editing services again?
        hint: null
        type: select_one
        options:
          - Definitely
          - Likely
          - Unlikely
        required: true
      - id: 15
        name: additional_comments
        label: Any additional feedback for the editor?
        hint: null
        type: text
        options: []
        required: false
