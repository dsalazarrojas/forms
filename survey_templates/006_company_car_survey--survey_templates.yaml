inputSchema:
  type: object
  properties:
    title: Company Car Survey
    pages:
    - id: 1
      name: vehicle_info_section
      label: -- Vehicle Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: vehicle_assigned
      label: Vehicle Make and Model
      hint: Enter the make and model of the company car you are currently using
      type: text
      options: []
      required: true
    - id: 3
      name: vehicle_year
      label: Vehicle Year
      hint: Year of manufacture
      type: number
      options: []
      required: true
    - id: 4
      name: average_monthly_mileage
      label: Average Monthly Mileage
      hint: Enter approximate miles driven per month
      type: number
      options: []
      required: true
    - id: 5
      name: vehicle_satisfaction_section
      label: -- Satisfaction and Maintenance --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: vehicle_condition_rating
      label: Overall Vehicle Condition
      hint: Rate the current mechanical and cosmetic condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: fuel_card_usability
      label: How satisfied are you with the fuel card process?
      hint: Ease of use at gas stations
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: maintenance_responsiveness
      label: Maintenance Service Responsiveness
      hint: How quickly are repairs or services handled?
      type: select_one
      options:
      - Very Fast
      - Reasonable
      - Slow
      - Very Slow
      - Not Applicable
      required: true
    - id: 9
      name: safety_features_adequacy
      label: Are the safety features in your vehicle adequate for your role?
      hint: e.g., airbags, collision warnings, reversing camera
      type: select_one
      options:
      - true
      - Mostly
      - false
      required: true
    - id: 10
      name: desired_vehicle_features
      label: What features would you like to see in future company vehicles?
      hint: e.g., hybrid/electric, better GPS, safety tech
      type: text
      options: []
      required: false
    - id: 11
      name: additional_car_feedback
      label: Any other comments regarding the company car program?
      hint: Provide details on any issues or suggestions
      type: text
      options: []
      required: false
