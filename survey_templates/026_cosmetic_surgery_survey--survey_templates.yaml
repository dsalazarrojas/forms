inputSchema:
  type: object
  properties:
    title: Cosmetic_Surgery_Survey
    pages:
    - id: 1
      name: overall_experience
      label: Overall Experience
      hint: Please rate your overall experience with the surgery.
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: patient_satisfaction
      label: Patient Satisfaction
      hint: Rate your satisfaction with the outcome of the surgery.
      type: select_one
      options:
      - Highly Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Highly Dissatisfied
      required: true
    - id: 3
      name: expectations
      label: Expectations
      hint: What were your expectations before the surgery?
      type: text
      options: []
      required: false
    - id: 4
      name: on_time_performance
      label: On-Time Performance
      hint: Was the surgery performed on time?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: surgeon_expertise
      label: Surgeon Expertise
      hint: Rate the surgeon's expertise.
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: recommend
      label: Recommend
      hint: Would you recommend the surgery to others?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: rating
      label: Rating
      hint: Rate your overall rating of the surgery out of 5.
      type: number
      options: []
      required: true
    - id: 8
      name: complications
      label: Complications
      hint: Were there any unexpected complications during the surgery?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: recovery
      label: Recovery
      hint: Rate your satisfaction with the recovery process.
      type: select_one
      options:
      - Highly Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Highly Dissatisfied
      required: false
    - id: 10
      name: post_surgery_care
      label: Post-Surgery Care
      hint: Was the post-operative care adequate?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: meet_expectations
      label: Meet Expectations
      hint: Did the surgery meet your expectations?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: Please provide any additional comments or concerns.
      type: note
      options: []
      required: false
