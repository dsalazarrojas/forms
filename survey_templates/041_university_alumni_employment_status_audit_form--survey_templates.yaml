inputSchema:
  type: object
  properties:
    title: University Alumni Employment Status Audit Form
    pages:
    - id: 1
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Active
      - Retired
      - Disabled
      - Deceased
      - Not employed
      required: false
    - id: 2
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: current_occupation
      label: Current Occupation
      hint: null
      type: select_multiple
      options:
      - Manager
      - Executive
      - Software Developer
      - Marketing Manager
      - Teacher
      - Other
      required: false
    - id: 5
      name: current_employer
      label: Current Employer
      hint: null
      type: select_one
      options:
      - Current employer
      - Former employer
      - Self-Employed
      required: false
    - id: 6
      name: industry_sector
      label: Industry Sector
      hint: null
      type: select_one
      options:
      - Finance
      - Government
      - Healthcare
      - Non-Profit
      - Technology
      required: false
    - id: 7
      name: employment_duration
      label: Employment Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: job_satisfaction
      label: Job Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 9
      name: expected_employment_outcome
      label: Expected Employment Outcome
      hint: null
      type: text
      options: []
      required: false
