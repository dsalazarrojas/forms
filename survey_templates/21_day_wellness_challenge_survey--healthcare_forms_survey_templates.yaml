inputSchema:
  type: object
  properties:
    title: 21 Day Wellness Challenge Survey
    pages:
    - id: 1
      name: section_header_participant
      label: '--- Participant Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Your Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: For challenge updates and follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Optional, but helpful for urgent communications
      type: phone
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: gender_identity
      label: Gender Identity
      hint: null
      type: select_one
      options:
      - Female
      - Male
      - Non-binary
      - Prefer not to say
      required: false
    - id: 7
      name: section_header_pre_challenge
      label: '--- Before the Challenge ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: challenge_start_date
      label: When did you start the 21-Day Challenge?
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: primary_challenge_goal
      label: What was your primary goal for participating?
      hint: e.g., "Increase energy", "Lose weight", "Improve sleep"
      type: text
      options: []
      required: true
    - id: 10
      name: initial_well_being_rating
      label: Rate your overall well-being before the challenge (1-10)
      hint: 1 = Very poor, 10 = Excellent
      type: integer
      options: []
      required: true
    - id: 11
      name: most_common_issues_before
      label: Which of these were most common for you before the challenge? (select
        all)
      hint: null
      type: select_multiple
      options:
      - Low energy
      - Poor sleep quality
      - High stress levels
      - Digestive issues
      - Lack of motivation
      - Frequent mood swings
      - Joint or muscle discomfort
      required: false
    - id: 12
      name: section_header_during_challenge
      label: '--- Your Experience During the Challenge ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: followed_plan_consistently
      label: Did you follow the challenge plan consistently?
      hint: null
      type: select_one
      options:
      - Yes, every day
      - Mostly, with minor deviations
      - Sometimes, it was difficult
      - Rarely, I struggled to stick to it
      required: true
    - id: 14
      name: most_impactful_activities
      label: Which activities/practices had the most positive impact? (select all)
      hint: null
      type: select_multiple
      options:
      - Daily meditation/mindfulness
      - Structured exercise
      - Hydration goals
      - Clean eating/diet changes
      - Journaling/reflection
      - Digital detox
      - Consistent sleep schedule
      required: false
    - id: 15
      name: experienced_cravings
      label: Did you experience significant cravings or withdrawal symptoms?
      hint: null
      type: select_one
      options:
      - Yes, frequently
      - Yes, occasionally
      - No, not really
      - Not applicable
      required: true
    - id: 16
      name: section_header_post_challenge
      label: '--- After the Challenge ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: challenge_completion_date
      label: When did you complete the 21-Day Challenge?
      hint: null
      type: date
      options: []
      required: true
    - id: 18
      name: achieved_primary_goal
      label: Do you feel you achieved your primary goal?
      hint: null
      type: select_one
      options:
      - Fully achieved
      - Partially achieved
      - Not achieved
      - Exceeded expectations
      required: true
    - id: 19
      name: current_well_being_rating
      label: Rate your current overall well-being (1-10)
      hint: 1 = Very poor, 10 = Excellent
      type: integer
      options: []
      required: true
    - id: 20
      name: overall_satisfaction
      label: How satisfied are you with your challenge experience?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 21
      name: plan_to_continue_practices
      label: Do you plan to continue the new wellness practices?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Most of them
      - A few key ones
      - No, not really
      required: true
    - id: 22
      name: section_header_feedback
      label: '--- General Feedback & Next Steps ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: recommend_challenge
      label: Would you recommend this 21-Day Wellness Challenge to others?
      hint: null
      type: select_one
      options:
      - Yes, absolutely
      - Probably yes
      - Maybe
      - Probably no
      - 'False'
      required: true
    - id: 24
      name: suggestions_for_improvement
      label: What suggestions do you have for improving the challenge?
      hint: Your feedback is valuable for future participants.
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Any additional comments or thoughts?
      hint: null
      type: text
      options: []
      required: false
