inputSchema:
  type: object
  properties:
    title: Focus Group Inquiry Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Event
      - Seminar
      - Webinar
      - Conference
      - Workshop
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: event_duration
      label: Event Duration
      hint: null
      type: number
      options: []
      required: false
