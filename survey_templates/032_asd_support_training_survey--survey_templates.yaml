inputSchema:
  type: object
  properties:
    title: ASD Support Training Survey
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: Your name (optional)
      type: text
      options: []
      required: false
    - id: 2
      name: participant_email
      label: Participant Email
      hint: Your email (optional, for follow-up)
      type: email
      options: []
      required: false
    - id: 3
      name: training_session_date
      label: Training Session Date
      hint: Date of the training session attended
      type: date
      options: []
      required: true
    - id: 4
      name: training_session_topic
      label: Training Session Topic
      hint: What was the topic of the training session?
      type: text
      options: []
      required: true
    - id: 5
      name: trainer_name
      label: Trainer Name
      hint: Name of the training facilitator
      type: text
      options: []
      required: true
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied were you with the training session?
      type: select_one
      options: ["Very Satisfied", "Satisfied", "Neutral", "Dissatisfied", "Very Dissatisfied"]
      required: true
    - id: 7
      name: content_relevance
      label: Content Relevance
      hint: How relevant was the training content to your work with individuals with ASD?
      type: select_one
      options: ["Very Relevant", "Relevant", "Somewhat Relevant", "Not Very Relevant", "Not Relevant"]
      required: true
    - id: 8
      name: knowledge_gained
      label: Knowledge Gained
      hint: Did you gain new knowledge from this training?
      type: select_one
      options: ["Significant Amount", "Moderate Amount", "Little Amount", "No New Knowledge"]
      required: true
    - id: 9
      name: practical_applicability
      label: Practical Applicability
      hint: How applicable are the strategies taught to your daily practice?
      type: select_one
      options: ["Very Applicable", "Applicable", "Somewhat Applicable", "Not Very Applicable", "Not Applicable"]
      required: true
    - id: 10
      name: training_pacing
      label: Training Pacing
      hint: Was the pace of the training appropriate?
      type: select_one
      options: ["Too Fast", "Appropriate", "Too Slow"]
      required: true
    - id: 11
      name: materials_quality
      label: Materials Quality
      hint: How would you rate the quality of the training materials?
      type: select_one
      options: ["Excellent", "Good", "Average", "Poor", "Very Poor"]
      required: true
    - id: 12
      name: interaction_opportunities
      label: Interaction Opportunities
      hint: Were there sufficient opportunities for questions and discussion?
      type: select_one
      options: ["More Than Enough", "Adequate", "Insufficient", "None Needed"]
      required: true
    - id: 13
      name: additional_topics_interest
      label: Additional Topics of Interest
      hint: What other topics would you like covered in future training?
      type: text
      options: []
      required: false
    - id: 14
      name: recommendation_likelihood
      label: Recommendation Likelihood
      hint: How likely are you to recommend this training to colleagues?
      type: select_one
      options: ["Very Likely", "Likely", "Neutral", "Unlikely", "Very Unlikely"]
      required: true
    - id: 15
      name: feedback_comments
      label: Additional Feedback
      hint: Any other comments or suggestions about the training?
      type: text
      options: []
      required: false
