inputSchema:
  type: object
  properties:
    title: Community Harmony Assessment
    pages:
      - id: 1
        name: respondent_name
        label: Name (Optional)
        hint: Your name if you wish to share
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: For follow-up
        type: email
        options: []
        required: false
      - id: 3
        name: neighborhood
        label: Neighborhood or Area
        hint: Where do you live?
        type: text
        options: []
        required: true
      - id: 4
        name: residency_duration
        label: How Long Have You Lived Here
        hint: Duration of residence
        type: select_one
        options:
          - Less than 1 year
          - 1-3 years
          - 3-5 years
          - 5-10 years
          - More than 10 years
        required: true
      - id: 5
        name: neighbor_relations
        label: Relationship with Neighbors
        hint: How would you describe them?
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 6
        name: communication_quality
        label: Communication Quality in Community
        hint: Rate communication effectiveness
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 7
        name: inclusion_feeling
        label: Do You Feel Included
        hint: Sense of belonging
        type: select_one
        options:
          - Very Included
          - Somewhat Included
          - Neutral
          - Somewhat Excluded
          - Very Excluded
        required: true
      - id: 8
        name: diversity_appreciation
        label: Appreciation of Diversity
        hint: How is diversity valued?
        type: select_one
        options:
          - Very Well Appreciated
          - Well Appreciated
          - Neutral
          - Poorly Appreciated
          - Not Appreciated
        required: true
      - id: 9
        name: conflict_frequency
        label: Frequency of Community Conflicts
        hint: How often do conflicts occur?
        type: select_one
        options:
          - Very Rarely
          - Occasionally
          - Sometimes
          - Frequently
          - Very Frequently
        required: true
      - id: 10
        name: conflict_resolution
        label: Conflict Resolution Effectiveness
        hint: How well are conflicts resolved?
        type: select_one
        options:
          - Very Well
          - Well
          - Fair
          - Poorly
          - Very Poorly
        required: true
      - id: 11
        name: community_events
        label: Community Events Participation
        hint: Do you attend community events?
        type: select_one
        options:
          - Regularly
          - Occasionally
          - Rarely
          - Never
        required: true
      - id: 12
        name: event_satisfaction
        label: Satisfaction with Community Events
        hint: Rate the events
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 13
        name: safety_rating
        label: Safety Rating
        hint: How safe do you feel?
        type: select_one
        options:
          - Very Safe
          - Safe
          - Neutral
          - Unsafe
          - Very Unsafe
        required: true
      - id: 14
        name: noise_level
        label: Noise Level Satisfaction
        hint: Rate the noise levels
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 15
        name: shared_spaces
        label: Shared Spaces Condition
        hint: Rate common areas
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 16
        name: harmony_barriers
        label: Barriers to Community Harmony
        hint: What prevents better harmony?
        type: select_multiple
        options:
          - Lack of Communication
          - Cultural Differences
          - Language Barriers
          - Noise Issues
          - Parking Problems
          - Pet Issues
          - None
        required: false
      - id: 17
        name: improvement_suggestions
        label: Suggestions for Better Harmony
        hint: Your ideas for improvement
        type: text
        options: []
        required: false
      - id: 18
        name: overall_harmony_rating
        label: Overall Community Harmony Rating
        hint: Rate overall harmony
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
