inputSchema:
  type: object
  properties:
    title: Bike MS Curbside Pick Up Feedback
    pages:
    - id: 1
      name: experience_header
      label: -- Your Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_location
      label: Curbside Pick Up Location
      hint: null
      type: select_one
      options:
      - North Site
      - South Site
      - Central Hub
      - West Side Office
      required: true
    - id: 3
      name: wait_time
      label: How long did you wait for your items?
      hint: null
      type: select_one
      options:
      - Less than 5 minutes
      - 5-10 minutes
      - 10-20 minutes
      - More than 20 minutes
      required: true
    - id: 4
      name: staff_friendliness
      label: Staff Friendliness Rating
      hint: 1 being poor, 5 being excellent
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 5
      name: process_efficiency
      label: How efficient was the pick up process?
      hint: null
      type: select_one
      options:
      - Very Efficient
      - Somewhat Efficient
      - Neutral
      - Inefficient
      required: true
    - id: 6
      name: item_accuracy
      label: Were all your items correct and present?
      hint: null
      type: select_one
      options:
      - Yes, everything was there
      - No, something was missing
      - No, I received incorrect items
      required: true
    - id: 7
      name: safety_protocols
      label: Did you feel safety protocols were followed?
      hint: e.g., distancing, masking if applicable
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: true
    - id: 8
      name: improvement_suggestions
      label: What is one thing we could do to improve the curbside experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 10
      name: future_use
      label: Would you use curbside pick up again?
      hint: null
      type: select_one
      options:
      - Definitely
      - Probably
      - Maybe
      - 'False'
      required: true
    - id: 11
      name: contact_follow_up
      label: May we contact you regarding your feedback?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: rider_name_optional
      label: Name (Optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: email_optional
      label: Email Address (Optional)
      hint: null
      type: email
      options: []
      required: false
