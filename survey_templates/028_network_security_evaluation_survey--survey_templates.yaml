inputSchema:
  type: object
  properties:
    title: Network Security Evaluation Survey
    pages:
    - id: 1
      name: network_security_evaluation_page_1
      label: 1. What is the current state of your organization's network segmentation?
      hint: Please select from below options
      type: select_one
      options:
      - Segmented and secure
      - Partially segmented, but with some gaps
      - Not segmented at all
      required: false
    - id: 2
      name: network_security_evaluation_page_2
      label: 2. How do you rate the level of risk management in your organization?
      hint: Please select from below options
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 3
      name: network_security_evaluation_page_3
      label: 3. What is the current state of your organization's security governance
        practices?
      hint: Please select from below options
      type: select_one
      options:
      - Mature and well-established
      - Developing but not yet mature
      - Basic or absent
      required: false
    - id: 4
      name: network_security_evaluation_page_4
      label: 4. What is your current experience with the following security measures?
      hint: Please select from below options
      type: select_multiple
      options:
      - Network segmentation
      - Access control and authentication
      - Encryption and data protection
      required: false
    - id: 5
      name: network_security_evaluation_page_5
      label: 5. Are you using a formal risk assessment process?
      hint: Yes or No
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: network_security_evaluation_page_6
      label: 6. How often do you perform regular security audits or assessments?
      hint: Select one of below options
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      required: false
    - id: 7
      name: network_security_evaluation_page_7
      label: 7. What is your current level of awareness about common network threats?
      hint: Please select from below options
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 8
      name: network_security_evaluation_page_8
      label: 8. How many people in your organization have access to sensitive data?
      hint: Please select from below options
      type: select_multiple
      options:
      - 1-5 people
      - 6-10 people
      - More than 10 people
      required: false
    - id: 9
      name: network_security_evaluation_page_9
      label: 9. Have you ever experienced a security breach or incident?
      hint: Yes or No
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: network_security_evaluation_page_10
      label: 10. How quickly do you respond to security incidents?
      hint: Select one of below options
      type: select_one
      options:
      - Immediately
      - Within 1 hour
      - Within 1 day
      - Within 1 week
      required: false
    - id: 11
      name: network_security_evaluation_page_11
      label: 11. What is your current budget for security measures?
      hint: Please select from below options
      type: select_multiple
      options:
      - < $10,000
      - $10,000-$50,000
      - $50,000-$100,000
      required: false
