      options: []
      required: false
    - id: 5
      name: exhibit_length
      label: Exhibit Length
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: theme_preferences
      label: Theme Preferences
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 7
      name: email_address
      label: Email Address
      hint: null
