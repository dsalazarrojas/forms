inputSchema:
  type: object
  properties:
    title: Aerial Survey Feedback Form
    pages:
    - id: 1
      name: survey_details_header
      label: -- Survey Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: project_name
      label: Project Name / ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: feedback_provider
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: role
      label: Your Role
      hint: null
      type: select_one
      options:
      - Client
      - Project Manager
      - Data Analyst
      - GIS Specialist
      - Surveyor
      required: true
    - id: 5
      name: quality_header
      label: -- Data Quality --
      hint: Please rate the survey outputs.
      type: note
      options: []
      required: false
    - id: 6
      name: image_resolution
      label: Image Resolution/Clarity
      hint: Were the images clear enough?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: georeferencing_accuracy
      label: Georeferencing Accuracy
      hint: Was the spatial data accurate?
      type: select_one
      options:
      - Highly Accurate
      - Acceptable
      - Inaccurate
      - Not Applicable
      required: true
    - id: 8
      name: coverage_completeness
      label: Coverage Completeness
      hint: Did we cover the entire area?
      type: select_one
      options:
      - 100% Complete
      - Mostly Complete
      - Significant Gaps
      required: true
    - id: 9
      name: delivery_header
      label: -- Service Delivery --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: delivery_speed
      label: Speed of Delivery
      hint: Was the data delivered on time?
      type: select_one
      options:
      - Early
      - On Time
      - Late
      required: true
    - id: 11
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you with this survey?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 12
      name: issues_reported
      label: Issues Encountered
      hint: Any technical or logistical problems?
      type: text
      options: []
      required: false
    - id: 13
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
