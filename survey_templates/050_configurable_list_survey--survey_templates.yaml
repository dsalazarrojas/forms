inputSchema:
  type: object
  properties:
    title: Configurable List Survey
    pages:
    - id: 1
      name: survey_title
      label: Survey Title
      hint: Name of survey
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 5
      name: organization
      label: Organization
      hint: Company or institution
      type: text
      options: []
      required: false
    - id: 6
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: false
    - id: 7
      name: survey_type
      label: Survey Type
      hint: What kind of survey
      type: select_one
      options:
      - Feedback Survey
      - Needs Assessment
      - Inventory Survey
      - Preference Survey
      - Evaluation Survey
      - Custom Survey
      required: true
    - id: 8
      name: survey_purpose
      label: Survey Purpose
