      name: category_2_items
      label: Category 2 Items
      hint: List items
      type: text
      options: []
      required: false
    - id: 15
      name: category_2_rating
      label: Category 2 Rating
      hint: Importance
      type: select_one
      options:
      - Very Important
      - Important
      - Somewhat Important
      - Not Important
      required: false
    - id: 16
      name: category_2_comments
      label: Category 2 Comments
      hint: Additional notes
      type: text
      options: []
      required: false
    - id: 17
      name: category_3_name
      label: Category 3 Name
      hint: Third category
      type: text
      options: []
      required: false
    - id: 18
      name: category_3_items
      label: Category 3 Items
      hint: List items
      type: text
      options: []
      required: false
    - id: 19
      name: category_3_rating
      label: Category 3 Rating
      hint: Importance
      type: select_one
      options:
      - Very Important
      - Important
      - Somewhat Important
      - Not Important
      required: false
    - id: 20
      name: category_3_comments
      label: Category 3 Comments
      hint: Additional notes
      type: text
      options: []
      required: false
