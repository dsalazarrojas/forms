      - Very Important
      - Important
      - Somewhat Important
      - Not Important
      required: false
    - id: 12
      name: category_1_comments
      label: Category 1 Comments
      hint: Additional notes
      type: text
      options: []
      required: false
    - id: 13
      name: category_2_name
      label: Category 2 Name
      hint: Second category
      type: text
      options: []
      required: false
