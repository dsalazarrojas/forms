      hint: Select date of checkin
      type: date
      options: []
      required: true
    - id: 2
      name: checkout_date
      label: Checkout Date
      hint: Select date of checkout
      type: date
      options: []
      required: true
    - id: 3
      name: rating
      label: Rating
