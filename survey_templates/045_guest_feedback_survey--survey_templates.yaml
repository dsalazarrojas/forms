    - id: 11
      name: rating_score
      label: Rating Score
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: true
    - id: 13
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: output_file
      label: Output File
      hint: null
      type: text
      options: []
