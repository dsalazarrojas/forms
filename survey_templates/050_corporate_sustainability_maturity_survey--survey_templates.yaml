inputSchema:
  type: object
  properties:
    title: Corporate Sustainability Maturity Survey
    pages:
    - id: 1
      name: introduction_page
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: domain_page
      label: Domain
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: sustainability_management_page
      label: Sustainability Management
      hint: Describe your approach to sustainability management.
      type: text
      options: []
      required: true
    - id: 4
      name: human_rights_page
      label: Human Rights
      hint: How important is human rights in the company's operations?
      type: select_one
      options:
      - High
      - Medium
      - Low
      - Not Applicable
      required: true
    - id: 5
      name: environmental_impact_page
      label: Environmental Impact
      hint: How does the company measure its environmental impact?
      type: select_multiple
      options:
      - Greenhouse Gas Emissions
      - Water Usage
      - Energy Consumption
      - Waste Management
      - Recycling
      required: true
    - id: 6
      name: stakeholder_engagement_page
      label: Stakeholder Engagement
      hint: How does the company engage with stakeholders to promote transparency
        and accountability?
      type: text
      options: []
      required: true
    - id: 7
      name: social_ethics_page
      label: Social and Ethical
      hint: What are the company's key social and ethical priorities?
      type: select_multiple
      options:
      - Diversity and Inclusion
      - Human Rights
      - Fair Labor Practices
      - Supply Chain Responsibility
      required: true
    - id: 8
      name: community_page
      label: Community
      hint: How does the company contribute to the well-being of local communities?
      type: text
      options: []
      required: true
    - id: 9
      name: challenges_page
      label: Challenges
      hint: What are some of the main challenges the company faces in achieving its
        sustainability goals?
      type: select_multiple
      options:
      - Lack of clear objectives
      - Limited resources
      - Lack of clear policies
      - Lack of clear communication
      - Lack of clear metrics
      required: true
    - id: 10
      name: submission_page
      label: Submission
      hint: null
      type: select_one
      options:
      - Submit
      - Save Draft
      - Cancel
      required: true
    - id: 11
      name: conclusion_page
      label: Conclusion
      hint: null
      type: note
      options: []
      required: false
