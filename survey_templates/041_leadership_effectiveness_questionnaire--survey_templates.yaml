inputSchema:
  type: object
  properties:
    title: Leadership Effectiveness Questionnaire
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: leadership_behaviors
      label: Leadership Behaviors
      hint: null
      type: select_multiple
      options:
      - Leading by Example
      - Empowering and Motivating
      - Adapting and Adapting
      - Developing and Coaching
      - Communicating
      - Strategic Vision
      required: false
    - id: 3
      name: leadership_skills
      label: Leadership Skills
      hint: null
      type: select_one
      options:
      - Analytical
      - Conceptual
      - Interpersonal
      - Results-Oriented
      required: false
    - id: 4
      name: leadership_style
      label: Leadership Style
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: leader_characteristics
      label: Leader Characteristics
      hint: null
      type: select_multiple
      options:
      - Authentic
      - Charismatic
      - Results-Driven
      required: false
    - id: 6
      name: feedback_sources
      label: Feedback Sources
      hint: null
      type: select_multiple
      options:
      - Colleagues
      - Direct Reports
      - Peers
      required: false
    - id: 7
      name: leadership_development
      label: Leadership Development
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: feedback_frequency
      label: Feedback Frequency
      hint: null
      type: select_one
      options:
      - Less than once a month
      - More than once a month
      - More than once a week
      - More than once a day
      required: false
    - id: 9
      name: communication_methods
      label: Communication Methods
      hint: null
      type: select_multiple
      options:
      - One-on-ones
      - Meetings
      required: false
    - id: 10
      name: leadership_skills_gap
      label: Leadership Skills Gap
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: action_steps
      label: Action Steps
      hint: null
      type: text
      options: []
      required: false
