inputSchema:
  type: object
  properties:
    title: Weekly Progress Check In
    pages:
    - id: 1
      name: weekly_topic
      label: Weekly Topic
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: progress_notes
      label: Progress Notes
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: goals
      label: Goals
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: participation_status
      label: Participation Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 5
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: submission_status
      label: Submission Status
      hint: null
      type: select_one
      options:
      - On Time
      - Late
      required: true
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submitted_to
      label: Submitted To
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: true
    - id: 10
      name: submitted_from
      label: Submitted From
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: true
    - id: 11
      name: submitted_role
      label: Submitted Role
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: true
    - id: 12
      name: confirmation_received
      label: Confirmation Received?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
