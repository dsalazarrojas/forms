inputSchema:
  type: object
  properties:
    title: Beverage New Drink Satisfaction Assessment
    pages:
      - id: 1
        name: customer_name
        label: Your Name
        hint: Enter your name
        type: text
        options: []
        required: true
      - id: 2
        name: customer_email
        label: Email Address
        hint: For follow-up if needed
        type: email
        options: []
        required: false
      - id: 3
        name: visit_date
        label: Visit Date
        hint: When did you try the new drink
        type: date
        options: []
        required: true
      - id: 4
        name: drink_name
        label: New Drink Name
        hint: What is the name of the drink you tried
        type: text
        options: []
        required: true
      - id: 5
        name: drink_size
        label: Drink Size
        hint: What size did you order
        type: select_one
        options:
          - Small
          - Medium
          - Large
          - Extra Large
        required: true
      - id: 6
        name: drink_temperature
        label: Drink Temperature
        hint: Was the drink served hot or cold
        type: select_one
        options:
          - Hot
          - Iced
          - Blended
          - Room Temperature
        required: true
      - id: 7
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall satisfaction
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Somewhat Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 8
        name: taste_rating
        label: Taste Rating
        hint: Rate the taste of the drink
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: sweetness_level
        label: Sweetness Level
        hint: How would you rate the sweetness
        type: select_one
        options:
          - Too Sweet
          - Slightly Sweet
          - Just Right
          - Not Sweet Enough
          - Unsweetened
        required: true
      - id: 10
        name: flavor_strength
        label: Flavor Strength
        hint: How would you rate the flavor intensity
        type: select_one
        options:
          - Too Strong
          - Slightly Strong
          - Just Right
          - Slightly Weak
          - Too Weak
        required: true
      - id: 11
        name: presentation_rating
        label: Presentation Rating
        hint: Rate the visual presentation
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 12
        name: value_rating
        label: Value for Money Rating
        hint: Is the drink worth the price
        type: select_one
        options:
          - Excellent Value
          - Good Value
          - Fair Value
          - Poor Value
          - Very Poor Value
        required: true
      - id: 13
        name: would_order_again
        label: Would You Order This Drink Again
        hint: Is this something you would order again
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 14
        name: would_recommend
        label: Would You Recommend to Others
        hint: Would you recommend this drink to friends
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 15
        name: favorite_aspect
        label: What Did You Like Most
        hint: What was your favorite aspect of this drink
        type: text
        options: []
        required: true
      - id: 16
        name: least_favorite_aspect
        label: What Did You Like Least
        hint: What could be improved about this drink
        type: text
        options: []
        required: false
      - id: 17
        name: comparison_to_existing
        label: How Does This Compare to Existing Menu Items
        hint: Is this better or worse than other drinks
        type: select_one
        options:
          - Much Better
          - Somewhat Better
          - About the Same
          - Somewhat Worse
          - Much Worse
        required: true
      - id: 18
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: What would make this drink better
        type: text
        options: []
        required: false
      - id: 19
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback about this new drink
        type: text
        options: []
        required: false
