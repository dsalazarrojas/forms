inputSchema:
  type: object
  properties:
    title: Allergy Declaration Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 4
      name: event_date
      label: Event Date
      hint: Date of event/visit
      type: date
      options: []
      required: true
    - id: 5
      name: event_name
      label: Event Name
      hint: Name of event or occasion
      type: text
      options: []
      required: false
    - id: 6
      name: party_size
      label: Party Size
      hint: Number in your group
      type: number
      options: []
      required: true
    - id: 7
      name: number_with_allergies
      label: Number with Allergies
      hint: How many have allergies?
      type: number
      options: []
      required: true
    - id: 8
      name: allergic_person_names
      label: Names of Allergic Individuals
      hint: List names
      type: text
      options: []
      required: true
    - id: 9
      name: food_allergies_present
      label: Do You Have Food Allergies?
      hint: Any food allergies?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: specific_allergens
      label: Specific Allergens
      hint: List all allergens
      type: text
      options: []
      required: false
    - id: 11
      name: allergen_categories
      label: Allergen Categories
      hint: Select all that apply
      type: select_multiple
      options:
      - Peanuts
      - Tree nuts
      - Milk/dairy
      - Eggs
      - Wheat/gluten
      - Soy
      - Fish
      - Shellfish
      - Sesame
      - Mustard
      - Sulfites
      - Celery
      - Lupin
      - Mollusks
      - Other
      required: false
    - id: 12
      name: allergy_severity
      label: Allergy Severity
      hint: Rate severity
      type: select_one
      options:
      - Mild (discomfort only)
      - Moderate (medical attention may be needed)
      - Severe (anaphylaxis possible)
      - Life-threatening
      required: true
    - id: 13
      name: reaction_symptoms
      label: Typical Reaction Symptoms
      hint: What symptoms occur?
      type: text
      options: []
      required: false
    - id: 14
      name: cross_contamination_concern
      label: Cross-Contamination Concern
      hint: Is this a concern?
      type: select_one
      options:
      - Yes, very concerned
      - Yes, somewhat concerned
      - No, not concerned
      required: true
    - id: 15
      name: epinephrine_carried
      label: Do You Carry Epinephrine?
      hint: EpiPen or auto-injector
      type: select_one
      options:
      - Yes, always
      - Yes, sometimes
      - 'False'
      required: true
    - id: 16
      name: other_medical_conditions
      label: Other Medical Conditions
      hint: Any related conditions?
      type: text
      options: []
      required: false
    - id: 17
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Foods to avoid
      type: text
      options: []
      required: false
    - id: 18
      name: safe_food_options
      label: Safe Food Options
      hint: What can you eat?
      type: text
      options: []
      required: false
    - id: 19
      name: ingredient_verification
      label: Ingredient Verification Needed
      hint: Do you need to verify ingredients?
      type: select_one
      options:
      - Yes, for all items
      - Yes, for specific items
      - No, I know what is safe
      required: true
    - id: 20
      name: chef_consultation
      label: Chef Consultation Requested
      hint: Would you like to speak with chef?
      type: select_one
      options:
      - Yes, please
      - No, not necessary
      required: false
    - id: 21
      name: separate_preparation
      label: Separate Preparation Requested
      hint: Need separate prep area?
      type: select_one
      options:
      - Yes, essential
      - Yes, preferred
      - No, not necessary
      required: true
    - id: 22
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Who to call in emergency?
      type: text
      options: []
      required: true
    - id: 23
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency number
      type: text
      options: []
      required: true
    - id: 24
      name: medical_insurance
      label: Medical Insurance Provider
      hint: Insurance company
      type: text
      options: []
      required: false
    - id: 25
      name: liability_acknowledgment
      label: Liability Acknowledgment
      hint: Do you understand the risks?
      type: select_one
      options:
      - Yes, I understand the risks
      - 'False'
      required: true
    - id: 26
      name: information_accuracy
      label: Information Accuracy
      hint: I certify this information is accurate
      type: select_one
      options:
      - Yes, all information is accurate
      - 'False'
      required: true
    - id: 27
      name: staff_notification
      label: Staff Notification Consent
      hint: May we inform staff of your allergies?
      type: select_one
      options:
      - Yes, please inform all relevant staff
      - Yes, inform kitchen only
      - 'False'
      required: true
    - id: 28
      name: additional_notes
      label: Additional Notes
      hint: Any other important information
      type: text
      options: []
      required: false
