inputSchema:
  type: object
  properties:
    title: Pet Product Marketing Effectiveness Survey
    pages:
    - id: 1
      name: pet_product_name
      label: Pet Product Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: pet_type
      label: Type of Pet
      hint: null
      type: select_one
      options:
      - cat
      - dog
      - other
      required: true
    - id: 3
      name: pet_age
      label: Pet Age
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: marketing_channels
      label: Marketing Channels
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Email
      - Print
      - Online Advertising
      required: true
    - id: 5
      name: customer_awareness
      label: Customer Awareness
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: referral_intent
      label: Referral Intent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: customer_referral_amount
      label: Customer Referral Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: campaign_impact
      label: Campaign Impact
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: customer_awareness_scale
      label: Customer Awareness Scale
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 10
      name: customer_awareness_score
      label: Customer Awareness Score
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: referral_source
      label: Referral Source
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Email
      - Online Advertising
      required: false
    - id: 12
      name: customer_satisfaction
      label: Satisfied
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Satisfied
      - Not Satisfied
      required: true
