      label: Price
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: price_satisfaction
      label: Satisfaction with the price
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      - Neutral
      required: false
