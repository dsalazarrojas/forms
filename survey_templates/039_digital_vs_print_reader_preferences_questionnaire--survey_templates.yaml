inputSchema:
  type: object
  properties:
    title: Digital Vs Print Reader Preferences Questionnaire
    pages:
    - id: 1
      name: intro_question
      label: What is your preferred way to read books
      hint: null
      type: select_one
      options:
      - Both
      - Print Only
      - Digital Only
      required: false
    - id: 2
      name: age_group
      label: Which of the following best describes your age group
      hint: null
      type: select_one
      options:
      - 18-30
      - 31-45
      - 46-60
      - 61+
      required: false
    - id: 3
      name: education_level
      label: What is your highest level of education
      hint: null
      type: select_one
      options:
      - Some High School
      - High School Diploma or Higher
      - Some College or Post-Secondary
      - Bachelor's or Higher
      required: false
    - id: 4
      name: income_group
      label: Which category best fits your annual income
      hint: null
      type: select_one
      options:
      - < 20,000
      - 20,000 - 40,000
      - 40,000 - 60,000
      - 60,000+
      required: false
    - id: 5
      name: occupation
      label: What is your occupation
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: reading_frequency
      label: How often do you read
      hint: null
      type: select_one
      options:
      - Less than once a week
      - 1-2 times a week
      - 3-5 times a week
      - More than 5 times a week
      required: false
    - id: 7
      name: reading_platform
      label: On which platform do you read most
      hint: null
      type: select_multiple
      options:
      - Ereader/Amazon Kindle
      - Apple iBook
      - Google Play Books
      - Other
      required: false
    - id: 8
      name: reading_format
      label: What format do you prefer to read
      hint: null
      type: select_multiple
      options:
      - Print Books
      - eBook
      - Audiobooks
      required: false
    - id: 9
      name: print_book_format
      label: What print format do you prefer
      hint: null
      type: select_multiple
      options:
      - Paperback
      - Hardcover
      - Magazine/Comic
      - Journal/Trade
      required: false
    - id: 10
      name: online_content_format
      label: What online format do you prefer
      hint: null
      type: select_multiple
      options:
      - PDF
      - ePUB
      - HTML
      required: false
    - id: 11
      name: print_book_size
      label: What print book size do you prefer
      hint: null
      type: select_one
      options:
      - Standard
      - A6
      - A5
      required: false
    - id: 12
      name: read_aloud
      label: Would you be interested in having a book read to you
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: read_aloud_format
      label: If yes, what format would you prefer
      hint: null
      type: select_multiple
      options:
      - Audiobooks
      - Podcasts
      required: false
    - id: 14
      name: read_aloud_speed
      label: If yes, what speed would you prefer
      hint: null
      type: select_one
      options:
      - Normal
      - Faster
      required: false
    - id: 15
      name: language
      label: What language do you prefer your books in
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      required: false
    - id: 16
      name: gender
      label: What is your gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      required: false
    - id: 17
      name: marital_status
      label: What is your marital status
      hint: null
      type: select_one
      options:
      - Single
      - Married
      - Other
      required: false
    - id: 18
      name: education_type
      label: What type of education do you have
      hint: null
      type: select_multiple
      options:
      - Primary School
      - High School
      - College/University
      - Masters/PhD
      required: false
    - id: 19
      name: location
      label: What is your location
      hint: null
      type: select_one
      options:
      - Urban
      - Rural
      - Suburban
      required: false
    - id: 20
      name: income_type
      label: What type of income do you have
      hint: null
      type: select_multiple
      options:
      - Salary
      - Commission
      - Royalties
      - Other
      required: false
    - id: 21
      name: job_type
      label: What type of job do you have
      hint: null
      type: select_one
      options:
      - Part-time
      - Full-time
      - Self-Employed
      required: false
    - id: 22
      name: job_status
      label: What is your job status
      hint: null
      type: select_multiple
      options:
      - Employed
      - Unemployed
      - Retired
      required: false
    - id: 23
      name: employment_type
      label: What type of employment do you have
      hint: null
      type: select_multiple
      options:
      - Employed
      - Unemployed
      - Self-Employed
      required: false
    - id: 24
      name: employment_status
      label: What is your employment status
      hint: null
      type: select_multiple
      options:
      - Full-Time
      - Part-Time
      - Self-Employed
      required: false
    - id: 25
      name: employment_location
      label: Where do you work
      hint: null
      type: select_multiple
      options:
      - Office
      - Home
      - Other
      required: false
