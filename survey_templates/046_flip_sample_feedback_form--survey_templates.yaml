inputSchema:
  type: object
  properties:
    title: Flip Sample Feedback Form
    pages:
    - id: 1
      name: demo_pilot_review
      label: Demo or Pilot Review
      hint: null
      type: select_multiple
      options:
      - Not good
      - Somewhat good
      - Very good
      required: true
    - id: 2
      name: pre_launch_review
      label: Pre-launch Review
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: product_x_experience
      label: Product X Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: suggestions_for_improvement
      label: Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: overall_rating
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: collected_by
      label: Collected by
      hint: null
      type: select_one
      options:
      - Team A
      - Team B
      - Team C
      required: true
    - id: 7
      name: collected_at
      label: Collected at
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: collected_at_time
      label: Collected at time
      hint: null
      type: time
      options: []
      required: true
