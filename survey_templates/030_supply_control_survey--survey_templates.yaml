      name: stock_level
      label: Stock Level
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: stockout
      label: Stockout
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: ordering_performance
      label: Order Performance
      hint: null
      type: select_one
      options:
