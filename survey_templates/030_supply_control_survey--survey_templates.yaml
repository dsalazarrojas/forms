      - Medium
      - High
      required: false
    - id: 4
      name: ordering_frequency
      label: Frequency Of Ordering
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 5
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: order_amount
      label: Order Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: stock_out_reason
      label: Stock out Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: stock_level_frequency
      label: Stock Level Frequency
      hint: null
      type: date
      options: []
      required: false
