inputSchema:
  type: object
  properties:
    title: Consumer Feedback Event Attendance Form
    pages:
    - id: 1
      name: attendee_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: attendee_email
      label: Email Address
      hint: Email for follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: attendee_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 5
      name: company_name
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: false
    - id: 7
      name: event_name
      label: Event Name
      hint: Name of the event attended
      type: text
      options: []
      required: true
    - id: 8
      name: event_date
      label: Event Date
      hint: Date of the event
      type: date
      options: []
      required: true
    - id: 9
      name: event_location
      label: Event Location
      hint: Where was the event held
      type: text
      options: []
      required: true
    - id: 10
      name: attendance_type
      label: Attendance Type
      hint: How did you attend
      type: select_one
      options:
      - In Person
      - Virtual
      - Hybrid
      required: true
    - id: 11
      name: registration_status
      label: Registration Status
      hint: Were you registered
      type: select_one
      options:
      - Pre-Registered
      - Walk-in
      - Invited Guest
      - Speaker
      - Staff
      required: true
    - id: 12
      name: sessions_attended
      label: Sessions Attended
      hint: Select sessions you attended
      type: select_multiple
      options:
      - Opening Keynote
      - Morning Session
      - Afternoon Session
      - Workshop
      - Panel Discussion
      - Networking
      - Closing Remarks
      required: true
    - id: 13
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 14
      name: content_quality
      label: Content Quality
      hint: Rate the quality of content
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 15
      name: speaker_quality
      label: Speaker Quality
      hint: Rate the speakers
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 16
      name: venue_rating
      label: Venue Rating
      hint: Rate the venue if in-person
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      - Not Applicable
      required: false
    - id: 17
      name: organization_rating
      label: Organization Rating
      hint: Rate event organization
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 18
      name: networking_opportunities
      label: Networking Opportunities
      hint: Rate networking chances
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: false
    - id: 19
      name: key_takeaways
      label: Key Takeaways
      hint: What did you learn
      type: text
      options: []
      required: true
    - id: 20
      name: most_valuable_session
      label: Most Valuable Session
      hint: Which session was most useful
      type: text
      options: []
      required: false
    - id: 21
      name: areas_for_improvement
      label: Areas for Improvement
      hint: What could be better
      type: text
      options: []
      required: true
    - id: 22
      name: future_topics
      label: Topics for Future Events
      hint: What would you like to see
      type: text
      options: []
      required: false
    - id: 23
      name: would_recommend
      label: Would You Recommend This Event
      hint: Select if you would recommend
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Neutral
      - Probably No
      - Definitely No
      required: true
    - id: 24
      name: attend_future_events
      label: Would You Attend Future Events
      hint: Select if you would attend again
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
