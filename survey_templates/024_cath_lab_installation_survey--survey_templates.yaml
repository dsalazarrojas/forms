inputSchema:
  type: object
  properties:
    title: Cath Lab Installation Survey
    pages:
    - id: 1
      name: section_facility_info
      label: -- Facility Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: hospital_name
      label: Hospital or Clinic Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: facility_contact
      label: Facility Contact Name
      hint: Project manager or department head
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_facility_details
      label: -- Facility Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: facility_address
      label: Facility Address
      hint: Full address including suite number
      type: text
      options: []
      required: true
    - id: 8
      name: cath_lab_location
      label: Cath Lab Location Within Facility
      hint: Building, floor, room number
      type: text
      options: []
      required: true
    - id: 9
      name: existing_equipment
      label: Existing Cardiac Equipment
      hint: List any current cath lab equipment
      type: text
      options: []
      required: false
    - id: 10
      name: section_site_requirements
      label: -- Site Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: room_dimensions
      label: Cath Lab Room Dimensions
      hint: Length x Width x Height (feet)
      type: text
      options: []
      required: true
    - id: 12
      name: ceiling_height
      label: Ceiling Height
      hint: Feet
      type: number
      options: []
      required: true
    - id: 13
      name: flooring_type
      label: Current Flooring Type
      hint: null
      type: select_one
      options:
      - Concrete
      - Tile
      - Linoleum
      - Wood
      - Other
      required: true
    - id: 14
      name: flooring_condition
      label: Flooring Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Replacement
      required: true
    - id: 15
      name: section_utilities
      label: -- Utilities and Power --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: electrical_service
      label: Electrical Service Available
      hint: Amperage
      type: text
      options: []
      required: true
    - id: 17
      name: backup_power
      label: Backup Power System
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - In Planning
      required: true
    - id: 18
      name: hvac_system
      label: HVAC System Status
      hint: Heating, cooling, ventilation
      type: select_one
      options:
      - Adequate
      - Needs Upgrade
      - Planned Upgrade
      - Inadequate
      required: true
    - id: 19
      name: plumbing_access
      label: Plumbing Access Available
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Limited
      required: true
    - id: 20
      name: section_radiation_safety
      label: -- Radiation Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: shielding_in_place
      label: Radiation Shielding in Place
      hint: Lead lining, protective barriers
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Partial
      - Planned
      required: true
    - id: 22
      name: radiation_safety_officer
      label: Radiation Safety Officer on Staff
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Contracting Out
      required: true
    - id: 23
      name: section_timeline
      label: -- Installation Timeline --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: preferred_installation_date
      label: Preferred Installation Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 25
      name: additional_requirements
      label: Additional Requirements or Notes
      hint: Special considerations, constraints
      type: text
      options: []
      required: false
