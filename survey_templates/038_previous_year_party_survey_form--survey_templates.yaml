inputSchema:
  type: object
  properties:
    title: Previous Year Party Survey Form
    pages:
    - id: 1
      name: party_theme
      label: What was the party theme?
      hint: null
      type: select_one
      options:
      - Theme1
      - Theme2
      - Theme3
      required: false
    - id: 2
      name: party_prophets
      label: Who was a prophet at the party?
      hint: null
      type: select_one
      options:
      - Prophet1
      - Prophet2
      - Prophet3
      required: false
    - id: 3
      name: party_attendees
      label: How many people attended the party?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: party_venue
      label: Where was the party held?
      hint: null
      type: select_one
      options:
      - Venue1
      - Venue2
      - Venue3
      required: false
    - id: 5
      name: party_food
      label: What type of food was served?
      hint: null
      type: select_multiple
      options:
      - Food1
      - Food2
      - Food3
      required: false
    - id: 6
      name: party_dress
      label: What was the dress code for the party?
      hint: null
      type: select_one
      options:
      - Dress1
      - Dress2
      - Dress3
      required: false
    - id: 7
      name: party_entertainment
      label: What type of entertainment was provided?
      hint: null
      type: select_multiple
      options:
      - Entertainment1
      - Entertainment2
      - Entertainment3
      required: false
    - id: 8
      name: party_cost
      label: How much did the party cost?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: party_comments
      label: Do you have any comments about the party?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: party_planner_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: party_prophets_2
      label: Was there a prophet at the party?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: party_prophets2
      label: Was there a second prophet at the party?
      hint: null
      type: checkbox
      options:
      - 'True'
      - 'False'
      required: false
