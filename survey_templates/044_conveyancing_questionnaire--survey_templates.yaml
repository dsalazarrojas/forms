inputSchema:
  type: object
  properties:
    title: Conveyancing Questionnaire
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Legal name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: section_property_details
      label: -- Property Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: property_address
      label: Property Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - Detached House
      - Semi-Detached House
      - Terraced House
      - Flat or Apartment
      - Bungalow
      - Land
      - Commercial
      - Other
      required: true
    - id: 7
      name: tenure
      label: Tenure
      hint: null
      type: select_one
      options:
      - Freehold
      - Leasehold
      - Shared Ownership
      - Commonhold
      - Not Sure
      required: true
    - id: 8
      name: lease_remaining
      label: Years Remaining on Lease
      hint: If leasehold
      type: number
      options: []
      required: false
    - id: 9
      name: section_transaction_details
      label: -- Transaction Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: transaction_type
      label: Transaction Type
      hint: null
      type: select_one
      options:
      - Purchase
      - Sale
      - Remortgage
      - Transfer of Equity
      - Other
      required: true
    - id: 11
      name: purchase_price
      label: Purchase Price
      hint: Agreed price
      type: number
      options: []
      required: false
    - id: 12
      name: completion_date_target
      label: Target Completion Date
      hint: When do you want to complete
      type: date
      options: []
      required: false
    - id: 13
      name: chain_free
      label: Is this a chain-free transaction
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: false
    - id: 14
      name: section_mortgage
      label: -- Mortgage Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: mortgage_required
      label: Will you need a mortgage
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: mortgage_lender
      label: Mortgage Lender Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 17
      name: mortgage_amount
      label: Mortgage Amount
      hint: How much are you borrowing
      type: number
      options: []
      required: false
    - id: 18
      name: deposit_amount
      label: Deposit Amount
      hint: How much deposit
      type: number
      options: []
      required: false
    - id: 19
      name: mortgage_offer_received
      label: Have you received a mortgage offer
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Applied But Not Received
      required: false
    - id: 20
      name: section_legal_details
      label: -- Legal Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: solicitor_on_other_side
      label: Do you know who the other party solicitor is
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: other_solicitor_name
      label: Other Solicitor Name
      hint: If known
      type: text
      options: []
      required: false
    - id: 23
      name: existing_mortgage
      label: Is there an existing mortgage on the property
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: false
    - id: 24
      name: section_planning_building
      label: -- Planning and Building --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: alterations_made
      label: Have any alterations been made to the property
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 26
      name: alterations_details
      label: Alterations Details
      hint: Describe any work done
      type: text
      options: []
      required: false
    - id: 27
      name: planning_permission_obtained
      label: Was planning permission obtained
      hint: If applicable
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Required
      - Not Sure
      required: false
    - id: 28
      name: building_regulations_approval
      label: Was building regulations approval obtained
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Required
      - Not Sure
      required: false
    - id: 29
      name: section_boundaries_disputes
      label: -- Boundaries and Disputes --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: boundary_disputes
      label: Are there any boundary disputes
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 31
      name: neighbor_disputes
      label: Are there any neighbor disputes
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 32
      name: easements_rights_of_way
      label: Are you aware of any easements or rights of way
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: false
    - id: 33
      name: section_utilities_services
      label: -- Utilities and Services --
      hint: null
      type: note
      options: []
      required: false
    - id: 34
      name: water_supply
      label: Water Supply
      hint: null
      type: select_one
      options:
      - Mains Water
      - Private Supply
      - Not Sure
      required: false
    - id: 35
      name: drainage
      label: Drainage
      hint: null
      type: select_one
      options:
      - Mains Drainage
      - Septic Tank
      - Cesspit
      - Not Sure
      required: false
    - id: 36
      name: heating_system
      label: Heating System
      hint: null
      type: select_one
      options:
      - Gas Central Heating
      - Oil Central Heating
      - Electric Heating
      - Other
      - Not Sure
      required: false
    - id: 37
      name: section_occupiers
      label: -- Occupiers --
      hint: null
      type: note
      options: []
      required: false
    - id: 38
      name: current_occupiers
      label: Who currently occupies the property
      hint: null
      type: select_one
      options:
      - Owner Occupied
      - Tenanted
      - Vacant
      - Family Members
      required: false
    - id: 39
      name: anyone_else_living
      label: Will anyone else be living at the property
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 40
      name: occupier_names
      label: Names of Other Occupiers
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 41
      name: section_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 42
      name: special_conditions
      label: Any Special Conditions
      hint: Anything unusual about the transaction
      type: text
      options: []
      required: false
    - id: 43
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
