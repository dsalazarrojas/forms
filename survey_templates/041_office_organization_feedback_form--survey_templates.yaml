      options:
      - '{''label'': ''Fully supported''}'
      - '{''label'': ''Mostly supported''}'
      - '{''label'': ''Neutral''}'
      - '{''label'': ''Somewhat supported''}'
      - '{''label'': ''Not supported at all''}'
