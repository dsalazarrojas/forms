inputSchema:
  type: object
  properties:
    title: Office Organization Feedback Form
    pages:
    - id: 1
      name: office_space_suggestions
      label: What suggestions do you have for improving office space?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: office_resouces_suggestions
      label: What resources do you need to improve productivity?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_satisfaction
      label: How do you feel about your work environment?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 4
      name: manager_support
      label: How well do you feel supported by your manager?
      hint: null
      type: select_multiple
      options:
      - Fully supported
      - Mostly supported
      - Neutral
      - Somewhat supported
      - Not supported at all
      required: true
    - id: 5
      name: communication_channels
      label: What are your preferred communication channels?
      hint: Please separate options with commas
      type: select_multiple
      options:
      - Email
      - Phone
      - Chat
      - In-person
      required: true
    - id: 6
      name: office_equipment
      label: What office equipment do you need to be more productive?
      hint: null
      type: select_multiple
      options:
      - Monitor
      - Keyboard
      - Mouse
      - Headset
      - Printer
      required: true
    - id: 7
      name: noise_level
      label: What is your ideal noise level in the office?
      hint: null
      type: select_one
      options:
      - Quiet
      - Moderate
      - Loud
      required: true
    - id: 8
      name: work_life_balance
      label: Do you feel your work-life balance is adequate?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: suggestions_for_improvement
      label: Is there anything else you'd like to add or suggest?
      hint: null
      type: text
      options: []
      required: false
