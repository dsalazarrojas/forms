inputSchema:
  type: object
  properties:
    title: Coronavirus Business Reopening Survey
    pages:
    - id: 1
      name: business_status
      label: business_status
      hint: null
      type: select_one
      options:
      - Fully Reopened
      - Partially Reopened
      - Closed
      - Not Applicable
      required: false
    - id: 2
      name: reopen_reason
      label: business_reopen_reason
      hint: null
      type: select_multiple
      options:
      - Need help from government
      - Not enough customers
      - Not enough staff
      - Other
      required: false
    - id: 3
      name: reopen_help_needed
