inputSchema:
  type: object
  properties:
    title: Defensive Driving Training Evaluation Form
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_satisfaction
      label: participant_satisfaction
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - not satisfied
      - very dissatisfied
      - not at all satisfied
      required: false
    - id: 3
      name: instruction_quality
      label: instruction_quality
      hint: null
      type: select_multiple
      options:
      - excellent
      - good
      - fair
      - poor
      required: false
    - id: 4
      name: safety_info
      label: safety_info
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: safety_programs
      label: safety_programs
      hint: null
      type: select_multiple
      options:
      - safety program 1
      - safety program 2
      - safety program 3
      required: false
    - id: 7
      name: driving_schools
      label: driving_schools
      hint: null
      type: select_multiple
      options:
      - driving school 1
      - driving school 2
      - driving school 3
      required: false
    - id: 8
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: instructor_name
      label: instructor_name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: instructor_title
      label: instructor_title
      hint: null
      type: text
      options: []
      required: false
