inputSchema:
  type: object
  properties:
    title: AI Tutoring Research Participation Registration
    pages:
    - id: 1
      name: participant_full_name
      label: Participant Full Name
      hint: Your complete legal name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_email
      label: Email Address
      hint: Valid email for study communications
      type: email
      options: []
      required: true
    - id: 3
      name: participant_age_group
      label: Age Group
      hint: Select the age range that applies to you
      type: select_one
      options:
      - Under 18
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65+
      required: true
    - id: 4
      name: education_level
      label: Highest Education Level Completed
      hint: Current or highest level of education achieved
      type: select_one
      options:
      - High School
      - Some College
      - Bachelor's Degree
      - Master's Degree
      - Doctoral Degree
      - Other
      required: true
    - id: 5
      name: subject_interest
      label: Subject Areas of Interest
      hint: Which subjects would you like AI tutoring in?
      type: select_multiple
      options:
      - Mathematics
      - Science
      - Language Arts
      - Social Studies
      - Foreign Languages
      - Computer Science
      - Other
      required: true
    - id: 6
      name: current_grade_level
      label: Current Grade Level
      hint: If currently enrolled in school
      type: text
      options: []
      required: false
    - id: 7
      name: previous_ai_experience
      label: Previous Experience with AI Tutoring
      hint: Have you used AI-based learning tools before?
      type: select_one
      options:
      - None
      - Limited
      - Moderate
      - Extensive
      - Professional
      required: true
    - id: 8
      name: learning_goals
      label: Learning Goals
      hint: What do you hope to achieve through AI tutoring?
      type: text
      options: []
      required: true
    - id: 9
      name: preferred_learning_style
      label: Preferred Learning Style
      hint: How do you learn best?
      type: select_one
      options:
      - Visual
      - Auditory
      - Reading/Writing
      - Kinesthetic
      - Mixed
      required: true
    - id: 10
      name: available_study_time
      label: Available Study Time Per Week
      hint: How many hours can you dedicate to tutoring per week?
      type: number
      options: []
      required: true
    - id: 11
      name: technology_access
      label: Technology Access
      hint: What devices do you have access to for AI tutoring?
      type: select_multiple
      options:
      - Desktop Computer
      - Laptop
      - Tablet
      - Smartphone
      - Internet Connection
      - Printer
      required: true
    - id: 12
      name: consent_participation
      label: Consent to Participate
      hint: I agree to participate in the AI tutoring research study
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: consent_data_collection
      label: Consent to Data Collection
      hint: I agree to allow collection of my learning data for research purposes
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: availability_schedule
      label: Weekly Availability
      hint: What times are you typically available for AI tutoring sessions?
      type: text
      options: []
      required: false
