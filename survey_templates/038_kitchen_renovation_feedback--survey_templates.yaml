inputSchema:
  type: object
  properties:
    title: Kitchen Renovation Feedback
    pages:
    - id: 1
      name: client_satisfaction
      label: Client Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: true
    - id: 2
      name: project_details
      label: Project Details
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: referral_program
      label: Referral Program
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: project_manager
      label: Project Manager
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: renovation_services
      label: Renovation Services
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: client_phone
      label: Client Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: client_email
      label: Client E-mail
      hint: null
      type: email
      options: []
      required: false
