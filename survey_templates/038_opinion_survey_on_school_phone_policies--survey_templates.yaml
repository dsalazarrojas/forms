inputSchema:
  type: object
  properties:
    title: Opinion Survey On School Phone Policies
    pages:
    - id: 1
      name: school_phone_policy_form_1
      label: school_phone_use
      hint: null
      type: select_one
      options:
      - I use my school phone for school business and personal use.
      - I use my school phone for school business, but not for personal use.
      - I do not use my school phone.
      required: true
    - id: 2
      name: school_phone_form_2
      label: school_phone_frequency
      hint: null
      type: select_multiple
      options:
      - Everyday
      - Every other day
      - Rarely
      required: true
    - id: 3
      name: school_phone_form_3
      label: school_phone_safety_concerns
      hint: null
      type: select_multiple
      options:
      - Not at all
      - Somewhat concerned
      - Very concerned
      required: true
    - id: 4
      name: school_phone_form_4
      label: school_phone_purpose
      hint: null
      type: select_one
      options:
      - Stay up to date on school events
      - Check grades
      - Communicate with friends
      - Get help with homework
      required: true
    - id: 5
      name: school_phone_form_5
      label: school_phone_security
      hint: null
      type: select_multiple
      options:
      - Not at all
      - Somewhat concerned
      - Very concerned
      required: true
    - id: 6
      name: school_phone_form_6
      label: school_phone_consequences
      hint: null
      type: select_multiple
      options:
      - I do not use my school phone for anything that could result in consequences
      - I have used my school phone for something that could result in consequences,
        but it was an honest mistake
      - I have used my school phone for something that could result in consequences,
        and I was aware of the risks.
      required: true
    - id: 7
      name: school_phone_form_7
      label: school_phone_consequences_awareness
      hint: null
      type: select_multiple
      options:
      - I am very aware of the consequences of using my school phone.
      - I am somewhat aware of the consequences of using my school phone.
      - I am not at all aware of the consequences of using my school phone.
      required: true
    - id: 8
      name: school_phone_form_8
      label: school_phone_educational_purpose
      hint: null
      type: select_one
      options:
      - Learn about school policies
      - Communicate with teachers
      - Get help with assignments
      - Other
      required: true
