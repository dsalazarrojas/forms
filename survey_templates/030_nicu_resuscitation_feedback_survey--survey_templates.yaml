inputSchema:
  type: object
  properties:
    title: NICU Resuscitation Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: What happened
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_type
      label: Event type
      hint: null
      type: select_one
      options:
      - Cardiac Arrest
      - Seizure
      - Other
      required: false
    - id: 3
      name: staff_involved
      label: Staff involved
      hint: null
      type: select_multiple
      options:
      - Doctor
      - Nurse
      - Respiratory
      - Other
      required: false
    - id: 4
      name: patient_age
      label: Age of patient
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: patient_weight
      label: Weight of patient
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: feedback
      label: Feedback
      hint: Please provide your feedback
      type: note
      options: []
      required: false
    - id: 7
      name: resuscitation_type
      label: Resuscitation type
      hint: null
      type: select_multiple
      options:
      - CPAP
      - PPV
      - Other
      required: false
    - id: 8
      name: complications
      label: Complications
      hint: Check all that apply
      type: select_multiple
      options:
      - None
      - Hypotension
      - Hypertension
      - Hypoxia
      - Bradycardia
      - Other
      required: false
    - id: 9
      name: outcome
      label: Outcome
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      - Other
      required: false
