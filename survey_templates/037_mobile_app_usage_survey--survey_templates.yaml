inputSchema:
  type: object
  properties:
    title: Mobile App Usage Survey
    pages:
    - id: 1
      name: survey_intro
      label: Mobile App Usage Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: mobile_app_used
      label: Have you used a mobile app in the last 30 days?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'False'
      required: false
    - id: 3
      name: frequency_used
      label: How often do you use mobile apps?
      hint: null
      type: select_one
      options:
      - Every day
      - Several times a week
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 4
      name: most_used_apps
      label: Which of the following apps do you use most frequently?
      hint: null
      type: select_multiple
      options:
      - Social media
      - Entertainment
      - Productivity
      - Gaming
      - Navigation
      required: false
    - id: 5
      name: why_used_apps
      label: Why do you use mobile apps?
      hint: null
      type: select_multiple
      options:
      - Convenience
      - Entertainment
      - Productivity
      - Other
      required: false
    - id: 6
      name: how_used_apps
      label: What features do you usually look for when using a mobile app?
      hint: null
      type: select_multiple
      options:
      - Navigation
      - Design
      - Performance
      - Functionality
      - User Interface
      required: false
    - id: 7
      name: app_expectations
      label: What do you expect when using a mobile app?
      hint: null
      type: select_multiple
      options:
      - Easy to use
      - Intuitive
      - Fast
      - Simple
      - Other
      required: false
    - id: 8
      name: app_dislikes
      label: What do you dislike when using a mobile app?
      hint: null
      type: select_multiple
      options:
      - Slow performance
      - Confusing design
      - Difficult to use
      - Other
      required: false
    - id: 9
      name: app_usage_time
      label: How much time do you usually spend on mobile apps?
      hint: null
      type: select_multiple
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-4 hours
      - 4-6 hours
      - More than 6 hours
      required: false
    - id: 10
      name: app_usage_platforms
      label: Which of the following platforms do you use to access mobile apps?
      hint: null
      type: select_multiple
      options:
      - iOS
      - Android
      - Both
      required: false
    - id: 11
      name: app_usage_device
      label: What type of device do you use most frequently to access mobile apps?
      hint: null
      type: select_one
      options:
      - Mobile phone
      - Tablet
      required: false
    - id: 12
      name: app_usage_device_type
      label: What type of device do you typically use to access mobile apps?
      hint: null
      type: select_multiple
      options:
      - Mobile phone
      - Tablet
      - Watch
      - Other
      required: false
