inputSchema:
  type: object
  properties:
    title: sales_team_survey_form
    pages:
    - id: 1
      name: sales_performance
      label: Sales Performance
      hint: A brief description of sales performance
      type: text
      options: []
      required: true
    - id: 2
      name: sales_quotas
      label: Sales Quotas
      hint: null
      type: select_one
      options:
      - Quota 1
      - Quota 2
      - Quota 3
      required: true
    - id: 3
      name: sales_target
      label: Sales Target
      hint: Target to be achieved
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 4
      name: target_time
      label: Target Time
      hint: Target time to be achieved
      type: time
      options: []
      required: false
    - id: 5
      name: performance_date
      label: Performance Date
      hint: Date of last performance review
      type: date
      options: []
      required: false
    - id: 6
      name: target_hours
      label: Target Hours
      hint: Target hours to be worked
      type: number
      options: []
      required: true
    - id: 7
      name: sales_performance_rating
      label: Sales Performance Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Improvement
      required: true
    - id: 8
      name: sales_team_size
      label: Sales Team Size
      hint: Number of people in the sales team
      type: number
      options: []
      required: false
    - id: 9
      name: sales_quotas_distribution
      label: Sales Quotas Distribution
      hint: null
      type: select_multiple
      options:
      - Quota 1
      - Quota 2
      - Quota 3
      required: true
    - id: 10
      name: target_days
      label: Target Days
      hint: Target days to be worked
      type: number
      options: []
      required: true
    - id: 11
      name: sales_performance_evaluation
      label: Sales Performance Evaluation
      hint: Evaluation of sales performance
      type: text
      options: []
      required: true
    - id: 12
      name: target_percentage
      label: Target Percentage
      hint: Target percentage to be achieved
      type: number
      options: []
      required: true
