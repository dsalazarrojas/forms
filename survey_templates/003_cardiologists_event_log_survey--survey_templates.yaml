inputSchema:
  type: object
  properties:
    title: Cardiologists Event Log Survey
    pages:
      - id: 1
        name: event_date
        label: Event Date
        hint: When did the event take place?
        type: date
        options: []
        required: true
      - id: 2
        name: event_name
        label: Event Name
        hint: Title or name of the medical event
        type: text
        options: []
        required: true
      - id: 3
        name: event_location
        label: Event Location
        hint: Where was the event held?
        type: text
        options: []
        required: true
      - id: 4
        name: department_organizer
        label: Department or Organizer
        hint: Which department organized this event?
        type: text
        options: []
        required: true
      - id: 5
        name: respondent_name
        label: Your Name
        hint: Full name of the person providing feedback
        type: text
        options: []
        required: true
      - id: 6
        name: respondent_role
        label: Your Role or Title
        hint: e.g., Cardiologist, Nurse, Staff, Student, Attendee
        type: text
        options: []
        required: true
      - id: 7
        name: attendance_status
        label: What was your role at this event?
        hint: Select your participation level
        type: select_one
        options:
          - Presenter or Speaker
          - Organizer or Staff
          - Attendee or Participant
          - Volunteer
          - Guest
        required: true
      - id: 8
        name: overall_satisfaction
        label: Overall Event Satisfaction
        hint: How satisfied were you with the event?
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Unsatisfied
          - Very Unsatisfied
        required: true
      - id: 9
        name: organization_rating
        label: Organization and Logistics
        hint: Rate the event's planning and execution
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Fair
          - Poor
        required: true
      - id: 10
        name: content_quality
        label: Quality of Content or Presentations
        hint: Rate the educational or informational value
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Fair
          - Poor
        required: true
      - id: 11
        name: networking_opportunity
        label: Networking Opportunities
        hint: Rate the chance to connect with colleagues
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Fair
          - Poor
        required: false
      - id: 12
        name: venue_facilities
        label: Venue and Facilities
        hint: Rate the location, space, and amenities
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Fair
          - Poor
        required: true
      - id: 13
        name: attendance_duration
        label: How long did you attend?
        hint: Approximately how long were you present?
        type: select_one
        options:
          - Full event
          - 3-4 hours
          - 1-2 hours
          - Less than 1 hour
        required: false
      - id: 14
        name: topics_covered
        label: Were the topics relevant to your practice?
        hint: Select all that apply
        type: select_multiple
        options:
          - Heart disease prevention
          - Diagnostic techniques
          - Treatment options
          - Clinical research updates
          - Patient management
          - Professional development
        required: false
      - id: 15
        name: key_takeaway
        label: Most Valuable Takeaway from This Event
        hint: What did you find most useful?
        type: text
        options: []
        required: false
      - id: 16
        name: improvement_areas
        label: What could be improved?
        hint: Specific feedback on areas for enhancement
        type: text
        options: []
        required: false
      - id: 17
        name: would_recommend
        label: Would you recommend this event to colleagues?
        hint: null
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Unsure
          - Probably No
          - Definitely No
        required: true
      - id: 18
        name: future_topics
        label: Topics for Future Events
        hint: What subjects would you like to see covered?
        type: text
        options: []
        required: false
      - id: 19
        name: speaker_feedback
        label: Speaker or Presentation Quality
        hint: How would you rate the speakers?
        type: select_one
        options:
          - Excellent - Very knowledgeable and engaging
          - Good - Informative and clear
          - Average - Adequate information
          - Fair - Could be improved
          - Poor - Not helpful
        required: false
      - id: 20
        name: event_frequency
        label: How often should we hold events like this?
        hint: null
        type: select_one
        options:
          - Monthly
          - Quarterly
          - Semi-annually
          - Annually
          - As needed
        required: false
      - id: 21
        name: additional_comments
        label: Additional Comments or Suggestions
        hint: Any other feedback?
        type: text
        options: []
        required: false
