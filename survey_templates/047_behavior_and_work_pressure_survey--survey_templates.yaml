inputSchema:
  type: object
  properties:
    title: Behavior And Work Pressure Survey
    pages:
    - id: 1
      name: section_workplace_context
      label: -- Workplace Context --
      hint: All responses are confidential and used for organizational improvement
      type: note
      options: []
      required: false
    - id: 2
      name: department_name
      label: Current Department
      hint: null
      type: select_one
      options:
      - Administration
      - Customer Service
      - Engineering / IT
      - Sales and Marketing
      - Human Resources
      - Operations
      required: true
    - id: 3
      name: years_with_company
      label: Years with the Organization
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1 - 3 years
      - 3 - 5 years
      - 5 - 10 years
      - Over 10 years
      required: true
    - id: 4
      name: section_work_pressure_assessment
      label: -- Work Pressure Assessment --
      hint: Rate your level of agreement with the following statements
      type: note
      options: []
      required: false
    - id: 5
      name: workload_manageability
      label: My current workload is manageable within my contracted hours
      hint: 1 strongly disagree, 5 strongly agree
      type: number
      options: []
      required: true
    - id: 6
      name: deadline_stress_frequency
      label: How often do you feel stressed by tight deadlines?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: true
    - id: 7
      name: resource_adequacy
      label: I have the necessary tools and resources to do my job effectively
      hint: 1 to 5 scale
      type: number
      options: []
      required: true
    - id: 8
      name: support_from_management
      label: I feel supported by my direct supervisor when work pressure is high
      hint: 1 to 5 scale
      type: number
      options: []
      required: true
    - id: 9
      name: section_behavioral_impact
      label: -- Behavioral Impact --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: physical_symptoms_of_stress
      label: Have you experienced physical symptoms of stress in the last month?
      hint: e.g. headaches, fatigue, sleep issues
      type: select_one
      options:
      - Frequently
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 11
      name: work_life_balance_satisfaction
      label: Satisfaction with your current work-life balance
      hint: 0 to 10 scale
      type: number
      options: []
      required: true
    - id: 12
      name: burnout_risk_self_perception
      label: Do you feel at risk of burnout in your current role?
      hint: null
      type: select_one
      options:
      - High Risk
      - Moderate Risk
      - Low Risk
      - No Risk
      required: true
    - id: 13
      name: section_improvement_suggestions
      label: -- Suggestions for Improvement --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: top_stress_factor
      label: What is the single biggest factor contributing to your work pressure?
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: desired_support_measures
      label: Which measures would help reduce your work pressure?
      hint: Select all that apply
      type: select_multiple
      options:
      - More Flexible Working Hours
      - Additional Staffing / Headcount
      - Improved Project Management Tools
      - Mental Health and Wellbeing Days
      - Clearer Prioritization from Leadership
      - Training on Time Management
      required: false
    - id: 16
      name: additional_comments_work_pressure
      label: Any other comments regarding workplace behavior or pressure?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: survey_completion_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
