inputSchema:
  type: object
  properties:
    title: High Scores Survey
    pages:
    - id: 1
      name: game_info
      label: Game Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: high_score
      label: Your High Score
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: player_name
      label: Player Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 6
      name: game_type
      label: Game Type
      hint: null
      type: select_multiple
      options:
      - Online
      - Offline
      - Both
      required: true
    - id: 7
      name: playtime
      label: Playtime
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
