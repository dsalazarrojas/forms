inputSchema:
  type: object
  properties:
    title: Social Care Digital Transformation Survey
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: Welcome to the Social Care Digital Transformation Survey!
      type: text
      options: []
      required: false
    - id: 2
      name: tool_transform
      label: Digital Transformation
      hint: What area of digital transformation would you like to help with?
      type: select_one
      options:
      - Digital Tools
      - Skills Development
      - Priorities
      required: false
    - id: 3
      name: tool_transform_answer
      label: Please describe your chosen transformation
      hint: Provide more details about your chosen area
      type: text
      options: []
      required: false
    - id: 4
      name: skill_development
      label: Skills Development
      hint: What level of skills development do you need?
      type: select_one
      options:
      - Basic Skills
      - Intermediate Skills
      - Advanced Skills
      required: false
    - id: 5
      name: skill_development_answer
      label: Please provide more details about your chosen skills development
      hint: Describe how you will use these skills to achieve your goals
      type: text
      options: []
      required: false
    - id: 6
      name: frequency_use
      label: Frequency of Use
      hint: How often would you use the new skill?
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: Do you have any other feedback on our digital tools?
      type: text
      options: []
      required: false
    - id: 8
      name: feedback_answer
      label: Please provide your feedback
      hint: Share your thoughts on how we can improve our digital tools
      type: text
      options: []
      required: false
    - id: 9
      name: thanks
      label: Thank you!
      hint: Thank you for taking the time to provide us feedback
      type: text
      options: []
      required: false
