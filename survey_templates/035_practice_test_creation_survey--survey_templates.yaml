inputSchema:
  type: object
  properties:
    title: Practice Test Creation Survey
    pages:
    - id: 1
      name: practice_test_creation_survey
      label: what_is_your_role
      hint: null
      type: select_one
      options:
      - Educator
      - Tutor
      - Training Team
      required: true
    - id: 2
      name: how_many_years_have_you_been_in_education
      label: years_in_education
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: what_type_of_test_did_you_create
      label: test_type
      hint: null
      type: select_multiple
      options:
      - Practice Exam
      - Final Exam
      - Mock Exam
      required: true
    - id: 4
      name: practice_test_creation_survey_uses
      label: test_uses
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Other (please specify)
      required: true
    - id: 5
      name: practice_test_creation_survey_why
      label: why_do_you_create_practice_tests
      hint: null
      type: select_multiple
      options:
      - Time management and efficiency
      - To assess student preparation and engagement
      - To evaluate student learning progression
      required: true
    - id: 6
      name: practice_test_creation_survey_frequency
      label: frequency_of_practice_test_creation
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - As needed
      required: true
    - id: 7
      name: practice_test_creation_survey_difficulty
      label: test_difficulty_level
      hint: null
      type: select_multiple
      options:
      - Easy
      - Medium
      - Hard
      required: true
    - id: 8
      name: practice_test_creation_survey_who_did_you_create
      label: who_did_you_create_the_test
      hint: null
      type: select_multiple
      options:
      - Yourself
      - Another teacher/educator
      - Training team
      required: false
    - id: 9
      name: practice_test_creation_survey_time_taken
      label: time_taken_to_create_test
      hint: null
      type: select_multiple
      options:
      - Less than an hour
      - Between 1-2 hours
      - Between 2-5 hours
      - More than 5 hours
      required: true
    - id: 10
