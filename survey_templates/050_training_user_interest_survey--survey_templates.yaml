inputSchema:
  type: object
  properties:
    title: Training User Interest Survey
    pages:
    - id: 1
      name: question_1
      label: What is your job title?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_2
      label: What are you interested in learning?
      hint: null
      type: select_one
      options:
      - option 1
      - option 2
      - option 3
      required: false
    - id: 3
      name: question_3
      label: What's your job level?
      hint: null
      type: select_multiple
      options:
      - beginner
      - intermediate
      - advanced
      required: false
    - id: 4
      name: question_4
      label: What is your preferred format for training?
      hint: null
      type: select_one
      options:
      - in person
      - self paced
      - live
      required: false
    - id: 5
      name: question_5
      label: How do you want to be trained?
      hint: In order to create a training program, You need to know your audience.
      type: note
      options: []
      required: false
    - id: 6
      name: question_6
      label: What skills do you think are required?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: question_7
      label: What skills have you got already?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: question_8
      label: What format would you like to have training in?
      hint: null
      type: select_one
      options:
      - classroom
      - online
      - in-person
      required: false
    - id: 9
      name: question_9
      label: How much time do you have?
      hint: null
      type: select_multiple
      options:
      - morning
      - afternoon
      - evening
      required: false
    - id: 10
      name: question_10
      label: How often do you want to get trained?
      hint: null
      type: select_one
      options:
      - weekly
      - monthly
      - quarterly
      required: false
    - id: 11
      name: question_11
      label: What skills do you want to learn?
      hint: In order to create a training program, You need to know your audience.
      type: select_multiple
      options:
      - skill 1
      - skill 2
      - skill 3
      required: false
