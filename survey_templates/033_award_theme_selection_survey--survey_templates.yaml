          - 3 - Average
          - 4 - Good
          - 5 - Excellent
        required: true
      - id: 8
        name: theme_3_rating
        label: Elegant Enigma - Masquerade and Mystery
        hint: null
        type: select_one
        options:
          - 1 - Poor
          - 2 - Fair
          - 3 - Average
          - 4 - Good
          - 5 - Excellent
        required: true
      - id: 9
        name: theme_4_rating
