inputSchema:
  type: object
  properties:
    title: Equine Learning Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: session_date
      label: What was the date of your equine learning session?
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: session_time
      label: What time was your equine learning session?
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: session_location
      label: Where did your equine learning session take place?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: session_instructor
      label: Who was your instructor?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: session_instructor_rating
      label: How would you rate your instructor?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: session_content
      label: What did you find most valuable in the session?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: session_content_2
      label: What did you find least valuable in the session?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: suggestions
      label: Do you have any suggestions for future sessions?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: participant_contact_info
      label: Participant Contact Info
      hint: null
      type: text
      options: []
      required: false
