inputSchema:
  type: object
  properties:
    title: Tax Filing Experience Survey
    pages:
    - id: 1
      name: home_page
      label: Home Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_page
      label: Intro
      hint: Please read the instructions and questions carefully before starting.
      type: text
      options: []
      required: true
    - id: 3
      name: question_1
      label: Satisfaction
      hint: Select the level of satisfaction for the following experience.
      type: select_multiple
      options:
      - Highly Satisfied
      - Somewhat Satisfied
      - Neither Satisfied Nor Dissatisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
