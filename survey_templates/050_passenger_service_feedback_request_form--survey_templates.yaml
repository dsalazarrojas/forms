inputSchema:
  type: object
  properties:
    title: Passenger Service Feedback Request Form
    pages:
    - id: 1
      name: passenger_service_provider
      label: passenger_service_provider
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: route
      label: route
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: service_type
      label: service_type
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: overall_satisfaction
      label: overall_satisfaction
      hint: null
      type: select_one
      options:
      - Very dissatisfied
      - Somewhat dissatisfied
      - Neutral
      - Somewhat satisfied
      - Very satisfied
      required: true
    - id: 5
      name: service_quality
      label: service_quality
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: false
    - id: 6
      name: communication
      label: communication
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: false
    - id: 7
      name: cleanliness
      label: cleanliness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: false
    - id: 8
      name: punctuality
      label: punctuality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Late
      - Very Late
      required: false
    - id: 9
      name: value_for_money
      label: value_for_money
      hint: null
      type: select_one
      options:
      - Very cheap
      - Somewhat cheap
      - Average
      - Somewhat expensive
      - Very expensive
      required: false
    - id: 10
      name: comfort
      label: comfort
      hint: null
      type: text
      options: []
      required: false
