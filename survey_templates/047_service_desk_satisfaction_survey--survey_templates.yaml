inputSchema:
  type: object
  properties:
    title: service_desk_satisfaction_survey
    pages:
    - id: 1
      name: service_desk_satisfaction
      label: Service Desk Satisfaction
      hint: null
      type: select_multiple
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 2
      name: overall_experience
      label: Overall Experience
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: time_to_respond_to_request
      label: Time to Respond to Request
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: quality_of_service
      label: Quality of Service
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 5
      name: communication_with_support
      label: Communication with Support
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: resolution_of_issue
      label: Resolution of Issue
      hint: null
      type: select_one
      options:
      - Fully Resolved
      - Partially Resolved
      - Not Resolved
      required: false
    - id: 7
      name: resolution_of_issue_2
      label: Resolution of Issue 2
      hint: null
      type: select_one
      options:
      - Fully Resolved
      - Partially Resolved
      - Not Resolved
      required: false
    - id: 8
      name: resolution_of_issue_3
      label: Resolution of Issue 3
      hint: null
      type: select_one
      options:
      - Fully Resolved
      - Partially Resolved
      - Not Resolved
      required: false
