inputSchema:
  type: object
  properties:
    title: School Facilities Survey
    pages:
    - id: 1
      name: school_facilities_survey
      label: school_fundamentals
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: facilities_condition
      label: facilities_condition
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: facilities_condition_facilities_type
      label: facilities_type
      hint: null
      type: select_one
      options:
      - School Building Condition - Excellent
      - School Building Condition - Very Good
      - School Building Condition - Needs Improvement
      - School Building Condition - Bad
      required: true
    - id: 4
      name: facilities_condition_facilities_rating
      label: facilities_rating
      hint: null
      type: select_one
      options:
      - 4 - Excellent
      - 3 - Very Good
      - 2 - Fair
      - 1 - Poor
      required: true
    - id: 5
      name: facilities_condition_facilities_equipment
      label: facilities_equipment
      hint: null
      type: select_multiple
      options:
      - Classrooms and Chairs
      - Technology and Equipment
      - Library and Resources
      - Outdoor and Recreational Spaces
      - Parking and Transportation
      required: true
    - id: 6
      name: facilities_condition_facilities_safety
      label: facilities_safety
      hint: null
