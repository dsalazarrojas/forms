inputSchema:
  type: object
  properties:
    title: Local Attraction Satisfaction Assessment
    pages:
    - id: 1
      name: introduction
      label: what-is-your-name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tour_experience
      label: what-was-the-tour-experience-like
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: tour_guides
      label: how-would-you-rate-the-guides
      hint: on-a-scale-from-1-to-5
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: facilities
      label: what-were-the-facilities-like
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: overall_experience
      label: overall-experience
      hint: null
      type: select_one
      options:
      - very-good
      - good
      - fair
      - poor
      - very-poor
      required: false
    - id: 6
      name: recommendations
      label: have-you-got-any-recommendations
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact_us
      label: contact-us
      hint: null
      type: select_one
      options:
      - email
      - phone
      - none
      required: false
