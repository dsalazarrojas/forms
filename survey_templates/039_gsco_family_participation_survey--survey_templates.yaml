inputSchema:
  type: object
  properties:
    title: gSCO Family Participation Survey
    pages:
    - id: 1
      name: family_level_of_comfort
      label: Family level of comfort with in-person events
      hint: Rate your comfort level with participating in in-person events
      type: number
      options: []
      required: false
    - id: 2
      name: event_frequency
      label: Frequency of in-person event participation
      hint: How often do you participate in events that are in-person?
      type: number
      options: []
      required: false
    - id: 3
      name: event_type
      label: Type of event
      hint: What type of event is your family most likely to participate in?
      type: select_one
      options:
      - Event with friends
      - Event with family
      - Event with a mix of both
      - No preference
      required: false
    - id: 4
      name: participation_method
      label: How do you usually participate in events with your family?
      hint: How do you usually participate in events with your family?
      type: select_multiple
      options:
      - In-person
      - Virtual
      - Mixed
      - No preference
      required: false
    - id: 5
      name: typical_participation
      label: Typical family event participation
      hint: Describe your typical family event participation
      type: note
      options: []
      required: false
    - id: 6
      name: day_of_week
      label: Day of the week for family events
      hint: What day of the week do you usually participate in family events?
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_participation
      label: Time of day for family events
      hint: At what time do you usually participate in family events?
      type: time
      options: []
      required: false
    - id: 8
      name: event_days
      label: Event Days
      hint: Do you usually participate in family events on weekdays or weekends?
      type: select_multiple
      options:
      - Weekdays
      - Weekends
      required: false
    - id: 9
      name: communication_methods
      label: Communication methods with family members
      hint: What type of communication methods do you usually use with family members?
      type: select_multiple
      options:
      - Calls
      - Messages
      - Emails
      - Video calls
      - Social media
      - In-person
      required: false
    - id: 10
      name: communication_frequency
      label: Frequency of communication with family members
      hint: How often do you communicate with family members?
      type: number
      options: []
      required: false
    - id: 11
      name: time_zone
      label: Time zone for family events
      hint: What time zone do you usually participate in family events?
      type: text
      options: []
      required: false
    - id: 12
      name: description
      label: Description
      hint: Describe your family's event participation
      type: note
      options: []
      required: false
