inputSchema:
  type: object
  properties:
    title: Customer Support Feedback Survey
    pages:
    - id: 1
      name: contact_reason
      label: What was the reason for your recent contact with our support team?
      hint: Please select a reason.
      type: select_one
      options:
      - I was having trouble with a product/service.
      - I had a general inquiry.
      - I experienced a technical issue.
      - I needed help with an order.
      required: false
    - id: 2
      name: experience_rating
      label: How would you rate your overall experience with our support team?
      hint: Select a rating from 1 to 5.
      type: select_one
      options:
      - 1 - Very Poor
      - 2 - Poor
      - 3 - Neutral
      - 4 - Good
      - 5 - Excellent
      required: true
    - id: 3
      name: issue_resolution
      label: Were you satisfied with the resolution of your issue?
      hint: Please respond with a yes or no answer.
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 4
      name: email_notifications
      label: Would you like to receive email notifications from our support team in
        the future?
      hint: Select a preference.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: responsiveness
      label: How would you rate the responsiveness of our support team?
      hint: Rate from 1 to 5.
      type: select_one
      options:
      - 1 - Very Slow
      - 2 - Slow
      - 3 - Average
      - 4 - Fast
      - 5 - Extremely Fast
      required: false
    - id: 6
      name: additional_feedback
      label: Do you have any additional feedback or suggestions for our support team?
      hint: Please provide any additional comments.
      type: text
      options: []
      required: false
    - id: 7
      name: past_contact
      label: Have you received any support from our team in the past?
      hint: Please respond with a yes or no answer.
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 8
      name: main_issue
      label: What was the main issue you contacted us about?
      hint: Please provide a brief description.
      type: text
      options: []
      required: false
    - id: 9
      name: communication
      label: How did you feel about the communication from our support team during
        your recent contact?
      hint: Rate from 1 to 5.
      type: select_one
      options:
      - 1 - Very Poor
      - 2 - Poor
      - 3 - Neutral
      - 4 - Good
      - 5 - Excellent
      required: false
    - id: 10
      name: recommendation
      label: Would you recommend our support team to a friend or colleague?
      hint: Select a preference.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
