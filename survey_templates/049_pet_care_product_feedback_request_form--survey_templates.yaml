inputSchema:
  type: object
  properties:
    title: Pet Care Product Feedback Request Form
    pages:
    - id: 1
      name: pet_care_product_name
      label: Pet Care Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_image
      label: Product Image
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: product_rating
      label: Product Rating
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: product_review
      label: Product Review
      hint: null
      type: select_one
      options:
      - Excellent
      - Satisfactory
      - Average
      - Unsatisfactory
      required: false
    - id: 5
      name: product_rating_scale
      label: Product Rating (Scale)
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: product_price
      label: Product Price
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: product_quality
      label: Product Quality
      hint: null
      type: time
      options: []
      required: false
