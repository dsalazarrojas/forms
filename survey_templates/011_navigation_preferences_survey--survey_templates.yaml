inputSchema:
  type: object
  properties:
    title: Navigation Preferences Survey
    pages:
    - id: 1
      name: survey_template_type
      label: Survey Templates
      hint: null
      type: select_one
      options:
      - Survey Templates
      - Product Surveys
      required: true
    - id: 2
      name: navigation_tool_usage
      label: Navigation Tool Usage
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 4
      name: feature_priorities
      label: Feature Priorities
      hint: null
      type: select_multiple
      options:
      - Navigation Bar
      - Navigation Menu
      required: true
    - id: 5
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
