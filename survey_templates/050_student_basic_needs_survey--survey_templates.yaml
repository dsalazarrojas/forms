inputSchema:
  type: object
  properties:
    title: Student Basic Needs Survey
    pages:
    - id: 1
      name: intro_page
      label: Survey Introduction
      hint: This survey is for school use only.
      type: note
      options: []
      required: false
    - id: 2
      name: basic_needs_question_page
      label: What do you need most when you're feeling stressed or overwhelmed?
      hint: Select one option.
      type: text
      options: []
      required: false
    - id: 3
      name: access_to_food_page
      label: Access to Basic Needs
      hint: Select one option.
      type: select_one
      options:
      - Often
      - Sometimes
      - Never
      required: false
    - id: 4
      name: rating_access_page
      label: Rate Your Access to Basic Needs
      hint: Select all that apply.
      type: select_multiple
      options:
      - Food
      - Shelter
      - Clothing and Personal Care
      - Education and Job Training
      - Health Care
      - Other (please specify)
      required: false
    - id: 5
      name: lacking_basic_needs_page
      label: Basic Needs I'm Lacking
      hint: Please specify a basic need.
      type: text
      options: []
      required: false
    - id: 6
      name: access_to_shelter_page
      label: Access to Shelter
      hint: Select one option.
      type: select_one
      options:
      - Often
      - Sometimes
      - Never
      required: false
    - id: 7
      name: difficulty_accessing_needs_page
      label: Basic Needs I'm Having Difficulty Accessing
      hint: Select all that apply.
      type: select_multiple
      options:
      - Food
      - Shelter
      - Clothing and Personal Care
      - Education and Job Training
      - Health Care
      - Other (please specify)
      required: false
    - id: 8
      name: challenging_situation_page
      label: Challenging Situation
      hint: Please share a situation where you had to choose between basic needs.
      type: note
      options: []
      required: false
    - id: 9
      name: access_to_care_page
      label: Access To Care Page
      hint: Select one option.
      type: select_one
      options:
      - Often
      - Sometimes
      - Never
      required: false
    - id: 10
      name: suggestions_page
      label: Suggestion
      hint: Please suggest an idea to improve access to basic needs.
      type: text
      options: []
      required: false
    - id: 11
      name: satisfaction_page
      label: Satisfaction with Access to Basic Needs
      hint: Select all that apply.
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      - None
      required: false
