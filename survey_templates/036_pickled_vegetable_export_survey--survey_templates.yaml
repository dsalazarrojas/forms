inputSchema:
  type: object
  properties:
    title: Pickled Vegetable Export Survey
    pages:
    - id: 1
      name: export_survey
      label: What is your export survey?
      hint: Please provide a brief description of your export survey.
      type: text
      options: []
      required: true
    - id: 2
      name: destinations
      label: Which destinations do you export to?
      hint: List the countries or regions you export to.
      type: select_multiple
      options:
      - USA
      - Mexico
      - Canada
      - China
      - Japan
      - Korea
      - Europe
      - Other Country
      required: true
    - id: 3
      name: export_products
      label: What pickled vegetable products do you export?
      hint: Please select the products you export.
      type: select_one
      options:
      - Pickled Cucumbers
      - Pickled Peppers
      - Pickled Olives
      - Pickled Tomatoes
      - Pickled Beets
      - Pickled Onions
      - Pickled Carrots
      required: true
    - id: 4
      name: quantity
      label: How much do you export per shipment?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: operational_issues
      label: Do you face any operational issues?
      hint: Yes or No
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: export_channels
      label: Which export channels do you use?
      hint: Please select one export channel.
      type: select_one
      options:
      - Trade Shows
      - Online Marketplaces
      - Retailers
      - Exporters Associations
      required: true
    - id: 7
      name: export_value
      label: What is the export value per shipment?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: exported_to
      label: Where do you export?
      hint: List the countries or regions you export to.
      type: select_multiple
      options:
      - USA
      - Mexico
      - Canada
      - China
      - Japan
      - Korea
      - Europe
      - Other Country
      required: true
    - id: 9
      name: export_issues
      label: Do you face any export issues?
      hint: Yes or No
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: export_products_2
      label: Export Products 2
      hint: null
      type: select_one
      options:
      - Pickled Cucumbers
      - Pickled Peppers
      - Pickled Olives
      - Pickled Tomatoes
      - Pickled Beets
      - Pickled Onions
      - Pickled Carrots
      required: false
    - id: 11
      name: total_exports
      label: How many total exports per shipment?
      hint: null
      type: number
      options: []
      required: false
