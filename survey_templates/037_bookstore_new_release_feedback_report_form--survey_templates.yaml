inputSchema:
  type: object
  properties:
    title: Bookstore New Release Feedback Report Form
    pages:
      - id: 1
        name: staff_name
        label: Staff Member Name
        hint: Your name
        type: text
        options: []
        required: true
      - id: 2
        name: report_date
        label: Report Date
        hint: Date of this feedback
        type: date
        options: []
        required: true
      - id: 3
        name: book_title
        label: Book Title
        hint: Title of the new release
        type: text
        options: []
        required: true
      - id: 4
        name: book_author
        label: Author Name
        hint: Author or authors
        type: text
        options: []
        required: true
      - id: 5
        name: genre
        label: Genre
        hint: Primary genre of the book
        type: select_one
        options:
          - Fiction
          - Mystery
          - Romance
          - Science Fiction
          - Fantasy
          - Biography
          - Non-fiction
          - Self-help
          - History
          - Children
          - Other
        required: true
      - id: 6
        name: publisher_name
        label: Publisher Name
        hint: Publishing company
        type: text
        options: []
        required: false
      - id: 7
        name: release_date
        label: Release Date
        hint: Official publication date
        type: date
        options: []
        required: false
      - id: 8
        name: cover_design_rating
        label: Cover Design Rating
        hint: Rate the cover design
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Average
          - Poor
        required: true
      - id: 9
        name: book_quality
        label: Book Quality and Production
        hint: Print quality, binding, etc.
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Average
          - Poor
        required: true
      - id: 10
        name: reader_reaction
        label: Expected Reader Reaction
        hint: How will customers respond
        type: select_one
        options:
          - Very positive
          - Positive
          - Neutral
          - Negative
          - Very negative
        required: true
      - id: 11
        name: sales_potential
        label: Sales Potential
        hint: Expected sales performance
        type: select_one
        options:
          - High
          - Moderate
          - Low
          - Very low
        required: true
      - id: 12
        name: display_recommendation
        label: Display Recommendation
        hint: Should we feature this prominently
        type: select_one
        options:
          - Front display
          - Window display
          - Staff picks
          - Regular shelf
          - Not recommended
        required: true
      - id: 13
        name: target_audience
        label: Target Audience
        hint: Who would buy this book
        type: select_multiple
        options:
          - Young adults
          - Adults
          - Seniors
          - Students
          - General public
          - Niche audience
        required: true
      - id: 14
        name: comparison_titles
        label: Similar Books Already Selling
        hint: Comparable titles in store
        type: text
        options: []
        required: false
      - id: 15
        name: additional_feedback
        label: Additional Feedback
        hint: Any other comments
        type: text
        options: []
        required: false
