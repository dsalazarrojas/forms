inputSchema:
  type: object
  properties:
    title: Hamstring Exercise Instruction Form
    pages:
    - id: 1
      name: participant_confirmation
      label: Participant Confirmation
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: exercise_type
      label: Exercise Type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Type 1''}'
      - '{''id'': 2, ''label'': ''Type 2''}'
      required: true
    - id: 3
      name: exercise_frequency
      label: Exercise Frequency
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: form_submitted
      label: Form Submitted
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''Submitted''}'
      - '{''id'': 2, ''label'': ''Not Submitted''}'
      required: true
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
