inputSchema:
  type: object
  properties:
    title: Community Volunteer Program Survey
    pages:
      - id: 1
        name: volunteer_name
        label: Your Name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: volunteer_email
        label: Email Address
        hint: For follow-up
        type: email
        options: []
        required: false
      - id: 3
        name: program_name
        label: Which volunteer program did you participate in?
        hint: Select the program
        type: select_one
        options:
          - Youth Mentoring Program
          - Food Bank Services
          - Environmental Cleanup
          - Senior Companion Program
          - Animal Shelter Support
          - Hospital Volunteer
          - Library Services
          - Community Garden
          - Disaster Response
          - Homeless Services
          - Education/Tutoring
          - Other
        required: true
      - id: 4
        name: participation_duration
        label: How long have you been volunteering?
        hint: Duration of service
        type: select_one
        options:
          - Less than 1 month
          - 1-3 months
          - 4-6 months
          - 7-12 months
          - 1-2 years
          - 2-5 years
          - Over 5 years
        required: true
      - id: 5
        name: hours_per_month
        label: Approximately how many hours do you volunteer per month?
        hint: Time commitment
        type: select_one
        options:
          - Less than 5 hours
          - 5-10 hours
          - 11-20 hours
          - 21-30 hours
          - 31-40 hours
          - Over 40 hours
        required: true
      - id: 6
        name: overall_satisfaction
        label: Overall, how satisfied are you with the volunteer program?
        hint: Your experience
        type: select_one
        options:
          - Very Dissatisfied
          - Dissatisfied
          - Neutral
          - Satisfied
          - Very Satisfied
        required: true
      - id: 7
        name: orientation_rating
        label: How would you rate the volunteer orientation process?
        hint: Initial training and onboarding
        type: select_one
        options:
          - Poor
          - Fair
          - Good
          - Very Good
          - Excellent
          - Did not receive orientation
        required: true
      - id: 8
        name: training_rating
        label: How would you rate the training provided?
        hint: Preparation for your role
        type: select_one
        options:
          - Poor
          - Fair
          - Good
          - Very Good
          - Excellent
          - Did not receive training
        required: true
      - id: 9
        name: supervisor_support
        label: How supported do you feel by your supervisor?
        hint: Management support
        type: select_one
        options:
          - Not Supported
          - Somewhat Supported
          - Neutral
          - Supported
          - Very Well Supported
        required: true
      - id: 10
        name: role_clarity
        label: Do you have a clear understanding of your role?
        hint: Role expectations
        type: select_one
        options:
          - Not at All Clear
          - Somewhat Clear
          - Neutral
          - Clear
          - Very Clear
        required: true
      - id: 11
        name: resources_adequate
        label: Do you have the resources needed to be effective?
        hint: Tools, materials, support
        type: select_one
        options:
          - Not at All
          - Somewhat
          - Neutral
          - Mostly Yes
          - Definitely Yes
        required: true
      - id: 12
        name: impact_feeling
        label: Do you feel your volunteer work makes a difference?
        hint: Sense of impact
        type: select_one
        options:
          - Not at All
          - A Little
          - Somewhat
          - Yes, Definitely
          - Absolutely
        required: true
      - id: 13
        name: skills_utilized
        label: Are your skills being well utilized?
        hint: Using your abilities
        type: select_one
        options:
          - Not at All
          - Somewhat
          - Neutral
          - Mostly Yes
          - Yes, Completely
        required: true
      - id: 14
        name: skills_developed
        label: Have you developed new skills through volunteering?
        hint: Skill development
        type: select_one
        options:
          - No
          - Yes, a few
          - Yes, several
          - Yes, many new skills
        required: true
      - id: 15
        name: new_skills_list
        label: If yes, what new skills have you developed?
        hint: List skills gained
        type: text
        options: []
        required: false
      - id: 16
        name: schedule_flexibility
        label: How satisfied are you with schedule flexibility?
        hint: Work-life balance
        type: select_one
        options:
          - Very Dissatisfied
          - Dissatisfied
          - Neutral
          - Satisfied
          - Very Satisfied
        required: true
      - id: 17
        name: communication_rating
        label: How would you rate communication from the organization?
        hint: Updates and information
        type: select_one
        options:
          - Poor
          - Fair
          - Good
          - Very Good
          - Excellent
        required: true
      - id: 18
        name: recognition_feeling
        label: Do you feel appreciated and recognized for your contributions?
        hint: Volunteer appreciation
        type: select_one
        options:
          - Not at All
          - Somewhat
          - Neutral
          - Mostly Yes
          - Definitely Yes
        required: true
      - id: 19
        name: would_recommend
        label: Would you recommend this program to others?
        hint: Net promoter score
        type: select_one
        options:
          - Definitely Not
          - Probably Not
          - Neutral
          - Probably Yes
          - Definitely Yes
        required: true
      - id: 20
        name: continue_volunteering
        label: Do you plan to continue volunteering with us?
        hint: Future commitment
        type: select_one
        options:
          - No, planning to leave
          - Unsure
          - Yes, for a while longer
          - Yes, long-term
        required: true
      - id: 21
        name: best_part
        label: What is the best part of volunteering here?
        hint: Positive aspects
        type: text
        options: []
        required: false
      - id: 22
        name: challenges_faced
        label: What challenges have you faced?
        hint: Areas of difficulty
        type: text
        options: []
        required: false
      - id: 23
        name: improvement_suggestions
        label: What could we improve?
        hint: Suggestions for improvement
        type: text
        options: []
        required: false
      - id: 24
        name: additional_support_needed
        label: What additional support would help you?
        hint: Resources or assistance
        type: text
        options: []
        required: false
      - id: 25
        name: additional_comments
        label: Any additional comments?
        hint: Your thoughts
        type: text
        options: []
        required: false
      - id: 26
        name: survey_date
        label: Survey Completion Date
        hint: Today's date
        type: date
        options: []
        required: true
