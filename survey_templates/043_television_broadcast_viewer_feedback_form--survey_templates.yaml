inputSchema:
  type: object
  properties:
    title: Television Broadcast Viewer Feedback Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: question_1
      label: What is your opinion on the content of this broadcast?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: question_2
      label: How satisfied are you with the content of this broadcast?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: true
    - id: 5
      name: question_3
      label: How likely are you to recommend this broadcast to a friend or family
        member?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 6
      name: email
      label: Your Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 7
      name: comment
      label: Any additional comments?
      hint: null
      type: text
      options: []
      required: false
