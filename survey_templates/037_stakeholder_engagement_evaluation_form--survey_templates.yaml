inputSchema:
  type: object
  properties:
    title: Stakeholder Engagement Evaluation Form
    pages:
    - id: 1
      name: survey_templates_evaluation_forms
      label: Page 1
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: stakeholder_engagement
      label: How engaged do you feel about your stakeholder engagement?
      hint: null
      type: select_one
      options:
      - Very engaged
      - Somewhat engaged
      - Not very engaged
      - Not at all engaged
      required: false
    - id: 3
      name: evaluation_form
      label: How would you evaluate this form?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: essential_feedback
      label: What essential feedback do you have?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: stakeholder_survey
      label: Which survey would you like to see next?
      hint: null
      type: select_one
      options:
      - More of this type of survey
      - Less of this type of survey
      - None
      required: false
    - id: 6
      name: stakeholder_evaluation_form_customization
      label: How would you like to see this form customized?
      hint: null
      type: select_multiple
      options:
      - Customize questions
      - Add new questions
      - Change question types
      required: false
    - id: 7
      name: stakeholder_data_collection
      label: How would you like to see data collected?
      hint: null
      type: select_multiple
      options:
      - Streamline data collection
      - Anonymize data
      - Add new data fields
      required: false
    - id: 8
      name: stakeholder_survey_templates
      label: How do you rate our survey templates?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
