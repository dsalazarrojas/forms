inputSchema:
  type: object
  properties:
    title: Business Survey
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Official name of the company
      type: text
      options: []
      required: true
    - id: 2
      name: company_contact_name
      label: Contact Person Name
      hint: Name of primary contact
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: Business email address
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Phone Number
      hint: Business phone number
      type: text
      options: []
      required: true
    - id: 5
      name: company_address
      label: Company Address
      hint: Business address
      type: text
      options: []
      required: true
    - id: 6
      name: industry_type
      label: Industry Type
      hint: What industry are you in
      type: select_one
      options:
      - Manufacturing
      - Retail
      - Services
      - Technology
      - Healthcare
      - Finance
      - Education
      - Other
      required: true
    - id: 7
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - Solo/Freelancer
      - 2-10 employees
      - 11-50 employees
      - 51-100 employees
      - 101-500 employees
      - 500+ employees
      required: true
    - id: 8
      name: years_established
      label: Years in Business
      hint: How long has the business operated
      type: number
      options: []
      required: false
    - id: 9
      name: primary_products_services
      label: Primary Products or Services
      hint: Main offerings of the company
      type: text
      options: []
      required: true
    - id: 10
      name: annual_revenue
      label: Approximate Annual Revenue
      hint: Revenue range
      type: select_one
      options:
      - Under 100k
      - 100k-500k
      - 500k-1M
      - 1M-5M
      - 5M-10M
      - 10M+
      required: false
    - id: 11
      name: growth_trajectory
      label: Growth Trajectory
      hint: Business growth over past year
      type: select_one
      options:
      - Strong Growth
      - Steady Growth
      - Stable
      - Slight Decline
      - Significant Decline
      required: true
    - id: 12
      name: market_coverage
      label: Geographic Market Coverage
      hint: Areas served by the business
      type: text
      options: []
      required: true
    - id: 13
      name: competitive_advantages
      label: Competitive Advantages
      hint: What sets you apart
      type: text
      options: []
      required: false
    - id: 14
      name: main_challenges
      label: Main Business Challenges
      hint: Key challenges faced
      type: text
      options: []
      required: true
    - id: 15
      name: future_plans
      label: Future Plans and Goals
      hint: What are your next steps
      type: text
      options: []
      required: false
    - id: 16
      name: technology_adoption
      label: Technology Adoption Level
      hint: How advanced is your technology
      type: select_one
      options:
      - Highly Advanced
      - Modern
      - Adequate
      - Behind Industry Standards
      - Outdated
      required: false
    - id: 17
      name: sustainability_practices
      label: Sustainability Practices
      hint: Does your business use sustainability practices
      type: select_one
      options:
      - Comprehensive Practices
      - Good Practices
      - Some Practices
      - Minimal Practices
      - No Practices
      required: false
    - id: 18
      name: business_recommendations
      label: Recommendations for Improvement
      hint: Suggestions to help your business
      type: text
      options: []
      required: false
    - id: 19
      name: survey_completion_date
      label: Survey Completion Date
      hint: Date of this survey
      type: date
      options: []
      required: true
