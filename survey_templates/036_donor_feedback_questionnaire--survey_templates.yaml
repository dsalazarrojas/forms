inputSchema:
  type: object
  properties:
    title: Donor Feedback Questionnaire
    pages:
    - id: 1
      name: campaign_details
      label: Campaign Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: questions
      label: Questions
      hint: null
      type: select_one
      options:
      - How likely are you to recommend this campaign?
      - Not likely at all
      required: false
    - id: 3
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Other
      required: false
    - id: 5
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
