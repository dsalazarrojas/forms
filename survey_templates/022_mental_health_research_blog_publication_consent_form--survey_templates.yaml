inputSchema:
  type: object
  properties:
    title: Mental Health Research Blog Publication Consent Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: experience_description
      label: Experience Description
      hint: Brief description of your experience
      type: text
      options: []
      required: false
    - id: 3
      name: mental_health_topic
      label: Mental Health Topic
      hint: null
      type: select_one
      options:
      - Anxiety
      - Depression
      - Post-traumatic Stress Disorder (PTSD)
      - Substance Abuse
      - Other
      required: false
    - id: 4
      name: experience_duration
      label: How long did it last?
      hint: null
      type: select_multiple
      options:
      - Less than 1 month
      - 1 month to 2 years
      - 2 years or more
      required: false
    - id: 5
      name: contact_information
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Social Media
      required: false
    - id: 6
      name: publication_type
      label: Type of Publication
      hint: Select a publication type
      type: select_one
      options:
      - Online
      - Offline
      required: false
    - id: 7
      name: publication_frequency
      label: How often do you publish?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      - Quarterly
      - Other
      required: false
    - id: 8
      name: publication_frequency_other
      label: How often do you publish (Other)
      hint: Provide details on how often you publish
      type: text
      options: []
      required: false
    - id: 9
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: publication_location
      label: Location
      hint: Location of publication (e.g. online platform, academic journal)
      type: text
      options: []
      required: false
    - id: 11
      name: publication_date
      label: Publication Date
      hint: Select date of publication
      type: date
      options: []
      required: false
    - id: 12
      name: publication_type_frequency
      label: Type of Publication Frequency
      hint: null
      type: select_one
      options:
      - One Time
      - Periodic
      required: false
    - id: 13
      name: publication_agenda
      label: Publication Agenda
      hint: Provide details on what you are planning to publish
      type: note
      options: []
      required: false
    - id: 14
      name: publication_consent
      label: Publication Consent
      hint: Please sign below to confirm your consent
      type: text
      options: []
      required: false
    - id: 15
      name: publication_consent_agreement
      label: Publication Consent Agreement
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: participant_signature
      label: Participant Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: researcher_signature
      label: Researcher Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 19
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 20
      name: participant_agreed_date
      label: Participant Agreed Date
      hint: null
      type: date
      options: []
      required: false
    - id: 21
      name: participant_agreed_time
      label: Participant Agreed Time
      hint: null
      type: time
      options: []
      required: false
    - id: 22
      name: researcher_agreed_date
      label: Researcher Agreed Date
      hint: null
      type: date
      options: []
      required: false
    - id: 23
      name: researcher_agreed_time
      label: Researcher Agreed Time
      hint: null
      type: time
      options: []
      required: false
    - id: 24
      name: publication_consent_status
      label: Publication Consent Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 25
      name: participant_consent_status
      label: Participant Consent Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
