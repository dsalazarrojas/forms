inputSchema:
  type: object
  properties:
    title: Employee English Language Training Needs Assessment Survey
    pages:
    - id: 1
      name: language_training_needs
      label: Language Training Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: english_level
      label: English Level
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: prior_experience
      label: Prior Experience with English
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: english_language_skills
      label: English Language Skills
      hint: What skills would you like to improve in English?
      type: select_multiple
      options:
      - Grammar
      - Vocabulary
      - Listening
      - Reading
      - Writing
      - Speaking
      required: false
    - id: 5
      name: english_language_training_goals
      label: English Language Training Goals
      hint: What specific English language skills do you want to focus on for training?
      type: text
      options: []
      required: false
    - id: 6
      name: training_frequency
      label: Frequency of English Training
      hint: null
      type: select_one
      options:
      - Every 1-2 months
      - Every 2-3 months
      - Every 3-4 months
      - Every 6 months
      - Never
      required: false
    - id: 7
      name: english_proficient
      label: Proficient in English Language Training
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: training_facility
      label: English Training Facility
      hint: Which location would you like to have the training sessions in?
      type: text
      options: []
      required: false
    - id: 9
      name: supervisor_confirmation
      label: Supervisor Confirmation
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: english_language_proficiency
      label: Current English Language Proficiency Level
      hint: What is your current English language proficiency level?
      type: select_one
      options:
      - Beginner
      - Basic
      - Intermediate
      - Advanced
      - Proficient
      required: false
    - id: 11
      name: prior_english_courses
      label: Prior English Language Courses
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: english_language_training_needs
      label: English Language Training Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: english_language_training_objectives
      label: English Language Training Objectives
      hint: What are the objectives of English Language Training?
      type: text
      options: []
      required: false
    - id: 14
      name: training_status
      label: English Language Training Status
      hint: null
      type: select_multiple
      options:
      - In Progress
      - Completed
      - Not Started
      required: false
    - id: 15
      name: training_location
      label: Location of English Language Training
      hint: Where will the training sessions be held?
      type: text
      options: []
      required: false
    - id: 16
      name: training_language
      label: Language of Training Sessions
      hint: What language do you want to use for English language training sessions?
      type: text
      options: []
      required: false
