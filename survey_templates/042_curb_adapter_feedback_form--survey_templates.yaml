inputSchema:
  type: object
  properties:
    title: Curb Adapter Feedback Form
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: installation_date
      label: Installation Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: false
    - id: 3
      name: adapter_performance
      label: Adapter Performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: rating
      label: Rating
      hint: 1-5
      type: number
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: project_details
      label: Project Details
      hint: null
      type: select_multiple
      options:
      - Adapter Model
      - Manufacturer
      - Installation Location
      required: true
    - id: 10
      name: installation_location
      label: Installation Location
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: adapter_model
      label: Adapter Model
      hint: null
      type: select_one
      options:
      - Model A
      - Model B
      - Model C
      required: true
