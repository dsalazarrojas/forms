inputSchema:
  type: object
  properties:
    title: Workforce Agility Benchmark Survey
    pages:
    - id: 1
      name: survey_header
      label: What is this survey for
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: adaptability_scale
      label: How would you rate your adaptability level
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: adaptability_score
      label: How important is adaptability to you
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: adaptability_frequency
      label: What is the frequency of adapting to new things
      hint: null
      type: select_one
      options:
      - Agile and flexible
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 5
      name: challenges_scale
      label: How often do you encounter agility challenges
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: challenges_score
      label: How important is overcoming challenges
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: challenges_description
      label: Please describe an agility challenge you've faced
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: challenges_awareness
      label: How aware are you of current agility challenges
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: employee_feedback
      label: How often do you provide feedback
      hint: null
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Rarely
      required: false
    - id: 10
      name: leader_feedback
      label: How often do leaders provide feedback
      hint: null
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Rarely
      required: false
    - id: 11
      name: departmentalization
      label: How often do you feel like you're a part of the team
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      required: false
    - id: 12
      name: teamwork
      label: How much collaboration do you experience within your department
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 13
      name: leadership_support
      label: How much support do you receive from leadership
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 14
      name: adaptability_importance
      label: How important is adaptability to your role
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 15
      name: adaptability_training
      label: Have you ever received training on adaptability
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 16
      name: adaptability_implications
      label: What is the impact of lack of adaptability
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 17
      name: adaptability_strategies
      label: What strategy do you think is most effective for adaptability
      hint: null
      type: select_one
      options:
      - Communication
      - Training
      - Leadership
      required: false
    - id: 18
      name: adaptability_barometer
      label: What is the adaptability barometer score
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: adaptability_barometer_score
      label: What is the adaptability barometer score score
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: adaptability_barometer_importance
      label: How important is adaptability barometer score
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 21
      name: adaptability_barometer_frequency
      label: How often is adaptability barometer score updated
      hint: null
      type: select_one
      options:
      - Often
      - Sometimes
      - Rarely
      required: false
    - id: 22
      name: adaptability_barometer_awareness
      label: How aware are you of the adaptability barometer score
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 23
      name: adaptability_barometer_implications
      label: What is the impact of high or low adaptability barometer score
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: adaptability_barometer_strategies
      label: What strategy do you think is most effective for adaptability barometer
        score
      hint: null
      type: select_one
      options:
      - Communication
      - Training
      - Leadership
      required: false
    - id: 25
      name: survey_conclusion
      label: What is the final step in the adaptability assessment
      hint: null
      type: text
      options: []
      required: false
