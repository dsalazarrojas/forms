inputSchema:
  type: object
  properties:
    title: Home Delivery Service Quality Survey Form
    pages:
    - id: 1
      name: first_page_question_1
      label: how_was_your_order_fulfilled
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      - Very Dissatisfied
      - Neutral
      required: false
    - id: 2
      name: first_page_question_2
      label: how_satisfied_with_delivery_time
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      - Very Dissatisfied
      - Neutral
      required: false
    - id: 3
      name: first_page_question_3
      label: what_do_you_like
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: first_page_question_4
      label: what_do_you_dislike
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: second_page_question_1
      label: were_your_items_packed_correctly
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 6
      name: second_page_question_2
      label: were_your_items_in_good_condition
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 7
      name: second_page_question_3
      label: was_your_order_delivered_on_time
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 8
      name: second_page_question_4
      label: any_other_comments
      hint: null
      type: text
      options: []
      required: false
