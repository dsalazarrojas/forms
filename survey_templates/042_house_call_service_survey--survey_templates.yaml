inputSchema:
  type: object
  properties:
    title: House Call Service Survey
    pages:
    - id: 1
      name: service_provider
      label: Service Provider
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - 'House Call Service: Home Visits'
      - 'House Call Service: Office Visit'
      required: true
    - id: 3
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: service_frequency
      label: Service Frequency
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: service_location
      label: Service Location
      hint: null
      type: select_one
      options:
      - Residential Home
      - Office Location
      - Clinic Location
      required: true
    - id: 8
      name: date_of_visit_prophets
      label: Date Of Visit  Prophets
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: time_of_visit
      label: Time Of Visit
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: service_quality
      label: Service Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 12
      name: improvement_areas
      label: Improvement Areas
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: next_visit
      label: Next Visit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: service_request
      label: Service Request
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Phone Call
      - Email
      - Text Message
      - Mail
      required: false
