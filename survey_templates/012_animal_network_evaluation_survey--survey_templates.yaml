inputSchema:
  type: object
  properties:
    title: Animal Network Evaluation Survey
    pages:
    - id: 1
      name: member_organization
      label: Member Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: membership_duration
      label: How long have you been a member?
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5 plus years
      required: true
    - id: 3
      name: communication_frequency
      label: Frequency of Communication with the Network
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 4
      name: collaboration_quality
      label: Quality of Collaboration within the Network
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: resource_usefulness
      label: Usefulness of Network Resources
      hint: Toolkits, data sharing, etc.
      type: select_one
      options:
      - Very Useful
      - Useful
      - Somewhat Useful
      - Not Useful
      required: true
    - id: 6
      name: primary_benefit
      label: What is the primary benefit of your membership?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: leadership_satisfaction
      label: Satisfaction with Network Leadership
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
