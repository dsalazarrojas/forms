inputSchema:
  type: object
  properties:
    title: website_delivery_feedback_survey_form
    pages:
    - id: 1
      name: intro_text
      label: How did you get here
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating
      label: Overall rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: feedback
      label: What was the quality of the delivery
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: delivery_time
      label: How long did it take for delivery
      hint: null
      type: select_one
      options:
      - 1-2 hours
      - 2-4 hours
      - 4-6 hours
      - More than 6 hours
      required: false
    - id: 8
      name: delivery_date
      label: What was the delivery date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: delivery_time
      label: What was the delivery time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: delivery_type
      label: What type of delivery
      hint: null
      type: select_one
      options:
      - Home delivery
      - Office delivery
      - Other (please specify)
      required: false
    - id: 11
      name: delivery_person
      label: Who made the delivery
      hint: null
      type: select_one
      options:
      - Customer
      - Driver
      - Other (please specify)
      required: false
    - id: 12
      name: delivery_vehicle
      label: What type of vehicle used for delivery
      hint: null
      type: select_one
      options:
      - Car
      - Van
      - Other (please specify)
      required: false
    - id: 13
      name: delivery_location
      label: Where was the delivery made
      hint: null
      type: select_one
      options:
      - Home
      - Office
      - Other (please specify)
      required: false
    - id: 14
      name: contact_method
      label: How do you usually contact us
      hint: null
      type: select_one
      options:
      - Phone call
      - Email
      - Online support
      - Other (please specify)
      required: false
