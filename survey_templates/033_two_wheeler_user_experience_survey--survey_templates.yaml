inputSchema:
  type: object
  properties:
    title: Two Wheeler User Experience Survey
    pages:
    - id: 1
      name: one_time_ridden
      label: one_time_ridden
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: how_many_hours
      label: how_many_hours
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: mode_of_transportation
      label: mode_of_transportation
      hint: null
      type: select_one
      options:
      - Walk
      - Bike
      - Other
      required: true
    - id: 4
      name: how_much_do_you_agree_with_the_following_statement
      label: how_much_do_you_agree_with_the_following_statement
      hint: null
      type: select_multiple
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neither Agree nor Disagree
      - Strongly Disagree
      - Disagree
      required: false
    - id: 5
      name: what_is_your_age
      label: what_is_your_age
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: how_long_have_you_been_rideing
      label: how_long_have_you_been_rideing
      hint: null
      type: select_multiple
      options:
      - Never
      - 1-3 months
      - 1-6 months
      - 6 months - 1 year
      - 1-2 years
      - 2-3 years
      - 3-5 years
      - 5 years or more
      required: true
    - id: 7
      name: how_much_do_you_agree_with_the_following_statement_2
      label: how_much_do_you_agree_with_the_following_statement__2
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neither Agree nor Disagree
      - Strongly Disagree
      - Disagree
      required: false
    - id: 8
      name: mode_of_transportation_2
      label: mode_of_transportation__2
      hint: null
      type: select_multiple
      options:
      - Walk
      - Bike
      - Other
      required: false
