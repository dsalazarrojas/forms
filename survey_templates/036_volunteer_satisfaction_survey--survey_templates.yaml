inputSchema:
  type: object
  properties:
    title: Volunteer Satisfaction Survey
    pages:
    - id: 1
      name: project_experience
      label: Project Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_rating
      label: Rate Your Experience
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: comments
      label: Comments
      hint: Please provide your feedback about your volunteering experience
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: project_duration
      label: How long you've volunteered for this project
      hint: null
      type: select_one
      options:
      - '{''value'': ''Less than a week''}'
      - '{''value'': ''1-2 weeks''}'
      - '{''value'': ''More than 2 weeks''}'
      required: false
    - id: 7
      name: project_frequency
      label: How often you volunteer for projects
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Rarely''}'
      - '{''value'': ''Occasionally''}'
      - '{''value'': ''Frequently''}'
      - '{''value'': ''Almost Always''}'
      required: false
    - id: 8
      name: time_preferences
      label: What time of day do you prefer?
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: date_preferences
      label: What day of the week do you prefer?
      hint: null
      type: select_one
      options:
      - '{''value'': ''Monday''}'
      - '{''value'': ''Tuesday''}'
      - '{''value'': ''Wednesday''}'
      - '{''value'': ''Thursday''}'
      - '{''value'': ''Friday''}'
      - '{''value'': ''Saturday''}'
      - '{''value'': ''Sunday''}'
      required: false
    - id: 10
      name: project_category
      label: What type of project would you like to participate in?
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Environment''}'
      - '{''value'': ''Community''}'
      - '{''value'': ''Education''}'
      - '{''value'': ''Animal''}'
      - '{''value'': ''Other''}'
      required: false
    - id: 11
      name: volunteer_hours
      label: How many hours per week do you volunteer?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: availability
      label: What days and times you're available
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: volunteer_comments
      label: Any other comments
      hint: null
      type: text
      options: []
      required: false
