inputSchema:
  type: object
  properties:
    title: Regional Rural Banks Branding Quiz
    pages:
    - id: 1
      name: branding_knowledge
      label: What is the name of our regional bank?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: logo_recognition
      label: Which of the following logos are recognized as our regional bank?
      hint: null
      type: select_multiple
      options:
      - Our logo with a red and blue color scheme
      - Our logo with a green and yellow color scheme
      required: false
    - id: 3
      name: years_of_familiarity
      label: How many years have you been familiar with our regional bank?
      hint: null
      type: select_one
      options:
      - 1 year
      - 2-5 years
      - More than 5 years
      required: false
    - id: 4
      name: age_group
      label: What is your age group?
      hint: null
      type: select_one
      options:
      - 18-25
      - 26-35
      - 36-45
      - 46-55
      - 56 and above
      required: false
    - id: 5
      name: expected_score
      label: What is the score you think you would get out of 100 if you were to take
        the test?
      hint: null
      type: select_one
      options:
      - Less than 30
      - 30-50
      - 51-70
      - 71-90
      - More than 90
      required: false
    - id: 6
      name: knowledge_of_history
      label: How do you rate your knowledge of our regional bank's history?
      hint: null
      type: select_one
      options:
      - Very high
      - High
      - Medium
      - Low
      - Very low
      required: false
    - id: 7
      name: relationship_with_bank
      label: Which of the following describes your relationship with our regional
        bank?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 8
      name: service_offered
      label: Which of the following services does our regional bank offer?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 9
      name: comments
      label: What are your comments about our regional bank?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: quiz_submission
      label: What is your score out of 100?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: regional_rural_banks_branding_quiz_form_submitted
      label: regional_rural_banks_branding_quiz_form_submitted
      hint: null
      type: email
      options: []
      required: true
