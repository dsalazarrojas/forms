inputSchema:
  type: object
  properties:
    title: Student Technology Usage Survey
    pages:
    - id: 1
      name: tech_access
      label: What is your primary source of internet access?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: tech_familiarity
      label: tech_familiarity
      hint: null
      type: number
      options: []
      required: false
