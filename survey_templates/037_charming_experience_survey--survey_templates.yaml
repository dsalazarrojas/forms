inputSchema:
  type: object
  properties:
    title: Charming Experience Survey
    pages:
      - id: 1
        name: section_respondent_info
        label: -- Your Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Your Name
        hint: Optional - can remain anonymous
        type: text
        options: []
        required: false
      - id: 3
        name: respondent_email
        label: Email Address
        hint: For follow-up if needed
        type: email
        options: []
