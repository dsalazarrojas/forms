inputSchema:
  type: object
  properties:
    title: Anticoagulation Discussion Survey
    pages:
    - id: 1
      name: section_discussion_context
      label: -- Discussion Context --
      hint: Collect feedback after anticoagulation consultations
      type: note
      options: []
      required: false
    - id: 2
      name: patient_age_group
      label: Patient age group
      hint: Select age bracket
      type: select_one
      options:
      - Under 18
      - 18 to 44
      - 45 to 64
      - 65 or older
      required: false
    - id: 3
      name: discussion_topics
      label: Topics covered in discussion
      hint: Select all that apply
      type: select_multiple
      options:
      - Indications for therapy
      - Bleeding risk
      - Medication adherence
      - Monitoring and follow up
      - Reversal strategies
      required: true
    - id: 4
      name: clarity_of_information
      label: Clarity of information provided
      hint: Rate clarity of the conversation
      type: select_one
      options:
      - Not clear
      - Somewhat clear
      - Clear
      - Very clear
      required: true
    - id: 5
      name: decision_confidence
      label: Confidence in treatment decision
      hint: Patient and clinician confidence after discussion
      type: select_one
      options:
      - Low
      - Moderate
      - High
      required: false
    - id: 6
      name: follow_up_actions
      label: Recommended follow up actions
      hint: Tests monitoring or referrals suggested
      type: text
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall satisfaction with discussion
      hint: Optional patient reported satisfaction score
      type: number
      options: []
      required: false
