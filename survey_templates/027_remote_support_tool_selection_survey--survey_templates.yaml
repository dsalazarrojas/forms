inputSchema:
  type: object
  properties:
    title: Remote Support Tool Selection Survey
    pages:
    - id: 1
      name: survey_template
      label: Select Template
      hint: null
      type: select_one
      options:
      - template 1
      - template 2
      - template 3
      required: true
    - id: 2
      name: tool_name
      label: Tool Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: key_features
      label: Key Features
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: selection_criteria
      label: Selection Criteria
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: decision_guidelines
      label: Decision Guidelines
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: current_tools
      label: Current Tools
      hint: null
      type: select_multiple
      options:
      - tool 1
      - tool 2
      - tool 3
      required: true
    - id: 7
      name: it_lead
      label: IT Lead
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: business_lead
      label: Business Lead
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: true
