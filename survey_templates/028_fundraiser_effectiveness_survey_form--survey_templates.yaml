inputSchema:
  type: object
  properties:
    title: Fundraiser Effectiveness Survey Form
    pages:
    - id: 1
      name: fundraiser_satisfaction
      label: How satisfied are you with the fundraiser?
      hint: Please select one of the following options.
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Not satisfied
      - Not at all satisfied
      required: true
    - id: 2
      name: recommendation
      label: How likely are you to recommend this event to a friend?
      hint: Please select one of the following options.
      type: select_one
      options:
      - Very likely
      - Somewhat likely
      - Not likely
      - Not at all likely
      required: true
    - id: 3
      name: enjoyment
      label: How much did you enjoy the event?
      hint: Please select one of the following options.
      type: select_one
      options:
      - Very enjoyable
      - Somewhat enjoyable
      - Not enjoyable
      - Not at all enjoyable
      required: true
    - id: 4
      name: expectations
      label: What were your expectations before attending this fundraiser?
      hint: Please enter a short description.
      type: text
      options: []
      required: true
    - id: 5
      name: future_attendance
      label: How likely are you to attend a similar event in the future?
      hint: Please select one of the following options.
      type: select_multiple
      options:
      - Very likely
      - Somewhat likely
      - Not likely
      - Not at all likely
      required: true
    - id: 6
      name: quality
      label: How would you rate the overall quality of this event?
      hint: Please select one of the following options.
      type: select_multiple
      options:
      - Very good
      - Somewhat good
      - Not good
      - Not at all good
      required: true
