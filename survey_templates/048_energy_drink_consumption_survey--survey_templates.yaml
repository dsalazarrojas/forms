inputSchema:
  type: object
  properties:
    title: Energy Drink Consumption Survey
    pages:
    - id: 1
      name: demographics
      label: Demographics
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: energy_drink_type
      label: Energy Drink Type
      hint: null
      type: select_one
      options:
      - Red Bull
      - Monster
      - Rockstar
      - Other (please specify)
      required: true
    - id: 3
      name: frequency_of_consumption
      label: Frequency of Consumption
      hint: null
      type: select_multiple
      options:
      - Never
      - Less than once a week
      - About once a week
      - Several times a week
      - Every day
      required: true
    - id: 4
      name: amount_of_consumption
      label: Amount of Consumption
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: side_effects
      label: Side Effects
      hint: null
      type: select_one
      options:
      - Headaches
      - Insomnia
      - Nausea
      - Fatigue
      - Heart palpitations
      - Stomach problems
      - Muscle weakness
      - Other (please specify)
      required: false
    - id: 6
      name: perceptions
      label: Perceptions
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: survey_completion
      label: Survey Completion
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: demographics_2
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: side_effects_2
      label: Additional Side Effects
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: energy_drink_consumption_frequency
      label: Energy Drink Consumption Frequency
      hint: null
      type: select_multiple
      options:
      - Never
      - Less than once a week
      - About once a week
      - Several times a week
      - Every day
      required: false
    - id: 11
      name: amount_of_consumption_2
      label: Energy Drink Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: survey_completion_2
      label: Thank You
      hint: null
      type: text
      options: []
      required: false
