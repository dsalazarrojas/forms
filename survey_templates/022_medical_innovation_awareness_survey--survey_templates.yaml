inputSchema:
  type: object
  properties:
    title: Medical Innovation Awareness Survey
    pages:
    - id: 1
      name: survey_questions
      label: What is a new medical innovation?
      hint: Please provide your understanding of what a new medical innovation is.
      type: text
      options: []
      required: false
    - id: 2
      name: information_sources
      label: Which of the following sources do you often get information on new medical
        innovations?
      hint: List the sources you often get information from.
      type: select_multiple
      options:
      - Google
      - Online Forums
      - Offline Conferences
      - Print Books
      required: false
    - id: 3
      name: familiarity_level
      label: How familiar are you with new medical innovations?
      hint: Describe your level of familiarity with new medical innovations.
      type: text
      options: []
      required: false
    - id: 4
      name: attitudes_towards_innovation
      label: What is your attitude towards adopting new medical innovations?
      hint: Check all that apply.
      type: select_multiple
      options:
      - Positive
      - Neutral
      - Negative
      required: false
