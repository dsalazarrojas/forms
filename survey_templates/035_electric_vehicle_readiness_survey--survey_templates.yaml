inputSchema:
  type: object
  properties:
    title: Electric Vehicle Readiness Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: vehicle_interest
      label: What is the primary interest for wanting to adopt an electric vehicle?
      hint: null
      type: select_one
      options:
      - Very Interested
      - Somewhat Interested
      - Not Very Interested
      - Not Interested
      required: false
    - id: 3
      name: charging_feasibility
      label: What is your current charging situation?
      hint: null
      type: select_multiple
      options:
      - Home
      - Work
      - Public
      - Other
      required: false
    - id: 4
      name: outreach_needs
      label: What outreach needs do you have regarding electric vehicles?
      hint: null
      type: select_multiple
      options:
      - Educational Materials
      - Events
      - Workshops
      - Other
      required: false
    - id: 5
      name: vehicle_type
      label: What type of electric vehicle do you own or interested in owning?
      hint: Please select from below options
      type: select_one
      options:
      - Car
      - Van
      - Truck
      required: false
    - id: 6
      name: household_income
      label: What is your monthly household income?
      hint: $
      type: number
      options: []
      required: false
    - id: 7
      name: vehicle_cost
      label: What is the approximate cost of the electric vehicle you are interested
        in?
      hint: $0.00
      type: number
      options: []
      required: false
    - id: 8
      name: charging_time
      label: How much time do you have available to charge your vehicle daily?
      hint: null
      type: select_one
      options:
      - 30 minutes or less
      - 1-2 hours
      - 2-4 hours
      - More than 4 hours
      required: false
    - id: 9
      name: vehicle_warranty
      label: Do you have a vehicle warranty?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: vehicle_milage
      label: What is your vehicle's current mileage?
      hint: Miles
      type: number
      options: []
      required: false
    - id: 11
      name: vehicle_parking
      label: Where do you park your vehicle currently?
      hint: null
      type: select_multiple
      options:
      - Home
      - Work
      - Public
      - Other
      required: false
    - id: 12
      name: vehicle_insurance
      label: What insurance coverage do you have on your vehicle?
      hint: null
      type: select_multiple
      options:
      - Full Coverage
      - Liability Only
      - None
      required: false
    - id: 13
      name: electric_vehicle_purchasing
      label: How do you plan to purchase an electric vehicle?
      hint: null
      type: select_one
      options:
      - Lease
      - Buy
      - Other
      required: false
    - id: 14
      name: vehicle_purchase_method
      label: How would you prefer to purchase an electric vehicle?
      hint: null
      type: select_one
      options:
      - Direct Purchase
      - Dealership
      - Online
      - Other
      required: false
    - id: 15
      name: vehicle_pricing
      label: What are you willing to pay for a new electric vehicle?
      hint: $
      type: number
      options: []
      required: false
    - id: 16
      name: charging_location
      label: How far is the charging station from your home?
      hint: Miles
      type: number
      options: []
      required: false
    - id: 17
      name: charging_rate
      label: What would you prefer as a charging rate?
      hint: $
      type: number
      options: []
      required: false
    - id: 18
      name: charging_frequency
      label: How often do you charge your vehicle?
      hint: Times per week
      type: number
      options: []
      required: false
    - id: 19
      name: charging_location
      label: What is the preferred location for charging?
      hint: null
      type: select_one
      options:
      - Home
      - Work
      - Public
      - Other
      required: false
    - id: 20
      name: electric_vehicle_readiness_index
      label: How ready are you to adopt an electric vehicle?
      hint: null
      type: select_one
      options:
      - Very Ready
      - Somewhat Ready
      - Not Very Ready
      required: false
    - id: 21
      name: electric_vehicle_road_trip
      label: Would you be willing to take an electric vehicle on a road trip?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 22
      name: household_member
      label: Number of households members living in the household?
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: household_income_2
      label: What is the approximate annual household income (USD)?
      hint: $
      type: number
      options: []
      required: false
    - id: 24
      name: vehicle_type_2
      label: What type of electric vehicle would you be interested in?
      hint: null
      type: select_one
      options:
      - Car
      - Van
      - Truck
      required: false
    - id: 25
      name: electric_vehicle_cost_2
      label: What is the approximate cost of the electric vehicle you are interested
        in?
      hint: $0.00
      type: number
      options: []
      required: false
