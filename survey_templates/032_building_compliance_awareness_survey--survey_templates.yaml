inputSchema:
  type: object
  properties:
    title: Building Compliance Awareness Survey
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Full name
        type: text
        options: []
        required: false
      - id: 2
        name: department
        label: Department
        hint: Your department
        type: text
        options: []
        required: true
      - id: 3
        name: role
        label: Your Role
        hint: Job title
        type: text
        options: []
        required: true
      - id: 4
        name: email
        label: Email Address
        hint: Contact email
        type: email
        options: []
        required: true
      - id: 5
        name: survey_date
        label: Survey Date
        hint: Date of survey
        type: date
        options: []
        required: true
      - id: 6
        name: building_name
        label: Building Name
        hint: Which building
        type: text
        options: []
        required: true
      - id: 7
        name: tenure_in_building
        label: Time in Building
        hint: How long have you worked here
        type: select_one
        options:
          - Less than 6 months
          - 6 months to 1 year
          - 1-3 years
          - 3-5 years
          - Over 5 years
        required: true
      - id: 8
        name: compliance_training_received
        label: Compliance Training Received
        hint: Have you received training
        type: select_one
        options:
          - Yes - Within Past Year
          - Yes - Over 1 Year Ago
          - No - Never Received
          - Not Sure
        required: true
      - id: 9
        name: training_topics
        label: Training Topics Covered
        hint: Select all that apply
        type: select_multiple
        options:
          - Fire Safety
          - Emergency Evacuation
          - Building Access
          - Hazardous Materials
          - Equipment Safety
          - Security Protocols
          - Accessibility Requirements
          - Environmental Compliance
          - None
        required: true
      - id: 10
        name: emergency_procedures_knowledge
        label: Emergency Procedures Knowledge
        hint: How well do you know procedures
        type: select_one
        options:
          - Very Knowledgeable
          - Knowledgeable
          - Somewhat Knowledgeable
          - Not Very Knowledgeable
          - Not Knowledgeable at All
        required: true
      - id: 11
        name: evacuation_route_knowledge
        label: Evacuation Route Knowledge
        hint: Do you know exit routes
        type: select_one
        options:
          - Yes - All Routes
          - Yes - Primary Routes
          - Somewhat
          - No - Not Sure
        required: true
      - id: 12
        name: safety_equipment_location
        label: Safety Equipment Location Knowledge
        hint: Do you know where equipment is
        type: select_one
        options:
          - Yes - All Equipment
          - Yes - Most Equipment
          - Somewhat
          - No - Not Sure
        required: true
      - id: 13
        name: compliance_documentation_access
        label: Compliance Documentation Access
        hint: Can you access compliance docs
        type: select_one
        options:
          - Yes - Easy Access
          - Yes - But Difficult to Find
          - No - Not Available
          - Not Sure
        required: true
      - id: 14
        name: incident_reporting_knowledge
        label: Incident Reporting Knowledge
        hint: Do you know how to report
        type: select_one
        options:
          - Yes - Very Clear
          - Yes - Somewhat Clear
          - No - Not Clear
          - Not Sure
        required: true
      - id: 15
        name: safety_signage_clarity
        label: Safety Signage Clarity
        hint: Are signs clear and visible
        type: select_one
        options:
          - Very Clear
          - Clear
          - Somewhat Clear
          - Unclear
          - Very Unclear
        required: true
      - id: 16
        name: compliance_communication
        label: Compliance Communication
        hint: How well are you informed
        type: select_one
        options:
          - Very Well Informed
          - Well Informed
          - Somewhat Informed
          - Poorly Informed
          - Not Informed at All
        required: true
      - id: 17
        name: policy_awareness
        label: Building Policy Awareness
        hint: Are you aware of policies
        type: select_one
        options:
          - Very Aware
          - Aware
          - Somewhat Aware
          - Unaware
          - Very Unaware
        required: true
      - id: 18
        name: compliance_concerns
        label: Compliance Concerns
        hint: Have you noticed issues
        type: select_multiple
        options:
          - None
          - Blocked Exits
          - Missing Signage
          - Equipment Issues
          - Access Problems
          - Safety Hazards
          - Training Gaps
          - Communication Issues
        required: true
      - id: 19
        name: training_effectiveness
        label: Training Effectiveness
        hint: How effective was training
        type: select_one
        options:
          - Very Effective
          - Effective
          - Somewhat Effective
          - Ineffective
          - Very Ineffective
          - No Training Received
        required: true
      - id: 20
        name: additional_training_needed
        label: Additional Training Needed
        hint: What training do you need
        type: select_multiple
        options:
          - None
          - Fire Safety
          - Emergency Response
          - Equipment Operation
          - Security Procedures
          - Accessibility
          - Environmental
          - General Compliance
        required: true
      - id: 21
        name: preferred_training_format
        label: Preferred Training Format
        hint: How would you prefer to train
        type: select_one
        options:
          - In-Person Sessions
          - Online Modules
          - Video Tutorials
          - Written Materials
          - Hands-On Practice
          - Mobile App
        required: false
      - id: 22
        name: confidence_level
        label: Compliance Confidence Level
        hint: How confident are you
        type: select_one
        options:
          - Very Confident
          - Confident
          - Somewhat Confident
          - Not Very Confident
          - Not Confident at All
        required: true
      - id: 23
        name: suggestions
        label: Suggestions for Improvement
        hint: Your recommendations
        type: text
        options: []
        required: false
      - id: 24
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
