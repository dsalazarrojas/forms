inputSchema:
  type: object
  properties:
    title: Group Class Planning Survey
    pages:
    - id: 1
      name: class_title
      label: Class Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: class_category
      label: Category
      hint: null
      type: select_one
      options:
      - General
      - Advanced
      - Intermediate
      required: true
    - id: 3
      name: class_tags
      label: Tags
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: class_description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: class_start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: class_end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: class_questions
      label: Questions
      hint: null
      type: select_multiple
      options:
      - Question 1
      - Question 2
      - Question 3
      - Question 4
      - Question 5
      required: true
    - id: 8
      name: class_questions_type
      label: Questions Type
      hint: null
      type: select_one
      options:
      - Theory
      - Practical
      - Both
      required: true
    - id: 9
      name: class_questions_sort
      label: Sort Questions
      hint: null
      type: select_multiple
      options:
      - Ascending
      - Descending
      required: true
    - id: 10
      name: class_questions_sort_order
      label: Sort Order
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: class_questions_sort_option
      label: Sort Option
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 12
      name: class_questions_sort_order_confirmation
      label: Confirm Sort Order
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
