inputSchema:
  type: object
  properties:
    title: Daily Weather Record
    pages:
    - id: 1
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: temperature
      label: temperature
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: weather_conditions
      label: weather conditions
      hint: null
      type: select_one
      options:
      - Sunny
      - Cloudy
      - Rainy
      - Windy
      required: true
    - id: 5
      name: wind
      label: wind
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: humidity
      label: humidity
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
