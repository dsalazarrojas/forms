inputSchema:
  type: object
  properties:
    title: Governance Effectiveness Measurement Survey
    pages:
    - id: 1
      name: decision_making
      label: What are the key decision-making processes of the board?
      hint: Please describe the processes.
      type: text
      options: []
      required: false
    - id: 2
      name: transparency
      label: How transparent are board meetings and communication?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: accountability
      label: What measures are in place for board accountability?
      hint: Describe the measures in place for board accountability.
      type: text
      options: []
      required: false
    - id: 4
      name: communication
      label: How would you rate the communication between the board and other stakeholders?
      hint: null
      type: select_one
      options:
      - Board of Directors
      - Executive Leadership
      - Both
      - None
      required: false
    - id: 5
      name: decision_making_process
      label: What is the process for making decisions?
      hint: Please describe the process.
      type: text
      options: []
      required: false
    - id: 6
      name: decision_making_responsibilities
      label: Who are the key responsibilities in the decision-making process?
      hint: null
      type: select_one
      options:
      - CEO and Senior Leadership
      - Board of Directors
      - Both
      - None
      required: false
    - id: 7
      name: meeting_frequency
      label: How frequently do board meetings take place?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: meeting_agenda
      label: How does the meeting agenda typically look like?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: board_size
      label: What is the optimal board size?
      hint: Please enter the maximum number of members.
      type: number
      options: []
      required: false
    - id: 10
      name: board_size_optimal
      label: At what size is the board most effective?
      hint: Please enter the optimal number of members.
      type: number
      options: []
      required: false
    - id: 11
      name: communication_channels
      label: What channels are used for communication with the board?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - In-person
      - None
      required: false
    - id: 12
      name: meeting_minutes
      label: Are meeting minutes recorded and circulated?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Sometimes
      required: false
    - id: 13
      name: meeting_minutes_distribution
      label: To whom are meeting minutes distributed?
      hint: null
      type: select_multiple
      options:
      - Board of Directors
      - Executive Leadership
      - Both
      - None
      required: false
    - id: 14
      name: board_meeting_schedule
      label: How are meeting schedules planned and distributed?
      hint: Please describe the process.
      type: text
      options: []
      required: false
    - id: 15
      name: conflict_of_interest
      label: What is the process for addressing conflict of interest?
      hint: Please describe the process.
      type: text
      options: []
      required: false
    - id: 16
      name: board_committee
      label: Are committees used in the board?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 17
      name: board_committee_description
      label: What is the purpose and composition of the board committees?
      hint: Please describe the composition and purpose.
      type: text
      options: []
      required: false
    - id: 18
      name: board_evaluations
      label: Are board evaluations conducted for the board members?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 19
      name: evaluation_frequency
      label: How frequently are board evaluations conducted?
      hint: Please describe the frequency of the evaluations.
      type: text
      options: []
      required: false
    - id: 20
      name: evaluation_criteria
      label: What criteria are used for board member evaluations?
      hint: Please describe the criteria.
      type: text
      options: []
      required: false
    - id: 21
      name: evaluation_process
      label: What is the process for conducting board member evaluations?
      hint: Please describe the process.
      type: text
      options: []
      required: false
    - id: 22
      name: evaluation_feedback
      label: What kind of feedback is given to board members after evaluations?
      hint: Please describe the feedback given.
      type: text
      options: []
      required: false
    - id: 23
      name: evaluation_followup
      label: Are follow-up evaluations conducted after a year?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 24
      name: evaluation_followup_frequency
      label: How often are follow-up evaluations conducted?
      hint: Please describe the frequency of the follow-ups.
      type: text
      options: []
      required: false
    - id: 25
      name: evaluation_followup_process
      label: What is the process for conducting follow-up evaluations?
      hint: Please describe the process.
      type: text
      options: []
      required: false
