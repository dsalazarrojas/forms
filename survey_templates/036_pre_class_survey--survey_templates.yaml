inputSchema:
  type: object
  properties:
    title: pre_class_survey
    pages:
    - id: 1
      name: student_feedback
      label: Student Feedback
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: expectations
      label: Expectations
      hint: null
      type: select_multiple
      options:
      - Before the course began, I had the following expectations
      - Mostly met, some not met
      - Not at all met
      required: true
    - id: 3
      name: lessons
      label: Lessons
      hint: null
      type: select_one
      options:
      - What did you learn from this course?
      - What lessons did you not understand or need further clarification on?
      - None of the above
      required: true
    - id: 4
      name: knowledge_gaps
      label: Knowledge Gaps
      hint: null
      type: select_multiple
      options:
      - What knowledge gaps did you identify during the course?
      - How would you address these knowledge gaps in future courses?
      required: true
    - id: 5
      name: classroom_experience
      label: Classroom Experience
      hint: null
      type: text
      options: []
      required: false
