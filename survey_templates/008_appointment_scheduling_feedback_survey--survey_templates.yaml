inputSchema:
  type: object
  properties:
    title: Appointment Scheduling Feedback Survey
    pages:
    - id: 1
      name: appointment_details
      label: About Your Appointment
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: service_type
      label: Type of Service Received
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: booking_satisfaction
      label: How satisfied were you with the booking process
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 5
      name: schedule_ease
      label: Was the scheduling process easy to use
      hint: null
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 6
      name: time_availability
      label: Were the available time slots suitable for you
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: staff_professionalism
      label: Staff professionalism during booking
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: communication
      label: Quality of communication about your appointment
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: improvements
      label: What could we improve about appointment scheduling
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: recommend
      label: Would you recommend our scheduling system to others
      hint: null
      type: select_one
      options:
      - Definitely
      - Probably
      - Maybe
      - Unlikely
      - Definitely Not
      required: false
    - id: 11
      name: additional_feedback
      label: Additional Comments or Feedback
      hint: null
      type: text
      options: []
      required: false
