inputSchema:
  type: object
  properties:
    title: Youth Sports Program Impact Poll
    pages:
    - id: 1
      name: participant_satisfaction
      label: How satisfied were you with the program?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: program_outcomes
      label: How did the program impact your athletic performance?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: communication
      label: How would you rate your coach's communication?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: feedback
      label: Feedback on the program
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: contact_info
      label: Your name and contact info (optional)
      hint: null
      type: email
      options: []
      required: false
