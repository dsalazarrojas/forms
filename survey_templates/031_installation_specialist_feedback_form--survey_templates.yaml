inputSchema:
  type: object
  properties:
    title: Installation Specialist Feedback Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Please enter your phone number
      type: text
      options: []
      required: true
    - id: 4
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
