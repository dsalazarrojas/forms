inputSchema:
  type: object
  properties:
    title: Child Marriage Awareness Survey
    pages:
      - id: 1
        name: section_demographic_info
        label: -- Demographic Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_gender
        label: Gender of Respondent
        hint: Select one
        type: select_one
        options:
          - label: Female
            value: female
          - label: Male
            value: male
          - label: Non-binary
            value: nonbinary
