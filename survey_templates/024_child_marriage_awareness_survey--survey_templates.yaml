        type: select_one
        options:
          - label: Yes - Active Programs
            value: yes
          - label: No - None Observed
            value: no
        required: true
      - id: 13
        name: education_improvement_text
        label: How can we better educate the public on this issue?
        hint: Suggestions for outreach
        type: text
        options: []
        required: false
      - id: 14
        name: survey_date
        label: Today Date
        hint: Date of response
        type: date
        options: []
