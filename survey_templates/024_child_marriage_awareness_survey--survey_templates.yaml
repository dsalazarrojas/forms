            value: skip
        required: true
      - id: 3
        name: respondent_age
        label: Age Group
        hint: Choose your current age bracket
        type: select_one
        options:
          - label: Under 18
            value: minor
          - label: 18 to 24
            value: 18_24
          - label: 25 to 34
            value: 25_34
          - label: 35 to 44
            value: 35_44
          - label: 45 and Older
            value: 45plus
        required: true
      - id: 4
        name: section_awareness_questions
        label: -- Awareness Questions --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: legal_age_awareness
        label: Are you aware of the legal marriage age in your country?
        hint: Legal minimum for marriage
        type: select_one
        options:
          - label: Yes - I am aware
            value: yes
          - label: No - I am not aware
            value: no
        required: true
      - id: 6
        name: term_awareness
        label: Have you heard of the term - child marriage?
        hint: Knowledge of the terminology
        type: select_one
        options:
