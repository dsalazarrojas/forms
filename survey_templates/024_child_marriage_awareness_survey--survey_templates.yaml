inputSchema:
  type: object
  properties:
    title: Child Marriage Awareness Survey
    pages:
    - id: 1
      name: section_demographic_info
      label: -- Demographic Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_gender
      label: Gender of Respondent
      hint: Select one
      type: select_one
      options:
      - Female
      - Male
      - Non-binary
      - Prefer not to say
      required: true
    - id: 3
      name: respondent_age
      label: Age Group
      hint: Choose your current age bracket
      type: select_one
      options:
      - Under 18
      - 18 to 24
      - 25 to 34
      - 35 to 44
      - 45 and Older
      required: true
    - id: 4
      name: section_awareness_questions
      label: -- Awareness Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: legal_age_awareness
      label: Are you aware of the legal marriage age in your country?
      hint: Legal minimum for marriage
      type: select_one
      options:
      - Yes - I am aware
      - No - I am not aware
      required: true
    - id: 6
      name: term_awareness
      label: Have you heard of the term - child marriage?
      hint: Knowledge of the terminology
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: section_attitudes_opinions
      label: -- Attitudes and Opinions --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: ideal_marriage_age
      label: In your opinion, what is the ideal age for marriage?
      hint: Subjective opinion
      type: select_one
      options:
      - 18 to 21
      - 22 to 25
      - 26 to 30
      - Over 30
      required: true
    - id: 9
      name: education_impact
      label: Do you think child marriage impacts education?
      hint: Correlation between marriage and schooling
      type: select_one
      options:
      - Strongly Agree
      - Agree
      - Neutral
      - Disagree
      required: true
    - id: 10
      name: poverty_driver
      label: Do you think poverty is a primary driver?
      hint: Socioeconomic factors
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 11
      name: section_community_action
      label: -- Community Action --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: awareness_programs_local
      label: Are there awareness programs in your community?
      hint: Local initiatives or NGOs
      type: select_one
      options:
      - Yes - Active Programs
      - No - None Observed
      required: true
    - id: 13
      name: education_improvement_text
      label: How can we better educate the public on this issue?
      hint: Suggestions for outreach
      type: text
      options: []
      required: false
    - id: 14
      name: survey_date
      label: Today Date
      hint: Date of response
      type: date
      options: []
      required: true
