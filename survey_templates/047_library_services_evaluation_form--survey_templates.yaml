inputSchema:
  type: object
  properties:
    title: Library Services Evaluation Form
    pages:
    - id: 1
      name: page_1
      label: What were your experiences with our library services?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: page_2
      label: How friendly were the library staff?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      required: true
    - id: 3
      name: page_3
      label: How much time did you spend at the library?
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: page_4
      label: Do you have any suggestions for improving our library services?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: page_5
      label: Can we contact you?
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: page_6
      label: What do you expect from our library in the future?
      hint: null
      type: text
      options: []
      required: false
