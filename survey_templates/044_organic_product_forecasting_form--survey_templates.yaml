inputSchema:
  type: object
  properties:
    title: Organic Product Forecasting Form
    pages:
    - id: 1
      name: farm_id
      label: farm_id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: organic_product_id
      label: organic_product
      hint: null
      type: select_one
      options:
      - Organic Apple
      - Organic Carrot
      - Organic Broccoli
      required: false
    - id: 3
      name: product_type
      label: product_type
      hint: null
      type: select_one
      options:
      - Juice
      - Dried Fruit
      - Frozen
      - Fresh
      required: false
    - id: 4
      name: quantity
      label: quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: production_date
      label: production_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: distribution_frequency
      label: distribution_frequency
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 7
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
