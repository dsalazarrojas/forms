      name: best_birthday_memory
      label: Best Birthday Memory
      hint: Describe a memorable birthday
      type: text
      options: []
      required: false
    - id: 28
      name: most_meaningful_gift
      label: Most Meaningful Gift Ever Received
      hint: What touched you most
      type: text
      options: []
      required: false
    - id: 29
      name: section_wishes
      label: -- Birthday Wishes --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: birthday_wish
      label: Your Birthday Wish for This Year
      hint: What do you hope for
      type: text
      options: []
      required: false
    - id: 31
      name: message_to_others
      label: Birthday Message to Others
      hint: Share a message with the world
      type: text
      options: []
      required: false
    - id: 32
      name: section_sharing
      label: -- Sharing Results --
      hint: null
      type: note
      options: []
      required: false
    - id: 33
      name: share_with_birthday_person
