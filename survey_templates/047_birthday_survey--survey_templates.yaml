inputSchema:
  type: object
  properties:
    title: Birthday Survey
    pages:
    - id: 1
      name: section_intro
      label: -- Birthday Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_message
      label: Tell us about your birthday celebration
      hint: We'd love to know how you're celebrating
      type: note
      options: []
      required: false
    - id: 3
      name: section_respondent
      label: -- About You --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 5
      name: respondent_email
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 6
      name: respondent_age
      label: Your Age
      hint: How old are you
      type: number
      options: []
      required: false
    - id: 7
      name: section_celebration
      label: -- Birthday Celebration --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: celebration_date
      label: When is Your Birthday
      hint: Your birth date
      type: date
      options: []
      required: false
    - id: 9
      name: how_celebrating
      label: How Are You Celebrating Your Birthday
      hint: Describe your celebration plans
      type: text
      options: []
      required: true
    - id: 10
      name: celebration_style
      label: Your Celebration Style
      hint: What kind of celebration
      type: select_multiple
      options:
      - Family Gathering
      - Friend Party
      - Romantic Dinner
      - Adventure or Activity
      - Quiet Celebration
      - Work Celebration
      - Large Party
      - Solo Celebration
      required: true
    - id: 11
      name: celebration_location
      label: Where Are You Celebrating
      hint: Location of celebration
      type: text
      options: []
      required: false
    - id: 12
      name: celebration_date_actual
      label: Date of Celebration
      hint: When is the actual celebration
      type: date
      options: []
      required: false
    - id: 13
      name: section_preferences
      label: -- Birthday Preferences --
      hint: null
      type: note
      options: []
      required: false
