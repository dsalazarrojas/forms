      name: ideal_birthday
      label: What Makes an Ideal Birthday For You
      hint: Describe your perfect birthday
      type: text
      options: []
      required: true
    - id: 15
      name: special_interests
      label: Special Birthday Interests
      hint: What do you love to do
      type: select_multiple
      options:
      - Dining Out
      - Entertainment
      - Outdoor Activities
      - Spa or Wellness
      - Shopping
      - Travel
      - Art or Culture
      - Sports
      - Gaming
      - Relaxation
      required: false
    - id: 16
      name: favorite_gift_type
      label: Favorite Gift Types
      hint: What gifts do you prefer
      type: select_multiple
      options:
      - Experiences
      - Practical Items
      - Sentimental Gifts
      - Luxury Items
      - DIY or Handmade
      - Charitable Donation
      - Travel
      - Technology
      - Cash or Gift Cards
      - No Gifts
      required: false
    - id: 17
      name: favorite_food
      label: Favorite Birthday Foods or Treats
      hint: What should be on the menu
      type: text
      options: []
      required: false
    - id: 18
      name: favorite_cake
      label: Favorite Cake Flavor
      hint: Your ideal birthday cake
      type: text
      options: []
      required: false
