inputSchema:
  type: object
  properties:
    title: Engagement Party RSVP Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: attending
      label: Will you be attending?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: rsvp_date
      label: RSVP Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: guests_attending
      label: How many guests will be attending?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 9
      name: special_requests
      label: Special requests
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
