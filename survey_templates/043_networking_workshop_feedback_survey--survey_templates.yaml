      - Somewhat active
      - Not very active
      required: false
    - id: 5
      name: takeaways
      label: What are your biggest takeaways?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: suggestions
      label: Do you have any suggestions for future sessions?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Any other comments
      hint: null
      type: text
      options: []
