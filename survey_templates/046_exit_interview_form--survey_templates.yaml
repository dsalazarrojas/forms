inputSchema:
  type: object
  properties:
    title: Exit Interview Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_info
      label: Employee Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: reason_for_departure
      label: Reason for Departure
      hint: null
      type: select_one
      options:
      - Job not offered
      - Job offer was not accepted
      - Job responsibilities changed
      - Company policies and procedures
      - Harassment or discrimination
      - Other
      required: true
    - id: 4
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - Sales
      - Marketing
      - Support
      - Other
      required: true
    - id: 6
      name: manager_questions
      label: Manager Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: manager_comments
      label: Manager Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: employee_comments
      label: Employee Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: exit_interview
      label: Exit Interview
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
