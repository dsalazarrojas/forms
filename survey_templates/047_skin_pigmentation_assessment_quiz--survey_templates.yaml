inputSchema:
  type: object
  properties:
    title: skin_pigmentation_assessment_quiz
    pages:
    - id: 1
      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: skin_pigmentation_levels
      label: Skin Pigmentation Levels
      hint: null
      type: select_one
      options:
      - None
      - Mild
      - Moderate
      - Severe
      - Very Severe
      required: false
    - id: 3
      name: skin_concerns
      label: Skin Concerns
      hint: null
      type: select_multiple
      options:
      - Hyper-Pigmentation
      - Hypopigmentation
      - Skin Redness
      - Skin Discoloration
      required: false
    - id: 4
      name: skin_pigmentation_treatment
      label: Skin Pigmentation Treatment
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
