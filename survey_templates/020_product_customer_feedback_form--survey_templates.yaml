inputSchema:
  type: object
  properties:
    title: Product Customer Feedback Form
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_question_1
      label: What is your overall rating of this product?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: feedback_question_2
      label: How would you rate the quality of this product?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: feedback_question_3
      label: How likely are you to recommend this product?
      hint: null
      type: select_one
      options:
      - Very Likely to Recommend
      - Somewhat Likely
      - Not Likely
      - Not At All Likely
      required: false
    - id: 5
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: note
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
