inputSchema:
  type: object
  properties:
    title: Acoustics Knowledge Quiz
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: q1_sound_definition
      label: What is sound?
      hint: null
      type: select_one
      options:
      - A longitudinal wave
      - A transverse wave
      - A stationary particle
      required: true
    - id: 3
      name: q2_unit_of_frequency
      label: Frequency is measured in
      hint: null
      type: select_one
      options:
      - Decibels
      - Hertz
      - Watts
      - Amps
      required: true
    - id: 4
      name: q3_speed_of_sound
      label: Sound travels fastest in
      hint: null
      type: select_one
      options:
      - Air
      - Water
      - Steel
      - Vacuum
      required: true
    - id: 5
      name: q4_decibel_scale
      label: A 10dB increase represents a 10x increase in
      hint: null
      type: select_one
      options:
      - Speed
      - Intensity
      - Wavelength
      required: true
    - id: 6
      name: q5_acoustic_materials
      label: Select materials that absorb sound
      hint: Choose all that apply
      type: select_multiple
      options:
      - Foam
      - Glass
      - Carpet
      - Metal
      - Mineral Wool
      required: true
    - id: 7
      name: q6_reverberation
      label: What is reverberation?
      hint: null
      type: select_one
      options:
      - Echo
      - Persistence of sound after source stops
      - Sound refraction
      required: true
    - id: 8
      name: q7_doppler_effect
      label: The change in frequency due to motion is
      hint: null
      type: select_one
      options:
      - Reflection
      - Absorption
      - Doppler Effect
      required: true
    - id: 9
      name: self_assessed_difficulty
      label: Rate the difficulty of this quiz
      hint: 1 - easy, 5 - very hard
      type: number
      options: []
      required: false
    - id: 10
      name: date_taken
      label: Date Taken
      hint: null
      type: date
      options: []
      required: true
