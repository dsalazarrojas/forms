inputSchema:
  type: object
  properties:
    title: Chapter Review Feedback Form
    pages:
      - id: 1
        name: section_attendee_info
        label: -- Your Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: attendee_name
        label: Your Name
        hint: First and last name
        type: text
        options: []
        required: true
      - id: 3
        name: attendee_email
        label: Email Address
        hint: How we can contact you
        type: email
        options: []
        required: true
      - id: 4
        name: chapter_attended
        label: Chapter Meeting Attended
        hint: Name or number of the chapter meeting
        type: text
        options: []
        required: true
      - id: 5
        name: meeting_date
        label: Date of Meeting
        hint: When did this chapter meeting occur
        type: date
        options: []
        required: true
      - id: 6
        name: attendance_type
        label: First Time Attending This Chapter
        hint: Select your attendance status
        type: select_one
        options: ["First Time", "Regular Attendee", "Returning After Absence"]
        required: true
      - id: 7
        name: section_meeting_feedback
        label: -- Meeting Feedback --
        hint: null
        type: note
        options: []
        required: false
      - id: 8
        name: meeting_organization
        label: Organization and Structure of Meeting
        hint: How well was the meeting organized
        type: select_one
        options: ["Excellent", "Good", "Adequate", "Poor"]
        required: true
      - id: 9
        name: content_relevance
        label: Relevance of Content Discussed
        hint: Was the topic relevant to your interests
        type: select_one
        options: ["Very Relevant", "Relevant", "Somewhat Relevant", "Not Relevant"]
        required: true
      - id: 10
        name: speaker_quality
        label: Quality of Speakers or Presenters
        hint: Rate the presenters
        type: select_one
        options: ["Excellent", "Good", "Average", "Fair", "Poor"]
        required: false
      - id: 11
        name: time_management
        label: Was the Meeting Length Appropriate
        hint: Did it start and end on time
        type: select_one
        options: ["Too Long", "Just Right", "Too Short"]
        required: true
      - id: 12
        name: venue_comfort
        label: Venue Comfort and Facilities
        hint: Rate the meeting location and amenities
        type: select_one
        options: ["Excellent", "Good", "Adequate", "Poor"]
        required: false
      - id: 13
        name: section_engagement
        label: -- Engagement and Networking --
        hint: null
        type: note
        options: []
        required: false
      - id: 14
        name: networking_opportunity
        label: Opportunity to Network with Others
        hint: Were you able to make connections
        type: select_one
        options: ["Excellent", "Good", "Fair", "Poor"]
        required: true
      - id: 15
        name: discussion_quality
        label: Quality of Discussion and Q&A
        hint: How well were questions addressed
        type: select_one
        options: ["Very Good", "Good", "Average", "Fair"]
        required: false
      - id: 16
        name: overall_satisfaction
        label: Overall Satisfaction with Chapter Meeting
        hint: Rate your overall experience
        type: select_one
        options: ["Very Satisfied", "Satisfied", "Neutral", "Dissatisfied", "Very Dissatisfied"]
        required: true
      - id: 17
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: What could make future meetings better
        type: text
        options: []
        required: false
      - id: 18
        name: would_attend_again
        label: Will You Attend Future Chapter Meetings
        hint: Are you interested in returning
        type: select_one
        options: ["Definitely", "Probably", "Not Sure", "Probably Not"]
        required: true
      - id: 19
        name: additional_feedback
        label: Additional Comments
        hint: Any other feedback or suggestions
        type: text
        options: []
        required: false
