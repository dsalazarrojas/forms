inputSchema:
  type: object
  properties:
    title: Onboarding Success Monitoring Form
    pages:
    - id: 1
      name: onboarding_success_monitoring_form
      label: What do you think is the number one thing that we did right on your first
        day?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: Job title
      hint: Enter your job title
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 3
      name: onboarding_program
      label: What program are you in?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: onboarding_status
      label: Onboarding status
      hint: null
      type: select_one
      options:
      - Not Started
      - In Progress
      - Completed
      required: false
    - id: 5
      name: onboarding_success
      label: Onboarding success
      hint: null
      type: select_one
      options:
      - Not Very Successful
      - Moderately Successful
      - Very Successful
      required: false
