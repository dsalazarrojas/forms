inputSchema:
  type: object
  properties:
    title: Skincare Product Layering Survey
    pages:
    - id: 1
      name: first_page
      label: Skincare Routines
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: skincare_routine_frequency
      label: How often do you use skincare products?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Rarely
      - Never
      required: false
    - id: 3
      name: product_application
      label: What product type do you use?
      hint: null
      type: select_multiple
      options:
      - Serums
      - Moisturizers
      - Cleansers
      - Toner
      required: false
    - id: 4
      name: skin_condition
      label: What is your skin condition?
      hint: null
      type: select_one
      options:
      - Normal
      - Combination
      - Dry
      - Oily
      - Sensitive
      - Acne-prone
      - Rosacea
      - Other
      required: false
    - id: 5
      name: product_frequency
      label: How often do you apply skincare products?
      hint: null
      type: select_one
      options:
      - Morning and night
      - Morning only
      - Night only
      - Rarely
      - Never
      required: false
    - id: 6
      name: product_ordering
      label: How do you typically layer skincare products?
      hint: null
      type: select_multiple
      options:
      - Always
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 7
      name: routine_consistency
      label: How consistent is your skincare routine?
      hint: null
      type: select_one
      options:
      - Very consistent
      - Somewhat consistent
      - Not very consistent
      - Not consistent at all
      required: false
    - id: 8
      name: product_persistence
      label: How long do you keep using a skincare product until you stop?
      hint: null
      type: select_one
      options:
      - Until it runs out
      - Until it expires
      - 1-2 weeks
      - 1-2 months
      - More than 2 months
      required: false
