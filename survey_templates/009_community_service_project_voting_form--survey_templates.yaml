inputSchema:
  type: object
  properties:
    title: Community Service Project Voting Form
    pages:
      - id: 1
        name: section_member_info
        label: -- Community Member Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: full_name
        label: Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: residency_status
        label: Residency Status
        hint: Select the one that fits best.
        type: select_one
        options:
          - Local Resident
          - Business Owner
          - Student
          - Non-resident Visitor
        required: true
      - id: 4
        name: neighborhood_area
        label: Neighborhood or Ward
        hint: Enter the name of your district or area.
        type: text
        options: []
        required: true
      - id: 5
        name: section_voting
        label: -- Project Voting --
        hint: Choose the initiatives you care about.
        type: note
        options: []
        required: false
      - id: 6
        name: top_priority_project
        label: Which project is your top priority?
        hint: Choose your #1 choice.
        type: select_one
        options:
          - Project A - Park Renovation
          - Project B - Youth After-School Program
          - Project C - Community Garden
          - Project D - Senior Center Expansion
          - Project E - Local Library Technology Upgrade
        required: true
      - id: 7
        name: support_others
        label: Which other projects do you support?
        hint: Select all that you find valuable.
        type: select_multiple
        options:
          - Project A
          - Project B
          - Project C
          - Project D
          - Project E
        required: false
      - id: 8
        name: reasoning_for_choice
        label: Why did you choose your top priority?
        hint: Briefly explain your reasoning.
        type: text
        options: []
        required: true
      - id: 9
        name: section_impact
        label: -- Project Impact Assessment --
        hint: null
        type: note
        options: []
        required: false
      - id: 10
        name: project_benefit
        label: Who do you think will benefit most from these projects?
        hint: null
        type: select_one
        options:
          - Children and Youth
          - Seniors
          - Families
          - Local Businesses
          - Entire Community
        required: true
      - id: 11
        name: environmental_impact
        label: How important is environmental sustainability for these projects?
        hint: null
        type: select_one
        options:
          - Very Important
          - Somewhat Important
          - Neutral
          - Not Important
        required: true
      - id: 12
        name: section_volunteer
        label: -- Volunteer Commitment --
        hint: null
        type: note
        options: []
        required: false
      - id: 13
        name: volunteer_willingness
        label: Would you be willing to volunteer for the winning project?
        hint: null
        type: select_one
        options:
          - "Yes"
          - "No"
          - Maybe
        required: true
      - id: 14
        name: volunteer_email
        label: Volunteer Update Email
        hint: If yes, provide your email for updates.
        type: email
        options: []
        required: false
      - id: 15
        name: section_comments
        label: -- Final Comments --
        hint: null
        type: note
        options: []
        required: false
      - id: 16
        name: additional_suggestions
        label: Do you have any other project suggestions?
        hint: We value your input.
        type: text
        options: []
        required: false
      - id: 17
        name: information_updates
        label: Would you like to receive project updates via email?
        hint: null
        type: select_one
        options:
          - "Yes"
          - "No"
        required: true
