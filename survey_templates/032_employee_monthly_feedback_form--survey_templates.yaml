inputSchema:
  type: object
  properties:
    title: Employee Monthly Feedback Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: This form is for employee feedback and satisfaction on their job.
      type: text
      options: []
      required: false
    - id: 2
      name: job_satisfaction
      label: Overall Job Satisfaction
      hint: How would you rate your overall job satisfaction?
      type: select_one
      options:
      - Highly Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Highly Dissatisfied
      required: false
    - id: 3
      name: department
      label: Department
      hint: Which department do you belong to?
      type: text
      options: []
      required: false
    - id: 4
      name: job_hours
      label: Available Work Hours
      hint: null
      type: select_multiple
      options:
      - 8am - 5pm
      - 9am - 6pm
      - 10am - 7pm
      - 11am - 8pm
      - 12pm - 9pm
      required: false
    - id: 5
      name: job_satisfaction_level
      label: Specific Job Satisfaction
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Good
      - Fair
      - Bad
      - Poor
      required: false
    - id: 6
      name: submission_frequency
      label: Feedback Frequency
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Bi-Annual
      - Annual
      required: false
    - id: 7
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 9
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Employee A
      - Employee B
      - Employee C
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: submission_date_1
      label: Submission Date 1
      hint: null
      type: date
      options: []
      required: false
