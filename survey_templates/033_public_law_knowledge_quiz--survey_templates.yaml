inputSchema:
  type: object
  properties:
    title: Public Law Knowledge Quiz
    pages:
    - id: 1
      name: first_page
      label: What is the purpose of the Public Law?
      hint: Select all that apply
      type: select_multiple
      options:
      - To protect individual rights
      - To regulate commerce
      - To establish public order
      required: false
    - id: 2
      name: first_question
      label: What is the primary function of public law?
      hint: Select one option
      type: select_one
      options:
      - To regulate and enforce laws
      - To interpret and implement laws
      - To advise and educate citizens
      required: false
    - id: 3
      name: first_question_answer
      label: What is the correct answer?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: second_page
