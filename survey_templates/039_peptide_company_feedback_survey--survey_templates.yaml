inputSchema:
  type: object
  properties:
    title: Peptide Company Feedback Survey
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_department
      label: Contact Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: product_used
      label: Product Used
      hint: Which peptide product did you use?
      type: select_multiple
      options:
      - Peptide A
      - Peptide B
      - Peptide C
      required: false
    - id: 6
      name: product_satisfaction
      label: Product Satisfaction
      hint: On a scale of 1-10, how satisfied are you with the product?
      type: number
      options: []
      required: false
    - id: 7
      name: service_satisfaction
      label: Service Satisfaction
      hint: On a scale of 1-10, how satisfied are you with our service?
      type: number
      options: []
      required: false
    - id: 8
      name: service_quality
      label: Service Quality
      hint: On a scale of 1-10, how would you rate the quality of our services?
      type: number
      options: []
      required: false
