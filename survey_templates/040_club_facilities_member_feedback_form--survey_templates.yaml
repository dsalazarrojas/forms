inputSchema:
  type: object
  properties:
    title: Club Facilities Member Feedback Form
    pages:
    - id: 1
      name: section_respondent
      label: -- Member Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: member_name
      label: Your Name
      hint: Optional - for follow-up
      type: text
      options: []
      required: false
    - id: 3
      name: member_id
      label: Member ID Number
      hint: If available
      type: text
      options: []
      required: false
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: membership_duration
      label: How long have you been a member?
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 6
      name: visit_frequency
      label: How often do you use the facilities?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times per week
      - Weekly
      - Few times per month
      - Monthly
      - Rarely
      required: true
    - id: 7
      name: section_conditions
      label: -- Facility Conditions --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: cleanliness
      label: Cleanliness of Facilities
      hint: Rate from 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 9
      name: maintenance
      label: Equipment Maintenance and Repair
      hint: Rate from 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 10
      name: safety
      label: Safety and Security
      hint: Rate from 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 11
      name: temperature_control
      label: Temperature Control and Comfort
      hint: Rate from 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 12
      name: lighting
      label: Lighting Quality
      hint: Rate from 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 13
      name: restroom_facilities
      label: Restroom Facilities
      hint: Rate from 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: false
    - id: 14
      name: section_amenities
      label: -- Amenities and Services --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: available_amenities
      label: Amenities Currently Used
      hint: null
      type: select_multiple
      options:
      - Locker rooms
      - Shower facilities
      - Parking
      - WiFi
      - Vending machines
      - Cafe or snack bar
      - Sports equipment
      - Meeting rooms
      required: false
    - id: 16
      name: amenities_satisfaction
      label: Satisfaction with Current Amenities
      hint: Rate from 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: false
    - id: 17
      name: section_improvements
      label: -- Areas for Improvement --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: biggest_concern
      label: Biggest Concern About Facilities
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: desired_improvements
      label: What Improvements Would You Like?
      hint: Specific changes or new amenities
      type: text
      options: []
      required: false
    - id: 20
      name: new_amenities
      label: Most Wanted New Amenity or Service
      hint: null
      type: select_one
      options:
      - Expanded parking
      - Improved restrooms
      - Upgraded equipment
      - Cafe expansion
      - Additional meeting spaces
      - Improved WiFi
      - Other
      required: false
    - id: 21
      name: section_overall
      label: -- Overall Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: overall_satisfaction
      label: Overall Satisfaction with Facilities
      hint: Rate from 1 (very unsatisfied) to 5 (very satisfied)
      type: number
      options: []
      required: true
    - id: 23
      name: likelihood_recommend
      label: Likelihood to Recommend Club
      hint: Rate from 1 (unlikely) to 5 (very likely)
      type: number
      options: []
      required: true
    - id: 24
      name: additional_comments
      label: Additional Comments or Suggestions
      hint: null
      type: text
      options: []
      required: false
