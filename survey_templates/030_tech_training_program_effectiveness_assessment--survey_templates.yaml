inputSchema:
  type: object
  properties:
    title: Tech Training Program Effectiveness Assessment
    pages:
    - id: 1
      name: session_evaluation
      label: Session Evaluation
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: content_quality
      label: Content Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: session_length
      label: Session Length
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: instructor_performance
      label: Instructor Performance
      hint: How would you rate the instructor's overall performance during the session?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: content_delivery
      label: Content Delivery
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: program_relevance
      label: Program Relevance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: program_satisfaction
      label: Program Satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
