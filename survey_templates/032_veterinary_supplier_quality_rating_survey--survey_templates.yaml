inputSchema:
  type: object
  properties:
    title: Veterinary Supplier Quality Rating Survey
    pages:
    - id: 1
      name: supplier_name
      label: Supplier Name
      hint: Please enter the name of the supplier.
      type: text
      options: []
      required: true
    - id: 2
      name: quality_service
      label: Quality of Service
      hint: How would you rate the quality of service?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: quality_facility
      label: Quality of Facility
      hint: How would you rate the quality of the facility?
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: have_direct_contact
      label: Direct Contact
      hint: Do you have direct contact with the supplier's facility?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: quality_communication
      label: Quality of Communication
      hint: How would you rate the quality of communication?
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: quality_response
      label: Quality of Response
      hint: How would you rate the quality of response?
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: total_score
      label: Total Score
      hint: What is your total score out of 10?
      type: number
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: Please describe your experience with this supplier.
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: Enter a valid email address.
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone
      hint: Enter a valid phone number.
      type: text
      options: []
      required: false
    - id: 11
      name: last_contact
      label: Last Contact
      hint: When was your last contact with the supplier?
      type: date
      options: []
      required: true
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
