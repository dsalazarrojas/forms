inputSchema:
  type: object
  properties:
    title: Coaching Staff Satisfaction Assessment
    pages:
    - id: 1
      name: section_respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: staff_name
      label: Staff Member Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: position
      label: Position
      hint: Your role on the coaching staff
      type: text
      options: []
      required: true
    - id: 5
      name: tenure
      label: Years with Organization
      hint: null
      type: number
      options: []
      required: false
