      name: section_role_satisfaction
      label: -- Role and Responsibilities --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: role_satisfaction
      label: Satisfaction with Your Role
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
