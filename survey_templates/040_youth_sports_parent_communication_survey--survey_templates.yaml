inputSchema:
  type: object
  properties:
    title: Youth Sports Parent Communication Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: parent_email
      label: Parent Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: communication_quality
      label: Communication Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: communication_purpose
      label: Communication Purpose
      hint: null
      type: select_one
      options:
      - Feedback
      - Updates
      - General info
      required: false
    - id: 6
      name: improvement_areas
      label: Areas for Improvement
      hint: null
      type: select_multiple
      options:
      - Scheduling
      - Team info
      - Other
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
