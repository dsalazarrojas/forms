      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: match_time
      label: Match Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: match_time_zone
      label: Match Time Zone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: referee_id
      label: Referee
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: match_venue
      label: Venue
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
