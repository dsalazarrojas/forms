inputSchema:
  type: object
  properties:
    title: Event Security And Safety Feedback Survey
    pages:
    - id: 1
      name: survey_start
      label: Survey start
      hint: null
      type: time
      options: []
      required: true
    - id: 2
      name: event_attended
      label: Event attended
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: survey_organizer
      label: Survey organizer
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_start_date
      label: Event start date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: event_end_date
      label: Event end date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: venue
      label: Venue
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: attendees
      label: Number of attendees
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: safety_measures
      label: Safety measures taken
      hint: null
      type: select_multiple
      options:
      - First aid kit
      - Emergency exit routes
      - Safety briefing
      - Emergency contact numbers
      required: true
    - id: 9
      name: safety_procedure
      label: Safety procedure
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: event_safety_risk_rating
      label: Event safety risk rating
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: safety_procedure_effectiveness
      label: Safety procedure effectiveness
      hint: null
      type: select_one
      options:
      - Highly effective
      - Somewhat effective
      - Not effective at all
      required: true
    - id: 12
      name: security_procedures
      label: Security procedures
      hint: null
      type: select_multiple
      options:
      - Security cameras
      - Emergency exit routes
      - Security guards
      required: true
    - id: 13
      name: overall_security_performance
      label: Overall security performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: survey_end
      label: Survey end
      hint: null
      type: time
      options: []
      required: true
