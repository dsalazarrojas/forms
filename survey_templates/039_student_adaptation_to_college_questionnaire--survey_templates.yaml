inputSchema:
  type: object
  properties:
    title: Student Adaptation To College Questionnaire
    pages:
    - id: 1
      name: school_program_label
      label: School Program
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Sure
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: grade_level
      label: Grade Level
      hint: null
      type: select_multiple
      options:
      - Sophomore
      - Junior
      - Senior
      - Freshman
      - Other
      required: false
    - id: 4
      name: academic_history
      label: Academic History
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: student_citizenship
      label: Student Citizenship
      hint: null
      type: select_one
      options:
      - US Citizen
      - Non-US Citizen
      - US Resident
      - Other
      required: false
    - id: 6
      name: language_proficiency
      label: Language Proficiency
      hint: null
      type: select_one
      options:
      - Native
      - Fluent
      - Basic
      - None
      required: false
    - id: 7
      name: student_residency
      label: Student Residency
      hint: null
      type: select_one
      options:
      - US
      - Non-US
      - International
      required: false
    - id: 8
      name: student_age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: student_gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 10
      name: parent_name
      label: Parent/Guardian Name
      hint: null
      type: text
      options: []
      required: false
