inputSchema:
  type: object
  properties:
    title: Snack Product Sensory Evaluation
    pages:
    - id: 1
      name: taste_test
      label: Taste Test
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: texture_test
      label: Texture Test
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: favorite_taste
      label: Favorite Taste
      hint: null
      type: select_one
      options:
      - Sweet
      - Salty
      - Savory
      required: false
    - id: 5
      name: favorite_texture
      label: Favorite Texture
      hint: null
      type: select_one
      options:
      - Crunchy
      - Smooth
      - Soft
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_multiple
      options:
      - Highly Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Highly Dissatisfied
      required: false
    - id: 7
      name: would_recommend
      label: Would Recommend
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Undecided
      required: false
    - id: 8
      name: open_ended_comments
      label: Open-Ended Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
