inputSchema:
  type: object
  properties:
    title: Pregnancy And Development Survey
    pages:
    - id: 1
      name: pregnancy_status
      label: Pregnancy Status
      hint: null
      type: select_one
      options:
      - Pregnant
      - Not Pregnant
      - Miscarriage
      - Other
      required: true
    - id: 2
      name: prenatal_care_habits
      label: Prenatal Care Habits
      hint: Please select all that apply
      type: select_multiple
      options:
      - Yes, received regular prenatal check-ups and care
      - Yes, but did not receive regular prenatal check-ups and care
      - No, did not receive any prenatal care
      - Other, please describe
      required: false
    - id: 3
      name: pregnancy_experiences
      label: Pregnancy Experiences
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: baby_status
