inputSchema:
  type: object
  properties:
    title: Debt Management Checklist
    pages:
    - id: 1
      name: debt_assessment
      label: Assess debt
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: debt_frequency
      label: Assess how often
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: debt_amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: debt_type
      label: Debt type
      hint: What type of debt?
      type: select_one
      options:
      - Credit card
      - Personal loan
      - Student loan
      - Mortgage
      - Auto loan
      - Other
      required: false
    - id: 5
      name: debt_priority
      label: Priority
      hint: How urgent is this debt?
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
