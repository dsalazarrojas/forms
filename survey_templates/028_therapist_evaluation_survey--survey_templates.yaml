inputSchema:
  type: object
  properties:
    title: Therapist Evaluation Survey
    pages:
    - id: 1
      name: client_feedback
      label: Client Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_question_1
      label: How would you rate the therapist’s communication style?
      hint: null
      type: select_one
      options:
      - Very poor
      - Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 3
      name: feedback_question_2
      label: How would you rate the therapist's professionalism?
      hint: null
      type: select_one
      options:
      - Very poor
      - Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 4
      name: feedback_question_3
      label: How responsive is the therapist to your needs?
      hint: null
      type: select_one
      options:
      - Very poor
      - Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 5
      name: feedback_question_4
      label: How would you rate the overall satisfaction with the therapy sessions?
      hint: null
      type: select_one
      options:
      - Very poor
      - Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 6
      name: feedback_question_5
      label: How likely are you to recommend this therapist to others?
      hint: null
      type: select_one
      options:
      - Very unlikely
      - Unlikely
      - Neutral
      - Likely
      - Very likely
      required: false
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_user
      label: Assigned User
      hint: null
      type: text
      options: []
      required: false
