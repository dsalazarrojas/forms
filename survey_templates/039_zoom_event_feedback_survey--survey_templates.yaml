inputSchema:
  type: object
  properties:
    title: Zoom Event Feedback Survey
    pages:
    - id: 1
      name: overall_experience
      label: Overall Experience
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Bad
      required: false
    - id: 2
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: participant_name
      label: Participant Name
      hint: Enter your participant name
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
