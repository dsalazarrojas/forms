inputSchema:
  type: object
  properties:
    title: Concert Experience Feedback Form
    pages:
      - id: 1
        name: respondent_name
        label: Full name
        hint: Enter your first and last name
        type: text
        options: []
        required: true
      - id: 2
        name: email_address
        label: Email address
        hint: For follow up about your feedback
        type: email
        options: []
        required: true
      - id: 3
        name: event_date
        label: Event date
        hint: Date of the concert you attended
        type: date
        options: []
        required: true
      - id: 4
        name: venue_name
        label: Venue name
        hint: Name of arena or venue
        type: text
        options: []
        required: false
      - id: 5
        name: seating_area
        label: Seating area
        hint: Where you were seated or standing
        type: select_one
        options:
          - General admission
          - Floor
          - Lower level
          - Upper level
          - VIP
        required: false
      - id: 6
        name: overall_experience
        label: Overall experience rating
        hint: Rate your overall concert experience
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 7
        name: sound_quality
        label: Sound quality rating
        hint: How was the audio and mix
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 8
        name: crowd_management
        label: Crowd management and safety rating
        hint: Staff, entrances, and crowd flow
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: false
      - id: 9
        name: favorite_moment
        label: Favorite moment from the show
        hint: Describe any highlight or memorable part
        type: text
        options: []
        required: false
      - id: 10
        name: additional_comments
        label: Additional comments or suggestions
        hint: Any other feedback to help improve future events
        type: text
        options: []
        required: false
