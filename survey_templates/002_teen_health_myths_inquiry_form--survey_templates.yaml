inputSchema:
  type: object
  properties:
    title: Teen Health Myths Inquiry Form
    pages:
    - id: 1
      name: common_misconceptions
      label: Commonly Held Myths
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: myth_description
      label: What is the common myth?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: myth_frequency
      label: How many students believe this myth?
      hint: null
      type: select_multiple
      options:
      - Less than 50% of students
      - 50-60% of students
      - More than 90% of students
      required: false
    - id: 4
      name: myth_location
      label: Where does this myth originate?
      hint: null
      type: select_one
      options:
      - Schools
      - Parents
      - Social media
      - Other
      required: false
    - id: 5
      name: myth_impact
      label: How often do you believe this myth impacts student health?
      hint: null
      type: select_multiple
      options:
      - Often
      - Sometimes
      - Rarely
      required: false
    - id: 6
      name: myth_source
      label: What source of information do you rely on when you hear a myth?
      hint: null
      type: select_one
      options:
      - Teachers
      - Social media
      - Parents
      - Other
      required: false
    - id: 7
      name: myth_reliable
      label: How reliable is the source of the myth?
      hint: null
      type: select_one
      options:
      - Very reliable
      - Somewhat reliable
      - Not very reliable
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: student_health
      label: How does this myth affect student health?
      hint: null
      type: select_one
      options:
      - Somewhat
      - Not very much
      - Very much
      required: false
    - id: 10
      name: health_education
      label: How would you like to address this myth in health education?
      hint: null
      type: select_multiple
      options:
      - Include it
      - Omit it
      - Address it in a different way
      required: false
    - id: 11
      name: other_comments
      label: Other comments
      hint: null
      type: note
      options: []
      required: false
