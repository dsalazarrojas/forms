inputSchema:
  type: object
  properties:
    title: Retail Employee Shift Satisfaction Poll
    pages:
    - id: 1
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shift
      label: Shift
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Night
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: shift_length
      label: Shift Length
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: work_status
      label: Work Status
      hint: null
      type: select_one
      options:
      - On Time
      - Late
      - Absent
      required: false
    - id: 7
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 8
      name: reasons_for_satisfaction
      label: Reasons For Satisfaction
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: reasons_for_dissatisfaction
      label: Reasons For Dissatisfaction
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: suggestions_for_improvement
      label: Suggestions For Improvement
      hint: null
      type: text
      options: []
      required: false
