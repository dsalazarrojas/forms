inputSchema:
  type: object
  properties:
    title: Caregiver Support Workshop Evaluation
    pages:
      - id: 1
        name: participant_information
        label: -- Participant Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: participant_name
        label: Your Name
        hint: Optional - for follow-up purposes
        type: text
        options: []
        required: false
      - id: 3
        name: workshop_date
        label: Workshop Date Attended
        hint: MM/DD/YYYY
        type: date
        options: []
        required: true
      - id: 4
        name: workshop_session
        label: Workshop Session
        hint: Select the session you attended
        type: select_one
        options:
          - Morning Session (9am - 12pm)
          - Afternoon Session (1pm - 4pm)
          - Evening Session (6pm - 8pm)
          - All-Day Workshop
        required: true
      - id: 5
        name: facilitator_name
        label: Facilitator Name
        hint: Enter the name of the workshop facilitator
        type: text
        options: []
        required: false
      - id: 6
        name: overall_satisfaction
        label: -- Overall Satisfaction --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: overall_workshop_rating
        label: How would you rate the overall workshop quality?
        hint: Select your rating
        type: select_one
        options:
          - Excellent
          - Good
          - Satisfactory
          - Fair
          - Poor
        required: true
      - id: 8
        name: likely_recommend
        label: How likely are you to recommend this workshop to other caregivers?
        hint: null
        type: select_one
        options:
          - Very Likely
          - Likely
          - Neutral
          - Unlikely
          - Very Unlikely
