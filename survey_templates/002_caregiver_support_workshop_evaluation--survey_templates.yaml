        hint: null
        type: select_one
        options:
          - Highly Relevant
          - Relevant
          - Somewhat Relevant
          - Not Very Relevant
          - Not Relevant
        required: true
      - id: 11
        name: new_skills_learned
        label: Did you learn new skills or strategies?
        hint: null
        type: select_one
        options:
          - Yes, many new skills
          - Yes, some new skills
          - A few useful concepts
          - Not much new information
          - Nothing new
        required: true
      - id: 12
        name: content_clarity
        label: Was the workshop content presented clearly?
