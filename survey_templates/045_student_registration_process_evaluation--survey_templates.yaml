inputSchema:
  type: object
  properties:
    title: Student Registration Process Evaluation
    pages:
    - id: 1
      name: student_info
      label: Student Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: current_address
      label: Current Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: major_department
      label: Major or Department
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: areas_of_interest
      label: Areas of Interest
      hint: null
      type: select_multiple
      options:
      - Academic Support
      - Career Guidance
      - Financial Aid
      required: true
    - id: 8
      name: registration_complete
      label: Is Registration Complete?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit_application
      label: Submission
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: more_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: feedback
      label: Feedback
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
