inputSchema:
  type: object
  properties:
    title: Student Portal Feedback Form
    pages:
    - id: 1
      name: student_portal_satisfaction
      label: How satisfied are you with the portal overall?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 2
      name: feature_usage
      label: Which features do you frequently use on the portal?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 3
      name: technical_issues
      label: Have you experienced any technical issues with the portal?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 4
      name: portal_usage
      label: How often do you use the portal?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: feedback_comments
      label: Any feedback or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
