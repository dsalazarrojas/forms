inputSchema:
  type: object
  properties:
    title: Office Cleanliness Feedback Form
    pages:
    - id: 1
      name: office_cleanliness
      label: How often do you clean your workspace
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: work_area
      label: Which area of the office is the cleanest
      hint: null
      type: select_one
      options:
      - Break Room
      - Kitchen
      - Meeting Room
      - Other
      - Office
      required: true
    - id: 3
      name: cleanliness_level
      label: What's the level of cleanliness you'd rate
      hint: On a scale of 1-5
      type: select_one
      options:
      - 1 - Very Dirty
      - 2 - Somewhat Dirty
      - 3 - Neutral
      - 4 - Somewhat Clean
      - 5 - Extremely Clean
      required: true
    - id: 4
      name: concerns
      label: Is there anything else you'd like to tell us about the state of the office?
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: contact_info
      label: Would you like to provide additional contact information?
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: feedback_frequency
      label: How often do you think the office cleanliness level changes?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Never
      required: true
    - id: 7
      name: cleanliness_priority
      label: Which of the following is the main reason you rate the office cleanliness
      hint: null
      type: select_multiple
      options:
      - Trash and Recycling
      - Disinfecting and Sanitizing
      - Cleaning Equipment and Supplies
      - Other
      required: true
