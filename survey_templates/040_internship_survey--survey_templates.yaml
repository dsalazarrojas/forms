      options:
      - Compensation
      - Learning Opportunity
      - Work-Life Balance
      - Company Culture
      - Career Advancement
      - Other
      required: false
    - id: 4
      name: what_was_main_reason
      label: What was the most enjoyable part of your internship?
      hint: null
      type: select_multiple
      options:
      - Learning
      - Work-Life Balance
      - Compensation
      - Company Culture
      - Career Advancement
      required: false
    - id: 5
      name: what_was_most_enjoyable
      label: What was the least enjoyable part of your internship?
      hint: null
      type: select_multiple
      options:
      - Boredom
      - Unhelpful Colleagues
      - Lack of Clear Expectations
      - Poor Management
