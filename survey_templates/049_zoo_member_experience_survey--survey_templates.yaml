inputSchema:
  type: object
  properties:
    title: Zoo Member Experience Survey
    pages:
    - id: 1
      name: zoo_member_experience_survey_1_name
      label: What is your name?
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: zoo_member_experience_survey_2_rate
      label: Rate your overall experience
      hint: Scale - 1 (very dissatisfied) to 5 (very satisfied)
      type: number
      options: []
      required: true
    - id: 3
      name: zoo_member_experience_survey_3_satisfaction
      label: How satisfied are you with your visit?
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - neutral
      - somewhat dissatisfied
      - dissatisfied
      required: true
    - id: 4
      name: zoo_member_experience_survey_4_email
      label: Email (optional)
      hint: Please enter your email address
      type: email
      options: []
      required: false
    - id: 5
      name: zoo_member_experience_survey_5_feedback
      label: Additional feedback
      hint: Tell us about your experience
      type: text
      options: []
      required: false
    - id: 6
      name: zoo_member_experience_survey_6_time
      label: Visit Time
      hint: HH -MM 24h format
      type: time
      options: []
      required: true
    - id: 7
      name: zoo_member_experience_survey_7_category
      label: Category
      hint: null
      type: select_one
      options:
      - Category 1
      - Category 2
      - Category 3
      required: true
    - id: 8
      name: zoo_member_experience_survey_8_comments
      label: Comments
      hint: Share your thoughts
      type: text
      options: []
      required: false
    - id: 9
      name: zoo_member_experience_survey_9_agree
      label: Do you agree with the following statement?
      hint: null
      type: select_multiple
      options:
      - agree
      - disagree
      - neutral
      required: true
    - id: 10
      name: zoo_member_experience_survey_10_disagree
      label: Do you disagree with the following statement?
      hint: null
      type: select_multiple
      options:
      - agree
      - disagree
      - neutral
      required: false
    - id: 11
      name: zoo_member_experience_survey_11_agree_2
      label: Zoo Member Experience Survey 11 Agree 2
      hint: null
      type: select_multiple
      options:
      - agree
      - disagree
      - neutral
      required: false
    - id: 12
      name: zoo_member_experience_survey_12_disagree_2
      label: Zoo Member Experience Survey 12 Disagree 2
      hint: null
      type: select_multiple
      options:
      - agree
      - disagree
      - neutral
      required: false
