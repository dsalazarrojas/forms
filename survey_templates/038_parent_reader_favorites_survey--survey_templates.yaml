inputSchema:
  type: object
  properties:
    title: Parent Reader Favorites Survey
    pages:
    - id: 1
      name: reader_preferences
      label: What is your favorite book genre?
      hint: null
      type: select_multiple
      options:
      - Action
      - Adventure
      - Classics
      - Fantasy
      - Mystery
      - Romance
      - Science Fiction
      - Horror
      - Literature
      - Non-Fiction
      - Historical Fiction
      - Mystery/Thriller
      required: false
    - id: 2
      name: reading_frequency
      label: How often do you read?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - About once a week
      - Rarely
      - Never
      required: false
    - id: 3
      name: reading_time
      label: What time of day do you prefer reading?
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Late Night
      required: false
    - id: 4
      name: family_reading_habits
      label: Which of the following best describe your family reading habits?
      hint: null
      type: select_multiple
      options:
      - We read together
      - We read separately
      - We read together sometimes
      - None of the above
      required: false
    - id: 5
      name: favorite_books
      label: What are your favorite books of all time?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: favorite_authors
      label: Favorite authors
      hint: null
      type: select_multiple
      options:
      - Author 1
      - Author 2
      - Author 3
      - Author 4
      required: false
    - id: 7
      name: recommended_books
      label: Which of the following books do you recommend?
      hint: null
      type: select_multiple
      options:
      - Book 1
      - Book 2
      - Book 3
      - Book 4
      required: false
    - id: 8
      name: reading_preferences_other
      label: Are there other books that you prefer?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: reading_device
      label: What device do you prefer reading on?
      hint: null
      type: select_multiple
      options:
      - Physical book
      - E-Reader
      - Tablet
      - Smartphone
      - Computer
      required: false
    - id: 10
      name: reading_habit_other
      label: Are there any other reading habits that you have?
      hint: null
      type: select_multiple
      options:
      - Other
      - None
      required: false
    - id: 11
      name: notes
      label: Additional comments or suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: false
