inputSchema:
  type: object
  properties:
    title: Site Visit Evaluation Checklist
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: site_visit_goals
      label: Site Visit Goals
      hint: Please indicate the site visit goals.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: stakeholders_met
      label: Stakeholders Met
      hint: null
      type: select_one
      options:
      - All site visitors were met
      - Some site visitors were met
      - No site visitors were met
      required: false
    - id: 4
      name: engagement_with_site_visit
      label: Engagement with site visit
      hint: Please indicate level of engagement with site visit.
      type: number
      options: []
      required: false
    - id: 5
      name: communication
      label: Communication
      hint: Please indicate the level of communication during the site visit.
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: logistics
      label: Site Visit Logistics
      hint: null
      type: select_multiple
      options:
      - Vehicle
      - Accomodation
      required: false
    - id: 7
      name: time_management
      label: Time Management
      hint: Please indicate the time spent on site visit.
      type: time
      options: []
      required: false
    - id: 8
      name: overall_outcomes
      label: Overall Outcomes
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: site_visit_suggestions
      label: Site Visit Suggestions
      hint: Please indicate any suggestions for improving site visits.
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: Please provide any additional comments.
      type: text
      options: []
      required: false
    - id: 11
      name: site_visit_evaluation
      label: Site Visit Evaluation
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 12
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 15
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
