      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: sales_forecast_non_holiday
      label: Non-holiday Sales Forecast
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: product_price
      label: Product Price
      hint: null
      type: number
      options: []
