inputSchema:
  type: object
  properties:
    title: Aquifer Assessment Survey
    pages:
    - id: 1
      name: site_info
      label: Site Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: site_name
      label: Site Name or Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: survey_date
      label: Survey Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: surveyor_name
      label: Surveyor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: coordinates
      label: GPS Coordinates (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: aquifer_data
      label: Aquifer Data Collection
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: well_depth
      label: Well Depth (feet)
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: water_level
      label: Water Level (feet below surface)
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: water_temperature
      label: Water Temperature (Fahrenheit)
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: water_quality
      label: Water Quality Assessment
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: contamination_signs
      label: Signs of Contamination
      hint: null
      type: select_one
      options:
      - None Observed
      - Possible Contamination
      - Definite Contamination
      required: true
    - id: 12
      name: salinity_level
      label: Salinity Level Assessment
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: flow_rate
      label: Flow Rate or Yield (gallons per minute)
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: observations
      label: Additional Observations
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: recommendations
      label: Monitoring Recommendations
      hint: null
      type: text
      options: []
      required: false
