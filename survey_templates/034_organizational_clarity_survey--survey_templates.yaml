inputSchema:
  type: object
  properties:
    title: Organizational Clarity Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: communication
      label: How do you feel about the overall quality of communication within your
        team?
      hint: null
      type: select_one
      options:
      - Very Good
      - Neutral
      - Poor
      required: false
    - id: 3
      name: understanding
      label: How well do you understand your role and responsibilities within the
        team?
      hint: null
      type: select_one
      options:
      - Extremely well
      - Somewhat well
      - Not very well
      - Not at all well
      required: false
    - id: 4
      name: clarity
      label: Do you feel that your role and responsibilities are clear?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: feedback
      label: Are there any areas that you would like to provide feedback on?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: follow_up
      label: How would you like to be updated about organizational improvements?
      hint: null
      type: select_one
      options:
      - Regularly
      - When needed
      - Never
      required: false
    - id: 7
      name: communication_channels
      label: Which of the following are the most effective communication channels?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Team meetings
      - Instant messaging
      - One-on-one meetings
      required: false
    - id: 8
      name: communication_frequencies
      label: What is your preferred communication frequency for team meetings?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      - Never
      required: false
