      name: workshop_educational_value
      label: How much did you find the workshop educational?
      hint: null
      type: select_one
      options:
      - Very High
      - High
      - Medium
      - Low
      - Very Low
      required: true
    - id: 4
      name: workshop_facilities
      label: Facilities
      hint: null
