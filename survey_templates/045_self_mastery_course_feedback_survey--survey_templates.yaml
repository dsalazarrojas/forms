inputSchema:
  type: object
  properties:
    title: self_mastery_course_feedback_survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: satisfaction_rating
      label: Satisfaction Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: course_materials
      label: Course Materials
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 4
      name: course_instructors
      label: Course Instructors
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: course_content
      label: Course Content
      hint: null
      type: select_multiple
      options:
      - Relevant and Well-Organized
      - Relevant but not Well-Organized
      - Somewhat Relevant
      - Somewhat Irrelevant
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 7
      name: suggestions_for_improvement
      label: Suggestions for Improvement
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_information
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Social Media
      required: false
