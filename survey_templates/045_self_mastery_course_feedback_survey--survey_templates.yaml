inputSchema:
  type: object
  properties:
    title: self_mastery_course_feedback_survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: satisfaction_rating
      label: Satisfaction Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: course_materials
      label: Course Materials
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very Satisfied''}'
      - '{''label'': ''Somewhat Satisfied''}'
      - '{''label'': ''Somewhat Dissatisfied''}'
      - '{''label'': ''Very Dissatisfied''}'
      required: false
    - id: 4
      name: course_instructors
      label: Course Instructors
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Excellent''}'
      - '{''label'': ''Good''}'
      - '{''label'': ''Fair''}'
      - '{''label'': ''Poor''}'
      required: false
    - id: 5
      name: course_content
      label: Course Content
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Relevant and Well-Organized''}'
      - '{''label'': ''Relevant but not Well-Organized''}'
      - '{''label'': ''Somewhat Relevant''}'
      - '{''label'': ''Somewhat Irrelevant''}'
