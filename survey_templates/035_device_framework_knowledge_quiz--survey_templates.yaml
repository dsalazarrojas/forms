inputSchema:
  type: object
  properties:
    title: Device Framework Knowledge Quiz
    pages:
    - id: 1
      name: first_question
      label: What is your experience level with the device framework?
      hint: Please choose one of the options.
      type: select_one
      options:
      - 'Yes'
      - 'False'
      required: false
    - id: 2
      name: years_of_experience
      label: How many years do you have working with the device framework?
      hint: This will not affect your score.
      type: number
      options: []
      required: true
    - id: 3
      name: device_type
      label: What type of device do you primarily work with?
      hint: Please choose all that apply.
      type: select_multiple
      options:
      - Device A
      - Device B
      - Device C
      required: true
    - id: 4
      name: role
      label: What is your role within the team?
      hint: Describe your role in the team.
      type: text
      options: []
      required: true
    - id: 5
      name: experience_debugging
      label: Can you describe your experience with debugging the device framework?
      hint: Please share any relevant details.
      type: text
      options: []
      required: true
    - id: 6
      name: common_issues
      label: What is the most common issue you face with the device framework?
      hint: Please choose all that apply.
      type: select_multiple
      options:
      - Bug A
      - Bug B
      - Bug C
      required: true
    - id: 7
      name: learning_preferences
      label: What is your preferred way to learn about new frameworks?
      hint: Please choose all that apply.
      type: select_multiple
      options:
      - YouTube tutorials
      - Online forums
      - Books
      - Instructors
      required: true
    - id: 8
      name: workshop_attendance
      label: Have you attended any workshops or conferences related to the device
        framework?
      hint: This will not affect your score.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: meetups_attendance
      label: How often do you attend online meetups or webinars about the device framework?
      hint: This will not affect your score.
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      required: true
    - id: 10
      name: challenging_project
      label: Can you describe a challenging project you worked on with the device
        framework?
      hint: Please share your story.
      type: text
      options: []
      required: true
    - id: 11
      name: team_conflicts
      label: How do you handle conflicts with team members when working with the device
        framework?
      hint: This will not affect your score.
      type: select_multiple
      options:
      - Confuciusly
      - Aggressively
      - Cooperatively
      required: true
    - id: 12
      name: exciting_feature
      label: What do you think is the most exciting feature of the device framework?
      hint: This will not affect your score.
      type: text
      options: []
      required: true
