inputSchema:
  type: object
  properties:
    title: Virtual Event Patron Evaluation Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Virtual Event
      - In-Person Event
      - Online Event
      required: false
    - id: 5
      name: event_attendees
      label: Attendees
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: event_satisfaction
      label: How Satisfied
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 9
      name: event_recommend
      label: Recommend
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: event_follow_up
      label: Follow-up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
