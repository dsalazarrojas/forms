inputSchema:
  type: object
  properties:
    title: Onboarding Uniform Size Survey
    pages:
    - id: 1
      name: onboarding_uniform_size_survey
      label: Employee Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: onboarding_uniform_size
      label: Select Uniform Size
      hint: null
      type: select_one
      options:
      - Large
      - Medium
      - Small
      - Extra Small
      required: false
    - id: 3
      name: onboarding_special_requirements
      label: Special Requirements
      hint: null
      type: select_multiple
      options:
      - Special Requirements 1
      - Special Requirements 2
      - Special Requirements 3
      - Special Requirements 4
      required: true
    - id: 4
      name: onboarding_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: onboarding_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: onboarding_note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: employee_phone
      label: Employee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: onboarding_status
      label: Onboarding Status
      hint: null
      type: select_one
      options:
      - Pending
      - Onboarding
      - Completed
      required: false
    - id: 10
      name: onboarding_comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
