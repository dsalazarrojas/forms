inputSchema:
  type: object
  properties:
    title: Grant Writing Workshop Feedback Form
    pages:
    - id: 1
      name: grant_writing_workshop_feedback
      label: What did you think of the grant writing workshop?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: what_did_you_gain_from_workshop
      label: What did you gain from the workshop?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: grant_writing_experience
      label: What is your experience level with grant writing?
      hint: null
      type: select_one
      options:
      - Grant Writing Beginner
      - Grant Writing Intermediate
      - Grant Writing Advanced
      required: false
    - id: 4
      name: grant_writing_workshop_topics
      label: What topics would you like to see covered in future grant writing workshops?
      hint: null
      type: select_multiple
      options:
      - Grant Writing Basics
      - Grant Research and Development
      - Grant Writing for Non-Profits
      - Grant Writing for Government Agencies
      required: false
    - id: 5
      name: grant_writing_workshop_format
      label: How would you rate the grant writing workshop format?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: grant_writing_workshop_satisfaction
      label: How satisfied were you with the grant writing workshop?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 7
      name: grant_writing_workshop_improvement
      label: What suggestions do you have for improving the grant writing workshop?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: grant_writing_workshop_attendee_satisfaction
      label: How satisfied are you with the overall satisfaction of the workshop attendees?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 9
      name: grant_writing_workshop_participant_satisfaction
      label: How would you rate the satisfaction of participants in the workshop?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 10
      name: grant_writing_workshop_further_inquiries
