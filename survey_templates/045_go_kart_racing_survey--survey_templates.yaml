inputSchema:
  type: object
  properties:
    title: Go Kart Racing Survey
    pages:
    - id: 1
      name: intro
      label: Welcome to the go kart racing survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: experience
      label: How was your experience at the kart racing facility
      hint: Please share your feedback
      type: text
      options: []
      required: false
    - id: 3
      name: staff_interaction
      label: How was the staff interaction during your visit
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: facilities
      label: How were the facilities at the kart racing facility
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: racing_quality
      label: How would you rate the quality of racing provided
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: price
      label: How would you rate the price of the experience
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall satisfaction with your visit
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: staff_suggestion
      label: Any suggestions for the staff
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: staff_improvement
      label: Any suggestions for improvements
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: review
      label: Would you like to provide a review
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: email
      label: Email address for follow up
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: contact_number
      label: Contact number
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: review_message
      label: Review message
      hint: null
      type: text
      options: []
      required: false
