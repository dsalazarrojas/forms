inputSchema:
  type: object
  properties:
    title: Moving Coordination Feedback
    pages:
    - id: 1
      name: moving_coordination_feedback
      label: Moving Company
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: moving_coordination
      label: Moving Coordination
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: communication
      label: Communication
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 5
      name: comment
      label: Comment
      hint: Please enter any additional comments about your move.
      type: note
      options: []
      required: false
