inputSchema:
  type: object
  properties:
    title: Product Scanning Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: scanning_ease_of_use
      label: Scanning Ease Of Use
      hint: How easy is it to scan items?
      type: number
      options: []
      required: false
    - id: 3
      name: information_accuracy
      label: Information Accuracy
      hint: How accurate is the information about items?
      type: select_one
      options:
      - Very accurate
      - Somewhat accurate
      - Not very accurate
      required: false
    - id: 4
      name: item_scanning_frequency
      label: How often do you scan items?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 5
      name: app_scanning_experience
      label: Scanning Experience
      hint: How do you rate the scanning experience?
      type: number
      options: []
      required: false
    - id: 6
      name: customer_support
      label: Customer Support
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: store_hours
      label: Store Hours
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: customer_favourites
      label: Customer Favourites
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: false
    - id: 9
      name: overall_feelings
      label: Overall Feelings
      hint: What are your overall feelings about the product?
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 10
      name: suggestions
      label: Suggest something
      hint: What would you improve in this product or experience?
      type: text
      options: []
      required: false
    - id: 11
      name: customer_service
      label: Customer Service
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
