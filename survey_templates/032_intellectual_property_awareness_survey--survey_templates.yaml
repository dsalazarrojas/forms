inputSchema:
  type: object
  properties:
    title: Intellectual Property Awareness Survey
    pages:
    - id: 1
      name: patent_section
      label: Patents
      hint: null
      type: select_multiple
      options:
      - patents are essential for innovation
      - patents help innovation
      required: false
    - id: 2
      name: copyright_section
      label: Copyrights
      hint: null
      type: select_multiple
      options:
      - copyrights are essential for creative works
      - copyrights protect creative works
      required: false
    - id: 3
      name: trademark_section
      label: Trademarks
      hint: null
      type: select_multiple
      options:
      - trademarks prevent confusion among consumers
      - trademarks are used to gain competitive advantage
      required: false
    - id: 4
      name: trade_secret_section
      label: Trade Secrets
      hint: null
      type: select_multiple
      options:
      - trade secrets are used to gain unfair advantage
      - trade secrets are used to protect competitive advantage
      required: false
    - id: 5
      name: general_questions
      label: General Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: survey_header
      label: Thank you for taking the time to complete this survey
      hint: null
      type: text
      options: []
      required: false
