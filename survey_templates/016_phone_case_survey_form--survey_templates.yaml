inputSchema:
  type: object
  properties:
    title: Phone Case Survey Form
    pages:
    - id: 1
      name: current_case_use
      label: Are you currently using a phone case
      hint: null
      type: select_one
      options:
      - case
      - no case
      - unsure
      required: false
    - id: 2
      name: preferred_design
      label: What is your preferred phone case design
      hint: null
      type: select_multiple
      options:
      - leather
      - rubber
      - plastic
      - metal
      required: false
    - id: 3
      name: price_range
      label: How much are you willing to pay for a phone case
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: case_quality
      label: How important is case quality to you
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: case_functionalities
      label: What case features do you want in a phone case
      hint: null
      type: select_multiple
      options:
      - shockproof
      - waterproof
      - scratch resistant
      - anti bacterial
      required: false
    - id: 6
      name: case_color
      label: What color do you prefer in a phone case
      hint: null
      type: select_one
      options:
      - black
      - white
      - red
      - blue
      - green
      - purple
      required: false
    - id: 7
      name: case_material
      label: What material do you prefer for a phone case
      hint: null
      type: select_one
      options:
      - leather
      - rubber
      - plastic
      - metal
      required: false
    - id: 8
      name: case_size
      label: What size do you prefer in a phone case
      hint: null
      type: select_one
      options:
      - compact
      - standard
      - large
      - extra large
      required: false
    - id: 9
      name: case_protection
      label: How important is case protection to you
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: case_price
      label: What is your budget for a phone case
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: case_satisfaction
      label: How satisfied are you with your current phone case
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: case_warranty
      label: What do you think of case warranty
      hint: null
      type: select_one
      options:
