inputSchema:
  type: object
  properties:
    title: Rubik's Cube Lesson Quiz
    pages:
    - id: 1
      name: learner_name
      label: Learner Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: experience_level
      label: Experience Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 3
      name: solving_method
      label: Solving Method
      hint: null
      type: select_multiple
      options:
      - Rubik's Cube Algorithms
      - Online resources
      - Practice with friends
      required: false
    - id: 4
      name: practice_frequency
      label: Practice Frequency
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: practice_duration
      label: Practice Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: difficulty_level
      label: Difficulty Level
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: improvement_goal
      label: Improvement Goal
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: event_attendance
      label: Event Attendance
      hint: null
      type: select_multiple
      options:
      - Rarely
      - Occasionally
      - Frequently
      required: false
    - id: 10
      name: favorite_variation
      label: Favorite Variation
      hint: null
      type: select_multiple
      options:
      - Rubik's Cube 3x3
      - Rubik's Cube 4x4
      - Rubik's Cube 5x5
      required: false
    - id: 11
      name: tips_recommendations
      label: Tips and Recommendations
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
