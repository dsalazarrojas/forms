inputSchema:
  type: object
  properties:
    title: Bridesmaid Survey
    pages:
    - id: 1
      name: bridesmaid_name
      label: Bridesmaid Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 3
      name: bride_name
      label: Bride Name
      hint: Bride you're supporting
      type: text
      options: []
      required: true
    - id: 4
      name: how_long_know_bride
      label: How Long Have You Known the Bride
      hint: Years of friendship
      type: select_one
      options:
      - Less than 1 year
      - 1-5 years
      - 5-10 years
      - 10-15 years
      - 15+ years
      required: false
    - id: 5
      name: favorite_activities
      label: Favorite Activities
      hint: What do you enjoy
      type: select_multiple
      options:
      - Shopping
      - Dining and restaurants
      - Bars and nightlife
      - Outdoor activities
      - Sports
      - Games and puzzles
      - Arts and crafts
      - Movies
      - Music
      - Spa and wellness
      - Travel
      - Volunteer work
      required: false
    - id: 6
      name: entertainment_style
      label: Entertainment Style Preference
      hint: How do you like to party
      type: select_one
      options:
      - Large group events
      - Intimate gatherings
      - Relaxed and casual
      - Planned and formal
      - Spontaneous and fun
      - Mix of everything
      required: false
    - id: 7
      name: alcohol_preference
      label: Alcohol Preferences
      hint: For event planning
      type: select_multiple
      options:
      - Beer
      - Wine
      - Cocktails
      - Liquor
      - Non-alcoholic drinks
      - No alcohol preference
      required: false
    - id: 8
      name: food_preferences
      label: Food Preferences
      hint: Cuisine and food types
      type: select_multiple
      options:
      - Italian
      - Mexican
      - Asian
      - American
      - Seafood
      - Vegetarian options
      - Steakhouse
      - Fine dining
      - Casual dining
      required: false
    - id: 9
      name: music_taste
      label: Music Taste
      hint: What kind of music do you like
      type: select_multiple
      options:
      - Pop
      - Rock
      - Country
      - Hip-hop
      - Electronic
      - Classical
      - Jazz
      - Indie
      - No strong preference
      required: false
    - id: 10
      name: physical_fitness_interest
      label: Physical Fitness Interest
      hint: Your fitness level
      type: select_one
      options:
      - Very active
      - Somewhat active
      - Moderately active
      - Lightly active
      - Not very active
      required: false
    - id: 11
      name: budget_comfort_level
      label: Budget Comfort Level for Events
      hint: What can you afford
      type: select_one
      options:
      - Under 100 per event
      - 100 - 250
      - 250 - 500
      - 500+
      - Flexible
      required: false
    - id: 12
      name: travel_willingness
      label: Willingness to Travel
      hint: How far would you travel
      type: select_one
      options:
      - Local only
      - State/Province only
      - Regional
      - Anywhere in country
      - International
      - Depends on distance
      required: false
    - id: 13
      name: time_commitment
      label: Time Availability for Events
      hint: How much time can you give
      type: select_one
      options:
      - Very limited
      - Somewhat limited
      - Moderate availability
      - Good availability
      - Lots of time available
      required: false
    - id: 14
      name: leadership_interest
      label: Interest in Leadership Roles
      hint: Would you help plan events
      type: select_one
      options:
      - Yes, definitely
      - Probably
      - Maybe
      - Probably not
      - 'False'
      required: false
    - id: 15
      name: shy_vs_outgoing
      label: Personality Type
      hint: How would you describe yourself
      type: select_one
      options:
      - Very shy
      - Introverted
      - Balanced
      - Extroverted
      - Very outgoing
      required: false
    - id: 16
      name: team_player_rating
      label: Team Player Rating
      hint: How well do you work in groups
      type: select_one
      options:
      - Prefer to work alone
      - Somewhat of a team player
      - Good team player
      - Great team player
      - Natural leader
      required: false
    - id: 17
      name: conflict_resolution
      label: Conflict Resolution Style
      hint: How do you handle disagreements
      type: select_one
      options:
      - Avoid conflict
      - Compromise
      - Communicate openly
      - Let others decide
      - Assert my position
      required: false
    - id: 18
      name: special_skills
      label: Special Skills or Talents
      hint: What are you good at
      type: text
      options: []
      required: false
    - id: 19
      name: role_preference
      label: Preferred Role in Bridal Events
      hint: What would you enjoy most
      type: select_multiple
      options:
      - Planning and organizing
      - Decorating
      - Photography
      - Entertainment
      - Emotional support
      - Other special role
      required: false
    - id: 20
      name: additional_info
      label: Additional Information or Comments
      hint: Anything else we should know
      type: text
      options: []
      required: false
