inputSchema:
  type: object
  properties:
    title: Community Forum Engagement Feedback Questionnaire
    pages:
      - id: 1
        name: username
        label: Username (Optional)
        hint: Your forum username
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: For follow-up
        type: email
        options: []
        required: false
      - id: 3
        name: membership_duration
        label: How Long Have You Been a Member
        hint: Duration of membership
        type: select_one
        options:
          - Less than 1 month
          - 1-6 months
          - 6 months to 1 year
          - 1-3 years
          - More than 3 years
        required: true
      - id: 4
        name: visit_frequency
        label: How Often Do You Visit the Forum
        hint: Visit frequency
        type: select_one
        options:
          - Daily
          - Several Times a Week
          - Weekly
          - Monthly
          - Rarely
        required: true
      - id: 5
        name: participation_level
        label: Participation Level
        hint: How active are you?
        type: select_one
        options:
          - Very Active - Post Regularly
          - Somewhat Active - Post Occasionally
          - Lurker - Read Only
          - New Member - Just Joined
        required: true
      - id: 6
        name: content_quality
        label: Content Quality Rating
        hint: Rate the discussion quality
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 7
        name: community_friendliness
        label: Community Friendliness
        hint: How welcoming is the community?
        type: select_one
        options:
          - Very Welcoming
          - Welcoming
          - Neutral
          - Unwelcoming
          - Very Unwelcoming
        required: true
      - id: 8
        name: ease_of_use
        label: Ease of Use
        hint: How easy is the forum to navigate?
        type: select_one
        options:
          - Very Easy
          - Easy
          - Neutral
          - Difficult
          - Very Difficult
        required: true
      - id: 9
        name: favorite_sections
        label: Favorite Forum Sections
        hint: What areas do you enjoy most?
        type: text
        options: []
        required: false
      - id: 10
        name: least_favorite_sections
        label: Least Favorite Sections
        hint: What needs improvement?
        type: text
        options: []
        required: false
      - id: 11
        name: moderation_quality
        label: Moderation Quality
        hint: Rate the moderation
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 12
        name: feature_satisfaction
        label: Feature Satisfaction
        hint: Rate forum features
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 13
        name: missing_features
        label: Missing Features
        hint: What features would you like to see?
        type: text
        options: []
        required: false
      - id: 14
        name: would_recommend
        label: Would You Recommend This Forum
        hint: Likelihood to recommend
        type: select_one
        options:
          - Very Likely
          - Likely
          - Neutral
          - Unlikely
          - Very Unlikely
        required: true
      - id: 15
        name: engagement_barriers
        label: Barriers to Engagement
        hint: What prevents you from participating more?
        type: select_multiple
        options:
          - Lack of Time
          - Intimidating Community
          - Poor Content Quality
          - Technical Issues
          - Lack of Relevant Topics
          - None
        required: false
      - id: 16
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: Your ideas for better engagement
        type: text
        options: []
        required: false
      - id: 17
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
