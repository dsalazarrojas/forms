inputSchema:
  type: object
  properties:
    title: Child Screen Time Survey
    pages:
    - id: 1
      name: section_screen_habits
      label: -- Screen Habits --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: child_name
      label: Child Name
      hint: Name of the child for this survey
      type: text
      options: []
      required: true
    - id: 3
      name: child_age_bracket
      label: Age of Child
      hint: Select the appropriate age group
      type: select_one
      options:
      - Under 2 years
      - 2 to 5 years
      - 6 to 10 years
      - 11 to 13 years
      - 14 to 17 years
      required: true
    - id: 4
      name: section_daily_usage
      label: -- Daily Usage --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: daily_screen_hours
      label: Average hours of screen time per day
      hint: Enter a whole number
      type: number
      options: []
      required: true
    - id: 6
      name: screen_types
      label: Types of screens used
      hint: Select all that apply
      type: select_multiple
      options:
      - Smartphone
      - Tablet or IPad
      - Television
      - Computer or Laptop
      - Gaming Console
      required: true
    - id: 7
      name: section_supervision
      label: -- Content and Supervision --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: primary_activities
      label: Primary Screen Activities
      hint: What does the child do most?
      type: select_multiple
      options:
      - Educational games and apps
      - Videos or YouTube
      - Social media or Messaging
      - Entertainment Video games
      - School work and Research
      required: true
    - id: 9
      name: parental_controls
      label: Do you use parental controls?
      hint: Filtering or monitoring software
      type: select_one
      options:
      - Yes - Always Active
      - Yes - Sometimes Active
      - No - Not used
      required: true
    - id: 10
      name: time_limit_status
      label: Do you set a specific daily time limit?
      hint: Enforced boundaries
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: section_impact
      label: -- Behavioral Impact --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: screen_behavior_impact
      label: How does screen time affect child behavior?
      hint: General mood and focus
      type: select_one
      options:
      - Positively - Helps learning
      - Neutrally - No major change
      - Negatively - Causes irritability
      required: true
    - id: 13
      name: screen_habits_comments
      label: Additional comments on screen habits
      hint: Share any specific concerns or observations
      type: text
      options: []
      required: false
    - id: 14
      name: today_date
      label: Today Date
      hint: Survey completion date
      type: date
      options: []
      required: true
