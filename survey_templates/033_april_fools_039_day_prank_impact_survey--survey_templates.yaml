inputSchema:
  type: object
  properties:
    title: April Fools Day Prank Impact Survey
    pages:
    - id: 1
      name: respondent_info
      label: Respondent Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Name (optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participated
      label: Did you participate in any pranks
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Was Pranked
      required: true
    - id: 4
      name: prank_impact
      label: Overall Impact of Pranks
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: morale_effect
      label: Effect on Team Morale
      hint: null
      type: select_one
      options:
      - Positive
      - Somewhat Positive
      - Neutral
      - Somewhat Negative
      - Negative
      required: true
    - id: 6
      name: social_effect
      label: Effect on Social Bonding
      hint: null
      type: select_one
      options:
      - Strengthened
      - Somewhat Strengthened
      - No Change
      - Somewhat Weakened
      - Weakened
      required: false
    - id: 7
      name: productivity_effect
      label: Effect on Productivity
      hint: null
      type: select_one
      options:
      - Positive
      - Neutral
      - Negative
      required: false
    - id: 8
      name: stress_effect
      label: Effect on Stress Levels
      hint: null
      type: select_one
      options:
      - Reduced
      - Slightly Reduced
      - No Change
      - Slightly Increased
      - Increased
      required: false
    - id: 9
      name: cultural_perception
      label: Does Prank Culture Fit Our Organization
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Neutral
      - Probably No
      - Definitely No
      required: true
    - id: 10
      name: future_pranks
      label: Should We Continue Prank Tradition
      hint: null
      type: select_one
      options:
      - Enthusiastically Yes
      - 'True'
      - Unsure
      - Prefer Not To
      - 'False'
      required: false
    - id: 11
      name: feedback
      label: Additional Feedback
      hint: null
      type: text
      options: []
      required: false
