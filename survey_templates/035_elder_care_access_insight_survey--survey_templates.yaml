inputSchema:
  type: object
  properties:
    title: Elder Care Access Insight Survey
    pages:
    - id: 1
      name: elder_care_services
      label: What are the elder care services your organization provides?
      hint: null
      type: select_multiple
      options:
      - Home help with daily tasks
      - Adult day care
      - Respite care
      - Adult day health care
      - Assisted living
      - Home help with bathing
      - Home help with eating
      - Home help with walking
      - Hospice care
      required: false
    - id: 2
      name: satisfaction
      label: How satisfied are you with the elder care services your organization
        provides?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: barriers
      label: What barriers do you face when accessing these services?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: regional_access
      label: What region(s) do you access these services in?
      hint: null
      type: select_multiple
      options:
      - Rural
      - Urban
      - Suburban
      - Other
      required: false
    - id: 5
      name: feedback
      label: Any additional feedback about the elder care services your organization
        provides?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: Enter an email if you have feedback or questions
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: Enter a phone number if you have a question or need help
      type: text
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: MM/DD/YY
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: Time
      hint: "HH:MM AM/PM"
      type: time
      options: []
      required: false
    - id: 10
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Adult care
      - Care for children with special needs
      - HIV/AIDS care
      - Maternal and child care
      - Mental health
      required: false
    - id: 11
      name: demographic
      label: Age group
      hint: Select the age group you are most representative of
      type: select_multiple
      options:
      - 65 and older
      - 60-64
      - 55-59
      - 50-54
      - 45-49
      - 40-44
      - 35-39
      - 30-34
      - 25-29
      - 18-24
      required: false
    - id: 12
