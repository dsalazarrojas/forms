      hint: null
      type: select_multiple
      options:
      - Home help with daily tasks
      - Adult day care
      - Respite care
      - Adult day health care
      - Assisted living
      - Hospice care
      required: false
    - id: 14
      name: population
      label: Population
      hint: null
      type: select_multiple
      options:
      - Older adults (65+ years)
      - Children and youth (0-17 years)
      - Adults with disabilities
      - Family caregivers
      - All of the above
      required: false
    - id: 15
