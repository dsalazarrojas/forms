inputSchema:
  type: object
  properties:
    title: Parent Wellbeing Survey
    pages:
    - id: 1
      name: survey_question_1
      label: How often do parents get together
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: survey_question_2
      label: What is the quality of your relationship with other parents
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
