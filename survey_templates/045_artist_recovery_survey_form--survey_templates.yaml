inputSchema:
  type: object
  properties:
    title: Artist Recovery Survey Form
    pages:
      - id: 1
        name: section_header_1
        label: -- Respondent Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Your Name
        hint: Your full name or pseudonym
        type: text
        options: []
        required: true
      - id: 3
        name: respondent_email
        label: Email Address
        hint: Primary contact email
        type: email
        options: []
        required: false
      - id: 4
        name: artistic_discipline
        label: Primary Artistic Discipline
        hint: Your main area of creative work
        type: text
        options: []
        required: true
      - id: 5
        name: survey_date
        label: Date Completing This Survey
        hint: When are you filling this out?
        type: date
        options: []
        required: true
      - id: 6
        name: section_header_2
        label: -- Nature of Challenges --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: primary_problem
        label: What is Your Primary Challenge?
        hint: Main issue or problem area
        type: select_one
        options:
          - Financial Difficulties
          - Health or Wellness Issues
          - Burnout or Exhaustion
          - Loss of Creativity or Inspiration
          - Relationship or Personal Problems
          - Career Uncertainty
          - Mental Health Concerns
          - Access to Resources
          - Other
        required: true
      - id: 8
        name: problem_description
        label: Describe Your Challenge in Detail
        hint: Explain the situation and its impact
        type: text
        options: []
        required: true
      - id: 9
        name: problem_duration
        label: How Long Have You Been Facing This Challenge?
        hint: Duration of the issue
        type: select_one
        options:
          - Less than 1 month
          - 1-3 months
          - 3-6 months
          - 6-12 months
          - 1-2 years
          - 2+ years
        required: true
      - id: 10
        name: section_header_3
        label: -- Impact Assessment --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: creative_impact
        label: Impact on Creative Work
        hint: How has this affected your art?
        type: select_one
        options:
          - Completely stopped creating
          - Significantly reduced output
          - Moderately affected productivity
          - Minimal impact on work
          - No impact on creativity
        required: true
      - id: 12
        name: wellbeing_impact
        label: Impact on Overall Wellbeing
        hint: How is your mental and physical health?
        type: select_one
        options:
          - Severely affected
          - Significantly affected
          - Moderately affected
          - Slightly affected
          - Not affected
        required: true
      - id: 13
        name: financial_impact
        label: Financial Impact
        hint: How has this affected your income?
        type: select_one
        options:
          - Complete loss of income
          - Significant income loss
          - Moderate income reduction
          - Slight income impact
          - No financial impact
        required: false
      - id: 14
        name: section_header_4
        label: -- Contributing Factors --
        hint: null
        type: note
        options: []
        required: false
      - id: 15
        name: contributing_factors
        label: What Factors Contributed to This Challenge?
        hint: Select all that apply
        type: select_multiple
        options:
          - Economic Hardship
          - Lack of Support System
          - Health Crisis
          - Mental Health Struggles
          - Family or Relationship Issues
          - Lack of Opportunities
          - Discrimination or Barriers
          - Loss or Grief
          - Pandemic or External Crisis
        required: true
      - id: 16
        name: personal_factors
        label: Personal or Internal Factors
        hint: What personal challenges contributed?
        type: text
        options: []
        required: false
      - id: 17
        name: section_header_5
        label: -- Recovery and Support --
        hint: null
        type: note
        options: []
        required: false
      - id: 18
        name: support_received
        label: Support or Help Already Received
        hint: What assistance have you accessed?
        type: text
        options: []
        required: false
      - id: 19
        name: needed_support
        label: What Support Would Help Most?
        hint: What do you need to recover?
        type: select_multiple
        options:
          - Financial Assistance
          - Mental Health Support
          - Creative Community
          - Job or Income Opportunity
          - Skills Training
          - Mentorship or Guidance
          - Medical Care
          - Legal Assistance
          - Social Connection
        required: true
      - id: 20
        name: recovery_progress
        label: Are You Currently Recovering?
        hint: How is your recovery progressing?
        type: select_one
        options:
          - Actively recovering and improving
          - Slowly improving
          - Stable but not improving
          - Worsening
          - Just beginning to seek help
        required: true
      - id: 21
        name: section_header_6
        label: -- Resources and Recommendations --
        hint: null
        type: note
        options: []
        required: false
      - id: 22
        name: awareness_of_resources
        label: Are You Aware of Available Resources?
        hint: Do you know what support exists?
        type: select_one
        options:
          - Yes, well informed
          - Somewhat informed
          - Not very informed
          - Not at all informed
        required: false
      - id: 23
        name: barriers_to_support
        label: What Prevents You from Getting Help?
        hint: Obstacles to accessing support
        type: text
        options: []
        required: false
      - id: 24
        name: recommendations
        label: What Recommendations Would You Make?
        hint: For improving artist support systems?
        type: text
        options: []
        required: false
      - id: 25
        name: follow_up_consent
        label: We May Contact You for Follow-up Support
        hint: Permission to provide additional assistance
        type: select_one
        options:
          - Yes, contact me
          - No, do not contact
          - Email only
        required: false
