inputSchema:
  type: object
  properties:
    title: Client Health Consultation Survey
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: For health records
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      - Other
      required: true
    - id: 7
      name: occupation
      label: Occupation
      hint: Current job
      type: text
      options: []
      required: false
    - id: 8
      name: consultation_type
      label: Type of Consultation
      hint: What service do you need?
      type: select_one
      options:
      - General Health
      - Nutrition Counseling
      - Fitness Consultation
      - Wellness Coaching
      - Mental Health
      - Chronic Disease Management
      - Preventive Care
      - Other
      required: true
    - id: 9
      name: primary_health_goal
      label: Primary Health Goal
      hint: What do you want to achieve?
      type: text
      options: []
      required: true
    - id: 10
      name: health_concerns
      label: Current Health Concerns
      hint: What worries you?
      type: text
      options: []
      required: true
    - id: 11
      name: existing_conditions
      label: Existing Medical Conditions
      hint: Diagnosed conditions
      type: text
      options: []
      required: false
    - id: 12
      name: current_medications
      label: Current Medications
      hint: Include supplements
      type: text
      options: []
      required: false
    - id: 13
      name: allergies
      label: Allergies
      hint: Medication, food, environmental
      type: text
      options: []
      required: false
    - id: 14
      name: previous_surgeries
      label: Previous Surgeries or Hospitalizations
      hint: Medical procedures
      type: text
      options: []
      required: false
    - id: 15
      name: family_health_history
      label: Family Health History
      hint: Relevant family conditions
      type: text
      options: []
      required: false
    - id: 16
      name: exercise_frequency
      label: Exercise Frequency
      hint: How often do you exercise?
      type: select_one
      options:
      - Never
      - 1-2 times per week
      - 3-4 times per week
      - 5-6 times per week
      - Daily
      required: true
    - id: 17
      name: exercise_type
      label: Type of Exercise
      hint: What activities do you do?
      type: text
      options: []
      required: false
    - id: 18
      name: dietary_habits
      label: Dietary Habits
      hint: Describe your typical diet
      type: text
      options: []
      required: true
    - id: 19
      name: sleep_quality
      label: Sleep Quality
      hint: How well do you sleep?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 20
      name: sleep_hours
      label: Average Hours of Sleep Per Night
      hint: Typical sleep duration
      type: number
      options: []
      required: false
    - id: 21
      name: stress_level
      label: Current Stress Level
      hint: On a scale of 1-10
      type: select_one
      options:
      - Low (1-3)
      - Moderate (4-6)
      - High (7-8)
      - Very High (9-10)
      required: true
    - id: 22
      name: stress_sources
      label: Sources of Stress
      hint: What causes you stress?
      type: text
      options: []
      required: false
    - id: 23
      name: smoking_status
      label: Smoking Status
      hint: Tobacco use
      type: select_one
      options:
      - Never Smoked
      - Former Smoker
      - Current Smoker
      required: true
    - id: 24
      name: alcohol_consumption
      label: Alcohol Consumption
      hint: How often?
      type: select_one
      options:
      - Never
      - Rarely
      - Occasionally
      - Regularly
      - Daily
      required: true
    - id: 25
      name: caffeine_consumption
      label: Caffeine Consumption
      hint: Coffee, tea, energy drinks
      type: select_one
      options:
      - None
      - 1-2 cups per day
      - 3-4 cups per day
      - 5+ cups per day
      required: false
    - id: 26
      name: water_intake
      label: Daily Water Intake
      hint: Glasses per day
      type: select_one
      options:
      - 0-2 glasses
      - 3-5 glasses
      - 6-8 glasses
      - 9+ glasses
      required: false
    - id: 27
      name: health_provider_name
      label: Primary Care Physician Name
      hint: If you have one
      type: text
      options: []
      required: false
    - id: 28
      name: health_provider_phone
      label: Primary Care Physician Phone
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 29
      name: previous_consultations
      label: Have You Had Health Consultations Before?
      hint: Previous experience
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 30
      name: consultation_expectations
      label: What Do You Expect from This Consultation?
      hint: Your expectations
      type: text
      options: []
      required: true
    - id: 31
      name: consent_to_consultation
      label: I Consent to Health Consultation Services
      hint: Service authorization
      type: select_one
      options:
      - I Consent
      - I Do Not Consent
      required: true
    - id: 32
      name: information_accuracy
      label: I Confirm All Information Is Accurate
      hint: Truthfulness confirmation
      type: select_one
      options:
      - I Confirm
      - I Do Not Confirm
      required: true
    - id: 33
      name: survey_date
      label: Survey Date
      hint: null
      type: date
      options: []
      required: true
