inputSchema:
  type: object
  properties:
    title: Advocacy SWOT Analysis Survey
    pages:
    - id: 1
      name: organization_info
      label: -- Organization Context --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: advocacy_focus
      label: Primary Advocacy Focus
      hint: e.g., Environment, Human Rights, Education.
      type: text
      options: []
      required: true
    - id: 4
      name: strengths_header
      label: -- Strengths (Internal) --
      hint: What do we do well?
      type: note
      options: []
      required: false
    - id: 5
      name: key_strengths
      label: List Key Strengths
      hint: Resources, capabilities, reputation, etc.
      type: text
      options: []
      required: true
    - id: 6
      name: strength_impact
      label: Impact of Strengths
      hint: How do these help our mission?
      type: select_one
      options:
      - High Impact
      - Moderate Impact
      - Low Impact
      required: false
    - id: 7
      name: weaknesses_header
      label: -- Weaknesses (Internal) --
      hint: Where do we need to improve?
      type: note
      options: []
      required: false
    - id: 8
      name: key_weaknesses
      label: List Key Weaknesses
      hint: Gaps in resources, skills, reach, etc.
      type: text
      options: []
      required: true
    - id: 9
      name: weakness_severity
      label: Severity of Weaknesses
      hint: How much do these hinder us?
