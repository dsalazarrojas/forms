    - id: 10
      name: opportunities_header
      label: -- Opportunities (External) --
      hint: What external factors can we leverage?
      type: note
      options: []
      required: false
    - id: 11
      name: key_opportunities
      label: List Key Opportunities
      hint: Policy changes, funding trends, partnerships.
      type: text
      options: []
      required: true
    - id: 12
      name: threats_header
      label: -- Threats (External) --
      hint: What external factors pose a risk?
      type: note
      options: []
      required: false
    - id: 13
      name: key_threats
      label: List Key Threats
      hint: Opposition, funding cuts, regulatory changes.
      type: text
      options: []
      required: true
    - id: 14
      name: strategic_priorities
      label: Top Strategic Priority
      hint: Based on this analysis, what should be #1?
      type: text
      options: []
      required: true
