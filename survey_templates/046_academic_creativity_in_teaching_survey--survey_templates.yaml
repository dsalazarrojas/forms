inputSchema:
  type: object
  properties:
    title: Academic Creativity In Teaching Survey
    pages:
    - id: 1
      name: survey_header
      label: -- Academic Creativity in Teaching Survey --
      hint: Share your experiences and perspectives on creative teaching practices
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Full name (optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: institution_name
      label: Name of your institution
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: teaching_role
      label: Your current teaching role
      hint: null
      type: select_one
      options:
        - K-12 Teacher
        - Adjunct Instructor
        - Lecturer
        - Assistant Professor
        - Associate Professor
        - Full Professor
        - Teaching Assistant
      required: true
    - id: 6
      name: subject_area
      label: Primary subject area
      hint: null
      type: select_one
      options:
        - STEM (Science, Technology, Engineering, Math)
        - Humanities
        - Social Sciences
        - Arts and Design
        - Business and Economics
        - Health Sciences
        - Education
        - Other
      required: true
    - id: 7
      name: years_teaching
      label: Years of teaching experience
      hint: null
      type: select_one
      options:
        - Less than 1 year
        - 1-3 years
        - 4-7 years
        - 8-15 years
        - More than 15 years
      required: true
    - id: 8
      name: creativity_section
      label: -- Creative Teaching Practices --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: creative_methods_used
      label: Which creative teaching methods do you currently use
      hint: Select all that apply
      type: select_multiple
      options:
        - Project-based learning
        - Flipped classroom
        - Gamification
        - Collaborative problem solving
        - Experiential or hands-on activities
        - Multimedia and digital storytelling
        - Role-playing or simulations
      required: true
    - id: 10
      name: frequency_of_creative_methods
      label: How often do you incorporate creative methods into your lessons
      hint: null
      type: select_one
      options:
        - Every class session
        - A few times per week
        - Weekly
        - A few times per month
        - Rarely
      required: true
    - id: 11
      name: student_engagement_impact
      label: How much do creative methods improve student engagement in your experience
      hint: null
      type: select_one
      options:
        - Significantly improves engagement
        - Moderately improves engagement
        - Slightly improves engagement
        - No noticeable difference
        - It can sometimes decrease engagement
      required: true
    - id: 12
      name: barriers_to_creativity
      label: What barriers prevent you from using more creative teaching approaches
      hint: Select all that apply
      type: select_multiple
      options:
        - Lack of time for preparation
        - Large class sizes
        - Limited institutional support
        - Rigid curriculum requirements
        - Insufficient training or resources
        - Student resistance to new methods
        - Assessment constraints
      required: true
    - id: 13
      name: institutional_support_rating
      label: How well does your institution support creative teaching
      hint: Rate from 1 (no support) to 5 (excellent support)
      type: select_one
      options:
        - 1 - No support
        - 2 - Minimal support
        - 3 - Moderate support
        - 4 - Good support
        - 5 - Excellent support
      required: true
    - id: 14
      name: professional_development
      label: Have you received professional development focused on creative instruction
      hint: null
      type: select_one
      options:
        - Yes, extensively
        - Yes, some training
        - No, but I am interested
        - No, and I am not interested
      required: true
    - id: 15
      name: resources_needed
      label: What resources or support would most help you teach more creatively
      hint: Describe briefly
      type: text
      options: []
      required: false
    - id: 16
      name: success_story
      label: Share an example of a creative teaching approach that worked well for you
      hint: Optional - describe what you did and the outcome
      type: text
      options: []
      required: false
    - id: 17
      name: additional_comments
      label: Any additional comments or suggestions
      hint: null
      type: text
      options: []
      required: false
