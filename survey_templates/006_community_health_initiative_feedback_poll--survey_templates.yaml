inputSchema:
  type: object
  properties:
    title: Community Health Initiative Feedback Poll
    pages:
    - id: 1
      name: program_name
      label: Program or Initiative Name
      hint: Name of the health program you attended
      type: text
      options: []
      required: true
    - id: 2
      name: participation_date
      label: Date of Participation
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: satisfaction_level
      label: Overall Satisfaction Level
      hint: How satisfied were you with this initiative?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 4
      name: expectations_met
      label: Did the program meet your expectations?
      hint: null
      type: select_one
      options:
      - Yes, completely
      - Partially
      - No, not at all
      required: true
    - id: 5
      name: helpful_aspect
      label: Most helpful aspect of the program
      hint: Describe what you liked most
      type: text
      options: []
      required: false
    - id: 6
      name: improvement_areas
      label: Areas for improvement
      hint: What could we do better?
      type: text
      options: []
      required: false
    - id: 7
      name: recommendation_likelihood
      label: How likely are you to recommend this program?
      hint: 1 - Not Likely, 5 - Very Likely
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 8
      name: future_topics
      label: Suggestions for future health topics
      hint: What else would you like to learn about?
      type: text
      options: []
      required: false
    - id: 9
      name: follow_up_interest
      label: Would you like to be contacted for future programs?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: contact_info
      label: Contact Email or Phone
      hint: Only if you selected Yes above
      type: text
      options: []
      required: false
