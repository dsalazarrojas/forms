      name: mold_symptoms_frequency
      label: How often do you experience mold symptoms?
      hint: null
      type: select_one
      options:
      - Daily
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 7
      name: exposure_location
      label: Location of exposure
      hint: Where have you been exposed to mold?
      type: text
      options: []
      required: false
    - id: 8
      name: symptoms_duration
      label: Duration of symptoms
      hint: How long have you experienced mold symptoms?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
