inputSchema:
  type: object
  properties:
    title: Mold Symptom Assessment Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: building_information
      label: Building Information
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: mold_symptoms
      label: Mold Symptoms
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: symptom_description
      label: Symptoms Description
      hint: Please describe your mold symptoms in detail.
      type: text
      options: []
      required: false
    - id: 5
      name: exposure_history
      label: Exposure History
      hint: Please describe your mold exposure history in detail.
      type: text
      options: []
      required: false
