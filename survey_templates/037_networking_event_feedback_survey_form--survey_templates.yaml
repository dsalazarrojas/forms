inputSchema:
  type: object
  properties:
    title: Networking Event Feedback Survey Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Attendee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: feedback
      label: Event Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: Rate Event
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: comment
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: attended
      label: Attended
      hint: null
      type: select_multiple
      options:
      - Did not attend
      - Partially attended
      - Attended
      required: false
