inputSchema:
  type: object
  properties:
    title: Preference Verification Form
    pages:
    - id: 1
      name: team_id
      label: Team
      hint: Please select a team
      type: select_one
      options:
      - Team A
      - Team B
      - Team C
      required: false
    - id: 2
      name: member_name
      label: Member Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_preferences
      label: Contact Preferences
      hint: Choose your contact preferences
      type: select_multiple
      options:
      - Email
      - Phone
      - Text
      required: false
    - id: 4
      name: update_type
      label: Update Type
      hint: Select the type of update
      type: select_one
      options:
      - Membership
      - Service
      - Other
      required: false
    - id: 5
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
