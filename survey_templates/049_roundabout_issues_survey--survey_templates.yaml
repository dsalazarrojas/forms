inputSchema:
  type: object
  properties:
    title: Roundabout Issues Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: roundabout_type
      label: roundabout_type
      hint: null
      type: select_one
      options:
      - roundabout
      - traffic circle
      - turn lane
      required: false
    - id: 3
      name: safety_concerns
      label: Do you have any safety concerns about the roundabout?
      hint: null
      type: select_multiple
      options:
      - too fast
      - too slow
      - not enough signage
      - too narrow
      - not enough space
      - other
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
