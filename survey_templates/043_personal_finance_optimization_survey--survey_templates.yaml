inputSchema:
  type: object
  properties:
    title: Personal Finance Optimization Survey
    pages:
    - id: 1
      name: survey_title
      label: Survey Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: money_goal
      label: Money Goal
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: income_range
      label: Income Range
      hint: null
      type: select_one
      options:
      - '{''label'': ''Less than $25,000''}'
      - '{''label'': ''$25,000 - $50,000''}'
      - '{''label'': ''$50,000 - $75,000''}'
      - '{''label'': ''$75,000 - $100,000''}'
      - '{''label'': ''More than $100,000''}'
      required: true
