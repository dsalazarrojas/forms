inputSchema:
  type: object
  properties:
    title: Personal Finance Optimization Survey
    pages:
    - id: 1
      name: survey_title
      label: Survey Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: money_goal
      label: Money Goal
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: income_range
      label: Income Range
      hint: null
      type: select_one
      options:
      - Less than $25,000
      - $25,000 - $50,000
      - $50,000 - $75,000
      - $75,000 - $100,000
      - More than $100,000
      required: true
    - id: 6
      name: savings_rate
      label: Savings Rate
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: financial_institution
      label: Financial Institution
      hint: null
      type: select_multiple
      options:
      - Bank
      - Credit Union
      - Other
      required: true
    - id: 8
      name: money_source
      label: Money Source
      hint: null
      type: select_one
      options:
      - Savings
      - Investments
      - Other
      required: true
    - id: 9
      name: money_use
      label: Money Use
      hint: null
      type: select_one
      options:
      - Housing
      - Transportation
      - Food
      - Other
      required: true
    - id: 10
      name: financial_goal
      label: Financial Goal
      hint: null
      type: select_one
      options:
      - Short term (less than 6 months)
      - Medium term (6-12 months)
      - Long term (more than 12 months)
      required: true
    - id: 11
      name: money_awareness
      label: Money Awareness
      hint: null
      type: select_one
      options:
      - Very low
      - Low
      - Medium
      - High
      required: true
    - id: 12
      name: follow_up
      label: Follow-Up
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: follow_up_date
      label: Follow-Up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: coach_id
      label: Coach Id
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: advisor_id
      label: Advisor Id
      hint: null
      type: number
      options: []
      required: false
