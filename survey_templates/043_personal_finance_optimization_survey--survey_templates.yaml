      type: select_multiple
      options:
      - '{''label'': ''Bank''}'
      - '{''label'': ''Credit Union''}'
      - '{''label'': ''Other''}'
      required: true
    - id: 8
      name: money_source
      label: Money Source
      hint: null
      type: select_one
      options:
      - '{''label'': ''Savings''}'
      - '{''label'': ''Investments''}'
      - '{''label'': ''Other''}'
      required: true
    - id: 9
      name: money_use
