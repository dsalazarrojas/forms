inputSchema:
  type: object
  properties:
    title: Ethical Marketing Practices In Nonprofits Survey
    pages:
    - id: 1
      name: main_page
      label: Nonprofit Overview
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: marketing_practices
      label: What do you do to develop and implement an effective marketing program?
      hint: null
      type: select_multiple
      options:
      - 'a: Always'
      - 'b: Sometimes'
      - 'c: Never'
      required: false
    - id: 3
      name: ethics_in_marketing
      label: Are you currently using or aware of the following?
      hint: Select all that apply
      type: select_one
      options:
      - 'a: Yes'
      - 'b: No, not aware'
      - 'c: No, not used'
      required: false
    - id: 4
      name: awareness_challenges
      label: Which of the following do you think are the biggest challenges for nonprofits
        to develop and implement an effective marketing program?
      hint: Select all that apply
      type: select_multiple
      options:
      - 'a: Cost'
      - 'b: Time constraints'
      - 'c: Lack of skills'
      - 'd: Lack of resources'
      - 'e: Not sure'
      required: false
    - id: 5
      name: attitudes_toward_marketing
      label: What is your attitude toward the role of marketing in nonprofit organizations?
      hint: Select one option
      type: select_one
      options:
      - 'a: Very positive'
      - 'b: Somewhat positive'
      - 'c: Neutral'
      - 'd: Somewhat negative'
      - 'e: Very negative'
      required: false
    - id: 6
      name: awareness_training
      label: Have you attended training sessions or workshops on ethical marketing
        practices?
      hint: Select one option
      type: select_one
      options:
