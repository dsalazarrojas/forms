      label: Does your organization have a formal policy on marketing?
      hint: Select one option
      type: select_one
      options:
      - 'a: Yes'
      - 'b: No, not sure'
      - 'c: No, but we are developing one'
      required: false
    - id: 8
      name: strategy_guidance
      label: Have you or someone from your organization developed a nonprofit marketing
        strategy?
      hint: Select one option
      type: select_one
      options:
