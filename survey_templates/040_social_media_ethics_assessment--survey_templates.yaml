      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''I only post it with close friends''}'
      - '{''id'': 2, ''label'': ''I only post it with trusted people''}'
      - '{''id'': 3, ''label'': ''I post it publicly''}'
      - '{''id'': 4, ''label'': ''None of the above''}'
      required: false
    - id: 20
      name: question_20
      label: How do you handle conflicts or disagreements online, especially when
