      - Active - regular participation
      - Moderate - occasional participation
      - Minimal - rare participation
      - Lurker - observe only
      required: false
    - id: 19
      name: community_preferences
      label: Preferred community platforms
      hint: Where you interact with fans
      type: select_multiple
      options:
      - Discord servers
      - Reddit
      - Twitter
      - Tumblr
      - Anime forums
      - Facebook groups
      - Instagram
      - In-person clubs
      required: false
    - id: 20
      name: fan_content_interest
      label: What fan content interests you most
      hint: Select your preferences
      type: select_multiple
      options:
      - Fan art
      - Fan fiction
      - Memes
      - Analysis videos
      - Cosplay
      - Fan theories
      - Interviews with creators
      - Behind-the-scenes content
