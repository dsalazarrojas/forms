    - id: 22
      name: suggestions
      label: Suggestions for future anime character design
      hint: What would you like to see
      type: text
      options: []
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other thoughts or feedback
      type: text
      options: []
      required: false
