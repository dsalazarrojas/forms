inputSchema:
  type: object
  properties:
    title: Anime Character Interaction Survey
    pages:
    - id: 1
      name: respondent_header
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: your_name
      label: Your Name
      hint: What should we call you
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: For survey follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: age_group
      label: Age Group
      hint: Select your age range
      type: select_one
      options:
      - Under 13
      - 13-18
      - 19-25
      - 26-35
      - 36-50
      - 50+
      required: false
    - id: 5
      name: viewing_habits_header
      label: -- Viewing Habits --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: anime_experience
      label: How much anime do you watch
      hint: Your viewing frequency
      type: select_one
      options:
      - Watch casually
      - Watch regularly
      - Watch frequently
      - Watch daily
      - Hardcore anime fan
      required: true
    - id: 7
      name: preferred_genres
      label: Favorite Anime Genres
      hint: Select all that apply
      type: select_multiple
      options:
      - Action
      - Romance
      - Comedy
      - Drama
      - Fantasy
      - Science Fiction
      - Slice of Life
      - Horror
      - Thriller
      - Psychological
      required: true
    - id: 8
      name: viewing_platform
      label: Where do you watch anime
      hint: Your preferred platforms
      type: select_multiple
      options:
      - Netflix
      - Crunchyroll
      - Hulu
      - Amazon Prime
      - Funimation
      - TV Broadcast
      - DVD or Blu-ray
      - Illegal Streaming
      - Other
      required: false
    - id: 9
      name: character_preference_header
      label: -- Character Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: favorite_character_archetype
      label: Favorite Character Archetype
      hint: What type of character appeals to you
      type: select_one
      options:
      - Protagonist Hero
      - Anti-hero
      - Tsundere
      - Kuudere
      - Dandere
      - Yandere
      - Comic Relief
      - Supporting Character
      required: false
    - id: 11
      name: character_traits
      label: Most Important Character Traits
      hint: What makes a character compelling to you
      type: select_multiple
      options:
      - Depth and development
      - Good looks
      - Relatability
      - Unique personality
      - Strength and ability
      - Vulnerability and flaws
      - Humor
      - Morality and ethics
      required: false
    - id: 12
      name: interaction_experiences
      label: How do you interact with characters
      hint: Select your behaviors
      type: select_multiple
      options:
