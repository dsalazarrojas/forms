      - Create fan art
      - Discuss online
      - Cosplay
      - Collect merchandise
      - Join fan communities
      - Create social media content
      - Attend conventions
      required: false
    - id: 13
      name: character_attachment_header
      label: -- Character Attachment --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: emotional_connection
      label: How emotionally connected do you get to characters
      hint: Rate your emotional investment
      type: select_one
      options:
      - Very attached - deeply invested
      - Moderately attached
      - Somewhat attached
      - Minimally attached
      - Not at all attached
      required: false
    - id: 15
      name: character_favorites
      label: Tell us about your favorite anime character
      hint: Name and description
      type: text
      options: []
      required: false
    - id: 16
      name: why_favorite
      label: Why is this your favorite character
      hint: Describe what appeals to you
      type: text
      options: []
      required: false
