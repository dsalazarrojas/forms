inputSchema:
  type: object
  properties:
    title: 24 Hour Experience Feedback
    pages:
    - id: 1
      name: section_header_participant_info
      label: '--- Participant Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: We may contact you for follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Optional — include country code
      type: phone
      options: []
      required: false
    - id: 5
      name: attendance_type
      label: Attendance type
      hint: null
      type: select_one
      options:
      - In-person
      - Virtual
      - Hybrid
      required: true
    - id: 6
      name: event_date
      label: Event date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: session_start_time
      label: Typical session start time you attended
      hint: Optional — local time
      type: time
      options: []
      required: false
    - id: 8
      name: section_header_experience
      label: '--- Experience Feedback ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: satisfaction
      label: How satisfied were you with the 24-hour experience?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 10
      name: overall_rating
      label: Overall rating (1-10)
      hint: 1 = worst, 10 = best
      type: integer
      options: []
      required: true
    - id: 11
      name: organization_rating
      label: How well was the event organized?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below average
      - Poor
      required: true
    - id: 12
      name: best_sessions
      label: Which sessions did you find most valuable?
      hint: List session titles, speakers, or topics
      type: text
      options: []
      required: false
    - id: 13
      name: topics_of_interest
      label: Topics you want covered in future events (select all)
      hint: Select all that apply
      type: select_multiple
      options:
      - Leadership
      - Technology
      - Marketing
      - Finance
      - Wellness
      - Networking
      - Other
      required: false
    - id: 14
      name: would_attend_again
      label: Would you attend this event again?
      hint: null
      type: select_one
      options:
      - Definitely
      - Probably
      - Not sure
      - Probably not
      - false
      required: true
    - id: 15
      name: perceived_value
      label: Perceived value for cost (enter approximate amount)
      hint: Optional — numeric value in your local currency
      type: decimal
      options: []
      required: false
    - id: 16
      name: facilities_rating
      label: Facilities and logistics rating (1-5)
      hint: 1 = poor, 5 = excellent
      type: integer
      options: []
      required: false
    - id: 17
      name: accessibility_issues
      label: Accessibility issues experienced (select all)
      hint: Leave blank if none
      type: select_multiple
      options:
      - Parking
      - Venue signage
      - Wheelchair access
      - Hearing support
      - Visual aids
      - None
      required: false
    - id: 18
      name: networking_experience
      label: How would you rate networking opportunities?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Limited
      - None
      required: false
    - id: 19
      name: additional_comments
      label: Additional comments or suggestions
      hint: Share specific suggestions, issues, or highlights
      type: text
      options: []
      required: false
    - id: 20
      name: follow_up_consent
      label: Consent to be contacted for follow-up
      hint: We will only use contact info for follow-up about this feedback
      type: select_one
      options:
      - Yes — contact me
      - No — do not contact
      - Maybe later
      required: true
