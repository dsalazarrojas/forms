inputSchema:
  type: object
  properties:
    title: Public Service Evaluation Survey
    pages:
    - id: 1
      name: survey_header
      label: survey_header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: rating_score
      label: rating_score
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: service_quality
      label: service_quality
      hint: null
      type: select_one
      options:
      - '{''label'': ''Excellent''}'
      - '{''label'': ''Good''}'
      - '{''label'': ''Poor''}'
      - '{''label'': ''Very Poor''}'
      required: false
    - id: 6
      name: service_satisfaction
      label: service_satisfaction
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Highly Satisified''}'
      - '{''label'': ''Satisified''}'
      - '{''label'': ''Neutral''}'
      - '{''label'': ''Dissatisfied''}'
      - '{''label'': ''Very Dissatisfied''}'
      required: false
    - id: 7
      name: improvement_areas
      label: improvement_areas
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Communication''}'
      - '{''label'': ''Responsiveness''}'
      - '{''label'': ''Timeliness''}'
      - '{''label'': ''Other''}'
      required: false
    - id: 8
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: true
