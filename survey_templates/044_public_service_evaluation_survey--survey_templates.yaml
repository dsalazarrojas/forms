inputSchema:
  type: object
  properties:
    title: Public Service Evaluation Survey
    pages:
    - id: 1
      name: survey_header
      label: survey_header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: rating_score
      label: rating_score
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: service_quality
      label: service_quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Poor
      - Very Poor
      required: false
    - id: 6
      name: service_satisfaction
      label: service_satisfaction
      hint: null
      type: select_multiple
      options:
      - Highly Satisified
      - Satisified
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 7
      name: improvement_areas
      label: improvement_areas
      hint: null
      type: select_multiple
      options:
      - Communication
      - Responsiveness
      - Timeliness
      - Other
      required: false
    - id: 8
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: true
