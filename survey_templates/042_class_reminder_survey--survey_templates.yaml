inputSchema:
  type: object
  properties:
    title: Class Reminder Survey
    pages:
    - id: 1
      name: respondent_header
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: student_id
      label: Student ID
      hint: Optional
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: class_info_header
      label: -- Class Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: class_name
      label: Class Name or Section
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: semester_term
      label: Semester or Term
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: reminder_header
      label: -- Class Reminder Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: reminder_usefulness
      label: How useful are class reminders - scale 1-5
      hint: 1 = not useful, 5 = very useful
      type: number
      options: []
      required: true
    - id: 11
      name: reminder_frequency
      label: Preferred Reminder Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Every few days
      - Weekly
      - Before class
      - As needed only
      - Less frequently
      - No reminders
      required: true
    - id: 12
      name: reminder_timing
      label: Best Time to Receive Reminders
      hint: null
      type: select_one
      options:
      - Week before class
      - Few days before class
      - Day before class
      - Morning of class
      - 1 hour before class
      - Other
      required: true
    - id: 13
      name: reminder_method
      label: Preferred Method for Reminders
      hint: Select all that apply
      type: select_multiple
      options:
      - Email
      - Text message
      - Phone call
      - Mobile app notification
      - Canvas or LMS notification
      - Posted schedule
      - Other
      required: true
    - id: 14
      name: content_header
      label: -- Reminder Content and Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: reminder_content_usefulness
      label: What information in reminders is most useful
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: missing_information
      label: What information is missing from reminders
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: attendance_impact
      label: Do reminders help you attend class more regularly
      hint: null
      type: select_one
      options:
      - Yes, very helpful
      - Yes, somewhat helpful
      - No impact
      - No, reminders discourage me
      required: false
    - id: 18
      name: schedule_header
      label: -- Class Schedule Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: meeting_days
      label: Class Meeting Days
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: meeting_time
      label: Class Meeting Time
      hint: null
      type: time
      options: []
      required: true
    - id: 21
      name: location
      label: Class Location or Room Number
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: feedback_header
      label: -- Additional Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: suggestions
      label: Suggestions for improving class communication
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: additional_needs
      label: Any additional communication needs
      hint: null
      type: text
      options: []
      required: false
