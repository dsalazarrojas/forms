inputSchema:
  type: object
  properties:
    title: Third Party Risk Assessment Survey
    pages:
    - id: 1
      name: first_page
      label: Survey Overview
      hint: Please answer the questions below to assess the risk of your third-party
        vendors.
      type: text
      options: []
      required: false
    - id: 2
      name: risk_assessment_ratings
      label: Vendor Risk Assessment Ratings
      hint: Rate the risk level for the following questions.
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 3
      name: vendor_answers
      label: Vendor Information
      hint: Please provide the vendor's answers to the following questions.
      type: text
      options: []
      required: false
    - id: 4
      name: risk_factors
      label: Risk Factors
      hint: Please answer the following questions about the risk factors.
      type: text
      options: []
      required: false
    - id: 5
      name: question_1
      label: Has the vendor been vetted and cleared by your company's security team?
      hint: Select 'Yes' or 'No'.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: question_2
      label: Is the vendor's IT infrastructure in accordance with our security and
        compliance policies?
      hint: Select 'Yes' or 'No'.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: question_3
      label: Does the vendor meet our IT security requirements?
      hint: Select 'Yes' or 'No'.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: question_4
      label: Does the vendor meet our IT compliance requirements?
      hint: Select 'Yes' or 'No'.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: vendor_management_structure
      label: What is the vendor's management structure?
      hint: Select from the options below.
      type: select_one
      options:
      - Centralized
      - Decentralized
      required: true
    - id: 10
      name: question_5
      label: What is the risk level for the vendor's IT infrastructure?
      hint: Select from the options below.
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 11
      name: question_6
      label: What is the risk level for the vendor's data handling?
      hint: Select from the options below.
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 12
      name: question_7
      label: What is the risk level for the vendor's security practices?
      hint: Select from the options below.
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 13
      name: vendor_info
      label: Vendor Info
      hint: Please provide additional information about the vendor.
      type: text
      options: []
      required: true
    - id: 14
      name: notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: vendor_rating
      label: Overall Vendor Rating
      hint: Rate the vendor overall.
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 16
      name: rating_rationale
      label: Rating Rationale
      hint: Please provide a brief explanation for the overall rating.
      type: text
      options: []
      required: false
    - id: 17
      name: vendor_comments
      label: Vendor Comments
      hint: null
      type: text
      options: []
      required: false
