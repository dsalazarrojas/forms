inputSchema:
  type: object
  properties:
    title: study guide preparation survey
    pages:
    - id: 1
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: learning_styles
      label: preferred_learning_styles
      hint: null
      type: select_multiple
      options:
      - Lecture
      - Textbook
      - Video
      - Other
      required: false
    - id: 3
      name: study_format
      label: preferred_study_format
      hint: null
      type: select_one
      options:
      - Textbook
      - Video
      - Online
      - Other
      required: false
    - id: 4
      name: study_challenges
      label: study_challenges
      hint: null
      type: text
      options: []
      required: false
