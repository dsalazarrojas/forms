inputSchema:
  type: object
  properties:
    title: Veneer Comfort And Speech Survey
    pages:
    - id: 1
      name: patient_name
      label: patient_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_satisfaction
      label: overall_satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 3
      name: comfort
      label: comfort_level
      hint: null
      type: select_multiple
      options:
      - Very comfortable
      - Somewhat uncomfortable
      - Not at all comfortable
      required: false
    - id: 4
      name: sensitivity
      label: tooth_sensitivity
      hint: null
      type: select_multiple
      options:
      - None
      - Mild
      - Moderate
      - Severe
      required: false
    - id: 5
      name: speech_changes
      label: speech_changes
      hint: null
      type: select_multiple
      options:
      - None
      - Slightly changed
      - Somewhat changed
      - Significantly changed
      required: false
    - id: 6
      name: overall_satisfaction
      label: overall_satisfaction
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_person
      label: contact_person
      hint: null
      type: text
      options: []
      required: false
