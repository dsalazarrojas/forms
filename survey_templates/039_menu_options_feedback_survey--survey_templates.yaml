inputSchema:
  type: object
  properties:
    title: menu_options_feedback_survey
    pages:
    - id: 1
      name: menu_item
      label: What is your top choice from the menu
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: menu_item_rating
      label: Rate your top choice
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: rating_scale
      label: On a scale of 1-5
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: rating_scale_label
      label: rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 5
      name: menu_items
      label: Which menu items would you like to see more of
      hint: null
      type: select_multiple
      options:
      - Burger
      - Sandwich
      - Salad
      - Soup
      - Other
      required: false
    - id: 6
      name: menu_items_other
      label: Specify other menu items
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: menu_item_frequency
      label: How often do you order
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Rarely
      required: false
    - id: 8
      name: menu_item_frequency_other
      label: Specify frequency
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: menu_item_price
      label: Price range
      hint: null
      type: select_multiple
      options:
      - $
      - $$
      - $$$
      required: false
