inputSchema:
  type: object
  properties:
    title: electric_vehicle_owners_survey
    pages:
    - id: 1
      name: vehicle_type
      label: What type of vehicle do you own?
      hint: null
      type: select_one
      options:
      - car
      - truck
      - bike
      - other
      required: false
    - id: 2
      name: vehicle_year
      label: What is the year of your vehicle?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: has_large_battery
      label: Does your vehicle have a battery size of 40kWh or larger?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: charging_frequency
      label: How often do you charge your vehicle?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - daily
      - weekly
      - monthly
      required: false
    - id: 5
      name: driving_range
      label: What is your driving range?
      hint: null
      type: select_one
      options:
      - 100-200mi
      - 200-300mi
      - 300+mi
      required: false
    - id: 6
      name: vehicle_weight
      label: How much does your vehicle weight?
      hint: null
      type: select_one
      options:
      - 0-1t
      - 1-2t
      - 2+ t
      required: false
    - id: 7
      name: driving_frequency
      label: How often do you drive in a week?
      hint: null
      type: select_multiple
      options:
      - 0-1 day
      - 1-2 days
      - 2-3 days
      - 4-5 days
      - 6 days
      required: false
    - id: 8
      name: driving_fuel_type
      label: What type of fuel do you use for your driving habits?
      hint: null
      type: select_one
      options:
      - Electric
      - Gasoline
      - Diesel
      - Hybrid
      required: false
    - id: 9
      name: driving_miles_per_week
      label: How many miles do you drive per week?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: driving_miles_per_month
      label: How many miles do you drive per month?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: driving_miles_per_year
      label: How many miles do you drive per year?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: driving_frequency_2
      label: How often do you drive?
      hint: null
      type: select_one
      options:
      - 1-2 times/week
      - 2-4 times/week
      - 5+ times/week
      required: false
