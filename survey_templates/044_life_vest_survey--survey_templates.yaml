inputSchema:
  type: object
  properties:
    title: Life Vest Survey
    pages:
    - id: 1
      name: customer_survey
      label: customer_survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: life_vests_owned
      label: life_vests_owned
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: years_of_use
      label: years_of_use
      hint: null
      type: select_one
      options:
      - years_0_5
      - years_5_10
      - years_10_20
      - years_20_plus
      required: false
    - id: 4
      name: frequency_of_use
      label: frequency_of_use
      hint: null
      type: select_multiple
      options:
      - daily
      - weekly
      - monthly
      - never
      required: false
