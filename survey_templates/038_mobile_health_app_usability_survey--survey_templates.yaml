      options: []
      required: false
    - id: 2
      name: satisfaction_rating
      label: How satisfied are you with this app?
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very Satisfied''}'
      - '{''label'': ''Somewhat Satisfied''}'
      - '{''label'': ''Not Satisfied''}'
      - '{''label'': ''Not at All Satisfied''}'
      required: false
    - id: 3
      name: issues_section
      label: Issues
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: feature_requests_section
      label: What features would you like to see added?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
