inputSchema:
  type: object
  properties:
    title: Online Learning Survey
    pages:
    - id: 1
      name: course_experience
      label: How often do you use online courses?
      hint: null
      type: select_one
      options:
      - Online Courses
      - Offline Courses
      - Online and Offline Courses
      - Rarely
      - Never
      required: false
    - id: 2
      name: difficulty_level
      label: What difficulty level do you find the course difficulty?
      hint: null
      type: select_one
      options:
      - Too Hard
      - Too Easy
      - Just Right
      - Not Sure
      required: false
    - id: 3
      name: content_materials
      label: What kind of content do you like in the course?
      hint: null
      type: select_multiple
      options:
      - Video
      - Podcast
      - Live Session
      - Quiz
      - Discussion Forum
      - Other
      required: false
    - id: 4
      name: time_commitment
      label: How much time do you commit to your learning?
      hint: null
      type: select_multiple
      options:
      - Less than 2 hours
      - 2-4 hours
      - 4-6 hours
      - More than 6 hours
      required: false
    - id: 5
      name: feedback
      label: Do you have any suggestions or feedback for our e-learning team?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
