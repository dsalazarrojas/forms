inputSchema:
  type: object
  properties:
    title: Tone Evaluation Form
    pages:
    - id: 1
      name: page_1
      label: What is your overall impression of the text?
      hint: null
      type: select_one
      options:
      - 1. Very positive
      - 2. Positive
      - 3. Neutral
      - 4. Negative
      - 5. Very negative
      required: true
    - id: 2
      name: page_2
      label: Select all the tones that you feel are present in the text.
      hint: null
      type: select_multiple
      options:
      - 1. Friendly
      - 2. Formal
      - 3. Critical
      - 4. Positive
      - 5. Negative
      - 6. Very positive
      - 7. Very negative
      required: true
    - id: 3
      name: page_3
      label: How would you rate the text's tone?
      hint: null
      type: select_one
      options:
      - 1. Very positive
      - 2. Positive
      - 3. Neutral
      - 4. Negative
      - 5. Very negative
      required: true
    - id: 4
      name: page_4
      label: What are your overall feedback on the text?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: page_5
      label: What do you think about the text's content?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: page_6
      label: How does the text's tone make you feel?
      hint: null
      type: select_one
      options:
      - 1. Very positive
      - 2. Positive
      - 3. Neutral
      - 4. Negative
      - 5. Very negative
      required: true
    - id: 7
      name: page_7
      label: Do you have any additional feedback about the text?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: page_8
      label: Is the text's tone consistent with the content?
      hint: null
      type: select_one
      options:
      - 1. Yes
      - 2. No
      required: true
    - id: 9
      name: page_9
      label: How would you rate the text's tone if you were to read it again?
      hint: null
      type: select_one
      options:
      - 1. Very positive
      - 2. Positive
      - 3. Neutral
      - 4. Negative
      - 5. Very negative
      required: true
    - id: 10
      name: page_10
      label: Would you recommend the text to a friend?
      hint: null
      type: select_one
      options:
      - 1. Yes
      - 2. No
      required: true
    - id: 11
      name: page_11
      label: Why or why not?
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: page_12
      label: How would you rate the text overall?
      hint: null
      type: select_one
      options:
      - 1. Very positive
      - 2. Positive
      - 3. Neutral
      - 4. Negative
      - 5. Very negative
      required: true
