inputSchema:
  type: object
  properties:
    title: English Proficiency Assessment
    pages:
    - id: 1
      name: introduction
      label: English Proficiency Assessment
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: listening
      label: What is your native language?
      hint: null
      type: select_one
      options:
      - Native language
      - Non-native language
      - Other
      required: true
    - id: 3
      name: listening_skills
      label: How would you rate your listening skills?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 4
      name: speaking
      label: What is your current level of speaking proficiency?
      hint: null
      type: select_one
      options:
      - Proficient
      - Basic
      - None
      required: true
    - id: 5
      name: reading
      label: Can you read and understand English texts with ease?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Somewhat
      required: true
    - id: 6
      name: writing
      label: What is your current level of writing proficiency?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 7
      name: grammar
      label: Can you understand and use correct English grammar?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Somewhat
      required: true
    - id: 8
      name: vocabulary
      label: How would you rate your vocabulary?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 9
      name: pronunciation
      label: How would you rate your pronunciation?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 10
      name: overall_proficiency
      label: How would you rate your overall English language proficiency?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 11
      name: areas_of_difficulty
      label: Are there any areas where you struggle with the English language?
      hint: null
      type: select_multiple
      options:
      - Speaking
      - Listening
      - Reading
      - Writing
      - Grammar
      - Pronunciation
      - Vocabulary
      required: false
    - id: 12
      name: additional_comments
      label: Is there anything else you would like to add about your English language
        proficiency?
      hint: null
      type: text
      options: []
      required: false
