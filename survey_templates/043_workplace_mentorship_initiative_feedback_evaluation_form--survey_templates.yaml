inputSchema:
  type: object
  properties:
    title: Workplace Mentorship Initiative Feedback Evaluation Form
    pages:
    - id: 1
      name: mentorship_program_name
      label: Mentorship Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: mentorship_program_duration
      label: Program Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: mentorship_program_goals
      label: Program Goals
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: mentorship_initiatives_effectiveness_rating
      label: Initiatives Effectiveness Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
