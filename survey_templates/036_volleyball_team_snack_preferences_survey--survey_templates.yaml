inputSchema:
  type: object
  properties:
    title: Volleyball Team Snack Preferences Survey
    pages:
    - id: 1
      name: main
      label: welcome_to_the_survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: athlete_name
      label: first_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: athlete_name
      label: last_name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: athlete_dietary_needs
      label: dietary_needs
      hint: null
      type: select_one
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-free
      required: false
    - id: 5
      name: athlete_snack_preferences
      label: snack_preferences
      hint: null
      type: select_multiple
      options:
      - Water
      - Fruits
      - Vegetables
      - Cheese
      - Granola
      required: false
    - id: 6
      name: team_id
      label: team_id
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: coach_name
      label: coach_name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: parent_name
      label: parent_name
      hint: null
      type: text
      options: []
      required: false
