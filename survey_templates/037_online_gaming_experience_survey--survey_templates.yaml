inputSchema:
  type: object
  properties:
    title: Online Gaming Experience Survey
    pages:
    - id: 1
      name: game_platforms
      label: Game Platforms
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: platforms
      label: Platforms
      hint: null
      type: select_one
      options:
      - Steam
      - Origin
      - Uplay
      - Battle.net
      - GOG
      required: true
    - id: 3
      name: play_habits
      label: Play Habits
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 5
      name: improvement_ideas
      label: Improvement Ideas
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date_and_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
