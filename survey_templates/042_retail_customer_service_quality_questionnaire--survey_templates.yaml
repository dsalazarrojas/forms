inputSchema:
  type: object
  properties:
    title: Retail Customer Service Quality Questionnaire
    pages:
    - id: 1
      name: store_location
      label: Store Location
      hint: Please choose the store where you shopped.
      type: select_one
      options:
      - Abercrombie
      - American Eagle
      - Anthropologie
      - Banana Republic
      - etc.
      required: false
    - id: 2
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: sales_rep_name
      label: Sales Representative Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: sales_rep_rating
      label: Sales Representative Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: sales_rep_quality
      label: Sales Representative Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: store_environment
      label: Store Environment
      hint: null
      type: select_multiple
      options:
      - Cleanliness
      - Organization
      - Product Availability
      - etc.
      required: false
    - id: 7
      name: store_staff_helpfulness
      label: Store Staff Helpfulness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: sales_staff_helpfulness
      label: Sales Staff Helpfulness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: store_staff_friendliness
      label: Store Staff Friendliness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 10
      name: sales_staff_product_knowledge
      label: Sales Staff Product Knowledge
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 11
      name: store_staff_helpfulness_with_issues
      label: Store Staff Helpfulness with Issue
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 12
      name: sales_staff_resolution
      label: Sales Staff Resolution
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
