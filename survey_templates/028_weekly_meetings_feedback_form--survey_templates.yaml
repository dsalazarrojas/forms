inputSchema:
  type: object
  properties:
    title: Weekly Meetings Feedback Form
    pages:
    - id: 1
      name: meeting_feedback_form
      label: Meeting Feedback Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: meeting_participants
      label: Meeting Participants
      hint: List all participants
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: participant_attended
      label: Participant Attended
      hint: null
      type: select_one
      options:
      - Participant A
      - Participant B
      - Participant C
      required: false
    - id: 4
      name: meeting_topic
      label: Meeting Topic
      hint: Enter the meeting topic
      type: text
      options: []
      required: false
    - id: 5
      name: meeting_outcome
      label: Meeting Outcome
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: participant_feedback
      label: Participant Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: meeting_notes
      label: Meeting Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: next_meeting_planned
      label: Next Meeting Planned
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - N/A
      required: false
    - id: 9
      name: feedback_rating
      label: Feedback Rating
      hint: Rate your feedback
      type: select_one
      options:
      - Very Good
      - Good
      - Average
      - Bad
      - Very Bad
      required: false
    - id: 10
      name: feedback_comment
      label: Additional Feedback
      hint: null
      type: text
      options: []
      required: false
