inputSchema:
  type: object
  properties:
    title: 2nd Grade Student Information Survey
    pages:
    - id: 1
      name: section_header_student_info
      label: '--- Student Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter first and last name as on school records
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: If unknown, provide approximate date
      type: date
      options: []
      required: true
    - id: 4
      name: student_identifier
      label: Student ID / school identifier
      hint: School SIS number or local ID (optional)
      type: text
      options: []
      required: false
    - id: 5
      name: grade_level
      label: Grade / year level
      hint: Select the student's class grouping
      type: select_one
      options:
      - '2'
      - 2A
      - 2B
      - Multi-grade
      - Other
      required: true
    - id: 6
      name: school_name
      label: School or institution name
      hint: Leave blank if home-schooled or unknown
      type: text
      options: []
      required: false
    - id: 7
      name: classroom_teacher
      label: Classroom teacher
      hint: Teacher assigned to the student
      type: text
      options: []
      required: true
    - id: 8
      name: parent_guardian_name
      label: Parent / guardian name
      hint: Primary contact for school communications
      type: text
      options: []
      required: true
    - id: 9
      name: parent_email
      label: Parent / guardian email address
      hint: Used for official school messages
      type: email
      options: []
      required: true
    - id: 10
      name: parent_phone
      label: Parent / guardian phone number
      hint: Best number to reach during school hours
      type: phone
      options: []
      required: true
    - id: 11
      name: emergency_contact_name
      label: Emergency contact name
      hint: Secondary contact if parent/guardian unavailable
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_contact_phone
      label: Emergency contact phone
      hint: Include relationship (e.g., Aunt - 555-1234) if helpful
      type: phone
      options: []
      required: false
    - id: 13
      name: medical_conditions
      label: Medical conditions or allergies (select all that apply)
      hint: Select all that apply or choose None
      type: select_multiple
      options:
      - None
      - Asthma
      - Allergies (food/environmental)
      - Diabetes
      - Seizure disorder
      - Other
      required: false
    - id: 14
      name: current_medications
      label: Current medications
      hint: List medication name and dosing schedule; leave blank if none
      type: text
      options: []
      required: false
    - id: 15
      name: learning_style
      label: Preferred or observed learning style
      hint: Choose the best match for classroom instruction
      type: select_one
      options:
      - Visual
      - Auditory
      - Reading/Writing
      - Hands-on/Kinesthetic
      - Mixed
      required: false
    - id: 16
      name: primary_language
      label: Primary language spoken at home
      hint: Select the primary language used at home
      type: select_one
      options:
      - English
      - Spanish
      - Bilingual English/Spanish
      - Other
      required: true
    - id: 17
      name: internet_access
      label: Internet access at home
      hint: Important for remote assignments and resources
      type: select_one
      options:
      - Reliable home broadband
      - Intermittent mobile data
      - No internet at home
      - Other
      required: false
    - id: 18
      name: devices_available
      label: Devices available for schoolwork (select all)
      hint: Include devices the student can regularly use
      type: select_multiple
      options:
      - Chromebook
      - Tablet
      - Smartphone
      - Laptop/Desktop
      - No device
      required: false
    - id: 19
      name: average_study_hours
      label: Average study / homework hours per week
      hint: Whole number; estimate if variable
      type: integer
      options: []
      required: false
    - id: 20
      name: reading_level
      label: Reading level (teacher assessment)
      hint: Teacher's best judgment or standardized result
      type: select_one
      options:
      - Below grade level
      - On grade level
      - Above grade level
      - Not assessed
      required: false
    - id: 21
      name: special_education_services
      label: Special education or support services
      hint: Indicate if an IEP, 504 plan, or related services are in place
      type: select_one
      options:
      - None
      - IEP
      - 504 Plan
      - Speech / OT / PT
      - Other
      required: false
    - id: 22
      name: attendance_notes
      label: Attendance considerations
      hint: Note chronic lateness, frequent absences, or schedule constraints
      type: text
      options: []
      required: false
    - id: 23
      name: section_header_consent
      label: '--- Consent and Data Use ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: additional_comments
      label: Additional comments or important information
      hint: Use this field for anything not captured above
      type: text
      options: []
      required: false
