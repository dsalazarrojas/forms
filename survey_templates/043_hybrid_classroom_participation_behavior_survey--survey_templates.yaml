inputSchema:
  type: object
  properties:
    title: Hybrid Classroom Participation Behavior Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_participation
      label: Student Participation
      hint: How often do you see students participating in class?
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 3
      name: instructor_participation
      label: Instructor Participation
      hint: How often do you see the instructor participating in class?
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: class_environment
      label: Class Environment
      hint: null
      type: select_one
      options:
      - In-person
      - Online
      - Hybrid
      required: false
    - id: 5
      name: engagement_level
      label: Engagement Level
      hint: How often do you feel engaged in the class?
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: participation_challenges
      label: Participation Challenges
      hint: What are some challenges do you face in participating in class?
      type: text
      options: []
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: Can you provide some feedback on this class?
      type: text
      options: []
      required: false
    - id: 8
      name: instructor_support
      label: Instructor Support
      hint: Do you feel that the instructor is providing adequate support?
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: technology_use
      label: Technology Use
      hint: How often do you use the technology in this class?
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 10
      name: student_resources
      label: Student Resources
      hint: How often do you find the resources provided by the class to be helpful?
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 11
      name: instructor_resources
      label: Instructor Resources
      hint: How often do you find the resources provided by the instructor to be helpful?
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 12
      name: student_support
      label: Student Support
      hint: Do you feel that you have adequate support from peers?
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 13
      name: class_size
      label: Class Size
      hint: How would you rate the ideal class size?
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 14
      name: class_length
      label: Class Length
      hint: How long would you ideally like the class to be?
      type: select_one
      options:
      - Short
      - Medium
      - Long
      required: false
    - id: 15
      name: participation_benefits
      label: Participation Benefits
      hint: What benefits do you think would be most valuable from participating in
        this class?
      type: text
      options: []
      required: false
