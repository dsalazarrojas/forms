inputSchema:
  type: object
  properties:
    title: Market Researcher Information Form
    pages:
    - id: 1
      name: form_id
      label: Form ID
      hint: Please enter your form ID
      type: number
      options: []
      required: true
    - id: 2
      name: category
      label: Category
      hint: Please select your category
      type: select_one
      options:
      - Marketing
      - Research
      - Analysis
      - Strategy
      required: false
    - id: 3
      name: description
      label: Description
      hint: Please provide a brief description of yourself
      type: text
      options: []
      required: true
    - id: 4
      name: years_of_experience
      label: Years of Experience
      hint: How many years have you been working as a market researcher?
      type: number
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: Please enter your email address
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Please enter your phone number
      type: number
      options: []
      required: true
    - id: 7
      name: date_of_birth
      label: Date of Birth
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 8
      name: years_of_service
      label: Years of Service
      hint: How many years have you been working as a market researcher?
      type: number
      options: []
      required: false
    - id: 9
      name: availability
      label: Availability
      hint: What is your availability (e.g., 8am-5pm)?
      type: text
      options: []
      required: true
    - id: 10
      name: hourly_rate
      label: Hourly Rate
      hint: What is your hourly rate?
      type: number
      options: []
      required: true
    - id: 11
      name: file
      label: File
      hint: Please upload your file
      type: text
      options: []
      required: true
    - id: 12
      name: notes
      label: Notes
      hint: Any additional comments or notes
      type: note
      options: []
      required: false
