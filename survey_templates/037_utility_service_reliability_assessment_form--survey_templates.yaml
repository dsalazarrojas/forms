inputSchema:
  type: object
  properties:
    title: Utility Service Reliability Assessment Form
    pages:
    - id: 1
      name: service_reliability
      label: Service Reliability
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: communication
      label: Communication
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: customer_support
      label: Customer Support
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: overall_experience
      label: Overall Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: reliability_of_service
      label: Reliability of Service
      hint: null
      type: select_multiple
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      - '0'
      required: true
    - id: 6
      name: frequency_of_outage
      label: Frequency of Outage
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Never
      required: true
    - id: 7
      name: cause_of_outage
      label: Cause of Outage
      hint: null
      type: select_multiple
      options:
      - High winds
      - Lightning
      - Other (please specify)
      required: true
    - id: 8
      name: service_repairs
      label: Service Repairs
      hint: null
      type: select_one
      options:
      - Completed
      - Not completed
      required: true
    - id: 9
      name: service_repairs_frequency
      label: Frequency of Repairs
      hint: null
      type: select_multiple
      options:
      - 1-5
      - 6-10
      - More than 5
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
