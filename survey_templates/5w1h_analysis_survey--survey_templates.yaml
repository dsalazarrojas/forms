inputSchema:
  type: object
  properties:
    title: 9 12 Academic Plan
    pages:
    - id: 1
      name: section_header_overview
      label: '--- Academic Plan Overview ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Grade level for plan
      hint: Select grade being planned (9-12)
      type: select_one
      options:
      - '9'
      - '10'
      - '11'
      - '12'
      required: true
    - id: 5
      name: academic_year
      label: Academic year
      hint: e.g., 2026-2027
      type: text
      options: []
      required: true
    - id: 6
      name: curriculum_subjects
      label: Curriculum by subject (list subject:course:credits)
      hint: 'Example: Math:Algebra II:1.0; Science:Biology:1.0'
      type: text
      options: []
      required: true
    - id: 7
      name: total_planned_credits
      label: Total planned credits for year
      hint: Whole number (e.g., 6)
      type: integer
      options: []
      required: true
    - id: 8
      name: extracurricular_activities
      label: Extracurricular activities student will participate in
      hint: Select all that apply
      type: select_multiple
      options:
      - Sports
      - Music/Band
      - Drama/Theater
      - Debate
      - Visual Arts
      - Volunteer Service
      - Internship
      required: false
    - id: 9
      name: accommodations_or_services
      label: Accommodations, special education, or counseling services
      hint: Note IEP/504 or tutoring needs
      type: text
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes or parent explanation of plan
      hint: Use to clarify course choices or special circumstances
      type: text
      options: []
      required: false
    - id: 11
      name: parent_signature
      label: Parent/guardian signature
      hint: Type full name for e-signature
      type: text
      options: []
      required: true
