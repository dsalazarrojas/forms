inputSchema:
  type: object
  properties:
    title: Annual Check Up Experience Questionnaire
    pages:
    - id: 1
      name: patient_name
      label: Full Name
      hint: Patient name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: For follow-up communication
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 5
      name: visit_date
      label: Visit Date
      hint: When was your annual check-up?
      type: date
      options: []
      required: true
    - id: 6
      name: provider_name
      label: Provider Name
      hint: Name of your healthcare provider
      type: text
      options: []
      required: false
    - id: 7
      name: visit_type
      label: Visit Type
      hint: What type of visit was this?
      type: select_one
      options:
      - Annual Physical
      - Wellness Exam
      - Preventive Care
      - Follow-Up
      - Specialist Consultation
      - Other
      required: true
    - id: 8
      name: appointment_scheduling
      label: Appointment Scheduling Experience
      hint: How easy was it to schedule?
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 9
      name: wait_time
      label: Wait Time
      hint: How long did you wait to see the provider?
      type: select_one
      options:
      - Less than 15 minutes
      - 15-30 minutes
      - 31-45 minutes
      - 46-60 minutes
      - Over 60 minutes
      required: true
    - id: 10
      name: wait_time_satisfaction
      label: Wait Time Satisfaction
      hint: Were you satisfied with the wait time?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 11
      name: staff_friendliness
      label: Staff Friendliness
      hint: Rate the friendliness of staff
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 12
      name: staff_professionalism
      label: Staff Professionalism
      hint: Rate the professionalism of staff
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 13
      name: provider_communication
      label: Provider Communication
      hint: How well did the provider communicate?
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 14
      name: provider_listening
      label: Provider Listening Skills
      hint: Did the provider listen to your concerns?
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 15
      name: time_with_provider
      label: Time Spent with Provider
      hint: Was the time adequate?
      type: select_one
      options:
      - More Than Enough
      - Adequate
      - Rushed
      - Very Rushed
      required: true
    - id: 16
      name: explanation_clarity
      label: Explanation Clarity
      hint: How clear were the explanations?
      type: select_one
      options:
      - Very Clear
      - Clear
      - Somewhat Clear
      - Unclear
      - Very Unclear
      required: true
    - id: 17
      name: facility_cleanliness
      label: Facility Cleanliness
      hint: Rate the cleanliness of the facility
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 18
      name: facility_comfort
      label: Facility Comfort
      hint: Rate the comfort of the facility
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 19
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied were you with your visit?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 20
      name: likelihood_to_recommend
      label: Likelihood to Recommend
      hint: Would you recommend this provider?
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 21
      name: likelihood_to_return
      label: Likelihood to Return
      hint: Will you return for future care?
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 22
      name: best_aspect
      label: Best Aspect of Visit
      hint: What went well?
      type: text
      options: []
      required: false
    - id: 23
      name: areas_for_improvement
      label: Areas for Improvement
      hint: What could be better?
      type: text
      options: []
      required: false
    - id: 24
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
