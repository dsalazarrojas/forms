      type: text
      options: []
      required: false
    - id: 5
      name: favorite_part
      label: Favorite Part
      hint: What part of the film was your favorite?
      type: select_one
      options:
      - '{1: ''The opening scene''}'
      - '{2: ''The ending''}'
      - '{3: ''The middle section''}'
      - '{4: "I couldn''t pick just one"}'
      required: false
