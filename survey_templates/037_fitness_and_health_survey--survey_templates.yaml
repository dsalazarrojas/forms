      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: participation_in_physical_education
      label: Participation in physical education
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: health_participation
      label: Health Participation
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: activity_level
