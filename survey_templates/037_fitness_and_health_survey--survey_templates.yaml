inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: health_habits
      label: What do you do for physical activity?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: exercise_frequency
      label: How often do you exercise?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: health_habits_frequency
