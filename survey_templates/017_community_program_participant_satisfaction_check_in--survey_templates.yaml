inputSchema:
  type: object
  properties:
    title: Community Program Participant Satisfaction Check In
    pages:
      - id: 1
        name: satisfaction_intro_note
        label: -- Participant Satisfaction Check-In --
        hint: Your feedback helps us build better programs for everyone.
        type: note
        options: []
        required: false
      - id: 2
        name: program_name
        label: Name of Community Program
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: last_session_date
        label: Date of Your Last Session Attended
        hint: null
        type: date
        options: []
        required: true
      - id: 4
        name: overall_program_satisfaction
        label: Overall satisfaction with the program
        hint: Scale of 1 to 5.
        type: select_one
        options: [5 - Extremely Satisfied, 4 - Very Satisfied, 3 - Neutral, 2 - Dissatisfied, 1 - Very Dissatisfied]
        required: true
      - id: 5
        name: content_clarity_check
        label: Was the program content easy to understand?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 6
        name: facilities_rating
        label: Rate the Facilities or Location
        hint: null
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 7
        name: staff_rating
        label: Rate the Staff or Instructors
        hint: Helpful and professional.
        type: select_one
        options: [Very Helpful, Helpful, Neutral, Unhelpful]
        required: true
      - id: 8
        name: favorite_program_aspect_text
        label: What have you enjoyed most about the program?
        hint: null
        type: text
        options: []
        required: true
      - id: 9
        name: improvement_areas_text
        label: What could be done to make the program better?
        hint: We are looking for constructive suggestions.
        type: text
        options: []
        required: false
      - id: 10
        name: needs_meeting_check
        label: Do you feel the program meets your personal needs?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 11
        name: program_outreach_source
        label: How did you hear about this program?
        hint: Select all that apply.
        type: select_multiple
        options: [Website, Email, Social Media, Word of Mouth, Community Flyer, Other]
        required: true
      - id: 12
        name: future_attendance_intent
        label: Would you attend another program like this?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 13
        name: additional_comments_text
        label: Any other comments or concerns?
        hint: null
        type: text
        options: []
        required: false
      - id: 14
        name: follow_up_email
        label: Email Address
        hint: Only if you would like a follow-up response.
        type: email
        options: []
        required: false
      - id: 15
        name: thank_you_footer
        label: -- Thank You --
        hint: We value your time and feedback.
        type: note
        options: []
        required: false
