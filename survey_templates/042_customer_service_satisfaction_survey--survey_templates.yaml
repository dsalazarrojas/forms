inputSchema:
  type: object
  properties:
    title: Customer Service Satisfaction Survey
    pages:
    - id: 1
      name: service_quality
      label: How satisfied are you with our service quality?
      hint: Rate your satisfaction with our service quality.
      type: number
      options: []
      required: true
    - id: 2
      name: communication
      label: How satisfied are you with our communication?
      hint: Rate your satisfaction with our communication.
      type: number
      options: []
      required: true
    - id: 3
      name: overall_experience
      label: How would you rate your overall experience with our service?
      hint: Rate your overall experience with our service.
      type: number
      options: []
      required: true
    - id: 4
      name: service_satisfaction
      label: How satisfied are you with our service satisfaction?
      hint: Rate your satisfaction with our service satisfaction.
      type: number
      options: []
      required: true
    - id: 5
      name: contact_information
      label: What was the primary reason for your contact with us?
      hint: Please provide a brief description of your contact with us.
      type: text
      options: []
      required: true
    - id: 6
      name: concern_or_issue
      label: What was the primary issue or concern during your experience with our
        service?
      hint: Please provide a brief description of the issue or concern.
      type: text
      options: []
      required: true
