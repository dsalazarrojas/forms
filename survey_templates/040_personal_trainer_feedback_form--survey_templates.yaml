inputSchema:
  type: object
  properties:
    title: personal_trainer_feedback_form
    pages:
    - id: 1
      name: training_session_rating
      label: Training Session Rating
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Very Good
      - Good
      - Average
      - Poor
      required: false
    - id: 2
      name: trainer_professionalism
      label: Trainer Professionalism
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 3
      name: client_satisfaction
      label: Client Satisfaction
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: overall_rating
      label: Overall Rating
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: trainer_support
      label: Trainer Support
      hint: How can we improve our service?
      type: text
      options: []
      required: false
    - id: 6
      name: feedback
      label: Feedback
      hint: Additional feedback is always welcome
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: training_session_date
      label: Training Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: training_session_time
      label: Training Session Time
      hint: null
      type: time
      options: []
      required: true
