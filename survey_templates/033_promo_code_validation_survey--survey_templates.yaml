inputSchema:
  type: object
  properties:
    title: Promo Code Validation Survey
    pages:
    - id: 1
      name: introduction
      label: What was your experience with this promo code
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: code_used
      label: Was this promo code used on this purchase
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: code_type
      label: Promo code type
      hint: null
      type: select_one
      options:
