inputSchema:
  type: object
  properties:
    title: staff_satisfaction_survey
    pages:
    - id: 1
      name: overall_satisfaction
      label: How satisfied are you with your job?
      hint: Please rate your overall satisfaction.
      type: number
      options: []
      required: true
    - id: 2
      name: work_satisfaction
      label: How satisfied are you with your current work environment?
      hint: Please rate your satisfaction with your work environment.
      type: number
      options: []
      required: true
    - id: 3
      name: team_satisfaction
      label: How satisfied are you with your team?
      hint: Please rate your satisfaction with your team.
      type: number
      options: []
      required: true
    - id: 4
      name: work_life_balance
      label: How satisfied are you with the balance between work and personal life?
      hint: Please rate your satisfaction with work-life balance.
      type: number
      options: []
      required: true
    - id: 5
      name: job_security
      label: How secure do you feel about your job?
      hint: Please rate your security about your job.
      type: number
      options: []
      required: true
    - id: 6
      name: communication
      label: How satisfied are you with communication within the company?
      hint: Please rate your satisfaction with communication.
      type: number
      options: []
      required: true
    - id: 7
      name: feedback
      label: What feedback do you have for the management?
      hint: Please provide your feedback.
      type: text
      options: []
      required: true
    - id: 8
      name: contact_info
      label: What is your contact information?
      hint: Please enter your contact information.
      type: text
      options: []
      required: true
    - id: 9
      name: manager
      label: Who is your manager?
      hint: Please enter your manager's name.
      type: text
      options: []
      required: true
    - id: 10
      name: department
      label: What department do you belong to?
      hint: Please select your department.
      type: select_multiple
      options:
      - HR
      - Marketing
      - Sales
      - Other
      required: true
    - id: 11
      name: job_performance
      label: How satisfied are you with your job performance?
      hint: Please rate your job performance.
      type: number
      options: []
      required: true
    - id: 12
      name: job_satisfaction
      label: Job Satisfaction
      hint: Please rate your satisfaction with your job.
      type: number
      options: []
      required: true
    - id: 13
      name: date_submitted
      label: What is the date you submitted this survey?
      hint: Please enter the date.
      type: date
      options: []
      required: true
