inputSchema:
  type: object
  properties:
    title: Start And Stop Evaluation Form
    pages:
    - id: 1
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: stop_date
      label: stop_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: evaluation_process_id
      label: evaluation_process
      hint: null
      type: select_one
      options:
      - Process 1
      - Process 2
      - Process 3
      required: true
    - id: 4
      name: evaluation_program_id
      label: evaluation_program
      hint: null
      type: select_multiple
      options:
      - Program 1
      - Program 2
      - Program 3
      required: true
    - id: 5
      name: decision_to_continue
      label: decision_to_continue
      hint: null
      type: select_one
      options:
      - Continue
      - Halt
      required: true
    - id: 6
      name: evaluation_reason
      label: evaluation_reason
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: evaluation_comments
      label: evaluation_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: submit
      hint: null
      type: text
      options: []
      required: false
