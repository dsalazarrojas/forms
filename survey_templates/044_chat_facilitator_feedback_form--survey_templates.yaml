inputSchema:
  type: object
  properties:
    title: Chat Facilitator Feedback Form
    pages:
      - id: 1
        name: section_respondent_info
        label: -- Your Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Your Name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 3
        name: respondent_email
        label: Email Address
        hint: Optional for follow-up
        type: email
        options: []
        required: false
      - id: 4
        name: event_attended
        label: Chat Event Attended
        hint: Name of the chat event
        type: text
        options: []
        required: true
      - id: 5
        name: event_date
        label: Date of Chat Event
        hint: When did the event occur
        type: date
        options: []
        required: true
      - id: 6
        name: facilitator_name
