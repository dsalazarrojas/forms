inputSchema:
  type: object
  properties:
    title: Car Dealership Survey
    pages:
    - id: 1
      name: satisfaction_header
      label: -- Customer Satisfaction Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: overall_satisfaction_rating
      label: Overall Satisfaction Rating
      hint: On a scale of 1 to 10, how satisfied are you?
      type: number
      options: []
      required: true
    - id: 3
      name: dealership_cleanliness_rating
      label: Dealership Cleanliness and Presentation
      hint: Rate the dealership's physical appearance
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: staff_friendliness_rating
      label: Staff Friendliness and Professionalism
      hint: How friendly and professional were the staff?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: wait_time_rating
      label: Wait Time for Assistance
      hint: How long did you wait for assistance?
      type: select_one
      options:
      - Fast
      - Reasonable
      - Slow
      - Very Slow
      required: true
    - id: 6
      name: vehicle_selection_rating
      label: Quality and Selection of Vehicles
      hint: Were you satisfied with the vehicle options?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: sales_process_rating
      label: Transparency of the Sales Process
      hint: How transparent was the sales process?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: finance_process_rating
      label: Efficiency of the Finance Department
      hint: How efficient was the finance department?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: purchase_likelihood
      label: Likelihood of Recommending This Dealership
      hint: On a scale of 1 to 10, how likely are you to recommend us?
      type: number
      options: []
      required: true
    - id: 10
      name: future_purchase_intent
      label: Future Purchase Intent
      hint: Do you plan to buy from us again in the future?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 11
      name: specific_feedback
      label: Share any specific feedback or concerns
      hint: Provide more details for the survey
      type: text
      options: []
      required: false
    - id: 12
      name: contact_info_header
      label: -- Contact Information (Optional) --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: customer_full_name
      label: Full Name
      hint: (Optional)
      type: text
      options: []
      required: false
    - id: 14
      name: customer_email_address
      label: Email Address
      hint: (Optional)
      type: email
      options: []
      required: false
    - id: 15
      name: customer_phone_number
      label: Phone Number
      hint: (Optional)
      type: text
      options: []
      required: false
    - id: 16
      name: survey_date
      label: Date of Survey
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 17
      name: survey_signature_confirmation
      label: Type your name for survey confirmation
      hint: null
      type: text
      options: []
      required: true
