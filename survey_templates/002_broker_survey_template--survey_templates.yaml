inputSchema:
  type: object
  properties:
    title: Broker Survey Template
    pages:
    - id: 1
      name: broker_name
      label: Broker Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: company_name
      label: Company Name
      hint: Name of your brokerage firm
      type: text
      options: []
      required: true
    - id: 3
      name: years_experience
      label: Years of Experience in Real Estate
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: service_satisfaction
      label: How satisfied are you with current services
      hint: Rate your satisfaction level
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 5
      name: service_improvements
      label: What services could be improved
      hint: Provide your feedback
      type: text
      options: []
      required: false
    - id: 6
      name: market_conditions
      label: How would you rate current market conditions
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Slow
      - Very Slow
      required: true
    - id: 7
      name: business_challenges
      label: Main challenges facing your business
      hint: Select all that apply
      type: select_multiple
      options:
      - Rising interest rates
      - Inventory shortage
      - Competition
      - Regulatory changes
      - Technology gaps
      - Client acquisition
      required: true
    - id: 8
      name: technology_usage
      label: Primary technology tools used
      hint: null
      type: select_multiple
      options:
      - CRM Software
      - MLS Platform
      - Virtual Tours
      - Social Media
      - Email Marketing
      - Mobile Apps
      required: true
    - id: 9
      name: client_acquisition
      label: Primary source of client leads
      hint: null
      type: select_one
      options:
      - Referrals
      - Online Advertising
      - Social Media
      - Open Houses
      - Cold Calling
      - Other
      required: true
    - id: 10
      name: average_commission
      label: Average commission rate charged
      hint: Percentage
      type: number
      options: []
      required: false
    - id: 11
      name: new_features_interest
      label: Interest in new industry features
      hint: Select areas of interest
      type: select_multiple
      options:
      - AI-powered tools
      - Blockchain transactions
      - Virtual reality tours
      - Analytics dashboards
      - Automation tools
      required: false
    - id: 12
      name: training_needs
      label: Training or education needs
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: contact_email
      label: Email for survey follow-up
      hint: null
      type: email
      options: []
      required: true
