inputSchema:
  type: object
  properties:
    title: Seminar Content Feedback Form
    pages:
    - id: 1
      name: session_quality
      label: Session Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: relevance
      label: Relevance
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: improvement_ideas
      label: Improvement Ideas
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: session_organization
      label: Session Organization
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: seminar_length
      label: Seminar Length
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: content
      label: Content
      hint: null
      type: select_multiple
      options:
      - Very Relevant
      - Somewhat Relevant
      - Not Relevant
      - Not at All Relevant
      required: false
    - id: 7
      name: session_materials
      label: Session Materials
      hint: null
      type: select_one
      options:
      - Very Useful
      - Somewhat Useful
      - Not Useful
      - Not at All Useful
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      - Very Dissatisfied
      required: false
