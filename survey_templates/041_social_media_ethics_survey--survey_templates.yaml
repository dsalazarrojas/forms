      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: social_media_use
      label: Do you use social media?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: social_media_ethics_importance
      label: How important is social media ethics to you?
      hint: null
      type: select_multiple
      options:
      - Very Important
      - Not Important
      required: true
    - id: 4
      name: social_media_ethics_importance_level
      label: How important is social media ethics to you?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: social_media_use_days
      label: How many days do you spend on social media?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: social_media_use_time
      label: How much time do you spend on social media?
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: social_media_ethics_awareness
      label: Do you think social media companies have a responsibility to their users?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
