      hint: null
      type: select_one
      options:
      - Very Important
      - Not Important
      required: true
    - id: 11
      name: social_media_reporting
      label: Have you reported a social media issue?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: social_media_reporting_importance
      label: How important is it to report a social media issue?
      hint: null
      type: select_one
      options:
      - Very Important
      - Not Important
      required: true
    - id: 13
      name: social_media_awareness
      label: How aware are you of social media's impact on your daily life?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
