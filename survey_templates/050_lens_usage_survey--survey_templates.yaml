inputSchema:
  type: object
  properties:
    title: Lens Usage Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question_1
      label: How often do you use the Lens in your work
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Rarely''}'
      - '{''id'': 2, ''label'': ''Occasionally''}'
      - '{''id'': 3, ''label'': ''Frequently''}'
      - '{''id'': 4, ''label'': ''Almost always''}'
      required: false
    - id: 3
      name: question_2
      label: How long have you been using the Lens?
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''Less than a month''}'
      - '{''id'': 2, ''label'': ''1-3 months''}'
      - '{''id'': 3, ''label'': ''4-6 months''}'
      - '{''id'': 4, ''label'': ''More than 6 months''}'
      required: false
    - id: 4
      name: question_3
      label: How many lenses do you use in your daily work?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: question_4
      label: Can you give an example of a recent project where the Lens was instrumental
        in your work?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: question_5
      label: Have you used the Lens to support your decision-making process?
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': False}'
      - '{''id'': 2, ''label'': True}'
      required: false
    - id: 7
      name: question_6
      label: How likely are you to recommend the Lens to other users?
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''Not likely''}'
      - '{''id'': 2, ''label'': ''Neutral''}'
      - '{''id'': 3, ''label'': ''Likely''}'
      - '{''id'': 4, ''label'': ''Very Likely''}'
      required: false
    - id: 8
      name: question_7
      label: What do you use the Lens for?
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Data analysis''}'
      - '{''id'': 2, ''label'': ''Project planning''}'
      - '{''id'': 3, ''label'': ''Other''}'
      required: false
    - id: 9
      name: question_8
      label: What do you think is the most important feature of the Lens?
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''Easy to use''}'
      - '{''id'': 2, ''label'': ''High quality data''}'
      - '{''id'': 3, ''label'': ''Customizable reports''}'
      - '{''id'': 4, ''label'': ''None of the above''}'
      required: false
    - id: 10
      name: question_9
      label: Have you ever used the Lens to create a dashboard or report?
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': False}'
      - '{''id'': 2, ''label'': True}'
      required: false
