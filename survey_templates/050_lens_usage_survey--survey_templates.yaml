inputSchema:
  type: object
  properties:
    title: Lens Usage Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question_1
      label: How often do you use the Lens in your work
      hint: null
      type: select_one
      options:
      - Rarely
      - Occasionally
      - Frequently
      - Almost always
      required: false
    - id: 3
      name: question_2
      label: How long have you been using the Lens?
      hint: null
      type: select_multiple
      options:
      - Less than a month
      - 1-3 months
      - 4-6 months
      - More than 6 months
      required: false
    - id: 4
      name: question_3
      label: How many lenses do you use in your daily work?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: question_4
      label: Can you give an example of a recent project where the Lens was instrumental
        in your work?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: question_5
      label: Have you used the Lens to support your decision-making process?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 7
      name: question_6
      label: How likely are you to recommend the Lens to other users?
      hint: null
      type: select_multiple
      options:
      - Not likely
      - Neutral
      - Likely
      - Very Likely
      required: false
    - id: 8
      name: question_7
      label: What do you use the Lens for?
      hint: null
      type: select_one
      options:
      - Data analysis
      - Project planning
      - Other
      required: false
    - id: 9
      name: question_8
      label: What do you think is the most important feature of the Lens?
      hint: null
      type: select_multiple
      options:
      - Easy to use
      - High quality data
      - Customizable reports
      - None of the above
      required: false
    - id: 10
      name: question_9
      label: Have you ever used the Lens to create a dashboard or report?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
