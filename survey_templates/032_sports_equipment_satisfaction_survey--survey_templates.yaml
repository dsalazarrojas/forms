      name: equipment_used
      label: Equipment Used
      hint: null
      type: select_one
      options:
      - Cycling Bikes
      - Running Shoes
      - Swimwear
      - Treadmills
      - Yoga Mats
      required: false
    - id: 2
      name: quality_rating
      label: Quality Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: durability_rating
      label: Durability Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: equipment_satisfaction
      label: Equipment Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: would_recommended
      label: Would Recommend
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
