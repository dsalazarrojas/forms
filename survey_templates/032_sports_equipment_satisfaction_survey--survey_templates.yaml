      hint: null
      type: select_one
      options:
      - Male
      - Female
      required: false
    - id: 12
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: equipment_purchase
