      name: evaluation_time
      label: Evaluation Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: training_program_name
      label: Training Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: overall_rating
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: areas_for_improvement
      label: Areas for Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
