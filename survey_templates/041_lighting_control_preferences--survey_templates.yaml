inputSchema:
  type: object
  properties:
    title: Lighting Control Preferences
    pages:
    - id: 1
      name: name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact info
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: lighting_control_needs
      label: What's your first lighting control needs?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: other_needs
      label: Do you have any other lighting control needs?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: automation_preferences
      label: Do you prefer automation in your lighting control?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: automation_method
      label: What automation method do you prefer?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 7
      name: priority
      label: Do you have a priority level for your lighting control needs?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: notes
      label: Do you have any notes about your lighting control needs or preferences?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: notes_2
      label: Notes
      hint: null
      type: note
      options: []
      required: false
