      type: text
      options: []
      required: false
    - id: 6
      name: research_form_accessibility
      label: research_form_accessibility
      hint: null
      type: select_one
      options:
      - PC
      - smartphones
      - tablets
      required: false
    - id: 7
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email_address
