inputSchema:
  type: object
  properties:
    title: Research Participant Application Form
    pages:
    - id: 1
      name: research_participant_application_form_data
      label: Research Participant Application Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: research_participant_contact_info
      label: Participant Contact Info
      hint: null
      type: note
      options: []
