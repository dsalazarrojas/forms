      hint: null
      type: select_multiple
      options:
      - Pink minimalist chic
      - Blue calming vibes
      - Purple luxurious feel
      - Red bold and sassy
      - Orange vibrant and fun
      - Yellow bright and cheerful
      - Green natural and earthy
      - Black formal and elegant
      - White classic and clean
      - Gray modern and sophisticated
      required: false
    - id: 3
      name: favorite_fabric_texture_1
      label: Favorite Fabric Texture
      hint: null
      type: select_multiple
      options:
      - Soft and smooth
      - Medium weight
      - Firm and rough
      - Heavy and thick
      - Light and airy
      - Heavy
      - Soft
      required: false
    - id: 4
      name: favorite_fabric_weave_1
      label: Favorite Fabric Weave
      hint: null
      type: select_multiple
      options:
      - Tight weave
      - Medium weave
      - Loose weave
      - Plush
      - Smooth
      - Herringbone
      - Chenille
      - Twill
      - Twill tape
      required: false
    - id: 5
      name: favorite_fabric_weight_1
      label: Favorite Fabric Weight
      hint: null
      type: select_one
      options:
      - Heavy
      - Medium
      - Light
      - Extremely light
      required: false
