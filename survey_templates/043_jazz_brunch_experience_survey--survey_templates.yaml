inputSchema:
  type: object
  properties:
    title: Jazz Brunch Experience Survey
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: Please enter the date of the event
      type: date
      options: []
      required: false
    - id: 2
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: music_style
      label: Music Style
      hint: Please select the music style of the event
      type: select_one
      options:
      - Blue
      - Jazz/Blues
      - Swing
      - Classic
      - Rock
      - Latin
      required: false
    - id: 4
      name: food_quality
      label: Food Quality
      hint: Please rate the quality of the food on a scale of 1-5
      type: number
      options: []
      required: false
    - id: 5
      name: food_value
      label: Food Value
      hint: Please rate the value for money for food
      type: number
      options: []
      required: false
    - id: 6
      name: service_attitude
      label: Service Attitude
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: overall_experience
      label: Overall Experience
      hint: Please rate the overall experience
      type: number
      options: []
      required: false
    - id: 8
      name: food_items
      label: Food Items
      hint: Please select all the food items you ordered
      type: select_multiple
      options:
      - Eggs Benedict
      - Pancakes
      - Waffles
      - Quiche
      - Omelette
      required: false
    - id: 9
      name: music_performance
      label: Music Performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 10
      name: service_quality
      label: Service Quality
      hint: null
      type: select_multiple
      options:
      - Cleanliness
      - Friendliness
      - Knowledge
      - Efficiency
      required: false
    - id: 11
      name: goals
      label: Goals
      hint: What was the goal of this event
      type: select_one
      options:
      - Entertainment
      - Business
      - Cultural
      - Other
      - Social
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: Any additional comments
      type: note
      options: []
      required: false
    - id: 13
      name: email
