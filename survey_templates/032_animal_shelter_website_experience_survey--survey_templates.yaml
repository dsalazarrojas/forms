inputSchema:
  type: object
  properties:
    title: Animal Shelter Website Experience Survey
    pages:
    - id: 1
      name: visitor_name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: visitor_email
      label: Email Address
      hint: Optional - for follow-up
      type: email
      options: []
      required: false
    - id: 3
      name: visit_date
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: visit_purpose
      label: What Was the Purpose of Your Visit
      hint: Select all that apply
      type: select_multiple
      options:
      - Browse Available Animals
      - Learn About Adoption Process
      - Submit Adoption Application
      - Volunteer Information
      - Make a Donation
      - Find Shelter Information
      - View Events Calendar
      - Read Blog or News
      - Contact Shelter
      - Other
      required: true
    - id: 5
      name: first_time_visitor
      label: Is This Your First Time on Our Website
      hint: null
      type: select_one
      options:
      - Yes
      - No
      required: true
    - id: 6
      name: overall_satisfaction
      label: Overall Website Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: ease_of_navigation
