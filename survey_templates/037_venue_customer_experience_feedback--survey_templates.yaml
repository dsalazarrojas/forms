inputSchema:
  type: object
  properties:
    title: Venue Customer Experience Feedback
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: event_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: event_date
      label: event_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: venue
      label: venue
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: overall_rating
      hint: On a scale of 1-5
      type: number
      options: []
      required: false
    - id: 6
      name: satisfaction
      label: satisfaction
      hint: How satisfied are you with your overall experience at this venue?
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: false
    - id: 7
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_details
      label: contact_details
      hint: Provide us with your contact details so we can follow up with you
      type: text
      options: []
      required: false
