inputSchema:
  type: object
  properties:
    title: CCTV Customer Satisfaction Survey
    pages:
    - id: 1
      name: survey_intro_cctv
      label: -- Post-Installation Service Review --
      hint: Thank you for choosing our security solutions. Please share your feedback.
      type: note
      options: []
      required: false
    - id: 2
      name: client_name_cctv
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: installation_date_cctv
      label: Date of Installation
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: technician_name_cctv
      label: Lead Technician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: equipment_rating_cctv
      label: Rate the quality of the CCTV equipment installed
      hint: null
      type: select_one
      options:
      - 1 - Poor
      - 2 - Fair
      - 3 - Good
      - 4 - Very Good
      - 5 - Excellent
      required: true
    - id: 6
      name: image_clarity_rating
      label: How satisfied are you with the camera image clarity?
      hint: null
      type: select_one
      options:
      - Dissatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 7
      name: technician_professionalism_cctv
      label: Rate the technician's professionalism and punctuality
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 8
      name: ease_of_use_software
      label: How easy is it to use the CCTV software/app?
      hint: null
      type: select_one
      options:
      - Very Difficult
      - Difficult
      - Easy
      - Very Easy
      required: true
    - id: 9
      name: training_quality_cctv
      label: Were you provided with adequate training on how to use the system?
      hint: null
      type: select_one
      options:
      - Yes, excellent training
      - Yes, basic training
      - No training provided
      required: true
    - id: 10
      name: area_cleanliness_post_install
      label: Did the technicians leave the installation area clean?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: overall_experience_cctv
      label: Rate your overall experience with our company
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 12
      name: referral_likelihood_cctv
      label: How likely are you to refer us to a friend or colleague?
      hint: null
      type: select_one
      options:
      - Not Likely
      - Neutral
      - Likely
      - Very Likely
      required: true
    - id: 13
      name: improvement_suggestions_cctv
      label: How can we improve our service?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: contact_for_testimonial_cctv
      label: May we use your feedback as a testimonial on our website?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: survey_completion_check_cctv
      label: I have completed the survey
      hint: null
      type: select_one
      options:
      - Done
      - Other
      required: true
