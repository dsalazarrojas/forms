inputSchema:
  type: object
  properties:
    title: HIV Policy Feedback Survey
    pages:
    - id: 1
      name: region
      label: Which region has the greatest need for HIV policy support?
      hint: null
      type: select_one
      options:
      - Africa
      - Americas
      - Asia
      - Europe
      required: true
    - id: 2
      name: policy_effectiveness
      label: How would you rate the effectiveness of the HIV policy?
      hint: null
      type: select_multiple
      options:
      - Very Effective
      - Somewhat Effective
      - Not Very Effective
      - Not Effective At All
      required: true
    - id: 3
      name: barriers_implementation
      label: What are the barriers to implementing the HIV policy?
      hint: null
      type: select_multiple
      options:
      - Lack of Funding
      - Lack of Community Engagement
      - Lack of Awareness
      - Lack of Policy Enforcement
      - Other (please specify)
      required: true
    - id: 4
      name: improvement_priorities
      label: What are the priorities for improving the HIV policy?
      hint: null
      type: select_multiple
      options:
      - Increase Funding
      - Improve Awareness
      - Enhance Community Engagement
      - Improve Policy Enforcement
      - Other (please specify)
      required: true
    - id: 5
      name: contact_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: contact_phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: contact_address
      label: What is your address?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: form_submitted
      label: Have you already submitted this form?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: date_submitted
      label: On what date did you submit this form?
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: time_submitted
      label: On what time did you submit this form?
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: region_2
      label: Is your region in need of policy support?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: note
      label: Do you have any additional feedback?
      hint: Please provide any additional feedback.
      type: note
      options: []
      required: true
    - id: 14
      name: region_3
      label: Region 3
      hint: null
      type: select_one
      options:
      - Africa
      - Americas
      - Asia
      - Europe
      required: true
    - id: 15
      name: additional_feedback
      label: Additional feedback
      hint: Please provide any additional feedback.
      type: note
      options: []
      required: false
    - id: 16
      name: region_4
      label: Region
      hint: null
      type: select_one
      options:
      - Africa
      - Americas
      - Asia
      - Europe
      required: false
    - id: 17
      name: region_5
      label: Region 5
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 18
      name: region_6
      label: Region 6
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
