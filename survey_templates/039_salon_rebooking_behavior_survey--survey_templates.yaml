inputSchema:
  type: object
  properties:
    title: salon_rebooking_behavior_survey
    pages:
    - id: 1
      name: rebooking_frequency
      label: What is your rebooking frequency?
      hint: Please select your rebooking frequency
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 2
      name: service_type
      label: What type of service do you usually rebook?
      hint: Please select the type of service you usually rebook
      type: select_multiple
      options:
      - Hair cut
      - Color treatment
      - Chemical service
      required: false
    - id: 3
      name: rebooking_window
      label: How often do you rebook your appointments?
      hint: Please select the rebooking window
      type: select_one
      options:
      - 1-2 weeks
      - 2-4 weeks
      - 4-6 weeks
      required: false
    - id: 4
      name: appointment_satisfaction
      label: How would you rate your satisfaction with your last appointment?
      hint: Please rate your satisfaction
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 5
      name: rebooking_habits
      label: Rebooking Habits
      hint: Please select your rebooking habits
      type: select_multiple
      options:
      - Always
      - Rarely
      - Never
      required: false
    - id: 6
      name: rebooking_reason
      label: Why do you rebook your appointments?
      hint: Please provide a note about your rebooking reasons
      type: note
      options: []
      required: false
    - id: 7
      name: contact_info
      label: What is your preferred contact method for rebooking?
      hint: Please select your preferred contact method
      type: select_one
      options:
      - phone
      - email
      required: false
    - id: 8
      name: appointment_rebooking_window
      label: How long before your next appointment will be rebooked?
      hint: Please select the rebooking window
      type: select_one
      options:
      - 1-2 weeks
      - 2-4 weeks
      - 4-6 weeks
      required: false
    - id: 9
      name: rebooking_window_unit
      label: What unit do you use to measure your rebooking window?
      hint: Please select the unit you use
      type: select_one
      options:
      - days
      - weeks
      - months
      required: false
    - id: 10
      name: note
      label: Do you have any additional comments about your rebooking behavior?
      hint: Please provide any additional comments
      type: note
      options: []
      required: false
    - id: 11
      name: phone
      label: What is your phone number?
      hint: Please enter your phone number
      type: text
      options: []
      required: false
    - id: 12
      name: note_2
      label: Is there anything else you'd like to comment about your rebooking behavior?
      hint: Please provide any additional comments
      type: note
      options: []
      required: false
