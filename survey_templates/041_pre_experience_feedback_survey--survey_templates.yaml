inputSchema:
  type: object
  properties:
    title: Pre Experience Feedback Survey
    pages:
    - id: 1
      name: participant_expectations
      label: What are your expectations
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: background_info
      label: What is your background
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: program_activity_info
      label: About the program or activity
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: preferred_format
      label: How do you want to receive updates
      hint: null
      type: select_one
      options:
      - Email
      - SMS
      - In-app notifications
      required: false
    - id: 5
      name: contact_method
      label: How would you like to be contacted
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - In-app messages
      required: false
    - id: 6
      name: time_zone
      label: Time Zone
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
