inputSchema:
  type: object
  properties:
    title: Caregiver Learning Needs Assessment
    pages:
    - id: 1
      name: caregiver_name
      label: Caregiver Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization or Facility Name
      hint: Where do you work?
      type: text
      options: []
      required: true
    - id: 4
      name: position
      label: Job Position or Title
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: tenure_years
      label: Years in Current Position
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: experience_level
      label: Overall Experience Level
      hint: null
      type: select_one
      options:
      - Novice - new to caregiving
      - Beginner - less than 1 year
      - Intermediate - 1-3 years
      - Experienced - 3-5 years
      - Expert - 5+ years
      required: true
    - id: 7
      name: current_skills_assessment
      label: Current Skills Self-Assessment
      hint: How would you rate your caregiving skills?
      type: select_one
      options:
      - Very competent - confident in all areas
      - Competent - confident in most areas
      - Adequate - can perform duties
      - Developing - improving continuously
      - Need improvement - significant gaps
      required: true
    - id: 8
      name: primary_care_type
      label: Primary Type of Care Provided
      hint: What kind of care do you primarily provide?
      type: text
      options: []
      required: true
    - id: 9
      name: care_recipient_population
      label: Care Recipient Population
      hint: Elderly, disabled, pediatric, etc.
      type: select_one
      options:
      - Elderly or senior population
      - Adults with disabilities
      - Pediatric or children
      - Mixed ages and conditions
      - Specialized population
      required: true
    - id: 10
      name: personal_care_competency
      label: Personal Care Skills - Current Level
      hint: Hygiene, grooming, dressing, toileting
      type: select_one
      options:
      - Highly competent
      - Competent
      - Developing
      - Needs improvement
      - Not applicable
      required: true
    - id: 11
      name: personal_care_training_need
      label: Personal Care Training Need
      hint: Would you like training in this area?
      type: select_one
      options:
      - Yes - definitely
      - Yes - some areas
      - Maybe - open to training
      - No - competent already
      - N/A - not relevant
      required: false
    - id: 12
      name: mobility_competency
      label: Mobility and Transfer Skills - Current Level
      hint: Assisting with movement and transfers
      type: select_one
      options:
      - Highly competent
      - Competent
      - Developing
      - Needs improvement
      - Not applicable
      required: true
    - id: 13
      name: mobility_training_need
      label: Mobility Training Need
      hint: Would you like training in this area?
      type: select_one
      options:
      - Yes - definitely
      - Yes - some areas
      - Maybe - open to training
      - No - competent already
      - N/A - not relevant
      required: false
    - id: 14
      name: medication_competency
      label: Medication Management - Current Level
      hint: Assisting with medications
      type: select_one
      options:
      - Highly competent
      - Competent
      - Developing
      - Needs improvement
      - Not applicable
      required: true
    - id: 15
      name: medication_training_need
      label: Medication Training Need
      hint: Would you like training in this area?
      type: select_one
      options:
      - Yes - definitely
      - Yes - some areas
      - Maybe - open to training
      - No - competent already
      - N/A - not relevant
      required: false
    - id: 16
      name: communication_competency
      label: Communication Skills - Current Level
      hint: Communicating with patients and families
      type: select_one
      options:
      - Highly competent
      - Competent
      - Developing
      - Needs improvement
      - Not applicable
      required: true
    - id: 17
      name: communication_training_need
      label: Communication Skills Training Need
      hint: Would you like training in this area?
      type: select_one
      options:
      - Yes - definitely
      - Yes - some areas
      - Maybe - open to training
      - No - competent already
      - N/A - not relevant
      required: false
    - id: 18
      name: dementia_competency
      label: Dementia Care Skills - Current Level
      hint: If applicable to your role
      type: select_one
      options:
      - Highly competent
      - Competent
      - Developing
      - Needs improvement
      - Not applicable
      required: false
    - id: 19
      name: dementia_training_need
      label: Dementia Care Training Need
      hint: Would you like training in this area?
      type: select_one
      options:
      - Yes - definitely
      - Yes - some areas
      - Maybe - open to training
      - No - competent already
      - N/A - not relevant
      required: false
    - id: 20
      name: priority_training_topics
      label: Priority Training Topics
      hint: Select your top 3 training needs
      type: select_multiple
      options:
      - Personal care techniques
      - Mobility and transfers
      - Medication management
      - Dementia care
      - Communication skills
      - Infection control
      - Safety procedures
      - Cultural competence
      - Emotional support
      - Technology skills
      - Time management
      - Professional boundaries
      required: true
    - id: 21
      name: preferred_learning_format
      label: Preferred Learning Format
      hint: How do you learn best?
      type: select_one
      options:
      - Hands-on demonstrations
      - In-person workshops
      - Online courses
      - One-on-one coaching
      - Group discussions
      - Video training
      - Reading materials
      - Combination of methods
      required: true
    - id: 22
      name: time_availability_training
      label: Time Available for Training
      hint: How much time can you dedicate?
      type: select_one
      options:
      - During work hours
      - After work hours
      - Weekends
      - Flexible
      - Limited availability
      required: true
    - id: 23
      name: barriers_to_learning
      label: Barriers to Professional Development
      hint: What prevents training participation?
      type: text
      options: []
      required: false
    - id: 24
      name: career_goals
      label: Career Goals and Development Plans
      hint: Where do you want your career to go?
      type: text
      options: []
      required: false
    - id: 25
      name: additional_needs
      label: Additional Learning or Support Needs
      hint: Any other skills or support needed?
      type: text
      options: []
      required: false
