inputSchema:
  type: object
  properties:
    title: Art Gallery Visitor Preference Check In
    pages:
    - id: 1
      name: visitor_checkin_header
      label: -- Welcome - Quick Check-in --
      hint: Let us know what you love about art!
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: visitor_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: visitor_preferences_header
      label: -- Your Artistic Interests --
      hint: Select the styles you enjoy most
      type: note
      options: []
      required: false
    - id: 5
      name: preferred_mediums
      label: Preferred Art Mediums
      hint: Select all that apply
      type: select_multiple
      options:
      - Painting (Oil - Acrylic)
      - Photography
      - Sculpture - 3D Art
      - Digital - New Media
      - Sketching - Illustration
      - Installations
      required: true
    - id: 6
      name: artistic_styles
      label: Which styles resonate with you?
      hint: null
      type: select_multiple
      options:
      - Abstract
      - Impressionism
      - Surrealism
      - Pop Art
      - Minimalist
      - Classical - Realism
      required: true
    - id: 7
      name: frequency_of_visits
      label: How often do you visit art galleries?
      hint: null
      type: select_one
      options:
      - This is my first time
      - Once or twice a year
      - Every few months
      - Monthly
      - I am an art professional
      required: true
    - id: 8
      name: notification_preferences_header
      label: -- Updates and Invitations --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: receive_opening_invites
      label: Would you like to receive invitations to VIP exhibition openings?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: workshop_interest
      label: Are you interested in participating in art workshops?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Send more info
      required: true
    - id: 11
      name: preferred_contact_method
      label: How would you like us to contact you?
      hint: null
      type: select_one
      options:
      - Email
      - SMS - Text
      - WhatsApp
      - Do not contact me
      required: true
    - id: 12
      name: visitor_zip_code
      label: Zip - Postal Code
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: check_in_timestamp
      label: Check-in Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: additional_notes
      label: Anything else you want us to know?
      hint: null
      type: text
      options: []
      required: false
