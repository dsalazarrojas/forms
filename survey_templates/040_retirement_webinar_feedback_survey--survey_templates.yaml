inputSchema:
  type: object
  properties:
    title: Retirement Webinar Feedback Survey
    pages:
    - id: 1
      name: retirement_webinar_feedback_survey
      label: How did you like the webinar?
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: speaker_presentation
      label: What did you think of the speaker's presentation?
      hint: null
      type: select_multiple
      options:
      - Engaging and informative
      - Too long
      - Not engaging
      - None of the above
      - Other (please specify)
      required: true
    - id: 3
      name: content_relevance
      label: How did you feel about the content?
      hint: null
      type: select_one
      options:
      - Very relevant
      - Somewhat relevant
      - Not very relevant
      - Not at all relevant
      required: true
    - id: 4
      name: future_events
      label: Are you interested in future retirement events?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: feedback
      label: Additional feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 8
      name: name
      label: Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 9
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: role
      label: Role
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
