inputSchema:
  type: object
  properties:
    title: Agent Information Survey
    pages:
    - id: 1
      name: header
      label: -- Agent Profile and Information Survey --
      hint: maintaining accurate records for all agency members
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: joining_date
      label: Joining Date
      hint: date you started with the agency
      type: date
      options: []
      required: true
    - id: 4
      name: official_email
      label: Official Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Primary Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: skills_header
      label: -- Skills and Specialties --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: language_proficiency
      label: Language Proficiency - English, Spanish, French, Mandarin, etc.
      hint: select all languages you can conduct business in
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      - Mandarin
      - German
      - Arabic
      - Portuguese
      required: true
    - id: 8
      name: primary_expertise
      label: Primary Area of Expertise
      hint: your main focus area
      type: select_one
      options:
      - Residential Sales
      - Commercial Leasing
      - Investment Portfolios
      - Luxury Estates
      - Property Management
      required: true
    - id: 9
      name: certifications
      label: Relevant certifications or qualifications
      hint: e.g., CFA, CPA, REALTOR
      type: text
      options: []
      required: false
    - id: 10
      name: work_schedule
      label: Current Work Schedule - Full-time, Part-time, Contract
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract / Freelance
      - Internship
      required: true
    - id: 11
      name: previous_experience
      label: Previous industry experience
      hint: summarize your professional background
      type: text
      options: []
      required: false
    - id: 12
      name: software_mastery
      label: Software tools mastered - CRM, ERP, CMS
      hint: select tools you are proficient in
      type: select_multiple
      options:
      - Salesforce CRM
      - HubSpot
      - Microsoft Dynamics
      - WordPress / CMS
      - Adobe Creative Suite
      - Google Analytics
      required: false
    - id: 13
      name: emergency_contact
      label: Emergency Contact Information
      hint: Name, Relation, and Phone
      type: text
      options: []
      required: true
