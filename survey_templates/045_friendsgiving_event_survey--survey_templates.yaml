inputSchema:
  type: object
  properties:
    title: Friendsgiving Event Survey
    pages:
    - id: 1
      name: form_1
      label: Guest Feedback
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      required: false
    - id: 2
      name: form_2
      label: How would you rate the food?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: form_3
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: form_4
      label: What did you enjoy most about the event?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_5
      label: What did you enjoy least about the event?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: form_6
      label: Would you attend the same event again?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 7
      name: form_7
      label: How likely are you to recommend this event?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Not Likely
      required: false
    - id: 8
      name: form_8
      label: Will you attend next year's Friendsgiving Event?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
