inputSchema:
  type: object
  properties:
    title: Footwear Customer Satisfaction Survey
    pages:
    - id: 1
      name: product_purchaser
      label: Product Purchaser
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: rating_of_satisfaction
      label: rating of satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: rating_of_quality
      label: rating of quality
      hint: null
      type: select_one
      options:
      - '{''value'': ''Excellent''}'
      - '{''value'': ''Good''}'
      - '{''value'': ''Fair''}'
      - '{''value'': ''Poor''}'
      required: true
    - id: 4
      name: rating_of_value_for_money
      label: rating of value for money
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: recommend_product
      label: recommend product
      hint: null
      type: select_one
      options:
      - '{''value'': True}'
      - '{''value'': False}'
      required: true
    - id: 6
      name: purchase_intent
      label: purchase intent
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Definitely Will Purchase''}'
      - '{''value'': ''Probably Will Purchase''}'
      - '{''value'': ''Not Sure''}'
      - '{''value'': ''Definitely Will Not Purchase''}'
      required: true
    - id: 7
      name: feedback
      label: feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: email address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: date_of_purchase
      label: date of purchase
      hint: null
      type: date
      options: []
      required: true
