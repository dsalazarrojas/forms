inputSchema:
  type: object
  properties:
    title: Accessibility Barriers In Public Spaces Survey
    pages:
    - id: 1
      name: section_location
      label: -- Location and Context --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: space_name
      label: Name of the Public Space or Facility
      hint: e.g. Central Park, Main Street Library
      type: text
      options: []
      required: true
    - id: 3
      name: space_address
      label: Address or Location of the Space
      hint: Provide enough detail for identifying the site
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_visit
      label: Date of Visit
      hint: When the barrier was observed
      type: date
      options: []
      required: true
    - id: 5
      name: section_eval
      label: -- Accessibility Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: barriers_observed
      label: Select any accessibility barriers you observed
      hint: check all that apply
      type: select_multiple
      options:
      - Uneven Sidewalks
      - Lack of Ramps
      - Heavy Doors
      - No Tactile Paving
      - Narrow Entrances
      - Inaccessible Restrooms
      - Poor Lighting
      required: true
    - id: 7
      name: ease_of_navigation
      label: How easy was it to navigate the space?
      hint: overall mobility check
      type: select_one
      options:
      - Very Easy
      - Average
      - Difficult
      - Impossible
      required: true
    - id: 8
      name: signage_adequacy
      label: Were there clear signs for accessible routes?
      hint: visual guidance
      type: select_one
      options:
      - Yes - Very Clear
      - Some Signs
      - No Signs Found
      required: true
    - id: 9
      name: section_needs
      label: -- Specific Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: user_perspective
      label: Your perspective
      hint: Helps us understand the feedback context
      type: select_one
      options:
      - User with Physical Disability
      - User with Visual Impairment
      - Parent with Stroller
      - Senior Citizen
      - Concerned Citizen
      required: true
    - id: 11
      name: specific_incident_description
      label: Describe a specific barrier or incident in detail
      hint: What happened and where?
      type: text
      options: []
      required: true
    - id: 12
      name: section_recs
      label: -- Recommendations --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: suggested_improvements
      label: What improvements would be most helpful?
      hint: choose key priorities
      type: select_multiple
      options:
      - Install Ramps
      - Add Automatic Doors
      - Improve Signage
      - Add Braille Labels
      - Repair Pavement
      - Install Handrails
      required: true
    - id: 14
      name: other_comments
      label: Any other feedback for improvement
      hint: optional thoughts
      type: text
      options: []
      required: false
    - id: 15
      name: section_rating
      label: -- Overall Rating --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: overall_accessibility_rating
      label: Rate the overall accessibility of this space 1-10
      hint: 10 is fully inclusive
      type: number
      options: []
      required: true
    - id: 17
      name: follow_up_permission
      label: May the planning committee contact you for more info?
      hint: optional permission
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
