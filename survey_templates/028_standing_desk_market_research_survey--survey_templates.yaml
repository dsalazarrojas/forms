inputSchema:
  type: object
  properties:
    title: standing_desk_market_research_survey
    pages:
    - id: 1
      name: standing_desk_adoption
      label: Have you ever used a standing desk?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: standing_desk_purpose
      label: Why do you use or want to use a standing desk?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: desk_type
      label: What type of standing desk do you have or would you want to have?
      hint: null
      type: select_multiple
      options:
      - Standup desk
      - Sit-stand desk
      - Manual adjustable desk
      - Other (please specify)
      required: false
    - id: 4
      name: company_size
      label: How many employees does your company have?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: buying_intent
      label: How likely are you to buy a standing desk in the next 6 months?
      hint: On a scale of 0-10
      type: number
      options: []
      required: false
    - id: 6
      name: budget
      label: What is your budget for a standing desk?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: ergonomic_features
      label: What ergonomic features do you consider important?
      hint: null
      type: select_multiple
      options:
      - Backrest adjustment
      - Armrests
      - Cable management
      - Other (please specify)
      required: false
    - id: 8
      name: height_adjustment
      label: Does your standing desk have height adjustment?
      hint: null
      type: select_multiple
      options:
      - Height adjustment
      - No height adjustment
      required: false
    - id: 9
      name: sit_stand_height
      label: On average, how much time do you spend sitting on your standing desk?
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: stand_time
      label: On average, how much time do you spend standing on your standing desk?
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: preferred_height
      label: What is your preferred height for standing while working?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: work_surface
      label: What type of surface do you prefer on your standing desk?
      hint: null
      type: select_multiple
      options:
      - Standup surface
      - Sit-stand surface
      - Other (please specify)
      required: false
    - id: 13
      name: sit_stand_ratio
      label: How often do you use your standing desk?
      hint: null
      type: select_multiple
      options:
      - All day
      - Some of the time
      - Rarely
      - Never
      required: false
    - id: 14
      name: purchase_reason
      label: What motivated you to get a standing desk?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: recommended_by
      label: Were you recommended a standing desk by a colleague, friend, or family
        member?
      hint: null
      type: select_multiple
      options:
      - Colleague
      - Friend
      - Family member
      - Online search
      - Social media
      - Other (please specify)
      required: false
    - id: 16
      name: other_info
      label: Is there anything else you'd like to share about your standing desk experience?
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: follow_up
      label: Would you be open to follow-up questions or discussions about your standing
        desk experience?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 18
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 19
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: comments
      label: Any additional comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: other
      label: Any other information?
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: survey_comments
      label: Any other comments or feedback?
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: survey_suggestions
      label: Do you have any suggestions for improving this survey?
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: company_website
      label: What is your company website?
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: company_social_media
      label: What is your company social media presence?
      hint: null
      type: text
      options: []
      required: false
