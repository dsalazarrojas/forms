inputSchema:
  type: object
  properties:
    title: Sales Period Selection Form
    pages:
    - id: 1
      name: sales_period_selection_form
      label: Sales Period
      hint: Select the sales period for this survey.
      type: select_multiple
      options:
      - First Quarter
      - Second Quarter
      - Third Quarter
      - Fourth Quarter
      required: true
    - id: 2
      name: sales_period_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: sales_period_end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: sales_period_consent
      label: Do you consent to the terms and conditions?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 5
      name: sales_period_additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
