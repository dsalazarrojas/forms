inputSchema:
  type: object
  properties:
    title: defect_type_selection_survey
    pages:
    - id: 1
      name: defect_type
      label: Defect Type
      hint: null
      type: select_one
      options:
      - crack
      - dimple
      - indent
      - laceration
      - puncture
      required: true
    - id: 2
      name: defect_location
      label: Defect Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: defect_pattern
      label: Defect Pattern
      hint: null
      type: select_multiple
      options:
      - random
      - systemic
      - human
      - unknown
      required: true
    - id: 4
      name: severity
      label: Severity
      hint: null
      type: select_one
      options:
      - low
      - medium
      - high
      required: true
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: date_reported
      label: Date Reported
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: time_reported
      label: Time Reported
      hint: null
      type: time
      options: []
      required: true
    - id: 13
      name: time_in_minutes
      label: Time in Minutes
      hint: null
      type: number
      options: []
      required: false
