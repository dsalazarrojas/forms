inputSchema:
  type: object
  properties:
    title: vaccination_schedule_inquiry_form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: vaccination_history
      label: Vaccination History
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: schedule_date
      label: Schedule Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: schedule_time
      label: Schedule Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Other
      required: true
    - id: 8
      name: schedule_method
      label: Schedule Method
      hint: null
      type: select_one
      options:
      - In-clinic
      - Phone
      - Email
      - Other
      required: true
    - id: 9
      name: schedule_method_other
      label: Schedule Method Other
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: schedule_reminders
      label: Schedule Reminders
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Only if needed
      required: true
    - id: 11
      name: follow_up_reminders
      label: Follow-up Reminders
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
