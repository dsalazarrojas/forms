inputSchema:
  type: object
  properties:
    title: Continuing Education Evaluation Form
    pages:
    - id: 1
      name: evaluation_intro_header
      label: -- Course Evaluation --
      hint: Share your feedback to help us improve our educational offerings
      type: note
      options: []
      required: false
    - id: 2
      name: course_title_evaluated
      label: Course Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: ratings_section_header
      label: -- Content and Delivery Ratings --
      hint: 1 = Strongly Disagree, 5 = Strongly Agree
      type: note
      options: []
      required: false
    - id: 5
      name: rating_content_relevance
      label: The course content was relevant to my professional goals
      hint: null
      type: select_one
      options:
      - 1 - Strongly Disagree
      - 2 - Disagree
      - 3 - Neutral
      - 4 - Agree
      - 5 - Strongly Agree
      required: true
    - id: 6
      name: rating_instructor_effectiveness
      label: The instructor was knowledgeable and effective
      hint: null
      type: select_one
      options:
      - 1 - Strongly Disagree
      - 2 - Disagree
      - 3 - Neutral
      - 4 - Agree
      - 5 - Strongly Agree
      required: true
    - id: 7
      name: rating_course_materials
      label: The materials and resources provided were helpful
      hint: null
      type: select_one
      options:
      - 1 - Strongly Disagree
      - 2 - Disagree
      - 3 - Neutral
      - 4 - Agree
      - 5 - Strongly Agree
      required: true
    - id: 8
      name: qualitative_feedback_header
      label: -- Detailed Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: key_takeaway_lesson
      label: What was the most valuable part of this course
      hint: Describe one key concept or skill you learned
      type: text
      options: []
      required: true
    - id: 10
      name: improvements_needed
      label: What is one thing that could be improved
      hint: e.g., Pace, specific topic, technical platform
      type: text
      options: []
      required: false
    - id: 11
      name: technical_platform_experience
      label: Rate your experience with the learning platform (LMS)
      hint: Ease of use and access
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: recommend_to_others
      label: Would you recommend this course to a colleague
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Probably
      - false
      required: true
    - id: 13
      name: additional_comments_evaluation
      label: Any additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: evaluation_date
      label: Date of Feedback
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: net_promoter_score_course
      label: Overall Rating of the Program (0-10)
      hint: null
      type: number
      options: []
      required: true
