inputSchema:
  type: object
  properties:
    title: Nail Salon Hygiene Standards Awareness Survey
    pages:
    - id: 1
      name: survey_title
      label: How do you rate our cleanliness?
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: cleanliness_scores
      label: Rate the cleanliness of the salon
      hint: null
      type: select_multiple
      options:
      - Very Clean
      - Clean
      - Somewhat Clean
      - Not Clean
      - Very Unclean
      required: false
    - id: 3
      name: safety_score
      label: Rate the safety practices of the salon
      hint: null
      type: select_one
      options:
      - Very Safe
      - Somewhat Safe
      - Not Safe
      - Very Uncertain
      required: false
    - id: 4
      name: staff_wellness_scores
      label: How often do you interact with the staff?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Rarely
      - Never
      required: false
    - id: 5
      name: overall_satisfaction
      label: How would you rate your overall satisfaction?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 6
      name: time_spent_in_salon
      label: How often do you visit this salon?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Weekly
      - Rarely
      required: false
    - id: 7
      name: comments
      label: Any comments or suggestions?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
