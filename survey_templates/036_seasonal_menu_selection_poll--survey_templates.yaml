inputSchema:
  type: object
  properties:
    title: Seasonal Menu Selection Poll
    pages:
    - id: 1
      name: seasonal_menu_selection_page_1
      label: Seasonal Menu Selection
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: seasonal_menu_selection_page_2
      label: What is your favorite seasonal menu item?
      hint: null
      type: select_one
      options:
      - item 1
      - item 2
      required: false
    - id: 3
      name: seasonal_menu_selection_page_3
      label: Which time of year do you prefer?
      hint: null
      type: select_one
      options:
      - Spring
      - Summer
      - Fall
      required: false
    - id: 4
      name: seasonal_menu_selection_page_4
      label: Do you prefer sweet or savory flavors?
      hint: null
      type: select_one
      options:
      - Sweet
      - Savory
      - Other
      required: false
    - id: 5
      name: seasonal_menu_selection_page_5
      label: Which cooking method do you prefer?
      hint: null
      type: select_one
      options:
      - Grilled
      - Baked
      - Fried
      required: false
    - id: 6
      name: seasonal_menu_selection_page_6
      label: Do you have any dietary restrictions?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: seasonal_menu_selection_page_7
      label: What is your favorite ingredient?
      hint: null
      type: select_one
      options:
      - item 1
      - item 2
      required: false
    - id: 8
      name: seasonal_menu_selection_page_8
      label: Do you prefer meat or vegetarian/vegan options?
      hint: null
      type: select_one
      options:
      - Meat
      - Vegetarian
      - Vegan
      required: false
    - id: 9
      name: seasonal_menu_selection_page_9
      label: Which cuisine do you prefer?
      hint: null
      type: select_one
      options:
      - Italian
      - Mexican
      - Chinese
      required: false
    - id: 10
      name: seasonal_menu_selection_page_10
      label: How often do you visit the menu?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 11
      name: seasonal_menu_selection_page_11
      label: What is your budget for the menu?
      hint: null
      type: select_one
      options:
      - $10-$20
      - $20-$30
      - $30-$40
      - $40+
      required: false
    - id: 12
      name: seasonal_menu_selection_page_12
      label: Any additional comments?
      hint: null
      type: note
      options: []
      required: false
