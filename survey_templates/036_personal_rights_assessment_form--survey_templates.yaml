inputSchema:
  type: object
  properties:
    title: Personal Rights Assessment Form
    pages:
    - id: 1
      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: right_of_discovery
      label: Right of Discovery
      hint: null
      type: select_multiple
      options:
      - I have the right to make choices about my own data.
      - I know where my data is stored.
      - I understand the purposes and processes for which my data is used.
      - I know who has access to my data.
      - I know how to correct my own data when it is wrong or out of date.
      - I understand the consequences of not having control over my data.
      - I know the procedures for requesting to delete or correct my data.
      required: false
    - id: 3
      name: right_of_access
      label: Right of Access
      hint: null
      type: select_multiple
      options:
      - I can access and see my own data when I want.
      - My data is available to me at all times.
      - I have access to my data in a timely manner.
      - I can access my data in different formats (e.g., CSV, PDF).
      - I am notified when changes are made to my data.
      - I can access my data offline or online.
      required: false
