      name: streaming_service_preference
      label: Preferred Streaming Platforms
      hint: Select your primary sources for films
      type: select_multiple
      options:
      - Netflix
      - HBO Max
      - Disney+
      - Amazon Prime Video
      - Hulu
      - Apple TV+
      - Movie Theater (Cinema)
      - Criterion Channel
      required: false
    - id: 18
      name: movie_recommendation_text
      label: Any specific movies you would like to recommend
      hint: Share your favorites with the group
      type: text
      options: []
      required: false
    - id: 19
      name: movie_fan_contact_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: movie_fan_email
