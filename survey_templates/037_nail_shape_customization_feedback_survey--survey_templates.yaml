inputSchema:
  type: object
  properties:
    title: Nail Shape Customization Feedback Survey
    pages:
    - id: 1
      name: nail_shape_customization_form
      label: Nail Shape Customization Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: preferred_nail_shape
      label: Preferred Nail Shape
      hint: None
      type: select_multiple
      options:
      - Almond
      - Square
      - Round
      - Oval
      - Bell Shaped
      required: false
    - id: 3
      name: shape_satisfaction
      label: How would you rate your satisfaction with current nail shape?
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: false
    - id: 4
      name: shape_recommendations
      label: What shape would you like to see offered next?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
