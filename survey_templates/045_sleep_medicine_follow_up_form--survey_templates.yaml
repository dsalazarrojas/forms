inputSchema:
  type: object
  properties:
    title: Sleep Medicine Follow Up Form
    pages:
    - id: 1
      name: patient_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: sleep_difficulty
      label: Sleep Difficulty
      hint: null
      type: select_one
      options:
      - Mild
      - Moderate
      - Severe
      required: true
    - id: 4
      name: sleep_symptoms
      label: Sleep Symptoms
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: sleep_diagnosis
      label: Sleep Diagnosis
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: treatment_progress
      label: Treatment Progress
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: treatment_effectiveness
      label: Treatment Effectiveness
      hint: null
      type: select_multiple
      options:
      - Effective
      - Ineffective
      - Neutral
      required: true
    - id: 8
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
