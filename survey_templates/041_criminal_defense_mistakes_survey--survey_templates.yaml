inputSchema:
  type: object
  properties:
    title: Criminal Defense Mistakes Survey
    pages:
    - id: 1
      name: survey_intro
      label: Survey Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: error_type
      label: Error Type
      hint: null
      type: select_one
      options:
      - Defense Attorney Error
      - Prosecutor Error
      - Judge Error
      - Police Officer Error
      - Other
      required: false
    - id: 3
      name: error_occurred
      label: Error Occurred
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: impact_on_case
      label: Impact on Case
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: cause_of_error
      label: Cause of Error
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: error_description
      label: Description of Error
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: prevention_strategies
      label: Prevention Strategies
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: suggestions_for_improvement
      label: Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
