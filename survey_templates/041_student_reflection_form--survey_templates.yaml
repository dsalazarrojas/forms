      - 2nd
      - 3rd
      - 4th
      - 5th
      - 6th
      - 7th
      - 8th
      - 9th
      - 10th
      - 11th
      - 12th
      required: true
    - id: 2
      name: current_class
      label: what_class_are_you_in
