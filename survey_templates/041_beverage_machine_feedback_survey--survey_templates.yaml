inputSchema:
  type: object
  properties:
    title: Beverage Machine Feedback Survey
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Enter your name
        type: text
        options: []
        required: true
      - id: 2
        name: respondent_email
        label: Email Address
        hint: For follow-up if needed
        type: email
        options: []
        required: false
      - id: 3
        name: department
        label: Department
        hint: Which department do you work in
        type: text
        options: []
        required: true
      - id: 4
        name: location
        label: Office Location
        hint: Which office or floor is your machine on
        type: text
        options: []
        required: true
      - id: 5
        name: machine_type
        label: Machine Type
        hint: What type of beverage machine do you use
        type: select_one
        options:
          - Coffee Machine
          - Espresso Machine
          - Soda Machine
          - Water Dispenser
          - Juice Machine
          - Tea Machine
          - Combination Machine
        required: true
      - id: 6
        name: usage_frequency
        label: Usage Frequency
        hint: How often do you use the machine
        type: select_one
        options:
          - Multiple times daily
          - Once daily
          - Several times a week
          - Once a week
          - Rarely
        required: true
      - id: 7
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall satisfaction with the machine
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Somewhat Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 8
        name: beverage_quality
        label: Beverage Quality
        hint: Rate the quality of beverages produced
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: machine_cleanliness
        label: Machine Cleanliness
        hint: Rate the cleanliness of the machine
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: ease_of_use
        label: Ease of Use
        hint: How easy is the machine to operate
        type: select_one
        options:
          - Very Easy
          - Easy
          - Neutral
          - Somewhat Difficult
          - Very Difficult
        required: true
      - id: 11
        name: reliability
        label: Machine Reliability
        hint: How reliable is the machine
        type: select_one
        options:
          - Very Reliable
          - Reliable
          - Neutral
          - Somewhat Unreliable
          - Very Unreliable
        required: true
      - id: 12
        name: variety_rating
        label: Beverage Variety Rating
        hint: Rate the variety of beverage options
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 13
        name: common_issues
        label: Common Issues Encountered
        hint: What problems do you experience
        type: select_multiple
        options:
          - Machine Out of Order
          - Runs Out of Supplies
          - Poor Taste
          - Slow Service
          - Leaking
          - Dirty
          - Payment Issues
          - None
          - Other
        required: true
      - id: 14
        name: maintenance_responsiveness
        label: Maintenance Responsiveness
        hint: How quickly are issues addressed
        type: select_one
        options:
          - Very Responsive
          - Responsive
          - Neutral
          - Slow
          - Very Slow
          - Not Applicable
        required: false
      - id: 15
        name: preferred_beverages
        label: Your Preferred Beverages
        hint: What do you usually order from this machine
        type: select_multiple
        options:
          - Black Coffee
          - Coffee with Cream
          - Latte
          - Cappuccino
          - Espresso
          - Tea
          - Hot Chocolate
          - Soda
          - Water
          - Juice
        required: false
      - id: 16
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: What would make this machine better
        type: text
        options: []
        required: true
      - id: 17
        name: additional_beverages
        label: Additional Beverages Desired
        hint: What beverages would you like to see added
        type: text
        options: []
        required: false
      - id: 18
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback about the beverage machine
        type: text
        options: []
        required: false
