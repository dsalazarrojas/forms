inputSchema:
  type: object
  properties:
    title: Warm Up Sizes Survey
    pages:
    - id: 1
      name: home_page
      label: Home Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: sizes_page
      label: Warm Up Sizes
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: sizes_question
      label: What is your size?
      hint: Select your warm up size below
      type: select_one
      options:
      - 4XL
      - 5XL
      - 6XL
      - 7XL
      required: false
    - id: 4
      name: fit_preferences
      label: Fit Preferences
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: fit_preferences_question
      label: Do you prefer a loose or fitted fit?
      hint: Select your fit preference
      type: select_one
      options:
      - Loose
      - Fitted
      required: false
    - id: 6
      name: contact_details_page
      label: Contact Details
      hint: null
      type: note
      options: []
      required: false
