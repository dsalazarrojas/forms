inputSchema:
  type: object
  properties:
    title: Community Health Program Evaluation Form
    pages:
      - id: 1
        name: evaluator_info
        label: -- Evaluator Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: evaluator_name
        label: Your Full Name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 3
        name: evaluator_role
        label: Your Role in the Program
        hint: null
        type: select_one
        options:
          - Participant
          - Program Staff
          - Volunteer
          - Community Stakeholder
          - Partner Organization
        required: true
      - id: 4
        name: program_evaluation
        label: -- Program Content and Impact --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: goal_clarity
        label: Clarity of program goals and objectives
        hint: null
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 6
        name: resource_quality
        label: Quality of educational resources provided
        hint: Materials, handouts, etc.
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 7
        name: community_impact
        label: Impact on community health knowledge and behavior
        hint: How effective was the program?
        type: text
        options: []
        required: true
      - id: 8
        name: delivery_efficiency
        label: Efficiency of program delivery and logistics
        hint: null
        type: select_one
        options:
          - High
          - Medium
          - Low
        required: true
      - id: 9
        name: challenges_encountered
        label: Major challenges faced during the program
        hint: null
        type: text
        options: []
        required: false
      - id: 10
        name: success_stories
        label: Success stories or program highlights
        hint: null
        type: text
        options: []
        required: false
      - id: 11
        name: future_recommendations
        label: Recommendations for future health programs
        hint: null
        type: text
        options: []
        required: false
      - id: 12
        name: overall_rating
        label: Overall Rating of the Health Program
        hint: 1 Star to 5 Stars
        type: select_one
        options:
          - 1 Star
          - 2 Stars
          - 3 Stars
          - 4 Stars
          - 5 Stars
        required: true
