inputSchema:
  type: object
  properties:
    title: Winter Illumination Voting Survey
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: display_type
      label: Will you be attending the Winter Illumination event?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: photo_credit
      label: Do you have a photo credit for the event?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: rating_1
      label: How would you rate the event's display quality (good)?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: false
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: suggestion
      label: Suggestion
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: display_type_2
      label: Will you be displaying your name at the event?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: event_name
      label: Event name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: event_date
      label: Event date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: event_time
      label: Event time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: display_location
      label: Where will the event be held?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: other
      label: Other
      hint: null
      type: text
      options: []
      required: false
