inputSchema:
  type: object
  properties:
    title: Market Research Questionnaire
    pages:
    - id: 1
      name: demographics
      label: What is your age?
      hint: Please enter your age
      type: number
      options: []
      required: true
    - id: 2
      name: product_use
      label: How long have you been using our product?
      hint: Select one of the following options
      type: select_multiple
      options:
      - Less than 1 month
      - 1-3 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: false
    - id: 3
      name: product_ranking
      label: How do you rate our current product offerings?
      hint: Select one of the following options
      type: select_one
      options:
      - 1 (Poor)
      - 2 (Fair)
      - 3 (Good)
      - 4 (Excellent)
      required: false
    - id: 4
      name: market_trends
      label: How much do you know about market trends in the industry?
      hint: This is a text field for you to enter any relevant information
      type: text
      options: []
      required: false
    - id: 5
      name: recent_purchase
      label: Have you recently purchased a similar product?
      hint: Select one of the following options
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: product_attributes
      label: Which product attributes are most important to you?
      hint: Select all that apply
      type: select_multiple
      options:
      - Price
      - Quality
      - Performance
      - Design
      - Brand
      required: false
    - id: 7
      name: customer_service
      label: How do you rate our customer service?
      hint: Select one of the following options
      type: select_one
      options:
      - 1 (Poor)
      - 2 (Fair)
      - 3 (Good)
      - 4 (Excellent)
      required: false
    - id: 8
      name: competitors
      label: Who are the top 3 competitors in the market?
      hint: Please enter the names of the top 3 competitors separated by commas
      type: text
      options: []
      required: false
    - id: 9
      name: purchasing_factors
      label: What are the key factors that influence your purchasing decisions?
      hint: Please enter any relevant information in this text field
      type: text
      options: []
      required: false
    - id: 10
      name: product_usage
      label: How often do you use our product?
      hint: Select one of the following options
      type: select_multiple
      options:
      - Never
      - Occasionally
      - Frequently
      - Almost Daily
      required: false
    - id: 11
      name: product_impressions
      label: What are your impressions of our product?
      hint: Please enter your impressions in this text field
      type: text
      options: []
      required: false
    - id: 12
      name: feedback
      label: Do you have any feedback or suggestions for our company?
      hint: Please enter any feedback or suggestions you may have
      type: text
      options: []
      required: false
