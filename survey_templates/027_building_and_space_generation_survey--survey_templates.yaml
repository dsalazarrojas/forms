inputSchema:
  type: object
  properties:
    title: Building and Space Generation Survey
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Full name
        type: text
        options: []
        required: false
      - id: 2
        name: department
        label: Department
        hint: Your department
        type: text
        options: []
        required: true
      - id: 3
        name: role
        label: Your Role
        hint: Job title
        type: text
        options: []
        required: true
      - id: 4
        name: email
        label: Email Address
        hint: Contact email
        type: email
        options: []
        required: true
      - id: 5
        name: survey_date
        label: Survey Date
        hint: Date of survey
        type: date
        options: []
        required: true
      - id: 6
        name: building_name
        label: Building Name
        hint: Which building
        type: text
        options: []
        required: true
      - id: 7
        name: floor_level
        label: Floor Level
        hint: Your primary floor
        type: text
        options: []
        required: true
      - id: 8
        name: workspace_type
        label: Workspace Type
        hint: Your work area
        type: select_one
        options:
          - Private Office
          - Shared Office
          - Cubicle
          - Open Desk
          - Hot Desk
          - Remote
          - Laboratory
          - Workshop
        required: true
      - id: 9
        name: space_satisfaction
        label: Space Satisfaction
        hint: How satisfied with your space
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 10
        name: space_size
        label: Space Size Adequacy
        hint: Is your space the right size
        type: select_one
        options:
          - Too Large
          - Slightly Large
          - Just Right
          - Slightly Small
          - Too Small
        required: true
      - id: 11
        name: lighting_quality
        label: Lighting Quality
        hint: Rate the lighting
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 12
        name: temperature_comfort
        label: Temperature Comfort
        hint: Rate temperature control
        type: select_one
        options:
          - Very Comfortable
          - Comfortable
          - Neutral
          - Uncomfortable
          - Very Uncomfortable
        required: true
      - id: 13
        name: ventilation_quality
        label: Ventilation Quality
        hint: Rate air quality
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 14
        name: noise_level
        label: Noise Level
        hint: Rate noise conditions
        type: select_one
        options:
          - Very Quiet
          - Quiet
          - Moderate
          - Noisy
          - Very Noisy
        required: true
      - id: 15
        name: privacy_level
        label: Privacy Level
        hint: Rate your privacy
        type: select_one
        options:
          - Very Private
          - Private
          - Moderate
          - Limited Privacy
          - No Privacy
        required: true
      - id: 16
        name: storage_adequacy
        label: Storage Adequacy
        hint: Is there enough storage
        type: select_one
        options:
          - More Than Enough
          - Adequate
          - Somewhat Limited
          - Very Limited
          - No Storage
        required: true
      - id: 17
        name: collaboration_spaces
        label: Collaboration Spaces
        hint: Availability of meeting areas
        type: select_one
        options:
          - More Than Enough
          - Adequate
          - Somewhat Limited
          - Very Limited
          - None Available
        required: true
      - id: 18
        name: common_areas
        label: Common Areas Quality
        hint: Break rooms, lounges
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
          - Not Available
        required: true
      - id: 19
        name: technology_infrastructure
        label: Technology Infrastructure
        hint: IT and connectivity
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 20
        name: accessibility_rating
        label: Accessibility Rating
        hint: Ease of access
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 21
        name: most_used_spaces
        label: Most Used Spaces
        hint: Where do you spend most time
        type: select_multiple
        options:
          - My Workspace
          - Meeting Rooms
          - Break Room
          - Collaboration Areas
          - Library/Quiet Zone
          - Outdoor Spaces
          - Reception Areas
          - Other
        required: true
      - id: 22
        name: underutilized_spaces
        label: Underutilized Spaces
        hint: Spaces rarely used
        type: text
        options: []
        required: false
      - id: 23
        name: improvement_priorities
        label: Improvement Priorities
        hint: What needs improvement most
        type: select_multiple
        options:
