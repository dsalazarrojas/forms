inputSchema:
  type: object
  properties:
    title: Library Digital Media Interest Poll
    pages:
    - id: 1
      name: public_libraries
      label: Public Libraries
      hint: null
      type: select_one
      options:
      - Public Libraries
      - School Libraries
      - Academic Libraries
      - Specialized Libraries
      - Other (please specify) - please describe
      required: false
    - id: 2
      name: digital_media_types
      label: Digital Media Types
      hint: null
      type: select_multiple
      options:
      - Movies
      - Music
      - Podcasts
      - Audiobooks
      - Ebooks
      - Digital Magazines
      - Digital Comics
      - Digital Newspapers
      - Other (please specify)
      required: false
    - id: 3
      name: how_often_use
      label: How Often Do You Use Digital Media?
      hint: null
      type: select_one
      options:
      - Never
      - Less Than Once a Week
      - A Few Times a Week
      - A Few Times a Month
      - Daily
      required: false
    - id: 4
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Not at All Satisfied
      - Slightly Satisfied
      - Somewhat Satisfied
      - Very Satisfied
      - Extremely Satisfied
      required: false
    - id: 5
      name: future_needs
      label: What Would You Like to See More of in Digital Media?
      hint: null
      type: select_multiple
      options:
      - Movies
      - Music
      - Podcasts
      - Audiobooks
      - Ebooks
      - Digital Magazines
      - Digital Comics
      - Digital Newspapers
      - Other (please specify)
      required: false
    - id: 6
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: workshop_interest
      label: Is There Interest in Future Workshops?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
