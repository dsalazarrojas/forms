inputSchema:
  type: object
  properties:
    title: Conference Exhibitor Interest Survey
    pages:
    - id: 1
      name: organization_name
      label: Organization name
      hint: Name of exhibitor or company
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact name
      hint: Primary exhibitor contact
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For follow up and contract details
      type: email
      options: []
      required: true
    - id: 4
      name: booth_interest
      label: Booth interest level
      hint: Size or location preference
      type: select_one
      options:
      - Standard booth
      - Corner booth
      - Premium booth
      - Table top
      required: true
    - id: 5
      name: display_requirements
      label: Display requirements
      hint: Power, internet, or other needs
      type: text
      options: []
      required: false
    - id: 6
      name: expected_leads
      label: Expected number of leads
      hint: Anticipated leads from the event
      type: number
      options: []
      required: false
    - id: 7
      name: sponsorship_interest
      label: Interest in sponsorship
      hint: Level of interest in sponsorship packages
      type: select_one
      options:
      - Interested
      - Maybe
      - Not interested
      required: false
    - id: 8
      name: marketing_materials
      label: Marketing materials to provide
      hint: Brochures, samples, or digital assets
      type: text
      options: []
      required: false
    - id: 9
      name: payment_contact
      label: Payment contact information
      hint: Billing contact for exhibitor fees
      type: text
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any further information for organizers
      type: text
      options: []
      required: false
