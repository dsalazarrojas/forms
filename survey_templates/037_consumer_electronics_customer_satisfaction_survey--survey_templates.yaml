        hint: Rate customer support if contacted
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
          - Did Not Contact
        required: false
      - id: 20
        name: issues_encountered
        label: Issues Encountered
        hint: Select any problems experienced
        type: select_multiple
        options:
          - None
