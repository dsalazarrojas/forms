          - Weekly
          - Monthly
          - Rarely
        required: true
      - id: 10
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall satisfaction
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
