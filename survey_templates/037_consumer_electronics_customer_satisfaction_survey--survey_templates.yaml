        name: customer_email
        label: Email Address
        hint: For follow-up - optional
        type: email
        options: []
        required: false
      - id: 3
        name: product_category
        label: Product Category
        hint: What type of product did you purchase
        type: select_one
        options:
          - Smartphone
          - Tablet
          - Laptop
          - Desktop Computer
          - Television
          - Audio Equipment
          - Gaming Console
          - Smart Home Device
          - Wearable
          - Camera
          - Other
        required: true
      - id: 4
        name: product_brand
        label: Product Brand
        hint: Brand of the product
        type: text
        options: []
        required: true
      - id: 5
        name: product_model
        label: Product Model
        hint: Model number or name
        type: text
        options: []
        required: false
      - id: 6
        name: purchase_date
        label: Purchase Date
        hint: When did you buy the product
        type: date
        options: []
        required: true
      - id: 7
        name: purchase_location
        label: Purchase Location
        hint: Where did you buy it
        type: select_one
        options:
          - Brand Website
          - Online Retailer
          - Electronics Store
          - Department Store
          - Warehouse Club
          - Mobile Carrier
          - Other
        required: true
