inputSchema:
  type: object
  properties:
    title: Website Interface Feedback Request Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: User Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: browser
      label: Browser
      hint: null
      type: select_one
      options:
      - Chrome
      - Firefox
      - Safari
      - Edge
      - Other
      required: false
    - id: 5
      name: device
      label: Device
      hint: null
      type: select_multiple
      options:
      - Desktop
      - Laptop
      - Tablet
      - Smartphone
      - Other
      required: false
    - id: 6
      name: operating_system
      label: Operating System
      hint: null
      type: select_one
      options:
      - Windows
      - Mac
      - Linux
      - Other
      required: false
    - id: 7
      name: comment
      label: Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
