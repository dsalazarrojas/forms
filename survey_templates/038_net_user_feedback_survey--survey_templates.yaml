inputSchema:
  type: object
  properties:
    title: Net User Feedback Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: feedback_question
      label: How do you feel about our service?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: issue
      label: Have you encountered any issues with our service?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: date_of_last_use
      label: Date of last use
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time_of_last_use
      label: Time of last use
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_feedback
      label: Additional feedback
      hint: null
      type: text
      options: []
      required: false
