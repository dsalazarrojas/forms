      type: text
      options: []
      required: false
    - id: 10
      name: form_collection_satisfaction_2
      label: Form Collection Satisfaction 2
      hint: Rate on a scale from 1 to 10
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: false
    - id: 11
      name: form_question_1
      label: Additional comments
      hint: Any additional comments about the collection?
      type: text
      options: []
      required: false
    - id: 12
      name: form_question_1_2
      label: Contact Information
      hint: Please provide your contact information for follow up
      type: text
      options: []
      required: false
