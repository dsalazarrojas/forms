inputSchema:
  type: object
  properties:
    title: New Collection Feedback Assessment Form
    pages:
    - id: 1
      name: form_title
      label: New Collection Feedback
      hint: Please provide a brief title for your feedback
      type: text
      options: []
      required: false
    - id: 2
      name: collection_name
      label: Collection Name
      hint: What is the name of the collection you are providing feedback on?
      type: text
      options: []
      required: false
    - id: 3
      name: collection_description
      label: Collection Description
      hint: Please provide a brief description of the collection
      type: text
      options: []
      required: false
    - id: 4
      name: what_did_you_think_of_when_you_saw_the_collection
      label: What did you think of when you saw the collection?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: what_did_you_like_most_about_the_collection
      label: What did you like most about the collection?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: what_did_you_like_least_about_the_collection
      label: What did you like least about the collection?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: form_collection_satisfaction
      label: Rate your satisfaction with the collection
      hint: Rate on a scale from 1 to 10
      type: select_one
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: false
    - id: 8
