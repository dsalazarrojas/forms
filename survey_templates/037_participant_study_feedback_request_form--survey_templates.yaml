inputSchema:
  type: object
  properties:
    title: Participant Study Feedback Request Form
    pages:
    - id: 1
      name: participant_study_feedback_request_form_1
      label: What did you find most enjoyable about our research sessions?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_study_feedback_request_form_2
      label: What topics would you like to see covered in future sessions?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participant_study_feedback_request_form_3
      label: How likely are you to recommend our research sessions to others?
      hint: null
      type: select_one
      options:
      - Strongly likely
      - Somewhat likely
      - Not very likely
      - Not at all likely
      required: false
    - id: 4
      name: participant_study_feedback_request_form_4
      label: What time of day do you usually prefer for our sessions?
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: participant_study_feedback_request_form_5
      label: How did you travel to our location?
      hint: null
      type: select_multiple
      options:
      - Drive
      - Walk
      - Public transportation
      required: false
    - id: 6
      name: participant_study_feedback_request_form_6
      label: How would you rate the parking at our location?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: participant_study_feedback_request_form_7
      label: How would you rate the comfort of our seating?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: participant_study_feedback_request_form_8
      label: Do you have any suggestions for improving our research sessions?
      hint: null
      type: text
      options: []
      required: false
