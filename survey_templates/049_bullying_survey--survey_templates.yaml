inputSchema:
  type: object
  properties:
    title: Bullying Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: When completing this survey
      type: date
      options: []
      required: true
    - id: 2
      name: respondent_age
      label: Your Age
      hint: Age or age range
      type: select_one
      options:
      - Under 10
      - 10-12
      - 13-15
      - 16-18
      - Over 18
      - Prefer Not to Say
      required: true
    - id: 3
      name: school_name
      label: School Name
      hint: Which school or organization
      type: text
      options: []
      required: true
    - id: 4
      name: grade_or_level
      label: Grade or Education Level
      hint: Your grade
      type: text
      options: []
      required: false
    - id: 5
      name: personal_experience
      label: Have You Experienced Bullying
      hint: Have you been bullied
      type: select_one
      options:
      - Yes, Multiple Times
      - Yes, Once
      - 'False'
      - Prefer Not to Say
      required: true
    - id: 6
      name: bullying_type_experienced
      label: Type of Bullying Experienced
      hint: What happened to you
      type: select_multiple
      options:
      - Physical Bullying
      - Verbal Insults
      - Social Exclusion
      - Cyberbullying
      - Rumors or Gossip
      - Threats
      - Sexual Harassment
      - Not Applicable
      required: false
    - id: 7
      name: bullying_impact
      label: How It Affected You
      hint: Emotional impact
      type: select_multiple
      options:
      - Sad or Depressed
      - Anxious or Scared
      - Angry
      - Ashamed or Embarrassed
      - No Significant Impact
      - Other
      required: false
    - id: 8
      name: witnessed_bullying
      label: Have You Witnessed Bullying
      hint: Seen others being bullied
      type: select_one
      options:
      - Yes, Multiple Times
      - Yes, Once
      - 'False'
      - Unsure
      required: true
    - id: 9
      name: witness_response
      label: What Did You Do When You Witnessed It
      hint: Your response
      type: select_one
      options:
      - Reported It to Adults
      - Supported the Victim
      - Did Nothing
      - Ignored It
      - Joined In
      - Not Applicable
      required: false
    - id: 10
      name: bullied_others
      label: Have You Ever Bullied Others
      hint: Been a bully yourself
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe Without Realizing
      - Prefer Not to Say
      required: true
    - id: 11
      name: school_safety
      label: Feel Safe at School
      hint: General safety feeling
      type: select_one
      options:
      - Very Safe
      - Mostly Safe
      - Somewhat Safe
      - Not Safe
      - Very Unsafe
      required: true
    - id: 12
      name: school_response
      label: How School Handles Bullying
      hint: School intervention efforts
      type: select_one
      options:
      - Very Effective
      - Effective
      - Somewhat Effective
      - Not Effective
      - Don't Know
      required: true
    - id: 13
      name: staff_awareness
      label: School Staff Aware of Bullying Issues
      hint: Do teachers notice
      type: select_one
      options:
      - Very Aware
      - Somewhat Aware
      - Not Very Aware
      - Not Aware
      required: true
    - id: 14
      name: reporting_process
      label: Easy to Report Bullying
      hint: Is process accessible
      type: select_one
      options:
      - Very Easy
      - Somewhat Easy
      - Difficult
      - Very Difficult
      required: true
    - id: 15
      name: trust_reporting
      label: Trust Report Will Be Handled Well
      hint: Confidence in reporting
      type: select_one
      options:
      - Very Confident
      - Somewhat Confident
      - Not Confident
      - Don't Know
      required: true
    - id: 16
      name: peer_support
      label: Peers Support Anti-Bullying Efforts
      hint: Student involvement
      type: select_one
      options:
      - Strongly Support
      - Support
      - Neutral
      - Oppose
      - Strongly Oppose
      required: true
    - id: 17
      name: improvement_suggestions
      label: Suggestions to Reduce Bullying
      hint: What would help
      type: text
      options: []
      required: false
    - id: 18
      name: support_services
      label: Need Mental Health Support
      hint: Counseling services
      type: select_one
      options:
      - Yes, Definitely
      - Maybe
      - 'False'
      - Don't Know Where to Find Help
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Any other thoughts
      type: text
      options: []
      required: false
