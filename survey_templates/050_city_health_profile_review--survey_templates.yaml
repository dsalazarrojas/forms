inputSchema:
  type: object
  properties:
    title: City Health Profile Review
    pages:
    - id: 1
      name: section_header_respondent
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Your Name (Optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - 18-25
      - 26-35
      - 36-45
      - 46-55
      - 56-65
      - 65+
      - Prefer not to say
      required: false
    - id: 5
      name: neighborhood
      label: Your Neighborhood
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_overall_health
      label: -- Overall City Health Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: overall_health_rating
      label: Overall Health of Our Community
      hint: Rate from 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 8
      name: health_trends
      label: Perceived Health Trends in the City
      hint: null
      type: select_one
      options:
      - Improving significantly
      - Improving slightly
      - Stable
      - Declining slightly
      - Declining significantly
      required: false
    - id: 9
      name: section_header_specific_health
      label: -- Specific Health Areas --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: mental_health_access
      label: Access to Mental Health Services
      hint: Rate adequacy 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 11
      name: primary_care_access
      label: Access to Primary Care Physicians
      hint: Rate adequacy 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: true
    - id: 12
      name: healthcare_affordability
      label: Healthcare Affordability
      hint: Rate 1 (very unaffordable) to 5 (very affordable)
      type: number
      options: []
      required: true
    - id: 13
      name: preventive_services
      label: Availability of Preventive Health Services
      hint: Vaccinations, screenings, wellness programs
      type: number
      options: []
      required: true
    - id: 14
      name: substance_abuse_services
      label: Substance Abuse and Addiction Services
      hint: Rate availability 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: false
    - id: 15
      name: maternal_child_health
      label: Maternal and Child Health Services
      hint: Rate availability 1 (poor) to 5 (excellent)
      type: number
      options: []
      required: false
    - id: 16
      name: section_header_health_factors
      label: -- Health Risk Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: obesity_concern
      label: Concern About Obesity Rates
      hint: Rate concern 1 (not concerned) to 5 (very concerned)
      type: number
      options: []
      required: false
    - id: 18
      name: substance_abuse_concern
      label: Concern About Substance Abuse
      hint: Rate concern 1 (not concerned) to 5 (very concerned)
      type: number
      options: []
      required: false
    - id: 19
      name: chronic_disease_concern
      label: Concern About Chronic Disease Rates
      hint: Rate concern 1 (not concerned) to 5 (very concerned)
      type: number
      options: []
      required: false
    - id: 20
      name: air_quality_concern
      label: Concern About Air Quality
      hint: Rate concern 1 (not concerned) to 5 (very concerned)
      type: number
      options: []
      required: false
    - id: 21
      name: section_header_behaviors
      label: -- Health Behaviors and Lifestyle --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: exercise_frequency
      label: How Often Do You Exercise
      hint: null
      type: select_one
      options:
      - Daily
      - Several times per week
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: false
    - id: 23
      name: healthy_eating
      label: How Would You Rate Your Eating Habits
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: false
    - id: 24
      name: sleep_quality
      label: Sleep Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: false
    - id: 25
      name: stress_level
      label: Stress Level
      hint: null
      type: select_one
      options:
      - Very low
      - Low
      - Moderate
      - High
      - Very high
      required: false
    - id: 26
      name: section_header_health_disparities
      label: -- Health Disparities and Access --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: health_equity
      label: Concern About Health Disparities in City
      hint: null
      type: select_one
      options:
      - Not concerned
      - Slightly concerned
      - Moderately concerned
      - Very concerned
      required: false
    - id: 28
      name: healthcare_gaps
      label: Gaps in Healthcare Access You Have Experienced
      hint: null
      type: text
      options: []
      required: false
    - id: 29
      name: section_header_priorities
      label: -- Health Improvement Priorities --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: health_priorities
      label: Top Health Priorities for Our City (Select all that apply)
      hint: null
      type: select_multiple
      options:
      - Increase healthcare access
      - Improve mental health services
      - Reduce substance abuse
      - Promote physical activity
      - Improve nutrition and food access
      - Address social determinants
      - Prevent chronic diseases
      - Improve maternal child health
      - Environmental health
      required: false
    - id: 31
      name: additional_comments
      label: Additional Comments About City Health
      hint: null
      type: text
      options: []
      required: false
