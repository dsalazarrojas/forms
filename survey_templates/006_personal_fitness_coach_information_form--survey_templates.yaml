inputSchema:
  type: object
  properties:
    title: personal_fitness_coach_information_form
    pages:
    - id: 1
      name: client_information
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: birth_date
      label: Birth Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: workout_frequency
      label: Workout Frequency
      hint: How often do you currently exercise?
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      - Daily
      - Occasionally
      - Rarely
      required: true
    - id: 8
      name: preferred_workout_time
      label: Preferred Workout Time
      hint: What time of day is best for a workout?
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      - Anytime
      required: true
    - id: 9
      name: preferred_workout_duration
      label: Preferred Workout Duration
      hint: How long would you like each workout to be?
      type: select_multiple
      options:
      - 30-60 minutes
      - 60-90 minutes
      - 90-120 minutes
      - Less than 30 minutes
      - More than 120 minutes
      required: true
    - id: 10
      name: goal_weight_loss
      label: Goal Weight Loss
      hint: null
      type: select_one
      options:
      - Lose weight
      - Maintain weight
      - Gain weight
      - None
      required: true
    - id: 11
      name: goal_gain_muscle
      label: Goal Gain Muscle
      hint: null
      type: select_one
      options:
      - Gain muscle
      - Maintain muscle
      - Lose muscle
      - None
      required: true
    - id: 12
      name: goal_improve_athletic_performance
