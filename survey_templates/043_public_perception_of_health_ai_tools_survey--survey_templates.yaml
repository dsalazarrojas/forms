inputSchema:
  type: object
  properties:
    title: Public Perception Of Health AI Tools Survey
    pages:
    - id: 1
      name: survey_intro
      label: Survey Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question1
      label: What is your role in the organization?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: question1_answer1
      label: Doctor
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: question1_answer2
      label: Nurse
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: question1_answer3
      label: Researcher
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: question2
      label: How many years of experience do you have with AI tools?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: question3
      label: How much time do you spend using AI tools daily?
      hint: null
      type: select_multiple
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-4 hours
      - 4-6 hours
      - More than 6 hours
      required: false
    - id: 8
      name: question4
      label: How confident are you that AI tools will be integrated into your organization's
        workflow?
      hint: null
      type: select_one
      options:
      - Not confident
      - Somewhat confident
      - Very confident
      required: false
    - id: 9
      name: question5
      label: How much control do you think users have over AI tool decision making?
      hint: null
      type: select_multiple
      options:
      - Some control
      - Limited control
      - No control
      required: false
    - id: 10
      name: question6
      label: What is the biggest challenge facing your organization as it adopts AI
        tools?
      hint: null
      type: select_multiple
      options:
      - Change management
      - Cost
      - Security
      - Other
      required: false
    - id: 11
      name: question7
      label: What features are you most looking forward to utilizing with AI tools?
      hint: null
      type: select_multiple
      options:
      - Data analytics
      - Predictive modeling
      - Natural Language Processing
      - Other
      required: false
    - id: 12
      name: question8
      label: What AI tools do you currently have access to?
      hint: null
      type: select_multiple
      options:
      - Clinical decision support systems
      - Predictive modeling
      - Natural Language Processing
      - Image Recognition
      - Other
      required: false
    - id: 13
      name: question9
      label: How would you rate the ease of use of your current AI tools?
      hint: null
      type: select_one
      options:
      - Very easy
      - Somewhat easy
      - Neutral
      - Somewhat difficult
      - Very difficult
      required: false
    - id: 14
      name: question10
      label: Do you think AI tools have positively impacted your workflow?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 15
      name: question11
      label: Do you have any concerns with AI tools?
      hint: null
      type: select_multiple
      options:
      - Bias
      - Data Quality
      - Explainability
      - Other
      required: false
    - id: 16
      name: question12
      label: Would you be interested in having more AI tools like this?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 17
      name: question13
      label: How would you rate the user experience of AI tools?
      hint: null
      type: select_one
      options:
      - Very Positive
      - Somewhat Positive
      - Neutral
      - Somewhat Negative
      - Very Negative
      required: false
    - id: 18
      name: question14
      label: What do you think AI tools will be most useful for in the next 6 months?
      hint: null
      type: select_multiple
      options:
      - Improving efficiency
      - Reducing errors
      - Enhancing decision making
      - Other
      required: false
    - id: 19
      name: question15
      label: Will you use AI tools more frequently?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 20
      name: question16
      label: What are your main reasons for not using AI tools?
      hint: null
      type: select_multiple
      options:
      - Cost
      - Training
      - Other
      required: false
    - id: 21
      name: question17
      label: What are you looking forward to most about AI tools?
      hint: null
      type: select_multiple
      options:
      - Improved data quality
      - Increased automation
      - Enhanced insights
      - Other
      required: false
    - id: 22
      name: question18
      label: What are the biggest benefits of AI tools?
      hint: null
      type: select_multiple
      options:
      - Improved data quality
      - Increased automation
      - Enhanced insights
      - Other
      required: false
    - id: 23
      name: question19
      label: Do you think AI will replace human healthcare professionals?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      required: false
    - id: 24
      name: question20
      label: How do you think AI tools will be used in healthcare?
      hint: null
      type: select_multiple
      options:
      - Diagnose diseases
      - Develop treatment plans
      - Monitor patients
      - Other
      required: false
    - id: 25
      name: question21
      label: Do you think AI has improved patient outcomes?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
