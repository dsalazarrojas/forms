inputSchema:
  type: object
  properties:
    title: Simulation Test Survey
    pages:
    - id: 1
      name: participant_feedback
      label: What was your overall experience with the simulation test?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_rating
      label: How would you rate your experience with the simulation test?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: participant_comments
      label: What did you think of the test's difficulty level?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: recommend_simulation_test
      label: How likely are you to recommend this simulation test to others?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 5
      name: most_challenging_part
      label: What was the most challenging part of the simulation test?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: test_duration
      label: How much time did you spend on the simulation test?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: finish_time
      label: Finish Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: num_completed_tests
      label: How many simulation tests have you completed before?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - 4 or more
      required: true
    - id: 10
      name: find_useful
      label: Do you think this simulation test was useful?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 11
      name: overall_design
      label: What do you think about the simulation test's overall design?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: take_again
      label: Would you take this simulation test again?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 13
      name: instructions
      label: How did you find the simulation test's instructions?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: suggestions
      label: Do you have any suggestions for the simulation test's improvement?
      hint: null
      type: text
      options: []
      required: false
