inputSchema:
  type: object
  properties:
    title: Client Survey Form
    pages:
    - id: 1
      name: survey_intro
      label: -- Client Feedback Survey --
      hint: Your feedback is very important to us
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_method
      label: How Would You Prefer We Contact You?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text message
      - Not required
      required: false
    - id: 5
      name: service_received
      label: Service or Product Received
      hint: What did you purchase or use?
      type: text
      options: []
      required: true
    - id: 6
      name: transaction_date
      label: Date of Transaction
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 8
      name: service_quality
      label: Quality of Service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 9
      name: value_for_money
      label: Value for Money
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 10
      name: staff_courtesy
      label: Staff Courtesy and Professionalism
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 11
      name: timeliness
      label: Timeliness of Service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 12
      name: would_return
      label: Would You Use Our Services Again?
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Uncertain
      - Probably not
      - Definitely not
      required: true
    - id: 13
      name: would_recommend
      label: Would You Recommend Us to Others?
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Uncertain
      - Probably not
      - Definitely not
      required: true
    - id: 14
      name: positive_aspects
      label: What Did You Like Most?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: improvement_areas
      label: What Could We Improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback or suggestions
      type: text
      options: []
      required: false
