inputSchema:
  type: object
  properties:
    title: relationship_accountability_survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: communication
      label: How_do_you_communicate_with_your_partner
      hint: null
      type: select_one
      options:
      - I always try to listen to my partner's perspective
      - I usually try to listen to my partner's perspective
      - I rarely try to listen to my partner's perspective
      - I never try to listen to my partner's perspective
      required: false
    - id: 3
      name: responsibility
      label: Who_takes_responsibility_in_this_relationship
      hint: null
      type: select_multiple
      options:
      - Both me and my partner
      - Me
      - My partner
      - Neither
      required: false
    - id: 4
      name: growth
      label: How_do_you_grow_as_a_couple
      hint: null
      type: select_multiple
      options:
      - Together
      - I
      - My partner
      - Neither
      required: false
    - id: 5
      name: feedback
      label: What_type_of_feedback_do_you_prefer_from_your_partner
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 6
      name: conflict
      label: What_type_of_conflict_do_you_prefer_to_resolve_first
      hint: null
      type: select_multiple
      options:
      - Emotional
      - Physical
      - Financial
      - None
      required: false
    - id: 7
      name: relationship_status
      label: What_is_your_relationship_status
      hint: null
      type: select_one
      options:
      - In a relationship
      - Dating
      - Engaged
      - Married
      required: false
    - id: 8
      name: communication_methods
      label: How_do_you_prefer_to_communicate_with_your_partner
      hint: null
      type: select_one
      options:
      - Text
      - Call
      - Video call
      - Social media
      - None
      required: false
    - id: 9
      name: conflict_resolution
      label: How_do_you_prefer_to_resolve_conflict
      hint: null
      type: select_multiple
      options:
      - Collaborate
      - Compromise
      - Avoid
      - None
      required: false
    - id: 10
      name: growth_goals
      label: What_do_you_believe_is_the_main_objective_of_your_relationship
      hint: null
      type: select_multiple
      options:
      - Love and support
      - Personal growth
      - Shared goals
      required: false
    - id: 11
      name: accountability
      label: Do_you_hold_your_partner_accountable
      hint: null
      type: select_multiple
      options:
      - Always
      - Usually
      - Rarely
      - Never
      required: false
