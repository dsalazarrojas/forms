inputSchema:
  type: object
  properties:
    title: weekly_student_well_being_check_in
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_id
      label: student_id
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: student_name
      label: student_name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: stress_level
      label: stress_level
      hint: null
      type: select_one
      options:
      - Very High
      - High
      - Medium
      - Low
      - Very Low
      required: true
    - id: 5
      name: emotional_state
      label: emotional_state
      hint: null
      type: select_one
      options:
      - Sad
      - Anxious
      - Stressed
      - Overwhelmed
      - Happy
      - Calm
      - Focused
      - Distracted
      required: true
    - id: 6
      name: support_needs
      label: support_needs
      hint: null
      type: select_multiple
      options:
      - Academic Support
      - Emotional Support
      - Counseling Support
      - Family Support
      - Friend Support
      - Peer Support
      required: true
    - id: 7
      name: overall_mood
      label: overall_mood
      hint: null
      type: select_one
      options:
      - Very Poor
      - Poor
      - Neutral
      - Good
      - Excellent
      required: true
    - id: 8
      name: suggestions_for_support
      label: suggestions_for_support
      hint: null
      type: text
      options: []
      required: false
