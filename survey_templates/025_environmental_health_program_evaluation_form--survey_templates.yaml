inputSchema:
  type: object
  properties:
    title: Environmental Health Program Evaluation Form
    pages:
    - id: 1
      name: program_info
      label: Program Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: program_frequency
      label: Program Evaluation Frequency
      hint: null
      type: select_one
      options:
      - Never
      - Less than 1 time per year
      - 1 time per year
      - 2 or more times per year
      - More than 2 times per year
      required: false
    - id: 3
      name: program_satisfaction
      label: Program Satisfaction
      hint: null
      type: select_multiple
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neither satisfied nor dissatisfied
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 4
      name: program_likes
      label: Program Likes
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: program_use
      label: Program Use
      hint: null
      type: select_one
      options:
      - Never
      - Less than 1 time per week
      - 1 time per week
      - 2 or more times per week
      - More than 2 times per week
      required: false
    - id: 6
      name: program_access
      label: Program Access
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: false
    - id: 7
      name: program_access_method
      label: Program Access Method
      hint: null
      type: select_multiple
      options:
      - Online
      - In-person
      - Over phone
      - Through email
      - Through other means
      required: false
    - id: 8
      name: program_access_frequency
      label: Program Access Frequency
      hint: null
      type: select_one
      options:
      - Never
      - Less than 1 time per week
      - 1 time per week
      - 2 or more times per week
      - More than 2 times per week
      required: false
    - id: 9
      name: program_24_7
      label: 24/7 Availability
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: false
    - id: 10
      name: program_languages
      label: Program Languages
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: false
    - id: 11
      name: program_interest
      label: Program Interest
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      - None
      required: false
    - id: 12
      name: program_unavailability
      label: Program Unavailability
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: program_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
