inputSchema:
  type: object
  properties:
    title: Eco Friendly Business Investor Poll
    pages:
    - id: 1
      name: eco_friendly_business_investor_poll_form
      label: What makes an eco-friendly business
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: eco_friendly_business_investor_poll_form_2
      label: How often do you invest in businesses with a positive impact on the environment?
      hint: null
      type: select_one
      options:
      - Often
      - Rarely
      - Never
      required: false
    - id: 3
      name: eco_friendly_business_investor_poll_form_3
      label: What type of impact matters most to you?
      hint: null
      type: select_one
      options:
      - Environmental
      - Social
      - Financial
      - Growth
      required: false
    - id: 4
      name: eco_friendly_business_investor_poll_form_4
      label: What drives your investment decision?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: eco_friendly_business_investor_poll_form_5
      label: How many investments do you make per year?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: eco_friendly_business_investor_poll_form_6
      label: What is your expected average investment size?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: eco_friendly_business_investor_poll_form_7
      label: What is your preferred investment amount range?
      hint: null
      type: select_multiple
      options:
      - Less than $10,000
      - $10,000-$50,000
      - $50,000-$100,000
      - More than $100,000
      required: false
    - id: 8
      name: eco_friendly_business_investor_poll_form_8
      label: What type of business model?
      hint: null
      type: select_one
      options:
      - Scalable
      - Sustainable
      - Social
      - Hybrid
      required: false
    - id: 9
      name: eco_friendly_business_investor_poll_form_9
      label: What industry do you focus on?
      hint: null
      type: select_one
      options:
      - Energy and Environment
      - Food and Agriculture
      - Healthcare
      - Finance
      required: false
    - id: 10
      name: eco_friendly_business_investor_poll_form_10
      label: How do you prefer to communicate?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - In-person meetings
      - Video conferencing
      required: false
