inputSchema:
  type: object
  properties:
    title: Family Friendly Villa Booking Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: number_of_guests
      label: Number Of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: goals
      label: What are your goals?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: stay_length
      label: Length Of Stay
      hint: null
      type: number
      options: []
      required: true
