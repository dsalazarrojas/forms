      - Spanish
      - Mandarin
      required: true
    - id: 10
      name: accommodation_type
      label: What type of accommodation
      hint: null
      type: select_multiple
      options:
      - 1 Bedroom
      - 2 Bedrooms
      - 3 Bedrooms
      required: true
    - id: 11
      name: preferred_time_of_arrival
      label: Preferred Time Of Arrival
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: special_requests
      label: Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: accommodation_address
      label: Accommodation Address
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: reservation_date
      label: Reservation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
