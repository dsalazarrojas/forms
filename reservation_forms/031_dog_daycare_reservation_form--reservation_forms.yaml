inputSchema:
  type: object
  properties:
    title: Dog Daycare Reservation Form
    pages:
    - id: 1
      name: reservation_date
      label: Reservation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: pickup_time
      label: Pickup Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: pet_type
      label: Pet Type
      hint: null
      type: select_one
      options:
      - Pet
      - Dog
      - Cat
      - Other
      required: false
    - id: 4
      name: pet_name
      label: Pet Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: reservation_status
      label: Reservation Status
      hint: null
      type: select_one
      options:
      - Active
      - Cancelled
      - Pending
      - Reserved
      required: false
    - id: 9
      name: reservation_notes
      label: Reservation Notes
      hint: null
      type: note
      options: []
      required: false
