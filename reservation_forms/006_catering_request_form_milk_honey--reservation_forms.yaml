inputSchema:
  type: object
  properties:
    title: Catering Request Form Milk & Honey
    pages:
    - id: 1
      name: section_contact_info
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company_organization
      label: Company or Organization Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 6
      name: section_event_information
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: event_location
      label: Event Location
      hint: Full address
      type: text
      options: []
      required: true
    - id: 10
      name: event_type
      label: Type of Event
      hint: null
      type: select_one
      options:
      - Wedding
      - Corporate Event
      - Birthday Party
      - Anniversary
      - Engagement Party
      - Graduation
      - Retirement
      - Conference
      - Gala
      - Other
      required: true
    - id: 11
      name: number_of_guests
      label: Expected Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: section_service_preferences
      label: -- Service Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: service_style
      label: Service Style
      hint: null
      type: select_one
      options:
      - Buffet
      - Plated Service
      - Family Style
      - Cocktail Reception
      - Stations
      - Combination
      required: true
    - id: 14
      name: bar_service_needed
      label: Bar Service Needed?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: bar_staffing
      label: Bar Staffing Requirements
      hint: Full-time bartender, self-serve, etc.
      type: text
      options: []
      required: false
    - id: 16
      name: beverage_services
      label: Beverage Services
      hint: null
      type: select_multiple
      options:
      - Non-alcoholic only
      - Beer and Wine
      - Full Bar
      - Coffee and Tea Service
      - Specialty Cocktails
      required: false
    - id: 17
      name: section_menu_preferences
      label: -- Menu Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: cuisine_type
      label: Preferred Cuisine Type
      hint: null
      type: select_one
      options:
      - American
      - Italian
      - Mediterranean
      - Mediterranean
      - Asian Fusion
      - Farm-to-Table
      - Gourmet
      - Other
      required: true
    - id: 19
      name: dietary_needs
      label: Special Dietary Needs
      hint: Vegetarian, vegan, gluten-free, etc.
      type: text
      options: []
      required: false
    - id: 20
      name: section_additional_services
      label: -- Additional Services --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: additional_services
      label: Additional Services Needed
      hint: null
      type: select_multiple
      options:
      - Linens and Place Settings
      - Floral Arrangements
      - Cake Cutting Service
      - Photography
      - Entertainment
      - Setup and Cleanup
      - Equipment Rental
      required: false
    - id: 22
      name: setup_requirements
      label: Special Setup Requirements
      hint: Table arrangements, decorations, etc.
      type: text
      options: []
      required: false
    - id: 23
      name: budget_range
      label: Budget Range
      hint: Approximate budget per guest
      type: text
      options: []
      required: false
    - id: 24
      name: additional_notes
      label: Additional Notes or Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: follow_up_contact
      label: Best time to contact you
      hint: null
      type: text
      options: []
      required: false
