      - 'No'
      required: false
    - id: 6
      name: start_date
      label: start date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: end_date
      label: end date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: accommodation_request
      label: accommodation request
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: student_phone
      label: student phone
      hint: null
      type: text
      options: []
      required: false
