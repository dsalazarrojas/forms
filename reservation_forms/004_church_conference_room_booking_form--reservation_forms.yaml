inputSchema:
  type: object
  properties:
    title: Church Conference Room Booking Form
    pages:
    - id: 1
      name: requester_name
      label: Your Full Name
      hint: Person responsible for the booking
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: organization
      label: Church Department or Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: room_selection
      label: Conference Room Selection
      hint: Choose the room you need
      type: select_one
      options:
      - Main Conference Room (capacity 50)
      - Small Meeting Room A (capacity 10)
      - Small Meeting Room B (capacity 10)
      - Fellowship Hall (capacity 100)
      - Classroom 1 (capacity 25)
      - Classroom 2 (capacity 25)
      - Media Room (capacity 15)
      required: true
    - id: 6
      name: event_date
      label: Date of Event
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: setup_style
      label: Room Setup Style
      hint: How should the room be arranged
      type: select_one
      options:
      - Theater style (rows)
      - Classroom style (tables and chairs)
      - U-shape
      - Boardroom style
      - Banquet rounds
      - Empty room
      required: true
    - id: 10
      name: expected_attendees
      label: Expected Number of Attendees
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: av_equipment
      label: Audio Visual Equipment Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Projector
      - Screen
      - Microphone
      - Speakers
      - Laptop
      - Whiteboard
      - Video conferencing
      - Recording equipment
      - None needed
      required: true
    - id: 12
      name: catering
      label: Catering Services
      hint: null
      type: select_one
      options:
      - No catering needed
      - Coffee and pastries
      - Lunch buffet
      - Dinner service
      - Snacks and beverages
      required: true
    - id: 13
      name: special_requests
      label: Special Requests or Notes
      hint: Any additional requirements
      type: text
      options: []
      required: false
    - id: 14
      name: recurring_event
      label: Is This a Recurring Event
      hint: null
      type: select_one
      options:
      - No, one-time event
      - Yes, weekly
      - Yes, bi-weekly
      - Yes, monthly
      required: true
    - id: 15
      name: recurrence_pattern
      label: If Recurring, Specify Pattern
      hint: Which days and for how long
      type: text
      options: []
      required: false
    - id: 16
      name: parking_needed
      label: Will You Need Reserved Parking
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 17
      name: security_deposit
      label: Security Deposit Acknowledgment
      hint: A deposit may be required for certain events
      type: select_one
      options:
      - I understand and agree
      - I have questions about this
      required: true
    - id: 18
      name: cancellation_policy
      label: Cancellation Policy Agreement
      hint: Cancellations must be made 48 hours in advance
      type: select_one
      options:
      - I agree to the cancellation policy
      - I need more information
      required: true
