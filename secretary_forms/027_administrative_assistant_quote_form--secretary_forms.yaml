inputSchema:
  type: object
  properties:
    title: Administrative Assistant Quote Form
    pages:
    - id: 1
      name: quote_header
      label: -- Administrative Assistant Quote Form --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: Name of the client requesting services
      type: text
      options: []
      required: true
    - id: 3
      name: client_company
      label: Client Company
      hint: Name of the client's company or organization
      type: text
      options: []
      required: false
    - id: 4
      name: client_email
      label: Client Email
      hint: Email address for communication
      type: email
      options: []
      required: true
    - id: 5
      name: client_phone
      label: Client Phone
      hint: Phone number for contact
      type: text
      options: []
      required: false
    - id: 6
      name: quote_date
      label: Quote Date
      hint: Date when the quote is prepared
      type: date
      options: []
      required: true
    - id: 7
      name: quote_valid_until
      label: Quote Valid Until
      hint: Date until which this quote is valid
      type: date
      options: []
      required: true
    - id: 8
      name: service_type
      label: Type of Administrative Service
      hint: What type of administrative service is needed?
      type: select_one
      options:
      - General Administrative Support
      - Executive Assistance
      - Data Entry
      - Scheduling
      - Travel Arrangements
      - Document Preparation
      - Customer Service
      - Project Coordination
      - Other
      required: true
    - id: 9
      name: service_description
      label: Service Description
      hint: Detailed description of the services required
      type: text
      options: []
      required: true
    - id: 10
      name: service_duration
      label: Estimated Duration
      hint: How long will the service be needed?
      type: select_one
      options:
      - One-time
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Long-term contract
      required: true
    - id: 11
      name: service_hours_per_day
      label: Hours per Day
      hint: How many hours per day will be required?
      type: number
      options: []
      required: false
    - id: 12
      name: service_days_per_week
      label: Days per Week
      hint: How many days per week will be required?
      type: number
      options: []
      required: false
    - id: 13
      name: required_skills
      label: Required Skills
      hint: What specific skills are required for this service?
      type: text
      options: []
      required: false
    - id: 14
      name: required_software
      label: Required Software Knowledge
      hint: What software knowledge is required?
      type: text
      options: []
      required: false
    - id: 15
      name: hourly_rate
      label: Hourly Rate ($)
      hint: Hourly rate for the service
      type: number
      options: []
      required: true
    - id: 16
      name: estimated_hours
      label: Estimated Total Hours
      hint: Estimated total number of hours needed
      type: number
      options: []
      required: true
    - id: 17
      name: subtotal
      label: Subtotal ($)
      hint: Calculated subtotal (hourly rate × estimated hours)
      type: number
      options: []
      required: true
    - id: 18
      name: taxes_percentage
      label: Taxes (%)
      hint: Tax percentage to be applied
      type: number
      options: []
      required: false
    - id: 19
      name: taxes_amount
      label: Tax Amount ($)
      hint: Calculated tax amount
      type: number
      options: []
      required: false
    - id: 20
      name: additional_fees
      label: Additional Fees ($)
      hint: Any additional fees to be added
      type: number
      options: []
      required: false
    - id: 21
      name: total_amount
      label: Total Amount ($)
      hint: Final total amount including all charges
      type: number
      options: []
      required: true
    - id: 22
      name: payment_terms
      label: Payment Terms
      hint: Terms for payment
      type: text
      options: []
      required: false
    - id: 23
      name: special_conditions
      label: Special Conditions
      hint: Any special conditions or requirements
      type: text
      options: []
      required: false
    - id: 24
      name: quote_prepared_by
      label: Quote Prepared By
      hint: Name of the person preparing the quote
      type: text
      options: []
      required: true
    - id: 25
      name: quote_approved_by
      label: Quote Approved By
      hint: Name of the person approving the quote
      type: text
      options: []
      required: false
