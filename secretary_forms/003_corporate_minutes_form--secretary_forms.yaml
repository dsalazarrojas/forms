inputSchema:
  type: object
  properties:
    title: Corporate Minutes Form
    pages:
    - id: 1
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: meeting_minutes
      label: Meeting Minutes
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: meeting_location
      label: Meeting Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: meeting_attendees
      label: Meeting Attendees
      hint: List all attendees
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: meeting_notes
      label: Meeting Notes
      hint: Include notes from the meeting
      type: text
      options: []
      required: false
    - id: 6
      name: meeting_attendance
      label: Meeting Attendance
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 7
      name: meeting_outcomes
      label: Meeting Outcomes
      hint: List the main actions and decisions from the meeting
      type: text
      options: []
      required: false
    - id: 8
      name: meeting_approval
      label: Meeting Approval
      hint: Check off if approved
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
