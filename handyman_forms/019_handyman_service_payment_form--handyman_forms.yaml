    - id: 5
      name: payment_date
      label: Payment date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: service_cost
      label: Service cost
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: payment_amount
      label: Payment amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
