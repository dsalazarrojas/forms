inputSchema:
  type: object
  properties:
    title: Auto Parts Verification Form
    pages:
    - id: 1
      name: introduction
      label: Auto Parts Verification
      hint: Please provide accurate part and vehicle information
      type: note
      options: []
      required: false
    - id: 2
      name: requester_info
      label: Requester Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 3
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 4
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Business or shop name
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 8
      name: vehicle_info
      label: Vehicle Information
      hint: Details about the vehicle
      type: note
      options: []
      required: false
    - id: 9
      name: vehicle_year
      label: Vehicle Year
      hint: Year of manufacture
      type: number
      options: []
      required: true
    - id: 10
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer
      type: text
      options: []
      required: true
    - id: 11
      name: vehicle_model
      label: Vehicle Model
      hint: Model name
      type: text
      options: []
      required: true
    - id: 12
      name: vehicle_trim
      label: Vehicle Trim
      hint: Trim level or package
      type: text
      options: []
      required: false
    - id: 13
      name: vin
      label: VIN
      hint: Vehicle Identification Number
      type: text
      options: []
      required: true
    - id: 14
      name: engine_type
      label: Engine Type
      hint: Engine size and configuration
      type: text
      options: []
      required: false
    - id: 15
      name: transmission
      label: Transmission Type
      hint: Automatic or Manual
      type: select_one
      options:
      - Automatic
      - Manual
      - CVT
      - Other
      required: false
    - id: 16
      name: part_info
      label: Part Information
      hint: Details about the part
      type: note
      options: []
      required: false
    - id: 17
      name: part_name
      label: Part Name
      hint: Name of the part
      type: text
      options: []
      required: true
    - id: 18
      name: part_number
      label: Part Number
      hint: OEM or aftermarket part number
      type: text
      options: []
      required: true
    - id: 19
      name: part_brand
      label: Part Brand
      hint: Manufacturer of the part
      type: text
      options: []
      required: false
    - id: 20
      name: part_type
      label: Part Type
      hint: Category of part
      type: select_one
      options:
      - Engine Component
      - Transmission
      - Brake System
      - Suspension
      - Electrical
      - Body Part
      - Interior
      - Exhaust System
      - Cooling System
      - Other
      required: true
    - id: 21
      name: part_condition
      label: Part Condition
      hint: What condition is the part
      type: select_one
      options:
      - New
      - Refurbished
      - Used - Good
      - Used - Fair
      - For Rebuild
      required: true
    - id: 22
      name: quantity_needed
      label: Quantity Needed
      hint: How many parts
      type: number
      options: []
      required: true
    - id: 23
      name: verification_details
      label: Verification Details
      hint: Additional verification info
      type: note
      options: []
      required: false
    - id: 24
      name: compatibility_check
      label: Compatibility Check Required
      hint: Do you need compatibility verification
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 25
      name: existing_part_number
      label: Existing Part Number
      hint: Number from the old part
      type: text
      options: []
      required: false
    - id: 26
      name: photos_available
      label: Photos Available
      hint: Can you provide photos
      type: select_one
      options:
      - Yes Will Upload
      - Yes Already Sent
      - 'False'
      required: true
    - id: 27
      name: part_location
      label: Part Location on Vehicle
      hint: Where is the part located
      type: select_one
      options:
      - Front
      - Rear
      - Left Side
      - Right Side
      - Engine Bay
      - Under Vehicle
      - Interior
      - Other
      required: false
    - id: 28
      name: symptoms
      label: Symptoms or Issues
      hint: What problems are you experiencing
      type: text
      options: []
      required: false
    - id: 29
      name: repair_history
      label: Recent Repair History
      hint: Any recent related repairs
      type: text
      options: []
      required: false
    - id: 30
      name: urgency
      label: Urgency Level
      hint: How soon do you need the part
      type: select_one
      options:
      - Immediate
      - Within 24 hours
      - Within 3 days
      - Within 1 week
      - No Rush
      required: true
    - id: 31
      name: preferred_supplier
      label: Preferred Supplier
      hint: Do you have a preferred supplier
      type: text
      options: []
      required: false
    - id: 32
      name: budget_range
      label: Budget Range
      hint: Expected price range
      type: select_one
      options:
      - Under $50
      - $50-$100
      - $100-$250
      - $250-$500
      - $500-$1000
      - Over $1000
      required: false
    - id: 33
      name: additional_notes
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
    - id: 34
      name: verification_request
      label: Verification Request
      hint: I request verification of part compatibility
      type: select_one
      options:
      - I Confirm Request
      - Cancel Request
      required: true
