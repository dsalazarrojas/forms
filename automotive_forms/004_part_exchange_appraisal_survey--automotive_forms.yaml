inputSchema:
  type: object
  properties:
    title: Part Exchange Appraisal Survey
    pages:
    - id: 1
      name: vehicle_details
      label: vehicle_details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: owner_details
      label: owner_details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: vehicle_condition
      label: select_one
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      required: true
    - id: 4
      name: trade_in_reason
      label: select_multiple
      hint: null
      type: select_multiple
      options:
      - Want to trade in for a new vehicle
      - Want to sell the vehicle privately
      - Want to sell to another dealership
      required: false
    - id: 5
      name: appraiser_details
      label: appraiser_details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submission_details
      label: submission_details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: vehicle_condition_note
      label: vehicle_condition_note
      hint: null
      type: text
      options: []
      required: false
