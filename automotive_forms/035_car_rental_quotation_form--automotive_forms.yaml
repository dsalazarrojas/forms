inputSchema:
  type: object
  properties:
    title: Car Rental Quotation Form
    pages:
    - id: 1
      name: customer_information
      label: Customer Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: For quote delivery
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: company_name
      label: Company Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: address
      label: Street Address
      hint: Your address
      type: text
      options: []
      required: false
    - id: 8
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: false
    - id: 9
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: false
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: Your ZIP code
      type: text
      options: []
      required: false
    - id: 11
      name: rental_details
      label: Rental Details
      hint: Your rental requirements
      type: note
      options: []
      required: false
    - id: 12
      name: pickup_location
      label: Pickup Location
      hint: Where to pick up?
      type: select_one
      options:
      - Airport Location
      - Downtown Location
      - Suburban Location
      - Hotel Delivery
      - Other
      required: true
    - id: 13
      name: pickup_location_address
      label: Pickup Address
      hint: Specific address
      type: text
      options: []
      required: false
    - id: 14
      name: pickup_date
      label: Pickup Date
      hint: When to pick up?
      type: date
      options: []
      required: true
    - id: 15
      name: pickup_time
      label: Pickup Time
      hint: What time?
      type: time
      options: []
      required: true
    - id: 16
      name: return_location
      label: Return Location
      hint: Where to return?
      type: select_one
      options:
      - Same as pickup
      - Different location
      required: true
    - id: 17
      name: return_location_address
      label: Return Address
      hint: If different
      type: text
      options: []
      required: false
    - id: 18
      name: return_date
      label: Return Date
      hint: When to return?
      type: date
      options: []
      required: true
    - id: 19
      name: return_time
      label: Return Time
      hint: What time?
      type: time
      options: []
      required: true
    - id: 20
      name: rental_duration_display
      label: Rental Duration
      hint: Calculated duration
      type: text
      options: []
      required: false
    - id: 21
      name: vehicle_preferences
      label: Vehicle Preferences
      hint: What type of vehicle?
      type: note
      options: []
      required: false
    - id: 22
      name: vehicle_category
      label: Vehicle Category
      hint: Class of vehicle
      type: select_one
      options:
      - Economy
      - Compact
      - Mid-size
      - Full-size
      - SUV
      - Minivan
      - Luxury
      - Sports car
      - Truck
      - No preference
      - Multiple quotes needed
      required: true
    - id: 23
      name: specific_vehicle_request
      label: Specific Vehicle Request
      hint: If you have a preference
      type: text
      options: []
      required: false
    - id: 24
      name: transmission_type
      label: Transmission Type
      hint: Preference
      type: select_one
      options:
      - Automatic
      - Manual
      - No preference
      required: true
    - id: 25
      name: fuel_type
      label: Fuel Type
      hint: Preference
      type: select_one
      options:
      - Gasoline
      - Diesel
      - Hybrid
      - Electric
      - No preference
      required: true
    - id: 26
      name: passenger_capacity
      label: Passenger Capacity
      hint: How many passengers?
      type: select_one
      options:
      - 1-2
      - 3-4
      - 5-6
      - 7-8
      - 9+
      required: true
    - id: 27
      name: luggage_capacity
      label: Luggage Capacity
      hint: How many bags?
      type: select_one
      options:
      - 1-2 bags
      - 3-4 bags
      - 5-6 bags
      - 7+ bags
      required: true
    - id: 28
      name: additional_services
      label: Additional Services
      hint: Any add-ons?
      type: select_multiple
      options:
      - GPS Navigation
      - Child Safety Seat
      - Booster Seat
      - Additional Driver
      - Ski Rack
      - Bike Rack
      - Toll Pass
      - Mobile WiFi
      - Car Seat for Infant
      - None
      required: false
    - id: 29
      name: insurance_preferences
      label: Insurance Preferences
      hint: Coverage options
      type: select_multiple
      options:
      - Collision Damage Waiver
      - Liability Insurance
      - Personal Accident Insurance
      - Personal Effects Coverage
      - Roadside Assistance Plus
      - Decline all coverage
      - Undecided
      required: false
    - id: 30
      name: estimated_mileage
      label: Estimated Mileage
      hint: How many miles expected?
      type: select_one
      options:
      - Under 100 miles
      - 100-300 miles
      - 300-500 miles
      - Over 500 miles
      required: false
    - id: 31
      name: driver_information
      label: Driver Information
      hint: Primary driver details
      type: note
      options: []
      required: false
    - id: 32
      name: primary_driver_age
      label: Primary Driver Age
      hint: Age range
      type: select_one
      options:
      - 21-24
      - 25-64
      - 65-74
      - 75+
      required: true
    - id: 33
      name: additional_drivers
      label: Additional Drivers
      hint: Will there be other drivers?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 34
      name: number_of_additional_drivers
      label: Number of Additional Drivers
      hint: How many?
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - 4+
      required: false
    - id: 35
      name: rental_purpose
      label: Rental Purpose
      hint: Why are you renting?
      type: select_one
      options:
      - Business
      - Leisure/Vacation
      - Personal vehicle repair
      - Special event
      - Test drive
      - Other
      required: true
    - id: 36
      name: corporate_rate
      label: Corporate Rate
      hint: Do you qualify for corporate rates?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 37
      name: corporate_id
      label: Corporate ID
      hint: Corporate account number
      type: text
      options: []
      required: false
    - id: 38
      name: loyalty_program
      label: Loyalty Program
      hint: Are you a member?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Want to join
      required: false
    - id: 39
      name: loyalty_number
      label: Loyalty Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 40
      name: special_requests
      label: Special Requests
      hint: Any special requirements?
      type: text
      options: []
      required: false
    - id: 41
      name: quote_delivery
      label: Quote Delivery
      hint: How to send the quote?
      type: select_one
      options:
      - Email
      - Phone call
      - Text message
      - Fax
      required: true
    - id: 42
      name: quote_validity
      label: Quote Validity
      hint: How long should quote be valid?
      type: select_one
      options:
      - 24 hours
      - 48 hours
      - 1 week
      - 2 weeks
      - No preference
      required: false
    - id: 43
      name: decision_timeframe
      label: Decision Timeframe
      hint: When will you decide?
      type: select_one
      options:
      - Immediately
      - Within 24 hours
      - Within 1 week
      - Still shopping
      - Just browsing
      required: false
    - id: 44
      name: competing_quotes
      label: Competing Quotes
      hint: Do you have other quotes?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Prefer not to say
      required: false
    - id: 45
      name: budget_range
      label: Budget Range
      hint: Your budget
      type: select_one
      options:
      - Under $50/day
      - $50-$100/day
      - $100-$150/day
      - $150-$200/day
      - Over $200/day
      - No budget limit
      required: false
    - id: 46
      name: how_heard_about_us
      label: How Did You Hear About Us
      hint: Your referral source
      type: select_one
      options:
      - Website
      - Mobile app
      - Search engine
      - Social media
      - Friend/Family
      - Travel agent
      - Advertisement
      - Previous customer
      - Other
      required: false
    - id: 47
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 48
      name: quote_request_date
      label: Quote Request Date
      hint: Today's date
      type: date
      options: []
      required: true
