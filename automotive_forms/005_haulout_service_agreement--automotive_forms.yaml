inputSchema:
  type: object
  properties:
    title: Haulout Service Agreement
    pages:
    - id: 1
      name: vessel_details
      label: Vessel Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: vessel_type
      label: Vessel Type
      hint: null
      type: select_one
      options:
      - Vessels 1-Ton
      - Vessels 2-Ton
      - Vessels 3-Ton
      - Vessels 4-Ton
      - Other
      required: false
    - id: 3
      name: vessel_size
      label: Vessel Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 4
      name: vessel_type_size
      label: Vessel Type Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - Extra Large
      required: false
    - id: 5
      name: vessel_condition
      label: Vessel Condition
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: haulout_terms
      label: Haulout Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: haulout_details
      label: Haulout Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: haulout_terms_agreed
      label: Haulout Terms Agreed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: signature_date
      label: Signature Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: signature_time
      label: Signature Time
      hint: null
      type: time
      options: []
      required: false
