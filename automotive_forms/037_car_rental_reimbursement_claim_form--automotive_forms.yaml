      name: insurance_cost
      label: Insurance Cost
      hint: Coverage fees
      type: number
      options: []
      required: false
    - id: 28
      name: fuel_cost
      label: Fuel Cost
      hint: Fuel expenses
      type: number
      options: []
      required: false
    - id: 29
      name: additional_services_cost
      label: Additional Services Cost
      hint: GPS, car seats, etc.
      type: number
      options: []
