      type: select_one
      options:
      - USD
      - EUR
      - GBP
      - CAD
      - Other
      required: true
    - id: 35
      name: payment_method
      label: Payment Method
      hint: How did you pay?
      type: select_one
      options:
      - Personal credit card
      - Corporate credit card
      - Personal debit card
      - Cash
      - Check
      required: true
    - id: 36
      name: business_justification
      label: Business Justification
      hint: Why was rental necessary?
      type: select_one
      options:
      - No company vehicle available
      - Travel to multiple locations
      - Client meetings
      - Airport transportation
      - Public transport unavailable
      - Other
      required: true
    - id: 37
      name: business_justification_details
      label: Business Justification Details
      hint: Elaborate if needed
      type: text
      options: []
      required: false
    - id: 38
      name: mileage_information
      label: Mileage Information
      hint: Distance driven
      type: note
      options: []
      required: false
    - id: 39
      name: starting_mileage
      label: Starting Mileage
      hint: Odometer at pickup
      type: number
      options: []
      required: false
    - id: 40
      name: ending_mileage
      label: Ending Mileage
      hint: Odometer at return
      type: number
      options: []
      required: false
    - id: 41
      name: total_miles_driven
      label: Total Miles Driven
      hint: Total distance
      type: number
      options: []
      required: false
    - id: 42
      name: business_miles
      label: Business Miles
      hint: Miles for business purposes
      type: number
      options: []
      required: false
    - id: 43
      name: documentation
      label: Documentation
      hint: Receipts and attachments
      type: note
      options: []
      required: false
    - id: 44
      name: receipt_attached
      label: Receipt Attached
      hint: Do you have receipts?
      type: select_one
      options:
      - Yes - all receipts attached
      - Yes - partial receipts
      - No - will provide later
      - No - lost
      required: true
    - id: 45
      name: missing_receipt_explanation
      label: Missing Receipt Explanation
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 46
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 47
      name: reimbursement_method
      label: Reimbursement Method
      hint: How to receive payment?
      type: select_one
      options:
      - Direct deposit
      - Check
      - Payroll addition
      required: true
    - id: 48
      name: employee_signature
      label: Employee Signature Confirmation
      hint: Confirm accuracy
      type: select_one
      options:
      - I certify this expense report is accurate
      - I cannot certify
      required: true
    - id: 49
      name: submission_date
      label: Submission Date
      hint: Today's date
      type: date
      options: []
      required: true
