inputSchema:
  type: object
  properties:
    title: Auto Repair Service Inquiry Form
    pages:
    - id: 1
      name: potential_customer_header
      label: -- Potential Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: For follow up communication
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Best number for reach you
      type: text
      options: []
      required: true
    - id: 5
      name: vehicle_repair_header
      label: -- Vehicle to be Repaired --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: vehicle_make
      label: Vehicle Make
      hint: e.g. Toyota
      type: text
      options: []
      required: true
    - id: 7
      name: vehicle_model
      label: Vehicle Model
      hint: e.g. Camry
      type: text
      options: []
      required: true
    - id: 8
      name: vehicle_year
      label: Vehicle Year
      hint: e.g. 2015
      type: number
      options: []
      required: true
    - id: 9
      name: inquiry_details_header
      label: -- Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: inquiry_type
      label: Inquiry Type
      hint: Select the category of your request
      type: select_one
      options:
      - Routine Maintenance
      - Specific Repair
      - Diagnostic
      - Estimate
      - Warranty Work
      required: true
    - id: 11
      name: issue_description
      label: Description of Issue
      hint: Describe the symptoms or service needed
      type: text
      options: []
      required: true
    - id: 12
      name: contact_method_preference
      label: Preferred Contact Method
      hint: How should we reach out to you?
      type: select_one
      options:
      - Phone
      - Email
      - Text
      required: true
    - id: 13
      name: urgency_level
      label: Urgency
      hint: How soon do you need this service?
      type: select_one
      options:
      - Emergency
      - Within 24 hours
      - Within a week
      - Just inquiring
      required: true
    - id: 14
      name: additional_questions
      label: Additional Questions
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
