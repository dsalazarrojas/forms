inputSchema:
  type: object
  properties:
    title: vehicle detailing booking form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: vehicle_make
      label: Vehicle Make
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: vehicle_model
      label: Vehicle Model
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: vehicle_year
      label: Vehicle Year
      hint: null
      type: number
      options: []
