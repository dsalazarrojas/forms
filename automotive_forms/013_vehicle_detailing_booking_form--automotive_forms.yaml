      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: assigned_user
      label: Assigned User
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - other user
      required: false
    - id: 12
      name: customer_address
      label: Customer Address
      hint: null
      type: text
      options: []
      required: false
