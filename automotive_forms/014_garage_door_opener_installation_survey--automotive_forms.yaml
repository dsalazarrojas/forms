inputSchema:
  type: object
  properties:
    title: Garage Door Opener Installation Survey
    pages:
    - id: 1
      name: customer_details
      label: Customer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: door_type
      label: Door Type
      hint: null
      type: select_one
      options:
      - Roller
      - Swing
      - Slide
      - Panel
      - Sectional
      - Other
      required: false
    - id: 3
      name: feature_preferences
      label: Feature Preferences
      hint: null
      type: select_multiple
      options:
      - Opener type
      - Remote control
      - Safety features
      - Battery backup
      - Other
      required: false
    - id: 4
      name: preferred_installation_time
      label: Preferred Installation Time
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekend
      - Flexible
      required: true
    - id: 5
      name: installation_notes
      label: Installation Notes
