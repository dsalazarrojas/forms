inputSchema:
  type: object
  properties:
    title: RV Battery Recommendation Request Form
    pages:
    - id: 1
      name: camping_style
      label: Camping Style
      hint: null
      type: select_one
      options:
      - RV Travel Trailer
      - Class C Motorhome
      - Class A Motorhome
      - Class B Motorhome
      - Truck Camper
      required: false
    - id: 2
      name: camping_goals
      label: Camping Goals
      hint: null
      type: select_multiple
      options:
      - Camping in the mountains
      - Dry Camping
      - Boondocking
      - Remote Camping
      - Full Service
      required: false
    - id: 3
      name: power_goals
      label: Power Goals
      hint: null
      type: select_multiple
      options:
      - Less than 20 hours
      - 20-40 hours
      - 40-60 hours
      - More than 60 hours
      required: false
    - id: 4
      name: battery_capacity
      label: Battery Capacity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: battery_amps
      label: Battery Amperage
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 6
