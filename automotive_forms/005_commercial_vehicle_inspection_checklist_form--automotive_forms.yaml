inputSchema:
  type: object
  properties:
    title: Commercial Vehicle Inspection Checklist Form
    pages:
    - id: 1
      name: inspection_information
      label: Inspection Information
      hint: Basic details about the inspection
      type: note
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: Date of vehicle inspection
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Inspection Time
      hint: Time of inspection
      type: time
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: Full name of the inspector
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_id
      label: Inspector ID
      hint: Inspector identification number
      type: text
      options: []
      required: true
    - id: 6
      name: vehicle_information
      label: Vehicle Information
      hint: Details about the vehicle being inspected
      type: note
      options: []
      required: false
    - id: 7
      name: vehicle_id_number
      label: Vehicle ID Number
      hint: VIN or fleet identification number
      type: text
      options: []
      required: true
    - id: 8
      name: license_plate
      label: License Plate
      hint: Vehicle license plate number
      type: text
      options: []
      required: true
    - id: 9
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer of the vehicle
      type: text
      options: []
      required: true
    - id: 10
      name: vehicle_model
      label: Vehicle Model
      hint: Model of the vehicle
      type: text
      options: []
      required: true
    - id: 11
      name: vehicle_year
      label: Vehicle Year
      hint: Year of manufacture
      type: number
      options: []
      required: true
    - id: 12
      name: odometer_reading
      label: Odometer Reading
      hint: Current mileage
      type: number
      options: []
      required: true
    - id: 13
      name: vehicle_type
      label: Vehicle Type
      hint: Type of commercial vehicle
      type: select_one
      options:
      - Box Truck
      - Semi-Truck
      - Van
      - Pickup Truck
      - Flatbed
      - Tanker
      - Bus
      required: true
    - id: 14
      name: exterior_inspection
      label: Exterior Inspection
      hint: External vehicle condition check
      type: note
      options: []
      required: false
    - id: 15
      name: body_condition
      label: Body Condition
      hint: Overall body and paint condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Repair
      required: true
    - id: 16
      name: tires_condition
      label: Tires Condition
      hint: Tire tread and condition check
      type: select_one
      options:
      - Good
      - Fair - Monitor
      - Replace Soon
      - Replace Immediately
      required: true
    - id: 17
      name: lights_functional
      label: Lights Functional
      hint: All lights working properly
      type: select_one
      options:
      - Yes - All Working
      - No - Issues Found
      required: true
    - id: 18
      name: mirrors_condition
      label: Mirrors Condition
      hint: Mirror condition and adjustment
      type: select_one
      options:
      - Good
      - Fair
      - Damaged
      - Missing
      required: true
    - id: 19
      name: interior_inspection
      label: Interior Inspection
      hint: Internal vehicle condition check
      type: note
      options: []
      required: false
    - id: 20
      name: dashboard_warnings
      label: Dashboard Warnings
      hint: Any warning lights on dashboard
      type: select_one
      options:
      - None
      - Check Engine
      - Oil Pressure
      - Brake System
      - Multiple Warnings
      required: true
    - id: 21
      name: seatbelts_condition
      label: Seatbelts Condition
      hint: Seatbelt functionality check
      type: select_one
      options:
      - All Functional
      - Minor Issues
      - Needs Repair
      - Non-Functional
      required: true
    - id: 22
      name: mechanical_inspection
      label: Mechanical Inspection
      hint: Mechanical systems check
      type: note
      options: []
      required: false
    - id: 23
      name: engine_condition
      label: Engine Condition
      hint: Engine performance and leaks
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Critical Issues
      required: true
    - id: 24
      name: brake_system
      label: Brake System
      hint: Brake condition and performance
      type: select_one
      options:
      - Excellent
      - Good
      - Needs Attention
      - Unsafe - Do Not Drive
      required: true
    - id: 25
      name: fluid_levels
      label: Fluid Levels
      hint: Check all fluid levels
      type: select_one
      options:
      - All Adequate
      - Low - Top Up Needed
      - Critical - Immediate Action
      required: true
    - id: 26
      name: overall_inspection_result
      label: Overall Inspection Result
      hint: Final inspection determination
      type: select_one
      options:
      - Pass - No Issues
      - Pass - Minor Issues Noted
      - Conditional Pass
      - Fail - Repairs Required
      required: true
    - id: 27
      name: additional_notes
      label: Additional Notes
      hint: Any additional comments or observations
      type: text
      options: []
      required: false
    - id: 28
      name: next_inspection_due
      label: Next Inspection Due
      hint: When is the next inspection scheduled
      type: date
      options: []
      required: false
