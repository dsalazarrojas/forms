inputSchema:
  type: object
  properties:
    title: Auto Glass Claim Submission Form
    pages:
    - id: 1
      name: claimant_info
      label: Claimant Information
      hint: Please provide your personal details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: Primary email for claim updates
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 7
      name: address
      label: Street Address
      hint: Your mailing address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: State of residence
      type: select_one
      options:
      - Alabama
      - Alaska
      - Arizona
      - Arkansas
      - California
      - Colorado
      - Connecticut
      - Delaware
      - Florida
      - Georgia
      - Other
      required: true
    - id: 10
      name: zip_code
      label: ZIP Code
      hint: 5-digit ZIP code
      type: text
      options: []
      required: true
    - id: 11
      name: policy_info
      label: Insurance Policy Information
      hint: Provide your insurance details
      type: note
      options: []
      required: false
    - id: 12
      name: insurance_company
      label: Insurance Company Name
      hint: Name of your insurance provider
      type: text
      options: []
      required: true
    - id: 13
      name: policy_number
      label: Policy Number
      hint: Your policy number
      type: text
      options: []
      required: true
    - id: 14
      name: claim_number
      label: Claim Number
      hint: If already assigned
      type: text
      options: []
      required: false
    - id: 15
      name: vehicle_info
      label: Vehicle Information
      hint: Details about the damaged vehicle
      type: note
      options: []
      required: false
    - id: 16
      name: vehicle_year
      label: Vehicle Year
      hint: Year of manufacture
      type: number
      options: []
      required: true
    - id: 17
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer
      type: text
      options: []
      required: true
    - id: 18
      name: vehicle_model
      label: Vehicle Model
      hint: Model name
      type: text
      options: []
      required: true
    - id: 19
      name: vin
      label: VIN
      hint: Vehicle Identification Number
      type: text
      options: []
      required: false
    - id: 20
      name: license_plate
      label: License Plate Number
      hint: Current plate number
      type: text
      options: []
      required: false
    - id: 21
      name: damage_info
      label: Damage Information
      hint: Describe the glass damage
      type: note
      options: []
      required: false
    - id: 22
      name: damage_date
      label: Date of Damage
      hint: When did the damage occur
      type: date
      options: []
      required: true
    - id: 23
      name: damage_location
      label: Location of Damage
      hint: Where on the vehicle is the damage
      type: select_one
      options:
      - Windshield
      - Front Left Window
      - Front Right Window
      - Rear Left Window
      - Rear Right Window
      - Back Glass
      - Sunroof
      - Multiple Areas
      required: true
    - id: 24
      name: damage_type
      label: Type of Damage
      hint: What type of damage occurred
      type: select_one
      options:
      - Chip
      - Crack
      - Shattered
      - Star Break
      - Bullseye
      - Combination
      - Other
      required: true
    - id: 25
      name: damage_description
      label: Damage Description
      hint: Describe how the damage occurred
      type: text
      options: []
      required: true
    - id: 26
      name: damage_size
      label: Approximate Size of Damage
      hint: In inches
      type: text
      options: []
      required: false
    - id: 27
      name: incident_location
      label: Location of Incident
      hint: Where did the damage happen
      type: text
      options: []
      required: false
    - id: 28
      name: photos_attached
      label: Photos of Damage
      hint: Will you be submitting photos
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 29
      name: repair_preference
      label: Repair or Replacement Preference
      hint: Do you prefer repair or full replacement
      type: select_one
      options:
      - Repair if possible
      - Full replacement
      - Unsure let technician decide
      required: true
    - id: 30
      name: preferred_shop
      label: Preferred Repair Shop
      hint: Do you have a preferred shop
      type: text
      options: []
      required: false
    - id: 31
      name: authorization
      label: Authorization and Consent
      hint: I authorize the submission of this claim
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 32
      name: signature_date
      label: Date of Authorization
      hint: Today date
      type: date
      options: []
      required: true
