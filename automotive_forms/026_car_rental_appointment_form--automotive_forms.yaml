inputSchema:
  type: object
  properties:
    title: Car Rental Appointment Form
    pages:
    - id: 1
      name: customer_information
      label: Customer Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: For appointment confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: Street Address
      hint: Your address
      type: text
      options: []
      required: false
    - id: 7
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: false
    - id: 8
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: false
    - id: 9
      name: zip_code
      label: ZIP Code
      hint: Your ZIP code
      type: text
      options: []
      required: false
    - id: 10
      name: appointment_details
      label: Appointment Details
      hint: Your rental appointment preferences
      type: note
      options: []
      required: false
    - id: 11
      name: appointment_date
      label: Preferred Appointment Date
      hint: When do you want to come in?
      type: date
      options: []
      required: true
    - id: 12
      name: appointment_time
      label: Preferred Appointment Time
      hint: What time works for you?
      type: time
      options: []
      required: true
    - id: 13
      name: appointment_type
      label: Appointment Type
      hint: Purpose of appointment
      type: select_one
      options:
      - New rental pickup
      - Vehicle return
      - Vehicle exchange
      - Contract extension
      - Consultation
      - Other
      required: true
    - id: 14
      name: backup_date
      label: Backup Date
      hint: Alternative date
      type: date
      options: []
      required: false
    - id: 15
      name: backup_time
      label: Backup Time
      hint: Alternative time
      type: time
      options: []
      required: false
    - id: 16
      name: vehicle_preferences
      label: Vehicle Preferences
      hint: What vehicle are you interested in?
      type: note
      options: []
      required: false
    - id: 17
      name: vehicle_category
      label: Vehicle Category
      hint: Type of vehicle
      type: select_one
      options:
      - Economy
      - Compact
      - Mid-size
      - Full-size
      - SUV
      - Minivan
      - Luxury
      - Sports car
      - Truck
      - No preference
      required: true
    - id: 18
      name: specific_model
      label: Specific Model
      hint: If you have a preference
      type: text
      options: []
      required: false
    - id: 19
      name: rental_start_date
      label: Rental Start Date
      hint: When do you need the car?
      type: date
      options: []
      required: true
    - id: 20
      name: rental_end_date
      label: Rental End Date
      hint: When will you return it?
      type: date
      options: []
      required: true
    - id: 21
      name: rental_duration
      label: Rental Duration
      hint: How long?
      type: select_one
      options:
      - 1 day
      - 2-3 days
      - 4-7 days
      - 1-2 weeks
      - Over 2 weeks
      - Monthly
      required: true
    - id: 22
      name: transmission_preference
      label: Transmission Preference
      hint: Type of transmission
      type: select_one
      options:
      - Automatic
      - Manual
      - No preference
      required: true
    - id: 23
      name: fuel_preference
      label: Fuel Preference
      hint: Fuel type
      type: select_one
      options:
      - Gasoline
      - Diesel
      - Hybrid
      - Electric
      - No preference
      required: true
    - id: 24
      name: passenger_count
      label: Number of Passengers
      hint: How many people?
      type: select_one
      options:
      - 1-2
      - 3-4
      - 5-6
      - 7-8
      - 9+
      required: true
    - id: 25
      name: luggage_amount
      label: Amount of Luggage
      hint: How many bags?
      type: select_one
      options:
      - 1-2 bags
      - 3-4 bags
      - 5-6 bags
      - 7+ bags
      required: false
    - id: 26
      name: additional_services
      label: Additional Services
      hint: Any add-ons needed?
      type: select_multiple
      options:
      - GPS Navigation
      - Child Safety Seat
      - Booster Seat
      - Additional Driver
      - Ski Rack
      - Bike Rack
      - Toll Pass
      - Mobile WiFi
      - Car Seat for Infant
      - None
      required: false
    - id: 27
      name: special_requests
      label: Special Requests
      hint: Any specific requirements?
      type: text
      options: []
      required: false
    - id: 28
      name: location_preference
      label: Location Preference
      hint: Which location?
      type: select_one
      options:
      - Airport Location
      - Downtown Location
      - Suburban Location
      - Nearest location
      - No preference
      required: true
    - id: 29
      name: contact_preference
      label: Contact Preference
      hint: How should we contact you?
      type: select_one
      options:
      - Email
      - Phone call
      - Text message
      - Any method
      required: true
    - id: 30
      name: reminder_preference
      label: Reminder Preference
      hint: Do you want reminders?
      type: select_one
      options:
      - Yes - email and text
      - Email only
      - Text only
      - No reminders
      required: true
    - id: 31
      name: loyalty_member
      label: Loyalty Program Member
      hint: Are you a member?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Want to join
      required: false
    - id: 32
      name: loyalty_number
      label: Loyalty Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 33
      name: corporate_account
      label: Corporate Account
      hint: Do you have a corporate account?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 34
      name: corporate_account_name
      label: Corporate Account Name
      hint: Company name
      type: text
      options: []
      required: false
    - id: 35
      name: how_heard_about_us
      label: How Did You Hear About Us
      hint: Your referral source
      type: select_one
      options:
      - Website
      - Mobile app
      - Search engine
      - Social media
      - Friend/Family
      - Travel agent
      - Advertisement
      - Previous customer
      - Other
      required: false
    - id: 36
      name: first_time_renter
      label: First Time Renter
      hint: Have you rented from us before?
      type: select_one
      options:
      - Yes - multiple times
      - Yes - once before
      - No - first time
      required: true
    - id: 37
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 38
      name: appointment_date_submitted
      label: Appointment Request Date
      hint: Today's date
      type: date
      options: []
      required: true
