inputSchema:
  type: object
  properties:
    title: Auto Dollies Product Overview
    pages:
    - id: 1
      name: introduction
      label: Welcome to Auto Dollies
      hint: Thank you for your interest in our products
      type: note
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: Let us know how to reach you
      type: note
      options: []
      required: false
    - id: 3
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 4
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Name of your business or garage
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email Address
      hint: Primary email for correspondence
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 8
      name: business_type
      label: Business Type
      hint: What type of business are you
      type: select_one
      options:
      - Auto Repair Shop
      - Car Dealership
      - Restoration Shop
      - Racing Team
      - Private Collector
      - Storage Facility
      - Other
      required: true
    - id: 9
      name: product_interest
      label: Product Interest
      hint: Which Auto Dollies products interest you
      type: select_multiple
      options:
      - Standard Car Dollies
      - Heavy Duty Dollies
      - Low Profile Dollies
      - Wheel Chock Dollies
      - Motorcycle Dollies
      - Storage Dollies
      - Complete Set
      required: true
    - id: 10
      name: quantity_needed
      label: Estimated Quantity Needed
      hint: How many sets are you considering
      type: select_one
      options:
      - 1-5 sets
      - 6-10 sets
      - 11-20 sets
      - 21-50 sets
      - Over 50 sets
      required: true
    - id: 11
      name: primary_use
      label: Primary Use Case
      hint: How will you primarily use the dollies
      type: select_one
      options:
      - Vehicle Storage
      - Shop Mobility
      - Display Purposes
      - Transportation Loading
      - Restoration Projects
      - Other
      required: true
    - id: 12
      name: current_solution
      label: Current Vehicle Moving Solution
      hint: How do you currently move vehicles
      type: select_one
      options:
      - Manual Pushing
      - Floor Jacks
      - Old Dollies
      - Vehicle Lifts
      - No Current Solution
      - Other
      required: false
    - id: 13
      name: budget_range
      label: Budget Range
      hint: What is your expected budget
      type: select_one
      options:
      - Under $500
      - $500-$1000
      - $1000-$2500
      - $2500-$5000
      - Over $5000
      required: false
    - id: 14
      name: timeline
      label: Purchase Timeline
      hint: When are you looking to purchase
      type: select_one
      options:
      - Immediate
      - Within 1 month
      - 1-3 months
      - 3-6 months
      - Just researching
      required: true
    - id: 15
      name: facility_size
      label: Facility Size
      hint: Approximate square footage of your workspace
      type: select_one
      options:
      - Home Garage
      - Small Shop
      - Medium Facility
      - Large Warehouse
      - Multiple Locations
      required: false
    - id: 16
      name: additional_features
      label: Desired Features
      hint: What features are important to you
      type: select_multiple
      options:
      - Heavy Weight Capacity
      - Low Profile Design
      - Easy Maneuverability
      - Durability
      - Compact Storage
      - Price Value
      - Warranty
      required: false
    - id: 17
      name: questions
      label: Questions or Comments
      hint: Any specific questions about our products
      type: text
      options: []
      required: false
    - id: 18
      name: catalog_request
      label: Request Product Catalog
      hint: Would you like to receive our full catalog
      type: select_one
      options:
      - Yes send via email
      - Yes send via mail
      - No thank you
      required: true
    - id: 19
      name: demo_interest
      label: Interested in Product Demo
      hint: Would you like to see a demonstration
      type: select_one
      options:
      - Yes in person
      - Yes virtual
      - No thank you
      required: false
