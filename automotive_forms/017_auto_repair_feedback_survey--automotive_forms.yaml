inputSchema:
  type: object
  properties:
    title: Auto Repair Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Auto Repair Feedback Survey
      hint: Thank you for choosing our services. Please share your experience.
      type: note
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Information
      hint: Optional contact details
      type: note
      options: []
      required: false
    - id: 3
      name: first_name
      label: First Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 4
      name: last_name
      label: Last Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email Address
      hint: For follow-up if needed
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 7
      name: service_info
      label: Service Information
      hint: Details about your recent service
      type: note
      options: []
      required: false
    - id: 8
      name: service_date
      label: Date of Service
      hint: When was your service
      type: date
      options: []
      required: true
    - id: 9
      name: service_type
      label: Type of Service
      hint: What service did you receive
      type: select_one
      options:
      - Oil Change
      - Brake Service
      - Engine Repair
      - Transmission Service
      - Tire Service
      - Electrical Repair
      - AC Service
      - General Maintenance
      - Diagnostic
      - Other
      required: true
    - id: 10
      name: vehicle_year
      label: Vehicle Year
      hint: Year of your vehicle
      type: number
      options: []
      required: false
    - id: 11
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer
      type: text
      options: []
      required: false
    - id: 12
      name: vehicle_model
      label: Vehicle Model
      hint: Model name
      type: text
      options: []
      required: false
    - id: 13
      name: technician_name
      label: Technician Name
      hint: Who worked on your vehicle
      type: text
      options: []
      required: false
    - id: 14
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied were you overall
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 15
      name: service_quality
      label: Service Quality Rating
      hint: Rate the quality of work
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 16
      name: staff_friendliness
      label: Staff Friendliness
      hint: How friendly was the staff
      type: select_one
      options:
      - Very Friendly
      - Friendly
      - Neutral
      - Unfriendly
      - Very Unfriendly
      required: true
    - id: 17
      name: staff_knowledge
      label: Staff Knowledge
      hint: How knowledgeable was the staff
      type: select_one
      options:
      - Very Knowledgeable
      - Knowledgeable
      - Average
      - Not Very Knowledgeable
      - Unknowledgeable
      required: true
    - id: 18
      name: wait_time
      label: Wait Time
      hint: How long did you wait
      type: select_one
      options:
      - Less than 15 minutes
      - 15-30 minutes
      - 30-60 minutes
      - 1-2 hours
      - Over 2 hours
      required: true
    - id: 19
      name: wait_time_satisfaction
      label: Wait Time Satisfaction
      hint: Were you satisfied with the wait
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 20
      name: facility_cleanliness
      label: Facility Cleanliness
      hint: Rate the cleanliness
      type: select_one
      options:
      - Very Clean
      - Clean
      - Average
      - Dirty
      - Very Dirty
      required: true
    - id: 21
      name: communication
      label: Communication Rating
      hint: How well did we communicate
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 22
      name: explanation_of_work
      label: Explanation of Work Done
      hint: Was the work explained clearly
      type: select_one
      options:
      - Very Clearly
      - Clearly
      - Somewhat Clearly
      - Unclear
      - Very Unclear
      required: true
    - id: 23
      name: pricing
      label: Pricing Fairness
      hint: How fair was the pricing
      type: select_one
      options:
      - Very Fair
      - Fair
      - Neutral
      - Unfair
      - Very Unfair
      required: true
    - id: 24
      name: value_for_money
      label: Value for Money
      hint: Rate the value received
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Average Value
      - Poor Value
      - Very Poor Value
      required: true
    - id: 25
      name: timeliness
      label: Timeliness of Service
      hint: Was the work completed on time
      type: select_one
      options:
      - Completed Early
      - Completed On Time
      - Slightly Delayed
      - Significantly Delayed
      - Not Completed
      required: true
    - id: 26
      name: problem_resolved
      label: Was Problem Resolved
      hint: Did we fix your issue
      type: select_one
      options:
      - Yes Completely
      - Yes Partially
      - false
      - Too Soon to Tell
      required: true
    - id: 27
      name: return_likelihood
      label: Likelihood to Return
      hint: Will you come back
      type: select_one
      options:
      - Definitely Will
      - Probably Will
      - Might or Might Not
      - Probably Will Not
      - Definitely Will Not
      required: true
    - id: 28
      name: recommend_likelihood
      label: Likelihood to Recommend
      hint: Would you recommend us
      type: select_one
      options:
      - Definitely Will
      - Probably Will
      - Might or Might Not
      - Probably Will Not
      - Definitely Will Not
      required: true
    - id: 29
      name: best_aspect
      label: Best Aspect of Service
      hint: What did we do well
      type: text
      options: []
      required: false
    - id: 30
      name: improvement_areas
      label: Areas for Improvement
      hint: What could we improve
      type: text
      options: []
      required: false
    - id: 31
      name: additional_comments
      label: Additional Comments
      hint: Anything else to share
      type: text
      options: []
      required: false
