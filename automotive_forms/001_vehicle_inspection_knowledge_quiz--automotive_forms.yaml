inputSchema:
  type: object
  properties:
    title: vehicle_inspection_knowledge_quiz
    pages:
    - id: 1
      name: engine_type
      label: Engine Type
      hint: What is the engine type of a typical vehicle?
      type: select_one
      options:
      - V8
      - V6
      - V4
      - Inline 4
      required: true
    - id: 2
      name: brake_fluid_level_check
      label: Brake Fluid Level Check
      hint: How often should you check the brake fluid level?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Every 6 months
      required: true
    - id: 3
      name: suspension_function
      label: Suspension System Function
      hint: What is the primary function of the suspension system?
      type: select_one
      options:
      - Supports vehicle stability
      - Improves steering response
      - Reduces vibration
      - Increases vehicle height
      required: true
    - id: 4
      name: coolant_temp
      label: Coolant Temperature Check
      hint: At what temperature should you check the coolant level?
      type: select_one
      options:
      - Hot
      - Cold
      - Room Temperature
      - Not Applicable
      required: true
    - id: 5
      name: steering_purpose
      label: Steering System Purpose
      hint: What is the purpose of the steering system?
      type: select_one
      options:
      - To turn the vehicle
      - To steer the vehicle
      - To improve vehicle stability
      - To reduce fuel consumption
      required: true
    - id: 6
      name: tire_inspection_frequency
      label: Tire Inspection Frequency
      hint: How often should you inspect the tires?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Every 6 months
      required: true
    - id: 7
      name: final_submission
      label: Final Submission
      hint: Record your final results.
      type: date
      options: []
      required: true
