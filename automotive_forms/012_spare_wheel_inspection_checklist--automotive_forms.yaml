inputSchema:
  type: object
  properties:
    title: Spare Wheel Inspection Checklist
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: wheel_type
      label: Wheel Type
      hint: null
      type: select_one
      options:
      - '{''id'': 0, ''label'': ''None'', ''value'': ''''}'
      - '{''id'': 1, ''label'': ''Spare Wheel'', ''value'': ''spare_wheel''}'
      - '{''id'': 2, ''label'': ''Temporary Spare Wheel'', ''value'': ''temporary_spare_wheel''}'
      - '{''id'': 3, ''label'': ''Full Wheel'', ''value'': ''full_wheel''}'
      required: false
    - id: 3
      name: condition
      label: Condition
      hint: null
      type: select_multiple
      options:
      - '{''id'': 0, ''label'': ''None'', ''value'': ''''}'
      - '{''id'': 1, ''label'': ''Clean'', ''value'': ''clean''}'
      - '{''id'': 2, ''label'': ''Dirty'', ''value'': ''dirty''}'
      - '{''id'': 3, ''label'': ''Damaged'', ''value'': ''damaged''}'
      - '{''id'': 4, ''label'': ''Missing'', ''value'': ''missing''}'
      required: false
    - id: 4
      name: mileage
      label: Mileage
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - '{''id'': 0, ''label'': ''None'', ''value'': ''''}'
      - '{''id'': 1, ''label'': ''chatjimmy'', ''value'': ''chatjimmy''}'
      required: false
