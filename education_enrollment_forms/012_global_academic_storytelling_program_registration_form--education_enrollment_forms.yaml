inputSchema:
  type: object
  properties:
    title: Global Academic Storytelling Program Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Enter your first name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 3
      name: time_zones
      label: Time Zone
      hint: Select all your time zones
      type: select_multiple
      options:
      - EST
      - GMT
      - CST
      - PST
      - MST
      - AKST
      - YST
      required: true
    - id: 4
      name: language
      label: Language
      hint: Enter your language (e.g. English, Spanish, Mandarin, etc.)
      type: text
      options: []
      required: true
    - id: 5
      name: program
      label: Program
      hint: Enter your program name
      type: text
      options: []
      required: true
    - id: 6
      name: program_location
      label: Program Location
      hint: Enter your program location
      type: text
      options: []
      required: true
    - id: 7
      name: program_start_date
      label: Program Start Date
      hint: Enter your program start date
      type: date
      options: []
      required: true
    - id: 8
      name: confirm_email
      label: Confirm Email
      hint: Enter your email address again
      type: email
      options: []
      required: true
    - id: 9
      name: time_zone_1
      label: Time Zone 1
      hint: Enter your time zone 1
      type: time
      options: []
      required: true
    - id: 10
      name: time_zone_2
      label: Time Zone 2
      hint: Enter your time zone 2
      type: time
      options: []
      required: true
    - id: 11
      name: additional_info
      label: Additional Information
      hint: Enter any additional information
      type: note
      options: []
      required: false
    - id: 12
      name: program_location_repeated
      label: Program Location (repeated)
      hint: Enter your program location (again)
      type: text
      options: []
      required: false
    - id: 13
      name: program_start_date_repeated
      label: Program Start Date (repeated)
      hint: Enter your program start date again
      type: date
      options: []
      required: false
