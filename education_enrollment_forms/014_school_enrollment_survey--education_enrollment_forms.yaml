inputSchema:
  type: object
  properties:
    title: school-enrollment-survey
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: guardian_name
      label: Guardian Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: guardian_email
      label: Guardian Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: student_date_of_birth
      label: Student Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: student_parent_relationship
      label: How do you relate to this student?
      hint: null
      type: select_multiple
      options:
      - Parent
      - Grandparent
      - Guardian
      - Other
      required: true
    - id: 7
      name: number_of_siblings
      label: Number of Siblings
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: student_enrollment_status
      label: Enrollment Status
      hint: null
      type: select_one
      options:
      - Enrolled
      - In Progress
      - Not Enrolled
      required: true
