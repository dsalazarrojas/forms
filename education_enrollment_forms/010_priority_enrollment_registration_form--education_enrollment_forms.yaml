inputSchema:
  type: object
  properties:
    title: Priority Enrollment Registration Form
    pages:
    - id: 1
      name: applicant_details
      label: Applicant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: applicant_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: applicant_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: priority_status
      label: Priority Status
      hint: null
      type: select_one
      options:
      - High Priority
      - Standard Priority
      - Low Priority
      required: false
    - id: 6
      name: supporting_documents
      label: Supporting Documents
      hint: null
      type: select_multiple
      options:
      - ID Card
      - Birth Certificate
      - Transcript
      required: false
    - id: 7
      name: submit_button_goals
      label: Submit Button
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submit_button_text
      label: Submit
      hint: null
      type: text
      options: []
      required: false
