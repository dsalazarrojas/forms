inputSchema:
  type: object
  properties:
    title: Tutor Appointment Request Form
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: tutor_request
      label: Tutor Request
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: preferred_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
