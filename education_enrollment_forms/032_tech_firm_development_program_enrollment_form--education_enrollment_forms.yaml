inputSchema:
  type: object
  properties:
    title: tech_firm_development_program_enrollment_form
    pages:
    - id: 1
      name: program_details
      label: Program Name and Description
      hint: Enter the name and description of the program
      type: text
      options: []
      required: true
    - id: 2
      name: program_starting_date
      label: Training Program Start Date
      hint: YYYY-MM-DD format, date of the training program start
      type: date
      options: []
      required: true
    - id: 3
      name: program_starting_time
      label: Training Program Start Time
      hint: HH -MM format, time of the training program start
      type: time
      options: []
      required: true
    - id: 4
      name: program_duration
      label: Training Program Duration
      hint: Number of days, weeks or months
      type: number
      options: []
      required: true
    - id: 5
      name: program_location
      label: Training Program Location
      hint: Enter the location of the training program
      type: text
      options: []
      required: true
    - id: 6
      name: resume_upload
      label: Resume Upload
      hint: Attach a resume for evaluation
      type: text
      options: []
      required: false
    - id: 7
      name: training_program_type
      label: Training Program Type
      hint: Select type of the program (full-time, part-time)
      type: select_one
      options:
      - Full-time
      - Part-time
      required: true
    - id: 8
      name: program_focus_area
      label: Program Focus Area
      hint: Enter the focus area of the program
      type: text
      options: []
      required: true
    - id: 9
      name: resume_portfolio
      label: Resume for Portfolio
      hint: Attach a resume for portfolio review
      type: text
      options: []
      required: false
    - id: 10
      name: contact_information
      label: Contact Information
      hint: Enter the contact information for follow-up questions
      type: text
      options: []
      required: true
