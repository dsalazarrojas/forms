    - id: 6
      name: access_purpose
      label: Purpose of access
      hint: Describe the academic support needed
      type: select_one
      options:
        - Tutoring
        - Study resources
        - Accessibility support
        - Research assistance
        - Other
      required: true
    - id: 7
      name: requested_resources
      label: Requested resources or services
      hint: List specific tools or accommodations
