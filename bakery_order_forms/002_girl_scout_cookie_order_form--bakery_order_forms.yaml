inputSchema:
  type: object
  properties:
    title: Girl Scout Cookie Order Form
    pages:
    - id: 1
      name: cookie_type
      label: Cookie Type
      hint: null
      type: select_multiple
      options:
      - Chocolate Chip
      - Peanut Butter
      - Oatmeal Raisin
      - Snickerdoodle
      required: false
    - id: 2
      name: cookie_count
      label: Cookie Count
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: cookie_price
      label: Cookie Price
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: order_details
      label: Order Details
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - PayPal
      required: false
    - id: 10
      name: special_request
      label: Special Request
      hint: null
      type: text
      options: []
      required: false
