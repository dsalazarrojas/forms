      options: []
      required: false
    - id: 4
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: customer_email
      label: customer email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: customer_phone
      label: customer phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: delivery_address
      label: delivery address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: delivery_note
      label: delivery note
      hint: null
      type: note
      options: []
      required: false
