inputSchema:
  type: object
  properties:
    title: Cake Order Form
    pages:
    - id: 1
      name: contact_info_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: cake_details_header
      label: -- Cake Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: cake_flavor
      label: Cake Flavor
      hint: null
      type: select_one
      options:
      - Chocolate
      - Vanilla
      - Strawberry
      - Red Velvet
      - Lemon
      - Carrot
      - Cheesecake
      - Custom
      required: true
    - id: 7
      name: cake_size
      label: Cake Size
      hint: null
      type: select_one
      options:
      - 6 inch (4 servings)
      - 8 inch (8 servings)
      - 10 inch (12 servings)
      - 12 inch (18 servings)
      - Sheet cake (30+ servings)
      - Custom size
      required: true
    - id: 8
      name: cake_shape
      label: Cake Shape
      hint: null
      type: select_one
      options:
      - Round
      - Square
      - Rectangular
      - Heart-shaped
      - Custom
      required: true
    - id: 9
      name: frosting_type
      label: Frosting Type
      hint: null
      type: select_one
      options:
      - Buttercream
      - Cream Cheese
      - Chocolate Ganache
      - Fondant
      - Whipped Cream
      required: true
    - id: 10
      name: filling_options
      label: Cake Filling
      hint: null
      type: select_multiple
      options:
      - Fruit preserves
      - Chocolate mousse
      - Vanilla cream
      - Lemon curd
      - Caramel
      - None
      required: true
    - id: 11
      name: decoration_header
      label: -- Decoration and Customization --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: special_message
      label: Special Message or Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: decoration_preferences
      label: Decoration Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: dietary_needs
      label: Dietary Requirements
      hint: null
      type: select_multiple
      options:
      - Gluten-free
      - Dairy-free
      - Vegan
      - Nut-free
      - Sugar-free
      - None
      required: false
    - id: 15
      name: allergies
      label: Allergies or Restrictions
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: delivery_header
      label: -- Delivery/Pickup Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 18
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 19
      name: delivery_method
      label: Delivery or Pickup?
      hint: null
      type: select_one
      options:
      - Pickup
      - Delivery
      required: true
    - id: 20
      name: delivery_address
      label: Delivery Address
      hint: If delivery selected
      type: text
      options: []
      required: false
    - id: 21
      name: payment_header
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: payment_type
      label: Preferred Payment Type
      hint: null
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Cash
      - Check
      - Bank Transfer
      required: true
    - id: 23
      name: deposit_required
      label: Deposit Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: special_requests
      label: Special Requests or Notes
      hint: null
      type: text
      options: []
      required: false
