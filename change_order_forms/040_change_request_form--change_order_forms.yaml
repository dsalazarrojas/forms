inputSchema:
  type: object
  properties:
    title: Change Request Form
    pages:
    - id: 1
      name: request_date
      label: Request Date
      hint: When submitted
      type: date
      options: []
      required: true
    - id: 2
      name: change_request_id
      label: Change Request ID
      hint: Unique identifier
      type: text
      options: []
      required: false
    - id: 3
      name: requester_name
      label: Requester Name
      hint: Who is requesting the change
      type: text
      options: []
      required: true
    - id: 4
      name: requester_department
      label: Requester Department
      hint: Department of requester
      type: text
      options: []
      required: false
    - id: 5
      name: requester_email
      label: Requester Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: requester_phone
      label: Requester Phone
      hint: Contact phone
      type: text
      options: []
      required: false
    - id: 7
      name: project_name
      label: Project or System Name
      hint: What is being affected
      type: text
      options: []
      required: true
    - id: 8
      name: project_id
      label: Project ID
      hint: Project identifier
      type: text
      options: []
      required: false
    - id: 9
      name: change_title
      label: Change Request Title
      hint: Brief title
      type: text
      options: []
      required: true
    - id: 10
      name: change_category
      label: Change Category
      hint: Type of change
      type: select_one
      options:
      - Feature Request
      - Bug Fix
      - Performance Improvement
      - Security Enhancement
      - Documentation
      - Infrastructure
      - Process Change
      required: true
    - id: 11
      name: change_description
      label: Change Description
      hint: Detailed description
      type: text
      options: []
      required: true
    - id: 12
      name: business_benefit
      label: Business Benefit or Justification
      hint: Why is this change needed
      type: text
      options: []
      required: true
    - id: 13
      name: affected_systems
      label: Affected Systems or Areas
      hint: What will be impacted
      type: text
      options: []
      required: true
    - id: 14
      name: priority_level
      label: Priority Level
      hint: How urgent is this
      type: select_one
      options:
      - Critical
      - High
      - Medium
      - Low
      required: true
    - id: 15
      name: estimated_effort
      label: Estimated Effort Required
      hint: Hours or days needed
      type: text
      options: []
      required: false
    - id: 16
      name: resource_requirements
      label: Resource Requirements
      hint: People, tools, budget needed
      type: text
      options: []
      required: false
    - id: 17
      name: proposed_timeline
      label: Proposed Implementation Timeline
      hint: When should this happen
      type: text
      options: []
      required: false
    - id: 18
      name: risk_assessment
      label: Risk Assessment
      hint: Potential risks
      type: text
      options: []
      required: false
    - id: 19
      name: approval_status
      label: Approval Status
      hint: Current status
      type: select_one
      options:
      - Pending Review
      - Approved
      - Conditional Approval
      - Rejected
      - Awaiting Signatures
      required: true
    - id: 20
      name: approver_name
      label: Approver Name
      hint: Who approved or will approve
      type: text
      options: []
      required: false
    - id: 21
      name: additional_notes
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
