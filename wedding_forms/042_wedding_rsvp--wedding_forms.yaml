inputSchema:
  type: object
  properties:
    title: Wedding rsvp
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: First name of guest
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Last name of guest
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Email of guest
      type: email
      options: []
      required: true
    - id: 4
      name: date
      label: Date
      hint: Date of wedding
      type: date
      options: []
      required: true
    - id: 5
      name: time
      label: Time
      hint: Time of wedding
      type: time
      options: []
      required: true
    - id: 6
      name: attending
      label: Attending
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
