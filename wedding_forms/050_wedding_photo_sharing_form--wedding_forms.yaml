      name: attendee_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: wedding_date
      label: Wedding Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: email
      label: Email
