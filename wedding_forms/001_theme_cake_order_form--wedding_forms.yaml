inputSchema:
  type: object
  properties:
    title: Theme Cake Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_options
      label: Payment Options
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: cake_type
      label: Cake Type
      hint: null
      type: select_one
      options:
      - Apple
      - Chocolate
      - Red Velvet
      - Vanilla
      required: false
    - id: 4
      name: cake_size
      label: Cake Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 5
      name: cake_flavor
      label: Cake Flavor
      hint: null
      type: select_one
      options:
      - Vanilla
      - Chocolate
      - Red Velvet
      - Lemon
      - Strawberry
      required: false
    - id: 6
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: total_price
      label: Total Price
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Card
      required: false
    - id: 10
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
