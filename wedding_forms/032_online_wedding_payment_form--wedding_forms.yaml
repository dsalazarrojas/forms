inputSchema:
  type: object
  properties:
    title: Online Wedding Payment Form
    pages:
    - id: 1
      name: client_info
      label: Client Info
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: service_price
      label: Service Price
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Cash''}'
      - '{''id'': 2, ''label'': ''Credit''}'
      - '{''id'': 3, ''label'': ''PayPal''}'
      - '{''id'': 4, ''label'': ''Bank''}'
      required: true
    - id: 5
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Paid''}'
      - '{''id'': 2, ''label'': ''Not Paid''}'
      required: true
    - id: 7
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
