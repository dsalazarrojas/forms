inputSchema:
  type: object
  properties:
    title: Camp Volunteer Registration
    pages:
    - id: 1
      name: volunteer_name
      label: Volunteer Full Name
      hint: Full name for registration
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: For volunteer communications
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 4
      name: availability
      label: Availability Dates
      hint: Dates you can volunteer
      type: text
      options: []
      required: true
    - id: 5
      name: roles_interested
      label: Roles Interested In
      hint: Select preferred volunteer roles
      type: select_multiple
      options:
      - Counselor
      - Support Staff
      - Kitchen
      - First Aid
      required: true
    - id: 6
      name: t_shirt_size
      label: T Shirt Size
      hint: For volunteer uniform
      type: select_one
      options:
      - S
      - M
      - L
      - XL
      required: false
    - id: 7
      name: background_check_consent
      label: Consent for Background Check
      hint: Required for many volunteer positions
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: For volunteer safety
      type: text
      options: []
      required: true
    - id: 9
      name: prior_experience
      label: Prior Volunteer Experience
      hint: Summary of relevant past experience
      type: text
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional Notes
      hint: Any other information for organizers
      type: text
      options: []
      required: false
