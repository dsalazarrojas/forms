inputSchema:
  type: object
  properties:
    title: Volunteer Registration Form
    pages:
    - id: 1
      name: full_name
      label: Full name
      hint: Volunteer full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email address
      hint: Preferred contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone number
      hint: Contact phone
      type: text
      options: []
      required: false
    - id: 4
      name: availability
      label: Availability
      hint: Days and times volunteer is available
      type: text
      options: []
      required: true
    - id: 5
      name: areas_of_interest
      label: Areas of interest
      hint: Select volunteer roles of interest
      type: select_multiple
      options:
      - Event setup
      - Program assistance
      - Fundraising
      - Administrative support
      - Outreach
      required: true
    - id: 6
      name: relevant_experience
      label: Relevant experience or skills
      hint: Brief summary of applicable experience
      type: text
      options: []
      required: false
    - id: 7
      name: background_check_consent
      label: Consent to background check
      hint: Required for certain roles
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 8
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Required for volunteer records
      type: text
      options: []
      required: true
