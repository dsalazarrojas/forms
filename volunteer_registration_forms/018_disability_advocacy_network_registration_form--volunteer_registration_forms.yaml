inputSchema:
  type: object
  properties:
    title: Disability Advocacy Network Registration Form
    pages:
    - id: 1
      name: user_details
      label: User details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: accessibility_needs
      label: Accessibility needs
      hint: null
      type: select_multiple
      options:
      - None
      - Hearing
      - Speech
      - Mobility
      - Visual
      - Cognitive
      - Mental health
      - Physical
      - prophets
      required: false
    - id: 3
      name: interests
      label: Interests
      hint: null
      type: select_one
      options:
      - Arts and culture
      - Education
      - Employment
      - Health and wellness
      - Housing and transportation
      - Income and financial
      - Legal and advocacy
      - Living and social
      - Personal
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
