inputSchema:
  type: object
  properties:
    title: Animal Shelter Volunteer Registration Form
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Must be 18 or older
      type: date
      options: []
      required: true
    - id: 5
      name: address
      label: Street Address
      hint: Current address
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: ZIP or Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to you
      type: text
      options: []
      required: true
    - id: 12
      name: start_date_preference
      label: Preferred Start Date
      hint: When can you begin
      type: date
      options: []
      required: true
    - id: 13
      name: availability_schedule
      label: Weekly Availability
      hint: Select all that apply
      type: select_multiple
      options:
      - Monday Morning
      - Monday Afternoon
      - Monday Evening
      - Tuesday Morning
      - Tuesday Afternoon
      - Tuesday Evening
      - Wednesday Morning
      - Wednesday Afternoon
      - Wednesday Evening
      - Thursday Morning
      - Thursday Afternoon
      - Thursday Evening
      - Friday Morning
      - Friday Afternoon
      - Friday Evening
      - Saturday Morning
      - Saturday Afternoon
      - Saturday Evening
      - Sunday Morning
      - Sunday Afternoon
      - Sunday Evening
      required: true
    - id: 14
      name: volunteer_programs
      label: Programs of Interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Dog Walking Program
      - Cat Socialization
      - Small Animal Care
      - Foster Care Program
      - Adoption Ambassador
      - Event Volunteer
      - Administrative Support
      - Transport Team
      - Cleaning Crew
      - Medical Support
      - Training Assistant
      - Photography Team
      - Other
      required: true
    - id: 15
      name: time_commitment
      label: Expected Time Commitment
      hint: Hours per week
      type: select_one
      options:
      - 1-5 hours
      - 6-10 hours
      - 11-15 hours
      - 16-20 hours
      - 20+ hours
      required: true
    - id: 16
      name: commitment_duration
      label: Commitment Duration
      hint: How long can you volunteer
      type: select_one
      options:
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1+ years
      - Indefinitely
      required: true
    - id: 17
      name: animal_experience
      label: Experience with Animals
      hint: Describe your background
      type: text
      options: []
      required: true
    - id: 18
      name: volunteer_experience
      label: Previous Volunteer Experience
      hint: Describe any previous volunteering
      type: text
      options: []
      required: false
    - id: 19
      name: special_skills
      label: Special Skills or Certifications
      hint: Select all that apply
      type: select_multiple
      options:
      - Veterinary Technician
      - Animal Trainer
      - Behaviorist
      - Photographer
      - Writer
      - Social Media Manager
      - Graphic Designer
      - Event Planner
      - Teacher or Educator
      - Counselor
      - None
      - Other
      required: false
    - id: 20
      name: physical_capabilities
      label: Physical Capabilities
      hint: Can you perform required tasks
      type: select_one
      options:
      - No Limitations
      - Some Limitations
      - Prefer Light Duty
      required: true
    - id: 21
      name: limitations_description
      label: Please Describe Limitations
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 22
      name: allergies
      label: Do You Have Any Allergies
      hint: Animals cleaning products etc
      type: select_one
      options:
      - No Allergies
      - Mild - Manageable
      - Severe - Need Accommodation
      required: true
    - id: 23
      name: allergy_details
      label: Allergy Details
      hint: If yes describe
      type: text
      options: []
      required: false
    - id: 24
      name: background_check_consent
      label: I Consent to a Background Check
      hint: Required for all volunteers
      type: select_one
      options:
      - Yes I Consent
      - No I Do Not Consent
      required: true
    - id: 25
      name: reference_1
      label: Reference 1 - Name and Contact
      hint: Full name phone and email
      type: text
      options: []
      required: true
    - id: 26
      name: reference_2
      label: Reference 2 - Name and Contact
      hint: Full name phone and email
      type: text
      options: []
      required: true
    - id: 27
      name: how_heard
      label: How Did You Hear About Us
      hint: null
      type: select_one
      options:
      - Website
      - Social Media
      - Friend or Family
      - Current Volunteer
      - Event
      - Search Engine
      - Advertisement
      - Other
      required: false
    - id: 28
      name: motivation_statement
      label: Why Do You Want to Volunteer
      hint: Share your motivation
      type: text
      options: []
      required: true
    - id: 29
      name: policy_agreement
      label: I Agree to Follow All Shelter Policies
      hint: Including safety and confidentiality
      type: select_one
      options:
      - Yes I Agree
      - No I Do Not Agree
      required: true
    - id: 30
      name: liability_waiver
      label: I Accept the Liability Waiver
      hint: Understanding risks involved
      type: select_one
      options:
      - Yes I Accept
      - No I Do Not Accept
      required: true
    - id: 31
      name: applicant_signature
      label: Electronic Signature
      hint: Type your full name
      type: text
      options: []
      required: true
    - id: 32
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
