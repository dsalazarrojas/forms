inputSchema:
  type: object
  properties:
    title: Company Holiday Survey
    pages:
      - id: 1
        name: employee_name
        label: Employee name
        hint: Optional for planning
        type: text
        options: []
        required: false
      - id: 2
        name: preferred_event_type
        label: Preferred holiday event type
        hint: Choose your preferred event format
        type: select_one
        options: [In person gathering, Virtual celebration, Hybrid event]
        required: true
      - id: 3
        name: preferred_date_range
        label: Preferred date range
        hint: Dates that work best for you
        type: text
        options: []
        required: false
      - id: 4
        name: dietary_restrictions
        label: Dietary restrictions
        hint: Specify any food allergies or preferences
        type: text
        options: []
        required: false
      - id: 5
        name: gift_exchange_interest
        label: Interest in gift exchange
        hint: Would you like to participate in gift exchange
        type: select_one
        options: [Yes, No, Maybe]
        required: false
      - id: 6
        name: volunteer_to_help
        label: Volunteer to help organize
        hint: Sign up to assist planning or logistics
        type: select_one
        options: [Yes, No]
        required: false
