inputSchema:
  type: object
  properties:
    title: Accident Claim Form
    pages:
    - id: 1
      name: claimant_full_name
      label: Claimant Full Name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: claimant_date_of_birth
      label: Claimant Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: true
    - id: 3
      name: claimant_address
      label: Claimant Address
      hint: Your current address
      type: text
      options: []
      required: true
    - id: 4
      name: claimant_phone
      label: Claimant Phone
      hint: Your phone number
      type: text
      options: []
      required: true
    - id: 5
      name: claimant_email
      label: Claimant Email
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 6
      name: policy_number
      label: Policy Number
      hint: Your insurance policy number
      type: text
      options: []
      required: true
    - id: 7
      name: accident_date
      label: Accident Date
      hint: Date when the accident occurred
      type: date
      options: []
      required: true
    - id: 8
      name: accident_time
      label: Accident Time
      hint: Time when the accident occurred
      type: time
      options: []
      required: true
    - id: 9
      name: accident_location
      label: Accident Location
      hint: Complete address where the accident occurred
      type: text
      options: []
      required: true
    - id: 10
      name: accident_type
      label: Accident Type
      hint: What type of accident occurred?
      type: select_one
      options:
      - Motor Vehicle Collision
      - Slip and Fall
      - Workplace Injury
      - Property Damage
      - Personal Injury
      - Other
      required: true
    - id: 11
      name: weather_conditions
      label: Weather Conditions
      hint: Weather conditions at the time of the accident
      type: select_one
      options:
      - Clear
      - Rain
      - Snow
      - Fog
      - Wind
      - Nighttime
      - Other
      required: true
    - id: 12
      name: accident_description
      label: Accident Description
      hint: Detailed description of how the accident occurred
      type: text
      options: []
      required: true
    - id: 13
      name: injuries_sustained
      label: Injuries Sustained
      hint: Describe any injuries sustained in the accident
      type: text
      options: []
      required: true
    - id: 14
      name: property_damage
      label: Property Damage
      hint: Describe any property damage that occurred
      type: text
      options: []
      required: true
    - id: 15
      name: police_report_filed
      label: Police Report Filed
      hint: Was a police report filed for this accident?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Applicable
      required: true
    - id: 16
      name: police_report_number
      label: Police Report Number
      hint: If applicable, provide the police report number
      type: text
      options: []
      required: false
    - id: 17
      name: witness_names
      label: Witness Names
      hint: Names and contact information of any witnesses
      type: text
      options: []
      required: false
    - id: 18
      name: other_parties_involved
      label: Other Parties Involved
      hint: Names and contact information of other parties involved
      type: text
      options: []
      required: false
    - id: 19
      name: medical_treatment_received
      label: Medical Treatment Received
      hint: Have you received medical treatment for injuries?
      type: select_one
      options:
      - Yes, Emergency
      - Yes, Doctor Visit
      - Yes, Hospital
      - 'No'
      - Planning to Seek Treatment
      required: true
    - id: 20
      name: estimated_damage_amount
      label: Estimated Damage Amount
      hint: Estimated amount of damages
      type: number
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any other information relevant to your claim
      type: text
      options: []
      required: false
