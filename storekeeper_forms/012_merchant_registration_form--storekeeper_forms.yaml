inputSchema:
  type: object
  properties:
    title: Merchant Registration Form
    pages:
    - id: 1
      name: storekeeper_form_vendor_invite
      label: Send an invite to vendors
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: storekeeper_form_registration_type
      label: Registration Type
      hint: null
      type: select_one
      options:
      - early bird
      - standard
      required: true
    - id: 3
      name: storekeeper_form_early_bird_coupon
      label: Early Bird Coupon
      hint: Enter the coupon code here
      type: text
      options: []
      required: false
    - id: 4
      name: storekeeper_form_sponsorship_level
      label: Sponsorship Level
      hint: null
      type: select_multiple
      options:
      - Bronze
      - Silver
      - Gold
      - VIP
      required: true
    - id: 5
      name: storekeeper_form_representative_name
      label: Representative Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: storekeeper_form_meal_prep
      label: Meal Preperation
      hint: null
      type: select_multiple
      options:
      - veg
      - non-veg
      required: true
    - id: 7
      name: storekeeper_form_vendor_name
      label: Vendor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: storekeeper_form_vendor_email
      label: Vendor Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: storekeeper_form_vendor_phone
      label: Vendor Phone
      hint: null
      type: text
      options: []
      required: false
