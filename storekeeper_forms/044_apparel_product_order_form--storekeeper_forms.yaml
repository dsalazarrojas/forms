inputSchema:
  type: object
  properties:
    title: Apparel Product Order Form
    pages:
    - id: 1
      name: store_info_header
      label: -- Store Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: store_name
      label: Store Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: store_id
      label: Store ID / Branch Code
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: product_info_header
      label: -- Product Order Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: item_sku
      label: Item SKU or Product Code
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: product_category
      label: Product Category
      hint: null
      type: select_one
      options:
      - Tops
      - Bottoms
      - Outerwear
      - Accessories
      - Footwear
      required: true
    - id: 7
      name: brand_name
      label: Brand Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: garment_size
      label: Size
      hint: null
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      - One Size
      required: true
    - id: 9
      name: quantity_ordered
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: order_priority
      label: Priority
      hint: null
      type: select_one
      options:
      - Low
      - Normal
      - High
      - Urgent (Stock Out)
      required: true
    - id: 11
      name: request_date
      label: Date of Request
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: expected_delivery
      label: Expected Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: storekeeper_notes
      label: Additional Notes for Warehouse
      hint: null
      type: text
      options: []
      required: false
