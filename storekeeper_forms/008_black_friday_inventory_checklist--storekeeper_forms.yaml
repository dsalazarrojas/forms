inputSchema:
  type: object
  properties:
    title: Black Friday Inventory Checklist
    pages:
      - id: 1
        name: checklist_header
        label: Black Friday Inventory Preparation Checklist
        hint: Complete this checklist to ensure inventory readiness for Black Friday
        type: note
        options: []
        required: false
      - id: 2
        name: store_location
        label: Store Location
        hint: Which store is this for
        type: text
        options: []
        required: true
      - id: 3
        name: manager_name
        label: Store Manager Name
        hint: Person responsible for this checklist
        type: text
        options: []
        required: true
      - id: 4
        name: completion_date
        label: Completion Date
        hint: Date checklist was completed
        type: date
        options: []
        required: true
      - id: 5
        name: electronics_stock_check
        label: Electronics Stock Verified
        hint: All electronics inventory counted and verified
        type: select_one
        options:
          - Complete
          - In Progress
          - Not Started
          - Not Applicable
        required: true
      - id: 6
        name: clothing_stock_check
        label: Clothing Stock Verified
        hint: All apparel inventory counted and verified
        type: select_one
        options:
          - Complete
          - In Progress
          - Not Started
          - Not Applicable
        required: true
      - id: 7
        name: home_goods_stock_check
        label: Home Goods Stock Verified
        hint: All home goods inventory counted and verified
        type: select_one
        options:
          - Complete
          - In Progress
          - Not Started
          - Not Applicable
        required: true
      - id: 8
        name: toys_stock_check
        label: Toys Stock Verified
        hint: All toy inventory counted and verified
        type: select_one
        options:
          - Complete
          - In Progress
          - Not Started
          - Not Applicable
        required: true
      - id: 9
        name: low_stock_items
        label: Low Stock Items Identified
        hint: Items that need restocking before Black Friday
        type: select_one
        options:
          - Yes List Created
          - No Low Stock
          - Still Assessing
        required: true
      - id: 10
        name: reorder_requests_submitted
        label: Reorder Requests Submitted
        hint: All necessary reorders placed with suppliers
        type: select_one
        options:
          - All Submitted
          - Some Pending
          - Not Yet Started
        required: true
      - id: 11
        name: warehouse_space_cleared
        label: Warehouse Space Cleared
        hint: Storage areas prepared for incoming stock
        type: select_one
        options:
          - Yes Complete
          - In Progress
          - Not Started
        required: true
      - id: 12
        name: pricing_labels_updated
        label: Pricing Labels Updated
        hint: All Black Friday prices labeled correctly
        type: select_one
        options:
          - All Updated
          - Partially Updated
          - Not Started
        required: true
      - id: 13
        name: display_areas_prepared
        label: Display Areas Prepared
        hint: Promotional display spaces ready
        type: select_one
        options:
          - Ready
          - Being Set Up
          - Not Started
        required: true
      - id: 14
        name: security_tags_applied
        label: Security Tags Applied
        hint: High-value items secured
        type: select_one
        options:
          - All Tagged
          - In Progress
          - Not Started
        required: true
      - id: 15
        name: pos_system_tested
        label: POS System Tested
        hint: Point of sale systems verified and ready
        type: select_one
        options:
          - Tested and Working
          - Testing Scheduled
          - Issues Found
        required: true
      - id: 16
        name: staff_scheduled
        label: Staff Scheduled
        hint: Adequate staffing for inventory management
        type: select_one
        options:
          - Fully Staffed
          - Partially Staffed
          - Need More Staff
        required: true
      - id: 17
        name: backup_suppliers_contacted
        label: Backup Suppliers Contacted
        hint: Alternative suppliers on standby
        type: select_one
        options:
          - Yes Contacted
          - Not Needed
          - Still Working On
        required: false
      - id: 18
        name: inventory_software_updated
        label: Inventory Software Updated
        hint: Systems current with latest version
        type: select_one
        options:
          - Updated
          - Update Scheduled
          - Not Required
        required: true
      - id: 19
        name: additional_notes
        label: Additional Notes
        hint: Any issues or concerns to report
        type: text
        options: []
        required: false
      - id: 20
        name: manager_signature
        label: Manager Signature
        hint: Digital signature or typed name
        type: text
        options: []
        required: true
