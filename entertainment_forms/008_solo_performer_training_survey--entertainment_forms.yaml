inputSchema:
  type: object
  properties:
    title: Solo Performer Training Survey
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: discipline
      label: Discipline
      hint: null
      type: select_one
      options:
      - Instrumental/Composition
      - Dance
      - Theater
      - Visual Arts
      - Other
      required: true
    - id: 6
      name: experience
      label: Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: training_habits
      label: Training Habits
      hint: null
      type: select_multiple
      options:
      - Regularly
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 8
      name: support_needs
      label: Support Needs
      hint: null
      type: select_multiple
      options:
      - Coaching
      - Financial Support
      - Performance Opportunities
      - Other
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
