inputSchema:
  type: object
  properties:
    title: Demon Summoning Request Form
    pages:
    - id: 1
      name: scheduling_preferences
      label: Scheduling Preferences
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: request_details
      label: Request Details
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 3
      name: scheduling_date
      label: Scheduling Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: ritual_type
      label: Ritual Type
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
