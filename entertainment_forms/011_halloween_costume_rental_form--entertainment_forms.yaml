inputSchema:
  type: object
  properties:
    title: Halloween Costume Rental Form
    pages:
    - id: 1
      name: costume_id
      label: Select Costume
      hint: Which costume would you like to rent?
      type: select_multiple
      options:
      - Costume 1
      - Costume 2
      - Costume 3
      required: false
    - id: 2
      name: customer_name
      label: Costume Name
      hint: Name of the costume you'd like to rent?
      type: text
      options: []
      required: false
    - id: 3
      name: costume_description
      label: Costume Description
      hint: Description of the costume?
      type: text
      options: []
      required: false
    - id: 4
      name: price
      label: Cost of the Costume
      hint: How much would you like to pay for the costume?
      type: number
      options: []
      required: false
    - id: 5
      name: image_url
      label: Costume Image URL
      hint: Please enter the URL of an image of the costume.
      type: text
      options: []
      required: false
    - id: 6
      name: contact_info
      label: Contact Information
      hint: What's your contact information?
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: What's your email address?
      type: email
      options: []
      required: false
    - id: 8
      name: home_address
      label: Address
      hint: What's your home address?
      type: text
      options: []
      required: false
    - id: 9
      name: additional_info
      label: Additional Information
      hint: How can we contact you?
      type: text
      options: []
      required: false
    - id: 10
      name: image_upload
      label: Upload Another Image
      hint: Please upload another image of the costume.
      type: text
      options: []
      required: false
    - id: 11
      name: more_costumes
      label: Rent More Costumes
      hint: Do you want to rent another costume?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: confirm_submission
      label: Confirm Submission
      hint: null
      type: text
      options: []
      required: false
