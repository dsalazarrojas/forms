inputSchema:
  type: object
  properties:
    title: Script Lab Submission
    pages:
    - id: 1
      name: category
      label: Category
      hint: Select the category for your submission
      type: select_one
      options:
      - Entertainment
      - Other
      required: true
    - id: 2
      name: description
      label: Description
      hint: Briefly describe your submission
      type: text
      options: []
      required: true
    - id: 3
      name: assigned_tool
      label: Assigned Tool
      hint: Select the tool used for your submission
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
    - id: 4
      name: form_id
      label: Form ID
      hint: Enter a unique form ID
      type: number
      options: []
      required: true
    - id: 5
      name: output_file
      label: Output File
      hint: Upload your output file
      type: text
      options: []
      required: true
    - id: 6
      name: file_description
      label: File Description
      hint: Description of the uploaded file
      type: text
      options: []
      required: true
    - id: 7
      name: form_id_2
      label: Duplicate Form ID
      hint: Another unique ID
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool_2
      label: Another Assigned Tool
      hint: Select another tool
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
