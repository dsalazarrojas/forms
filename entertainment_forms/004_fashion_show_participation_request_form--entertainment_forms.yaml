      - 'No'
      required: true
    - id: 8
      name: fashion_item_description
      label: Fashion Item Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: fashion_item_image
      label: Fashion Item Image
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: participation_type
      label: Participation Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
