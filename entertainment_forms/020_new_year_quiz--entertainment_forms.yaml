inputSchema:
  type: object
  properties:
    title: New Year Quiz
    pages:
    - id: 1
      name: current_goals
      label: What are your current goals?
      hint: null
      type: select_multiple
      options:
      - Short-term goals
      - Long-term goals
      - Personal goals
      - Career goals
      - Financial goals
      - Education goals
      - Health and wellness goals
      - Relationship goals
      - Travel goals
      - Hobbies goals
      required: true
    - id: 2
      name: favorite_places
      label: Where do you spend most of your free time?
      hint: null
      type: select_multiple
      options:
      - Home
      - Work
      - School
      - Park
      - Beach
      - City
      - Forest
      - Mountain
      - Rural area
      required: true
    - id: 3
      name: hobbies
      label: What are your favorite activities or hobbies?
      hint: null
      type: select_multiple
      options:
      - Reading
      - Writing
      - Music
      - Art
      - Sports
      - Cooking
      - Traveling
      - Playing video games
      - Hiking
      - Dancing
      required: true
    - id: 4
      name: vacation_last_year
      label: Where did you go on a vacation last year?
      hint: null
      type: select_multiple
      options:
      - Beach resort
      - City break
      - National park
      - Theme park
      - Cruise
      - Cruise ship
      - Road trip
      - Hiking
      - Mountain retreat
      - City
      required: true
    - id: 5
      name: best_time_of_year
      label: What is the best time of year for you?
      hint: null
      type: select_one
      options:
      - Spring
      - Summer
      - Autumn
      - Winter
      required: true
    - id: 6
      name: favorite_entertainment
      label: What is your favorite type of entertainment?
      hint: null
      type: select_multiple
      options:
      - TV shows
      - Movies
      - Music
      - Video games
      - Books
      - Sports
      - Theater
      - Concerts
      - Festivals
      required: true
    - id: 7
      name: favorite_music
      label: What is your favorite type of music?
      hint: null
      type: select_multiple
      options:
      - Pop
      - Rock
      - Classical
      - Jazz
      - Folk
      - Hip-hop
      - Country
      - Electronic
      - R&B
      required: true
    - id: 8
      name: movie_watching_frequency
      label: How often do you go to the movies?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 9
      name: favorite_restaurant
      label: Do you have a favorite restaurant?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
