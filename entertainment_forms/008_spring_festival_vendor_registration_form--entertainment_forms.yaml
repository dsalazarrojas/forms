inputSchema:
  type: object
  properties:
    title: spring-festival-vendor-registration-form
    pages:
    - id: 1
      name: general
      label: General Information
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: vendor_application
      label: Vendor-Application
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: e_signature
      label: E-Signature
      hint: null
      type: select_one
      options:
      - I accept the terms and conditions
      - I do not accept the terms and conditions
      required: false
    - id: 4
      name: contact_info
      label: Contact-Info
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Both
      - Other (please specify)
      required: false
    - id: 5
      name: contact_info_other
      label: Contact-Info-Other
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: e_signature_confirm
      label: E-Signature-Confirm
      hint: null
      type: date
      options: []
      required: false
