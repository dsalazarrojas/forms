inputSchema:
  type: object
  properties:
    title: Christmas Party Questionnaire
    pages:
      - id: 1
        name: respondent_name
        label: Full Name
        hint: Optional - your name
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: For event updates
        type: email
        options: []
        required: true
      - id: 3
        name: age_group
        label: Age Group
        hint: Select your age range
        type: select_one
        options:
          - Under 18
          - 18-24
          - 25-34
          - 35-44
          - 45-54
          - 55-64
          - 65 or older
        required: true
      - id: 4
        name: relationship_to_host
        label: Relationship to Host
        hint: How do you know the host
        type: select_one
        options:
          - Friend
          - Family Member
          - Co-worker
          - Neighbor
          - Acquaintance
          - First time meeting
        required: true
      - id: 5
        name: section_respondent_info
        label: -- Respondent Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: party_experience_preference
        label: Party Experience Preference
        hint: What type of party do you prefer
        type: select_one
        options:
          - Casual and relaxed
          - Formal and elegant
          - Fun and energetic
          - Intimate and cozy
          - Themed and elaborate
