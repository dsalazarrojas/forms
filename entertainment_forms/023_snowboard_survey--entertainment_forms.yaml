      - Satisfied
      - Dissatisfied
      required: false
    - id: 3
      name: event_frequency
      label: event_frequency
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: snowboard_type
      label: snowboard_type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: snowboard_interest
      label: snowboard_interest
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
