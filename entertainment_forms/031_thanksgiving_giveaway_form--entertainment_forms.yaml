inputSchema:
  type: object
  properties:
    title: Thanksgiving Giveaway Form
    pages:
    - id: 1
      name: basic_info
      label: Basic Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: thanksgiving_info
      label: What Are You Thankful For
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: null
      type: select_one
      options:
      - Social Media
      - Online Ad
      - Referral
      - Other
      required: true
    - id: 4
      name: what_would_you_like_to_win
      label: What Would You Like to Win
      hint: null
      type: select_multiple
      options:
      - A
      - B
      - C
      - D
      required: false
    - id: 5
      name: rules_agreement
      label: Rules and Agreement
      hint: null
      type: text
      options: []
      required: false
