inputSchema:
  type: object
  properties:
    title: Band Media Upload Form
    pages:
    - id: 1
      name: section_band_information
      label: -- Band Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: band_name
      label: Band name
      hint: Official band or act name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Primary contact person
      hint: Manager or band representative
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email address
      hint: Best email for press communications
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact phone number
      hint: Optional phone for urgent contact
      type: text
      options: []
      required: false
    - id: 6
      name: genre
      label: Primary genre
      hint: Select the best matching genre
      type: select_one
      options:
      - Rock
      - Pop
      - Jazz
      - Electronic
      - Country
      - Hip hop
      - Other
      required: true
    - id: 7
      name: band_bio
      label: Band biography
      hint: Short bio for promotional use
      type: text
      options: []
      required: false
    - id: 8
      name: press_photos_url
      label: Press photos URL
      hint: Link to high resolution photos or upload location
      type: text
      options: []
      required: false
    - id: 9
      name: music_streaming_links
      label: Music streaming links
      hint: Links to Spotify, SoundCloud, Bandcamp or similar
      type: text
      options: []
      required: false
    - id: 10
      name: sample_tracks_description
      label: Sample tracks description
      hint: Titles and brief notes of representative tracks
      type: text
      options: []
      required: false
    - id: 11
      name: rider_requirements
      label: Rider requirements
      hint: Basic technical and hospitality needs
      type: text
      options: []
      required: false
    - id: 12
      name: submission_date
      label: Submission date
      hint: Date when materials were submitted
      type: date
      options: []
      required: true
