inputSchema:
  type: object
  properties:
    title: online_dance_class_registration_form
    pages:
    - id: 1
      name: name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date
      label: Class Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: time
      label: Class Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: participant_count
      label: Participant Count
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: dance_style
      label: Dance Style
      hint: null
      type: select_multiple
      options:
      - Salsa
      - Samba
      - Rumba
      - Tango
      required: true
    - id: 8
      name: instructor
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: confirmation
      label: Confirmation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
