inputSchema:
  type: object
  properties:
    title: toy_survey
    pages:
    - id: 1
      name: introduction
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: visit_frequency
      label: How often do you visit the toy store?
      hint: null
      type: select_one
      options:
      - Every day
      - Several times a week
      - Occasionally
      - Rarely
      required: true
    - id: 3
      name: preferred_toy_type
      label: Which type of toy would you like to buy?
      hint: null
      type: select_multiple
      options:
      - Toys
      - Games
      - Puzzles
      - Electronics
      required: true
    - id: 4
      name: toy_rating
      label: How much do you like the current toy design?
      hint: null
      type: select_one
      options:
      - Very Much
      - Neutral
      - Somewhat
      - Not at all
      required: true
    - id: 5
      name: recommendations
      label: Would you recommend this toy?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 6
      name: age_range
      label: What is your age range?
      hint: null
      type: select_one
      options:
      - 0-10
      - 11-20
      - 21-30
      - 31-40
      required: true
    - id: 7
      name: toy_related_comments
      label: Do you have any toy-related comments or feedback?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: play_frequency
      label: How often do you play with toys?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Occasionally
      - Rarely
      required: true
    - id: 9
      name: gift_toy
      label: What kind of toy do you like to give as a gift?
      hint: null
      type: select_one
      options:
      - Toys
      - Games
      - Puzzles
      - Electronics
      required: true
    - id: 10
      name: quality_satisfaction
      label: Can you rate your satisfaction with the toy's quality?
      hint: null
      type: select_one
      options:
      - Very High
      - High
      - Neutral
      - Low
      required: true
    - id: 11
      name: price_satisfaction
      label: Can you rate your satisfaction with the toy's price?
      hint: null
      type: select_one
      options:
      - Very High
      - High
      - Neutral
      - Low
      required: true
    - id: 12
      name: additional_comments
      label: Can you provide any additional comments or suggestions?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: toy_type_comments
      label: Do you have any comments about the toy's type?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: toy_type_other
      label: What other types of toys would you like to see?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: toy_rating_comments
      label: Can you rate your satisfaction with the toy's rating?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: toy_rating_other
      label: What other rating would you like to see?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: toy_price_comments
      label: Can you provide any comments about the toy's price?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: toy_price_other
      label: What other price would you like to see?
      hint: null
      type: text
      options: []
      required: false
