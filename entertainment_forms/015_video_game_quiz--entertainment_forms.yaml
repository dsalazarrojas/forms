inputSchema:
  type: object
  properties:
    title: Video Game Quiz
    pages:
    - id: 1
      name: game_name
      label: Game Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: player_name
      label: Player Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: game_platform
      label: Game Platform
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: genre
      label: Genre
      hint: null
      type: select_one
      options:
      - Action
      - Adventure
      - Sports
      - Role-Playing
      - Simulation
      required: true
    - id: 5
      name: release_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: game_type
      label: Game Type
      hint: null
      type: select_multiple
      options:
      - Single-player
      - Multi-player
      - Online Multi-player
      required: true
    - id: 7
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      required: true
    - id: 8
      name: description
      label: Description
      hint: A short description of the game.
      type: text
      options: []
      required: false
