inputSchema:
  type: object
  properties:
    title: Bucket List Collection Form
    pages:
    - id: 1
      name: person_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: person_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: age_range
      label: Age Range
      hint: null
      type: select_one
      options:
      - Under 18
      - 18-25
      - 26-35
      - 36-45
      - 46-55
      - 56-65
      - 65+
      required: false
    - id: 4
      name: place_visit
      label: Top Place You Want to Visit
      hint: City, country, or landmark
      type: text
      options: []
      required: true
    - id: 5
      name: reason_visit
      label: Why Do You Want to Visit This Place
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: food_experience
      label: Dream Food Experience
      hint: Cuisine, dish, or restaurant
      type: text
      options: []
      required: false
    - id: 7
      name: adventure_activity
      label: Adventure Activity You Want to Try
      hint: Skydiving, bungee jumping, etc
      type: text
      options: []
      required: false
    - id: 8
      name: skill_to_learn
      label: New Skill or Hobby to Learn
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: book_to_read
      label: Book to Read
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: movie_to_watch
      label: Movie or Show to Watch
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: personal_goal
      label: Personal Goal to Achieve
      hint: Career, fitness, education, etc
      type: text
      options: []
      required: false
    - id: 12
      name: experience_priority
      label: Experience Priorities
      hint: Select what matters most
      type: select_multiple
      options:
      - Travel and Exploration
      - Adventure and Thrill
      - Personal Growth
      - Building Relationships
      - Creative Pursuits
      - Health and Wellness
      - Learning and Education
      required: false
    - id: 13
      name: timeline_vision
      label: Bucket List Timeline
      hint: When do you want to accomplish these
      type: select_one
      options:
      - Within 1 year
      - Within 5 years
      - Within 10 years
      - Lifetime
      - No deadline
      required: false
    - id: 14
      name: budget_estimate
      label: Estimated Budget
      hint: For major goals
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - Over $25,000
      - No budget limit
      required: false
    - id: 15
      name: support_needed
      label: Support or Resources Needed
      hint: Funding, mentoring, time off, etc
      type: text
      options: []
      required: false
    - id: 16
      name: inspiration_source
      label: What Inspires Your Bucket List
      hint: People, books, movies, life events, etc
      type: text
      options: []
      required: false
