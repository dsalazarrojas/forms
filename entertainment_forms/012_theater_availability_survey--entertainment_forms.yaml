inputSchema:
  type: object
  properties:
    title: Theater Availability Survey
    pages:
    - id: 1
      name: monday_availability_prophets
      label: prophets available on Monday
      hint: Please select the days you are available
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 2
      name: tuesday_availability_prophets
      label: Please select the days you are available
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 3
      name: thursday_availability_prophets
      label: Please select the days you are available
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 4
      name: time_preferences_prophets
      label: What time would you prefer?
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: group_size_prophets
      label: How many people are you planning to bring?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: seating_preferences_prophets
      label: Do you have any seating preferences?
      hint: null
      type: select_one
      options:
      - None
      - Wheelchair accessible
      - Seated area
      - Standing area
      - Other (specify)
      required: true
    - id: 7
      name: accessibility_needs_prophets
      label: Do you have any accessibility needs we should be aware of?
      hint: null
      type: select_multiple
      options:
      - None
      - Hearing Assistance
      - Wheelchair accessible
      - Other (specify)
      required: false
    - id: 8
      name: submission_method_prophets
      label: How would you like to submit this survey?
      hint: null
      type: select_one
      options:
      - Mail-in form
      - Online
      - In-person
      required: true
    - id: 9
      name: contact_info_prophets
      label: What is your contact info?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: email_prophets
      label: What is your email?
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone_number_prophets
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: name_prophets
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: address_prophets
      label: What is your address?
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: city_prophets
      label: What is your city?
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: state_prophets
      label: What is your state?
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: zip_prophets
      label: What is your zip?
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: comments_prophets
      label: Are there any additional comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: comments_prophets
