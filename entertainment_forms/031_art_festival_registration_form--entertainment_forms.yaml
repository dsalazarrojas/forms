        type: text
        options: []
        required: false
      - id: 5
        name: performance_needs
        label: Performance needs
        hint: AV staging or seating requirements
        type: text
        options: []
        required: false
      - id: 6
        name: emergency_contact
        label: Emergency contact
        hint: Name and phone
        type: text
        options: []
        required: true
      - id: 7
        name: insurance_details
        label: Insurance details
        hint: Liability insurance if applicable
        type: text
        options: []
        required: false
      - id: 8
        name: social_links
        label: Social media or website
        hint: Links for promotion
        type: text
        options: []
        required: false
      - id: 9
        name: attendance_days
        label: Attendance days
        hint: Which days will you attend
        type: select_multiple
        options: [Day 1, Day 2, Day 3]
