inputSchema:
  type: object
  properties:
    title: Senior Superlatives Form
    pages:
    - id: 1
      name: senior_superlatives_form_name
      label: Name of the Senior Superlatives Form
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: superlatives_attendance
      label: Who will be attending from our department?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: superlatives_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: superlatives_category
      label: What category will be voted for?
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: true
    - id: 5
      name: superlatives_category_1
      label: Will the person attending be voting for category 1?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: superlatives_category_2
      label: Will the person attending be voting for category 2?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
