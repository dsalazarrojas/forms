inputSchema:
  type: object
  properties:
    title: Short Movie Contest Application Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: movie_title
      label: Movie Title
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: movie_description
      label: Movie Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: movie_length
      label: Movie Length
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Action
      - Comedy
      - Drama
      - Horror
      required: true
    - id: 8
      name: genre
      label: Genre
      hint: null
      type: select_multiple
      options:
      - Action
      - Comedy
      - Drama
      - Horror
      required: false
    - id: 9
      name: awards
      label: Awards
      hint: null
      type: select_multiple
      options:
      - Award1
      - Award2
      - Award3
      required: false
    - id: 10
      name: tags
      label: Tags
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: upload_files
      label: Upload Files
      hint: null
      type: text
      options: []
      required: false
