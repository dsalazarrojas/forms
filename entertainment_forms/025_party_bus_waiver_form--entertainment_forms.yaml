inputSchema:
  type: object
  properties:
    title: Party Bus Waiver Form
    pages:
    - id: 1
      name: party_bus_waiver_form
      label: Party Bus Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: bus_type
      label: Bus Model
      hint: Please select the type of party bus you are renting
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: bus_capacity
      label: Bus Capacity
      hint: Please select the capacity of the party bus you are renting
      type: select_one
      options:
      - '20'
      - '30'
      - '40'
      - '50'
      required: false
    - id: 4
      name: bus_equipment
      label: Bus Equipment
      hint: Please select the equipment you want to have on your party bus
      type: select_multiple
      options:
