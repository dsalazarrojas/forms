          - Parent
          - Child
          - Sibling
          - Friend
          - Co-worker
          - Other Family
          - Other
        required: true
      - id: 4
        name: recipient_age_group
        label: Recipient Age Group
        hint: Select age range
        type: select_one
        options:
          - Under 5
          - 5-12 years
          - 13-17 years
          - 18-24 years
          - 25-34 years
          - 35-44 years
          - 45-54 years
          - 55-64 years
          - 65 or older
        required: true
