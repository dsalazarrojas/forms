inputSchema:
  type: object
  properties:
    title: Guest Speaker Intake Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: contract_signed
      label: Contract Signed
      hint: This is the contract part.
      type: text
      options: []
      required: false
    - id: 7
      name: speaker_type
      label: Speaker Type
      hint: null
      type: select_one
      options:
      - Guest
      - Host
      - Performer
      required: false
    - id: 8
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contract_date
      label: Contract Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: contract_time
      label: Contract Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: contract_duration
      label: Contract Duration
      hint: null
      type: number
      options: []
      required: false
