inputSchema:
  type: object
  properties:
    title: Themed Birthday Party Booking Form
    pages:
    - id: 1
      name: party_details
      label: Party Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: guests
      label: Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: party_time
      label: Party Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: party_theme
      label: Party Theme
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: party_color
      label: Party Color
      hint: null
      type: select_one
      options:
      - red
      - blue
      - green
      - yellow
      required: false
    - id: 8
      name: music_style
      label: Music Style
      hint: null
      type: select_multiple
      options:
      - pop
      - rock
      - jazz
      - hip-hop
      required: false
    - id: 9
      name: special_requests
      label: Special Requests
      hint: null
      type: select_multiple
      options:
      - catering
      - cake
      - games
      required: false
    - id: 10
      name: party_venue
      label: Party Venue
      hint: null
      type: select_one
      options:
      - home
      - school
      - park
      required: false
