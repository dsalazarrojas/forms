inputSchema:
  type: object
  properties:
    title: Podcast Guest Release Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: published_on
      label: Published On
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: agreement
      label: Agreement
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      - I'm not sure
      required: true
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
