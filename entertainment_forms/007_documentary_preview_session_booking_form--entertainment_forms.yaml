inputSchema:
  type: object
  properties:
    title: Documentary Preview Session Booking Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: session_type
      label: Session Type
      hint: null
      type: select_multiple
      options:
      - Film
      - Documentary
      - Lecture
      required: true
    - id: 8
      name: booking_status
      label: Booking Status
      hint: null
      type: select_one
      options:
      - Pending
      - Confirmed
      - Cancelled
      required: true
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: session_id
      label: Session ID
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: user_message
      label: User Message
      hint: null
      type: text
      options: []
      required: false
