inputSchema:
  type: object
  properties:
    title: Karaoke Request Form
    pages:
    - id: 1
      name: song_request
      label: Song Request
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: song_selection
      label: Song Selection
      hint: null
      type: select_one
      options:
      - Song 1
      - Song 2
      required: false
    - id: 3
      name: request_time
      label: Request Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: operator_note
      label: Operator Note
      hint: null
      type: note
      options: []
      required: false
