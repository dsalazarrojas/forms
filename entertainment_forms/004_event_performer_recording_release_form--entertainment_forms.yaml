inputSchema:
  type: object
  properties:
    title: Event Performer Recording Release Form
    pages:
    - id: 1
      name: event_title
      label: Event Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Concert
      - Conference
      - Live Event
      required: true
    - id: 4
      name: artist_name
      label: Artist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: recording_permission
      label: Recording Permission
      hint: null
      type: select_multiple
      options:
      - With Consent
      - Without Consent
      required: true
    - id: 6
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: event_organizer
      label: Event Organizer
      hint: null
      type: text
      options: []
      required: false
