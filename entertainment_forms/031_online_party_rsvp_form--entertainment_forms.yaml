inputSchema:
  type: object
  properties:
    title: Online Party RSVP Form
    pages:
    - id: 1
      name: birthday_details
      label: Birthday Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: guest_list
      label: Guests
      hint: List the guests attending
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: rsvp_status
      label: RSVP Status
      hint: Select RSVP status
      type: select_one
      options:
      - option1
      - option2
      - option3
      - option4
      required: false
    - id: 4
      name: comment
      label: Comment
      hint: Add any comment
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: Guest Email
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: birthday_date
      label: Birthday Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: "hh:mm AM/PM"
      type: time
      options: []
      required: false
    - id: 9
      name: rsvp_date
      label: RSVP Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: false
    - id: 10
      name: party_details
      label: Party Details
      hint: null
      type: select_multiple
      options:
      - option1
      - option2
      required: false
    - id: 11
      name: event_type
      label: Event Type
      hint: Select event type
      type: select_one
      options:
      - option1
      - option2
      required: false
    - id: 12
      name: start_time
      label: Start Time
      hint: "hh:mm AM/PM"
      type: time
      options: []
      required: false
    - id: 13
      name: end_time
      label: End Time
      hint: "hh:mm AM/PM"
      type: time
      options: []
      required: false
