inputSchema:
  type: object
  properties:
    title: schedule a zoom meeting form
    pages:
    - id: 1
      name: meeting_details
      label: Meeting Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: attendees
      label: Attendees
      hint: Add coworkers or clients here
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: Required in 12-hour format
      type: time
      options: []
      required: false
    - id: 4
      name: end_time
      label: End Time
      hint: Required in 12-hour format
      type: time
      options: []
      required: false
    - id: 5
      name: timezone
      label: Timezone
      hint: Enter your timezone
      type: select_one
      options:
      - America/New_York
      - America/Los_Angeles
      - America/Chicago
      required: true
    - id: 6
      name: location
      label: Location
      hint: Enter your location
      type: text
      options: []
      required: false
    - id: 7
      name: registrants
      label: registrants
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
