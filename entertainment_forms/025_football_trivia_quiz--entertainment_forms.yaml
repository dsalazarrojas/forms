inputSchema:
  type: object
  properties:
    title: Football Trivia Quiz
    pages:
    - id: 1
      name: about_football_history
      label: About Football History
      hint: Enter your thoughts on football history
      type: text
      options: []
      required: true
    - id: 2
      name: favorite_football_team
      label: Favorite Football Team
      hint: Select your favorite football team
      type: select_one
      options:
      - Barcelona
      - Real Madrid
      - Manchester United
      - Juventus
      required: true
    - id: 3
      name: football_player
      label: Enter a football player's name
      hint: Enter a football player's name
      type: text
      options: []
      required: true
    - id: 4
      name: football_trivia_date
      label: Football Trivia Date
      hint: Select a date related to football
      type: date
      options: []
      required: true
    - id: 5
      name: football_score
      label: Enter a football score
      hint: Enter a football score
      type: number
      options: []
      required: true
    - id: 6
      name: football_trivia_answer
      label: Football Trivia Answer
      hint: Select multiple answers related to football trivia
      type: select_multiple
      options:
      - option a
      - option b
      - option c
      - option d
      required: true
    - id: 7
      name: question_7
      label: Select multiple answers related to football trivia
      hint: Select multiple answers related to football trivia
      type: select_multiple
      options:
      - option a
      - option b
      - option c
      - option d
      required: true
