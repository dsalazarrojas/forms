      name: fee_includes
      label: Fee Includes
      hint: Select all that apply
      type: select_multiple
      options:
      - Choreography creation
      - Rehearsal time
      - Performance attendance
      - Music editing
      - Costume consultation
      - Travel
      - Other
      required: true
    - id: 30
      name: payment_schedule
      label: Payment Schedule
      hint: null
      type: select_one
      options:
      - 50% deposit, 50% on completion
      - 33% deposit, 33% midway, 34% final
      - Full payment upfront
      - Full payment on completion
      - Custom arrangement
      required: true
    - id: 31
      name: deposit_amount
      label: Deposit Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 32
      name: deposit_due
      label: Deposit Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 33
      name: final_payment_due
      label: Final Payment Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 34
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Check
      - Bank transfer
      - Credit card
      - PayPal
      - Other
      required: true
    - id: 35
      name: cancellation_policy
      label: Cancellation Policy
      hint: Terms
      type: note
      options: []
      required: false
