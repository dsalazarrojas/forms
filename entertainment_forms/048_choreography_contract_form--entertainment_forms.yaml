      name: rehearsal_location
      label: Rehearsal Location
      hint: Studio or venue
      type: text
      options: []
      required: false
    - id: 26
      name: rehearsal_times
      label: Rehearsal Times
      hint: Days and times
      type: text
      options: []
      required: false
    - id: 27
      name: compensation
      label: Compensation
      hint: Payment details
      type: note
      options: []
      required: false
