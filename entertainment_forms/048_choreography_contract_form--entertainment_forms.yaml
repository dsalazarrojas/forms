      name: cancellation_terms
      label: Cancellation Terms
      hint: null
      type: select_one
      options:
      - Deposit non-refundable
      - 50% refund if cancelled 2 weeks prior
      - Full refund if cancelled 4 weeks prior
      - Custom terms
      required: true
    - id: 37
      name: cancellation_details
      label: Cancellation Details
      hint: Specify terms
      type: text
      options: []
      required: false
    - id: 38
      name: rights_ownership
      label: Rights and Ownership
      hint: Intellectual property
      type: note
      options: []
      required: false
    - id: 39
      name: choreography_ownership
      label: Choreography Ownership
      hint: null
      type: select_one
      options:
      - Choreographer retains all rights
      - Client owns choreography
      - Shared ownership
      - Client has performance rights only
      required: true
    - id: 40
      name: recording_rights
      label: Recording and Video Rights
      hint: null
      type: select_one
      options:
      - Choreographer must approve
      - Client has full rights
      - No recording allowed
      - Social media allowed with credit
      required: true
    - id: 41
      name: additional_terms
      label: Additional Terms
      hint: Other conditions
      type: note
      options: []
      required: false
