      name: travel_expenses
      label: Travel Expenses
      hint: Who pays
      type: select_one
      options:
      - Included in fee
      - Client reimburses
      - Choreographer pays
      - Not applicable
      required: true
    - id: 43
      name: costume_input
      label: Costume Consultation
      hint: null
      type: select_one
      options:
      - Included
      - Available for additional fee
      - Not included
      - Not needed
      required: false
    - id: 44
      name: music_selection
      label: Music Selection
      hint: null
      type: select_one
      options:
      - Client provides
      - Choreographer selects
      - Collaborative decision
      - Choreographer edits provided music
      required: true
    - id: 45
      name: special_requirements
      label: Special Requirements
      hint: Any specific needs
      type: text
      options: []
      required: false
    - id: 46
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 47
      name: agreement
      label: Agreement
      hint: Both parties agree
      type: note
      options: []
      required: false
    - id: 48
      name: client_agrees
      label: Client agrees to all terms
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 49
      name: choreographer_agrees
      label: Choreographer agrees to all terms
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 50
      name: client_signature
      label: Client Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 51
      name: client_signature_date
      label: Client Signature Date
      hint: null
      type: date
      options: []
      required: true
    - id: 52
      name: choreographer_signature
      label: Choreographer Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 53
      name: choreographer_signature_date
      label: Choreographer Signature Date
      hint: null
      type: date
      options: []
      required: true
