inputSchema:
  type: object
  properties:
    title: Letter To Santa Template
    pages:
    - id: 1
      name: letter_to_santa_template_page_1
      label: What's your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: letter_to_santa_template_page_2
      label: What's your favorite toy?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: letter_to_santa_template_page_3
      label: Why do you want this toy?
      hint: Tell Santa why you want this toy!
      type: text
      options: []
      required: true
    - id: 4
      name: letter_to_santa_template_page_4
      label: What's your favorite thing to do?
      hint: null
      type: select_multiple
      options:
      - Playing outside
      - Reading books
      - Playing with friends
      - Playing video games
      - Other (please specify)
      required: true
    - id: 5
      name: letter_to_santa_template_page_5
      label: How old are you?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: letter_to_santa_template_page_6
      label: Do you want to share this letter with Santa?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: letter_to_santa_template_page_7
      label: What's the best part about being a kid?
      hint: null
      type: select_multiple
      options:
      - Playing with friends
      - Getting presents!
      - Riding a bike
      - Playing outside
      - Eating cookies
      required: true
    - id: 8
      name: letter_to_santa_template_page_8
      label: Do you have any other questions for Santa?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: letter_to_santa_template_page_9
      label: Where are you from?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: letter_to_santa_template_page_10
      label: Who is helping you write this letter?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: letter_to_santa_template_page_11
      label: What's your favorite color?
      hint: null
      type: select_one
      options:
      - Blue
      - Red
      - Green
      - Yellow
      - Purple
      required: true
    - id: 12
      name: letter_to_santa_template_page_12
      label: What's your favorite animal?
      hint: null
      type: select_one
      options:
      - Dog
      - Cat
      - Bear
      - Bird
      - Other (please specify)
      required: true
