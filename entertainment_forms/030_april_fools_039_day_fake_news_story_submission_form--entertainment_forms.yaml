inputSchema:
  type: object
  properties:
    title: April Fools Day Fake News Story Submission Form
    pages:
    - id: 1
      name: submitter_info
      label: Submitter Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: author_name
      label: Author Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: author_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: author_phone
      label: Phone Number (optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: story_details
      label: Story Details
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: story_headline
      label: Story Headline
      hint: Make it funny and attention-grabbing
      type: text
      options: []
      required: true
    - id: 7
      name: story_category
      label: Story Category
      hint: null
      type: select_one
      options:
      - Technology
      - Celebrity
      - Political
      - Sports
      - Business
      - Science
      - Other
      required: true
    - id: 8
      name: story_body
      label: Story Content
      hint: Tell us your fake news story
      type: text
      options: []
      required: true
    - id: 9
      name: humor_level
      label: Humor Style
      hint: null
      type: select_one
      options:
      - Satirical
      - Absurd
      - Clever
      - Sarcastic
      - Quirky
      required: false
    - id: 10
      name: target_audience
      label: Target Audience
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: word_count
      label: Approximate Word Count
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: publication_consent
      label: Consent to Publish
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
