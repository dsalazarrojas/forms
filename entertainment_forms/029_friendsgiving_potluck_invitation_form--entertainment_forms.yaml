inputSchema:
  type: object
  properties:
    title: Friendsgiving Potluck Invitation Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: attending
      label: Attending
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: rsvp_by
      label: RSVP By
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
