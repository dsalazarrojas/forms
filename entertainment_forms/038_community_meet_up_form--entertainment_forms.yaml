inputSchema:
  type: object
  properties:
    title: Community Meet Up Form
    pages:
    - id: 1
      name: meetup_header
      label: -- Meet Up Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: Attendee name
      hint: Full name for check in
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: Optional for group updates
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone number
      hint: Optional contact for last minute updates
      type: text
      options: []
      required: false
    - id: 5
      name: event_date
      label: Event date
      hint: Date of meet up
      type: date
      options: []
      required: true
    - id: 6
      name: topics_of_interest
      label: Topics of interest
      hint: List topics you would like discussed
      type: text
      options: []
      required: false
    - id: 7
      name: bring_materials
      label: Will you bring materials to share
      hint: Indicate yes or no
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 8
      name: accessibility_needs
      label: Accessibility needs
      hint: Any accommodations required
      type: text
      options: []
      required: false
    - id: 9
      name: consent_to_photo
      label: Consent to be photographed
      hint: Agree to event photos for group use
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Anything else organizers should know
      type: text
      options: []
      required: false
