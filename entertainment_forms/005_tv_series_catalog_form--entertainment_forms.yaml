      - Adventure
      - Comedy
      - Drama
      - Horror
      - Romance
      required: false
    - id: 3
      name: episodes
      label: Episodes
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: release_year
      label: Release Year
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: seasons
      label: Seasons
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: tv_series_form_2
      label: Description
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: form_tags
      label: Tags
      hint: Select multiple
      type: select_multiple
      options:
      - Tag 1
      - Tag 2
      - Tag 3
      required: false
    - id: 8
      name: tv_series_form_3
      label: Creator
      hint: null
      type: text
      options: []
      required: false
