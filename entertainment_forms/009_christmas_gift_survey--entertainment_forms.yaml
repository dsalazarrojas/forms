inputSchema:
  type: object
  properties:
    title: Christmas Gift Survey
    pages:
      - id: 1
        name: respondent_name
        label: Full Name
        hint: Optional - your name
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: For survey updates
        type: email
        options: []
        required: true
      - id: 3
        name: age_group
        label: Age Group
        hint: Select your age range
        type: select_one
        options:
          - Under 18
          - 18-24
          - 25-34
          - 35-44
          - 45-54
          - 55-64
          - 65 or older
        required: true
      - id: 4
        name: gender
        label: Gender
        hint: Optional demographic info
        type: select_one
        options:
          - Male
          - Female
          - Non-binary
          - Prefer not to say
          - Prefer to self-describe
        required: false
      - id: 5
        name: section_demographics
        label: -- Demographics --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: christmas_shopping_start
        label: When Do You Start Shopping
        hint: When do you begin buying gifts
        type: select_one
        options:
          - Right after Halloween
          - Early November
          - Late November
          - Early December
          - Last minute December 20 plus
          - I do not celebrate Christmas
        required: true
      - id: 7
        name: total_budget
        label: Total Gift Budget
        hint: How much do you plan to spend
        type: select_one
        options:
          - Under 100
          - 100 to 300
          - 300 to 500
          - 500 to 1000
          - 1000 to 2000
          - Over 2000
        required: true
      - id: 8
        name: number_of_recipients
        label: Number of Gift Recipients
        hint: How many people will you buy for
        type: select_one
        options:
          - 1-3 people
          - 4-6 people
          - 7-10 people
          - 11-15 people
          - 16 or more
        required: true
      - id: 9
        name: section_shopping_habits
        label: -- Shopping Habits --
        hint: null
        type: note
        options: []
        required: false
      - id: 10
        name: preferred_shopping_method
        label: Preferred Shopping Method
        hint: How do you prefer to shop
        type: select_one
        options:
          - Online only
          - In-store only
          - Mostly online some in-store
          - Mostly in-store some online
          - Equal mix of both
        required: true
      - id: 11
        name: favorite_retailers
        label: Favorite Retailers
        hint: Where do you shop most
        type: select_multiple
        options:
          - Amazon
          - Department Stores
          - Specialty Shops
          - Local Small Business
          - Online Marketplaces
          - Warehouse Clubs
          - Discount Stores
          - Handmade Etsy
        required: false
      - id: 12
        name: gift_type_preference
        label: Gift Type Preference
        hint: What do you prefer to give
        type: select_multiple
        options:
          - Physical Products
          - Gift Cards
          - Experiences
          - Homemade Items
          - Charitable Donations
          - Cash
          - Subscriptions
        required: true
      - id: 13
        name: most_challenging_aspect
        label: Most Challenging Aspect
        hint: What is hardest about gift shopping
        type: select_one
        options:
          - Finding unique gifts
          - Staying within budget
          - Time constraints
          - Knowing what people want
          - Shipping and delivery
          - Gift wrapping
          - Nothing challenging
        required: true
      - id: 14
        name: section_preferences
        label: -- Preferences --
        hint: null
        type: note
        options: []
        required: false
      - id: 15
        name: preferred_gift_categories
        label: Preferred Gift Categories
        hint: What categories interest you most
        type: select_multiple
        options:
          - Electronics
          - Clothing and Accessories
          - Home Decor
          - Books and Media
          - Beauty and Personal Care
          - Food and Gourmet
          - Toys and Games
          - Sports and Outdoors
          - Jewelry
          - Experiences
        required: true
      - id: 16
        name: eco_friendly_important
        label: Eco-Friendly Important
        hint: Do you prioritize sustainable gifts
        type: select_one
        options:
          - Very important
          - Somewhat important
          - Neutral
          - Not very important
          - Not important at all
        required: true
      - id: 17
        name: personalized_gifts_value
        label: Personalized Gifts Value
        hint: How much do you value personalization
        type: select_one
        options:
          - Highly value
          - Somewhat value
          - Neutral
          - Do not value much
          - Prefer non-personalized
        required: true
      - id: 18
        name: section_additional
        label: -- Additional Questions --
        hint: null
        type: note
        options: []
        required: false
      - id: 19
        name: wish_list_usage
        label: Do You Use Wish Lists
        hint: Do you create or share wish lists
        type: select_one
        options:
          - Yes always
          - Sometimes
          - Rarely
          - Never
        required: true
      - id: 20
        name: regifting_acceptable
        label: Regifting Acceptable
        hint: What is your view on regifting
        type: select_one
        options:
          - Completely acceptable
          - Acceptable in some cases
          - Neutral
          - Somewhat unacceptable
          - Completely unacceptable
        required: true
      - id: 21
        name: biggest_pet_peeve
        label: Biggest Gift Pet Peeve
        hint: What gift do you dislike receiving
        type: text
        options: []
        required: false
      - id: 22
        name: best_gift_ever
        label: Best Gift You Ever Received
        hint: Share your memorable gift experience
        type: text
        options: []
        required: false
      - id: 23
        name: suggestions_for_retailers
        label: Suggestions for Retailers
        hint: How can retailers improve
        type: text
        options: []
        required: false
