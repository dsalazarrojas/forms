inputSchema:
  type: object
  properties:
    title: Valentine Box Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: customer_note
      label: Customer Note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: shipping_method
      label: Shipping Method
      hint: null
      type: select_multiple
      options:
      - Shipping via USPS
      - Shipping via UPS
      - Shipping via FedEX
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: false
    - id: 11
      name: total_value
      label: Total Value
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: customer_reference
      label: Customer Reference
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: order_comment
      label: Order Comments
      hint: null
      type: text
      options: []
      required: false
