      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: Please enter your email address
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: event_time_zone
      label: Event Time Zone
      hint: null
      type: select_one
      options:
      - '{''value'': ''UTC''}'
      - '{''value'': ''EST''}'
      - '{''value'': ''PST''}'
      - '{''value'': ''CST''}'
      required: false
    - id: 8
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: event_description
      label: Event Description
      hint: null
      type: note
      options: []
      required: false
