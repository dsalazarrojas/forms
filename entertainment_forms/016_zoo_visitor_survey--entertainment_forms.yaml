    - id: 11
      name: zoo_satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 12
      name: zoo_recommendation
      label: Recommend
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
