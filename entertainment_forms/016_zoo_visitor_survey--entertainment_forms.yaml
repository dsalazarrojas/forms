inputSchema:
  type: object
  properties:
    title: Zoo Visitor Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: zoo_visit_date
      label: Visit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: zoo_visit_time
