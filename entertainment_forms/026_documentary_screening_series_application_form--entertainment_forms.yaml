      name: form_time_zone
      label: Time Zone
      hint: null
      type: select_one
      options:
      - EST
      - EDT
      - CST
      - CDT
      - MST
      - MDT
      - PST
      - PDT
      - GMT
      - UTC
      required: false
    - id: 17
      name: form_time_zone_note
      label: Time Zone Note
      hint: null
      type: text
      options: []
      required: false
