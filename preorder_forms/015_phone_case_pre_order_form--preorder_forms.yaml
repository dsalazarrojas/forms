inputSchema:
  type: object
  properties:
    title: Phone Case Pre Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: customer_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: case_size
      label: Case Size
      hint: null
      type: select_one
      options:
      - xs
      - sm
      - lg
      required: true
    - id: 5
      name: case_color
      label: Case Color
      hint: null
      type: select_multiple
      options:
      - blue
      - red
      - black
      required: false
    - id: 6
      name: case_design
      label: Case Design
      hint: null
      type: select_one
      options:
      - design1
      - design2
      - design3
      required: false
    - id: 7
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - credit
      - debit
      - paypall
      required: true
    - id: 9
      name: order_note
      label: Order Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: customer_message
      label: Customer Message
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: customer_address
      label: Customer Address
      hint: null
      type: text
      options: []
      required: false
