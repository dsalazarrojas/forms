      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: package_type
      label: Package Type
      hint: null
      type: select_one
      options:
      - Streaming Video
      - Streaming Audio
      - Streaming Live
      required: false
    - id: 7
      name: customer_details
      label: Customer Details
      hint: null
      type: note
      options: []
