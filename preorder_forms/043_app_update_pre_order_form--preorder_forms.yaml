inputSchema:
  type: object
  properties:
    title: App Update Pre Order Form
    pages:
    - id: 1
      name: section_preorder
      label: -- Pre Order Registration --
      hint: Express interest or pre order for upcoming app update
      type: note
      options: []
      required: false
    - id: 2
      name: interested_user_name
      label: Name
      hint: Optional for exclusive early access
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact email
      hint: Will be used to notify when pre order opens
      type: email
      options: []
      required: true
    - id: 4
      name: platform
      label: Platform
      hint: Select your primary device platform
      type: select_one
      options:
        - iOS
        - Android
        - Other
      required: true
    - id: 5
      name: interest_level
      label: Interest level
      hint: How likely are you to pre order
      type: select_one
      options:
        - Very likely
        - Somewhat likely
        - Unlikely
      required: false
    - id: 6
      name: beta_program_interest
      label: Interest in beta program
      hint: Join early access for testing new features
      type: select_one
      options:
        - Yes please
        - No thanks
      required: false
    - id: 7
      name: additional_feedback
      label: Additional feedback or feature requests
      hint: Optional details on what you want in the update
      type: text
      options: []
      required: false
