inputSchema:
  type: object
  properties:
    title: COVID 19 Business Assistance Survey
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Legal business name
      type: text
      options: []
      required: true
    - id: 2
      name: business_type
      label: Business Type
      hint: Select category
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - Corporation
      - Non-Profit
      - Other
      required: true
    - id: 3
      name: industry
      label: Industry
      hint: Primary industry
      type: select_one
      options:
      - Retail
      - Restaurant or Food Service
      - Hospitality or Tourism
      - Healthcare
      - Manufacturing
      - Professional Services
      - Technology
      - Education
      - Arts and Entertainment
      - Construction
      - Transportation
      - Other
      required: true
    - id: 4
      name: business_address
      label: Business Address
      hint: Complete address
      type: text
      options: []
      required: true
    - id: 5
      name: business_city
      label: City
      hint: City location
      type: text
      options: []
      required: true
    - id: 6
      name: business_state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 7
      name: business_zip
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 8
      name: contact_name
      label: Contact Person Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 9
      name: contact_title
      label: Contact Title
      hint: Job title
      type: text
      options: []
      required: true
    - id: 10
      name: contact_email
      label: Contact Email
      hint: Business email
      type: email
      options: []
      required: true
    - id: 11
      name: contact_phone
      label: Contact Phone
      hint: Business phone
      type: text
      options: []
      required: true
    - id: 12
      name: years_in_business
      label: Years in Business
      hint: How long operating
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-10 years
      - 11-20 years
      - More than 20 years
      required: true
    - id: 13
      name: number_of_employees
      label: Number of Employees
      hint: Total workforce
      type: select_one
      options:
      - 1-5 employees
      - 6-10 employees
      - 11-50 employees
      - 51-100 employees
      - More than 100 employees
      required: true
    - id: 14
      name: revenue_impact
      label: Revenue Impact from COVID-19
      hint: Compared to pre-pandemic
      type: select_one
      options:
      - Increased significantly
      - Increased slightly
      - No change
      - Decreased slightly
      - Decreased significantly
      - Business closed temporarily
      - Business closed permanently
      required: true
    - id: 15
      name: revenue_decline_percentage
      label: Revenue Decline Percentage
      hint: If decreased
      type: select_one
      options:
      - Less than 10 percent
      - 10-25 percent
      - 26-50 percent
      - 51-75 percent
      - More than 75 percent
      - Not applicable
      required: false
    - id: 16
      name: operational_changes
      label: Operational Changes Made
      hint: Select all that apply
      type: select_multiple
      options:
      - Remote work implementation
      - Reduced hours
      - Reduced capacity
      - Enhanced cleaning protocols
      - PPE requirements
      - Contactless services
      - Outdoor operations
      - Delivery or curbside
      - No changes
      required: true
    - id: 17
      name: employee_impact
      label: Employee Impact
      hint: Staffing changes
      type: select_one
      options:
      - No layoffs or furloughs
      - Temporary furloughs
      - Permanent layoffs
      - Reduced hours for staff
      - Hiring freeze
      - Had to hire more staff
      required: true
    - id: 18
      name: supply_chain_impact
      label: Supply Chain Impact
      hint: Disruptions experienced
      type: select_one
      options:
      - No impact
      - Minor delays
      - Moderate disruptions
      - Severe disruptions
      - Unable to obtain supplies
      required: true
    - id: 19
      name: assistance_received
      label: Assistance Received
      hint: Select all that apply
      type: select_multiple
      options:
      - PPP loan
      - EIDL loan
      - State or local grants
      - Tax credits
      - Rent relief
      - Utility assistance
      - None
      required: true
    - id: 20
      name: assistance_needed
      label: Assistance Still Needed
      hint: What would help
      type: select_multiple
      options:
      - Financial grants
      - Low-interest loans
      - Tax relief
      - Rent or mortgage assistance
      - Utility assistance
      - PPE supplies
      - Testing resources
      - Vaccination support
      - Business consulting
      - Marketing support
      - None
      required: true
    - id: 21
      name: recovery_timeline
      label: Expected Recovery Timeline
      hint: When back to normal
      type: select_one
      options:
      - Already recovered
      - Within 3 months
      - Within 6 months
      - Within 1 year
      - More than 1 year
      - Uncertain
      - Will not recover
      required: true
    - id: 22
      name: biggest_challenge
      label: Biggest Challenge
      hint: What is most difficult
      type: select_one
      options:
      - Cash flow
      - Customer demand
      - Supply chain
      - Staffing
      - Rent or mortgage
      - Debt obligations
      - Regulatory compliance
      - Health and safety
      - Other
      required: true
    - id: 23
      name: challenge_details
      label: Challenge Details
      hint: Describe your challenge
      type: text
      options: []
      required: false
    - id: 24
      name: technology_adoption
      label: Technology Adoption
      hint: New tech due to pandemic
      type: select_one
      options:
      - E-commerce platform
      - Online ordering
      - Video conferencing
      - Cloud services
      - Digital marketing
      - No new technology
      required: false
    - id: 25
      name: future_outlook
      label: Future Business Outlook
      hint: Your confidence level
      type: select_one
      options:
      - Very confident
      - Somewhat confident
      - Neutral
      - Somewhat concerned
      - Very concerned
      required: true
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 27
      name: willing_to_be_contacted
      label: Willing to Be Contacted
      hint: For follow-up
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 28
      name: survey_date
      label: Survey Date
      hint: Today date
      type: date
      options: []
      required: true
