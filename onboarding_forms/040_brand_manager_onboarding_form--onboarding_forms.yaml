inputSchema:
  type: object
  properties:
    title: Brand Manager Onboarding Form
    pages:
    - id: 1
      name: personal_details_header
      label: -- Personal Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: manager_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: start_dt
      label: Employment Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: emp_id_opt
      label: Employee ID
      hint: If issued
      type: text
      options: []
      required: false
    - id: 5
      name: work_email_addr
      label: Work Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: prof_background_header
      label: -- Professional Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: brand_exp_desc
      label: Briefly describe your experience with previous brands
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: core_competencies_select
      label: Core Competencies
      hint: Select all that apply
      type: select_multiple
      options:
      - Strategic Planning
      - Creative Direction
      - Market Research
      - Digital Marketing
      - Team Leadership
      - Budget Management
      required: true
    - id: 9
      name: tools_header
      label: -- Equipment and Tools --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: laptop_pref
      label: Laptop Preference
      hint: null
      type: select_one
      options:
      - MacBook Pro
      - Windows High-End
      - Other
      required: true
    - id: 11
      name: software_needs
      label: Software Access Required
      hint: Select all that apply
      type: select_multiple
      options:
      - Adobe Creative Cloud
      - Google Analytics
      - Brandwatch
      - Salesforce
      - Slack
      - Asana
      required: true
    - id: 12
      name: onboarding_needs_header
      label: -- Onboarding Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: learn_interests
      label: Any specific areas of the business you want to learn more about first?
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: mentor_pref
      label: Do you have any preferences for an onboarding buddy / mentor?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: emergency_contact_header
      label: -- Emergency Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: emergency_name_val
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: emergency_phone_val
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
