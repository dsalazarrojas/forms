inputSchema:
  type: object
  properties:
    title: Group Fitness Onboarding Form
    pages:
    - id: 1
      name: new_member_info
      label: New Member Info
      hint: null
      type: select_multiple
      options:
      - New Member
      - Other
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Yearly
      required: true
    - id: 5
      name: workout_frequency
      label: Workout Frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 6
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
