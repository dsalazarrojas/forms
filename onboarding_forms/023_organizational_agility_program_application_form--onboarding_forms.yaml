      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: team
      label: Team
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: role
      label: Role
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: job_function
      label: Job Function
      hint: null
      type: select_one
      options:
      - Agile Coach
      - Scrum Master
      - Product Owner
      - Developer
      - Other
      required: true
    - id: 8
      name: work_experience
      label: Work Experience
      hint: null
      type: number
      options: []
      required: true
