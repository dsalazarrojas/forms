      name: organizational_agility_program_commitment
      label: Organizational Agility Program Commitment
      hint: null
      type: select_one
      options:
      - Long-term Commitment
      - Short-term Commitment
      - Flexible Schedule
      - No Commitment
      required: true
    - id: 12
      name: training_method
      label: Training Method
      hint: null
      type: select_multiple
      options:
      - In-person training
      - Online training
      - Self-study
      - Other
      required: false
    - id: 13
      name: preferred_training_language
      label: Preferred Training Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Portuguese
      - Other
      required: true
    - id: 14
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
