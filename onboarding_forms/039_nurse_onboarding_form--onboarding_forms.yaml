inputSchema:
  type: object
  properties:
    title: Nurse Onboarding Form
    pages:
    - id: 1
      name: new_nurse_details
      label: New Nurse Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: credentials
      label: Credentials
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: certifications
      label: Certifications
      hint: Please list any certifications relevant to your job
      type: select_multiple
      options:
      - Certified Registered Nurse (RN)
      - Certified Licensed Practical Nurse (LPN)
      - Certified Nursing Assistant (CNA)
      - Other
      required: true
    - id: 4
      name: onboarding_acknowledgement
      label: Onboarding Acknowledgement
      hint: None
      type: select_multiple
      options:
      - I understand that the onboarding process can take 2-3 hours
      - I am aware that I will need to complete all sections on this form
      - I am aware that my credentials will be verified and may be subject to background
        check
      - Other
      required: true
