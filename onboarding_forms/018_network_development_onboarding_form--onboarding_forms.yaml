inputSchema:
  type: object
  properties:
    title: Network Development Onboarding Form
    pages:
    - id: 1
      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_members
      label: Team Members
      hint: null
      type: select_multiple
      options:
      - Project Lead
      - Development Team
      - QA Team
      required: true
    - id: 3
      name: onboarding_date
      label: Onboarding Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: onboarding_status
      label: Onboarding Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: true
    - id: 5
      name: project_manager
      label: Project Manager
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: onboarding_notes
      label: Onboarding Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: onboarding_comments
      label: Onboarding Comments
      hint: null
      type: text
      options: []
      required: false
