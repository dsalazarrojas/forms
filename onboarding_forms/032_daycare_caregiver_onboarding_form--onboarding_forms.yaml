      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: false
    - id: 3
      name: required_acknowledgments
      label: Required Acknowledgments
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_contact2
      label: Emergency Contact2
      hint: null
      type: text
      options: []
      required: false
