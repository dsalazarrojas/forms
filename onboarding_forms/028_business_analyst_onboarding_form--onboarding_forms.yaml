inputSchema:
  type: object
  properties:
    title: Business Analyst Onboarding Form
    pages:
    - id: 1
      name: personal_info
      label: Personal Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: preferred_name
      label: Preferred Name
      hint: What should we call you
      type: text
      options: []
      required: false
    - id: 4
      name: employee_id
      label: Employee ID
      hint: Your employee identification number
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: Your work email
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: true
    - id: 7
      name: address
      label: Address
      hint: Your mailing address
      type: text
      options: []
      required: true
    - id: 8
      name: start_date
      label: Start Date
      hint: Your first day of employment
      type: date
      options: []
      required: true
    - id: 9
      name: position_info
      label: Position Information
      hint: Your role details
      type: note
      options: []
      required: false
    - id: 10
      name: job_title
      label: Job Title
      hint: Your official title
      type: text
      options: []
      required: true
    - id: 11
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Business Analysis
      - IT
      - Operations
      - Finance
      - Strategy
      - Product
      - Other
      required: true
    - id: 12
      name: manager_name
      label: Manager Name
      hint: Your direct manager
      type: text
      options: []
      required: true
    - id: 13
      name: team
      label: Team
      hint: Which team will you join
      type: text
      options: []
      required: true
    - id: 14
      name: work_location
      label: Work Location
      hint: Where will you work
      type: select_one
      options:
      - Office
      - Remote
      - Hybrid
      required: true
    - id: 15
      name: office_location
      label: Office Location
      hint: Which office
      type: text
      options: []
      required: false
    - id: 16
      name: emergency_contact
      label: Emergency Contact
      hint: Emergency contact details
      type: note
      options: []
      required: false
    - id: 17
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 18
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to you
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 20
      name: emergency_contact_email
      label: Emergency Contact Email
      hint: Email address
      type: email
      options: []
      required: false
    - id: 21
      name: it_setup
      label: IT Setup
      hint: Technology requirements
      type: note
      options: []
      required: false
    - id: 22
      name: laptop_preference
      label: Laptop Preference
      hint: Which operating system
      type: select_one
      options:
      - Windows
      - macOS
      - No Preference
      required: true
    - id: 23
      name: software_needs
      label: Software Needs
      hint: Special software you require
      type: select_multiple
      options:
      - Microsoft Office
      - Visio
      - JIRA
      - Confluence
      - SQL Server
      - Tableau
      - Power BI
      - Python
      - Other
      required: true
    - id: 24
      name: access_requirements
      label: Access Requirements
      hint: Systems you need access to
      type: text
      options: []
      required: false
    - id: 25
      name: training_onboarding
      label: Training and Onboarding
      hint: Your onboarding plan
      type: note
      options: []
      required: false
    - id: 26
      name: prior_ba_experience
      label: Prior Business Analysis Experience
      hint: Years of experience
      type: select_one
      options:
      - None
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - More than 5 years
      required: true
    - id: 27
      name: certifications
      label: Certifications
      hint: Do you have any BA certifications
      type: select_multiple
      options:
      - CBAP
      - CCBA
      - PMI-PBA
      - Agile Certification
      - Six Sigma
      - None
      - Other
      required: false
    - id: 28
      name: training_interests
      label: Training Interests
      hint: What training would you like
      type: select_multiple
      options:
      - Company Systems
      - Domain Knowledge
      - Soft Skills
      - Technical Skills
      - Agile Methods
      - Process Modeling
      - Data Analysis
      required: true
    - id: 29
      name: mentorship_interest
      label: Mentorship Interest
      hint: Would you like a mentor
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 30
      name: goals
      label: First 90-Day Goals
      hint: What do you hope to accomplish
      type: text
      options: []
      required: false
    - id: 31
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
