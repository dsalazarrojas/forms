inputSchema:
  type: object
  properties:
    title: Senior Care Onboarding Survey
    pages:
    - id: 1
      name: new_resident_info
      label: newResidentInfo
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: emergency_contact
      label: emergencyContact
      hint: null
      type: select_one
      options:
      - Primary
      - secondaryContact
      - address
      - relationship
      - phone
      - emergencyContactName
      required: false
    - id: 3
      name: medical_info
      label: medicalInfo
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medical_conditions
      label: medicalConditions
      hint: null
      type: select_multiple
      options:
      - Alzheimer's disease
      - Arthritis
      - Heart failure
      - Stroke
      - Other
      required: false
    - id: 5
      name: medication
      label: medication
      hint: null
      type: select_multiple
      options:
      - Aspirin
      - Blood thinner
      - Other
      required: false
    - id: 6
      name: medical_procedures
      label: medicalProcedures
      hint: null
      type: select_multiple
      options:
      - Knee replacement surgery
      - Hip replacement surgery
      - Other
      required: false
    - id: 7
      name: allergies
      label: allergies
      hint: null
      type: select_multiple
      options:
      - Allergies
      - Other
      required: false
    - id: 8
      name: special_needs
      label: specialNeeds
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: additional_info
      label: additionalInfo
      hint: null
      type: text
      options: []
      required: false
