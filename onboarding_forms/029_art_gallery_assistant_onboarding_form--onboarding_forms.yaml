inputSchema:
  type: object
  properties:
    title: Art Gallery Assistant Onboarding Form
    pages:
    - id: 1
      name: basic_info_header
      label: -- Basic Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: assistant_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: preferred_name
      label: Preferred Name - Nickname
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: contact_email
      label: Personal Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: contact_phone
      label: Mobile Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: home_address
      label: Residential Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_contact_header
      label: -- Emergency Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: relationship_to_contact
      label: Relationship to Emergency Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: employment_details_header
      label: -- Employment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: start_date
      label: Employment Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: position_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Intern (Paid)
      - Intern (Unpaid)
      required: true
    - id: 15
      name: tax_id_number
      label: Tax Identification Number (SSN - TIN)
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: direct_deposit_details
      label: Direct Deposit Information (Bank Name, Account, Routing)
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: onboarding_checklist_header
      label: -- Internal Checklist --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: key_access_granted
      label: Gallery Key or Access Card Issued
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - N/A
      required: true
    - id: 19
      name: systems_access_granted
      label: Systems Access Granted (Email, CRM, POS)
      hint: null
      type: select_one
      options:
      - Complete
      - Pending
      required: true
    - id: 20
      name: orientation_scheduled
      label: Gallery Orientation Session Scheduled
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: manager_comments
      label: Manager Onboarding Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: submission_date
      label: Form Submission Date
      hint: null
      type: date
      options: []
      required: true
