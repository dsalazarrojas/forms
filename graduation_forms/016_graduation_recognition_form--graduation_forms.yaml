inputSchema:
  type: object
  properties:
    title: Graduation Recognition Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: student_grade
      label: Student Grade
      hint: null
      type: select_one
      options:
      - High
      - Low
      - Average
      required: false
    - id: 4
      name: student_grade_other
      label: Student Grade Other
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: student_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: student_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
