inputSchema:
  type: object
  properties:
    title: Household Information Form
    pages:
    - id: 1
      name: household_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: household_type
      label: Type
      hint: null
      type: select_one
      options:
      - Single
      - Married
      required: true
    - id: 3
      name: household_size
      label: Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 4
      name: income_source
      label: Source
      hint: null
      type: select_multiple
      options:
      - Work
      - Investment
      - Government
      required: false
    - id: 5
      name: monthly_income
      label: Monthly Income
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: annual_income
      label: Annual Income
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: household_occupation
      label: Occupation
      hint: null
      type: select_multiple
      options:
      - Student
      - Employee
      - Retired
      required: false
    - id: 8
      name: occupation_description
      label: Occupation Description
      hint: null
      type: select_multiple
      options:
      - Engineer
      - Doctor
      - Artist
      required: false
