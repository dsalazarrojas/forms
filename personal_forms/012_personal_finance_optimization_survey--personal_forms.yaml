inputSchema:
  type: object
  properties:
    title: Personal Finance Optimization Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: income_management
      label: How do you manage your income?
      hint: null
      type: select_multiple
      options:
      - Savings
      - Investments
      - Salary
      - Inheritance
      - Other
      required: true
    - id: 3
      name: savings_frequency
      label: How regularly do you save money?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      required: true
    - id: 4
      name: financial_goals
      label: What are your long-term financial goals?
      hint: null
      type: select_multiple
      options:
      - Saving for a down payment on a house
      - Retirement
      - Paying off debt
      - Other
      required: true
    - id: 5
      name: financial_habits
      label: What are your money habits?
      hint: null
      type: select_multiple
      options:
      - Saving
      - Budgeting
      - Spending less than earning
      - Other
      required: true
    - id: 6
      name: financial_planning_frequency
      label: How often do you review your financial plan?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      required: false
    - id: 7
      name: investment_strategy
      label: What is your investment strategy?
      hint: null
      type: select_multiple
      options:
      - Stocks
      - Bonds
      - Mutual funds
      - Real estate
      - Other
      required: false
    - id: 8
      name: financial_planning_influence
      label: Who influences your financial planning?
      hint: null
      type: select_multiple
      options:
      - Spouse or partner
      - Family or friends
      - Financial advisor
      - Other
      required: false
    - id: 9
      name: money_management_skills
      label: Which financial skill do you rate as your highest priority?
      hint: null
      type: select_multiple
      options:
      - Budgeting
      - Time management
      - Organization
      - Prioritization
      - Other
      required: true
    - id: 10
      name: financial_stress
      label: How do you handle financial stress?
      hint: null
      type: select_multiple
      options:
      - Reduce spending
      - Increase income
      - Seek help from a professional
      - Other
      required: false
    - id: 11
      name: financial_education
      label: What is your approach to financial education?
      hint: null
      type: select_multiple
      options:
      - Reading books
      - Taking courses
      - Seeking advice from a friend or family member
      - Other
      required: false
    - id: 12
      name: follow_up_checkin
      label: How often do you perform a follow-up check on your finances?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      required: false
    - id: 13
      name: money_transfer
      label: How do you transfer money?
      hint: null
      type: select_multiple
      options:
      - Online
      - In person
      - Mobile transfer
      - Other
      required: false
    - id: 14
      name: financial_planning_tools
      label: What are your favorite financial planning tools?
      hint: null
      type: select_multiple
      options:
      - Spreadsheets
      - Budgeting apps
      - Financial advisors
      - Other
      required: false
    - id: 15
      name: financial_support
      label: Do you have a financial support system in place?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: financial_planning_frequency_2
      label: How often do you perform a financial planning check?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      required: false
    - id: 17
      name: investment
      label: What is your investment approach?
      hint: null
      type: select_multiple
      options:
      - Stocks
      - Bonds
      - Mutual funds
      - Real estate
      - Other
      required: false
    - id: 18
      name: financial_planning_influence_2
      label: Financial Planning Influence 2
      hint: null
      type: select_multiple
      options:
      - Spouse or partner
      - Family or friends
      - Financial advisor
      - Other
      required: false
