inputSchema:
  type: object
  properties:
    title: Household Expenditure Report Form
    pages:
    - id: 1
      name: user_input
      label: Household Expenditure Report Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: household_income_earned
      label: household_income_earned
      hint: null
      type: select_multiple
      options:
      - '100000'
      - '50000'
      - '200000'
      required: false
    - id: 3
      name: household_expenses
      label: household_expenses
      hint: null
      type: select_one
      options:
      - '500'
      - '2500'
      - '10000'
      required: false
    - id: 4
      name: household_expenses_breakdown
      label: household_expenses_breakdown
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: expense_type
      label: expense_type
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: household_size
      label: household_size
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: income_distribution
      label: income_distribution
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: family_members
      label: family_members
      hint: null
      type: select_one
      options:
      - father
      - mother
      - both
      - none
      required: false
    - id: 9
      name: income_frequency
      label: income_frequency
      hint: null
      type: select_one
      options:
      - daily
      - weekly
      - monthly
      - quarterly
      - yearly
      required: false
    - id: 10
      name: payment_method
      label: payment_method
      hint: null
      type: select_multiple
      options:
      - credit card
      - debit card
      - cash
      - bank transfer
      - none
      required: false
    - id: 11
      name: payment_status
      label: payment_status
      hint: null
      type: select_one
      options:
      - pending
      - paid
      - overdue
      - cancelled
      - declined
      required: false
    - id: 12
      name: notes
      label: notes
      hint: null
      type: text
      options: []
      required: false
