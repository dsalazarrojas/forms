inputSchema:
  type: object
  properties:
    title: Shopping List Organizer
    pages:
    - id: 1
      name: grocery_trip_details
      label: Grocery Trip Details
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: item_name
      label: Item Name
      hint: Name of the item
      type: text
      options: []
      required: false
    - id: 3
      name: quantity
      label: Quantity
      hint: Item quantity
      type: number
      options: []
      required: false
    - id: 4
      name: price
      label: Price
      hint: Price of the item
      type: number
      options: []
      required: false
    - id: 5
      name: store
      label: Store
      hint: Where do you plan to buy the item?
      type: select_one
      options:
      - Grocery Store
      - Online Store
      - Local Market
      - Other
      required: false
    - id: 6
      name: budget
      label: Budget
      hint: Your budget for this shopping trip
      type: select_multiple
      options:
      - $100
      - $200
      - $300
      - $400
      - $500
      - $1000
      - Other
      required: false
    - id: 7
      name: date
      label: Date
      hint: Date of the trip
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: Time of the trip
      type: time
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: Additional notes
      type: note
      options: []
      required: false
