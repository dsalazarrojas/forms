inputSchema:
  type: object
  properties:
    title: Personal Budget Tracking Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: monthly_income
      label: Monthly Income
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 3
      name: expenses
      label: Expenses
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: financial_goals
      label: Financial Goals
      hint: Set a financial goal (e.g., saving for a down payment on a house, paying
        off debt)
      type: select_one
      options:
      - Saving for a down payment on a house
      - Paying off debt
      - Emergency fund
      required: false
    - id: 5
      name: monthly_expenses
      label: Monthly Expenses
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: budget_progress
      label: Budget Progress
      hint: Track your progress
      type: time
      options: []
      required: false
    - id: 7
      name: financial_progress
      label: Financial Progress
      hint: See how you're doing
      type: note
      options: []
      required: false
    - id: 8
      name: income_frequency
      label: Income Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Annually
      required: false
    - id: 9
      name: expense_frequency
      label: Expense Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Annually
      required: false
