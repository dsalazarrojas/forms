      name: notes
      label: Additional Notes
      hint: Add any additional notes or comments
      type: note
      options: []
      required: false
    - id: 11
      name: user_input_2
      label: Another Input
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: financial_objectives
      label: Financial Objectives
      hint: Set specific financial objectives
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: budget_category
