inputSchema:
  type: object
  properties:
    title: Best Movies Watchlist Checklist
    pages:
    - id: 1
      name: user_name
      label: Your Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: Email Address
      hint: Optional - for sharing your watchlist
      type: email
      options: []
      required: false
    - id: 3
      name: list_type
      label: Type of Watchlist
      hint: What kind of movie list is this
      type: select_one
      options:
      - Personal Watchlist
      - Family Watchlist
      - Film Club List
      - Class Project
      - Friends Group
      - Date Night Ideas
      - Other
      required: true
    - id: 4
      name: movie_1
      label: Movie Title 1
      hint: First movie on your watchlist
      type: text
      options: []
      required: false
    - id: 5
      name: movie_1_genre
      label: Movie 1 Genre
      hint: Select the genre
      type: select_one
      options:
      - Action
      - Comedy
      - Drama
      - Horror
      - Sci-Fi
      - Romance
      - Documentary
      - Animation
      - Thriller
      - Fantasy
      required: false
    - id: 6
      name: movie_1_watched
      label: Movie 1 Watched
      hint: Have you watched this movie
      type: select_one
      options:
      - 'True'
      - 'False'
      - In Progress
      required: false
    - id: 7
      name: movie_1_rating
      label: Movie 1 Rating
      hint: Rate this movie if watched
      type: select_one
      options:
      - 5 Stars
      - 4 Stars
      - 3 Stars
      - 2 Stars
      - 1 Star
      - Not Watched
      required: false
