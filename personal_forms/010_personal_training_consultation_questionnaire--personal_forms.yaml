inputSchema:
  type: object
  properties:
    title: Personal Training Consultation Questionnaire
    pages:
    - id: 1
      name: exercise_goals
      label: Exercise Goals
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: injury_history
      label: Injury History
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: 'Format: 123-456-7890'
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: 'Format: user@example.com'
      type: email
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: medical_conditions
      label: Medical Conditions
      hint: List any medical conditions that may impact your training
      type: text
      options: []
      required: true
    - id: 8
      name: training_experience
      label: Training Experience
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 9
      name: training_frequency
      label: Training Frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - 3 times a week
      - 2-3 times a month
      - Rarely
      required: true
    - id: 10
      name: injury_prevention
      label: Injury Prevention
      hint: null
      type: note
      options: []
      required: true
