inputSchema:
  type: object
  properties:
    title: Contract Data Issue Report Form
    pages:
      - id: 1
        name: reporter_name
        label: Reporter Name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 2
        name: reporter_email
        label: Reporter Email
        hint: Contact email
        type: email
        options: []
        required: true
      - id: 3
        name: department
        label: Department
        hint: Your department
        type: select_one
        options:
          - Legal
          - Procurement
          - Operations
          - Finance
          - IT
          - Sales
          - Other
        required: true
      - id: 4
        name: report_date
        label: Report Date
        hint: Date of report
        type: date
        options: []
        required: true
      - id: 5
        name: contract_number
        label: Contract Number
        hint: Contract reference
        type: text
        options: []
        required: true
      - id: 6
        name: contract_title
        label: Contract Title
        hint: Name of contract
        type: text
        options: []
        required: true
      - id: 7
        name: issue_category
        label: Issue Category
        hint: Type of data issue
        type: select_one
        options:
          - Missing data
          - Incorrect data
          - Duplicate entry
          - Outdated information
          - Formatting error
          - System sync error
          - Access issue
          - Other
        required: true
      - id: 8
        name: issue_description
        label: Issue Description
        hint: Describe the problem
        type: text
        options: []
        required: true
      - id: 9
        name: affected_fields
        label: Affected Fields
        hint: Which data fields are affected?
        type: text
        options: []
        required: true
      - id: 10
        name: issue_discovery_date
        label: Issue Discovery Date
        hint: When was it found?
        type: date
        options: []
        required: true
      - id: 11
        name: priority_level
        label: Priority Level
        hint: Urgency of fix
        type: select_one
        options:
          - Low
          - Medium
          - High
          - Critical
        required: true
      - id: 12
        name: business_impact
        label: Business Impact
        hint: How does this affect operations?
        type: select_one
        options:
          - No impact
          - Minor inconvenience
          - Moderate disruption
          - Significant impact
          - Critical business risk
        required: true
      - id: 13
        name: root_cause
        label: Root Cause
        hint: If known, what caused this?
        type: text
        options: []
        required: false
      - id: 14
        name: systems_affected
        label: Systems Affected
        hint: Which systems show the issue?
        type: select_multiple
        options:
          - Contract management system
          - CRM
          - ERP
          - Financial system
          - Document repository
          - Reporting dashboard
          - Other
        required: true
      - id: 15
        name: data_accuracy_impact
        label: Data Accuracy Impact
        hint: How accurate is the data now?
        type: select_one
        options:
          - Completely inaccurate
          - Mostly inaccurate
          - Partially inaccurate
          - Mostly accurate
          - Fully accurate
        required: true
      - id: 16
        name: workaround_available
        label: Workaround Available
        hint: Is there a temporary fix?
        type: select_one
        options:
          - Yes, documented
          - Yes, informal
          - No
          - Not applicable
        required: true
      - id: 17
        name: stakeholders_notified
        label: Stakeholders Notified
        hint: Who has been informed?
        type: text
        options: []
        required: false
      - id: 18
        name: recommended_resolution
        label: Recommended Resolution
        hint: How should this be fixed?
        type: text
        options: []
        required: false
      - id: 19
        name: estimated_resolution_time
        label: Estimated Resolution Time
        hint: How long to fix?
        type: select_one
        options:
          - Less than 1 day
          - 1-3 days
          - 3-7 days
          - 1-2 weeks
          - 2+ weeks
        required: false
      - id: 20
        name: attachments
        label: Attachments
        hint: Screenshots or documents
        type: text
        options: []
        required: false
      - id: 21
        name: follow_up_required
        label: Follow-up Required
        hint: Is follow-up needed?
        type: select_one
        options:
          - Yes, urgent
          - Yes, routine
          - No
        required: true
