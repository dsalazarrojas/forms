inputSchema:
  type: object
  properties:
    title: Seasonal Trend Report Form
    pages:
    - id: 1
      name: seasonal_trend_form_1
      label: Which Season?
      hint: null
      type: select_one
      options:
      - Winter
      - Spring
      - Summer
      - Autumn
      required: true
    - id: 2
      name: seasonal_trend_form_2
      label: What is Your Role?
      hint: null
      type: select_one
      options:
      - Analyst
      - Marketer
      - Product Team
      required: true
    - id: 3
      name: seasonal_trend_form_3
      label: What Data Are You Looking to Collect?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: seasonal_trend_form_4
      label: Seasonal Data Collection Frequency?
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Annually
      - On Demand
      required: true
    - id: 5
      name: seasonal_trend_form_5
      label: Contact Email Address?
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: do_you_need_a_phone_number
      label: Do You Need A Phone Number?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 7
      name: preferred_contact_method
      label: Preferred Contact Method?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      required: true
    - id: 8
      name: report_delivery_date
      label: When Do You Want to Receive the Report?
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: report_delivery_time
      label: What Time Do You Want to Receive the Report?
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: additional_comments
      label: Additional Comments?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: seasonal_trend_form_11
      label: Other Information?
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: seasonal_trend_form_12
      label: Additional Details?
      hint: null
      type: text
      options: []
      required: true
