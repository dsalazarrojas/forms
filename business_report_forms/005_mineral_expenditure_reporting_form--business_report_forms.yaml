inputSchema:
  type: object
  properties:
    title: Mineral Expenditure Reporting Form
    pages:
    - id: 1
      name: base_information
      label: base_information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: project_information
      label: Project
      hint: This project belongs to the client
      type: text
      options: []
      required: false
    - id: 3
      name: reporting_period
      label: Reporting Period
      hint: This is the period of the project report
      type: select_one
      options:
      - January-February
      - March-April
      - May-June
      - July-August
      - September-October
      - November-December
      required: true
    - id: 4
      name: mineral_type
      label: Mineral Type
      hint: Please select the type of mineral being reported
      type: select_one
      options:
      - gold
      - silver
      - copper
      required: true
    - id: 5
      name: expenditure
      label: Expenditure
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: total_expenditure
      label: Total Expenditure
      hint: null
      type: text
      options: []
      required: false
    - id: 7
