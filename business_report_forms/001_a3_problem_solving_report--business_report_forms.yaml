inputSchema:
  type: object
  properties:
    title: A3 Problem Solving Report
    pages:
    - id: 1
      name: header_section
      label: -- Problem Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: reporter_name
      label: Reporter name
      hint: Full name of person completing this report
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department or team
      hint: Team responsible for the process
      type: select_one
      options: [Operations,Engineering,Product,Support,Other]
      required: true
    - id: 4
      name: problem_statement
      label: Problem statement
      hint: Brief description of the issue being addressed
      type: text
      options: []
      required: true
    - id: 5
      name: current_condition
      label: Current condition summary
      hint: What is happening now and how often
      type: note
      options: []
      required: false
    - id: 6
      name: root_cause_analysis
      label: Root cause analysis summary
      hint: Key causes identified through analysis
      type: text
      options: []
      required: true
    - id: 7
      name: countermeasures
      label: Proposed countermeasures
      hint: Actions to resolve the problem and responsible owners
      type: select_multiple
      options: [Process change,Training,Tooling update,Staffing,Other]
      required: true
    - id: 8
      name: implementation_plan
      label: Implementation plan and timeline
      hint: Major milestones and expected completion dates
      type: text
      options: []
      required: false
    - id: 9
      name: follow_up_metrics
      label: Follow up metrics
      hint: How success will be measured and review dates
      type: text
      options: []
      required: false
