inputSchema:
  type: object
  properties:
    title: Social Media Performance Report Form
    pages:
    - id: 1
      name: user_id
      label: User Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: date_range_start
      label: Date Range Start
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: date_range_end
      label: Date Range End
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: platform_id
      label: Platform
      hint: null
      type: select_one
      options:
      - Twitter
      - Facebook
      - Instagram
      - LinkedIn
      required: false
    - id: 5
      name: post_type_id
      label: Post Type
      hint: null
      type: select_one
      options:
      - Video
      - Image
      - Link
      - Article
      - Story
      - Story with Video
      - Other
      required: false
    - id: 6
      name: engagement_metric
      label: Engagement Metric
      hint: null
      type: select_multiple
      options:
      - Likes
      - Comments
      - Shares
      - Saves
      - Posts
      required: false
    - id: 7
      name: engagement_metric_value
      label: Engagement Metric Value
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: reach_metric
      label: Reach Metric
      hint: null
      type: select_multiple
      options:
      - Impression
      - Engagement
      - Conversions
      - Clicks
      - Views
      required: false
    - id: 9
      name: reach_metric_value
      label: Reach Metric Value
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: click_through_rate
      label: Click-Through Rate
      hint: null
      type: number
      options: []
      required: false
