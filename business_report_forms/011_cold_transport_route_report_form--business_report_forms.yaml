inputSchema:
  type: object
  properties:
    title: Cold Transport Route Report Form
    pages:
    - id: 1
      name: driver_name
      label: Driver Full Name
      hint: Name of driver
      type: text
      options: []
      required: true
    - id: 2
      name: driver_id
      label: Driver ID Number
      hint: Employee or contractor ID
      type: text
      options: []
      required: true
    - id: 3
      name: report_date
      label: Report Date
      hint: Date of this route
      type: date
      options: []
      required: true
    - id: 4
      name: route_number
      label: Route Number
      hint: Assigned route identifier
      type: text
      options: []
      required: true
    - id: 5
      name: vehicle_id
      label: Vehicle ID
      hint: Vehicle number or license plate
      type: text
      options: []
      required: true
    - id: 6
      name: departure_location
      label: Departure Location
      hint: Starting point address
      type: text
      options: []
      required: true
    - id: 7
      name: departure_time
      label: Departure Time
      hint: Time of departure
      type: time
      options: []
      required: true
    - id: 8
      name: arrival_location
      label: Final Arrival Location
      hint: Destination address
      type: text
      options: []
      required: true
    - id: 9
      name: arrival_time
      label: Arrival Time
      hint: Time of arrival
      type: time
      options: []
      required: true
    - id: 10
      name: total_distance
      label: Total Distance Traveled
      hint: In miles or kilometers
      type: text
      options: []
      required: true
    - id: 11
      name: cargo_type
      label: Type of Cargo
      hint: What was transported
      type: select_one
      options:
      - Fresh Produce
      - Frozen Foods
      - Dairy Products
      - Meat and Poultry
      - Seafood
      - Pharmaceuticals
      - Vaccines
      - Biological Samples
      - Chemicals
      - Mixed Load
      required: true
    - id: 12
      name: temperature_setting
      label: Required Temperature Setting
      hint: Target temperature in °F or °C
      type: text
      options: []
      required: true
    - id: 13
      name: pre_trip_temperature
      label: Pre-Trip Temperature Reading
      hint: Temperature before departure
      type: text
      options: []
      required: true
    - id: 14
      name: pre_trip_time
      label: Pre-Trip Reading Time
      hint: Time of reading
      type: time
      options: []
      required: true
    - id: 15
      name: mid_trip_temperature
      label: Mid-Trip Temperature Reading
      hint: Temperature during route
      type: text
      options: []
      required: false
    - id: 16
      name: mid_trip_time
      label: Mid-Trip Reading Time
      hint: Time of reading
      type: time
      options: []
      required: false
    - id: 17
      name: post_trip_temperature
      label: Post-Trip Temperature Reading
      hint: Temperature at arrival
      type: text
      options: []
      required: true
    - id: 18
      name: post_trip_time
      label: Post-Trip Reading Time
      hint: Time of reading
      type: time
      options: []
      required: true
    - id: 19
      name: temperature_deviations
      label: Temperature Deviations Occurred
      hint: Any excursions from target
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: deviation_details
      label: Deviation Details
      hint: Describe any temperature issues
      type: text
      options: []
      required: false
    - id: 21
      name: corrective_action_taken
      label: Corrective Action Taken
      hint: What was done to fix issues
      type: text
      options: []
      required: false
    - id: 22
      name: stops_completed
      label: Number of Stops Completed
      hint: Total delivery stops
      type: number
      options: []
      required: true
    - id: 23
      name: delivery_issues
      label: Delivery Issues Encountered
      hint: Any problems at stops
      type: text
      options: []
      required: false
    - id: 24
      name: fuel_level_start
      label: Fuel Level at Start
      hint: Tank level at departure
      type: select_one
      options:
      - Full
      - 3/4
      - 1/2
      - 1/4
      - Empty
      required: true
    - id: 25
      name: fuel_level_end
      label: Fuel Level at End
      hint: Tank level at arrival
      type: select_one
      options:
      - Full
      - 3/4
      - 1/2
      - 1/4
      - Empty
      required: true
    - id: 26
      name: fuel_added
      label: Fuel Added During Route
      hint: Gallons or liters
      type: text
      options: []
      required: false
    - id: 27
      name: incidents_occurred
      label: Incidents Occurred
      hint: Accidents, delays, or issues
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 28
      name: incident_details
      label: Incident Details
      hint: Describe any incidents
      type: text
      options: []
      required: false
    - id: 29
      name: vehicle_condition
      label: Vehicle Condition at End of Route
      hint: Overall vehicle state
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Maintenance
      required: true
    - id: 30
      name: maintenance_needed
      label: Maintenance Needed
      hint: Any repairs required
      type: text
      options: []
      required: false
    - id: 31
      name: weather_conditions
      label: Weather Conditions Encountered
      hint: Weather during route
      type: select_one
      options:
      - Clear
      - Cloudy
      - Rain
      - Snow
      - Ice
      - Fog
      - Extreme Heat
      required: true
    - id: 32
      name: traffic_conditions
      label: Traffic Conditions
      hint: Traffic encountered
      type: select_one
      options:
      - Light
      - Moderate
      - Heavy
      - Severe Delays
      - Road Closures
      required: true
    - id: 33
      name: driver_comments
      label: Driver Comments or Notes
      hint: Any additional information
      type: text
      options: []
      required: false
    - id: 34
      name: supervisor_review
      label: Supervisor Review Status
      hint: Review status
      type: select_one
      options:
      - Pending
      - Approved
      - Needs Attention
      - Rejected
      required: true
