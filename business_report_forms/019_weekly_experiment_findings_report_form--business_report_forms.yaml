inputSchema:
  type: object
  properties:
    title: Weekly Experiment Findings Report Form
    pages:
    - id: 1
      name: page_1
      label: Weekly Experiment Findings Report
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: experiment_outcome
      label: Experiment Outcome
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 3
      name: experiment_analysis
      label: Experiment Analysis
      hint: Provide detailed analysis of the experiment
      type: note
      options: []
      required: false
    - id: 4
      name: progress
      label: Weekly Progress
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: week
      label: Week
      hint: Select the week this report applies to
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 7
      name: team_members
      label: Team Members
      hint: List of people who participated in the experiment
      type: select_multiple
      options:
      - Team Member 1
      - Team Member 2
      - Team Member 3
      required: false
    - id: 8
      name: additional_notes
      label: Additional Notes
      hint: Any other comments or notes
      type: note
      options: []
      required: false
    - id: 9
      name: submit_date
      label: Submit Date
      hint: null
      type: date
      options: []
      required: false
