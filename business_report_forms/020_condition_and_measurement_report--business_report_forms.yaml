inputSchema:
  type: object
  properties:
    title: Condition And Measurement Report
    pages:
    - id: 1
      name: report_header
      label: Report Header
      hint: Condition and measurement documentation
      type: note
      options: []
      required: false
    - id: 2
      name: report_date
      label: Report Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 3
      name: report_number
      label: Report Number
      hint: Unique report ID
      type: text
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: Person conducting inspection
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_company
      label: Inspector Company
      hint: Organization name
      type: text
      options: []
      required: false
    - id: 6
      name: asset_information
      label: Asset Information
      hint: Details about inspected asset
      type: note
      options: []
      required: false
    - id: 7
      name: asset_name
      label: Asset Name
      hint: Equipment or facility name
      type: text
      options: []
      required: true
    - id: 8
      name: asset_id
      label: Asset ID Number
      hint: Internal asset identifier
      type: text
      options: []
      required: false
    - id: 9
      name: asset_location
      label: Asset Location
      hint: Where asset is located
      type: text
      options: []
      required: true
    - id: 10
      name: asset_type
      label: Asset Type
      hint: Category of asset
      type: select_one
      options:
      - Building Structure
      - HVAC System
      - Electrical System
      - Plumbing System
      - Machinery Equipment
      - Vehicle Fleet
      - Other
      required: true
    - id: 11
      name: condition_assessment
      label: Condition Assessment
      hint: Overall condition rating
      type: note
      options: []
      required: false
    - id: 12
      name: overall_condition
      label: Overall Condition
      hint: General state of asset
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Critical
      required: true
    - id: 13
      name: structural_condition
      label: Structural Condition
      hint: Structural integrity
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: false
    - id: 14
      name: functional_condition
      label: Functional Condition
      hint: Operational status
      type: select_one
      options:
      - Fully Functional
      - Minor Issues
      - Major Issues
      - Non Functional
      required: true
    - id: 15
      name: measurements
      label: Measurements
      hint: Recorded measurements
      type: note
      options: []
      required: false
    - id: 16
      name: measurement_1_name
      label: Measurement 1 Name
      hint: What is being measured
      type: text
      options: []
      required: false
    - id: 17
      name: measurement_1_value
      label: Measurement 1 Value
      hint: Recorded value
      type: number
      options: []
      required: false
    - id: 18
      name: measurement_1_unit
      label: Measurement 1 Unit
      hint: Unit of measurement
      type: select_one
      options:
      - Meters
      - Feet
      - Inches
      - Millimeters
      - Centimeters
      - PSI
      - Volts
      - Amps
      - Other
      required: false
    - id: 19
      name: measurement_2_name
      label: Measurement 2 Name
      hint: Additional measurement
      type: text
      options: []
      required: false
    - id: 20
      name: measurement_2_value
      label: Measurement 2 Value
      hint: Recorded value
      type: number
      options: []
      required: false
    - id: 21
      name: measurement_2_unit
      label: Measurement 2 Unit
      hint: Unit of measurement
      type: select_one
      options:
      - Meters
      - Feet
      - Inches
      - Millimeters
      - Centimeters
      - PSI
      - Volts
      - Amps
      - Other
      required: false
    - id: 22
      name: defects_found
      label: Defects Found
      hint: Describe any issues
      type: text
      options: []
      required: false
    - id: 23
      name: recommendations
      label: Recommendations
      hint: Suggested actions
      type: text
      options: []
      required: true
    - id: 24
      name: priority_level
      label: Priority Level
      hint: Urgency of repairs
      type: select_one
      options:
      - Low No Immediate Action
      - Medium Schedule Soon
      - High Urgent Attention
      - Critical Immediate Action
      required: true
    - id: 25
      name: photos_attached
      label: Photos Attached
      hint: Documentation photos
      type: select_one
      options:
      - Yes Photos Included
      - No Photos
      required: false
    - id: 26
      name: follow_up_required
      label: Follow Up Required
      hint: Is reinspection needed
      type: select_one
      options:
      - Yes Schedule Follow Up
      - No Further Action
      required: true
    - id: 27
      name: inspector_signature
      label: Inspector Signature
      hint: Confirm report accuracy
      type: select_one
      options:
      - I Certify This Report
      - Not Certified
      required: true
