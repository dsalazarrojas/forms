inputSchema:
  type: object
  properties:
    title: Qualified Report Submission Form
    pages:
    - id: 1
      name: report_category
      label: Category
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 2
      name: report_files
      label: Files
      hint: null
      type: select_multiple
      options:
      - File 1
      - File 2
      - File 3
      required: true
    - id: 3
      name: report_priority
      label: Priority
      hint: null
      type: select_one
      options:
      - Urgent
      - High
      - Low
      required: true
    - id: 4
      name: report_comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: report_submit_date
      label: Submit Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: report_submit_time
      label: Submit Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: report_submitter
      label: Submitter
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: report_submitter_2
      label: Report Submitter 2
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: report_submit_time_zone
      label: Submit Time Zone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: report_priority_rating
      label: Priority Rating
      hint: null
      type: select_multiple
      options:
      - Very satisfied
      - Neutral
      - Dissatisfied
      required: true
