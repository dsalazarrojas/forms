inputSchema:
  type: object
  properties:
    title: Client Reporting Checklist
    pages:
    - id: 1
      name: reporting_period_info
      label: -- Reporting Period Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name or Company
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: reporting_month
      label: Reporting Month and Year
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: account_manager
      label: Account Manager Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: executive_summary_section
      label: -- Executive Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: summary_highlights
