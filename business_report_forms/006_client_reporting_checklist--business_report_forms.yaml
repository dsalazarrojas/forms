      type: text
      options: []
      required: false
    - id: 12
      name: kpi_one_value
      label: KPI 1 - Current Value
      hint: Numeric value
      type: number
      options: []
      required: false
    - id: 13
      name: kpi_one_target
      label: KPI 1 - Target
      hint: Target or goal value
      type: number
      options: []
      required: false
    - id: 14
      name: kpi_two_name
      label: KPI 2 - Name
      hint: null
      type: text
      options: []
      required: false
