inputSchema:
  type: object
  properties:
    title: Loyalty Personalization AI Registration Form
    pages:
    - id: 1
      name: company_details
      label: Company Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: company_name
      label: company_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: company_website
      label: company_website
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: goal
      label: goal
      hint: What is your company's primary goal?
      type: select_one
      options:
      - Increase revenue
      - Acquire new customers
      - Improve customer experience
      - Other
      required: false
    - id: 5
      name: ai_interest
      label: ai_interest
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: consent
      label: consent
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: ai_programs
      label: ai_programs
      hint: null
      type: select_multiple
      options:
      - AI-powered loyalty programs
      - AI-driven customer experience
      - AI-based loyalty programs
      - Other (please specify)
      required: false
    - id: 10
      name: additional_info
      label: additional_info
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: saas_provider
      label: saas_provider
      hint: Which SaaS provider are you using?
      type: select_one
      options:
      - Adobe
      - HubSpot
      - Other (please specify)
      required: false
    - id: 13
      name: company_size
      label: company_size
      hint: null
      type: select_one
      options:
      - 1-10 employees
      - 11-50 employees
      - 51-100 employees
      - 101+ employees
      required: false
