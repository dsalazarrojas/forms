inputSchema:
  type: object
  properties:
    title: Contact Smart Sensor Manufacturer
    pages:
    - id: 1
      name: header
      label: -- Product Inquiry --
      hint: Use this form to request product information or technical support
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company name
      hint: Organization requesting information
      type: text
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Contact name
      hint: Person responsible for the inquiry
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email address
      hint: Business email for technical follow up
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: Optional direct line for urgent communications
      type: text
      options: []
      required: false
    - id: 6
      name: product_interest
      label: Product interest
      hint: Which sensor family or product are you interested in
      type: text
      options: []
      required: true
    - id: 7
      name: technical_requirements
      label: Technical requirements
      hint: Provide brief technical specifications or constraints
      type: text
      options: []
      required: false
    - id: 8
      name: quantity_estimate
      label: Estimated quantity
      hint: Approximate number of units required
      type: number
      options: []
      required: false
    - id: 9
      name: time_to_purchase
      label: Expected timeframe to purchase
      hint: When do you plan to place an order
      type: select_one
      options:
      - Immediately
      - 1-3 months
      - 3-6 months
      - 6+ months
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any other details to help our sales team
      type: text
      options: []
      required: false
