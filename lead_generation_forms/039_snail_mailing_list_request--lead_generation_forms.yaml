inputSchema:
  type: object
  properties:
    title: snail_mailing_list_request
    pages:
    - id: 1
      name: form_type
      label: Form Type
      hint: null
      type: select_one
      options:
      - email
      - phone
      required: true
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Please enter a valid company name
      type: text
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: email_address
      label: Email Address
      hint: Please enter a valid email address
      type: email
      options: []
      required: true
    - id: 8
      name: snail_mail
      label: Snail Mail
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
