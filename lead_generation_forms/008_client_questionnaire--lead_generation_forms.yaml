inputSchema:
  type: object
  properties:
    title: Client Questionnaire
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: company_size
      label: Company Size
      hint: null
      type: select_one
      options:
      - 1-10 employees
      - 11-50 employees
      - 51-200 employees
      - 201-500 employees
      - 500+ employees
      required: false
    - id: 8
      name: industry
      label: Industry
      hint: What industry is your company in?
      type: select_one
      options:
      - Technology
      - Finance
      - Healthcare
      - Retail
      - Manufacturing
      - Consulting
      - Other
      required: false
    - id: 9
      name: primary_goals
      label: What are your primary business goals?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: current_challenges
      label: What are your main business challenges?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: specific_needs
      label: What specific needs do you have?
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: budget_range
      label: Budget Range for Solutions
      hint: null
      type: select_one
      options:
      - Under $10,000
      - $10,000 - $50,000
      - $50,000 - $100,000
      - $100,000 - $250,000
      - $250,000+
      required: false
    - id: 13
      name: timeline
      label: Project Timeline
      hint: When are you looking to implement a solution?
      type: select_one
      options:
      - Immediate - 1-2 weeks
      - Short-term - 1-3 months
      - Medium-term - 3-6 months
      - Long-term - 6+ months
      required: false
    - id: 14
      name: decision_authority
      label: Are you the decision maker?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Share decision-making
      required: false
    - id: 15
      name: how_heard
      label: How did you hear about us?
      hint: null
      type: select_multiple
      options:
      - Search engine
      - Social media
      - Referral
      - Advertisement
      - Other
      required: false
    - id: 16
      name: additional_info
      label: Any additional information you would like to share?
      hint: null
      type: text
      options: []
      required: false
