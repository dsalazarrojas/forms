inputSchema:
  type: object
  properties:
    title: Social Media Marketing Client Intake Form
    pages:
    - id: 1
      name: lead_generation_goal
      label: What is your business goal for lead generation?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: target_audience
      label: What is your target audience?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: marketing_channels
      label: What marketing channels are you interested in?
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Email Marketing
      - Content Marketing
      required: false
    - id: 4
      name: social_media_platforms
      label: What social media platforms do you have a presence on?
      hint: null
      type: select_multiple
      options:
      - Facebook
      - Instagram
      - LinkedIn
      - Twitter
      required: false
    - id: 5
      name: marketing_budget
      label: What is your marketing budget?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: timeline
      label: On what date would you like to start the campaign?
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_zone
      label: Which time zone do you operate in?
      hint: null
      type: select_one
      options:
      - EST
      - PST
      - MST
      - CST
      required: false
    - id: 8
      name: contact_info
      label: What is your contact information?
      hint: null
      type: note
      options: []
      required: false
