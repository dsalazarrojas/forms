inputSchema:
  type: object
  properties:
    title: Lead Scoring Assessment Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: lead_type
      label: Lead Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: score
      label: Score
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: date_created
      label: Date Created
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: assigned_to
      label: Assigned To
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: description
      label: Description
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: lead_source
      label: Lead Source
      hint: null
      type: select_one
      options:
      - Chat
      - Email
      - Phone
      - Referral
      - Webform
      required: false
    - id: 12
      name: lead_status
      label: Lead Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
