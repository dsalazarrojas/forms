inputSchema:
  type: object
  properties:
    title: Graduate Program Enrollment Marketing Inquiry
    pages:
    - id: 1
      name: program_name
      label: Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: start_term
      label: Start Term
      hint: Select a term
      type: select_one
      options:
      - January
      - May
      - September
      required: false
    - id: 3
      name: program_type
      label: Program Type
      hint: null
      type: select_multiple
      options:
      - Online
      - On-campus
      - Part-time
      required: false
    - id: 4
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: campus_interest
      label: Are you interested in learning more about a specific campus or online?
      hint: null
      type: select_multiple
      options:
      - Online
      - On-campus
      - Both
      required: false
    - id: 8
      name: inquiry_type
      label: How did you find out about us?
      hint: null
      type: select_one
      options:
      - Social Media
      - Online Search
      - Print Ad
      - Referral
      - Other
      required: false
    - id: 9
      name: program_location
      label: What location would you like to be based in?
      hint: null
      type: select_one
      options:
      - United States
      - Canada
      - International
      required: false
    - id: 10
      name: follow_up_method
      label: How would you like to be contacted for follow-ups?
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text Message
      - In-person
      required: false
    - id: 11
      name: graduate_level
      label: What level of graduate studies are you interested in?
      hint: null
      type: select_multiple
      options:
      - Certificate
      - Associate
      - Bachelor
      - Master
      - Doctoral
      required: false
    - id: 12
      name: program_english_level
      label: What is your level of English proficiency?
      hint: null
      type: select_one
      options:
      - Native English Speaker
      - Non-native English Speaker
      - English Language Learner
      required: false
    - id: 13
      name: program_interested
      label: Are you interested in a specific graduate program?
      hint: null
      type: text
      options: []
      required: false
