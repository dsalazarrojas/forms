inputSchema:
  type: object
  properties:
    title: Therapeutic Treatment Lead Generation Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: select_one
      label: What kind of therapy do you need?
      hint: null
      type: select_one
      options:
      - Physical Therapy
      - Occupational Therapy
      - Speech Therapy
      - Chiropractic Therapy
      required: false
    - id: 5
      name: select_multiple
      label: Which of the following apply?
      hint: null
      type: select_multiple
      options:
      - Injury
      - Pain Management
      - Stress Management
      - Wellness
      required: false
    - id: 6
      name: date
      label: Date of Injury
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time of Injury
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
