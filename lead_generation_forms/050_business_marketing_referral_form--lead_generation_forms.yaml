inputSchema:
  type: object
  properties:
    title: Business Marketing Referral Form
    pages:
    - id: 1
      name: header
      label: -- Referral Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: referrer_name
      label: Referrer name
      hint: Name of the person submitting referral
      type: text
      options: []
      required: true
    - id: 3
      name: referrer_email
      label: Referrer email
      hint: Contact email for the referrer
      type: email
      options: []
      required: true
    - id: 4
      name: referred_company
      label: Referred company
      hint: Business being referred
      type: text
      options: []
      required: true
    - id: 5
      name: referred_contact
      label: Referred contact
      hint: Name of the contact at the referred company
      type: text
      options: []
      required: false
    - id: 6
      name: referred_email
      label: Referred email
      hint: Contact email for the referred party
      type: email
      options: []
      required: false
    - id: 7
      name: potential_project
      label: Potential project
      hint: Brief description of the potential project or need
      type: text
      options: []
      required: true
    - id: 8
      name: estimated_value
      label: Estimated value
      hint: Estimated value of the referral opportunity
      type: number
      options: []
      required: false
    - id: 9
      name: urgency
      label: Urgency
      hint: How soon should the sales team contact the referral
      type: select_one
      options:
      - Within 24 hours
      - Within 3 days
      - Within a week
      - No rush
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any other information about the referral
      type: text
      options: []
      required: false
