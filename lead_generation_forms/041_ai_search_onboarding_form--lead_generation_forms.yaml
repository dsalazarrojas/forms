inputSchema:
  type: object
  properties:
    title: AI Search Onboarding Form
    pages:
    - id: 1
      name: client_info_section
      label: "--- Client Information ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Primary Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: industry
      label: Industry
      hint: null
      type: select_one
      options:
      - Technology/Software
      - E-commerce/Retail
      - Financial Services
      - Healthcare/Life Sciences
      - Legal
      - Education
      - Government
      required: true
    - id: 6
      name: search_requirements_section
      label: "--- Search Requirements ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: use_cases
      label: Primary Use Cases
      hint: Select all that apply.
      type: select_multiple
      options:
      - Customer Support (Help Center/FAQ)
      - Internal Knowledge Base (Employee Search)
      - E-commerce Product Search
      - Legal/Compliance Document Discovery
      - Research & Data Analysis
      required: true
    - id: 8
      name: data_sources
      label: Existing Data Sources
      hint: Where is the content currently stored?
      type: select_multiple
      options:
      - SQL/NoSQL Databases
      - PDF/Office Documents
      - Public Website URLs
      - Notion/Confluence/Slack
      - Cloud Storage (Google Drive, S3, Dropbox)
      - API-based Content
      required: true
    - id: 9
      name: search_volume
      label: Estimated Monthly Search Volume
      hint: null
      type: select_one
      options:
      - Under 1,000 queries
      - 1,000 - 10,000 queries
      - 10,000 - 100,000 queries
      - Over 100,000 queries
      required: true
    - id: 10
      name: search_languages
      label: Primary User Language(s)
      hint: null
      type: select_one
      options:
      - English Only
      - Multi-lingual (Specify in comments)
      - Non-English Primary
      required: true
    - id: 11
      name: technical_privacy_section
      label: "--- Technical & Privacy ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: preferred_deployment
      label: Preferred Deployment
      hint: null
      type: select_one
      options:
      - SaaS (Cloud Hosted)
      - Private Cloud (VPC)
      - On-premise / Self-hosted
      required: true
    - id: 13
      name: compliance_requirements
      label: Data Privacy Compliance Required
      hint: Select the primary requirement.
      type: select_one
      options:
      - GDPR
      - HIPAA
      - SOC2 Type II
      - ISO 27001
      - None / Not Applicable
      required: true
    - id: 14
      name: integration_method
      label: Preferred Integration Method
      hint: null
      type: select_one
      options:
      - REST API
      - Pre-built UI Widget/Plugin
      - Javascript SDK
      - Mobile SDK (iOS/Android)
      required: true
    - id: 15
      name: current_solution
      label: Existing search solution (if any)
      hint: What are you using today? (e.g., Elasticsearch, Algolia, Google)
      type: text
      options: []
      required: false
    - id: 16
      name: project_timeline_section
      label: "--- Project Timeline ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: desired_launch_date
      label: Desired Launch Date
      hint: null
      type: date
      options: []
      required: false
    - id: 18
      name: current_stage
      label: Current Project Stage
      hint: null
      type: select_one
      options:
      - Initial Researching
      - Active Evaluation / POC
      - Ready to Implement
      required: true
    - id: 19
      name: additional_requirements
      label: Additional project requirements or comments
      hint: Please describe any specific technical constraints or feature needs.
      type: text
      options: []
      required: false
