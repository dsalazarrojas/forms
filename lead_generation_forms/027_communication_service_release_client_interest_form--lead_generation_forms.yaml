inputSchema:
  type: object
  properties:
    title: Communication Service Release Client Interest Form
    pages:
    - id: 1
      name: interest_information
      label: Interest Information
      hint: Tell us about your interest in our new communication service
      type: note
      options: []
      required: false
    - id: 2
      name: submission_date
      label: Submission Date
      hint: Date of this interest form submission
      type: date
      options: []
      required: true
    - id: 3
      name: company_information
      label: Company Information
      hint: Details about your organization
      type: note
      options: []
      required: false
    - id: 4
      name: company_name
      label: Company Name
      hint: Full legal name of your company
      type: text
      options: []
      required: true
    - id: 5
      name: company_size
      label: Company Size
      hint: Number of employees in your company
      type: select_one
      options:
      - 1-10
      - 11-50
      - 51-200
      - 201-500
      - 501-1000
      - 1001-5000
      - 5000+
      required: true
    - id: 6
      name: industry
      label: Industry
      hint: What industry is your company in
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Retail
      - Manufacturing
      - Education
      - Government
      - Media
      - Telecommunications
      - Other
      required: true
    - id: 7
      name: company_website
      label: Company Website
      hint: Your company website URL
      type: text
      options: []
      required: false
    - id: 8
      name: contact_information
      label: Contact Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 9
      name: contact_name
      label: Contact Name
      hint: Full name of the primary contact
      type: text
      options: []
      required: true
    - id: 10
      name: contact_title
      label: Contact Title
      hint: Your job title or position
      type: text
      options: []
      required: true
    - id: 11
      name: contact_email
      label: Contact Email
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 12
      name: contact_phone
      label: Contact Phone
      hint: Your phone number
      type: text
      options: []
      required: true
    - id: 13
      name: current_solution
      label: Current Solution
      hint: What communication solution do you currently use
      type: select_one
      options:
      - In-House Solution
      - Third-Party Vendor
      - Multiple Vendors
      - No Current Solution
      - Other
      required: true
    - id: 14
      name: current_challenges
      label: Current Challenges
      hint: What challenges do you face with current solution
      type: select_multiple
      options:
      - High Costs
      - Poor Reliability
      - Limited Features
      - Poor Integration
      - Bad Support
      - Scalability Issues
      - Security Concerns
      - Complex Setup
      - None
      required: true
    - id: 15
      name: interest_level
      label: Interest Level
      hint: How interested are you in our new service
      type: select_one
      options:
      - Very Interested
      - Interested
      - Somewhat Interested
      - Just Exploring
      - Not Sure
      required: true
    - id: 16
      name: features_of_interest
      label: Features of Interest
      hint: Which features interest you most
      type: select_multiple
      options:
      - Video Conferencing
      - Team Messaging
      - File Sharing
      - Screen Sharing
      - Recording
      - Analytics
      - API Integration
      - Mobile Apps
      - Security Features
      - Custom Branding
      required: true
    - id: 17
      name: expected_users
      label: Expected Users
      hint: How many users would need the service
      type: select_one
      options:
      - 1-10
      - 11-50
      - 51-100
      - 101-500
      - 500+
      required: true
    - id: 18
      name: timeline
      label: Timeline
      hint: When would you like to implement
      type: select_one
      options:
      - Immediately
      - Within 1 month
      - 1-3 months
      - 3-6 months
      - 6+ months
      - Just Researching
      required: true
    - id: 19
      name: budget_range
      label: Budget Range
      hint: What is your expected budget range
      type: select_one
      options:
      - Under $1,000/month
      - $1,000-$5,000/month
      - $5,000-$10,000/month
      - $10,000-$25,000/month
      - $25,000+/month
      - Need Pricing Info
      required: true
    - id: 20
      name: decision_maker
      label: Decision Maker
      hint: Are you the decision maker
      type: select_one
      options:
      - Yes - Final Decision Maker
      - Yes - Influencer
      - No - Researching for Team
      - No - Recommending to Leadership
      required: true
    - id: 21
      name: demo_interest
      label: Demo Interest
      hint: Would you like a product demo
      type: select_one
      options:
      - Yes - ASAP
      - Yes - Within 2 Weeks
      - Yes - Within 1 Month
      - Maybe
      - 'No'
      required: true
    - id: 22
      name: pilot_interest
      label: Pilot Interest
      hint: Would you participate in a pilot program
      type: select_one
      options:
      - Yes - Very Interested
      - Yes - Interested
      - Maybe
      - 'No'
      required: true
    - id: 23
      name: additional_requirements
      label: Additional Requirements
      hint: Any specific requirements or needs
      type: text
      options: []
      required: false
    - id: 24
      name: how_heard_about
      label: How Did You Hear About Us
      hint: How did you learn about our service
      type: select_one
      options:
      - Website
      - Social Media
      - Referral
      - Advertisement
      - Conference
      - Email Campaign
      - Other
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other comments or questions
      type: text
      options: []
      required: false
