inputSchema:
  type: object
  properties:
    title: Free Gym Pass Lead Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 5
      name: fitness_interest
      label: Fitness Interest
      hint: null
      type: select_one
      options:
      - Running
      - Cycling
      - Swimming
      - Hiking
      - Dancing
      - Weightlifting
      - Pilates
      - Yoga
      - Martial Arts
      required: true
    - id: 6
      name: preferred_time_slot
      label: Preferred Time Slot
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 7
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
