inputSchema:
  type: object
  properties:
    title: Business Growth Consultation Request Form
    pages:
    - id: 1
      name: header
      label: -- Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company name
      hint: Legal name of the business
      type: text
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Contact name
      hint: Person requesting consultation
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email
      hint: Best email for scheduling
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Contact phone
      hint: Optional phone number
      type: text
      options: []
      required: false
    - id: 6
      name: business_stage
      label: Business stage
      hint: Select current stage
      type: select_one
      options:
      - Startup
      - Growth
      - Established
      - Scaling
      required: true
    - id: 7
      name: consultation_goals
      label: Consultation goals
      hint: Describe the key objectives for the consultation
      type: text
      options: []
      required: true
    - id: 8
      name: budget_range
      label: Budget range
      hint: Estimated budget for consulting services
      type: select_one
      options:
      - Under 5k
      - 5k to 20k
      - 20k to 50k
      - Over 50k
      required: false
    - id: 9
      name: preferred_contact_method
      label: Preferred contact method
      hint: How should we reach you
      type: select_one
      options:
      - Email
      - Phone
      - Video call
      required: true
    - id: 10
      name: best_times_to_contact
      label: Best times to contact
      hint: Provide availability windows
      type: text
      options: []
      required: false
