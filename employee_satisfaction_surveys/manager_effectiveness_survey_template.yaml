description: Gathering feedback to improve manager effectiveness and enhance employee
  satisfaction.
questions:
- options:
  - Very satisfied
  - Satisfied
  - Neutral
  - Dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your direct manager?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  - Very Poor
  text: How would you rate your direct manager's communication style and clarity?
  type: single
- options:
  - Strongly agree
  - Agree
  - Neutral
  - Disagree
  - Strongly disagree
  text: Does your manager provide effective feedback and support your professional
    development?
  type: single
- options:
  - Provides clear direction
  - Offers constructive feedback
  - Empowers the team
  - Promotes collaboration
  - Manages workload effectively
  - Values my input
  text: In what areas does your manager excel? (select all that apply)
  type: multiple
- text: What specific actions could your manager take to improve your work experience
    or team's effectiveness?
  type: text
- text: Is there anything else you'd like to share regarding your manager's effectiveness
    or impact?
  type: text
title: Manager effectiveness survey
