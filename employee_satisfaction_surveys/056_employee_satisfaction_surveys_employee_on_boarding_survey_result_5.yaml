title: Employee on-boarding survey
description: Generate a Employee on-boarding survey survey for the "Employee satisfaction surveys" category. Use the template name: "Employee on-boarding survey template".
questions:
  - text: Overall, how satisfied are you with employee on-boarding survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Employee, Boarding, Survey, Satisfaction]
  - text: How often do you interact with employee on-boarding survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
