description: Gathering feedback to understand employee satisfaction and identify areas
  for improvement within the organization.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate communication from management?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel supported in your professional development?
  type: single
- options:
  - Challenging work
  - Work-life balance
  - Team collaboration
  - Recognition
  - Growth opportunities
  - Compensation
  text: Which of the following aspects most contribute to your job satisfaction? (Select
    all that apply)
  type: multiple
- text: What could improve your experience at work?
  type: text
- text: Any additional comments or suggestions?
  type: text
title: Job satisfaction survey
