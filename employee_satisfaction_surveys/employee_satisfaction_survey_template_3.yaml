description: A survey to gather feedback on employee satisfaction and identify areas
  for improvement within the organization.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate communication from management?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel supported in your professional development?
  type: single
- options:
  - Health Insurance
  - Paid Time Off
  - Retirement Plan
  - Flexible Work
  - Professional Development
  - Wellness Programs
  text: Which of the following benefits are most important to you? (select all that
    apply)
  type: multiple
- text: What could improve your experience at work?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: Employee satisfaction survey
