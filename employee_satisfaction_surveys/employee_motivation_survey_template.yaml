description: A survey to gauge employee motivation, satisfaction, and identify key
  areas for improvement within the organization.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your current role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate the clarity and frequency of communication from management?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel supported in your professional development and career growth?
  type: single
- options:
  - Challenging work
  - Team collaboration
  - Recognition
  - Work-life balance
  - Learning opportunities
  - Fair compensation
  text: Which of the following most contribute to your motivation at work? (select
    all that apply)
  type: multiple
- text: What is the most significant factor that would improve your daily work experience?
  type: text
- text: Do you have any additional comments or suggestions regarding employee motivation
    or satisfaction?
  type: text
title: Employee motivation survey
