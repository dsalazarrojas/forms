title: IT satisfaction survey
description: Generate a IT satisfaction survey survey for the "Employee satisfaction surveys" category. Use the template name: "IT satisfaction survey template".
questions:
  - text: Overall, how satisfied are you with it satisfaction survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Satisfaction, Survey, Employee, Surveys]
  - text: How often do you interact with it satisfaction survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
