description: Gathering feedback on employee satisfaction and professional growth opportunities
  within the organization.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your current role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  - Very Poor
  text: How would you rate the clarity and effectiveness of communication from management?
  type: single
- options:
  - Strongly Agree
  - Agree
  - Neutral
  - Disagree
  - Strongly Disagree
  text: Do you feel adequately supported in your professional development and career
    growth?
  type: single
- options:
  - Leadership skills
  - Technical skills
  - Project management
  - Communication
  - Personal effectiveness
  - Industry certifications
  text: Which of the following professional development areas are you most interested
    in? (Select all that apply)
  type: multiple
- text: What specific changes or initiatives could most improve your overall experience
    at work?
  type: text
- text: Do you have any additional comments or suggestions regarding your professional
    development or work experience?
  type: text
title: Professional development feedback survey
