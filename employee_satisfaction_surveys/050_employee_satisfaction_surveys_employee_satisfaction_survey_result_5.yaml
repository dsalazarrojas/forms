title: Employee satisfaction survey
description: Generate a Employee satisfaction survey survey for the "Employee satisfaction surveys" category. Use the template name: "Employee satisfaction survey template".
questions:
  - text: Overall, how satisfied are you with employee satisfaction survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Employee, Satisfaction, Survey, Surveys]
  - text: How often do you interact with employee satisfaction survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
