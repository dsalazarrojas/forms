inputSchema:
  type: object
  properties:
    title: Minor Piercing Consent Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Parent or legal guardian name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: parent_name
      label: Parent Name
      hint: Parent or legal guardian name
      type: text
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: medical_procedure
      label: Medical Procedure
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: consent_signed
      label: Consent Signed
      hint: Tick if signed, blank if not
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: time_signed
      label: Time Signed
      hint: null
      type: time
      options: []
      required: true
