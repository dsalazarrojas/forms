inputSchema:
  type: object
  properties:
    title: Tattoo Aftercare Acknowledgment
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: tattoo_date
      label: Tattoo Date
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: aftercare_instructions
      label: Aftercare Instructions
      hint: Please make sure you read and understood the aftercare instructions
      type: note
      options: []
      required: false
    - id: 7
      name: acknowledgment
      label: Acknowledgment
      hint: null
      type: select_multiple
      options:
      - Client has read and understood the aftercare instructions
      - Client has signed and returned the aftercare instructions
      - Client has received a copy of the aftercare instructions
      required: false
    - id: 8
      name: client_has_understood
      label: Client Has Understood
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
