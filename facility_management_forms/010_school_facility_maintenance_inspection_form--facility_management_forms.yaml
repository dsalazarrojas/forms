inputSchema:
  type: object
  properties:
    title: school-facility-maintenance-inspection-form
    pages:
    - id: 1
      name: building_address
      label: Building Address
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: facility_type
      label: Facility Type
      hint: null
      type: select_one
      options:
      - Building
      - Parking Lot
      - Playground
      - Other
      required: true
    - id: 7
      name: building_condition
      label: Building Condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      - Critical
      required: false
    - id: 8
      name: issues_identified
      label: Issues Identified
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: follow_up_date
      label: Follow-up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: completed_status
      label: Completed Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: true
