inputSchema:
  type: object
  properties:
    title: Control Room Data Collection
    pages:
    - id: 1
      name: operator_name
      label: Operator Name
      hint: Name of control room operator
      type: text
      options: []
      required: true
    - id: 2
      name: operator_id
      label: Operator ID
      hint: Employee identification number
      type: text
      options: []
      required: true
    - id: 3
      name: shift_type
      label: Shift Type
      hint: Which shift is this
      type: select_one
      options:
      - Morning
      - Afternoon
      - Night
      - Rotating
      required: true
    - id: 4
      name: section_shift_details
      label: -- Shift Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: shift_date
      label: Shift Date
      hint: Date of this shift
      type: date
      options: []
      required: true
    - id: 6
      name: shift_start_time
      label: Shift Start Time
      hint: When shift began
      type: time
      options: []
      required: true
    - id: 7
      name: shift_end_time
      label: Shift End Time
      hint: When shift ended
      type: time
      options: []
      required: true
    - id: 8
      name: section_system_status
      label: -- System Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: primary_systems_status
      label: Primary Systems Status
      hint: Overall status of main systems
      type: select_one
      options:
      - All Normal
      - Minor Issues
      - Major Issues
      - Critical
      required: true
    - id: 10
      name: power_status
      label: Power Systems Status
      hint: null
      type: select_one
      options:
      - Normal
      - Backup Active
      - Fluctuating
      - Outage
      required: true
    - id: 11
      name: network_status
      label: Network Status
      hint: null
      type: select_one
      options:
      - Normal
      - Degraded
      - Partial Outage
      - Complete Outage
      required: true
    - id: 12
      name: security_systems_status
      label: Security Systems Status
      hint: null
      type: select_one
      options:
      - All Active
      - Partial Active
      - Maintenance Mode
      - Offline
      required: true
    - id: 13
      name: section_environmental
      label: -- Environmental Conditions --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: temperature
      label: Control Room Temperature
      hint: In degrees
      type: number
      options: []
      required: false
    - id: 15
      name: humidity
      label: Humidity Level
      hint: Percentage
      type: number
      options: []
      required: false
    - id: 16
      name: hvac_status
      label: HVAC System Status
      hint: null
      type: select_one
      options:
      - Normal
      - Warning
      - Fault
      - Offline
      required: true
    - id: 17
      name: section_incidents
      label: -- Incidents and Events --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: incidents_occurred
      label: Were any incidents reported
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: incident_details
      label: Incident Details
      hint: Describe any incidents
      type: text
      options: []
      required: false
    - id: 20
      name: incident_severity
      label: Incident Severity
      hint: If incidents occurred
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Critical
      required: false
    - id: 21
      name: incident_resolution
      label: Incident Resolution Status
      hint: null
      type: select_one
      options:
      - Resolved
      - In Progress
      - Escalated
      - Pending
      required: false
    - id: 22
      name: section_maintenance
      label: -- Maintenance Activities --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: maintenance_performed
      label: Was maintenance performed
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 24
      name: maintenance_details
      label: Maintenance Details
      hint: Describe maintenance activities
      type: text
      options: []
      required: false
    - id: 25
      name: systems_affected
      label: Systems Affected by Maintenance
      hint: null
      type: text
      options: []
      required: false
    - id: 26
      name: section_communications
      label: -- Communications Log --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: important_calls
      label: Important Calls Made or Received
      hint: Log significant communications
      type: text
      options: []
      required: false
    - id: 28
      name: escalations
      label: Escalations Made
      hint: List any escalations
      type: text
      options: []
      required: false
    - id: 29
      name: section_handover
      label: -- Handover Notes --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: pending_actions
      label: Pending Actions for Next Shift
      hint: What needs follow-up
      type: text
      options: []
      required: true
    - id: 31
      name: ongoing_issues
      label: Ongoing Issues to Monitor
      hint: null
      type: text
      options: []
      required: false
    - id: 32
      name: special_instructions
      label: Special Instructions
      hint: For the next shift
      type: text
      options: []
      required: false
    - id: 33
      name: next_shift_operator
      label: Next Shift Operator Name
      hint: Who is taking over
      type: text
      options: []
      required: false
    - id: 34
      name: handover_completed
      label: Handover Completed
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 35
      name: additional_notes
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
