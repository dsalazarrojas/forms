inputSchema:
  type: object
  properties:
    title: Maintenance Feedback Response Request Form
    pages:
    - id: 1
      name: form_start
      label: Form Start
      hint: Please take a few minutes to complete this form to help us improve our
        service
      type: note
      options: []
      required: false
    - id: 2
      name: experience
      label: Overall Experience
      hint: How would you rate your overall experience with the facility management
        system?
      type: number
      options: []
      required: true
    - id: 3
      name: ease_of_use
      label: Ease of Use
      hint: How would you rate the system's ease of use?
      type: number
      options: []
      required: true
    - id: 4
      name: effectiveness
      label: Effectiveness
      hint: How would you rate the system's effectiveness in meeting your needs?
      type: number
      options: []
      required: true
    - id: 5
      name: category
      label: Category
      hint: Which category best describes your experience?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 6
      name: email
      label: Email
      hint: Please enter your email address
      type: email
      options: []
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: Can you share any additional comments about your experience?
      type: text
      options: []
      required: true
    - id: 8
      name: form_end
      label: Form End
      hint: Thank you for taking the time to provide feedback
      type: note
      options: []
      required: false
