inputSchema:
  type: object
  properties:
    title: Fountain Inspection Checklist
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: water_quality
      label: Water Quality
      hint: null
      type: select_one
      options:
      - Water Quality Good
      - Water Quality Fair
      - Water Quality Poor
      required: false
    - id: 3
      name: maintenance_needs
      label: Maintenance Needs
      hint: null
      type: select_multiple
      options:
      - Water Pump is Leaking
      - Water Level is Low
      - Filter Needs Replacement
      required: false
    - id: 4
      name: safety_issues
      label: Safety Issues
      hint: null
      type: select_one
      options:
      - Safety Issue Present
      - Safety Issue Not Present
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: completed_by
      label: Completed By
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email_contact
      label: Email Contact
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone_contact
      label: Phone Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: date_submitted
      label: Date Submitted
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
