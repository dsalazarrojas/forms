      - id: 9
        name: interior_cleaned
        label: Interior Cleaned
        hint: Were cabinet interiors cleaned
        type: select_one
        options:
          - Yes
          - No
          - Not applicable
        required: true
      - id: 10
        name: doors_and_frames
        label: Doors and Frames Cleaned
        hint: Were all doors and frames cleaned
        type: select_one
        options:
          - Yes
          - No
          - Not applicable
        required: true
      - id: 11
        name: handles_and_knobs
        label: Handles and Knobs Cleaned
        hint: Were all hardware pieces cleaned
        type: select_one
        options:
          - Yes
          - No
          - Not applicable
        required: true
      - id: 12
        name: hinges_checked
        label: Hinges Checked
        hint: Were hinges inspected and cleaned
        type: select_one
        options:
