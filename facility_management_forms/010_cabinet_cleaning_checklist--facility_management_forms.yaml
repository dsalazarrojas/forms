          - No
          - Not applicable
        required: true
      - id: 15
        name: damage_found
        label: Damage Found
        hint: Was any damage discovered
        type: select_one
        options:
          - No damage
          - Minor scratches
          - Water damage
          - Hardware broken
          - Structural damage
        required: true
      - id: 16
        name: damage_description
        label: Damage Description
        hint: Describe any damage found
        type: text
        options: []
        required: false
      - id: 17
        name: cleaning_products_used
        label: Cleaning Products Used
        hint: What products were used for cleaning
        type: select_multiple
        options:
          - All-purpose cleaner
          - Wood polish
          - Glass cleaner
          - Disinfectant
          - Degreaser
