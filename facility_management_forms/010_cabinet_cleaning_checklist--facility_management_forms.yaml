inputSchema:
  type: object
  properties:
    title: Cabinet Cleaning Checklist
    pages:
      - id: 1
        name: cleaner_name
        label: Cleaner Name
        hint: Name of person performing cleaning
        type: text
        options: []
        required: true
      - id: 2
        name: cleaning_date
        label: Cleaning Date
        hint: Date of this cleaning task
        type: date
        options: []
        required: true
      - id: 3
        name: cleaning_time
        label: Cleaning Time
        hint: Time cleaning was performed
        type: time
        options: []
        required: false
      - id: 4
        name: property_name
        label: Property Name
        hint: Name or address of property
        type: text
        options: []
        required: true
      - id: 5
        name: property_location
        label: Property Location
        hint: Building or area within property
        type: text
        options: []
        required: true
      - id: 6
        name: cabinet_type
        label: Cabinet Type
        hint: Type of cabinets being cleaned
        type: select_one
        options:
          - Kitchen cabinets
          - Bathroom vanities
          - Storage cabinets
          - Utility cabinets
          - Outdoor cabinets
          - Other
        required: true
      - id: 7
        name: cabinet_material
        label: Cabinet Material
        hint: What material are the cabinets
        type: select_one
        options:
          - Wood
          - Laminate
          - Metal
          - Painted
          - Stained
          - Mixed materials
        required: false
      - id: 8
        name: exterior_cleaned
        label: Exterior Cleaned
        hint: Were cabinet exteriors cleaned
        type: select_one
        options:
