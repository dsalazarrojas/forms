inputSchema:
  type: object
  properties:
    title: Camp Ministries Reference Form
    pages:
    - id: 1
      name: referee_name
      label: Referee Name
      hint: Person providing the reference
      type: text
      options: []
      required: true
    - id: 2
      name: referee_contact
      label: Referee Contact Information
      hint: Phone or email of the referee
      type: text
      options: []
      required: true
    - id: 3
      name: candidate_name
      label: Candidate Name
      hint: Name of volunteer or applicant
      type: text
      options: []
      required: true
    - id: 4
      name: relationship_to_candidate
      label: Relationship to Candidate
      hint: How the referee knows the candidate
      type: text
      options: []
      required: true
    - id: 5
      name: suitability_rating
      label: Suitability Rating
      hint: How suitable is the candidate for camp ministry
      type: select_one
      options:
      - Highly Suitable
      - Suitable
      - Unsure
      - Not Suitable
      required: true
    - id: 6
      name: strengths
      label: Candidate Strengths
      hint: Key strengths and qualities observed
      type: text
      options: []
      required: false
    - id: 7
      name: areas_for_development
      label: Areas for Development
      hint: Suggestions for growth or training
      type: text
      options: []
      required: false
    - id: 8
      name: recommendation
      label: Recommendation
      hint: Would you recommend this person for the role
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information for selection
      type: text
      options: []
      required: false
    - id: 10
      name: date_of_reference
      label: Date of Reference
      hint: When this reference was provided
      type: date
      options: []
      required: false
