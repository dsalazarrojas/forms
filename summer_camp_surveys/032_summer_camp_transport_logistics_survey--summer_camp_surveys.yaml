inputSchema:
  type: object
  properties:
    title: summer_camp_transport_logistics_survey
    pages:
    - id: 1
      name: transportation_needs
      label: Transportation Needs
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: pickup_locations
      label: pickup_locations
      hint: null
      type: select_multiple
      options:
      - Downtown
      - Uptown
      - Downtown and Uptown
      required: true
    - id: 3
      name: pickup_times
      label: pickup_times
      hint: Please select one of the available times or select 'Other'
      type: time
      options: []
      required: true
    - id: 4
      name: special_requirements
      label: special_requirements
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: email
      label: email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 7
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: other_pickup_time
      label: other_pickup_time
      hint: If none of the above times work, please select 'Other' and enter a specific
        time
      type: time
      options: []
      required: false
    - id: 9
      name: other_transportation_needs
      label: other_transportation_needs
      hint: null
      type: text
      options: []
      required: false
