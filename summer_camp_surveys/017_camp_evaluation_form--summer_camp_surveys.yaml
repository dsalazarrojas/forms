inputSchema:
  type: object
  properties:
    title: Camp Evaluation Form
    pages:
      - id: 1
        name: participant_name
        label: Participant Name
        hint: Optional for anonymous feedback
        type: text
        options: []
        required: false
      - id: 2
        name: program_name
        label: Program Name
        hint: Which camp program is being evaluated
        type: text
        options: []
        required: true
      - id: 3
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall experience
        type: select_one
        options: [Very Satisfied, Satisfied, Neutral, Dissatisfied, Very Dissatisfied]
        required: true
      - id: 4
        name: activities_rating
        label: Activities Rating
        hint: How engaging were the activities
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 5
        name: staff_support_rating
        label: Staff Support Rating
        hint: Quality of support from staff
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 6
        name: facilities_rating
        label: Facilities Rating
        hint: Condition of facilities and equipment
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: false
      - id: 7
        name: learning_outcomes
        label: Learning Outcomes
        hint: Did you meet expected learning goals
        type: select_one
        options: [Yes, Somewhat, No]
        required: false
      - id: 8
        name: suggestions_for_improvement
        label: Suggestions for Improvement
        hint: Concrete suggestions to improve future camps
        type: text
        options: []
        required: false
      - id: 9
        name: likelihood_to_recommend
        label: Likelihood to Recommend
        hint: Would you recommend this program to others
        type: select_one
        options: [Very Likely, Likely, Unlikely, Very Unlikely]
        required: true
      - id: 10
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback you want to share
        type: text
        options: []
        required: false
