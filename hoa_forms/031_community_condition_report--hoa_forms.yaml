inputSchema:
  type: object
  properties:
    title: Community Condition Report
    pages:
      - id: 1
        name: reporter_name
        label: Reporter name
        hint: Optional for anonymous reports
        type: text
        options: []
        required: false
      - id: 2
        name: report_date
        label: Report date
        hint: Date observed
        type: date
        options: []
        required: true
      - id: 3
        name: location
        label: Location of issue
        hint: Address or description of location
        type: text
        options: []
        required: true
      - id: 4
        name: condition_type
        label: Condition type
        hint: Select the type of issue observed
        type: select_one
        options:
          - Trash or debris
          - Vandalism
          - Road or sidewalk damage
          - Lighting issues
          - Landscaping neglect
        required: true
      - id: 5
        name: severity
        label: Severity level
        hint: Estimate urgency for repairs
        type: select_one
        options:
          - Low
          - Medium
          - High
        required: true
      - id: 6
        name: description
        label: Description of condition
        hint: Detailed description and any evidence
        type: text
        options: []
        required: true
      - id: 7
        name: photo_attached
        label: Photo attached
        hint: Note if images are included
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 8
        name: recommended_action
        label: Recommended action
        hint: Suggest steps to resolve the issue
        type: text
        options: []
        required: false
