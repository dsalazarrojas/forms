inputSchema:
  type: object
  properties:
    title: Community Association Dissolution Petition
    pages:
    - id: 1
      name: petition_information
      label: Petition Information
      hint: Details about the dissolution petition
      type: note
      options: []
      required: false
    - id: 2
      name: petition_date
      label: Petition Date
      hint: Date of this petition
      type: date
      options: []
      required: true
    - id: 3
      name: petition_id
      label: Petition ID
      hint: Unique petition reference number
      type: text
      options: []
      required: true
    - id: 4
      name: association_information
      label: Association Information
      hint: Details about the association
      type: note
      options: []
      required: false
    - id: 5
      name: association_name
      label: Association Name
      hint: Full legal name of the association
      type: text
      options: []
      required: true
    - id: 6
      name: association_address
      label: Association Address
      hint: Primary address of the association
      type: text
      options: []
      required: true
    - id: 7
      name: association_type
      label: Association Type
      hint: What type of association is this
      type: select_one
      options:
      - Homeowners Association (HOA)
      - Condominium Association
      - Property Owners Association
      - Community Association
      - Cooperative
      - Other
      required: true
    - id: 8
      name: incorporation_date
      label: Incorporation Date
      hint: When was the association incorporated
      type: date
      options: []
      required: false
    - id: 9
      name: petitioner_information
      label: Petitioner Information
      hint: Details about the primary petitioner
      type: note
      options: []
      required: false
    - id: 10
      name: petitioner_name
      label: Petitioner Name
      hint: Full name of the primary petitioner
      type: text
      options: []
      required: true
    - id: 11
      name: petitioner_email
      label: Petitioner Email
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 12
      name: petitioner_phone
      label: Petitioner Phone
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 13
      name: petitioner_address
      label: Petitioner Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 14
      name: ownership_status
      label: Ownership Status
      hint: What is your ownership status
      type: select_one
      options:
      - Homeowner
      - Condo Owner
      - Property Owner
      - Authorized Representative
      required: true
    - id: 15
      name: years_as_member
      label: Years as Member
      hint: How long have you been a member
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 16
      name: dissolution_reasons
      label: Dissolution Reasons
      hint: Why is dissolution being requested
      type: note
      options: []
      required: false
    - id: 17
      name: primary_reason
      label: Primary Reason
      hint: What is the primary reason for dissolution
      type: select_one
      options:
      - Financial Issues
      - Lack of Participation
      - Mismanagement
      - Community Disagreement
      - Legal Requirements
      - Merger with Another Association
      - Development Completion
      - Other
      required: true
    - id: 18
      name: detailed_reasons
      label: Detailed Reasons
      hint: Please explain the reasons for dissolution
      type: text
      options: []
      required: true
    - id: 19
      name: supporting_documentation
      label: Supporting Documentation
      hint: Do you have supporting documentation
      type: select_one
      options:
      - Yes - Will Attach
      - Yes - Will Provide Later
      - 'No'
      required: false
    - id: 20
      name: member_support
      label: Member Support
      hint: Information about member support for dissolution
      type: note
      options: []
      required: false
    - id: 21
      name: total_members
      label: Total Members
      hint: Approximate total number of members
      type: number
      options: []
      required: false
    - id: 22
      name: supporting_signatures
      label: Supporting Signatures
      hint: How many members support this petition
      type: number
      options: []
      required: false
    - id: 23
      name: percentage_support
      label: Percentage Support
      hint: Estimated percentage of members supporting
      type: select_one
      options:
      - Less than 25%
      - 25-50%
      - 51-66%
      - 67-75%
      - More than 75%
      required: false
    - id: 24
      name: asset_distribution
      label: Asset Distribution
      hint: How should association assets be handled
      type: text
      options: []
      required: false
    - id: 25
      name: debt_obligations
      label: Debt Obligations
      hint: Are there outstanding debts or obligations
      type: select_one
      options:
      - Yes - Will Detail
      - 'No'
      - Not Sure
      required: true
    - id: 26
      name: legal_compliance
      label: Legal Compliance
      hint: Have legal requirements been reviewed
      type: select_one
      options:
      - Yes - Attorney Consulted
      - Yes - Self-Researched
      - No - Not Yet
      required: true
    - id: 27
      name: proposed_timeline
      label: Proposed Timeline
      hint: What is the proposed timeline for dissolution
      type: text
      options: []
      required: false
    - id: 28
      name: petitioner_signature
      label: Petitioner Signature
      hint: I certify this petition is accurate and authorized
      type: select_one
      options:
      - Yes - I Certify
      - 'No'
      required: true
    - id: 29
      name: signature_date
      label: Signature Date
      hint: Date of signature
      type: date
      options: []
      required: true
