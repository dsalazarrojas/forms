inputSchema:
  type: object
  properties:
    title: Component Thermal Shield Order Form
    pages:
    - id: 1
      name: section_product_details
      label: -- Product Details --
      hint: Thermal shield order specifications
      type: note
      options: []
      required: false
    - id: 2
      name: buyer_name
      label: Buyer name
      hint: Company or individual ordering
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For order acknowledgment
      type: email
      options: []
      required: true
    - id: 4
      name: shield_model
      label: Shield model
      hint: Model identifier
      type: text
      options: []
      required: true
    - id: 5
      name: dimensions
      label: Dimensions
      hint: Enter length x width x height if relevant
      type: text
      options: []
      required: false
    - id: 6
      name: material_specification
      label: Material specification
      hint: Material grade and finish
      type: text
      options: []
      required: true
    - id: 7
      name: quantity
      label: Quantity
      hint: Number of units required
      type: number
      options: []
      required: true
    - id: 8
      name: delivery_requirements
      label: Delivery requirements
      hint: Timeline and special handling notes
      type: text
      options: []
      required: false
    - id: 9
      name: purchase_order_number
      label: Purchase order number
      hint: Optional PO reference
      type: text
      options: []
      required: false
