inputSchema:
  type: object
  properties:
    title: Bottling Equipment Hygiene Inspection Form
    pages:
      - id: 1
        name: inspection_date
        label: Inspection Date
        hint: Date of hygiene inspection
        type: date
        options: []
        required: true
      - id: 2
        name: inspection_time
        label: Inspection Time
        hint: Time of inspection
        type: time
        options: []
        required: true
      - id: 3
        name: inspector_name
        label: Inspector Name
        hint: Name of person conducting inspection
        type: text
        options: []
        required: true
      - id: 4
        name: inspector_id
        label: Inspector ID
        hint: Employee identification number
        type: text
        options: []
        required: true
      - id: 5
        name: facility_area
        label: Facility Area
        hint: Which area is being inspected
        type: select_one
        options:
          - Filling line area
          - Bottle washing station
          - Capping station
          - Labeling area
          - Storage area
          - Packaging area
          - Entire facility
        required: true
      - id: 6
        name: equipment_id
        label: Equipment ID
        hint: Identification number of equipment inspected
        type: text
        options: []
        required: true
      - id: 7
        name: equipment_type
        label: Equipment Type
        hint: Type of equipment inspected
        type: select_one
        options:
          - Filling machine
          - Bottle washer
          - Capping machine
          - Labeling machine
          - Conveyor system
          - Storage tanks
          - Piping system
          - Other
        required: true
      - id: 8
        name: cleaning_schedule
        label: Cleaning Schedule Compliance
        hint: Is equipment being cleaned per schedule
        type: select_one
        options:
          - Yes, on schedule
          - No, behind schedule
          - No, not cleaned
        required: true
      - id: 9
        name: visual_inspection
        label: Visual Inspection Result
        hint: Results of visual cleanliness check
        type: select_one
        options:
          - Clean, no visible residue
          - Minor residue present
          - Significant residue present
          - Contamination visible
        required: true
      - id: 10
        name: odor_check
        label: Odor Check
        hint: Any unusual odors detected
        type: select_one
        options:
          - No odor
          - Clean scent
          - Mild unusual odor
          - Strong unusual odor
          - Foul odor
        required: true
      - id: 11
        name: surface_swab_test
        label: Surface Swab Test
        hint: Results of microbiological swab test
        type: select_one
        options:
          - Passed
          - Failed
          - Not performed
          - Pending results
        required: true
      - id: 12
        name: water_quality_test
        label: Water Quality Test
        hint: Results of water quality analysis
        type: select_one
        options:
          - Passed
          - Failed
          - Not applicable
        required: true
      - id: 13
        name: sanitizer_concentration
        label: Sanitizer Concentration
        hint: Measured concentration level
        type: select_one
        options:
          - Within range
          - Below range
          - Above range
          - Not measured
        required: true
      - id: 14
        name: equipment_condition
        label: Equipment Physical Condition
        hint: Overall condition of equipment
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Requires repair
        required: true
      - id: 15
        name: wear_and_tear
        label: Signs of Wear and Tear
        hint: Any visible wear or damage
        type: select_multiple
        options:
          - None observed
          - Minor scratches
          - Corrosion
          - Cracks
          - Loose parts
          - Leaking seals
          - Worn gaskets
        required: true
      - id: 16
        name: pest_evidence
        label: Evidence of Pests
        hint: Any signs of pest activity
        type: select_one
        options:
          - None
          - Droppings
          - Insects
          - Rodent activity
          - Other
        required: true
      - id: 17
        name: waste_disposal
        label: Waste Disposal Status
        hint: Condition of waste disposal areas
        type: select_one
        options:
          - Properly maintained
          - Needs attention
          - Overflowing
          - Not applicable
        required: true
      - id: 18
        name: employee_hygiene
        label: Employee Hygiene Observance
        hint: Are employees following hygiene protocols
        type: select_one
        options:
          - Fully compliant
          - Minor issues observed
          - Major issues observed
          - Not observed
        required: true
      - id: 19
        name: documentation_review
        label: Documentation Review
        hint: Are cleaning logs properly maintained
        type: select_one
        options:
          - Complete and up to date
          - Partially complete
          - Missing entries
          - Not maintained
        required: true
      - id: 20
        name: overall_hygiene_rating
        label: Overall Hygiene Rating
        hint: Overall assessment of hygiene standards
        type: select_one
        options:
          - Excellent
          - Good
          - Acceptable
          - Needs improvement
          - Unacceptable
        required: true
      - id: 21
        name: corrective_actions
        label: Corrective Actions Required
        hint: List any actions needed
        type: text
        options: []
        required: false
      - id: 22
        name: priority_level
        label: Priority Level
        hint: Urgency of corrective actions
        type: select_one
        options:
          - Immediate action required
          - Action within 24 hours
          - Action within 1 week
          - Routine maintenance
          - No action needed
        required: true
      - id: 23
        name: follow_up_date
        label: Follow-up Inspection Date
        hint: When should re-inspection occur
        type: date
        options: []
        required: false
      - id: 24
        name: inspector_signature
        label: Inspector Signature
        hint: Electronic signature of inspector
        type: text
        options: []
        required: true
      - id: 25
        name: supervisor_review
        label: Supervisor Review Signature
        hint: Supervisor to sign after review
        type: text
        options: []
        required: false
