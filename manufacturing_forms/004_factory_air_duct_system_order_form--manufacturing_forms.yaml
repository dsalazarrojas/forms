inputSchema:
  type: object
  properties:
    title: Factory Air Duct System Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: system_type
      label: Type of Factory Air Duct System
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 3
      name: delivery_date
      label: Expected Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: quantity
      label: Estimated Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: price_range
      label: Price Range
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: supplier_info
      label: HVAC Supplier Details
      hint: null
      type: select_multiple
      options:
      - Supplier 1
      - Supplier 2
      - Supplier 3
      required: true
    - id: 7
      name: tracking_method
      label: Order Tracking Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 8
      name: system_specs
      label: System Technical Specifications
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: factory_info
      label: Factory Details
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 10
      name: material_used
      label: Material Used
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 11
      name: installation_date
      label: Expected Installation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: special_requests
      label: Special Requests or Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: system_details
      label: System Details
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 14
      name: factory_address
      label: Factory Address
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: shipping_info
      label: Shipping Information
      hint: null
      type: text
      options: []
      required: true
