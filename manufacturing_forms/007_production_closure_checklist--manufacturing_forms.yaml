inputSchema:
  type: object
  properties:
    title: Production Closure Checklist
    pages:
    - id: 1
      name: production_line
      label: Production Line
      hint: Enter the current production line
      type: text
      options: []
      required: true
    - id: 2
      name: is_production_line_closed
      label: Is the production line closed?
      hint: Enter yes or no
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: production_date
      label: Production Date
      hint: Enter the production date
      type: date
      options: []
      required: true
    - id: 4
      name: production_time
      label: Production Time
      hint: Enter the production time
      type: time
      options: []
      required: true
    - id: 5
      name: shift_length
      label: Shift Length
      hint: Enter the length of the shift
      type: number
      options: []
      required: true
    - id: 6
      name: is_shift_length_hours
      label: Is the shift length in hours?
      hint: Enter yes or no
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: production_manager_name
      label: Production Manager
      hint: Enter the production manager's name
      type: text
      options: []
      required: true
    - id: 8
      name: production_manager_email
      label: Production Manager Email
      hint: Enter the production manager's email
      type: email
      options: []
      required: true
    - id: 9
      name: production_manager_phone
      label: Production Manager Phone
      hint: Enter the production manager's phone number
      type: text
      options: []
      required: true
    - id: 10
      name: location
      label: Location
      hint: Enter the production location
      type: text
      options: []
      required: true
    - id: 11
      name: is_production_resources_available_next_shift
      label: Are any production resources available for next shift?
      hint: Enter yes or no
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: is_production_resources_unavailable_next_shift
      label: Are any production resources unavailable for next shift?
      hint: Enter yes or no
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
