inputSchema:
  type: object
  properties:
    title: Factory Signal Light Tower Order Form
    pages:
    - id: 1
      name: user_id
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: Email Address
      hint: Enter customer email address
      type: email
      options: []
      required: false
    - id: 3
      name: tower_id
      label: Tower Type
      hint: Select type of tower
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: tower_size
      label: Tower Size
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: material_type
      label: Material Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: color
      label: Color
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: special_instructions
      label: Special Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: order_quantity
      label: Order Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
