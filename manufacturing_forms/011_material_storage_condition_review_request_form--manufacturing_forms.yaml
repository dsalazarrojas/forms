inputSchema:
  type: object
  properties:
    title: Material Storage Condition Review Request Form
    pages:
    - id: 1
      name: submitter
      label: Submitter
      hint: null
      type: select_one
      options:
      - User
      - Lab
      - Warehouse
      - Manufacturing
      required: true
    - id: 2
      name: submitter_email
      label: Email
      hint: Email address of submitter
      type: email
      options: []
      required: true
    - id: 3
      name: facility
      label: Facility
      hint: null
      type: select_multiple
      options:
      - Lab
      - Warehouse
      - Manufacturing
      required: true
    - id: 4
      name: location
      label: Location
      hint: Facility location
      type: text
      options: []
      required: true
    - id: 5
      name: storage_type
      label: Storage Type
      hint: null
      type: select_one
      options:
      - Refrigerated
      - Ambient
      - Freezer
      required: true
    - id: 6
      name: storage_condition
      label: Storage Condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: urgency_level
      label: Urgency Level
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 8
      name: supporting_documents
      label: Supporting Documents
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: Any additional comments
      type: text
      options: []
      required: true
    - id: 10
      name: reviewer
      label: Reviewer
      hint: null
      type: select_one
      options:
      - Lab
      - Warehouse
      - Manufacturing
      required: false
    - id: 11
      name: reviewer_email
      label: Reviewer Email
      hint: Email address of reviewer
      type: email
      options: []
      required: false
    - id: 12
      name: reviewer_comments
      label: Reviewer Comments
      hint: Any additional comments
      type: text
      options: []
      required: false
    - id: 13
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: review_time
      label: Review Time
      hint: null
      type: time
      options: []
      required: true
    - id: 15
      name: review_status
      label: Review Status
      hint: null
      type: select_one
      options:
      - Not Started
      - In Progress
      - Completed
      required: true
    - id: 16
      name: reviewer_name
      label: Reviewer Name
      hint: Name of the reviewer
      type: text
      options: []
      required: false
    - id: 17
      name: review_date_time
      label: Review Date/Time
      hint: null
      type: date
      options: []
      required: false
    - id: 18
      name: storage_capacity
      label: Storage Capacity
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: review_time_in
      label: Time in
      hint: null
      type: time
      options: []
      required: false
    - id: 20
      name: review_time_out
      label: Time out
      hint: null
      type: time
      options: []
      required: false
    - id: 21
      name: review_time_total
      label: Time Total
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: reviewer_location
      label: Reviewer Location
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: facility_location
      label: Facility Location
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: storage_capacity_2
      label: Storage Capacity 2
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: reviewer_phone
      label: Reviewer Phone
      hint: null
      type: text
      options: []
      required: false
