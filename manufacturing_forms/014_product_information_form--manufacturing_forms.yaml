inputSchema:
  type: object
  properties:
    title: Product Information Form
    pages:
    - id: 1
      name: product_details
      label: Product Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_images
      label: Product Images
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: product_description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: product_price
      label: Price
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: manufacturer
      label: Manufacturer
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: product_weight
      label: Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: product_weight_unit
      label: Weight Unit
      hint: null
      type: select_one
      options:
      - kg
      - lbs
      - oz
      - g
      required: false
    - id: 8
      name: product_category
      label: Category
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: product_tags
      label: Tags
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: product_note
      label: Note
      hint: null
      type: note
      options: []
      required: false
