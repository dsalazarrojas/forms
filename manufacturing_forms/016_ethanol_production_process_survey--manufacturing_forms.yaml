inputSchema:
  type: object
  properties:
    title: Ethanol Production Process Survey
    pages:
    - id: 1
      name: production_plant
      label: Production Plant
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: process_type
      label: Production Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
