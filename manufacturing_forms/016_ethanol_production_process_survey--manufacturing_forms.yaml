      type: number
      options: []
      required: false
    - id: 9
      name: production_shift
      label: Production Shift
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: production_shift_start_time
      label: Production Shift Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: production_shift_end_time
      label: Production Shift End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: personnel_on_site
      label: Personnel on Site
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
