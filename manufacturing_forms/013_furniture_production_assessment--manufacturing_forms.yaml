    - id: 5
      name: production_date
      label: Production Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: production_shift
      label: Production Shift
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: production_notes
      label: Production Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: false
