inputSchema:
  type: object
  properties:
    title: Athletic Gear Manufacturer Partnership Application Form
    pages:
    - id: 1
      name: company_background_header
      label: -- Manufacturer Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: manufacturer_name
      label: Manufacturer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: hq_address
      label: Corporate Headquarters Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: website_url
      label: Website URL
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: year_established
      label: Year Established
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: product_categories
      label: Primary Product Categories
      hint: Select all that apply
      type: select_multiple
      options:
      - Athletic Footwear
      - High-Performance Apparel
      - Protective Gear and Safety
      - Sports Equipment (Hard Goods)
      - Training Accessories
      required: true
    - id: 7
      name: partnership_details_header
      label: -- Partnership Objectives --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: partnership_type
      label: Type of Partnership Sought
      hint: null
      type: select_one
      options:
      - Official Team / Program Supplier
      - Retail Distribution and Wholesale
      - Co-Branded Design Collaboration
      - Material Research and Field Testing
      - Strategic Sponsorship
      required: true
    - id: 9
      name: target_demographic
      label: Target Demographic
      hint: e.g. Elite Professional Athletes, Youth Academies, Fitness Enthusiasts
      type: text
      options: []
      required: true
    - id: 10
      name: product_usp
      label: Unique Selling Proposition (USP) of your Products
      hint: What differentiates your gear from competitors?
      type: text
      options: []
      required: true
    - id: 11
      name: manufacturing_quality_header
      label: -- Manufacturing and Quality Control --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: production_capacity
      label: Annual Production Capacity - Total Units
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: quality_certifications
      label: Quality and Ethical Certifications Held
      hint: Select all that apply
      type: select_multiple
      options:
      - ISO 9001
      - OEKO-TEX Standard 100
      - Fair Trade Certified
      - BlueSign System Partner
      - WRAP Certification
      required: false
    - id: 14
      name: ethical_sourcing_status
      label: Do you have a formal Ethical Sourcing Commitment?
      hint: null
      type: select_one
      options:
      - Yes, formally documented
      - In development
      - false
      required: true
    - id: 15
      name: custom_lead_time
      label: Average Lead Time for Custom Orders
      hint: e.g. 8-12 weeks
      type: text
      options: []
      required: true
    - id: 16
      name: marketing_reach_header
      label: -- Marketing and Visibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: current_sponsorships
      label: Current Major Sponsorships or High-Profile Partners
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: marketing_budget
      label: Annual Marketing Budget for Partnerships
      hint: Estimated in USD
      type: number
      options: []
      required: false
    - id: 19
      name: social_media_reach
      label: Total Social Media Reach - Combined Followers
      hint: Approximate count
      type: number
      options: []
      required: false
    - id: 20
      name: contact_proposal_header
      label: -- Contact and Proposal Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: contact_name
      label: Primary Partnership Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 22
      name: contact_job_title
      label: Contact Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 23
      name: contact_email
      label: Contact Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 24
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 25
      name: proposal_summary
      label: Executive Summary of Partnership Proposal
      hint: Briefly describe the proposed collaboration
      type: text
      options: []
      required: true
    - id: 26
      name: certification_header
      label: -- Certification --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: info_accuracy_certification
      label: I certify that all information provided is accurate and complete
      hint: null
      type: select_one
      options:
      - I certify
      - Other
      required: true
    - id: 28
      name: application_date
      label: Date of Application
      hint: null
      type: date
      options: []
      required: true
