inputSchema:
  type: object
  properties:
    title: Steam Boiler Form
    pages:
    - id: 1
      name: general_info
      label: steam_boiler_info
      hint: null
      type: select_multiple
      options:
      - operational
      - non operational
      - under repair
      required: true
    - id: 2
      name: maintenance_schedule
      label: maintenance_schedule
      hint: null
      type: select_multiple
      options:
      - weekly
      - monthly
      - quarterly
      - yearly
      required: true
    - id: 3
      name: inspection_results
      label: inspection_results
      hint: null
      type: select_multiple
      options:
      - passed
      - failed
      - pending
      required: true
    - id: 4
      name: maintenance_records
      label: maintenance_records
      hint: null
      type: text
      options: []
      required: true
