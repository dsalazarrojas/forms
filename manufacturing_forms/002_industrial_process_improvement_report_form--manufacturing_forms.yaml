      hint: What is the current process name?
      type: text
      options: []
      required: false
    - id: 5
      name: current_process_description
      label: current_process_description
      hint: Describe the current process in detail.
      type: text
      options: []
      required: false
    - id: 6
      name: improvement_area
      label: improvement_area
