inputSchema:
  type: object
  properties:
    title: Industrial Process Improvement Report Form
    pages:
    - id: 1
      name: industrial_process_improvement_report
      label: Industrial Process Improvement Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: category
      label: category
      hint: null
      type: select_one
      options:
      - Manufacturing
      - Other
      required: false
    - id: 3
