inputSchema:
  type: object
  properties:
    title: Hairdressers Appointment Request Form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: stylist
      label: Select a Stylist
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Bob
      required: false
    - id: 3
      name: service
      label: Select a Service
      hint: 'Select one of the following services: haircut, hair coloring, etc.'
      type: select_one
      options:
      - haircut
      - coloring
      - styling
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: note
      label: Additional Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
