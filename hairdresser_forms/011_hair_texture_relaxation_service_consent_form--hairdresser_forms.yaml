inputSchema:
  type: object
  properties:
    title: Hair Texture Relaxation Service Consent Form
    pages:
    - id: 1
      name: client_health_details
      label: Client Health Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: health_risks
      label: Health Risks
      hint: null
      type: select_multiple
      options:
      - High risk of burns or scarring
      - High risk of hair breakage
      - Skin irritation
      - Other (please specify)
      required: false
    - id: 3
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: client_signature
      label: Client Signature
      hint: null
      type: select_one
      options:
      - Client has read and signed this form
      - Other
      required: false
    - id: 5
      name: stylist_name
      label: Stylist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: salon_name
      label: Salon
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Chemical Relaxing
      - Haircut
      - Chemical Treatment
      required: false
    - id: 9
      name: other_services
      label: Other services provided
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - I have read and understand the risks associated with this service
      - Other
      required: false
