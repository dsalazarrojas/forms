inputSchema:
  type: object
  properties:
    title: Covid 19 Salon Services Consent Form
    pages:
    - id: 1
      name: salon_info
      label: Salon Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: screening
      label: Screening Questionnaire
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time_of_visit
      label: Time of Visit
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: screening_result
      label: Screening Result
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: follow_up
      label: Follow-up
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      required: false
    - id: 11
      name: next_visit
      label: Next Visit
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      required: false
