inputSchema:
  type: object
  properties:
    title: Barber Shop Inspection Checklist
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date of this inspection
      type: date
      options: []
      required: true
    - id: 2
      name: inspector_name
      label: Inspector Name
      hint: Full name of the person conducting inspection
      type: text
      options: []
      required: true
    - id: 3
      name: shop_name
      label: Shop Name
      hint: Name of the barber shop being inspected
      type: text
      options: []
      required: true
    - id: 4
      name: shop_address
      label: Shop Address
      hint: Complete street address
      type: text
      options: []
      required: true
    - id: 5
      name: license_display
      label: Business License Displayed
      hint: Is the business license visibly posted
      type: select_one
      options:
      - Yes, clearly displayed
      - No, not displayed
      - Expired
      required: true
    - id: 6
      name: barber_licenses
      label: Barber Licenses Current
      hint: Are all barber licenses up to date
      type: select_one
      options:
      - All current
      - Some expired
      - None current
      required: true
    - id: 7
      name: cleanliness_rating
      label: Overall Cleanliness Rating
      hint: Rate the general cleanliness of the shop
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Unacceptable
      required: true
    - id: 8
      name: floor_condition
      label: Floor Condition
      hint: Are floors clean and free of debris
      type: select_one
      options:
      - Clean and well maintained
      - Minor issues
      - Needs attention
      - Unacceptable
      required: true
    - id: 9
      name: workstation_cleanliness
      label: Workstation Cleanliness
      hint: Are barber stations clean and organized
      type: select_one
      options:
      - Very clean
      - Acceptable
      - Needs improvement
      - Unsanitary
      required: true
    - id: 10
      name: tool_sanitization
      label: Tool Sanitization
      hint: Are tools properly sanitized between clients
      type: select_one
      options:
      - Properly sanitized
      - Inconsistent
      - Not sanitized
      required: true
    - id: 11
      name: equipment_condition
      label: Equipment Condition
      hint: State of chairs, mirrors, and equipment
      type: select_one
      options:
      - Excellent condition
      - Good condition
      - Needs repair
      - Poor condition
      required: true
    - id: 12
      name: ventilation
      label: Ventilation System
      hint: Is there adequate air circulation
      type: select_one
      options:
      - Adequate
      - Marginal
      - Inadequate
      required: true
    - id: 13
      name: lighting
      label: Lighting Quality
      hint: Is lighting sufficient for services
      type: select_one
      options:
      - Excellent
      - Adequate
      - Poor
      required: true
    - id: 14
      name: restroom_cleanliness
      label: Restroom Cleanliness
      hint: Condition of customer restrooms
      type: select_one
      options:
      - Very clean
      - Acceptable
      - Needs cleaning
      - Unsanitary
      - Not applicable
      required: true
    - id: 15
      name: waste_disposal
      label: Waste Disposal
      hint: Are trash containers properly maintained
      type: select_one
      options:
      - Properly maintained
      - Needs attention
      - Inadequate
      required: true
    - id: 16
      name: product_storage
      label: Product Storage
      hint: Are products stored properly and labeled
      type: select_one
      options:
      - Properly stored and labeled
      - Minor issues
      - Improper storage
      required: true
    - id: 17
      name: fire_safety
      label: Fire Safety Equipment
      hint: Are fire extinguishers present and current
      type: select_one
      options:
      - Compliant
      - Needs attention
      - Non compliant
      required: true
    - id: 18
      name: accessibility
      label: Accessibility Compliance
      hint: Is the shop accessible to disabled persons
      type: select_one
      options:
      - Fully accessible
      - Partially accessible
      - Not accessible
      required: true
    - id: 19
      name: violations_found
      label: Violations Found
      hint: List any violations discovered
      type: text
      options: []
      required: false
    - id: 20
      name: corrective_actions
      label: Required Corrective Actions
      hint: Actions needed to achieve compliance
      type: text
      options: []
      required: false
    - id: 21
      name: follow_up_required
      label: Follow Up Inspection Required
      hint: Is a follow up inspection needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: overall_assessment
      label: Overall Assessment
      hint: Final assessment of the shop
      type: select_one
      options:
      - Pass - No issues
      - Pass with minor corrections
      - Fail - Major corrections needed
      - Fail - Immediate closure recommended
      required: true
    - id: 23
      name: inspector_signature
      label: Inspector Signature
      hint: Type your full name
      type: text
      options: []
      required: true
    - id: 24
      name: manager_signature
      label: Manager Acknowledgment Signature
      hint: Shop manager signature if present
      type: text
      options: []
      required: false
