inputSchema:
  type: object
  properties:
    title: Custom Wig Order Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Client Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Client Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: hair_type
      label: Hair Type
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: color_request
      label: Color Request
      hint: null
      type: select_one
      options:
      - Blonde
      - Brown
      - Red
      required: true
    - id: 6
      name: size_request
      label: Size Request
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 7
      name: style_request
      label: Style Request
      hint: null
      type: select_one
      options:
      - Straight
      - Curly
      - Wavy
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Client
      - Saloon
      - Stylist
      required: true
    - id: 10
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
