inputSchema:
  type: object
  properties:
    title: Tape In Hair Extension Placement Checklist
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: hair_condition
      label: Hair Condition
      hint: null
      type: select_one
      options:
      - Fine
      - Medium
      - Coarse
      required: false
    - id: 3
      name: extension_type
      label: Extension Type
      hint: null
      type: select_one
      options:
      - Clip-in
      - Tape-in
      - Micro-link
      required: false
    - id: 4
      name: hair_length
      label: Hair Length
      hint: null
      type: select_multiple
      options:
      - Short
      - Medium
      - Long
      required: false
    - id: 5
      name: placement_location
      label: Placement Location
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: hair_color
      label: Hair Color
      hint: null
      type: select_one
      options:
      - Blonde
      - Brown
      - Red
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
