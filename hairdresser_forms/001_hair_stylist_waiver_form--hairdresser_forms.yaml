inputSchema:
  type: object
  properties:
    title: Hair Stylist Waiver Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Client Name
      type: text
      options: []
      required: true
    - id: 2
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: stylist_name
      label: Stylist Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Haircut
      - Coloring
      - Chemical Treatment
      required: true
    - id: 6
      name: client_phone
      label: Client Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: client_email
      label: Client E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: waiver_text
      label: Waiver Text
      hint: null
      type: text
      options: []
      required: true
