inputSchema:
  type: object
  properties:
    title: Hair Protein Infusion Consent Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Enter your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Enter your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: true
    - id: 4
      name: health_info
      label: Health Information
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: allergies
      label: Allergies
      hint: Enter any allergies
      type: select_multiple
      options:
      - Allergic to
      - None
      required: true
    - id: 6
      name: treatment_consent
      label: Treatment Consent
      hint: null
      type: select_one
      options:
      - I consent to the treatment
      - I do not consent to the treatment
      required: true
    - id: 7
      name: date_of_birth
      label: Date of Birth
      hint: Format must be mm/dd/yyyy
      type: date
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
