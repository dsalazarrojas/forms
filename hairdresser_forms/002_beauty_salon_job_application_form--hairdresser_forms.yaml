inputSchema:
  type: object
  properties:
    title: Beauty Salon Job Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Full Name
      hint: Legal name as it appears on ID
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Best number to reach you
      type: text
      options: []
      required: true
    - id: 4
      name: home_address
      label: Home Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 5
      name: position_applied
      label: Position Applied For
      hint: Select the position you are applying for
      type: select_one
      options:
      - Hairstylist
      - Senior Stylist
      - Colorist
      - Barber
      - Nail Technician
      - Esthetician
      - Salon Assistant
      - Receptionist
      required: true
    - id: 6
      name: availability
      label: Availability
      hint: Select all that apply
      type: select_multiple
      options:
      - Monday Morning
      - Monday Afternoon
      - Tuesday Morning
      - Tuesday Afternoon
      - Wednesday Morning
      - Wednesday Afternoon
      - Thursday Morning
      - Thursday Afternoon
      - Friday Morning
      - Friday Afternoon
      - Saturday Morning
      - Saturday Afternoon
      - Sunday
      required: true
    - id: 7
      name: cosmetology_license
      label: Cosmetology License Number
      hint: State license number if applicable
      type: text
      options: []
      required: false
    - id: 8
      name: license_state
      label: License State
      hint: State where license was issued
      type: text
      options: []
      required: false
    - id: 9
      name: license_expiry
      label: License Expiration Date
      hint: When does your license expire
      type: date
      options: []
      required: false
    - id: 10
      name: years_experience
      label: Years of Experience
      hint: Total years in the beauty industry
      type: number
      options: []
      required: true
    - id: 11
      name: specialties
      label: Areas of Specialization
      hint: Select your specialties
      type: select_multiple
      options:
      - Hair Cutting
      - Hair Coloring
      - Balayage
      - Highlights
      - Extensions
      - Updos and Styling
      - Chemical Treatments
      - Bridal Hair
      - Men cuts
      - Nail Care
      - Facials
      - Makeup Application
      required: true
    - id: 12
      name: previous_salon
      label: Most Recent Salon Employer
      hint: Name and location of previous salon
      type: text
      options: []
      required: true
    - id: 13
      name: previous_position
      label: Previous Position
      hint: Your title at previous salon
      type: text
      options: []
      required: true
    - id: 14
      name: employment_dates
      label: Employment Dates
      hint: Start and end dates at previous salon
      type: text
      options: []
      required: true
    - id: 15
      name: reason_leaving
      label: Reason for Leaving
      hint: Why did you leave your previous position
      type: text
      options: []
      required: true
    - id: 16
      name: client_base
      label: Do You Have an Existing Client Base
      hint: Will you be bringing existing clients
      type: select_one
      options:
      - 'True'
      - 'False'
      - Some
      required: true
    - id: 17
      name: commission_expectations
      label: Commission Structure Preference
      hint: Preferred compensation structure
      type: select_one
      options:
      - Hourly plus tips
      - Commission only
      - Base plus commission
      - Booth rental
      required: true
    - id: 18
      name: references
      label: Professional References
      hint: Provide 2-3 references with contact information
      type: text
      options: []
      required: true
    - id: 19
      name: portfolio_link
      label: Portfolio or Social Media Link
      hint: Link to your work portfolio or Instagram
      type: text
      options: []
      required: false
    - id: 20
      name: start_date
      label: Available Start Date
      hint: When can you begin working
      type: date
      options: []
      required: true
    - id: 21
      name: background_check
      label: Background Check Consent
      hint: I authorize a background check
      type: select_one
      options:
      - Yes I consent
      - No I do not consent
      required: true
    - id: 22
      name: additional_certifications
      label: Additional Certifications
      hint: List any additional certifications or training
      type: text
      options: []
      required: false
