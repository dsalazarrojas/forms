inputSchema:
  type: object
  properties:
    title: Hair Care Survey
    pages:
    - id: 1
      name: hair_care_survey
      label: What is your current hair care routine?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: hair_type
      label: What type is your hair?
      hint: null
      type: select_one
      options:
      - curly
      - straight
      - wavy
      required: false
    - id: 3
      name: hair_length
      label: How long is your hair?
      hint: null
      type: select_multiple
      options:
      - short
      - medium
      - long
      - extra long
      required: false
    - id: 4
      name: hair_color
      label: What is your hair color?
      hint: null
      type: select_one
      options:
      - blonde
      - brunette
      - red
      - other
      required: false
    - id: 5
      name: hair_product_usage
      label: Which hair products do you use?
      hint: null
      type: select_multiple
      options:
      - shampoo
      - conditioner
      - hair oil
      - hair spray
      required: false
    - id: 6
      name: hair_care_frequency
      label: How often do you use hair care products?
      hint: null
      type: select_one
      options:
      - daily
      - weekly
      - monthly
      required: false
    - id: 7
      name: hair_care_method
      label: How do you care for your hair?
      hint: null
      type: select_multiple
      options:
      - wash
      - condition
      - style
      - other
      required: false
    - id: 8
      name: hair_issues
      label: What hair issues do you face?
      hint: null
      type: select_multiple
      options:
      - dryness
      - frizz
      - oiliness
      - other
      required: false
    - id: 9
      name: hair_preferences
      label: What matters most when choosing hair care products?
      hint: null
      type: select_multiple
      options:
      - quality
      - price
      - brand
      - other
      required: false
    - id: 10
      name: hair_survey_response
      label: Do you have any other comments or responses about hair care?
      hint: null
      type: note
      options: []
      required: false
