inputSchema:
  type: object
  properties:
    title: Barber Shop Consent And Appointment Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: section_header_2
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: preferred_date
      label: Preferred appointment date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: preferred_time
      label: Preferred appointment time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: service_type
      label: Service requested
      hint: null
      type: select_one
      options:
      - Haircut
      - Beard Trim
      - Shaving
      - Styling
      - Full Grooming Package
      required: true
    - id: 10
      name: estimated_duration
      label: Estimated service duration preference
      hint: null
      type: select_one
      options:
      - 15 minutes
      - 30 minutes
      - 45 minutes
      - 60 minutes
      - 90 minutes
      required: false
    - id: 11
      name: barber_preference
      label: Preferred barber
      hint: Leave blank for first available
      type: text
      options: []
      required: false
    - id: 12
      name: section_header_3
      label: -- Medical and Safety Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: skin_conditions
      label: Do you have any skin conditions or allergies?
      hint: null
      type: select_one
      options:
      - None
      - Sensitive Skin
      - Eczema
      - Psoriasis
      - Other
      required: true
    - id: 14
      name: allergy_details
      label: If yes, please describe
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: bleeding_disorder
      label: Do you have any bleeding disorders or take blood thinners?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: section_header_4
      label: -- Consent and Release --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: health_acknowledgment
      label: I confirm that I have disclosed all relevant health information
      hint: null
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 18
      name: release_agreement
      label: I release the barber and shop from liability for normal service-related
        risks
      hint: null
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 19
      name: cancellation_policy
      label: I understand the cancellation policy and agree to provide 24 hours notice
      hint: null
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 20
      name: privacy_consent
      label: I consent to having my information stored for future appointments
      hint: null
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: false
    - id: 21
      name: signature_confirmation
      label: By submitting this form, I confirm my identity and agreement
      hint: null
      type: select_one
      options:
      - I Confirm
      - Cancel
      required: true
