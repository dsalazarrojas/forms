inputSchema:
  type: object
  properties:
    title: Streaming Moderator Application Form
    pages:
    - id: 1
      name: streaming_moderator_application_form
      label: streaming_moderator_application_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: streaming_name
      label: streaming_name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: schedule
      label: schedule
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: availability
      label: availability
      hint: Availability
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      required: true
    - id: 6
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: streaming_platform
      label: streaming_platform
      hint: Please select only one streaming platform
      type: select_one
      options:
      - Twitch
      - Youtube
      - Facebook
      - Other
      required: true
    - id: 10
      name: streaming_language
      label: streaming_language
      hint: Please select only one language
      type: select_one
      options:
      - English
      - French
      - Spanish
      - Chinese
      required: true
    - id: 11
      name: team_size
      label: team_size
      hint: Please select only one team size
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 12
      name: role
      label: role
      hint: Please select only one role
      type: select_one
      options:
      - Admin
      - Moderator
      - Other
      required: true
