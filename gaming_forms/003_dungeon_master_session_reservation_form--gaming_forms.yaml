inputSchema:
  type: object
  properties:
    title: Dungeon Master Session Reservation Form
    pages:
    - id: 1
      name: reservation_details
      label: Reservation Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: player_details
      label: Player Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: session_details
      label: Session Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: session_time
      label: Session Time
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: session_date
      label: Session Date
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: game_system
      label: Game System
      hint: null
      type: select_one
      options:
      - Dungeons & Dragons
      - Pathfinder
      - Other
      required: true
    - id: 7
      name: players
      label: Players
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - Bob Smith
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
