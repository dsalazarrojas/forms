inputSchema:
  type: object
  properties:
    title: Board Game Playtest Feedback Form
    pages:
    - id: 1
      name: tester_info
      label: -- Tester Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: tester_name
      label: Tester name
      hint: Optional for anonymous feedback
      type: text
      options: []
      required: false
    - id: 3
      name: play_date
      label: Play date
      hint: Date of playtest
      type: date
      options: []
      required: true
    - id: 4
      name: play_duration_minutes
      label: Play duration minutes
      hint: How long the session lasted
      type: number
      options: []
      required: false
    - id: 5
      name: overall_enjoyment
      label: Overall enjoyment rating
      hint: Rate the game overall
      type: select_one
      options:
      - 1 Poor
      - 2 Fair
      - 3 Good
      - 4 Very good
      - 5 Excellent
      required: true
    - id: 6
      name: balance_feedback
      label: Balance feedback
      hint: Comments on fairness and balance
      type: text
      options: []
      required: false
    - id: 7
      name: rule_clarity
      label: Rule clarity rating
      hint: How clear were the rules
      type: select_one
      options:
      - Very unclear
      - Somewhat unclear
      - Clear
      - Very clear
      required: true
    - id: 8
      name: components_quality
      label: Components quality feedback
      hint: Thoughts on pieces cards board
      type: text
      options: []
      required: false
    - id: 9
      name: improvement_suggestions
      label: Improvement suggestions
      hint: Ideas to improve gameplay
      type: text
      options: []
      required: false
