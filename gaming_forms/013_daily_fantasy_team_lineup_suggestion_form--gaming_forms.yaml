inputSchema:
  type: object
  properties:
    title: Daily Fantasy Team Lineup Suggestion Form
    pages:
    - id: 1
      name: user_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: user_email_confirmation
      label: Confirm Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: sport
      label: Sport
      hint: null
      type: select_one
      options:
      - NFL
      - MLB
      - NBA
      - NHL
      required: true
    - id: 5
      name: contest_type
      label: Contest Type
      hint: null
      type: select_one
      options:
      - Head-to-Head
      - Roto
      - Satellites
      required: true
    - id: 6
      name: lineup_position
      label: Lineup Position
      hint: null
      type: select_multiple
      options:
      - Starting
      - Backup
      - Reserve
      required: true
    - id: 7
      name: league_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: league_size
      label: Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 9
      name: league_type
      label: Type
      hint: null
      type: select_one
      options:
      - Public
      - Private
      required: true
    - id: 10
      name: suggested_lineup
      label: Suggested Lineup
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: suggested_lineup_confirmation
      label: Confirm Lineup
      hint: null
      type: text
      options: []
      required: true
