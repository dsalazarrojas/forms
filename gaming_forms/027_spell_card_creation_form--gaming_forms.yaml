inputSchema:
  type: object
  properties:
    title: Spell Card Creation Form
    pages:
    - id: 1
      name: card_name
      label: Card Name
      hint: Enter the name of the card.
      type: text
      options: []
      required: true
    - id: 2
      name: card_mana_cost
      label: Mana Cost
      hint: Enter the mana cost of the card.
      type: number
      options: []
      required: true
    - id: 3
      name: card_type
      label: Type of Card
      hint: What type of card is this?
      type: select_one
      options:
      - Common
      - Uncommon
      - Rare
      - Mythic
      - Foil
      required: true
    - id: 4
      name: card_power
      label: Power
      hint: Enter the power of the card.
      type: number
      options: []
      required: true
    - id: 5
      name: card_card_type
      label: Card Type
      hint: What is the card type?
      type: select_one
      options:
      - Creature
      - Instant
      - Enchantment
      - Planeswalker
      - Sorcery
      - Artifact
      - Other
      required: true
    - id: 6
      name: card_rarity
      label: Card Rarity
      hint: What is the rarity of the card?
      type: select_one
      options:
      - Common
      - Uncommon
      - Rare
      - Mythic
      - Foil
      required: true
    - id: 7
      name: card_keywords
      label: Keywords
      hint: Enter the keywords of the card.
      type: text
      options: []
      required: false
    - id: 8
      name: card_description
      label: Card Description
      hint: Enter a brief description of the card.
      type: text
      options: []
      required: false
    - id: 9
      name: card_image
      label: Card Image
      hint: Upload an image of the card.
      type: text
      options: []
      required: false
    - id: 10
      name: card_set
      label: Card Set
      hint: What card set does this card belong to?
      type: text
      options: []
      required: false
    - id: 11
      name: card_image_two
      label: Card Image 2
      hint: Upload an image of the card 2.
      type: text
      options: []
      required: false
    - id: 12
      name: card_description_two
      label: Card Description 2
      hint: Enter a brief description of the card 2.
      type: text
      options: []
      required: false
