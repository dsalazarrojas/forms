inputSchema:
  type: object
  properties:
    title: Computer Games Survey
    pages:
    - id: 1
      name: section_gamer_profile
      label: -- Gamer Profile --
      hint: Tell us about your gaming habits
      type: note
      options: []
      required: false
    - id: 2
      name: gamer_tag
      label: Gamer tag
      hint: Optional public name
      type: text
      options: []
      required: false
    - id: 3
      name: age_group
      label: Age group
      hint: Select your age bracket
      type: select_one
      options:
      - Under 18
      - 18-24
      - 25-34
      - 35-44
      - 45+
      required: true
    - id: 4
      name: preferred_platform
      label: Preferred platform
      hint: Console, PC, Mobile etc
      type: select_one
      options:
      - PC
      - Console
      - Mobile
      - Cloud
      required: true
    - id: 5
      name: favorite_genres
      label: Favorite genres
      hint: Select all that apply
      type: select_multiple
      options:
      - Action
      - Strategy
      - RPG
      - Simulation
      - Sports
      - Puzzle
      required: false
    - id: 6
      name: weekly_play_hours
      label: Weekly play hours
      hint: Estimate hours per week
      type: number
      options: []
      required: false
    - id: 7
      name: in_game_purchases
      label: In game purchases
      hint: Do you make in game purchases
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Never
      required: true
    - id: 8
      name: satisfaction_with_games
      label: Satisfaction with games
      hint: Rate overall gaming satisfaction
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 9
      name: feedback_on_features
      label: Feedback on features
      hint: What features would you like to see
      type: text
      options: []
      required: false
