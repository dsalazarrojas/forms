inputSchema:
  type: object
  properties:
    title: Twitch Channel Ban Appeal Form
    pages:
    - id: 1
      name: channel_details
      label: What is the channel id for the banned user
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reason_for_ban
      label: What was the reason for the ban?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: ban_details
      label: Please describe the ban in detail
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: appeal_details
      label: Provide an explanation of why the ban was unfair
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: channel_owner_details
      label: What is your Discord username?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: channel_owner_email
      label: What is your email?
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: channel_owner_phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: channel_owner_note
