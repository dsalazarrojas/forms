      name: submit_form
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: select_reason
      label: Why was the channel banned?
      hint: null
      type: select_one
      options:
      - Banned for Harassment
      - Banned for Spamming
      - Banned for Hateful Speech
      - Banned for Inactivity
      - Banned for Inappropriate Content
      required: false
    - id: 11
      name: select_reason_2
      label: Was this a repeat offender?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: select_reason_3
      label: Was the ban a result of a moderator?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: date_of_ban
