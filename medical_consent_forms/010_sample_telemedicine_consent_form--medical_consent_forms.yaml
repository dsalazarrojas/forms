inputSchema:
  type: object
  properties:
    title: Sample Telemedicine Consent Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_email
      label: Patient Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: consent_given
      label: Consent Given
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: signature_date
      label: Signature Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_group
      label: Medical Group
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: provider_name
      label: Provider Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
