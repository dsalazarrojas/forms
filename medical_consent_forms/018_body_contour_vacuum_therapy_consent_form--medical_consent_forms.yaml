inputSchema:
  type: object
  properties:
    title: Body Contour Vacuum Therapy Consent Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: client_address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: procedure_understanding
      label: I understand what body contour vacuum therapy is
      hint: null
      type: select_one
      options:
      - Yes, fully understand
      - Mostly understand
      - Partially understand
      - Do not understand
      required: true
    - id: 9
      name: procedure_explanation
      label: Procedure has been explained to my satisfaction
      hint: null
      type: select_one
      options:
      - true
      - false
      - Need More Explanation
      required: true
    - id: 10
      name: benefits_risks_discussed
      label: Benefits and risks have been discussed
      hint: null
      type: select_one
      options:
      - Yes, thoroughly
      - Yes, briefly
      - false
      required: true
    - id: 11
      name: expected_benefits
      label: I understand the expected benefits
      hint: null
      type: select_one
      options:
      - true
      - Mostly
      - Somewhat
      - false
      required: true
    - id: 12
      name: potential_risks
      label: I understand the potential risks
      hint: Bruising, soreness, etc
      type: select_one
      options:
      - true
      - Mostly
      - Somewhat
      - false
      required: true
    - id: 13
      name: side_effects
      label: Possible side effects have been explained
      hint: null
      type: select_one
      options:
      - true
      - false
      - Partially
      required: true
    - id: 14
      name: alternatives_discussed
      label: Alternative treatments were discussed
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not Applicable
      required: true
    - id: 15
      name: pregnancy_status
      label: Are you currently pregnant
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unsure
      - Not Applicable
      required: true
    - id: 16
      name: medical_conditions
      label: Relevant Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: medications
      label: Current Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: skin_conditions
      label: Skin Conditions or Sensitivities
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: prior_treatments
      label: Prior Vacuum Therapy or Similar Treatments
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: treatment_areas
      label: Treatment Area(s)
      hint: Select all applicable areas
      type: select_multiple
      options:
      - Face
      - Neck
      - Chest
      - Abdomen
      - Buttocks
      - Thighs
      - Legs
      - Arms
      - Back
      - Other
      required: true
    - id: 22
      name: number_of_sessions_planned
      label: Number of Sessions Planned
      hint: null
      type: number
      options: []
      required: true
    - id: 23
      name: realistic_expectations
      label: I have realistic expectations about results
      hint: null
      type: select_one
      options:
      - true
      - Mostly
      - Somewhat
      - false
      required: true
    - id: 24
      name: consent_to_treatment
      label: I consent to undergo this treatment
      hint: null
      type: select_one
      options:
      - I Consent
      - I Do Not Consent
      required: true
