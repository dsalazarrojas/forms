inputSchema:
  type: object
  properties:
    title: Therapy Collaboration Consent Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: practitioner_name
      label: Practitioner Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: shared_info
      label: Information to be Shared
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: consent_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: shared_with
      label: Shared With
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Joe
      - Jane's Practitioner
      - John's Practitioner
      - Other Practitioner
      required: false
    - id: 6
      name: consent_status
      label: Consent Status
      hint: null
      type: select_one
      options:
      - Accepted
      - Declined
      - Pending
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: client_phone
      label: Client Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: practitioner_phone
      label: Practitioner Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: shared_with_email
      label: Shared With Email
      hint: null
      type: email
      options: []
      required: false
