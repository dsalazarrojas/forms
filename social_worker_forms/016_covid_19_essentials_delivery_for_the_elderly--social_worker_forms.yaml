inputSchema:
  type: object
  properties:
    title: COVID 19 Essentials Delivery For The Elderly
    pages:
    - id: 1
      name: recipient_header
      label: -- Recipient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: recipient_name
      label: Recipient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: recipient_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: recipient_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: state_zip
      label: State and Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: age_confirmation
      label: Age 65 or older
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: household_members
      label: Number of household members
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: contact_person
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: essentials_header
      label: -- Essentials Needed --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: essentials_type
      label: Types of essentials needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Groceries
      - Medications
      - Medical Supplies
      - Toiletries
      - Cleaning Supplies
      - Other
      required: true
    - id: 14
      name: grocery_items
      label: Specific grocery items needed
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: medications_needed
      label: Medications or medical supplies
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: dietary_restrictions
      label: Dietary restrictions or allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: health_section
      label: -- Health Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: health_concerns
      label: Any COVID-19 symptoms or health concerns
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: concern_details
      label: Describe health concerns if applicable
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      - Unknown
      required: true
    - id: 21
      name: delivery_header
      label: -- Delivery Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: delivery_method
      label: Preferred Delivery Method
      hint: null
      type: select_one
      options:
      - Contactless Doorstep
      - Hand-to-Hand
      - Contact by Phone First
      required: true
    - id: 23
      name: delivery_date
      label: Preferred Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 24
      name: delivery_time
      label: Preferred Delivery Time
      hint: null
      type: time
      options: []
      required: true
    - id: 25
      name: special_instructions
      label: Special Instructions for Delivery
      hint: null
      type: text
      options: []
      required: false
