inputSchema:
  type: object
  properties:
    title: Home Care Feedback Form
    pages:
    - id: 1
      name: patient_feedback
      label: Patient Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: care_services
      label: Care Services
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time_of_visit
      label: Time of Visit
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: social_worker
      label: Social Worker
      hint: null
      type: select_one
      options:
      - Bob
      - Joe
      - Alice
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
