inputSchema:
  type: object
  properties:
    title: level of care assessment form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_date_of_admission
      label: patient date of admission
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: medical_diagnosis
      label: Medical Diagnosis
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: nursing_level
      label: Nursing Level
      hint: Select the appropriate nursing level
      type: select_one
      options:
      - High
      - Low
      required: true
    - id: 5
      name: rehabilitation_program
      label: Rehabilitation Program
      hint: Select one or more programs
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: current_medications
      label: Current Medications
      hint: List all current medications
      type: text
      options: []
      required: true
    - id: 7
      name: medical_history
      label: Medical History
      hint: Include a detailed medical history
      type: note
      options: []
      required: true
    - id: 8
      name: medical_status
      label: Medical Status
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: patient_notes
