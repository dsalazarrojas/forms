inputSchema:
  type: object
  properties:
    title: Community Engagement Request Form
    pages:
    - id: 1
      name: section_request_details
      label: -- Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization or individual name
      hint: Name of group or person requesting engagement
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Contact person full name
      hint: Primary contact for this request
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email
      hint: Best email for correspondence
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact phone
      hint: Optional phone number
      type: text
      options: []
      required: false
    - id: 6
      name: engagement_type
      label: Type of engagement requested
      hint: Select the primary type of engagement
      type: select_one
      options:
      - Workshop
      - Presentation
      - Community meeting
      - Volunteer support
      - Other
      required: true
    - id: 7
      name: proposed_date
      label: Proposed date
      hint: Preferred date for the engagement
      type: date
      options: []
      required: false
    - id: 8
      name: estimated_attendance
      label: Estimated attendance
      hint: Number of participants expected
      type: number
      options: []
      required: false
    - id: 9
      name: required_resources
      label: Resources required
      hint: AV, space, materials, volunteers
      type: text
      options: []
      required: false
    - id: 10
      name: purpose_and_goals
      label: Purpose and goals of engagement
      hint: Briefly describe objectives
      type: text
      options: []
      required: true
