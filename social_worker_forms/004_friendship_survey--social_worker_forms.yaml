inputSchema:
  type: object
  properties:
    title: Friendship Survey
    pages:
    - id: 1
      name: survey_title
      label: Friendship Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: friend_survey_questions
      label: How do you feel about your friends?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: friend_support_needs
      label: What support do you need from friends?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: friend_support_provided
