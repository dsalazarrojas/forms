inputSchema:
  type: object
  properties:
    title: Adult Adoption Form
    pages:
    - id: 1
      name: applicant_details
      label: -- Applicant Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Applicant full name
      hint: Legal name as on ID
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: Provide date for records
      type: date
      options: []
      required: true
    - id: 4
      name: contact_information
      label: Contact information
      hint: Phone and email
      type: text
      options: []
      required: true
    - id: 5
      name: reason_for_adoption
      label: Reason for adult adoption request
      hint: Explain purpose and background
      type: text
      options: []
      required: true
    - id: 6
      name: legal_documents_attached
      label: Legal documents attached
      hint: Indicate if supporting documents are attached
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: social_worker_notes
      label: Social worker notes
      hint: For internal use only
      type: text
      options: []
      required: false
    - id: 8
      name: consent_to_investigation
      label: Consent to background checks and investigation
      hint: Required for processing
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 9
      name: attorney_contact
      label: Attorney contact if applicable
      hint: Name and phone
      type: text
      options: []
      required: false
    - id: 10
      name: signature_date
      label: Signature date
      hint: Date of submission
      type: date
      options: []
      required: true
