inputSchema:
  type: object
  properties:
    title: Hospice Volunteer Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: volunteer_role
      label: Volunteer Role
      hint: null
      type: select_one
      options:
      - Volunteer
      - Caregiver
      - Support
      - Other (specify)
      required: true
    - id: 6
      name: availability
      label: Availability
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 7
      name: volunteer_hours
      label: Volunteer Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: volunteer_start_date
      label: Volunteer Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: volunteer_end_date
      label: Volunteer End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: volunteer_frequency
      label: Volunteer Frequency
      hint: null
      type: select_one
      options:
      - Once
      - Ongoing
      - As needed
      required: true
    - id: 11
      name: volunteer_duties
      label: Volunteer Duties
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: confirm_signature
      label: Confirm Signature
      hint: null
      type: note
      options: []
      required: false
