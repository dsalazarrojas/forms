inputSchema:
  type: object
  properties:
    title: Free Local Assistance Request Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: request_type
      label: Request Type
      hint: null
      type: select_one
      options:
      - Assistance with Food
      - Emergency Assistance
      required: false
    - id: 3
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - In Person
      required: false
    - id: 4
      name: request_details
      label: Request Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit
      - Other
      required: false
    - id: 6
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: request_status
      label: Request Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      required: false
