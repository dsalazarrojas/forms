inputSchema:
  type: object
  properties:
    title: Animal Network Evaluation Survey
    pages:
    - id: 1
      name: organization_name
      label: Organization Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 2
      name: organization_type
      label: Organization Type
      hint: Select the category that best describes your organization
      type: select_one
      options:
      - Animal Welfare Nonprofit
      - Veterinary Clinic
      - Animal Sanctuary
      - Rescue Organization
      - Government Agency
      - Research Institution
      - Other
      required: true
    - id: 3
      name: contact_person
      label: Contact Person Name
      hint: Full name of primary contact
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: Email address for follow-up
      type: email
      options: []
      required: true
    - id: 5
      name: membership_duration
      label: How long has your organization been part of the network
      hint: null
      type: select_one
      options:
      - Less than 6 months
      - 6 months to 1 year
      - 1 to 3 years
      - 3 to 5 years
      - More than 5 years
      required: true
    - id: 6
      name: network_satisfaction
      label: Overall satisfaction with the Animal Network
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: collaboration_quality
      label: Quality of collaboration with network members
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: true
    - id: 8
      name: communication_effectiveness
      label: Effectiveness of network communication
      hint: How well does the network communicate with members
      type: select_one
      options:
      - Very Effective
      - Effective
      - Neutral
      - Ineffective
      - Very Ineffective
      required: true
    - id: 9
      name: resource_sharing
      label: How often do you share resources with other network members
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 10
      name: support_received
      label: Level of support received from the network
      hint: null
      type: select_one
      options:
      - Exceeded Expectations
      - Met Expectations
      - Below Expectations
      - No Support Received
      required: true
    - id: 11
      name: training_needs
      label: What training or resources would benefit your organization
      hint: Select all that apply
      type: select_multiple
      options:
      - Best Practices Documentation
      - Webinars and Workshops
      - One-on-One Consulting
      - Funding Opportunities
      - Technology Tools
      - Networking Events
      - Other
      required: false
    - id: 12
      name: challenges_faced
      label: What challenges have you faced as a network member
      hint: null
      type: select_multiple
      options:
      - Communication Barriers
      - Limited Resources
      - Coordination Difficulties
      - Lack of Clear Guidelines
      - Time Constraints
      - Geographic Distance
      - None
      required: false
    - id: 13
      name: improvement_suggestions
      label: What improvements would you suggest for the network
      hint: Your feedback helps us improve
      type: text
      options: []
      required: false
    - id: 14
      name: recommend_network
      label: How likely are you to recommend this network to other organizations
      hint: null
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 15
      name: future_participation
      label: Do you plan to continue your network membership
      hint: null
      type: select_one
      options:
      - Yes Definitely
      - Probably Yes
      - Undecided
      - Probably No
      - 'False'
      required: true
    - id: 16
      name: additional_comments
      label: Any additional comments or feedback
      hint: Optional - share anything else on your mind
      type: text
      options: []
      required: false
