inputSchema:
  type: object
  properties:
    title: Inclusive Assessment Design Survey
    pages:
    - id: 1
      name: educator_roles
      label: What roles do educators play in the assessment process?
      hint: null
      type: select_multiple
      options:
      - Lead Educator
      - Assistant Educator
      - Guest Educator
      - Lead Assistant Educator
      required: false
    - id: 2
      name: experience
      label: How would you describe your experience with the current assessment design?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: ratings
      label: What would you rate the overall quality of the assessment?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: strategies
      label: What strategies do you use when designing assessments?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: feedback
      label: What is your feedback on the assessment feedback mechanism?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: frequency
      label: How often do you use assessments to inform your work?
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      required: false
    - id: 7
      name: diverse_perspectives
      label: How would you rate the assessment's ability to capture diverse perspectives?
      hint: null
      type: select_one
      options:
      - Very effective
      - Somewhat effective
      - Not effective at all
      required: false
    - id: 8
      name: received_feedback
      label: Have you ever received feedback on your own assessments?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: received_feedback_frequency
      label: How often do you receive feedback on your assessments?
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      required: false
    - id: 10
      name: inclusivity_rating
      label: What rating would you give to the assessment's ability to accommodate
        different needs?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 11
      name: inclusivity_effectiveness
      label: How would you rate the assessment's effectiveness in promoting inclusivity?
      hint: null
      type: select_one
      options:
      - Very effective
      - Somewhat effective
      - Not effective at all
      required: false
    - id: 12
      name: inclusive_strategies
      label: What strategies do you employ when designing assessments to be more inclusive?
      hint: null
      type: text
      options: []
      required: false
