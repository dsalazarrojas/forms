inputSchema:
  type: object
  properties:
    title: Trading Company Evaluation Survey
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: rating_comment
      label: Rating Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: satisfaction_score
      label: Satisfaction Score
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: satisfaction_comment
      label: Satisfaction Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: would_recommend
      label: Would Recommend
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 8
      name: would_recommend_reasons
      label: Why Would You Recommend
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: company_contact
      label: Company Contact
      hint: null
      type: text
      options: []
      required: false
