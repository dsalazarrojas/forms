inputSchema:
  type: object
  properties:
    title: Appearance Assessment Survey
    pages:
    - id: 1
      name: client_name
      label: Client Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: visit_date
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: primary_service
      label: Service Received
      hint: null
      type: select_one
      options:
      - Hair Styling / Color
      - Nail Services
      - Skin Treatment / Facial
      - Professional Makeup
      - Eyelash / Eyebrow Treatment
      - Other
      required: true
    - id: 4
      name: overall_look_satisfaction
      label: Overall Satisfaction with Final Result
      hint: 1 to 5 scale
      type: number
      options: []
      required: true
    - id: 5
      name: consultation_match
      label: Did the result match your initial consultation?
      hint: null
      type: select_one
      options:
      - Yes, exactly
      - Mostly
      - No, it was different
      required: true
    - id: 6
      name: professionalism_rating
      label: Professionalism and Skill of the Specialist
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: facility_cleanliness
      label: Cleanliness and Comfort of the Facility
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: product_quality_rating
      label: Quality of Products Used
      hint: null
      type: select_one
      options:
      - Superior
      - Standard
      - Sub-par
      required: false
    - id: 9
      name: return_likelihood
      label: How likely are you to return for another service?
      hint: 0 to 10 scale
      type: number
      options: []
      required: true
    - id: 10
      name: liked_aspect
      label: What did you like most about your new look?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: improvement_areas
      label: Any areas where we can improve your experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: photo_permission
      label: Permission to use photos of your look for our portfolio?
      hint: Anonymized if requested
      type: select_one
      options:
      - Yes, I give permission
      - No, please do not use
      required: true
