inputSchema:
  type: object
  properties:
    title: Advance Achievement Survey
    pages:
    - id: 1
      name: survey_header
      label: -- Achievement Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Respondent name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: program_or_course
      label: Program or course name
      hint: Which program are you evaluating
      type: text
      options: []
      required: true
    - id: 4
      name: achievement_level
      label: Achievement level attained
      hint: Select best description
      type: select_one
      options:
      - Below expectations
      - Meets expectations
      - Exceeds expectations
      required: true
    - id: 5
      name: learning_resources_helpful
      label: Were learning resources helpful
      hint: Select yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: most_valuable_component
      label: Most valuable program component
      hint: Describe the most valuable part
      type: text
      options: []
      required: false
    - id: 7
      name: recommendations
      label: Recommendations for improvement
      hint: Suggestions to increase achievement
      type: text
      options: []
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall satisfaction rating
      hint: Rate from 1 low to 5 high
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 9
      name: follow_up_contact
      label: May we contact you for follow up
      hint: Provide contact if yes
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
