description: A survey to gather feedback on our salon services and overall customer
  experience.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied were you with your recent visit to our salon?
  type: single
- options:
  - Weekly
  - Bi-weekly
  - Monthly
  - Every few months
  - Rarely
  text: How often do you typically visit our salon?
  type: single
- options:
  - Friendly staff
  - Skilled stylists
  - Clean facilities
  - Relaxing atmosphere
  - Efficient service
  - Good value
  text: Which of the following best describes your experience at our salon? (select
    all that apply)
  type: multiple
- text: What would you improve or change about our salon services or facilities?
  type: text
- text: Do you have any additional comments or feedback you'd like to share?
  type: text
title: Salon evaluation survey
