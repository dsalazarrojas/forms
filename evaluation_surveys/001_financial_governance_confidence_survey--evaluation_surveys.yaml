inputSchema:
  type: object
  properties:
    title: Financial Governance Confidence Survey
    pages:
    - id: 1
      name: page_1
      label: Financial Governance Confidence Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: page_2
      label: Financial governance confidence
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: page_3
      label: How often do you feel that the board is actively involved in the decision-making
        process?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: page_4
      label: How confident are you that the board will be able to provide the necessary
        resources and support to achieve its objectives?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: page_5
      label: What is the primary purpose of the board in your company?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: page_6
      label: What is your perception of the board's effectiveness in achieving its
        objectives?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: page_7
      label: How satisfied are you with the quality of information provided by the
        board?
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: true
    - id: 8
      name: page_8
      label: What is the primary function of the board?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: page_9
      label: How often do you use the board's reports?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: page_10
      label: How important is the board's involvement in financial matters?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: page_11
      label: What is your perception of the board's involvement in financial matters?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: page_12
      label: How much of the time do you spend using the board's reports?
      hint: null
      type: select_one
      options:
      - '{''value'': 1, ''label'': ''Never''}'
      - '{''value'': 2, ''label'': ''Rarely''}'
      - '{''value'': 3, ''label'': ''Somewhat often''}'
      - '{''value'': 4, ''label'': ''Often''}'
      - '{''value'': 5, ''label'': ''Almost always''}'
      required: true
