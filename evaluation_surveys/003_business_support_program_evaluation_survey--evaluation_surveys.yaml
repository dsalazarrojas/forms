inputSchema:
  type: object
  properties:
    title: Business Support Program Evaluation Survey
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: business_name
      label: Business Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 5
      name: program_start_date
      label: When did you join the program
      hint: Date of enrollment
      type: date
      options: []
      required: true
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction with the Program
      hint: Rate your experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: support_quality
      label: Quality of Support Provided
      hint: How helpful was the support team
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 8
      name: resource_usefulness
      label: Usefulness of Resources and Materials
      hint: Were the provided materials helpful
      type: select_one
      options:
      - Very Useful
      - Useful
      - Somewhat Useful
      - Not Very Useful
      - Not Useful at All
      required: true
    - id: 9
      name: mentor_effectiveness
      label: Mentor or Coach Effectiveness
      hint: Rate the guidance received
      type: select_one
      options:
      - Highly Effective
      - Effective
      - Moderately Effective
      - Ineffective
      - Not Applicable
      required: false
    - id: 10
      name: business_improvements
      label: Business Improvements Since Joining
      hint: Select improvements you have seen
      type: select_multiple
      options:
      - Increased Revenue
      - Better Customer Service
      - Improved Operations
      - Marketing Strategy
      - Financial Management
      - No Significant Changes Yet
      required: true
    - id: 11
      name: most_valuable_aspect
      label: Most Valuable Aspect of the Program
      hint: What helped you the most
      type: text
      options: []
      required: true
    - id: 12
      name: areas_for_improvement
      label: Areas Where the Program Could Improve
      hint: Suggestions for enhancement
      type: text
      options: []
      required: false
    - id: 13
      name: would_recommend
      label: Would You Recommend This Program
      hint: Would you suggest it to other businesses
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Unsure
      - Probably No
      - Definitely No
      required: true
    - id: 14
      name: future_support_areas
      label: Future Support Areas You Need
      hint: What additional support would help
      type: select_multiple
      options:
      - Financial Planning
      - Marketing Strategies
      - Technology and Digital Tools
      - Human Resources
      - Supply Chain Management
      - Other
      required: false
