inputSchema:
  type: object
  properties:
    title: Adult Interaction Feedback Form
    pages:
    - id: 1
      name: section_details
      label: -- Interaction Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Your name - or leave blank for anonymous
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_interaction
      label: Date of Interaction
      hint: When did the interaction occur?
      type: date
      options: []
      required: true
    - id: 4
      name: facilitator_or_representative_name
      label: Facilitator or Representative Name
      hint: Who did you interact with?
      type: text
      options: []
      required: false
    - id: 5
      name: section_comm
      label: -- Communication Effectiveness --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: clarity_of_information_provided
      label: Clarity of Information Provided
      hint: Did you understand the information shared?
      type: select_one
      options:
      - Very Clear
      - Mostly Clear
      - Somewhat Clear
      - Unclear
      required: true
    - id: 7
      name: active_listening_demonstrated
      label: Active Listening Demonstrated
      hint: Did you feel heard and understood?
      type: select_one
      options:
      - Strongly Agree
      - Agree
      - Neutral
      - Disagree
      required: true
    - id: 8
      name: respect_and_professionalism
      label: Respect and Professionalism
      hint: Rate the tone of the interaction
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: section_engagement
      label: -- Engagement Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: opportunity_to_ask_questions
      label: Opportunity to Ask Questions
      hint: null
      type: select_one
      options:
      - Sufficient
      - Somewhat Sufficient
      - Insufficient
      required: true
    - id: 11
      name: helpfulness_of_responses
      label: Helpfulness of Responses
      hint: Were your questions answered effectively?
      type: select_one
      options:
      - Very Helpful
      - Helpful
      - Not Helpful
      required: true
    - id: 12
      name: overall_satisfaction_with_interaction
      label: Overall Satisfaction with Interaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 13
      name: suggestions_for_improvement
      label: Suggestions for Improvement
      hint: What could we have done better?
      type: text
      options: []
      required: false
    - id: 14
      name: would_you_recommend_this_service
      label: Would You Recommend This Service
      hint: Based on your experience
      type: select_one
      options:
      - Definitely
      - Probably
      - Maybe
      - No
      required: false
