title: Personality questionnaire
description: Generate a Personality questionnaire survey for the "Evaluation surveys" category. Use the template name: "Personality questionnaire template".
questions:
  - text: Overall, how satisfied are you with personality questionnaire?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Personality, Questionnaire, Evaluation, Surveys]
  - text: How often do you interact with personality questionnaire?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
