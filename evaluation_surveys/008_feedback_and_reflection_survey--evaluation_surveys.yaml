inputSchema:
  type: object
  properties:
    title: Feedback And Reflection Survey
    pages:
    - id: 1
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Training
      - Meeting
      - Event
      required: false
    - id: 2
      name: question1
      label: What was the primary event purpose?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: question2
      label: What did you hope to achieve at this event?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: question3
      label: What were some of the key takeaways from this event?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: question4
      label: What do you think we could improve on?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: question5
      label: Overall, how satisfied are you with this event?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 7
      name: question6
      label: How likely are you to recommend this event to others?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Not Likely
      required: false
    - id: 8
      name: question7
      label: What did you enjoy most about this event?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: question8
      label: What did you find least satisfying about this event?
      hint: null
      type: text
      options: []
      required: false
