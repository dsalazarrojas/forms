inputSchema:
  type: object
  properties:
    title: Gym Staff Training Effectiveness Survey
    pages:
    - id: 1
      name: survey_info
      label: Survey Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: training_program
      label: Training Program
      hint: null
      type: select_one
      options:
      - '{''value'': ''Basic''}'
      - '{''value'': ''Advanced''}'
      - '{''value'': ''None''}'
      required: false
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Excellent''}'
      - '{''value'': ''Good''}'
      - '{''value'': ''Fair''}'
      - '{''value'': ''Poor''}'
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - '{''value'': ''Staff''}'
      - '{''value'': ''Manager''}'
      - '{''value'': ''Customer''}'
      required: false
    - id: 9
      name: submitted_on
      label: Submitted On
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: submitted_at
      label: Submitted At
      hint: null
      type: time
      options: []
      required: false
