title: Manager effectiveness survey
description: Generate a Manager effectiveness survey survey for the "Evaluation surveys" category. Use the template name: "Manager effectiveness survey template".
questions:
  - text: Overall, how satisfied are you with manager effectiveness survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Manager, Effectiveness, Survey, Evaluation]
  - text: How often do you interact with manager effectiveness survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
