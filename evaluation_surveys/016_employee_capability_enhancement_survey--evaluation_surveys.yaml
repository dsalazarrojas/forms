inputSchema:
  type: object
  properties:
    title: Employee Capability Enhancement Survey
    pages:
    - id: 1
      name: current_role
      label: What is your current role at the company?
      hint: Please select from the list below
      type: select_one
      options:
      - Team Lead
      - Manager
      - Team Member
      - Other
      - None
      required: true
    - id: 2
      name: job_satisfaction
      label: How would you rate your overall job satisfaction?
      hint: Rate from 1 to 5
      type: number
      options: []
      required: false
    - id: 3
      name: department
      label: Which department do you belong to?
      hint: null
      type: select_multiple
      options:
      - Sales
      - Marketing
      - Engineering
      - Operations
      - Other
      required: true
    - id: 4
      name: skills_level
      label: Can you rate your job skills level?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: growth_opportunities
      label: Are you satisfied with your growth opportunities?
      hint: Rate from 1 to 5
      type: number
      options: []
      required: false
    - id: 6
      name: availability
      label: What is your availability?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 7
      name: satisfaction_with_growth
      label: Satisfaction With Growth
      hint: Rate from 1 to 5
      type: number
      options: []
      required: false
    - id: 8
      name: contact_info
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: select_multiple
      label: Select Multiple 1
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 11
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: select_one
      label: Select One 1
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
