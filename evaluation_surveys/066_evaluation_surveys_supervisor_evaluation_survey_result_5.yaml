title: Supervisor evaluation survey
description: Generate a Supervisor evaluation survey survey for the "Evaluation surveys" category. Use the template name: "Supervisor evaluation survey template".
questions:
  - text: Overall, how satisfied are you with supervisor evaluation survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Supervisor, Evaluation, Survey, Surveys]
  - text: How often do you interact with supervisor evaluation survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
