inputSchema:
  type: object
  properties:
    title: Care Coordination Program Effectiveness Evaluation Form
    pages:
      - id: 1
        name: program_header
        label: -- Program Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: program_name
        label: Program name
        hint: Official program title
        type: text
        options: []
        required: true
      - id: 3
        name: evaluation_period
        label: Evaluation period end date
        hint: Date of evaluation
        type: date
        options: []
        required: true
      - id: 4
        name: respondent_role
        label: Respondent role
        hint: Role in program delivery
        type: select_one
        options:
          - Manager
          - Clinician
          - Coordinator
          - Support staff
        required: true
      - id: 5
        name: program_goals_met
        label: Have program goals been met
        hint: Assessed by stakeholders
        type: select_one
        options:
          - Yes
          - Partially
          - No
        required: true
      - id: 6
        name: key_outcomes
        label: Key outcomes observed
        hint: Brief summary of results
        type: text
        options: []
        required: true
      - id: 7
        name: cost_effectiveness
        label: Cost effectiveness assessment
        hint: Qualitative assessment of value
        type: select_one
        options:
          - High
          - Moderate
          - Low
        required: false
      - id: 8
        name: barriers_and_challenges
        label: Barriers and challenges
        hint: Major obstacles encountered
        type: text
        options: []
        required: false
      - id: 9
        name: recommendations
        label: Recommendations for improvement
        hint: Actionable suggestions
        type: text
        options: []
        required: true
      - id: 10
        name: additional_comments
        label: Additional comments
        hint: Any other feedback
        type: text
        options: []
        required: false
