inputSchema:
  type: object
  properties:
    title: Remediation Services Survey
    pages:
    - id: 1
      name: service_type
      label: Service Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: service_received
      label: What service received
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: satisfaction_rating
      label: Satisfaction Rating
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: false
    - id: 4
      name: service_quality
      label: Service Quality
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: false
    - id: 5
      name: service_value
      label: Service Value
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - '5'
      - '4'
      - '3'
      - '2'
      - '1'
      required: false
    - id: 7
      name: service_improvement
      label: Service Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: service_improvement_ideas
      label: Service Improvement Ideas
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
