inputSchema:
  type: object
  properties:
    title: Beekeeping Hive Declaration Form
    pages:
    - id: 1
      name: beekeeper_name
      label: Beekeeper Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: beekeeper_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: beekeeper_phone
      label: Phone Number
      hint: Best number to reach you
      type: text
      options: []
      required: true
    - id: 4
      name: apiary_name
      label: Apiary Name
      hint: Name of your beekeeping operation
      type: text
      options: []
      required: true
    - id: 5
      name: apiary_address
      label: Apiary Address
      hint: Full address of apiary location
      type: text
      options: []
      required: true
    - id: 6
      name: declaration_date
      label: Declaration Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 7
      name: total_hives
      label: Total Number of Hives
      hint: Total hives at this location
      type: number
      options: []
      required: true
    - id: 8
      name: hive_types
      label: Hive Types
      hint: Select all hive types used
      type: select_multiple
      options:
      - Langstroth
      - Top Bar
      - Warre
      - Horizontal
      - Combination
      - Other
      required: true
    - id: 9
      name: hive_ids
      label: Hive ID Numbers
      hint: List all hive identification numbers
      type: text
      options: []
      required: true
    - id: 10
      name: queen_source
      label: Queen Source
      hint: Where did you get your queens
      type: select_one
      options:
      - Self-Bred
      - Local Breeder
      - Commercial Supplier
      - Unknown
      - Mixed Sources
      required: true
    - id: 11
      name: bee_breed
      label: Bee Breed or Strain
      hint: Primary breed of bees
      type: select_one
      options:
      - Italian
      - Carniolan
      - Russian
      - Buckfast
      - Caucasian
      - Minnesota Hygienic
      - Mixed
      - Unknown
      required: true
    - id: 12
      name: hive_condition
      label: Overall Hive Condition
      hint: Current condition of hives
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Critical
      required: true
    - id: 13
      name: issues_detected
      label: Issues Detected
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Varroa Mites
      - Small Hive Beetles
      - Wax Moths
      - Nosema
      - Chalkbrood
      - American Foulbrood
      - European Foulbrood
      - Queenless Colonies
      - Low Population
      - Robbing Behavior
      required: true
    - id: 14
      name: treatment_applied
      label: Treatments Applied
      hint: Select all treatments used
      type: select_multiple
      options:
      - None
      - Oxalic Acid
      - Formic Acid
      - Thymol
      - Coumaphos
      - Fluvalinate
      - Hop Guard
      - ApiLife VAR
      - Other
      required: true
    - id: 15
      name: last_inspection_date
      label: Last Inspection Date
      hint: When was the last hive inspection
      type: date
      options: []
      required: true
    - id: 16
      name: honey_production
      label: Honey Production This Season
      hint: Total honey produced in pounds
      type: number
      options: []
      required: false
    - id: 17
      name: wax_production
      label: Wax Production This Season
      hint: Total wax produced in pounds
      type: number
      options: []
      required: false
    - id: 18
      name: forage_available
      label: Forage Availability
      hint: Quality of forage in the area
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Unknown
      required: true
    - id: 19
      name: water_source
      label: Water Source Available
      hint: Is water available for bees
      type: select_one
      options:
      - Yes on-site
      - Yes nearby
      - false
      - Unsure
      required: true
    - id: 20
      name: winter_prep_status
      label: Winter Preparation Status
      hint: How prepared are hives for winter
      type: select_one
      options:
      - Fully Prepared
      - Partially Prepared
      - Not Started
      - Not Applicable
      required: true
    - id: 21
      name: registration_fee
      label: Registration Fee Paid
      hint: Has the fee been paid
      type: select_one
      options:
      - true
      - false
      - Waived
      required: true
    - id: 22
      name: association_member
      label: Beekeeping Association Member
      hint: Are you a member of a beekeeping association
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 23
      name: additional_notes
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
