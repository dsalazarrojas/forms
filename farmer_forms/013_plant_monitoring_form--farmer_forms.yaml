inputSchema:
  type: object
  properties:
    title: Plant Monitoring Form
    pages:
    - id: 1
      name: monitor_plant_type
      label: What type of plant is being monitored?
      hint: Please select a plant type
      type: select_one
      options:
      - Crop
      - Flower
      - Tree
      - Shrub
      - Other (please specify)
      required: true
    - id: 2
      name: monitor_plant_location
      label: Location of the monitored plant
      hint: Please select the plant location
      type: select_one
      options:
      - Field
      - Greenhouse
      - Indoor
      - Other (please specify)
      required: true
    - id: 3
      name: monitor_temperature_celsius
      label: Current temperature of the plant (in Celsius)
      hint: Please enter the temperature
      type: number
      options: []
      required: true
    - id: 4
      name: monitor_temperature_fahrenheit
      label: Current temperature of the plant (in Fahrenheit)
      hint: Please enter the temperature
      type: number
      options: []
      required: true
    - id: 5
      name: monitor_moisture
      label: Current moisture level of the plant (in percentage)
      hint: Please enter the moisture level
      type: number
      options: []
      required: true
    - id: 6
      name: monitor_disease_pests
      label: Has the plant shown any signs of disease or pests?
      hint: Please select Yes or No
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: monitor_watering_frequency
      label: How often is the plant watered?
      hint: Please select the frequency
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Other (please specify)
      required: true
    - id: 8
      name: monitor_rainwater_collected
      label: How much rainwater is collected from the plant?
      hint: Please enter the amount
      type: number
      options: []
      required: false
    - id: 9
      name: monitor_fertilization
      label: Has the plant been fertilized recently?
      hint: Please select Yes or No
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: monitor_fertilizer_type
      label: What type of fertilizer was used?
      hint: Please select the type of fertilizer
      type: select_one
      options:
      - Organic
      - Inorganic
      - Other (please specify)
      required: false
    - id: 11
      name: monitor_growth_stage
      label: What is the current growth stage of the plant?
      hint: Please select a growth stage
      type: select_one
      options:
      - Seedling
      - Sprouting
      - Mature
      - Other (please specify)
      required: false
    - id: 12
      name: monitor_additional_info
      label: Additional information about the plant
      hint: Please provide any additional information
      type: text
      options: []
      required: false
    - id: 13
      name: monitor_date
      label: Date of last monitoring
      hint: Please enter the date
      type: date
      options: []
      required: true
    - id: 14
      name: monitor_plant_status
      label: What is the current status of the plant?
      hint: Please select a status
      type: select_one
      options:
      - Healthy
      - Diseased
      - Damaged
      - Other (please specify)
      required: false
    - id: 15
      name: monitor_notes
      label: Notes
      hint: Please provide any additional notes
      type: text
      options: []
      required: false
