inputSchema:
  type: object
  properties:
    title: Coaching Relationship Expectations Survey
    pages:
    - id: 1
      name: section_participant_info
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: coach_name
      label: Coach Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: coaching_start_date
      label: Coaching Relationship Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: section_goals_expectations
      label: -- Goals and Expectations --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: coaching_goals
      label: What are your primary coaching goals?
      hint: Describe what you want to achieve
      type: text
      options: []
      required: true
    - id: 7
      name: success_definition
      label: How will you define success in coaching?
      hint: What does success look like to you?
      type: text
      options: []
      required: true
    - id: 8
      name: expected_timeline
      label: Expected Timeline for Goal Achievement
      hint: null
      type: select_one
      options:
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - 2+ years
      - Ongoing
      required: true
    - id: 9
      name: section_relationship_style
      label: -- Coaching Relationship Style --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: preferred_coaching_style
      label: Preferred Coaching Style
      hint: null
      type: select_one
      options:
      - Direct and directive
      - Collaborative and partnership-based
      - Supportive and nurturing
      - Challenging and growth-focused
      - Mixed approach
      required: true
    - id: 11
      name: communication_frequency
      label: Preferred Communication Frequency
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-weekly
      - Monthly
      - As needed
      - Flexible
      required: true
    - id: 12
      name: communication_methods
      label: Preferred Communication Methods
      hint: Select all that apply
      type: select_multiple
      options:
      - In-person meetings
      - Phone calls
      - Email
      - Text messaging
      - Video calls
      - Voice messages
      required: false
    - id: 13
      name: section_feedback
      label: -- Feedback Expectations --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: feedback_preference
      label: How do you prefer to receive feedback?
      hint: Direct, gentle, written, verbal?
      type: text
      options: []
      required: true
    - id: 15
      name: accountability_level
      label: Desired Level of Accountability
      hint: null
      type: select_one
      options:
      - High accountability
      - Moderate accountability
      - Light accountability
      - Coach-directed
      required: true
    - id: 16
      name: section_concerns
      label: -- Concerns and Boundaries --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: specific_concerns
      label: Any Specific Concerns or Worries?
      hint: What concerns do you have about coaching?
      type: text
      options: []
      required: false
    - id: 18
      name: personal_boundaries
      label: Personal Boundaries and Limits
      hint: What should the coach know?
      type: text
      options: []
      required: false
    - id: 19
      name: section_commitment
      label: -- Commitment Level --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: time_commitment
      label: Time Available for Coaching
      hint: Hours per week
      type: number
      options: []
      required: true
    - id: 21
      name: financial_commitment
      label: I am committed to investing in this coaching relationship
      hint: null
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      required: true
    - id: 22
      name: survey_date
      label: Survey Date
      hint: null
      type: date
      options: []
      required: true
