inputSchema:
  type: object
  properties:
    title: Coaching Center License Form
    pages:
    - id: 1
      name: center_name
      label: Coaching Center Name
      hint: Official name of your coaching center
      type: text
      options: []
      required: true
    - id: 2
      name: business_address
      label: Business Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 3
      name: city
      label: City
      hint: City location
      type: text
      options: []
      required: true
    - id: 4
      name: state_province
      label: State or Province
      hint: State or province
      type: text
      options: []
      required: true
    - id: 5
      name: zip_postal_code
      label: ZIP or Postal Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 6
      name: country
      label: Country
      hint: Country of operation
      type: text
      options: []
      required: true
    - id: 7
      name: owner_name
      label: Owner or Director Name
      hint: Full name of owner or director
      type: text
      options: []
      required: true
    - id: 8
      name: owner_email
      label: Owner Email
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 9
      name: owner_phone
      label: Owner Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 10
      name: business_structure
      label: Business Structure
      hint: Type of business entity
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - Limited Liability Company LLC
      - Corporation
      - Non-Profit
      - Other
      required: true
    - id: 11
      name: business_registration_number
      label: Business Registration Number
      hint: Your official business ID
      type: text
      options: []
      required: true
    - id: 12
      name: tax_id_number
      label: Tax ID Number
      hint: Your tax identification number
      type: text
      options: []
      required: true
    - id: 13
      name: license_type_requested
      label: License Type Requested
      hint: What type of license do you need
      type: select_one
      options:
      - General Coaching License
      - Sports Coaching License
      - Life Coaching License
      - Business Coaching License
      - Health and Wellness License
      - Comprehensive License
      required: true
    - id: 14
      name: services_offered
      label: Services Offered
      hint: Select all services you provide
      type: select_multiple
      options:
      - Individual Coaching
      - Group Coaching
      - Team Coaching
      - Online Coaching
      - Workshop and Training
      - Assessment Services
      - Consulting
      required: true
    - id: 15
      name: number_of_coaches
      label: Number of Employed Coaches
      hint: How many coaches work at your center
      type: select_one
      options:
      - 1-5
      - 6-10
      - 11-20
      - 21-50
      - Over 50
      required: true
    - id: 16
      name: coach_certification_requirement
      label: Do You Require Coach Certifications
      hint: Must your coaches be certified
      type: select_one
      options:
      - Yes All Coaches
      - Yes Some Coaches
      - false
      required: true
    - id: 17
      name: facility_type
      label: Facility Type
      hint: What type of facility do you operate
      type: select_one
      options:
      - Office Building
      - Sports Facility
      - Community Center
      - Home-Based
      - Virtual Only
      - Mixed Use
      required: true
    - id: 18
      name: facility_square_footage
      label: Facility Square Footage
      hint: Approximate size of your facility
      type: select_one
      options:
      - Under 500 sq ft
      - 500-1000 sq ft
      - 1001-2500 sq ft
      - 2501-5000 sq ft
      - Over 5000 sq ft
      required: false
    - id: 19
      name: liability_insurance
      label: Liability Insurance Coverage
      hint: Do you have liability insurance
      type: select_one
      options:
      - Yes Current Policy
      - Yes Pending
      - false
      required: true
    - id: 20
      name: insurance_provider
      label: Insurance Provider
      hint: Name of your insurance company
      type: text
      options: []
      required: false
    - id: 21
      name: insurance_policy_amount
      label: Coverage Amount
      hint: Total coverage amount
      type: select_one
      options:
      - Under $500000
      - $500000-$1 Million
      - $1-$2 Million
      - Over $2 Million
      required: false
    - id: 22
      name: safety_protocols
      label: Safety Protocols in Place
      hint: Do you have written safety protocols
      type: select_one
      options:
      - Yes Comprehensive
      - Yes Basic
      - false
      required: true
    - id: 23
      name: emergency_procedures
      label: Emergency Procedures Documented
      hint: Do you have emergency procedures
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 24
      name: years_in_operation
      label: Years in Operation
      hint: How long has your center operated
      type: select_one
      options:
      - New Business
      - Less than 1 Year
      - 1-3 Years
      - 3-5 Years
      - Over 5 Years
      required: true
    - id: 25
      name: previous_licenses
      label: Have You Held a License Before
      hint: Previous coaching license history
      type: select_one
      options:
      - Yes Current
      - Yes Expired
      - false
      required: true
    - id: 26
      name: license_violations
      label: Any Previous License Violations
      hint: Any past violations or sanctions
      type: select_one
      options:
      - false
      - Yes Please Explain
      required: true
    - id: 27
      name: violation_details
      label: Violation Details
      hint: Provide details if applicable
      type: text
      options: []
      required: false
    - id: 28
      name: continuing_education_program
      label: Do You Offer Continuing Education
      hint: Do you provide training for coaches
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 29
      name: application_fee_paid
      label: Application Fee Paid
      hint: Have you paid the application fee
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 30
      name: terms_and_conditions
      label: I Accept Terms and Conditions
      hint: You agree to licensing terms
      type: select_one
      options:
      - Yes I Accept
      - false
      required: true
    - id: 31
      name: signature_date
      label: Application Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 32
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
