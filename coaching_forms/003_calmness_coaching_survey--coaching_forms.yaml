inputSchema:
  type: object
  properties:
    title: Calmness Coaching Survey
    pages:
      - id: 1
        name: participant_name
        label: Participant Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: email
        label: Email Address
        hint: Contact email
        type: email
        options: []
        required: true
      - id: 3
        name: age_range
        label: Age Range
        hint: Select your age range
        type: select_one
        options:
          - Under 18
          - 18-24
          - 25-34
          - 35-44
          - 45-54
          - 55-64
          - 65 or older
        required: false
      - id: 4
        name: current_stress_level
        label: Current Stress Level
        hint: Rate your stress level right now from 1 to 10
        type: select_one
        options:
          - 1 - No stress
          - 2 - Very low stress
          - 3 - Low stress
          - 4 - Mild stress
          - 5 - Moderate stress
          - 6 - Elevated stress
          - 7 - High stress
          - 8 - Very high stress
          - 9 - Extreme stress
          - 10 - Overwhelming stress
        required: true
      - id: 5
        name: calmness_goal
        label: What is your primary calmness goal
        hint: What do you want to achieve
        type: select_one
        options:
          - Reduce daily stress
          - Improve sleep quality
          - Manage anxiety
          - Develop mindfulness practice
          - Better work-life balance
          - Emotional regulation
          - Build resilience
          - Other
        required: true
      - id: 6
        name: stress_sources
        label: What are your main sources of stress
        hint: Select all that apply
        type: select_multiple
        options:
          - Work or career
          - Family responsibilities
          - Financial concerns
          - Health issues
          - Relationships
          - Time management
          - Major life changes
          - Uncertainty about future
          - Other
        required: true
      - id: 7
        name: current_coping_strategies
        label: What coping strategies do you currently use
        hint: Select all that apply
        type: select_multiple
        options:
          - Exercise or physical activity
          - Meditation or mindfulness
          - Deep breathing exercises
          - Talking to friends or family
          - Journaling
          - Reading
          - Listening to music
          - Professional therapy
          - None currently
          - Other
        required: true
      - id: 8
        name: meditation_experience
        label: Do you have experience with meditation
        hint: Select your experience level
        type: select_one
        options:
          - Never tried
          - Beginner - less than 6 months
          - Intermediate - 6 months to 2 years
          - Advanced - over 2 years
        required: true
      - id: 9
        name: coaching_preference
        label: Preferred coaching format
        hint: How would you like to receive coaching
        type: select_one
        options:
          - One-on-one sessions
          - Group coaching
          - Self-paced program
          - Mobile app based
          - Combination of formats
        required: true
      - id: 10
        name: session_frequency
        label: How often would you like coaching sessions
        hint: Select preferred frequency
        type: select_one
        options:
          - Daily
          - 2-3 times per week
          - Weekly
          - Bi-weekly
          - Monthly
          - As needed
        required: false
      - id: 11
        name: time_availability
        label: What time of day works best for you
        hint: Select all that apply
        type: select_multiple
        options:
          - Early morning (5am-8am)
          - Morning (8am-12pm)
          - Afternoon (12pm-5pm)
          - Evening (5pm-9pm)
          - Night (9pm-5am)
        required: false
      - id: 12
        name: previous_coaching
        label: Have you worked with a calmness or wellness coach before
        hint: Yes or no
        type: select_one
        options:
          - Yes - currently working with one
          - Yes - in the past
          - No - first time
        required: true
      - id: 13
        name: motivation_level
        label: How motivated are you to achieve calmness
        hint: Rate your motivation
        type: select_one
        options:
          - Not motivated
          - Slightly motivated
          - Moderately motivated
          - Very motivated
          - Extremely motivated
        required: true
      - id: 14
        name: support_system
        label: Do you have a support system at home
        hint: Family or friends who support your wellness goals
        type: select_one
        options:
          - Yes - strong support
          - Somewhat supportive
          - Limited support
          - No support system
        required: false
      - id: 15
        name: health_conditions
        label: Do you have any health conditions we should know about
        hint: Select all that apply
        type: select_multiple
        options:
          - Anxiety disorder
          - Depression
          - PTSD
          - Chronic pain
          - Sleep disorders
          - Heart conditions
          - None
          - Prefer not to say
          - Other
        required: false
      - id: 16
        name: expectations
        label: What are your expectations from this coaching program
        hint: Describe your expectations
        type: text
        options: []
        required: false
      - id: 17
        name: additional_comments
        label: Additional Comments
        hint: Anything else you would like to share
        type: text
        options: []
        required: false
