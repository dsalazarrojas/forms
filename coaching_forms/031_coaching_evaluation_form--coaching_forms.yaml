inputSchema:
  type: object
  properties:
    title: Coaching Evaluation Form
    pages:
      - id: 1
        name: client_name
        label: Client Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: client_email
        label: Email Address
        hint: Contact email address
        type: email
        options: []
        required: true
      - id: 3
        name: coach_name
        label: Coach Name
        hint: Name of your coach
        type: text
        options: []
        required: true
      - id: 4
        name: evaluation_date
        label: Evaluation Date
        hint: Date of this evaluation
        type: date
        options: []
        required: true
      - id: 5
        name: coaching_duration
        label: How Long Have You Been Receiving Coaching
        hint: Duration of coaching relationship
        type: select_one
        options:
          - Less than 1 month
          - 1-3 months
          - 3-6 months
          - 6-12 months
          - Over 1 year
        required: true
      - id: 6
        name: number_of_sessions
        label: Approximate Number of Sessions
        hint: How many sessions have you had
        type: select_one
        options:
          - 1-3 sessions
          - 4-6 sessions
          - 7-10 sessions
          - 11-20 sessions
          - Over 20 sessions
        required: true
      - id: 7
        name: overall_satisfaction
        label: Overall Satisfaction with Coaching
        hint: Rate your overall experience
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 8
        name: coach_expertise_rating
        label: Coach Expertise Rating
        hint: Rate your coach knowledge
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: coach_communication_rating
        label: Coach Communication Rating
        hint: Rate communication effectiveness
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: coach_support_rating
        label: Coach Support Rating
        hint: Rate level of support received
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 11
        name: goal_progress_rating
        label: Progress Toward Goals
        hint: How much progress have you made
        type: select_one
        options:
          - Significant Progress
          - Moderate Progress
          - Some Progress
          - Little Progress
          - No Progress
        required: true
      - id: 12
        name: session_value_rating
        label: Value of Sessions
        hint: How valuable were the sessions
        type: select_one
        options:
          - Extremely Valuable
          - Very Valuable
          - Somewhat Valuable
          - Not Very Valuable
          - Not Valuable At All
        required: true
      - id: 13
        name: coach_strengths
        label: What Are Your Coach Greatest Strengths
        hint: Describe what your coach does well
        type: text
        options: []
        required: true
      - id: 14
        name: coach_areas_for_improvement
        label: What Could Your Coach Improve
        hint: Suggestions for improvement
        type: text
        options: []
        required: false
      - id: 15
        name: most_helpful_aspect
        label: Most Helpful Aspect of Coaching
        hint: What helped you the most
        type: text
        options: []
        required: true
      - id: 16
        name: least_helpful_aspect
        label: Least Helpful Aspect of Coaching
        hint: What was least useful
        type: text
        options: []
        required: false
      - id: 17
        name: techniques_used
        label: Coaching Techniques That Worked Well
        hint: Which techniques were effective
        type: text
        options: []
        required: false
      - id: 18
        name: would_recommend_coach
        label: Would You Recommend This Coach
        hint: Would you refer others
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 19
        name: would_continue_coaching
        label: Would You Continue Coaching
        hint: Will you keep working with this coach
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 20
        name: coaching_impact
        label: How Has Coaching Impacted You
        hint: Describe the impact on your life
        type: text
        options: []
        required: true
      - id: 21
        name: goals_achieved
        label: Which Goals Have You Achieved
        hint: List accomplishments
        type: text
        options: []
        required: false
      - id: 22
        name: ongoing_goals
        label: What Goals Are You Still Working On
        hint: Describe ongoing objectives
        type: text
        options: []
        required: false
      - id: 23
        name: additional_support_needed
        label: What Additional Support Do You Need
        hint: What else would help you
        type: text
        options: []
        required: false
      - id: 24
        name: testimonial_permission
        label: Can We Use Your Feedback as Testimonial
        hint: May we share your comments
        type: select_one
        options:
          - Yes Use My Name
          - Yes Anonymously
          - No Do Not Share
        required: false
      - id: 25
        name: additional_comments
        label: Additional Comments
        hint: Anything else to share
        type: text
        options: []
        required: false
