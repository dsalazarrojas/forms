inputSchema:
  type: object
  properties:
    title: Mobility Coaching Experience Survey
    pages:
    - id: 1
      name: client_satisfaction
      label: What was your satisfaction with this session
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 2
      name: session_quality
      label: How would you rate the session quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: session_length
      label: How long was the session
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: mobility_exp
      label: What is your mobility experience
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: client_sentiment
      label: How did you feel during the session
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: coach_performance
      label: How would you rate the coach performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
