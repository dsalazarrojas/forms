inputSchema:
  type: object
  properties:
    title: Manager Feedback Coaching Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 4
      name: select_one_manager_feedback
      label: What would you like to do?
      hint: null
      type: select_one
      options:
      - Manager 1
      - Manager 2
      - Manager 3
      required: false
    - id: 5
      name: select_multiple_managers
      label: Select multiple managers
      hint: null
      type: select_multiple
      options:
      - Manager 1
      - Manager 2
      - Manager 3
      required: false
    - id: 6
      name: note
      label: Note to self
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: select_one_coaching_type
      label: Coaching type
      hint: null
      type: select_one
      options:
      - Type 1
      - Type 2
      - Type 3
      required: false
    - id: 10
      name: select_multiple_coaching_types
      label: Select multiple coaching types
      hint: null
      type: select_multiple
      options:
      - Type 1
      - Type 2
      - Type 3
      required: false
