inputSchema:
  type: object
  properties:
    title: leadership-coaching-leave-form
    pages:
    - id: 1
      name: coaching_session
      label: Coaching Session
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      required: true
    - id: 2
      name: start_date
      label: start date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: end_date
      label: end date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: coaching_type
      label: coaching type
      hint: null
      type: select_one
      options:
      - Individual
      - Group
      required: true
    - id: 5
      name: coaching_relationship
      label: coaching relationship
      hint: null
      type: select_one
      options:
      - manager
      - peer
      required: true
    - id: 6
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: reason_for_leaving
      label: Reason for leaving
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: manager_ok
      label: Manager OK
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
