inputSchema:
  type: object
  properties:
    title: Beauty Business Mentorship Registration Form
    pages:
    - id: 1
      name: applicant_header
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: location
      label: Business Location
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: business_header
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: business_name
      label: Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: business_type
      label: Business Type
      hint: null
      type: select_one
      options:
      - Salon
      - Spa
      - Esthetics Studio
      - Freelance Artist
      - Online Store
      - Coaching Service
      - Other
      required: true
    - id: 10
      name: years_in_business
      label: Years in Business
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: annual_revenue
      label: Approximate Annual Revenue
      hint: null
