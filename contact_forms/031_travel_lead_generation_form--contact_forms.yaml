      name: membership_type
      label: Membership Type
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: membership_terms
      label: Membership Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: membership_status
      label: Membership Status
      hint: null
      type: select_one
      options:
      - '{1: ''Active''}'
      - '{2: ''Inactive''}'
      required: true
    - id: 14
      name: travel_agency
      label: Travel Agency
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: travel_agency_address
      label: Travel Agency Address
      hint: null
      type: text
      options: []
