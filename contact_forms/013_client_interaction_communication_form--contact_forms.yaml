inputSchema:
  type: object
  properties:
    title: Client Interaction Communication Form
    pages:
    - id: 1
      name: staff_name
      label: Staff Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: interaction_date
      label: Date of Interaction
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: interaction_method
      label: Interaction Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - In-Person
      - Video Call
      - Chat
      required: true
    - id: 5
      name: section_details
      label: -- Communication Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: interaction_subject
      label: Subject of Interaction
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: discussion_summary
      label: Summary of Discussion
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: action_items
      label: Key Action Items Identified
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: client_sentiment
      label: Observed Client Sentiment
      hint: null
      type: select_one
      options:
      - Very Positive
      - Positive
      - Neutral
      - Negative
      - Very Negative
      required: false
    - id: 10
      name: section_followup
      label: -- Follow-Up --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: followup_required
      label: Is follow-up required?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: followup_task
      label: Assigned Follow-up Task
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: followup_deadline
      label: Follow-up Deadline
      hint: null
      type: date
      options: []
      required: false
