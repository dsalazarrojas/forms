inputSchema:
  type: object
  properties:
    title: Agent Submission Form
    pages:
    - id: 1
      name: header
      label: -- Agent Submission and Contact --
      hint: professional submission of agent credentials and contact information
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: professional_title
      label: Professional Title
      hint: e.g., Senior Broker, Sales Associate
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: brokerage_header
      label: -- Brokerage Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: broker_name
      label: Broker Name
      hint: name of the managing broker or firm
      type: text
      options: []
      required: true
    - id: 8
      name: broker_address
      label: Broker Office Address
      hint: street, Suite, City, ZIP
      type: text
      options: []
      required: true
    - id: 9
      name: comm_channel
      label: Preferred Communication Channel
      hint: how should we reach you
      type: select_one
      options:
      - Email
      - Phone Call
      - SMS / Text
      - In-person Visit
      required: true
    - id: 10
      name: submission_message
      label: Brief Message or Reason for Submission
      hint: why are you contacting us today
      type: text
      options: []
      required: false
    - id: 11
      name: license_check
      label: Are you a licensed professional?
      hint: null
      type: select_one
      options:
      - Yes, currently active
      - Yes, but inactive
      - 'False'
      required: true
    - id: 12
      name: license_number
      label: License Number - if applicable
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
