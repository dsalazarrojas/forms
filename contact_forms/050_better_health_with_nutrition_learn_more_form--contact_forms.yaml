inputSchema:
  type: object
  properties:
    title: Better Health With Nutrition Learn More Form
    pages:
    - id: 1
      name: personal_info_header
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_full_name
      label: Your Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: visitor_email_addr
      label: Your Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: visitor_phone_number
      label: Your Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: contact_time_preference
      label: Best Time to Contact
      hint: When are you most likely to be available
      type: select_one
      options:
      - Morning (8 AM - 12 PM)
      - Afternoon (12 PM - 5 PM)
      - Evening (5 PM - 8 PM)
      - Anytime - I am flexible
      required: true
    - id: 6
      name: nutrition_interests_header
      label: -- Health and Nutrition Interests --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: primary_health_goals
      label: What are your primary health goals
      hint: Select all that apply
      type: select_multiple
      options:
      - Weight Management
      - Muscle Gain and Athleticism
      - Increased Energy Levels
      - Improved Digestion
      - Immune System Support
      - Heart Health and Longevity
      - Other
      required: true
    - id: 8
      name: dietary_preferences_select
      label: Any specific dietary preferences
      hint: Select your current or desired diet
      type: select_multiple
      options:
      - Vegan or Plant-based
      - Vegetarian
      - Ketogenic (Keto)
      - Paleo
      - Gluten-Free
      - No specific preference
      - Other
      required: true
    - id: 9
      name: plan_interest_status
      label: Are you interested in a personal nutrition plan
      hint: Tailored specifically to your needs
      type: select_one
      options:
      - Yes - absolutely
      - Maybe - tell me more
      - No - just looking for info
      required: true
    - id: 10
      name: products_services_header
      label: -- Products and Services Inquiry --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: inquiry_interests_selection
      label: Which products or services would you like to learn more about
      hint: Select all of interest
      type: select_multiple
      options:
      - Nutritional Supplements
      - Personalized Meal Plans
      - One-on-One Nutritional Coaching
      - Corporate Wellness Workshops
      - Detox and Cleanse Programs
      - Other
      required: true
    - id: 12
      name: referral_source_desc
      label: How did you hear about our nutrition program
      hint: Friend, Social Media, Search, etc.
      type: text
      options: []
      required: false
    - id: 13
      name: health_conditions_disclosure
      label: Any existing health conditions we should be aware of
      hint: Helps us provide safe and accurate information
      type: text
      options: []
      required: false
    - id: 14
      name: final_details_header
      label: -- Final Details and Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: nutritionist_questions_text
      label: Any specific questions for our nutritionists
      hint: What would you like to ask during our first talk
      type: text
      options: []
      required: false
    - id: 16
      name: update_consent_status
      label: Consent to receive health and nutrition updates
      hint: Periodic tips and product info
      type: select_one
      options:
      - Yes - sign me up
      - No - thank you
      required: true
    - id: 17
      name: inquiry_final_date_stamp
      label: Date of Inquiry
      hint: null
      type: date
      options: []
      required: true
