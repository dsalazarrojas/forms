inputSchema:
  type: object
  properties:
    title: Package Consultation Request Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: client_phone
      label: Client Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: provider_services
      label: Provider Services
      hint: null
      type: select_multiple
      options:
      - Consultation
      - Package Selection
      - Other
      required: true
    - id: 5
      name: appointment_date
      label: Apppointment Date
      hint: MM/dd/yyyy
      type: date
      options: []
      required: false
    - id: 6
      name: appointment_time
      label: Apppointment Time
      hint: "hh:mm AM/PM"
      type: time
      options: []
      required: false
    - id: 7
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
