inputSchema:
  type: object
  properties:
    title: Contact Form With Box Shadows
    pages:
    - id: 1
      name: section_user_details
      label: -- User Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: user_full_name
      label: Your Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: user_email
      label: Your Email
      hint: Primary email for contact
      type: email
      options: []
      required: true
    - id: 4
      name: user_phone
      label: Your Phone Number
      hint: Mobile or home phone
      type: text
      options: []
      required: false
    - id: 5
      name: section_shadow_inquiry
      label: -- Shadow Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: inquiry_subject
      label: Inquiry Subject
      hint: Provide a brief summary
      type: text
      options: []
      required: true
    - id: 7
      name: detailed_message
      label: Your Message
      hint: Please provide more information
      type: text
      options: []
      required: true
    - id: 8
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we reach you?
      type: select_one
      options:
      - Email
      - Phone Call
      required: true
    - id: 9
      name: submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
