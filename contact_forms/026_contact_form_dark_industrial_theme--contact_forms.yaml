        type: select_one
        options:
          - Engineer
          - Plant Manager
          - Procurement Specialist
          - Maintenance Technician
          - Executive/Owner
          - Other
        required: true
      - id: 6
        name: section_industrial_interests
        label: -- Industrial Interests --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: sectors_of_interest
