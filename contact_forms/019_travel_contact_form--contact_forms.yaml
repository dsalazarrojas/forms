inputSchema:
  type: object
  properties:
    title: Travel Contact Form
    pages:
    - id: 1
      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: travel_info
      label: Travel Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: home_info
      label: Home-Info
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
