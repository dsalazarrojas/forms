      name: travel_arrangement
      label: Travel Arrangement
      hint: null
      type: select_one
      options:
      - Air
      - Train
      - Bus
      required: false
    - id: 6
      name: hotel
      label: Hotel
      hint: null
      type: select_one
      options:
      - Hotel
      - Resort
      - Hostel
      required: false
    - id: 7
      name: flight
      label: Flight
      hint: null
      type: select_one
      options:
