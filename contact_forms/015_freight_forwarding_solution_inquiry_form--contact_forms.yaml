inputSchema:
  type: object
  properties:
    title: ประก Freight Forwarding Solution Inquiry Form
    pages:
    - id: 1
      name: origin_city
      label: Origin City
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: destination_city
      label: Destination City
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: freight_type
      label: Freight Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: delivery_timeframe
      label: Delivery Timeframe
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 5
      name: shipping_rate
      label: Shipping Rate
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: service_option
      label: Service Option
      hint: Please select one or more of the services below.
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_email
      label: Contact E-mail
      hint: Please enter a valid E-mail address.
      type: email
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact Phone
      hint: Please enter a valid phone number.
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_user
      label: Assigned User
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submitted
      label: Submitter
      hint: null
      type: text
      options: []
      required: false
