inputSchema:
  type: object
  properties:
    title: Sponsorship Collection Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: sponsor_type
      label: Sponsor Type
      hint: null
      type: select_multiple
      options:
      - Sponsor
      - Investor
      - Donor
      required: false
    - id: 5
      name: sponsor_level
      label: Sponsor Level
      hint: null
      type: select_one
      options:
      - Bronze
      - Silver
      - Gold
      required: false
    - id: 6
      name: sponsor_amount
      label: Sponsor Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Mail
      required: false
