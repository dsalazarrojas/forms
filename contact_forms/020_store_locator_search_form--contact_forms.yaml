inputSchema:
  type: object
  properties:
    title: store_locator_search_form
    pages:
    - id: 1
      name: search_preferences
      label: Search Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: search_preferences_store
      label: Store Location
      hint: null
      type: select_one
      options:
      - store
      - mall
      - strip
      - market
      required: false
    - id: 3
      name: location_type
      label: Location Type
      hint: Where do you want to visit?
      type: select_multiple
      options:
      - nearby
      - within walking distance
      - within driving distance
      required: false
    - id: 4
      name: zip_code
      label: Zip Code
      hint: Zip Code
      type: text
      options: []
      required: false
    - id: 5
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: false
    - id: 6
      name: state
      label: State
      hint: State
      type: text
      options: []
      required: false
    - id: 7
      name: country
      label: Country
      hint: Country
      type: text
      options: []
      required: false
    - id: 8
      name: phone_number
      label: Phone Number
      hint: Phone Number
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: Email
      type: email
      options: []
      required: false
