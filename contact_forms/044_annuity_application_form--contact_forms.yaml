inputSchema:
  type: object
  properties:
    title: Annuity Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Full Legal Name
      hint: First, middle, and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: Month/Day/Year
      type: date
      options: []
      required: true
    - id: 3
      name: social_security
      label: Social Security Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: true
    - id: 5
      name: marital_status
      label: Marital Status
      hint: null
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      - Domestic partnership
      required: true
    - id: 6
      name: spouse_name
      label: Spouse Name
      hint: If married
      type: text
      options: []
      required: false
    - id: 7
      name: home_address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: occupation
      label: Current Occupation
      hint: Job title
      type: text
      options: []
      required: false
    - id: 14
      name: annuity_type
      label: Type of Annuity Requested
      hint: null
      type: select_one
      options:
      - Fixed annuity
      - Variable annuity
      - Indexed annuity
      - Immediate annuity
      - Deferred annuity
      - Unsure - need guidance
      required: true
    - id: 15
      name: premium_amount
      label: Initial Premium Amount
      hint: Lump sum to invest
      type: number
      options: []
      required: true
    - id: 16
      name: premium_source
      label: Source of Premium Funds
      hint: null
      type: select_one
      options:
      - Personal savings
      - IRA rollover
      - 401(k) rollover
      - Pension distribution
      - Life insurance settlement
      - Other
      required: true
    - id: 17
      name: investment_objective
      label: Investment Objective
      hint: null
      type: select_one
      options:
      - Retirement income
      - Legacy planning
      - Tax deferral
      - Wealth accumulation
      - Risk management
      required: true
    - id: 18
      name: income_start_date
      label: Desired Income Start Date
      hint: When you want to begin receiving payments
      type: date
      options: []
      required: true
    - id: 19
      name: payment_option
      label: Preferred Payment Option
      hint: null
      type: select_one
      options:
      - Life annuity - income for life
      - Joint and survivor annuity
      - Fixed period annuity
      - Flexible withdrawal option
      - Unsure
      required: true
    - id: 20
      name: beneficiary_name
      label: Primary Beneficiary Name
      hint: Who receives benefits if you pass away
      type: text
      options: []
      required: true
    - id: 21
      name: beneficiary_relationship
      label: Beneficiary Relationship
      hint: Spouse, child, etc.
      type: text
      options: []
      required: false
    - id: 22
      name: health_status
      label: Health Status
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Prefer not to answer
      required: false
    - id: 23
      name: tobacco_use
      label: Do you use tobacco products
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Former user
      required: true
    - id: 24
      name: financial_advisor
      label: Are you working with a financial advisor
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: false
    - id: 25
      name: advisor_name
      label: Advisor Name
      hint: If applicable
      type: text
      options: []
      required: false
