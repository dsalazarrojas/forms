inputSchema:
  type: object
  properties:
    title: Anonymous Contact Form
    pages:
    - id: 1
      name: message_subject
      label: Subject of Inquiry
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: department_target
      label: Which department is this for?
      hint: null
      type: select_one
      options:
      - General Inquiry
      - Support
      - Billing
      - Management
      - Ethics Committee
      required: true
    - id: 3
      name: feedback_type
      label: Type of Submission
      hint: null
      type: select_one
      options:
      - Question
      - Suggestion
      - Complaint
      - Compliment
      - Other
      required: true
    - id: 4
      name: detailed_message
      label: Your Message
      hint: Please provide as much detail as possible while maintaining your anonymity
      type: text
      options: []
      required: true
    - id: 5
      name: priority_level
      label: Priority Level
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Urgent
      required: false
    - id: 6
      name: date_of_incident
      label: Date of Incident or Inquiry (if applicable)
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: location_relevance
      label: Location or Branch Related to Message
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: attachment_desc
      label: Description of any evidence or documents available
      hint: Do not include names in the description
      type: text
      options: []
      required: false
    - id: 9
      name: response_required
      label: Do you require a response?
      hint: Note - Without contact info, we cannot respond directly
      type: select_one
      options:
      - Yes (I will check back later)
      - No (For information only)
      required: true
    - id: 10
      name: how_did_you_hear
      label: How did you hear about this reporting channel?
      hint: null
      type: text
      options: []
      required: false
