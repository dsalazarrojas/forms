inputSchema:
  type: object
  properties:
    title: Contact Form With Fancy Header And Footer
    pages:
    - id: 1
      name: section_visitor_info
      label: -- Visitor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_full_name
      label: Your Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: visitor_email_address
      label: Your Email Address
      hint: Primary email for contact
      type: email
      options: []
      required: true
    - id: 4
      name: visitor_phone_number
      label: Your Phone Number
      hint: Mobile or home phone
      type: text
      options: []
      required: false
    - id: 5
      name: visitor_website_url
      label: Your Website URL
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 6
      name: section_inquiry_details
      label: -- Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: inquiry_subject
      label: Subject
      hint: Provide a brief summary
      type: text
      options: []
      required: true
    - id: 8
      name: detailed_message
      label: Your Detailed Message
      hint: Please provide more information
      type: text
      options: []
      required: true
    - id: 9
      name: section_footer_feedback
      label: -- Final Thoughts --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: overall_rating_of_website
      label: Overall Rating of Our Website
      hint: How are we doing?
      type: select_one
      options:
      - 1 - Poor
      - '2'
      - 3 - Average
      - '4'
      - 5 - Excellent
      required: false
    - id: 11
      name: submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
