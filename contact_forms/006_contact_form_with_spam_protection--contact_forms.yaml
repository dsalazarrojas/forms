inputSchema:
  type: object
  properties:
    title: Contact Form With Spam Protection
    pages:
    - id: 1
      name: secure_contact_header
      label: Secure Contact Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: sender_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: sender_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: sender_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: subject
      label: Subject
      hint: null
      type: select_one
      options:
      - General
      - Technical
      - Billing
      - Feedback
      required: true
    - id: 6
      name: inquiry_message
      label: Message
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: spam_check_question
      label: What is 5 plus 2?
      hint: Antispam verification
      type: number
      options: []
      required: true
    - id: 8
      name: privacy_agreement
      label: I agree to the privacy policy
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
