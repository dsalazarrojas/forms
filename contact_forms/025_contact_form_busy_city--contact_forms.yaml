inputSchema:
  type: object
  properties:
    title: Contact Form Busy City
    pages:
    - id: 1
      name: section_attendee_info
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_full_name
      label: Your Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: attendee_email
      label: Email Address
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: attendee_phone
      label: Phone Number
      hint: Best number to reach you during the event
      type: text
      options: []
      required: false
    - id: 5
      name: section_event_inquiry
      label: -- Event Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: specific_event_interest
      label: Specific Event Interest
      hint: Which city event are you inquiring about?
      type: select_one
      options:
      - City Marathon
      - Street Food Festival
      - Outdoor Concert Series
      - Community Garden Day
      - Neighborhood Block Party
      - Other
      required: true
    - id: 7
      name: preferred_event_date
      label: Preferred Event Date
      hint: If applicable
      type: date
      options: []
      required: false
    - id: 8
      name: number_of_attendees
      label: Estimated Number of Attendees
      hint: Including yourself
      type: number
      options: []
      required: false
    - id: 9
      name: section_message_details
      label: -- Message and Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: message_subject
      label: Inquiry Subject
      hint: What is your message about?
      type: select_one
      options:
      - Registration Inquiry
      - Vendor Application
      - Volunteer Opportunity
      - General Feedback
      - Media/PR
      - Other
      required: true
    - id: 11
      name: message_content
      label: Your Detailed Message
      hint: Provide more information
      type: text
      options: []
      required: true
    - id: 12
      name: how_did_you_find_us
      label: How did you find us?
      hint: Select one
      type: select_one
      options:
      - Social Media
      - City Event Flyer
      - Local News
      - Word of Mouth
      - Other
      required: false
    - id: 13
      name: submission_date
      label: Submission Date
      hint: Today's date
      type: date
      options: []
      required: true
