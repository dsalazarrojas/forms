inputSchema:
  type: object
  properties:
    title: Consultancy Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Primary email for contact
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Best contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: Your position or role
      type: text
      options: []
      required: false
    - id: 7
      name: street_address
      label: Street Address
      hint: Your mailing address
      type: text
      options: []
      required: false
    - id: 8
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: false
    - id: 9
      name: state
      label: State or Province
      hint: State or province
      type: text
      options: []
      required: false
    - id: 10
      name: zip_code
      label: ZIP or Postal Code
      hint: Postal code
      type: text
      options: []
      required: false
    - id: 11
      name: country
      label: Country
      hint: Country of residence
      type: text
      options: []
      required: false
    - id: 12
      name: inquiry_type
      label: Type of Inquiry
      hint: What type of consulting do you need
      type: select_one
      options:
      - General Inquiry
      - Management Consulting
      - Financial Consulting
      - IT Consulting
      - HR Consulting
      - Marketing Consulting
      - Strategy Consulting
      - Other
      required: true
    - id: 13
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone
      - Either
      required: true
    - id: 14
      name: best_time_to_contact
      label: Best Time to Contact
      hint: When are you available
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Anytime
      required: false
    - id: 15
      name: project_timeline
      label: Project Timeline
      hint: When do you need services
      type: select_one
      options:
      - Immediately
      - Within 1 Month
      - 1-3 Months
      - 3-6 Months
      - 6+ Months
      - Just Exploring
      required: true
    - id: 16
      name: budget_range
      label: Budget Range
      hint: Estimated budget for consulting services
      type: select_one
      options:
      - Under $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - $25,000 - $50,000
      - $50,000 - $100,000
      - Over $100,000
      - Not Sure
      required: false
    - id: 17
      name: project_description
      label: Project Description
      hint: Describe your project or needs
      type: text
      options: []
      required: true
    - id: 18
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Website
      - Social Media
      - Referral
      - Advertisement
      - Conference or Event
      - Search Engine
      - Other
      required: false
    - id: 19
      name: referral_source
      label: Referral Source
      hint: If referred, who referred you
      type: text
      options: []
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other information to share
      type: text
      options: []
      required: false
    - id: 21
      name: newsletter_signup
      label: Subscribe to Newsletter
      hint: Receive updates and insights
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: registration_date
      label: Registration Date
      hint: Date of submission
      type: date
      options: []
      required: true
