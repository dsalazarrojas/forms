inputSchema:
  type: object
  properties:
    title: Contact Form With Rounded Theme Blue Button
    pages:
    - id: 1
      name: header_note
      label: Contact Us
      hint: Please fill out the fields below
      type: note
      options: []
      required: false
    - id: 2
      name: user_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: user_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: website_url
      label: Website URL
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 6
      name: service_interest
      label: Service of Interest
      hint: null
      type: select_one
      options:
      - Web Design
      - SEO
      - Marketing
      - Consulting
      required: true
    - id: 7
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: priority
      label: Inquiry Priority
      hint: null
      type: select_one
      options:
      - Low
      - Normal
      - High
      required: false
    - id: 9
      name: contact_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
