inputSchema:
  type: object
  properties:
    title: Contact Form With Orange Envelope Theme
    pages:
    - id: 1
      name: section_sender_info
      label: -- Sender Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: sender_full_name
      label: Your Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: sender_email_address
      label: Your Email Address
      hint: Primary email for contact
      type: email
      options: []
      required: true
    - id: 4
      name: sender_phone_number
      label: Your Phone Number
      hint: Mobile or home phone
      type: text
      options: []
      required: false
    - id: 5
      name: section_envelope_message
      label: -- Message Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: message_subject
      label: Subject
      hint: Provide a brief summary
      type: text
      options: []
      required: true
    - id: 7
      name: detailed_message
      label: Your Detailed Message
      hint: Please provide more information
      type: text
      options: []
      required: true
    - id: 8
      name: preferred_response_method
      label: Preferred Response Method
      hint: How should we reach back out?
      type: select_one
      options:
      - Email
      - Phone Call
      required: true
    - id: 9
      name: submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
