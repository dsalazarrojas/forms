inputSchema:
  type: object
  properties:
    title: Contact Page Red And Responsive
    pages:
    - id: 1
      name: header
      label: -- Contact Page --
      hint: Responsive contact page with sidebar for additional info
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_name
      label: Visitor name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: Best email to reach you
      type: email
      options: []
      required: true
    - id: 4
      name: subject
      label: Subject
      hint: Brief subject of your message
      type: text
      options: []
      required: false
    - id: 5
      name: message
      label: Message
      hint: Provide details for our team
      type: text
      options: []
      required: true
    - id: 6
      name: sidebar_note
      label: Sidebar information
      hint: Optional details or contact hours in the sidebar
      type: note
      options: []
      required: false
    - id: 7
      name: preferred_contact_method
      label: Preferred contact method
      hint: How should we reach you
      type: select_one
      options:
      - Email
      - Phone
      - No preference
      required: false
    - id: 8
      name: phone
      label: Phone number
      hint: Optional phone for urgent contact
      type: text
      options: []
      required: false
    - id: 9
      name: additional_info
      label: Additional information
      hint: Any other context to help our response
      type: text
      options: []
      required: false
