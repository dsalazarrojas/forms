inputSchema:
  type: object
  properties:
    title: Contact Form For Ecommerce Sites
    pages:
    - id: 1
      name: section_customer_info
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_full_name
      label: Customer Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email_address
      label: Email Address
      hint: Order confirmation email
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone_number
      label: Phone Number
      hint: Mobile or landline
      type: text
      options: []
      required: false
    - id: 5
      name: section_order_details
      label: -- Order Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: order_number
      label: Order Number (if applicable)
      hint: Enter the ID of the order you are inquiring about
      type: text
      options: []
      required: false
    - id: 7
      name: order_date
      label: Order Date
      hint: When was the order placed?
      type: date
      options: []
      required: false
    - id: 8
      name: product_name
      label: Product Name
      hint: Which product is this about?
      type: text
      options: []
      required: false
    - id: 9
      name: section_inquiry_details
      label: -- Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: reason_for_contact
      label: Reason for Contact
      hint: Select the primary reason
      type: select_one
      options:
      - Complaint
      - Suggestion
      - Feedback
      - Enquiry
      - Delay Order
      - Refund Request
      - Cancellation
      - Other
      required: true
    - id: 11
      name: message_subject
      label: Message Subject
      hint: Brief summary of your inquiry
      type: text
      options: []
      required: true
    - id: 12
      name: detailed_message
      label: Your Message
      hint: Please provide more information
      type: text
      options: []
      required: true
    - id: 13
      name: urgency_level
      label: Urgency Level
      hint: How quickly do you need a response?
      type: select_one
      options:
      - High - Urgent
      - Moderate - Normal
      - Low - Information Only
      required: true
    - id: 14
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we reach you?
      type: select_one
      options:
      - Email
      - Phone Call
      - SMS/Text
      required: true
    - id: 15
      name: submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
