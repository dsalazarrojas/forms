inputSchema:
  type: object
  properties:
    title: Real Estate Visitor Check Out Form
    pages:
    - id: 1
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: visitor_type
      label: Visitor Type
      hint: null
      type: select_one
      options:
      - '{''id'': 5, ''name'': ''Agent''}'
      - '{''id'': 6, ''name'': ''Client''}'
      required: true
    - id: 5
      name: check_out_time
      label: Check Out Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: property_name
      label: Property Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: visitor_comments
      label: Visitor Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: agent_name
      label: Agent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: agent_number
      label: Agent Phone Number
      hint: null
      type: text
      options: []
      required: false
