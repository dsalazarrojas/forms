      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_description
      label: Project Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: preferred_design_style
      label: Preferred Design Style
      hint: null
      type: select_multiple
      options:
      - Modern
      - Traditional
      - Rustic
      - Contemporary
      - Mid-Century
      required: false
    - id: 4
      name: project_budget
      label: Project Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: project_location
      label: Project Location
      hint: null
      type: text
      options: []
      required: false
