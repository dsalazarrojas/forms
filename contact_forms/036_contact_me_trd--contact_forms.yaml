inputSchema:
  type: object
  properties:
    title: Contact Me TRD
    pages:
    - id: 1
      name: header
      label: -- Contact The Resume Dude --
      hint: Use this form to request resume help or career advice
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: Email for correspondence about resume services
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Optional contact number
      type: text
      options: []
      required: false
    - id: 5
      name: service_needed
      label: Service needed
      hint: Type of resume or career service requested
      type: select_one
      options:
      - Resume review
      - Resume writing
      - Cover letter
      - LinkedIn profile
      - Career coaching
      required: true
    - id: 6
      name: years_experience
      label: Years of experience
      hint: Approximate total years in the workforce
      type: number
      options: []
      required: false
    - id: 7
      name: target_role
      label: Target role or industry
      hint: Role or industry you are aiming for
      type: text
      options: []
      required: false
    - id: 8
      name: availability_for_consult
      label: Availability for consultation
      hint: Preferred days or times for a consultation
      type: text
      options: []
      required: false
    - id: 9
      name: additional_notes
      label: Additional notes
      hint: Any other information to help us prepare
      type: text
      options: []
      required: false
