inputSchema:
  type: object
  properties:
    title: Contact Form With Vanilla Theme
    pages:
    - id: 1
      name: intro_note
      label: Simple Contact Form
      hint: Clean and clear
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: reason_for_contact
      label: Reason for Contact
      hint: null
      type: select_one
      options:
      - General Question
      - Feedback
      - Problem Report
      required: true
    - id: 6
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: subscribe
      label: Subscribe to updates?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: best_date
      label: Today's Date
      hint: null
      type: date
      options: []
      required: true
