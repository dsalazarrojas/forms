inputSchema:
  type: object
  properties:
    title: Service Inquiry Form
    pages:
    - id: 1
      name: inquiry_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - General Service
      - Home Cleaning
      - Yard Service
      required: true
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: service_type
      label: Service Type
      hint: General Service
      type: select_one
      options:
      - General Service
      - Yard Service
      - Home Cleaning
      - Other
      required: true
    - id: 7
      name: message_2
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: service
      label: Select a Service
      hint: null
      type: select_multiple
      options:
      - General Service
      - Yard Service
      - Home Cleaning
      required: false
