inputSchema:
  type: object
  properties:
    title: Community Event Participation Contact Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 5
      name: address
      label: Street Address
      hint: Your home address
      type: text
      options: []
      required: false
    - id: 6
      name: city_state_zip
      label: City, State, ZIP
      hint: City, state, and ZIP code
      type: text
      options: []
      required: false
    - id: 7
      name: event_interest
      label: Event of Interest
      hint: Which event interests you?
      type: select_one
      options:
      - Community Festival
      - Town Hall Meeting
      - Volunteer Day
      - Workshop or Class
      - Sports Event
      - Cultural Celebration
      - Other
      required: true
    - id: 8
      name: participation_type
      label: Type of Participation
      hint: How do you want to participate?
      type: select_one
      options:
      - Attendee
      - Volunteer
      - Vendor
      - Sponsor
      - Performer
      - Speaker
      required: true
    - id: 9
      name: group_size
      label: Number in Your Group
      hint: How many people with you?
      type: number
      options: []
      required: false
    - id: 10
      name: accessibility_needs
      label: Accessibility Needs
      hint: Do you require accommodations?
      type: text
      options: []
      required: false
    - id: 11
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: If food is provided
      type: text
      options: []
      required: false
    - id: 12
      name: t_shirt_size
      label: T-Shirt Size
      hint: If event shirt is provided
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - X-Large
      - 2X-Large
      - Not Needed
      required: false
    - id: 13
      name: how_did_you_hear
      label: How Did You Hear About Event
      hint: Where did you learn about it?
      type: select_one
      options:
      - Website
      - Social Media
      - Email
      - Friend or Family
      - Flyer or Poster
      - Local News
      - Other
      required: false
    - id: 14
      name: previous_attendance
      label: Have You Attended Before
      hint: Previous event attendance
      type: select_one
      options:
      - Yes, Multiple Times
      - Yes, Once
      - No, First Time
      required: true
    - id: 15
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
