inputSchema:
  type: object
  properties:
    title: Blue Envelope Contact Form
    pages:
    - id: 1
      name: contact_intro
      label: -- Get In Touch --
      hint: Send us your message
      type: note
      options: []
      required: false
    - id: 2
      name: sender_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: sender_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: sender_phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: subject
      label: Subject
      hint: What is your message about?
      type: text
      options: []
      required: true
    - id: 7
      name: message_type
      label: Message Type
      hint: null
      type: select_one
      options:
      - General inquiry
      - Business proposal
      - Support request
      - Feedback
      - Partnership opportunity
      - Other
      required: true
    - id: 8
      name: message_body
      label: Message
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: priority_level
      label: Priority Level
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Urgent
      required: false
    - id: 10
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Video call
      required: true
    - id: 11
      name: best_time_to_contact
      label: Best Time To Contact
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Flexible
      required: false
    - id: 12
      name: attachments_note
      label: Do you have attachments?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: budget_range
      label: Budget Range (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: contact_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
