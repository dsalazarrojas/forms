inputSchema:
  type: object
  properties:
    title: Contact Form With Round Edges
    pages:
    - id: 1
      name: company_info
      label: -- Professional Inquiry Form --
      hint: Modern and friendly communication
      type: note
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company / Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: inquiry_type
      label: Type of Inquiry
      hint: null
      type: select_one
      options:
      - Partnership
      - Media
      - Support
      - Careers
      - General
      required: true
    - id: 6
      name: project_budget
      label: Estimated Project Budget
      hint: If applicable
      type: select_one
      options:
      - Under $1
      - 0
      - $1
      - 000 - $5
      - 0
      - $5
      - 000 - $10
      - 0
      - Over $10
      - 0
      required: false
    - id: 7
      name: details
      label: How can we help you?
      hint: Provide specific details
      type: text
      options: []
      required: true
    - id: 8
      name: reference_source
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Social Media
      - Search Engine
      - Referral
      - Advertisement
      - Other
      required: false
    - id: 9
      name: callback_requested
      label: Would you like a follow-up call?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 10
      name: callback_number
      label: Phone Number for Callback
      hint: null
      type: text
      options: []
      required: false
