inputSchema:
  type: object
  properties:
    title: Contact Form Space Theme
    pages:
      - id: 1
        name: section_traveler_info
        label: -- Space Traveler Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: traveler_full_name
        label: Your Full Name
        hint: Enter your name
        type: text
        options: []
        required: true
      - id: 3
        name: traveler_email
        label: Your Starbase Email
        hint: Primary email for contact
        type: email
        options: []
        required: true
      - id: 4
        name: planet_of_origin
        label: Planet of Origin
        hint: Select one
        type: select_one
        options:
          - Earth
          - Mars
          - Venus
          - Jupiter
          - Saturn
          - Other
        required: true
      - id: 5
        name: section_mission_inquiry
        label: -- Mission Inquiry Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: mission_category
        label: Mission Category
        hint: What is the primary purpose of your mission?
        type: select_one
        options:
          - Exploration
          - Research
          - Colonization
          - Tourism
          - Other
        required: true
      - id: 7
        name: mission_subject
        label: Mission Subject
        hint: Provide a brief summary
        type: text
        options: []
        required: true
      - id: 8
        name: detailed_mission_message
        label: Detailed Mission Message
        hint: Please provide more information
        type: text
        options: []
        required: true
      - id: 9
        name: submission_date
