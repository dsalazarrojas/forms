inputSchema:
  type: object
  properties:
    title: Child Information Form
    pages:
    - id: 1
      name: section_child_id
      label: -- Child Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: child_name
      label: Child Full Name
      hint: As registered for church activities
      type: text
      options: []
      required: true
    - id: 3
      name: child_dob
      label: Date of Birth
      hint: Select child birthday
      type: date
      options: []
      required: true
    - id: 4
      name: section_contact_details
      label: -- Contact Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: guardian_name
      label: Parent or Guardian Name
      hint: Primary point of contact
      type: text
      options: []
      required: true
    - id: 6
      name: contact_phone
      label: Contact Phone Number
      hint: Reachable during activity hours
      type: text
      options: []
      required: true
    - id: 7
      name: section_medical_info
      label: -- Medical Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: known_allergies
      label: Known Allergies
      hint: Select all that apply
      type: select_multiple
      options:
      - Peanuts and Tree Nuts
      - Dairy and Lactose
      - Gluten or Wheat
      - Latex Sensitivity
      - Bee Stings
      required: false
    - id: 9
      name: medication_info
      label: Any medications we should be aware of?
      hint: Include dosage and schedule if relevant
      type: text
      options: []
      required: false
    - id: 10
      name: section_activity_perms
      label: -- Activity Permissions --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: outdoor_permission
      label: I grant permission for my child to participate in outdoor games
      hint: Includes playground and field activities
      type: select_one
      options:
      - Yes - Permission Granted
      - No - Stay Indoors
      required: true
    - id: 12
      name: today_date
      label: Today Date
      hint: Date of form submission
      type: date
      options: []
      required: true
