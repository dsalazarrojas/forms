inputSchema:
  type: object
  properties:
    title: Contact Form With Captcha Gray Theme
    pages:
    - id: 1
      name: section_contact_info
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Your Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Your Email Address
      hint: Primary email for contact
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Your Phone Number
      hint: Mobile or home phone
      type: text
      options: []
      required: false
    - id: 5
      name: section_inquiry_details
      label: -- Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: inquiry_subject
      label: Subject
      hint: Provide a brief summary
      type: text
      options: []
      required: true
    - id: 7
      name: detailed_message
      label: Your Message
      hint: Please provide more information
      type: text
      options: []
      required: true
    - id: 8
      name: section_security
      label: -- Security --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: captcha_verification
      label: CAPTCHA Verification
      hint: Please confirm you are not a robot
      type: select_one
      options:
      - I am human
      - I am not human
      required: true
    - id: 10
      name: submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
