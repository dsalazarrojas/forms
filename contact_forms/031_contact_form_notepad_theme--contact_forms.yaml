inputSchema:
  type: object
  properties:
    title: Contact Form Notepad Theme
    pages:
    - id: 1
      name: section_contact_info
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_full_name
      label: Full Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email_address
      label: Email Address
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone_number
      label: Phone Number
      hint: Mobile or landline
      type: text
      options: []
      required: false
    - id: 5
      name: section_inquiry_details
      label: -- Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: type_of_inquiry
      label: Type of Inquiry
      hint: What is the primary reason for your contact?
      type: select_one
      options:
      - General Question
      - Support Request
      - Sales Inquiry
      - Feedback/Suggestion
      - Other
      required: true
    - id: 7
      name: inquiry_subject
      label: Subject
      hint: Provide a brief summary
      type: text
      options: []
      required: true
    - id: 8
      name: detailed_message
      label: Your Message
      hint: Please provide more information
      type: text
      options: []
      required: true
    - id: 9
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we reach you?
      type: select_one
      options:
      - Email
      - Phone Call
      required: true
    - id: 10
      name: submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
