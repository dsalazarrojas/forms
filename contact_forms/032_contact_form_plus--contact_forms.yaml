inputSchema:
  type: object
  properties:
    title: Contact Form Plus
    pages:
    - id: 1
      name: section_contact_details
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Your Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Mobile or landline
      type: text
      options: []
      required: false
    - id: 5
      name: section_website_inquiry
      label: -- Website Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: website_url
      label: Website URL (if applicable)
      hint: Enter the URL of the website you are inquiring about
      type: text
      options: []
      required: false
    - id: 7
      name: type_of_website_inquiry
      label: Type of Website Inquiry
      hint: Select the best match
      type: select_one
      options:
      - Content Suggestion
      - Technical Issue/Bug Report
      - Advertising Inquiry
      - Partnership Opportunity
      - Privacy/Terms Inquiry
      - Other
      required: true
    - id: 8
      name: section_message_details
      label: -- Message Content --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: message_subject
      label: Inquiry Subject
      hint: Brief summary of your message
      type: text
      options: []
      required: true
    - id: 10
      name: detailed_message
      label: Your Detailed Message
      hint: Please provide more information
      type: text
      options: []
      required: true
    - id: 11
      name: preferred_response_method
      label: Preferred Response Method
      hint: How should we reach back out?
      type: select_one
      options:
      - Email
      - Phone Call
      - No Response Needed
      required: true
    - id: 12
      name: submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
