inputSchema:
  type: object
  properties:
    title: Anonymous Question Submission
    pages:
    - id: 1
      name: section_question
      label: -- Submit a Question --
      hint: Questions are submitted anonymously unless contact info is provided
      type: note
      options: []
      required: false
    - id: 2
      name: question_topic
      label: Question topic
      hint: Choose the most relevant topic
      type: select_one
      options:
        - General inquiry
        - Policy
        - Program details
        - Technical support
        - Other
      required: true
    - id: 3
      name: question_text
      label: Question
      hint: Provide the full question you would like answered
      type: text
      options: []
      required: true
    - id: 4
      name: urgency
      label: Urgency level
      hint: Helps prioritize responses
      type: select_one
      options:
        - Low
        - Medium
        - High
      required: false
    - id: 5
      name: allow_follow_up
      label: Allow anonymous follow up if clarification needed
      hint: We will not request identifying information
      type: select_one
      options:
        - Yes
        - No
      required: false
    - id: 6
      name: additional_context
      label: Additional context
      hint: Optional background to help answer your question
      type: text
      options: []
      required: false
