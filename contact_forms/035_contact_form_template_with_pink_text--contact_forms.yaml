inputSchema:
  type: object
  properties:
    title: Contact Form Template With Pink Text
    pages:
    - id: 1
      name: section_visitor_info
      label: -- Visitor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_full_name
      label: Your Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: visitor_email_address
      label: Your Email Address
      hint: Primary email for contact
      type: email
      options: []
      required: true
    - id: 4
      name: visitor_phone_number
      label: Your Phone Number
      hint: Mobile or home phone
      type: text
      options: []
      required: false
    - id: 5
      name: section_stylish_inquiry
      label: -- Stylish Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: inquiry_category
      label: Inquiry Category
      hint: What is the primary reason for your contact?
      type: select_one
      options:
      - Style Consultation
      - Product Inquiry
      - Feedback/Love
      - Partnership Opportunity
      - Other
      required: true
    - id: 7
      name: favorite_color
      label: What's your favorite shade of pink?
      hint: Select one
      type: select_one
      options:
      - Blush
      - Rose
      - Fuchsia
      - Magenta
      - Other
      required: false
    - id: 8
      name: inquiry_subject
      label: Subject
      hint: Provide a brief summary
      type: text
      options: []
      required: true
    - id: 9
      name: detailed_message
      label: Your Detailed Message
      hint: Please provide more information
      type: text
      options: []
      required: true
    - id: 10
      name: submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
