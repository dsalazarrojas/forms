inputSchema:
  type: object
  properties:
    title: Personal Emergency Contact Form
    pages:
    - id: 1
      name: emergency_contact_form
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Name
      hint: Enter contact's name
      type: text
      options: []
      required: true
    - id: 3
      name: relationship
      label: Relationship
      hint: null
      type: select_one
      options:
      - Mother/Father
      - Spouse/Partner
      - Brother/Sister
      - Friend
      - Other
      required: true
    - id: 4
      name: contact_address
      label: Contact Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Enter phone number
      type: text
      options: []
      required: true
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: other_contact_info
      label: Other Contact Info
      hint: Additional contact info
      type: note
      options: []
      required: false
