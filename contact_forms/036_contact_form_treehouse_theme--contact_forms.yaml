inputSchema:
  type: object
  properties:
    title: Contact Form Treehouse Theme
    pages:
      - id: 1
        name: section_explorer_info
        label: -- Treehouse Explorer Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: explorer_full_name
        label: Your Full Name
        hint: Enter your name
        type: text
        options: []
        required: true
      - id: 3
        name: explorer_email
        label: Your Forest Email
        hint: Primary email for contact
        type: email
        options: []
        required: true
      - id: 4
        name: home_forest
        label: Home Forest
        hint: Where are you exploring from?
        type: select_one
        options:
          - Redwood Forest
          - Amazon Rainforest
          - Black Forest
          - Boreal Forest
          - Other
        required: true
      - id: 5
        name: section_forest_inquiry
        label: -- Forest Inquiry Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: inquiry_category
        label: Inquiry Category
        hint: What is the primary purpose of your exploration?
        type: select_one
        options:
          - Treehouse Booking
          - Forest Tour
          - Research Inquiry
          - Wildlife Spotting
          - Other
        required: true
      - id: 7
        name: inquiry_subject
        label: Inquiry Subject
        hint: Provide a brief summary
        type: text
        options: []
        required: true
      - id: 8
        name: detailed_forest_message
        label: Detailed Forest Message
        hint: Please provide more information
        type: text
        options: []
        required: true
      - id: 9
        name: submission_date
        label: Date of Exploration
        hint: Current date
        type: date
        options: []
        required: true
