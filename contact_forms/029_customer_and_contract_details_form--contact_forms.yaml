      name: contract_amount
      label: contract_amount
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: contract_start_date
      label: contract_start_date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: contract_end_date
      label: contract_end_date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: contract_status
      label: contract_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
