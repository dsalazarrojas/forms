      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: dj_notes
      label: DJ Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 13
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
