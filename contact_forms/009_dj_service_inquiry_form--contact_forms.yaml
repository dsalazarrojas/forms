inputSchema:
  type: object
  properties:
    title: DJ Service Inquiry Form
    pages:
    - id: 1
      name: event_planner_name
      label: Event Planner Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
