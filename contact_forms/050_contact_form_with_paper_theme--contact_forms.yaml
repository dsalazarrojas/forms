inputSchema:
  type: object
  properties:
    title: Contact Form With Paper Theme
    pages:
    - id: 1
      name: section_contact_info
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_full_name
      label: Your Full Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email_address
      label: Your Email Address
      hint: Primary email for contact
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone_number
      label: Your Phone Number
      hint: Mobile or home phone
      type: text
      options: []
      required: false
    - id: 5
      name: role_in_contact
      label: Your Role/Position
      hint: e.g., Customer, Partner, Freelancer
      type: text
      options: []
      required: false
    - id: 6
      name: section_inquiry_details
      label: -- Inquiry Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: inquiry_subject
      label: Subject
      hint: Provide a brief summary
      type: text
      options: []
      required: true
    - id: 8
      name: detailed_message
      label: Your Detailed Message
      hint: Please provide more information
      type: text
      options: []
      required: true
    - id: 9
      name: preferred_response_method
      label: Preferred Response Method
      hint: How should we reach back out?
      type: select_one
      options:
      - Email
      - Phone Call
      - No Response Needed
      required: true
    - id: 10
      name: submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 11
      name: final_thank_you
      label: -- Thank You --
      hint: null
      type: note
      options: []
      required: false
