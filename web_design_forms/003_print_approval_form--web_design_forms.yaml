inputSchema:
  type: object
  properties:
    title: Print Approval Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Enter customer's name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Customer E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: invitation_status
      label: Invitation Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Rejected
      required: true
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: customer_approval
      label: Customer Approval
      hint: null
      type: select_one
      options:
      - Approved
      - Not Approved
      required: true
    - id: 7
      name: customer_consent
      label: Customer Consent
      hint: null
      type: select_one
      options:
      - Consented
      - Not Consented
      required: true
