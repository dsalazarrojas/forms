inputSchema:
  type: object
  properties:
    title: website_design_quotes
    pages:
    - id: 1
      name: quote_details
      label: Quote Details
      hint: Enter quote details here
      type: text
      options: []
      required: false
    - id: 2
      name: client
      label: Client
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: quote_date
      label: Quote Date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 4
      name: quote_time
      label: Quote Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: services
      label: Services
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: rate
      label: Rate
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 7
      name: quote
      label: Quote
      hint: Enter quote amount
      type: number
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
