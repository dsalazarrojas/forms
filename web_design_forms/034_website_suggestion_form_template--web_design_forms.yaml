inputSchema:
  type: object
  properties:
    title: Website Suggestion Form Template
    pages:
    - id: 1
      name: website_name
      label: What is the name of your website suggestion?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: description
      label: Can you describe your website?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: category
      label: Which category does your website belong to?
      hint: null
      type: select_one
      options:
      - Website 1
      - Website 2
      - Website 3
      required: true
    - id: 5
      name: date
      label: What is the date for your website?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: form_type
      label: Can you suggest a form type for your website?
      hint: null
      type: select_one
      options:
      - Form 1
      - Form 2
      - Form 3
      required: true
    - id: 7
      name: repeat_date
      label: Can you provide another date for your website?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: suggestion
      label: Can you suggest another website?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: select_date
      label: Can you suggest a date for your website?
      hint: null
      type: select_one
      options:
      - Date 1
      - Date 2
      - Date 3
      required: true
    - id: 10
      name: select_suggestion
      label: Can you suggest another form type?
      hint: null
      type: select_one
      options:
      - Suggest 1
      - Suggest 2
      - Suggest 3
      required: true
    - id: 11
      name: phone
      label: What is your phone number?
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: confirm_date
      label: Is this a repeat question for dates?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
