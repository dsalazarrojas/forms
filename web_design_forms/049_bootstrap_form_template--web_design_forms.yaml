inputSchema:
  type: object
  properties:
    title: Bootstrap Form Template
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: false
    - id: 5
      name: address
      label: Address
      hint: Your street address
      type: text
      options: []
      required: false
    - id: 6
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: false
    - id: 7
      name: state_province
      label: State or Province
      hint: Your state or province
      type: text
      options: []
      required: false
    - id: 8
      name: postal_code
      label: Postal Code
      hint: Your zip or postal code
      type: text
      options: []
      required: false
    - id: 9
      name: country
      label: Country
      hint: Your country
      type: text
      options: []
      required: false
    - id: 10
      name: preferred_contact
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      - Mail
      - Other
      required: true
    - id: 11
      name: subject_message
      label: Subject
      hint: Subject of your message
      type: text
      options: []
      required: true
    - id: 12
      name: message_content
      label: Message
      hint: Your message or inquiry
      type: text
      options: []
      required: true
    - id: 13
      name: interest_areas
      label: Areas of Interest
      hint: What interests you
      type: select_multiple
      options:
      - Web design
      - Web development
      - Mobile apps
      - E-commerce
      - Branding
      - Marketing
      - Other services
      required: false
    - id: 14
      name: how_heard
      label: How Did You Hear About Us
      hint: Where did you find us
      type: select_one
      options:
      - Search engine
      - Social media
      - Referral
      - Advertisement
      - Friend recommendation
      - Other
      required: false
    - id: 15
      name: subscribe_newsletter
      label: Subscribe to Newsletter
      hint: Would you like to subscribe
      type: select_one
      options:
      - Yes, subscribe me
      - No, thanks
      - Maybe later
      required: false
