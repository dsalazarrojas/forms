inputSchema:
  type: object
  properties:
    title: Logo Design Order Form
    pages:
    - id: 1
      name: logo_type
      label: Logo Type
      hint: null
      type: select_one
      options:
      - Vector Graphics
      - Raster Graphics
      - Iconic Logo
      required: true
    - id: 2
      name: project_type
      label: Project Type
      hint: null
      type: select_multiple
      options:
      - Website
      - Product
      - Brand
      required: true
    - id: 3
      name: color_scheme
      label: Color Scheme
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: background_type
      label: Background Type
      hint: null
      type: select_one
      options:
      - White
      - Color
      - Gradient
      required: true
    - id: 5
      name: logo_size
      label: Logo Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 6
      name: logo_format
      label: Logo Format
      hint: null
      type: select_one
      options:
      - PNG
      - SVG
      - Vector
      required: true
    - id: 7
      name: deadline
      label: Deadline
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
