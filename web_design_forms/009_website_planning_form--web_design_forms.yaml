inputSchema:
  type: object
  properties:
    title: Website Planning Form
    pages:
    - id: 1
      name: website_details
      label: Website details
      hint: Describe your website
      type: text
      options: []
      required: false
    - id: 2
      name: company_details
      label: Company information
      hint: Please provide company details
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: contact_details
      label: Contact information
      hint: Enter contact information
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone number
      hint: Enter a valid phone number
      type: text
      options: []
      required: false
    - id: 5
      name: project_details
      label: Project details
      hint: Describe your project details
      type: text
      options: []
      required: false
    - id: 6
      name: project_deadline
      label: Project deadline
      hint: Enter a date for the project deadline
      type: date
      options: []
      required: false
    - id: 7
      name: additional_info
      label: Additional information
      hint: Add any additional information
      type: text
      options: []
      required: false
    - id: 8
      name: website_features
      label: Website features
      hint: Select the website features
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: website_platform
      label: Website platform
      hint: Select your preferred website platform
      type: select_one
      options:
      - WordPress
      - Wix
      - Squarespace
      - Webflow
      required: false
    - id: 10
      name: website_content
      label: Website content
      hint: Describe your website content
      type: text
      options: []
      required: false
    - id: 11
      name: target_audience
      label: Target audience
      hint: Who is your target audience?
      type: select_multiple
      options:
      - Men
      - Women
      - Children
      required: false
    - id: 12
      name: website_goals
      label: Website goals
      hint: What are your website goals?
      type: select_multiple
      options:
      - Sales
      - Marketing
      - Informational
      required: false
    - id: 13
      name: website_launch_date
      label: Website launch date
      hint: Enter a date for the website launch
      type: date
      options: []
      required: false
    - id: 14
      name: website_launch_time
      label: Website launch time
      hint: Enter a time for the website launch
      type: time
      options: []
      required: false
    - id: 15
      name: website_url
      label: Website URL
      hint: Enter a valid website URL
      type: text
      options: []
      required: false
    - id: 16
      name: website_status
      label: Website status
      hint: Select the website status
      type: select_one
      options:
      - Under Construction
      - Live
      - Down
      required: false
    - id: 17
      name: website_analytics
      label: Website analytics
      hint: Select the website analytics
      type: select_multiple
      options:
      - Google Analytics
      - Google Ads
      - Other
      required: false
    - id: 18
      name: website_security
      label: Website security
      hint: Select the website security
      type: select_multiple
      options:
      - SSL
      - No security
      required: false
