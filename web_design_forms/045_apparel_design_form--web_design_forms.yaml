inputSchema:
  type: object
  properties:
    title: Apparel Design Form
    pages:
    - id: 1
      name: section_project_overview
      label: -- Project Overview --
      hint: Provide design brief and specifications for apparel printing
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client name
      hint: Contact for design approval
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For proofs and correspondence
      type: email
      options: []
      required: true
    - id: 4
      name: apparel_type
      label: Apparel type
      hint: Select the kind of apparel to design
      type: select_one
      options:
        - T shirt
        - Hoodie
        - Jacket
        - Cap
      required: true
    - id: 5
      name: sizes_and_quantities
      label: Sizes and quantities required
      hint: Provide size breakdown and counts
      type: text
      options: []
      required: true
    - id: 6
      name: color_palette
      label: Color palette or pantone codes
      hint: Preferred colors for printing
      type: text
      options: []
      required: false
    - id: 7
      name: artwork_files
      label: Artwork file references
      hint: Provide links or filenames for logos and artwork
      type: text
      options: []
      required: true
    - id: 8
      name: print_method
      label: Preferred print method
      hint: Screen printing digital or embroidery
      type: select_one
      options:
        - Screen printing
        - Direct to garment
        - Embroidery
        - Heat transfer
      required: true
    - id: 9
      name: additional_instructions
      label: Additional instructions for production
      hint: Any special handling or notes
      type: text
      options: []
      required: false
