inputSchema:
  type: object
  properties:
    title: Game Release Evaluation Form
    pages:
    - id: 1
      name: user_name
      label: player_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: version
      label: version
      hint: null
      type: select_multiple
      options:
      - alpha
      - beta
      - release
      required: false
    - id: 3
      name: platform
      label: platform
      hint: null
      type: select_one
      options:
      - console
      - pc
      - mobile
      - web
      required: false
    - id: 4
      name: feedback
      label: what_did_you_enjoy
      hint: Please provide feedback on the game
      type: text
      options: []
      required: false
    - id: 5
      name: suggestions
      label: suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
