inputSchema:
  type: object
  properties:
    title: Congressional Hearing Group Performance Assessment Form
    pages:
      - id: 1
        name: assessment_date
        label: Assessment Date
        hint: Date of the hearing
        type: date
        options: []
        required: true
      - id: 2
        name: assessor_name
        label: Assessor Name
        hint: Name of person completing assessment
        type: text
        options: []
        required: true
      - id: 3
        name: assessor_role
        label: Assessor Role
        hint: Your role in the hearing
        type: select_one
        options:
          - Committee Staff
          - Observer
          - Media
          - Subject Matter Expert
          - Government Liaison
          - Other
        required: true
      - id: 4
        name: hearing_name
        label: Hearing Name
        hint: Official title of the hearing
        type: text
        options: []
        required: true
      - id: 5
        name: committee_name
        label: Committee Name
        hint: Which committee convened the hearing
        type: text
        options: []
        required: true
      - id: 6
        name: group_name
        label: Group or Panel Name
        hint: Name of the group being assessed
        type: text
        options: []
        required: true
      - id: 7
        name: group_type
        label: Type of Group
        hint: Category of the testifying group
        type: select_one
        options:
          - Government Agency
          - Industry Representatives
          - Advocacy Organization
          - Academic or Research Institution
          - Labor Union
          - State or Local Government
          - International Organization
          - Other
        required: true
      - id: 8
        name: hearing_topic
        label: Hearing Topic or Subject
        hint: Main subject of the hearing
        type: text
        options: []
        required: true
      - id: 9
        name: preparation_quality
        label: Quality of Group Preparation
        hint: How well prepared was the group
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: testimony_clarity
        label: Clarity of Testimony
        hint: How clear and understandable was testimony
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 11
        name: testimony_relevance
        label: Relevance of Testimony
        hint: How relevant was testimony to hearing topic
        type: select_one
        options:
          - Very Relevant
          - Relevant
          - Somewhat Relevant
          - Not Relevant
        required: true
      - id: 12
        name: evidence_quality
        label: Quality of Evidence Presented
        hint: Rating of supporting evidence
        type: select_one
        options:
          - Excellent - Well Documented
          - Good - Adequately Supported
          - Fair - Some Support
          - Poor - Lacking Evidence
        required: true
      - id: 13
        name: responsiveness
        label: Responsiveness to Questions
        hint: How well did group answer questions
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 14
        name: professionalism
        label: Professionalism Displayed
        hint: Rating of professional conduct
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 15
        name: time_management
        label: Time Management
        hint: Did group use allotted time well
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 16
        name: expertise_demonstrated
        label: Level of Expertise Demonstrated
        hint: How knowledgeable was the group
        type: select_one
        options:
          - Expert
          - Very Knowledgeable
          - Knowledgeable
          - Somewhat Knowledgeable
          - Lacking Knowledge
        required: true
      - id: 17
        name: credibility
        label: Overall Credibility
        hint: How credible was the group
        type: select_one
        options:
          - Very High
          - High
          - Moderate
          - Low
          - Very Low
        required: true
      - id: 18
        name: key_points_communicated
        label: Were Key Points Communicated Effectively
        hint: Did the group convey main messages
        type: select_one
        options:
          - Yes - Very Effectively
          - Yes - Somewhat Effectively
          - No - Ineffective
          - No - Key Points Unclear
        required: true
      - id: 19
        name: bipartisan_appeal
        label: Bipartisan Appeal of Testimony
        hint: Did testimony appeal across party lines
        type: select_one
        options:
          - Yes - Strong Bipartisan Appeal
          - Yes - Some Bipartisan Appeal
          - No - Partisan Nature
          - Not Applicable
        required: true
      - id: 20
        name: impact_on_policy
        label: Potential Impact on Policy
        hint: How might testimony influence policy
        type: select_one
        options:
          - High Impact Expected
          - Moderate Impact Expected
          - Low Impact Expected
          - No Impact Expected
          - Too Soon to Tell
        required: true
      - id: 21
        name: strengths
        label: Group Strengths
        hint: What did the group do well
        type: text
        options: []
        required: true
      - id: 22
        name: weaknesses
        label: Group Weaknesses
        hint: Areas needing improvement
        type: text
        options: []
        required: true
      - id: 23
        name: notable_moments
        label: Notable Moments or Exchanges
        hint: Any memorable exchanges
        type: text
        options: []
        required: false
      - id: 24
        name: overall_performance
        label: Overall Performance Rating
        hint: Final assessment of group performance
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 25
        name: additional_comments
        label: Additional Comments
        hint: Any other observations
        type: text
        options: []
        required: false
