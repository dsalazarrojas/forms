inputSchema:
  type: object
  properties:
    title: Executive Leadership Interview Form
    pages:
    - id: 1
      name: candidate_name
      label: Candidate Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: position_title
      label: Position Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: candidate_email
      label: Candidate Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: candidate_phone
      label: Candidate Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: interview_date
      label: Interview Date
      hint: Date of interview
      type: date
      options: []
      required: false
    - id: 6
      name: interview_time
      label: Interview Time
      hint: Time of interview (24H)
      type: time
      options: []
      required: false
    - id: 7
      name: evaluation
      label: Evaluation
      hint: Rate the candidate's performance
      type: select_one
      options:
      - Excellent
      - Satisfactory
      - Unsatisfactory
      required: false
    - id: 8
      name: recommendation
      label: Recommendation
      hint: Provide a brief summary of your recommendation
      type: text
      options: []
      required: false
    - id: 9
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: panel
      label: Panel
      hint: Select a panel member
      type: select_one
      options:
      - Panel 1
      - Panel 2
      - Panel 3
      - Panel 4
      - Panel 5
      - Panel 6
      - Panel 7
      - Panel 8
      - Panel 9
      - Panel 10
      - Panel 11
      - Panel 12
      - Panel 13
      - Panel 14
      - Panel 15
      - Panel 16
      - Panel 17
      - Panel 18
      - Panel 19
      - Panel 20
      required: false
    - id: 11
      name: panel_member
      label: Panel Member
      hint: Select the name of the panel member who interviewed the candidate
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
