inputSchema:
  type: object
  properties:
    title: Sermon Evaluation Form
    pages:
    - id: 1
      name: survey_questions
      label: Survey Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: content
      label: What was your overall impression of the sermon?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: message
      label: What did you find most impactful from the sermon?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: impact
      label: How did the sermon impact you today?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: Rate the content of the sermon
      hint: On a scale of 1 to 5
      type: number
      options: []
      required: false
    - id: 6
      name: rating_5
      label: '5'
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 7
      name: will_recommend
      label: Will you recommend this pastor to others?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submission
      label: Submission
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: email_hint
      label: Email Hint
      hint: Email
      type: text
      options: []
      required: false
