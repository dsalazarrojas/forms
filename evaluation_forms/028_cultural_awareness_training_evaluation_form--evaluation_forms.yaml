inputSchema:
  type: object
  properties:
    title: Cultural Awareness Training Evaluation Form
    pages:
    - id: 1
      name: program_name
      label: Program Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_name
      label: Session Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: evaluation_time
      label: Evaluation Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: overall_rating
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
