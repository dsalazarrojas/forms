inputSchema:
  type: object
  properties:
    title: Evaluation Consent Form Template
    pages:
    - id: 1
      name: participant_info
      label: Participant Info
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: evaluation_info
      label: Evaluation Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participant_agreement
      label: Participant Agreement
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: evaluation_agreement
      label: Evaluation Agreement
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: note
      label: Note
      hint: Enter any additional comments or observations
      type: note
      options: []
      required: false
    - id: 6
      name: submission
      label: Submission
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: evaluation_type
      label: Evaluation Type
      hint: Please choose one of the following evaluation types
      type: select_one
      options:
      - Evaluation of your performance
      - Evaluation of your abilities
      required: true
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
