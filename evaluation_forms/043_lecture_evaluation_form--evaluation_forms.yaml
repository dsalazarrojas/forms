inputSchema:
  type: object
  properties:
    title: Lecture Evaluation Form
    pages:
    - id: 1
      name: lecture_content
      label: How engaging was the lecture?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: speaker
      label: How would you rate the speaker?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: presentation_materials
      label: How well was the presentation organized?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: content
      label: How relevant was the content?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: time_management
      label: How well was the time management?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 7
      name: evaluation_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: lecture_length
      label: How long did the lecture feel too short?
      hint: null
      type: number
      options: []
      required: false
