inputSchema:
  type: object
  properties:
    title: CEO Performance Evaluation Form
    pages:
    - id: 1
      name: evaluation_intro_section
      label: -- Annual CEO Performance Review --
      hint: Strictly Confidential. Conducted by the Board of Directors.
      type: note
      options: []
      required: false
    - id: 2
      name: evaluator_name_board
      label: Board Member Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: evaluation_period_ceo
      label: Evaluation Period (Year)
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: strategic_leadership_rating
      label: Strategic Leadership and Vision
      hint: Ability to set direction and lead the organization toward goals.
      type: select_one
      options:
      - 1 - Unsatisfactory
      - 2 - Below Expectations
      - 3 - Meets Expectations
      - 4 - Exceeds Expectations
      - 5 - Exceptional
      required: true
    - id: 5
      name: strategic_leadership_comments
      label: Comments on Strategic Leadership
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: financial_performance_rating
      label: Financial Management and Performance
      hint: Oversight of budget, profitability, and resource allocation.
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 7
      name: financial_mgmt_comments
      label: Comments on Financial Management
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: organizational_culture_rating
      label: Organizational Culture and Team Building
      hint: Fostering a positive environment and developing talent.
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 9
      name: relationship_board_rating
      label: Relationship with the Board of Directors
      hint: Communication, transparency, and collaboration with the board.
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 10
      name: innovation_and_growth_rating
      label: Innovation and Adaptability
      hint: Responding to market changes and driving new initiatives.
      type: select_one
      options:
      - 1
      - 2
      - 3
      - 4
      - 5
      required: true
    - id: 11
      name: key_achievements_ceo
      label: List Top 3 CEO Achievements This Period
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: areas_for_development_ceo
      label: Identified Areas for Growth or Improvement
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: overall_performance_rating_ceo
      label: Overall Performance Summary Rating
      hint: null
      type: select_one
      options:
      - Unsatisfactory
      - Needs Improvement
      - Effective
      - Highly Effective
      - Outstanding
      required: true
    - id: 14
      name: compensation_adjustment_recommendation
      label: Recommended Compensation Adjustment (%)
      hint: Optional board recommendation
      type: number
      options: []
      required: false
    - id: 15
      name: evaluator_confidentiality_pledge
      label: I pledge to keep this evaluation confidential
      hint: null
      type: select_one
      options:
      - I Pledge
      - Other
      required: true
    - id: 16
      name: evaluation_submission_date_ceo
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: true
