inputSchema:
  type: object
  properties:
    title: Commercial Driver Evaluation Form
    pages:
    - id: 1
      name: driver_name
      label: Driver Full Name
      hint: Legal name as on license
      type: text
      options: []
      required: true
    - id: 2
      name: cdl_number
      label: CDL Number
      hint: Commercial license number
      type: text
      options: []
      required: true
    - id: 3
      name: evaluation_date
      label: Evaluation Date
      hint: Date of evaluation
      type: date
      options: []
      required: true
    - id: 4
      name: evaluator_name
      label: Evaluator Name
      hint: Name of evaluator
      type: text
      options: []
      required: true
    - id: 5
      name: section_header_pre_trip_inspection
      label: -- Pre-Trip Inspection --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: vehicle_inspection_score
      label: Vehicle Inspection Score
      hint: Rate inspection performance
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Needs Improvement
      - Unsatisfactory
      required: true
    - id: 7
      name: identified_defects
      label: Identified Defects
      hint: Did driver identify defects correctly
      type: select_one
      options:
      - Yes All
      - Yes Most
      - Some
      - Few
      - None
      required: true
    - id: 8
      name: inspection_time
      label: Inspection Time
      hint: Time taken for inspection
      type: select_one
      options:
      - Under 10 minutes
      - 10-15 minutes
      - 15-20 minutes
      - Over 20 minutes
      required: true
    - id: 9
      name: section_header_basic_control
