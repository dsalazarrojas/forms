inputSchema:
  type: object
  properties:
    title: Academic Examination Administration Evaluation Form
    pages:
    - id: 1
      name: evaluation_header
      label: -- Examination Administration Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: evaluator_name
      label: Evaluator name
      hint: Person completing this evaluation
      type: text
      options: []
      required: true
    - id: 3
      name: examination_date
      label: Examination date
      hint: Date when evaluation applies
      type: date
      options: []
      required: true
    - id: 4
      name: location
      label: Examination location
      hint: Building and room number
      type: text
      options: []
      required: false
    - id: 5
      name: proctoring_effectiveness
      label: Proctoring effectiveness
      hint: Rate how smoothly proctoring was conducted
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
      required: true
    - id: 6
      name: materials_availability
      label: Materials were available and prepared
      hint: Were all exam materials ready
      type: select_one
      options:
        - Yes
        - No
      required: true
    - id: 7
      name: issues_encountered
      label: Issues encountered
      hint: Describe any problems during administration
      type: text
      options: []
      required: false
    - id: 8
      name: recommended_actions
      label: Recommended actions for improvement
      hint: Suggestions to improve future exams
      type: text
      options: []
      required: false
    - id: 9
      name: overall_rating
      label: Overall rating of administration
      hint: Select an overall assessment
      type: select_one
      options:
        - 5
        - 4
        - 3
        - 2
        - 1
      required: true
    - id: 10
      name: follow_up_needed
      label: Follow up required
      hint: Indicate whether a follow up is needed
      type: select_one
      options:
        - Yes
        - No
      required: false
