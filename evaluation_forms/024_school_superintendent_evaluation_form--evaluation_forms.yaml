inputSchema:
  type: object
  properties:
    title: School Superintendent Evaluation Form
    pages:
    - id: 1
      name: school_superintendent_evaluation_form_page_1
      label: School Superintendent Evaluation
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: performance_evaluation
      label: What is your overall impression of the school's performance?
      hint: null
      type: select_one
      options:
      - Strong
      - Weak
      - Unknown
      required: true
    - id: 3
      name: school_superintendent_recommendations
      label: Do you have any recommendations for the school?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: evaluation_date
      label: What date was the evaluation conducted?
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: comments
      label: Please provide any comments or feedback you have for the school.
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: superintendent_supportive_admin
      label: Do you agree that the school's administration is supportive of teachers?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 7
      name: superintendent_qualified_teachers
      label: Do you agree that the school's teachers are well-qualified and prepared?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 8
      name: superintendent_relevant_curriculum
      label: Do you agree that the school's curriculum is relevant and engaging?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 9
      name: superintendent_maintained_facilities
      label: Do you agree that the school's facilities are well-maintained?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 10
      name: superintendent_adequate_resources
      label: Do you agree that the school's resources (e.g., books, technology) are
        adequate?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 11
      name: superintendent_effective_leadership
      label: Do you agree that the school's leadership is effective?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 12
      name: superintendent_inclusive_culture
      label: Do you agree that the school's culture is inclusive and supportive?
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
