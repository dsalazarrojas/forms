inputSchema:
  type: object
  properties:
    title: Disease Prevention Project Evaluation
    pages:
      - id: 1
        name: project_name
        label: Project name
        hint: Title of the initiative being evaluated
        type: text
        options: []
        required: true
      - id: 2
        name: evaluation_period
        label: Evaluation period
        hint: Dates covered by this evaluation
        type: text
        options: []
        required: true
      - id: 3
        name: objectives_met
        label: Were project objectives met
        hint: Assess objective completion
        type: select_one
        options:
          - Fully met
          - Partially met
          - Not met
        required: true
      - id: 4
        name: key_outcomes
        label: Key outcomes observed
        hint: Quantitative or qualitative results
        type: text
        options: []
        required: true
      - id: 5
        name: challenges_encountered
        label: Challenges encountered
        hint: Obstacles that affected implementation
        type: text
        options: []
        required: false
      - id: 6
        name: cost_effectiveness
        label: Perceived cost effectiveness
        hint: Rate financial efficiency
        type: select_one
        options:
          - High
          - Moderate
          - Low
        required: false
      - id: 7
        name: recommendations
        label: Recommendations for future projects
        hint: Suggested improvements or next steps
        type: text
        options: []
        required: false
