      name: outcomes
      label: Outcomes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: impact_score
      label: Impact Score
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: time_frame
      label: Time Frame
      hint: null
      type: select_one
      options:
      - Long
      - Medium
      - Short
      required: false
    - id: 8
      name: evaluation_period
      label: Evaluation Period
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: evaluation_time
      label: Evaluation Time
      hint: null
