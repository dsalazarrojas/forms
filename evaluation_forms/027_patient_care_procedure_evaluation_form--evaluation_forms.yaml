inputSchema:
  type: object
  properties:
    title: Patient Care Procedure Evaluation Form
    pages:
    - id: 1
      name: page_1
      label: procedure-quality-review
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_name
      label: Team Members
      hint: Please enter team member names separated by commas
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: team_leader
      label: Team Leader
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: procedure_date
      label: Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: false
    - id: 5
      name: procedure_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: rating
      label: Rating
      hint: Please rate from 1 to 5
      type: number
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: team_members
      label: Team Members
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: procedure_quality
      label: Procedure Quality
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 10
      name: procedure_effectiveness
      label: Procedure Effectiveness
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 12
      name: improvement_ideas
      label: Improvement Ideas
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: evaluation_date
      label: Evaluation Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: false
