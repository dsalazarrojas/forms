inputSchema:
  type: object
  properties:
    title: Computer Based Driving Evaluation Form
    pages:
      - id: 1
        name: section_participant_info
        label: -- Participant Information --
        hint: Collect basic participant and license details
        type: note
        options: []
        required: false
      - id: 2
        name: participant_name
        label: Participant name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 3
        name: driving_license_number
        label: Driving license number
        hint: License id or state issued
        type: text
        options: []
        required: false
      - id: 4
        name: evaluation_date
        label: Evaluation date
        hint: Date of assessment
        type: date
        options: []
        required: true
      - id: 5
        name: simulator_used
        label: Simulator used
        hint: Model or software used for evaluation
        type: text
        options: []
        required: false
      - id: 6
        name: control_skill_rating
        label: Control skill rating
        hint: Steering and vehicle control assessment
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 7
        name: hazard_recognition
        label: Hazard recognition
        hint: Ability to recognize and respond to hazards
        type: select_one
        options: [Strong, Adequate, Weak]
        required: true
      - id: 8
        name: reaction_time
        label: Reaction time
        hint: Observed reaction time category
        type: select_one
        options: [Fast, Average, Slow]
        required: true
      - id: 9
        name: evaluator_comments
        label: Evaluator comments
        hint: Feedback and recommendations
        type: text
        options: []
        required: false
