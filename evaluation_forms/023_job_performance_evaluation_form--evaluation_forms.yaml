      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: position
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: performance_period
      label: Performance Period
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: job_performance_rating
      label: Overall Performance Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Fair
      - Needs Improvement
      required: true
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
