inputSchema:
  type: object
  properties:
    title: Party Evaluation Form
    pages:
    - id: 1
      name: party_rating
      label: Overall Party Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: music_rating
      label: Music Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: food_rating
      label: Food Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: atmosphere_rating
      label: Atmosphere Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: service_rating
      label: Service Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: party_organizer
      label: Party Organizer
      hint: null
      type: select_one
      options:
      - '{''name'': ''Very Good'', ''value'': 5}'
      - '{''name'': ''Good'', ''value'': 4}'
      - '{''name'': ''Neutral'', ''value'': 3}'
      - '{''name'': ''Bad'', ''value'': 2}'
      - '{''name'': ''Very Bad'', ''value'': 1}'
      required: true
    - id: 8
      name: event_coordinator
      label: Event Coordinator
      hint: null
      type: select_multiple
      options:
      - '{''name'': ''Very Good'', ''value'': 5}'
      - '{''name'': ''Good'', ''value'': 4, ''label'': None}'
      - '{''name'': ''Neutral'', ''value'': 3, ''label'': None}'
      - '{''name'': ''Bad'', ''value'': 2, ''label'': None}'
      - '{''name'': ''Very Bad'', ''value'': 1, ''label'': None}'
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: Please provide any additional comments or suggestions
      type: note
      options: []
      required: false
    - id: 10
      name: feedback
      label: Feedback
      hint: What can we improve?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
