inputSchema:
  type: object
  properties:
    title: Assessment Participation Confirmation
    pages:
    - id: 1
      name: participant_name
      label: Participant Full Name
      hint: Legal name as on ID
      type: text
      options: []
      required: true
    - id: 2
      name: participant_id
      label: Participant ID Number
      hint: Student or employee ID
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: For confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: assessment_name
      label: Assessment Name
      hint: Title of assessment
      type: text
      options: []
      required: true
    - id: 6
      name: assessment_code
      label: Assessment Code
      hint: Reference code
      type: text
      options: []
      required: true
    - id: 7
      name: scheduled_date
      label: Scheduled Assessment Date
      hint: When is it scheduled
      type: date
      options: []
      required: true
    - id: 8
      name: scheduled_time
      label: Scheduled Time
      hint: Start time
      type: time
      options: []
      required: true
    - id: 9
      name: location
      label: Assessment Location
      hint: Where will it be held
      type: text
      options: []
      required: true
    - id: 10
      name: participation_status
      label: Will You Participate
      hint: Confirm your attendance
      type: select_one
      options:
      - Yes I Will Participate
      - No I Cannot Participate
      - Maybe - Need to Confirm
      required: true
    - id: 11
      name: conflict_reason
      label: Reason for Non-Participation
      hint: If no why can you not attend
      type: text
      options: []
      required: false
    - id: 12
      name: reschedule_needed
      label: Do You Need to Reschedule
      hint: If you cannot make original date
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: preferred_reschedule_date
      label: Preferred Reschedule Date
      hint: Alternative date
      type: date
      options: []
      required: false
    - id: 14
      name: accommodations_needed
      label: Special Accommodations Needed
      hint: Any required accommodations
      type: select_multiple
      options:
      - Extended Time
      - Separate Room
      - Assistive Technology
      - Sign Language Interpreter
      - Large Print Materials
      - Breaks Allowed
      - None
      required: true
    - id: 15
      name: accommodations_description
      label: Describe Accommodations
      hint: Provide details
      type: text
      options: []
      required: false
    - id: 16
      name: preparation_materials_received
      label: Have You Received Preparation Materials
      hint: Study guides or resources
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: understand_requirements
      label: Do You Understand Assessment Requirements
      hint: Format content and rules
      type: select_one
      options:
      - Yes Completely
      - Mostly
      - Need Clarification
      required: true
    - id: 18
      name: questions_concerns
      label: Questions or Concerns
      hint: Anything you want to ask
      type: text
      options: []
      required: false
    - id: 19
      name: consent_participate
      label: I Consent to Participate
      hint: Voluntary participation agreement
      type: select_one
      options:
      - Yes I Consent
      - No I Do Not Consent
      required: true
    - id: 20
      name: confidentiality_agreement
      label: I Agree to Maintain Confidentiality
      hint: Assessment content is confidential
      type: select_one
      options:
      - Yes I Agree
      - No I Do Not Agree
      required: true
    - id: 21
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Person to contact
      type: text
      options: []
      required: true
    - id: 22
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Their number
      type: text
      options: []
      required: true
    - id: 23
      name: confirmation_date
      label: Confirmation Date
      hint: Today date
      type: date
      options: []
      required: true
