inputSchema:
  type: object
  properties:
    title: Training Feedback Evaluation Form
    pages:
    - id: 1
      name: trainer_name
      label: Trainer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: trainee_name
      label: Trainee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: evaluation_form_comments
      label: Evaluation Form Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: overall_rating
      label: Overall Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: true
