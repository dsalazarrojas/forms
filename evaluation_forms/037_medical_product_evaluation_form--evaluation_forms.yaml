inputSchema:
  type: object
  properties:
    title: Medical Product Evaluation Form
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: performance
      label: Performance
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: overall
      label: Overall
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: product_type
      label: Product Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
