inputSchema:
  type: object
  properties:
    title: Wine Tasting Evaluation Form
    pages:
    - id: 1
      name: form_data
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: appearance
      label: Wine Appearance
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: aroma
      label: Aroma
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: taste
      label: Taste
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: finish
      label: Finish
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: overall_impression
      label: Overall Impression
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: wine_name
      label: Name Of Wine
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: wine_type
      label: Type Of Wine
      hint: null
      type: select_one
      options:
      - Red
      - White
      - Sparkling
      required: false
    - id: 9
      name: region
      label: Region
      hint: null
      type: select_multiple
      options:
      - Bordeaux
      - Burgundy
      - Rioja
      required: false
    - id: 10
      name: vintage
      label: Vintage
      hint: null
      type: select_one
      options:
      - '1990'
      - '1995'
      - '2000'
      required: false
