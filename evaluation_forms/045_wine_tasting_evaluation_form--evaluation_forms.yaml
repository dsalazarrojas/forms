inputSchema:
  type: object
  properties:
    title: Wine Tasting Evaluation Form
    pages:
    - id: 1
      name: form_data
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: appearance
      label: Wine Appearance
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: aroma
      label: Aroma
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: taste
      label: Taste
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: finish
      label: Finish
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: overall_impression
      label: Overall Impression
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: wine_name
      label: Name Of Wine
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: wine_type
      label: Type Of Wine
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Red'', ''label'': ''Red''}'
      - '{''id'': 2, ''name'': ''White'', ''label'': ''White''}'
      - '{''id'': 3, ''name'': ''Sparkling'', ''label'': ''Sparkling''}'
      required: false
    - id: 9
      name: region
      label: Region
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''Bordeaux'', ''label'': ''Bordeaux''}'
      - '{''id'': 2, ''name'': ''Burgundy'', ''label'': ''Burgundy''}'
      - '{''id'': 3, ''name'': ''Rioja'', ''label'': ''Rioja''}'
      required: false
    - id: 10
      name: vintage
      label: Vintage
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': 1990, ''label'': 1990}'
      - '{''id'': 2, ''name'': 1995, ''label'': 1995}'
      - '{''id'': 3, ''name'': 2000, ''label'': 2000}'
      required: false
