inputSchema:
  type: object
  properties:
    title: Church Ministry Evaluation Form
    pages:
    - id: 1
      name: evaluation_intro
      label: -- Church Ministry Feedback --
      hint: Please help us improve by providing honest feedback
      type: note
      options: []
      required: false
    - id: 2
      name: ministry_name
      label: Ministry Being Evaluated
      hint: e.g., Youth, Worship, Children's
      type: text
      options: []
      required: true
    - id: 3
      name: your_role
      label: Your Role in this Ministry
      hint: null
      type: select_one
      options:
      - Regular Participant
      - Occasional Attendee
      - Volunteer
      - Leader/Coordinator
      required: true
    - id: 4
      name: leadership_effectiveness
      label: Rate the effectiveness of the ministry leadership
      hint: 1 being poor, 5 being excellent
      type: number
      options: []
      required: true
    - id: 5
      name: communication_quality
      label: How would you rate the communication within this ministry?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: spiritual_impact
      label: Has this ministry helped you grow spiritually?
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Agree
      - Neutral
      - Disagree
      - Strongly Disagree
      required: true
    - id: 7
      name: ministry_strengths
      label: What are the main strengths of this ministry?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: improvement_areas
      label: What areas could be improved?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: resource_adequacy
      label: Are the resources (physical, financial, etc.) adequate for this ministry?
      hint: null
      type: select_one
      options:
      - Yes, completely
      - Mostly adequate
      - Not really
      - Not at all
      required: false
    - id: 10
      name: meeting_frequency_rating
      label: Is the frequency of meetings/events appropriate?
      hint: null
      type: select_one
      options:
      - Too frequent
      - Just right
      - Not frequent enough
      required: false
    - id: 11
      name: inclusivity_rating
      label: How welcoming is this ministry to new people?
      hint: null
      type: select_one
      options:
      - Very welcoming
      - Somewhat welcoming
      - Neutral
      - Not very welcoming
      required: false
    - id: 12
      name: specific_event_feedback
      label: Feedback on a specific recent event (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: suggestion_box
      label: Any other suggestions or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: follow_up_permission
      label: May we contact you to discuss your feedback?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: date_submitted
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: true
