inputSchema:
  type: object
  properties:
    title: Teacher Effectiveness Review Evaluation Form
    pages:
    - id: 1
      name: effectiveness_delivery
      label: How effective is the teacher in delivering the course material?
      hint: null
      type: select_multiple
      options:
      - Very effective
      - Somewhat effective
      - Not very effective
      - Not at all effective
      required: true
    - id: 2
      name: teaching_style
      label: How would you rate the teacher's teaching style?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: teaching_engagement
      label: How engaging is the teacher in class?
      hint: null
      type: select_multiple
      options:
      - Very engaging
      - Somewhat engaging
      - Not very engaging
      - Not at all engaging
      required: true
    - id: 4
      name: communication_skills
      label: How would you rate the teacher's communication skills?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: classroom_management
      label: How well does the teacher manage classroom behavior?
      hint: null
      type: select_multiple
      options:
      - Very well
      - Somewhat well
      - Not very well
      - Not at all well
      required: true
    - id: 6
      name: adaptability
      label: How would you rate the teacher's ability to adapt to student needs?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: overall_effectiveness
      label: What is your overall rating of the teacher's effectiveness?
      hint: null
      type: select_one
      options:
      - Very effective
      - Somewhat effective
      - Not very effective
      - Not at all effective
      required: true
