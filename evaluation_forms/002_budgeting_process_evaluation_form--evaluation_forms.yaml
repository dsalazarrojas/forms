inputSchema:
  type: object
  properties:
    title: Budgeting Process Evaluation Form
    pages:
      - id: 1
        name: respondent_info_section
        label: -- Respondent Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_department
        label: Your department or team
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: respondent_role
        label: Your role in the budgeting process
        hint: null
        type: select_one
        options:
          - Budget manager
          - Department head
          - Finance team member
          - Project manager
          - Other
        required: true
      - id: 4
        name: budget_cycle_year
        label: Which budget cycle is this evaluation for?
        hint: null
        type: text
        options: []
        required: true
      - id: 5
        name: evaluation_section
        label: -- Process Evaluation --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: clarity_of_guidelines
        label: How clear were the budgeting guidelines and instructions?
        hint: null
        type: select_one
        options:
          - Very clear
          - Clear
          - Somewhat clear
          - Unclear
          - Very unclear
        required: true
      - id: 7
        name: timeline_adequacy
        label: Was the timeline for budget submission adequate?
        hint: null
        type: select_one
        options:
          - More than adequate
          - Adequate
          - Somewhat tight
          - Very tight
          - Impossible
        required: true
      - id: 8
        name: communication_effectiveness
        label: How effective was communication from the finance team?
        hint: null
        type: select_one
        options:
          - Excellent
          - Good
          - Adequate
          - Poor
          - Very poor
        required: true
      - id: 9
        name: collaboration_level
        label: Rate the level of collaboration between departments
        hint: null
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very poor
        required: true
      - id: 10
        name: tool_usability
        label: How user-friendly was the budgeting software or tools?
        hint: null
        type: select_one
        options:
          - Very user-friendly
          - User-friendly
          - Acceptable
          - Difficult
          - Very difficult
        required: true
      - id: 11
        name: data_availability
        label: Was necessary data readily available for your budget preparation?
        hint: null
        type: select_one
        options:
          - Always available
          - Usually available
          - Sometimes available
          - Rarely available
          - Never available
        required: true
      - id: 12
        name: feedback_process
        label: Was the feedback process fair and transparent?
        hint: null
        type: select_one
        options:
          - Very fair
          - Fair
          - Neutral
          - Unfair
          - Very unfair
        required: true
      - id: 13
        name: challenges_section
        label: -- Challenges and Improvements --
        hint: null
        type: note
        options: []
        required: false
      - id: 14
        name: primary_challenges
        label: What were the main challenges you faced?
        hint: null
        type: select_multiple
        options:
          - Unclear requirements
          - Tight deadlines
          - Data accessibility issues
          - Tool malfunctions
          - Lack of communication
          - Conflicting priorities
          - Insufficient training
        required: true
      - id: 15
        name: improvement_suggestions
        label: Suggestions for improving the budgeting process
        hint: Please be specific
        type: text
        options: []
        required: false
      - id: 16
        name: training_needs
        label: What training would help improve the process?
        hint: null
        type: select_multiple
        options:
          - Software training
          - Budget methodology
          - Data analysis
          - Project management
          - Communication skills
          - Financial planning
        required: false
      - id: 17
        name: overall_satisfaction
        label: Overall satisfaction with the budgeting cycle
        hint: null
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 18
        name: likelihood_improvement
        label: Likelihood that suggested improvements will be implemented
        hint: null
        type: select_one
        options:
          - Very likely
          - Likely
          - Uncertain
          - Unlikely
          - Very unlikely
        required: false
      - id: 19
        name: additional_comments
        label: Additional comments or concerns
        hint: null
        type: text
        options: []
        required: false
