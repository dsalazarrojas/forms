inputSchema:
  type: object
  properties:
    title: Student Grade And Assessment Tracking Form
    pages:
    - id: 1
      name: general_info
      label: general_info
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: student_name
      label: student_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: assessment_date
      label: assessment_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: assessment_time
      label: assessment_time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: assessment_grade
      label: assessment_grade
      hint: null
      type: select_one
      options:
      - A
      - B
      - C
      required: false
    - id: 6
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: student_email
      label: student_email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: student_phone
      label: student_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: teacher_notes
      label: teacher_notes
      hint: null
      type: text
      options: []
      required: false
