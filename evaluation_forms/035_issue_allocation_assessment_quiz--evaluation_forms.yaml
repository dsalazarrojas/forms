    - id: 2
      name: allocate_issue_to_team
      label: Which team is most likely to be able to solve it
      hint: null
      type: select_one
      options:
      - Team A
      - Team B
      - Team C
      required: false
    - id: 3
      name: allocate_issue_to_individual
      label: Which individual is most likely to be able to solve it
      hint: null
      type: select_one
      options:
      - Individual A
      - Individual B
      - Individual C
      required: false
    - id: 4
      name: allocate_issues_to_reallocation
      label: Is this reallocation of issues to a team or individual more likely
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
