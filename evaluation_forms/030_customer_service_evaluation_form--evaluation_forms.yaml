      name: customer_service_form
      label: Customer Service
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 3
      name: feedback
      label: Feedback
      hint: null
