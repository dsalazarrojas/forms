inputSchema:
  type: object
  properties:
    title: Bachelor Program Evaluation Form
    pages:
    - id: 1
      name: student_name
      label: Student name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: program_name
      label: Program name
      hint: Degree program being evaluated
      type: text
      options: []
      required: true
    - id: 3
      name: evaluation_period
      label: Evaluation period
      hint: e.g., 2025-2026 academic year
      type: text
      options: []
      required: true
    - id: 4
      name: curriculum_relevance
      label: Curriculum relevance rating
      hint: 1 low to 5 high
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 5
      name: teaching_quality
      label: Teaching quality
      hint: Rate instructors and delivery
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 6
      name: academic_support
      label: Academic support services
      hint: Availability and usefulness
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: false
    - id: 7
      name: resources_and_facilities
      label: Resources and facilities
      hint: Libraries labs equipment
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: false
    - id: 8
      name: career_services
      label: Career services effectiveness
      hint: Support for internships and employment
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall satisfaction
      hint: 1 low to 5 high
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Suggestions and open feedback
      type: text
      options: []
      required: false
