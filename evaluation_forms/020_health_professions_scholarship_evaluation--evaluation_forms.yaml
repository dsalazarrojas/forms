inputSchema:
  type: object
  properties:
    title: Health Professions Scholarship Evaluation
    pages:
    - id: 1
      name: candidate_info
      label: candidate_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reviewer_info
      label: reviewer_info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: evaluation_criteria
      label: evaluation_criteria
      hint: null
      type: select_one
      options:
      - Communication
      - Interpersonal Skills
      - Professionalism
      - Problem Solving
      - Teamwork
      - Time Management
      required: true
    - id: 4
      name: feedback
      label: feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: overall_rating
      label: overall_rating
      hint: null
      type: select_multiple
      options:
      - 1 - Excellent
      - 2 - Good
      - 3 - Fair
      - 4 - Needs Improvement
      required: true
    - id: 6
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date_of_evaluation
      label: date_of_evaluation
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: review_time
      label: review_time
      hint: null
      type: time
      options: []
      required: true
