inputSchema:
  type: object
  properties:
    title: Startup Mentorship Program Impact Evaluation Form
    pages:
    - id: 1
      name: startup_mission
      label: What is the purpose of the startup?
      hint: Please describe the purpose of the startup.
      type: text
      options: []
      required: true
    - id: 2
      name: mission_alignment
      label: How has the program impacted the startup's mission?
      hint: Please provide examples of how the program has impacted the startup's
        mission.
      type: text
      options: []
      required: true
    - id: 3
      name: mentorship_outcomes
      label: What positive outcomes have the startup achieved through the program?
      hint: Please list the positive outcomes achieved by the startup through the
        program.
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 4
      name: evaluation_frequency
      label: How has the program's impact on the startup been evaluated?
      hint: Please describe the evaluation frequency of the program's impact.
      type: select_one
      options:
      - Quarterly
      - Bi-Annually
      - Annually
      required: true
    - id: 5
      name: evaluation_outcomes
      label: What outcomes have the program evaluations led to?
      hint: Please describe the outcomes of the program evaluations.
      type: text
      options: []
      required: true
    - id: 6
      name: form_submission
      label: What is the status of the form submission?
      hint: Please describe the status of the form submission.
      type: text
      options: []
      required: false
    - id: 7
      name: startup_support
      label: Has the startup received support through the program?
      hint: Please respond with True or False.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: startup_support_funding
      label: How much funding has the startup received from the program?
      hint: Please provide the funding amount.
      type: number
      options: []
      required: true
    - id: 9
      name: startup_evaluation_support
      label: Has the program's support impacted the startup's mission?
      hint: Please respond with True or False.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: form_submission_status_other
      label: Form Submission Status Other
      hint: Please describe the status of the form submission.
      type: text
      options: []
      required: false
