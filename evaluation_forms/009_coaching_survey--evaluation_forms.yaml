        name: athlete_motivation
        label: Ability to motivate and inspire athletes
        hint: null
        type: select_one
        options:
          - "1 - Poor"
          - "2 - Fair"
          - "3 - Good"
          - "4 - Very Good"
          - "5 - Excellent"
        required: true
      - id: 11
        name: training_planning
        label: Quality of training planning and organization
        hint: null
        type: select_one
        options:
          - "1 - Poor"
          - "2 - Fair"
          - "3 - Good"
          - "4 - Very Good"
          - "5 - Excellent"
