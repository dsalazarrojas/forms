inputSchema:
  type: object
  properties:
    title: Coaching Survey
    pages:
      - id: 1
        name: section_club_info
        label: -- Club Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: club_name
        label: Club Name
        hint: Name of the sports club or organization
        type: text
        options: []
        required: true
      - id: 3
        name: respondent_name
        label: Respondent Name
        hint: Person completing this survey
        type: text
        options: []
        required: true
      - id: 4
        name: respondent_role
        label: Your Role in the Club
        hint: Position or title
        type: select_one
        options:
          - Club Manager
          - Committee Member
          - Administrator
          - Coach
          - Member
          - Other
        required: true
      - id: 5
        name: section_coach_performance
        label: -- Coach Performance Evaluation --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: coach_name
        label: Coach Being Evaluated
        hint: Name of the coach
        type: text
        options: []
        required: true
      - id: 7
        name: coaching_tenure
        label: How long has this coach worked with your club
        hint: Approximate duration
        type: select_one
        options:
          - Less than 3 months
          - 3-6 months
          - 6-12 months
          - 1-2 years
          - 2-5 years
          - More than 5 years
        required: true
      - id: 8
        name: technical_knowledge
        label: Coach technical knowledge and expertise
        hint: Rate from 1 - poor to 5 - excellent
        type: select_one
        options:
