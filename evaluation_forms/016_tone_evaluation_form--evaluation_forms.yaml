inputSchema:
  type: object
  properties:
    title: Tone Evaluation Form
    pages:
    - id: 1
      name: writing_style
      label: Writing Style
      hint: null
      type: select_multiple
      options:
      - Friendly
      - Objective
      - Informal
      - Formal
      required: false
