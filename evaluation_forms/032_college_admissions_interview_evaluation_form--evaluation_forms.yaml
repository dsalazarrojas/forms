      hint: Start time
      type: time
      options: []
      required: true
    - id: 6
      name: interview_location
      label: Interview Location
      hint: Where held
      type: select_one
      options:
      - On Campus
      - Off Campus
      - Virtual Video
      - Phone
      - Alumni Event
      required: true
    - id: 7
      name: interview_duration
      label: Interview Duration
      hint: How long
      type: select_one
      options:
      - 15-20 minutes
      - 20-30 minutes
      - 30-45 minutes
      - 45-60 minutes
      - Over 60 minutes
      required: true
