inputSchema:
  type: object
  properties:
    title: College Admissions Interview Evaluation Form
    pages:
    - id: 1
      name: interviewer_name
      label: Interviewer Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 2
      name: interviewer_email
      label: Email Address
      hint: Work email
      type: email
      options: []
      required: true
    - id: 3
      name: interviewer_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
