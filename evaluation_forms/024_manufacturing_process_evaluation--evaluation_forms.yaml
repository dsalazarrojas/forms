inputSchema:
  type: object
  properties:
    title: Manufacturing Process Evaluation
    pages:
    - id: 1
      name: process_steps
      label: Process Steps
      hint: Describe the process steps used in the manufacturing process
      type: text
      options: []
      required: true
    - id: 2
      name: safety_checklist
      label: Safety Checklist
      hint: Check all the applicable safety checks
      type: select_multiple
      options:
      - Compliance 1
      - Compliance 2
      - Compliance 3
      required: true
    - id: 3
      name: quality_checks
      label: Quality Checks
      hint: Select one quality check that applies to the process
      type: select_one
      options:
      - Check 1
      - Check 2
      - Check 3
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: Add any comments on the process
      type: text
      options: []
      required: true
    - id: 5
      name: time_required
      label: Time Required
      hint: Select the time required for the process
      type: select_one
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-4 hours
      - More than 4 hours
      required: true
    - id: 6
      name: submitter
      label: Submitter
      hint: Enter your name and title
      type: text
      options: []
      required: true
    - id: 7
      name: comments_submitter
      label: Comments from Submitter
      hint: Add any comments from the submitter
      type: text
      options: []
      required: true
