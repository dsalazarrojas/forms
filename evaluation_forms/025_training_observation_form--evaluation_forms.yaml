inputSchema:
  type: object
  properties:
    title: Training Observation Form
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: trainee_information
      label: Trainee Information
      hint: Enter trainee information
      type: text
      options: []
      required: false
    - id: 3
      name: trainer_evaluation
      label: Trainer Evaluation
      hint: Enter trainer evaluation
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Excellent''}'
      - '{''id'': 2, ''label'': ''Good''}'
      - '{''id'': 3, ''label'': ''Fair''}'
      - '{''id'': 4, ''label'': ''Poor''}'
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: date_and_time
      label: Date and Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: trainer_signature
      label: Trainer Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: trainee_signature
      label: Trainee Signature
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
