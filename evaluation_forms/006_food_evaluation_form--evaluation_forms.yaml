inputSchema:
  type: object
  properties:
    title: Food Evaluation Form
    pages:
    - id: 1
      name: name
      label: Food
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: food_quality
      label: Quality of Food
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: service_quality
      label: Quality of Service
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: food_price
      label: Price of Food
      hint: On a scale of 1 to 10
      type: number
      options: []
      required: true
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: On a scale of 1 to 10
      type: number
      options: []
      required: true
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: Enter your email
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: assigned_tool
      label: Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
    - id: 12
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Evaluation Forms
      - Other
      required: true
    - id: 13
      name: category_other
      label: Other Category
      hint: null
      type: select_multiple
      options:
      - Other
      - Other
      required: false
    - id: 14
      name: comments
      label: Comments
      hint: Write your comments
      type: text
      options: []
      required: false
