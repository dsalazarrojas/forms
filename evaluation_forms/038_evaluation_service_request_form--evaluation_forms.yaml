inputSchema:
  type: object
  properties:
    title: Evaluation Service Request Form
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Provide your business name and contact information.
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Enter your email address.
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Enter your phone number.
      type: text
      options: []
      required: true
    - id: 4
      name: description
      label: Description of Service Request
      hint: Please describe the service you are requesting.
      type: text
      options: []
      required: true
    - id: 5
      name: select_one
      label: Preferred Time of Day
      hint: Select your preferred time of day for the evaluation.
      type: select_one
      options:
      - 08:00 AM - 10:00 AM
      - 10:00 AM - 12:00 PM
      - 12:00 PM - 02:00 PM
      - 02:00 PM - 04:00 PM
      - 04:00 PM - 06:00 PM
      - 06:00 PM - 08:00 PM
      - 08:00 PM - 10:00 PM
      required: true
    - id: 6
      name: date
      label: Preferred Date and Time
      hint: Select your preferred date and time for the evaluation.
      type: date
      options: []
      required: true
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: Specify the tool(s) to be used during the evaluation.
      type: text
      options: []
      required: true
    - id: 8
      name: category
      label: Category
      hint: Select the category of the evaluation.
      type: select_one
      options:
      - Quality
      - Safety
      - Security
      required: true
    - id: 9
      name: select_multiple
      label: Select Multiple Locations
      hint: Select multiple locations for the evaluation.
      type: select_multiple
      options:
      - Location 1
      - Location 2
      - Location 3
      required: true
    - id: 10
      name: note
      label: Additional Notes
      hint: Please provide any additional comments or notes.
      type: note
      options: []
      required: false
    - id: 11
      name: repeat_category
      label: Repeat Category
      hint: Another category for evaluation.
      type: text
      options: []
      required: false
    - id: 12
      name: more_repeat_category
      label: More Repeat Category
      hint: Yet another category for evaluation.
      type: text
      options: []
      required: false
    - id: 13
      name: another_repeat_category
      label: Another Repeat Category
      hint: Another category for evaluation.
      type: text
      options: []
      required: false
    - id: 14
      name: last_repeat_category
      label: Last Repeat Category
      hint: The last category for evaluation.
      type: text
      options: []
      required: false
