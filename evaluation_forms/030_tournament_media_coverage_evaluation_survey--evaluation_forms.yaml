inputSchema:
  type: object
  properties:
    title: Tournament Media Coverage Evaluation Survey
    pages:
    - id: 1
      name: event_organizers
      label: Event Organizers
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: event_info
      label: Event Info
      hint: Provide a brief description of the event.
      type: text
      options: []
      required: false
    - id: 3
      name: media_coverage_quality
      label: Media Coverage Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: audience_reach
      label: Audience Reach
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: improvement_ideas
      label: Improvement Ideas
      hint: Provide any thoughts or suggestions for improvement.
      type: note
      options: []
      required: false
    - id: 6
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - Jim
      - Jane
      - John
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: event_date
      label: Event Date
      hint: Provide the event date (mm/dd/yyyy).
      type: date
      options: []
      required: false
    - id: 10
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
