      hint: Enter your most recent weight
      type: decimal
      options: []
      required: false
    - id: 11
      name: target_weight
      label: Target weight (kg)
      hint: Your goal weight for the challenge
      type: decimal
      options: []
      required: false
    - id: 12
      name: current_body_fat
