inputSchema:
  type: object
  properties:
    title: music_evaluation_form
    pages:
    - id: 1
      name: music_style
      label: What is the style of this music piece?
      hint: null
      type: select_one
      options:
      - Classical
      - Jazz
      - Pop
      - Rock
      - Folk
      - Electronic
      - R&B
      - Hip-Hop
      required: true
    - id: 2
      name: music_period
      label: Which period is this music piece from?
      hint: null
      type: select_one
      options:
      - Baroque
      - Classical
      - Romantic
      - Impressionist
      - Modern
      - Contemporary
      required: true
    - id: 3
      name: music_genre
      label: What is the genre of this music piece?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: music_length
      label: How long is this music piece?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: music_period_date
      label: When is this music piece from?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: evaluation_category
      label: What is your evaluation category for this music piece?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: music_style_multiple
      label: What are the styles of this music piece?
      hint: null
      type: select_multiple
      options:
      - Classical
      - Jazz
      - Pop
      - Rock
      - Folk
      - Electronic
      - R&B
      - Hip-Hop
      required: true
    - id: 8
      name: music_period_single
      label: Is this music piece from a specific period?
      hint: null
      type: select_one
      options:
      - Baroque
      - Classical
      - Romantic
      - Impressionist
      - Modern
      - Contemporary
      - Folk
      - Jazz
      required: true
    - id: 9
      name: period_rating
      label: How would you rate this music piece's period?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: evaluation_category2
      label: Evaluation Category2
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: music_period_multiple
      label: Are there other notable characteristics of this music piece?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: period_confirmation
      label: Period Confirmation
      hint: null
      type: select_one
      options:
      - Baroque
      - Classical
      - Romantic
      - Impressionist
      - Modern
      - Contemporary
      - Folk
      - Jazz
      required: true
