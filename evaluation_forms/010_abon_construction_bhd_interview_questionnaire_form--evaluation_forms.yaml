inputSchema:
  type: object
  properties:
    title: Abon Construction Bhd Interview Questionnaire Form
    pages:
    - id: 1
      name: section_header_candidate_details
      label: -- Candidate Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: candidate_name
      label: Candidate full name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: candidate_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: candidate_phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: position_applied
      label: Position applied for
      hint: null
      type: select_one
      options:
      - Site Supervisor
      - Project Engineer
      - Quantity Surveyor
      - Safety Officer
      - General Worker
      - Administrative Staff
      - Other
      required: true
    - id: 6
      name: interview_date
      label: Date of interview
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: interviewer_name
      label: Interviewer name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_header_qualifications
      label: -- Qualifications and Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: education_level
      label: Highest education level
      hint: null
      type: select_one
      options:
      - SPM or equivalent
      - Diploma
      - Bachelor's Degree
      - Master's Degree
      - Professional Certification
      - Other
      required: true
    - id: 10
      name: years_construction_experience
      label: Years of experience in construction industry
      hint: null
      type: select_one
      options:
      - None
      - Less than 2 years
      - 2 to 5 years
      - 5 to 10 years
      - More than 10 years
      required: true
    - id: 11
      name: relevant_certifications
      label: List any relevant certifications or licenses
      hint: e.g. CIDB Green Card, OSHA, NIOSH
      type: text
      options: []
      required: false
    - id: 12
      name: section_header_evaluation
      label: -- Interview Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: technical_knowledge_rating
      label: Technical knowledge rating
      hint: 1 = Poor, 5 = Excellent
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 14
      name: communication_rating
      label: Communication skills rating
      hint: 1 = Poor, 5 = Excellent
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 15
      name: teamwork_rating
      label: Teamwork and collaboration rating
      hint: 1 = Poor, 5 = Excellent
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 16
      name: safety_awareness_rating
      label: Safety awareness rating
      hint: 1 = Poor, 5 = Excellent
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 17
      name: strengths_observed
      label: Key strengths observed
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: areas_of_concern
      label: Areas of concern or improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: hiring_recommendation
      label: Hiring recommendation
      hint: null
      type: select_one
      options:
      - Strongly Recommend
      - Recommend
      - Recommend with Reservations
      - Do Not Recommend
      required: true
    - id: 20
      name: additional_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
