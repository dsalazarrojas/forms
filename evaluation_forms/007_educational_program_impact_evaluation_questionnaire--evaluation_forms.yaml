inputSchema:
  type: object
  properties:
    title: Educational Program Impact Evaluation Questionnaire
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_info
      label: Participant Info
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: program_details
      label: Program Details
      hint: null
      type: select_multiple
      options:
      - Program Name
      - Program Type
      - Program Description
      - Program Date
      - Program Location
      - Number of Participants
      required: false
    - id: 4
      name: training_session
      label: Training Session
      hint: null
      type: select_one
      options:
      - Session 1
      - Session 2
      - Session 3
      - Session 4
      - Session 5
      - Other (Specify)
      required: false
    - id: 5
      name: feedback_rating
      label: Feedback and Rating
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 6
      name: participant_experience
      label: Participant Experience
      hint: null
      type: select_multiple
      options:
      - Positive
      - Somewhat Positive
      - Neutral
      - Somewhat Negative
      - Negative
      required: false
    - id: 7
      name: outcome_rating
      label: Outcome Rating
      hint: null
      type: select_one
      options:
      - Very Successful
      - Somewhat Successful
      - Neutral
      - Somewhat Unsuccessful
      - Very Unsuccessful
      required: false
    - id: 8
      name: outcome_expectation
      label: Outcome Expectation
      hint: null
      type: select_one
      options:
      - Much More Than Expected
      - Somewhat More Than Expected
      - As Expected
      - Somewhat Less Than Expected
      - Much Less Than Expected
      required: false
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: program_rating
      label: Program Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 13
      name: overall_rating
      label: Overall Rating
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 14
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
