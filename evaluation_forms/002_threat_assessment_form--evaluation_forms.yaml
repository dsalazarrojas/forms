inputSchema:
  type: object
  properties:
    title: Threat Assessment Form
    pages:
    - id: 1
      name: threat_assessment_form_1
      label: threat_assessment_form_1_label
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: threat_level
      label: threat_level_label
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 3
      name: threat_category
      label: threat_category_label
      hint: null
      type: select_multiple
      options:
      - Cyber
      - Physical
      - Environmental
      - Social
      required: false
    - id: 4
      name: threat_frequency
      label: threat_frequency_label
      hint: null
      type: select_one
      options:
      - Rare
      - Occasional
      - Frequent
      required: false
    - id: 5
      name: threat_impact
      label: threat_impact_label
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: threat_probability
      label: threat_probability_label
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: threat_risk_level
      label: threat_risk_level_label
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: threat_assessment
      label: threat_assessment_label
      hint: null
      type: select_one
      options:
      - Accepted
      - Recommended
      - Not Recommended
      required: false
    - id: 9
      name: mitigation_plan
      label: mitigation_plan_label
      hint: null
      type: text
      options: []
      required: false
