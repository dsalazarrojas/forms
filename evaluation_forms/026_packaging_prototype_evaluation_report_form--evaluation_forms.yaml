inputSchema:
  type: object
  properties:
    title: Packaging Prototype Evaluation Report Form
    pages:
    - id: 1
      name: overall_impression
      label: What's your overall impression of the packaging prototype?
      hint: Please rate your overall impression of the packaging prototype.
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 2
      name: comments
      label: Comments
      hint: Share your thoughts on the packaging prototype.
      type: note
      options: []
      required: true
    - id: 3
      name: signature
      label: Signature
      hint: Sign your name.
      type: time
      options: []
      required: true
    - id: 4
      name: design
      label: How do you like the overall design of the packaging prototype?
      hint: Rate the design of the packaging prototype.
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 5
      name: functionality
      label: What is your rating for the packaging prototype's functionality?
      hint: Rate the functionality of the packaging prototype.
      type: select_multiple
      options:
      - Good
      - Fair
      required: true
    - id: 6
      name: usability
      label: How user-friendly is the packaging prototype?
      hint: Rate the user-friendliness of the packaging prototype.
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 7
      name: time_spent
      label: How many hours would you spend using the packaging prototype in a typical
        day?
      hint: Estimate the time you would spend using the packaging prototype.
      type: number
      options: []
      required: true
    - id: 8
      name: comments2
      label: Comments2
      hint: Share your thoughts on the packaging prototype.
      type: note
      options: []
      required: false
    - id: 9
      name: benefit
      label: What is the primary benefit of the packaging prototype?
      hint: Describe the primary benefit of the packaging prototype.
      type: text
      options: []
      required: true
    - id: 10
      name: user_experience
      label: What's your overall rating for the packaging prototype's user experience?
      hint: Rate the user experience of the packaging prototype.
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 11
      name: comments3
      label: Comments3
      hint: Share your thoughts on the packaging prototype.
      type: note
      options: []
      required: false
    - id: 12
      name: will_use
      label: Would you use the packaging prototype in your work/project/personal life?
      hint: Would you use the packaging prototype?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: comments4
      label: Comments4
      hint: Share your thoughts on the packaging prototype.
      type: note
      options: []
      required: false
