inputSchema:
  type: object
  properties:
    title: Workplace Training Materials Feedback Evaluation Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: course_title
      label: Course Title
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: training_session
      label: Training Session
      hint: null
      type: select_one
      options:
      - Online Training
      - Classroom Training
      - Video Conference
      - Other
      - Self Learning
      required: true
    - id: 6
      name: date_attended
      label: Date Attended
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_one
      options:
      - Scale 1-5
      - Other
      required: true
    - id: 8
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: E-Mail
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: training_materials
      label: Training Materials
      hint: null
      type: select_multiple
      options:
      - Online Training Materials
      - Classroom Training Materials
      - Video Conference Materials
      - Other
      required: false
    - id: 14
      name: training_provided_by
      label: Training Provided By
      hint: null
      type: select_one
      options:
      - Manager
      - Supervisor
      - Peer
      - Training Provider
      required: true
    - id: 15
      name: training_effectiveness
      label: How Effective Was The Training?
      hint: null
      type: select_one
      options:
      - Very Effective
      - Somewhat Effective
      - Neutral
      - Somewhat Ineffective
      - Very Ineffective
      required: true
    - id: 16
      name: will_recommend
      label: Would You Recommend This Training To Others?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: true
