inputSchema:
  type: object
  properties:
    title: Appraisal Dispute Form
    pages:
    - id: 1
      name: property_details
      label: Property Details
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: property_county
      label: County
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: property_state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: owner_info
      label: Owner Information
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: owner_name
      label: Owner Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: owner_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: owner_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: dispute_info
      label: Dispute Information
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: appraised_value
      label: Appraised Value
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: disputed_value
      label: Your Estimated Value
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: dispute_reason
      label: Reason for Dispute
      hint: null
      type: select_multiple
      options:
      - Comparable Properties
      - Property Features
      - Recent Improvements
      - Market Conditions
      - Valuation Error
      - Other
      required: true
    - id: 13
      name: dispute_details
      label: Detailed Explanation
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: supporting_docs
      label: Supporting Documentation Attached
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
