    - id: 11
      name: knee_range
      label: Knee Range
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: knee_stability
      label: Knee Stability
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: knee_alignment
      label: Knee Alignment
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
