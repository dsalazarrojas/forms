        name: compassion_empathy
        label: Compassion and Empathy for Patients
        hint: Shows genuine care and concern
        type: select_one
        options:
          - Excellent - very compassionate
          - Good - shows compassion
          - Satisfactory - adequate empathy
          - Needs improvement - limited empathy
          - Unsatisfactory - lacks compassion
        required: true
      - id: 12
        name: communication_skills
        label: Communication Skills
        hint: With patients, families, and team
        type: select_one
        options:
          - Excellent - excellent communicator
          - Good - communicates well
          - Satisfactory - adequate communication
          - Needs improvement - some challenges
          - Unsatisfactory - poor communication
        required: true
      - id: 13
        name: reliability_attendance
