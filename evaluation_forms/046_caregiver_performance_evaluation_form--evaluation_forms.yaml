        label: Quality of Patient Care Provided
        hint: Excellence in direct care tasks
        type: select_one
        options:
          - Excellent - consistently excellent care
          - Good - good quality care
          - Satisfactory - meets standards
          - Needs improvement - below standards
          - Unsatisfactory - poor care quality
        required: true
