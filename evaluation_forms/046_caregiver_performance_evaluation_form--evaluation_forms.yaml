        hint: Objectives for upcoming evaluation period
        type: text
        options: []
        required: false
      - id: 24
        name: training_recommendations
        label: Recommended Training or Development
        hint: Specific training opportunities
        type: text
        options: []
        required: false
      - id: 25
        name: overall_performance
        label: Overall Performance Rating
        hint: Overall assessment
        type: select_one
        options:
          - Excellent - exceeds expectations
          - Good - meets and exceeds expectations
          - Satisfactory - meets expectations
          - Needs improvement - below expectations
          - Unsatisfactory - significantly below expectations
        required: true
      - id: 26
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback or observations
        type: text
        options: []
        required: false
