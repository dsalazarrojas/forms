          - Satisfactory - adequate documentation
          - Needs improvement - incomplete records
          - Unsatisfactory - poor documentation
        required: true
      - id: 19
        name: problem_solving
        label: Problem-Solving and Initiative
        hint: Takes action to solve issues
        type: select_one
        options:
          - Excellent - proactive problem-solver
          - Good - good problem-solving
          - Satisfactory - basic problem-solving
          - Needs improvement - limited initiative
          - Unsatisfactory - poor problem-solving
        required: true
      - id: 20
        name: professional_development
        label: Commitment to Professional Development
        hint: Continues learning and skill development
        type: select_one
        options:
