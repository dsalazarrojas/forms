inputSchema:
  type: object
  properties:
    title: AAC Incident Report
    pages:
    - id: 1
      name: section_header_event
      label: '--- Event Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Name of the sports event
      hint: Enter the official name of the event
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Date of the event
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: event_time
      label: Time of incident
      hint: Approximate time when incident occurred
      type: time
      options: []
      required: true
    - id: 5
      name: venue_location
      label: Venue/location of incident
      hint: Stadium, field, gym name and address
      type: text
      options: []
      required: true
    - id: 6
      name: reporting_official
      label: Reporting official name
      hint: Name of person filing this report
      type: text
      options: []
      required: true
    - id: 7
      name: section_header_incident
      label: '--- Incident Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: incident_type
      label: Type of incident
      hint: Select the primary category of incident
      type: select_one
      options:
      - Player misconduct
      - Spectator disturbance
      - Coaching violation
      - Safety concern
      - Equipment failure
      - Weather-related
      - Medical emergency
      required: true
    - id: 9
      name: severity_level
      label: Severity level
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Critical
      required: true
    - id: 10
      name: involved_parties
      label: Parties involved
      hint: Names of players, coaches, or spectators involved
      type: text
      options: []
      required: false
    - id: 11
      name: incident_description
      label: Detailed description of incident
      hint: Provide a factual account of what happened
      type: text
      options: []
      required: true
    - id: 12
      name: witnesses_present
      label: Were witnesses present?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: true
    - id: 13
      name: witness_names
      label: Witness names (if any)
      hint: Names and contact information of witnesses
      type: text
      options: []
      required: false
    - id: 14
      name: section_header_resolution
      label: '--- Resolution and Actions ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: immediate_action_taken
      label: Immediate action taken
      hint: What was done right after the incident
      type: text
      options: []
      required: false
    - id: 16
      name: disciplinary_recommendation
      label: Disciplinary recommendation
      hint: Suggested consequences or actions
      type: select_one
      options:
      - Warning
      - Suspension
      - Disqualification
      - Fine
      - Probation
      - No action needed
      - Further investigation required
      required: false
    - id: 17
      name: follow_up_required
      label: Is follow-up required?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: follow_up_date
      label: Follow-up date
      hint: Date for next review or hearing
      type: date
      options: []
      required: false
    - id: 19
      name: additional_comments
      label: Additional comments or notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
