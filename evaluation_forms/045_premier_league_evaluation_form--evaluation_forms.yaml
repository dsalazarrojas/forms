inputSchema:
  type: object
  properties:
    title: Premier League Evaluation Form
    pages:
    - id: 1
      name: player_name
      label: Player Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: game_position
      label: game_position
      hint: null
      type: select_one
      options:
      - Goalkeeper
      - Defender
      - Midfielder
      - Forward
      required: false
    - id: 3
      name: coach_name
      label: Coach Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: player_rating
      label: Player Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
