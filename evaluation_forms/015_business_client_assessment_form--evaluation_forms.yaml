inputSchema:
  type: object
  properties:
    title: Business Client Assessment Form
    pages:
    - id: 1
      name: client_information
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: Full name of client
      type: text
      options: []
      required: true
    - id: 3
      name: client_company
      label: Client Company
      hint: Client's company name
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Client Email
      hint: Business email address
      type: email
      options: []
      required: true
    - id: 5
      name: client_phone
      label: Client Phone
      hint: Business contact number
      type: text
      options: []
      required: true
    - id: 6
      name: industry_sector
      label: Industry Sector
      hint: Client's primary industry
      type: text
      options: []
      required: true
    - id: 7
      name: relationship_length
      label: Client Relationship Length
      hint: How long have you worked together
      type: select_one
      options:
      - Less than 6 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - 5+ years
      required: true
    - id: 8
      name: business_assessment
      label: -- Business Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: annual_revenue
      label: Client Annual Revenue
      hint: Approximate annual revenue range
      type: select_one
      options:
      - Under 1 million
      - 1-5 million
      - 5-10 million
      - 10-50 million
      - 50-100 million
      - 100+ million
      required: true
    - id: 10
      name: employee_count
      label: Number of Employees
      hint: Total employee count
      type: select_one
      options:
      - 1-10
      - 11-50
      - 51-250
      - 251-1000
      - 1000+
      required: true
    - id: 11
      name: market_position
      label: Market Position
      hint: Client's competitive position
      type: select_one
      options:
      - Market Leader
      - Strong Competitor
      - Stable Player
      - Emerging Player
      - Niche Provider
      required: true
    - id: 12
      name: growth_trajectory
      label: Growth Trajectory
      hint: Current business growth status
      type: select_one
      options:
      - Rapidly Growing
      - Steady Growth
      - Stable
      - Declining
      - Turnaround Mode
      required: true
    - id: 13
      name: financial_health
      label: Financial Health
      hint: Overall financial condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Concerning
      - At Risk
      required: true
    - id: 14
      name: credit_rating
      label: Credit Rating/History
      hint: Payment history assessment
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - No History
      required: true
    - id: 15
      name: operational_assessment
      label: -- Operational Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: operational_efficiency
      label: Operational Efficiency
      hint: How efficiently client operates
      type: select_one
      options:
      - Highly Efficient
      - Efficient
      - Average
      - Below Average
      - Inefficient
      required: true
    - id: 17
      name: technology_adoption
      label: Technology Adoption Level
      hint: Client's use of modern technology
      type: select_one
      options:
      - Advanced
      - Above Average
      - Average
      - Below Average
      - Minimal
      required: true
    - id: 18
      name: management_quality
      label: Management Quality
      hint: Quality of client management team
      type: select_one
      options:
      - Excellent
      - Good
      - Competent
      - Needs Improvement
      - Poor
      required: true
    - id: 19
      name: risk_assessment
      label: -- Risk Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: overall_risk
      label: Overall Risk Level
      hint: General risk assessment
      type: select_one
      options:
      - Very Low
      - Low
      - Moderate
      - High
      - Very High
      required: true
    - id: 21
      name: key_risks
      label: Key Risks or Concerns
      hint: Identify main risk factors
      type: text
      options: []
      required: false
    - id: 22
      name: opportunity_assessment
      label: Business Opportunity Assessment
      hint: Potential growth or partnership opportunities
      type: text
      options: []
      required: false
    - id: 23
      name: recommendation
      label: Overall Recommendation
      hint: Your assessment recommendation
      type: select_one
      options:
      - Highly Recommended
      - Recommended
      - Proceed with Caution
      - Not Recommended
      - Further Review Needed
      required: true
