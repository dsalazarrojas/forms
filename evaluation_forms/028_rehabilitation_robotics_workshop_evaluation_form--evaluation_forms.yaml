inputSchema:
  type: object
  properties:
    title: Rehabilitation Robotics Workshop Evaluation Form
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: evaluation_scale
      label: Evaluation Scale
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
