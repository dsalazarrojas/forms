inputSchema:
  type: object
  properties:
    title: ICU Nurse Fellowship Evaluation
    pages:
    - id: 1
      name: evaluation_period
      label: Evaluation Period
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: nurse_educator
      label: Nurse Educator
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: worked_with_preceptor
      label: Have you worked with this preceptor before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: program_coordinator
      label: Are you a Program Coordinator?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: evaluation_frequency
      label: How often are evaluations performed for this program?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 6
      name: evaluation_due_date
      label: What is the evaluation due date?
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: evaluation_comments
      label: What are your evaluation comments for this feedback?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: evaluation_rating
      label: What rating would you give to this program?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: next_evaluation
      label: What are your next evaluation plans?
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: evaluation_frequency_2
      label: How often will you evaluate this program?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: evaluation_comments_2
      label: What are your evaluation comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: evaluation_rating_2
      label: Evaluation Rating 2
      hint: null
      type: number
      options: []
      required: false
