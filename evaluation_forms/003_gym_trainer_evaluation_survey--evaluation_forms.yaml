inputSchema:
  type: object
  properties:
    title: Gym Trainer Evaluation Survey
    pages:
    - id: 1
      name: professionalism
      label: Is the trainer professional?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: communication
      label: How does the trainer communicate during classes?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Seldom
      - Never
      required: false
    - id: 3
      name: motivation
      label: How would you rate the trainer's motivation during class?
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: availability
      label: Is the trainer available when you need them?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: training_plan
      label: How clear is the trainer's training plan?
      hint: null
      type: select_one
      options:
      - Clear
      - Somewhat clear
      - Not clear
      required: false
    - id: 6
      name: feedback
      label: Additional feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: trainer_name
      label: Trainer name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: training_date
      label: Training date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: gym_name
      label: Gym name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
