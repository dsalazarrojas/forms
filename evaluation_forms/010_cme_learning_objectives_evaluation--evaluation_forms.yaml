inputSchema:
  type: object
  properties:
    title: CME Learning Objectives Evaluation
    pages:
      - id: 1
        name: participant_name
        label: Participant Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: email_address
        label: Email Address
        hint: For confirmation
        type: email
        options: []
        required: true
      - id: 3
        name: profession
        label: Healthcare Profession
        hint: Your professional role
        type: select_one
        options:
          - Physician
          - Nurse
          - Pharmacist
          - Physician Assistant
          - Nurse Practitioner
          - Medical Student
          - Resident
          - Fellow
          - Allied Health Professional
          - Other
        required: true
      - id: 4
        name: years_in_practice
        label: Years in Practice
        hint: Your experience level
        type: select_one
        options:
          - Less than 1 year
          - 1-3 years
          - 4-7 years
          - 8-15 years
          - 16-25 years
          - More than 25 years
        required: true
      - id: 5
        name: cme_program_name
        label: CME Program Name
        hint: Which program are you evaluating
        type: text
        options: []
        required: true
      - id: 6
        name: program_date
        label: Program Date
        hint: When did you attend
        type: date
        options: []
        required: true
      - id: 7
        name: objective_clarity
        label: Learning Objectives Were Clear
        hint: Rate how clear the objectives were
        type: select_one
        options:
          - Strongly Agree
          - Agree
          - Neutral
          - Disagree
          - Strongly Disagree
        required: true
      - id: 8
        name: objectives_relevant
        label: Learning Objectives Were Relevant
        hint: To your professional needs
        type: select_one
        options:
          - Strongly Agree
          - Agree
          - Neutral
          - Disagree
          - Strongly Disagree
        required: true
      - id: 9
        name: objectives_achievable
        label: Learning Objectives Were Achievable
        hint: Realistic for the session length
        type: select_one
        options:
          - Strongly Agree
          - Agree
          - Neutral
          - Disagree
          - Strongly Disagree
        required: true
      - id: 10
        name: content_aligned
        label: Content Aligned With Objectives
        hint: Did content match stated goals
        type: select_one
        options:
          - Strongly Agree
          - Agree
          - Neutral
          - Disagree
          - Strongly Disagree
        required: true
      - id: 11
        name: objectives_met
        label: All Objectives Were Met
        hint: Rate achievement of objectives
        type: select_one
        options:
          - All Objectives Met
          - Most Objectives Met
          - Some Objectives Met
          - Few Objectives Met
          - No Objectives Met
        required: true
      - id: 12
        name: knowledge_gap_addressed
        label: Knowledge Gap Addressed
        hint: Did this address your learning needs
        type: select_one
        options:
          - Completely
          - Mostly
          - Partially
          - Minimally
          - Not At All
        required: true
      - id: 13
        name: competence_improvement
        label: Competence Improvement
        hint: Will this improve your competence
        type: select_one
        options:
          - Significantly
          - Moderately
          - Slightly
          - Not At All
        required: true
      - id: 14
        name: performance_improvement
        label: Performance Improvement Expected
        hint: Impact on your performance
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Maybe
          - Probably No
          - Definitely No
        required: true
      - id: 15
        name: patient_outcome_improvement
        label: Patient Outcomes May Improve
        hint: Potential impact on patients
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Maybe
          - Probably No
          - Definitely No
        required: true
      - id: 16
        name: objective_difficulty
        label: Objective Difficulty Level
        hint: Were objectives appropriately challenging
        type: select_one
        options:
          - Too Easy
          - Appropriate
          - Too Difficult
          - Mixed Difficulty
        required: true
      - id: 17
        name: suggested_improvements
        label: Suggested Improvements
        hint: How can we improve objectives
        type: text
        options: []
        required: false
      - id: 18
        name: additional_learning_needs
        label: Additional Learning Needs
        hint: Topics you want covered
        type: text
        options: []
        required: false
      - id: 19
        name: overall_effectiveness
        label: Overall Effectiveness Rating
        hint: Rate the program effectiveness
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 20
        name: would_attend_again
        label: Would Attend Similar Programs
        hint: Based on this experience
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Neutral
          - Probably No
          - Definitely No
        required: true
