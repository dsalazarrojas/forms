inputSchema:
  type: object
  properties:
    title: Research Proposal Evaluation Checklist
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: research_question
      label: Research Question
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: methodology
      label: Methodology
      hint: Please describe the proposed approach to address the research question
      type: text
      options: []
      required: false
    - id: 4
      name: expected_outcomes
      label: Expected Outcomes
      hint: List expected outcomes of the research, e.g., improved health outcomes,
        cost savings, etc.
      type: text
      options: []
      required: false
    - id: 5
      name: timeline
      label: Timeline
      hint: Please provide a detailed timeline for the project
      type: text
      options: []
      required: false
    - id: 6
      name: evaluation_criteria
      label: Evaluation Criteria
      hint: Select relevant criteria for proposal evaluation
      type: select_one
      options:
      - Research Impact
      - Relevance
      - Feasibility
      - Other
      required: false
    - id: 7
      name: evaluation_scale
      label: Evaluation Scale
      hint: Select scale for proposal evaluation
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: research_resources
      label: Research Resources
      hint: Please list research resources that will be required to complete the project
      type: text
      options: []
      required: false
    - id: 9
      name: budget_estimates
      label: Budget Estimates
      hint: Provide an estimate of the project budget
      type: text
      options: []
      required: false
    - id: 10
      name: evaluation_comments
      label: Evaluation Comments
      hint: Please add any comments on the proposal evaluation
      type: note
      options: []
      required: false
    - id: 11
      name: evaluation_recommendations
      label: Evaluation Recommendations
      hint: Please provide evaluation recommendations for the proposal
      type: text
      options: []
      required: false
    - id: 12
      name: evaluator_rating
      label: Evaluator Rating
      hint: Rate the proposal using a score out of 5
      type: number
      options: []
      required: false
    - id: 13
      name: reviewer_comments
      label: Reviewer Comments
      hint: Please add any comments on the proposal review
      type: text
      options: []
      required: false
    - id: 14
      name: review_date
      label: Review Date
      hint: Date of proposal review
      type: date
      options: []
      required: false
    - id: 15
      name: review_time
      label: Review Time
      hint: Time of proposal review
      type: time
      options: []
      required: false
    - id: 16
      name: review_location
      label: Review Location
      hint: Location of proposal review
      type: text
      options: []
      required: false
    - id: 17
      name: evaluation_form_type
      label: Evaluation Form Type
      hint: Select type of evaluation form used
      type: select_one
      options:
      - Standardized
      - Non-Standardized
      required: false
    - id: 18
      name: evaluation_form_version
      label: Evaluation Form Version
      hint: Select version of evaluation form used
      type: text
      options: []
      required: false
    - id: 19
      name: evaluation_form_comment
      label: Evaluation Form Comment
      hint: Please add any comments on the evaluation form
      type: text
      options: []
      required: false
    - id: 20
      name: evaluation_form_rating
      label: Evaluation Form Rating
      hint: Rate the evaluation form using a score out of 5
      type: number
      options: []
      required: false
    - id: 21
      name: evaluation_form_location
      label: Evaluation Form Location
      hint: Location where evaluation form was used
      type: text
      options: []
      required: false
    - id: 22
      name: evaluation_form_date
      label: Evaluation Form Date
      hint: Date the evaluation form was used
      type: date
      options: []
      required: false
    - id: 23
      name: evaluation_form_time
      label: Evaluation Form Time
      hint: Time the evaluation form was used
      type: time
      options: []
      required: false
    - id: 24
      name: evaluation_form_notes
      label: Evaluation Form Notes
      hint: Add any notes on the evaluation form used
      type: text
      options: []
      required: false
    - id: 25
      name: evaluation_form_comments
      label: Evaluation Form Comments
      hint: Please add any comments on the evaluation form used
      type: text
      options: []
      required: false
