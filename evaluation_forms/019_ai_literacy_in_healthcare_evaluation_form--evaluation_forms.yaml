inputSchema:
  type: object
  properties:
    title: AI Literacy In Healthcare Evaluation Form
    pages:
    - id: 1
      name: --personal_information--
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department or unit
      hint: Clinical, administrative, IT, etc
      type: text
      options: []
      required: true
    - id: 4
      name: role
      label: Role or job title
      hint: Example Physician, Nurse, Data Analyst
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Work email address
      hint: Use institutional email
      type: email
      options: []
      required: true
    - id: 6
      name: familiarity_level
      label: Familiarity with AI concepts
      hint: Self reported experience level
      type: select_one
      options:
      - None
      - Basic
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 7
      name: previous_ai_training
      label: Previous AI training attended
      hint: List courses or workshops if any
      type: text
      options: []
      required: false
    - id: 8
      name: confidence_in_using_tools
      label: Confidence in using AI tools for clinical tasks
      hint: Rate from 1 lowest to 5 highest
      type: number
      options: []
      required: true
    - id: 9
      name: perceived_benefits
      label: Most important benefits of AI in healthcare
      hint: Select up to three
      type: select_multiple
      options:
      - Diagnostic support
      - Administrative automation
      - Patient triage
      - Documentation assistance
      - Predictive analytics
      required: true
    - id: 10
      name: concerns
      label: Primary concerns about AI adoption
      hint: Select all that apply
      type: select_multiple
      options:
      - Patient safety
      - Data privacy
      - Bias and fairness
      - Lack of training
      - Integration cost
      required: true
    - id: 11
      name: training_needs
      label: Preferred training topics
      hint: Select up to four topics
      type: select_multiple
      options:
      - Tool usage and workflows
      - Data privacy and compliance
      - Clinical validation
      - Interpreting model output
      - Troubleshooting and escalation
      required: false
    - id: 12
      name: additional_comments
      label: Additional comments or recommendations
      hint: Optional
      type: text
      options: []
      required: false
