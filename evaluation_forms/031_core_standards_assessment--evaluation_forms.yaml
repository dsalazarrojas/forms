inputSchema:
  type: object
  properties:
    title: core_standards_assessment
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: assessment_questions
      label: Assessment Questions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: assessment_answers
      label: Student's Answer
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: assessment_score
      label: Assessment Score
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: progress_status
      label: Progress Status
      hint: null
      type: select_multiple
      options:
      - Not Started
      - Ongoing
      - Completed
      required: true
    - id: 7
      name: next_action
      label: Next Action or Follow-up
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: meeting_standards
      label: Meeting Standards
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 9
      name: assessor_signature
      label: Assessor's Signature
      hint: null
      type: text
      options: []
      required: true
