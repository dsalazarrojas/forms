      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: exhibit_experience
      label: exhibit_experience
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: overall_experience
      label: overall_experience
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: program_info
      label: program_info
      hint: null
      type: note
      options: []
      required: false
