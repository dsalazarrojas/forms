inputSchema:
  type: object
  properties:
    title: Church Event Evaluation Form
    pages:
    - id: 1
      name: header_event_info
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: evaluated_event_name
      label: Name of Event
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_event
      label: Date of Event
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: role_at_event
      label: Your Role at the Event
      hint: null
      type: select_one
      options:
      - Attendee
      - Volunteer
      - Speaker/Presenter
      - Organizer
      required: true
    - id: 5
      name: header_experience
      label: -- Event Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: overall_rating
      label: Overall Satisfaction Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: content_relevance
      label: How relevant was the content/program?
      hint: null
      type: select_one
      options:
      - Highly Relevant
      - Somewhat Relevant
      - Neutral
      - Not Relevant
      required: true
    - id: 8
      name: venue_rating
      label: Rating of Venue and Facilities
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: hospitality_rating
      label: Rating of Hospitality and Food
      hint: If applicable
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - N/A
      required: true
    - id: 10
      name: organization_rating
      label: How well-organized was the event?
      hint: null
      type: select_one
      options:
      - Very Well Organized
      - Organized
      - Average
      - Poorly Organized
      required: true
    - id: 11
      name: spiritual_impact
      label: Rate the spiritual impact of the event
      hint: null
      type: select_one
      options:
      - Significant Impact
      - Moderate Impact
      - Minimal Impact
      - No Impact
      required: true
    - id: 12
      name: favorite_part
      label: What was your favorite part of the event?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: improvement_suggestions
      label: What could we have done better?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: future_attendance
      label: Would you attend a similar event in the future?
      hint: null
      type: select_one
      options:
      - Definitely
      - Probably
      - Not sure
      - 'False'
      required: true
    - id: 15
      name: referral_likelihood
      label: How likely are you to recommend our events to others?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Likely
      - Unlikely
      required: true
    - id: 16
      name: additional_comments
      label: Any additional comments or feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: respondent_name_optional
      label: Your Name (Optional)
      hint: null
      type: text
      options: []
      required: false
