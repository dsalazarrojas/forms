inputSchema:
  type: object
  properties:
    title: CPD Representative Feedback Form
    pages:
    - id: 1
      name: feedback_date
      label: Date of Feedback
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: representative_name
      label: CPD Representative Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: representative_id
      label: Representative ID or Employee Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: respondent_name
      label: Your Name
      hint: Person providing feedback
      type: text
      options: []
      required: true
    - id: 5
      name: respondent_title
      label: Your Title or Position
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: interaction_date
      label: Date of Interaction with Representative
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: interaction_type
      label: Type of Interaction
      hint: null
      type: select_one
      options:
      - In-person meeting
      - Phone call
      - Email communication
      - Virtual meeting
      - Training session
      - Other
      required: true
    - id: 9
      name: professionalism
      label: Professionalism of Representative
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: knowledge
      label: Knowledge of Subject Matter
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: communication
      label: Communication Skills
      hint: Clarity and effectiveness
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: responsiveness
      label: Responsiveness to Questions
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: helpfulness
      label: Helpfulness in Addressing Needs
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: time_management
      label: Respect for Your Time
      hint: Punctuality and efficiency
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: overall_satisfaction
      label: Overall Satisfaction with Interaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 16
      name: strengths
      label: Representative Strengths
      hint: What did they do well
      type: text
      options: []
      required: false
    - id: 17
      name: improvements
      label: Areas for Improvement
      hint: Constructive feedback
      type: text
      options: []
      required: false
    - id: 18
      name: recommendations
      label: Recommendations for Future Interactions
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: recommend_representative
      label: Would You Recommend This Representative
      hint: null
      type: select_one
      options:
      - Yes, strongly
      - 'True'
      - Maybe
      - 'False'
      - No, strongly not
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
