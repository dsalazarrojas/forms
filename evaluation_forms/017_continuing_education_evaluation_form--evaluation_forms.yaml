inputSchema:
  type: object
  properties:
    title: Continuing Education Evaluation Form
    pages:
      - id: 1
        name: student_name
        label: Student Name
        hint: Full name
        type: text
        options: []
        required: false
      - id: 2
        name: course_name
        label: Course Name
        hint: Course title
        type: text
        options: []
        required: true
      - id: 3
        name: course_code
        label: Course Code
        hint: Course identifier
        type: text
        options: []
        required: false
      - id: 4
        name: instructor_name
        label: Instructor Name
        hint: Instructor full name
        type: text
        options: []
        required: true
      - id: 5
        name: completion_date
        label: Completion Date
        hint: Date course ended
        type: date
        options: []
        required: true
      - id: 6
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate the course overall
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 7
        name: course_content_quality
        label: Course Content Quality
        hint: Rate the content
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 8
        name: instructor_effectiveness
        label: Instructor Effectiveness
        hint: Rate the instructor
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: material_relevance
        label: Material Relevance
        hint: How relevant was the material?
        type: select_one
        options:
          - Very relevant
          - Somewhat relevant
          - Neutral
          - Not very relevant
          - Not relevant
        required: true
      - id: 10
        name: learning_objectives_met
        label: Learning Objectives Met
        hint: Were objectives achieved?
        type: select_one
        options:
          - Completely
          - Mostly
          - Somewhat
          - Barely
          - Not at all
        required: true
      - id: 11
        name: course_pace
        label: Course Pace
        hint: How was the pacing?
        type: select_one
        options:
          - Too fast
          - Just right
          - Too slow
        required: true
      - id: 12
        name: difficulty_level
        label: Difficulty Level
        hint: How challenging was it?
        type: select_one
        options:
          - Too easy
          - Appropriate
          - Too difficult
        required: true
      - id: 13
        name: skills_gained
        label: Skills Gained
        hint: What skills did you gain?
        type: select_multiple
        options:
          - Technical skills
          - Communication skills
          - Problem-solving
          - Leadership
          - Time management
          - Critical thinking
          - Teamwork
        required: true
      - id: 14
        name: would_recommend
        label: Would Recommend
        hint: Would you recommend this course?
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 15
        name: apply_learning
        label: Apply Learning
        hint: Will you apply what you learned?
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 16
        name: best_aspect
        label: Best Aspect
        hint: What was the best part?
        type: text
        options: []
        required: false
      - id: 17
        name: areas_for_improvement
        label: Areas for Improvement
        hint: What could be better?
        type: text
        options: []
        required: false
      - id: 18
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
