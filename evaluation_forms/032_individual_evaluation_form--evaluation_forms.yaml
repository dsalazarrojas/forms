inputSchema:
  type: object
  properties:
    title: Individual Evaluation Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_position
      label: Employee Position
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: evaluation_period
      label: Evaluation Period
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: performance_rating
      label: Performance Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: areas_for_improvement
      label: Areas for Improvement
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: employee_comments
      label: Employee Comments
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: manager_comments
      label: Manager Comments
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: evaluation_status
      label: Evaluation Status
      hint: null
      type: select_one
      options:
      - Pending
      - Complete
      - Incomplete
      required: true
    - id: 10
      name: evaluation_due_date
      label: Evaluation Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: evaluation_completed_date
      label: Evaluation Completed Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: submitted_to
      label: Submitted To
      hint: null
      type: text
      options: []
      required: true
