      options:
      - Excellent
      - Very Good
      - Good
      - Bad
      - Poor
      required: false
    - id: 4
      name: feedback_and_recommendation
      label: feedback_and_recommendation
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: areas_for_improvement
      label: areas_for_improvement
      hint: null
      type: select_multiple
      options:
      - Time Management
      - Communication
      - Team Management
      - Problem Solving
      - Adaptability
      required: false
    - id: 6
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: performance_rating
      label: performance_rating
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
