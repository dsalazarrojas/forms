inputSchema:
  type: object
  properties:
    title: Employee Job Performance Evaluation
    pages:
    - id: 1
      name: job_functional_areas
      label: job_functional_areas
      hint: null
      type: select_multiple
      options:
      - Accounting and Finance
      - Customer Support
      - Marketing
      - Product Management
      - Sales
      - Software Development
      required: false
    - id: 2
      name: skills_required_for_success
      label: skills_required_for_success
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: overall_performance
      label: overall_performance
      hint: null
