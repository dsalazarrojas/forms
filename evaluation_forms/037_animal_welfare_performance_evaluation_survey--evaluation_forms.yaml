inputSchema:
  type: object
  properties:
    title: Animal Welfare Performance Evaluation Survey
    pages:
    - id: 1
      name: facility_clinic_name
      label: Facility or Clinic Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: evaluation_date_conducted
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: staff_member_name
      label: Staff Member Being Evaluated
      hint: If evaluating a specific individual
      type: text
      options: []
      required: false
    - id: 4
      name: feeding_protocol_rating
      label: Adherence to Feeding Protocols
      hint: Frequency, quantity, and special diets
      type: select_one
      options:
      - Excellent - Exceeds standards
      - Good - Meets all standards
      - Fair - Occasional lapses
      - Poor - Significant failure
      required: true
    - id: 5
      name: medical_record_accuracy
      label: Accuracy of Medical Records
      hint: Log completeness and timing
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: sanitation_performance_rating
      label: Cleaning and Sanitation Performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: animal_handling_skills_rating
      label: Animal Handling and Safety Skills
      hint: Stress-free handling techniques
      type: select_one
      options:
      - Very Skilled
      - Skilled
      - Needs Improvement
      - Unsafe
      required: true
    - id: 8
      name: public_interaction_rating
      label: Interaction with Public and Adopters
      hint: Professionalism and helpfulness
      type: select_one
      options:
      - Professional and Helpful
      - Standard Interaction
      - Neutral
      - Unprofessional
      required: true
    - id: 9
      name: welfare_law_knowledge
      label: Knowledge of Local Welfare Laws
      hint: null
      type: select_one
      options:
      - High - Expert level
      - Moderate - Functional
      - Low - Needs training
      required: true
    - id: 10
      name: performance_strengths
      label: Key Performance Strengths
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: improvement_areas_noted
      label: Areas for Immediate Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: evaluator_name_title
      label: Evaluator Name and Title
      hint: null
      type: text
      options: []
      required: true
