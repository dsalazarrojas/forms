inputSchema:
  type: object
  properties:
    title: Sales Executive Interview Feedback Form
    pages:
    - id: 1
      name: candidate_info
      label: Candidate Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: evaluation_scale
      label: Evaluation Scale
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: recommendations
      label: Recommendations
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: submission_review
      label: Submission Review
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
