inputSchema:
  type: object
  properties:
    title: sustainable_health_care_design_project_evaluation_form
    pages:
    - id: 1
      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: sustainability_features
      label: Sustainability Features
      hint: null
      type: select_multiple
      options:
      - Green Building and Energy Efficiency
      - Water Conservation
      - Material Selection and Waste Management
      - Sustainable Materials and Products
      - Commissioning and Building Performance
      required: false
    - id: 3
      name: stakeholder_engagement
      label: Stakeholder Engagement
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: site_characteristics
      label: Site Characteristics
      hint: null
      type: select_multiple
      options:
      - Building Type - Hospital
      - Building Type - Healthcare Office
      - Number of Floors - 1-2
      - Number of Floors - 3-5
      - Number of Floors - 6 or more
      required: false
    - id: 5
      name: project_team
      label: Project Team
      hint: null
      type: select_one
      options:
      - Architect/Designer
      - Engineer
      - Contractor
      - Owner
      - Facility Manager
      required: false
    - id: 6
      name: project_status
      label: Project Status
      hint: null
      type: select_one
      options:
      - In Progress
      - On Hold
      - Completed
      required: false
    - id: 7
      name: overall_performance
      label: Overall Performance
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 8
      name: project_location
      label: Project Location
      hint: null
      type: select_one
      options:
      - Urban
      - Rural
      - Suburban
      required: false
    - id: 9
      name: project_size
      label: Project Size
      hint: Enter a numerical value
      type: number
      options: []
      required: false
    - id: 10
      name: project_budget
      label: Project Budget
      hint: Enter a numerical value
      type: number
      options: []
      required: false
    - id: 11
      name: project_start_date
      label: Project Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: project_end_date
      label: Project End Date
      hint: null
      type: date
      options: []
      required: false
