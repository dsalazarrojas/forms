inputSchema:
  type: object
  properties:
    title: Speaker Evaluation Form
    pages:
    - id: 1
      name: overall_presentation_quality
      label: Overall Presentation Quality
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: speaker_communication_style
      label: Speaker's Communication Style
      hint: null
      type: select_one
      options:
      - clear
      - concise
      - engaging
      - confusing
      - boring
      required: true
    - id: 3
      name: relevance
      label: Relevance
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: organization
      label: Organization
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: helpfulness
      label: Helpfulness
      hint: null
      type: select_multiple
      options:
      - Very helpful
      - Somewhat helpful
      - Not very helpful
      - Not at all helpful
      required: true
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
