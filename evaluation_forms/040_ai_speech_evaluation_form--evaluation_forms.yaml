inputSchema:
  type: object
  properties:
    title: AI Speech Evaluation Form
    pages:
    - id: 1
      name: --speech_details--
      label: -- Speech Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: evaluator_name
      label: Evaluator name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: speech_title
      label: Speech title
      hint: Optional
      type: text
      options: []
      required: false
    - id: 4
      name: clarity_rating
      label: Clarity of delivery
      hint: Rate 1 lowest to 5 highest
      type: number
      options: []
      required: true
    - id: 5
      name: engagement_rating
      label: Audience engagement
      hint: Rate 1 lowest to 5 highest
      type: number
      options: []
      required: true
    - id: 6
      name: structure_rating
      label: Structure and organization
      hint: Rate 1 lowest to 5 highest
      type: number
      options: []
      required: true
    - id: 7
      name: vocal_technique_rating
      label: Vocal technique and pacing
      hint: Rate 1 lowest to 5 highest
      type: number
      options: []
      required: true
    - id: 8
      name: content_quality
      label: Content quality and relevance
      hint: Rate 1 lowest to 5 highest
      type: number
      options: []
      required: true
    - id: 9
      name: improvement_suggestions
      label: Suggestions for improvement
      hint: Specific feedback for the speaker
      type: text
      options: []
      required: false
    - id: 10
      name: overall_recommendation
      label: Overall recommendation
      hint: Select one
      type: select_one
      options:
      - Recommend
      - Recommend with reservations
      - Do not recommend
      required: true
