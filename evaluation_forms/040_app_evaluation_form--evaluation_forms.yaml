inputSchema:
  type: object
  properties:
    title: App Evaluation Form
    pages:
    - id: 1
      name: evaluation_date
      label: Evaluation date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: evaluator_name
      label: Your name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: app_name
      label: App being evaluated
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: app_version
      label: App version evaluated
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: device_used
      label: Device used for evaluation
      hint: null
      type: select_one
      options:
      - iPhone
      - Android phone
      - iPad
      - Android tablet
      - Other
      required: true
    - id: 7
      name: evaluation_time
      label: Time spent evaluating app
      hint: In minutes
      type: number
      options: []
      required: true
    - id: 8
      name: previous_app_use
      label: Previous experience with this app
      hint: null
      type: select_one
      options:
      - First time user
      - Occasional user
      - Regular user
      - Heavy user
      required: true
    - id: 9
      name: first_impression
      label: First impression rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 10
      name: user_interface_rating
      label: User interface and design
      hint: Layout, visual appeal, consistency
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 11
      name: ease_of_use
      label: Ease of use and navigation
      hint: How intuitive is the app
      type: select_one
      options:
      - Very easy
      - Easy
      - Moderate difficulty
      - Difficult
      - Very difficult
      required: true
    - id: 12
      name: feature_completeness
      label: Feature set and completeness
      hint: Does it have needed functionality
      type: select_one
      options:
      - Excellent - all features present
      - Good - most features present
      - Fair - some features missing
      - Poor - many features missing
      required: true
    - id: 13
      name: performance_rating
      label: Performance and speed
      hint: Loading times, responsiveness
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 14
      name: stability_rating
      label: Stability and crashes
      hint: Did app crash or freeze
      type: select_one
      options:
      - No issues
      - Minor issues
      - Occasional crashes
      - Frequent crashes
      - Constant crashing
      required: true
    - id: 15
      name: functionality_issues
      label: Functionality issues encountered
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: customization_options
      label: Customization and settings options
      hint: null
      type: select_one
      options:
      - Excellent customization
      - Good options
      - Limited options
      - Very limited
      - No customization
      required: true
    - id: 17
      name: data_privacy_concern
      label: Data privacy and security concerns
      hint: null
      type: select_one
      options:
      - No concerns
      - Minor concerns
      - Moderate concerns
      - Significant concerns
      required: true
    - id: 18
      name: documentation_quality
      label: Documentation and help resources
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - None
      required: true
    - id: 19
      name: support_quality
      label: Customer support quality
      hint: Responsiveness, helpfulness
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - No support available
      required: true
    - id: 20
      name: value_for_money
      label: Value for money
      hint: Pricing relative to functionality
      type: select_one
      options:
      - Excellent value
      - Good value
      - Fair value
      - Poor value
      - Bad value
      required: true
    - id: 21
      name: overall_rating
      label: Overall app rating
      hint: null
      type: select_one
      options:
      - 5 stars - Excellent
      - 4 stars - Good
      - 3 stars - Fair
      - 2 stars - Poor
      - 1 star - Very poor
      required: true
    - id: 22
      name: would_recommend
      label: Would you recommend this app?
      hint: null
      type: select_one
      options:
      - Definitely recommend
      - Probably recommend
      - Maybe
      - Probably not
      - Definitely not recommend
      required: true
    - id: 23
      name: strengths
      label: Top strengths of the app
      hint: What works well
      type: text
      options: []
      required: false
    - id: 24
      name: weaknesses
      label: Top weaknesses or areas for improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: improvement_suggestions
      label: Specific improvement suggestions
      hint: null
      type: text
      options: []
      required: false
