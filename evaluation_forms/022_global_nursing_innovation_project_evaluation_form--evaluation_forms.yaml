inputSchema:
  type: object
  properties:
    title: Global Nursing Innovation Project Evaluation Form
    pages:
    - id: 1
      name: project_title
      label: Project Title
      hint: Briefly describe the project
      type: text
      options: []
      required: true
    - id: 2
      name: project_goals
      label: Project Goals
      hint: Describe the project goals
      type: text
      options: []
      required: true
    - id: 3
      name: project_impact
      label: Project Impact
      hint: Describe the project impact
      type: text
      options: []
      required: true
    - id: 4
      name: project_outcomes
      label: Project Outcomes
      hint: Describe the project outcomes
      type: text
      options: []
      required: true
    - id: 5
      name: project_location
      label: Project Location
      hint: Specify the project location
      type: text
      options: []
      required: true
    - id: 6
      name: project_budget
      label: Project Budget
      hint: Enter the project budget
      type: number
      options: []
      required: true
    - id: 7
      name: project_sustainability
      label: Project Sustainability
      hint: Assess the project's sustainability
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 8
      name: project_challenges
      label: Project Challenges
      hint: List the project challenges
      type: text
      options: []
      required: true
    - id: 9
      name: next_steps
      label: Next Steps
      hint: Describe the next steps
      type: text
      options: []
      required: true
    - id: 10
      name: project_sponsors
      label: Project Sponsors
      hint: List the project sponsors
      type: text
      options: []
      required: true
    - id: 11
      name: evaluation_method
      label: Evaluation Method
      hint: Specify the evaluation method
      type: text
      options: []
      required: true
    - id: 12
      name: project_evaluation
      label: Project Evaluation
      hint: Evaluate the project
      type: select_multiple
      options:
      - High
      - Low
      required: true
