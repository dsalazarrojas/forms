inputSchema:
  type: object
  properties:
    title: BNI Member Survey
    pages:
    - id: 1
      name: member_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: chapter_name
      label: Chapter Name
      hint: Which BNI chapter do you belong to?
      type: text
      options: []
      required: true
    - id: 4
      name: membership_duration
      label: How Long Have You Been a Member?
      hint: null
      type: select_one
      options:
      - Less than 3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - 2+ years
      required: false
    - id: 5
      name: meeting_attendance
      label: How Many Meetings Have You Attended This Quarter?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: overall_experience
      label: Overall Experience Rating
      hint: Rate from 1 (poor) to 10 (excellent)
      type: number
      options: []
      required: true
    - id: 7
      name: meeting_quality
      label: Quality of Today's Meeting
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: visitor_experience
      label: If visitors attended, how were they treated?
      hint: null
      type: select_one
      options:
      - Excellent - very welcoming
      - Good - adequately welcomed
      - Fair
      - Poor
      - No visitors present
      required: false
    - id: 9
      name: referrals_received
      label: Have you received quality referrals?
      hint: null
      type: select_one
      options:
      - Yes, many
      - Some
      - Few
      - None
      - Not yet
      required: false
    - id: 10
      name: referrals_given
      label: Have you given referrals to others?
      hint: null
      type: select_one
      options:
      - Yes, many
      - Some
      - Few
      - None
      - Not yet
      required: false
    - id: 11
      name: networking_value
      label: Value of Networking Opportunities
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not applicable
      required: false
    - id: 12
      name: leadership_felt
      label: Do you feel the chapter has good leadership?
      hint: null
      type: select_one
      options:
      - Strongly Yes
      - 'True'
      - Neutral
      - 'False'
      - Strongly No
      required: false
    - id: 13
      name: improvements_suggested
      label: What Improvements Would You Suggest?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: would_recommend
      label: Would You Recommend BNI to Others?
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Unsure
      - Probably No
      - Definitely No
      required: false
    - id: 15
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
