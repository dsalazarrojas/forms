inputSchema:
  type: object
  properties:
    title: Contact Data Lookup Tool Evaluation Form
    pages:
      - id: 1
        name: evaluation_context
        label: Tool Evaluation Context
        hint: Information about your evaluation
        type: note
        options: []
        required: false
      - id: 2
        name: evaluator_name
        label: Evaluator Name
        hint: Your name
        type: text
        options: []
        required: true
      - id: 3
        name: department
        label: Department
        hint: Your department
        type: select_one
        options:
          - Sales Operations
          - Marketing Operations
          - Procurement
          - IT
          - Data Management
          - Executive
        required: true
      - id: 4
        name: evaluation_date
        label: Evaluation Date
        hint: Date of evaluation
        type: date
        options: []
        required: true
      - id: 5
        name: tool_name
        label: Tool Being Evaluated
        hint: Name of the contact data lookup tool
        type: text
        options: []
        required: true
      - id: 6
        name: vendor_name
        label: Vendor Name
        hint: Company providing the tool
        type: text
        options: []
        required: true
      - id: 7
        name: evaluation_period
        label: Evaluation Period
        hint: How long have you evaluated this tool
        type: select_one
        options:
          - Less than 1 week
          - 1-2 weeks
          - 2-4 weeks
          - 1-3 months
          - Over 3 months
        required: true
      - id: 8
        name: data_accuracy
        label: Data Accuracy Rating
        hint: Rate the accuracy of data provided
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 9
        name: data_completeness
        label: Data Completeness
        hint: How complete is the data
        type: select_one
        options:
          - Very Complete
          - Mostly Complete
          - Adequate
          - Incomplete
          - Very Incomplete
        required: true
      - id: 10
        name: ease_of_use
        label: Ease of Use
        hint: How easy is the tool to use
        type: select_one
        options:
          - Very Easy
          - Easy
          - Neutral
          - Difficult
          - Very Difficult
        required: true
      - id: 11
        name: integration_capability
        label: Integration Capability
        hint: How well does it integrate with your systems
        type: select_one
        options:
          - Excellent Integration
          - Good Integration
          - Average Integration
          - Poor Integration
          - No Integration Tested
        required: true
      - id: 12
        name: search_speed
        label: Search Speed
        hint: Rate the lookup speed
        type: select_one
        options:
          - Very Fast
          - Fast
          - Average
          - Slow
          - Very Slow
        required: true
      - id: 13
        name: api_quality
        label: API Quality
        hint: If applicable rate the API
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Not Applicable
        required: false
      - id: 14
        name: pricing_value
        label: Pricing and Value
        hint: Is the pricing fair for the value
        type: select_one
        options:
          - Excellent Value
          - Good Value
          - Fair Value
          - Poor Value
          - Very Poor Value
        required: true
      - id: 15
        name: customer_support
        label: Vendor Customer Support
        hint: Rate the vendor support
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 16
        name: security_compliance
        label: Security and Compliance
        hint: Does the tool meet security requirements
        type: select_one
        options:
          - Exceeds Requirements
          - Meets All Requirements
          - Meets Most Requirements
          - Partial Compliance
          - Does Not Meet Requirements
        required: true
      - id: 17
        name: recommendation
        label: Recommendation
        hint: Would you recommend this tool
        type: select_one
        options:
          - Highly Recommend
          - Recommend
          - Neutral
          - Do Not Recommend
          - Strongly Do Not Recommend
        required: true
      - id: 18
        name: strengths
        label: Key Strengths
        hint: What does this tool do well
        type: text
        options: []
        required: true
      - id: 19
        name: weaknesses
        label: Areas for Improvement
        hint: What needs improvement
        type: text
        options: []
        required: true
      - id: 20
        name: final_decision
        label: Final Decision
        hint: Your recommendation for adoption
        type: select_one
        options:
          - Proceed with Purchase
          - Proceed with Negotiations
          - Continue Evaluation
          - Consider Alternatives
          - Do Not Purchase
        required: true
