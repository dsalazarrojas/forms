inputSchema:
  type: object
  properties:
    title: Walk In Cooler Maintenance Checklist
    pages:
    - id: 1
      name: cooler_inspection
      label: Cooler Inspection
      hint: null
      type: select_multiple
      options:
      - Inspect for Leaks
      - Check for Blockages
      - Check Refrigerant Levels
      required: true
    - id: 2
      name: temperature_check
      label: Temperature Check
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: cooler_cleanliness
      label: Cooler Cleanliness
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: refrigeration_system
      label: Refrigeration System
      hint: null
      type: select_one
      options:
      - R-410a
      - R-404A
      - R-410A
      required: true
    - id: 5
      name: water_leak_test
      label: Water Leak Test
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: door_seals
      label: Door Seals
      hint: null
      type: select_multiple
      options:
      - Inspect for Damage
      - Inspect for Tightness
      required: false
    - id: 7
      name: floor_drains
