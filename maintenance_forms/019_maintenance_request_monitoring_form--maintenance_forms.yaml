      - Closed
      - Rejected
      required: false
    - id: 4
      name: assigned_user
      label: assigned_user
      hint: null
      type: select_one
      options:
      - chatjimmy
      - other option
      required: false
    - id: 5
      name: priority
      label: priority
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 6
      name: status
      label: status
      hint: null
      type: select_one
      options:
      - In Progress
      - Complete
      - Cancelled
      required: false
