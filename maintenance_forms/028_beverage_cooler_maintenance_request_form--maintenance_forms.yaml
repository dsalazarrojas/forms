inputSchema:
  type: object
  properties:
    title: Beverage Cooler Maintenance Request Form
    pages:
    - id: 1
      name: requester_name
      label: Your Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: requester_email
      label: Email Address
      hint: We will send updates to this email
      type: email
      options: []
      required: true
    - id: 3
      name: requester_phone
      label: Phone Number
      hint: For urgent communication about the repair
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company or Store Name
      hint: Name of your business or location
      type: text
      options: []
      required: true
    - id: 5
      name: location_address
      label: Location Address
      hint: Full address where the cooler is located
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: City where service is needed
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: State where service is needed
      type: text
      options: []
      required: true
    - id: 8
      name: postal_code
      label: ZIP Code
      hint: Postal code for service location
      type: text
      options: []
      required: true
    - id: 9
      name: cooler_type
      label: Type of Cooler
      hint: What type of beverage cooler needs service
      type: select_one
      options:
      - Reach-In Refrigerator
      - Walk-In Cooler
      - Display Cooler
      - Bottle Cooler
      - Can Cooler
      - Wine Cooler
      - Keg Cooler
      - Other
      required: true
    - id: 10
      name: cooler_brand
      label: Cooler Brand
      hint: What brand is the cooler
      type: text
      options: []
      required: false
    - id: 11
      name: model_number
      label: Model Number
      hint: Model number if available
      type: text
      options: []
      required: false
    - id: 12
      name: serial_number
      label: Serial Number
      hint: Serial number if available
      type: text
      options: []
      required: false
    - id: 13
      name: issue_type
      label: Type of Issue
      hint: What problem is the cooler experiencing
      type: select_one
      options:
      - Not Cooling
      - Not Cooling Enough
      - Making Unusual Noise
      - Leaking Water
      - Frost Buildup
      - Door Not Closing
      - Light Not Working
      - Thermostat Issue
      - Electrical Problem
      - Other
      required: true
    - id: 14
      name: issue_description
      label: Detailed Issue Description
      hint: Please describe the problem in detail
      type: text
      options: []
      required: true
    - id: 15
      name: issue_started
      label: When Did the Issue Start
      hint: When did you first notice the problem
      type: date
      options: []
      required: true
    - id: 16
      name: urgency_level
      label: Urgency Level
      hint: How urgent is this repair
      type: select_one
      options:
      - Emergency - Immediate Attention Needed
      - High Priority - Within 24 Hours
      - Medium Priority - Within 2-3 Days
      - Low Priority - Schedule at Convenience
      required: true
    - id: 17
      name: preferred_service_date
      label: Preferred Service Date
      hint: When would you like service performed
      type: date
      options: []
      required: true
    - id: 18
      name: preferred_service_time
      label: Preferred Service Time
      hint: What time works best for you
      type: time
      options: []
      required: false
    - id: 19
      name: access_instructions
      label: Access Instructions
      hint: Any special instructions for technician access
      type: text
      options: []
      required: false
    - id: 20
      name: previous_repairs
      label: Have There Been Previous Repairs
      hint: Describe any recent repairs or maintenance
      type: text
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any other information about the issue
      type: text
      options: []
      required: false
