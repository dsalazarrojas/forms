      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: impact
      label: Impact
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: cause
      label: Cause
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: recommended_action
      label: Recommended Action
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assignee
      label: Assignee
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
