inputSchema:
  type: object
  properties:
    title: Outage Maintenance Request Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: date_reported
