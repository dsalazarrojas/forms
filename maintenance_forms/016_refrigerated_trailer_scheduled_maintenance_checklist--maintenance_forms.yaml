inputSchema:
  type: object
  properties:
    title: Refrigerated Trailer Scheduled Maintenance Checklist
    pages:
    - id: 1
      name: trailer_number
      label: Trailer Number
      hint: Enter trailer number
      type: number
      options: []
      required: true
    - id: 2
      name: engine_oil_level
      label: Engine Oil Level
      hint: Check the engine oil level
      type: text
      options: []
      required: true
    - id: 3
      name: oil_type
      label: Oil Type
      hint: Select oil type
      type: select_one
      options:
      - A
      - B
      - C
      required: true
    - id: 4
      name: air_filter_condition
      label: Air Filter Condition
      hint: Check air filter condition
      type: select_multiple
      options:
      - Clean
      - Dirty
      - Missing
      required: false
    - id: 5
      name: air_filter_last_replaced
      label: Air Filter Last Replaced
      hint: Check air filter last replaced date
      type: date
      options: []
      required: false
    - id: 6
      name: engine_oil_last_replaced
      label: Engine Oil Last Replaced
      hint: Check engine oil last replaced date
      type: date
      options: []
      required: false
    - id: 7
      name: battery_condition
      label: Battery Condition
      hint: Check the trailer battery condition
      type: select_multiple
      options:
      - Good
      - Bad
      - Unknown
      required: true
    - id: 8
      name: brake_pads_condition
      label: Brake Pads Condition
      hint: Check the trailer brake pads condition
      type: select_multiple
      options:
      - Good
      - Bad
      - Unknown
      required: false
    - id: 9
      name: tire_condition
      label: Tire Condition
      hint: Check the trailer tire condition
      type: select_multiple
      options:
      - Good
      - Bad
      - Unknown
      required: true
    - id: 10
      name: suspension_condition
      label: Suspension Condition
      hint: Check the trailer suspension condition
      type: select_multiple
      options:
      - Good
      - Bad
      - Unknown
      required: false
    - id: 11
      name: electrical_condition
      label: Electrical Condition
      hint: Check the trailer electrical condition
      type: select_multiple
      options:
      - Good
      - Bad
      - Unknown
      required: false
    - id: 12
      name: refrigerated_system
      label: Refrigerated System
      hint: Check the refrigerated system condition
      type: select_multiple
      options:
      - Good
      - Bad
      - Unknown
      required: true
    - id: 13
      name: trailer_temperature
      label: Trailer Temperature
      hint: Check the trailer temperature
      type: time
      options: []
      required: true
    - id: 14
      name: refrigerated_system_temperature
      label: Refrigerated System Temperature
      hint: Check the refrigerated system temperature
      type: time
      options: []
      required: true
    - id: 15
      name: engine_oil_type
      label: Engine Oil Type
      hint: Select engine oil type
      type: select_one
      options:
      - Diesel
      - Synthetic
      - Conventional
      required: true
    - id: 16
      name: notes
      label: Notes
      hint: Add any additional notes about the trailer
      type: note
      options: []
      required: false
    - id: 17
      name: technician_name
      label: Technician Name
      hint: Add technician name
      type: text
      options: []
      required: true
    - id: 18
      name: technician_id
      label: Technician ID
      hint: Add technician ID
      type: text
      options: []
      required: true
    - id: 19
      name: date_of_service
      label: Date Of Service
      hint: Enter date of service
      type: date
      options: []
      required: true
    - id: 20
      name: time_of_service
      label: Time Of Service
      hint: Enter time of service
      type: time
      options: []
      required: true
    - id: 21
      name: signature
      label: Signature
      hint: Technician signature
      type: text
      options: []
      required: true
    - id: 22
      name: trailer_number_confirmation
      label: Confirm Trailer Number
      hint: Confirm trailer number
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: refrigerated_system_confirmation
      label: Confirm Refrigerated System
      hint: Confirm refrigerated system condition
      type: select_one
      options:
      - Good
      - Bad
      required: true
    - id: 24
      name: electrical_confirmation
      label: Confirm Electrical
      hint: Confirm electrical condition
      type: select_one
      options:
      - Good
      - Bad
      required: true
    - id: 25
      name: trailer_condition
      label: Confirm Trailer Condition
      hint: Confirm trailer condition
      type: select_one
      options:
      - Good
      - Bad
      required: true
    - id: 26
      name: maintenance_required
      label: Confirm Maintenance Required
      hint: Confirm maintenance required
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
