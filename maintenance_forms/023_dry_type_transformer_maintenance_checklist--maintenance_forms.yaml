inputSchema:
  type: object
  properties:
    title: Dry Type Transformer Maintenance Checklist
    pages:
    - id: 1
      name: maintenance_form
      label: maintenance_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: equipment_inspection_date
      label: equipment_inspection_date
      hint: The date of the equipment inspection.
      type: date
      options: []
      required: false
    - id: 3
      name: equipment_inspection_status
      label: equipment_inspection_status
      hint: null
      type: select_one
      options:
      - Passed
      - Failed
      required: false
    - id: 4
      name: equipment_condition
      label: equipment_condition
      hint: The overall condition of the equipment (Passed/Failed).
      type: select_multiple
      options:
      - Passed
      - Failed
      required: false
    - id: 5
      name: dry_transformer_inspection_items
      label: dry_transformer_inspection_items
      hint: Check off each inspected item. Check all that apply.
      type: select_multiple
      options:
      - Dry coupling
      - Dry coupling - Ground fault
      - Dry coupling - Ground fault - Insulated
      - Dry coupling - Ground fault - Insulated - 1 kV
      - Dry coupling - Ground fault - Insulated - 1 kV - 2
      - Dry coupling - Ground fault - Insulated - 1 kV - 2 - 2
      required: false
    - id: 6
      name: maintenance_form_comments
      label: comments
      hint: Add any comments about this inspection.
      type: note
      options: []
      required: false
    - id: 7
      name: maintenance_form_signature
      label: signature
      hint: Enter your signature here.
      type: note
      options: []
      required: false
    - id: 8
      name: maintenance_form_date
      label: date
      hint: Enter the date of this maintenance action.
      type: date
      options: []
      required: false
    - id: 9
      name: equipment_inspection_frequency
      label: inspection_frequency
      hint: How often is this equipment inspected?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annually
      required: false
    - id: 10
      name: transformer_model
      label: transformer_model
      hint: Enter the transformer model.
      type: text
      options: []
      required: false
    - id: 11
      name: transformer_serial_number
      label: transformer_serial_number
      hint: Enter the transformer serial number.
      type: text
      options: []
      required: false
    - id: 12
      name: maintenance_form_location
      label: location
      hint: Enter the location of this inspection.
      type: text
      options: []
      required: false
    - id: 13
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: maintenance_form_inspector
      label: inspector
      hint: Enter your name.
      type: text
      options: []
      required: false
    - id: 15
      name: maintenance_form_organization
      label: organization
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: maintenance_form_phone
      label: phone
      hint: Enter your phone number.
      type: text
      options: []
      required: false
    - id: 17
      name: maintenance_form_email
      label: email
      hint: Enter your email.
      type: email
      options: []
      required: false
    - id: 18
      name: maintenance_form_comments
      label: comments
      hint: Add any comments about this inspection.
      type: note
      options: []
      required: false
    - id: 19
      name: maintenance_form_termination
      label: termination
      hint: null
      type: select_multiple
      options:
      - Not terminated
      - '2'
      - '3'
      required: false
    - id: 20
      name: transformer_age
      label: transformer_age
      hint: Enter the age of this transformer.
      type: number
      options: []
      required: false
    - id: 21
      name: dry_coupling_condition
      label: dry_coupling_condition
      hint: Check the condition of dry coupling.
      type: select_multiple
      options:
      - Good
      - Fair
      - Bad
      - Failed
      required: false
    - id: 22
      name: transformer_model_number
      label: transformer_model_number
      hint: Enter the transformer model number.
      type: text
      options: []
      required: false
    - id: 23
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: maintenance_form_inspector_id
      label: inspector_id
      hint: Enter your ID.
      type: text
      options: []
      required: false
    - id: 25
      name: maintenance_form_organization
      label: organization
      hint: null
      type: text
      options: []
      required: false
