inputSchema:
  type: object
  properties:
    title: Common Area Lighting Repair Request
    pages:
    - id: 1
      name: request_information
      label: Request Information
      hint: Details about the lighting repair request
      type: note
      options: []
      required: false
    - id: 2
      name: request_date
      label: Request Date
      hint: Date of this repair request
      type: date
      options: []
      required: true
    - id: 3
      name: request_id
      label: Request ID
      hint: Unique request reference number
      type: text
      options: []
      required: true
    - id: 4
      name: requester_information
      label: Requester Information
      hint: Details about the person reporting the issue
      type: note
      options: []
      required: false
    - id: 5
      name: requester_name
      label: Requester Name
      hint: Full name of the requester
      type: text
      options: []
      required: true
    - id: 6
      name: requester_email
      label: Requester Email
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 7
      name: requester_phone
      label: Requester Phone
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 8
      name: requester_type
      label: Requester Type
      hint: What is your relationship to the property
      type: select_one
      options:
      - Resident
      - Employee
      - Visitor
      - Property Manager
      - Maintenance Staff
      - Security
      - Other
      required: true
    - id: 9
      name: property_information
      label: Property Information
      hint: Details about the property location
      type: note
      options: []
      required: false
    - id: 10
      name: property_name
      label: Property Name
      hint: Name of the property or building
      type: text
      options: []
      required: true
    - id: 11
      name: property_address
      label: Property Address
      hint: Full address of the property
      type: text
      options: []
      required: true
    - id: 12
      name: location_details
      label: Location Details
      hint: Specific location of the lighting issue
      type: note
      options: []
      required: false
    - id: 13
      name: common_area_type
      label: Common Area Type
      hint: Which common area has the issue
      type: select_one
      options:
      - Lobby
      - Hallway
      - Stairwell
      - Elevator
      - Parking Garage
      - Outdoor Walkway
      - Fitness Center
      - Community Room
      - Restroom
      - Other
      required: true
    - id: 14
      name: specific_location
      label: Specific Location
      hint: More specific location details
      type: text
      options: []
      required: true
    - id: 15
      name: floor_level
      label: Floor Level
      hint: Which floor is the issue on
      type: text
      options: []
      required: false
    - id: 16
      name: issue_details
      label: Issue Details
      hint: Information about the lighting problem
      type: note
      options: []
      required: false
    - id: 17
      name: issue_type
      label: Issue Type
      hint: What type of lighting issue is occurring
      type: select_one
      options:
      - Light Completely Out
      - Flickering
      - Dim Lighting
      - Buzzing Sound
      - Always On
      - Won't Turn On
      - Physical Damage
      - Other
      required: true
    - id: 18
      name: number_of_fixtures
      label: Number of Fixtures
      hint: How many light fixtures are affected
      type: number
      options: []
      required: true
    - id: 19
      name: issue_duration
      label: Issue Duration
      hint: How long has this issue existed
      type: select_one
      options:
      - Less than 1 day
      - 1-3 days
      - 4-7 days
      - 1-2 weeks
      - More than 2 weeks
      required: true
    - id: 20
      name: safety_concern
      label: Safety Concern
      hint: Does this create a safety hazard
      type: select_one
      options:
      - Yes - Urgent
      - Yes - Moderate
      - No - Minor Issue
      required: true
    - id: 21
      name: priority_level
      label: Priority Level
      hint: Requested priority level
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Emergency
      required: true
    - id: 22
      name: additional_description
      label: Additional Description
      hint: Any additional details about the issue
      type: text
      options: []
      required: false
    - id: 23
      name: photos_available
      label: Photos Available
      hint: Do you have photos of the issue
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 24
      name: preferred_repair_time
      label: Preferred Repair Time
      hint: When would you prefer repairs be done
      type: select_one
      options:
      - Anytime
      - Business Hours Only
      - After Hours
      - Weekend
      required: false
    - id: 25
      name: access_instructions
      label: Access Instructions
      hint: Any special access instructions
      type: text
      options: []
      required: false
