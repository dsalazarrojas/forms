      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submitter_attachment
      label: Attachment
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: submitter_notes
      label: Submitter Notes
      hint: null
      type: text
      options: []
      required: false
