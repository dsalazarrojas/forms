      - Other
      required: true
    - id: 13
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: submitter_status
      label: Status
      hint: null
      type: select_one
      options:
      - Open
      - In Progress
      - Done
      required: true
