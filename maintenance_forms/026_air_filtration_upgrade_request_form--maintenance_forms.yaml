inputSchema:
  type: object
  properties:
    title: Air Filtration Upgrade Request Form
    pages:
    - id: 1
      name: requestor_name
      label: Requestor Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: requestor_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: requestor_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: false
    - id: 5
      name: request_date
      label: Request Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 6
      name: facility_name
      label: Facility Name
      hint: Building or location name
      type: text
      options: []
      required: true
    - id: 7
      name: facility_address
      label: Facility Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 8
      name: current_system_type
      label: Current System Type
      hint: Existing filtration system
      type: select_one
      options:
      - Standard fiberglass
      - Pleated filters
      - HEPA system
      - Carbon filtration
      - Electrostatic
      - UV-C system
      - Not sure
      required: true
    - id: 9
      name: current_system_age
      label: Current System Age
      hint: How old is the system
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      - Not sure
      required: true
    - id: 10
      name: upgrade_reason
      label: Reason for Upgrade
      hint: Primary reason
      type: select_one
      options:
      - Improved air quality needed
      - Health concerns
      - Regulatory compliance
      - Energy efficiency
      - System failure
      - New construction
      - Other
      required: true
    - id: 11
      name: health_concerns
      label: Health Concerns
      hint: Select all that apply
      type: select_multiple
      options:
      - Allergies
      - Asthma
      - Respiratory issues
      - Chemical sensitivities
      - Infection control
      - Odor issues
      - None
      required: false
    - id: 12
      name: desired_upgrade
      label: Desired Upgrade Type
      hint: What upgrade are you requesting
      type: select_multiple
      options:
      - HEPA filtration
      - Activated carbon
      - UV-C germicidal
      - Higher MERV rating
      - Smart monitoring
      - Energy recovery
      - Not sure, need assessment
      required: true
    - id: 13
      name: urgency_level
      label: Urgency Level
      hint: How urgent is this request
      type: select_one
      options:
      - Emergency, immediate action needed
      - High priority
      - Moderate priority
      - Low priority
      - Planning for future
      required: true
    - id: 14
      name: budget_available
      label: Budget Available
      hint: Is budget allocated
      type: select_one
      options:
      - Yes, budget approved
      - Budget request pending
      - Need cost estimate first
      - No budget allocated
      required: true
    - id: 15
      name: estimated_budget
      label: Estimated Budget Range (USD)
      hint: If known
      type: select_one
      options:
      - Under $5,000
      - $5,000-$15,000
      - $15,000-$50,000
      - $50,000-$100,000
      - Over $100,000
      - Not sure
      required: false
    - id: 16
      name: affected_area
      label: Affected Area
      hint: Which areas need upgrade
      type: text
      options: []
      required: true
    - id: 17
      name: square_footage
      label: Approximate Square Footage
      hint: Size of area
      type: select_one
      options:
      - Under 1,000 sq ft
      - 1,000-5,000 sq ft
      - 5,000-10,000 sq ft
      - 10,000-50,000 sq ft
      - Over 50,000 sq ft
      required: false
    - id: 18
      name: occupancy_level
      label: Occupancy Level
      hint: Number of people in area
      type: select_one
      options:
      - 1-10 people
      - 11-50 people
      - 51-100 people
      - 101-500 people
      - Over 500 people
      required: true
    - id: 19
      name: special_requirements
      label: Special Requirements
      hint: Any specific needs
      type: text
      options: []
      required: false
    - id: 20
      name: current_issues
      label: Current Issues
      hint: Describe problems with current system
      type: text
      options: []
      required: true
    - id: 21
      name: preferred_timeline
      label: Preferred Completion Timeline
      hint: When should work be done
      type: select_one
      options:
      - ASAP
      - Within 2 weeks
      - Within 1 month
      - Within 3 months
      - Flexible
      required: true
    - id: 22
      name: downtime_acceptable
      label: System Downtime Acceptable
      hint: Can system be shut down
      type: select_one
      options:
      - Yes, during business hours
      - Yes, after hours only
      - Yes, weekends only
      - No, continuous operation required
      required: true
    - id: 23
      name: assessment_needed
      label: On-site Assessment Needed
      hint: Do you need an assessment first
      type: select_one
      options:
      - Yes, please schedule
      - No, ready to proceed
      - Maybe
      required: true
    - id: 24
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 25
      name: requestor_signature
      label: Requestor Signature
      hint: Digital signature
      type: text
      options: []
      required: true
