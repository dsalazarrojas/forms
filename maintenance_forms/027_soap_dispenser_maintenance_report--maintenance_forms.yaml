inputSchema:
  type: object
  properties:
    title: Soap Dispenser Maintenance Report
    pages:
    - id: 1
      name: soap_dispenser_form
      label: Soap Dispenser Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: soap_dispenser_condition
      label: Soap Dispenser Condition
      hint: null
      type: select_one
      options:
      - Good
      - Needs Refill
      - Leaking
      - Empty
      - Faulty
      required: false
    - id: 4
      name: maintenance_activity
      label: Maintenance Activity
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date_of_inspection
      label: Date Of Inspection
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: restocking_needed
      label: Restocking Needed
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: restock_date
      label: Restock Date
      hint: null
      type: date
      options: []
      required: false
