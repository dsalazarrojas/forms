inputSchema:
  type: object
  properties:
    title: Ice Cream Freezer Maintenance Order Form
    pages:
    - id: 1
      name: company_type
      label: Company Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: appointment_type
      label: Appointment Type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Scheduled'', ''label'': ''Scheduled'', ''type'':
        ''checkbox''}'
      - '{''id'': 2, ''name'': ''Urgent'', ''label'': ''Urgent'', ''type'': ''checkbox''}'
      required: true
    - id: 7
      name: job_type
      label: Job Type
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''repair'', ''label'': ''Repair'', ''type'': ''checkbox''}'
      - '{''id'': 2, ''name'': ''maintenance'', ''label'': ''Maintenance'', ''type'':
        ''checkbox''}'
      required: true
    - id: 8
      name: job_status
      label: Job Status
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''pending'', ''label'': ''Pending'', ''type'': ''checkbox''}'
      - '{''id'': 2, ''name'': ''active'', ''label'': ''Active'', ''type'': ''checkbox''}'
      - '{''id'': 3, ''name'': ''closed'', ''label'': ''Closed'', ''type'': ''checkbox''}'
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: scheduled_date
      label: Scheduled Date
      hint: null
      type: date
      options: []
      required: true
