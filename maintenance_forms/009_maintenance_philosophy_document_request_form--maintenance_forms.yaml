inputSchema:
  type: object
  properties:
    title: Maintenance Philosophy Document Request Form
    pages:
    - id: 1
      name: request_type
      label: Request Type
      hint: null
      type: select_one
      options:
      - Maintenance
      - Non-maintenance
      - Other
      required: false
    - id: 2
      name: purpose
      label: What is the purpose of the request
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: urgency
      label: Urgency of Request
      hint: null
      type: select_one
      options:
      - Low
      - High
      - Medium
      required: false
    - id: 4
      name: format_preferred
      label: Format Preference
      hint: null
      type: select_multiple
      options:
      - pdf
      - docx
      - excel
      required: false
    - id: 5
      name: facilities_involved
      label: Facilities Involved
      hint: null
      type: select_multiple
      options:
      - Electrical
      - HVAC
      - Plumbing
      - Other
      required: false
    - id: 6
      name: operations_involved
      label: Operations Involved
      hint: null
      type: select_multiple
      options:
      - Maintenance
      - Operations
      - Other
      required: false
    - id: 7
      name: submitter_name
      label: Submitter Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submitter_role
      label: Submitter Role
      hint: null
      type: select_multiple
      options:
      - Manager
      - Team Leader
      - Supervisor
      - Other
      required: false
