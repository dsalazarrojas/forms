inputSchema:
  type: object
  properties:
    title: Aviation Maintenance Tools Requisition Form
    pages:
    - id: 1
      name: requisition_type
      label: Requisition Type
      hint: What type of request is this
      type: select_one
      options:
      - New tool request
      - Replacement tool
      - Calibration service
      - Tool repair
      - Special tool rental
      - Consumable supplies
      - Other
      required: true
    - id: 2
      name: request_date
      label: Request Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 3
      name: requester_name
      label: Requester Full Name
      hint: Your complete name
      type: text
      options: []
      required: true
    - id: 4
      name: requester_employee_id
      label: Employee ID
      hint: Your employee identification number
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: Your maintenance department
      type: select_one
      options:
      - Airframe maintenance
      - Powerplant maintenance
      - Avionics
      - Line maintenance
      - Heavy maintenance
      - Quality assurance
      - Other
      required: true
    - id: 6
      name: email_address
      label: Email Address
      hint: Your work email
      type: email
      options: []
      required: true
    - id: 7
      name: phone_extension
      label: Phone Extension
      hint: Your work phone extension
      type: text
      options: []
      required: false
    - id: 8
      name: aircraft_type
      label: Aircraft Type
      hint: Which aircraft type this is for
      type: select_one
      options:
      - Boeing 737
      - Boeing 747
      - Boeing 777
      - Airbus A320
      - Airbus A330
      - Airbus A350
      - Regional jet
      - Turboprop
      - Other
      required: true
    - id: 9
      name: aircraft_tail_number
      label: Aircraft Tail Number
      hint: N-number or registration
      type: text
      options: []
      required: true
    - id: 10
      name: work_order_number
      label: Work Order Number
      hint: Associated work order if applicable
      type: text
      options: []
      required: false
    - id: 11
      name: tool_name_1
      label: Tool 1 Name
      hint: Name of first tool requested
      type: text
      options: []
      required: true
    - id: 12
      name: tool_part_number_1
      label: Tool 1 Part Number
      hint: Manufacturer part number
      type: text
      options: []
      required: false
    - id: 13
      name: tool_quantity_1
      label: Tool 1 Quantity
      hint: How many needed
      type: number
      options: []
      required: true
    - id: 14
      name: tool_name_2
      label: Tool 2 Name
      hint: Name of second tool if needed
      type: text
      options: []
      required: false
    - id: 15
      name: tool_part_number_2
      label: Tool 2 Part Number
      hint: Manufacturer part number
      type: text
      options: []
      required: false
    - id: 16
      name: tool_quantity_2
      label: Tool 2 Quantity
      hint: How many needed
      type: number
      options: []
      required: false
    - id: 17
      name: tool_name_3
      label: Tool 3 Name
      hint: Name of third tool if needed
      type: text
      options: []
      required: false
    - id: 18
      name: tool_part_number_3
      label: Tool 3 Part Number
      hint: Manufacturer part number
      type: text
      options: []
      required: false
    - id: 19
      name: tool_quantity_3
      label: Tool 3 Quantity
      hint: How many needed
      type: number
      options: []
      required: false
    - id: 20
      name: justification
      label: Justification for Request
      hint: Why do you need these tools
      type: text
      options: []
      required: true
    - id: 21
      name: urgency_level
      label: Urgency Level
      hint: How soon do you need the tools
      type: select_one
      options:
      - Routine (within 1 week)
      - Soon (within 3 days)
      - Urgent (within 24 hours)
      - Immediate (AOG - aircraft on ground)
      required: true
    - id: 22
      name: expected_duration
      label: Expected Duration of Use
      hint: How long will you need the tools
      type: select_one
      options:
      - Less than 1 day
      - 1-3 days
      - 4-7 days
      - 1-2 weeks
      - More than 2 weeks
      - Permanent assignment
      required: true
    - id: 23
      name: special_requirements
      label: Special Requirements
      hint: Any calibration, certification, or handling needs
      type: text
      options: []
      required: false
    - id: 24
      name: return_date
      label: Expected Return Date
      hint: When will you return the tools
      type: date
      options: []
      required: false
    - id: 25
      name: supervisor_name
      label: Supervisor Name
      hint: Your supervising mechanic or lead
      type: text
      options: []
      required: true
    - id: 26
      name: supervisor_approval
      label: Supervisor Approval Status
      hint: Has your supervisor approved this request
      type: select_one
      options:
      - Approved
      - Pending approval
      - Not yet submitted
      required: true
    - id: 27
      name: additional_notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
