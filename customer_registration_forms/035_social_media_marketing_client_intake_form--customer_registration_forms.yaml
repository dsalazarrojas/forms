inputSchema:
  type: object
  properties:
    title: Social Media Marketing Client Intake Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: expected_launch_date
      label: Expected Launch Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: marketing_channels
      label: Marketing Channels
      hint: null
      type: select_one
      options:
      - Facebook
      - Instagram
      - Twitter
      - LinkedIn
      - Email
      - Other
      required: false
    - id: 6
      name: marketing_budget
      label: Marketing Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: marketing_goals
      label: Marketing Goals
      hint: null
      type: text
      options: []
      required: false
