inputSchema:
  type: object
  properties:
    title: Comfort Technology Registration Form
    pages:
    - id: 1
      name: user_name
      label: Full Name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: user_phone
      label: Phone Number
      hint: Contact number for support
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your organization or company
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: Your position or role
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_product_registration
      label: -- Product Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: product_name
      label: Product Name
      hint: Which Comfort Technology product did you purchase
      type: select_one
      options:
      - ComfortPhone X1
      - ComfortPhone X2 Pro
      - ComfortTab Tablet
      - ComfortBook Laptop
      - ComfortWatch Smartwatch
      - ComfortBuds Earbuds
      - ComfortHome Hub
      - Other
      required: true
    - id: 8
      name: serial_number
      label: Serial Number
      hint: Product serial number
      type: text
      options: []
      required: true
    - id: 9
      name: purchase_date
      label: Purchase Date
      hint: When did you buy the product
      type: date
      options: []
      required: true
    - id: 10
      name: purchase_location
      label: Purchase Location
      hint: Where did you purchase
      type: select_one
      options:
      - Official Website
      - Retail Store
      - Online Retailer
      - Authorized Dealer
      - Gift
      - Other
      required: true
    - id: 11
      name: section_header_contact_preferences
      label: -- Contact Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: email_updates
      label: Email Updates
      hint: Receive product updates and tips
      type: select_one
      options:
      - Yes Please
      - No Thanks
      required: true
    - id: 13
      name: product_news
      label: Product News
      hint: Receive news about new products
      type: select_one
      options:
      - Yes Please
      - No Thanks
      required: true
    - id: 14
      name: promotional_offers
      label: Promotional Offers
      hint: Receive special offers and discounts
      type: select_one
      options:
      - Yes Please
      - No Thanks
      required: true
    - id: 15
      name: survey_participation
      label: Survey Participation
      hint: Participate in product surveys
      type: select_one
      options:
      - Yes Interested
      - No Thanks
      required: true
    - id: 16
      name: section_header_support
      label: -- Support Options --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: warranty_registration
      label: Warranty Registration
      hint: Register for warranty coverage
      type: select_one
      options:
      - Yes Register Me
      - No Do Not Register
      required: true
    - id: 18
      name: extended_warranty
      label: Extended Warranty Interest
      hint: Interested in extended warranty
      type: select_one
      options:
      - Yes Interested
      - No Not Interested
      - Maybe Later
      required: true
    - id: 19
      name: support_plan
      label: Support Plan Preference
      hint: Level of support you prefer
      type: select_one
      options:
      - Basic Support
      - Premium Support
      - Business Support
      - No Support Plan
      required: true
    - id: 20
      name: section_header_technical_details
      label: -- Technical Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: operating_system
      label: Operating System
      hint: Which OS are you using
      type: select_one
      options:
      - Windows
      - macOS
      - iOS
      - Android
      - Linux
      - Other
      required: false
    - id: 22
      name: primary_use
      label: Primary Use
      hint: How will you primarily use this product
      type: select_one
      options:
      - Personal Use
      - Business Use
      - Education
      - Creative Work
      - Gaming
      - Other
      required: true
    - id: 23
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: Where did you learn about Comfort Technology
      type: select_one
      options:
      - Advertisement
      - Social Media
      - Friend or Family
      - Review Website
      - Store Display
      - Other
      required: false
    - id: 24
      name: additional_comments
      label: Additional Comments
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
