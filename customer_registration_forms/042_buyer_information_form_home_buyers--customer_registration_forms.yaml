inputSchema:
  type: object
  properties:
    title: Buyer Information Form Home Buyers
    pages:
    - id: 1
      name: buyer_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: buyer_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: buyer_email
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 4
      name: buyer_phone
      label: Phone Number
      hint: Your contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: current_residence
      label: Current Residence
      hint: Where are you living now?
      type: text
      options: []
      required: false
    - id: 6
      name: looking_timeframe
      label: When Are You Looking to Buy?
      hint: null
      type: select_one
      options:
      - Right now
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 12+ months
      - Just browsing
      required: true
    - id: 7
      name: property_type
      label: Property Type Interested In
      hint: What type of property?
      type: select_multiple
      options:
      - Single-family home
      - Condo or townhouse
      - Multi-family property
      - Land
      - New construction
      - Historic property
      - Farm or rural property
      - Undecided
      required: true
    - id: 8
      name: bedrooms_needed
      label: Number of Bedrooms
      hint: How many bedrooms?
      type: select_one
      options:
      - 1 bedroom
      - 2 bedrooms
      - 3 bedrooms
      - 4 bedrooms
      - 5+ bedrooms
      - No preference
      required: false
    - id: 9
      name: bathrooms_needed
      label: Number of Bathrooms
      hint: How many bathrooms?
      type: select_one
      options:
      - 1 bathroom
      - 2 bathrooms
      - 3 bathrooms
      - 4+ bathrooms
      - No preference
      required: false
    - id: 10
      name: square_footage
      label: Preferred Square Footage
      hint: Size of home desired
      type: text
      options: []
      required: false
    - id: 11
      name: property_location
      label: Preferred Location or Area
      hint: City, neighborhood, region
      type: text
      options: []
      required: true
    - id: 12
      name: commute_preference
      label: Commute or Proximity Requirements
      hint: Distance to work, schools, amenities, etc.
      type: text
      options: []
      required: false
    - id: 13
      name: budget_range
      label: Budget Range for Home Purchase
      hint: In USD or local currency
      type: select_one
      options:
      - Under $150000
      - $150000 - $250000
      - $250000 - $500000
      - $500000 - $1 million
      - $1 - $2 million
      - Over $2 million
      - Not determined
      required: true
    - id: 14
      name: down_payment_available
      label: Down Payment Available
      hint: Percentage or amount
      type: select_one
      options:
      - Less than 5%
      - 5-10%
      - 10-20%
      - 20-30%
      - Over 30%
      - Not determined
      required: false
    - id: 15
      name: financing_status
      label: Financing Status
      hint: Pre-approved or financing plan
      type: select_one
      options:
      - Pre-approved for mortgage
      - Not yet pre-approved
      - All cash buyer
      - Still determining
      required: true
    - id: 16
      name: buyer_type
      label: Buyer Type
      hint: First-time or experienced buyer?
      type: select_one
      options:
      - First-time homebuyer
      - Experienced buyer
      - Investor
      - Relocating professional
      required: false
    - id: 17
      name: special_features
      label: Special Features or Must-Haves
      hint: Pool, garage, fireplace, etc.
      type: text
      options: []
      required: false
    - id: 18
      name: property_condition
      label: Property Condition Preference
      hint: null
      type: select_one
      options:
      - Move-in ready
      - Some updates needed
      - Fixer-upper ok
      - No preference
      required: false
    - id: 19
      name: agent_representation
      label: Are You Working With an Agent?
      hint: null
      type: select_one
      options:
      - Yes, already represented
      - Open to representation
      - No agent
      required: true
    - id: 20
      name: additional_notes
      label: Additional Information or Notes
      hint: Anything else we should know?
      type: text
      options: []
      required: false
