inputSchema:
  type: object
  properties:
    title: Cosmetology Client Consultation Form
    pages:
    - id: 1
      name: service_needed
      label: What type of service needed
      hint: Please describe the service you are seeking
      type: select_one
      options:
      - Haircut
      - Haircolor
      - Hair styling
      - Makeup
      required: true
    - id: 2
      name: contact_method
      label: Contact Method
      hint: How would you like to be contacted?
      type: select_multiple
      options:
      - Email
      - Phone
      - In person
      required: true
    - id: 3
      name: client_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: service_details
      label: Service Details
      hint: Describe your service details
      type: text
      options: []
      required: true
    - id: 6
      name: assigned_tool
      label: Assigned Tool
      hint: Which tool do you want assigned?
      type: select_multiple
      options:
      - Scissors
      - Hair dryer
      - Makeup brush
      required: true
    - id: 7
      name: tool_assigned
      label: Tool Assigned
      hint: Is the tool assigned?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: Any additional notes
      type: note
      options: []
      required: false
    - id: 9
      name: service_address
      label: Service Address
      hint: Please provide your service address
      type: text
      options: []
      required: true
    - id: 10
      name: submitted_by
      label: Submitted By
      hint: Who submitted this form?
      type: select_multiple
      options:
      - Self
      - Staff
      - Manager
      required: true
