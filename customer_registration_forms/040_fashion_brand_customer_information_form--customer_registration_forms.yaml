inputSchema:
  type: object
  properties:
    title: Fashion Brand Customer Information Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Enter a 10-digit phone number
      type: text
      options: []
      required: true
    - id: 4
      name: style_preferences
      label: Style Preferences
      hint: Select from below options
      type: select_one
      options:
      - Casual
      - Formal
      - Active
      - Sporty
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: YYYY/MM/DD
      type: date
      options: []
      required: true
    - id: 6
      name: style_preferred_color
      label: Style Preferred Color
      hint: Select from below options
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      - Yellow
      required: true
    - id: 7
      name: style_preferred_size
      label: Style Preferred Size
      hint: Select from below options
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - XL
      required: true
    - id: 8
      name: style_preferred_fit
      label: Style Preferred Fit
      hint: Select from below options
      type: select_one
      options:
      - Loose
      - Comfortable
      - Fitted
      required: true
    - id: 9
      name: marketing_opt_in
      label: Marketing Opt-in
      hint: Select from below options
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: style_preferred_brand
      label: Style Preferred Brand
      hint: Select from below options
      type: select_one
      options:
      - Brand 1
      - Brand 2
      - Brand 3
      required: true
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: Enter any additional comments
      type: note
      options: []
      required: false
