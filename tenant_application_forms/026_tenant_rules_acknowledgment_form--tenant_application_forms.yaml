inputSchema:
  type: object
  properties:
    title: Tenant Rules Acknowledgment Form
    pages:
    - id: 1
      name: first_page
      label: First Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tenant_info
      label: Tenant Information
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: signature
      label: Signature
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: rules_agreement
      label: Rules Agreement
      hint: Please sign below to confirm that you have read and agree to the rules.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: landlord_info
      label: Landlord Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
