inputSchema:
  type: object
  properties:
    title: Price Sensitivity Survey
    pages:
    - id: 1
      name: price_sensitivity_survey
      label: price_sensitivity
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: product_name
      label: product_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: age
      label: age
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: income_range
      label: income_range
      hint: null
      type: select_one
      options:
      - less than $20,000
      - $20,000 - $40,000
      - $40,000 - $60,000
      - $60,000 - $80,000
      - $80,000 - $100,000
      - $100,000 - $150,000
      - $150,000 - $200,000
      - $200,000 - $250,000
      - $250,000 - $500,000
      - $500,000 - $1,000,000
      - $1,000,000 or more
      required: false
    - id: 5
      name: price_range
      label: price_range
      hint: null
      type: select_multiple
      options:
      - $0 - $100
      - $101 - $200
      - $201 - $500
      - $501 - $1,000
      - $1,001 - $2,000
      - $2,001 - $5,000
      - $5,001 - $10,000
      - $10,001 or more
      required: false
    - id: 6
      name: price_point
      label: price_point
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: product_price
      label: product_price
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: discount
      label: discount
      hint: null
      type: select_one
      options:
      - 0% - 10%
      - 10% - 20%
      - 20% - 30%
      - 30% - 40%
      - 40% or more
      required: false
