inputSchema:
  type: object
  properties:
    title: Square Newsletter Subscription Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: email_confirmation
      label: Confirm Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: subscription_type
      label: Subscription Type
      hint: null
      type: select_multiple
      options:
      - Print
      - Digital
      required: true
    - id: 6
      name: print_format
      label: Print Format
      hint: null
      type: select_one
      options:
      - A4
      - A5
      required: true
    - id: 7
      name: digital_format
      label: Digital Format
      hint: null
      type: select_one
      options:
      - PDF
      - Email
      required: true
    - id: 8
      name: subscription_duration
      label: Subscription Duration
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Annually
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: confirm_subscription
      label: Confirm Subscription
      hint: null
      type: select_one
      options:
      - I am a human
      - I am a robot
      required: true
