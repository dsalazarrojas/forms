      - E-commerce
      - Blogging
      - Landing Page
      required: false
    - id: 7
      name: select_multiple
      label: Select Multiple
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 8
      name: text_area
      label: Text Area
      hint: null
      type: text
      options: []
