inputSchema:
  type: object
  properties:
    title: Content Idea Suggestion Form
    pages:
      - id: 1
        name: welcome_note
        label: -- Share Your Ideas --
        hint: Help us create content that matters to you!
        type: note
        options: []
        required: false
      - id: 2
        name: name_optional
        label: Name (Optional)
        hint: null
        type: text
        options: []
        required: false
      - id: 3
        name: email_optional
        label: Email Address (Optional)
        hint: We will only contact you if we have questions about your idea
        type: email
        options: []
        required: false
      - id: 4
        name: suggested_topic
        label: What topic should we cover next
        hint: Be as specific as possible
        type: text
        options: []
        required: true
      - id: 5
        name: importance_factor
        label: Why is this topic interesting to you
        hint: What problem does it solve or what does it explain
        type: text
        options: []
        required: true
      - id: 6
        name: specific_questions
        label: Are there specific questions you want answered
        hint: List 1-3 questions you have about this topic
        type: text
        options: []
        required: false
      - id: 7
        name: content_format_preference
        label: How would you like to see this content
        hint: Choose your preferred format
        type: select_one
        options:
          - Long-form Article
          - Short Video (Reel/TikTok)
          - Detailed Webinar
          - Step-by-Step Infographic
          - Podcast Episode
        required: true
      - id: 8
        name: current_skill_level
        label: What is your current knowledge level on this topic
        hint: null
        type: select_one
        options:
          - Beginner - I know nothing
          - Intermediate - I know the basics
          - Advanced - I want deep technical details
        required: true
      - id: 9
        name: notify_on_publish
        label: Would you like to be notified if we use your idea
        hint: null
        type: select_one
        options:
          - Yes
          - No
        required: true
