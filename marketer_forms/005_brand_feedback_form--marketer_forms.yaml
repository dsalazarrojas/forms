inputSchema:
  type: object
  properties:
    title: Brand Feedback Form
    pages:
    - id: 1
      name: customer_name
      label: Your Name
      hint: Optional, leave blank for anonymous feedback
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: Email Address
      hint: Optional, for follow-up if needed
      type: email
      options: []
      required: false
    - id: 3
      name: customer_type
      label: Customer Type
      hint: How would you describe yourself
      type: select_one
      options:
      - New Customer
      - Returning Customer
      - Loyal Customer
      - Former Customer
      - Never Purchased
      required: true
    - id: 4
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you with our brand
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 5
      name: brand_perception
      label: Brand Perception
      hint: Which words describe our brand
      type: select_multiple
      options:
      - Trustworthy
      - Innovative
      - Affordable
      - Premium
      - Reliable
      - Friendly
      - Professional
      - Creative
      - Outdated
      - Confusing
      required: true
    - id: 6
      name: product_quality_rating
      label: Product Quality Rating
      hint: Rate the quality of our products
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 7
      name: customer_service_rating
      label: Customer Service Rating
      hint: Rate our customer service
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 8
      name: value_for_money
      label: Value for Money
      hint: How would you rate our value for money
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Very Poor Value
      required: true
    - id: 9
      name: likelihood_recommend
      label: Likelihood to Recommend
      hint: How likely are you to recommend us
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 10
      name: brand_comparison
      label: How Do We Compare
      hint: Compared to competitors
      type: select_one
      options:
      - Much Better
      - Somewhat Better
      - About the Same
      - Somewhat Worse
      - Much Worse
      required: true
    - id: 11
      name: purchase_frequency
      label: Purchase Frequency
      hint: How often do you purchase from us
      type: select_one
      options:
      - First Time
      - Once a Year
      - Few Times a Year
      - Monthly
      - Weekly
      required: true
    - id: 12
      name: improvement_areas
      label: Areas for Improvement
      hint: What could we improve
      type: select_multiple
      options:
      - Product Quality
      - Pricing
      - Customer Service
      - Website Experience
      - Shipping Speed
      - Product Variety
      - Communication
      - Returns Process
      required: true
    - id: 13
      name: favorite_products
      label: Favorite Products
      hint: What are your favorite products
      type: text
      options: []
      required: false
    - id: 14
      name: additional_feedback
      label: Additional Comments
      hint: Any other feedback you would like to share
      type: text
      options: []
      required: false
    - id: 15
      name: follow_up_permission
      label: May We Contact You
      hint: Can we follow up about your feedback
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
