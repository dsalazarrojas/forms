inputSchema:
  type: object
  properties:
    title: Compact Contact Form 2
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: false
    - id: 5
      name: company
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: false
    - id: 6
      name: subject
      label: Subject
      hint: What is this regarding?
      type: select_one
      options:
      - General Inquiry
      - Product Information
      - Sales Question
      - Support Request
      - Partnership Opportunity
      - Media Inquiry
      - Feedback
      - Other
      required: true
    - id: 7
      name: message
      label: Message
      hint: How can we help you?
      type: text
      options: []
      required: true
    - id: 8
      name: preferred_contact
      label: Preferred Contact Method
      hint: How should we reach you?
      type: select_one
      options:
      - Email
      - Phone
      - Either
      required: false
    - id: 9
      name: newsletter_signup
      label: Would you like to receive our newsletter?
      hint: Marketing updates
      type: select_one
      options:
      - Yes, please
      - No, thank you
      required: false
    - id: 10
      name: submit_date
      label: Submission Date
      hint: Today's date
      type: date
      options: []
      required: true
