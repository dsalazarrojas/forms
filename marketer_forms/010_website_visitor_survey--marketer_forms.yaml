inputSchema:
  type: object
  properties:
    title: Website Visitor Survey
    pages:
    - id: 1
      name: first_time
      label: What was your first time visiting our website?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: how_easily_info_found
      label: How easy was it for you to find the information you needed on our website?
      hint: null
      type: select_one
      options:
      - Easy
      - Hard
      - Very hard
      required: true
    - id: 3
      name: services_of_interest
      label: Which of our services are you most interested in learning more about?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 4
      name: impression_of_website
      label: What did you think of our website?
      hint: null
      type: radio
      options:
      - Good
      - Fair
      - Bad
      required: false
    - id: 5
      name: what_learned
      label: What did you learn from our website?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: will_use_again
      label: Would you use our website again?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: services_of_interest_2
      label: Which of our services are you interested in?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 8
      name: what_learned_from_website
      label: What Learned From Website
      hint: null
      type: text
      options: []
      required: false
