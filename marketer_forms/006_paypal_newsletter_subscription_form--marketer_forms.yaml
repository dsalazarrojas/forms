inputSchema:
  type: object
  properties:
    title: PayPal Newsletter Subscription Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: email_verification
      label: Confirm Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: subscription_format
      label: Subscription Format
      hint: null
      type: select_multiple
      options:
      - digital
      - print
      - both
      required: false
    - id: 6
      name: subscription_duration
      label: Subscription Duration
      hint: null
      type: select_one
      options:
      - month
      - quarter
      - half year
      - year
      required: false
    - id: 7
      name: subscription_start_date
      label: Subscription Start Date
      hint: null
      type: date
      options: []
      required: false
