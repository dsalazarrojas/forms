inputSchema:
  type: object
  properties:
    title: User Persona Survey
    pages:
    - id: 1
      name: marketer_forms_role
      label: What is your role in the organization?
      hint: null
      type: select_one
      options:
      - Marketing Manager
      - Sales Manager
      - Product Manager
      - IT Manager
      - Other
      required: false
    - id: 2
      name: marketer_forms_experience
      label: What is your level of experience with marketing tools?
      hint: null
      type: select_multiple
      options:
      - Novice
      - Intermediate
      - Advanced
      - Expert
      required: false
    - id: 3
      name: marketer_forms_automation_tools_use
      label: How do you currently use marketing automation tools?
      hint: null
      type: select_multiple
      options:
      - Social media automation
      - Email marketing
      - Content creation
      - Lead generation
      - Other (please specify)
      required: false
    - id: 4
      name: marketer_forms_communication_preferred
      label: What is your preferred way of communication?
      hint: null
      type: select_one
      options:
      - Email
      - Phone call
      - Messaging app
      - Video call
      - In-person meeting
      required: false
    - id: 5
      name: marketer_forms_experience_years
      label: How many years do you have in experience with marketing software?
      hint: null
      type: number
      options: []
      required: false
