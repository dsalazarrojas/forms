inputSchema:
  type: object
  properties:
    title: Advertising Quiz Template
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: role
      label: Role or Title
      hint: Job title or position
      type: text
      options: []
      required: false
    - id: 3
      name: experience_level
      label: Advertising Experience Level
      hint: Select the option that best matches your experience
      type: select_one
      options: [Beginner, Intermediate, Advanced, Expert]
      required: true
    - id: 4
      name: platform_preference
      label: Platform Preference
      hint: Platforms you are most familiar with
      type: select_multiple
      options: [Facebook, Google Ads, LinkedIn, Instagram, TikTok]
      required: false
    - id: 5
      name: budget_planning
      label: Budget Planning Confidence
      hint: How comfortable are you planning ad budgets
      type: select_one
      options: [Not Confident, Somewhat Confident, Confident, Very Confident]
      required: true
    - id: 6
      name: case_study_question
      label: Case Study Question
      hint: Short answer describing an ad campaign you managed
      type: text
      options: []
      required: false
    - id: 7
      name: analytic_tools
      label: Analytic Tools Used
      hint: Tools you use for measuring ad performance
      type: select_multiple
      options: [Google Analytics, Tableau, Adobe Analytics, Inhouse Tools]
      required: false
    - id: 8
      name: score_email
      label: Email to Receive Score
      hint: Optional email to receive the quiz results
      type: email
      options: []
      required: false
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: Any other information you want to share
      type: text
      options: []
      required: false
