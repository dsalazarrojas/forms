    - id: 5
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: keywords
      label: Keywords
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: budget
      label: Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: deadline
      label: Deadline
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: seo_strategy
      label: Seo Strategy
      hint: null
      type: select_multiple
      options:
      - '{''SEO 1'': ''Page 1''}'
      - '{''SEO 2'': ''Page 2''}'
      - '{''SEO 3'': ''Page 3''}'
