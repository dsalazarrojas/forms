inputSchema:
  type: object
  properties:
    title: Black Friday Flash Sale Sign Up Form
    pages:
    - id: 1
      name: section_personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: For confirmation and updates
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Optional if email provided
      type: text
      options: []
      required: false
    - id: 5
      name: product_interest
      label: Product interest
      hint: Select the item you want to be notified about
      type: select_one
      options:
      - Wireless headphones
      - Smart home speaker
      - Limited edition jacket
      - Other
      required: true
    - id: 6
      name: desired_quantity
      label: Desired quantity
      hint: Enter a whole number
      type: number
      options: []
      required: true
    - id: 7
      name: preferred_store_location
      label: Preferred store location
      hint: Choose where you prefer pickup
      type: select_one
      options:
      - Downtown store
      - Mall location
      - Online pickup
      required: false
    - id: 8
      name: promo_code
      label: Promo code
      hint: If you have a promotional code enter it here
      type: text
      options: []
      required: false
    - id: 9
      name: opt_in_marketing
      label: Opt in to marketing communications
      hint: Receive future offers via email
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any special requests or accessibility needs
      type: text
      options: []
      required: false
