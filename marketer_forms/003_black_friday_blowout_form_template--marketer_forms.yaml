inputSchema:
  type: object
  properties:
    title: Black Friday Blowout Form Template
    pages:
    - id: 1
      name: welcome_message
      label: Welcome to Our Black Friday Blowout
      hint: Fill out this form to access exclusive Black Friday deals and promotions
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: We will send deals to this email
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: For SMS deal alerts
      type: text
      options: []
      required: false
    - id: 6
      name: preferred_contact
      label: Preferred Contact Method
      hint: How should we reach you
      type: select_one
      options:
      - Email
      - Phone Call
      - SMS Text
      required: true
    - id: 7
      name: shopping_preferences
      label: Shopping Preferences
      hint: What categories interest you most
      type: select_multiple
      options:
      - Electronics
      - Clothing and Fashion
      - Home and Garden
      - Beauty and Personal Care
      - Sports and Outdoors
      - Toys and Games
      - Books and Media
      required: true
    - id: 8
      name: budget_range
      label: Budget Range
      hint: Your planned spending range
      type: select_one
      options:
      - Under $100
      - $100-$250
      - $251-$500
      - $501-$1000
      - Over $1000
      required: true
    - id: 9
      name: favorite_brands
      label: Favorite Brands
      hint: Brands you love to shop
      type: text
      options: []
      required: false
    - id: 10
      name: deal_type_preference
      label: Deal Type Preference
      hint: What kind of deals do you prefer
      type: select_one
      options:
      - Percentage Discounts
      - Dollar Amount Off
      - Buy One Get One Free
      - Free Shipping
      - Bundle Deals
      required: true
    - id: 11
      name: shopping_time_preference
      label: Shopping Time Preference
      hint: When do you prefer to shop
      type: select_one
      options:
      - Early Morning
      - Midday
      - Evening
      - Late Night
      - Online Anytime
      required: false
    - id: 12
      name: newsletter_signup
      label: Newsletter Signup
      hint: Receive weekly deals and promotions
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: referral_source
      label: How Did You Find Us
      hint: Where did you hear about this promotion
      type: select_one
      options:
      - Social Media
      - Email
      - Friend or Family
      - Search Engine
      - Advertisement
      - Other
      required: false
    - id: 14
      name: special_requests
      label: Special Requests
      hint: Any specific products or deals you want
      type: text
      options: []
      required: false
