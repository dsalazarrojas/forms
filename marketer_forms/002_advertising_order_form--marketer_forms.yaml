inputSchema:
  type: object
  properties:
    title: Advertising Order Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Full legal name of client
      type: text
      options: []
      required: true
    - id: 2
      name: organization
      label: Organization
      hint: Company or organization name
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Email used for order confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: product_or_service
      label: Product or Service to Promote
      hint: Short description of the offering
      type: text
      options: []
      required: true
    - id: 5
      name: ad_format
      label: Ad Format
      hint: Choose the ad creative format
      type: select_one
      options:
      - Banner
      - Video
      - Native
      - Sponsored Post
      - Audio
      required: true
    - id: 6
      name: run_duration_weeks
      label: Run Duration weeks
      hint: Number of weeks the ad will run
      type: number
      options: []
      required: true
    - id: 7
      name: total_cost
      label: Total Cost Estimate
      hint: Estimated total cost in USD
      type: number
      options: []
      required: true
    - id: 8
      name: billing_contact
      label: Billing Contact Name
      hint: Name for billing enquiries
      type: text
      options: []
      required: false
    - id: 9
      name: billing_email
      label: Billing Email
      hint: Email address for invoices
      type: email
      options: []
      required: false
    - id: 10
      name: terms_acknowledgement
      label: Terms and Conditions Acknowledgement
      hint: Confirm acceptance of advertising terms
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
