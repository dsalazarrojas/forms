inputSchema:
  type: object
  properties:
    title: internet_usage_survey_template
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: internet_service_usage
      label: internet_service_usage
      hint: null
      type: select_one
      options:
      - Mobile
      - Desktop
      - Laptop
      - Other
      required: true
    - id: 3
      name: internet_service_frequency
      label: How often do you use the internet?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Several times a week
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 4
      name: internet_service_length
      label: How long do you spend on the internet each day?
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: most_common_internet_activity
      label: What is your most common internet activity?
      hint: null
      type: select_one
      options:
      - Social media
      - Email
      - Online shopping
      - Streaming media
      - Other
      required: true
    - id: 6
      name: demographic_age
      label: What is your age?
      hint: null
      type: select_one
      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55+
      required: true
    - id: 7
      name: contact_information
      label: Do you have a preferred contact method for communication?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Text message
      - Other
      required: false
    - id: 8
      name: internet_usage_survey_comments
      label: Additional comments or feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: internet_usage_survey_agreement
      label: Do you agree with our internet usage survey terms?
      hint: null
      type: select_one
      options:
      - Agree
      - Disagree
      - Neutral
      required: true
    - id: 10
      name: consent
      label: Consent to data collection
      hint: null
      type: select_one
      options:
      - Agree
      - Disagree
      - Neutral
      required: true
