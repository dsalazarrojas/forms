inputSchema:
  type: object
  properties:
    title: Responsive Wordpress Sidebar Contact Form
    pages:
    - id: 1
      name: field_1
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: field_2
      label: What is your email?
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: field_3
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: field_4
      label: What date were you born?
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: field_5
      label: What time do you wake up?
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: field_6
      label: What is your favorite color?
      hint: null
      type: select_one
      options:
      - Red
      - Blue
      - Green
      - Yellow
      - Purple
      required: false
    - id: 7
      name: field_7
      label: Are you available for an appointment?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 8
      name: field_8
      label: What is your preferred contact method?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text
      - Mail
      required: false
    - id: 9
      name: field_9
      label: What is the best time for you to meet?
      hint: null
      type: select_one
      options:
      - 8-12am
      - 1-2pm
      - 3-4pm
      - 5-6pm
      - 7-8pm
      - 9-10pm
      - 11pm-12am
      - 6-7am
      - 7-8am
      - 9-10am
      - 11am-12pm
      required: false
    - id: 10
      name: field_10
      label: What is your preferred time zone?
      hint: null
      type: select_multiple
      options:
      - UTC
      - EST
      - CST
      - PST
      - MST
      required: false
    - id: 11
      name: field_11
      label: What is the best day for you to meet?
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
