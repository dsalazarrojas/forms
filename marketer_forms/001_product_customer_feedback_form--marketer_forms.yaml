inputSchema:
  type: object
  properties:
    title: Product Customer Feedback Form
    pages:
    - id: 1
      name: customer_feedback_1
      label: Product Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 2
      name: product_name_1
      label: What do you think about this product?
      hint: Please provide your honest feedback.
      type: text
      options: []
      required: false
    - id: 3
      name: overall_satisfaction_1
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Somewhat Satisfied
      - Satisfied
      - Very Satisfied
      required: false
    - id: 4
      name: product_rating_1
      label: Product Rating 1
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: product_improvement_1
      label: How can we improve this product?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_feedback_1
      label: Additional feedback
      hint: Please provide any additional comments or feedback.
      type: text
      options: []
      required: false
    - id: 7
      name: phone_1
      label: Phone
      hint: Phone
      type: text
      options: []
      required: false
    - id: 8
      name: email_1
      label: Email
      hint: Email
      type: email
      options: []
      required: false
    - id: 9
      name: date_1
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: time_1
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: note_1
      label: Note
      hint: null
      type: note
      options: []
      required: false
