          - Beach Resort
          - Cultural City Tour
          - Luxury Spa Retreat
          - Off the Grid Cabin
        required: true
      - id: 9
        name: question_7
        label: Communication Style
        hint: How do you communicate with others
        type: select_one
        options:
          - Direct and Confident
          - Warm and Friendly
          - Professional and Polished
          - Witty and Playful
          - Thoughtful and Deep
