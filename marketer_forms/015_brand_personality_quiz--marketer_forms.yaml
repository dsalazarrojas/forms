inputSchema:
  type: object
  properties:
    title: Brand Personality Quiz
    pages:
      - id: 1
        name: quiz_taker_name
        label: Your Name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: quiz_taker_email
        label: Email Address
        hint: To receive your results
        type: email
        options: []
        required: true
      - id: 3
        name: question_1
        label: Choose a Color Palette
        hint: Which color palette appeals to you most
        type: select_one
        options:
          - Bold and Vibrant Reds and Oranges
          - Calm Blues and Greens
          - Elegant Black and Gold
          - Soft Pastels
          - Neutral Earth Tones
        required: true
      - id: 4
        name: question_2
        label: Pick a Weekend Activity
        hint: What would you rather do on a weekend
        type: select_one
        options:
          - Adventure Sports or Outdoor Activities
          - Relax at Home with a Good Book
          - Attend a Fancy Event or Gala
          - Hang Out with Friends
          - Work on a Creative Project
        required: true
      - id: 5
        name: question_3
        label: Choose a Car
        hint: Which car best matches your style
        type: select_one
        options:
          - Sports Car
          - SUV or Family Vehicle
          - Luxury Sedan
          - Eco-Friendly Hybrid
          - Classic Vintage Car
        required: true
      - id: 6
        name: question_4
        label: Social Media Style
        hint: How do you use social media
        type: select_one
        options:
