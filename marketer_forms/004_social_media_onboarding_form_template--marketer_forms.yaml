      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: social_media_management_experience
      label: Social Media Management Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: work_experience
