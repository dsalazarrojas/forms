inputSchema:
  type: object
  properties:
    title: snail_mailing_list_request
    pages:
    - id: 1
      name: page_1
      label: General Contact Information
      hint: Enter your name and contact email.
      type: text
      options: []
      required: true
    - id: 2
      name: page_2
      label: Type of Form
      hint: Choose the type of form you need.
      type: select_one
      options:
      - Marketer Forms
      - Other
      required: true
    - id: 3
      name: page_3
      label: Specific Tool Assignment
      hint: Choose the specific tool.
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
    - id: 4
      name: page_4
      label: Output File Name
      hint: Enter the name or URL of the output file.
      type: text
      options: []
      required: true
    - id: 5
      name: page_5
      label: Form IDs
      hint: Enter the list of IDs for the form.
      type: text
      options: []
      required: true
    - id: 6
      name: page_6
      label: Date of Request
      hint: Select the date of the request.
      type: date
      options: []
      required: true
