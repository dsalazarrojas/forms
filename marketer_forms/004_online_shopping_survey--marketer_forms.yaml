inputSchema:
  type: object
  properties:
    title: Online Shopping Survey
    pages:
    - id: 1
      name: store_type
      label: Store Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: store_name
      label: Store Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 7
      name: purchase_date
      label: Purchase Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: purchase_time
      label: Purchase Time
      hint: null
      type: time
      options: []
      required: false
