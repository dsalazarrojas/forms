      - Culture
      - Sports
      - Music
      - Food
      - Travel
      - Technology
      - Business
      - Health
      - Environment
      - Politics
      - Social
      - Education
      - Other
      required: true
    - id: 12
      name: attendee_occupation
      label: Attendee Occupation
      hint: null
      type: text
      options: []
      required: false
