inputSchema:
  type: object
  properties:
    title: Branding Questionnaire
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Official name of your business
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Name
      hint: Primary contact person
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Email address for communication
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 5
      name: business_age
      label: How Long in Business
      hint: Years in operation
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-10 years
      - 10+ years
      required: true
    - id: 6
      name: business_summary
      label: Business Summary
      hint: Describe what your business does
      type: text
      options: []
      required: true
    - id: 7
      name: products_services
      label: Products or Services
      hint: What do you sell or offer
      type: text
      options: []
      required: true
    - id: 8
      name: target_customer
      label: Target Customer
      hint: Describe your ideal customer
      type: text
      options: []
      required: true
    - id: 9
      name: customer_pain_points
      label: Customer Pain Points
      hint: What problems do you solve for customers
      type: text
      options: []
      required: true
    - id: 10
      name: unique_selling_proposition
      label: Unique Selling Proposition
      hint: What makes you different
      type: text
      options: []
      required: true
    - id: 11
      name: main_competitors
      label: Main Competitors
      hint: Who competes with you
      type: text
      options: []
      required: true
    - id: 12
      name: competitor_advantages
      label: Your Advantages Over Competitors
      hint: Why customers choose you
      type: text
      options: []
      required: true
    - id: 13
      name: brand_keywords
      label: Brand Keywords
      hint: Words that should describe your brand
      type: select_multiple
      options:
      - Innovative
      - Reliable
      - Affordable
      - Premium
      - Friendly
      - Professional
      - Creative
      - Trustworthy
      - Bold
      - Sustainable
      required: true
    - id: 14
      name: brand_voice
      label: Brand Voice
      hint: How should your brand sound
      type: select_one
      options:
      - Casual and Friendly
      - Professional and Formal
      - Witty and Fun
      - Serious and Authoritative
      - Inspirational
      required: true
    - id: 15
      name: existing_brand_assets
      label: Existing Brand Assets
      hint: Do you have existing logos or colors
      type: select_one
      options:
      - None
      - Logo Only
      - Colors Only
      - Full Brand System
      required: true
    - id: 16
      name: logo_preferences
      label: Logo Preferences
      hint: What style of logo do you prefer
      type: select_one
      options:
      - Text Based
      - Icon Based
      - Combination
      - Abstract
      - Minimalist
      required: false
    - id: 17
      name: color_preferences
      label: Color Preferences
      hint: Preferred colors or palettes
      type: text
      options: []
      required: false
    - id: 18
      name: colors_to_avoid
      label: Colors to Avoid
      hint: Any colors you do not want
      type: text
      options: []
      required: false
    - id: 19
      name: brand_applications
      label: Where Will Brand Be Used
      hint: Select all that apply
      type: select_multiple
      options:
      - Website
      - Social Media
      - Business Cards
      - Signage
      - Packaging
      - Advertising
      - Merchandise
      - Print Materials
      required: true
    - id: 20
      name: design_likes
      label: Designs You Like
      hint: Brands with designs you admire
      type: text
      options: []
      required: false
    - id: 21
      name: design_dislikes
      label: Designs You Dislike
      hint: Any designs you want to avoid
      type: text
      options: []
      required: false
    - id: 22
      name: project_timeline
      label: Project Timeline
      hint: When do you need this completed
      type: text
      options: []
      required: true
    - id: 23
      name: budget_expectations
      label: Budget Expectations
      hint: Estimated budget range
      type: text
      options: []
      required: true
