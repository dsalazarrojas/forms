inputSchema:
  type: object
  properties:
    title: Construction Zone Collapse Incident Form
    pages:
    - id: 1
      name: incident_report_number
      label: Incident Report Number
      hint: Auto-generated or manual report ID
      type: text
      options: []
      required: true
    - id: 2
      name: incident_date
      label: Date of Incident
      hint: When did the incident occur
      type: date
      options: []
      required: true
    - id: 3
      name: incident_time
      label: Time of Incident
      hint: Exact time the incident occurred
      type: time
      options: []
      required: true
    - id: 4
      name: project_name
      label: Project Name
      hint: Name of the construction project
      type: text
      options: []
      required: true
    - id: 5
      name: project_location
      label: Project Location
      hint: Full address of the construction site
      type: text
      options: []
      required: true
    - id: 6
      name: specific_zone
      label: Specific Zone of Collapse
      hint: Area or section where collapse occurred
      type: text
      options: []
      required: true
    - id: 7
      name: reporter_name
      label: Reporter Name
      hint: Name of person reporting the incident
      type: text
      options: []
      required: true
    - id: 8
      name: reporter_position
      label: Reporter Position
      hint: Job title or role
      type: text
      options: []
      required: true
    - id: 9
      name: reporter_contact
      label: Reporter Contact Information
      hint: Phone and email
      type: text
      options: []
      required: true
    - id: 10
      name: collapse_type
      label: Type of Collapse
      hint: Select the type of structural collapse
      type: select_one
      options:
      - Partial Structural Collapse
      - Complete Structural Collapse
      - Scaffolding Collapse
      - Trench Collapse
      - Roof Collapse
      - Wall Collapse
      - Floor Collapse
      - Other
      required: true
    - id: 11
      name: injuries_reported
      label: Were There Any Injuries
      hint: Select yes if anyone was injured
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: injury_details
      label: Injury Details
      hint: Describe injuries sustained if applicable
      type: text
      options: []
      required: false
    - id: 13
      name: fatalities
      label: Were There Any Fatalities
      hint: Select yes if there were any deaths
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: number_of_people_affected
      label: Number of People Affected
      hint: Total number of workers or others affected
      type: number
      options: []
      required: true
    - id: 15
      name: weather_conditions
      label: Weather Conditions at Time of Incident
      hint: Describe weather if relevant
      type: select_one
      options:
      - Clear/Sunny
      - Cloudy
      - Rainy
      - Stormy
      - Windy
      - Snowy
      - Foggy
      - Not Applicable - Indoor Site
      required: false
    - id: 16
      name: potential_causes
      label: Potential Causes of Collapse
      hint: Select all that may apply
      type: select_multiple
      options:
      - Structural Design Flaw
      - Material Failure
      - Overloading
      - Excavation Issues
      - Weather Related
      - Equipment Failure
      - Human Error
      - Sabotage
      - Unknown
      required: true
    - id: 17
      name: immediate_actions_taken
      label: Immediate Actions Taken
      hint: Describe emergency response and immediate actions
      type: text
      options: []
      required: true
    - id: 18
      name: emergency_services_notified
      label: Were Emergency Services Notified
      hint: Select yes if police, fire, or EMS were called
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: area_evacuated
      label: Was the Area Evacuated
      hint: Select yes if evacuation occurred
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: photos_attached
      label: Photos or Videos Attached
      hint: Select if visual documentation is available
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 21
      name: witness_names
      label: Witness Names
      hint: List names of any witnesses
      type: text
      options: []
      required: false
    - id: 22
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
