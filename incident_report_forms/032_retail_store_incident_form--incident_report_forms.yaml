inputSchema:
  type: object
  properties:
    title: retail_store_incident_form
    pages:
    - id: 1
      name: incident_date
      label: Date of the incident
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: incident_time
      label: Time of the incident
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: incident_type
      label: Type of incident
      hint: null
      type: select_one
      options:
