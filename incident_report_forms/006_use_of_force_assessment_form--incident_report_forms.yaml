inputSchema:
  type: object
  properties:
    title: Use Of Force Assessment Form
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: use_of_force_details
      label: Use Of Force Details
      hint: Provide a detailed account of the use of force
      type: text
      options: []
      required: false
    - id: 3
      name: officer_in_charge
      label: Officer In Charge
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Smith
      - Jim Brown
      required: false
    - id: 4
      name: suspect
      label: Suspect
      hint: null
      type: select_multiple
      options:
      - Suspect 1
      - Suspect 2
      - Suspect 3
      required: false
    - id: 5
      name: witnesses
      label: Witnesses
      hint: List any witnesses
      type: select_multiple
      options:
      - Witness 1
      - Witness 2
      - Witness 3
      required: false
    - id: 6
      name: officer_involved
      label: Officer Involved
      hint: null
      type: select_multiple
      options:
      - Officer 1
      - Officer 2
      - Officer 3
      required: false
    - id: 7
      name: incident_location
      label: Incident Location
      hint: Provide a detailed account of the incident location
      type: text
      options: []
      required: false
    - id: 8
      name: incident_time
      label: Incident Time
      hint: Provide the time of the incident
      type: time
      options: []
      required: false
    - id: 9
      name: officer_response
      label: Officer Response
      hint: null
      type: select_one
      options:
      - Response 1
      - Response 2
      - Response 3
      required: false
    - id: 10
      name: investigation_status
      label: Investigation Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: Additional information about the incident
      type: text
      options: []
      required: false
