      name: service_name
      label: Service Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: impact
      label: Impact
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: cause
      label: Cause
      hint: null
      type: text
      options: []
      required: false
