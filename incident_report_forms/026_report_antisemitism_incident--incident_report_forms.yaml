inputSchema:
  type: object
  properties:
    title: Report Antisemitism Incident
    pages:
    - id: 1
      name: incident_report
      label: Incident Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: location
      label: Location
      hint: Where did the incident occur?
      type: text
      options: []
      required: false
    - id: 4
      name: incident_reporter
      label: Incident Reporter
      hint: null
      type: select_multiple
      options:
      - School/Teacher
      - Parent
      - Student
      required: true
    - id: 5
      name: antisemitism_incident_details
      label: Antisemitism Incident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: witness
      label: Witness
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: incident_reporter_info
      label: Incident Reporter Info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: incident_followup
      label: Follow-up Information
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: incident_resolution
      label: Incident Resolution
      hint: null
      type: text
      options: []
      required: false
