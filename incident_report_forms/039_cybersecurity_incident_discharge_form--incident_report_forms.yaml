inputSchema:
  type: object
  properties:
    title: Cybersecurity Incident Discharge Form
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Malware
      - Phishing
      - Ransomware
      - Other
      required: false
    - id: 3
      name: incident_description
      label: Incident Description
      hint: Please provide detailed description of the incident.
      type: text
      options: []
      required: false
    - id: 4
      name: threat_actor
      label: Threat Actor
      hint: null
      type: select_multiple
      options:
      - Human
      - Nation-state
      - Other
      required: false
    - id: 5
      name: affected_asset
      label: Affected Asset
      hint: null
      type: select_multiple
      options:
      - Computer Network
      - Data
      - Software
      - Hardware
      - Personnel
      required: false
    - id: 6
      name: incident_reported
      label: Incident Reported
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Active
      - Resolved
      - Inactive
      required: false
    - id: 8
      name: incident_reporter
      label: Incident Reporter
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: incident_reported_by
      label: Incident Reported By
      hint: null
      type: text
      options: []
      required: false
