inputSchema:
  type: object
  properties:
    title: inventory_system_failure_contact_form
    pages:
    - id: 1
      name: incident_report
      label: Incident Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_details
      label: Contact Details
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - None
      required: false
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 5
      name: urgency
      label: Urgency
      hint: null
      type: select_one
      options:
      - Urgent
      - Non-urgent
      required: true
    - id: 6
      name: asset_impact
      label: Asset Impact
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: incident_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: incident_time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: report_status
      label: Report Status
      hint: null
      type: select_one
      options:
      - Open
      - In Progress
      - Resolved
      required: false
