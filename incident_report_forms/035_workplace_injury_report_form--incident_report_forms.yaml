inputSchema:
  type: object
  properties:
    title: Workplace Injury Report Form
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: injured_part
      label: Injured Part
      hint: null
      type: select_one
      options:
      - Head
      - Neck
      - Back
      - Other
      required: false
    - id: 5
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Slip/Trip
      - Strain
      - Burn
      - Other
      required: false
    - id: 6
      name: witness
      label: Witness
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: first_aid_administered
      label: First Aid Administered
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_attendance
      label: Medical Attendance
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: hospitalisation
      label: Hospitalisation
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: workcover
      label: Workcover
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: incident_cause
      label: Incident Cause
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: false
