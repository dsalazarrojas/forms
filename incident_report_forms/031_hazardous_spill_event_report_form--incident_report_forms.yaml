inputSchema:
  type: object
  properties:
    title: Hazardous Spill Event Report Form
    pages:
    - id: 1
      name: submitter
      label: Submitter
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: report_type
      label: Report Type
      hint: null
      type: select_one
      options:
      - Spill
      - Other
      - Report
      required: true
    - id: 5
      name: hazardous_materials_involved
      label: Hazardous Materials Involved
      hint: null
      type: select_multiple
      options:
      - Fuel
      - Chemicals
      - Other
      - Gas
      required: false
    - id: 6
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: actions_taken
      label: Actions Taken
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Active
      - Closed
      required: true
    - id: 9
      name: submitter_info
      label: Submitter Info
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: submitter_email
      label: Submitter Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: submitter_phone
      label: Submitter Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
