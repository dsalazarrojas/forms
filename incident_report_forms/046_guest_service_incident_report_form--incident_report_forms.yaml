inputSchema:
  type: object
  properties:
    title: Guest Service Incident Report Form
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: incident_category
      label: Incident Category
      hint: null
      type: select_multiple
      options:
      - Hotel
      - Food and Beverage
      - Housekeeping
      - Room Service
      - Other
      required: true
    - id: 3
      name: incident_location
      label: Incident Location
      hint: null
      type: select_multiple
      options:
      - Front Desk
      - Pool Area
      - Restaurant
      - Room
      - Parking
      - Other
      required: true
    - id: 4
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: action_taken
      label: Action
      hint: null
      type: select_multiple
      options:
      - Follow-up
      - Review
      - Resolution
      - Other
      required: true
    - id: 6
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: guest_email
      label: Guest Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: employee_department
      label: Employee Department
      hint: null
      type: select_multiple
      options:
      - Front Desk
      - Food and Beverage
      - Housekeeping
      - Engineering
      - Other
      required: true
    - id: 10
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: follow_up_date
      label: Follow-up Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: follow_up_status
      label: Follow-up Status
      hint: null
      type: select_multiple
      options:
      - Done
      - In progress
      required: true
    - id: 13
      name: employee_confirmation
      label: Employee Confirmation
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: guest_confirmation
      label: Guest Confirmation
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
