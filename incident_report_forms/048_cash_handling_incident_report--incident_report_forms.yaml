    - id: 2
      name: incident_id
      label: Incident ID Number
      hint: Reference number
      type: text
      options: []
      required: false
    - id: 3
      name: report_date
      label: Report Date
      hint: Date of report
      type: date
      options: []
      required: true
    - id: 4
      name: report_time
      label: Report Time
      hint: Time of report
      type: time
      options: []
      required: false
    - id: 5
      name: location_info
      label: Location Information
      hint: Where incident occurred
      type: note
      options: []
      required: false
    - id: 6
      name: location_name
      label: Location or Store Name
      hint: Facility name
      type: text
      options: []
      required: true
    - id: 7
      name: department
      label: Department
      hint: Specific area
      type: text
      options: []
      required: false
    - id: 8
      name: register_number
      label: Register or Till Number
      hint: Specific register
      type: text
      options: []
      required: false
    - id: 9
      name: incident_details
      label: Incident Details
      hint: What happened
      type: note
      options: []
      required: false
