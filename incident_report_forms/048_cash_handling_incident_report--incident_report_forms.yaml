      name: incident_type
      label: Type of Incident
      hint: Category
      type: select_one
      options:
      - Cash shortage
      - Cash overage
      - Counterfeit bill received
      - Check fraud
      - Credit card fraud
      - Theft or suspected theft
      - Robbery
      - Safe error
      - Deposit discrepancy
      - Other
      required: true
    - id: 13
      name: incident_description
      label: Detailed Description
      hint: What happened
      type: text
      options: []
      required: true
    - id: 14
      name: discovered_by
      label: Discovered By
      hint: Who found it
      type: text
      options: []
      required: true
    - id: 15
      name: discovery_method
      label: How Was It Discovered
      hint: Detection method
      type: select_one
      options:
      - Cash count
      - Register reconciliation
      - Safe audit
      - Deposit preparation
      - Customer complaint
      - Surveillance review
      - Tip or report
      - Other
      required: true
    - id: 16
      name: persons_involved
      label: Persons Involved
      hint: Who was involved
      type: note
      options: []
