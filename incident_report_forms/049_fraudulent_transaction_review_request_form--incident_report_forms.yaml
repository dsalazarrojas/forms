      - Debit
      - Credit
      - Prepaid
      required: false
    - id: 12
      name: reason_for_suspiciousness
      label: Reason For Suspiciousness
      hint: Provide reason for suspiciousness
      type: text
      options: []
      required: false
    - id: 13
      name: supporting_documents
      label: Supporting Documents
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: submitter
      label: Submitter
      hint: null
      type: text
      options: []
      required: false
