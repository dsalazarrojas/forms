      name: transaction_details
      label: Transaction Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: suspect_info
      label: Suspect Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: transaction_amount
      label: Transaction Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: suspect_location
      label: Suspect Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: suspect_phone
      label: Suspect Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: suspect_email
      label: Suspect Email
      hint: null
      type: email
      options: []
      required: false
