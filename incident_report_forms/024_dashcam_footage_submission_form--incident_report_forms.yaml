inputSchema:
  type: object
  properties:
    title: Dashcam Footage Submission Form
    pages:
    - id: 1
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: vehicle_registration_number
      label: Vehicle Registration Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: incident_type
      label: Type of Incident
      hint: null
      type: select_one
      options:
      - Roadside
      - Intersection
      - Work Zone
      - Other
      required: true
    - id: 5
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
