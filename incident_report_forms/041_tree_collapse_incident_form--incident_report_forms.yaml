inputSchema:
  type: object
  properties:
    title: Tree Collapse Incident Form
    pages:
    - id: 1
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Tree collapse
      - Root failure
      - Branch failure
      - Trunk failure
      required: false
    - id: 5
      name: tree_height
      label: Tree Height
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: tree_age
      label: Tree Age
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: incident_reporter
      label: Incident Reporter
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: incident_response_time
      label: Incident Response Time
      hint: null
      type: time
      options: []
      required: false
