inputSchema:
  type: object
  properties:
    title: Incident Severity Classification Form
    pages:
    - id: 1
      name: incident_severity_classification_form
      label: incident_severity_classification
      hint: null
      type: select_one
      options:
      - Critical
      - High
      - Medium
      - Low
      required: true
    - id: 2
      name: follow_up_details
      label: follow_up_details
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Chat
      required: true
    - id: 3
      name: incident_date
      label: incident_date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: incident_time
      label: incident_time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: incident_location
      label: incident_location
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: incident_description
      label: incident_description
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: follow_up_method
      label: follow_up_method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Chat
      required: true
    - id: 8
      name: follow_up_status
      label: follow_up_status
      hint: null
      type: select_one
      options:
      - Completed
      - In Progress
      - Not Started
      required: true
