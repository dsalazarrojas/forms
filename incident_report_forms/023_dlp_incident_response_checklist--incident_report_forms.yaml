inputSchema:
  type: object
  properties:
    title: DLP Incident Response Checklist
    pages:
    - id: 1
      name: incident_type
      label: Incident Type
      hint: Select incident type
      type: select_one
      options:
      - Security
      - Confidentiality
      - Integrity
      required: false
    - id: 2
      name: incident_description
      label: Incident Description
      hint: Provide a detailed description of the incident
      type: text
      options: []
      required: false
    - id: 3
      name: incident_date
      label: Incident Date
      hint: Date of the incident
      type: date
      options: []
      required: false
    - id: 4
      name: incident_time
      label: Incident Time
      hint: Time of the incident
      type: time
      options: []
      required: false
    - id: 5
      name: incident_reported_by
      label: Incident Reported By
      hint: Name of the person who reported the incident
      type: text
      options: []
      required: false
    - id: 6
      name: incident_reported_to
      label: Incident Reported To
      hint: Name of the person who received the report
      type: text
      options: []
      required: false
    - id: 7
      name: incident_responded_by
      label: Incident Responded By
      hint: Name of the person who responded to the incident
      type: text
      options: []
      required: false
    - id: 8
      name: incident_responded_to
      label: Incident Responded To
      hint: Name of the person who was responded to
      type: text
      options: []
      required: false
    - id: 9
      name: incident_closed
      label: Incident Closed
      hint: Date of the incident closure
      type: date
      options: []
      required: false
    - id: 10
      name: incident_closed_by
      label: Incident Closed By
      hint: Name of the person who closed the incident
      type: text
      options: []
      required: false
    - id: 11
      name: incident_note
      label: Incident Note
      hint: Additional comments or notes about the incident
      type: text
      options: []
      required: false
    - id: 12
      name: incident_note_level
      label: Incident Note Level
      hint: Severity level of the incident
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      - Critical
      - Urgent
      required: false
    - id: 13
      name: incident_response_team_note
      label: Incident Response Team Note
      hint: Notes for the incident response team
      type: text
      options: []
      required: false
