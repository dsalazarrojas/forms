      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: incident_manager
      label: Incident Manager
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: incident_comment
      label: Incident Comment
      hint: Please provide any additional comments.
      type: text
      options: []
      required: false
    - id: 13
      name: incident_resolution_method
      label: Resolution Method
      hint: null
      type: select_one
      options:
      - Automated
      - Manual
      - Other
      required: false
    - id: 14
      name: incident_resolution_comments
      label: Resolution Comments
      hint: Please provide any additional comments about the resolution.
      type: text
      options: []
      required: false
    - id: 15
