inputSchema:
  type: object
  properties:
    title: IT System Outage Incident Form
    pages:
    - id: 1
      name: incident_report_form
      label: Incident Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_description
      label: Incident Description
      hint: Please provide a detailed description of the incident.
      type: text
      options: []
      required: false
    - id: 3
      name: incident_date
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: false
