      name: incident_location
      label: Location of Incident
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: affected_systems
      label: Affected Systems
      hint: Please list all affected systems.
      type: select_multiple
      options:
      - Server
      - Network
      - Database
      - Other
      required: false
    - id: 7
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Active
      - In Progress
      - Resolved
      - Unknown
      required: false
