inputSchema:
  type: object
  properties:
    title: Football Match Incident Report Form
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: team_manager
      label: Team Manager
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: incident_type
      label: Incident Type
      hint: null
      type: select_multiple
      options:
      - Red card
      - Yellow card
      - Injury
      required: false
    - id: 6
      name: incident_details
      label: Incident Details
      hint: Describe the incident
      type: note
      options: []
      required: false
    - id: 7
      name: witness
      label: Witness
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: player_injured
      label: Player Injured
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 9
      name: referee_name
      label: Referee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: referee_id
      label: Referee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: stadium_name
      label: Stadium Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: stadium_address
      label: Stadium Address
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: venue
      label: Venue
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: incident_description
      label: Incident Description
      hint: Briefly describe the incident
      type: text
      options: []
      required: false
