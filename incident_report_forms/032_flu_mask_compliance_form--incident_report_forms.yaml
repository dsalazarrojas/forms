inputSchema:
  type: object
  properties:
    title: Flu Mask Compliance Form
    pages:
    - id: 1
      name: patient_info
      label: Employee Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
