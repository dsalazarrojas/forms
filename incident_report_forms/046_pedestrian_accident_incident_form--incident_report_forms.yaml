inputSchema:
  type: object
  properties:
    title: Pedestrian Accident Incident Form
    pages:
    - id: 1
      name: accident_date
      label: accident_date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: location
      label: location
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: incident_type
      label: incident_type
      hint: null
      type: select_one
      options:
      - Pedestrian vs Vehicle
      - Pedestrian vs Vehicle-Person
      - Pedestrian vs Vehicle-Person-Pedestrian
      - Pedestrian vs Animal
      - Pedestrian vs Animal-Pedestrian
      required: true
    - id: 5
      name: vehicle_involved
      label: vehicle_involved
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: pedestrian_involved
      label: pedestrian_involved
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: pedestrian_injuries
      label: pedestrian_injuries
      hint: null
      type: select_one
      options:
      - minor
      - No injuries
      - Critical
      - Fatal
      required: true
    - id: 8
      name: vehicle_damage
      label: vehicle_damage
      hint: null
      type: select_one
      options:
      - None
      - Minor
      - Moderate
      - Severe
      required: true
    - id: 9
      name: pedestrian_damage
      label: pedestrian_damage
      hint: null
      type: select_one
      options:
      - None
      - Minor
      - Moderate
      - Severe
      required: true
    - id: 10
      name: witness
