      - Material error
      - Process error
      - Material handling error
      - Machine error
      required: false
    - id: 6
      name: error_description
      label: Error Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: batch_error_code
      label: Batch Error Code
      hint: null
      type: select_multiple
      options:
      - Error 1
      - Error 2
      - Error 3
      - Error 4
      - Error 5
      required: false
    - id: 8
      name: material_error_code
      label: Material Error Code
      hint: null
      type: select_multiple
      options:
      - Error 1
      - Error 2
      - Error 3
      - Error 4
      - Error 5
      required: false
