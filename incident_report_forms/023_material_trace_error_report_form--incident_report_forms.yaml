      name: batch_number
      label: Batch Number
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: error_code
      label: Error Code
      hint: null
