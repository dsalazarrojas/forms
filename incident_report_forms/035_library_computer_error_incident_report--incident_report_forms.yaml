inputSchema:
  type: object
  properties:
    title: Library Computer Error Incident Report
    pages:
    - id: 1
      name: report_details
      label: Report Details
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Report Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: report_time
      label: Report Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Other
      - Hardware
      - Software
      - Network
      - Power
      required: true
    - id: 5
      name: incident_description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: incident_priority
      label: Priority
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Critical
      required: true
    - id: 8
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Open
      - In Progress
      - Resolved
      - Closed
      required: true
    - id: 12
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
