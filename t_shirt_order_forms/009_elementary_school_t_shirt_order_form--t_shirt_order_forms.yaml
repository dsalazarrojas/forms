inputSchema:
  type: object
  properties:
    title: Elementary School T Shirt Order Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: user_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: select_one
      label: Favorite Color
      hint: null
      type: select_one
      options:
      - red
      - blue
      - green
      - yellow
      required: true
    - id: 5
      name: select_multiple
      label: Interests
      hint: null
      type: select_multiple
      options:
      - math
      - science
      - reading
      - writing
      - art
      - music
      required: true
    - id: 6
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: Special Instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: payment_card
      label: Payment Card
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: payment_cvv
      label: CVV
      hint: null
      type: text
      options: []
      required: false
