inputSchema:
  type: object
  properties:
    title: Boy Scout Shirts Order Form
    pages:
    - id: 1
      name: troop_number
      label: Troop Number
      hint: Your Boy Scout troop number
      type: text
      options: []
      required: true
    - id: 2
      name: order_date
      label: Order Date
      hint: Date of order
      type: date
      options: []
      required: true
    - id: 3
      name: scout_first_name
      label: Scout First Name
      hint: Scout first name
      type: text
      options: []
      required: true
    - id: 4
      name: scout_last_name
      label: Scout Last Name
      hint: Scout last name
      type: text
      options: []
      required: true
    - id: 5
      name: scout_rank
      label: Scout Rank
      hint: Current rank
      type: select_one
      options:
      - Scout
      - Tenderfoot
      - Second Class
      - First Class
      - Star
      - Life
      - Eagle
      required: true
    - id: 6
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 7
      name: parent_phone
      label: Parent Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 8
      name: parent_email
      label: Parent Email
      hint: For order communications
      type: email
      options: []
      required: true
    - id: 9
      name: shirt_type
      label: Shirt Type
      hint: Type of scout shirt
      type: select_one
      options:
      - Tan field shirt (official)
      - Green field shirt (Venturing)
      - Blue cub scout shirt
      - Activity shirt
      required: true
    - id: 10
      name: shirt_size
      label: Shirt Size
      hint: Select size
      type: select_one
      options:
      - Youth XS
      - Youth S
      - Youth M
      - Youth L
      - Youth XL
      - Adult S
      - Adult M
      - Adult L
      - Adult XL
      - Adult 2XL
      - Adult 3XL
      - Adult 4XL
      required: true
    - id: 11
      name: sleeve_length
      label: Sleeve Length
      hint: Short or long sleeve
      type: select_one
      options:
      - Short sleeve
      - Long sleeve
      required: true
    - id: 12
      name: quantity
      label: Quantity
      hint: Number of shirts
      type: number
      options: []
      required: true
    - id: 13
      name: patches_needed
      label: Patches Needed
      hint: Select required patches
      type: select_multiple
      options:
      - Troop number patch
      - Council patch
      - American flag patch
      - World crest patch
      - Rank patch
      - Patrol patch
      - Order of the Arrow patch
      - Merit badge patches
      required: true
    - id: 14
      name: patch_placement
      label: Patch Placement
      hint: Special instructions for patches
      type: text
      options: []
      required: false
    - id: 15
      name: name_embroidery
      label: Name Embroidery
      hint: Do you want name embroidered
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: embroidery_name
      label: Embroidery Name
      hint: Name to embroider
      type: text
      options: []
      required: false
    - id: 17
      name: embroidery_thread_color
      label: Embroidery Thread Color
      hint: Color preference
      type: select_one
      options:
      - Red
      - Blue
      - Green
      - Gold
      - White
      - Black
      required: false
    - id: 18
      name: neckerchief_needed
      label: Neckerchief Needed
      hint: Do you need a neckerchief
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: neckerchief_slide_needed
      label: Neckerchief Slide Needed
      hint: Do you need a slide
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: belt_needed
      label: Belt Needed
      hint: Do you need a scout belt
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 21
      name: belt_size
      label: Belt Size
      hint: Waist size in inches
      type: text
      options: []
      required: false
    - id: 22
      name: other_items
      label: Other Items Needed
      hint: Any additional uniform items
      type: text
      options: []
      required: false
    - id: 23
      name: rush_order
      label: Rush Order
      hint: Do you need this urgently
      type: select_one
      options:
      - Yes, rush order
      - No, standard timing
      required: true
    - id: 24
      name: delivery_method
      label: Delivery Method
      hint: How will you receive order
      type: select_one
      options:
      - Pickup at troop meeting
      - Ship to home
      - Pickup at store
      required: true
    - id: 25
      name: shipping_address
      label: Shipping Address
      hint: If shipping, provide address
      type: text
      options: []
      required: false
    - id: 26
      name: subtotal
      label: Subtotal
      hint: Cost before tax
      type: text
      options: []
      required: true
    - id: 27
      name: tax
      label: Tax
      hint: Sales tax amount
      type: text
      options: []
      required: false
    - id: 28
      name: total_amount
      label: Total Amount
      hint: Total cost
      type: text
      options: []
      required: true
    - id: 29
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - Check
      - Cash
      - Troop account
      required: true
    - id: 30
      name: special_instructions
      label: Special Instructions
      hint: Any other notes
      type: text
      options: []
      required: false
