inputSchema:
  type: object
  properties:
    title: T Shirt Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: t_shirt_designs
      label: T Shirt Designs
      hint: null
      type: select_multiple
      options:
      - T Shirt Design 1
      - T Shirt Design 2
      - T Shirt Design 3
      required: false
    - id: 6
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: unit_price
      label: Unit Price
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: total_price
      label: Total Price
      hint: Calculated automatically
      type: text
      options: []
      required: false
    - id: 9
      name: payment_gateway
      label: Payment Gateway
      hint: null
      type: select_one
      options:
      - PayPal
      - Stripe
      - Authorize
      required: false
    - id: 10
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
