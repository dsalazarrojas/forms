inputSchema:
  type: object
  properties:
    title: Heat Pump Inspection Checklist
    pages:
    - id: 1
      name: general_info
      label: General Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: equipment_model
      label: Equipment Model
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: serial_number
      label: Serial Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: installation_date
      label: Installation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: last_inspection
      label: Last Inspection
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: pump_type
      label: Pump Type
      hint: null
      type: select_one
      options:
      - Centrifugal
      - Positive Displacement
      - Screw
      - Rotary
      required: false
    - id: 7
      name: operating_condition
      label: Operating Condition
      hint: null
