      - Warning
      - Critical
      required: false
    - id: 8
      name: operating_hours
      label: Operating Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
