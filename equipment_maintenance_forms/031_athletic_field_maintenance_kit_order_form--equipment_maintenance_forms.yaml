inputSchema:
  type: object
  properties:
    title: Athletic Field Maintenance Kit Order Form
    pages:
    - id: 1
      name: organization_name
      label: Organization Name
      hint: School, facility, or organization name
      type: text
      options: []
      required: true
    - id: 2
      name: department
      label: Department
      hint: Which department is ordering
      type: select_one
      options:
      - Athletics
      - Grounds and Maintenance
      - Facilities
      - Parks and Recreation
      - Other
      required: true
    - id: 3
      name: contact_name
      label: Contact Person Name
      hint: Primary contact for order
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: Email for order communications
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: Phone number for order questions
      type: text
      options: []
      required: true
    - id: 6
      name: order_date
      label: Order Date
      hint: Date of order
      type: date
      options: []
      required: true
    - id: 7
      name: needed_by_date
      label: Needed By Date
      hint: When do you need the supplies
      type: date
      options: []
      required: true
    - id: 8
      name: field_type
      label: Field Type
      hint: What type of field do you maintain
      type: select_one
      options:
      - Natural Grass
      - Artificial Turf
      - Baseball or Softball Diamond
      - Track and Field
      - Tennis Courts
      - Multi-Purpose
      required: true
    - id: 9
      name: kit_type
      label: Maintenance Kit Type
      hint: Select kit type
      type: select_one
      options:
      - Basic Maintenance Kit
      - Standard Maintenance Kit
      - Premium Maintenance Kit
      - Custom Kit
      required: true
    - id: 10
      name: quantity
      label: Quantity of Kits
      hint: Number of kits to order
      type: number
      options: []
      required: true
    - id: 11
      name: supplies_needed
      label: Supplies Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Field Marking Paint
      - Line Striping Machine
      - Drag Mats
      - Lawn Mower
      - Edger
      - Blower
      - Rakes
      - Shovels
      - Wheelbarrow
      - Irrigation Tools
      - Aeration Equipment
      - Fertilizer Spreader
      - Seed and Sod Supplies
      - Turf Repair Materials
      - Safety Cones and Markers
      required: true
    - id: 12
      name: paint_color
      label: Paint Color Preference
      hint: For field marking paint
      type: select_one
      options:
      - White
      - Yellow
      - Blue
      - Red
      - Mixed Colors
      required: false
    - id: 13
      name: paint_quantity
      label: Paint Quantity
      hint: Number of gallons needed
      type: number
      options: []
      required: false
    - id: 14
      name: equipment_size
      label: Equipment Size Preference
      hint: For machinery
      type: select_one
      options:
      - Walk-Behind
      - Ride-On
      - Tow-Behind
      - No Preference
      required: false
    - id: 15
      name: brand_preference
      label: Brand Preference
      hint: Any preferred brands
      type: text
      options: []
      required: false
    - id: 16
      name: replacement_parts
      label: Replacement Parts Needed
      hint: List any specific parts
      type: text
      options: []
      required: false
    - id: 17
      name: safety_equipment
      label: Safety Equipment Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Safety Glasses
      - Work Gloves
      - Ear Protection
      - Dust Masks
      - Steel-Toe Boots
      - High-Visibility Vests
      - First Aid Kit
      - None
      required: false
    - id: 18
      name: unit_price
      label: Estimated Unit Price
      hint: Price per kit in USD
      type: number
      options: []
      required: false
    - id: 19
      name: total_budget
      label: Total Budget
      hint: Total budget for order
      type: number
      options: []
      required: false
    - id: 20
      name: shipping_method
      label: Shipping Method
      hint: How should order be delivered
      type: select_one
      options:
      - Standard Shipping
      - Express Shipping
      - Freight Delivery
      - Pickup at Warehouse
      - Local Delivery
      required: true
    - id: 21
      name: delivery_address
      label: Delivery Address
      hint: Where to ship
      type: text
      options: []
      required: true
    - id: 22
      name: delivery_instructions
      label: Delivery Instructions
      hint: Special delivery notes
      type: text
      options: []
      required: false
    - id: 23
      name: budget_code
      label: Budget or Account Code
      hint: For billing purposes
      type: text
      options: []
      required: false
    - id: 24
      name: purchase_order_number
      label: Purchase Order Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 25
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Purchase Order
      - Check
      - Wire Transfer
      - Net 30 Account
      required: true
    - id: 26
      name: special_instructions
      label: Special Instructions
      hint: Any special requests or notes
      type: text
      options: []
      required: false
    - id: 27
      name: rush_order
      label: Rush Order
      hint: Is this a rush order
      type: select_one
      options:
      - No - Standard Processing
      - Yes - Rush Processing
      required: true
