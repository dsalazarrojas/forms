inputSchema:
  type: object
  properties:
    title: Appliance Product Release Form
    pages:
    - id: 1
      name: release_date
      label: Release Date
      hint: Date when the appliance is being released
      type: date
      options: []
      required: true
    - id: 2
      name: product_name
      label: Product Name
      hint: Full name of the appliance being released
      type: text
      options: []
      required: true
    - id: 3
      name: model_number
      label: Model Number
      hint: Manufacturer model identification number
      type: text
      options: []
      required: true
    - id: 4
      name: serial_number
      label: Serial Number
      hint: Unique serial number for this unit
      type: text
      options: []
      required: true
    - id: 5
      name: manufacturing_location
      label: Manufacturing Location
      hint: Facility where the appliance was manufactured
      type: text
      options: []
      required: true
    - id: 6
      name: quality_check_status
      label: Quality Check Status
      hint: Current quality inspection status
      type: select_one
      options:
      - Passed
      - Failed
      - Pending Review
      - Conditional Pass
      required: true
    - id: 7
      name: quality_inspector_name
      label: Quality Inspector Name
      hint: Name of the inspector who performed the quality check
      type: text
      options: []
      required: true
    - id: 8
      name: quality_inspection_date
      label: Quality Inspection Date
      hint: Date when quality inspection was completed
      type: date
      options: []
      required: true
    - id: 9
      name: defect_notes
      label: Defect Notes
      hint: Any defects found during inspection or null if none
      type: text
      options: []
      required: false
    - id: 10
      name: release_approval_status
      label: Release Approval Status
      hint: Approval status for product release
      type: select_one
      options:
      - Approved for Release
      - Hold for Review
      - Rejected
      - Pending Approval
      required: true
    - id: 11
      name: approving_manager
      label: Approving Manager
      hint: Name of manager approving the release
      type: text
      options: []
      required: true
    - id: 12
      name: handoff_department
      label: Handoff Department
      hint: Department receiving the released appliance
      type: select_one
      options:
      - Warehouse
      - Distribution
      - Service Team
      - Quality Assurance
      - Shipping
      required: true
    - id: 13
      name: handoff_contact_person
      label: Handoff Contact Person
      hint: Primary contact in receiving department
      type: text
      options: []
      required: true
    - id: 14
      name: handoff_contact_email
      label: Handoff Contact Email
      hint: Email address of the contact person
      type: email
      options: []
      required: true
    - id: 15
      name: handoff_contact_phone
      label: Handoff Contact Phone
      hint: Phone number of the contact person
      type: text
      options: []
      required: false
    - id: 16
      name: packaging_condition
      label: Packaging Condition
      hint: Condition of the appliance packaging
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Damaged
      required: true
    - id: 17
      name: documentation_included
      label: Documentation Included
      hint: Select all documentation that accompanies this release
      type: select_multiple
      options:
      - User Manual
      - Warranty Card
      - Safety Instructions
      - Installation Guide
      - Parts List
      - Compliance Certificate
      required: true
    - id: 18
      name: special_handling_instructions
      label: Special Handling Instructions
      hint: Any special care or handling requirements
      type: text
      options: []
      required: false
    - id: 19
      name: release_notes
      label: Release Notes
      hint: Additional comments or notes about this release
      type: text
      options: []
      required: false
    - id: 20
      name: release_timestamp
      label: Release Timestamp
      hint: Exact time of release
      type: time
      options: []
      required: true
