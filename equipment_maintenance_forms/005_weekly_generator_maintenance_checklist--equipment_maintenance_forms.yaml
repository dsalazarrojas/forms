inputSchema:
  type: object
  properties:
    title: Weekly Generator Maintenance Checklist
    pages:
    - id: 1
      name: checklist_section_1
      label: Generator Maintenance Checklist
      hint: Check the boxes for the maintenance actions performed.
      type: checkbox
      options:
      - Not performed
      - Performed
      required: true
    - id: 2
      name: date
      label: Date
      hint: Select the date for the maintenance actions.
      type: date
      options: []
      required: true
    - id: 3
      name: note
      label: Note
      hint: Write any additional notes about the maintenance actions.
      type: note
      options: []
      required: false
    - id: 4
      name: checklist_item_1
      label: Check the oil level
      hint: Select the oil level status.
      type: select_one
      options:
      - Below 0.5
      - 0.5 to 0.8
      - 0.8 to 1.0
      - Above 1.0
      required: true
    - id: 5
      name: checklist_item_2
      label: Check the oil filter
      hint: Select the oil filter status.
      type: select_one
      options:
      - Not replaced
      - Replaced
      required: true
    - id: 6
      name: checklist_item_3
      label: Check the coolant level
      hint: Select the coolant level status.
      type: select_one
      options:
      - Below 0.5
      - 0.5 to 0.8
      - 0.8 to 1.0
      - Above 1.0
      required: true
    - id: 7
      name: checklist_item_4
      label: Check the voltage level
      hint: Select the voltage level status.
      type: select_one
      options:
      - Below 0.5
      - 0.5 to 0.8
      - 0.8 to 1.0
      - Above 1.0
      required: true
    - id: 8
      name: checklist_item_5
      label: Check the air filter
      hint: Select the air filter status.
      type: select_one
      options:
      - Not replaced
      - Replaced
      required: true
    - id: 9
      name: checklist_item_6
      label: Check the water level
      hint: Select the water level status.
      type: select_one
      options:
      - Below 0.5
      - 0.5 to 0.8
      - 0.8 to 1.0
      - Above 1.0
      required: true
    - id: 10
      name: checklist_item_7
      label: Check the spark plug condition
      hint: Select the spark plug status.
      type: select_one
      options:
      - Not replaced
      - Replaced
      required: true
    - id: 11
      name: note_1
      label: Additional Notes
      hint: Write any additional notes about the maintenance actions.
      type: note
      options: []
      required: false
    - id: 12
      name: checklist_section_2
      label: Generator Maintenance Checklist Section 2
      hint: Additional notes about the maintenance actions.
      type: text
      options: []
      required: false
    - id: 13
      name: date_1
      label: Date 1
      hint: Select the date for the maintenance actions.
      type: date
      options: []
      required: false
    - id: 14
      name: checklist_section_3
      label: Generator Maintenance Checklist Section 3
      hint: Write any additional notes about the maintenance actions.
      type: text
      options: []
      required: false
    - id: 15
      name: note_2
      label: Note 2
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: note_3
      label: Note 3
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: note_4
      label: Note 4
      hint: Write any additional notes about the maintenance actions.
      type: note
      options: []
      required: false
    - id: 18
      name: checklist_section_4
      label: Generator Maintenance Checklist Section 4
      hint: Additional notes about the maintenance actions.
      type: text
      options: []
      required: false
