inputSchema:
  type: object
  properties:
    title: Air Cargo Route Survey
    pages:
    - id: 1
      name: respondent_name
      label: Respondent name
      hint: Optional for anonymous feedback
      type: text
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company name
      hint: Logistic operator or shipper
      type: text
      options: []
      required: false
    - id: 3
      name: origin
      label: Origin airport or city
      hint: Starting point of cargo route
      type: text
      options: []
      required: true
    - id: 4
      name: destination
      label: Destination airport or city
      hint: End point of cargo route
      type: text
      options: []
      required: true
    - id: 5
      name: frequency_of_shipments
      label: Frequency of shipments
      hint: How often shipments occur on this route
      type: select_one
      options: [Daily, Weekly, Monthly, Irregular]
      required: true
    - id: 6
      name: typical_cargo_types
      label: Typical cargo types
      hint: Examples include perishables, machinery, documents
      type: select_multiple
      options: [Perishables, Electronics, Machinery, Documents, Other]
      required: false
    - id: 7
      name: main_challenges
      label: Main challenges on this route
      hint: Delays, capacity, customs, handling, or other
      type: text
      options: []
      required: false
    - id: 8
      name: infrastructure_needs
      label: Infrastructure needs
      hint: Improvements that would improve service
      type: text
      options: []
      required: false
    - id: 9
      name: contact_email
      label: Contact email
      hint: For follow up regarding survey
      type: email
      options: []
      required: false
