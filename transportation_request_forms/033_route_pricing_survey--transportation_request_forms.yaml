inputSchema:
  type: object
  properties:
    title: Route Pricing Survey
    pages:
    - id: 1
      name: route_pricing_survey
      label: What is the route name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: departure_time
      label: What is the departure time?
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: arrival_time
      label: What is the arrival time?
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: transportation_type
      label: What type of transportation is used for this route?
      hint: null
      type: select_one
      options:
      - car
      - plane
      - train
      - bus
      - bike
      required: false
    - id: 5
      name: route_cost
      label: What is the cost of the route?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: is_available_for_delivery
      label: Is the route available for delivery?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: contact_method
      label: How would you like to contact us?
      hint: null
      type: select_one
      options:
      - phone
      - email
      - mail
      required: false
    - id: 8
      name: email_address
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: notes
      label: Do you have any additional comments or notes about the route?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: estimated_travel_time
      label: What is the estimated travel time for the route?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: number_of_people
      label: How many people are traveling on this route?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: additional_costs
      label: Are there any additional costs associated with the route?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
