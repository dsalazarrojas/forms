inputSchema:
  type: object
  properties:
    title: Airport Pickup Reservation Form
    pages:
    - id: 1
      name: section_client
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Primary Passenger Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Mobile Number (with country code)
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_flight
      label: -- Flight Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: airport_name
      label: Airport Name
      hint: e.g. JFK, LAX, Heathrow
      type: text
      options: []
      required: true
    - id: 7
      name: airline_name
      label: Airline
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: flight_number
      label: Flight Number
      hint: Used for tracking delays
      type: text
      options: []
      required: true
    - id: 9
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: arrival_time
      label: Scheduled Arrival Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: section_transport
      label: -- Transportation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: dropoff_address
      label: Drop-off Address
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: passenger_count
      label: Number of Passengers
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: luggage_count
      label: Number of Large Suitcases
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: vehicle_preference
      label: Preferred Vehicle Class
      hint: null
      type: select_one
      options:
      - Economy Sedan
      - Executive Sedan
      - Luxury SUV
      - Minibus/Van
      required: true
    - id: 16
      name: meet_and_greet_required
      label: Meeting Point
      hint: null
      type: select_one
      options:
      - Inside Arrival Hall (Meet and Greet)
      - Curbside Pickup
      - Taxi Stand
      required: true
    - id: 17
      name: special_requirements
      label: Special Requests (e.g. child seat, pet carrier)
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: payment_method
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - Cash to Driver
      - Credit Card (Pre-paid)
      - Corporate Account
      required: true
