    - id: 4
      name: shipper_name
      label: Shipper
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: shipper_address
      label: Shipper Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: claim_date
      label: Claim Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Transportation Request Forms
      - Claim Forms
      required: false
    - id: 10
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Jimmy
      - Other
      required: true
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
