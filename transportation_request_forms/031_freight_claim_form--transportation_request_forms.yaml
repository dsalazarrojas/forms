inputSchema:
  type: object
  properties:
    title: Freight Claim Form
    pages:
    - id: 1
      name: shipment_number
      label: Shipment Number
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: carrier_name
      label: Carrier
      hint: null
      type: select_one
      options:
      - UPS
      - FedEx
      - DHL
      required: false
    - id: 3
      name: claim_amount
      label: Claim Amount
      hint: null
      type: number
      options: []
