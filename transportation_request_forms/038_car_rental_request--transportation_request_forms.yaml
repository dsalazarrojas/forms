inputSchema:
  type: object
  properties:
    title: Car Rental Request
    pages:
    - id: 1
      name: customer_information
      label: Customer Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: For reservation communications
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: address
      label: Street Address
      hint: Your address
      type: text
      options: []
      required: false
    - id: 7
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: false
    - id: 8
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: false
    - id: 9
      name: zip_code
      label: ZIP Code
      hint: Your ZIP code
      type: text
      options: []
      required: false
    - id: 10
      name: rental_timing
      label: Rental Timing
      hint: Date and time information
      type: note
      options: []
      required: false
    - id: 11
      name: pickup_date
      label: Pickup Date
      hint: When to pick up?
      type: date
      options: []
      required: true
    - id: 12
      name: pickup_time
      label: Pickup Time
      hint: What time?
      type: time
      options: []
      required: true
    - id: 13
      name: return_date
      label: Return Date
      hint: When to return?
      type: date
      options: []
      required: true
    - id: 14
      name: return_time
      label: Return Time
      hint: What time?
      type: time
      options: []
      required: true
    - id: 15
      name: rental_duration
      label: Rental Duration
      hint: How long?
      type: select_one
      options:
      - 1 day
      - 2-3 days
      - 4-7 days
      - 1-2 weeks
      - Over 2 weeks
      required: true
    - id: 16
      name: car_type
      label: Car Type
      hint: What type of vehicle?
      type: select_one
      options:
      - Economy
      - Compact
      - Mid-size
      - Full-size
      - SUV
      - Minivan
      - Luxury
      - Sports car
      - Convertible
      - Truck
      - No preference
      required: true
    - id: 17
      name: specific_vehicle_request
      label: Specific Vehicle Request
      hint: If you have a preference
      type: text
      options: []
      required: false
    - id: 18
      name: transmission_type
      label: Transmission Type
      hint: Preference
      type: select_one
      options:
      - Automatic
      - Manual
      - No preference
      required: true
    - id: 19
      name: fuel_type
      label: Fuel Type
      hint: Preference
      type: select_one
      options:
      - Gasoline
      - Diesel
      - Hybrid
      - Electric
      - No preference
      required: true
    - id: 20
      name: pickup_details
      label: Pickup Details
      hint: Delivery information
      type: note
      options: []
      required: false
    - id: 21
      name: pickup_location_type
      label: Pickup Location Type
      hint: Where to pick up?
      type: select_one
      options:
      - At our office
      - Airport
      - Hotel
      - Home delivery
      - Office delivery
      - Other location
      required: true
    - id: 22
      name: pickup_address
      label: Pickup Address
      hint: Specific address
      type: text
      options: []
      required: true
    - id: 23
      name: pickup_instructions
      label: Pickup Instructions
      hint: Any special instructions?
      type: text
      options: []
      required: false
    - id: 24
      name: car_delivery_details
      label: Car Delivery Details
      hint: Delivery preferences
      type: note
      options: []
      required: false
    - id: 25
      name: delivery_needed
      label: Delivery Needed
      hint: Do you need delivery?
      type: select_one
      options:
      - true
      - No - I will pick up
      required: true
    - id: 26
      name: delivery_address
      label: Delivery Address
      hint: Where to deliver?
      type: text
      options: []
      required: false
    - id: 27
      name: delivery_time_preference
      label: Delivery Time Preference
      hint: Preferred delivery time
      type: time
      options: []
      required: false
    - id: 28
      name: delivery_instructions
      label: Delivery Instructions
      hint: Any special instructions?
      type: text
      options: []
      required: false
    - id: 29
      name: additional_features
      label: Additional Features
      hint: Required features
      type: note
      options: []
      required: false
    - id: 30
      name: gps_needed
      label: GPS Needed
      hint: Do you need GPS?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 31
      name: babysit_needed
      label: Babysit/Child Seat Needed
      hint: Do you need a child seat?
      type: select_one
      options:
      - Yes - infant seat
      - Yes - toddler seat
      - Yes - booster seat
      - false
      required: true
    - id: 32
      name: booster_needed
      label: Booster Needed
      hint: Do you need a booster?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 33
      name: additional_features_requested
      label: Additional Features Requested
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Bluetooth connectivity
      - Backup camera
      - Sunroof
      - Leather seats
      - Heated seats
      - All-wheel drive
      - Navigation system
      - Premium sound system
      required: false
    - id: 34
      name: further_comments
      label: Further Comments
      hint: Any other requests or information
      type: text
      options: []
      required: false
    - id: 35
      name: special_occasion
      label: Special Occasion
      hint: Is this for a special event?
      type: select_one
      options:
      - false
      - Wedding
      - Business trip
      - Vacation
      - Anniversary
      - Birthday
      - Other
      required: false
    - id: 36
      name: driver_information
      label: Driver Information
      hint: License details
      type: note
      options: []
      required: false
    - id: 37
      name: license_number
      label: Driver's License Number
      hint: Your license number
      type: text
      options: []
      required: true
    - id: 38
      name: license_state
      label: License State
      hint: State that issued license
      type: text
      options: []
      required: true
    - id: 39
      name: date_of_birth
      label: Date of Birth
      hint: Must be 21 or older
      type: date
      options: []
      required: true
    - id: 40
      name: additional_drivers
      label: Additional Drivers
      hint: Will there be other drivers?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 41
      name: additional_driver_names
      label: Additional Driver Names
      hint: List names
      type: text
      options: []
      required: false
    - id: 42
      name: payment_information
      label: Payment Information
      hint: Payment preferences
      type: note
      options: []
      required: false
    - id: 43
      name: payment_method
      label: Payment Method
      hint: How will you pay?
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Corporate Account
      - Cash Deposit
      required: true
    - id: 44
      name: insurance_preference
      label: Insurance Preference
      hint: Coverage options
      type: select_multiple
      options:
      - Collision Damage Waiver
      - Liability Insurance
      - Personal Accident Insurance
      - Personal Effects Coverage
      - Decline all coverage
      - Undecided
      required: false
    - id: 45
      name: how_heard_about_us
      label: How Did You Hear About Us
      hint: Your referral source
      type: select_one
      options:
      - Website
      - Mobile app
      - Search engine
      - Social media
      - Friend/Family
      - Advertisement
      - Previous customer
      - Other
      required: false
    - id: 46
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 47
      name: request_date
      label: Request Date
      hint: Today's date
      type: date
      options: []
      required: true
