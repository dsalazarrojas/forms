inputSchema:
  type: object
  properties:
    title: Animal Transport License Renewal Application
    pages:
    - id: 1
      name: section_applicant_info
      label: -- Applicant Information --
      hint: Information about the license holder
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: business_name
      label: Business or Organization Name
      hint: Name of transport business
      type: text
      options: []
      required: true
    - id: 5
      name: applicant_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: applicant_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 7
      name: business_address
      label: Business Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 8
      name: business_city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 9
      name: business_state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 10
      name: business_zip
      label: Zip Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 11
      name: section_license_info
      label: -- Current License Information --
      hint: Details about current license
      type: note
      options: []
      required: false
    - id: 12
      name: current_license_number
      label: Current License Number
      hint: Your existing license number
      type: text
      options: []
      required: true
    - id: 13
      name: license_issue_date
      label: Original License Issue Date
      hint: When your license was first issued
      type: date
      options: []
      required: true
    - id: 14
      name: license_expiration_date
      label: Current License Expiration Date
      hint: When your license expires
      type: date
      options: []
      required: true
    - id: 15
      name: license_type
      label: Type of License
      hint: What class of transport license
      type: select_one
      options:
      - Small Animal Transport
      - Large Animal Transport
      - Combined Transport
      - Special Species Transport
      - Other
      required: true
    - id: 16
      name: years_licensed
      label: Years Holding This License
      hint: How long you have had it
      type: number
      options: []
      required: false
    - id: 17
      name: previous_violations
      label: Previous License Violations
      hint: Any violations on record
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: violation_details
      label: Details of Any Violations
      hint: If yes, provide details
      type: text
      options: []
      required: false
    - id: 19
      name: section_vehicle_info
      label: -- Vehicle Information --
      hint: Details about transport vehicles
      type: note
      options: []
      required: false
    - id: 20
      name: number_of_vehicles
      label: Number of Transport Vehicles
      hint: How many vehicles in operation
      type: number
      options: []
      required: true
    - id: 21
      name: vehicle_details
      label: Vehicle Details
      hint: Make, model, year, and capacity of each
      type: text
      options: []
      required: true
    - id: 22
      name: vehicle_condition
      label: Vehicle Maintenance Status
      hint: Current condition of vehicles
      type: select_one
      options:
      - Excellent
      - Good
      - Acceptable
      - Needs Repair
      - Under Renovation
      required: true
    - id: 23
      name: last_vehicle_inspection
      label: Date of Last Vehicle Safety Inspection
      hint: Most recent inspection date
      type: date
      options: []
      required: true
    - id: 24
      name: climate_control
      label: Climate Control Systems
      hint: Do vehicles have climate control
      type: select_one
      options:
      - 'Yes'
      - Partial
      - 'No'
      required: true
    - id: 25
      name: water_supply
      label: Water and Food Supply on Vehicles
      hint: Ability to provide care during transport
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 26
      name: section_safety
      label: -- Safety and Compliance --
      hint: Safety standards and compliance
      type: note
      options: []
      required: false
    - id: 27
      name: safety_certifications
      label: Safety Certifications Held
      hint: Relevant certifications
      type: text
      options: []
      required: false
    - id: 28
      name: liability_insurance
      label: Current Liability Insurance
      hint: Have adequate insurance coverage
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Pending
      required: true
    - id: 29
      name: insurance_amount
      label: Insurance Coverage Amount
      hint: Amount of liability coverage
      type: number
      options: []
      required: false
    - id: 30
      name: emergency_protocols
      label: Emergency Protocols in Place
      hint: Do you have emergency procedures
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 31
      name: trained_staff
      label: Trained Staff
      hint: Number of trained transport staff
      type: number
      options: []
      required: true
    - id: 32
      name: section_animals
      label: -- Animal Transport Information --
      hint: Types of animals transported
      type: note
      options: []
      required: false
    - id: 33
      name: animal_types
      label: Types of Animals Transported
      hint: Select all that apply
      type: select_multiple
      options:
      - Dogs
      - Cats
      - Birds
      - Rabbits
      - Horses
      - Exotic Animals
      - Wildlife
      - Livestock
      required: true
    - id: 34
      name: max_animals_per_trip
      label: Maximum Number of Animals per Trip
      hint: Capacity limit
      type: number
      options: []
      required: true
    - id: 35
      name: animal_welfare_training
      label: Staff Animal Welfare Training
      hint: Training in animal handling
      type: select_one
      options:
      - 'Yes'
      - In Progress
      - 'No'
      required: true
    - id: 36
      name: section_compliance
      label: -- Compliance Questions --
      hint: Regulatory compliance verification
      type: note
      options: []
      required: false
    - id: 37
      name: health_documentation_required
      label: Can Provide Required Health Documentation
      hint: Transport with proper health records
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 38
      name: record_keeping_system
      label: Record Keeping System in Place
      hint: Document all transports
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 39
      name: regulatory_complaints
      label: Any Regulatory Complaints Filed
      hint: Past complaints against business
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 40
      name: complaint_details
      label: Details of Any Complaints
      hint: If yes, provide information
      type: text
      options: []
      required: false
    - id: 41
      name: section_agreement
      label: -- Renewal Agreement --
      hint: Final confirmation
      type: note
      options: []
      required: false
    - id: 42
      name: agree_to_comply
      label: Agree to Comply with Regulations
      hint: Commit to regulatory compliance
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 43
      name: agree_to_inspections
      label: Agree to Routine Inspections
      hint: Allow inspection of vehicles and records
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 44
      name: renewal_date
      label: Date of Renewal Application
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 45
      name: additional_information
      label: Additional Information
      hint: Any other relevant information
      type: text
      options: []
      required: false
