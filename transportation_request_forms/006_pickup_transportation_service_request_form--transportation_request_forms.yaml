inputSchema:
  type: object
  properties:
    title: prophets_form
    pages:
    - id: 1
      name: enter_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: select_transport_method
      label: How do you want to travel?
      hint: null
      type: select_one
      options:
      - bus
      - car
      - bike
      required: false
    - id: 3
      name: enter_location
      label: Where is your starting location?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: enter_dropoff_location
      label: Where is your destination?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: enter_date
      label: What is your preferred date of travel?
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: enter_time
      label: What time do you want to travel?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: enter_phone
      label: Can we call or text you with updates?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: enter_notes
      label: Do you have any special requests or comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: select_mode_of_transportation
      label: What is your preferred mode of transportation?
      hint: null
      type: select_multiple
      options:
      - bus
      - car
      - bike
      required: false
    - id: 10
      name: select_phone
      label: Do you have a phone number you'd like to provide?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
