inputSchema:
  type: object
  properties:
    title: Cold Chain Route Audit Order Form
    pages:
    - id: 1
      name: header
      label: -- Route Audit Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester
      label: Requester name
      hint: Full name for contact
      type: text
      options: []
      required: true
    - id: 3
      name: company
      label: Company name
      hint: Organization requesting audit
      type: text
      options: []
      required: true
    - id: 4
      name: route_description
      label: Route description
      hint: Origin and destination details
      type: text
      options: []
      required: true
    - id: 5
      name: vehicle_details
      label: Vehicle details
      hint: Truck ID, refrigeration type
      type: text
      options: []
      required: false
    - id: 6
      name: scheduled_audit_date
      label: Scheduled audit date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 7
      name: temperature_logs_available
      label: Temperature logs available
      hint: Are historical temperature logs available
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 8
      name: compliance_priority
      label: Compliance priority
      hint: Urgency level for the audit
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: contact_phone
      label: Contact phone
      hint: Phone for audit coordination
      type: text
      options: []
      required: false
    - id: 10
      name: additional_requirements
      label: Additional requirements
      hint: Any special audit focus areas
      type: text
      options: []
      required: false
