      name: fire_drill_testing_status
      label: fire drill testing status
      hint: null
      type: select_multiple
      options:
      - Completed
      - Not Completed
      required: false
    - id: 22
      name: fire_drill_training_frequency
      label: fire drill training frequency
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Annually
      required: false
