inputSchema:
  type: object
  properties:
    title: Fire Drill Checklist
    pages:
    - id: 1
      name: fire_drill_procedures
      label: fire drill procedures
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: emergency_contact_info
      label: emergency contact info
      hint: null
      type: select_one
      options:
      - Manager
      - HR
      - Fire Marshal
      required: false
    - id: 3
      name: fire_drill_scheduling
      label: fire drill scheduling
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: fire_drill_conducted_by
      label: fire drill conducted by
      hint: null
      type: select_one
      options:
      - Fire Marshal
      - Fire Chief
      - Fire Captain
      required: false
    - id: 5
      name: fire_drill_responders
      label: fire drill responders
      hint: null
      type: select_multiple
      options:
      - Fire Marshal
      - Fire Chief
      - Fire Captain
      required: false
    - id: 6
      name: fire_drill_responder_training_status
      label: fire drill responder training status
      hint: null
      type: select_multiple
      options:
      - Trained
      - Needs Refresher Training
      - Untrained
      required: false
