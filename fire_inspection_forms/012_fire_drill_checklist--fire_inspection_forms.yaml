      name: fire_drill_evacuation_plan
      label: fire drill evacuation plan
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: fire_drill_annual_testing
      label: fire drill annual testing
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: fire_drill_reporting
      label: fire drill reporting
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: fire_drill_reporting_frequency
      label: fire drill reporting frequency
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Annually
      required: false
    - id: 13
      name: fire_drill_testing_method
      label: fire drill testing method
      hint: null
      type: select_multiple
      options:
      - Roll Call
      - Written Test
      - Simulation
      required: false
