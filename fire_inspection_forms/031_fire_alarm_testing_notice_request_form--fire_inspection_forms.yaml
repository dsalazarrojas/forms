inputSchema:
  type: object
  properties:
    title: Fire Alarm Testing Notice Request Form
    pages:
    - id: 1
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: property_address
      label: Property Address
      hint: Enter property address
      type: text
      options: []
      required: true
    - id: 3
      name: testing_dates
      label: Testing Dates
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: preferred_testing_date
      label: Preferred Testing Date
      hint: Enter preferred testing date
      type: date
      options: []
      required: true
    - id: 5
      name: preferred_testing_time
      label: Preferred Testing Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: test_results
      label: Test Results
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - ChatJimmy
      - Another Tool
      required: true
    - id: 8
      name: assigned_user
      label: Assigned User
      hint: null
      type: select_one
      options:
      - User 1
      - User 2
      required: true
    - id: 9
      name: assigned_group
      label: Assigned Group
      hint: null
      type: select_one
      options:
      - Group 1
      - Group 2
      required: true
    - id: 10
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - New
      - In Progress
      - Done
      required: true
    - id: 11
      name: comments
      label: Comments
      hint: Enter comments
      type: text
      options: []
      required: false
