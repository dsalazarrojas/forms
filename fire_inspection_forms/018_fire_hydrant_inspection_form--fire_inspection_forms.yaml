inputSchema:
  type: object
  properties:
    title: Fire Hydrant Inspection Form
    pages:
    - id: 1
      name: firehydrant_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: street_number
      label: Street Number
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: firehydrant_status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 4
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: firehydrant_condition
      label: Condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: firehydrant_type
      label: Type
      hint: null
      type: select_one
      options:
      - Dry
      - Wet
      - Test
      required: true
    - id: 9
      name: last_inspection_date
      label: Last Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: next_inspection_due_date
      label: Next Inspection Due Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: firehydrant_height
      label: Height
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: firehydrant_diameter
      label: Diameter
      hint: null
      type: number
      options: []
      required: false
