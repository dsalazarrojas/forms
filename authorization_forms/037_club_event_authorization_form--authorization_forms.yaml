inputSchema:
  type: object
  properties:
    title: Club Event Authorization Form
    pages:
    - id: 1
      name: section_organizer
      label: -- Event Organizer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organizer_name
      label: Event Organizer Name
      hint: Person organizing this event
      type: text
      options: []
      required: true
    - id: 3
      name: club_name
      label: Club Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_event
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_name
      label: Event Name
      hint: Title of the event
      type: text
      options: []
      required: true
    - id: 8
      name: event_date
      label: Event Date
      hint: When will this event occur?
      type: date
      options: []
      required: true
    - id: 9
      name: event_time
      label: Event Time
      hint: Start time
      type: time
      options: []
      required: true
    - id: 10
      name: event_duration
      label: Event Duration - Hours
      hint: How long will event last?
      type: number
      options: []
      required: true
    - id: 11
      name: event_location
      label: Event Location - Venue
      hint: Where will event be held?
      type: text
      options: []
      required: true
    - id: 12
      name: expected_attendance
      label: Expected Number of Attendees
      hint: Estimate
      type: number
      options: []
      required: true
    - id: 13
      name: section_type
      label: -- Event Type and Activities --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Social gathering
      - Educational workshop
      - Competition
      - Fundraiser
      - Meeting
      - Field trip
      - Other
      required: true
    - id: 15
      name: activities_description
      label: Description of Activities
      hint: What will happen at this event?
      type: text
      options: []
      required: true
    - id: 16
      name: food_beverages
      label: Will food and beverages be served?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: alcohol_involved
      label: Alcohol involved in event?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: section_safety
      label: -- Safety and Risk Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: potential_risks
      label: Potential Risks or Hazards
      hint: Safety concerns to address
      type: text
      options: []
      required: true
    - id: 20
      name: safety_measures
      label: Safety Measures in Place
      hint: How will risks be mitigated?
      type: text
      options: []
      required: true
    - id: 21
      name: liability_waiver
      label: Liability Waiver Needed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 22
      name: section_approval
      label: -- Authorization and Approval --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: club_president_name
      label: Club President Name - Approval
      hint: President authorizing this event
      type: text
      options: []
      required: true
    - id: 24
      name: approval_date
      label: Approval Date
      hint: null
      type: date
      options: []
      required: true
    - id: 25
      name: approval_status
      label: Approval Status
      hint: null
      type: select_one
      options:
      - Approved
      - Conditional approval
      - Requires modifications
      - Denied
      required: true
