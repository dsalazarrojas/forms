inputSchema:
  type: object
  properties:
    title: Accounting Record Use Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Consent information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client name
      hint: Name of individual or organization granting consent
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: Email for consent confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact phone
      hint: Phone number for contact
      type: text
      options: []
      required: false
    - id: 5
      name: records_to_be_used
      label: Records to be used
      hint: Describe records and date ranges to be used
      type: text
      options: []
      required: true
    - id: 6
      name: purpose_of_use
      label: Purpose of use
      hint: Purpose for which records will be used
      type: text
      options: []
      required: true
    - id: 7
      name: duration_of_use
      label: Duration of use
      hint: Time period during which records will be used
      type: text
      options: []
      required: false
    - id: 8
      name: third_party_sharing
      label: Third party sharing
      hint: Indicate if records will be shared with third parties
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 9
      name: confidentiality_measures
      label: Confidentiality measures
      hint: Describe security or confidentiality safeguards
      type: text
      options: []
      required: false
    - id: 10
      name: consent_given_by
      label: Consent given by
      hint: Name of authorized representative granting consent
      type: text
      options: []
      required: true
    - id: 11
      name: consent_signature
      label: Consent signature
      hint: Type full name to sign electronically
      type: text
      options: []
      required: true
    - id: 12
      name: consent_date
      label: Consent date
      hint: Date consent was provided
      type: date
      options: []
      required: true
    - id: 13
      name: additional_notes
      label: Additional notes
      hint: Any extra information regarding consent
      type: text
      options: []
      required: false
