inputSchema:
  type: object
  properties:
    title: Student Ministry Medical And Photo Release Form
    pages:
    - id: 1
      name: medical_details
      label: Medical Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: emergency_contacts
      label: Emergency Contacts
      hint: null
      type: select_multiple
      options:
      - Parent
      - Guardian
      - Other Contact
      required: false
    - id: 3
      name: photo_release
      label: Photo Release
      hint: null
      type: select_one
      options:
      - Parent and Child
      - Parent
      - Ministry
      required: false
    - id: 4
      name: event_details
      label: Event Details
      hint: null
      type: select_multiple
      options:
      - Church
      - Camp
      - Retreat
      - Event
      - Other
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
