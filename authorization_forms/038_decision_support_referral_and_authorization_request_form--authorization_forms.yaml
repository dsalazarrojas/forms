inputSchema:
  type: object
  properties:
    title: Decision Support Referral And Authorization Request Form
    pages:
    - id: 1
      name: patient_info
      label: patient prophets
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: support_team
      label: support team
      hint: Name, phone, and email of support team
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: referral_reason
      label: referral reason
      hint: null
      type: text
      options: []
