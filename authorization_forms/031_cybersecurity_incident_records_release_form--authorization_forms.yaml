inputSchema:
  type: object
  properties:
    title: cybersecurity_incident_records_release_form
    pages:
    - id: 1
      name: organization
      label: Organization
      hint: Enter your organization's name
      type: text
      options: []
      required: true
    - id: 2
      name: incident_id
      label: Incident ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: incident_details
      label: Incident Details
      hint: Please provide a detailed description of the incident
      type: text
      options: []
      required: true
    - id: 6
      name: incident_category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Financial
      - IT
      - Legal
      - Other
      required: true
    - id: 7
      name: incident_subcategory
      label: Subcategory
      hint: Select a subcategory for the incident
      type: select_one
      options:
      - Category 1
      - Category 2
      - Category 3
      required: true
    - id: 8
      name: contact_person
      label: Contact Person
      hint: Enter the contact person's name
      type: text
      options: []
      required: true
    - id: 9
      name: contact_email
      label: Contact Email
      hint: Enter the contact person's email
      type: email
      options: []
      required: true
    - id: 10
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
