    - id: 5
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: parent_email
      label: Parent Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: device_type
      label: Device Type
      hint: null
      type: select_one
      options:
      - iOS
      - Android
      - Windows
      required: false
    - id: 8
      name: date_of_birth
      label: Date of Birth
      hint: null
