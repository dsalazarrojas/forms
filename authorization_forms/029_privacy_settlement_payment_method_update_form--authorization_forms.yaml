inputSchema:
  type: object
  properties:
    title: Privacy Settlement Payment Method Update Form
    pages:
    - id: 1
      name: claimant_verification
      label: Verify Claimant
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: verification_details
      label: Verification Details
      hint: Provide your identification details
      type: text
      options: []
      required: true
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: payment_method_id
      label: Payment Method ID
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: claimant_signature
      label: Claimant Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: claimant_consent
      label: Claimant Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: signature_date
      label: Signature Date
      hint: null
      type: time
      options: []
      required: false
