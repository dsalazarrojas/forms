inputSchema:
  type: object
  properties:
    title: Outdoor Access Guidelines Acknowledgement Form
    pages:
    - id: 1
      name: acknowledgement_1
      label: Outdoor Access Guidelines Acknowledgement
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: acknowledgement_2
      label: I acknowledge that I have read and understood the Outdoor Access Guidelines.
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: outdoor_area_access
      label: What outdoor areas are you requesting access to?
      hint: null
      type: select_multiple
      options:
      - option_1
      - option_2
      - option_3
      required: true
    - id: 4
      name: date
      label: Date of Acknowledgement
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: acknowledgement_3
      label: I acknowledge that I have read and understood the Outdoor Access Guidelines
        and I will comply with these guidelines.
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: acknowledgement_4
      label: I confirm that I am authorized to enter the outdoor areas I am requesting
        access to.
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: acknowledgement_5
      label: I understand that failure to comply with the Outdoor Access Guidelines
        may result in denial of access.
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: acknowledgement_6
      label: I understand that this acknowledgement does not constitute a guarantee
        of access.
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: acknowledgement_7
      label: I understand that this acknowledgement can be withdrawn at any time.
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: acknowledgement_8
      label: I understand that access to the outdoor areas is subject to change.
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: acknowledgement_9
      label: I will report any incidents or accidents to my supervisor/manager.
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: acknowledgement_10
      label: I will comply with all applicable laws and regulations.
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: acknowledgement_11
      label: I will respect the safety and well-being of all individuals.
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: acknowledgement_12
      label: I will not bring any prohibited items into the outdoor areas.
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: acknowledgement_13
      label: I will not use electronic devices while in the outdoor areas.
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: acknowledgement_14
      label: I will not litter or tamper with the outdoor areas.
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: acknowledgement_15
      label: I will not enter the outdoor areas if I am feeling unwell.
      hint: null
      type: text
      options: []
      required: true
    - id: 21
      name: acknowledgement_16
      label: I will not enter the outdoor areas if I am under the influence of alcohol
        or drugs.
      hint: null
      type: text
      options: []
      required: true
    - id: 22
      name: acknowledgement_17
      label: I will not enter the outdoor areas if I have a medical condition that
        may pose a risk to myself or others.
      hint: null
      type: text
      options: []
      required: true
    - id: 23
      name: acknowledgement_18
      label: I will not enter the outdoor areas if I am not authorized.
      hint: null
      type: text
      options: []
      required: true
    - id: 24
      name: acknowledgement_19
      label: I will not enter the outdoor areas if they are closed.
      hint: null
      type: text
      options: []
      required: true
    - id: 25
      name: acknowledgement_20
      label: I will not bring any pets into the outdoor areas.
      hint: null
      type: text
      options: []
      required: true
