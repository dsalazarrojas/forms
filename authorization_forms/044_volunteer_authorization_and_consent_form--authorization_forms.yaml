inputSchema:
  type: object
  properties:
    title: Volunteer Authorization And Consent Form
    pages:
    - id: 1
      name: volunteer_information
      label: Volunteer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: address
      label: Contact Address
      hint: null
      type: select_one
      options:
      - street
      - city
      - state
      required: true
    - id: 3
      name: contact_info
      label: Contact Info
      hint: null
      type: select_one
      options:
      - name
      - email
      - phone
      required: true
    - id: 4
      name: volunteer_info
      label: Volunteer Info
      hint: null
      type: select_one
      options:
      - role
      - date
      - time
      - location
      required: true
