inputSchema:
  type: object
  properties:
    title: Work Authorization Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: nationality
      label: Nationality
      hint: null
      type: select_multiple
      options:
      - US
      - Canada
      - Mexico
      - UK
      - France
      required: true
    - id: 5
      name: current_country
      label: Current Country
      hint: null
      type: select_multiple
      options:
      - US
      - Canada
      - Mexico
      - UK
      - France
      required: true
    - id: 6
      name: visa_details
      label: Visa Details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: work_authorization_number
      label: Work Authorization Number
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: work_location
      label: Work Location
      hint: null
      type: select_one
      options:
      - New York
      - Chicago
      - Los Angeles
      - Dallas
      - Houston
      required: true
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
