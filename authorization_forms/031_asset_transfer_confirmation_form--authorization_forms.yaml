inputSchema:
  type: object
  properties:
    title: Asset Transfer Confirmation Form
    pages:
    - id: 1
      name: confirmation_date
      label: Confirmation Date
      hint: Date of confirmation
      type: date
      options: []
      required: true
    - id: 2
      name: transfer_reference
      label: Transfer Reference Number
      hint: Unique identifier
      type: text
      options: []
      required: true
    - id: 3
      name: transferor_name
      label: Transferor Name
      hint: Person transferring asset
      type: text
      options: []
      required: true
    - id: 4
      name: transferor_organization
      label: Transferor Organization
      hint: Company or entity
      type: text
      options: []
      required: false
    - id: 5
      name: transferor_address
      label: Transferor Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: transferee_name
      label: Transferee Name
      hint: Person receiving asset
      type: text
      options: []
      required: true
    - id: 7
      name: transferee_organization
      label: Transferee Organization
      hint: Company or entity
      type: text
      options: []
      required: false
    - id: 8
      name: transferee_address
      label: Transferee Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 9
      name: asset_description
      label: Asset Description
      hint: What is being transferred
      type: text
      options: []
      required: true
    - id: 10
      name: asset_category
      label: Asset Category
      hint: Type of asset
      type: select_one
      options:
      - Real Property
      - Vehicle
      - Equipment
      - Financial Asset
      - Intellectual Property
      - Inventory
      - Other
      required: true
    - id: 11
      name: asset_value
      label: Asset Value
      hint: Appraised or agreed value
      type: number
      options: []
      required: true
    - id: 12
      name: transfer_date
      label: Effective Transfer Date
      hint: When transfer takes effect
      type: date
      options: []
      required: true
    - id: 13
      name: transfer_reason
      label: Reason for Transfer
      hint: Why transferring
      type: select_one
      options:
      - Sale
      - Gift
      - Inheritance
      - Corporate Restructuring
      - Lease Transfer
      - Collateral
      - Other
      required: true
    - id: 14
      name: transfer_terms
      label: Transfer Terms
      hint: Conditions of transfer
      type: text
      options: []
      required: false
    - id: 15
      name: payment_amount
      label: Payment Amount
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 16
      name: payment_method
      label: Payment Method
      hint: How paid
      type: select_one
      options:
      - Cash
      - Check
      - Bank Transfer
      - Financing
      - Trade Exchange
      - Not Applicable
      required: false
    - id: 17
      name: title_document_attached
      label: Is Title Document Attached
      hint: Proof of ownership
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: inspection_completed
      label: Was Inspection Completed
      hint: Asset examined
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Required
      required: true
    - id: 19
      name: condition_at_transfer
      label: Condition at Transfer
      hint: State of asset
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - As-Is
      required: true
    - id: 20
      name: warranties_included
      label: Are Warranties Included
      hint: Guarantees provided
      type: select_one
      options:
      - Yes - Full Warranty
      - Yes - Limited Warranty
      - No - As-Is Sale
      required: true
    - id: 21
      name: legal_review_completed
      label: Has Legal Review Been Completed
      hint: Attorney approval
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Pending
      required: true
    - id: 22
      name: tax_implications_reviewed
      label: Have Tax Implications Been Reviewed
      hint: Tax consequences
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Pending
      required: true
    - id: 23
      name: transferor_confirms
      label: Transferor Confirms Transfer
      hint: Agreement to transfer
      type: select_one
      options:
      - Yes I Confirm
      - 'No'
      required: true
    - id: 24
      name: transferee_accepts
      label: Transferee Accepts Transfer
      hint: Agreement to receive
      type: select_one
      options:
      - Yes I Accept
      - 'No'
      required: true
    - id: 25
      name: witness_name
      label: Witness Name
      hint: If required
      type: text
      options: []
      required: false
    - id: 26
      name: transferor_signature
      label: Transferor Signature
      hint: Type name to sign
      type: text
      options: []
      required: true
    - id: 27
      name: transferee_signature
      label: Transferee Signature
      hint: Type name to sign
      type: text
      options: []
      required: true
    - id: 28
      name: notary_name
      label: Notary Name
      hint: If notarized
      type: text
      options: []
      required: false
    - id: 29
      name: notary_signature
      label: Notary Signature
      hint: If notarized
      type: text
      options: []
      required: false
