inputSchema:
  type: object
  properties:
    title: Parental Authorization Form For Minors
    pages:
    - id: 1
      name: parent_name
      label: parent_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: child_name
      label: child_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: date_of_birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: relationship
      label: relationship
      hint: null
      type: select_one
      options:
      - Mother
      - Father
      - Grandparent
      - Guardian
      required: false
    - id: 5
      name: authorization_date
      label: authorization_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: treatment_details
      label: treatment_details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: signature
      label: signature
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: parent_contact_info
      label: parent_contact_info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: healthcare_provider_name
      label: healthcare_provider_name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: healthcare_provider_info
      label: healthcare_provider_info
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: facility_info
      label: facility_info
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: consent
      label: consent
      hint: null
      type: select_multiple
      options:
      - I have read and understand the above information and have given my consent
        for the above child to receive
      - I do not consent to this treatment plan
      required: false
    - id: 13
      name: parent_signature
      label: parent_signature
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: healthcare_provider_signature
      label: healthcare_provider_signature
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: treatment_plan
      label: treatment_plan
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: treatment_cost
      label: treatment_cost
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: insurance_info
      label: insurance_info
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: payment_info
      label: payment_info
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: authorization_status
      label: authorization_status
      hint: null
      type: select_one
      options:
      - Active
      - Completed
      - Denied
      - Pending
      required: true
    - id: 20
      name: authorization_date_status
      label: authorization_date_status
      hint: null
      type: select_one
      options:
      - Authorized
      - Denied
      - Pending
      required: true
    - id: 21
      name: reason_denied
      label: reason_denied
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: authorization_comments
      label: authorization_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: healthcare_provider_phone
      label: healthcare_provider_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: facility_phone
      label: facility_phone
      hint: null
      type: text
      options: []
      required: false
