inputSchema:
  type: object
  properties:
    title: Scholarship Authorization Form
    pages:
    - id: 1
      name: student_application
      label: Student Application
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: institution_name
      label: Institution Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: student_contact
      label: Student Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: student_status
      label: Student Status
      hint: null
      type: select_one
      options:
      - active
      - inactive
      - pending
      required: true
    - id: 7
      name: scholarship_program
      label: Scholarship Program
      hint: null
      type: select_multiple
      options:
      - program_1
      - program_2
      - program_3
      required: true
    - id: 8
      name: scholarship_amount
      label: Scholarship Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: authorization
      label: Authorization
      hint: null
      type: select_one
      options:
      - approved
      - denied
      - pending
      required: true
    - id: 10
      name: reason_denied
      label: Reason Denied
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
