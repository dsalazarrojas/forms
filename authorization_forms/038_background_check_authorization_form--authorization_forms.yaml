inputSchema:
  type: object
  properties:
    title: Background Check Authorization Form
    pages:
    - id: 1
      name: applicant_name
      label: Full Legal Name
      hint: First, middle, and last name
      type: text
      options: []
      required: true
    - id: 2
      name: other_names_used
      label: Other Names Used
      hint: Maiden name, aliases, etc.
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: social_security_number
      label: Social Security Number
      hint: XXX-XX-XXXX format
      type: text
      options: []
      required: true
    - id: 5
      name: current_address
      label: Current Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 6
      name: current_city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 7
      name: current_state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 8
      name: current_zip
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 9
      name: years_at_address
      label: Years at Current Address
      hint: How long have you lived here
      type: select_one
      options:
      - Less than 1 year
      - 1 to 3 years
      - 3 to 5 years
      - 5 to 10 years
      - Over 10 years
      required: true
    - id: 10
      name: previous_address
      label: Previous Address
      hint: If less than 5 years at current
      type: text
      options: []
      required: false
    - id: 11
      name: email
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 13
      name: drivers_license_number
      label: Drivers License Number
      hint: License number
      type: text
      options: []
      required: true
    - id: 14
      name: drivers_license_state
      label: Drivers License State
      hint: Issuing state
      type: text
      options: []
      required: true
    - id: 15
      name: position_applied
      label: Position Applied For
      hint: Job title or purpose
      type: text
      options: []
      required: true
    - id: 16
      name: employer_name
      label: Employer or Organization Name
      hint: Company requesting background check
      type: text
      options: []
      required: true
    - id: 17
      name: background_check_types
      label: Types of Checks Authorized
      hint: Select all that apply
      type: select_multiple
      options:
      - Criminal history
      - Employment verification
      - Education verification
      - Credit history
      - Reference checks
      - Motor vehicle record
      - Drug screening
      required: true
    - id: 18
      name: conviction_history
      label: Have You Been Convicted of a Crime
      hint: Exclude minor traffic violations
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: conviction_details
      label: Conviction Details
      hint: Explain if yes above
      type: text
      options: []
      required: false
    - id: 20
      name: authorization_statement
      label: Authorization Statement
      hint: I authorize background investigation
      type: select_one
      options:
      - Yes, I authorize
      - No, I do not authorize
      required: true
    - id: 21
      name: fcra_rights_acknowledged
      label: FCRA Rights Acknowledged
      hint: I understand my rights under FCRA
      type: select_one
      options:
      - Yes, acknowledged
      - No, not acknowledged
      required: true
    - id: 22
      name: copy_request
      label: Request Copy of Report
      hint: Would you like a copy of results
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: applicant_signature
      label: Applicant Signature
      hint: Digital signature or typed name
      type: text
      options: []
      required: true
    - id: 24
      name: signature_date
      label: Date Signed
      hint: Date of authorization
      type: date
      options: []
      required: true
    - id: 25
      name: witness_signature
      label: Witness Signature
      hint: If required
      type: text
      options: []
      required: false
