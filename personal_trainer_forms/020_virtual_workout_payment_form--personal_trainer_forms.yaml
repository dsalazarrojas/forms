inputSchema:
  type: object
  properties:
    title: Virtual Workout Payment Form
    pages:
    - id: 1
      name: main
      label: Main
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: workout_type
      label: Workout Type
      hint: null
      type: select_one
      options:
      - Virtual
      - In-Person
      - Hybrid
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Card
      - PayPal
      - Stripe
      required: true
    - id: 6
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: payment_currency
      label: Payment Currency
      hint: null
      type: select_one
      options:
      - USD
      - EUR
      - JPY
      required: true
    - id: 8
      name: client_message
      label: Client Message
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
