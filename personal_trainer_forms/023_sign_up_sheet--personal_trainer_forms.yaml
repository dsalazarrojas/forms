inputSchema:
  type: object
  properties:
    title: sign_up_sheet
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participant_type
      label: Participant Type
      hint: null
      type: select_one
      options:
      - Coach
      - Athlete
      - Support Staff
      - Trainer
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: description
      label: Description
      hint: null
      type: note
      options: []
      required: false
