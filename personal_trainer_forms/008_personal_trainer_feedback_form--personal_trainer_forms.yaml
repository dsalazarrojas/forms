inputSchema:
  type: object
  properties:
    title: Personal Trainer Feedback Form
    pages:
    - id: 1
      name: session_rating
      label: session_rating
      hint: null
      type: select_one
      options:
      - Poor
      - Average
      - Excellent
      required: true
    - id: 2
      name: session_rating_happy
      label: session_rating_happy
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: session_content
      label: session_content
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: overall_satisfaction
      label: overall_satisfaction
      hint: null
      type: select_one
      options:
      - Poor
      - Average
      - Excellent
      required: true
    - id: 5
      name: training_style
      label: training_style
      hint: null
      type: select_one
      options:
      - Traditional
      - Modern
      - Hybrid
      required: true
    - id: 6
      name: trainer_attitude
      label: trainer_attitude
      hint: null
      type: select_one
      options:
      - Unhelpful
      - Somewhat Helpful
      - Very Helpful
      required: true
    - id: 7
      name: communication
      label: communication
      hint: null
      type: select_one
      options:
      - Poor
      - Average
      - Excellent
      required: true
    - id: 8
      name: session_length
      label: session_length
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: session_duration
      label: session_duration
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: trainer_professionalism
      label: trainer_professionalism
      hint: null
      type: select_one
      options:
      - Unprofessional
      - Somewhat Professional
      - Very Professional
      required: false
    - id: 11
      name: feedback_notes
      label: feedback_notes
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 13
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: followup_questions
      label: followup_questions
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
