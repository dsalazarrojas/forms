inputSchema:
  type: object
  properties:
    title: Personalized Fitness And Nutrition Plan Request
    pages:
    - id: 1
      name: client_details
      label: Client Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: goals
      label: Goals
      hint: What are your short-term and long-term goals?
      type: text
      options: []
      required: false
    - id: 3
      name: activity_level
      label: Activity Level
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''sedentary'', ''value'': ''sedentary''}'
      - '{''id'': 2, ''label'': ''lightly_active'', ''value'': ''lightly_active''}'
      - '{''id'': 3, ''label'': ''highly_active'', ''value'': ''highly_active''}'
      - '{''id'': 4, ''label'': ''extremely_active'', ''value'': ''extremely_active''}'
      required: false
    - id: 4
      name: height
      label: Height
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: weight
      label: Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: health_details
      label: Health Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_condition
      label: Medical Condition
      hint: Have you experienced any medical conditions that may impact your workout
        routine?
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''high_blood_pressure'', ''value'': ''high_blood_pressure''}'
      - '{''id'': 2, ''label'': ''high_cholesterol'', ''value'': ''high_cholesterol''}'
      - '{''id'': 3, ''label'': ''diabetes'', ''value'': ''diabetes''}'
      - '{''id'': 4, ''label'': ''heart_disease'', ''value'': ''heart_disease''}'
      required: false
    - id: 9
      name: workout_frequency
      label: Workout Frequency
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''daily'', ''value'': ''daily''}'
      - '{''id'': 2, ''label'': ''2_3_times_a_week'', ''value'': ''2_3_times_a_week''}'
      - '{''id'': 3, ''label'': ''4_5_times_a_week'', ''value'': ''4_5_times_a_week''}'
      - '{''id'': 4, ''label'': ''less_than_three_times_a_week'', ''value'': ''less_than_three_times_a_week''}'
      required: false
    - id: 10
      name: time_commitment
      label: Time Commitment
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''10_15_minutes'', ''value'': ''10_15_minutes''}'
      - '{''id'': 2, ''label'': ''30_60_minutes'', ''value'': ''30_60_minutes''}'
      - '{''id'': 3, ''label'': ''more_than_an_hour'', ''value'': ''more_than_an_hour''}'
      required: false
    - id: 11
      name: goals_for_workout
      label: Goals For Workout
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''general_fitness'', ''value'': ''general_fitness''}'
      - '{''id'': 2, ''label'': ''weight_loss'', ''value'': ''weight_loss''}'
      - '{''id'': 3, ''label'': ''weight_gain'', ''value'': ''weight_gain''}'
      required: false
    - id: 12
      name: meal_plan
      label: Meal Plan
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''low_carb'', ''value'': ''low_carb''}'
      - '{''id'': 2, ''label'': ''low_fat'', ''value'': ''low_fat''}'
      - '{''id'': 3, ''label'': ''balanced'', ''value'': ''balanced''}'
      required: false
    - id: 13
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
