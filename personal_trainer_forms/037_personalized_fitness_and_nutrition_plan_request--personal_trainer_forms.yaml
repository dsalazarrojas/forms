inputSchema:
  type: object
  properties:
    title: Personalized Fitness And Nutrition Plan Request
    pages:
    - id: 1
      name: client_details
      label: Client Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: goals
      label: Goals
      hint: What are your short-term and long-term goals?
      type: text
      options: []
      required: false
    - id: 3
      name: activity_level
      label: Activity Level
      hint: null
      type: select_one
      options:
      - sedentary
      - lightly active
      - highly active
      - extremely active
      required: false
    - id: 4
      name: height
      label: Height
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: weight
      label: Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: health_details
      label: Health Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_condition
      label: Medical Condition
      hint: Have you experienced any medical conditions that may impact your workout
        routine?
      type: select_multiple
      options:
      - high blood pressure
      - high cholesterol
      - diabetes
      - heart disease
      required: false
    - id: 9
      name: workout_frequency
      label: Workout Frequency
      hint: null
      type: select_one
      options:
      - daily
      - 2 3 times a week
      - 4 5 times a week
      - less than three times a week
      required: false
    - id: 10
      name: time_commitment
      label: Time Commitment
      hint: null
      type: select_one
      options:
      - 10 15 minutes
      - 30 60 minutes
      - more than an hour
      required: false
    - id: 11
      name: goals_for_workout
      label: Goals For Workout
      hint: null
      type: select_one
      options:
      - general fitness
      - weight loss
      - weight gain
      required: false
    - id: 12
      name: meal_plan
      label: Meal Plan
      hint: null
      type: select_one
      options:
      - low carb
      - low fat
      - balanced
      required: false
    - id: 13
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
