inputSchema:
  type: object
  properties:
    title: Employee End Of Day Report
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: time_in
      label: Time In
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: time_out
      label: Time Out
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: employee_progress
      label: Employee Progress
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Bad
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: manager_comments
      label: Manager Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: manager_signature
      label: Manager Signature
      hint: null
      type: text
      options: []
      required: false
