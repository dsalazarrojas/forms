inputSchema:
  type: object
  properties:
    title: Safety Meeting Checklist
    pages:
    - id: 1
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Equipment
      - Equipment failure
      - Human error
      - Other
      required: false
    - id: 7
      name: safety_measure_1
      label: Safety Measure 1
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: safety_measure_2
      label: Safety Measure 2
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: safety_measures
      label: Safety Measures
      hint: null
      type: select_multiple
      options:
      - Hard hat
      - Safety glasses
      - Safety harness
      required: false
