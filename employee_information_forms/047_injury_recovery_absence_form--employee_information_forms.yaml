      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: physician_name
      label: Physician Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: physician_phone
      label: Physician Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: recovery_status
      label: Recovery Status
      hint: null
      type: select_one
