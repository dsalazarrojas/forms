inputSchema:
  type: object
  properties:
    title: Employee Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: job_status
      label: Job Status
      hint: null
      type: select_multiple
      options:
      - New Hire
      - Existing Employee
      - Contract
      required: false
    - id: 8
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - HR
      - Management
      - Operations
      required: false
    - id: 9
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - New York
      - Los Angeles
      - Chicago
      required: false
    - id: 10
      name: job_start_date
      label: Job Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: job_end_date
      label: Job End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      required: false
    - id: 13
      name: job_level
      label: Job Level
      hint: null
      type: select_one
      options:
      - Entry-Level
      - Mid-level
      - Senior-Level
      required: false
