inputSchema:
  type: object
  properties:
    title: labour_registration_form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_number
      label: Employee Number
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: prophets_name
      label: Prophet's Name
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - active
      - inactive
      - unknown
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: select_multiple
      options:
      - Manager
      - Supervisor
      - Worker
      required: false
    - id: 6
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: branch
      label: Branch
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: job_type
      label: Job Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: work_hours
      label: Work Hours
      hint: null
      type: number
      options: []
      required: false
