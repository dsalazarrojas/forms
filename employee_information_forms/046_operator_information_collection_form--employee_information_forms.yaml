      type: text
      options: []
      required: true
    - id: 14
      name: operator_state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: operator_country
      label: Country
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: operator_region
      label: Region
      hint: null
      type: text
      options: []
      required: true
