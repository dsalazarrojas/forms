inputSchema:
  type: object
  properties:
    title: CR Employment Information
    pages:
    - id: 1
      name: employee_name
      label: Employee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Work Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Work Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: position_title
      label: Job Title or Position
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: start_date
      label: Employment Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: manager_name
      label: Direct Manager or Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: employment_type
      label: Employment Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Temporary
      - Seasonal
      required: true
    - id: 10
      name: work_location
      label: Primary Work Location
      hint: Office, site, or remote
      type: text
      options: []
      required: false
    - id: 11
      name: salary_range
      label: Salary Range
      hint: null
      type: select_one
      options:
      - Entry level
      - Mid-level
      - Senior level
      - Executive
      required: false
    - id: 12
      name: benefits_enrolled
      label: Benefits Enrollment Status
      hint: null
      type: select_one
      options:
      - Enrolled
      - Not enrolled
      - Pending enrollment
      required: false
    - id: 13
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: street_address
      label: Street Address
      hint: Current residential address
      type: text
      options: []
      required: true
    - id: 16
      name: city_state_zip
      label: City, State, ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: social_security_last_four
      label: Social Security Number - Last Four Digits
      hint: For verification purposes
      type: text
      options: []
      required: false
    - id: 18
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 19
      name: employment_status_notes
      label: Employment Status Notes or Comments
      hint: Any relevant employment information
      type: text
      options: []
      required: false
    - id: 20
      name: last_updated
      label: Date Information Last Updated
      hint: null
      type: date
      options: []
      required: true
