inputSchema:
  type: object
  properties:
    title: Cash Out Form
    pages:
    - id: 1
      name: employee_information_section
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: position
      label: Position or Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: request_section
      label: -- Cash Out Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: request_date
      label: Request Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 8
      name: cash_out_amount
      label: Amount Requested
      hint: Dollar amount
      type: number
      options: []
      required: true
    - id: 9
      name: request_reason
      label: Reason for Cash Out Request
      hint: Why are you requesting this amount?
      type: text
      options: []
      required: true
    - id: 10
      name: reason_category
      label: Category of Request
      hint: null
      type: select_one
      options:
      - Personal Use
      - Advance on Wages
      - Reimbursement
      - Travel
      - Educational Expense
      - Medical Expense
      - Other
      required: true
    - id: 11
      name: source_of_funds_section
      label: -- Source of Funds --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: fund_source
      label: Source of Cash Out Funds
      hint: null
      type: select_one
      options:
      - Petty Cash
      - Register
      - Cash on Hand
      - Advance on Salary
      - Reimbursement Account
      - Other
      required: true
    - id: 13
      name: authorization_section
      label: -- Authorization --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: supervisor_name
      label: Supervisor or Manager Name
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: supervisor_approval
      label: Supervisor Approval Status
      hint: null
      type: select_one
      options:
      - Approved
      - Pending Approval
      - Not Approved
      required: true
    - id: 16
      name: shift_information_section
      label: -- Shift Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: shift_date
      label: Shift Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 18
      name: shift_start_time
      label: Shift Start Time
      hint: "HH:MM AM/PM"
      type: time
      options: []
      required: true
    - id: 19
      name: shift_end_time
      label: Shift End Time
      hint: "HH:MM AM/PM"
      type: time
      options: []
      required: true
    - id: 20
      name: cash_register_section
      label: -- Cash Register Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: register_number
      label: Cash Register Number
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: register_balance_before
      label: Register Balance Before Cash Out
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: register_balance_after
      label: Register Balance After Cash Out
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: verification_section
      label: -- Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: employee_signature_date
      label: Date of Request
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
