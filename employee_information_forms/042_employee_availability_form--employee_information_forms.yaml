inputSchema:
  type: object
  properties:
    title: employee_availability_form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: availability_days
      label: Availability Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 5
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_tool
      label: Tool
      hint: The tool that this availability is for
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_to
      label: To
      hint: null
      type: text
      options: []
      required: false
