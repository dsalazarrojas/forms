      name: previous_position
      label: Previous position
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: reason_for_separation
      label: Reason for separation
      hint: null
      type: select_one
      options:
      - Voluntary
      - Involuntary
      - Retirement
      required: false
    - id: 13
      name: reason_for_promotion
      label: Reason for promotion
      hint: null
      type: select_one
      options:
      - Performance
