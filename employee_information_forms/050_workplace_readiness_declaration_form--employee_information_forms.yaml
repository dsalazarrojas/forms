inputSchema:
  type: object
  properties:
    title: Workplace Readiness Declaration Form
    pages:
    - id: 1
      name: work_location
      label: Work Location
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: work_schedule
      label: Work Schedule
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: work_from_home
      label: Work From Home
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact person
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact phone number
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_contact_relation
      label: Emergency Contact Relation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: workplace_location
      label: Workplace Location
      hint: Workplace address or location name
      type: text
      options: []
      required: false
    - id: 8
      name: workplace_address
      label: Workplace Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: return_to_work_date
      label: Return to Work Date
      hint: Date employee is expected to return to work
      type: date
      options: []
      required: false
    - id: 10
      name: return_to_work_time
      label: Return to Work Time
      hint: Time employee is expected to return to work
      type: time
      options: []
      required: false
    - id: 11
      name: return_to_work_location
      label: Return to Work Location
      hint: Location where employee will return to work
      type: text
      options: []
      required: false
    - id: 12
      name: health_declaration
      label: Health Declaration
      hint: Please indicate if employee has any health issues that may affect their
        work
      type: text
      options: []
      required: false
    - id: 13
      name: travel_restrictions
      label: Travel Restrictions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
