      name: travel_restriction_details
      label: Travel Restriction Details
      hint: Details about travel restrictions
      type: text
      options: []
      required: false
    - id: 15
      name: medical_clearance
      label: Medical Clearance
      hint: Has employee received medical clearance to return to work
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 16
      name: medical_clearance_date
      label: Medical Clearance Date
      hint: Date of medical clearance
      type: date
      options: []
      required: false
    - id: 17
      name: medical_clearance_provider
      label: Medical Clearance Provider
      hint: Name of medical clearance provider
      type: text
      options: []
      required: false
    - id: 18
      name: return_to_work_status
      label: Return to Work Status
      hint: Employee status on return to work
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 19
      name: return_to_work_status_reason
      label: Return to Work Status Reason
      hint: Reason for return to work status
      type: text
      options: []
      required: false
    - id: 20
      name: work_location_other
      label: Other Work Location
      hint: Any other work location
      type: text
      options: []
      required: false
    - id: 21
      name: work_location_address
      label: Other Work Location Address
      hint: Address of other work location
      type: text
      options: []
      required: false
    - id: 22
      name: other_work_location_type
      label: Other Work Location Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 23
      name: other_work_location_details
      label: Other Work Location Details
      hint: Any other work location details
      type: text
      options: []
      required: false
    - id: 24
      name: work_status
      label: Work Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 25
      name: work_status_reason
      label: Work Status Reason
      hint: Reason for current work status
      type: text
      options: []
      required: false
