inputSchema:
  type: object
  properties:
    title: Employee Absenteeism Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_absence_start
      label: Date of Absence Start
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: absence_reason
      label: Absence Reason
      hint: null
      type: select_one
      options:
      - '{''label'': ''Sick leave''}'
      - '{''label'': ''Vacation''}'
      - '{''label'': ''Personal reasons''}'
      - '{''label'': ''Doctor’s visit''}'
      required: true
    - id: 6
      name: work_location
      label: Work Location
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: supervisor_email
      label: Supervisor Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: supervisor_phone
      label: Supervisor Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: note
      label: Note
      hint: Please provide a detailed note.
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned tool
      hint: null
      type: text
      options: []
      required: true
