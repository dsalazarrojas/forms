inputSchema:
  type: object
  properties:
    title: Visitor Request Form BlinkNow
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: visitor_title
      label: Visitor Title
      hint: The person visiting this place
      type: text
      options: []
      required: false
    - id: 3
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - IT
      - Facilities
      - Management
      - Accounting
      required: false
    - id: 4
      name: purpose_of_visit
      label: Purpose of Visit
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: assigned_to
      label: Assigned to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 11
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - New
      - In Progress
      - Done
      required: false
