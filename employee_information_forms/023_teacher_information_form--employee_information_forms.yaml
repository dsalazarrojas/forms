inputSchema:
  type: object
  properties:
    title: Teacher Information Form
    pages:
    - id: 1
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Math
      - Science
      - English
      required: true
    - id: 5
      name: school
      label: School
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: teacher_role
      label: Teacher Role
      hint: null
      type: select_multiple
      options:
      - Class Teacher
      - Subject Teacher
      - Teacher Assistant
      required: true
    - id: 7
      name: date_hired
      label: Date Hired
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: date_available
      label: Date Available
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: bio
      label: Bio
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
