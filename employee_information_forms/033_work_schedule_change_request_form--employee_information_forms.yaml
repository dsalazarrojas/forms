inputSchema:
  type: object
  properties:
    title: Work Schedule Change Request Form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: shift_number
      label: Shift Number
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: manager_approval
      label: Manager Approval
      hint: null
      type: select_one
      options:
      - Approved
      - Denied
      - Pending
      required: true
    - id: 9
      name: manager_note
      label: Manager Note
      hint: null
      type: note
      options: []
      required: false
