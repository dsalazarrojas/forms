inputSchema:
  type: object
  properties:
    title: publicUtilityWorkerExitOffboardingForm
    pages:
    - id: 1
      name: exit_date
      label: What is the worker's last day of employment?
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: exit_reason
      label: What is the reason for exiting the company?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: feedback
      label: Do you have any feedback or comments about your experience at the company?
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: phone_number
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: supervisor_name
      label: Who is your supervisor?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: department
      label: What department are you leaving?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: supervisor_comments
      label: Do you have any supervisor comments about your exit?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: employee_id
      label: What is your ID number?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: manager_comments
      label: Do you have any manager comments about your exit?
      hint: null
      type: note
      options: []
      required: false
