      name: documents_attached
      label: Documents Attached
      hint: What is included
      type: select_multiple
      options:
      - Invoice
      - Receipt
      - Purchase order
      - Contract
      - Approval memo
      - Delivery receipt
      - Other
      required: false
    - id: 31
      name: document_count
      label: Number of Documents
      hint: Document count
      type: number
      options: []
      required: false
    - id: 32
      name: authorization
