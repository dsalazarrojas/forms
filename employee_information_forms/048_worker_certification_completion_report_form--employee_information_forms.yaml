inputSchema:
  type: object
  properties:
    title: Worker Certification Completion Report Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: department
      label: department
      hint: null
      type: select_one
      options:
      - Accounting
      - Marketing
      - HR
      required: false
    - id: 3
      name: job_title
      label: job_title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: training_completed
      label: Has Training Completed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: certification_completed
      label: Has Certification Completed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: completion_date
      label: Completion Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: expiration_date
      label: Expiration Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
