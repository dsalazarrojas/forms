inputSchema:
  type: object
  properties:
    title: Payroll Adjustment Request Form
    pages:
    - id: 1
      name: employee_information
      label: Employee Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pay_period
      label: Pay Period
      hint: null
      type: select_one
      options:
      - January 2022
      - February 2022
      - March 2022
      - April 2022
      - May 2022
      - June 2022
      required: false
    - id: 3
      name: adjustment_type
      label: Adjustment Type
      hint: null
      type: select_multiple
      options:
      - Raise
      - Salary
      - Bonus
      required: false
    - id: 4
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: requested_amount
      label: Requested Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
