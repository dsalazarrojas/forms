inputSchema:
  type: object
  properties:
    title: Travel Claim Form
    pages:
    - id: 1
      name: employee_details
      label: employee_details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: expense_type
      label: expense_type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Airfare''}'
      - '{''id'': 2, ''label'': ''Hotel''}'
      - '{''id'': 3, ''label'': ''Restaurants''}'
      - '{''id'': 4, ''label'': ''Rental Car''}'
      required: true
    - id: 3
      name: expense_amount
      label: expense_amount
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: expense_date
      label: expense_date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: expense_description
      label: expense_description
      hint: Please describe your expense.
      type: text
      options: []
      required: false
    - id: 6
      name: receipt_upload
      label: receipt_upload
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submit_button
      label: submit
      hint: null
      type: text
      options: []
      required: false
