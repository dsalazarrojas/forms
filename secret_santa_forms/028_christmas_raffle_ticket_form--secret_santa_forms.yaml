inputSchema:
  type: object
  properties:
    title: Christmas Raffle Ticket Form
    pages:
    - id: 1
      name: purchaser_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For ticket confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: For winner notification
      type: text
      options: []
      required: true
    - id: 4
      name: organization_name
      label: Organization Name
      hint: If purchasing for a group
      type: text
      options: []
      required: false
    - id: 5
      name: section_purchaser_info
      label: -- Purchaser Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: ticket_package
      label: Ticket Package
      hint: Select your ticket package
      type: select_one
      options:
      - Single Ticket 1
      - Strip of 5 Tickets
      - Strip of 10 Tickets
      - Strip of 20 Tickets
      - Bulk 50 Tickets
      - Custom Quantity
      required: true
    - id: 7
      name: number_of_tickets
      label: Number of Tickets
      hint: Total tickets desired
      type: number
      options: []
      required: true
    - id: 8
      name: ticket_price
      label: Price Per Ticket
      hint: Display only
      type: text
      options: []
      required: false
    - id: 9
      name: total_amount
      label: Total Amount
      hint: Total purchase amount
      type: number
      options: []
      required: true
    - id: 10
      name: section_ticket_selection
      label: -- Ticket Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: prize_preference
      label: Prize Preference
      hint: Which prize interests you
      type: select_one
      options:
      - Grand Prize
      - Second Prize
      - Third Prize
      - Any Prize
      - No Preference
      required: true
    - id: 12
      name: prize_categories
      label: Prize Categories of Interest
      hint: Select all that interest you
      type: select_multiple
      options:
      - Electronics
      - Gift Baskets
      - Travel Vouchers
      - Cash Prizes
      - Home Goods
      - Jewelry
      - Experiences
      - Sports Memorabilia
      required: false
    - id: 13
      name: section_prize_info
      label: -- Prize Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Cash at Event
      - Check
      - Bank Transfer
      required: true
    - id: 15
      name: billing_address
      label: Billing Address
      hint: Full billing address
      type: text
      options: []
      required: true
    - id: 16
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: postal_code
      label: Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: section_payment
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: ticket_delivery
      label: Ticket Delivery
      hint: How should you receive tickets
      type: select_one
      options:
      - Email E-tickets
      - Mail Physical Tickets
      - Pickup at Event
      - Pickup at Office
      required: true
    - id: 20
      name: shipping_address
      label: Shipping Address
      hint: If mailing tickets
      type: text
      options: []
      required: false
    - id: 21
      name: section_delivery
      label: -- Delivery --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: attendance_plans
      label: Event Attendance
      hint: Will you attend the drawing
      type: select_one
      options:
      - Yes I will attend
      - No I cannot attend
      - Maybe still deciding
      required: true
    - id: 23
      name: volunteer_interest
      label: Volunteer Interest
      hint: Would you like to help at event
      type: select_one
      options:
      - No thank you
      - Yes as helper
      - Yes as setup crew
      - Yes as cleanup crew
      required: false
    - id: 24
      name: how_heard
      label: How Did You Hear About Raffle
      hint: null
      type: select_one
      options:
      - Social Media
      - Email
      - Website
      - Friend or Family
      - Previous Event
      - Advertisement
      - Other
      required: true
    - id: 25
      name: terms_agreement
      label: Terms Agreement
      hint: I agree to raffle terms and conditions
      type: select_one
      options:
      - Yes I agree
      - No I do not agree
      required: true
    - id: 26
      name: privacy_consent
      label: Privacy Consent
      hint: Allow us to contact you about raffle
      type: select_one
      options:
      - Yes I consent
      - No I do not consent
      required: true
    - id: 27
      name: additional_purchases
      label: Additional Purchases
      hint: Interested in future raffles
      type: select_one
      options:
      - Yes keep me informed
      - No this is one-time
      required: false
