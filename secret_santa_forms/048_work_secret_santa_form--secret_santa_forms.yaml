      options: []
      required: true
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Secret Santa Forms
      - Other Form Categories
      required: true
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other Tool
      required: true
    - id: 5
      name: output_file
      label: Output File
      hint: null
      type: text
      options: []
