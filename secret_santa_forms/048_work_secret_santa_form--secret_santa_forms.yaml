    - id: 6
      name: title
      label: Title
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: color
      label: Favorite Color
      hint: null
      type: select_one
      options:
      - Red
      - Blue
      - Green
      required: false
    - id: 9
      name: allergies
      label: Allergies
