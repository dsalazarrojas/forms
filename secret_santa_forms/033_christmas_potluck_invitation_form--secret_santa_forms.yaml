inputSchema:
  type: object
  properties:
    title: Christmas Potluck Invitation Form
    pages:
    - id: 1
      name: guest_info
      label: -- Guest Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: rsvp_section
      label: -- RSVP Response --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: attendance
      label: Will you be attending?
      hint: null
      type: select_one
      options:
      - Yes, I will attend
      - No, I cannot attend
      - Maybe, I will decide later
      required: true
    - id: 8
      name: number_of_guests
      label: Number of People Attending
      hint: Including yourself
      type: number
      options: []
      required: true
    - id: 9
      name: guest_names
      label: Names of Additional Guests
      hint: Comma-separated list
      type: text
      options: []
      required: false
    - id: 10
      name: contribution
      label: -- Potluck Contribution --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: dish_type
      label: Type of Dish You Will Bring
      hint: null
      type: select_one
      options:
      - Appetizer
      - Main dish
      - Side dish
      - Dessert
      - Beverage
      - Specialty dietary item
      - Other
      required: true
    - id: 12
      name: dish_name
      label: Name of Dish
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: dish_description
      label: Description and Ingredients
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: servings
      label: Number of Servings
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: allergen_info
      label: Allergen Information
      hint: Identify any major allergens
      type: text
      options: []
      required: false
    - id: 16
      name: special_section
      label: -- Special Requests & Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: Select all that apply
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-free
      - Nut allergies
      - Shellfish allergies
      - Dairy-free
      - Other
      required: false
    - id: 18
      name: seating_preference
      label: Seating Preference
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: secret_santa_participation
      label: Will you participate in Secret Santa?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: false
    - id: 20
      name: secret_santa_budget
      label: Secret Santa Budget
      hint: null
      type: select_one
      options:
      - Under $10
      - $10-$25
      - $25-$50
      - Over $50
      required: false
    - id: 21
      name: additional_notes
      label: Additional Notes or Comments
      hint: null
      type: text
      options: []
      required: false
