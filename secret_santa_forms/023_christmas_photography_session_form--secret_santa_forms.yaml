inputSchema:
  type: object
  properties:
    title: Christmas Photography Session Form
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For session confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: For session day contact
      type: text
      options: []
      required: true
    - id: 4
      name: session_date
      label: Preferred Session Date
      hint: First choice date
      type: date
      options: []
      required: true
    - id: 5
      name: alternate_date
      label: Alternate Date
      hint: Backup date option
      type: date
      options: []
      required: false
    - id: 6
      name: section_contact_info
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: session_type
      label: Session Type
      hint: What type of session do you want
      type: select_one
      options:
      - Individual Portrait
      - Couple Session
      - Family Session
      - Children Only
      - Pet and Family
      - Corporate Headshots
      - Engagement Session
      required: true
    - id: 8
      name: session_location
      label: Session Location
      hint: Where would you like to shoot
      type: select_one
      options:
      - Studio Session
      - Outdoor Park
      - Beach Setting
      - Urban Downtown
      - Home Session
      - Christmas Tree Farm
      - Other Location
      required: true
    - id: 9
      name: location_address
      label: Location Address
      hint: If home or specific location
      type: text
      options: []
      required: false
    - id: 10
      name: section_session_details
      label: -- Session Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: package_selection
      label: Package Selection
      hint: Choose your photography package
      type: select_one
      options:
      - Mini Session 30 min
      - Standard Session 1 hour
      - Deluxe Session 2 hours
      - Premium Full Day
      - Custom Package
      required: true
    - id: 12
      name: number_of_people
      label: Number of People
      hint: How many will be photographed
      type: select_one
      options:
      - 1 person
      - 2 people
      - 3-5 people
      - 6-8 people
      - 9 or more people
      required: true
    - id: 13
      name: children_ages
      label: Children Ages
      hint: If children will be included
      type: text
      options: []
      required: false
    - id: 14
      name: pets_included
      label: Pets Included
      hint: Will pets be in photos
      type: select_one
      options:
      - No pets
      - Yes 1 pet
      - Yes 2 pets
      - Yes more than 2
      required: true
    - id: 15
      name: section_participants
      label: -- Participants --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: outfit_changes
      label: Outfit Changes
      hint: How many outfit changes
      type: select_one
      options:
      - 1 outfit
      - 2 outfits
      - 3 outfits
      - 4 or more outfits
      required: true
    - id: 17
      name: style_preference
      label: Style Preference
      hint: What photography style do you prefer
      type: select_one
      options:
      - Traditional Posed
      - Candid Natural
      - Artistic Creative
      - Documentary Style
      - Fashion Editorial
      - Mix of Styles
      required: true
    - id: 18
      name: background_preference
      label: Background Preference
      hint: What backgrounds do you like
      type: select_multiple
      options:
      - Christmas Tree
      - Snowy Outdoor
      - Cozy Indoor
      - Festive Decorations
      - Natural Scenic
      - Urban Modern
      - Studio Backdrop
      required: true
    - id: 19
      name: section_style
      label: -- Style Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: photo_usage
      label: Photo Usage
      hint: What will photos be used for
      type: select_multiple
      options:
      - Personal Use Only
      - Holiday Cards
      - Social Media
      - Family Gifts
      - Professional Use
      - Calendar Creation
      required: true
    - id: 21
      name: print_package
      label: Print Package
      hint: Do you want printed photos
      type: select_one
      options:
      - Digital only
      - Small print package
      - Medium print package
      - Large print package
      - Album included
      required: true
    - id: 22
      name: section_deliverables
      label: -- Deliverables --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: special_requests
      label: Special Requests
      hint: Any specific shot requests
      type: text
      options: []
      required: false
    - id: 24
      name: inspiration_photos
      label: Inspiration Photos
      hint: Share any reference photos
      type: text
      options: []
      required: false
    - id: 25
      name: how_heard
      label: How Did You Hear About Us
      hint: null
      type: select_one
      options:
      - Website
      - Social Media
      - Friend Referral
      - Previous Client
      - Online Search
      - Advertisement
      - Other
      required: false
    - id: 26
      name: deposit_acknowledged
      label: Deposit Required
      hint: A deposit is required to book
      type: select_one
      options:
      - Yes I understand
      - No I need info
      required: true
    - id: 27
      name: cancellation_policy
      label: Cancellation Policy
      hint: I understand the cancellation policy
      type: select_one
      options:
      - Yes I understand
      - No please explain
      required: true
    - id: 28
      name: model_release
      label: Model Release
      hint: Allow photographer to use photos for portfolio
      type: select_one
      options:
      - Yes I consent
      - No I do not consent
      required: true
