inputSchema:
  type: object
  properties:
    title: Secret Santa Form For Adults
    pages:
    - id: 1
      name: gift_exchange_name
      label: Gift Exchange Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: organizer
      label: Organizer
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participants_name
      label: Participants Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participants_email
      label: Participants Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: gift_limit
      label: Gift Limit
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: gift_price_limit
      label: Gift Price Limit
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: gift_price_currency
      label: Gift Price Currency
      hint: null
      type: select_one
      options:
      - USD
      - EUR
      - GBP
      - JPY
      required: false
    - id: 8
      name: gift_price_max_amount
      label: Gift Price Max
      hint: null
      type: text
      options: []
      required: false
