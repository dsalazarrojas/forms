inputSchema:
  type: object
  properties:
    title: Group Meeting Log
    pages:
    - id: 1
      name: meeting_log
      label: Meeting Log
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: members_who_attended
      label: Who Attended
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: meeting_status
      label: Meeting Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 4
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: meeting_note
      label: Notes
      hint: null
      type: text
      options: []
      required: false
