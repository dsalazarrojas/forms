inputSchema:
  type: object
  properties:
    title: Leave Request Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: 'null'
      type: text
      options: []
      required: false
    - id: 2
      name: employee_id
      label: Employee ID
      hint: 'null'
      type: number
      options: []
      required: false
