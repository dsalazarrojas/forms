      - Severe
      required: true
    - id: 10
      name: recent_travel
      label: Recent Travel
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: recent_contact
      label: Recent Contact
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: symptoms_start
      label: Symptoms Start
