      type: select_multiple
      options:
      - Mild
      - Severe
      required: true
    - id: 8
      name: chest_pain
      label: Chest Pain
      hint: null
      type: select_multiple
      options:
      - Mild
      - Severe
      required: true
    - id: 9
      name: fatigue
      label: Fatigue
      hint: null
      type: select_multiple
      options:
