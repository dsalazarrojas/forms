inputSchema:
  type: object
  properties:
    title: covid_daily_health_screening_form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
