      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: temperature_check
      label: Temperature Check
      hint: null
      type: select_multiple
      options:
      - Fever
      - Chills
      - Cough
      - Shortness of Breath
      - Sore Throat
      required: true
    - id: 5
      name: cough
      label: cough
      hint: null
      type: select_multiple
      options:
      - Mild Cough
      - Severe Cough
      required: true
    - id: 6
      name: shortness_of_breath
