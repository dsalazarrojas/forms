title: Political survey
description: Generate a Political survey survey for the "Other" category. Use the template name: "Political survey template".
questions:
  - text: Overall, how satisfied are you with political survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Political, Survey, Other, Feature A]
  - text: How often do you interact with political survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
