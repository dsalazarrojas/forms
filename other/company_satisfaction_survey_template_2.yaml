description: This survey aims to gather your valuable feedback on various aspects
  of your work experience and overall satisfaction at the company.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate communication from management?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel supported in your professional development?
  type: single
- options:
  - Team collaboration
  - Work-life balance
  - Innovation
  - Learning opportunities
  - Recognition
  text: What aspects of our company culture do you value most?
  type: multiple
- text: What could improve your experience at work?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: Company satisfaction survey
