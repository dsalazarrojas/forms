title: Market research survey
description: Generate a Market research survey survey for the "Other" category. Use the template name: "Market research survey template".
questions:
  - text: Overall, how satisfied are you with market research survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Market, Research, Survey, Other]
  - text: How often do you interact with market research survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
