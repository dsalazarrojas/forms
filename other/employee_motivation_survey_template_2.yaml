description: A survey to understand and improve employee motivation and engagement
  within the organization.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate communication from management regarding company goals and
    changes?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel supported in your professional development and career growth?
  type: single
- options:
  - Better work-life balance
  - More recognition
  - Clearer career paths
  - Improved benefits
  - Better team collaboration
  - More challenging work
  text: What factors would most improve your experience at work and motivation? (select
    all that apply)
  type: multiple
- text: Please provide any additional comments or suggestions related to employee
    motivation or engagement.
  type: text
title: Employee motivation survey
