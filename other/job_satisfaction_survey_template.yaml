description: Assess employee sentiment and identify areas for improvement within the
  organization.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate communication from management?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel supported in your professional development?
  type: single
- options:
  - Work-life balance
  - Team collaboration
  - Challenging tasks
  - Learning opportunities
  - Compensation & benefits
  text: What aspects of your job do you find most fulfilling?
  type: multiple
- text: What could improve your experience at work?
  type: text
- text: Any additional comments or suggestions?
  type: text
title: Job satisfaction survey
