title: Relationship questionnaire
description: Generate a Relationship questionnaire survey for the "Other" category. Use the template name: "Relationship questionnaire template".
questions:
  - text: Overall, how satisfied are you with relationship questionnaire?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Relationship, Questionnaire, Other, Feature A]
  - text: How often do you interact with relationship questionnaire?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
