description: Gather feedback to improve our services and client satisfaction.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with our services as a vendor?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate our communication regarding services and support?
  type: single
- options:
  - Service quality
  - Responsiveness
  - Cost-effectiveness
  - Timeliness
  - Account management
  - Technical support
  text: Which aspects of our service do you value most? (select all that apply)
  type: multiple
- text: What could we improve to better meet your needs as a client?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: Vendor satisfaction survey
