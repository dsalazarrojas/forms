description: Understand general well-being and satisfaction, and factors contributing
  to it.
questions:
- options:
  - Very happy
  - Somewhat happy
  - Neutral
  - Somewhat unhappy
  - Very unhappy
  text: Overall, how would you rate your current level of happiness?
  type: single
- options:
  - Daily
  - Weekly
  - Monthly
  - Rarely
  - Never
  text: How often do you engage in activities that bring you joy?
  type: single
- options:
  - Family/Friends
  - Work/Career
  - Hobbies
  - Health
  - Personal growth
  - Financial stability
  text: Which of the following contribute most to your happiness? (select all that
    apply)
  type: multiple
- text: What is one thing you would change to improve your overall happiness?
  type: text
- text: Do you have any additional thoughts on well-being or happiness?
  type: text
title: Happiness survey
