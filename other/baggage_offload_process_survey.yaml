inputSchema:
  type: object
  properties:
    title: Baggage Offload Process Survey
    pages:
    - id: 1
      name: baggage_offload_process_description
      label: Baggage Offload Process Description
      hint: Brief description of the offload process.
      type: text
      options: []
      required: true
    - id: 2
      name: category_select_single
      label: Category Selection (Single Option)
      hint: Select one option for categorizing the offload process.
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      required: true
    - id: 3
      name: category_select_multiple
      label: Category Selection (Multiple Options)
      hint: Select multiple options for categorizing the offload process.
      type: select_multiple
      options:
      - Option A
      - Option B
      - Option C
      required: true
    - id: 4
      name: contact_email
      label: Contact Information (Email)
      hint: Please provide your email address.
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Information (Phone)
      hint: Please provide your phone number.
      type: text
      options: []
      required: true
    - id: 6
      name: offload_process_type
      label: Baggage Offload Process Type
      hint: Please select the type of offload process.
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      required: true
    - id: 7
      name: frequency_offload
      label: Frequency of Offload
      hint: How frequently is the offload process performed?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      required: true
    - id: 8
      name: description_frequency
      label: Description of Frequency
      hint: Describe the frequency of the offload process in detail.
      type: text
      options: []
      required: true
    - id: 9
      name: description_process
      label: Description of Process Steps
      hint: Describe the steps involved in the offload process in detail.
      type: text
      options: []
      required: true
    - id: 10
      name: location_offload
      label: Location of Offload
      hint: Please describe the location of the offload process.
      type: text
      options: []
      required: true
    - id: 11
      name: responsible_offload
      label: Responsible Individual or Team
      hint: Please name the person or team responsible for the offload process.
      type: text
      options: []
      required: true
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: Any additional comments or details about the offload process.
      type: text
      options: []
      required: false
