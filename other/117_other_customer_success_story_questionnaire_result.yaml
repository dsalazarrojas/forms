title: Customer success story questionnaire
description: Generate a Customer success story questionnaire survey for the "Other" category. Use the template name: "Customer success story questionnaire template".
questions:
  - text: Overall, how satisfied are you with customer success story questionnaire?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Customer, Success, Story, Questionnaire]
  - text: How often do you interact with customer success story questionnaire?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
