title: Skin care survey
description: Generate a Skin care survey survey for the "Other" category. Use the template name: "Skin care survey template".
questions:
  - text: Overall, how satisfied are you with skin care survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Skin, Care, Survey, Other]
  - text: How often do you interact with skin care survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
