inputSchema:
  type: object
  properties:
    title: landlord_property_management_intake_form
    pages:
    - id: 1
      name: property_information
      label: Property Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tenant_contact
      label: Tenant Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rent_details
      label: Rent Details
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: property_status
      label: Property Status
      hint: null
      type: select_one
      options:
      - available
      - rented
      - sold
      required: false
    - id: 5
      name: property_features
      label: Property Features
      hint: null
      type: select_multiple
      options:
      - parking
      - pool
      - gym
      required: false
    - id: 6
      name: property_image
      label: Property Image
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: property_documents
      label: Property Documents
      hint: null
      type: select_multiple
      options:
      - lease agreement
      - property insurance
      - property warranty
      required: false
    - id: 8
      name: tenant_documents
      label: Tenant Documents
      hint: null
      type: select_multiple
      options:
      - rental agreement
      - proof of income
      - identification
      required: false
