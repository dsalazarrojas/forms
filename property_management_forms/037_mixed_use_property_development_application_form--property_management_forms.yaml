inputSchema:
  type: object
  properties:
    title: Mixed Use Property Development Application Form
    pages:
    - id: 1
      name: mixed_use_property_development_application_form_1
      label: Property Development Type
      hint: Select the type of property development you are applying for
      type: select_one
      options:
      - Residential
      - Commercial
      - Industrial
      required: true
    - id: 2
      name: mixed_use_property_development_application_form_2
      label: Property Size
      hint: Choose the size of the property
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 3
      name: mixed_use_property_development_application_form_3
      label: Land Use
      hint: Select the primary use of the land
      type: select_one
      options:
      - Residential
      - Commercial
      - Industrial
      required: true
    - id: 4
      name: address
      label: Address
      hint: Enter the address of the property
      type: text
      options: []
      required: true
    - id: 5
      name: contact_name
      label: Contact Name
      hint: Enter the name of the contact person or organization
      type: text
      options: []
      required: true
    - id: 6
      name: contact_email
      label: Contact Email
      hint: Enter the contact person or organization email address
      type: email
      options: []
      required: true
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: Enter the contact person or organization phone number
      type: text
      options: []
      required: true
    - id: 8
      name: property_address
      label: Property Address
      hint: Confirm the property's address
      type: text
      options: []
      required: true
    - id: 9
      name: property_owner
      label: Property Owner
      hint: Enter the name of the property owner
      type: text
      options: []
      required: true
    - id: 10
      name: property_status
      label: Property Status
      hint: Describe the property's current status
      type: text
      options: []
      required: true
    - id: 11
      name: submission_date
      label: Submission Date
      hint: Enter the date of submission
      type: date
      options: []
      required: true
    - id: 12
      name: submission_time
      label: Submission Time
      hint: Enter the time of submission
      type: time
      options: []
      required: true
    - id: 13
      name: mixed_use_property_development_application_form_13
      label: Description
      hint: Describe your development project
      type: text
      options: []
      required: true
    - id: 14
      name: mixed_use_property_development_application_form_14
      label: Property Type (Confirmation)
      hint: Confirm the type of property development
      type: select_one
      options:
      - Residential
      - Commercial
      - Industrial
      required: true
