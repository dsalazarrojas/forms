inputSchema:
  type: object
  properties:
    title: Tenant Financial Comfort Survey
    pages:
    - id: 1
      name: tenant_financial_comfort_survey
      label: Tenant Financial Comfort Survey
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: question1
      label: What is the rent you are currently paying?
      hint: Please enter a dollar value
      type: number
      options: []
      required: true
    - id: 3
      name: question2
      label: Is the rent too high or too low?
      hint: Select one
      type: select_one
      options:
      - High
      - Low
      - Neutral
      required: true
    - id: 4
      name: question3
      label: Is the rent increasing or decreasing?
      hint: null
      type: select_multiple
      options:
      - Increasing
      - Decreasing
      - Neutral
      required: true
    - id: 5
      name: question4
      label: Rent payment date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: question5
      label: Rent payment time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: tenant_financial_concerns
      label: Are you financially comfortable about your rent?
      hint: null
      type: select_one
      options:
      - Very Comfortable
      - Somewhat Comfortable
      - Not Very Comfortable
      - Not Comfortable
      required: true
    - id: 8
      name: question7
      label: Do you have a financial plan for rent increases?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: question8
      label: Would you prefer to pay rent in installments?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: question9
      label: Have you ever experienced financial difficulties with rent?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: question10
      label: Do you have a guarantor?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: question11
      label: Do you have a financial support system?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: question12
      label: Do you have a rent savings plan?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: question13
      label: Do you think you can cover your rent?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: question15
      label: Do you think you can pay your rent 1-2 months in advance?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 16
      name: question16
      label: Do you think 1-2 months rent is a good financial safety net?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: question17
      label: Do you think 3-6 months rent is a good financial safety net?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 18
      name: question18
      label: Do you think 6-12 months rent is a good financial safety net?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: question19
      label: Do you think 12 months+ rent is a good financial safety net?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 20
      name: question20
      label: Do you think you can afford to pay rent 6 months in advance?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: question21
      label: Do you think you can pay 1-2 months rent in 1 month?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: question22
      label: Do you think 1-2 months rent is a good financial savings plan?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: question23
      label: Do you think 3-6 months rent is a good financial savings plan?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 24
      name: question24
      label: Do you think 6-12 months rent is a good financial savings plan?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 25
      name: question25
      label: Do you think you can pay 1-2 months rent in 1 month without financial
        difficulties?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
