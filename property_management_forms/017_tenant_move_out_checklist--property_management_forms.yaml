      name: property_status
      label: Current Property Status
      hint: null
      type: select_one
      options:
      - Available
      - Occupied
      - Pending
      - Unknown
      required: false
    - id: 2
      name: condition_of_move_out
      label: Condition Of Move Out
      hint: null
