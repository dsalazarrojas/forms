inputSchema:
  type: object
  properties:
    title: Property Winterization Checklist
    pages:
    - id: 1
      name: seasonal_inspection
      label: Seasonal Inspection
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: prep_status
      label: Prep Status
      hint: null
      type: select_one
      options:
      - Completed
      - Not Completed
      required: false
    - id: 3
      name: season
      label: Season
      hint: null
      type: select_one
      options:
      - Winter
      - Spring
      required: false
    - id: 4
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Completed
      - Pending
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: contact_person
      label: Contact Person
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes_1
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: season_2
      label: Season 2
      hint: null
      type: select_one
      options:
      - Winter
      - Spring
      required: false
    - id: 11
      name: notes_2
      label: Additional Notes 2
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: notes_3
      label: Additional Notes 3
      hint: null
      type: note
      options: []
      required: false
