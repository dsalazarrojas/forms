        hint: How fast do systems respond
        type: select_one
        options:
          - Very Fast
          - Fast
          - Acceptable
          - Slow
          - Very Slow
        required: false
      - id: 15
        name: issues_experienced
        label: Issues Experienced
        hint: Problems encountered
        type: note
        options: []
        required: false
      - id: 16
        name: frequency_of_issues
        label: Frequency of Issues
        hint: How often problems occur
        type: select_one
        options:
          - Never
          - Rarely
          - Occasionally
          - Frequently
          - Constantly
        required: true
      - id: 17
        name: issue_types
        label: Types of Issues
        hint: Select all that apply
        type: select_multiple
        options:
          - System Crashes
          - Slow Response
          - Connectivity Problems
          - False Alarms
          - Battery Issues
          - App Problems
          - Voice Control Issues
        required: false
      - id: 18
        name: most_recent_issue
        label: Most Recent Issue
        hint: Describe last problem
        type: text
        options: []
        required: false
      - id: 19
        name: improvement_suggestions
        label: Improvement Suggestions
        hint: What would you improve
        type: note
        options: []
        required: false
