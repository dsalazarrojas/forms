        hint: What features do you want
        type: text
        options: []
        required: false
      - id: 21
        name: priority_improvements
        label: Priority Improvements
        hint: Most important fixes
        type: select_multiple
        options:
          - Faster Response Time
          - Better App Interface
          - More Reliable Connectivity
          - Lower Cost
          - Better Customer Support
          - More Features
          - Better Integration
        required: false
      - id: 22
        name: would_recommend
        label: Would Recommend
        hint: Recommend to others
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Maybe
          - Probably No
          - Definitely No
        required: true
      - id: 23
        name: additional_feedback
        label: Additional Feedback
        hint: Any other comments
        type: text
        options: []
        required: false
      - id: 24
        name: contact_for_followup
        label: Contact for Follow Up
        hint: May we contact you
        type: select_one
        options:
          - Yes Please Contact
          - No Do Not Contact
        required: false
      - id: 25
        name: survey_complete
        label: Survey Completion
        hint: Thank you for feedback
        type: select_one
        options:
          - Survey Complete
          - Save as Draft
        required: true
