inputSchema:
  type: object
  properties:
    title: Condo Automation Feedback Survey
    pages:
      - id: 1
        name: survey_welcome
        label: Condo Automation Feedback
        hint: Help us improve our automation systems
        type: note
        options: []
        required: false
      - id: 2
        name: resident_name
        label: Resident Name
        hint: Optional identification
        type: text
        options: []
        required: false
      - id: 3
        name: unit_number
        label: Unit Number
        hint: Your condo unit
        type: text
        options: []
        required: true
      - id: 4
        name: building_name
        label: Building Name
        hint: Which building
        type: select_one
        options:
          - Building A
          - Building B
          - Building C
          - Building D
          - Other
        required: true
      - id: 5
        name: residency_duration
        label: Length of Residency
        hint: How long have you lived here
        type: select_one
        options:
          - Less than 6 months
          - 6 months to 1 year
          - 1 to 3 years
          - 3 to 5 years
          - Over 5 years
        required: true
      - id: 6
        name: automation_usage
        label: Automation Usage
        hint: Which systems do you use
        type: note
        options: []
        required: false
      - id: 7
        name: smart_lighting
        label: Smart Lighting Usage
        hint: Do you use automated lighting
        type: select_one
        options:
          - Use Regularly
          - Use Occasionally
          - Have But Never Use
          - Do Not Have
        required: false
      - id: 8
        name: climate_control
        label: Climate Control Usage
        hint: Automated thermostat
        type: select_one
        options:
          - Use Regularly
          - Use Occasionally
          - Have But Never Use
          - Do Not Have
        required: false
      - id: 9
        name: security_system
        label: Security System Usage
        hint: Automated security
        type: select_one
        options:
          - Use Regularly
          - Use Occasionally
          - Have But Never Use
          - Do Not Have
        required: false
      - id: 10
        name: satisfaction_ratings
        label: Satisfaction Ratings
        hint: Rate your satisfaction
        type: note
        options: []
        required: false
      - id: 11
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: With automation systems
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 12
        name: ease_of_use
        label: Ease of Use
        hint: How easy to operate
        type: select_one
        options:
          - Very Easy
          - Easy
          - Neutral
          - Difficult
          - Very Difficult
        required: true
      - id: 13
        name: reliability
