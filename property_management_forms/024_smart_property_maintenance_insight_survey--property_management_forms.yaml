inputSchema:
  type: object
  properties:
    title: Smart Property Maintenance Insight Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: maintenance_concerns
      label: Maintenance Concerns
      hint: null
      type: select_multiple
      options:
      - Leaks and Water Issues
      - Pests
      - Other
      required: true
    - id: 3
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Neutral
      - Very Satisfied
      required: true
    - id: 4
      name: communication_preferences
      label: Communication Preferences
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Chat
      required: true
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
