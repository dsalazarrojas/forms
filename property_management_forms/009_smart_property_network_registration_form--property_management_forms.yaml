      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: listing_price
      label: Listing Price
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 13
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
