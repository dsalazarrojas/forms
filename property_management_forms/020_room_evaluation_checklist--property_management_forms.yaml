inputSchema:
  type: object
  properties:
    title: Room Evaluation Checklist
    pages:
    - id: 1
      name: room_id
      label: room_id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: room_name
      label: room name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: condition
      label: condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Bad
      required: false
    - id: 4
      name: comment
      label: comment
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: date_visited
      label: date visited
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: maintenance_items
      label: maintenance items
      hint: null
      type: select_multiple
      options:
      - Air conditioning
      - Bathroom fixtures
      - Electrical
      - Flooring
      - Painting
      - Plumbing
      - Roofing
      required: false
    - id: 7
      name: date_completed
      label: date completed
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: evaluated_by
      label: evaluated by
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: evaluated_at
      label: evaluated at
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: follow_up
      label: follow up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: follow_up_reason
      label: follow up reason
      hint: null
      type: text
      options: []
      required: false
