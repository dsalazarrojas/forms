inputSchema:
  type: object
  properties:
    title: Commercial Property Conversion Application Form
    pages:
    - id: 1
      name: section_applicant_details
      label: -- Property Owner/Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Primary Applicant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: business_name
      label: Business Name (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: applicant_contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: applicant_contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_property_info
      label: -- Current Property Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: property_address_to_convert
      label: Property Address for Conversion
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: current_zoning_classification
      label: Current Zoning Classification
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: current_primary_use
      label: Current Primary Use of Property
      hint: e.g., Warehouse, Retail, Office
      type: text
      options: []
      required: true
    - id: 10
      name: section_proposed_conversion
      label: -- Proposed Conversion Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: proposed_new_use
      label: Proposed New Primary Use
      hint: e.g., Mixed-Use, Residential Lofts, Hospitality
      type: text
      options: []
      required: true
    - id: 12
      name: square_footage_impacted
      label: Total Square Footage to be Converted
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: structural_changes_required
      label: Will structural changes be required?
      hint: null
      type: select_one
      options:
      - Yes - Minor
      - Yes - Major Structural
      - No - Interior Finish Only
      required: true
    - id: 14
      name: estimated_project_cost
      label: Estimated Conversion Project Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: section_project_timeline
      label: -- Project Timeline --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: projected_start_date
      label: Projected Construction Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: estimated_completion_date
      label: Estimated Project Completion Date
      hint: null
      type: date
      options: []
      required: true
    - id: 18
      name: applicant_declaration
      label: I certify that the information provided is accurate and I am authorized
        to submit this request
      hint: null
      type: select_one
      options:
      - I Certify
      - Other
      required: true
