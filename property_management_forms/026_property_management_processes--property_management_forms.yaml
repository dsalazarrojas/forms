inputSchema:
  type: object
  properties:
    title: Property Management Processes
    pages:
    - id: 1
      name: property_management_address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: property_management_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: property_management_type
      label: Type
      hint: null
      type: select_one
      options:
      - Residential
      - Commercial
      - Industrial
      required: true
    - id: 4
      name: property_management_date_created
      label: Date Created
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: property_management_status
      label: Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: true
