inputSchema:
  type: object
  properties:
    title: Business Registration Form
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Registered business name
      type: text
      options: []
      required: true
    - id: 2
      name: business_type
      label: Type of Business
      hint: Select your business structure
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - Corporation
      - Non-profit
      - Cooperative
      required: true
    - id: 3
      name: industry_sector
      label: Industry Sector
      hint: What industry does your business operate in?
      type: select_one
      options:
      - Retail
      - Services
      - Manufacturing
      - Technology
      - Healthcare
      - Education
      - Finance
      - Real Estate
      - Construction
      - Hospitality
      required: true
    - id: 4
      name: registration_date
      label: Business Registration Date
      hint: Date business will be or was registered
      type: date
      options: []
      required: true
    - id: 5
      name: owner_first_name
      label: Owner First Name
      hint: Primary owner or representative
      type: text
      options: []
      required: true
    - id: 6
      name: owner_last_name
      label: Owner Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: owner_email
      label: Owner Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 8
      name: owner_phone
      label: Owner Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 9
      name: street_address
      label: Business Street Address
      hint: Physical location
      type: text
      options: []
      required: true
    - id: 10
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: state_province
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: postal_code
      label: Postal Code
      hint: ZIP or postal code
      type: text
      options: []
      required: true
    - id: 13
      name: country
      label: Country
      hint: Country of registration
      type: text
      options: []
      required: true
    - id: 14
      name: business_description
      label: Business Description
      hint: Brief overview of what your business does
      type: text
      options: []
      required: true
    - id: 15
      name: number_of_employees
      label: Number of Employees
      hint: Current or projected employee count
      type: number
      options: []
      required: true
    - id: 16
      name: estimated_annual_revenue
      label: Estimated Annual Revenue
      hint: In USD or local currency
      type: select_one
      options:
      - Less than $10000
      - $10000 - $50000
      - $50000 - $100000
      - $100000 - $500000
      - $500000 - $1 million
      - $1 - $5 million
      - Over $5 million
      required: true
    - id: 17
      name: tax_identification_number
      label: Tax ID or EIN
      hint: Federal or local tax identification number
      type: text
      options: []
      required: false
    - id: 18
      name: previous_business_experience
      label: Do you have previous business experience?
      hint: null
      type: select_one
      options:
      - Yes, extensive
      - Yes, some
      - No, first business
      required: true
    - id: 19
      name: business_license_status
      label: Business License Status
      hint: null
      type: select_one
      options:
      - Already obtained
      - In process
      - Need assistance
      - Not required
      required: true
    - id: 20
      name: additional_information
      label: Additional Information
      hint: Any other details we should know
      type: text
      options: []
      required: false
