inputSchema:
  type: object
  properties:
    title: User Story Item Entry Form
    pages:
    - id: 1
      name: user_story
      label: User Story
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: points
      label: Points
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Low
      - Medium
      required: false
    - id: 5
      name: tags
      label: Tags
      hint: null
      type: select_multiple
      options:
      - tag1
      - tag2
      - tag3
      required: false
    - id: 6
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: false
