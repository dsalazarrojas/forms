inputSchema:
  type: object
  properties:
    title: Business Partner Application Form
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Legal business name
      type: text
      options: []
      required: true
    - id: 2
      name: business_structure
      label: Business Structure
      hint: Type of business entity
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - Corporation
      - Franchise
      - Non-profit
      - Other
      required: true
    - id: 3
      name: company_registration_number
      label: Company Registration Number
      hint: License or registration ID
      type: text
      options: []
      required: false
    - id: 4
      name: years_in_business
      label: Years in Business
      hint: How long has your company operated?
      type: number
      options: []
      required: true
    - id: 5
      name: primary_contact_name
      label: Primary Contact Name
      hint: Contact person's full name
      type: text
      options: []
      required: true
    - id: 6
      name: primary_contact_title
      label: Contact Title
      hint: Position or role
      type: text
      options: []
      required: false
    - id: 7
      name: primary_contact_email
      label: Email Address
      hint: Primary business email
      type: email
      options: []
      required: true
    - id: 8
      name: primary_contact_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 9
      name: business_address
      label: Business Address
      hint: Physical location
      type: text
      options: []
      required: true
    - id: 10
      name: business_website
      label: Company Website
      hint: URL of your website
      type: text
      options: []
      required: false
    - id: 11
      name: industry_sector
      label: Industry Sector
      hint: Primary industry focus
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Retail
      - Manufacturing
      - Services
      - Other
      required: true
    - id: 12
      name: business_description
      label: Business Description
      hint: What does your company do?
      type: text
      options: []
      required: true
    - id: 13
      name: partnership_type
      label: Type of Partnership Sought
      hint: What partnership interests you?
      type: select_one
      options:
      - Supplier
      - Distributor
      - Reseller
      - Strategic Alliance
      - Franchise Partner
      - Joint Venture
      - Other
      required: true
    - id: 14
      name: target_market
      label: Target Market
      hint: Geographic or demographic focus
      type: text
      options: []
      required: false
    - id: 15
      name: competitive_advantage
      label: Competitive Advantage
      hint: What makes you unique?
      type: text
      options: []
      required: true
    - id: 16
      name: annual_revenue
      label: Annual Revenue
      hint: Approximate yearly revenue
      type: select_one
      options:
      - Under $100,000
      - $100,000 - $500,000
      - $500,000 - $1,000,000
      - $1,000,000 - $5,000,000
      - Over $5,000,000
      required: false
    - id: 17
      name: number_of_employees
      label: Number of Employees
      hint: Current workforce size
      type: number
      options: []
      required: false
    - id: 18
      name: financial_standing
      label: Financial Standing
      hint: How stable is your business?
      type: select_one
      options:
      - Very Strong
      - Strong
      - Stable
      - Growing
      - Developing
      required: false
    - id: 19
      name: references
      label: Business References
      hint: 2-3 professional references
      type: text
      options: []
      required: true
    - id: 20
      name: agreement_terms
      label: Partnership Agreement Terms
      hint: Key terms important to you?
      type: text
      options: []
      required: false
    - id: 21
      name: additional_information
      label: Additional Information
      hint: Anything else relevant?
      type: text
      options: []
      required: false
