inputSchema:
  type: object
  properties:
    title: Marketplace Seller Onboarding Registration
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: store_name
      label: Store Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: product_category
      label: Product Category
      hint: null
      type: select_one
      options:
      - Electronics
      - Fashion
      - Home and Garden
      - Sports and Fitness
      required: true
    - id: 6
      name: consent
      label: Consent
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: agreement
      label: Agreement
      hint: null
      type: select_multiple
      options:
      - I accept the marketplace terms of service
      - I have read and understand the marketplace policies
      required: true
    - id: 8
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time_of_birth
      label: Time Of Birth
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
