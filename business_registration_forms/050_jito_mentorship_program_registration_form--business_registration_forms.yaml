      name: program_type
      label: Select Program Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: program_name
      label: Enter Program Name
      hint: null
      type: text
      options: []
      required: false
