inputSchema:
  type: object
  properties:
    title: Affiliate Registration Form
    pages:
    - id: 1
      name: personal_details_header
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: This will be your account login.
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: address
      label: Address
      hint: Street, City, State, Zip.
      type: text
      options: []
      required: true
    - id: 6
      name: website_details_header
      label: -- Website / Promotion --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: website_url
      label: Website URL
      hint: Where will you promote our products?
      type: text
      options: []
      required: true
    - id: 8
      name: social_profiles
      label: Social Media Links
      hint: Instagram, TikTok, YouTube, etc.
      type: text
      options: []
      required: false
    - id: 9
      name: promotion_method
      label: How will you promote us?
      hint: Briefly describe your strategy.
      type: text
      options: []
      required: true
    - id: 10
      name: audience_size
      label: Estimated Audience Size
      hint: Monthly visitors or followers.
      type: select_one
      options:
      - < 1,000
      - 1,000 - 10,000
      - 10,000 - 100,000
      - 100,000+
      required: true
    - id: 11
      name: payment_info_header
      label: -- Payout Setup --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: paypal_email
      label: PayPal Email
      hint: For receiving commissions.
      type: email
      options: []
      required: true
    - id: 13
      name: tax_id
      label: Tax ID / SSN
      hint: Required for tax reporting (US Only).
      type: text
      options: []
      required: false
    - id: 14
      name: terms
      label: Terms and Conditions
      hint: I agree to the Affiliate Program Agreement.
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 15
      name: signature
      label: Signature
      hint: null
      type: select_one
      options:
      - Signed
      - Other
      required: true
