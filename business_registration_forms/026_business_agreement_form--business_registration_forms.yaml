      name: agreement_value
      label: Agreement Value
      hint: Total value of agreement
      type: number
      options: []
      required: false
    - id: 19
      name: start_date
      label: Start Date
      hint: When does agreement begin
      type: date
      options: []
      required: true
    - id: 20
      name: end_date
      label: End Date
      hint: When does agreement end
      type: date
      options: []
      required: false
    - id: 21
      name: renewal_terms
      label: Renewal Terms
      hint: How can agreement be renewed
      type: text
      options: []
      required: false
    - id: 22
      name: termination_clause
      label: Termination Clause
