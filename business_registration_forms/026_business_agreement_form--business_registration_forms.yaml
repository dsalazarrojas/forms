    - id: 26
      name: party_a_signature
      label: Party A Signature
      hint: Name of authorized signatory for Party A
      type: text
      options: []
      required: true
    - id: 27
      name: party_a_signature_date
      label: Party A Signature Date
      hint: Date signed by Party A
      type: date
      options: []
      required: true
    - id: 28
      name: party_b_signature
      label: Party B Signature
      hint: Name of authorized signatory for Party B
      type: text
      options: []
      required: true
    - id: 29
      name: party_b_signature_date
      label: Party B Signature Date
      hint: Date signed by Party B
      type: date
      options: []
      required: true
