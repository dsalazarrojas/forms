inputSchema:
  type: object
  properties:
    title: Business Agreement Form
    pages:
    - id: 1
      name: party_a_info
      label: Party A Information
      hint: First party details
      type: note
      options: []
      required: false
    - id: 2
      name: party_a_name
      label: Party A Name
      hint: Legal name of first party
      type: text
      options: []
      required: true
    - id: 3
      name: party_a_type
      label: Party A Type
      hint: Type of entity
      type: select_one
      options:
      - Individual
      - Corporation
      - LLC
      - Partnership
      - Sole Proprietorship
      - Other
      required: true
    - id: 4
      name: party_a_email
      label: Party A Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: party_a_phone
      label: Party A Phone
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 6
      name: party_a_address
      label: Party A Address
      hint: Mailing address
      type: text
      options: []
      required: true
    - id: 7
      name: party_b_info
      label: Party B Information
      hint: Second party details
      type: note
      options: []
      required: false
    - id: 8
      name: party_b_name
      label: Party B Name
      hint: Legal name of second party
      type: text
      options: []
      required: true
    - id: 9
      name: party_b_type
      label: Party B Type
      hint: Type of entity
      type: select_one
      options:
      - Individual
      - Corporation
      - LLC
      - Partnership
      - Sole Proprietorship
      - Other
      required: true
    - id: 10
      name: party_b_email
      label: Party B Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 11
      name: party_b_phone
      label: Party B Phone
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 12
      name: party_b_address
      label: Party B Address
      hint: Mailing address
      type: text
      options: []
      required: true
    - id: 13
      name: agreement_details
      label: Agreement Details
      hint: Terms of agreement
      type: note
      options: []
      required: false
    - id: 14
      name: agreement_type
      label: Agreement Type
      hint: Type of business agreement
      type: select_one
      options:
      - Service Agreement
      - Partnership Agreement
      - Vendor Agreement
      - Client Agreement
      - Licensing Agreement
      - Non-Disclosure Agreement
      - Employment Agreement
      - Other
      required: true
