    - id: 10
      name: terms_and_conditions
      label: Accept Terms and Conditions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: Additional notes
      type: note
      options: []
      required: false
