inputSchema:
  type: object
  properties:
    title: Business Customer Registration Form
    pages:
    - id: 1
      name: customer_information
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Primary email address
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 6
      name: business_information
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: company_name
      label: Company Name
      hint: Your business name
      type: text
      options: []
      required: true
    - id: 8
      name: business_type
      label: Type of Business
      hint: What type of business?
      type: select_one
      options:
      - Sole Proprietor
      - Partnership
      - Corporation
      - LLC
      - Non-Profit
      - Other
      required: true
    - id: 9
      name: industry
      label: Industry
      hint: Your industry sector
      type: text
      options: []
      required: true
    - id: 10
      name: years_established
      label: Years in Business
      hint: How long established?
      type: number
      options: []
      required: false
    - id: 11
      name: employee_count
      label: Number of Employees
      hint: How many employees?
      type: select_one
      options:
      - 1 person
      - 2 - 5
      - 6 - 10
      - 11 - 25
      - 26 - 50
      - 50+
      required: false
    - id: 12
      name: contact_information
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: business_address
      label: Business Address
      hint: Physical business location
      type: text
      options: []
      required: true
    - id: 14
      name: city
      label: City
      hint: City name
      type: text
      options: []
      required: true
    - id: 15
      name: state_province
      label: State or Province
      hint: State or province
      type: text
      options: []
      required: true
    - id: 16
      name: zip_postal
      label: Zip or Postal Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 17
      name: country
      label: Country
      hint: Country of business
      type: text
      options: []
      required: true
    - id: 18
      name: business_phone
      label: Business Phone
      hint: Business phone number
      type: text
      options: []
      required: true
    - id: 19
      name: website
      label: Website
      hint: Your company website
      type: text
      options: []
      required: false
    - id: 20
      name: account_preferences
      label: -- Account Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: account_type
      label: Account Type
      hint: What type of account?
      type: select_one
      options:
      - Basic
      - Professional
      - Enterprise
      - Custom
      required: true
    - id: 22
      name: services_interested
      label: Services of Interest
      hint: What services interest you?
      type: select_multiple
      options:
      - Consulting
      - Support Services
      - Training
      - Software Solutions
      - Custom Solutions
      required: false
    - id: 23
      name: communication_preference
      label: Preferred Communication Method
      hint: How should we contact you?
      type: select_one
      options:
      - Email
      - Phone
      - Text Message
      - All Methods
      required: true
