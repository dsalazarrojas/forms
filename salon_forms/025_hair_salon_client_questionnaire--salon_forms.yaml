inputSchema:
  type: object
  properties:
    title: Hair Salon Client Questionnaire
    pages:
    - id: 1
      name: client_information
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_of_visit
      label: Time of Visit
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: service
      label: Service
      hint: null
      type: select_one
      options:
      - Service
      - Haircut
      - Shampoo
      - Color
      - Chemical Process
      - Chemical Peel
      - Chemical Treatments
      - Massage
      - Nail Treatment
      - Eyelash Extensions
      - Threading
      - Waxing
      - Facelift
      - Microblading
      - Hair Replacement
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 11
      name: follow_up
      label: Follow Up
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
