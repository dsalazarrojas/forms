inputSchema:
  type: object
  properties:
    title: Salon Chemical Release Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please answer all questions honestly.
      type: text
      options: []
      required: false
    - id: 2
      name: salon_information
      label: Salon Information
      hint: Please provide your salon information.
      type: text
      options: []
      required: true
    - id: 3
      name: name
      label: Name
      hint: Please provide your name.
      type: text
      options: []
      required: true
    - id: 4
      name: role
      label: Role in the Salon
      hint: Please select your role in the salon.
      type: select_one
      options:
      - Owner/Manager
      - Staff Member
      - Client
      required: true
    - id: 5
      name: chemical_information
      label: Chemical Information
      hint: Please provide chemical information.
      type: text
      options: []
      required: true
    - id: 6
      name: chemical_name
      label: Chemical Name
      hint: Please provide the name of the chemical being used.
      type: text
      options: []
      required: true
    - id: 7
      name: concentration
      label: Concentration
      hint: Please provide the concentration of the chemical being used.
      type: number
      options: []
      required: true
    - id: 8
      name: date_of_release
      label: Date of Release
      hint: Please provide the date of the chemical release.
      type: date
      options: []
      required: true
    - id: 9
      name: exposure_duration
      label: Exposure Duration
      hint: Please provide how long you have been exposed to the chemical.
      type: number
      options: []
      required: true
    - id: 10
      name: previous_incidents
      label: Previous Chemical Exposure Incidents
      hint: Have you had any previous chemical exposure incidents?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 11
      name: occupation
      label: Occupation
      hint: Please provide your occupation.
      type: text
      options: []
      required: true
    - id: 12
      name: contact_information
      label: Contact Information
      hint: Please provide your contact information.
      type: text
      options: []
      required: true
    - id: 13
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: Please list any medical conditions or allergies that may be affected by
        chemical exposure.
      type: text
      options: []
      required: false
    - id: 14
      name: emergency_contact
      label: Emergency Contact Information
      hint: Please provide the emergency contact person's information.
      type: text
      options: []
      required: true
    - id: 15
      name: last_release_date
      label: Last Chemical Release Date
      hint: Please provide the date of your last chemical release.
      type: date
      options: []
      required: true
    - id: 16
      name: release_frequency
      label: Chemical Release Frequency
      hint: Please provide the chemical release frequency.
      type: number
      options: []
      required: true
    - id: 17
      name: safety_procedures
      label: Chemical Safety Procedures
      hint: Have you received training on chemical safety procedures?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 18
      name: spill_response
      label: Chemical Spill Response Plan
      hint: Is there a chemical spill response plan?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 19
      name: spill_response_location
      label: Chemical Spill Response Plan Location
      hint: Please provide the location of the chemical spill response plan.
      type: text
      options: []
      required: false
    - id: 20
      name: safety_officer
      label: Chemical Safety Officer
      hint: Please provide the chemical safety officer's information.
      type: text
      options: []
      required: true
    - id: 21
      name: inventory
      label: Chemical Inventory
      hint: Please provide the chemical inventory.
      type: text
      options: []
      required: true
    - id: 22
      name: inventory_storage
      label: Chemical Inventory Storage
      hint: Please describe how you will store the chemical inventory.
      type: text
      options: []
      required: true
    - id: 23
      name: labeling_and_locking
      label: Chemical Labeling and Locking
      hint: Are the chemicals labeled and locked?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 24
      name: access
      label: Chemical Access
      hint: Who has access to the chemicals?
      type: text
      options: []
      required: true
    - id: 25
      name: chemical_usage
      label: Chemical Usage
      hint: Are the chemicals used properly?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
