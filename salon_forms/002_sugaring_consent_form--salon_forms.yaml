      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: consent_type
      label: Consent Type
      hint: null
      type: select_one
      options:
      - General Sugaring Consent
      - Sugaring Consent for Eyelashes
      - Specialized Sugaring Consent
      required: true
    - id: 7
      name: consent_date
      label: Consent Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
