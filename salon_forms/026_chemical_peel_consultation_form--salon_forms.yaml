inputSchema:
  type: object
  properties:
    title: Chemical Peel Consultation Form
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 5
      name: address
      label: Address
      hint: Your full address
      type: text
      options: []
      required: true
    - id: 6
      name: consultation_date
      label: Consultation Date
      hint: Date of this consultation
      type: date
      options: []
      required: true
    - id: 7
      name: skin_type
      label: Skin Type
      hint: What is your skin type
      type: select_one
      options:
      - Normal
      - Dry
      - Oily
      - Combination
      - Sensitive
      required: true
    - id: 8
      name: skin_concerns
      label: Skin Concerns
      hint: What are your main skin concerns
      type: select_multiple
      options:
      - Fine lines and wrinkles
      - Sun damage
      - Age spots
      - Acne scars
      - Uneven skin tone
      - Rough texture
      - Large pores
      - Dullness
      required: true
    - id: 9
      name: treatment_goals
      label: Treatment Goals
      hint: What do you hope to achieve
      type: text
      options: []
      required: true
    - id: 10
      name: previous_treatments
      label: Previous Skin Treatments
      hint: Have you had any skin treatments before
      type: select_multiple
      options:
      - Chemical peels
      - Microdermabrasion
      - Laser treatments
      - Microneedling
      - Facials
      - None
      required: true
    - id: 11
      name: previous_peel_details
      label: Previous Peel Details
      hint: Describe your previous peel experiences
      type: text
      options: []
      required: false
    - id: 12
      name: current_skincare
      label: Current Skincare Routine
      hint: List products you currently use
      type: text
      options: []
      required: true
    - id: 13
      name: retinol_use
      label: Retinol or Retinoid Use
      hint: Do you use retinol products
      type: select_one
      options:
      - Yes, currently
      - Yes, but stopped
      - No, never
      required: true
    - id: 14
      name: accutane_history
      label: Accutane History
      hint: Have you taken Accutane in the past year
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: medical_conditions
      label: Medical Conditions
      hint: List any medical conditions
      type: text
      options: []
      required: true
    - id: 16
      name: allergies
      label: Allergies
      hint: List any allergies
      type: text
      options: []
      required: true
    - id: 17
      name: cold_sores
      label: Cold Sore History
      hint: Do you get cold sores
      type: select_one
      options:
      - Yes, frequently
      - Yes, occasionally
      - No, never
      required: true
    - id: 18
      name: pregnancy_status
      label: Pregnancy or Nursing
      hint: Are you pregnant or nursing
      type: select_one
      options:
      - Yes, pregnant
      - Yes, nursing
      - 'False'
      - Not applicable
      required: true
    - id: 19
      name: sun_exposure
      label: Sun Exposure Habits
      hint: How much sun exposure do you get
      type: select_one
      options:
      - Minimal
      - Moderate
      - High
      - Use tanning bed
      required: true
    - id: 20
      name: sunscreen_use
      label: Sunscreen Use
      hint: How often do you use sunscreen
      type: select_one
      options:
      - Daily
      - Often
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 21
      name: keloid_scarring
      label: Keloid Scarring Tendency
      hint: Do you tend to scar easily
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not sure
      required: true
    - id: 22
      name: recommended_peel
      label: Recommended Peel Type
      hint: Type of peel recommended by esthetician
      type: select_one
      options:
      - Superficial AHA peel
      - Medium TCA peel
      - Deep phenol peel
      - Combination peel
      - Custom blend
      required: true
    - id: 23
      name: number_of_sessions
      label: Recommended Number of Sessions
      hint: How many sessions are recommended
      type: number
      options: []
      required: true
    - id: 24
      name: estimated_cost
      label: Estimated Cost
      hint: Estimated cost per session
      type: number
      options: []
      required: false
    - id: 25
      name: client_questions
      label: Client Questions
      hint: Any questions you have
      type: text
      options: []
      required: false
    - id: 26
      name: esthetician_name
      label: Esthetician Name
      hint: Name of consulting esthetician
      type: text
      options: []
      required: true
    - id: 27
      name: esthetician_notes
      label: Esthetician Notes
      hint: Professional assessment and recommendations
      type: text
      options: []
      required: false
    - id: 28
      name: client_ready
      label: Ready to Proceed
      hint: Are you ready to proceed with treatment
      type: select_one
      options:
      - Yes, schedule appointment
      - Need more time to decide
      - No, not interested
      required: true
