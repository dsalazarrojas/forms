inputSchema:
  type: object
  properties:
    title: COVID 19 Disclaimer
    pages:
    - id: 1
      name: section_header_1
      label: -- COVID-19 Health Disclaimer --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: service_requested
      label: Service Requested
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: section_header_2
      label: -- Health Screening Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: covid_diagnosis
      label: Have you been diagnosed with COVID-19 in the past 10 days?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 9
      name: covid_symptoms
      label: Do you currently have COVID-19 symptoms?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: symptoms_list
      label: If yes, describe symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: fever
      label: Do you have a fever?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: cough
      label: Do you have a cough?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: difficulty_breathing
      label: Difficulty breathing?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: loss_taste_smell
      label: Loss of taste or smell?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: sore_throat
      label: Sore throat?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 16
      name: recent_exposure
      label: Close contact with confirmed COVID-19 case in past 14 days?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 17
      name: household_exposure
      label: Anyone in your household has COVID-19 symptoms?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: section_header_3
      label: -- Vaccination Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated with booster
      - Fully vaccinated without booster
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to disclose
      required: true
    - id: 20
      name: section_header_4
      label: -- Acknowledgment and Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: health_information_truthful
      label: The health information above is truthful and accurate
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: risk_understood
      label: I understand the risks of COVID-19 transmission
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: safety_measures_acknowledged
      label: I acknowledge the salon safety measures in place
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: liability_waiver
      label: I release the salon from liability for COVID-19 exposure
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: signature_acknowledgment
      label: I agree to this disclaimer and release of liability
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
