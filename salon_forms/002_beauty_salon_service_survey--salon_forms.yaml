inputSchema:
  type: object
  properties:
    title: Beauty Salon Service Survey
    pages:
      - id: 1
        name: visit_date
        label: Date of Your Visit
        hint: null
        type: date
        options: []
        required: true
      - id: 2
        name: service_type
        label: What Service Did You Receive
        hint: Select the primary service
        type: select_one
        options:
          - Hair Cut
          - Hair Coloring
          - Hair Treatment
          - Styling
          - Manicure
          - Pedicure
          - Facial
          - Massage
          - Other
        required: true
      - id: 3
        name: stylist_name
        label: Stylist Name
        hint: null
        type: text
        options: []
        required: false
      - id: 4
        name: overall_satisfaction
        label: Overall Satisfaction with Service
        hint: Rate your experience
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 5
        name: stylist_professionalism
        label: How Professional Was Your Stylist
        hint: null
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 6
        name: cleanliness_rating
        label: Salon Cleanliness Rating
        hint: How clean was the salon?
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 7
        name: ambiance_comfort
        label: Salon Ambiance and Comfort
        hint: Rate the atmosphere and comfort level
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 8
        name: product_quality
        label: Quality of Products Used
        hint: Were the products high quality?
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: false
      - id: 9
        name: value_for_money
        label: Value for Money
        hint: Was the price fair for the service?
        type: select_one
        options:
          - Excellent Value
          - Good Value
          - Fair
          - Poor Value
          - Very Poor Value
        required: true
      - id: 10
        name: wait_time
        label: How Long Did You Wait
        hint: null
        type: select_one
        options:
          - Less than 10 minutes
          - 10-20 minutes
          - 20-30 minutes
          - 30-45 minutes
          - More than 45 minutes
        required: false
      - id: 11
        name: communication_stylist
        label: Stylist Communication About Your Needs
        hint: Did they listen and understand what you wanted?
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 12
        name: result_expectations
        label: Results Met Your Expectations
        hint: null
        type: select_one
        options:
          - Far Exceeded
          - Exceeded
          - Met
          - Below
          - Far Below
        required: true
      - id: 13
        name: recommend_to_others
        label: Would You Recommend This Salon to Others
        hint: null
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Unsure
          - Probably No
          - Definitely No
        required: true
      - id: 14
        name: additional_comments
        label: Additional Comments or Suggestions
        hint: Tell us what we can improve
        type: text
        options: []
        required: false
      - id: 15
        name: contact_response
        label: May We Contact You About Your Feedback
        hint: null
        type: select_one
        options:
          - Yes
          - No
        required: false
