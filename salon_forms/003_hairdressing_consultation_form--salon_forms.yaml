inputSchema:
  type: object
  properties:
    title: Hairdressing Consultation Form
    pages:
    - id: 1
      name: personal_information
      label: Personal Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: service_type
      label: Type of Service
      hint: null
      type: select_multiple
      options:
      - Haircut
      - Color
      - Style
      - Chemical
      required: true
    - id: 4
      name: service_duration
      label: Service Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: client_preferences
      label: Client Preferences
      hint: null
      type: select_multiple
      options:
      - Wash
      - Cut
      - Dry
      - Style
      required: true
    - id: 7
      name: hair_condition
      label: Hair Condition
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: hair_history
      label: Hair History
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
