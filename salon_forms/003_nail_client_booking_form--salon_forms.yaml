inputSchema:
  type: object
  properties:
    title: Nail Client Booking Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Finger Nail
      - Toe Nail
      - Full Nail
      - Manicure
      required: true
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: service_duration
      label: Service Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
    - id: 11
      name: form_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
