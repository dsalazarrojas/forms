      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: fax
      label: Fax
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
