inputSchema:
  type: object
  properties:
    title: Lash Extension Intake Form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: lash_technician
      label: Lash Technician
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: lash_service
      label: Lash Service
      hint: null
      type: select_one
      options:
      - Lash Lift
      - Lash Half-Set
      - Full Lash Application
      required: false
    - id: 5
      name: lash_application_type
      label: Lash Application Type
      hint: null
      type: select_one
      options:
      - Hybrid
      - Volume
      - Mega Volume
      - Natural
      required: true
    - id: 6
      name: lash_materials
      label: Lash Materials
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: contact_address
      label: Contact Address
      hint: null
      type: text
      options: []
      required: false
