inputSchema:
  type: object
  properties:
    title: Skin Analysis Questionnaire
    pages:
    - id: 1
      name: skin_type
      label: Skin Type
      hint: null
      type: select_one
      options:
      - Normal
      - Acne-prone
      - Aging-prone
      - Sensitive
      - Dry
      - Oily
      required: false
    - id: 2
      name: skin_sensitivities
      label: Skin Sensitivities
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: skin_habits
      label: Skin Habits
      hint: null
      type: select_one
      options:
      - Morning and Night
      - Only morning
      - Only night
      - Never
      required: false
    - id: 4
      name: skin_products_used
      label: Skin Products Used
      hint: null
      type: select_multiple
      options:
      - Moisturizer
      - Sunscreen
      - Cleanser
      - Mask
      - Exfoliant
      required: false
    - id: 5
      name: treatment_goals
      label: Treatment Goals
      hint: null
      type: select_multiple
      options:
      - Acne treatment
      - Anti-aging
      - Hydration
      - Sun protection
      - Other
      - None
      required: false
