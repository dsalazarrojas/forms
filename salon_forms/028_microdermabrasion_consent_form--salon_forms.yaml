inputSchema:
  type: object
  properties:
    title: Microdermabrasion Consent Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: consent
      label: I understand that the Microdermabrasion treatment will be performed in
        the office of  [salon_name]
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: procedure_description
      label: Procedure Description
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: client_consent
      label: I consent to the procedure
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
