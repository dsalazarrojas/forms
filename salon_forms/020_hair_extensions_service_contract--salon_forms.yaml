inputSchema:
  type: object
  properties:
    title: Hair Extensions Service Contract
    pages:
    - id: 1
      name: service_provider
      label: Service Provider
      hint: null
      type: select_one
      options:
      - Salon
      - Stylist
      - Both
      required: false
    - id: 2
      name: client
      label: Client
      hint: null
      type: select_multiple
      options:
      - Client
      - Client's Representative
      required: false
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: service_details
      label: Service Details
      hint: Enter service details.
      type: text
      options: []
      required: false
    - id: 5
      name: services_rendered
      label: Services Rendered
      hint: Enter services rendered.
      type: text
      options: []
      required: true
    - id: 6
      name: total_hours
      label: Total Hours
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: labor_cost
      label: Labor Cost
      hint: Calculate labor cost.
      type: number
      options: []
      required: true
    - id: 8
      name: equipment_cost
      label: Equipment Cost
      hint: Enter equipment cost.
      type: number
      options: []
      required: true
    - id: 9
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Check
      - Bank Transfer
      - Credit Card
      required: false
    - id: 11
      name: payment_schedule
      label: Payment Schedule
      hint: null
      type: select_one
      options:
      - On Signing of Contract
      - On Completion of Service
      required: false
    - id: 12
      name: service_contract
      label: Service Contract
      hint: Please review and sign this service contract below.
      type: note
      options: []
      required: false
    - id: 13
      name: client_signature
      label: Client Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: provider_signature
      label: Provider Signature
      hint: null
      type: text
      options: []
      required: true
