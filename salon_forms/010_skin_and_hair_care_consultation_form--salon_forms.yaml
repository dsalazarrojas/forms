inputSchema:
  type: object
  properties:
    title: Skin And Hair Care Consultation Form
    pages:
    - id: 1
      name: skin_and_hair_care_form
      label: Skin Type
      hint: null
      type: select_one
      options:
      - Normal
      - Oily
      - Sensitive
      required: true
    - id: 2
      name: skin_condition_form
      label: Skin Condition
      hint: Describe your skin condition
      type: text
      options: []
      required: false
    - id: 3
      name: hair_condition_form
      label: Hair Condition
      hint: null
      type: select_one
      options:
      - Fine
      - Thinning
      - Damaged
      required: false
    - id: 4
      name: treatment_history_form
      label: Treatment History
      hint: Please provide your treatment history
      type: text
      options: []
      required: true
    - id: 5
      name: medical_conditions_form
      label: Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: medications_form
      label: Medications
      hint: null
      type: select_multiple
      options:
      - Acetaminophen
      - Advil
      - Ibuprofen
      required: false
    - id: 7
      name: medical_allergies_form
      label: Medical Allergies
      hint: null
      type: select_multiple
      options:
      - Penicillin
      - Eczema
      - Latex
      required: false
    - id: 8
      name: hair_treatment_form
      label: Hair Treatment
      hint: Please select your current hair treatment
      type: select_multiple
      options:
      - Shampoo
      - Conditioner
      - Serum
      required: true
    - id: 9
      name: skin_care_plan_form
      label: Skin Care Plan
      hint: Describe your skin care plan
      type: text
      options: []
      required: false
    - id: 10
      name: hair_care_plan_form
      label: Hair Care Plan
      hint: Describe your hair care plan
      type: text
      options: []
      required: false
    - id: 11
      name: follow_up_form
      label: Follow Up
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: notes_form
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: skin_care_products_form
      label: Skin Care Products
      hint: null
      type: select_multiple
      options:
      - Moisturizer
      - Exfoliant
      - Cleanser
      required: false
    - id: 14
      name: hair_care_products_form
      label: Hair Care Products
      hint: null
      type: select_multiple
      options:
      - Shampoo
      - Conditioner
      - Serum
      required: false
    - id: 15
      name: skin_care_frequency_form
      label: Skin Care Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 16
      name: hair_care_frequency_form
      label: Hair Care Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 17
      name: follow_up_date_form
      label: Follow Up Date
      hint: null
      type: date
      options: []
      required: true
    - id: 18
      name: follow_up_time_form
      label: Follow Up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 19
      name: follow_up_contact_method_form
      label: Follow Up Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text
      required: true
    - id: 20
      name: client_name_form
      label: Client Name
      hint: Please enter client name
      type: text
      options: []
      required: true
    - id: 21
      name: client_phone_number_form
      label: Client Phone Number
      hint: Please enter client phone number
      type: text
      options: []
      required: true
    - id: 22
      name: client_email_form
      label: Client Email
      hint: Please enter client email
      type: email
      options: []
      required: true
    - id: 23
      name: client_address_form
      label: Client Address
      hint: Please enter client address
      type: text
      options: []
      required: true
    - id: 24
      name: practitioner_name_form
      label: Practitioner Name
      hint: Please enter practitioner name
      type: text
      options: []
      required: true
    - id: 25
      name: practitioner_phone_number_form
      label: Practitioner Phone Number
      hint: Please enter practitioner phone number
      type: text
      options: []
      required: true
