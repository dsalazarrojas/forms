inputSchema:
  type: object
  properties:
    title: Hair Consultation Request Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: consultation_type
      label: Hair Type
      hint: null
      type: select_one
      options:
      - Cut
      - Color
      - Style
      required: false
    - id: 3
      name: hair_length
      label: Hair Length
      hint: null
      type: select_multiple
      options:
      - Short
      - Medium
      - Long
      required: false
    - id: 4
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_visit
      label: Time of Visit
      hint: null
      type: time
      options: []
      required: false
