inputSchema:
  type: object
  properties:
    title: Appointment Form Zy
    pages:
    - id: 1
      name: client_information
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: first_time_client
      label: Are you a first-time client?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not sure
      required: true
    - id: 6
      name: hair_appointment
      label: -- Hair Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Haircut
      - Hair color
      - Highlights
      - Hair treatment
      - Styling
      - Blow dry
      - Other
      required: true
    - id: 8
      name: hair_length
      label: Current Hair Length
      hint: null
      type: select_one
      options:
      - Very short
      - Short
      - Medium
      - Long
      - Very long
      required: false
    - id: 9
      name: hair_type
      label: Hair Type
      hint: null
      type: select_one
      options:
      - Straight
      - Wavy
      - Curly
      - Coily
      - Mixed texture
      required: false
    - id: 10
      name: hair_color_current
      label: Current Hair Color
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: desired_look
      label: Desired look or style
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: preferred_stylist
      label: Preferred Stylist (if any)
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: scheduling
      label: -- Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: preferred_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: preferred_time
      label: Preferred Time
      hint: null
      type: select_one
      options:
      - Morning - 9 AM to 12 PM
      - Afternoon - 12 PM to 3 PM
      - Late afternoon - 3 PM to 6 PM
      - Evening - 6 PM to 8 PM
      required: true
    - id: 16
      name: appointment_duration
      label: Estimated Service Duration
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      - 3+ hours
      required: false
    - id: 17
      name: special_requests
      label: -- Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: product_preferences
      label: Any product preferences or allergies?
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: additional_notes
      label: Additional notes or concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: contact_preference
      label: How should we contact you about your appointment?
      hint: null
      type: select_one
      options:
      - Phone call
      - Text message
      - Email
      - No preference
      required: false
