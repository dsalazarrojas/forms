inputSchema:
  type: object
  properties:
    title: Advanced Facial Treatments And Chemical Peels Client Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Client Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client full name
      hint: Legal name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Contact phone
      hint: For appointment confirmation
      type: text
      options: []
      required: true
    - id: 4
      name: treatment_selected
      label: Treatment selected
      hint: Specify treatment or peel type
      type: text
      options: []
      required: true
    - id: 5
      name: allergies
      label: Allergies and skin sensitivities
      hint: Include known reactions
      type: text
      options: []
      required: true
    - id: 6
      name: medications
      label: Current medications
      hint: Include topical or oral medications
      type: text
      options: []
      required: false
    - id: 7
      name: contraindications_reviewed
      label: Contraindications reviewed
      hint: Client confirmed review of contraindications
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 8
      name: expected_results_explained
      label: Expected results and risks explained
      hint: Client acknowledged understanding
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 9
      name: aftercare_instructions
      label: Aftercare instructions acknowledged
      hint: Client agrees to follow post treatment care
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: consent_signature
      label: Client signature name
      hint: Type full name as electronic signature
      type: text
      options: []
      required: true
    - id: 11
      name: consent_date
      label: Date of consent
      hint: Date of signing
      type: date
      options: []
      required: true
