inputSchema:
  type: object
  properties:
    title: Microneedling Consultation Form
    pages:
    - id: 1
      name: client_info
      label: Client Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: skin_type
      label: Skin Type
      hint: What is your skin type?
      type: select_one
      options:
      - Normal Skin
      - Dry Skin
      - Oily Skin
      - Combination Skin
      - Sensitive Skin
      - Acne Prone Skin
      required: true
    - id: 3
      name: skin_condition
      label: Skin Condition
      hint: Describe your current skin condition (e.g., rosacea, eczema, etc.)
      type: text
      options: []
      required: true
    - id: 4
      name: medical_history
      label: Medical History
      hint: Please list any medical conditions that may impact treatment, such as
        allergies or sensitivities
      type: text
      options: []
      required: true
    - id: 5
      name: treatment_goals
      label: Treatment Goals
      hint: What are your goals for microneedling treatment?
      type: text
      options: []
      required: true
    - id: 6
      name: contraindications
      label: Contraindications
      hint: Are you taking any medications that may impact treatment?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: num_microneedling_sessions
      label: Num Microneedling Sessions
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - More
      - Not Sure
      required: true
