inputSchema:
  type: object
  properties:
    title: Wax Room Check In Form Template
    pages:
    - id: 1
      name: date
      label: Client's Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: equipment_condition
      label: Equipment Condition
      hint: null
      type: select_multiple
      options:
      - Clean
      - Dirty
      - In need of repair
      - Missing
      - Unknown
      required: true
    - id: 4
      name: chemicals_condition
      label: Chemicals Condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Poor
      - Unknown
      required: true
    - id: 5
      name: wax_condition
      label: Wax Condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Poor
      - Unknown
      required: true
    - id: 6
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: technician_signature
      label: Technician's Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: yes_no_equipment_condition
      label: Equipment Condition (Yes/No)
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: chemicals_condition_2
      label: Chemicals Condition 2
      hint: null
      type: select_multiple
      options:
      - Good
      - Poor
      - Unknown
      required: true
    - id: 10
      name: technician_name
      label: Technician's Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: additional_notes
      label: Additional Notes (2)
      hint: null
      type: note
      options: []
      required: true
    - id: 12
      name: yes_no_equipment_condition_2
      label: Yes No Equipment Condition 2
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: chemicals_condition_2_2
      label: Chemicals Condition 2 2
      hint: null
      type: select_multiple
      options:
      - Good
      - Poor
      - Unknown
      required: true
    - id: 14
      name: notes_2
      label: Notes
      hint: null
      type: note
      options: []
      required: true
