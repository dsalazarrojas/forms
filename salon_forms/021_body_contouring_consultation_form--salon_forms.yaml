inputSchema:
  type: object
  properties:
    title: Body Contouring Consultation Form
    pages:
    - id: 1
      name: consultation_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: consultation_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: consultation_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: consultation_date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: consultation_address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: referred_by
      label: How did you hear about us
      hint: null
      type: select_one
      options:
      - Friend or Family
      - Online Search
      - Social Media
      - Advertisement
      - Previous Patient
      - Medical Professional
      - Other
      required: false
    - id: 7
      name: primary_concern
      label: Primary Body Contouring Concern
      hint: What brings you in today
      type: text
      options: []
      required: true
    - id: 8
      name: problem_areas
      label: Problem Areas
      hint: Select all that apply
      type: select_multiple
      options:
      - Face
      - Chin
      - Neck
      - Chest
      - Arms
      - Abdomen
      - Flanks
      - Waist
      - Hips
      - Buttocks
      - Thighs
      - Calves
      - Legs
      - Back
      - Multiple Areas
      required: true
    - id: 9
      name: symptom_duration
      label: How long has this been a concern
      hint: null
      type: select_one
      options:
      - Less than 6 months
      - 6 months - 1 year
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: true
    - id: 10
      name: previous_treatments
      label: Previous Body Contouring Treatments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: treatment_satisfaction
      label: Satisfaction with Previous Treatments
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      - Not Applicable
      required: false
    - id: 12
      name: procedure_interest
      label: Interested In Which Procedures
      hint: Select all that interest you
      type: select_multiple
      options:
      - Non-Surgical Sculpting
      - Laser Body Contouring
      - Radiofrequency
      - Ultrasound Therapy
      - Cryotherapy
      - Chemical Peels
      - Surgical Contouring
      - Combination Approach
      - Unsure
      required: true
    - id: 13
      name: realistic_expectations
      label: Do you have realistic expectations
      hint: About what procedures can achieve
      type: select_one
      options:
      - 'True'
      - Mostly
      - Somewhat
      - 'False'
      - Unsure
      required: true
    - id: 14
      name: ideal_outcome
      label: What is your ideal outcome
      hint: Describe your goals
      type: text
      options: []
      required: true
    - id: 15
      name: timeline
      label: Desired Timeline for Results
      hint: null
      type: select_one
      options:
      - Immediate
      - 1-4 Weeks
      - 1-3 Months
      - 3-6 Months
      - 6-12 Months
      - Flexible - No Timeline
      required: true
    - id: 16
      name: downtime_tolerance
      label: How much downtime can you tolerate
      hint: null
      type: select_one
      options:
      - None - Need to return immediately
      - Minimal - Few days
      - Some - Up to 1 week
      - Flexible - Can tolerate 2+ weeks
      required: true
    - id: 17
      name: medical_history
      label: Relevant Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: current_medications
      label: Current Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: smoking_status
      label: Smoking Status
      hint: null
      type: select_one
      options:
      - Non-smoker
      - Former Smoker
      - Current Smoker
      - Occasional Smoker
      required: true
    - id: 21
      name: pregnancy_status
      label: Are you pregnant or nursing
      hint: null
      type: select_one
      options:
      - Yes - Pregnant
      - Yes - Nursing
      - 'False'
      - Unsure
      required: true
    - id: 22
      name: consultation_goal
      label: Goal of This Consultation
      hint: null
      type: select_one
      options:
      - Get Information
      - Explore Options
      - Decide on Procedure
      - Get Treatment Plan
      - All of the Above
      required: true
    - id: 23
      name: questions_or_concerns
      label: Questions or Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: preferred_contact
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text Message
      - In Person
      required: true
