inputSchema:
  type: object
  properties:
    title: Wellness Product Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: product_type
      label: Product Type
      hint: null
      type: select_one
      options:
      - Product A
      - Product B
      - Product C
      required: false
    - id: 5
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: shipping_method
      label: Shipping Method
      hint: null
      type: select_one
      options:
      - Shipping Method 1
      - Shipping Method 2
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Payment Method 1
      - Payment Method 2
      required: false
    - id: 8
      name: customer_notes
      label: Customer Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: order_status
      label: Order Status
      hint: null
      type: select_one
      options:
      - Pending
      - Processing
      - Completed
      required: false
