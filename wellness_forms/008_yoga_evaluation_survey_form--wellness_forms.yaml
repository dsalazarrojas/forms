inputSchema:
  type: object
  properties:
    title: Yoga Evaluation Survey Form
    pages:
    - id: 1
      name: survey_intro
      label: Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rating_scale
      label: How would you rate your overall experience?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: instructor_feedback
      label: How would you rate the instructor?
      hint: null
      type: select_one
      options:
      - excellent
      - average
      - poor
      required: false
    - id: 4
      name: class_satisfaction
      label: How satisfied are you with the class?
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - not satisfied
      - very dissatisfied
      required: false
    - id: 5
      name: class_length
      label: How long would you like the class to be?
      hint: null
      type: select_multiple
      options:
      - too short
      - just right
      - too long
      required: false
    - id: 6
      name: class_difficulty
      label: How would you rate the difficulty level of the class?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: instructor_helpfulness
      label: How helpful was the instructor?
      hint: null
      type: select_one
      options:
      - excellent
      - average
      - poor
      required: false
    - id: 8
      name: class_location
      label: Where would you like to take the class?
      hint: null
      type: select_multiple
      options:
      - online
      - in person
      - other
      required: false
    - id: 9
      name: class_time
      label: What time of day would you like to take the class?
      hint: null
      type: select_multiple
      options:
      - morning
      - afternoon
      - evening
      required: false
    - id: 10
      name: class_frequency
      label: How many classes would you like to take per month?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: instructor_familiarity
      label: How familiar are you with the instructor?
      hint: null
      type: select_one
      options:
      - very familiar
      - somewhat familiar
      - not familiar
      required: false
