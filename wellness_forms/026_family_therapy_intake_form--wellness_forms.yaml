inputSchema:
  type: object
  properties:
    title: Family Therapy Intake Form
    pages:
    - id: 1
      name: family_therapy_intake_form_family_info
      label: Family Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: family_therapy_intake_form_contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: family_therapy_intake_form_relationships
      label: Relationship Status
      hint: null
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - In a Domestic Partnership
      required: true
    - id: 4
      name: family_therapy_intake_form_children
      label: Children
      hint: null
      type: select_multiple
      options:
      - None
      - 1-2
      - 3-4
      - 5 or More
      required: true
    - id: 5
      name: family_therapy_intake_form_therapist_preferences
      label: Therapist Preferences
      hint: null
      type: select_multiple
      options:
      - Male
      - Female
      required: false
    - id: 6
      name: family_therapy_intake_form_therapy_goals
      label: Therapy Goals
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: family_therapy_intake_form_therapy_frequency
      label: Therapy Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      required: false
    - id: 8
      name: family_therapy_intake_form_therapy_duration
      label: Therapy Duration
      hint: null
      type: select_one
      options:
      - 1-2 weeks
      - 2-4 weeks
      - 1-3 months
      required: false
    - id: 9
      name: family_therapy_intake_form_payment
      label: Payment Information
      hint: null
      type: select_one
      options:
      - Insurance
      - Self-Pay
      required: false
    - id: 10
      name: family_therapy_intake_form_additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: family_therapy_intake_form_therapist_availability
      label: Therapist Availability
      hint: null
      type: select_one
      options:
      - Available
      - Not Available
      required: false
