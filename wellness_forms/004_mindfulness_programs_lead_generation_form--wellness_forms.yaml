    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: lead_source
      label: Lead Source
      hint: null
      type: select_one
      options:
      - Website
      - Social Media
      - Event
      - Referral
      - Other
      required: true
