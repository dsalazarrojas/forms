inputSchema:
  type: object
  properties:
    title: Training Survey Template
    pages:
    - id: 1
      name: purpose
      label: What is the purpose of the training session?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: quality_rating
      label: How would you rate the overall quality of the training session?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: topics_covered
      label: Which of the following topics were covered during the training session?
      hint: null
      type: select_multiple
      options:
      - Leadership
      - Management
      - Communication
      - Time Management
      required: false
    - id: 4
      name: training_hours
      label: How many hours did you spend on the training session?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: date
      label: On what date did the training session take place?
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: start_end_time
      label: What time did the training session start and end?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: facilitator_performance
      label: How would you rate the training facilitator's performance?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: comments
      label: Are there any other comments you would like to provide?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: relevance
      label: How would you rate the overall relevance of the training session to your
        job requirements?
      hint: null
      type: select_one
      options:
      - Very relevant
      - Somewhat relevant
      - Not very relevant
      required: false
    - id: 10
      name: effectiveness
      label: How would you rate the overall effectiveness of the training session?
      hint: null
      type: select_one
      options:
      - Highly effective
      - Somewhat effective
      - Not very effective
      required: false
