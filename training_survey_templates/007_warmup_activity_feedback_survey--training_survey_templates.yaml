inputSchema:
  type: object
  properties:
    title: Warmup Activity Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: question_1
      label: How did you feel about the session?
      hint: null
      type: select_one
      options:
      - Very Positive
      - Positive
      - Neutral
      - Negative
      - Very Negative
      - Not Applicable
      required: false
    - id: 3
      name: rating_1
      label: Rate the activity
      hint: null
      type: select_one
      options:
      - Very High
      - High
      - Medium
      - Low
      - Very Low
      required: false
    - id: 4
      name: question_2
      label: What did you find most engaging about the session?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: question_3
      label: Was the activity well-paced?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: question_4
      label: Were any of the following activities engaging?
      hint: null
      type: select_multiple
      options:
      - Icebreaker
      - Warm-up
      - Activity 1
      - Activity 2
      required: false
    - id: 7
      name: question_5
      label: Would you like to see more of this type of activity in the future?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
