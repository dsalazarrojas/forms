inputSchema:
  type: object
  properties:
    title: Simulation-Based Training Survey Form
    pages:
    - id: 1
      name: session_title
      label: session_title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_type
      label: session_type
      hint: null
      type: select_one
      options:
      - Simulation
      - Training
      - Other
      required: false
    - id: 3
      name: session_start_date
      label: session_start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: session_start_time
      label: session_start_time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: session_end_date
      label: session_end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: session_end_time
      label: session_end_time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: session_rating
      label: session_rating
      hint: On a scale of 1-5
      type: number
      options: []
      required: false
    - id: 8
      name: session_satisfaction
      label: session_satisfaction
      hint: How satisfied were you with this simulation?
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 9
      name: session_improvement
      label: session_improvement
      hint: What can we improve for the next simulation session?
      type: text
      options: []
      required: false
