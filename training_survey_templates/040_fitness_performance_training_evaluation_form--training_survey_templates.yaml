inputSchema:
  type: object
  properties:
    title: Fitness Performance Training Evaluation Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: main_page_questions
      label: Questions
      hint: null
      type: select_one
      options:
      - What was your motivation for starting your fitness journey?
      - How many times do you work out per week?
      - How many days do you work out per week?
      - Do you do strength training exercises?
      - Additional Information
      required: false
    - id: 3
      name: main_page_notes
      label: Additional Comments
      hint: Please provide any additional comments or information here.
      type: note
      options: []
      required: false
