inputSchema:
  type: object
  properties:
    title: Diversity And Inclusion Workshop Feedback Form
    pages:
    - id: 1
      name: workshop_details
      label: Workshop Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_attendance
      label: Session Attendance
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: demographics
      label: Demographics
      hint: null
      type: select_one
      options:
      - '{''label'': ''Male''}'
      - '{''label'': ''Female''}'
      - '{''label'': ''Non-Binary''}'
      required: true
    - id: 4
      name: feedback_session
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: rating
      label: Rating (1-5)
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: suggestions
      label: Suggestions
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''I want to improve this course further''}'
      - '{''label'': ''It is perfect the way it is''}'
      - '{''label'': ''Other, please specify''}'
      required: true
    - id: 11
      name: submit_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
