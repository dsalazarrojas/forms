inputSchema:
  type: object
  properties:
    title: Gym Staff Training Effectiveness Survey
    pages:
    - id: 1
      name: staff_training_overall_quality
      label: Overall Quality of Training
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: training_frequency
      label: How often do you attend training sessions?
      hint: null
      type: select_one
      options:
      - Every week
      - Every 2 weeks
      - Every month
      - Rarely
      required: true
    - id: 3
      name: training_topics
      label: What topics do you typically attend training on?
      hint: null
      type: select_multiple
      options:
      - Management
      - Operations
      - Technical
      - Other
      required: true
    - id: 4
      name: training_relevance
      label: How would you rate the relevance of the training to your job?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: skill_application
      label: How often do you apply the skills learned from training in your work?
      hint: null
      type: select_one
      options:
      - Every day
      - Every week
      - Every 2 weeks
      - Rarely
      required: true
    - id: 6
      name: feedback_performance
      label: What feedback do you receive on your performance after training?
      hint: null
      type: select_one
      options:
      - Regularly
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 7
      name: effectiveness_improvement
      label: How would you rate the effectiveness of the training in improving your
        job performance?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: practice_opportunity
      label: How often do you get to practice what you learned from training?
      hint: null
      type: select_one
      options:
      - Every day
      - Every week
      - Every 2 weeks
      - Rarely
      required: true
    - id: 9
      name: value_aspect
      label: What is the most valuable aspect of the training provided?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: materials_use
      label: How often do you get to use the training materials after training?
      hint: null
      type: select_one
      options:
      - Every day
      - Every week
      - Every 2 weeks
      - Rarely
      required: true
    - id: 11
      name: recommendations
      label: What would you recommend to improve the training?
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: worth_time
      label: Do you think the training is worth your time?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
