      name: learning_outcome
      label: What were the main learning outcomes of this workshop?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: workshop_effectiveness
      label: How effective was this workshop?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: participant_insights
      label: What fast feedback will you get from participants after using this form?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: assigned_tool
      label: Which tool was this form assigned with?
      hint: null
      type: select_one
      options:
      - ChatJot
      - FormAssembly
      - Other
      required: false
    - id: 6
      name: created_by
