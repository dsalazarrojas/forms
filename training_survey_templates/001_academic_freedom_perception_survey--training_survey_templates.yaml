inputSchema:
  type: object
  properties:
    title: Academic Freedom Perception Survey
    pages:
    - id: 1
      name: survey_introduction
      label: -- Academic Freedom Perception Survey --
      hint: This survey collects campus feedback on perceptions of academic freedom. All responses are confidential.
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_role
      label: What is your primary role at the university
      hint: Select the option that best describes your current position
      type: select_one
      options:
        - Undergraduate Student
        - Graduate Student
        - Faculty Member
        - Adjunct Instructor
        - Administrative Staff
        - Research Associate
      required: true
    - id: 3
      name: department
      label: Department or College
      hint: Enter the name of your department or college
      type: text
      options: []
      required: true
    - id: 4
      name: years_at_institution
      label: How many years have you been at this institution
      hint: null
      type: select_one
      options:
        - Less than 1 year
        - 1-3 years
        - 4-6 years
        - 7-10 years
        - More than 10 years
      required: true
    - id: 5
      name: freedom_teaching_rating
      label: How would you rate the level of academic freedom in teaching at this institution
      hint: 1 = Very restricted, 5 = Fully free
      type: select_one
      options:
        - 1 - Very restricted
        - 2 - Somewhat restricted
        - 3 - Neutral
        - 4 - Mostly free
        - 5 - Fully free
      required: true
    - id: 6
      name: freedom_research_rating
      label: How would you rate the level of academic freedom in research at this institution
      hint: 1 = Very restricted, 5 = Fully free
      type: select_one
      options:
        - 1 - Very restricted
        - 2 - Somewhat restricted
        - 3 - Neutral
        - 4 - Mostly free
        - 5 - Fully free
      required: true
    - id: 7
      name: freedom_expression_rating
      label: How comfortable do you feel expressing viewpoints that may be unpopular on campus
      hint: null
      type: select_one
      options:
        - Very uncomfortable
        - Somewhat uncomfortable
        - Neutral
        - Somewhat comfortable
        - Very comfortable
      required: true
    - id: 8
      name: self_censorship
      label: Have you ever self-censored your academic work or speech due to concerns about institutional consequences
      hint: null
      type: select_one
      options:
        - Never
        - Rarely
        - Sometimes
        - Often
        - Very often
      required: true
    - id: 9
      name: barriers_to_freedom
      label: What barriers to academic freedom have you experienced or observed (select all that apply)
      hint: null
      type: select_multiple
      options:
        - Administrative pressure
        - Peer pressure
        - Student complaints
        - Funding constraints
        - Political climate
        - Social media backlash
        - None experienced
      required: false
    - id: 10
      name: institutional_policies
      label: How well do institutional policies support academic freedom
      hint: null
      type: select_one
      options:
        - Very poorly
        - Poorly
        - Adequately
        - Well
        - Very well
      required: true
    - id: 11
      name: awareness_of_policies
      label: Are you aware of your institutions written policies on academic freedom
      hint: null
      type: select_one
      options:
        - Yes - I have read them
        - Yes - but I have not read them
        - No - I am not aware of any
      required: true
    - id: 12
      name: improvement_areas
      label: What areas need the most improvement to enhance academic freedom on campus
      hint: Select all that apply
      type: select_multiple
      options:
        - Clearer institutional policies
        - Better grievance procedures
        - Faculty governance participation
        - Training on academic freedom rights
        - Protection from external pressures
        - Open dialogue forums
      required: false
    - id: 13
      name: overall_satisfaction
      label: Overall, how satisfied are you with the state of academic freedom at this institution
      hint: null
      type: select_one
      options:
        - Very dissatisfied
        - Dissatisfied
        - Neutral
        - Satisfied
        - Very satisfied
      required: true
    - id: 14
      name: additional_comments
      label: Please provide any additional comments or suggestions regarding academic freedom on campus
      hint: Your feedback is valuable and will be kept confidential
      type: text
      options: []
      required: false
