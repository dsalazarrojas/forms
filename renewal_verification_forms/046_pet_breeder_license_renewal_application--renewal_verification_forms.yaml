inputSchema:
  type: object
  properties:
    title: Pet Breeder License Renewal Application
    pages:
    - id: 1
      name: breeder_contact_info
      label: Breeder Contact Info
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      required: false
    - id: 2
      name: license_info
      label: License Info
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 3
      name: animal_info
      label: Animal Info
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: compliance_history
      label: Compliance History
      hint: Provide a detailed history of your compliance with our license regulations.
      type: text
      options: []
      required: false
    - id: 5
      name: animal_list
      label: Animals
      hint: List the animals you breed and their relevant health certifications.
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 6
      name: breeder_acceptance
      label: Breeder Acceptance
      hint: null
      type: select_one
      options:
      - I accept the terms and conditions of this application.
      - I do not accept the terms and conditions of this application.
      required: false
