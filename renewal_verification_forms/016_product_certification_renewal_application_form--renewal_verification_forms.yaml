inputSchema:
  type: object
  properties:
    title: Product Certification Renewal Application Form
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: product_category
      label: Product Category
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: product_description
      label: Product Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: certification_level
      label: Certification Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: true
    - id: 6
      name: certification_status
      label: Certification Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: true
    - id: 7
      name: renewal_date
      label: Renewal Date
      hint: null
      type: date
      options: []
      required: true
