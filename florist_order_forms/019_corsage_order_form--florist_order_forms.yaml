inputSchema:
  type: object
  properties:
    title: Corsage Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: corsage_type
      label: Corsage Type
      hint: null
      type: select_one
      options:
      - Casket
      - Bouquet
      - Arrangement
      required: true
    - id: 5
      name: corsage_message
      label: Corsage Message
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - PayPal
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
