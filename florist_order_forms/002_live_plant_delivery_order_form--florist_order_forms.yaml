inputSchema:
  type: object
  properties:
    title: Live Plant Delivery Order Form
    pages:
    - id: 1
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_details
      label: Order Details
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: shipping_options
      label: Shipping Options
      hint: null
      type: select_multiple
      options:
      - Plant 1
      - Plant 2
      - Plant 3
      required: false
    - id: 4
      name: payment_info
      label: Payment Info
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: shipping_method
      label: Shipping Method
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 8
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
