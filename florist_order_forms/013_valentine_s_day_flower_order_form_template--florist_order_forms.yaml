inputSchema:
  type: object
  properties:
    title: Valentine's Day Flower Order Form
    pages:
    - id: 1
      name: recipient_name
      label: Recipient's Name
      hint: Please enter the recipient's name
      type: text
      options: []
      required: true
    - id: 2
      name: order_details
      label: Order Details
      hint: Enter a brief description of the order
      type: text
      options: []
      required: true
    - id: 3
      name: delivery_address
      label: Delivery Address
      hint: Enter the recipient's address for delivery
      type: text
      options: []
      required: true
    - id: 4
      name: payment_method
      label: Payment Method
      hint: Select a payment method
      type: select_one
      options:
      - Visa
      - Mastercard
      - Amex
      - Discover
      required: true
    - id: 5
      name: special_request
      label: Special Request
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_status
      label: Order Status
      hint: Select the order status
      type: select_one
      options:
      - Confirmed
      - Pending
      - Cancelled
      required: true
    - id: 7
      name: delivery_details
      label: Delivery Details
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: delivery_time
      label: Delivery Time
      hint: Enter delivery time
      type: time
      options: []
      required: true
    - id: 9
      name: delivery_date
      label: Delivery Date
      hint: Enter delivery date
      type: date
      options: []
      required: true
    - id: 10
      name: delivery_status
      label: Delivery Status
      hint: Select delivery status
      type: select_one
      options:
      - Delivered
      - Pending
      - Cancelled
      required: true
    - id: 11
      name: customer_info
      label: Customer Information
      hint: Enter customer information
      type: text
      options: []
      required: true
    - id: 12
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
