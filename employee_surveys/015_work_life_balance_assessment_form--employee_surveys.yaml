inputSchema:
  type: object
  properties:
    title: Work Life Balance Assessment Form
    pages:
    - id: 1
      name: work_status
      label: What's your current work status?
      hint: null
      type: select_one
      options:
      - Active
      - On-site
      - Off-site
      required: false
    - id: 2
      name: work_hours
      label: How do you manage your work hours?
      hint: null
      type: select_one
      options:
      - Work-life balance
      - Work-only focus
      - Other
      - Specify
      required: false
    - id: 3
      name: daily_schedule
      label: What's your daily schedule like?
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: stressors
      label: What are your main stressors?
      hint: null
      type: select_one
      options:
      - Work-related issues
      - Home life issues
      - Relationship issues
      - Other
      required: false
    - id: 5
      name: stress_levels
      label: How do you rate your current stress levels?
      hint: null
      type: select_multiple
      options:
      - High
      - Low
      required: false
    - id: 6
      name: support_networks
      label: What support networks do you have in your work or personal life?
      hint: null
      type: select_multiple
      options:
      - Family
      - Friends
      - Colleagues
      - Other
      required: false
    - id: 7
      name: stress_management
      label: How do you manage your stress?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Is there anything else you'd like to add or comment on?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
