inputSchema:
  type: object
  properties:
    title: Startup Workplace Culture Employment Review
    pages:
    - id: 1
      name: introduction
      label: What do you think of our startup culture?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: leadership
      label: How would you rate the leadership team?
      hint: null
      type: select_one
      options:
      - Strongly agree
      - Neither agree nor disagree
      - Disagree
      - Strongly disagree
      required: true
    - id: 3
      name: work_life_balance
      label: How would you describe your work-life balance at our startup?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Bad
      required: false
    - id: 4
      name: job_satisfaction
      label: How satisfied are you with your job?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neither satisfied nor dissatisfied
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 5
      name: communication
      label: How would you rate the communication between teams and departments?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: growth_opportunities
      label: How important is it for you to have growth opportunities?
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not very important
      required: false
    - id: 7
      name: team_dynamics
      label: How would you rate the team dynamics?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: company_values
      label: How well does the company align with your personal values?
      hint: null
      type: select_one
      options:
      - Strongly agree
      - Somewhat agree
      - Neither agree nor disagree
      - Somewhat disagree
      - Strongly disagree
      required: false
    - id: 9
      name: feedback
      label: Is there anything else you'd like to feedback on?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments or suggestions?
      hint: null
      type: text
      options: []
      required: false
