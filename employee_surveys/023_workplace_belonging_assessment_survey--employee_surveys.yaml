inputSchema:
  type: object
  properties:
    title: Workplace Belonging Assessment Survey
    pages:
    - id: 1
      name: employee_survey
      label: What do you enjoy most about working here
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_connect
      label: Which team do you feel the most connected with
      hint: null
      type: select_multiple
      options:
      - Team A
      - Team B
      - Team C
      required: false
    - id: 3
      name: inclusion_level
      label: What level of inclusion do you feel in the workplace
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: satisfaction_level
      label: What level of satisfaction do you experience in the workplace
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: action_plan
      label: Is there an action plan in place for inclusion and diversity
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: action_taken
      label: Have you seen actions taken to address inclusion and diversity issues
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: feedback
      label: What do you suggest we do to improve our workplaces sense of community
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: action_plan_implementation
      label: What kind of action plan would you recommend for implementing improvements
      hint: null
      type: select_one
      options:
      - Training
      - Meetings
      - Policy changes
      required: false
    - id: 9
      name: team_leadership
      label: How important is team leadership in the workplace
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not very important
      required: false
    - id: 10
      name: team_leadership_style
      label: Which style of team leadership do you prefer
      hint: null
      type: select_multiple
      options:
      - Autocratic
      - Democratic
      - Laissez-faire
      required: false
    - id: 11
      name: communication_channels
      label: Which communication channel do you use most often for team interactions
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Video conferencing
      required: false
    - id: 12
      name: time_off
      label: What time of day do you usually take your break
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: work_life_balance
      label: What kind of work life balance do you experience in the workplace
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: job_security
      label: Do you feel secure in your job
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 15
      name: job_security_reasons
      label: If No, what are the reasons
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: team_size
      label: How many team members do you have direct interactions with
      hint: null
      type: select_one
      options:
      - 1-5
      - 6-10
      - 11-15
      - More than 15
      required: false
