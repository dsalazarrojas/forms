inputSchema:
  type: object
  properties:
    title: Transport Driver Employment Satisfaction Form
    pages:
    - id: 1
      name: transport_driver_employment_satisfaction_form
      label: How satisfied are you with the company
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: work_environment
      label: What is your current work environment like
      hint: null
      type: select_multiple
      options:
      - option1
      - option2
      - option3
      - option4
      - option5
      required: false
    - id: 3
      name: company_culture
      label: What do you think about our company culture?
      hint: null
      type: select_one
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 4
      name: work_life_balance
      label: Do you feel you have a good work-life balance?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: manager_relationships
      label: How would you rate your relationships with your manager(s)
      hint: null
      type: select_one
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 6
      name: job_security
      label: How secure do you feel about your job?
      hint: null
      type: select_multiple
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 7
      name: opportunities_for_development
      label: Do you have opportunities for personal and professional development?
      hint: null
