inputSchema:
  type: object
  properties:
    title: Employee Onboarding Survey
    pages:
    - id: 1
      name: employee_information
      label: Employee Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: onboarding_experience
      label: Onboarding Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: onboarding_process
      label: Onboarding Process
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: job_role
      label: Job Role
      hint: null
      type: select_multiple
      options:
      - Data Analyst
      - IT Support
      - Marketing Manager
      required: true
    - id: 5
      name: training
      label: Training Hours
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: time_to_complete
      label: Days to Complete Onboarding
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: equipment_access
      label: Access to Equipment
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 8
      name: onboarding_buddy
      label: Onboarding Buddy
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 9
      name: supervisor_communication
      label: Supervisor Communication
      hint: null
      type: radio
      options:
      - Good
      - Needs Improvement
      - Poor
      required: true
    - id: 10
      name: onboarding_plan
      label: Onboarding Plan
      hint: null
      type: select_one
      options:
      - Comprehensive
      - Basic
      - None
      required: true
