    - id: 5
      name: overall_rating
      label: Overall rating
      hint: Scale of 1-5
      type: number
      options: []
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: contact_info
      label: Contact Information
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: follow_up
      label: Follow up
      hint: null
      type: text
      options: []
