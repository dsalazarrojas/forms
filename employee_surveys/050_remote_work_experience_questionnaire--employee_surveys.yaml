inputSchema:
  type: object
  properties:
    title: Remote Work Experience Questionnaire
    pages:
    - id: 1
      name: remote_work_experience_questionnaire
      label: What is your current job role?
      hint: null
      type: select_one
      options:
      - Software Engineer
      - Project Manager
      - Product Owner
      required: false
    - id: 2
      name: remote_work_experience_questionnaire_2
      label: How many hours do you work from home?
      hint: Enter a number
      type: number
      options: []
      required: false
    - id: 3
      name: remote_work_experience_questionnaire_3
      label: What type of work environment do you prefer?
      hint: null
      type: select_multiple
      options:
      - Home office
      - Co-working space
      - Coffee shop
      required: false
    - id: 4
      name: remote_work_experience_questionnaire_4
      label: How often do you feel productive while working from home?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: remote_work_experience_questionnaire_5
      label: What tools do you use to communicate with your team?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Video conferencing
      required: false
    - id: 6
      name: remote_work_experience_questionnaire_6
      label: How long have you been working from home?
      hint: null
      type: select_one
      options:
      - Less than 6 months
      - 6-11 months
      - Over a year
      required: false
    - id: 7
      name: remote_work_experience_questionnaire_7
      label: How many people do you live with while working from home?
      hint: Enter a number
      type: number
      options: []
      required: false
    - id: 8
      name: remote_work_experience_questionnaire_8
      label: What is the most challenging part of working from home?
      hint: null
      type: select_multiple
      options:
      - Lack of separation between work and personal life
      - Difficulty concentrating
      - Distractions from family or roommates
      required: false
    - id: 9
      name: remote_work_experience_questionnaire_9
      label: Have you experienced any burnout while working from home?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 10
      name: remote_work_experience_questionnaire_10
      label: How has your productivity changed while working from home?
      hint: null
      type: select_one
      options:
      - Increased
      - Decreased
      - No change
      required: false
    - id: 11
      name: remote_work_experience_questionnaire_11
      label: Have you experienced any technical difficulties while working from home?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 12
      name: remote_work_experience_questionnaire_12
      label: How do you handle work-related stress while working from home?
      hint: null
      type: select_one
      options:
      - Regular exercise
      - Meditation
      - None
      required: false
    - id: 13
      name: remote_work_experience_questionnaire_13
      label: What benefits do you value most while working from home?
      hint: null
      type: select_multiple
      options:
      - Autonomy
      - Flexibility
      - Better work-life balance
      required: false
    - id: 14
      name: remote_work_experience_questionnaire_14
      label: How has your physical and mental health changed while working from home?
      hint: null
      type: select_one
      options:
      - Improved
      - No change
      - Deteriorated
      required: false
    - id: 15
      name: remote_work_experience_questionnaire_15
      label: How has your relationship with your family changed while working from
        home?
      hint: null
      type: select_one
      options:
      - Improved
      - No change
      - Deteriorated
      required: false
    - id: 16
      name: remote_work_experience_questionnaire_16
      label: Have you experienced any negative impacts on your career while working
        from home?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 17
      name: remote_work_experience_questionnaire_17
      label: How has your connection with your team changed while working from home?
      hint: null
      type: select_one
      options:
      - Improved
      - No change
      - Deteriorated
      required: false
    - id: 18
      name: remote_work_experience_questionnaire_18
      label: Have you experienced any negative impacts on your work performance while
        working from home?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 19
      name: remote_work_experience_questionnaire_19
      label: What changes do you propose to improve your remote work experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: remote_work_experience_questionnaire_20
      label: Any other comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: remote_work_experience_questionnaire_21
      label: What time do you work most often?
      hint: null
      type: time
      options: []
      required: false
    - id: 22
      name: remote_work_experience_questionnaire_22
      label: How many hours do you work most often?
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: remote_work_experience_questionnaire_23
      label: What is your work schedule like?
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Variable
      required: false
    - id: 24
      name: remote_work_experience_questionnaire_24
      label: How many days do you work most often?
      hint: null
      type: number
      options: []
      required: false
    - id: 25
      name: remote_work_experience_questionnaire_25
      label: Do you have a dedicated workspace at home?
      hint: If yes, please describe
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
