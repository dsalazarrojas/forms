inputSchema:
  type: object
  properties:
    title: Employee Training Survey
    pages:
    - id: 1
      name: employee_training_survey_form
      label: Employee Training Survey Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: training_programs
      label: Training Programs
      hint: null
      type: select_multiple
      options:
      - IT Training
      - Management Training
      - Operations Training
      - Safety and Health Training
      - Sales and Business Training
      - Soft Skills Training
      - Other
      required: false
    - id: 3
      name: survey_date
      label: Survey Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: training_hours
      label: Training Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: training_attendance
      label: Training Attendance
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: training_satisfaction
      label: Training Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Not Satisfied
      required: true
    - id: 7
      name: employee_comments
      label: Employee Comments
      hint: null
      type: text
      options: []
      required: false
