      options: []
      required: false
    - id: 6
      name: bonus_type
      label: Bonus Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: bonus_frequency
      label: Bonus Frequency
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: department_id
      label: Department ID
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
