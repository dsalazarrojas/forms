inputSchema:
  type: object
  properties:
    title: individual_performance_and_wellbeing_survey
    pages:
    - id: 1
      name: employee_satisfaction
      label: What is your overall satisfaction with your job
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - neutral
      - somewhat dissatisfied
      - very dissatisfied
      required: false
    - id: 2
      name: motivation
      label: How motivated are you at work
      hint: null
      type: select_multiple
      options:
      - very motivated
      - somewhat motivated
      - somewhat ambitious
      - not motivated
      required: true
    - id: 3
      name: stress_level
      label: What is your current stress level
      hint: null
      type: select_one
      options:
      - very little stress
      - somewhat little stress
      - neutral
      - somewhat high stress
      - very high stress
      required: true
    - id: 4
      name: job_abilities
      label: What abilities do you feel are your strengths at work
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: wellbeing
      label: How would you describe your current wellbeing
      hint: null
      type: select_one
      options:
      - excellent
      - good
      - neutral
      - poor
      - very poorman
      required: true
    - id: 6
      name: work_life_balance
      label: How satisfied are you with your work life balance
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - neutral
      - somewhat dissatisfied
      - very dissatisfied
      required: true
    - id: 7
      name: career_growth
      label: Do you feel you are able to grow in your career
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
