    - id: 18
      name: job_satisfaction
      label: What is your satisfaction level with your current job
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - neutral
      - somewhat dissatisfied
      - very dissatisfied
