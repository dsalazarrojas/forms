      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: manager_feedback
      label: Is there anything you would like your manager to know about you
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: manager_name
      label: What is your manager's name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: manager_email
      label: What is your manager's email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: manager_phone
      label: What is your manager's phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: department
