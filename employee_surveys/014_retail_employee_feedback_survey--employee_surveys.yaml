inputSchema:
  type: object
  properties:
    title: Retail Employee Feedback Survey
    pages:
    - id: 1
      name: employee_name
      label: employee_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: store_location
      label: store_location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: role
      label: role
      hint: null
