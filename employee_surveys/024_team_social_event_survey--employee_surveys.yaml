    - id: 6
      name: team_outing
      label: Team Outing
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: team_attendance
      label: Team Attendance
      hint: null
      type: select_multiple
      options:
      - Everyone
