inputSchema:
  type: object
  properties:
    title: Compensation And Benefits Satisfaction Questionnaire
    pages:
    - id: 1
      name: satisfaction_intro_header
      label: -- Compensation and Benefits Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: current_role_tenure
      label: How long have you been with the organization?
      hint: Select your tenure range
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - More than 10 years
      required: true
    - id: 3
      name: salary_satisfaction_rating
      label: How satisfied are you with your current base salary?
      hint: 1 being very dissatisfied, 5 being very satisfied
      type: select_one
      options:
      - 1 - Very Dissatisfied
      - '2'
      - '3'
      - '4'
      - 5 - Very Satisfied
      required: true
    - id: 4
      name: benefits_package_satisfaction
      label: Overall satisfaction with the health and wellness benefits
      hint: Includes medical, dental, and vision insurance
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: true
    - id: 5
      name: retirement_plan_satisfaction
      label: Satisfaction with 401k or retirement matching contributions
      hint: If applicable
      type: select_one
      options:
      - Satisfied
      - Neutral
      - Dissatisfied
      - Not Participating
      required: true
    - id: 6
      name: pto_policy_satisfaction
      label: How satisfied are you with the Paid Time Off (PTO) policy?
      hint: Ease of taking leave and amount of time provided
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: fairness_perception
      label: Do you feel your compensation is fair compared to similar roles in the
        industry?
      hint: Based on your market research or previous experience
      type: select_one
      options:
      - Yes, very fair
      - Somewhat fair
      - Not fair
      - Unsure
      required: true
    - id: 8
      name: bonus_incentive_clarity
      label: Is the bonus or incentive structure clearly communicated?
      hint: Do you know how your performance affects your compensation?
      type: select_one
      options:
      - Very Clear
      - Clear
      - Somewhat Vague
      - Very Vague
      - No bonus structure exists
      required: true
    - id: 9
      name: most_valued_benefit
      label: Which current benefit do you value the most?
      hint: Pick one primary benefit
      type: select_one
      options:
      - Health Insurance
      - Retirement Matching
      - PTO / Vacation
      - Remote Work / Flexibility
      - Professional Development
      - Life Insurance
      required: true
    - id: 10
      name: desired_new_benefits
      label: What is one new benefit you would like the organization to consider?
      hint: e.g., Gym membership, Childcare support, Student loan repayment
      type: text
      options: []
      required: false
    - id: 11
      name: additional_comments_compensation
      label: Additional comments or concerns regarding compensation and benefits
      hint: Open-ended feedback for HR
      type: text
      options: []
      required: false
