inputSchema:
  type: object
  properties:
    title: Heat Stress Survey
    pages:
    - id: 1
      name: first_page
      label: first page
      hint: null
      type: select_one
      options:
      - Heat Stress
      - Heat Acclimatization
      - Heat Exhaustion
      - Heat Stroke
      - Heat Rash
      - Heat Cramps
      - Heat Syncope
      - Heat Fatigue
      - Dehydration
      - Other
      - None of the above
      required: false
    - id: 2
      name: location
      label: location
      hint: Where was the incident occurred?
      type: select_one
      options:
      - Workplace
      - Break Area
      - Break Room
      - Outside
      - Other
      - None of the above
      required: true
    - id: 3
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: temperature
      label: temperature
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: humidity
      label: humidity
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: wind_speed
      label: wind speed
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: sun_exposure
      label: sun exposure
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      - None
      required: true
    - id: 9
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact
      label: contact
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: assigned_to
      label: assigned to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      - None of the above
      required: true
    - id: 13
      name: submitted_by
      label: submitted by
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      - None of the above
      required: true
