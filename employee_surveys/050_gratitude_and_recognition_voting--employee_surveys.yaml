inputSchema:
  type: object
  properties:
    title: Gratitude And Recognition Voting
    pages:
    - id: 1
      name: nomination_form
      label: Nomination Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: nomination_name
      label: Nominee
      hint: Enter the name of the nominee
      type: text
      options: []
      required: false
    - id: 3
      name: nomination_category
      label: Category
      hint: null
      type: select_one
      options:
      - Awards and Recognition
      - Community Service
      - Leadership
      - Quality of Service
      required: true
    - id: 4
      name: nomination_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: nomination_details
      label: Nomination Details
      hint: Provide a brief explanation or description of the nominee’s work or achievements
      type: text
      options: []
      required: false
    - id: 6
      name: recognition_type
      label: Recognition Type
      hint: Choose the type of recognition for the nominee
      type: select_one
      options:
      - Awards and Recognition
      - Bonus or Gift Card
      - Verbal Appreciation
      - Written Letter of Appreciation
      required: true
    - id: 7
      name: vote_form
      label: Vote Form
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: vote_choice
      label: Vote
      hint: Enter the number of votes for the nominee
      type: number
      options: []
      required: false
    - id: 9
      name: vote_comment
      label: Vote Comment
      hint: Enter any additional comments regarding the vote
      type: text
      options: []
      required: false
    - id: 10
      name: comment_form
      label: Comments
      hint: null
      type: text
      options: []
      required: false
