      - email
      - text
      required: true
    - id: 6
      name: work_hours
      label: Work Hours
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: on_call_duration
      label: On Call Duration
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: false
