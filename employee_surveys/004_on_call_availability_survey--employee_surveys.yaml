inputSchema:
  type: object
  properties:
    title: On Call Availability Survey
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_details
      label: Contact Details
      hint: null
      type: select_multiple
      options:
      - email
      - phone
      - text
      required: true
