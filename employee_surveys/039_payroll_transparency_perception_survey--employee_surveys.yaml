inputSchema:
  type: object
  properties:
    title: Payroll Transparency Perception Survey
    pages:
    - id: 1
      name: payroll_transparency_practices
      label: Do you have access to a clear and concise payroll schedule?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Don't know
      required: false
    - id: 2
      name: compensation_transparency
      label: How transparent are you about your compensation and benefits?
      hint: null
      type: select_one
      options:
      - Very transparent
      - Somewhat transparent
      - Not very transparent
      - Not at all transparent
      required: false
    - id: 3
      name: communication_frequency
      label: How often do you receive clear and timely communication from your manager
        about your compensation and benefits?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      required: false
    - id: 4
      name: pay_schedule
      label: Are you provided with a clear and accurate pay schedule?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Don't know
      required: false
    - id: 5
      name: compensation_data
      label: How often do you receive clear and accurate compensation data?
      hint: null
      type: select_one
      options:
      - Very often
      - Somewhat often
      - Rarely
      - Never
      required: false
    - id: 6
      name: manager_transparency
      label: How transparent do you feel your manager is about their own compensation
        and benefits?
      hint: null
      type: select_one
      options:
      - Very transparent
      - Somewhat transparent
      - Not very transparent
      - Not at all transparent
      required: false
    - id: 7
      name: benefits_transparency
      label: How clear and easy to understand are the benefits offered by your organization?
      hint: null
      type: select_one
      options:
      - Very clear
      - Somewhat clear
      - Not very clear
      - Not at all clear
      required: false
    - id: 8
      name: payroll_transparency
      label: How clear is the payroll information provided to you?
      hint: null
      type: select_one
      options:
      - Very clear
      - Somewhat clear
      - Not very clear
      - Not at all clear
      required: false
    - id: 9
      name: feedback_channel
      label: What channels do you use to provide feedback on payroll practices?
      hint: null
      type: select_multiple
      options:
      - Email
      - In-person
      - Chat
      - Phone
      required: false
    - id: 10
      name: manager_support
      label: Do you feel supported by your manager when it comes to payroll questions
        or concerns?
      hint: null
      type: select_one
      options:
      - Very supported
      - Somewhat supported
      - Not very supported
      - Not at all supported
      required: false
    - id: 11
      name: payroll_transparency_impact
      label: How has payroll transparency impacted your job satisfaction?
      hint: null
