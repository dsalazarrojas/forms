inputSchema:
  type: object
  properties:
    title: Employee Satisfaction Drivers Survey
    pages:
    - id: 1
      name: question_1
      label: What drives your motivation at work?
      hint: null
      type: select_one
      options:
      - High level of autonomy
      - High level of recognition
      - High level of growth
      - High level of challenge
      required: false
    - id: 2
      name: question_2
      label: How often do you experience a high level of challenge?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: question_3
      label: What motivates you?
      hint: null
      type: select_multiple
      options:
      - High level of autonomy
      - High level of recognition
      - High level of growth
      - High level of challenge
      required: false
    - id: 4
      name: question_4
      label: Thank you for taking the time to complete this survey
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: question_5
      label: Do you have any additional comments or concerns?
      hint: null
      type: text
      options: []
      required: false
