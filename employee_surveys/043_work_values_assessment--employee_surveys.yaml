inputSchema:
  type: object
  properties:
    title: Work Values Assessment
    pages:
    - id: 1
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: work_values_scale
      label: Which of the following values do you most identify with?
      hint: null
      type: select_multiple
      options:
      - Achievement
      - Competition
      - Creativity
      - Independence
      - Helping Others
      - Recognition
      - Social Status
      - Work-Life Balance
      - Altruism
      - Loyalty
      - Stability
      required: false
    - id: 3
      name: years_of_experience
      label: Years of Experience in Current Job
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: job_satisfaction
      label: Job Satisfaction
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_satisfaction_scale
      label: On a scale of 1-5, how satisfied are you with your job?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: work_life_balance_scale
      label: On a scale of 1-5, how satisfied are you with your work-life balance?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: motivation
      label: Motivation
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: motivation_scale
      label: On a scale of 1-5, how motivated are you?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: work_life_balance
      label: Work-Life Balance
      hint: null
      type: text
      options: []
      required: false
