inputSchema:
  type: object
  properties:
    title: Remote Work Feedback Pulse Survey
    pages:
    - id: 1
      name: form_title
      label: What's your experience with remote work?
      hint: Please provide a brief description of your experience.
      type: text
      options: []
      required: false
    - id: 2
      name: manager_name
      label: Manager's Name
      hint: Please provide your manager's name.
      type: text
      options: []
      required: true
    - id: 3
      name: manager_email
      label: Manager's Email
      hint: Please provide your manager's email address.
      type: email
      options: []
      required: false
    - id: 4
      name: manager_phone
      label: Manager's Phone
      hint: Please provide your manager's phone number.
      type: text
      options: []
      required: false
    - id: 5
      name: employee_name
      label: Your Name
      hint: Please provide your name.
      type: text
      options: []
      required: true
    - id: 6
      name: employee_email
      label: Your Email
      hint: Please provide your email address.
      type: email
      options: []
      required: false
    - id: 7
      name: employee_phone
      label: Your Phone
      hint: Please provide your phone number.
      type: text
      options: []
      required: false
    - id: 8
      name: satisfaction_score
      label: Satisfaction Score (1-5)
      hint: Please rate your satisfaction with remote work.
      type: number
      options: []
      required: true
    - id: 9
      name: productivity_score
      label: Productivity Score (1-5)
      hint: Please rate your productivity with remote work.
      type: number
      options: []
      required: true
    - id: 10
      name: challenges
      label: Challenges Faced
      hint: Please list any challenges you faced with remote work.
      type: text
      options: []
      required: false
    - id: 11
      name: comments
      label: Comments and Feedback
      hint: Please provide any comments or feedback.
      type: text
      options: []
      required: false
    - id: 12
      name: category
      label: Category
      hint: Please select the category that best describes your experience.
      type: select_one
      options:
      - Remote Work
      - Flexible Work Arrangements
      - Work-Life Balance
      - Other
      required: true
    - id: 13
      name: how_long_have
      label: How long have you worked remotely?
      hint: Please select the duration of your remote work experience.
      type: select_one
      options:
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - Over 1 year
      required: true
    - id: 14
      name: remote_duration
      label: Duration of Remote Setup
      hint: Please select the duration of your remote work setup.
      type: select_multiple
      options:
      - 1-2 days
      - 2-4 days
      - 4-5 days
      - 5-7 days
      - More than 7 days
      required: true
    - id: 15
      name: category_other
      label: Other Category
      hint: Please provide any other category that best describes your experience.
      type: text
      options: []
      required: false
    - id: 16
      name: select_multiple
      label: Select Multiple
      hint: Please select multiple options that best describe your experience.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 17
      name: date_experience
      label: Date of Experience
      hint: Please provide the date of your remote work experience.
      type: date
      options: []
      required: true
    - id: 18
      name: end_screen
      label: End Screen
      hint: Thank you for taking the time to share your feedback.
      type: text
      options: []
      required: false
