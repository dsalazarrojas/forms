inputSchema:
  type: object
  properties:
    title: Job Flexibility Perception Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: job_flexibility
      label: How would you rate your perception of job flexibility
      hint: On a scale of 1-10
      type: number
      options: []
      required: false
    - id: 3
      name: work_life_balance
      label: How satisfied are you with your work-life balance?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Not very satisfied
      - Not at all satisfied
      required: false
    - id: 4
      name: career_development
      label: How satisfied are you with your career development opportunities?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Not very satisfied
      - Not at all satisfied
      required: false
    - id: 5
      name: flexible_work_arrangements
      label: How often do you have flexible work arrangements?
      hint: null
      type: select_multiple
      options:
      - Always
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 6
      name: manager_support
      label: How often does your manager support flexible work arrangements?
      hint: null
      type: select_multiple
      options:
      - Always
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 7
      name: employee_perception
      label: What is your perception of the impact on employee well-being?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 8
      name: manager_perception
      label: What is your perception of the impact on manager well-being?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall, how satisfied are you with your work arrangement?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Not very satisfied
      - Not at all satisfied
      required: false
    - id: 10
      name: feedback
      label: Any additional comments or feedback?
      hint: Please provide any additional comments or feedback
      type: note
      options: []
      required: false
    - id: 11
      name: contact_information
      label: Your contact information
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: manager_email
      label: Manager email
      hint: null
      type: email
      options: []
      required: false
    - id: 13
