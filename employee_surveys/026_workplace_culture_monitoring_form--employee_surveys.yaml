    - id: 5
      name: diversity_inclusion
      label: diversity_inclusion
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: employee_satisfaction
      label: employee_satisfaction
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
