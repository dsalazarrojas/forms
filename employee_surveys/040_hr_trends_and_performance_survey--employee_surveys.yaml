      hint: null
      type: select_one
      options:
      - Software Engineer
      - Marketing Manager
      - Finance Manager
      required: false
    - id: 21
      name: job_title
      label: What is your job title?
      hint: null
      type: select_one
      options:
      - Software Engineer
      - Marketing Manager
      - Finance Manager
      required: false
    - id: 22
      name: manager
      label: What is the name of your manager?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 23
      name: manager2
      label: What is the job title of your manager?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
