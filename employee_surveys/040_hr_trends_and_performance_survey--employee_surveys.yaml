inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: introduction
      label: Welcome to the HR Trends and Performance Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_demographics
      label: Employee Demographics
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      required: false
    - id: 3
      name: employee_engagement
      label: What are your top goals for the upcoming year?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: job_satisfaction
      label: On a scale of 1 to 5, how satisfied are you with your current role?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: job_satisfaction_2
      label: On a scale of 1 to 5, how satisfied are you with your manager?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: work_life_balance
      label: How satisfied are you with your work-life balance?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 7
      name: manager_relationships
      label: How satisfied are you with your manager?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 8
      name: company_culture
      label: How satisfied are you with the culture at our company?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      required: true
    - id: 9
      name: communication
      label: How satisfied are you with communication within the company?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      required: true
    - id: 10
      name: growth_opportunities
      label: How satisfied are you with growth opportunities?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      required: true
    - id: 11
      name: company_values
      label: How well do you think the company's values align with your own?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      required: true
    - id: 12
      name: company_vision
      label: How well do you think the company's vision aligns with your own?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      required: true
    - id: 13
      name: diversity_inclusion
      label: How would you rate the level of diversity and inclusion?
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: company_image
      label: How satisfied are you with the company image?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 15
      name: job_security
      label: How secure do you feel about your job?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 16
      name: overall_satisfaction
      label: Overall, how satisfied are you with your job?
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: feedback
      label: Is there any feedback you'd like to provide?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: comments
      label: Any comments or suggestions?
      hint: null
      type: text
      options: []
      required: false
