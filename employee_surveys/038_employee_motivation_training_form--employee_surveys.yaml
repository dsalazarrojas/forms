inputSchema:
  type: object
  properties:
    title: Employee Motivation Training Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: motivation_level
      label: Motivation Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 4
      name: training_initiatives
      label: Training Initiatives
      hint: null
      type: select_multiple
      options:
      - Collaboration
      - Communication
      - Time Management
      required: true
    - id: 5
      name: training_initiatives_description
      label: Training Initiatives Description
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: training_needs
      label: Training Needs
      hint: null
      type: select_multiple
      options:
      - Motivation
      - Engagement
      - Leadership
      - Time Management
      required: true
    - id: 7
      name: available_time
      label: Available Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: training_initiatives_description_2
      label: Training Initiatives Description 2
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: date_and_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: true
