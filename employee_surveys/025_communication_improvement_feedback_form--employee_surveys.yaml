      - id: 18
        name: improvement_suggestions
        label: Improvement Suggestions
        hint: What specific improvements would you suggest
        type: text
        options: []
        required: true
      - id: 19
        name: training_interest
        label: Training Interest
        hint: Would you be interested in communication training
        type: select_one
        options:
          - "Yes - Very Interested"
          - "Yes - Somewhat Interested"
          - "Neutral"
          - "No - Not Interested"
        required: true
      - id: 20
        name: training_topics
        label: Training Topics
        hint: What topics would be most helpful
        type: select_multiple
        options:
          - Active Listening
          - Clear Writing
          - Presentation Skills
          - Conflict Resolution
          - Cross-Cultural Communication
          - Remote Communication
          - Feedback Delivery
          - Meeting Facilitation
          - None
        required: false
      - id: 21
        name: manager_communication
        label: Manager Communication
        hint: How effective is communication from your manager
        type: select_one
        options:
          - Very Effective
          - Effective
          - Neutral
          - Ineffective
          - Very Ineffective
          - Not Applicable
        required: true
      - id: 22
        name: recognition_frequency
        label: Recognition Frequency
        hint: How often do you receive recognition
        type: select_one
        options:
          - Very Often
          - Often
          - Sometimes
          - Rarely
          - Never
        required: true
      - id: 23
        name: psychological_safety
        label: Psychological Safety
        hint: Do you feel safe expressing opinions
        type: select_one
        options:
          - Always
          - Usually
          - Sometimes
          - Rarely
          - Never
        required: true
      - id: 24
        name: willing_to_discuss
        label: Willing to Discuss
        hint: Would you discuss this feedback further
        type: select_one
        options:
          - "Yes"
          - "No"
        required: false
      - id: 25
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback or suggestions
        type: text
        options: []
        required: false
      - id: 26
        name: feedback_date
        label: Feedback Date
        hint: Date you submitted this feedback
        type: date
        options: []
        required: true
