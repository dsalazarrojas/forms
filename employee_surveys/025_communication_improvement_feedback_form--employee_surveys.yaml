        hint: How do you prefer to receive information
        type: select_one
        options:
          - Email
          - Instant Messaging
          - Video Calls
          - Phone Calls
          - In-Person Meetings
          - Project Management Tools
          - Documentation
        required: true
      - id: 14
        name: current_tools
        label: Current Tools
        hint: What communication tools do you currently use
        type: select_multiple
        options:
          - Email
          - Slack
          - Microsoft Teams
          - Zoom
          - Google Meet
          - Asana
          - Jira
          - Trello
          - Confluence
          - Other
        required: true
      - id: 15
        name: tools_effectiveness
        label: Tools Effectiveness
        hint: How effective are current communication tools
        type: select_one
        options:
          - Very Effective
          - Effective
          - Neutral
          - Ineffective
          - Very Ineffective
        required: true
      - id: 16
        name: communication_barriers
        label: Communication Barriers
        hint: What barriers affect your communication
        type: select_multiple
        options:
