inputSchema:
  type: object
  properties:
    title: Communication Improvement Feedback Form
    pages:
      - id: 1
        name: feedback_introduction
        label: Feedback Introduction
        hint: Help us improve team communication
        type: note
        options: []
        required: false
      - id: 2
        name: employee_name
        label: Employee Name
        hint: Your full name - optional
        type: text
        options: []
        required: false
      - id: 3
        name: employee_id
        label: Employee ID
        hint: Your employee identification number
        type: text
        options: []
        required: false
      - id: 4
        name: department
        label: Department
        hint: Which department do you work in
        type: select_one
        options:
          - Executive
          - Sales
          - Marketing
          - Engineering
          - Product
          - Human Resources
          - Finance
          - Operations
          - Customer Support
          - IT
          - Other
        required: true
      - id: 5
        name: team_name
        label: Team Name
        hint: Name of your specific team or group
        type: text
        options: []
        required: false
      - id: 6
        name: tenure
        label: Tenure
        hint: How long have you been with the company
        type: select_one
        options:
          - Less than 6 months
          - 6 months - 1 year
          - 1-2 years
          - 2-5 years
          - 5+ years
        required: true
      - id: 7
        name: current_communication_rating
        label: Current Communication Rating
        hint: How would you rate current team communication
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very Poor
        required: true
      - id: 8
        name: communication_clarity
        label: Communication Clarity
        hint: Are messages and instructions clear
        type: select_one
        options:
          - Always Clear
          - Usually Clear
          - Sometimes Clear
          - Rarely Clear
          - Never Clear
        required: true
      - id: 9
        name: information_access
        label: Information Access
        hint: Do you have access to information you need
        type: select_one
        options:
          - Always
          - Usually
          - Sometimes
          - Rarely
          - Never
        required: true
      - id: 10
        name: feedback_reception
        label: Feedback Reception
        hint: How well is your feedback received
        type: select_one
        options:
          - Very Well
          - Well
          - Adequately
          - Poorly
          - Very Poorly
        required: true
      - id: 11
        name: meeting_effectiveness
        label: Meeting Effectiveness
        hint: How effective are team meetings
        type: select_one
        options:
          - Very Effective
          - Effective
          - Neutral
          - Ineffective
          - Very Ineffective
        required: true
      - id: 12
        name: communication_frequency
        label: Communication Frequency
        hint: How often does your team communicate
        type: select_one
        options:
          - Multiple times daily
          - Once daily
          - Several times weekly
          - Once weekly
          - Rarely
