inputSchema:
  type: object
  properties:
    title: Administration Intranet Survey
    pages:
    - id: 1
      name: survey_header
      label: -- Administration Intranet Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: Your employee identification number
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Which department do you work in?
      type: select_one
      options: ["Administration", "Human Resources", "Finance", "Marketing", "Operations", "IT", "Sales", "Customer Service", "Executive", "Other"]
      required: true
    - id: 5
      name: position_level
      label: Position Level
      hint: What is your position level?
      type: select_one
      options: ["Entry Level", "Mid-Level", "Senior Level", "Management", "Executive"]
      required: true
    - id: 6
      name: intranet_usage_frequency
      label: How often do you use the intranet?
      hint: Select your typical usage frequency
      type: select_one
      options: ["Daily", "Several times per week", "Once a week", "Few times per month", "Rarely", "Never"]
      required: true
    - id: 7
      name: intranet_satisfaction
      label: Overall Intranet Satisfaction
      hint: How satisfied are you with the intranet?
      type: select_one
      options: ["Very Satisfied", "Satisfied", "Neutral", "Dissatisfied", "Very Dissatisfied"]
      required: true
    - id: 8
      name: navigation_rating
      label: Navigation and Usability Rating
      hint: How would you rate the ease of navigating the intranet?
      type: select_one
      options: ["Excellent", "Very Good", "Good", "Fair", "Poor"]
      required: true
    - id: 9
      name: search_functionality_rating
      label: Search Functionality Rating
      hint: How would you rate the search functionality?
      type: select_one
      options: ["Excellent", "Very Good", "Good", "Fair", "Poor"]
      required: true
    - id: 10
      name: information_findability
      label: Information Findability
      hint: How easy is it to find the information you need?
      type: select_one
      options: ["Very Easy", "Easy", "Moderate", "Difficult", "Very Difficult"]
      required: true
    - id: 11
      name: content_relevance
      label: Content Relevance
      hint: How relevant is the content to your work?
      type: select_one
      options: ["Very Relevant", "Relevant", "Somewhat Relevant", "Not Very Relevant", "Not Relevant"]
      required: true
    - id: 12
      name: mobile_access_rating
      label: Mobile Access Rating
      hint: How would you rate the mobile access to the intranet?
      type: select_one
      options: ["Excellent", "Very Good", "Good", "Fair", "Poor", "I don't use mobile access"]
      required: true
    - id: 13
      name: collaboration_tools_rating
      label: Collaboration Tools Rating
      hint: How would you rate the collaboration tools available?
      type: select_one
      options: ["Excellent", "Very Good", "Good", "Fair", "Poor", "Not Applicable"]
      required: true
    - id: 14
      name: training_resources_rating
      label: Training Resources Rating
      hint: How would you rate the training resources available?
      type: select_one
      options: ["Excellent", "Very Good", "Good", "Fair", "Poor", "Not Applicable"]
      required: true
    - id: 15
      name: technical_issues_frequency
      label: Frequency of Technical Issues
      hint: How often do you experience technical issues?
      type: select_one
      options: ["Never", "Rarely", "Monthly", "Weekly", "Daily"]
      required: true
    - id: 16
      name: most_valuable_feature
      label: Most Valuable Feature
      hint: Which intranet feature do you find most valuable?
      type: text
      options: []
      required: false
    - id: 17
      name: least_valuable_feature
      label: Least Valuable Feature
      hint: Which intranet feature do you find least valuable?
      type: text
      options: []
      required: false
    - id: 18
      name: improvement_suggestions
      label: Improvement Suggestions
      hint: What improvements would you suggest?
      type: text
      options: []
      required: false
    - id: 19
      name: additional_features_desired
      label: Additional Features Desired
      hint: What additional features would you like to see?
      type: text
      options: []
      required: false
    - id: 20
      name: training_needs
      label: Training Needs
      hint: What training would help you use the intranet more effectively?
      type: text
      options: []
      required: false
    - id: 21
      name: survey_date
      label: Survey Date
      hint: Date of completing this survey
      type: date
      options: []
      required: true
