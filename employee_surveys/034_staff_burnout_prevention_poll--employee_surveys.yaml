inputSchema:
  type: object
  properties:
    title: staff_burnout_prevention_poll
    pages:
    - id: 1
      name: burnout_risk_level
      label: Burnout Risk Level
      hint: null
      type: select_one
      options:
      - low
      - moderate
      - high
      - critical
      required: false
    - id: 2
      name: burnout_risks_known
      label: Burnout Risks Known
      hint: null
      type: select_multiple
      options:
      - work life balance
      - workload
      - stress
      - lack of support
      required: false
    - id: 3
      name: support_needed
      label: Needed Support
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: manager_support
      label: Manager Support
      hint: null
      type: select_one
      options:
      - high
      - low
      required: false
    - id: 5
      name: training_support
      label: Training Support
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: employee_resources
      label: Employee Resources
      hint: null
      type: select_one
      options:
      - adequate
      - inadequate
      required: false
    - id: 7
      name: burnout_prevention_strategies
      label: Burnout Prevention Strategies
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: burnout_prevention_plan
      label: Burnout Prevention Plan
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: manager_commitment
      label: Manager Commitment
      hint: null
      type: select_one
      options:
      - high
      - low
      required: false
    - id: 10
      name: feedback_mechanism
      label: Feedback Mechanism
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
