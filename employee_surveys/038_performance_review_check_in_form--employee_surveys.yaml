inputSchema:
  type: object
  properties:
    title: Performance Review Check In Form
    pages:
    - id: 1
      name: team_lead
      label: What team lead am I working with during this review period?
      hint: null
      type: select_one
      options:
      - Team Lead 1
      - Team Lead 2
      - Team Lead 3
      required: true
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_title
      label: Employee Title
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: performance_period
      label: Which performance period am I being reviewed for?
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: review_start_date
      label: What is the start date of this review?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: review_end_date
      label: What is the end date of this review?
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: review_comments
      label: What are some comments about this review?
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: overall_rating_1
      label: How would you rate the employee's overall performance?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: overall_rating_2
      label: What specific areas for improvement would you like to focus on?
      hint: null
      type: checkbox
      options:
      - Improve communication skills
      - Improve time management
      - Improve teamwork
      required: false
    - id: 10
      name: overall_rating_3
      label: What specific accomplishments or successes would you like to highlight?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: overall_rating_4
      label: Overall Performance Rating
      hint: null
      type: select_one
      options:
      - Outstanding
      - Satisfactory
      - Needs Improvement
      required: true
