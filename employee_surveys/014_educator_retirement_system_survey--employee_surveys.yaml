inputSchema:
  type: object
  properties:
    title: Educator Retirement System Survey
    pages:
    - id: 1
      name: retirement_system
      label: What is your overall experience with the current educator retirement
        system?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 2
      name: retirement_benefits
      label: What benefits do you feel are missing from the current retirement system?
      hint: null
      type: select_multiple
      options:
      - Retirement benefits (e.g., medical, dental)
      - Financial support (e.g., loans, grants)
      - Other benefits (please specify)
      required: true
    - id: 3
      name: communication
      label: How would you rate the communication from the university regarding retirement
        benefits?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: fairness
      label: Do you feel that the current retirement system is fair and equitable?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 5
      name: suggestions
      label: What suggestions do you have for improving the retirement system?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: essential_benefits
      label: What benefits do you feel are essential for educators to have in the
        current retirement system?
      hint: null
      type: select_multiple
      options:
      - Retirement benefits (e.g., medical, dental)
      - Financial support (e.g., loans, grants)
      - Other benefits (please specify)
      required: true
    - id: 7
      name: timeliness
      label: How would you rate the timeliness of communication regarding retirement
        benefits?
      hint: null
      type: select_one
      options:
      - Very Timely
      - Somewhat Timely
      - Not Very Timely
      - Never
      required: true
    - id: 8
      name: navigability
      label: Do you feel that the current retirement system is easy to navigate?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 9
      name: clarity
      label: How would you rate the clarity of information regarding retirement benefits?
      hint: null
      type: select_one
      options:
      - Very Clear
      - Somewhat Clear
      - Not Very Clear
      - Not Clear At All
      required: false
    - id: 10
      name: comments
      label: Do you have any other comments or suggestions about the retirement system?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: confidence
      label: What would make you feel confident that the current retirement system
        is fair?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: comments2
      label: Are there any other comments or suggestions you'd like to make?
      hint: null
      type: text
      options: []
      required: false
