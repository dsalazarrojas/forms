inputSchema:
  type: object
  properties:
    title: software_update_employee_insights_report
    pages:
    - id: 1
      name: update_experience
      label: How did you experience the update
      hint: Describe your experience
      type: text
      options: []
      required: false
    - id: 2
      name: issues_encountered
      label: What issues did you encounter
      hint: List the issues you faced
      type: select_multiple
      options:
      - No issues
      - Technical issues
      - Performance issues
      - UI/UX issues
      required: true
    - id: 3
      name: suggestions_for_improvement
      label: Have any suggestions for improvement
      hint: Suggest a feature or a way to improve the update process
      type: text
      options: []
      required: false
    - id: 4
      name: contact_preferred_method
      label: How can we contact you
      hint: Choose your preferred contact method
      type: select_one
      options:
      - Email
      - Phone
      - Chat
      - Meeting
      required: true
    - id: 5
      name: additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: meeting_date
