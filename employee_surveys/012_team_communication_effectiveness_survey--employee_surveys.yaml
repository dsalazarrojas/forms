inputSchema:
  type: object
  properties:
    title: Team Communication Effectiveness Survey
    pages:
    - id: 1
      name: page_1
      label: How frequently do you receive feedback from your team members?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: true
    - id: 2
      name: page_2
      label: What type of feedback do you usually receive from your team members?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Constructive
      - None
      required: true
    - id: 3
      name: page_3
      label: How often do you give feedback to your team members?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: true
    - id: 4
      name: page_4
      label: How would you rate the quality of feedback you receive from your team
        members?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 5
      name: page_5
      label: How would you rate the quality of feedback you give to your team members?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 6
      name: page_6
      label: How satisfied are you with the communication style of your team leader?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
