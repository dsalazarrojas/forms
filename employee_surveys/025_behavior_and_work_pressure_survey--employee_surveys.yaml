inputSchema:
  type: object
  properties:
    title: Behavior And Work Pressure Survey
    pages:
      - id: 1
        name: employee_name
        label: Full Name
        hint: Optional - you may remain anonymous
        type: text
        options: []
        required: false
      - id: 2
        name: employee_id
        label: Employee ID
        hint: If applicable
        type: text
        options: []
        required: false
      - id: 3
        name: department
        label: Department
        hint: Which department do you work in
        type: select_one
        options:
          - Human Resources
          - Finance or Accounting
          - Marketing
          - Sales
          - Operations
          - IT or Technology
          - Customer Service
          - Engineering
          - Manufacturing
          - Healthcare
          - Education
          - Retail
          - Other
        required: true
      - id: 4
        name: position
        label: Position or Job Title
        hint: Your current role
        type: text
        options: []
        required: false
      - id: 5
        name: tenure
        label: How Long Have You Worked Here
        hint: Length of employment
        type: select_one
        options:
          - Less than 6 months
          - 6 months to 1 year
          - 1-3 years
          - 3-5 years
          - 5-10 years
          - Over 10 years
        required: true
      - id: 6
        name: work_hours
        label: Typical Work Hours
        hint: How many hours per week
        type: select_one
        options:
          - Less than 20 hours
          - 20-30 hours
          - 31-40 hours
          - 41-50 hours
          - More than 50 hours
        required: true
      - id: 7
        name: workload_manageable
        label: Workload Manageability
        hint: How manageable is your workload
        type: select_one
        options:
          - Very Manageable
          - Somewhat Manageable
          - Neutral
          - Somewhat Unmanageable
          - Very Unmanageable
        required: true
      - id: 8
        name: deadline_pressure
        label: Deadline Pressure
        hint: How often do you feel pressured by deadlines
        type: select_one
        options:
          - Never
          - Rarely
          - Sometimes
          - Often
          - Always
        required: true
      - id: 9
        name: work_life_balance
        label: Work-Life Balance
        hint: How would you rate your work-life balance
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very Poor
        required: true
      - id: 10
        name: overtime_frequency
        label: Overtime Frequency
        hint: How often do you work overtime
        type: select_one
        options:
          - Never
          - Rarely
          - Sometimes
          - Often
          - Always
        required: true
      - id: 11
        name: stress_level
        label: Stress Level
        hint: How would you rate your stress level at work
        type: select_one
        options:
          - Very Low
          - Low
          - Moderate
          - High
          - Very High
        required: true
      - id: 12
        name: stress_source
        label: Primary Source of Stress
        hint: Select all that apply
        type: select_multiple
        options:
          - Heavy Workload
          - Tight Deadlines
          - Difficult Customers or Clients
          - Management Expectations
          - Lack of Resources
          - Work Conflict
          - Job Insecurity
          - Long Hours
          - Commute
          - Work Environment
          - Other
        required: true
      - id: 13
        name: support_from_management
        label: Support from Management
        hint: How supported do you feel by management
        type: select_one
        options:
          - Very Supported
          - Somewhat Supported
          - Neutral
          - Somewhat Unsupported
          - Very Unsupported
        required: true
      - id: 14
        name: support_from_colleagues
        label: Support from Colleagues
        hint: How supported do you feel by coworkers
        type: select_one
        options:
          - Very Supported
          - Somewhat Supported
          - Neutral
          - Somewhat Unsupported
          - Very Unsupported
        required: true
      - id: 15
        name: communication_quality
        label: Communication Quality
        hint: How would you rate communication in your team
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very Poor
        required: true
      - id: 16
        name: role_clarity
        label: Role Clarity
        hint: How clear are you about your responsibilities
        type: select_one
        options:
          - Very Clear
          - Somewhat Clear
          - Neutral
          - Somewhat Unclear
          - Very Unclear
        required: true
      - id: 17
        name: resources_adequate
        label: Resources Adequacy
        hint: Do you have adequate resources to do your job
        type: select_one
        options:
          - Yes always
          - Yes most of the time
          - Sometimes
          - Rarely
          - No never
        required: true
      - id: 18
        name: recognition
        label: Recognition for Work
        hint: How often do you receive recognition
        type: select_one
        options:
          - Very Often
          - Often
          - Sometimes
          - Rarely
          - Never
        required: true
      - id: 19
        name: career_growth
        label: Career Growth Opportunities
        hint: Are there opportunities for advancement
        type: select_one
        options:
          - Yes many opportunities
          - Yes some opportunities
          - Neutral
          - Few opportunities
          - No opportunities
        required: true
      - id: 20
        name: job_satisfaction
        label: Job Satisfaction
        hint: How satisfied are you with your job
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 21
        name: burnout_symptoms
        label: Burnout Symptoms
        hint: Do you experience burnout symptoms
        type: select_multiple
        options:
          - Exhaustion
          - Cynicism
          - Reduced Performance
          - Insomnia
          - Anxiety
          - Depression
          - Physical Symptoms
          - None
        required: true
      - id: 22
        name: coping_mechanisms
        label: Coping Mechanisms
        hint: How do you cope with work pressure
        type: select_multiple
        options:
          - Exercise
          - Talking to Friends or Family
          - Meditation or Mindfulness
          - Hobbies
          - Time Management
          - Taking Breaks
          - Professional Help
          - Other
          - None
        required: true
      - id: 23
        name: would_recommend
        label: Would Recommend as Workplace
        hint: Would you recommend this company to friends
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Maybe
          - Probably No
          - Definitely No
        required: true
      - id: 24
        name: plan_to_stay
        label: Plan to Stay
        hint: Do you plan to stay with this company
        type: select_one
        options:
          - Yes long term
          - Yes for now
          - Unsure
          - Probably looking for other opportunities
          - Actively looking to leave
        required: true
      - id: 25
        name: suggestions
        label: Suggestions for Improvement
        hint: What could management do to reduce work pressure
        type: text
        options: []
        required: false
      - id: 26
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback about your work experience
        type: text
        options: []
        required: false
