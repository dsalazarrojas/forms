inputSchema:
  type: object
  properties:
    title: Employee Grievance Handling Evaluation Form
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: grievance_description
      label: Grievance Description
      hint: Briefly describe the issue
      type: text
      options: []
      required: false
    - id: 4
      name: resolution
      label: Resolution
      hint: Describe how the issue was resolved
      type: text
      options: []
      required: false
    - id: 5
      name: manager_comment
      label: Manager Comments
      hint: Manager Comments (if any)
      type: text
      options: []
      required: false
    - id: 6
      name: employee_comment
      label: Employee Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: resolution_outcome
      label: Resolution Outcome
      hint: Select an outcome for the resolution
      type: select_one
      options:
      - Not Resolved
      - Partially Resolved
      - Fully Resolved
      required: true
    - id: 8
      name: employee_satisfaction
      label: Employee Satisfaction
      hint: Rate your satisfaction on a scale of 1-5
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 9
      name: feedback
      label: Feedback
      hint: Provide any additional feedback
      type: text
      options: []
      required: false
