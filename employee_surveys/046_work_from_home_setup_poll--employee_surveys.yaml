      name: work_from_home_setup_poll_20
      label: Do you think you will continue working from home in the future?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: work_from_home_setup_poll_21
      label: How many days do you usually work from home?
      hint: null
      type: select_multiple
      options:
      - Every day
      - Most days
      - Few days a week
      - Rarely
      required: false
    - id: 23
      name: work_from_home_setup_poll_22
      label: How many hours do you usually work from home?
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: work_from_home_setup_poll_23
      label: Do you have any suggestions for improving work from home experience?
      hint: Please provide any suggestions you have for improving work from home experience.
      type: text
      options: []
      required: false
    - id: 25
      name: work_from_home_setup_poll_24
      label: Is this your usual experience working from home?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
