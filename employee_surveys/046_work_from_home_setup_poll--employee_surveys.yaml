      name: work_from_home_setup_poll_16
      label: How much time do you spend on breaks?
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: work_from_home_setup_poll_17
      label: How much time do you spend on commuting?
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: work_from_home_setup_poll_18
      label: Do you have a separate workspace for work and personal activities?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 20
      name: work_from_home_setup_poll_19
      label: How many hours of work experience do you have working from home?
      hint: null
      type: number
      options: []
      required: false
