inputSchema:
  type: object
  properties:
    title: Work From Home Setup Poll
    pages:
    - id: 1
      name: work_from_home_setup_poll_form
      label: Work From Home Setup Poll
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: work_from_home_setup_poll_1
      label: What type of work do you do from home?
      hint: null
      type: select_one
      options:
      - Development
      - Sales
      - Customer Service
      - Management
      - Other
      required: false
    - id: 3
      name: work_from_home_setup_poll_2
      label: How many hours do you work from home?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: work_from_home_setup_poll_3
      label: What type of computer do you use?
      hint: null
      type: select_multiple
      options:
      - Laptop
      - Desktop
      - Other
      - Mac
      required: false
    - id: 5
      name: work_from_home_setup_poll_4
      label: What is your work schedule like?
      hint: null
      type: select_multiple
      options:
      - Mon-Fri, 8-5
      - Mon-Fri, 9-6
      - Mon-Thu, 8-4
      - Mon-Thu, 9-5
      - Other
      required: false
    - id: 6
      name: work_from_home_setup_poll_5
      label: What is your home office setup like?
      hint: Describe your home office setup, including space for video conferences,
        internet, and other essential equipment.
      type: text
      options: []
      required: false
    - id: 7
      name: work_from_home_setup_poll_6
      label: Do you have a designated workspace?
      hint: null
      type: select_one
      options:
      - Yes, it's a dedicated space
      - No, I work from anywhere
      - Sometimes, it depends on the day
      required: false
    - id: 8
      name: work_from_home_setup_poll_7
      label: How do you handle meetings and calls?
      hint: null
      type: select_multiple
      options:
      - Use video conferencing software
      - Email or text
      - Phone
      - In-person
      required: false
    - id: 9
      name: work_from_home_setup_poll_8
      label: Have you had any IT support issues while working from home?
      hint: null
      type: select_multiple
      options:
      - Yes, frequently
      - Yes, rarely
      - 'False'
      required: false
    - id: 10
      name: work_from_home_setup_poll_9
      label: How do you stay connected with your team while working from home?
      hint: null
      type: select_multiple
      options:
      - Regular video calls
      - Email and instant messaging
      - In-person meetings
      - Other
      required: false
    - id: 11
      name: work_from_home_setup_poll_10
      label: Are you able to work effectively in a quiet space?
      hint: null
      type: select_one
      options:
      - 'True'
      - No, it depends on the day
      - 'False'
      required: false
    - id: 12
      name: work_from_home_setup_poll_11
      label: Do you feel supported in your remote work environment?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: work_from_home_setup_poll_12
      label: Have you experienced any difficulties related to remote work?
      hint: null
      type: select_multiple
      options:
      - Difficulty staying connected with team
      - Difficulty with time zone challenges
      - Difficulty with technology integration
      - Difficulty with communication challenges
      required: false
    - id: 14
      name: work_from_home_setup_poll_13
      label: How do you usually access your work computer at home?
      hint: null
      type: select_multiple
      options:
      - Cable internet
      - Wi-Fi
      - Other
      required: false
    - id: 15
      name: work_from_home_setup_poll_14
      label: How many people usually work from home with you?
      hint: null
      type: select_multiple
      options:
