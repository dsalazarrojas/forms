inputSchema:
  type: object
  properties:
    title: Online Scholarship Application Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: scholarship_program
      label: Scholarship Program
      hint: null
      type: select_multiple
      options:
      - Scholarship A
      - Scholarship B
      - Scholarship C
      required: false
    - id: 5
      name: academic_program
      label: Academic Program
      hint: null
      type: select_one
      options:
      - Program A
      - Program B
      - Program C
      required: false
    - id: 6
      name: academic_level
      label: Academic Level
      hint: null
      type: select_one
      options:
      - High School
      - Bachelor
      - Master
      - PhD
      required: false
    - id: 7
      name: current_level
      label: Current Level
      hint: null
      type: select_multiple
      options:
      - High School
      - Bachelor
      - Master
      - PhD
      required: false
    - id: 8
      name: upload_resume
      label: Resume
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: upload_transcript
      label: Transcript
      hint: null
      type: text
      options: []
      required: false
