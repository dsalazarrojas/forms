inputSchema:
  type: object
  properties:
    title: Scholarship Period Extension Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: reason_for_extension
      label: Reason for Extension
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: supporting_documentation
      label: Supporting Documentation
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: academic_program
      label: Academic Program
      hint: null
      type: select_one
      options:
      - Bachelor of Arts and Sciences
      - Bachelor of Science
      - Master of Arts and Sciences
      - Master of Science
      - PhD
      required: false
    - id: 7
      name: current_academic_year
      label: Current Academic Year
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: requested_extension_date
      label: Requested Extension Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: supporting_documentation_2
      label: Additional Supporting Documentation
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
