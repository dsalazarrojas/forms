inputSchema:
  type: object
  properties:
    title: Bioinformatics In Medicine Fellowship Application Form
    pages:
    - id: 1
      name: applicant_information
      label: -- Applicant Information --
      hint: Provide your contact and demographic information
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: As shown on official documents
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For correspondence about your application
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: current_affiliation
      label: Current affiliation
      hint: Institution or employer
      type: text
      options: []
      required: false
    - id: 6
      name: highest_degree
      label: Highest degree obtained
      hint: Degree and granting institution
      type: text
      options: []
      required: true
    - id: 7
      name: research_experience_summary
      label: Research experience summary
      hint: Brief summary of relevant experience
      type: text
      options: []
      required: true
    - id: 8
      name: publications_or_preprints
      label: Publications or preprints
      hint: List major publications or provide links
      type: text
      options: []
      required: false
    - id: 9
      name: statement_of_intent
      label: Statement of intent
      hint: Describe your interest and goals for the fellowship
      type: text
      options: []
      required: true
    - id: 10
      name: references
      label: References
      hint: Provide names and contact details for two references
      type: text
      options: []
      required: true
    - id: 11
      name: availability_date
      label: Availability start date
      hint: When you could begin the fellowship
      type: date
      options: []
      required: false
    - id: 12
      name: curriculum_vitae_note
      label: Curriculum vitae
      hint: Please upload CV through the portal or provide a link
      type: note
      options: []
      required: true
