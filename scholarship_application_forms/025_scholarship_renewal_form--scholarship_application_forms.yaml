inputSchema:
  type: object
  properties:
    title: Scholarship Renewal Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: student_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: program_start_date
      label: Program Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: program_end_date
      label: Program End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: reason_for_renewal
      label: Reason for Renewal
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: current_academic_status
      label: Current Academic Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - On Leave of Absence
      - Terminated
      - Withdrawn
      - Suspended
      required: true
    - id: 8
      name: financial_status
      label: Financial Status
      hint: null
      type: select_multiple
      options:
      - Full
      - Partial
      - Unfunded
      - None
      required: true
    - id: 9
      name: expected_degree_earnings
      label: Expected Degree Earnings
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: academic_progress
      label: Academic Progress
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: student_status_update
      label: Student Status Update
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: program_completion_date
      label: Program Completion Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: student_signature
      label: Student Signature
      hint: null
      type: note
      options: []
      required: false
