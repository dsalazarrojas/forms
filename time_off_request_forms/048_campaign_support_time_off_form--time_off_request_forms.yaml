inputSchema:
  type: object
  properties:
    title: Campaign Support Time Off Form
    pages:
      - id: 1
        name: employee_name
        label: Employee Name
        hint: Name of staff requesting time off
        type: text
        options: []
        required: true
      - id: 2
        name: role
        label: Role
        hint: Job role or assignment in campaign
        type: text
        options: []
        required: false
      - id: 3
        name: start_date
        label: Start Date of Time Off
        hint: First day of requested leave
        type: date
        options: []
        required: true
      - id: 4
        name: end_date
        label: End Date of Time Off
        hint: Last day of requested leave
        type: date
        options: []
        required: true
      - id: 5
        name: leave_type
        label: Leave Type
        hint: Type of leave requested
        type: select_one
        options: [Vacation, Personal, Medical, Other]
        required: true
      - id: 6
        name: reason
        label: Reason for Time Off
        hint: Optional brief explanation
        type: text
        options: []
        required: false
      - id: 7
        name: coverage_plan
        label: Coverage Plan
        hint: How duties will be covered during absence
        type: text
        options: []
        required: true
      - id: 8
        name: manager_approval
        label: Manager Approval
        hint: Manager name approving the request
        type: text
        options: []
        required: true
      - id: 9
        name: contact_while_away
        label: Contact While Away
        hint: Preferred contact method during leave
        type: select_one
        options: [Email, Phone, No Contact]
        required: false
      - id: 10
        name: additional_info
        label: Additional Information
        hint: Any other notes for HR or campaign leadership
        type: text
        options: []
        required: false
