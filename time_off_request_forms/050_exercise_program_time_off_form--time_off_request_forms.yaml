inputSchema:
  type: object
  properties:
    title: Exercise Program Time Off Form
    pages:
    - id: 1
      name: employee_request
      label: Employee Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: exercise_type
      label: Exercise Type
      hint: null
      type: select_one
      options:
      - Running
      - Biking
      - Swimming
      - Hiking
      - Dancing
      - Other
      required: false
    - id: 7
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: approval_status
      label: Approval Status
      hint: null
      type: select_multiple
      options:
      - Pending
      - Approved
      - Denied
      required: false
    - id: 9
      name: approved_by
      label: Approved By
      hint: null
      type: select_one
      options:
      - John
      - Jane
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
