inputSchema:
  type: object
  properties:
    title: Focus Group Time Off Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: select_one
      options:
      - User Input 1
      - User Input 2
      - User Input 3
      required: false
    - id: 2
      name: focus_group_name
      label: focus_group_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: time_off_start_date
      label: time_off_start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_off_end_date
      label: time_off_end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: reason_for_request
      label: reason_for_request
      hint: null
      type: select_one
      options:
      - Meeting
      - Training
      - Conference
      required: false
    - id: 6
      name: approval_status
      label: approval_status
      hint: null
      type: select_multiple
      options:
      - Approved
      - Denied
      - Pending
      required: false
    - id: 7
      name: manager_name
      label: manager_name
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Bob
      required: false
    - id: 8
      name: manager_comments
      label: manager_comments
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - N/A
      required: false
    - id: 9
      name: employee_name
      label: employee_name
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Bob
      required: false
    - id: 10
      name: department
      label: department
      hint: null
      type: select_multiple
      options:
      - Sales
      - Marketing
      - Support
      required: false
