inputSchema:
  type: object
  properties:
    title: Internal Review Time Off Form
    pages:
    - id: 1
      name: job_title
      label: Job Title
      hint: null
      type: select_one
      options:
      - Job Title 1
      - Job Title 2
      required: true
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: reason
      label: Reason for Time Off
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: has_meeting_or_event
      label: Meetings or Events
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: paid_off
      label: Paid Time Off
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: vacation_or_personal
      label: Vacation or Personal Reasons
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: comments
      label: Comments or Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: additional_information
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: time_off_duration
      label: Time Off Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: start_date_2
      label: End Date
      hint: null
      type: date
      options: []
      required: true
