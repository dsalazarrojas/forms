inputSchema:
  type: object
  properties:
    title: Leave Request Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: reason_for_leave
      label: Reason for Leave
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: leave_type
      label: Leave Type
      hint: null
      type: select_multiple
      options:
      - Leave for Vacation
      - Leave for Sick
      - Leave for Emergency
      required: false
    - id: 6
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: leave_duration
      label: Leave Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: leave_status
      label: Leave Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Declined
      - Cancelled
      required: false
    - id: 9
      name: manager_comments
      label: Manager Comments
      hint: null
      type: text
      options: []
      required: false
