inputSchema:
  type: object
  properties:
    title: Client Leave Of Absence Notification
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: advisor_name
      label: Advisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: section_leave_details
      label: -- Leave Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: return_date
      label: Anticipated Return Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: absence_reason
      label: Primary Reason for Absence
      hint: null
      type: select_one
      options:
      - Medical
      - Personal
      - Travel
      - Professional
      - Other
      required: true
    - id: 7
      name: section_continuity
      label: -- Availability and Continuity --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: reachability
      label: Will you be reachable during this period?
      hint: null
      type: select_one
      options:
      - Yes - Email Only
      - Yes - Phone and Email
      - 'False'
      required: true
    - id: 9
      name: urgent_contact
      label: Urgent contact information during absence
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: pending_items
      label: Are there any pending items that require immediate attention?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: designated_contact
      label: Designated contact person for your accounts (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: additional_instructions
      label: Additional comments or instructions
      hint: null
      type: text
      options: []
      required: false
