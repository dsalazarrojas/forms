inputSchema:
  type: object
  properties:
    title: Girl Scout Product Permission Form
    pages:
    - id: 1
      name: submitter_info
      label: Submitter Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: unit_products
      label: Girl Scout Products Purchased for Unit
      hint: null
      type: select_multiple
      options:
      - Yes, I purchased for my unit.
      - No, I did not purchase for my unit.
      - Other (please specify)
      required: false
    - id: 3
      name: other_units
      label: Purchased Girl Scout Products for Other Units?
      hint: null
      type: radio
      options:
      - 'Yes'
      - 'No'
      - Other (please specify)
      required: false
    - id: 4
      name: other_units_products
      label: What type of Girl Scout products did you purchase for other units?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: review_info
      label: Submitter Information Review
      hint: null
      type: text
      options: []
      required: false
