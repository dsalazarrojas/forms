inputSchema:
  type: object
  properties:
    title: Classroom Support Agreement
    pages:
    - id: 1
      name: section_header_student
      label: -- Student Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Full name of the student
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID Number
      hint: Student identification number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Student date of birth
      type: date
      options: []
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Current grade level
      type: select_one
      options:
      - Kindergarten
      - Grade 1-2
      - Grade 3-5
      - Grade 6-8
      - Grade 9-12
      required: true
    - id: 6
      name: classroom_teacher
      label: Classroom Teacher
      hint: Name of the primary classroom teacher
      type: text
      options: []
      required: true
    - id: 7
      name: classroom_number
      label: Classroom Number
      hint: Room number or location
      type: text
      options: []
      required: true
    - id: 8
      name: section_header_support
      label: -- Support Services --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: support_type_needed
      label: Type of Support Needed
      hint: Select all applicable support services
      type: select_multiple
      options:
      - One-on-One Paraprofessional Support
      - Small Group Instruction
      - Speech Therapy
      - Occupational Therapy
      - Physical Therapy
      - Behavioral Support
      - Academic Intervention
      - Assistive Technology Support
      - Transportation Assistance
      - Other
      required: true
    - id: 10
      name: support_frequency
      label: Support Frequency
      hint: How often will support be provided
      type: select_one
      options:
      - Daily - Full day
      - Daily - Partial day
      - Several times per week
      - Once per week
      - As needed
      - Other schedule
      required: true
    - id: 11
      name: support_duration
      label: Support Duration
      hint: How long will support services be provided
      type: text
      options: []
      required: true
    - id: 12
      name: support_start_date
      label: Support Start Date
      hint: When will support services begin
      type: date
      options: []
      required: true
    - id: 13
      name: support_end_date
      label: Support End Date or Review Date
      hint: When will services be reviewed or end
      type: date
      options: []
      required: false
    - id: 14
      name: support_goals
      label: Support Goals and Objectives
      hint: What are the specific goals for this support
      type: text
      options: []
      required: true
    - id: 15
      name: accommodations_needed
      label: Accommodations Needed
      hint: List any classroom accommodations required
      type: text
      options: []
      required: true
    - id: 16
      name: modifications_needed
      label: Modifications Needed
      hint: List any curriculum modifications required
      type: text
      options: []
      required: false
    - id: 17
      name: section_header_team
      label: -- Support Team --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: case_manager_name
      label: Case Manager Name
      hint: Name of the case manager coordinating services
      type: text
      options: []
      required: true
    - id: 19
      name: case_manager_email
      label: Case Manager Email
      hint: Contact email for case manager
      type: email
      options: []
      required: true
    - id: 20
      name: case_manager_phone
      label: Case Manager Phone
      hint: Contact phone for case manager
      type: text
      options: []
      required: true
    - id: 21
      name: paraprofessional_assigned
      label: Paraprofessional Assigned
      hint: Name of assigned paraprofessional if applicable
      type: text
      options: []
      required: false
    - id: 22
      name: related_service_providers
      label: Related Service Providers
      hint: Names of therapists or specialists involved
      type: text
      options: []
      required: false
    - id: 23
      name: section_header_parent
      label: -- Parent or Guardian Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name of parent or guardian
      type: text
      options: []
      required: true
    - id: 25
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 26
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 27
      name: parent_consent
      label: Parent or Guardian Consent
      hint: Do you consent to the support services outlined
      type: select_one
      options:
      - Yes - I consent to all services listed
      - Yes - I consent with modifications
      - No - I need to discuss further
      required: true
    - id: 28
      name: parent_comments
      label: Parent or Guardian Comments
      hint: Any questions or concerns from parents
      type: text
      options: []
      required: false
    - id: 29
      name: section_header_signatures
      label: -- Signatures and Approvals --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: teacher_signature
      label: Classroom Teacher Signature (Type Full Name)
      hint: Teacher electronic signature
      type: text
      options: []
      required: true
    - id: 31
      name: teacher_signature_date
      label: Teacher Signature Date
      hint: Date of teacher signature
      type: date
      options: []
      required: true
    - id: 32
      name: administrator_signature
      label: Administrator Signature (Type Full Name)
      hint: Administrator electronic signature
      type: text
      options: []
      required: true
    - id: 33
      name: administrator_signature_date
      label: Administrator Signature Date
      hint: Date of administrator signature
      type: date
      options: []
      required: true
    - id: 34
      name: parent_signature
      label: Parent or Guardian Signature (Type Full Name)
      hint: Parent electronic signature
      type: text
      options: []
      required: true
    - id: 35
      name: parent_signature_date
      label: Parent Signature Date
      hint: Date of parent signature
      type: date
      options: []
      required: true
