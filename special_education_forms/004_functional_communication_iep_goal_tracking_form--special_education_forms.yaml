inputSchema:
  type: object
  properties:
    title: Functional Communication IEP Goal Tracking Form
    pages:
    - id: 1
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: session_notes
      label: Session Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: goal_area
      label: Goal Area
      hint: null
      type: select_one
      options:
      - Goal Area 1
      - Goal Area 2
      - Goal Area 3
      required: true
    - id: 5
      name: objective
      label: Objective
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: progress_level
      label: Progress Level
      hint: null
      type: select_multiple
      options:
      - Level 1
      - Level 2
      - Level 3
      required: true
    - id: 7
      name: target_date
      label: Target Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
