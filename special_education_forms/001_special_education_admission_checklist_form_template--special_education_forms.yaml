inputSchema:
  type: object
  properties:
    title: Special Education Admission Checklist Form Template
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: birthdate
      label: Birthdate
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: student_type
      label: Student Type
      hint: null
      type: select_one
      options:
      - Student with disability
      - Student with medical exception
      - Student with other disability
      required: false
    - id: 5
      name: student_status
      label: Student Status
      hint: null
      type: select_multiple
      options:
      - Currently enrolled
      - New transfer student
      - Returning student
      required: false
