inputSchema:
  type: object
  properties:
    title: Special Education Training Registration Form
    pages:
    - id: 1
      name: training_program
      label: What type of training are you registering for?
      hint: null
      type: select_one
      options:
      - Special Needs
      - Regular Training
      - Other
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Cash
      - Check
      - Bank Transfer
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
