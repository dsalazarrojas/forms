inputSchema:
  type: object
  properties:
    title: Brokerage Information Collection Form
    pages:
    - id: 1
      name: client_full_name
      label: Client Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Preferred contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: property_interest
      label: Type of Property You are Interested In
      hint: Select all that apply
      type: select_multiple
      options:
      - Single Family Home
      - Condo
      - Multi-Family
      - Land
      - Commercial
      - Investment Property
      required: true
    - id: 5
      name: buyer_or_seller
      label: Are you a Buyer or Seller
      hint: null
      type: select_one
      options:
      - Buyer
      - Seller
      - Both
      required: true
    - id: 6
      name: budget_range
      label: Budget Range
      hint: Approximate price range
      type: select_one
      options:
      - Under $250,000
      - $250,000 - $500,000
      - $500,000 - $1,000,000
      - $1,000,000 - $2,000,000
      - Over $2,000,000
      required: false
    - id: 7
      name: timeline
      label: Transaction Timeline
      hint: When are you looking to buy or sell
      type: select_one
      options:
      - Immediate
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - Flexible
      required: true
    - id: 8
      name: location_preference
      label: Preferred Location or City
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: bedrooms_needed
      label: Number of Bedrooms Needed
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: financing
      label: Will you need financing assistance
      hint: null
      type: select_one
      options:
      - Yes, I need a lender recommendation
      - Yes, I am pre-approved
      - No, paying cash
      - Undecided
      required: false
    - id: 11
      name: previous_experience
      label: Have you worked with a real estate agent before
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: referral_source
      label: How did you hear about us
      hint: null
      type: select_one
      options:
      - Friend or Family Referral
      - Online Search
      - Social Media
      - Advertisement
      - Other
      required: false
    - id: 13
      name: special_requirements
      label: Any special requirements or preferences
      hint: Additional information we should know
      type: text
      options: []
      required: false
