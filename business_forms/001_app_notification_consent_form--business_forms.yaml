inputSchema:
  type: object
  properties:
    title: App Notification Consent Form
    pages:
    - id: 1
      name: notification_preferences
      label: -- Notification Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Please enter your complete name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: We will use this to send notifications
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Optional - for SMS notifications
      type: text
      options: []
      required: false
    - id: 5
      name: notification_types
      label: Which types of notifications would you like to receive?
      hint: Select all that apply
      type: select_multiple
      options:
      - Product updates
      - Promotions and offers
      - Account alerts
      - Weekly digest
      - Event invitations
      required: true
    - id: 6
      name: push_notifications
      label: Allow push notifications on mobile devices?
      hint: null
      type: select_one
      options:
      - Yes, enable push notifications
      - No, disable push notifications
      - Ask me each time
      required: true
    - id: 7
      name: notification_frequency
      label: How often would you like to receive notifications?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - As needed only
      required: true
    - id: 8
      name: preferred_time
      label: Preferred notification time
      hint: When should we send you notifications?
      type: select_one
      options:
      - Morning - 9 AM
      - Afternoon - 1 PM
      - Evening - 6 PM
      - Anytime
      required: false
    - id: 9
      name: communication_channel
      label: What is your preferred communication channel?
      hint: null
      type: select_one
      options:
      - Email
      - SMS
      - Mobile app
      - Web push notifications
      required: true
    - id: 10
      name: data_sharing_consent
      label: May we use your data to improve notification relevance?
      hint: We will analyze your preferences to send more targeted notifications
      type: select_one
      options:
      - I consent to data analysis
      - I do not consent
      required: true
    - id: 11
      name: notification_purposes
      label: Accept notifications for the following purposes?
      hint: Select all that apply
      type: select_multiple
      options:
      - Service improvements
      - Security alerts
      - Payment confirmations
      - Customer support
      - Research and feedback
      required: true
    - id: 12
      name: consent_acknowledgment
      label: I acknowledge that I have read and agreed to the notification policy
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 13
      name: additional_comments
      label: Additional preferences or comments
      hint: Optional - let us know any special requests
      type: text
      options: []
      required: false
