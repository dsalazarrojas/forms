inputSchema:
  type: object
  properties:
    title: Slip And Fall Incident Form
    pages:
    - id: 1
      name: incident_date
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: incident_location
      label: Location of Incident
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: incident_description
      label: Description of Incident
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: injuries_sustained
      label: Injuries Sustained
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: incident_type
      label: Type of Incident
      hint: null
      type: select_one
      options:
      - Fall
      - Slip
      - Trip
      - Other
      required: true
    - id: 7
      name: assistance_required
      label: Assistance Required
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: injuries_treated
      label: Injuries Treated
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Closed
      required: true
    - id: 10
      name: assigned_to
      label: Assigned to
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: employee_phone
      label: Employee Phone
      hint: 'Format: XXX-XXX-XXXX'
      type: text
      options: []
      required: true
    - id: 12
      name: employee_email
      label: Employee Email
      hint: 'Format: example@example.com'
      type: email
      options: []
      required: true
    - id: 13
      name: incident_status_note
      label: Incident Status Note
      hint: null
      type: note
      options: []
      required: false
