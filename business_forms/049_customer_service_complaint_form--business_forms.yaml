inputSchema:
  type: object
  properties:
    title: Customer Service Complaint Form
    pages:
    - id: 1
      name: customer_complaint_description
      label: Description of the Issue
      hint: Please provide a clear description of the problem
      type: text
      options: []
      required: true
    - id: 2
      name: incident_details
      label: Incident Details
      hint: Please provide as much information as possible about what happened
      type: text
      options: []
      required: true
    - id: 3
      name: incident_date
      label: Date of Incident
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 4
      name: incident_time
      label: Time of Incident
      hint: 12 -00 AM
      type: time
      options: []
      required: true
    - id: 5
      name: customer_contact_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: customer_contact_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: customer_contact_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: customer_service_contact
      label: How would you like to be contacted?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - In-Person
      required: true
    - id: 9
      name: resolution_preference
      label: Resolution Preference
      hint: null
      type: select_one
      options:
      - Immediate Resolution
      - Follow-up
      - No Preference
      required: true
