inputSchema:
  type: object
  properties:
    title: Business Plan Form
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Official business name
      type: text
      options: []
      required: true
    - id: 2
      name: business_description
      label: Business Description
      hint: What your business does
      type: text
      options: []
      required: true
    - id: 3
      name: mission_statement
      label: Mission Statement
      hint: Your business mission
      type: text
      options: []
      required: true
    - id: 4
      name: vision_statement
      label: Vision Statement
      hint: Your long-term vision
      type: text
      options: []
      required: true
    - id: 5
      name: core_values
      label: Core Values
      hint: Key values guiding business
      type: text
      options: []
      required: false
    - id: 6
      name: business_structure
      label: Business Structure
      hint: Type of legal entity
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - Corporation
      - S-Corporation
      - Non-profit
      - Other
      required: true
    - id: 7
      name: products_services
      label: Products or Services
      hint: What will you offer?
      type: text
      options: []
      required: true
    - id: 8
      name: target_market
      label: Target Market
      hint: Who are your customers?
      type: text
      options: []
      required: true
    - id: 9
      name: market_size
      label: Target Market Size
      hint: Estimated market opportunity
      type: text
      options: []
      required: false
    - id: 10
      name: competitive_advantage
      label: Competitive Advantage
      hint: What makes you unique?
      type: text
      options: []
      required: true
    - id: 11
      name: startup_capital_required
      label: Startup Capital Required
      hint: Initial investment needed
      type: number
      options: []
      required: true
    - id: 12
      name: funding_sources
      label: Funding Sources
      hint: How will you fund the business?
      type: text
      options: []
      required: false
    - id: 13
      name: revenue_model
      label: Revenue Model
      hint: How will you make money?
      type: text
      options: []
      required: true
    - id: 14
      name: projected_revenue_year1
      label: Projected Revenue Year 1
      hint: First year revenue estimate
      type: number
      options: []
      required: true
    - id: 15
      name: projected_revenue_year3
      label: Projected Revenue Year 3
      hint: Three year revenue estimate
      type: number
      options: []
      required: false
    - id: 16
      name: break_even_timeline
      label: Break-Even Timeline
      hint: When will you break even?
      type: text
      options: []
      required: false
    - id: 17
      name: key_team_members
      label: Key Team Members
      hint: List team members and roles
      type: text
      options: []
      required: true
    - id: 18
      name: marketing_strategy
      label: Marketing Strategy
      hint: How will you market?
      type: text
      options: []
      required: true
    - id: 19
      name: operational_plan
      label: Operational Plan
      hint: How will you operate?
      type: text
      options: []
      required: true
    - id: 20
      name: risk_mitigation
      label: Risk Mitigation Strategy
      hint: How will you manage risks?
      type: text
      options: []
      required: false
    - id: 21
      name: success_metrics
      label: Success Metrics
      hint: How will you measure success?
      type: text
      options: []
      required: false
    - id: 22
      name: long_term_goals
      label: Long-term Goals (5 years)
      hint: Where do you want to be?
      type: text
      options: []
      required: false
