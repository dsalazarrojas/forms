inputSchema:
  type: object
  properties:
    title: Loyalty Program Impact Report Form
    pages:
    - id: 1
      name: user_input_1
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: user_program
      label: Loyalty Program
      hint: null
      type: select_one
      options:
      - Loyalty Program A
      - Loyalty Program B
      - Loyalty Program C
      required: false
    - id: 4
      name: user_program_details
      label: Program Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: user_frequency
      label: Frequency
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: user_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: user_agree_1
      label: Program Effectiveness
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      required: false
    - id: 8
      name: user_agree_2
      label: User Agree 2
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: user_recommendations
      label: Recommendations
      hint: null
      type: select_multiple
      options:
      - Implement
      - Review
      - No Change
      required: true
    - id: 10
      name: user_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: user_time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: user_program_manager
      label: Program Manager
      hint: null
      type: text
      options: []
      required: true
