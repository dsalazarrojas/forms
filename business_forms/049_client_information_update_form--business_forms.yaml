inputSchema:
  type: object
  properties:
    title: Client Information Update Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: client_id_number
      label: Client ID or Account Number
      hint: Your account identifier
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: For verification
      type: date
      options: []
      required: false
    - id: 7
      name: update_type
      label: Type of Update
      hint: What are you updating?
      type: select_one
      options:
      - Contact Information
      - Address Change
      - Insurance Information
      - Emergency Contact
      - Payment Method
      - Medical Information
      - Preferences
      - Other
      required: true
    - id: 8
      name: old_address
      label: Previous Address
      hint: If moving
      type: text
      options: []
      required: false
    - id: 9
      name: new_address
      label: New Address
      hint: Complete new address
      type: text
      options: []
      required: false
    - id: 10
      name: new_city
      label: New City
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: new_state
      label: New State
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: new_zip
      label: New ZIP Code
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: new_email
      label: New Email Address
      hint: If changing
      type: email
      options: []
      required: false
    - id: 14
      name: new_phone
      label: New Phone Number
      hint: If changing
      type: text
      options: []
      required: false
    - id: 15
      name: new_insurance_provider
      label: New Insurance Provider
      hint: Company name
      type: text
      options: []
      required: false
    - id: 16
      name: new_policy_number
      label: New Policy Number
      hint: Policy ID
      type: text
      options: []
      required: false
    - id: 17
      name: new_emergency_contact_name
      label: New Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: false
    - id: 18
      name: new_emergency_contact_phone
      label: New Emergency Contact Phone
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 19
      name: new_emergency_contact_relationship
      label: New Emergency Contact Relationship
      hint: How are they related?
      type: text
      options: []
      required: false
    - id: 20
      name: new_payment_method
      label: New Payment Method
      hint: If changing
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Bank Transfer
      - Check
      - Cash
      - Insurance
      - No Change
      required: false
    - id: 21
      name: new_medical_conditions
      label: New Medical Conditions
      hint: Any new diagnoses
      type: text
      options: []
      required: false
    - id: 22
      name: new_medications
      label: New Medications
      hint: Any new prescriptions
      type: text
      options: []
      required: false
    - id: 23
      name: new_allergies
      label: New Allergies
      hint: Any new allergies
      type: text
      options: []
      required: false
    - id: 24
      name: communication_preferences
      label: Communication Preferences
      hint: How should we contact you?
      type: select_multiple
      options:
      - Email
      - Phone Call
      - Text Message
      - Mail
      - Portal Notifications
      required: false
    - id: 25
      name: update_reason
      label: Reason for Update
      hint: Why are you making this change?
      type: text
      options: []
      required: false
    - id: 26
      name: effective_date
      label: When Should This Take Effect?
      hint: Desired effective date
      type: date
      options: []
      required: true
    - id: 27
      name: information_accuracy
      label: I Confirm All Information Is Accurate
      hint: Truthfulness confirmation
      type: select_one
      options:
      - I Confirm
      - I Do Not Confirm
      required: true
    - id: 28
      name: update_date
      label: Update Date
      hint: null
      type: date
      options: []
      required: true
