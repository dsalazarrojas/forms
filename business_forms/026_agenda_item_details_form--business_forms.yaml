inputSchema:
  type: object
  properties:
    title: Agenda Item Details Form
    pages:
    - id: 1
      name: header
      label: -- Meeting Agenda Item Submission --
      hint: provide details for items to be discussed in the upcoming meeting
      type: note
      options: []
      required: false
    - id: 2
      name: submitter_name
      label: Name of Submitter
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department or Team
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: meeting_title
      label: Meeting Title
      hint: name of the specific meeting committee or event
      type: text
      options: []
      required: true
    - id: 5
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: details_header
      label: -- Agenda Item Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: agenda_topic
      label: Proposed Agenda Topic
      hint: clear and concise title for the item
      type: text
      options: []
      required: true
    - id: 8
      name: time_requested
      label: Time Requested - minutes
      hint: expected duration for this item
      type: number
      options: []
      required: true
    - id: 9
      name: item_type
      label: Item Type - Discussion, Decision, Information Only
      hint: select the purpose of the item
      type: select_one
      options:
      - Discussion (input sought)
      - Decision (vote required)
      - Information Only (no discussion)
      - Workshop / Activity
      required: true
    - id: 10
      name: background_context
      label: Brief background or context for the item
      hint: why is this being brought to the meeting
      type: text
      options: []
      required: true
    - id: 11
      name: desired_outcome
      label: Desired outcome or action required
      hint: what do you hope to achieve
      type: text
      options: []
      required: false
    - id: 12
      name: resources_needed
      label: Equipment or resources needed - Projector, Whiteboard, Handouts
      hint: select all that apply
      type: select_multiple
      options:
      - Projector and Screen
      - Whiteboard and Markers
      - Printed Handouts
      - Audio / Speakers
      - Video Conferencing Setup
      required: false
    - id: 13
      name: priority_level
      label: Priority Level - Low, Medium, High
      hint: null
      type: select_one
      options:
      - High (Urgent)
      - Medium (Normal)
      - Low (Optional)
      required: true
