inputSchema:
  type: object
  properties:
    title: Contact Sustainable Development Officer
    pages:
    - id: 1
      name: header
      label: -- Sustainability Inquiry --
      hint: Contact the Sustainable Development Officer with questions or proposals
      type: note
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Organization or affiliation
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email address
      hint: Email for follow up
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: Optional contact number
      type: text
      options: []
      required: false
    - id: 6
      name: inquiry_type
      label: Inquiry type
      hint: Select the nature of your sustainability inquiry
      type: select_one
      options:
      - Partnership
      - Reporting request
      - Complaint
      - General question
      required: true
    - id: 7
      name: project_or_issue_description
      label: Project or issue description
      hint: Describe the project or issue related to sustainability
      type: text
      options: []
      required: true
    - id: 8
      name: desired_outcome
      label: Desired outcome
      hint: What action or response are you seeking
      type: select_one
      options:
      - Information
      - Collaboration
      - Investigation
      - Other
      required: false
    - id: 9
      name: supporting_documents_note
      label: Attach supporting documents via email
      hint: Send reports or files to the provided email address
      type: note
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Any other context to help our sustainability team
      type: text
      options: []
      required: false
