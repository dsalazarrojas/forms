inputSchema:
  type: object
  properties:
    title: Community Association Candidate Nomination Form
    pages:
    - id: 1
      name: nomination_information
      label: Nomination Information
      hint: Details about the candidate nomination
      type: note
      options: []
      required: false
    - id: 2
      name: nomination_date
      label: Nomination Date
      hint: Date of this nomination
      type: date
      options: []
      required: true
    - id: 3
      name: nomination_id
      label: Nomination ID
      hint: Unique nomination reference number
      type: text
      options: []
      required: true
    - id: 4
      name: position_information
      label: Position Information
      hint: Details about the position being sought
      type: note
      options: []
      required: false
    - id: 5
      name: position_title
      label: Position Title
      hint: Which position is being nominated for
      type: select_one
      options:
      - Board President
      - Vice President
      - Secretary
      - Treasurer
      - Board Member
      - Committee Chair
      - Committee Member
      - Other
      required: true
    - id: 6
      name: term_length
      label: Term Length
      hint: Length of the term for this position
      type: text
      options: []
      required: false
    - id: 7
      name: election_date
      label: Election Date
      hint: When will the election be held
      type: date
      options: []
      required: false
    - id: 8
      name: candidate_information
      label: Candidate Information
      hint: Details about the nominated candidate
      type: note
      options: []
      required: false
    - id: 9
      name: candidate_name
      label: Candidate Name
      hint: Full name of the candidate
      type: text
      options: []
      required: true
    - id: 10
      name: candidate_email
      label: Candidate Email
      hint: Candidate email address
      type: email
      options: []
      required: true
    - id: 11
      name: candidate_phone
      label: Candidate Phone
      hint: Candidate phone number
      type: text
      options: []
      required: false
    - id: 12
      name: candidate_address
      label: Candidate Address
      hint: Candidate street address
      type: text
      options: []
      required: true
    - id: 13
      name: candidate_city
      label: Candidate City
      hint: Candidate city
      type: text
      options: []
      required: true
    - id: 14
      name: candidate_state
      label: Candidate State
      hint: Candidate state
      type: text
      options: []
      required: true
    - id: 15
      name: candidate_zip
      label: Candidate ZIP Code
      hint: Candidate ZIP code
      type: text
      options: []
      required: true
    - id: 16
      name: residency_status
      label: Residency Status
      hint: Is the candidate a resident of the community
      type: select_one
      options:
      - Yes - Homeowner
      - Yes - Renter
      - No - Non-Resident
      required: true
    - id: 17
      name: years_in_community
      label: Years in Community
      hint: How long has the candidate lived in the community
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 18
      name: nominator_information
      label: Nominator Information
      hint: Details about the person making the nomination
      type: note
      options: []
      required: false
    - id: 19
      name: nominator_name
      label: Nominator Name
      hint: Full name of the nominator
      type: text
      options: []
      required: true
    - id: 20
      name: nominator_email
      label: Nominator Email
      hint: Nominator email address
      type: email
      options: []
      required: true
    - id: 21
      name: nominator_phone
      label: Nominator Phone
      hint: Nominator phone number
      type: text
      options: []
      required: false
    - id: 22
      name: nominator_relationship
      label: Nominator Relationship
      hint: What is your relationship to the candidate
      type: select_one
      options:
      - Self-Nomination
      - Community Member
      - Family Member
      - Neighbor
      - Friend
      - Colleague
      required: true
    - id: 23
      name: candidate_qualifications
      label: Candidate Qualifications
      hint: What qualifies the candidate for this position
      type: text
      options: []
      required: true
    - id: 24
      name: previous_experience
      label: Previous Experience
      hint: Does the candidate have previous board experience
      type: select_one
      options:
      - Yes - Current Board Member
      - Yes - Former Board Member
      - Yes - Committee Experience
      - No - First Time
      required: true
    - id: 25
      name: candidate_statement
      label: Candidate Statement
      hint: A brief statement from the candidate
      type: text
      options: []
      required: false
    - id: 26
      name: candidate_acceptance
      label: Candidate Acceptance
      hint: Has the candidate accepted the nomination
      type: select_one
      options:
      - Yes - Accepted
      - Pending
      - No - Declined
      required: true
    - id: 27
      name: supporting_members
      label: Supporting Members
      hint: Number of community members supporting this nomination
      type: number
      options: []
      required: false
    - id: 28
      name: additional_comments
      label: Additional Comments
      hint: Any additional information about the nomination
      type: text
      options: []
      required: false
