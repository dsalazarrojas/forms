inputSchema:
  type: object
  properties:
    title: Client Pre Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: job_title
      label: Current Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: section_business_info
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: business_name
      label: Legal Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: business_structure
      label: Business Structure
      hint: null
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - Corporation
      required: true
    - id: 6
      name: years_in_business
      label: Years in Business
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: annual_revenue
      label: Estimated Annual Revenue
      hint: null
      type: select_one
      options:
      - Under $100
      - '0'
      - $100
      - 000 - $500
      - $500
      - 000 - $1
      - Over $1
      required: false
    - id: 8
      name: employee_count
      label: Number of Employees
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: section_application
      label: -- Application Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: application_purpose
      label: Primary Purpose of this Application
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: desired_service
      label: Desired Service or Product
      hint: null
      type: select_one
      options:
      - Business Loan
      - Consulting
      - Software License
      - Partnership
      required: true
    - id: 12
      name: previous_application
      label: Have you applied with our corporation before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: section_verification
      label: -- Contact and Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: business_website
      label: Business Website URL
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: contact_email
      label: Primary Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 16
      name: info_accuracy_cert
      label: I certify that all information provided in this pre-application is accurate
      hint: null
      type: select_one
      options:
      - 'True'
      - I certify
      required: true
