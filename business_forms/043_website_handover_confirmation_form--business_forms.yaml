inputSchema:
  type: object
  properties:
    title: Website Handover Confirmation Form
    pages:
    - id: 1
      name: page_1
      label: Website Details
      hint: Enter website name, URL and description.
      type: text
      options: []
      required: true
    - id: 2
      name: page_2
      label: Client Info
      hint: Client's Name and Email
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 3
      name: page_3
      label: Transfer Details
      hint: Specify transfer method and date.
      type: note
      options: []
      required: true
    - id: 4
      name: page_4
      label: Confirm Transfer
      hint: Confirm or deny transfer.
      type: select_multiple
      options:
      - Confirm
      - Cancel
      required: true
    - id: 5
      name: page_5
      label: Transfer Date
      hint: Enter transfer date.
      type: date
      options: []
      required: true
    - id: 6
      name: page_6
      label: Transfer Time
      hint: Enter transfer time.
      type: time
      options: []
      required: true
    - id: 7
      name: page_7
      label: Transfer Notes
      hint: Add notes for transfer.
      type: text
      options: []
      required: false
    - id: 8
      name: page_8
      label: Client Confirmations
      hint: Check confirmations
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 9
      name: page_9
      label: Confirmations
      hint: Finalize confirmations.
      type: select_one
      options:
      - Confirm
      - Not Confirm
      required: true
    - id: 10
      name: page_10
      label: Finalize Confirmations
      hint: Finalize confirmations.
      type: select_one
      options:
      - Confirm
      - Not Confirm
      required: true
    - id: 11
      name: page_11
      label: Client Notes
      hint: Client notes
      type: text
      options: []
      required: false
    - id: 12
      name: page_12
      label: Page 12
      hint: Confirm or deny finalize confirmations.
      type: select_one
      options:
      - Confirm
      - Not Confirm
      required: true
