inputSchema:
  type: object
  properties:
    title: Time Off Request Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: employee_phone
      label: Employee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_interval
      label: Time Interval
      hint: null
      type: select_one
      options:
      - '{''id'': 7, ''name'': ''Full Day Off''}'
      - '{''id'': 8, ''name'': ''Half Day Off''}'
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
