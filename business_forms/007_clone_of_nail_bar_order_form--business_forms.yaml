inputSchema:
  type: object
  properties:
    title: Clone Of Nail Bar Order Form
    pages:
    - id: 1
      name: header
      label: -- Order Form --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer name
      hint: Full name for the order
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: Email for confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: product_selected
      label: Product selected
      hint: Name of nail product
      type: text
      options: []
      required: true
    - id: 5
      name: quantity
      label: Quantity
      hint: Number of items
      type: number
      options: []
      required: true
    - id: 6
      name: pickup_or_delivery
      label: Pickup or delivery
      hint: Choose preferred method
      type: select_one
      options:
      - Pickup
      - Delivery
      required: true
    - id: 7
      name: delivery_address
      label: Delivery address
      hint: Required if delivery selected
      type: text
      options: []
      required: false
    - id: 8
      name: preferred_date
      label: Preferred pickup or delivery date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment method
      hint: Select payment option
      type: select_one
      options:
      - Credit card
      - Cash
      - PayPal
      required: true
    - id: 10
      name: order_notes
      label: Order notes
      hint: Custom requests or allergies
      type: text
      options: []
      required: false
