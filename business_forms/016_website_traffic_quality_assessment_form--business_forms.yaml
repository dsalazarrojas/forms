inputSchema:
  type: object
  properties:
    title: Website Traffic Quality Assessment Form
    pages:
    - id: 1
      name: form_header
      label: Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: website_traffic
      label: How often do you visit websites?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: user_behavior
      label: What type of behavior do you exhibit on our website?
      hint: null
      type: select_multiple
      options:
      - browsing
      - searching
      - scrolling
      - purchasing
      required: false
    - id: 4
      name: user_demographics
      label: What type of demographics do you identify with?
      hint: null
      type: select_multiple
      options:
      - male
      - female
      - age_16-25
      - age_26-35
      - age_36-45
      - age_46-55
      - age_56-65
      - other
      required: false
    - id: 5
      name: age_16_25
      label: 16-25
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: age_26_35
      label: 26-35
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: age_36_45
      label: 36-45
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: age_46_55
      label: 46-55
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: age_56_65
      label: 56-65
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: other_age
      label: Other
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: conversion_rates
      label: What are the conversion rates on your website?
      hint: null
      type: select_one
      options:
      - high
      - medium
      - low
      required: false
