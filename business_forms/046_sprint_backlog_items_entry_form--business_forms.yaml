inputSchema:
  type: object
  properties:
    title: Sprint Backlog Items Entry Form
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: task_id
      label: Task Id
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - open
      - in progress
      - done
      required: false
    - id: 4
      name: sprint_id
      label: Sprint Id
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - low
      - medium
      - high
      - critical
      required: false
    - id: 6
      name: estimated_time
      label: Estimated Time
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: actual_time
      label: Actual Time
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: team_members
      label: Team Members
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Jim
      - JIM
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - bug
      - feature
      - task
      - other
      required: false
    - id: 13
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Jim
      - JIM
      required: false
