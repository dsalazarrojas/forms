inputSchema:
  type: object
  properties:
    title: Booking Policies Acknowledgement Form
    pages:
    - id: 1
      name: customer_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 4
      name: booking_reference
      label: Booking Reference Number
      hint: Your booking confirmation number
      type: text
      options: []
      required: true
    - id: 5
      name: booking_date
      label: Booking Date
      hint: Date of this booking
      type: date
      options: []
      required: true
    - id: 6
      name: service_type
      label: Service Type
      hint: What service are you booking
      type: text
      options: []
      required: true
    - id: 7
      name: cancellation_policy
      label: Cancellation Policy
      hint: I have read and understand the cancellation policy
      type: select_one
      options:
      - Yes, I accept
      - No, I have questions
      - I need to review it
      required: true
    - id: 8
      name: refund_policy
      label: Refund Policy
      hint: I understand the refund conditions
      type: select_one
      options:
      - Yes, I accept
      - No, I have questions
      - Need clarification
      required: true
    - id: 9
      name: payment_terms
      label: Payment Terms
      hint: I agree to the payment terms
      type: select_one
      options:
      - Yes, I accept
      - No, I object
      - Need to discuss
      required: true
    - id: 10
      name: liability_clause
      label: Liability and Terms
      hint: I acknowledge the liability clause
      type: select_one
      options:
      - Yes, I accept
      - No, I have concerns
      - Need clarification
      required: true
    - id: 11
      name: privacy_policy
      label: Privacy Policy
      hint: I have read the privacy policy
      type: select_one
      options:
      - Yes, I accept
      - No, I have questions
      - Need to review
      required: true
    - id: 12
      name: terms_and_conditions
      label: Terms and Conditions
      hint: I agree to all terms and conditions
      type: select_one
      options:
      - Yes, I fully accept
      - No, I need modifications
      - I need to discuss further
      required: true
    - id: 13
      name: communication_consent
      label: Marketing Communication Consent
      hint: May we send you promotional communications
      type: select_one
      options:
      - Yes, send me promotions
      - No, I prefer not to receive them
      - Only essential communications
      required: false
    - id: 14
      name: special_conditions
      label: Special Conditions or Modifications
      hint: Any special conditions to acknowledge
      type: text
      options: []
      required: false
    - id: 15
      name: acknowledgement_date
      label: Acknowledgement Date
      hint: Today's date
      type: date
      options: []
      required: true
