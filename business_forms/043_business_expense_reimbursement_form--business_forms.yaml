inputSchema:
  type: object
  properties:
    title: Business Expense Reimbursement Form
    pages:
    - id: 1
      name: employee_info
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: Your ID number
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: true
    - id: 5
      name: manager_name
      label: Direct Manager Name
      hint: Your manager
      type: text
      options: []
      required: true
    - id: 6
      name: submission_date
      label: Submission Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 7
      name: reimbursement_period
      label: Reimbursement Period
      hint: Period covered by this claim
      type: text
      options: []
      required: true
    - id: 8
      name: expense_info
      label: -- Expense Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: expense_type
      label: Type of Expense
      hint: What category?
      type: select_one
      options:
      - Travel - Airfare
      - Travel - Ground Transportation
      - Travel - Parking and Tolls
      - Lodging
      - Meals
      - Entertainment
      - Office Supplies
      - Equipment
      - Professional Services
      - Other
      required: true
    - id: 10
      name: project_code
      label: Project Code
      hint: Associated project
      type: text
      options: []
      required: false
    - id: 11
      name: business_purpose
      label: Business Purpose
      hint: Why was this expense incurred?
      type: text
      options: []
      required: true
    - id: 12
      name: trip_destination
      label: Trip Destination or Location
      hint: Where did you go?
      type: text
      options: []
      required: false
    - id: 13
      name: travel_dates
      label: Travel Dates
      hint: Start and end dates
      type: text
      options: []
      required: false
    - id: 14
      name: expense_breakdown
      label: -- Expense Breakdown --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: expense_date
      label: Expense Date
      hint: When was expense incurred?
      type: date
      options: []
      required: true
    - id: 16
      name: vendor_name
      label: Vendor or Merchant Name
      hint: Where was it purchased?
      type: text
      options: []
      required: true
    - id: 17
      name: description
      label: Description of Expense
      hint: What was purchased?
      type: text
      options: []
      required: true
    - id: 18
      name: amount
      label: Expense Amount
      hint: Total amount
      type: number
      options: []
      required: true
    - id: 19
      name: currency
      label: Currency
      hint: Currency type
      type: text
      options: []
      required: false
    - id: 20
      name: total_reimbursement
      label: Total Reimbursement Requested
      hint: Sum of all expenses
      type: number
      options: []
      required: true
    - id: 21
      name: payment_method
      label: -- Payment Method --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: reimbursement_method
      label: Reimbursement Method
      hint: How to pay you?
      type: select_one
      options:
      - Direct Deposit
      - Check
      - Payroll Adjustment
      - Company Card Credit
      required: true
    - id: 23
      name: bank_info
      label: Bank Account for Direct Deposit
      hint: If applicable
      type: text
      options: []
      required: false
