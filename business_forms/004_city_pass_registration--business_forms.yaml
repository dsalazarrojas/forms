inputSchema:
  type: object
  properties:
    title: City Pass Registration
    pages:
    - id: 1
      name: personal_header
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: false
    - id: 6
      name: identification_header
      label: -- Identification and Residency --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: id_type
      label: Type of ID
      hint: null
      type: select_one
      options:
      - Passport
      - National ID card
      - Driver's license
      - Resident card
      - Other
      required: true
    - id: 8
      name: id_number
      label: ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: id_expiry_date
      label: ID Expiration Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: residency_status
      label: Current Residency Status
      hint: null
      type: select_one
      options:
      - Current resident - 1 year or more
      - Current resident - less than 1 year
      - Former resident
      - Not a resident
      required: true
    - id: 11
      name: address_header
      label: -- Address Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: postal_code
      label: Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: contact_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 17
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: pass_type
      label: City Pass Type Requested
      hint: null
      type: select_one
      options:
      - Annual resident pass
      - Student pass
      - Senior citizen pass
      - Temporary visitor pass
      - Family pass
      required: true
    - id: 19
      name: proof_of_residency_provided
      label: Proof of Residency Provided
      hint: Valid utility bill or lease agreement
      type: select_one
      options:
      - true
      - false
      - Will provide later
      required: true
    - id: 20
      name: terms_accepted
      label: I accept the City Pass terms and conditions
      hint: null
      type: select_one
      options:
      - Yes, I accept
      - No, I do not accept
      required: true
