inputSchema:
  type: object
  properties:
    title: Color Street Sample Request Form
    pages:
    - id: 1
      name: section_form_head
      label: -- Free Sample Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: form_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: form_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: form_shipping
      label: Complete Mailing Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_profile
      label: -- Tell Me More --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: sample_preference
      label: Which sample type would you like to try?
      hint: null
      type: select_one
      options:
      - Solid
      - Glitter
      - Designer Choice
      required: true
    - id: 7
      name: occupation
      label: What is your occupation?
      hint: Help us see how well Color Street holds up for you
      type: text
      options: []
      required: false
    - id: 8
      name: heard_from
      label: Who referred you or how did you find me?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: section_follow
      label: -- Next Steps --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: invite_to_group
      label: Can I invite you to my Facebook VIP group?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: fb_name
      label: Your Facebook Name (to find you)
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: future_orders
      label: Are you interested in purchasing full sets in the future?
      hint: null
      type: select_one
      options:
      - 'True'
      - Maybe
      - Just wanting a sample for now
      required: false
    - id: 13
      name: form_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
