inputSchema:
  type: object
  properties:
    title: Courier Reimbursement Form
    pages:
    - id: 1
      name: time_spent
      label: Time Spent
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: gas_cost
      label: Gas Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: additional_purchases
      label: Additional Purchases
      hint: null
      type: select_multiple
      options:
      - Parking
      - Tolls
      - Food
      required: false
    - id: 4
      name: total_reimbursement
      label: Total Reimbursement
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: Your email address for reimbursement
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: Optional phone number
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - admin jimmy
      required: false
