inputSchema:
  type: object
  properties:
    title: Lease Payment Form
    pages:
    - id: 1
      name: landlord_name
      label: Landlord Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: unit_number
      label: Unit Number
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: rent_amount
      label: Rent Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Check
      - Credit Card
      - Bank Account
      required: false
    - id: 6
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: lease_term
      label: Lease Term
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Annually
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: payment_gateway
      label: Payment Gateway
      hint: null
      type: select_one
      options:
      - PayPal
      - Stripe
      - Bank Transfer
      required: false
    - id: 13
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Declined
      required: false
