inputSchema:
  type: object
  properties:
    title: Freight Shipment Check Out Form
    pages:
    - id: 1
      name: shipper_name
      label: Shipper Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: contact_number
      hint: Enter a 10-digit phone number
      type: text
      options: []
      required: false
    - id: 3
      name: payment_gateway
      label: Payment Gateway
      hint: null
      type: select_one
      options:
      - '{''value'': ''Stripe''}'
      - '{''value'': ''Authorize''}'
      required: true
    - id: 4
      name: freight_weight
      label: Freight Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: Select your payment method
      type: select_one
      options:
      - '{''value'': ''Visa''}'
      - '{''value'': ''Mastercard''}'
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: date_shipped
      label: Date Shipped
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time_shipped
      label: Time Shipped
      hint: null
      type: time
      options: []
      required: false
