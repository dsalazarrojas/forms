inputSchema:
  type: object
  properties:
    title: Company Meeting Review Form
    pages:
      - id: 1
        name: meeting_title
        label: Meeting title
        hint: Name or purpose of the meeting
        type: text
        options: []
        required: true
      - id: 2
        name: meeting_date
        label: Meeting date
        hint: Date of the meeting
        type: date
        options: []
        required: true
      - id: 3
        name: attendee_name
        label: Attendee name
        hint: Optional for follow up
        type: text
        options: []
        required: false
      - id: 4
        name: meeting_effectiveness
        label: Meeting effectiveness
        hint: Rate how effective the meeting was
        type: select_one
        options: [Very effective, Effective, Neutral, Ineffective]
        required: true
      - id: 5
        name: key_takeaways
        label: Key takeaways
        hint: What were the main outcomes
        type: text
        options: []
        required: false
      - id: 6
        name: improvement_suggestions
        label: Suggestions for future meetings
        hint: Ideas to make meetings more productive
        type: text
        options: []
        required: false
