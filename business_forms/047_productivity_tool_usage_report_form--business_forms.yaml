inputSchema:
  type: object
  properties:
    title: Productivity Tool Usage Report Form
    pages:
    - id: 1
      name: report_form
      label: Report Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tool_selection
      label: Select Tools
      hint: Select the productivity tools used.
      type: select_multiple
      options:
      - Tools A
      - Tools B
      - Tools C
      required: false
