inputSchema:
  type: object
  properties:
    title: CDD Payment Submissions
    pages:
    - id: 1
      name: payment_submission_header
      label: -- Business Payment Submission Form --
      hint: Please provide accurate details to ensure timely processing of your payment.
      type: note
      options: []
      required: false
    - id: 2
      name: business_entity_name
      label: Business or Entity Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: tax_id_number_cdd
      label: Federal Tax ID or EIN
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_person_payment
      label: Contact Person for Billing
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: billing_email_cdd
      label: Billing Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: invoice_number_reference
      label: Invoice or Reference Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: payment_category_type
      label: Category of Payment
      hint: null
      type: select_one
      options:
      - Service Fees
      - Product Purchase
      - Licensing/Subscription
      - Retainer
      - Other
      required: true
    - id: 8
      name: currency_type_cdd
      label: Currency
      hint: null
      type: select_one
      options:
      - USD
      - EUR
      - GBP
      - CAD
      required: true
    - id: 9
      name: submission_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: intended_payment_method
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - ACH/Wire Transfer
      - Credit Card
      - Corporate Check
      - Digital Wallet
      required: true
    - id: 11
      name: payment_description_notes
      label: Description of Services/Goods
      hint: Briefly describe what this payment is for.
      type: text
      options: []
      required: true
    - id: 12
      name: recurring_payment_check
      label: Is this a recurring payment?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: internal_department_code
      label: Internal Dept/Cost Center Code
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 14
      name: submission_timestamp_cdd
      label: Date of Submission
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: attachment_confirmation_payment
      label: Have you attached the corresponding invoice?
      hint: Ensure the document is uploaded via our portal.
      type: select_one
      options:
      - Yes, attached
      - No, will send separately
      required: true
