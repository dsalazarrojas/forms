inputSchema:
  type: object
  properties:
    title: Audit Document Download Request Form
    pages:
      - id: 1
        name: requester_info_header
        label: -- Requester Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: full_name
        label: Full Name
        hint: Enter your complete legal name
        type: text
        options: []
        required: true
      - id: 3
        name: email_address
        label: Email Address
        hint: Use your professional organization email
        type: email
        options: []
        required: true
      - id: 4
        name: department
        label: Department
        hint: Your current department or unit
        type: text
        options: []
        required: true
      - id: 5
        name: job_title
        label: Job Title
        hint: Your official position title
        type: text
        options: []
        required: true
      - id: 6
        name: audit_details_header
        label: -- Audit Document Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: audit_type
        label: Audit Type
        hint: Select the category of audit documents requested
        type: select_one
        options:
          - Internal Audit
          - External Audit
          - Compliance Audit
          - Financial Audit
        required: true
      - id: 8
        name: document_reference_number
        label: Document Reference Number
        hint: Enter the specific ID or reference number if known
        type: text
        options: []
        required: false
      - id: 9
        name: audit_period_start
        label: Audit Period Start Date
        hint: The beginning of the timeframe for the requested records
        type: date
        options: []
        required: true
      - id: 10
        name: audit_period_end
        label: Audit Period End Date
        hint: The end of the timeframe for the requested records
        type: date
        options: []
        required: true
      - id: 11
        name: document_types
        label: Document Types Requested
        hint: Select all that apply
        type: select_multiple
        options:
          - Financial Statements
          - Audit Report
          - Working Papers
          - Risk Assessment
          - Governance Documentation
        required: true
      - id: 12
        name: purpose_of_request
        label: Purpose of Request
        hint: Provide a brief justification for accessing these documents
        type: text
        options: []
        required: true
      - id: 13
        name: required_by_date
        label: Required By Date
        hint: When do you need access to these documents?
        type: date
        options: []
        required: true
      - id: 14
        name: access_level
        label: Access Level Requested
        hint: Select the type of access permission needed
        type: select_one
        options:
          - Read Only
          - Download
          - Full Access
        required: true
      - id: 15
        name: authorization_header
        label: -- Authorization --
        hint: null
        type: note
        options: []
        required: false
      - id: 16
        name: supervisor_name
        label: Supervisor Name
        hint: Name of the person authorizing this request
        type: text
        options: []
        required: true
      - id: 17
        name: supervisor_email
        label: Supervisor Email
        hint: Authorized supervisor email address
        type: email
        options: []
        required: true
