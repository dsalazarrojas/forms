inputSchema:
  type: object
  properties:
    title: Appraisal Waiver Form
    pages:
    - id: 1
      name: property_details
      label: Property Details
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: property_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: property_county
      label: County
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: owner_info
      label: Property Owner Information
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: owner_name
      label: Owner Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: owner_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: owner_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: appraisal_waiver
      label: Appraisal Waiver Details
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: waiver_type
      label: Type of Waiver
      hint: null
      type: select_one
      options:
      - Physical Appraisal Not Required
      - Interior Inspection Waived
      - Exterior Inspection Waived
      - Full Waiver
      required: true
    - id: 11
      name: waiver_reason
      label: Reason for Waiver
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: effective_date
      label: Waiver Effective Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: understanding
      label: I understand the implications of this waiver
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
