inputSchema:
  type: object
  properties:
    title: equipment_rental_authorization_form
    pages:
    - id: 1
      name: rental_date
      label: Rental Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: equipment_description
      label: Equipment Description
      hint: Provide detailed information about the equipment being rented.
      type: text
      options: []
      required: false
    - id: 3
      name: equipment_type
      label: Equipment Type
      hint: null
      type: select_one
      options:
      - equipment type 1
      - equipment type 2
      required: false
    - id: 4
      name: rental_term
      label: Rental Term
      hint: null
      type: select_one
      options:
      - rental term 1
      - rental term 2
      - rental term 3
      - rental term 4
      - rental term 5
      required: false
    - id: 5
      name: rental_term_length
      label: Rental Term Length
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: equipment_status
      label: Equipment Status
      hint: null
      type: select_one
      options:
      - equipment status 1
      - equipment status 2
      - equipment status 3
      required: false
    - id: 7
      name: customer_signature
      label: Customer Signature
      hint: null
      type: note
      options: []
      required: false
