inputSchema:
  type: object
  properties:
    title: Refrigeration Leak Incident Report Form
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: leak_location
      label: Leak Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: leak_description
      label: Leak Description
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: cause_of_leak
      label: Cause Of Leak
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: repair_status
      label: Repair Status
      hint: null
      type: select_multiple
      options:
      - Complete
      - In Progress
      - Not Reported
      required: true
    - id: 6
      name: leak_type
      label: Leak Type
      hint: null
      type: select_one
      options:
      - Defect
      - Failure
      - Material Fault
      - Other
      required: true
    - id: 7
      name: leak_source
      label: Leak Source
      hint: null
      type: select_multiple
      options:
      - Valve
      - Pipe
      - Equipment
      - Other
      required: true
    - id: 8
      name: leak_size
      label: Leak Size
      hint: null
      type: number
      options: []
      required: true
