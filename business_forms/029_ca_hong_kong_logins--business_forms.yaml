inputSchema:
  type: object
  properties:
    title: Ca Hong Kong Logins
    pages:
    - id: 1
      name: header_logins
      label: -- Technical Access Management - HK --
      hint: Internal administrative record for login management
      type: note
      options: []
      required: false
    - id: 2
      name: system_name
      label: System or Platform Name
      hint: e.g. HK Server Alpha, Regional CRM
      type: text
      options: []
      required: true
    - id: 3
      name: environment_type
      label: Environment
      hint: null
      type: select_one
      options:
      - Production
      - Staging
      - Testing
      - Development
      required: true
    - id: 4
      name: server_address
      label: Server IP or URL
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: access_method
      label: Access Method
      hint: null
      type: select_one
      options:
      - Web Interface
      - SSH
      - RDP
      - VPN
      - API Key
      required: true
    - id: 6
      name: header_account_details
      label: -- Account Information --
      hint: DO NOT STORE ACTUAL PASSWORDS HERE
      type: note
      options: []
      required: false
    - id: 7
      name: admin_username
      label: Administrative Username
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: mfa_status
      label: MFA Enabled
      hint: Multi-Factor Authentication
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending Setup
      required: true
    - id: 9
      name: access_owner
      label: Primary Account Owner
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: last_password_reset
      label: Last Password Reset Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: header_technical_notes
      label: -- Technical Notes and Documentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: configuration_notes
      label: Specific Configuration Notes
      hint: port numbers, special flags, or dependencies
      type: text
      options: []
      required: true
    - id: 13
      name: dependencies
      label: System Dependencies
      hint: other systems this login depends on
      type: text
      options: []
      required: false
    - id: 14
      name: support_contact_hk
      label: Local HK Support Contact
      hint: person to contact for access issues in Hong Kong
      type: text
      options: []
      required: true
    - id: 15
      name: next_review_date
      label: Next Security Review Date
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: administrative_comment
      label: Administrative Comments
      hint: null
      type: text
      options: []
      required: false
