inputSchema:
  type: object
  properties:
    title: Simple Employee Application
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: Enter a job title
      type: text
      options: []
      required: false
    - id: 6
      name: company
      label: Company
      hint: Enter the name of the company you work for
      type: text
      options: []
      required: false
    - id: 7
      name: position
      label: Position
      hint: Enter your position within the company
      type: text
      options: []
      required: false
    - id: 8
      name: employment_type
      label: Employment Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Freelance
      required: true
    - id: 9
      name: job_start_date
      label: Job Start Date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 10
      name: job_end_date
      label: Job End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: job_title_notes
      label: Job Title Notes
      hint: Enter any notes regarding your job title
      type: note
      options: []
      required: false
    - id: 12
      name: company_notes
      label: Company Notes
      hint: Enter any notes regarding the company
      type: note
      options: []
      required: false
