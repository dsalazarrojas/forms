inputSchema:
  type: object
  properties:
    title: Sales Strategy Planning Appointment Form
    pages:
    - id: 1
      name: sales_strategy_planning_appointment_form_page
      label: What is the sales strategy for this appointment?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: appointment_details
      label: What date and time is the appointment scheduled for?
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: customer_meeting
      label: Who is the customer meeting this appointment?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: meeting_purpose
      label: What is the purpose of the meeting?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: meeting_duration
      label: How long is the meeting expected to last?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: revenue_potential
      label: What is the estimated revenue potential for this meeting?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: meeting_goals
      label: Are there any specific goals or objectives for this meeting?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: true
    - id: 8
      name: follow_up_meeting
      label: Is there a follow-up meeting scheduled after this appointment?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: additional_comments
      label: Additional comments or notes about the meeting?
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: challenges_concerns
      label: Are there any specific challenges or concerns about this meeting?
      hint: null
      type: text
      options: []
      required: true
