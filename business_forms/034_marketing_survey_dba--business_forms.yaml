inputSchema:
  type: object
  properties:
    title: marketing_survey_dba
    pages:
    - id: 1
      name: work_hours
      label: What is your average work hours per week?
      hint: Please enter a number
      type: number
      options: []
      required: true
    - id: 2
      name: favorite_dbms
      label: What is your favorite database management system?
      hint: Choose from the list
      type: select_multiple
      options:
      - MySQL
      - PostgreSQL
      - Microsoft SQL Server
      - Oracle
      - Other
      required: false
    - id: 3
      name: training_frequency
      label: How often do you attend training sessions or workshops?
      hint: Daily, Weekly, Monthly, Rarely
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 4
      name: preferred_work_time
      label: What is your preferred time to start work?
      hint: HH -MM format
      type: time
      options: []
      required: false
    - id: 5
      name: cloud_experience
      label: Have you ever used cloud-based services for database management?
      hint: Yes, No
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
