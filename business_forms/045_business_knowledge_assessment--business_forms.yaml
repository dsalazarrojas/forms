inputSchema:
  type: object
  properties:
    title: Business Knowledge Assessment
    pages:
    - id: 1
      name: section_assessment_participant
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_participant_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_department_assessment
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: years_of_business_experience_count
      label: Years of Professional Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: section_knowledge_competency
      label: -- Core Competency Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: basic_accounting_knowledge_level
      label: Level of Basic Accounting Knowledge
      hint: Understanding of P&L, Balance Sheets, and Budgeting
      type: select_one
      options:
      - Expert
      - Proficient
      - Basic
      - None
      required: true
    - id: 7
      name: company_strategy_understanding_score
      label: Understanding of Company Strategy
      hint: How well do you understand our current 3-year plan (1-5)
      type: number
      options: []
      required: true
    - id: 8
      name: compliance_requirements_knowledge_level
      label: Knowledge of Industry Compliance Requirements
      hint: e.g. Safety, Data Privacy, Financial Regulations
      type: select_one
      options:
      - Expert
      - Proficient
      - Basic
      - None
      required: true
    - id: 9
      name: market_competitor_awareness_score
      label: Awareness of Market Competitors
      hint: How well do you know our top 3 competitors (1-5)
      type: number
      options: []
      required: true
    - id: 10
      name: customer_service_principles_knowledge
      label: Understanding of Customer Service Principles
      hint: null
      type: select_one
      options:
      - Expert
      - Proficient
      - Basic
      - None
      required: true
    - id: 11
      name: business_ethics_knowledge_score
      label: Knowledge of Business Ethics and Conduct
      hint: Understanding of company ethical standards (1-5)
      type: number
      options: []
      required: true
    - id: 12
      name: section_training_needs_summary
      label: -- Training and Development --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: identified_training_needs_description
      label: Identified Training Needs or Interest
      hint: Areas where you would like more professional development
      type: text
      options: []
      required: false
    - id: 14
      name: knowledge_assessment_date_official
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: participant_acknowledgment_check
      label: I certify that I completed this assessment independently
      hint: null
      type: select_one
      options:
      - I Acknowledge
      - Other
      required: true
