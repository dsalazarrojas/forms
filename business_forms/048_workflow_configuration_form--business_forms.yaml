inputSchema:
  type: object
  properties:
    title: Workflow Configuration Form
    pages:
    - id: 1
      name: business_form
      label: Business form
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: workflow_name
      label: Workflow name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: start_date
      label: Start date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: end_date
      label: End date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: workflow_status
      label: Workflow status
      hint: null
      type: select_one
      options:
      - Draft
      - Review
      - Published
      required: true
    - id: 8
      name: assignee
      label: Assignee
      hint: null
      type: select_multiple
      options:
      - Jimmy
      - Tom
      - John
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
