    - id: 25
      name: overall_competency_rating
      label: Overall Competency Rating
      hint: Summary assessment
      type: select_one
      options:
      - Exceptional - exceeds all expectations
      - Strong - exceeds some expectations
      - Proficient - meets all expectations
      - Developing - meets some expectations
      - Needs Improvement - below expectations
      required: true
    - id: 26
      name: key_strengths
      label: Key Strengths
      hint: Top competencies demonstrated
      type: text
      options: []
      required: true
    - id: 27
      name: development_areas
      label: Areas for Development
      hint: Competencies to improve
      type: text
      options: []
      required: true
    - id: 28
      name: development_plan
      label: Recommended Development Plan
      hint: Suggested actions
      type: text
      options: []
      required: false
    - id: 29
      name: employee_comments
      label: Employee Comments
      hint: Employee response
      type: text
      options: []
      required: false
    - id: 30
      name: next_review_date
      label: Next Review Date
      hint: Follow-up assessment date
      type: date
      options: []
      required: false
