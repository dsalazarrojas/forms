inputSchema:
  type: object
  properties:
    title: Fleet Management Check In Form
    pages:
    - id: 1
      name: form_1
      label: Check Out Vehicle
      hint: null
      type: select_one
      options:
      - '{''text'': ''Select vehicle to check out'', ''value'': 1}'
      - '{''text'': ''No vehicle to check out'', ''value'': 2}'
      required: false
    - id: 2
      name: vehicle_number
      label: vehicle number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: odometer_reading
      label: odometer reading
      hint: Record the odometer reading
      type: text
      options: []
      required: false
    - id: 4
      name: fuel_level
      label: fuel level
      hint: Record the fuel level (gallon or percentage)
      type: text
      options: []
      required: false
    - id: 5
      name: fuel_type
      label: fuel type
      hint: null
      type: select_one
      options:
      - '{''text'': ''Gasoline"'', ''value'': 1}'
      - '{''text'': ''Diesel"'', ''value'': 2}'
      - '{''text'': ''Electric"'', ''value'': 3}'
      required: false
    - id: 6
      name: fuel_quantity
      label: fuel quantity
      hint: Record the amount of fuel used
      type: number
      options: []
      required: false
    - id: 7
      name: location
      label: location
      hint: Record the check out location
      type: text
      options: []
      required: false
    - id: 8
      name: check_out_date
      label: check out date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 9
      name: check_out_time
      label: check out time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: notes
      label: notes
      hint: Any notes?
      type: note
      options: []
      required: false
