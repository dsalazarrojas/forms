inputSchema:
  type: object
  properties:
    title: Quality Nonconformance Summary Report
    pages:
    - id: 1
      name: incident_details
      label: Incident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_severity
      label: Incident Severity
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 3
      name: incident_categorization
      label: Incident Categorization
      hint: null
      type: select_multiple
      options:
      - Defect
      - Non-Defect
      - Other
      required: false
    - id: 4
      name: description
      label: Description
      hint: Provide a detailed description of the incident
      type: text
      options: []
      required: false
    - id: 5
      name: corrective_action
      label: Corrective Action
      hint: Record the actions taken to correct the issue
      type: text
      options: []
      required: false
    - id: 6
      name: incident_date
      label: Incident Date
      hint: Date the issue occurred
      type: date
      options: []
      required: false
