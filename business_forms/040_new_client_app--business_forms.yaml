inputSchema:
  type: object
  properties:
    title: NEW Client App
    pages:
    - id: 1
      name: application_title
      label: Application Title
      hint: Please enter the title of the new client application.
      type: text
      options: []
      required: true
    - id: 2
      name: application_category
      label: Category
      hint: Select the category of the application.
      type: select_one
      options:
      - Business Forms
      - Personal Forms
      required: true
    - id: 3
      name: description
      label: Description
      hint: Please provide a brief description of the application.
      type: text
      options: []
      required: true
    - id: 4
      name: output_file
      label: Output File
      hint: Please enter any relevant output file information.
      type: text
      options: []
      required: true
    - id: 5
      name: assigned_tool
      label: Assigned Tool
      hint: Please enter the tool assigned to the application.
      type: text
      options: []
      required: true
    - id: 6
      name: form_ids
      label: Form IDs
      hint: Please enter any relevant form IDs.
      type: number
      options: []
      required: true
    - id: 7
      name: application_date
      label: Date
      hint: Please enter the application date.
      type: date
      options: []
      required: true
    - id: 8
      name: application_time
      label: Time
      hint: Please enter the application time.
      type: time
      options: []
      required: true
    - id: 9
      name: application_email
      label: Email
      hint: Please enter the email associated with the application.
      type: email
      options: []
      required: true
    - id: 10
      name: application_phone
      label: Phone Number
      hint: Please enter the phone number associated with the application.
      type: text
      options: []
      required: true
    - id: 11
      name: notes
      label: Notes
      hint: Please provide any additional notes about the application.
      type: note
      options: []
      required: true
    - id: 12
      name: form_ids_2
      label: Form IDs 2
      hint: Please enter any additional form IDs.
      type: number
      options: []
      required: true
