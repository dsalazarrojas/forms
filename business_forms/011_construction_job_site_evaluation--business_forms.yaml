inputSchema:
  type: object
  properties:
    title: Construction Job Site Evaluation
    pages:
    - id: 1
      name: section_eval_details
      label: -- Evaluation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: project_name
      label: Project Name/Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: eval_date
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: evaluator_name
      label: Evaluator's Name and Title
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: time_of_eval
      label: Time of Day
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: section_safety_assessment
      label: -- Site Safety Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: ppe_compliance
      label: Proper PPE is being worn by all workers
      hint: Hard hats, vests, eye protection, etc.
      type: select_one
      options:
      - Yes - 100% Compliance
      - Minor Infractions Noted
      - Major Non-Compliance
      required: true
    - id: 8
      name: housekeeping_rating
      label: Site Housekeeping and Cleanliness
      hint: Waste removal, clear walkways, organized materials
      type: select_one
      options:
      - Excellent
      - Acceptable
      - Needs Improvement
      - Poor
      required: true
    - id: 9
      name: first_aid_access
      label: First Aid Kit and Emergency Info Accessible
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: fire_extinguisher_check
      label: Fire Extinguishers Present and Inspected
      hint: Checked within the last month
      type: select_one
      options:
      - 'True'
      - 'False'
      - N/A for this site
      required: true
    - id: 11
      name: section_operational_check
      label: -- Operational and Hazard Check --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: hazard_signs_posted
      label: Necessary Safety/Hazard Signage Posted
      hint: Fall hazards, high voltage, etc.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: tool_equipment_condition
      label: General Condition of Tools and Equipment
      hint: Any visible defects or safety bypasses?
      type: select_one
      options:
      - Excellent
      - Good/Fair
      - Immediate Repair Required
      required: true
    - id: 14
      name: scaffolds_ladders_check
      label: Scaffolds and Ladders Secured and Safe
      hint: null
      type: select_one
      options:
      - Safe
      - Minor Adjustments Required
      - Immediate Shutdown Required
      - N/A
      required: true
    - id: 15
      name: hazard_description
      label: Description of Any Hazards Identified
      hint: Be as specific as possible regarding location and type
      type: text
      options: []
      required: false
    - id: 16
      name: section_final_summary
      label: -- Final Summary and Actions --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: overall_safety_rating
      label: Overall Site Safety Rating (1-10)
      hint: 1 - Extreme Risk, 10 - Highly Safe
      type: number
      options: []
      required: true
    - id: 18
      name: corrective_action_req
      label: Immediate Corrective Action Required?
      hint: If yes, describe the action taken below
      type: select_one
      options:
      - 'False'
      - Yes - Already Performed
      - Yes - Scheduled Immediately
      required: true
    - id: 19
      name: action_taken_desc
      label: Action Taken or Required
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: follow_up_date
      label: Required Follow-up Date
      hint: null
      type: date
      options: []
      required: false
