      name: confirm_phone
      label: Confirm Phone Number
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: confirm_email
      label: Confirm Email
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: confirm_date
      label: Confirm Date of Service
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: confirm_time
      label: Confirm Time of Service
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: confirm_payment_method
      label: Confirm Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
