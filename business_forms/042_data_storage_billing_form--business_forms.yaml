inputSchema:
  type: object
  properties:
    title: data_storage_billing_form
    pages:
    - id: 1
      name: billing_details
      label: Billing Details
      hint: Enter your billing information
      type: text
      options: []
      required: true
    - id: 2
      name: client_details
      label: Client Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: Select a payment method
      type: select_multiple
      options:
      - Visa
      - Mastercard
      - Amex
      - Diners
      - JCB
      required: true
    - id: 4
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: date_of_service
      label: Date of Service
      hint: Enter the date of service
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_service
      label: Time of Service
      hint: Enter the time of service
      type: time
      options: []
      required: true
    - id: 7
      name: email
      label: Email
      hint: Enter your email
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone Number
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 9
      name: confirm_payment_status
      label: Confirm Payment Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 10
      name: subscription_status
      label: Subscription Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
