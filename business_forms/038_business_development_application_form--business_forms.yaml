inputSchema:
  type: object
  properties:
    title: Business Development Application Form
    pages:
    - id: 1
      name: applicant_information
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Your complete name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Your business email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: true
    - id: 5
      name: title_position
      label: Title/Position
      hint: Your current role
      type: text
      options: []
      required: true
    - id: 6
      name: company_name
      label: Company Name
      hint: Your company or organization
      type: text
      options: []
      required: true
    - id: 7
      name: company_website
      label: Company Website
      hint: Your company website URL
      type: text
      options: []
      required: false
    - id: 8
      name: development_objectives
      label: -- Business Development Objectives --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: primary_objective
      label: Primary Development Objective
      hint: Main goal for business development
      type: select_one
      options:
      - New Market Entry
      - Expand Current Market
      - Strategic Partnerships
      - New Product Launch
      - Geographic Expansion
      - Customer Acquisition
      - Revenue Growth
      - Other
      required: true
    - id: 10
      name: target_market
      label: Target Market
      hint: Geographic or demographic target
      type: text
      options: []
      required: true
    - id: 11
      name: target_customers
      label: Target Customer Profile
      hint: Description of ideal customer
      type: text
      options: []
      required: true
    - id: 12
      name: competitive_advantage
      label: Competitive Advantage
      hint: What differentiates you
      type: text
      options: []
      required: true
    - id: 13
      name: revenue_goals
      label: Revenue Growth Goals
      hint: Expected revenue increase
      type: text
      options: []
      required: true
    - id: 14
      name: market_opportunity
      label: Market Opportunity Description
      hint: Size and nature of opportunity
      type: text
      options: []
      required: true
    - id: 15
      name: strategy
      label: -- Development Strategy --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: business_model
      label: Business Model
      hint: How will you generate revenue
      type: text
      options: []
      required: true
    - id: 17
      name: key_partnerships
      label: Key Partnerships Needed
      hint: What partnerships would help
      type: text
      options: []
      required: false
    - id: 18
      name: marketing_approach
      label: Marketing Approach
      hint: How will you market to customers
      type: text
      options: []
      required: true
    - id: 19
      name: sales_strategy
      label: Sales Strategy
      hint: How will you close sales
      type: text
      options: []
      required: true
    - id: 20
      name: success_metrics
      label: Success Metrics
      hint: How will you measure success
      type: text
      options: []
      required: true
    - id: 21
      name: resources
      label: -- Resources and Support --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: current_resources
      label: Current Resources Available
      hint: Budget, team, technology, etc
      type: text
      options: []
      required: true
    - id: 23
      name: additional_support
      label: Support or Resources Needed
      hint: What additional help needed
      type: text
      options: []
      required: false
    - id: 24
      name: timeline
      label: Implementation Timeline
      hint: When will this happen
      type: select_one
      options:
      - Immediate (1-3 months)
      - Short-term (3-6 months)
      - Medium-term (6-12 months)
      - Long-term (12+ months)
      required: true
