inputSchema:
  type: object
  properties:
    title: Annual Maintenance Contract Request Form
    pages:
    - id: 1
      name: requester_name
      label: Full Name
      hint: Person requesting contract
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your company
      type: text
      options: []
      required: true
    - id: 5
      name: company_address
      label: Company Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: contract_year
      label: Contract Year
      hint: Which year?
      type: select_one
      options:
      - '2026'
      - '2027'
      - '2028'
      - Multi-Year
      required: true
    - id: 7
      name: maintenance_type
      label: Maintenance Type
      hint: What needs maintenance?
      type: select_one
      options:
      - HVAC System
      - Electrical
      - Plumbing
      - Fire Safety
      - Elevator
      - Building General
      - Equipment
      - IT Systems
      - Landscaping
      - Other
      required: true
    - id: 8
      name: equipment_details
      label: Equipment Details
      hint: Describe equipment or systems
      type: text
      options: []
      required: false
    - id: 9
      name: property_location
      label: Property Location
      hint: Where is maintenance needed?
      type: text
      options: []
      required: true
    - id: 10
      name: square_footage
      label: Square Footage
      hint: Size of property
      type: number
      options: []
      required: false
    - id: 11
      name: building_age
      label: Building Age
      hint: Approximate age
      type: text
      options: []
      required: false
    - id: 12
      name: service_frequency
      label: Service Frequency
      hint: How often?
      type: select_one
      options:
      - Weekly
      - Bi-Weekly
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annually
      - As Needed
      required: true
    - id: 13
      name: contract_duration
      label: Contract Duration
      hint: How long?
      type: select_one
      options:
      - 1 Year
      - 2 Years
      - 3 Years
      - 5 Years
      - Other
      required: true
    - id: 14
      name: current_provider
      label: Current Provider
      hint: Do you have a current provider?
      type: select_one
      options:
      - Yes, Continuing
      - Yes, Switching
      - No, New Service
      required: true
    - id: 15
      name: current_provider_name
      label: Current Provider Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 16
      name: previous_issues
      label: Previous Issues
      hint: Any past problems?
      type: text
      options: []
      required: false
    - id: 17
      name: priority_level
      label: Priority Level
      hint: How urgent?
      type: select_one
      options:
      - Routine
      - Important
      - High Priority
      - Emergency
      required: true
    - id: 18
      name: budget_range
      label: Budget Range
      hint: Expected annual budget
      type: select_one
      options:
      - Under $5,000
      - $5,000-$10,000
      - $10,001-$25,000
      - $25,001-$50,000
      - Over $50,000
      - Not Sure
      required: false
    - id: 19
      name: response_time_requirement
      label: Response Time Requirement
      hint: How fast do you need response?
      type: select_one
      options:
      - Same Day
      - 24 Hours
      - 48 Hours
      - 1 Week
      - Not Critical
      required: true
    - id: 20
      name: after_hours_service
      label: After Hours Service
      hint: Needed outside business hours?
      type: select_one
      options:
      - Yes, 24/7
      - Yes, Evenings
      - Yes, Weekends
      - Business Hours Only
      required: true
    - id: 21
      name: special_requirements
      label: Special Requirements
      hint: Any specific needs?
      type: text
      options: []
      required: false
    - id: 22
      name: site_access
      label: Site Access
      hint: How to access property?
      type: text
      options: []
      required: false
    - id: 23
      name: preferred_start_date
      label: Preferred Start Date
      hint: When to begin?
      type: date
      options: []
      required: true
    - id: 24
      name: payment_terms
      label: Payment Terms
      hint: Preferred terms
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annually Upfront
      - Other
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
