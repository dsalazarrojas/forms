inputSchema:
  type: object
  properties:
    title: Developer Enrollment Form
    pages:
    - id: 1
      name: name
      label: Developer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - Developer
      - Partner
      - Vendor
      required: false
    - id: 6
      name: program
      label: Program
      hint: null
      type: select_multiple
      options:
      - Alpha
      - Beta
      - Gamma
      - Delta
      required: false
    - id: 7
      name: agreement
      label: Agreement
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
