inputSchema:
  type: object
  properties:
    title: Safety Equipment Installation Record
    pages:
    - id: 1
      name: installation_date
      label: Install Date
      hint: Enter the date of the installation.
      type: date
      options: []
      required: true
    - id: 2
      name: equipment_type
      label: Equipment Type
      hint: null
      type: select_one
      options:
      - safety equipment
      - first aid kits
      - other
      required: false
    - id: 3
      name: equipment_status
      label: Equipment Status
      hint: null
      type: select_multiple
      options:
      - installed
      - functional
      - not installed
      - not functional
      required: false
    - id: 4
      name: installation_location
      label: Installation Location
      hint: Enter the location of the installation.
      type: text
      options: []
      required: true
    - id: 5
      name: installed_by
      label: Installed By
      hint: Enter the person who installed the equipment.
      type: text
      options: []
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: safety_inspections_completed
      label: Safety Inspections Completed
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: safety_equipment_serial_numbers
      label: Equipment Serial Numbers
      hint: Enter the serial numbers of the safety equipment.
      type: text
      options: []
      required: false
    - id: 9
      name: installed_at
      label: Installed At
      hint: Enter the time of the installation.
      type: time
      options: []
      required: true
