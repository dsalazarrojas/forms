inputSchema:
  type: object
  properties:
    title: Club Meeting Room Supply Order Form
    pages:
    - id: 1
      name: section_requester
      label: -- Requester Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Full Name
      hint: Person requesting supplies
      type: text
      options: []
      required: true
    - id: 3
      name: club_name
      label: Club Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_meeting
      label: -- Meeting Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: meeting_date
      label: Meeting Date
      hint: When is the meeting?
      type: date
      options: []
      required: true
    - id: 8
      name: meeting_time
      label: Meeting Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: meeting_duration_hours
      label: Expected Meeting Duration - Hours
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: meeting_room
      label: Meeting Room Number or Location
      hint: Which room is being used?
      type: text
      options: []
      required: true
    - id: 11
      name: expected_attendance
      label: Expected Number of Attendees
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: section_supplies
      label: -- Supply Items Needed --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: beverages_needed
      label: Beverages Needed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 14
      name: beverage_type
      label: Beverage Type - Quantity
      hint: Coffee, tea, water, etc
      type: text
      options: []
      required: false
    - id: 15
      name: food_needed
      label: Food or Snacks Needed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 16
      name: food_description
      label: Food or Snack Description - Type
      hint: Cookies, donuts, pizza, etc
      type: text
      options: []
      required: false
    - id: 17
      name: dietary_accommodations
      label: Dietary Accommodations Needed
      hint: Vegetarian, gluten-free, allergies, etc
      type: text
      options: []
      required: false
    - id: 18
      name: supplies_needed
      label: Other Supplies Needed
      hint: null
      type: select_multiple
      options:
      - Notepads and pens
      - Whiteboards and markers
      - Flip charts
      - Projector or AV equipment
      - Tables and chairs
      - Trash bags
      - Paper towels
      - Cleaning supplies
      required: false
    - id: 19
      name: additional_items
      label: Additional Items - Specify
      hint: Any other supplies not listed
      type: text
      options: []
      required: false
    - id: 20
      name: section_equipment
      label: -- Equipment Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: av_equipment_needed
      label: AV Equipment Needed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: av_equipment_type
      label: Type of AV Equipment
      hint: Projector, screen, speakers, microphone, etc
      type: text
      options: []
      required: false
    - id: 23
      name: furniture_arrangement
      label: Special Furniture Arrangement Needed
      hint: Classroom, boardroom, theater style, etc
      type: text
      options: []
      required: false
    - id: 24
      name: section_delivery
      label: -- Delivery and Setup --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: setup_assistance
      label: Setup or Delivery Assistance Needed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
