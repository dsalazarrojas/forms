inputSchema:
  type: object
  properties:
    title: BP MINI FUNKO POP Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 5
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: state_province
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: zip_code
      label: ZIP or Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: country
      label: Country
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: funko_pop_character
      label: Funko POP Character
      hint: Which character do you want?
      type: text
      options: []
      required: true
    - id: 10
      name: product_line
      label: Product Line
      hint: Select from available collections
      type: select_one
      options:
      - Marvel
      - DC Comics
      - Star Wars
      - Disney
      - Animation
      - Movies
      - TV Shows
      - Games
      - Other
      required: true
    - id: 11
      name: quantity
      label: Quantity
      hint: How many do you want?
      type: number
      options: []
      required: true
    - id: 12
      name: unit_price
      label: Unit Price
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 13
      name: subtotal
      label: Subtotal
      hint: Calculated automatically
      type: number
      options: []
      required: false
    - id: 14
      name: condition
      label: Condition Preferred
      hint: null
      type: select_one
      options:
      - Mint in Box
      - Out of Box
      - Used/Loose
      - No preference
      required: false
    - id: 15
      name: shipping_method
      label: Shipping Method
      hint: null
      type: select_one
      options:
      - Standard Shipping
      - Express Shipping
      - Overnight
      - Local Pickup
      required: true
    - id: 16
      name: shipping_cost
      label: Shipping Cost
      hint: Calculated based on method
      type: number
      options: []
      required: false
    - id: 17
      name: total_amount
      label: Total Amount Due
      hint: Subtotal plus shipping
      type: number
      options: []
      required: false
    - id: 18
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      - Check
      - Cash on Delivery
      required: true
    - id: 19
      name: special_requests
      label: Special Requests or Notes
      hint: Gift message, special instructions, etc.
      type: text
      options: []
      required: false
