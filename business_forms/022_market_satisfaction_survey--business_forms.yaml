inputSchema:
  type: object
  properties:
    title: Market Satisfaction Survey
    pages:
    - id: 1
      name: customer_support
      label: Customer Support
      hint: null
      type: select_multiple
      options:
      - very good
      - good
      - neutral
      - bad
      - very bad
      required: true
    - id: 2
      name: customer_satisfaction_level
      label: Customer Satisfaction Level
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: product_quality_rating
      label: Product Quality Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: time_spent
      label: Time Spent in Store
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - very good
      - good
      - neutral
      - bad
      - very bad
      required: true
    - id: 6
      name: customer_satisfaction_note
      label: Customer Satisfaction Note
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: store_visit_frequency
      label: Store Visit Frequency
      hint: null
      type: select_one
      options:
      - often
      - occasionally
      - rarely
      required: true
    - id: 8
      name: employee_friendliness
      label: Employee Friendliness
      hint: null
      type: select_one
      options:
      - very friendly
      - friendly
      - neutral
      - unfriendly
      - very unfriendly
      required: true
    - id: 9
      name: other_notes
      label: Other Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: product_price_range_note
      label: Product Price Range Note
      hint: null
      type: note
      options: []
      required: false
