inputSchema:
  type: object
  properties:
    title: Software Survey Form
    pages:
    - id: 1
      name: software_survey_form_page_1
      label: Welcome to our software survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: software_survey_form_page_2
      label: What do you currently use for software development?
      hint: null
      type: select_one
      options:
      - 'IDE: Visual Studio'
      - 'IDE: Eclipse'
      - 'IDE: Other'
      required: true
    - id: 3
      name: software_survey_form_page_3
      label: How often do you use your software?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: software_survey_form_page_4
      label: What feature(s) would you like to see added to our software?
      hint: null
      type: select_multiple
      options:
      - Feature 1
      - Feature 2
      - Feature 3
      required: true
    - id: 5
      name: software_survey_form_page_5
      label: Would you like to be contacted by a representative?
      hint: null
      type: time
      options: []
      required: false
