inputSchema:
  type: object
  properties:
    title: Shift Preference Form
    pages:
    - id: 1
      name: user_input
      label: User Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: manager_input
      label: Manager
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: shift_input
      label: Shift
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: notes_input
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: employee_input
      label: Employee
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: submitted_by_input
      label: Submitted By
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: true
    - id: 10
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: submission_status
      label: Submission Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 13
      name: submission_time_2
      label: Submission Time 2
      hint: null
      type: time
      options: []
      required: true
