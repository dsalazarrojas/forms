inputSchema:
  type: object
  properties:
    title: Treasury Forecasting Accuracy Survey
    pages:
    - id: 1
      name: survey_start
      label: Survey Start
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: current_forecast_accuracy
      label: current forecast accuracy
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: forecasting_methods
      label: forecasting methods used
      hint: What methods do you use for forecasting?
      type: select_multiple
      options:
      - Cash forecasting
      - Forecasting software
      - Manual forecasting
      - Other
      required: false
    - id: 4
      name: forecast_automation_level
      label: forecast automation level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: data_sources
      label: data sources used
      hint: What data sources do you use for forecasting?
      type: select_multiple
      options:
      - Financial reports
      - Historical data
      - External data
      - Other
      required: false
    - id: 6
      name: accuracy_rating
      label: accuracy rating
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 7
      name: challenges
      label: common challenges
      hint: What challenges do you face when forecasting?
      type: text
      options: []
      required: false
    - id: 8
      name: survey_end
      label: Survey End
      hint: null
      type: time
      options: []
      required: false
