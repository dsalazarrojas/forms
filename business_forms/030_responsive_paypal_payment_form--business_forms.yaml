inputSchema:
  type: object
  properties:
    title: Responsive Paypal Payment Form
    pages:
    - id: 1
      name: product_selection
      label: Select a product
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: zip
      label: Zip
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: payment_method
      label: Payment method
      hint: null
      type: select_one
      options:
      - PayPal
      - Credit Card
      - Bank Transfer
      required: false
    - id: 11
      name: donation
      label: Donation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
