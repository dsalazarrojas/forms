      name: team_location
      label: Team location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: internal_strengths
      label: Internal Strengths
      hint: List 3-5 internal strengths.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: internal_weaknesses
      label: Internal Weaknesses
      hint: List 3-5 internal weaknesses.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: external_strengths
      label: External Strengths
      hint: List 3-5 external strengths.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
