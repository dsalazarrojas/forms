inputSchema:
  type: object
  properties:
    title: Vehicle Entry And Exit Log
    pages:
    - id: 1
      name: vehicle_type
      label: Vehicle Type
      hint: Please select the type of vehicle
      type: select_one
      options:
      - Car
      - Truck
      - Motorcycle
      required: true
    - id: 2
      name: vehicle_number
      label: Vehicle Number
      hint: Please enter vehicle number
      type: text
      options: []
      required: true
    - id: 3
      name: entry_date
      label: Entry Date
      hint: Please select the entry date
      type: date
      options: []
      required: true
    - id: 4
      name: entry_time
      label: Entry Time
      hint: Please select the entry time
      type: time
      options: []
      required: true
    - id: 5
      name: entry_time_2
      label: Departure Time
      hint: Please select the departure time
      type: time
      options: []
      required: true
    - id: 6
      name: entry_note
      label: Entry Note
      hint: Please enter any entry note
      type: text
      options: []
      required: false
    - id: 7
      name: exit_note
      label: Exit Note
      hint: Please enter any exit note
      type: text
      options: []
      required: false
    - id: 8
      name: entry_date_2
      label: Departure Date
      hint: Please select the departure date
      type: date
      options: []
      required: true
    - id: 9
      name: exit_time
      label: Exit Time
      hint: Please select the departure time
      type: time
      options: []
      required: true
    - id: 10
      name: notes
      label: Additional Notes
      hint: Please enter any additional notes
      type: text
      options: []
      required: false
    - id: 11
      name: entry_user
      label: Entry User
      hint: Please enter the entry user
      type: text
      options: []
      required: false
    - id: 12
      name: exit_user
      label: Exit User
      hint: Please enter the exit user
      type: text
      options: []
      required: false
