inputSchema:
  type: object
  properties:
    title: Information Security Assessment Form
    pages:
    - id: 1
      name: user_input
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: organization
      label: Organization Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: security_measures
      label: Security Measures
      hint: List the security measures you have in place
      type: select_multiple
      options:
      - firewalls
      - antivirus
      - backup_systems
      - access_control
      required: false
    - id: 4
      name: vulnerabilities
      label: Vulnerabilities
      hint: List any vulnerabilities you are aware of
      type: select_multiple
      options:
      - phishing
      - brute_force
      - zero_day
      required: false
    - id: 5
      name: security_assessment
      label: Security Assessment
      hint: Rate the level of risk for each measure
      type: select_one
      options:
      - low
      - medium
      - high
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: Provide any additional comments
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
