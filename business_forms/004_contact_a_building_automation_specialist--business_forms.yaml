inputSchema:
  type: object
  properties:
    title: Contact A Building Automation Specialist
    pages:
    - id: 1
      name: project_inquiry
      label: Project Inquiry Information
      hint: Tell us about your building automation needs
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: Your position or role
      type: text
      options: []
      required: false
    - id: 6
      name: email_address
      label: Email Address
      hint: Best email to reach you
      type: email
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: Best phone number to reach you
      type: text
      options: []
      required: true
    - id: 8
      name: building_type
      label: Building Type
      hint: Type of facility you need automation for
      type: select_one
      options:
      - Office Building
      - Hospital or Healthcare Facility
      - School or University
      - Manufacturing Facility
      - Retail Store or Mall
      - Government Building
      - Data Center
      - Warehouse
      - Mixed-Use Development
      required: true
    - id: 9
      name: building_size
      label: Building Size
      hint: Approximate square footage
      type: select_one
      options:
      - Under 10000 sq ft
      - 10000-50000 sq ft
      - 50001-100000 sq ft
      - 100001-500000 sq ft
      - Over 500000 sq ft
      required: true
    - id: 10
      name: automation_needs
      label: Automation Systems Needed
      hint: Select all systems you are interested in
      type: select_multiple
      options:
      - HVAC Control
      - Lighting Control
      - Security and Access Control
      - Fire Safety Systems
      - Energy Management
      - Occupancy Monitoring
      - Remote Monitoring
      - Building Analytics
      required: true
    - id: 11
      name: current_system
      label: Current Building Automation System
      hint: Do you have an existing BAS
      type: select_one
      options:
      - Yes - Looking to Upgrade
      - Yes - Looking to Expand
      - No - New Installation
      - Not Sure
      required: true
    - id: 12
      name: project_timeline
      label: Project Timeline
      hint: When do you plan to start
      type: select_one
      options:
      - Immediate - Within 30 days
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - Planning Stage - No timeline set
      required: true
    - id: 13
      name: budget_range
      label: Estimated Budget Range
      hint: Your budget for this project
      type: select_one
      options:
      - Under $50000
      - $50000-$100000
      - $100001-$250000
      - $250001-$500000
      - $500001-$1000000
      - Over $1000000
      required: false
    - id: 14
      name: primary_goals
      label: Primary Project Goals
      hint: What are your main objectives
      type: select_multiple
      options:
      - Energy Efficiency
      - Cost Reduction
      - Improved Comfort
      - Better Monitoring and Control
      - Regulatory Compliance
      - Sustainability Certification
      - Remote Management
      - Predictive Maintenance
      required: true
    - id: 15
      name: project_description
      label: Project Description
      hint: Describe your project and specific requirements
      type: text
      options: []
      required: true
    - id: 16
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Video Conference
      required: true
    - id: 17
      name: best_contact_time
      label: Best Time to Contact
      hint: When are you available
      type: select_one
      options:
      - Morning - 8am to 12pm
      - Afternoon - 12pm to 5pm
      - Evening - 5pm to 8pm
      - Anytime
      required: false
    - id: 18
      name: additional_comments
      label: Additional Comments
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
