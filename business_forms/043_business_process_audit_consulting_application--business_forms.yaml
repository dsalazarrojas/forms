inputSchema:
  type: object
  properties:
    title: Business Process Audit Consulting Application
    pages:
    - id: 1
      name: application_date
      label: Application Date
      hint: Date of this application
      type: date
      options: []
      required: true
    - id: 2
      name: company_name
      label: Company Name
      hint: Name of company requesting audit
      type: text
      options: []
      required: true
    - id: 3
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - Small (1-50)
      - Medium (51-250)
      - Large (251-1000)
      - Enterprise (1000+)
      required: true
    - id: 4
      name: primary_contact_name
      label: Primary Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 5
      name: primary_contact_title
      label: Contact Title
      hint: Position or role
      type: text
      options: []
      required: false
    - id: 6
      name: primary_contact_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 7
      name: primary_contact_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 8
      name: industry_sector
      label: Industry Sector
      hint: Primary industry
      type: select_one
      options:
      - Technology
      - Finance
      - Healthcare
      - Manufacturing
      - Retail
      - Services
      - Other
      required: true
    - id: 9
      name: audit_scope
      label: Audit Scope
      hint: Which processes to audit?
      type: text
      options: []
      required: true
    - id: 10
      name: specific_challenges
      label: Specific Process Challenges
      hint: What problems are you facing?
      type: text
      options: []
      required: true
    - id: 11
      name: current_systems
      label: Current Systems and Tools
      hint: What systems do you use?
      type: text
      options: []
      required: false
    - id: 12
      name: process_documentation
      label: Process Documentation Status
      hint: Are processes documented?
      type: select_one
      options:
      - Fully Documented
      - Partially Documented
      - Minimal Documentation
      - No Documentation
      required: true
    - id: 13
      name: previous_audits
      label: Previous Audits Conducted
      hint: Have you had audits before?
      type: select_one
      options:
      - true
      - false
      - Unsure
      required: false
    - id: 14
      name: audit_priority
      label: Audit Priority
      hint: How urgent is this?
      type: select_one
      options:
      - Critical
      - High
      - Medium
      - Low
      required: true
    - id: 15
      name: budget_range
      label: Budget Range
      hint: Estimated budget for audit
      type: select_one
      options:
      - Under $5,000
      - $5,000 - $15,000
      - $15,000 - $30,000
      - $30,000 - $50,000
      - Over $50,000
      required: false
    - id: 16
      name: desired_timeline
      label: Desired Timeline
      hint: When should audit occur?
      type: text
      options: []
      required: false
    - id: 17
      name: expected_outcomes
      label: Expected Outcomes
      hint: What do you hope to achieve?
      type: text
      options: []
      required: true
    - id: 18
      name: key_stakeholders
      label: Key Stakeholders
      hint: Who should be involved?
      type: text
      options: []
      required: false
    - id: 19
      name: additional_information
      label: Additional Information
      hint: Anything else relevant?
      type: text
      options: []
      required: false
