inputSchema:
  type: object
  properties:
    title: Transportation Requisition Form
    pages:
    - id: 1
      name: trip_details
      label: Trip Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: travel_from
      label: Travel From
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: travel_to
      label: Travel To
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: travel_date
      label: Travel Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: travel_time
      label: Travel Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: vehicle_type
      label: Vehicle Type
      hint: null
      type: select_one
      options:
      - Car
      - Bus
      - Train
      required: true
    - id: 7
      name: vehicle_capacity
      label: Vehicle Capacity
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: travel_reason
      label: Travel Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
