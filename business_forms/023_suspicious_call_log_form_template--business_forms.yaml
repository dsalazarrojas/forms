inputSchema:
  type: object
  properties:
    title: Suspicious Call Log Form Template
    pages:
    - id: 1
      name: suspicious_call_log_form
      label: Suspicious Call Log Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: caller_name
      label: Callers Name
      hint: Enter the name of the caller
      type: text
      options: []
      required: false
    - id: 3
      name: caller_phone
      label: Callers Phone
      hint: Enter the phone number of the caller
      type: text
      options: []
      required: false
    - id: 4
      name: call_description
      label: Call Description
      hint: Brief description of the call
      type: text
      options: []
      required: false
    - id: 5
      name: suspiciousness_level
      label: Suspiciousness Level
      hint: Level of suspicion (Low, Medium, High)
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 6
      name: threat_level
      label: Threat Level
      hint: Level of potential threat
      type: select_one
      options:
      - None
      - Low
      - Medium
      - High
      required: false
    - id: 7
      name: date_and_time
      label: Date and Time of Call
      hint: Date and time of the call
      type: date
      options: []
      required: false
    - id: 8
      name: recorded_by
      label: Recorded By
      hint: Name of the person recording the call
      type: text
      options: []
      required: false
    - id: 9
      name: call_outcome
      label: Call Outcome
      hint: Outcome of the call
      type: select_one
      options:
      - Dispositioned
      - Held
      - Transferred
      - Escalated
      - Closed
      required: false
