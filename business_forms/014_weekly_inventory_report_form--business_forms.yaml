inputSchema:
  type: object
  properties:
    title: Weekly Inventory Report Form
    pages:
    - id: 1
      name: inventory_form_header
      label: Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inventory_date
      label: inventory_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: inventory_item
      label: item
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: inventory_quantity
      label: quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: inventory_reorder_point
      label: reorder_point
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: inventory_item_status
      label: item_status
      hint: null
      type: select_one
      options:
      - Reorder
      - In stock
      - Discontinued
      - Pending
      required: true
    - id: 7
      name: inventory_item_comments
      label: item_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: inventory_form_footer
      label: Footer
      hint: null
      type: note
      options: []
      required: false
