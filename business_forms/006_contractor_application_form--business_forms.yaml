inputSchema:
  type: object
  properties:
    title: Contractor Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant Full Name
      hint: Legal name as it appears on official documents
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Primary email for communication
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: business_name
      label: Business Name
      hint: Name of your contracting business if applicable
      type: text
      options: []
      required: false
    - id: 5
      name: business_address
      label: Business Address
      hint: Full address of your business
      type: text
      options: []
      required: false
    - id: 6
      name: section_project_details
      label: -- Project Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: project_type
      label: Type of Project
      hint: What type of work do you need
      type: select_one
      options:
      - Home Renovation
      - New Construction
      - Remodeling
      - Repair Work
      - Installation
      - Maintenance
      - Landscaping
      - Electrical Work
      - Plumbing
      - Other
      required: true
    - id: 8
      name: project_location
      label: Project Location
      hint: Address where work will be performed
      type: text
      options: []
      required: true
    - id: 9
      name: project_description
      label: Project Description
      hint: Detailed description of the work needed
      type: text
      options: []
      required: true
    - id: 10
      name: project_timeline
      label: Desired Timeline
      hint: When would you like the project to start
      type: select_one
      options:
      - As soon as possible
      - Within 2 weeks
      - Within 1 month
      - Within 3 months
      - Flexible
      required: true
    - id: 11
      name: budget_range
      label: Budget Range
      hint: Estimated budget for this project
      type: select_one
      options:
      - Under $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - $25,000 - $50,000
      - $50,000 - $100,000
      - Over $100,000
      required: true
    - id: 12
      name: section_contractor_info
      label: -- Contractor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: years_experience
      label: Years of Experience
      hint: How many years have you been in business
      type: number
      options: []
      required: true
    - id: 14
      name: license_number
      label: Contractor License Number
      hint: Your professional license number
      type: text
      options: []
      required: true
    - id: 15
      name: license_state
      label: License State
      hint: State where license is issued
      type: text
      options: []
      required: true
    - id: 16
      name: insurance_status
      label: Insurance Status
      hint: Do you have liability insurance
      type: select_one
      options:
      - Yes - Fully Insured
      - Yes - Partially Insured
      - 'False'
      required: true
    - id: 17
      name: insurance_amount
      label: Insurance Coverage Amount
      hint: Total coverage amount
      type: text
      options: []
      required: false
    - id: 18
      name: bonding_status
      label: Bonding Status
      hint: Are you bonded
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: section_references
      label: -- References --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: reference_1_name
      label: Reference 1 Name
      hint: Name of first reference
      type: text
      options: []
      required: false
    - id: 21
      name: reference_1_phone
      label: Reference 1 Phone
      hint: Contact number for first reference
      type: text
      options: []
      required: false
    - id: 22
      name: reference_2_name
      label: Reference 2 Name
      hint: Name of second reference
      type: text
      options: []
      required: false
    - id: 23
      name: reference_2_phone
      label: Reference 2 Phone
      hint: Contact number for second reference
      type: text
      options: []
      required: false
    - id: 24
      name: portfolio_available
      label: Do you have a portfolio of past work
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
