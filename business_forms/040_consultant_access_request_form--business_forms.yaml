        type: select_one
        options:
          - No - Consultant using own device
          - Yes - Laptop required
          - Yes - Mobile phone required
          - Yes - Other Specialized Equipment
        required: true
      - id: 18
        name: equipment_delivery_address
        label: Delivery Address for Equipment (If applicable)
        hint: null
        type: text
        options: []
