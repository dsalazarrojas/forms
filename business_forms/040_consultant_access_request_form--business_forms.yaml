      - id: 2
        name: consultant_full_name_ident
        label: Consultant Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: consultant_company_legal_name
        label: Consultant's Company/Firm
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: consultant_email_ident
        label: Consultant Email Address
        hint: null
        type: email
        options: []
        required: true
      - id: 5
        name: primary_project_assignment
        label: Primary Project Assignment
        hint: null
        type: text
        options: []
        required: true
      - id: 6
        name: internal_sponsor_name_ident
        label: Internal Sponsor/Manager Name
        hint: Name of the internal person responsible for this consultant
        type: text
        options: []
        required: true
      - id: 7
        name: section_access_req_details
        label: -- Access Request Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 8
        name: access_start_date_ident
        label: Requested Access Start Date
        hint: null
        type: date
        options: []
        required: true
      - id: 9
        name: access_end_date_ident
        label: Estimated Access End Date
        hint: null
        type: date
        options: []
        required: true
      - id: 10
        name: access_type_checklist
        label: Types of Access Required
        hint: Check all that apply
        type: select_multiple
        options:
          - Physical Site Access (ID Badge)
          - VPN/Remote Network Access
          - Email Account (Internal)
          - Project Portal/App Access (Procore, Jira, etc.)
          - Internal Shared Drives (FTP, SharePoint)
          - Administrative System Access (ERP, CRM)
        required: true
      - id: 11
        name: justification_for_access_desc
        label: Brief Justification for the Requested Access
        hint: null
        type: text
        options: []
        required: true
      - id: 12
        name: section_it_security_compliance
        label: -- IT and Security Compliance --
        hint: null
        type: note
        options: []
        required: false
      - id: 13
        name: security_background_check_passed
        label: Security Background Check Passed (If applicable)
        hint: null
        type: select_one
        options:
          - Yes - Verified
          - In Progress
          - Not Required
        required: true
      - id: 14
        name: nda_signed_checklist
        label: Non-Disclosure Agreement (NDA) Signed
        hint: null
        type: select_one
        options:
          - Yes - Previously signed
          - Yes - Attached to this request
          - No - Required before access
        required: true
      - id: 15
        name: acceptable_use_policy_ack
        label: I have read and agree to the Acceptable Use Policy (AUP)
        hint: null
        type: select_one
        options:
          - I Agree
          - I Disagree
        required: true
