      name: weekly_symptoms_header
      Label: -- Symptoms Assessment --
      hint: Any symptoms at time of test
      type: note
      options: []
      required: false
    - id: 17
      name: weekly_had_symptoms
      label: Did You Have Any Symptoms
      hint: Symptoms at time of test
      type: select_one
      options:
        - No symptoms
        - Mild symptoms
        - Moderate symptoms
        - Severe symptoms
      required: true
    - id: 18
      name: weekly_symptoms_list
      Label: Symptoms Experienced
      hint: If applicable, describe symptoms
      type: text
      options: []
      required: false
    - id: 19
      name: weekly_isolation_header
      label: -- Isolation or Quarantine Status --
      hint: Your current isolation status
      type: note
      options: []
      required: false
    - id: 20
      name: weekly_isolation_status
      Label: Current Isolation or Quarantine Status
      hint: Are you isolating
      type: select_one
      options:
        - Not isolating
        - Self-isolating
        - Quarantining
        - Under medical orders
      required: true
    - id: 21
      name: weekly_work_status
      label: Current Work Status
      hint: Are you working
      type: select_one
      options:
