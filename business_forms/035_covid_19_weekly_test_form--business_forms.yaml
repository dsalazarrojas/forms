inputSchema:
  type: object
  properties:
    title: COVID 19 Weekly Test Form
    pages:
    - id: 1
      name: weekly_patient_header
      label: -- Employee or Patient Information --
      hint: Please provide your details
      type: note
      options: []
      required: false
    - id: 2
      name: weekly_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: weekly_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: weekly_employee_id
      Label: Employee or Patient ID
      hint: Your ID number
      type: text
      options: []
      required: true
    - id: 5
      name: weekly_email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: false
    - id: 6
      name: weekly_phone
      Label: Phone Number
      hint: Your phone number
      type: phone
      options: []
      required: false
    - id: 7
      name: weekly_department
      label: Department or Division
      hint: Your department
      type: text
      options: []
      required: false
    - id: 8
      name: weekly_test_info_header
      Label: -- Weekly Test Information --
      hint: Details about this week's test
      type: note
      options: []
      required: false
    - id: 9
      name: weekly_test_date
      label: Test Date
      hint: Date the test was performed
      type: date
      options: []
      required: true
    - id: 10
      name: weekly_test_week
      Label: Week Number
      hint: Which week this test is for
      type: integer
      options: []
      required: true
    - id: 11
      name: weekly_test_type
      label: Type of Test Performed
      hint: What type of COVID-19 test
      type: select_one
      options:
        - Rapid Antigen Test
        - PCR Test
        - At-Home Test
        - Antibody Test
        - Other
      required: true
    - id: 12
      name: weekly_test_location
      Label: Testing Location
      hint: Where was the test performed
      type: text
      options: []
      required: false
    - id: 13
      name: weekly_test_result_header
      label: -- Test Result --
      hint: Your test result
      type: note
      options: []
      required: false
    - id: 14
      name: weekly_test_result
      Label: Test Result
      hint: What was your result
      type: select_one
      options:
        - Negative
        - Positive
        - Inconclusive
        - Invalid
        - Pending
      required: true
    - id: 15
      name: weekly_test_date_taken
      label: Date Result Received
      hint: When you got the result
      type: date
      options: []
      required: true
