      name: weekly_close_contacts
      label: Had Close Contact with Positive Case This Week
      hint: Contact with COVID-19 positive person
      type: select_one
      options:
        - No contact
        - Yes, at home
        - Yes, at work
        - Yes, elsewhere
      required: true
    - id: 24
      name: weekly_notes
      Label: Additional Notes or Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
    - id: 25
      name: weekly_submission_date
      label: Date of Submission
      hint: Date this form is being submitted
      type: date
      options: []
      required: true
