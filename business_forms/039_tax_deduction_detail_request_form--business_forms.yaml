inputSchema:
  type: object
  properties:
    title: Tax Deduction Detail Request Form
    pages:
    - id: 1
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: request_type
      label: Request Type
      hint: null
      type: select_one
      options:
      - Accounting Firms
      - Finance Teams
      - Individuals
      required: false
    - id: 3
      name: supporting_documents
      label: Supporting Documents
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: request_details
      label: Request Details
      hint: Please provide detailed information about the request.
      type: text
      options: []
      required: false
    - id: 5
      name: request_status
      label: Request Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Rejected
      required: true
    - id: 6
      name: assignee
      label: Assignee
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - another option
      - another option 2
      required: true
    - id: 7
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
