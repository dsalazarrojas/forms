inputSchema:
  type: object
  properties:
    title: Return To Vendor Form
    pages:
    - id: 1
      name: return_reason
      label: Reason for Return
      hint: Please explain the reason for return.
      type: text
      options: []
      required: true
    - id: 2
      name: customer_request
      label: Customer Request
      hint: Briefly describe the customer's request.
      type: text
      options: []
      required: false
    - id: 3
      name: return_item_description
      label: Return Item Description
      hint: Describe the item being returned.
      type: text
      options: []
      required: false
    - id: 4
      name: return_reason_type
      label: Return Reason Type
      hint: Select the reason for return.
      type: select_one
      options:
      - Reason 1
      - Reason 2
      - Reason 3
      required: false
    - id: 5
      name: return_item_quantity
      label: Return Item Quantity
      hint: Enter the quantity of items being returned.
      type: number
      options: []
      required: true
    - id: 6
      name: notes
      label: Additional Notes
      hint: Is there anything else you'd like to add?
      type: note
      options: []
      required: false
