inputSchema:
  type: object
  properties:
    title: Supplier Evaluation Form
    pages:
    - id: 1
      name: supplier_name
      label: Supplier Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: supplier_address
      label: Supplier Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: supplier_type
      label: Supplier Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: supplier_status
      label: Supplier Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 7
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: evaluation_time
      label: Evaluation Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: evaluation_note
      label: Evaluation Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: evaluation_comment
      label: Evaluation Comment
      hint: null
      type: text
      options: []
      required: false
