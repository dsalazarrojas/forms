inputSchema:
  type: object
  properties:
    title: Wind Turbine Inspection Check In Form
    pages:
    - id: 1
      name: turbine_location
      label: Turbine Location
      hint: Please provide the location of the wind turbine
      type: text
      options: []
      required: true
    - id: 2
      name: current_condition
      label: Current Condition
      hint: Select the current status of the turbine
      type: select_one
      options:
      - Operational
      - Maintenance
      - Out of commission
      required: true
    - id: 3
      name: last_maintenance_date
      label: Last Maintenance Date
      hint: Enter the date of the last maintenance
      type: date
      options: []
      required: true
    - id: 4
      name: next_scheduled_maintenance
      label: Next Scheduled Maintenance
      hint: Enter the date of the next scheduled maintenance
      type: date
      options: []
      required: true
    - id: 5
      name: turbine_performance
      label: Turbine Performance
      hint: Describe the turbine's performance
      type: text
      options: []
      required: true
    - id: 6
      name: inspection_comments
      label: Inspection Comments
      hint: Enter any comments or observations about the turbine
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: Enter your email address for contact purposes
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone Number
      hint: Enter your phone number for emergency contact
      type: text
      options: []
      required: false
    - id: 9
      name: location
      label: Location
      hint: Provide the coordinates or address of the turbine
      type: text
      options: []
      required: true
    - id: 10
      name: turbine_inspection_comments
      label: Turbine Inspection Comments
      hint: Enter any comments or notes about the turbine inspection
      type: text
      options: []
      required: false
