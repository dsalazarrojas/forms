inputSchema:
  type: object
  properties:
    title: Container Drop Off Log
    pages:
    - id: 1
      name: log_title
      label: Container Drop Off Log
      hint: Track container deliveries
      type: note
      options: []
      required: false
    - id: 2
      name: drop_off_date
      label: Drop Off Date
      hint: Date of delivery
      type: date
      options: []
      required: true
    - id: 3
      name: drop_off_time
      label: Drop Off Time
      hint: Time of arrival
      type: time
      options: []
      required: true
    - id: 4
      name: container_id
      label: Container ID Number
      hint: Unique identifier
      type: text
      options: []
      required: true
    - id: 5
      name: container_type
      label: Container Type
      hint: Size and type
      type: select_one
      options:
      - 20ft Standard
      - 40ft Standard
      - 40ft High Cube
      - 45ft High Cube
      - Refrigerated
      - Open Top
      - Flat Rack
      - Tank Container
      required: true
    - id: 6
      name: container_size
      label: Container Size
      hint: Dimensions
      type: select_one
      options:
      - 10 feet
      - 20 feet
      - 40 feet
      - 45 feet
      - Other
      required: true
    - id: 7
      name: seal_number
      label: Seal Number
      hint: Security seal
      type: text
      options: []
      required: true
    - id: 8
      name: carrier_name
      label: Carrier Name
      hint: Shipping company
      type: text
      options: []
      required: true
    - id: 9
      name: driver_name
      label: Driver Name
      hint: Driver full name
      type: text
      options: []
      required: true
    - id: 10
      name: driver_license
      label: Driver License Number
      hint: License number
      type: text
      options: []
      required: true
    - id: 11
      name: vehicle_number
      label: Vehicle Number
      hint: Truck number
      type: text
      options: []
      required: true
    - id: 12
      name: license_plate
      label: License Plate
      hint: Plate number
      type: text
      options: []
      required: true
    - id: 13
      name: origin_location
      label: Origin Location
      hint: Where from
      type: text
      options: []
      required: true
    - id: 14
      name: destination_location
      label: Destination Location
      hint: Where to
      type: text
      options: []
      required: true
    - id: 15
      name: cargo_description
      label: Cargo Description
      hint: Contents
      type: text
      options: []
      required: true
    - id: 16
      name: cargo_weight
      label: Cargo Weight
      hint: In kilograms
      type: number
      options: []
      required: false
    - id: 17
      name: hazardous_materials
      label: Contains Hazardous Materials
      hint: Hazmat status
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: hazmat_class
      label: Hazmat Class
      hint: If applicable
      type: select_one
      options:
      - Class 1 - Explosives
      - Class 2 - Gases
      - Class 3 - Flammable Liquids
      - Class 4 - Flammable Solids
      - Class 5 - Oxidizers
      - Class 6 - Toxic
      - Class 7 - Radioactive
      - Class 8 - Corrosive
      - Class 9 - Miscellaneous
      - Not Applicable
      required: false
    - id: 19
      name: container_condition
      label: Container Condition
      hint: On arrival
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      required: true
    - id: 20
      name: damage_notes
      label: Damage Description
      hint: If any damage
      type: text
      options: []
      required: false
    - id: 21
      name: receiving_dock
      label: Receiving Dock Number
      hint: Dock assigned
      type: text
      options: []
      required: true
    - id: 22
      name: received_by
      label: Received By
      hint: Staff name
      type: text
      options: []
      required: true
    - id: 23
      name: inspection_completed
      label: Inspection Completed
      hint: Was inspection done
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 24
      name: additional_notes
      label: Additional Notes
      hint: Any other info
      type: text
      options: []
      required: false
