      hint: Architecture and engineering costs
      type: number
      options: []
      required: false
    - id: 13
      name: construction_budget
      label: Construction Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: contingency_percentage
      label: Contingency Percentage
      hint: Percentage for unexpected costs
      type: number
      options: []
