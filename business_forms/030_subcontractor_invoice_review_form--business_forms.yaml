inputSchema:
  type: object
  properties:
    title: Subcontractor Invoice Review Form
    pages:
    - id: 1
      name: invoice_date
      label: Invoice Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: invoice_number
      label: Invoice Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: invoice_total
      label: Invoice Total
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: invoice_status
      label: Invoice Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      - Partially Approved
      required: true
    - id: 7
      name: subcontractor_name
      label: Subcontractor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: subcontractor_address
      label: Subcontractor Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Check
      - Wire Transfer
      - Online Payment
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: reviewer_name
      label: Reviewer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: reviewer_comments
      label: Reviewer Comments
      hint: null
      type: text
      options: []
      required: false
