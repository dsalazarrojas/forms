inputSchema:
  type: object
  properties:
    title: Business Strategy Renewal Initiative Application
    pages:
    - id: 1
      name: section_applicant_info
      label: -- Applicant Information --
      type: note
      required: false
    - id: 2
      name: applicant_name
      label: Applicant Name
      hint: Your full name
      type: text
      required: true
    - id: 3
      name: applicant_title
      label: Title or Position
      hint: Your role in the organization
      type: text
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your organization
      type: text
      required: true
    - id: 5
      name: applicant_email
      label: Email Address
      hint: Your email
      type: email
      required: true
    - id: 6
      name: applicant_phone
      label: Phone Number
      hint: Your contact number
      type: text
      required: true
    - id: 7
      name: section_initiative_overview
      label: -- Initiative Overview --
      type: note
      required: false
    - id: 8
      name: initiative_title
      label: Initiative Title
      hint: Name of the renewal initiative
      type: text
      required: true
    - id: 9
      name: initiative_description
      label: Initiative Description
      hint: What is this initiative about
      type: text
      required: true
    - id: 10
      name: business_area
      label: Business Area Affected
      hint: Which part of the business
      type: text
      required: true
    - id: 11
      name: initiative_duration
      label: Expected Initiative Duration
      hint: Timeline for completion
      type: select_one
      options:
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 12-18 months
      - 18+ months
      required: true
    - id: 12
      name: section_objectives
      label: -- Objectives and Goals --
      type: note
      required: false
    - id: 13
      name: primary_objectives
      label: Primary Objectives
      hint: Main goals of the initiative
      type: text
      required: true
    - id: 14
      name: measurable_outcomes
      label: Measurable Outcomes
      hint: How will success be measured
      type: text
      required: true
    - id: 15
      name: expected_impact
      label: Expected Impact
      hint: Financial or operational benefits
      type: text
      required: true
    - id: 16
      name: strategic_alignment
      label: Alignment with Company Strategy
      hint: How does this support strategy
      type: text
      required: true
    - id: 17
      name: section_implementation
      label: -- Implementation Plan --
      type: note
      required: false
    - id: 18
      name: implementation_approach
      label: Implementation Approach
      hint: How will this be executed
      type: text
      required: true
    - id: 19
      name: key_milestones
      label: Key Milestones
      hint: Important phases or checkpoints
      type: text
      required: true
    - id: 20
      name: resource_requirements
      label: Resource Requirements
      hint: Budget, people, tools needed
      type: text
      required: true
    - id: 21
      name: section_risks
      label: -- Risk Assessment --
      type: note
      required: false
    - id: 22
      name: identified_risks
      label: Identified Risks
      hint: What could go wrong
      type: text
      required: false
    - id: 23
      name: risk_mitigation
      label: Risk Mitigation Strategies
      hint: How will you address risks
      type: text
      required: false
    - id: 24
      name: section_success_factors
      label: -- Success Factors --
      type: note
      required: false
    - id: 25
      name: critical_success_factors
      label: Critical Success Factors
      hint: What must go right
      type: text
      required: true
    - id: 26
      name: stakeholder_support
      label: Key Stakeholder Support Needed
      hint: Who needs to support this
      type: text
      required: false
    - id: 27
      name: additional_info
      label: Additional Information
      hint: Any other relevant details
      type: text
      required: false
