inputSchema:
  type: object
  properties:
    title: Change Impact Consulting Contact Form
    pages:
    - id: 1
      name: inquiry_date
      label: Inquiry Date
      hint: Date of contact
      type: date
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: Email for response
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Name of organization
      type: text
      options: []
      required: true
    - id: 6
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - 1-10 employees
      - 11-50 employees
      - 51-200 employees
      - 201-500 employees
      - 501-1000 employees
      - More than 1000 employees
      required: true
    - id: 7
      name: industry
      label: Industry
      hint: Primary industry sector
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Manufacturing
      - Retail
      - Education
      - Government
      - Nonprofit
      - Energy utilities
      - Professional services
      - Other
      required: true
    - id: 8
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 9
      name: service_interest
      label: Service Interest
      hint: Which services are you interested in
      type: select_multiple
      options:
      - Change management consulting
      - Organizational development
      - Leadership coaching
      - Training and workshops
      - Change readiness assessment
      - Communication strategy
      - Stakeholder engagement
      - Post-merger integration
      - Digital transformation
      - Culture change
      required: true
    - id: 10
      name: project_timeline
      label: Project Timeline
      hint: When do you need services
      type: select_one
      options:
      - Immediate - Within 2 weeks
      - Soon - Within 1 month
      - Short-term - 1-3 months
      - Medium-term - 3-6 months
      - Long-term - 6+ months
      - Just exploring options
      required: true
    - id: 11
      name: project_scope
      label: Project Scope
      hint: Estimated scope of change initiative
      type: select_one
      options:
      - Single department
      - Multiple departments
      - Entire organization
      - Multiple locations
      - Global enterprise
      required: true
    - id: 12
      name: budget_range
      label: Budget Range
      hint: Estimated budget for consulting
      type: select_one
      options:
      - Under $10,000
      - $10,000-$25,000
      - $25,000-$50,000
      - $50,000-$100,000
      - $100,000-$250,000
      - Over $250,000
      required: false
    - id: 13
      name: current_challenges
      label: Current Challenges
      hint: What change challenges are you facing
      type: text
      options: []
      required: true
    - id: 14
      name: change_drivers
      label: Change Drivers
      hint: What is driving the need for change
      type: select_multiple
      options:
      - Market conditions
      - Technology adoption
      - Merger or acquisition
      - Leadership change
      - Regulatory requirements
      - Performance improvement
      - Culture transformation
      - Growth scaling
      - Other
      required: true
    - id: 15
      name: previous_change_experience
      label: Previous Change Experience
      hint: Have you undertaken major change initiatives before
      type: select_one
      options:
      - Yes - Multiple successful changes
      - Yes - Some success some challenges
      - Yes - Mostly challenges
      - No - First major change
      required: true
    - id: 16
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone call
      - Video conference
      - In-person meeting
      required: true
    - id: 17
      name: best_time_to_contact
      label: Best Time to Contact
      hint: When is the best time to reach you
      type: text
      options: []
      required: false
    - id: 18
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Website
      - Referral
      - Social media
      - Conference event
      - Search engine
      - Publication
      - Other
      required: false
    - id: 19
      name: referred_by
      label: Referred By
      hint: Name of referring person if applicable
      type: text
      options: []
      required: false
    - id: 20
      name: additional_information
      label: Additional Information
      hint: Any other details you would like to share
      type: text
      options: []
      required: false
    - id: 21
      name: contact_signature
      label: Contact Signature
      hint: Type your full name as signature
      type: text
      options: []
      required: true
