inputSchema:
  type: object
  properties:
    title: Private Swim Lesson Registration Form
    pages:
    - id: 1
      name: swim_school_id
      label: Swim School ID
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: lesson_date
      label: Lesson Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: lesson_time
      label: Lesson Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: lesson_duration
      label: Lesson Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: lesson_schedule
      label: Lesson Schedule
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: swim_level
      label: Swim Level
      hint: Beginner,Intermediate,Advanced
      type: select_multiple
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 12
      name: lesson_type
      label: Lesson Type
      hint: null
      type: select_one
      options:
      - Private Group Lesson
      - Private Lesson
      required: false
    - id: 13
      name: swim_frequency
      label: Swim Frequency
      hint: null
      type: select_one
      options:
      - Weekly
      - Semi-Monthly
      - Monthly
      required: false
    - id: 14
      name: lesson_fees
      label: Lesson Fees
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Check
      required: false
    - id: 16
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Unpaid
      required: false
