inputSchema:
  type: object
  properties:
    title: Sellers Product Evaluation Questionnaire
    pages:
    - id: 1
      name: seller_name
      label: Seller Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_id
      label: Product Id
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Excellent''}'
      - '{''id'': 2, ''label'': ''Good''}'
      - '{''id'': 3, ''label'': ''Poor''}'
      - '{''id'': 4, ''label'': ''Bad''}'
      - '{''id'': 5, ''label'': ''Very Bad''}'
      required: false
    - id: 6
      name: review
      label: Review
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date_submitted
      label: Date Submitted
      hint: null
      type: date
      options: []
      required: false
