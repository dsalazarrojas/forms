inputSchema:
  type: object
  properties:
    title: Component Checklist Form
    pages:
      - id: 1
        name: checklist_id
        label: Checklist ID
        hint: Unique identifier for this checklist
        type: text
        options: []
        required: true
      - id: 2
        name: project_name
        label: Project Name
        hint: Name of the project
        type: text
        options: []
        required: true
