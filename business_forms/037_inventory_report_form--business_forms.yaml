inputSchema:
  type: object
  properties:
    title: Inventory Report Form
    pages:
    - id: 1
      name: report_type
      label: report_type
      hint: null
      type: select_one
      options:
      - Sales Report
      - Inventory Report
      - Product Report
      required: false
    - id: 2
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: inventory_level
      label: inventory_level
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: stock_levels
      label: stock_levels
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: product_description
      label: product_description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: stock_units
      label: stock_units
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 8
      name: stock_status
      label: stock_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 9
      name: assigned_user
      label: assigned_user
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 10
      name: report_frequency
      label: report_frequency
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Yearly
      required: false
