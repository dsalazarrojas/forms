inputSchema:
  type: object
  properties:
    title: Poster Printing Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: poster_size
      label: Poster Size
      hint: null
      type: select_one
      options:
      - Large
      - Small
      - Medium
      - Poster Size Options
      required: false
    - id: 3
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: poster_design
      label: Poster Design
      hint: null
      type: select_multiple
      options:
      - Color
      - Pattern
      - Image
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Cash
      required: false
    - id: 6
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: shipping_country
      label: Shipping Country
      hint: null
      type: select_multiple
      options:
      - USA
      - Canada
      - Mexico
      - Other Country
      required: false
    - id: 8
      name: shipping_city
      label: Shipping City
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: shipping_zip
      label: Shipping Zip
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
