inputSchema:
  type: object
  properties:
    title: Governance Evaluation Research Application Form
    pages:
    - id: 1
      name: first_page
      label: first_page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: research_project
      label: research_project
      hint: Please provide more details about the research project
      type: text
      options: []
      required: false
    - id: 3
      name: research_institution
      label: research_institution
      hint: Select the research institution you are applying to
      type: select_one
      options:
      - University of XYZ
      - Think Tank ABC
      - NGO DEF
      - Public Body GHI
      required: false
    - id: 4
      name: contact_info
      label: contact_info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: email
      hint: Please enter a valid email address
      type: email
      options: []
      required: false
    - id: 6
      name: evaluation_criteria
      label: evaluation_criteria
      hint: null
      type: select_multiple
      options:
      - Evaluation A
      - Evaluation B
      - Evaluation C
      required: false
    - id: 7
      name: research_focus
      label: research_focus
      hint: null
      type: select_one
      options:
      - Research F1
      - Research F2
      - Research F3
      - Research F4
      required: false
    - id: 8
      name: research_duration
      label: research_duration
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: submission_date
      label: submission_date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: submitted_by
      label: submitted_by
      hint: null
      type: select_one
      options:
      - Candidate A
      - Candidate B
      - Candidate C
      - Candidate D
      required: false
