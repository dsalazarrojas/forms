inputSchema:
  type: object
  properties:
    title: Business Operations Survey
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_department
      label: Department
      hint: Your department or team
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_tenure
      label: Length of Employment
      hint: How long have you worked here?
      type: select_one
      options:
      - Less than 3 months
      - 3-6 months
      - 6-12 months
      - 1-3 years
      - 3+ years
      required: false
    - id: 4
      name: process_clarity
      label: Clarity of Work Processes
      hint: Rate process clarity (1-5)
      type: number
      options: []
      required: true
    - id: 5
      name: process_efficiency
      label: Efficiency of Operations
      hint: Rate efficiency (1-5)
      type: number
      options: []
      required: true
    - id: 6
      name: communication_quality
      label: Internal Communication Quality
      hint: Rate communication (1-5)
      type: number
      options: []
      required: true
    - id: 7
      name: resource_adequacy
      label: Adequacy of Resources
      hint: Do you have what you need? (1-5)
      type: number
      options: []
      required: true
    - id: 8
      name: tool_effectiveness
      label: Effectiveness of Tools and Systems
      hint: Rate tools (1-5)
      type: number
      options: []
      required: true
    - id: 9
      name: decision_making_speed
      label: Speed of Decision-Making
      hint: How fast are decisions made? (1-5)
      type: number
      options: []
      required: true
    - id: 10
      name: workflow_bottlenecks
      label: Current Workflow Bottlenecks
      hint: What slows things down?
      type: text
      options: []
      required: false
    - id: 11
      name: biggest_operational_challenge
      label: Biggest Operational Challenge
      hint: What is most problematic?
      type: text
      options: []
      required: true
    - id: 12
      name: improvement_suggestions
      label: Improvement Suggestions
      hint: How can we operate better?
      type: text
      options: []
      required: false
    - id: 13
      name: interdepartmental_collaboration
      label: Quality of Interdepartmental Collaboration
      hint: Rate collaboration (1-5)
      type: number
      options: []
      required: true
    - id: 14
      name: change_readiness
      label: Are You Ready for Operational Changes?
      hint: Your openness to change
      type: select_one
      options:
      - Very Open
      - Open
      - Neutral
      - Resistant
      - Very Resistant
      required: false
    - id: 15
      name: technology_satisfaction
      label: Technology System Satisfaction
      hint: Rate technology (1-5)
      type: number
      options: []
      required: true
    - id: 16
      name: training_adequacy
      label: Adequacy of Training
      hint: Is training sufficient? (1-5)
      type: number
      options: []
      required: true
    - id: 17
      name: overall_operations_rating
      label: Overall Operations Rating
      hint: Overall satisfaction (1-10)
      type: number
      options: []
      required: true
    - id: 18
      name: additional_feedback
      label: Additional Feedback
      hint: Any other comments?
      type: text
      options: []
      required: false
