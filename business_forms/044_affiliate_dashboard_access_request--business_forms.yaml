inputSchema:
  type: object
  properties:
    title: Affiliate Dashboard Access Request
    pages:
    - id: 1
      name: personal_info_header
      label: -- Applicant Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Business Email Address
      hint: This will be your login username.
      type: email
      options: []
      required: true
    - id: 5
      name: marketing_info_header
      label: -- Marketing Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: website_url
      label: Primary Website URL
      hint: Where will you promote us?
      type: text
      options: []
      required: true
    - id: 7
      name: social_media
      label: Social Media Profiles
      hint: Links to Instagram, TikTok, YouTube, etc.
      type: text
      options: []
      required: false
    - id: 8
      name: traffic_source
      label: Primary Traffic Source
      hint: How do you drive traffic?
      type: select_one
      options:
      - SEO / Organic Search
      - Paid Ads (PPC)
      - Social Media
      - Email List
      - Content / Blog
      - Coupon / Deal Site
      required: true
    - id: 9
      name: monthly_visitors
      label: Monthly Visitors / Reach
      hint: Approximate audience size.
      type: select_one
      options:
      - Less than 1,000
      - 1,000 - 10,000
      - 10,000 - 50,000
      - 50,000+
      required: true
    - id: 10
      name: promotion_plan
      label: Promotion Plan
      hint: Briefly describe how you plan to market our products.
      type: text
      options: []
      required: true
    - id: 11
      name: payout_details_header
      label: -- Payout Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: payment_method
      label: Preferred Payout Method
      hint: How do you want to be paid?
      type: select_one
      options:
      - PayPal
      - Bank Transfer (Wise/ACH)
      - Check
      required: true
    - id: 13
      name: paypal_email
      label: PayPal Email (if applicable)
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: terms_agreement
      label: Affiliate Agreement
      hint: I agree to the Affiliate Program Terms & Conditions.
      type: select_one
      options:
      - I Agree
      - Other
      required: true
