inputSchema:
  type: object
  properties:
    title: Website Management Feedback Form
    pages:
    - id: 1
      name: user_email
      label: user_email
      hint: null
      type: email
      options: []
      required: false
    - id: 2
      name: website_name
      label: website_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: feedback_type
      label: feedback_type
      hint: null
      type: select_one
      options:
      - Performance
      - Usability
      - Features
      required: false
    - id: 4
      name: feedback_message
      label: feedback_message
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: assigned_tool
      label: assigned_tool
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - jira
      - trello
      required: false
    - id: 6
      name: website_features
      label: website_features
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: website_usability
      label: website_usability
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: submit_button
      label: submit_button
      hint: null
      type: time
      options: []
      required: false
