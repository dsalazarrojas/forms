      name: terms_acceptance
      label: Terms and Conditions
      hint: I agree to terms
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 47
      name: submitter_signature
      label: Submitter Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 48
      name: submission_date
