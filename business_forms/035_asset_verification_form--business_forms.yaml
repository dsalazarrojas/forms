inputSchema:
  type: object
  properties:
    title: Asset Verification Form
    pages:
    - id: 1
      name: verification_date
      label: Verification Date
      hint: Date of verification
      type: date
      options: []
      required: true
    - id: 2
      name: verifier_name
      label: Verifier Name
      hint: Who is verifying
      type: text
      options: []
      required: true
    - id: 3
      name: verifier_title
      label: Verifier Title
      hint: Job title
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Insurance or business name
      type: text
      options: []
      required: true
    - id: 5
      name: policy_number
      label: Policy Number
      hint: Insurance policy ID
      type: text
      options: []
      required: true
    - id: 6
      name: policy_holder_name
      label: Policy Holder Name
      hint: Insured party
      type: text
      options: []
      required: true
    - id: 7
      name: policy_holder_address
      label: Policy Holder Address
      hint: Insured address
      type: text
      options: []
      required: true
    - id: 8
      name: contract_reference
      label: Contract Reference
      hint: Agreement number
      type: text
      options: []
      required: false
    - id: 9
      name: asset_id
      label: Asset ID
      hint: Asset identifier
      type: text
      options: []
      required: true
    - id: 10
      name: asset_description
      label: Asset Description
      hint: What is the asset
      type: text
      options: []
      required: true
    - id: 11
      name: asset_type
      label: Asset Type
      hint: Category
      type: select_one
      options:
      - Real Property
      - Vehicle
      - Equipment
      - Jewelry
      - Art or Collectibles
      - Business Equipment
      - Inventory
      - Other
      required: true
    - id: 12
      name: asset_location
      label: Asset Location
      hint: Where located
      type: text
      options: []
      required: true
    - id: 13
      name: acquisition_date
      label: Date of Acquisition
      hint: When obtained
      type: date
      options: []
      required: true
    - id: 14
      name: purchase_price
      label: Original Purchase Price
      hint: What paid
      type: number
      options: []
      required: true
    - id: 15
      name: current_declared_value
      label: Current Declared Value
      hint: Insured amount
      type: number
      options: []
      required: true
    - id: 16
      name: appraisal_date
      label: Last Appraisal Date
      hint: When valued
      type: date
      options: []
      required: false
    - id: 17
      name: appraiser_name
      label: Appraiser Name
      hint: Who appraised
      type: text
      options: []
      required: false
    - id: 18
      name: appraiser_credentials
      label: Appraiser Credentials
      hint: Qualifications
      type: text
      options: []
      required: false
    - id: 19
      name: asset_condition
      label: Current Condition
      hint: State of asset
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      required: true
    - id: 20
      name: condition_notes
      label: Condition Notes
      hint: Describe state
      type: text
      options: []
      required: false
    - id: 21
      name: modifications_made
      label: Have Modifications Been Made
      hint: Alterations or upgrades
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: modifications_description
      label: Modifications Description
      hint: Describe changes
      type: text
      options: []
      required: false
    - id: 23
      name: photos_attached
      label: Number of Photos Attached
      hint: Documentation
      type: number
      options: []
      required: false
    - id: 24
      name: supporting_documents
      label: Supporting Documents
      hint: Attachments
      type: select_multiple
      options:
      - Purchase Receipt
      - Appraisal Report
      - Title Document
      - Insurance Policy
      - Photos
      - Video
      - Other
      required: true
    - id: 25
      name: ownership_verified
      label: Has Ownership Been Verified
      hint: Proof of ownership
      type: select_one
      options:
      - Yes - Documents Reviewed
      - Yes - Visually Confirmed
      - No - Pending
      required: true
    - id: 26
      name: value_confirmed
      label: Is Declared Value Confirmed
      hint: Agreed value
      type: select_one
      options:
      - Yes - Matches Appraisal
      - Yes - Within Range
      - No - Needs Adjustment
      - Unable to Verify
      required: true
    - id: 27
      name: verification_result
      label: Verification Result
      hint: Overall status
      type: select_one
      options:
      - Verified - All Confirmed
      - Verified with Notes
      - Partially Verified
      - Not Verified
      required: true
    - id: 28
      name: discrepancies_found
      label: Are There Discrepancies
      hint: Any issues
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 29
      name: discrepancies_description
      label: Discrepancies Description
      hint: Describe issues
      type: text
      options: []
      required: false
    - id: 30
      name: recommendations
      label: Recommendations
      hint: Suggested actions
      type: text
      options: []
      required: false
    - id: 31
      name: policy_holder_signature
      label: Policy Holder Signature
      hint: Type name to confirm
      type: text
      options: []
      required: true
    - id: 32
      name: verifier_signature
      label: Verifier Signature
      hint: Type name to sign
      type: text
      options: []
      required: true
