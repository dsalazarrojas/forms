      name: document_type
      label: Document Type
      hint: null
      type: select_multiple
      options:
      - document-type
      - Other
      required: true
    - id: 2
      name: date_archived
      label: Date Archived
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: storage_location
      label: Storage Location
      hint: null
