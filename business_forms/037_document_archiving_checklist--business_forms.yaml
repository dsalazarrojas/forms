      options:
      - storage-location
      - Other
      required: true
    - id: 4
      name: retention_period
      label: Retention Period
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: access_restrictions
      label: Access Restrictions
      hint: null
      type: select_one
      options:
      - access-restrictions
      - Other
      required: true
    - id: 6
      name: storage_media
      label: Storage Media
      hint: null
      type: select_multiple
      options:
      - storage-media
      - Other
      required: false
    - id: 7
      name: document_status
      label: Document Status
      hint: null
      type: select_one
      options:
      - document-status
      - Other
      required: true
    - id: 8
      name: retention_period_unit
      label: Retention Period Unit
      hint: null
