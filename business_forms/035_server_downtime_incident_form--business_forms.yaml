inputSchema:
  type: object
  properties:
    title: Server Downtime Incident Form
    pages:
    - id: 1
      name: incident_title
      label: server_downtime_incident_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_start_time
      label: incident_start_time
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: incident_end_time
      label: incident_end_time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: incident_description
      label: incident_description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: incident_affected_server
      label: incident_affected_servers
      hint: null
      type: select_one
      options:
      - server 001
      - server 002
      - server 003
      required: true
    - id: 6
      name: incident_priority
      label: priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 7
      name: incident_status
      label: status
      hint: null
      type: select_one
      options:
      - Open
      - In progress
      - Resolved
      required: true
    - id: 8
      name: incident_comment
      label: comment
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: incident_resolved_time
      label: resolved_time
      hint: null
      type: date
      options: []
      required: false
