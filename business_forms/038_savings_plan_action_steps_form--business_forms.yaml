inputSchema:
  type: object
  properties:
    title: Savings Plan Action Steps Form
    pages:
    - id: 1
      name: savings_goal
      label: 1. What are your savings goals?
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: action_item
      label: 2. What actions will you take to achieve your savings goals?
      hint: Please specify the actions you will take to reach your goal.
      type: select_multiple
      options:
      - Option A
      - Option B
      required: true
    - id: 3
      name: start_date
      label: 3. When do you plan to start making progress on your savings goals?
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: savings_amount
      label: 4. How much will you save towards your goals?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: payment_frequency
      label: 5. How often do you plan to save?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 6
      name: payment_method
      label: 6. What payment method will you use to make payments towards your savings
        goals?
      hint: null
      type: select_one
      options:
      - Debit Card
      - Credit Card
      - Bank Transfer
      required: true
    - id: 7
      name: payment_amount
      label: 7. How much will you pay each time?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: progress
      label: 8. What is your savings progress so far?
      hint: null
      type: select_one
      options:
      - On track
      - Behind schedule
      - Not started
      required: true
    - id: 9
      name: target_amount
      label: 9. What is your target amount to save?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: time_to_goal
      label: 10. How much time will you have to reach your savings goal?
      hint: null
      type: time
      options: []
      required: true
