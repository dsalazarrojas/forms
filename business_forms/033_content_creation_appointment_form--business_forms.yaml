inputSchema:
  type: object
  properties:
    title: Content Creation Appointment Form
    pages:
    - id: 1
      name: section_client_info
      label: -- Client Details --
      hint: Please provide your information below.
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_id
      label: Client Identification Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: section_appointment_details
      label: -- Appointment and Project Details --
      hint: Please share details for the appointment and project.
      type: note
      options: []
      required: false
    - id: 5
      name: service_requested
      label: Content Creation Service Requested
      hint: null
      type: select_one
      options:
      - Photography
      - Videography
      - Graphic Design
      - Copywriting
      - Social Media Content
      - Other
      required: true
    - id: 6
      name: project_description
      label: Brief Description of the Project
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: appointment_date
      label: Requested Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: appointment_time
      label: Requested Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: section_budget_timeline
      label: -- Budget and Deadline --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: estimated_budget
      label: Estimated Budget for the Project
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: project_deadline
      label: Requested Project Deadline
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: appointment_form_completed
      label: Appointment Form Completed?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
