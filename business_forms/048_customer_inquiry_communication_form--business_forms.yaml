inputSchema:
  type: object
  properties:
    title: Customer Inquiry Communication Form
    pages:
    - id: 1
      name: customer_inquiry_communication_form_1
      label: Customer Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_inquiry_communication_form_2
      label: Contact Method
      hint: How can we contact you?
      type: select_one
      options:
      - email
      - phone
      - mail
      required: true
    - id: 3
      name: customer_inquiry_communication_form_3
      label: Inquiry or Complaint
      hint: Describe your problem
      type: text
      options: []
      required: true
    - id: 4
      name: satisfactory_service
      label: Satisfactory Service
      hint: Did we provide satisfactory service?
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: date_of_inquiry_or_complaint
      label: Date of Incident
      hint: (mm/dd/yyyy)
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_contact
      label: Time of Contact
      hint: (HH -MM am/pm)
      type: time
      options: []
      required: true
    - id: 7
      name: customer_inquiry_communication_form_7
      label: Contact Information
      hint: Please enter your email address or phone number
      type: text
      options: []
      required: true
    - id: 8
      name: customer_inquiry_communication_form_8
      label: Preferred Method of Communication
      hint: Select all that apply
      type: select_multiple
      options:
      - email
      - phone
      - mail
      required: true
    - id: 9
      name: customer_inquiry_communication_form_9
      label: Additional Comments
      hint: Is there anything else you'd like to add?
      type: note
      options: []
      required: false
