inputSchema:
  type: object
  properties:
    title: plumbing-services-billing-form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: service_provider
      label: Service Provider
      hint: Enter the service provider name
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: service_description
      label: Service Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: service_cost
      label: Service Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 11
      name: payment_notes
      label: Payment Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 12
      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: true
