inputSchema:
  type: object
  properties:
    title: Business Event Evaluation Form
    pages:
    - id: 1
      name: event_information
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: Name of the event
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: When was the event?
      type: date
      options: []
      required: true
