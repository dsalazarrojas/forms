inputSchema:
  type: object
  properties:
    title: Digital Shelf Integration Request Form
    pages:
    - id: 1
      name: ecommerce_team_status
      label: Ecommerce Team Status
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: it_team_status
      label: IT Team Status
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: integration_platform
      label: Integration Platform
      hint: null
      type: select_one
      options:
      - Shopify
      - Magento
      - WooCommerce
      - Other
      required: false
    - id: 4
      name: integration_type
      label: Integration Type
      hint: Select the type of integration you're requesting
      type: select_one
      options:
      - API
      - FTP
      - SFTP
      - Other
      required: false
    - id: 5
      name: product_type
      label: Product Type
      hint: null
      type: select_multiple
      options:
      - Digital Product
      - Physical Product
      - Service
      - Other
      required: false
    - id: 6
      name: integration_date
      label: Integration Date
      hint: Select the date for integration
      type: date
      options: []
      required: false
    - id: 7
      name: integration_time
      label: Integration Time
      hint: Select the time for integration
      type: time
      options: []
      required: false
    - id: 8
      name: additional_notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 12
      name: output_file
      label: Output File
      hint: null
      type: text
      options: []
      required: false
