inputSchema:
  type: object
  properties:
    title: Building Systems Checklist
    pages:
    - id: 1
      name: checklist_date
      label: Checklist Date
      hint: Date of systems check
      type: date
      options: []
      required: true
    - id: 2
      name: building_location
      label: Building Location
      hint: Which facility
      type: text
      options: []
      required: true
    - id: 3
      name: inspector_name
      label: Inspector Name
      hint: Person conducting check
      type: text
      options: []
      required: true
    - id: 4
      name: shift_time
      label: Shift or Time of Check
      hint: Morning, afternoon, night
      type: select_one
      options:
