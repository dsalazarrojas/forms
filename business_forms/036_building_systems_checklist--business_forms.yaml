        - Afternoon
        - Evening
        - Night
        - Other
      required: false
    - id: 5
      name: security_cameras
      label: Security Cameras Operational
      hint: Are all cameras working
      type: select_one
      options:
        - Operational
        - Not Working
        - Partially Working
        - Not Applicable
      required: true
    - id: 6
      name: cameras_notes
      label: Camera System Notes
      hint: Any issues or details
      type: text
      options: []
      required: false
    - id: 7
      name: fire_extinguishers
      label: Fire Extinguishers Present and Accessible
      hint: All fire extinguishers in place
      type: select_one
