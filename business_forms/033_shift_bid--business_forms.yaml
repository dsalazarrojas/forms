inputSchema:
  type: object
  properties:
    title: Shift Bid
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_available
      label: Available Dates
      hint: Select available dates for shifts you can work
      type: date
      options: []
      required: false
    - id: 4
      name: preferred_hours
      label: Preferred Hours
      hint: null
      type: select_multiple
      options:
      - Shift 1
      - Shift 2
      - Shift 3
      required: false
    - id: 5
      name: job_code
      label: Job Code
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: shift_code
      label: Shift Code
      hint: null
      type: select_one
      options:
      - S1
      - S2
      - S3
      required: false
    - id: 7
      name: shift_description
      label: Shift Description
      hint: Briefly describe your shift preferences
      type: text
      options: []
      required: false
    - id: 8
      name: shift_rate
      label: Shift Rate
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: available_hours
      label: Available Hours
      hint: Select number of hours you are able to work
      type: text
      options: []
      required: false
    - id: 10
      name: shift_priority
      label: Shift Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 11
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 13
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
