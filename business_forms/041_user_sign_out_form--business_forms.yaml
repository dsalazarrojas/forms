inputSchema:
  type: object
  properties:
    title: User Sign Out Form
    pages:
    - id: 1
      name: sign_out_reason
      label: Sign Out Reasons
      hint: Please select the reasons for your sign out
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: confirmation
      label: Confirmation
      hint: Please confirm your sign out
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: sign_out_time
      label: Sign Out Time
      hint: Please provide the time you will sign out
      type: time
      options: []
      required: false
    - id: 4
      name: sign_out_date
      label: Sign Out Date
      hint: Please provide the date of your sign out
      type: date
      options: []
      required: false
    - id: 5
      name: sign_out_user
      label: Sign Out User
      hint: Please confirm your sign out status
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: Provide any additional information
      type: note
      options: []
      required: false
    - id: 7
      name: sign_out_frequency
      label: Sign Out Frequency
      hint: How often do you sign out?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Occasionally
      required: false
