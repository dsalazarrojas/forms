      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: estimated_time
      label: Estimated Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: total_value
      label: Total Value
      hint: null
      type: number
      options: []
