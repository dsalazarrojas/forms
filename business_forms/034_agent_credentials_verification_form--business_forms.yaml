inputSchema:
  type: object
  properties:
    title: Agent Credentials Verification Form
    pages:
    - id: 1
      name: header
      label: -- Agent Credentials Verification --
      hint: secure collection of professional licenses and identity
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Applicant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: credentials_header
      label: -- Professional Credentials --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: license_type
      label: Primary License Type - Real Estate, Insurance, Financial
      hint: select your primary field
      type: select_one
      options:
      - Real Estate Broker
      - Insurance Producer
      - Financial Advisor (Registered)
      - Mortgage Loan Originator
      - Legal Representative
      required: true
    - id: 6
      name: license_number
      label: License Number
      hint: as issued by the state or authority
      type: text
      options: []
      required: true
    - id: 7
      name: expiry_date
      label: License Expiry Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: issuing_authority
      label: Issuing Authority
      hint: e.g., Department of Insurance
      type: text
      options: []
      required: true
    - id: 9
      name: uploaded_docs
      label: Documents uploaded for verification - ID, License, Certifications
      hint: confirm what you are providing
      type: select_multiple
      options:
      - Government Photo ID
      - Professional License Copy
      - Educational Degree
      - Ethics Certification
      - Background Check Report
      required: true
    - id: 10
      name: background_header
      label: -- Background Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: suspension_check
      label: Have you ever had a license suspended or revoked?
      hint: null
      type: select_one
      options:
      - Yes
      - No
      required: true
    - id: 12
      name: suspension_details
      label: If yes, please provide details
      hint: explain the circumstances
      type: text
      options: []
      required: false
    - id: 13
      name: professional_references
      label: References for professional standing
      hint: name and contact of 2 industry peers
      type: text
      options: []
      required: true
