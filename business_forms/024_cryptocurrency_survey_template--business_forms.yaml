inputSchema:
  type: object
  properties:
    title: cryptocurrency_survey_template
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: What is your current job role
      hint: null
      type: select_one
      options:
      - CEO
      - Developer
      - Researcher
      - Other
      required: false
    - id: 3
      name: question_2
      label: Have you ever heard of cryptocurrency?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: question_3
      label: How do you feel about cryptocurrency?
      hint: null
      type: select_one
      options:
      - very likely
      - somewhat likely
      - not likely
      - not at all
      required: false
    - id: 5
      name: question_4
      label: How likely are you to invest in cryptocurrency?
      hint: null
      type: select_one
      options:
      - very likely
      - somewhat likely
      - not likely
      - not at all
      required: false
    - id: 6
      name: question_5
      label: What is your current knowledge about cryptocurrency?
      hint: null
      type: select_multiple
      options:
      - beginner
      - intermediate
      - advanced
      - expert
      required: false
    - id: 7
      name: question_6
      label: What is your level of concern about cryptocurrency?
      hint: null
      type: select_one
      options:
      - very concerned
      - somewhat concerned
      - not concerned
      - not at all concerned
      required: false
    - id: 8
      name: question_7
      label: Which cryptocurrency exchange do you primarily use?
      hint: null
      type: select_multiple
      options:
      - Binance
      - Coinbase
      - Kraken
      - Other
      required: false
    - id: 9
      name: question_8
      label: What is your current investment strategy for cryptocurrency?
      hint: null
      type: select_multiple
      options:
      - buy and hold
      - trade
      - hold back
      - not invested
      required: false
    - id: 10
      name: question_9
      label: How often do you trade cryptocurrency?
      hint: null
      type: select_one
      options:
      - frequently
      - rarely
      - never
      required: false
    - id: 11
      name: question_10
      label: How much money have you invested in cryptocurrency?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: question_11
      label: When do you think you will stop investing in cryptocurrency?
      hint: null
      type: date
      options: []
      required: false
    - id: 13
