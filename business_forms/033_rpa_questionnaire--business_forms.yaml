inputSchema:
  type: object
  properties:
    title: RPA Questionnaire
    pages:
    - id: 1
      name: rpa_automation_type
      label: What type of automation do you use?
      hint: null
      type: select_one
      options:
      - automation
      - manual
      required: false
    - id: 2
      name: rpa_process_type
      label: What type of process is being automated?
      hint: null
      type: select_multiple
      options:
      - business process
      - technical process
      required: false
    - id: 3
      name: rpa_frequency
      label: How often is this process being automated?
      hint: null
      type: select_one
      options:
      - daily
      - weekly
      - monthly
      required: false
    - id: 4
      name: rpa_benefits
      label: What benefits did you get from automating this process?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rpa_challenges
      label: What challenges did you face when automating this process?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: rpa_solutions
      label: What solutions did you find most effective in resolving these challenges?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: rpa_future_plans
      label: What are your future plans for process automation?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: rpa_roadmap
      label: What is your roadmap for process automation?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: rpa_roadmap_status
      label: What is the status of your roadmap for process automation?
      hint: null
      type: select_one
      options:
      - completed
      - ongoing
      - not started
      required: false
    - id: 10
      name: rpa_budget
      label: What is your expected budget for future automation projects?
      hint: null
      type: select_one
      options:
      - low
      - medium
      - high
      required: false
    - id: 11
      name: rpa_justification
      label: What is your justification for automating this process?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: rpa_success_metrics
      label: What success metrics do you use to measure the effectiveness of your
        automation?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: rpa_success_factors
      label: What factors contribute to the success of your automation?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: rpa_failure_factors
      label: What factors contribute to the failure of your automation?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: rpa_best_practices
      label: What best practices do you follow when implementing automation?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: rpa_worst_practices
      label: What practices should be avoided when implementing automation?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: rpa_lessons_learned
      label: What lessons did you learn from your automation experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: rpa_recommendations
      label: What recommendations do you have for others who wish to automate?
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: rpa_what_if
      label: What if you were not able to automate this process?
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: rpa_who
      label: Who is responsible for maintaining your automation?
      hint: null
      type: select_multiple
      options:
      - technical team
      - business user
      - manager
      required: false
    - id: 21
      name: rpa_how
      label: How does your automation fit into your overall process?
      hint: null
      type: select_multiple
      options:
      - manual
      - automated
      - hybrid
      required: false
    - id: 22
      name: rpa_why
      label: Why are you automating this process?
      hint: null
      type: select_multiple
      options:
      - cost savings
      - efficiency
      - scalability
      - customer satisfaction
      required: false
    - id: 23
      name: rpa_what_else
      label: What else did you consider when deciding to automate this process?
      hint: null
      type: select_multiple
      options:
      - speed
      - accuracy
      - reliability
      - quality
      required: false
    - id: 24
      name: rpa_who_else
      label: Who else was involved in the decision to automate this process?
      hint: null
      type: select_multiple
      options:
      - technical team
      - business user
      - manager
      required: false
    - id: 25
      name: rpa_comments
      label: What additional comments do you have about the automation?
      hint: null
      type: text
      options: []
      required: false
