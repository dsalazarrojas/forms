inputSchema:
  type: object
  properties:
    title: Angel Investment Refund Form
    pages:
    - id: 1
      name: section_refund_header
      label: -- Angel Investment Refund Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: investor_full_name
      label: Investor Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: company_startup_name
      label: Startup / Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: investor_email
      label: Investor Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: section_investment_details
      label: -- Investment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: total_investment_amount
      label: Total Original Investment Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: investment_date
      label: Date of Original Investment
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: investment_agreement_reference_number
      label: Investment Agreement Reference Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: section_refund_request
      label: -- Refund Request Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: refund_amount_requested
      label: Amount of Refund Requested
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: reason_for_refund
      label: Primary Reason for Refund
      hint: null
      type: select_one
      options:
      - Withdrawal during Cooling-off Period
      - Mutual Termination of Agreement
      - Regulatory Compliance Issue
      - Error in Transaction
      - Other
      required: true
    - id: 12
      name: detailed_reason_explanation
      label: Detailed Explanation for Refund Request
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: section_payout_info
      label: -- Payout Information --
      hint: Where should the refund be sent?
      type: note
      options: []
      required: false
    - id: 14
      name: bank_name_for_refund
      label: Receiving Bank Name
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: account_number_iban
      label: Account Number / IBAN
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: swift_bic_code
      label: SWIFT / BIC Code
      hint: For international refunds
      type: text
      options: []
      required: false
