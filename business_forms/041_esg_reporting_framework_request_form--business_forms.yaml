inputSchema:
  type: object
  properties:
    title: ESG Reporting Framework Request Form
    pages:
    - id: 1
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reporting_guidance
      label: Reporting Guidance
      hint: Select the type of ESG reporting guidance you are interested in
      type: select_multiple
      options:
      - ESG Reporting Guidance for Beginners
      - ESG Reporting Guidance for Intermediate
      - ESG Reporting Guidance for Advanced
      required: true
    - id: 3
      name: preferred_standards
      label: Preferred Standards
      hint: Select the preferred standards for ESG reporting
      type: select_one
      options:
      - Global Reporting Standards
      - Local Reporting Standards
      required: true
    - id: 4
      name: focus_areas
      label: Focus Areas
      hint: Select the focus areas for ESG reporting
      type: select_multiple
      options:
      - Climate Change
      - Social & Labor Practices
      - Human Rights
      required: true
    - id: 5
      name: esg_data_request
      label: ESG Data Request
      hint: Select the ESG data you are interested in
      type: select_one
      options:
      - ESG Data for Beginners
      - ESG Data for Intermediate
      - ESG Data for Advanced
      required: true
    - id: 6
      name: additional_comments
      label: Additional Comments
      hint: Is there anything else you would like to add?
      type: note
      options: []
      required: false
    - id: 7
      name: esg_reporting_team
      label: ESG Reporting Team
      hint: Provide information about your ESG reporting team
      type: text
      options: []
      required: false
    - id: 8
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
