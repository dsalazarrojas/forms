inputSchema:
  type: object
  properties:
    title: Office Screening Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Department A
      - Department B
      - Department C
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: 'Format: E.123-456-7890'
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: screening_result
      label: Screening Result
      hint: null
      type: select_multiple
      options:
      - Screening Passed
      - Screening Failed
      required: true
    - id: 8
      name: employee_status
      label: Employee Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Retired
      required: true
    - id: 9
      name: employee_type
      label: Employee Type
      hint: null
      type: select_multiple
      options:
      - Management
      - Non-Management
      - Contract
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
