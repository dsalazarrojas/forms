inputSchema:
  type: object
  properties:
    title: Company Magazine Survey Form
    pages:
      - id: 1
        name: reader_name
        label: Reader name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: readership_frequency
        label: How often do you read the magazine
        hint: Select frequency
        type: select_one
        options: [Every issue, Occasionally, Rarely, First time]
        required: true
      - id: 3
        name: content_relevance
        label: Content relevance
        hint: Rate the relevance of articles
        type: select_one
        options: [Very relevant, Relevant, Neutral, Not relevant]
        required: true
      - id: 4
        name: favorite_sections
        label: Favorite sections
        hint: Select sections you enjoy most
        type: select_multiple
        options: [Features, Interviews, Industry news, Tips, Events]
        required: false
      - id: 5
        name: suggestions
        label: Suggestions for future issues
        hint: Optional ideas or topics
        type: text
        options: []
        required: false
