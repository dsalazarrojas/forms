inputSchema:
  type: object
  properties:
    title: Retail Resource Efficiency Application Form
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: project_type
      label: Project Type
      hint: null
      type: select_one
      options:
      - Type 1
      - Type 2
      required: true
    - id: 6
      name: team_members
      label: Team Members
      hint: null
      type: select_multiple
      options:
      - Member 1
      - Member 2
      - Member 3
      - Member 4
      required: true
    - id: 7
      name: project_status
      label: Project Status
      hint: null
      type: select_one
      options:
      - Status 1
      - Status 2
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
