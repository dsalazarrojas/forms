inputSchema:
  type: object
  properties:
    title: Landscaping Billing Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: invoice_date
      label: Invoice Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: amount_due
      label: Amount Due
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: services_rendered
      label: Services Rendered
      hint: null
      type: select_multiple
      options:
      - Service A
      - Service B
      - Service C
      required: false
    - id: 5
      name: billing_method
      label: Billing Method
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 6
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: client_address
      label: Client Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Pending
      - Paid
      - Unpaid
      required: false
