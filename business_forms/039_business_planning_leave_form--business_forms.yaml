inputSchema:
  type: object
  properties:
    title: Business Planning Leave Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Company employee number
      type: text
      options: []
      required: true
    - id: 3
      name: employee_email
      label: Email Address
      hint: Work email
      type: email
      options: []
      required: true
    - id: 4
      name: employee_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: true
    - id: 6
      name: manager_name
      label: Direct Manager Name
      hint: Your supervisor's name
      type: text
      options: []
      required: true
    - id: 7
      name: manager_email
      label: Manager Email
      hint: Supervisor's email
      type: email
      options: []
      required: true
    - id: 8
      name: leave_request_date
      label: Leave Request Date
      hint: Date of this request
      type: date
      options: []
      required: true
    - id: 9
      name: leave_start_date
      label: Leave Start Date
      hint: When leave begins
      type: date
      options: []
      required: true
    - id: 10
      name: leave_end_date
      label: Leave End Date
      hint: When leave ends
      type: date
      options: []
      required: true
    - id: 11
      name: total_days_requested
      label: Total Days Requested
      hint: Number of working days
      type: number
      options: []
      required: true
    - id: 12
      name: leave_type
      label: Type of Leave
      hint: What type of leave?
      type: select_one
      options:
      - Personal Business Planning
      - Strategic Planning Initiative
      - Business Development
      - Project Planning
      - Other Business Purpose
      required: true
    - id: 13
      name: planning_objectives
      label: Business Planning Objectives
      hint: What will you work on?
      type: text
      options: []
      required: true
    - id: 14
      name: deliverables_expected
      label: Expected Deliverables
      hint: What will you produce?
      type: text
      options: []
      required: true
    - id: 15
      name: business_impact
      label: Expected Business Impact
      hint: How will this benefit the company?
      type: text
      options: []
      required: true
    - id: 16
      name: coverage_arrangements
      label: Coverage Arrangements
      hint: Who will cover your duties?
      type: text
      options: []
      required: true
    - id: 17
      name: critical_deadlines
      label: Critical Deadlines During Leave Period
      hint: Any important dates?
      type: text
      options: []
      required: false
    - id: 18
      name: emergency_contact
      label: Emergency Contact
      hint: Who to contact if needed
      type: text
      options: []
      required: true
    - id: 19
      name: previous_leave_balance
      label: Previous Leave Balance
      hint: Days remaining before this request
      type: number
      options: []
      required: false
    - id: 20
      name: additional_notes
      label: Additional Notes
      hint: Any other information?
      type: text
      options: []
      required: false
    - id: 21
      name: manager_approval
      label: Manager Approval
      hint: Has manager approved?
      type: select_one
      options:
      - Approved
      - Not Yet Approved
      - Pending
      required: true
