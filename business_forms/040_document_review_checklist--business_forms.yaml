inputSchema:
  type: object
  properties:
    title: Document Review Checklist
    pages:
    - id: 1
      name: document_overview
      label: Document Overview
      hint: A short description of the document
      type: text
      options: []
      required: true
    - id: 2
      name: document_type
      label: Document Type
      hint: null
      type: select_one
      options:
      - Manual
      - Report
      - Contract
      required: true
    - id: 3
      name: review_date
      label: Review Date
      hint: Date of review
      type: date
      options: []
      required: true
    - id: 4
      name: reviewer_name
      label: Reviewer's Name
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: review_period
      label: Review Period
      hint: Period of the review
      type: number
      options: []
      required: false
    - id: 6
      name: document_status
      label: Document Status
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: review_duration
      label: Review Duration
      hint: Duration of the review
      type: time
      options: []
      required: true
    - id: 8
      name: reviewer_notes
      label: Reviewer's Notes
      hint: Any additional notes for the reviewer
      type: text
      options: []
      required: true
    - id: 9
      name: document_version
      label: Document Version
      hint: Document version number
      type: number
      options: []
      required: true
    - id: 10
      name: review_location
      label: Review Location
      hint: Where was the review performed?
      type: select_one
      options:
      - Office
      - Home
      - Remote
      required: true
    - id: 11
      name: review_frequency
      label: Review Frequency
      hint: How often is the document reviewed?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 12
      name: review_comments
      label: Review Comments
      hint: Any review comments?
      type: text
      options: []
      required: false
