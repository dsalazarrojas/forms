inputSchema:
  type: object
  properties:
    title: Concerned Stakeholder Contact Form
    pages:
    - id: 1
      name: section_contact_details
      label: -- Contact Details --
      hint: Gather contact information for stakeholders raising concerns
      type: note
      options: []
      required: false
    - id: 2
      name: stakeholder_name
      label: Stakeholder name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Stakeholder organization if applicable
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact email
      hint: For further communication
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact phone
      hint: Optional phone number
      type: text
      options: []
      required: false
    - id: 6
      name: nature_of_concern
      label: Nature of concern
      hint: Describe the issue or concern in detail
      type: text
      options: []
      required: true
    - id: 7
      name: impact_description
      label: Impact description
      hint: How the concern affects stakeholders or operations
      type: text
      options: []
      required: false
    - id: 8
      name: desired_outcome
      label: Desired outcome
      hint: What resolution would satisfy the stakeholder
      type: text
      options: []
      required: false
    - id: 9
      name: consent_to_follow_up
      label: Consent to follow up
      hint: May we contact you for more information
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
