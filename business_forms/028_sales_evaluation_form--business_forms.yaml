inputSchema:
  type: object
  properties:
    title: Sales Evaluation Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: sales_performance
      label: Sales Performance
      hint: Rate sales performance (1-100)
      type: number
      options: []
      required: true
    - id: 4
      name: sales_performance_hands_on
      label: Sales Performance (hands on)
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: communication_skills
      label: Communication Skills
      hint: null
      type: select_one
      options:
      - Strong
      - Fair
      - Poor
      required: true
    - id: 6
      name: teamwork
      label: Teamwork
      hint: null
      type: select_multiple
      options:
      - Works well with team
      - Does not work well with team
      - Neutral
      required: true
    - id: 7
      name: productknowledge
      label: Product Knowledge
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Fair
      - Poor
      required: true
    - id: 8
      name: initiative_taking
      label: Initiative Taking
      hint: null
      type: select_one
      options:
      - Always
      - Sometimes
      - Rarely
      required: true
    - id: 9
      name: sales_tactics
      label: Sales Tactics
      hint: null
      type: select_multiple
      options:
      - Effective
      - Neutral
      - Poor
      required: false
    - id: 10
      name: evaluation_comments
      label: Evaluation Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: sales_tactics_comments
      label: Sales Tactics Comments
      hint: null
      type: text
      options: []
      required: false
