inputSchema:
  type: object
  properties:
    title: Event Marketing Consultation Form
    pages:
    - id: 1
      name: client_name
      label: client name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: business_need
      label: business need
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: event_type
      label: event type
      hint: null
      type: select_one
      options:
      - meeting
      - webinar
      - seminar
      - conference
      - trade show
      required: false
    - id: 4
      name: preferred_communication_channel
      label: preferred communication channel
      hint: null
      type: select_one
      options:
      - email
      - phone
      - video-call
      - in-person
      required: false
    - id: 5
      name: follow_up_preference
      label: follow-up preference
      hint: null
      type: select_one
      options:
      - email
      - phone
      - video-call
      - in-person
      required: false
    - id: 6
      name: next_steps
      label: next steps
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: assigned_to
      label: assigned to
      hint: null
      type: text
      options: []
      required: false
