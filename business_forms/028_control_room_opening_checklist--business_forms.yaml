      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: door_locks_functional
      label: Door locks functional
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
    - id: 7
      name: access_control_system
      label: Access control system operational
