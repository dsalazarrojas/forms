inputSchema:
  type: object
  properties:
    title: Control Room Opening Checklist
    pages:
    - id: 1
      name: operator_name
      label: Operator Name
      hint: Name of operator opening the control room
      type: text
      options: []
      required: true
    - id: 2
      name: operator_id
      label: Operator ID
      hint: Employee identification number
      type: text
      options: []
      required: true
    - id: 3
      name: shift_date
      label: Shift Date
      hint: Date of this shift
      type: date
      options: []
      required: true
    - id: 4
      name: shift_start_time
