inputSchema:
  type: object
  properties:
    title: trade_show_checklist_form
    pages:
    - id: 1
      name: general_preparations
      label: General Preparations
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: booth_materials
      label: Booth Materials
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: travel_details
      label: Travel Details
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: staff_details
      label: Staff Details
      hint: null
      type: select_multiple
      options:
      - CEO
      - Sales Team
      - Support Team
      required: false
    - id: 5
      name: contact_info
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      required: false
    - id: 6
      name: schedule
      label: Schedule
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: tasks
      label: Tasks
      hint: null
      type: select_multiple
      options:
      - Confirm Booth Layout
      - Confirm Booth Materials
      - Confirm Catering
      required: false
    - id: 8
      name: review
      label: Review
      hint: null
      type: date
      options: []
      required: false
