inputSchema:
  type: object
  properties:
    title: Service Technican Request Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Service 1
      - Service 2
      - Service 3
      required: false
    - id: 4
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: technician_notes
      label: Technician Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: assigned_technician
      label: Assigned Technician
      hint: null
      type: select_one
      options:
      - Technician 1
      - Technician 2
      - Technician 3
      required: false
