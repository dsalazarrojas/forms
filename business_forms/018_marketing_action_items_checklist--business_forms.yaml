inputSchema:
  type: object
  properties:
    title: Marketing Action Items Checklist
    pages:
    - id: 1
      name: campaign_task_title
      label: Campaign Task Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: campaign_status
      label: Campaign Status
      hint: null
      type: select_one
      options:
      - Active
      - Completed
      - Paused
      required: false
    - id: 3
      name: task_start_date
      label: Task Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: task_start_time
      label: Task Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: campaign_priority
      label: Campaign Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: campaign_priority_order
      label: Priority Order
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: task_notes
      label: Task Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: campaign_manager
      label: Campaign Manager
      hint: null
      type: text
      options: []
      required: false
