inputSchema:
  type: object
  properties:
    title: Employee Engagement Tool Requisition Form
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Please enter the name of the company making the request.
      type: text
      options: []
      required: true
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Please enter the name of the employee making the request.
      type: text
      options: []
      required: true
    - id: 3
      name: tool_request
      label: Tool Request
      hint: Please describe the tool or resource being requested.
      type: text
      options: []
      required: true
    - id: 4
      name: category
      label: Category
      hint: Please select the category for this tool request.
      type: select_multiple
      options:
      - Business Forms
      - Other
      - IT
      - Marketing
      - Operations
      - Finance
      required: true
    - id: 5
      name: status
      label: Status
      hint: Please select the status of the tool request.
      type: select_one
      options:
      - Open
      - In Progress
      - Done
      - Rejected
      required: true
    - id: 6
      name: submitted_date
      label: Submitted Date
      hint: When was the tool request submitted?
      type: date
      options: []
      required: true
    - id: 7
      name: assigned_by
      label: Assigned By
      hint: Is someone assigned to handle the tool request?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
