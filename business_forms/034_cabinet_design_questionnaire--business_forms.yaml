inputSchema:
  type: object
  properties:
    title: Cabinet Design Questionnaire
    pages:
    - id: 1
      name: client_info_header
      label: -- Client and Project Information --
      hint: Preparation for Design Appointment
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: project_address
      label: Project Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: project_scope_header
      label: -- Project Scope --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: room_selection
      label: Which rooms require cabinet design
      hint: select all that apply
      type: select_multiple
      options:
      - Kitchen
      - Master Bathroom
      - Guest Bathroom
      - Laundry Room
      - Home Office
      - Mudroom
      - Entertainment Center
      required: true
    - id: 7
      name: project_type
      label: Project Type
      hint: null
      type: select_one
      options:
      - New Construction
      - Full Remodel
      - Partial Update
      - Cabinet Refacing Only
      required: true
    - id: 8
      name: budget_range
      label: Estimated Budget for Cabinetry
      hint: excluding appliances and labor
      type: select_one
      options:
      - Under $10k
      - $10k to $25k
      - $25k to $50k
      - $50k Plus
      required: true
    - id: 9
      name: timeline_expectation
      label: Desired Installation Timeframe
      hint: null
      type: select_one
      options:
      - Immediate
      - 1 to 3 Months
      - 3 to 6 Months
      - 6 Months Plus
      required: true
    - id: 10
      name: functional_needs_header
      label: -- Functional Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: storage_priorities
      label: Key Storage Priorities
      hint: what do you need most
      type: select_multiple
      options:
      - Pantry Space
      - Pot and Pan Drawers
      - Spice Pull-outs
      - Trash/Recycle Centers
      - Corner Solutions
      - Tray Dividers
      required: false
    - id: 12
      name: cabinet_height
      label: Preferred Cabinet Height
      hint: null
      type: select_one
      options:
      - To the Ceiling
      - Standard 30/36 inch
      - Staggered Heights
      required: true
    - id: 13
      name: appliance_list
      label: Planned Appliances
      hint: list brand/model or sizes if known
      type: text
      options: []
      required: false
    - id: 14
      name: aesthetic_header
      label: -- Design Aesthetic --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: door_style_pref
      label: Preferred Door Style
      hint: null
      type: select_one
      options:
      - Shaker
      - Raised Panel
      - Flat/Slab
      - Inset
      - Mitered
      required: true
    - id: 16
      name: wood_species
      label: Preferred Material/Wood Species
      hint: null
      type: select_one
      options:
      - Maple
      - Cherry
      - Oak
      - Walnut
      - MDF/Painted
      - Laminate
      required: true
    - id: 17
      name: special_features
      label: Special Architectural Features
      hint: e.g. crown molding, glass doors, lighting
      type: text
      options: []
      required: false
    - id: 18
      name: appointment_notes
      label: Specific Questions for our Designer
      hint: null
      type: text
      options: []
      required: false
