inputSchema:
  type: object
  properties:
    title: Punch List Form
    pages:
    - id: 1
      name: task_assignments
      label: Task Assignments
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: employee_names
      label: Employee Names
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: assigned_dates
      label: Assigned Dates
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: due_dates
      label: Due Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 7
      name: task_completed
      label: Task Completed
      hint: Check if task is completed
      type: text
      options: []
      required: false
    - id: 8
      name: task_notes
      label: Task Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_to
      label: Assigned To
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: task_id
      label: Task ID
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
