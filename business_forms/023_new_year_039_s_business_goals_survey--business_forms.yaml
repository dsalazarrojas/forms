      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: performance_indicators
      label: How will you measure and track progress towards your business goals?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: goal_alignment
      label: How do you see your business goals aligning with your organizational
        mission?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
