inputSchema:
  type: object
  properties:
    title: New Year's Business Goals Survey
    pages:
    - id: 1
      name: new_years_business_goals
      label: What are your main business goals for the next year?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: business_objectives
      label: What are your top business objectives?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: expected_challenges
      label: What are the challenges you expect to face in the next year?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: business_goals
      label: How do you see your business goals aligning with your organizational
