inputSchema:
  type: object
  properties:
    title: Client Stories Form
    pages:
    - id: 1
      name: client_intro
      label: -- Share Your Success Story --
      hint: Help us understand your experience as a client
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_company
      label: Company or Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: client_title
      label: Your Title or Role
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: engagement_length
      label: How Long Have You Been a Client?
      hint: null
      type: select_one
      options:
      - Less than 3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - 2+ years
      required: true
    - id: 8
      name: initial_challenge
      label: Initial Challenge or Problem
      hint: What problem were you facing when you came to us?
      type: text
      options: []
      required: true
    - id: 9
      name: why_chose_us
      label: Why Did You Choose Us?
      hint: What attracted you to our services?
      type: text
      options: []
      required: true
    - id: 10
      name: solution_results
      label: Solution and Results Achieved
      hint: How did we help you? What changed?
      type: text
      options: []
      required: true
    - id: 11
      name: measurable_outcomes
      label: Measurable Business Outcomes
      hint: Specific numbers, percentages, or metrics
      type: text
      options: []
      required: false
    - id: 12
      name: positive_impact
      label: Most Positive Impact on Business
      hint: What impact has been most significant?
      type: text
      options: []
      required: false
    - id: 13
      name: best_aspects
      label: Best Aspects of Working With Us
      hint: What did we do really well?
      type: text
      options: []
      required: false
    - id: 14
      name: would_recommend
      label: Would You Recommend Us?
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Uncertain
      - Probably not
      - Definitely not
      required: true
    - id: 15
      name: testimonial_quote
      label: Testimonial or Quote
      hint: A brief quote describing your experience in your own words
      type: text
      options: []
      required: false
    - id: 16
      name: photo_permission
      label: May We Use Your Photo for Marketing?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 17
      name: case_study_permission
      label: May We Use Your Story as a Case Study?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Ask me first
      required: false
    - id: 18
      name: linkedin_profile
      label: LinkedIn Profile URL
      hint: Optional - helps verify your profile
      type: text
      options: []
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
