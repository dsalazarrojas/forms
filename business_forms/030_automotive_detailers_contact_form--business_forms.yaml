inputSchema:
  type: object
  properties:
    title: Automotive Detailers Contact Form
    pages:
    - id: 1
      name: section_header_customer
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: customer_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_vehicle
      label: -- Vehicle Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: vehicle_year
      label: Vehicle Year
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: vehicle_make
      label: Vehicle Make
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: vehicle_model
      label: Vehicle Model
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: vehicle_color
      label: Vehicle Color
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: license_plate
      label: License Plate
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: vehicle_type
      label: Vehicle Type
      hint: null
      type: select_one
      options:
      - Sedan
      - SUV
      - Truck
      - Van
      - Motorcycle
      - RV
      - Other
      required: true
    - id: 13
      name: section_header_detailing
      label: -- Detailing Service Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: service_type
      label: Type of Detail Service Desired
      hint: null
      type: select_one
      options:
      - Exterior Wash Only
      - Interior Cleaning Only
      - Full Detail
      - Premium Detail
      - Paint Protection
      - Custom Service
      required: true
    - id: 15
      name: specific_services
      label: Specific Services Requested
      hint: Select all that apply
      type: select_multiple
      options:
      - Hand Wash
      - Wax Application
      - Interior Vacuum
      - Upholstery Cleaning
      - Window Cleaning
      - Tire Dressing
      - Engine Bay Detail
      - Ceramic Coating
      required: true
    - id: 16
      name: section_header_condition
      label: -- Vehicle Condition --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: vehicle_condition
      label: Current Vehicle Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Deep Cleaning
      required: true
    - id: 18
      name: specific_issues
      label: Specific Cleaning Issues or Concerns
      hint: Stains, odors, damage, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: section_header_appointment
      label: -- Appointment Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: preferred_date
      label: Preferred Service Date
      hint: null
      type: date
      options: []
      required: true
    - id: 21
      name: preferred_time
      label: Preferred Service Time
      hint: null
      type: select_one
      options:
      - Morning (8 AM - 12 PM)
      - Afternoon (12 PM - 5 PM)
      - Evening (5 PM - 8 PM)
      - Flexible
      required: true
    - id: 22
      name: service_location
      label: Service Location Preference
      hint: null
      type: select_one
      options:
      - At Our Facility
      - Mobile Service (Your Location)
      - No Preference
      required: true
    - id: 23
      name: section_header_pricing
      label: -- Pricing and Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: estimated_budget
      label: Estimated Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 25
      name: additional_notes
      label: Additional Notes or Special Requests
      hint: null
      type: text
      options: []
      required: false
