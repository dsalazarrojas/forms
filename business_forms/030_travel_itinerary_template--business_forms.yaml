inputSchema:
  type: object
  properties:
    title: Travel Itinerary Template
    pages:
    - id: 1
      name: travel_agency
      label: Travel Agency
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: trip_type
      label: Trip Type
      hint: null
      type: select_one
      options:
      - Business
      - Leisure
      required: true
    - id: 3
      name: travel_dates
      label: Travel Dates
      hint: From 1-9-2015 to 1-1-2023
      type: date
      options: []
      required: false
    - id: 4
      name: travel_destination
      label: Destination
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: travel_agency_details
      label: Travel Agency Details
      hint: Agency address, contact info, etc.
      type: text
      options: []
      required: false
    - id: 6
      name: traveler_details
      label: Traveler Details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Check
      required: true
    - id: 8
      name: travel_agency_phone
      label: Agency Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: travel_agency_email
      label: Agency Email
      hint: null
      type: email
      options: []
      required: false
