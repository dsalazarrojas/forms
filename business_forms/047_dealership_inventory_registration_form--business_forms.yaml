inputSchema:
  type: object
  properties:
    title: Dealership Inventory Registration Form
    pages:
    - id: 1
      name: vehicle_make
      label: Vehicle Make
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: vehicle_model
      label: Vehicle Model
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: vehicle_year
      label: Vehicle Year
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: is_available_for_purchase
      label: Is Vehicle Available for Purchase?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: register_multiple_models
      label: Register Multiple Models?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: is_available_forimmediate_delivery
      label: Is Vehicle Available for Immediate Delivery?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: vehicle_note
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: register_immediately
      label: Register Vehicle Immediately?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: is_vehicle_available_for_trade_in
      label: Is Vehicle Available for Trade-in?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: is_vehicle_in_good_condition
      label: Is Vehicle in Good Condition?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: vehicle_delivery_date
      label: Vehicle Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: vehicle_delivery_time
      label: Vehicle Delivery Time
      hint: null
      type: time
      options: []
      required: false
