inputSchema:
  type: object
  properties:
    title: Contract Review Appointment Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Client Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Client Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: organization
      label: Organization
      hint: Company name
      type: text
      options: []
      required: false
    - id: 5
      name: client_title
      label: Client Title
      hint: Job title
      type: text
      options: []
      required: false
    - id: 6
      name: request_date
      label: Request Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 7
      name: contract_type
      label: Contract Type
      hint: Type of agreement
      type: select_one
      options:
      - Service agreement
      - Vendor contract
      - Employment contract
      - Partnership agreement
      - Licensing agreement
      - Lease agreement
      - Purchase agreement
      - Non-disclosure agreement
      - Other
      required: true
    - id: 8
      name: contract_title
      label: Contract Title
      hint: Name of contract
      type: text
      options: []
      required: true
    - id: 9
      name: contract_value
      label: Contract Value
      hint: Dollar amount
      type: number
      options: []
      required: false
    - id: 10
      name: review_type
      label: Review Type
      hint: What type of review?
      type: select_one
      options:
      - Initial draft review
      - Revision review
      - Final review
      - Urgent review
      - Consultation only
      required: true
    - id: 11
      name: preferred_appointment_date
      label: Preferred Appointment Date
      hint: First choice
      type: date
      options: []
      required: true
    - id: 12
      name: alternative_appointment_date
      label: Alternative Appointment Date
      hint: Second choice
      type: date
      options: []
      required: false
    - id: 13
      name: preferred_time
      label: Preferred Time
      hint: Time of day
      type: select_one
      options:
      - Morning (8am-12pm)
      - Afternoon (12pm-5pm)
      - Evening (5pm-8pm)
      - Any time
      required: true
    - id: 14
      name: appointment_duration
      label: Appointment Duration
      hint: How long needed?
      type: select_one
      options:
      - 30 minutes
      - 1 hour
      - 2 hours
      - Half day
      - Full day
      required: true
    - id: 15
      name: meeting_format
      label: Meeting Format
      hint: How to meet?
      type: select_one
      options:
      - In-person
      - Video conference
      - Phone call
      - Email only
      required: true
    - id: 16
      name: urgency_level
      label: Urgency Level
      hint: How urgent?
      type: select_one
      options:
      - Routine
      - Standard
      - Urgent
      - Critical
      required: true
    - id: 17
      name: deadline
      label: Deadline
      hint: When is contract needed?
      type: date
      options: []
      required: true
    - id: 18
      name: documents_to_review
      label: Documents to Review
      hint: List documents
      type: text
      options: []
      required: true
    - id: 19
      name: specific_concerns
      label: Specific Concerns
      hint: What to focus on?
      type: text
      options: []
      required: false
    - id: 20
      name: prior_legal_review
      label: Prior Legal Review
      hint: Has legal reviewed before?
      type: select_one
      options:
      - Yes, internally
      - Yes, externally
      - false
      - Not applicable
      required: false
    - id: 21
      name: budget_for_review
      label: Budget for Review
      hint: Estimated budget
      type: select_one
      options:
      - Under $500
      - $500-$1,000
      - $1,000-$2,500
      - $2,500-$5,000
      - Over $5,000
      - Unsure
      required: false
    - id: 22
      name: preferred_attorney
      label: Preferred Attorney
      hint: Any preference?
      type: text
      options: []
      required: false
    - id: 23
      name: how_did_you_hear
      label: How Did You Hear About Us?
      hint: Source of referral
      type: select_one
      options:
      - Website
      - Referral
      - Advertisement
      - Previous client
      - Social media
      - Other
      required: false
    - id: 24
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
