inputSchema:
  type: object
  properties:
    title: Contract Preparation Form
    pages:
    - id: 1
      name: requestor_name
      label: Requestor Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: requestor_title
      label: Requestor Title
      hint: Job title
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Sales
      - Procurement
      - Legal
      - Operations
      - Finance
      - Human Resources
      - IT
      - Marketing
      - Other
      required: true
    - id: 4
      name: request_date
      label: Request Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 5
      name: contract_type
      label: Contract Type
      hint: Type of agreement
      type: select_one
      options:
      - Service agreement
      - Vendor contract
      - Employment contract
      - Independent contractor
      - Partnership agreement
      - Licensing agreement
      - Lease agreement
      - Purchase agreement
      - Non-disclosure agreement
      - Memorandum of understanding
      - Other
      required: true
    - id: 6
      name: contract_title
      label: Contract Title
      hint: Name of contract
      type: text
      options: []
      required: true
    - id: 7
      name: other_party_name
      label: Other Party Name
      hint: Counterparty name
      type: text
      options: []
      required: true
    - id: 8
      name: other_party_type
      label: Other Party Type
      hint: Entity type
      type: select_one
      options:
      - Corporation
      - LLC
      - Partnership
      - Sole proprietorship
      - Individual
      - Government entity
      - Non-profit organization
      - Other
      required: true
    - id: 9
      name: other_party_address
      label: Other Party Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 10
      name: other_party_contact
      label: Other Party Contact
      hint: Email and phone
      type: text
      options: []
      required: true
    - id: 11
      name: contract_value
      label: Contract Value
      hint: Total dollar amount
      type: number
      options: []
      required: true
    - id: 12
      name: contract_duration
      label: Contract Duration
      hint: Length of agreement
      type: select_one
      options:
      - One-time
      - Less than 6 months
      - 6 months to 1 year
      - 1-2 years
      - 2-5 years
      - 5+ years
      - Ongoing until terminated
      required: true
    - id: 13
      name: effective_date
      label: Effective Date
      hint: Start date
      type: date
      options: []
      required: true
    - id: 14
      name: expiration_date
      label: Expiration Date
      hint: End date
      type: date
      options: []
      required: false
    - id: 15
      name: auto_renewal
      label: Auto Renewal
      hint: Should it auto-renew?
      type: select_one
      options:
      - true
      - false
      - To be determined
      required: true
    - id: 16
      name: payment_terms
      label: Payment Terms
      hint: How will payment work?
      type: text
      options: []
      required: true
    - id: 17
      name: deliverables
      label: Deliverables
      hint: What will be delivered?
      type: text
      options: []
      required: true
    - id: 18
      name: key_obligations
      label: Key Obligations
      hint: Main responsibilities
      type: text
      options: []
      required: true
    - id: 19
      name: special_terms
      label: Special Terms
      hint: Unique conditions
      type: text
      options: []
      required: false
    - id: 20
      name: template_to_use
      label: Template to Use
      hint: Preferred template
      type: select_one
      options:
      - Standard company template
      - Other party template
      - Industry standard
      - Custom draft
      - Previous contract
      required: true
    - id: 21
      name: previous_contract_reference
      label: Previous Contract Reference
      hint: Any prior contract?
      type: text
      options: []
      required: false
    - id: 22
      name: approvals_needed
      label: Approvals Needed
      hint: Who must approve?
      type: select_multiple
      options:
      - Department manager
      - Director
      - Vice president
      - Legal
      - Finance
      - Executive
      - Board
      required: true
    - id: 23
      name: urgency_level
      label: Urgency Level
      hint: How urgent?
      type: select_one
      options:
      - Routine
      - Standard
      - Urgent
      - Critical
      required: true
    - id: 24
      name: deadline
      label: Deadline
      hint: When is it needed?
      type: date
      options: []
      required: true
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
