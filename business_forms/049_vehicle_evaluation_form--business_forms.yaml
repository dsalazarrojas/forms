      label: Transmission
      hint: []
      type: select_one
      options:
      - Manual
      - Automatic
      - Continuously Variable Transmission
      required: false
    - id: 4
      name: drive_type
      label: Drive Type
      hint: []
      type: select_one
      options:
      - Front Wheel Drive
      - Rear Wheel Drive
      - All Wheel Drive
      required: false
    - id: 5
      name: fuel_type
