inputSchema:
  type: object
  properties:
    title: Public Transport Incident Form
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: Date of incident
      type: date
      options: []
      required: false
    - id: 2
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: incident_location
      label: Incident Location
      hint: Where the incident occurred
      type: text
      options: []
      required: false
    - id: 4
      name: incident_description
      label: Description of incident
      hint: Detailed description of the incident
      type: text
      options: []
      required: false
    - id: 5
      name: incident_affected_route
      label: Affected Route
      hint: null
      type: select_one
      options:
      - Route 1
      - Route 2
      required: false
    - id: 6
      name: incident_affected_vehicle
      label: Affected Vehicle
      hint: null
      type: select_multiple
      options:
      - Vehicle 1
      - Vehicle 2
      required: false
    - id: 7
      name: incident_cause
      label: Cause of incident
      hint: Reason why the incident occurred
      type: text
      options: []
      required: false
