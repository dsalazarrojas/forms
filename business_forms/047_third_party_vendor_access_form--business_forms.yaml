    - id: 5
      name: access_expiration_time
      label: Access Expiration Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: vendor_email
      label: Vendor Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: vendor_phone
      label: Vendor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: vendor_address
      label: Vendor Address
      hint: null
      type: text
      options: []
      required: false
