      required: false
    - id: 11
      name: notes_for_assigned_tool
      label: Notes for Assigned Tool
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: vendor_type
      label: Vendor Type
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: vendor_status
      label: Vendor Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: false
