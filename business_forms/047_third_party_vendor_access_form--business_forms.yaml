      name: third_party_vendor_access_form_1_page
      label: Third Party Vendor Access Form 1
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_details
      label: Contact Details
      hint: Enter contact information for the vendor
      type: select_multiple
      options:
      - Vendor Manager
      - Vendor Contact
      - Account Owner
      required: false
    - id: 3
      name: access_level
