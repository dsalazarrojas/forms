inputSchema:
  type: object
  properties:
    title: Call Center Form
    pages:
    - id: 1
      name: call_info_header
      label: -- Call Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: call_date
      label: Call Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: call_time
      label: Call Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: call_duration
      label: Call Duration (minutes)
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: agent_header
      label: -- Agent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: agent_name
      label: Agent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: agent_id
      label: Agent ID
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: call_type_header
      label: -- Call Type --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: call_type
      label: Type of Call
      hint: null
      type: select_one
      options:
      - Inbound - Sales
      - Inbound - Support
      - Inbound - General Inquiry
      - Outbound - Sales
      - Outbound - Follow-up
      - Outbound - Survey
      - Outbound - Collection
      - Other
      required: true
    - id: 10
      name: customer_header
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: customer_phone
      label: Customer Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: customer_email
      label: Customer Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: customer_id
      label: Customer ID
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: account_number
      label: Account Number
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: call_details_header
      label: -- Call Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: call_reason
      label: Reason for Call
      hint: null
      type: select_one
      options:
      - Product inquiry
      - Service issue
      - Billing question
      - Account update
      - Complaint
      - Follow-up
      - Appointment scheduling
      - Other
      required: true
    - id: 18
      name: call_summary
      label: Call Summary
      hint: Brief description of what was discussed
      type: text
      options: []
      required: true
    - id: 19
      name: resolution_header
      label: -- Resolution --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: call_resolved
      label: Was the Issue Resolved?
      hint: null
      type: select_one
      options:
      - Yes - Fully resolved
      - Partially resolved
      - No - Escalated
      - Requires follow-up
      required: true
    - id: 21
      name: next_steps
      label: Next Steps or Follow-up Actions
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: escalation_needed
      label: Escalation Needed?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: escalation_reason
      label: If Escalated - Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: escalation_department
      label: Escalation Department
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
