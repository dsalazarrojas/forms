inputSchema:
  type: object
  properties:
    title: Fire Safety Plan Validation Form
    pages:
    - id: 1
      name: company_info
      label: Company Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_info
      label: Employee Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: fire_safety_plan
      label: Fire Safety Plan
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: plan_approval
      label: Plan Approval
      hint: null
      type: select_one
      options:
      - Approved
      - Not Approved
      - Pending
      required: false
    - id: 6
      name: fire_safety_plan_version
      label: Fire Safety Plan Version
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: fire_safety_plan_status
      label: Fire Safety Plan Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Not Applicable
      required: false
    - id: 8
      name: fire_safety_plan_effectiveness
      label: Fire Safety Plan Effectiveness
      hint: null
      type: select_multiple
      options:
      - Effective
      - Not Effective
      - Pending
      required: false
