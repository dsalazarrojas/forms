inputSchema:
  type: object
  properties:
    title: Contact Information Form
    pages:
    - id: 1
      name: personal_info_header
      label: -- Contact Information --
      hint: Collect essential contact details
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: company
      label: Company name
      hint: Organization or business name
      type: text
      options: []
      required: false
    - id: 4
      name: position
      label: Position or title
      hint: Your job title
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Business email address
      hint: Preferred work email
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone number
      hint: Direct contact number
      type: text
      options: []
      required: false
    - id: 7
      name: address
      label: Address
      hint: Company address or mailing address
      type: text
      options: []
      required: false
    - id: 8
      name: preferred_contact_method
      label: Preferred contact method
      hint: How should we reach you
      type: select_one
      options:
      - Email
      - Phone
      - No preference
      required: false
    - id: 9
      name: best_time_to_contact
      label: Best time to contact
      hint: Preferred time window for contact
      type: time
      options: []
      required: false
    - id: 10
      name: additional_information
      label: Additional information
      hint: Any other notes for the business record
      type: text
      options: []
      required: false
