inputSchema:
  type: object
  properties:
    title: Construction Site Audit Form
    pages:
    - id: 1
      name: audit_date
      label: Audit Date
      hint: Date of site audit
      type: date
      options: []
      required: true
    - id: 2
      name: audit_time
      label: Audit Time
      hint: Time audit started
      type: time
      options: []
      required: true
    - id: 3
      name: auditor_name
      label: Auditor Name
      hint: Name of person conducting audit
      type: text
      options: []
      required: true
    - id: 4
      name: auditor_company
      label: Auditor Company
      hint: Company or organization
      type: text
      options: []
      required: true
    - id: 5
      name: project_name
      label: Project Name
      hint: Name of construction project
      type: text
      options: []
      required: true
    - id: 6
      name: project_address
      label: Project Address
      hint: Full site address
      type: text
      options: []
      required: true
    - id: 7
      name: general_contractor
      label: General Contractor
      hint: Primary contractor company
      type: text
      options: []
      required: true
    - id: 8
      name: site_manager
      label: Site Manager
      hint: Name of site manager
      type: text
      options: []
      required: true
    - id: 9
      name: construction_phase
      label: Current Construction Phase
      hint: Stage of construction
      type: select_one
      options:
      - Site Preparation
      - Foundation
      - Structural Framing
      - Exterior Work
      - Interior Rough-In
      - Interior Finishing
      - Final Completion
      required: true
    - id: 10
      name: workers_on_site
      label: Number of Workers on Site
      hint: Total headcount at time of audit
      type: number
      options: []
      required: true
    - id: 11
      name: subcontractors_present
      label: Subcontractors Present
      hint: List subcontractor companies
      type: text
      options: []
      required: false
    - id: 12
      name: site_security
      label: Site Security
      hint: Rate overall site security
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: housekeeping
      label: Housekeeping
      hint: Rate site cleanliness and organization
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: material_storage
      label: Material Storage
      hint: Are materials stored properly
      type: select_one
      options:
      - Yes, All Proper
      - Mostly Proper
      - Some Issues
      - Poor
      required: true
    - id: 15
      name: waste_management
      label: Waste Management
      hint: Is waste being managed properly
      type: select_one
      options:
      - Yes, Excellent
      - Yes, Adequate
      - Needs Improvement
      - Poor
      required: true
    - id: 16
      name: equipment_condition
      label: Equipment Condition
      hint: State of equipment on site
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: safety_compliance
      label: Safety Compliance
      hint: Overall safety compliance rating
      type: select_one
      options:
      - Fully Compliant
      - Substantially Compliant
      - Partially Compliant
      - Non-Compliant
      required: true
    - id: 18
      name: environmental_compliance
      label: Environmental Compliance
      hint: Are environmental protocols followed
      type: select_one
      options:
      - Fully Compliant
      - Substantially Compliant
      - Partially Compliant
      - Non-Compliant
      required: true
    - id: 19
      name: quality_assurance
      label: Quality Assurance
      hint: Is QA program being followed
      type: select_one
      options:
      - Yes, Fully
      - Yes, Mostly
      - Partially
      - false
      required: true
    - id: 20
      name: schedule_adherence
      label: Schedule Adherence
      hint: Is project on schedule
      type: select_one
      options:
      - Ahead of Schedule
      - On Schedule
      - Slightly Behind
      - Significantly Behind
      required: true
    - id: 21
      name: budget_status
      label: Budget Status
      hint: Is project within budget
      type: select_one
      options:
      - Under Budget
      - On Budget
      - Slightly Over
      - Significantly Over
      required: true
    - id: 22
      name: documentation_review
      label: Documentation Review
      hint: Are required documents maintained
      type: select_one
      options:
      - Yes, Complete
      - Yes, Mostly Complete
      - Incomplete
      - Poor
      required: true
    - id: 23
      name: issues_identified
      label: Issues Identified
      hint: Number of issues found
      type: number
      options: []
      required: true
    - id: 24
      name: issue_description
      label: Issue Description
      hint: Describe each issue
      type: text
      options: []
      required: false
    - id: 25
      name: corrective_actions
      label: Corrective Actions Required
      hint: What needs to be done
      type: text
      options: []
      required: true
    - id: 26
      name: follow_up_required
      label: Follow-Up Required
      hint: Is reinspection needed
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 27
      name: follow_up_date
      label: Follow-Up Date
      hint: Scheduled date if applicable
      type: date
      options: []
      required: false
    - id: 28
      name: overall_assessment
      label: Overall Site Assessment
      hint: Final determination
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Unacceptable
      required: true
    - id: 29
      name: auditor_comments
      label: Auditor Comments
      hint: Additional notes
      type: text
      options: []
      required: false
    - id: 30
      name: auditor_signature
      label: Auditor Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 31
      name: site_manager_signature
      label: Site Manager Signature
      hint: Type full name as signature
      type: text
      options: []
      required: false
