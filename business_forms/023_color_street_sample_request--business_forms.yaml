inputSchema:
  type: object
  properties:
    title: Color Street Sample Request
    pages:
    - id: 1
      name: section_request_contact
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: request_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: request_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: request_address
      label: Mailing Address
      hint: Street, City, State, ZIP
      type: text
      options: []
      required: true
    - id: 5
      name: request_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_nail_survey
      label: -- About Your Nails --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: preferred_style
      label: What style of nail polish do you prefer?
      hint: null
      type: select_multiple
      options:
      - Solids
      - Glitters
      - Designs
      - French Manicure
      required: true
    - id: 8
      name: polish_troubles
      label: What is your biggest struggle with traditional liquid polish?
      hint: null
      type: select_one
      options:
      - Chipping
      - Dry Time
      - Messy Application
      - Smell
      required: false
    - id: 9
      name: interested_in_party
      label: Would you be interested in hosting an online party for free nails?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Tell me more
      required: true
    - id: 10
      name: interested_in_business
      label: Are you interested in learning about the Stylist opportunity?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: section_social
      label: -- Find Me Online --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: social_media_handle
      label: Your Facebook or Instagram handle
      hint: To tag you when I send your sample
      type: text
      options: []
      required: false
    - id: 13
      name: sample_request_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
