inputSchema:
  type: object
  properties:
    title: Cruise Job Application Form
    pages:
    - id: 1
      name: job_application
      label: Job Application
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: work_experience
      label: work_experience
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: job_title
      label: Job Title
      hint: null
      type: select_one
      options:
      - Cruise Director
      - Cruise Manager
      - Cruise Captain
      required: false
    - id: 4
      name: work_hours
      label: Work Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Sales
      - Marketing
      - Operations
      required: false
    - id: 6
      name: job_level
      label: Job Level
      hint: null
      type: select_one
      options:
      - Entry-Level
      - Mid-Level
      - Senior-Level
      required: false
    - id: 7
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Human Resources
      - Marketing
      - Operations
      required: false
    - id: 8
      name: job_status
      label: Job Status
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Freelance
      required: false
    - id: 9
      name: job_location
      label: Job Location
      hint: null
      type: select_one
      options:
      - Onboard
      - Ashore
      required: false
    - id: 10
      name: work_schedule
      label: Work Schedule
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: salary
      label: Salary
      hint: null
      type: number
      options: []
      required: false
