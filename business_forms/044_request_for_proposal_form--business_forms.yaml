inputSchema:
  type: object
  properties:
    title: Request For Proposal Form
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_type
      label: Project Type
      hint: null
      type: select_one
      options:
      - Software Development
      - Web Development
      - Mobile App Development
      required: false
    - id: 3
      name: project_description
