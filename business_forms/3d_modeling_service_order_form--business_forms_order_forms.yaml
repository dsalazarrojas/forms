    - id: 21
      name: rendering_service
      label: Professional rendering service
      hint: null
      type: select_one
      options:
      - Standard rendering
      - Photorealistic rendering
      - Multiple angle renders
      - Not needed
      required: false
    - id: 22
      name: section_header_final_details
      label: '--- Final Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: special_instructions
      label: Special instructions or customization notes
      hint: Any specific requirements or preferences
      type: text
      options: []
      required: false
    - id: 24
      name: additional_comments
      label: Additional comments or notes
      hint: Anything else we should know about your project
      type: text
      options: []
      required: false
