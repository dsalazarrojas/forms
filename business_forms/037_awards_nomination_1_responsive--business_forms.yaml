inputSchema:
  type: object
  properties:
    title: Awards Nomination 1 Responsive
    pages:
    - id: 1
      name: section_nominator_info
      label: -- Nominator Details --
      hint: Information about the person submitting the nomination
      type: note
      options: []
      required: false
    - id: 2
      name: nominator_name
      label: Nominator Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: nominator_email
      label: Nominator Email Address
      hint: For confirmation and follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: nominator_department
      label: Nominator Department or Team
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_nominee_info
      label: -- Nominee Details --
      hint: Information about the person or group being nominated
      type: note
      options: []
      required: false
    - id: 6
      name: nominee_name
      label: Nominee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: nominee_department
      label: Nominee Department or Team
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: nominee_title
      label: Nominee Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: section_award_nomination
      label: -- Award and Honor Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: award_category_select
      label: Award Category
      hint: Choose the most appropriate award
      type: select_one
      options:
      - Employee of the Month
      - Leadership and Vision Award
      - Innovation and Creativity Award
      - Team Player and Collaboration Award
      - Customer Service Excellence
      required: true
    - id: 11
      name: nominator_relationship
      label: Relationship to Nominee
      hint: Your professional connection
      type: select_one
      options:
      - Peer/Colleague
      - Direct Manager/Supervisor
      - Direct Report
      - Client or External Partner
      required: true
    - id: 12
      name: nomination_reason
      label: Detailed Reason for Nomination
      hint: Why does this person deserve this award?
      type: text
      options: []
      required: true
    - id: 13
      name: specific_examples
      label: Specific Examples of Excellence
      hint: Provide 1-2 scenarios or projects where the nominee excelled
      type: text
      options: []
      required: true
    - id: 14
      name: organizational_impact
      label: Impact on Organization
      hint: How has their work benefitted the team or company?
      type: text
      options: []
      required: true
    - id: 15
      name: nomination_scope
      label: Nomination Scope
      hint: Is this for an individual or a group?
      type: select_one
      options:
      - Individual
      - Group/Department
      required: true
    - id: 16
      name: nomination_date
      label: Date of Nomination
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: nomination_confirmation
      label: I certify this nomination is based on professional merit
      hint: null
      type: select_one
      options:
      - Yes, I certify
      - Other
      required: true
    - id: 18
      name: nomination_signature
      label: Digital Signature
      hint: Type full name to sign
      type: text
      options: []
      required: true
