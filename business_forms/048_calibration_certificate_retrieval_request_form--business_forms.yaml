inputSchema:
  type: object
  properties:
    title: Calibration Certificate Retrieval Request Form
    pages:
    - id: 1
      name: requester_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For certificate delivery
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: false
    - id: 6
      name: request_date
      label: Request Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 7
      name: equipment_name
      label: Equipment Name
      hint: Name of equipment
      type: text
      options: []
      required: true
    - id: 8
      name: equipment_id
      label: Equipment ID
      hint: Asset or serial number
      type: text
      options: []
      required: true
    - id: 9
      name: equipment_type
      label: Equipment Type
      hint: Type of equipment
      type: select_one
      options:
      - Scale
      - Balance
      - Pressure gauge
      - Temperature sensor
      - Flow meter
      - Force gauge
      - Multimeter
      - Other measuring device
      - Other
      required: true
    - id: 10
      name: manufacturer
      label: Manufacturer
      hint: Equipment manufacturer
      type: text
      options: []
      required: false
    - id: 11
      name: model_number
      label: Model Number
      hint: Equipment model
      type: text
      options: []
      required: false
    - id: 12
      name: serial_number
      label: Serial Number
      hint: Equipment serial number
      type: text
      options: []
      required: false
    - id: 13
      name: last_calibration_date
      label: Last Calibration Date
      hint: When was it last calibrated
      type: date
      options: []
      required: false
    - id: 14
      name: certificate_type_needed
      label: Certificate Type Needed
      hint: What type of certificate
      type: select_one
      options:
      - ISO 17025 accredited
      - NIST traceable
      - Manufacturer certificate
      - In-house calibration
      - Any available
      - Other
      required: true
    - id: 15
      name: certificate_format
      label: Certificate Format
      hint: How do you want to receive it
      type: select_one
      options:
      - PDF via email
      - Printed copy by mail
      - Both
      - Digital download link
      required: true
    - id: 16
      name: mailing_address
      label: Mailing Address
      hint: If printed copy needed
      type: text
      options: []
      required: false
    - id: 17
      name: purpose
      label: Purpose
      hint: Why do you need this certificate
      type: select_one
      options:
      - Audit compliance
      - Quality assurance
      - Customer requirement
      - Regulatory requirement
      - Internal records
      - Other
      required: true
    - id: 18
      name: audit_date
      label: Audit Date
      hint: If for audit, when is it
      type: date
      options: []
      required: false
    - id: 19
      name: urgency
      label: Urgency
      hint: How soon do you need it
      type: select_one
      options:
      - Routine (5-7 business days)
      - Expedited (2-3 business days)
      - Rush (24-48 hours)
      - Emergency (same day)
      required: true
    - id: 20
      name: multiple_certificates
      label: Multiple Certificates
      hint: Do you need certificates for multiple items
      type: select_one
      options:
      - No, single item
      - Yes, 2-5 items
      - Yes, 6-10 items
      - Yes, over 10 items
      required: false
    - id: 21
      name: equipment_list
      label: Equipment List
      hint: List all equipment if multiple
      type: text
      options: []
      required: false
    - id: 22
      name: date_range_needed
      label: Date Range Needed
      hint: What calibration dates do you need
      type: text
      options: []
      required: false
    - id: 23
      name: special_requirements
      label: Special Requirements
      hint: Any special requirements or notes
      type: text
      options: []
      required: false
    - id: 24
      name: previous_request_number
      label: Previous Request Number
      hint: If this is a follow-up
      type: text
      options: []
      required: false
    - id: 25
      name: cost_center
      label: Cost Center
      hint: For billing if applicable
      type: text
      options: []
      required: false
    - id: 26
      name: authorization_needed
      label: Authorization Needed
      hint: Does this request require approval
      type: select_one
      options:
      - false
      - Yes, manager approval
      - Yes, quality approval
      required: false
    - id: 27
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
