inputSchema:
  type: object
  properties:
    title: Company Profile And Market Insights Survey
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: company_website
      label: Company Website
      hint: URL
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 4
      name: respondent_title
      label: Your Title
      hint: Position
      type: text
      options: []
      required: true
    - id: 5
      name: respondent_email
      label: Email Address
      hint: Company email
      type: email
      options: []
      required: true
    - id: 6
      name: respondent_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 7
      name: section_company_info
      label: -- Company Information --
      hint: Basic company details
      type: note
      options: []
      required: false
    - id: 8
      name: year_founded
      label: Year Founded
      hint: When established
      type: number
      options: []
      required: true
    - id: 9
      name: headquarters_location
      label: Headquarters Location
      hint: City, state, country
      type: text
      options: []
      required: true
    - id: 10
      name: number_of_locations
      label: Number of Locations
      hint: Total offices/facilities
      type: number
      options: []
      required: true
    - id: 11
      name: geographic_presence
      label: Geographic Presence
      hint: Where you operate
      type: select_multiple
      options:
      - North America
      - South America
      - Europe
      - Asia
      - Africa
      - Australia/Oceania
      - Middle East
      required: true
    - id: 12
      name: number_of_employees
      label: Number of Employees
      hint: Total headcount
      type: select_one
      options:
      - 1-10
      - 11-50
      - 51-200
      - 201-500
      - 501-1000
      - 1001-5000
      - 5000+
      required: true
    - id: 13
      name: employee_growth
      label: Employee Growth (YoY)
      hint: Percentage change
      type: select_one
      options:
      - Declining
      - Stable
      - Growing slowly (1-10%)
      - Growing moderately (11-25%)
      - Growing rapidly (25%+)
      required: false
    - id: 14
      name: section_business
      label: -- Business Model --
      hint: How you operate
      type: note
      options: []
      required: false
    - id: 15
      name: industry
      label: Primary Industry
      hint: Main industry
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Manufacturing
      - Retail
      - Energy
      - Telecommunications
      - Consumer Goods
      - Industrial
      - Real Estate
      - Services
      - Other
      required: true
    - id: 16
      name: sub_industry
      label: Sub-Industry/Specialization
      hint: More specific
      type: text
      options: []
      required: false
    - id: 17
      name: business_model
      label: Business Model
      hint: How you make money
      type: select_multiple
      options:
      - B2B
      - B2C
      - B2G
      - D2C
      - Marketplace
      - Subscription
      - Freemium
      - Licensing
      - Other
      required: true
    - id: 18
      name: revenue_model
      label: Primary Revenue Model
      hint: Main revenue source
      type: select_one
      options:
      - Product sales
      - Service fees
      - Subscriptions
      - Advertising
      - Commission
      - Licensing fees
      - Other
      required: true
    - id: 19
      name: annual_revenue
      label: Annual Revenue Range
      hint: Approximate revenue
      type: select_one
      options:
      - Under $1M
      - $1M-$10M
      - $10M-$50M
      - $50M-$100M
      - $100M-$500M
      - $500M-$1B
      - Over $1B
      - Prefer not to say
      required: true
    - id: 20
      name: revenue_growth
      label: Revenue Growth (YoY)
      hint: Percentage change
      type: select_one
      options:
      - Declining
      - Stable
      - Growing slowly (1-10%)
      - Growing moderately (11-25%)
      - Growing rapidly (25%+)
      required: false
    - id: 21
      name: section_market
      label: -- Market Position --
      hint: Your market standing
      type: note
      options: []
      required: false
    - id: 22
      name: market_share
      label: Estimated Market Share
      hint: Your portion
      type: select_one
      options:
      - Less than 1%
      - 1%-5%
      - 6%-10%
      - 11%-25%
      - 26%-50%
      - Over 50%
      - Not sure
      required: false
    - id: 23
      name: market_position
      label: Market Position
      hint: Your ranking
      type: select_one
      options:
      - Market leader
      - Strong challenger
      - Niche player
      - New entrant
      - Follower
      required: true
    - id: 24
      name: competitive_advantage
      label: What is your competitive advantage?
      hint: Your edge
      type: select_multiple
      options:
      - Price
      - Quality
      - Innovation
      - Customer service
      - Brand reputation
      - Technology
      - Distribution network
      - Intellectual property
      - Other
      required: true
    - id: 25
      name: target_market
      label: Target Market
      hint: Who you serve
      type: select_multiple
      options:
      - Consumers
      - Small businesses
      - Mid-market companies
      - Enterprise
      - Government
      - Nonprofits
      - Other
      required: true
    - id: 26
      name: section_customers
      label: -- Customer Insights --
      hint: Your customers
      type: note
      options: []
      required: false
    - id: 27
      name: customer_count
      label: Approximate Number of Customers
      hint: Total customers
      type: select_one
      options:
      - Under 100
      - 100-500
      - 501-1,000
      - 1,001-10,000
      - 10,001-100,000
      - Over 100,000
      - Not applicable
      required: false
    - id: 28
      name: customer_retention
      label: Customer Retention Rate
      hint: Percentage
      type: select_one
      options:
      - Under 50%
      - 50%-70%
      - 71%-85%
      - 86%-95%
      - Over 95%
      - Not sure
      required: false
    - id: 29
      name: nps_score
      label: Net Promoter Score (if known)
      hint: NPS
      type: number
      options: []
      required: false
    - id: 30
      name: section_products
      label: -- Products/Services --
      hint: Your offerings
      type: note
      options: []
      required: false
    - id: 31
      name: product_lines
      label: Number of Product/Service Lines
      hint: Total offerings
      type: number
      options: []
      required: false
    - id: 32
      name: flagship_product
      label: Flagship Product/Service
      hint: Main offering
      type: text
      options: []
      required: false
    - id: 33
      name: new_product_rate
      label: New Product Introduction Rate
      hint: Per year
      type: select_one
      options:
      - None
      - 1-2 per year
      - 3-5 per year
      - 6-10 per year
      - Over 10 per year
      required: false
    - id: 34
      name: section_innovation
      label: -- Innovation --
      hint: Your innovation
      type: note
      options: []
      required: false
    - id: 35
      name: rd_spending
      label: R&D Spending as % of Revenue
      hint: Percentage
      type: select_one
      options:
      - Under 1%
      - 1%-3%
      - 4%-7%
      - 8%-15%
      - Over 15%
      - Not applicable
      required: false
    - id: 36
      name: innovation_focus
      label: Innovation Focus Areas
      hint: Where you innovate
      type: select_multiple
      options:
      - Product development
      - Process improvement
      - Business model
      - Customer experience
      - Technology
      - Sustainability
      - Other
      required: false
    - id: 37
      name: section_challenges
      label: -- Market Challenges --
      hint: Your challenges
      type: note
      options: []
      required: false
    - id: 38
      name: main_challenges
      label: What are your main market challenges?
      hint: Select all that apply
      type: select_multiple
      options:
      - Competition
      - Economic conditions
      - Regulatory changes
      - Technology disruption
      - Talent acquisition
      - Supply chain
      - Customer acquisition
      - Market saturation
      - Other
      required: true
    - id: 39
      name: challenge_details
      label: Please elaborate on your main challenge
      hint: Details
      type: text
      options: []
      required: false
    - id: 40
      name: section_opportunities
      label: -- Market Opportunities --
      hint: Your opportunities
      type: note
      options: []
      required: false
    - id: 41
      name: growth_opportunities
      label: What are your main growth opportunities?
      hint: Select all that apply
      type: select_multiple
      options:
      - New markets
      - New products
      - Acquisitions
      - Partnerships
      - Digital transformation
      - International expansion
      - Other
      required: false
    - id: 42
      name: opportunity_details
      label: Please elaborate on your main opportunity
      hint: Details
      type: text
      options: []
      required: false
    - id: 43
      name: section_trends
      label: -- Industry Trends --
      hint: Your perspective
      type: note
      options: []
      required: false
    - id: 44
      name: key_trends
      label: What key trends are affecting your industry?
      hint: Industry trends
      type: text
      options: []
      required: false
    - id: 45
      name: technology_impact
      label: How is technology impacting your industry?
      hint: Tech impact
      type: text
      options: []
      required: false
    - id: 46
      name: survey_date
      label: Survey Completion Date
      hint: Today's date
      type: date
      options: []
      required: true
