inputSchema:
  type: object
  properties:
    title: Pet Training Product Order Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: product_type
      label: Product type
      hint: null
      type: select_one
      options:
      - Pet Training Products
      - Training Sessions
      - Treats
      required: false
    - id: 6
      name: product_quantity
      label: Product quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: order_date
      label: Order date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: order_time
      label: Order time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: note
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: confirm_email
      label: Confirm email
      hint: null
      type: select_one
      options:
      - Confirm
      - Do not confirm
      required: false
    - id: 11
      name: confirm_phone
      label: Confirm phone
      hint: null
      type: select_one
      options:
      - Confirm
      - Do not confirm
      required: false
    - id: 12
      name: order_status
      label: Order status
      hint: null
      type: select_one
      options:
      - New order
      - In progress
      - Completed
      required: false
