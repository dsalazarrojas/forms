inputSchema:
  type: object
  properties:
    title: Supply Chain Energy Audit Application Form
    pages:
    - id: 1
      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: audit_location
      label: Audit Location
      hint: Please select from options
      type: select_one
      options:
      - New York
      - Chicago
      - Los Angeles
      required: true
    - id: 4
      name: audit_dates
      label: Audit Dates
      hint: Select multiple dates
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: energy_types
      label: Energy Types
      hint: Select multiple
      type: select_multiple
      options:
      - Electricity
      - Gas
      - Water
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
