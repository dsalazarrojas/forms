inputSchema:
  type: object
  properties:
    title: Task Progress Monitoring Form
    pages:
    - id: 1
      name: task_list
      label: Task List
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: task_status
      label: Task Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 3
      name: task_priority
      label: Task Priority
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: progress
      label: Progress
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: completed_tasks
      label: Completed Tasks
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: task_description
      label: Task Description
      hint: null
      type: text
      options: []
      required: false
