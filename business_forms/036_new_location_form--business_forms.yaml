inputSchema:
  type: object
  properties:
    title: New Location Form
    pages:
    - id: 1
      name: first_page
      label: first_page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_page
      label: Contact Information
      hint: null
      type: select_one
      options:
      - first name
      - last name
      - email
      - phone
      - address
      - website
      - location
      required: false
    - id: 3
      name: address_page
      label: Address
      hint: null
      type: select_one
      options:
      - street
      - city
      - state
      - country
      required: false
