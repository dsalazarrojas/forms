inputSchema:
  type: object
  properties:
    title: Soundproofing Material Order Form
    pages:
    - id: 1
      name: customer_name
      label: customer name
      hint: 'null'
      type: text
      options: []
      required: false
    - id: 2
      name: material_type
      label: material type
      hint: 'null'
      type: select_one
      options:
      - Acoustic Insulation
      - Acoustic Sealant
      - Soundproofing Blanket
      required: false
    - id: 3
      name: quantity
      label: quantity
      hint: 'null'
      type: number
      options: []
      required: false
    - id: 4
      name: unit_price
      label: unit price
      hint: 'null'
      type: number
      options: []
      required: false
    - id: 5
      name: total_price
      label: total price
      hint: 'null'
      type: number
      options: []
      required: false
    - id: 6
      name: payment_method
      label: payment method
      hint: 'null'
      type: select_one
      options:
      - Credit
      - Debit
      - PayPal
      required: false
    - id: 7
      name: email
      label: email
      hint: 'null'
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: phone
      hint: 'null'
      type: text
      options: []
      required: false
    - id: 9
      name: shipping_address
      label: shipping address
      hint: 'null'
      type: text
      options: []
      required: false
    - id: 10
      name: billing_address
      label: billing address
      hint: 'null'
      type: text
      options: []
      required: false
