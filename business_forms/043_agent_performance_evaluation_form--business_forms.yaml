inputSchema:
  type: object
  properties:
    title: Agent Performance Evaluation Form
    pages:
    - id: 1
      name: header
      label: -- Annual Agent Performance Evaluation --
      hint: formal review of professional performance and goals
      type: note
      options: []
      required: false
    - id: 2
      name: evaluator_name
      label: Evaluator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: agent_name
      label: Agent Name
      hint: person being evaluated
      type: text
      options: []
      required: true
    - id: 4
      name: eval_start
      label: Evaluation Period Start
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: eval_end
      label: Evaluation Period End
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: metrics_header
      label: -- Performance Metrics --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: sales_goals
      label: Sales Goal Achievement - Exceeds, Meets, Below
      hint: based on agreed targets
      type: select_one
      options:
      - Exceeds Expectations
      - Meets Expectations
      - Below Expectations
      - Not applicable
      required: true
    - id: 8
      name: customer_interaction_quality
      label: Quality of Customer Interactions
      hint: based on feedback and monitoring
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: policy_adherence
      label: Adherence to Company Policies and Processes
      hint: compliance with standards
      type: select_one
      options:
      - Fully Compliant
      - Mostly Compliant
      - Frequent issues
      required: true
    - id: 10
      name: teamwork_rating
      label: Collaboration and Teamwork
      hint: working with peers and management
      type: select_one
      options:
      - Strong Team Player
      - Collaborative
      - Needs Improvement
      - Individualistic
      required: true
    - id: 11
      name: key_accomplishments
      label: Key accomplishments during this period
      hint: list major successes
      type: text
      options: []
      required: false
    - id: 12
      name: development_areas
      label: Areas requiring development and training
      hint: specify skills to improve
      type: text
      options: []
      required: false
    - id: 13
      name: overall_rating
      label: Overall Performance Rating
      hint: final summative score
      type: select_one
      options:
      - 5 - Outstanding
      - 4 - Commendable
      - 3 - Effective
      - 2 - Marginal
      - 1 - Unsatisfactory
      required: true
    - id: 14
      name: future_goals
      label: Goals for the next evaluation period
      hint: define 3 key objectives
      type: text
      options: []
      required: true
