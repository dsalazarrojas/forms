inputSchema:
  type: object
  properties:
    title: Program Quality Survey
    pages:
    - id: 1
      name: overall_quality
      label: Overall Quality
      hint: This question is to gauge your overall perception of the program.
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: service_quality
      label: Service Quality
      hint: How would you rate the quality of service offered by this program?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: staff_responsiveness
      label: Staff Responsiveness
      hint: How responsive are the staff of the program?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: communication_quality
      label: Communication Quality
      hint: How would you rate the communication from the program's staff?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: program_improvement
      label: Improvement Suggestions
      hint: What could the program do to improve?
      type: text
      options: []
      required: true
    - id: 6
      name: likes_dislikes
      label: Likes/Dislikes
      hint: What did you like or dislike about the program?
      type: text
      options: []
      required: true
    - id: 7
      name: expectations_met
      label: Expectations Met
      hint: Is this program meeting your expectations?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: visits_count
      label: Visits Count
      hint: How many times have you visited this program?
      type: number
      options: []
      required: false
    - id: 9
      name: recommendations
      label: Recommendations
      hint: How many times would you recommend this program to others?
      type: number
      options: []
      required: false
    - id: 10
      name: staff_knowledge
      label: Staff Knowledge
      hint: How would you rate the program's staff knowledge of the subject matter?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: responsiveness
      label: Responsiveness
      hint: How would you rate the program's responsiveness to suggestions?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: program_quality
      label: Overall Quality Again
      hint: How would you rate the program's overall quality?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: staff_friendly
      label: Staff Friendliness
      hint: Is the program staff friendly?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: open_ended_1
      label: Open-Ended 1
      hint: What could the program do to improve?
      type: text
      options: []
      required: false
    - id: 15
      name: open_ended_2
      label: Open-Ended 2
      hint: Is there anything else you would like to add about this program?
      type: text
      options: []
      required: false
    - id: 16
      name: overall_opinion
      label: Overall Opinion
      hint: What is your overall opinion of this program?
      type: text
      options: []
      required: false
    - id: 17
      name: last_question
      label: Last Question
      hint: Any other comments or suggestions?
      type: text
      options: []
      required: false
