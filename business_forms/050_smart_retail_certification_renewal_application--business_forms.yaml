      label: Certification Details
      hint: null
      type: select_multiple
      options:
      - Type
      - Status
      - Issue Date
      required: true
    - id: 6
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: confirm_renewal
      label: Confirm Renewal
      hint: null
      type: select_one
      options:
