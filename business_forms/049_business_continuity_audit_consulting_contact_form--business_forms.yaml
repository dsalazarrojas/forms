inputSchema:
  type: object
  properties:
    title: Business Continuity Audit Consulting Contact Form
    pages:
    - id: 1
      name: organization_info
      label: Organization Information
      hint: Your business details
      type: note
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 3
      name: industry
      label: Industry
      hint: Your industry sector
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Manufacturing
      - Retail
      - Energy
      - Transportation
      - Government
      - Education
      - Other
      required: true
    - id: 4
      name: organization_size
      label: Organization Size
      hint: Number of employees
      type: select_one
      options:
      - 1-50 employees
      - 51-200 employees
      - 201-500 employees
      - 501-1000 employees
      - More than 1000 employees
      required: true
    - id: 5
      name: contact_info
      label: Contact Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 6
      name: full_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 7
      name: position
      label: Position
      hint: Your job title
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: true
    - id: 10
      name: audit_info
      label: Audit Information
      hint: About your audit needs
      type: note
      options: []
      required: false
    - id: 11
      name: current_continuity_plan
      label: Do You Have a Continuity Plan
      hint: Current planning status
      type: select_one
      options:
      - Yes - Comprehensive
      - Yes - Basic
      - In Progress
      - 'False'
      required: true
    - id: 12
      name: previous_audits
      label: Previous Continuity Audits
      hint: Have you had audits before
      type: select_one
      options:
      - Yes - Within 1 Year
      - Yes - 1-3 Years Ago
      - Yes - More than 3 Years
      - Never
      required: true
    - id: 13
      name: audit_scope
      label: Audit Scope
      hint: What do you need audited
      type: select_multiple
      options:
      - Full Continuity Plan
      - Risk Assessment
      - Recovery Procedures
      - Testing Program
      - Training Program
      - Compliance
      - IT Disaster Recovery
      - Other
      required: true
    - id: 14
      name: audit_objectives
      label: Audit Objectives
      hint: What do you hope to achieve
      type: text
      options: []
      required: true
    - id: 15
      name: compliance_requirements
      label: Compliance Requirements
      hint: Are there regulatory requirements
      type: select_one
      options:
      - Yes - Strict Requirements
      - Yes - Some Requirements
      - No - Voluntary
      - Not Sure
      required: true
    - id: 16
      name: specific_standards
      label: Specific Standards
      hint: Which standards apply
      type: select_multiple
      options:
      - ISO 22301
      - SOC 2
      - HIPAA
      - PCI DSS
      - NIST
      - GDPR
      - Industry Specific
      - None
      required: false
    - id: 17
      name: pain_points
      label: Current Pain Points
      hint: What concerns do you have
      type: text
      options: []
      required: false
    - id: 18
      name: timeline
      label: Timeline
      hint: When do you need the audit
      type: select_one
      options:
      - Immediately
      - Within 1 Month
      - Within 3 Months
      - Within 6 Months
      - Flexible
      required: true
    - id: 19
      name: budget_range
      label: Budget Range
      hint: Expected investment
      type: select_one
      options:
      - Under $10,000
      - $10,000-$25,000
      - $25,000-$50,000
      - $50,000-$100,000
      - More than $100,000
      - Not Determined
      required: false
    - id: 20
      name: stakeholders
      label: Key Stakeholders
      hint: Who should be involved
      type: text
      options: []
      required: false
    - id: 21
      name: decision_timeline
      label: Decision Timeline
      hint: When will you decide
      type: select_one
      options:
      - Within 1 Week
      - Within 2 Weeks
      - Within 1 Month
      - More than 1 Month
      - Not Sure
      required: true
    - id: 22
      name: referral_source
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Website
      - Referral
      - Social Media
      - Conference or Event
      - Advertisement
      - Other
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
