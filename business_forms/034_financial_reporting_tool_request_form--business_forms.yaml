inputSchema:
  type: object
  properties:
    title: Financial Reporting Tool Request Form
    pages:
    - id: 1
      name: request_for_financial_reporting
      label: Request for Financial Reporting
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reporting_tool_type
      label: Report Type
      hint: null
      type: select_one
      options:
      - Balance
      - Cash Flow
      - Income Statement
      required: false
    - id: 3
      name: reporting_period
      label: Reporting Period
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: frequency_of_reporting
      label: Frequency of Reporting
      hint: null
      type: select_multiple
      options:
      - Quarterly
      - Bi-Annual
      - Annually
      required: false
    - id: 5
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 6
      name: reporting_frequency
      label: Reporting Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
