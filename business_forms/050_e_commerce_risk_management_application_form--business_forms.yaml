inputSchema:
  type: object
  properties:
    title: E Commerce Risk Management Application Form
    pages:
    - id: 1
      name: main_info
      label: Main Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: merchant_info
      label: Merchant Information
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: risk_level
      label: Risk Level
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: risk_category
      label: Risk Category
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 6
      name: merchant_type
      label: Merchant Type
      hint: null
      type: select_multiple
      options:
      - Physical
      - Digital
      - Hybrid
      required: false
    - id: 7
      name: business_type
      label: Business Type
      hint: null
      type: select_multiple
      options:
      - B2B
      - B2C
      - C2C
      required: false
    - id: 8
      name: business_duration
      label: Business Duration
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: risk_factors
      label: Risk Factors
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: risk_management
      label: Risk Management
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: merchant_status
      label: Merchant Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 12
      name: submission_status
      label: Submission Status
      hint: null
      type: select_multiple
      options:
      - Submitted
      - Pending
      - Approved
      required: false
    - id: 13
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
