inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: true
