inputSchema:
  type: object
  properties:
    title: Bill Of Materials Management Form
    pages:
    - id: 1
      name: product_info_header
      label: -- Product Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: product_name
      label: Final Product Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: sku_number
      label: SKU or Product ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: product_version
      label: Revision or Version Number
      hint: e.g., v1.0, 2024-B
      type: text
      options: []
      required: true
    - id: 5
      name: product_category
      label: Product Category
      hint: null
      type: select_one
      options:
      - Mechanical Assembly
      - Electronics
      - Packaging
      - Raw Materials
      - Software Bundle
      required: true
    - id: 6
      name: component_list_header
      label: -- Component Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: component_name
      label: Component Description
      hint: Name of the part or sub-assembly
      type: text
      options: []
      required: true
    - id: 8
      name: part_number
      label: Part Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: quantity_per_unit
      label: Quantity per Unit
      hint: How many are needed for one finished product
      type: number
      options: []
      required: true
    - id: 10
      name: unit_of_measure
      label: Unit of Measure
      hint: null
      type: select_one
      options:
      - Each
      - Grams
      - Meters
      - Liters
      - Sets
      required: true
    - id: 11
      name: supplier_name
      label: Primary Supplier
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: cost_per_unit
      label: Component Unit Cost
      hint: Estimated or actual cost
      type: number
      options: []
      required: false
    - id: 13
      name: lead_time_days
      label: Lead Time (Days)
      hint: Expected delivery time from supplier
      type: number
      options: []
      required: false
    - id: 14
      name: approval_status_header
      label: -- Management and Approval --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: manager_approval
      label: Department Manager Approval
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: approval_date
      label: Approval Date
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: bom_status
      label: BOM Status
      hint: null
      type: select_one
      options:
      - Draft
      - In Review
      - Active
      - Obsolete
      required: true
    - id: 18
      name: changelog_notes
      label: Change History or Notes
      hint: Explain any recent updates to this BOM
      type: text
      options: []
      required: false
