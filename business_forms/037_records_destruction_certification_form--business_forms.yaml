inputSchema:
  type: object
  properties:
    title: prophets
    pages:
    - id: 1
      name: records_destruction_form
      label: Records Destruction Form
      hint: null
      type: select_one
      options:
      - Electronic Destruction
      - Physical Destruction
      - Other
      required: false
    - id: 2
      name: destroyed_by
      label: Destroyed By
      hint: null
      type: select_one
      options:
      - Electronic Destruction
      - Physical Destruction
      - Other
      required: false
    - id: 3
      name: who_destroyed_records
      label: Who Destroyed Records
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_destroyed
      label: Date Destroyed
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: method_destroyed
      label: Method Destroyed
      hint: null
      type: select_one
      options:
      - Pulped (pulled apart)
      - Shredded
      - Burned
      - Other
      required: false
    - id: 6
      name: records_type
      label: Type of Records Destroyed
      hint: null
      type: select_multiple
      options:
      - Paper documents
      - Electronic documents
      - Audio/video files
      - Other documents
      required: false
    - id: 7
      name: reason_for_destruction
      label: Reason For Destruction
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: records_count_destroyed
      label: Number of Records Destroyed
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: records_count_remaining
      label: Number of Records Remaining
      hint: null
      type: number
      options: []
      required: false
