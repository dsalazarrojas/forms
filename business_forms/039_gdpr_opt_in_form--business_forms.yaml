inputSchema:
  type: object
  properties:
    title: Gdpr Opt In Form
    pages:
    - id: 1
      name: optin
      label: Opt In
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: contact
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: agreement
      label: Agreement
      hint: We will keep your info private, under GDPR.
      type: note
      options: []
      required: false
    - id: 8
      name: agreement_terms
      label: Agreement Terms
      hint: null
      type: text
      options: []
      required: false
