inputSchema:
  type: object
  properties:
    title: Business Promotion Flyer Inquiry
    pages:
    - id: 1
      name: inquiry_date
      label: Inquiry Date
      hint: Date of this inquiry
      type: date
      options: []
      required: true
    - id: 2
      name: inquirer_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: inquirer_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: inquirer_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Business name
      type: text
      options: []
      required: true
    - id: 6
      name: company_website
      label: Company Website
      hint: URL (optional)
      type: text
      options: []
      required: false
    - id: 7
      name: flyer_type
      label: Type of Flyer Needed
      hint: What kind of flyer?
      type: select_one
      options:
      - Product Promotion
      - Service Promotion
      - Event Announcement
      - Grand Opening
      - Sale or Clearance
      - New Location
      - Special Offer
      - Other
      required: true
    - id: 8
      name: distribution_location
      label: Distribution Location
      hint: Where will flyer be distributed?
      type: text
      options: []
      required: true
    - id: 9
      name: target_audience
      label: Target Audience
      hint: Who is this for?
      type: text
      options: []
      required: true
    - id: 10
      name: flyer_quantity
      label: Estimated Quantity
      hint: How many copies needed?
      type: number
      options: []
      required: true
    - id: 11
      name: key_message
      label: Key Message
      hint: Main message of flyer
      type: text
      options: []
      required: true
    - id: 12
      name: special_offers
      label: Special Offers or Deals
      hint: Any promotions?
      type: text
      options: []
      required: false
    - id: 13
      name: required_design_elements
      label: Required Design Elements
      hint: Logo, images, colors, etc.
      type: text
      options: []
      required: false
    - id: 14
      name: campaign_timeline
      label: Campaign Timeline
      hint: When should flyer be ready?
      type: date
      options: []
      required: true
    - id: 15
      name: campaign_duration
      label: Campaign Duration
      hint: How long will campaign run?
      type: text
      options: []
      required: false
    - id: 16
      name: budget_range
      label: Budget Range
      hint: Estimated budget
      type: select_one
      options:
      - Under $500
      - $500 - $1,000
      - $1,000 - $2,500
      - $2,500 - $5,000
      - Over $5,000
      required: false
    - id: 17
      name: previous_campaigns
      label: Previous Marketing Campaigns
      hint: What campaigns have you run?
      type: text
      options: []
      required: false
    - id: 18
      name: expected_response_rate
      label: Expected Response Rate Goal
      hint: Target response rate
      type: number
      options: []
      required: false
    - id: 19
      name: additional_details
      label: Additional Details
      hint: Any other information?
      type: text
      options: []
      required: false
