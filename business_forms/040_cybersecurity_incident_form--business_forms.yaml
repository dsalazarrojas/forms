inputSchema:
  type: object
  properties:
    title: Cybersecurity Incident Form
    pages:
    - id: 1
      name: incident_details
      label: Incident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Malware
      - Phishing
      - Ransomware
      required: false
    - id: 3
      name: incident_location
      label: Location
      hint: null
      type: select_multiple
      options:
      - Local
      - Remote
      required: false
    - id: 4
      name: incident_description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_occurred
      label: Date Occurred
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: reported_by
      label: Reported By
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Jim
      required: false
    - id: 7
      name: incident_classification
      label: Classification
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 8
      name: incident_status
      label: Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      required: false
    - id: 9
      name: incident_resolution
      label: Resolution
      hint: null
      type: text
      options: []
      required: false
