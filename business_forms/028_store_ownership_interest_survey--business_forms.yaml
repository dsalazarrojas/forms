inputSchema:
  type: object
  properties:
    title: Store Ownership Interest Survey
    pages:
    - id: 1
      name: store_ownership_interest
      label: What is your interest in owning a store?
      hint: null
      type: select_one
      options:
      - Very interested
      - Somewhat interested
      - Not interested
      required: false
    - id: 2
      name: store_ownership_percentage
      label: What percentage of ownership do you have?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: store_ownership_involvement
      label: Involvement in store operations
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Some
      required: false
    - id: 4
      name: store_details
      label: Store Details
      hint: null
      type: text
      options: []
      required: false
