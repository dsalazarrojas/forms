inputSchema:
  type: object
  properties:
    title: Candidate Registration Form
    pages:
    - id: 1
      name: personal_info_section
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: candidate_full_name_reg
      label: Full Name
      hint: As per your official documents
      type: text
      options: []
      required: true
    - id: 3
      name: candidate_dob_reg
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: candidate_gender_reg
      label: Gender
      hint: For diversity tracking
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: true
    - id: 5
      name: candidate_nationality_reg
      label: Nationality
      hint: Country of citizenship
      type: text
      options: []
      required: true
    - id: 6
      name: candidate_email_reg
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 7
      name: candidate_phone_reg
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: current_address_reg
      label: Current Address
      hint: Residential location
      type: text
      options: []
      required: true
    - id: 9
      name: professional_background_section
      label: -- Professional Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: highest_degree_earned
      label: Highest Degree
      hint: Select your most recent academic achievement
      type: select_one
      options:
      - High School
      - Associate
      - Bachelor
      - Master
      - PhD
      - Other
      required: true
    - id: 11
      name: major_field_of_study
      label: Field of Study
      hint: e.g. Computer Science, Marketing
      type: text
      options: []
      required: true
    - id: 12
      name: current_role_title
      label: Current Job Title
      hint: If currently unemployed, enter N/A
      type: text
      options: []
      required: true
    - id: 13
      name: experience_count_years
      label: Years of Experience
      hint: Total professional work experience
      type: number
      options: []
      required: true
    - id: 14
      name: top_professional_skills
      label: Key Skills
      hint: List tools, software, or technical strengths
      type: text
      options: []
      required: true
    - id: 15
      name: job_preferences_section
      label: -- Preferences --
      hint: help us find the right role for you
      type: note
      options: []
      required: false
    - id: 16
      name: target_industries_list
      label: Preferred Industries
      hint: Select the sectors you are interested in
      type: select_multiple
      options:
      - IT
      - Healthcare
      - Finance
      - Education
      - Retail
      - Engineering
      - Other
      required: true
    - id: 17
      name: desired_employment_type
      label: Desired Job Type
      hint: Type of contract you are looking for
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Freelance
      - Internship
      required: true
    - id: 18
      name: work_model_pref_reg
      label: Preferred Work Model
      hint: null
      type: select_one
      options:
      - Remote
      - Hybrid
      - On-site
      required: true
    - id: 19
      name: salary_expectation_desired
      label: Expected Salary
      hint: Annual amount in local currency
      type: number
      options: []
      required: false
    - id: 20
      name: relocation_openness_reg
      label: Willingness to Relocate
      hint: Open to moving for a new position
      type: select_one
      options:
      - true
      - false
      - Negotiable
      required: true
    - id: 21
      name: data_privacy_section
      label: -- Data Privacy --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: future_roles_consent_reg
      label: Consent to store data for future roles
      hint: Allow us to keep your profile in our talent pool
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 23
      name: correctness_certification_reg
      label: I confirm information is correct
      hint: Providing false data may disqualify you from future roles
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 24
      name: registration_date_field
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
