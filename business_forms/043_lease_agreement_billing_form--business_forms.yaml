inputSchema:
  type: object
  properties:
    title: lease_agreement_billing_form
    pages:
    - id: 1
      name: tenant_id
      label: Tenant Id
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: unit_id
      label: Unit Id
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: landlord_name
      label: Landlord Name
      hint: Enter the landlord's name
      type: text
      options: []
      required: false
    - id: 4
      name: lease_start_date
      label: Lease Start Date
      hint: The start date of the lease.
      type: date
      options: []
      required: false
    - id: 5
      name: lease_end_date
      label: Lease End Date
      hint: The end date of the lease.
      type: date
      options: []
      required: false
    - id: 6
      name: rent_amount
      label: Rent Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Check
      required: true
    - id: 8
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Partially Paid
      - Unpaid
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
