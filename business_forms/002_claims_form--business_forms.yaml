inputSchema:
  type: object
  properties:
    title: Claims Form
    pages:
    - id: 1
      name: business_info_header
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: business_name
      label: Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: claim_details_header
      label: -- Claim Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: claim_type
      label: Type of Claim
      hint: null
      type: select_one
      options:
      - Property Damage
      - Liability
      - Business Interruption
      - Theft
      - Workers Compensation
      - Other
      required: true
    - id: 8
      name: incident_date
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: description_of_loss
      label: Description of Loss or Incident
      hint: Please provide a detailed account of what happened
      type: text
      options: []
      required: true
    - id: 11
      name: estimated_claim_amount
      label: Estimated Claim Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: supporting_docs_header
      label: -- Supporting Documentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: witness_available
      label: Are there any witnesses?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: witness_names
      label: Witness Names and Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: police_notified
      label: Was the police or local authority notified?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: report_reference
      label: Report Reference Number
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
