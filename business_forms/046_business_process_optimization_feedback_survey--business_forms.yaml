inputSchema:
  type: object
  properties:
    title: Business Process Optimization Feedback Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: Date of this survey
      type: date
      options: []
      required: true
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: true
    - id: 5
      name: process_evaluated
      label: Process Being Evaluated
      hint: Which process?
      type: text
      options: []
      required: true
    - id: 6
      name: current_workflow_clarity
      label: Clarity of Current Workflow
      hint: Rate clarity (1-5)
      type: number
      options: []
      required: true
    - id: 7
      name: workflow_efficiency
      label: Workflow Efficiency
      hint: Is it efficient? (1-5)
      type: number
      options: []
      required: true
    - id: 8
      name: time_spent_on_process
      label: Average Time Spent on Process
      hint: Estimate in hours/day
      type: number
      options: []
      required: false
    - id: 9
      name: redundancy_level
      label: Level of Redundancy
      hint: Rate redundancy (1-5, 5 being high)
      type: number
      options: []
      required: true
    - id: 10
      name: bottlenecks
      label: Process Bottlenecks
      hint: Where do things slow down?
      type: text
      options: []
      required: true
    - id: 11
      name: pain_points
      label: Key Pain Points
      hint: What frustrates you?
      type: text
      options: []
      required: true
    - id: 12
      name: tool_effectiveness
      label: Effectiveness of Tools Used
      hint: Rate effectiveness (1-5)
      type: number
      options: []
      required: true
    - id: 13
      name: automation_opportunity
      label: Opportunity for Automation
      hint: Rate potential (1-5)
      type: number
      options: []
      required: false
    - id: 14
      name: improvement_suggestions
      label: Improvement Suggestions
      hint: How can we improve?
      type: text
      options: []
      required: true
    - id: 15
      name: cost_impact
      label: Estimated Cost Impact
      hint: How would optimization help costs?
      type: text
      options: []
      required: false
    - id: 16
      name: time_savings_potential
      label: Time Savings Potential
      hint: Estimated savings (hours/week)
      type: number
      options: []
      required: false
    - id: 17
      name: implementation_readiness
      label: Ready for Implementation
      hint: Are you ready for changes?
      type: select_one
      options:
      - Yes, Fully Ready
      - Mostly Ready
      - Somewhat Ready
      - Not Ready
      required: true
    - id: 18
      name: training_needs
      label: Training Needs
      hint: What training is needed?
      type: text
      options: []
      required: false
    - id: 19
      name: additional_feedback
      label: Additional Feedback
      hint: Any other comments?
      type: text
      options: []
      required: false
