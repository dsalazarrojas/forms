inputSchema:
  type: object
  properties:
    title: Importer Identity Information Form
    pages:
    - id: 1
      name: importer_identity_information_form_first_page
      label: Importer Information
      hint: Please provide the importer's contact information
      type: text
      options: []
      required: true
    - id: 2
      name: importer_identity_information_form_second_page
      label: Contact Address
      hint: Please provide the importer's contact address
      type: text
      options: []
      required: true
