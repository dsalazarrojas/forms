inputSchema:
  type: object
  properties:
    title: Construction Site Safety Inspection Form
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date of safety inspection
      type: date
      options: []
      required: true
    - id: 2
      name: inspection_time
      label: Inspection Time
      hint: Time inspection started
      type: time
      options: []
      required: true
    - id: 3
      name: inspector_name
      label: Inspector Name
      hint: Name of safety inspector
      type: text
      options: []
      required: true
    - id: 4
      name: inspector_title
      label: Inspector Title
      hint: Position or role
      type: text
      options: []
      required: true
    - id: 5
      name: project_name
      label: Project Name
      hint: Name of construction project
      type: text
      options: []
      required: true
    - id: 6
      name: project_address
      label: Project Address
      hint: Full site address
      type: text
      options: []
      required: true
    - id: 7
      name: weather_conditions
      label: Weather Conditions
      hint: At time of inspection
      type: select_one
      options:
      - Clear and Sunny
      - Cloudy
      - Rainy
      - Snowy
      - Windy
      - Extreme Heat
      - Extreme Cold
      required: true
    - id: 8
      name: work_activities
      label: Work Activities in Progress
      hint: What work is being done
      type: select_multiple
      options:
      - Excavation
      - Concrete Work
      - Framing
      - Roofing
      - Electrical
      - Plumbing
      - HVAC
      - Welding
      - Painting
      - Demolition
      - None
      required: true
    - id: 9
      name: workers_count
      label: Number of Workers on Site
      hint: Total headcount
      type: number
      options: []
      required: true
    - id: 10
      name: safety_meeting_held
      label: Safety Meeting Held Today
      hint: Toolbox talk conducted
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: ppe_compliance_rate
      label: PPE Compliance Rate
      hint: Percentage of workers compliant
      type: select_one
      options:
      - 100 Percent
      - 90 to 99 Percent
      - 75 to 89 Percent
      - 50 to 74 Percent
      - Below 50 Percent
      required: true
    - id: 12
      name: fall_hazards
      label: Fall Hazards Present
      hint: Are there unprotected edges
      type: select_one
      options:
      - None Found
      - Minor Issues
      - Moderate Issues
      - Serious Issues
      required: true
    - id: 13
      name: struck_by_hazards
      label: Struck-By Hazards
      hint: Falling object risks
      type: select_one
      options:
      - None Found
      - Minor Issues
      - Moderate Issues
      - Serious Issues
      required: true
    - id: 14
      name: electrical_hazards
      label: Electrical Hazards
      hint: Electrical safety issues
      type: select_one
      options:
      - None Found
      - Minor Issues
      - Moderate Issues
      - Serious Issues
      required: true
    - id: 15
      name: caught_in_hazards
      label: Caught-In Hazards
      hint: Trench or equipment risks
      type: select_one
      options:
      - None Found
      - Minor Issues
      - Moderate Issues
      - Serious Issues
      required: true
    - id: 16
      name: equipment_inspections
      label: Equipment Inspections Current
      hint: Are inspections documented
      type: select_one
      options:
      - Yes, All
      - Yes, Most
      - Some Missing
      - Not Done
      required: true
    - id: 17
      name: material_handling
      label: Material Handling Safe
      hint: Lifting and moving materials
      type: select_one
      options:
      - Yes, All Safe
      - Mostly Safe
      - Some Concerns
      - Unsafe
      required: true
    - id: 18
      name: housekeeping_rating
      label: Housekeeping Rating
      hint: Site cleanliness
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 19
      name: fire_prevention
      label: Fire Prevention Measures
      hint: Hot work permits, extinguishers
      type: select_one
      options:
      - Adequate
      - Mostly Adequate
      - Some Concerns
      - Inadequate
      required: true
    - id: 20
      name: hazardous_materials
      label: Hazardous Materials Managed
      hint: Proper storage and handling
      type: select_one
      options:
      - Yes, Properly
      - Mostly Properly
      - Some Concerns
      - Not Properly
      required: true
    - id: 21
      name: emergency_access
      label: Emergency Access Clear
      hint: Routes unobstructed
      type: select_one
      options:
      - Yes, All Clear
      - Mostly Clear
      - Some Obstructions
      - Blocked
      required: true
    - id: 22
      name: violations_found
      label: Safety Violations Found
      hint: Number of violations
      type: number
      options: []
      required: true
    - id: 23
      name: violations_description
      label: Violations Description
      hint: Describe each violation
      type: text
      options: []
      required: false
    - id: 24
      name: immediate_corrections
      label: Immediate Corrections Made
      hint: What was fixed on the spot
      type: text
      options: []
      required: false
    - id: 25
      name: follow_up_required
      label: Follow-Up Required
      hint: Is reinspection needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 26
      name: follow_up_date
      label: Follow-Up Date
      hint: Scheduled date
      type: date
      options: []
      required: false
    - id: 27
      name: overall_compliance
      label: Overall Safety Compliance
      hint: Final determination
      type: select_one
      options:
      - Fully Compliant
      - Substantially Compliant
      - Partially Compliant
      - Non-Compliant
      required: true
    - id: 28
      name: inspector_comments
      label: Inspector Comments
      hint: Additional notes
      type: text
      options: []
      required: false
    - id: 29
      name: inspector_signature
      label: Inspector Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 30
      name: site_supervisor_signature
      label: Site Supervisor Signature
      hint: Type full name as signature
      type: text
      options: []
      required: false
