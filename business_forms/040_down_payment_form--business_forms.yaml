inputSchema:
  type: object
  properties:
    title: Down Payment Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: down_payment_date
      label: Down Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: Choose a payment method
      type: select_one
      options:
      - Visa
      - Mastercard
      - Amex
      required: true
    - id: 4
      name: amount_paid
      label: Amount Paid
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - Paid
      - Unpaid
      - Partially Paid
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: payment_date_time
      label: Payment Date/Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: payment_method_other
      label: Other Payment Method
      hint: null
      type: select_multiple
      options:
      - Bank Transfer
      - Online banking
      - Check
      required: false
