inputSchema:
  type: object
  properties:
    title: AI Impact On Small Businesses
    pages:
    - id: 1
      name: business_profile_header
      label: '--- Business Profile ---'
      hint: Basic information about your business.
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Business / Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: industry_sector
      label: Industry Sector
      hint: null
      type: select_one
      options:
      - Retail / E-commerce
      - Professional Services (Legal, Accounting, etc.)
      - Healthcare & Wellness
      - Hospitality & Food Service
      - Manufacturing & Construction
      - Technology & Software
      - Other
      required: true
    - id: 4
      name: employee_count
      label: Number of Employees
      hint: null
      type: select_one
      options:
      - Solopreneur (1)
      - Micro (2-5)
      - Small (6-20)
      - Medium-Small (21-50)
      - Medium (51-100)
      required: true
    - id: 5
      name: years_in_operation
      label: Years in Operation
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: ai_adoption_header
      label: '--- AI Adoption and Usage ---'
      hint: Your current relationship with Artificial Intelligence.
      type: note
      options: []
      required: false
    - id: 7
      name: current_ai_adoption_status
      label: What is your current level of AI adoption?
      hint: null
      type: select_one
      options:
      - Not currently using or considering
      - Actively researching / Planning
      - Testing / Pilot programs in place
      - Fully integrated into some workflows
      - AI-first business model
      required: true
    - id: 8
      name: ai_tools_implemented
      label: Which AI-related tools are you currently using?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Generative AI (ChatGPT, Claude, Jasper)
      - AI Chatbots for Customer Service
      - Marketing Automation with AI
      - AI-powered Analytics / Forecasting
      - Image / Video Generation
      - None
      required: true
    - id: 9
      name: primary_benefits_realized
      label: Primary Benefits Experienced or Expected
      hint: null
      type: select_multiple
      options:
      - Increased Efficiency / Productivity
      - Cost Savings / Reduced Overheads
      - Improved Customer Experience
      - Better Decision Making / Insights
      - Creative Content Generation
      required: true
    - id: 10
      name: adoption_barriers_header
      label: '--- Challenges and Barriers ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: main_adoption_barriers
      label: What are the main barriers to adopting AI in your business?
      hint: null
      type: select_multiple
      options:
      - High Implementation Costs
      - Lack of In-house Technical Expertise
      - Concerns about Data Privacy & Security
      - Ethical Concerns / Potential Bias
      - Difficulty Integrating with Legacy Systems
      - Uncertainty about ROI
      required: true
    - id: 12
      name: impact_on_staffing
      label: Impact on Hiring and Staffing
      hint: How has AI affected your workforce?
      type: select_one
      options:
      - Reduced need for staff (Replaced by AI)
      - Increased need for staff (New AI-related roles)
      - No change in staffing levels
      - Shifted existing staff to higher-value tasks
      required: true
    - id: 13
      name: future_ai_investment
      label: Future Investment Plans (Next 12 Months)
      hint: How do you plan to change your AI spending?
      type: select_one
      options:
      - Significantly Increase
      - Slightly Increase
      - Maintain Current Levels
      - Decrease Investment
      required: true
    - id: 14
      name: concern_level_competition
      label: How concerned are you about competitors using AI more effectively than
        you?
      hint: Rating 1 (Not concerned) to 5 (Extremely concerned)
      type: number
      options: []
      required: true
    - id: 15
      name: open_feedback
      label: Additional Comments or Insights
      hint: Any other thoughts on how AI is impacting your specific niche?
      type: text
      options: []
      required: false
    - id: 16
      name: contact_email_optin
      label: May we contact you to discuss your responses further?
      hint: null
      type: email
      options: []
      required: false
