inputSchema:
  type: object
  properties:
    title: Building Equipment Manufacturer Contact Form
    pages:
    - id: 1
      name: contact_name
      label: Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: company
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: true
    - id: 3
      name: title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: contact_date
      label: Contact Date
      hint: Date of inquiry
      type: date
      options: []
      required: true
    - id: 7
      name: inquiry_type
      label: Inquiry Type
      hint: Type of inquiry
      type: select_one
      options:
      - Product Information
      - Pricing Request
      - Technical Support
      - Warranty Claim
      - Parts Order
      - Service Request
      - Partnership Opportunity
      - General Inquiry
      required: true
    - id: 8
      name: equipment_category
      label: Equipment Category
      hint: Type of equipment
      type: select_one
      options:
      - HVAC Systems
      - Elevators and Lifts
      - Electrical Equipment
      - Plumbing Systems
      - Fire Safety Equipment
      - Security Systems
      - Building Automation
      - Lighting Systems
      - Other
      required: true
    - id: 9
      name: product_interest
      label: Product Interest
      hint: Specific products
      type: text
      options: []
      required: false
    - id: 10
      name: project_type
      label: Project Type
      hint: Type of project
      type: select_one
      options:
      - New Construction
      - Renovation
      - Replacement
      - Maintenance
      - Expansion
      - Other
      required: true
    - id: 11
      name: project_name
      label: Project Name
      hint: Name of project
      type: text
      options: []
      required: false
    - id: 12
      name: project_location
      label: Project Location
      hint: Where is the project
      type: text
      options: []
      required: true
    - id: 13
      name: project_timeline
      label: Project Timeline
      hint: When do you need equipment
      type: select_one
      options:
      - Immediate
      - Within 1 Month
      - 1-3 Months
      - 3-6 Months
      - 6-12 Months
      - Over 1 Year
      required: true
    - id: 14
      name: budget_range
      label: Budget Range
      hint: Estimated budget
      type: select_one
      options:
      - Under $10,000
      - $10,000 - $50,000
      - $50,000 - $100,000
      - $100,000 - $500,000
      - Over $500,000
      - To Be Determined
      required: false
    - id: 15
      name: quantity_needed
      label: Quantity Needed
      hint: Approximate quantity
      type: text
      options: []
      required: false
    - id: 16
      name: specifications
      label: Specifications
      hint: Technical requirements
      type: text
      options: []
      required: false
    - id: 17
      name: current_supplier
      label: Current Supplier
      hint: Are you using another supplier
      type: select_one
      options:
      - Yes - Satisfied
      - Yes - Looking to Switch
      - No - First Purchase
      - Prefer Not to Say
      required: false
    - id: 18
      name: decision_timeframe
      label: Decision Timeframe
      hint: When will you decide
      type: select_one
      options:
      - Within 1 Week
      - Within 1 Month
      - Within 3 Months
      - Over 3 Months
      - Not Sure
      required: false
    - id: 19
      name: decision_makers
      label: Number of Decision Makers
      hint: How many people involved
      type: select_one
      options:
      - Just Myself
      - 2-3 People
      - 4-6 People
      - Committee Review
      - Corporate Approval
      required: false
    - id: 20
      name: preferred_contact
      label: Preferred Contact Method
      hint: How to reach you
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Video Call
      - In-Person Meeting
      required: true
    - id: 21
      name: best_contact_time
      label: Best Contact Time
      hint: When to reach you
      type: text
      options: []
      required: false
    - id: 22
      name: additional_info
      label: Additional Information
      hint: Any other details
      type: text
      options: []
      required: false
    - id: 23
      name: newsletter_signup
      label: Newsletter Signup
      hint: Receive product updates
      type: select_one
      options:
      - Yes - Subscribe Me
      - No - Thank You
      required: false
    - id: 24
      name: referral_source
      label: How Did You Hear About Us
      hint: Referral source
      type: select_one
      options:
      - Website
      - Trade Show
      - Referral
      - Advertisement
      - Social Media
      - Search Engine
      - Other
      required: false
