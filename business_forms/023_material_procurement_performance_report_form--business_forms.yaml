inputSchema:
  type: object
  properties:
    title: Material Procurement Performance Report Form
    pages:
    - id: 1
      name: supplier_name
      label: Supplier Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: procurement_category
      label: Procurement Category
      hint: null
      type: select_one
      options:
      - Materials
      - Services
      - Equipment
      required: false
    - id: 3
      name: procurement_date
      label: Procurement Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 4
      name: procurement_value
      label: Procurement Value
      hint: USD
      type: number
      options: []
      required: false
    - id: 5
      name: supplier_rating
      label: Supplier Rating
      hint: 1-5
      type: number
      options: []
      required: false
    - id: 6
      name: procurement_frequency
      label: Procurement Frequency
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Bi-Annually
      - Annually
      required: true
    - id: 7
      name: procurement_method
      label: Procurement Method
      hint: null
      type: select_one
      options:
      - Online
      - Off-site
      - On-site
      required: false
    - id: 8
      name: contact_name
      label: Contact Name
      hint: Full Name
      type: text
      options: []
      required: false
    - id: 9
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: contact_phone
      label: Contact Phone
      hint: XXX-XXX-XXXX
      type: text
      options: []
      required: false
    - id: 11
      name: contact_note
      label: Contact Note
      hint: Additional notes about contact
      type: note
      options: []
      required: false
    - id: 12
      name: supplier_note
      label: Supplier Note
      hint: Additional notes about supplier
      type: note
      options: []
      required: false
    - id: 13
      name: procurement_note
      label: Procurement Note
      hint: Additional notes about procurement
      type: note
      options: []
      required: false
    - id: 14
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
