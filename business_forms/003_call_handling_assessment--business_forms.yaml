inputSchema:
  type: object
  properties:
    title: Call Handling Assessment
    pages:
    - id: 1
      name: section_call_info
      label: -- Call Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: representative_name
      label: Representative Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: call_duration
      label: Call Duration
      hint: In minutes
      type: number
      options: []
      required: true
    - id: 5
      name: customer_satisfaction
      label: Customer Satisfaction Level
      hint: Rate the customer's apparent satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 6
      name: section_performance_assessment
      label: -- Performance Assessment --
      hint: null
      type: note
      options: []
      required: false
