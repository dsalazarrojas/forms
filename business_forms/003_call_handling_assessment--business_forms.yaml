      name: call_answered_professionally
      label: Call was answered professionally and courteously
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Unacceptable
      required: true
    - id: 8
      name: issue_understood_clearly
      label: Representative understood customer issue clearly
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Unacceptable
