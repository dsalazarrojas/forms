inputSchema:
  type: object
  properties:
    title: Checklist For Control Measures
    pages:
    - id: 1
      name: section_audit_metadata
      label: -- Audit Context --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspection_facility_location
      label: Facility / Department Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: inspector_full_name_id
      label: Inspector Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: inspection_date_time
      label: Date of Inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: risk_assessment_category
      label: Primary Risk Area
      hint: null
      type: select_one
      options:
      - Physical Safety
      - Cybersecurity
      - Environmental Impact
      - Financial Control
      - Regulatory Compliance
      required: true
    - id: 6
      name: section_measure_eval
      label: -- Control Measure Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: control_measure_description
      label: Description of Control Measure
      hint: e.g. biometric access, fire suppression system
      type: text
      options: []
      required: true
    - id: 8
      name: current_implementation_status
      label: Implementation Status
      hint: null
      type: select_one
      options:
      - Fully Implemented
      - Partially Implemented
      - Not Started
      - Under Review
      required: true
    - id: 9
      name: measure_effectiveness_rating
      label: Effectiveness Rating
      hint: How well is the measure performing
      type: select_one
      options:
      - Highly Effective
      - Effective
      - Needs Improvement
      - Ineffective
      required: true
    - id: 10
      name: section_findings
      label: -- Findings and Action Items --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: deficiencies_identified_text
      label: Specific Deficiencies Identified
      hint: Describe any gaps or failures
      type: text
      options: []
      required: false
    - id: 12
      name: evidence_of_compliance
      label: Evidence Observed
      hint: e.g. logs, visual inspection, interview
      type: text
      options: []
      required: false
    - id: 13
      name: recommended_remediation_steps
      label: Recommended Remediation Steps
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: remediation_priority_level
      label: Priority Level
      hint: null
      type: select_one
      options:
      - Low - Routine
      - Medium - Scheduled
      - High - Urgent
      - Critical - Immediate
      required: true
    - id: 15
      name: expected_completion_date
      label: Expected Remediation Completion Date
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: section_final_ack
      label: -- Certification --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: inspector_certification_statement
      label: I certify this inspection was conducted per SOP
      hint: null
      type: select_one
      options:
      - I Certify
      - Other
      required: true
    - id: 18
      name: report_status_final
      label: Report Final Status
      hint: null
      type: select_one
      options:
      - Draft
      - Final - Approved
      - Escalated to Management
      required: true
