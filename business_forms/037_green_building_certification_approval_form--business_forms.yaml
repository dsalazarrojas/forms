inputSchema:
  type: object
  properties:
    title: green_building_certification_approval_form
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_address
      label: Project Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: project_location
      label: Project Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: project_type
      label: Project Type
      hint: null
      type: select_one
      options:
      - Green Building
      - Non-Green Building
      - Other
      - Mixed Use
      required: false
    - id: 5
      name: certification_status
      label: Certification Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      - Not Applicable
      required: false
    - id: 6
      name: compliance_documentation
      label: Compliance Documentation
      hint: null
      type: text
      options: []
      required: false
