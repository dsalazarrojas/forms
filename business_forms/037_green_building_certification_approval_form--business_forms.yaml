      type: number
      options: []
      required: false
    - id: 24
      name: waste_water_reduction
      label: Waste Water Reduction
      hint: null
      type: number
      options: []
      required: false
    - id: 25
      name: energy_savings
      label: Energy Savings
      hint: null
      type: number
      options: []
      required: false
