      name: energy_audit_date
      label: Energy Audit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: energy_audit_performed_by
      label: Energy Audit Performed By
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: green_building_certification_date
      label: Green Building Certification Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: green_building_certification_status
      label: Green Building Certification Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      - Withdrawn
      required: false
    - id: 15
      name: building_type
      label: Building Type
      hint: Please select the building type below.
      type: select_multiple
      options:
      - Commercial Building
      - Residential Building
      - Industrial Building
      - Other
      required: false
    - id: 16
      name: green_building_certification_level
      label: Green Building Certification Level
      hint: null
      type: select_one
      options:
      - Level 1
      - Level 2
      - Level 3
      - Level 4
      required: false
