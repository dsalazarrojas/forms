inputSchema:
  type: object
  properties:
    title: Gun Exchange Lifecycle Change Form
    pages:
    - id: 1
      name: participant_details
      label: Participant Information
      hint: Please provide your details as a participant.
      type: text
      options: []
      required: true
    - id: 2
      name: firearm_id_number
      label: Firearm ID Number
      hint: Provide the ID number of the firearm being exchanged.
      type: number
      options: []
      required: true
    - id: 3
      name: firearm_make
      label: Firearm Make
      hint: Select the make of the firearm.
      type: select_one
      options:
      - Smith & Wesson
      - Glock
      - Ruger
      - Other (please specify)
      required: true
    - id: 4
      name: firearm_model
      label: Firearm Model
      hint: Please provide the model of the firearm.
      type: text
      options: []
      required: true
    - id: 5
      name: firearm_caliber
      label: Firearm Caliber
      hint: Select the caliber of the firearm.
      type: select_multiple
      options:
      - 9mm
      - 40mm
      - 45mm
      - Other (please specify)
      required: true
    - id: 6
      name: firearm_serial_number
      label: Firearm Serial Number
      hint: Please provide the serial number of the firearm.
      type: text
      options: []
      required: true
    - id: 7
      name: reason_for_exchange
      label: Reason for Exchange
      hint: Please explain why you are exchanging the firearm.
      type: text
      options: []
      required: true
    - id: 8
      name: firearm_condition
      label: Firearm Condition
      hint: Select the condition of the firearm.
      type: select_one
      options:
      - New
      - Used
      - Refurbished
      - Other (please specify)
      required: true
    - id: 9
      name: participant_signing
      label: Participant Signature
      hint: Please sign this form as a participant.
      type: text
      options: []
      required: true
    - id: 10
      name: participant_date
      label: Participant Date
      hint: Date of participant's signature.
      type: date
      options: []
      required: true
