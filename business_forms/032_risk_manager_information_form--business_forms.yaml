inputSchema:
  type: object
  properties:
    title: Risk Manager Information Form
    pages:
    - id: 1
      name: risk_manager_form_data
      label: Risk Manager Form Data
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: risk_level
      label: What is your risk level?
      hint: null
      type: select_one
      options:
      - low
      - medium
      - high
      required: true
    - id: 3
      name: description
      label: Describe the risk
      hint: null
      type: note
      options: []
      required: true
    - id: 4
      name: risk_type
      label: What is the risk type?
      hint: null
      type: select_multiple
      options:
      - physical
      - financial
      - operational
      - strategic
      - reputational
      - legal
      - regulatory
      - technological
      required: true
    - id: 5
      name: frequency
      label: How often does this risk occur?
      hint: null
      type: select_one
      options:
      - daily
      - weekly
      - monthly
      - quarterly
      - annually
      required: true
    - id: 6
      name: severity
      label: How severe is this risk?
      hint: null
      type: select_one
      options:
      - low
      - medium
      - high
      - critical
      required: true
    - id: 7
      name: risk_manager_email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: risk_manager_phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: status
      label: What is your status for this risk?
      hint: null
      type: select_one
      options:
      - open
      - in progress
      - closed
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
