      name: cancellation_policy
      label: Cancellation Policy
      hint: 24 hour notice
      type: select_one
      options:
      - I Understand
      - I Do Not Understand
      required: true
    - id: 40
      name: satisfaction_guarantee
      label: Satisfaction Guarantee
      hint: 100 percent satisfaction
      type: select_one
      options:
      - I Understand
      - I Do Not Understand
      required: true
    - id: 41
      name: damage_policy
      label: Damage Policy
      hint: Liability terms
      type: select_one
      options:
      - I Understand
      - I Do Not Understand
      required: true
    - id: 42
      name: weather_policy
      label: Weather Policy
      hint: Reschedule if needed
      type: select_one
      options:
      - I Understand
      - I Do Not Understand
      required: true
    - id: 43
      name: access_authorization
      label: Access Authorization
      hint: Technician may access vehicle
      type: select_one
      options:
      - I Authorize
      - I Do Not Authorize
      required: true
    - id: 44
      name: personal_items
      label: Personal Items
      hint: Remove valuables
      type: select_one
      options:
      - I Have Removed Items
      - Shop Not Responsible
      required: true
    - id: 45
      name: existing_damage
      label: Existing Damage
      hint: Any current damage
      type: text
      options: []
      required: false
    - id: 46
      name: special_instructions
      label: Special Instructions
      hint: Any specific requests
      type: text
      options: []
      required: false
    - id: 47
      name: marketing_consent
      label: Marketing Consent
      hint: Can we contact you
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 48
      name: referral_source
      label: How Did You Hear About Us
      hint: How did you find us
      type: select_one
      options:
      - Website
      - Social Media
      - Referral
      - Advertisement
      - Drive By
      - Other
      required: false
    - id: 49
      name: customer_signature
      label: Customer Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 50
      name: signature_date
      label: Date of Signature
      hint: Today date
      type: date
      options: []
      required: true
    - id: 51
      name: provider_signature
      label: Service Provider Signature
      hint: Digital signature
      type: text
      options: []
      required: false
