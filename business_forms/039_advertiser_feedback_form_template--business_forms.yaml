inputSchema:
  type: object
  properties:
    title: Advertiser Feedback Form Template
    pages:
    - id: 1
      name: advertiser_information_section
      label: -- Advertiser Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company Name
      hint: Name of the advertising company
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person_name
      label: Contact Person Name
      hint: Name of the primary contact person
      type: text
      options: []
      required: true
    - id: 4
      name: contact_person_title
      label: Contact Person Title
      hint: Job title of the contact person
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: Business email for communication
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Business phone number
      type: text
      options: []
      required: true
    - id: 7
      name: campaign_information_section
      label: -- Campaign Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: campaign_name
      label: Campaign Name
      hint: Name of the advertising campaign
      type: text
      options: []
      required: true
    - id: 9
      name: campaign_duration
      label: Campaign Duration
      hint: Start and end dates of the campaign
      type: text
      options: []
      required: true
    - id: 10
      name: campaign_budget
      label: Campaign Budget
      hint: Total budget allocated for the campaign
      type: number
      options: []
      required: true
    - id: 11
      name: campaign_performance_section
      label: -- Campaign Performance --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you with the overall campaign performance
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 13
      name: roi_expectations_met
      label: ROI Expectations Met
      hint: Did the campaign meet your return on investment expectations
      type: select_one
      options:
      - Exceeded expectations
      - Met expectations
      - Below expectations
      - Not measurable
      required: true
    - id: 14
      name: target_audience_reached
      label: Target Audience Reached
      hint: How well did the campaign reach your target audience
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not applicable
      required: true
    - id: 15
      name: communication_collaboration_section
      label: -- Communication Collaboration --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: response_time_satisfaction
      label: Response Time Satisfaction
      hint: How satisfied are you with the response times
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 17
      name: communication_clarity
      label: Communication Clarity
      hint: How clear was the communication throughout the campaign
      type: select_one
      options:
      - Very clear
      - Clear
      - Neutral
      - Unclear
      - Very unclear
      required: true
    - id: 18
      name: collaboration_effectiveness
      label: Collaboration Effectiveness
      hint: How effective was the collaboration process
      type: select_one
      options:
      - Very effective
      - Effective
      - Neutral
      - Ineffective
      - Very ineffective
      required: true
    - id: 19
      name: improvement_suggestions
      label: Improvement Suggestions
      hint: What could be improved in future campaigns
      type: text
      options: []
      required: false
    - id: 20
      name: likelihood_to_recommend
      label: Likelihood to Recommend
      hint: How likely are you to recommend our services to others
      type: select_one
      options:
      - Very likely
      - Likely
      - Neutral
      - Unlikely
      - Very unlikely
      required: true
