inputSchema:
  type: object
  properties:
    title: e_commerce_audit_form
    pages:
    - id: 1
      name: business_name
      label: What is the name of your business?
      hint: Please enter your business name
      type: text
      options: []
      required: true
    - id: 2
      name: business_category
      label: What category does your business fall under?
      hint: Choose one of the following options
      type: select_one
      options:
      - retail
      - online store
      - e-commerce
      - wholesale
      - other
      required: true
    - id: 3
      name: website
      label: What is your current website address?
      hint: Enter your website URL
      type: text
      options: []
      required: true
    - id: 4
      name: social_media
      label: What is your current social media presence?
      hint: Choose all that apply
      type: select_multiple
      options:
      - Facebook
      - Twitter
      - Instagram
      - LinkedIn
      - YouTube
      - TikTok
      - Pinterest
      - Other (please specify)
      required: true
    - id: 5
      name: customer_satisfaction
      label: What is your current customer satisfaction rating?
      hint: On a scale of 1-10
      type: number
      options: []
      required: true
    - id: 6
      name: sales_volume
      label: What is your current sales volume?
      hint: Please enter a numerical value
      type: number
      options: []
      required: true
    - id: 7
      name: inventory_management
      label: What is your current inventory management system?
      hint: Choose one of the following options
      type: select_one
      options:
      - manual
      - automated
      - hybrid
      - other
      required: true
    - id: 8
      name: shipping_policy
      label: What is your current shipping policy?
      hint: Please enter a brief description
      type: text
      options: []
      required: true
    - id: 9
      name: payment_processing
      label: What is your current payment processing system?
      hint: Choose one of the following options
      type: select_one
      options:
      - manual
      - automated
      - hybrid
      - other
      required: true
    - id: 10
      name: customer_service
      label: What is your current customer service process?
      hint: Please enter a brief description
      type: text
      options: []
      required: true
    - id: 11
      name: marketing_strategy
      label: What is your current marketing strategy?
      hint: Choose one of the following options
      type: select_one
      options:
      - social media
      - email marketing
      - content marketing
      - influencer marketing
      - other
      required: true
    - id: 12
      name: goals_objectives
      label: What are your current goals and objectives?
      hint: Please enter a brief description
      type: text
      options: []
      required: true
    - id: 13
      name: target_audience
      label: What is your target audience?
      hint: Please enter a brief description
      type: text
      options: []
      required: true
    - id: 14
      name: product_line
      label: What is your current product line?
      hint: Please enter a brief description
      type: text
      options: []
      required: true
    - id: 15
      name: pricing_strategy
      label: What is your current pricing strategy?
      hint: Choose one of the following options
      type: select_one
      options:
      - dynamic
      - fixed
      - volume-based
      - tiered
      - other
      required: true
    - id: 16
      name: shipping_frequency
      label: What is your current shipping frequency?
      hint: Choose one of the following options
      type: select_one
      options:
      - daily
      - weekly
      - monthly
      - quarterly
      - other
      required: true
