      name: form_section_one
      label: first_time_homebuyer
      hint: null
      type: select_multiple
      options:
      - First time homebuyer
      - First time investor
      - Both first time homebuyer and first time investor
      required: false
    - id: 2
      name: gross_income
      label: gross_income
