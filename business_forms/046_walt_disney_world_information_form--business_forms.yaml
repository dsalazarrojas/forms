inputSchema:
  type: object
  properties:
    title: Walt Disney World Information Form
    pages:
    - id: 1
      name: form_name
      label: Enter Your Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: Your email address will be used to provide you with updates and information
        about your visit.
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date
      label: Date
      hint: The date of your visit, in the format dd-mm-yyyy
      type: date
      options: []
      required: false
    - id: 6
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - 'A: Tool A'
      - 'B: Tool B'
      - 'C: Tool C'
      required: false
    - id: 7
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - 'A: Category A'
      - 'B: Category B'
      - 'C: Category C'
      required: false
    - id: 8
      name: page_number
      label: Page Number
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: form_description
      label: Form Description
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: form_category
      label: Form Category
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: form_output_file
      label: Form Output File
      hint: null
      type: text
      options: []
      required: false
