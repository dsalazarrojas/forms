inputSchema:
  type: object
  properties:
    title: Professional Development Feedback Survey
    pages:
    - id: 1
      name: seminar_workshop
      label: Seminar or Workshop
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 3
      name: relevance
      label: Relevance
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: overall_rating
      label: Overall Rating
      hint: On a scale of 1-5
      type: number
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: participant_feedback
      label: Participant Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
