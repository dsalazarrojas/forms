inputSchema:
  type: object
  properties:
    title: Club Visit Feedback Form
    pages:
    - id: 1
      name: visitor_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: visitor_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: visitor_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: visit_date
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: club_location
      label: Club Location Visited
      hint: Which facility or location
      type: text
      options: []
      required: true
    - id: 6
      name: visit_type
      label: Type of Visit
      hint: Why did you visit
      type: select_one
      options:
      - First Time Visit
      - Regular Member
      - Guest of Member
      - Potential Member
      - Alumni
      required: true
    - id: 7
      name: staff_friendliness
      label: Staff Friendliness and Courtesy
      hint: Rate the staff
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 8
      name: facility_cleanliness
      label: Facility Cleanliness
      hint: Rate facility conditions
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 9
      name: facility_amenities
      label: Amenities and Facilities
      hint: Rate available amenities
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 10
      name: program_quality
      label: Program or Class Quality
      hint: Rate the programs offered
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 11
      name: pricing_value
      label: Pricing and Value for Money
      hint: Rate value
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: false
    - id: 12
      name: equipment_condition
      label: Equipment Condition and Maintenance
      hint: Rate equipment status
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: false
    - id: 13
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Dissatisfied
      - Dissatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 14
      name: return_likelihood
      label: Likelihood to Return or Join
      hint: Will you come back
      type: select_one
      options:
      - Definitely Not
      - Probably Not
      - Unsure
      - Probably Yes
      - Definitely Yes
      required: true
    - id: 15
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: What could be improved
      type: text
      options: []
      required: false
