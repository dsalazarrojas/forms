inputSchema:
  type: object
  properties:
    title: Custom Furniture Delivery Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: true
