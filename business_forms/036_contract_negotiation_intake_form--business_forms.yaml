inputSchema:
  type: object
  properties:
    title: Contract Negotiation Intake Form
    pages:
    - id: 1
      name: requestor_name
      label: Requestor Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: requestor_title
      label: Requestor Title
      hint: Job title
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Sales
      - Procurement
      - Legal
      - Operations
      - Finance
      - Human Resources
      - IT
      - Executive
      - Other
      required: true
    - id: 4
      name: request_date
      label: Request Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 5
      name: contract_type
      label: Contract Type
      hint: Type of agreement
      type: select_one
      options:
      - Service agreement
      - Vendor contract
      - Partnership agreement
      - Employment contract
      - Licensing agreement
      - Lease agreement
      - Purchase agreement
      - Non-disclosure agreement
      - Other
      required: true
    - id: 6
      name: contract_title
      label: Contract Title
      hint: Name of contract
      type: text
      options: []
      required: true
    - id: 7
      name: other_party_name
      label: Other Party Name
      hint: Counterparty name
      type: text
      options: []
      required: true
    - id: 8
      name: other_party_type
      label: Other Party Type
      hint: Entity type
      type: select_one
      options:
      - Corporation
      - LLC
      - Partnership
      - Individual
      - Government entity
      - Non-profit
      - Other
      required: true
    - id: 9
      name: estimated_value
      label: Estimated Value
      hint: Contract dollar amount
      type: number
      options: []
      required: true
    - id: 10
      name: contract_duration
      label: Contract Duration
      hint: Length of agreement
      type: select_one
      options:
      - One-time
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - 5+ years
      - Ongoing
      required: true
    - id: 11
      name: proposed_start_date
      label: Proposed Start Date
      hint: When to begin?
      type: date
      options: []
      required: true
    - id: 12
      name: business_objectives
      label: Business Objectives
      hint: What are the goals?
      type: text
      options: []
      required: true
    - id: 13
      name: key_terms
      label: Key Terms
      hint: Important terms to include
      type: text
      options: []
      required: true
    - id: 14
      name: deal_breakers
      label: Deal Breakers
      hint: Non-negotiable items
      type: text
      options: []
      required: true
    - id: 15
      name: flexible_terms
      label: Flexible Terms
      hint: Items open for negotiation
      type: text
      options: []
      required: false
    - id: 16
      name: risk_assessment
      label: Risk Assessment
      hint: Risk level
      type: select_one
      options:
      - Low risk
      - Medium risk
      - High risk
      - Critical risk
      required: true
    - id: 17
      name: budget_approved
      label: Budget Approved
      hint: Is budget allocated?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: true
    - id: 18
      name: stakeholders
      label: Stakeholders
      hint: Who needs to be involved?
      type: text
      options: []
      required: true
    - id: 19
      name: timeline_requirements
      label: Timeline Requirements
      hint: Any deadline constraints?
      type: text
      options: []
      required: false
    - id: 20
      name: previous_relationship
      label: Previous Relationship
      hint: Have you worked with them before?
      type: select_one
      options:
      - Yes, current partner
      - Yes, former partner
      - No, new relationship
      - Unknown
      required: true
    - id: 21
      name: competitive_bidding
      label: Competitive Bidding
      hint: Are there other bidders?
      type: select_one
      options:
      - Yes, multiple bidders
      - Yes, one competitor
      - No, sole source
      - Unknown
      required: false
    - id: 22
      name: legal_review_needed
      label: Legal Review Needed
      hint: Is legal involvement required?
      type: select_one
      options:
      - Yes, full review
      - Yes, limited review
      - 'False'
      required: true
    - id: 23
      name: urgency_level
      label: Urgency Level
      hint: How urgent is this?
      type: select_one
      options:
      - Routine
      - Standard
      - Urgent
      - Critical
      required: true
    - id: 24
      name: additional_information
      label: Additional Information
      hint: Any other details
      type: text
      options: []
      required: false
