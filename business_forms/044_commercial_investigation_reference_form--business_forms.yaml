inputSchema:
  type: object
  properties:
    title: Commercial Investigation Reference Form
    pages:
    - id: 1
      name: investigator_name
      label: Investigator Name
      hint: Name of investigator
      type: text
      options: []
      required: true
    - id: 2
      name: investigation_date
      label: Investigation Date
      hint: Date of investigation
      type: date
      options: []
      required: true
    - id: 3
      name: case_number
      label: Case Number
      hint: Reference number
      type: text
      options: []
      required: true
    - id: 4
      name: section_header_subject_info
      label: -- Subject Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: subject_name
      label: Subject Name
      hint: Name of subject being investigated
      type: text
      options: []
      required: true
    - id: 6
      name: subject_company
      label: Subject Company
      hint: Company name
      type: text
      options: []
      required: true
    - id: 7
      name: subject_position
      label: Subject Position
      hint: Job title or role
      type: text
      options: []
      required: true
    - id: 8
      name: section_header_reference_source
      label: -- Reference Source --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: reference_name
      label: Reference Name
      hint: Name of person providing reference
      type: text
      options: []
      required: true
    - id: 10
      name: reference_company
      label: Reference Company
      hint: Company name
      type: text
      options: []
      required: true
    - id: 11
      name: reference_position
      label: Reference Position
      hint: Job title
      type: text
      options: []
      required: true
    - id: 12
      name: reference_email
      label: Reference Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 13
      name: reference_phone
      label: Reference Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 14
      name: relationship_to_subject
      label: Relationship to Subject
      hint: How do you know the subject
      type: select_one
      options:
      - Former Supervisor
      - Former Co-worker
      - Former Employee
      - Business Partner
      - Client or Customer
      - Vendor
      - Professional Associate
      - Other
      required: true
    - id: 15
      name: relationship_duration
      label: Relationship Duration
      hint: How long did you work together
      type: select_one
      options:
      - Less than 6 months
      - 6 months - 1 year
      - 1-3 years
      - 3-5 years
      - 5+ years
      required: true
    - id: 16
      name: section_header_professional_assessment
      label: -- Professional Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: work_quality
      label: Work Quality
      hint: Rate quality of work
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 18
      name: reliability
      label: Reliability
      hint: Rate reliability
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 19
      name: integrity
      label: Integrity
      hint: Rate honesty and integrity
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 20
      name: professionalism
      label: Professionalism
      hint: Rate professional conduct
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 21
      name: communication_skills
      label: Communication Skills
      hint: Rate communication ability
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 22
      name: section_header_specific_questions
      label: -- Specific Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: would_rehire
      label: Would You Rehire
      hint: Would you work with them again
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 24
      name: strengths
      label: Subject Strengths
      hint: What are their strengths
      type: text
      options: []
      required: true
    - id: 25
      name: weaknesses
      label: Subject Weaknesses
      hint: Areas for improvement
      type: text
      options: []
      required: false
    - id: 26
      name: performance_rating
      label: Overall Performance Rating
      hint: Rate overall performance
      type: select_one
      options:
      - Top Performer
      - Above Average
      - Average
      - Below Average
      - Poor Performer
      required: true
    - id: 27
      name: section_header_concerns
      label: -- Concerns --
      hint: null
      type: note
      options: []
      required: false
    - id: 28
      name: known_issues
      label: Known Performance Issues
      hint: Any documented issues
      type: select_one
      options:
      - None
      - Minor Issues
      - Moderate Issues
      - Significant Issues
      - Prefer Not to Say
      required: true
    - id: 29
      name: disciplinary_actions
      label: Disciplinary Actions
      hint: Any disciplinary history
      type: select_one
      options:
      - None
      - Verbal Warning
      - Written Warning
      - Suspension
      - Termination
      - Prefer Not to Say
      required: true
    - id: 30
      name: section_header_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
    - id: 32
      name: follow_up_permission
      label: May We Follow Up
      hint: Can we contact you for clarification
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 33
      name: reference_signature
      label: Reference Signature
      hint: Electronic signature
      type: text
      options: []
      required: true
    - id: 34
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
