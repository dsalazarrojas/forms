inputSchema:
  type: object
  properties:
    title: Time Tracking Summary Report Form
    pages:
    - id: 1
      name: business_form_page
      label: What is the business form?
      hint: null
      type: select_multiple
      options:
      - Business
      - Enterprise
      required: true
    - id: 2
      name: start_time_page
      label: Start Time
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: end_time_page
      label: End Time
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: break_time_page
      label: Break Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: work_log_page
      label: Work Log
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notes_page
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: form_category_page
      label: Form Category
      hint: null
      type: select_one
      options:
      - Business Forms
      - Personal Forms
      required: true
    - id: 8
      name: form_sub_category_page
      label: Form Sub Category
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: assigned_tool_page
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
