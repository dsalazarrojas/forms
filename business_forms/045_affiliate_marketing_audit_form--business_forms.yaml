inputSchema:
  type: object
  properties:
    title: Affiliate Marketing Audit Form
    pages:
    - id: 1
      name: audit_info_header
      label: -- Audit Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: auditor_name
      label: Auditor Name
      hint: Who is performing this audit?
      type: text
      options: []
      required: true
    - id: 3
      name: audit_date
      label: Date of Audit
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: audit_period
      label: Period Under Review
      hint: e.g., Q1 2024.
      type: text
      options: []
      required: true
    - id: 5
      name: program_performance_header
      label: -- Program Performance --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: total_revenue
      label: Total Affiliate Revenue ($)
      hint: Gross revenue generated by affiliates.
      type: number
      options: []
      required: true
    - id: 7
      name: commission_cost
      label: Total Commission Paid ($)
      hint: Cost of sales.
      type: number
      options: []
      required: true
    - id: 8
      name: active_affiliates
      label: Number of Active Affiliates
      hint: Affiliates with at least 1 sale.
      type: number
      options: []
      required: true
    - id: 9
      name: conversion_rate
      label: Affiliate Conversion Rate (%)
      hint: Clicks to Sales.
      type: number
      options: []
      required: true
    - id: 10
      name: compliance_check_header
      label: -- Compliance & Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: fraud_check
      label: Fraudulent Activity Detected?
      hint: Self-referrals, bot traffic, etc.
      type: select_one
      options:
      - None Detected
      - Minor Issues (Flagged)
      - Significant Fraud Found
      required: true
    - id: 12
      name: brand_compliance
      label: Brand Compliance Check
      hint: Are affiliates using correct logos and messaging?
      type: select_one
      options:
      - High Compliance
      - Moderate Compliance
      - Low Compliance
      required: true
    - id: 13
      name: top_partners_header
      label: -- Top Partners Analysis --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: top_performer_1
      label: Top Performer 1 Name
      hint: Highest revenue generator.
      type: text
      options: []
      required: false
    - id: 15
      name: top_performer_trend
      label: Top Performer Trend
      hint: Is their performance growing or declining?
      type: select_one
      options:
      - Growing
      - Stable
      - Declining
      required: false
    - id: 16
      name: recommendations
      label: Audit Recommendations
      hint: Action items to improve the program.
      type: text
      options: []
      required: true
