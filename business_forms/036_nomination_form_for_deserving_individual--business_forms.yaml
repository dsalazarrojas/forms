inputSchema:
  type: object
  properties:
    title: Nomination Form For Deserving Individual
    pages:
    - id: 1
      name: individual_name
      label: Nomination Title
      hint: Enter the name of the individual being nominated
      type: text
      options: []
      required: true
    - id: 2
      name: individual_description
      label: Nomination Description
      hint: Describe the individual's achievements and qualities that make them deserving
      type: text
      options: []
      required: true
    - id: 3
      name: nomination_reason
      label: Nomination Reason
      hint: Explain why you think this individual deserves recognition
      type: text
      options: []
      required: true
    - id: 4
      name: category
      label: Category
      hint: Select the category under which the individual's contribution falls
      type: select_one
      options:
      - Community Service
      - Arts and Culture
      - Education
      - Other (Specify)
      required: true
    - id: 5
      name: nomination_date
      label: Nomination Date
      hint: Enter the date when the individual's contribution was made
      type: date
      options: []
      required: true
    - id: 6
      name: nomination_time
      label: Nomination Time
      hint: Enter the time when the individual's contribution was made
      type: time
      options: []
      required: true
    - id: 7
      name: location
      label: Nomination Location
      hint: Enter the location where the individual's contribution was made
      type: text
      options: []
      required: true
    - id: 8
      name: supporting_materials
      label: Supporting Materials
      hint: Select the types of supporting materials available
      type: checkbox
      options:
      - Supporting Documents
      - Testimonials
      - Other
      required: false
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
