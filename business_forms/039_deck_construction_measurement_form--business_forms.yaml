inputSchema:
  type: object
  properties:
    title: Deck Construction Measurement Form
    pages:
    - id: 1
      name: site_details
      label: Site Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: dimensions
      label: Dimensions
      hint: null
      type: select_multiple
      options:
      - Length (in feet)
      - Width (in feet)
      - Height (in feet)
      required: true
    - id: 3
      name: material_preferences
      label: Material Preferences
      hint: null
      type: checkbox
      options:
      - Wooden Deck
      - Composite Deck
      - Composite with Wood Accents
      required: true
    - id: 4
      name: site_photos
      label: Site Photos
      hint: null
      type: select_multiple
      options:
      - Site Photo 1
      - Site Photo 2
      - Site Photo 3
      required: false
    - id: 5
      name: deck_location
      label: Deck Location
      hint: null
      type: radio
      options:
      - North
      - South
      - East
      - West
      required: true
    - id: 6
      name: deck_type
      label: Deck Type
      hint: null
      type: select_one
      options:
      - Wooden Deck
      - Composite Deck
      - Deck with Roof
      required: true
    - id: 7
      name: deck_orientation
      label: Deck Orientation
      hint: null
      type: select_one
      options:
      - North-South
      - South-North
      - East-West
      - West-East
      required: true
    - id: 8
      name: site_address
      label: Site Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: site_layout
      label: Site Layout
      hint: null
      type: checkbox
      options:
      - Sketch
      - Description
      required: false
    - id: 11
      name: deck_features
      label: Deck Features
      hint: null
      type: select_multiple
      options:
      - Built-in Bench
      - Built-in Planter
      required: false
    - id: 12
      name: deck_size
      label: Deck Size
      hint: null
      type: select_multiple
      options:
      - Length (in feet)
      - Width (in feet)
      required: true
    - id: 13
      name: additional_info_2
      label: Additional Info 2
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: none
      label: None
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: none_2
      label: None 2
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: none_3
      label: None 3
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: none_4
      label: None 4
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: none_5
      label: None 5
      hint: null
      type: text
      options: []
      required: false
