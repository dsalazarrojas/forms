inputSchema:
  type: object
  properties:
    title: Greenhouse Gas Monitoring Plan Template
    pages:
    - id: 1
      name: facility_name
      label: Facility Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: gas_type
      label: gas_type
      hint: null
      type: select_one
      options:
      - CO2
      - CH4
      - N2O
      - O3
      - Other
      required: false
    - id: 3
      name: sampling_frequency
      label: sampling_frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      required: false
    - id: 4
      name: sampling_method
      label: sampling_method
      hint: null
      type: select_multiple
      options:
      - Air Sample
      - Water Sample
      - Soil Sample
      required: false
    - id: 5
      name: monitoring_start_date
      label: monitoring_start_date
      hint: Enter date in YYYY-MM-DD format
      type: date
      options: []
      required: false
