inputSchema:
  type: object
  properties:
    title: Expense Dispute Resolution Consent Form
    pages:
    - id: 1
      name: dispute_type
      label: Dispute Type
      hint: null
      type: select_one
      options:
      - Dispute on expense
      - Dispute on reimbursement
      - Dispute on payment method
      required: false
    - id: 2
      name: dispute_description
      label: Dispute Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: dispute_date
      label: Dispute Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: dispute_amount
      label: Dispute Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: manager_email
      label: Manager Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: resolution_status
      label: Resolution Status
      hint: null
      type: select_one
      options:
      - Dispute resolved
      - Dispute pending
      - Dispute ongoing
      required: false
    - id: 10
      name: dispute_notes
      label: Dispute Notes
      hint: null
      type: note
      options: []
      required: false
