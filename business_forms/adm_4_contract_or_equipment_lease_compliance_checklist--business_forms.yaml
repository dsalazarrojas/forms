inputSchema:
  type: object
  properties:
    title: ADM 4 Contract Or Equipment Lease Compliance Checklist
    pages:
    - id: 1
      name: section_header_inspection_details
      label: '--- Inspection Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_name
      label: Inspector/Auditor name
      hint: Enter full name as on badge
      type: text
      options: []
      required: true
    - id: 3
      name: inspector_role
      label: Inspector role or department
      hint: e.g., Compliance Officer, Facilities
      type: text
      options: []
      required: true
    - id: 4
      name: inspection_date
      label: Inspection date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: inspection_time
      label: Inspection time
      hint: Use 24-hour format if known
      type: time
      options: []
      required: false
    - id: 6
      name: location
      label: Location or site inspected
      hint: Building name, floor, room number or lease address
      type: text
      options: []
      required: true
    - id: 7
      name: contract_number
      label: Contract / Lease number
      hint: Enter ADM contract or lease identifier
      type: text
      options: []
      required: true
    - id: 8
      name: contract_type
      label: Contract or agreement type
      hint: Select the primary agreement governing the asset
      type: select_one
      options:
      - Equipment lease
      - Service contract
      - Purchase order
      - Maintenance agreement
      - Other
      required: true
    - id: 9
      name: vendor_name
      label: Vendor / lessor name
      hint: Company or individual providing equipment/service
      type: text
      options: []
      required: true
    - id: 10
      name: documentation_complete
      label: All required contract documents present
      hint: Contract, signed amendment, insurance certificates
      type: select_one
      options:
      - true
      - false
      - Partial
      required: true
    - id: 11
      name: financial_compliance
      label: Financial obligations met (payments, deposits)
      hint: Consider invoices, payment schedule, and reconciliations
      type: select_one
      options:
      - Compliant
      - Non-compliant
      - Not applicable
      required: true
    - id: 12
      name: equipment_condition
      label: Equipment physical condition
      hint: Visual inspection only; note defects in comments
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Unusable
      required: true
    - id: 13
      name: safety_score
      label: Safety score (1-10)
      hint: 10 = excellent; base on visible hazards and controls
      type: integer
      options: []
      required: true
    - id: 14
      name: issues_found
      label: Issues identified (select all)
      hint: Select all that apply; leave blank if none
      type: select_multiple
      options:
      - Safety hazard
      - Documentation gap
      - Equipment failure
      - Training needed
      - Insurance non-compliance
      - Unauthorized modification
      - Storage/placement issue
      required: false
    - id: 15
      name: regulatory_requirements_check
      label: Relevant regulatory or policy requirements met
      hint: Check local regs, agency policies, and ADM directives
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: true
    - id: 16
      name: corrective_actions
      label: Recommended corrective actions
      hint: Describe the action, responsible party, and priority
      type: text
      options: []
      required: false
    - id: 17
      name: corrective_action_assigned_to
      label: Corrective action assigned to (name or dept)
      hint: Department or person accountable for completion
      type: text
      options: []
      required: false
    - id: 18
      name: target_completion_date
      label: Target date for corrective action completion
      hint: Leave blank if no action required
      type: date
      options: []
      required: false
    - id: 19
      name: follow_up_date
      label: Follow-up inspection date
      hint: Schedule if issues were identified
      type: date
      options: []
      required: false
    - id: 20
      name: attachments_instructions
      label: '--- Supporting Evidence ---'
      hint: Attach photos, contract pages, invoices where available
      type: note
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional comments or notes
      hint: Use for context, serial numbers, or unusual findings
      type: text
      options: []
      required: false
