inputSchema:
  type: object
  properties:
    title: Trial Data Meeting Scheduler
    pages:
    - id: 1
      name: meeting_duration
      label: Preferred Trial/Data Review Meeting Duration
      hint: Select a suitable duration for the meeting
      type: number
      options: []
      required: true
    - id: 2
      name: trial_data_locations
      label: Trial/Data Review Meeting Locations
      hint: Please list the locations you are available for the meeting
      type: text
      options: []
      required: true
    - id: 3
      name: available_dates
      label: Available Dates
      hint: Select the dates when you are available for the meeting
      type: date
      options: []
      required: true
    - id: 4
      name: available_times
      label: Available Times
      hint: Select the times when you are available for the meeting
      type: time
      options: []
      required: true
    - id: 5
      name: meeting_schedule
      label: Meeting Schedule
      hint: Select your preferred meeting schedule options
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 6
      name: trial_data_review_meeting_preferences
      label: Trial Data Review Meeting Preferences
      hint: Select your preferences for the meeting
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 7
      name: discussion_topics
      label: Discussion Topics
      hint: Select the topics you would like to discuss during the meeting
      type: text
      options: []
      required: true
    - id: 8
      name: preferred_meeting_schedule
      label: Preferred Meeting Schedule
      hint: Select the preferred schedule for the meeting
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 9
      name: availability_rating
      label: Availability Rating
      hint: Rate your availability for the meeting
      type: number
      options: []
      required: true
    - id: 10
      name: additional_info
      label: Additional Information
      hint: Provide any additional information about the meeting
      type: text
      options: []
      required: false
    - id: 11
      name: trial_data_review_meeting_preferences_2
      label: Trial Data Review Meeting Preferences 2
      hint: Select your preferences for the trial/data review meeting
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 12
      name: discussion_topic_preferences
      label: Discussion Topic Preferences
      hint: Select your preferred discussion topics
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
