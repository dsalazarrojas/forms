inputSchema:
  type: object
  properties:
    title: Panel Application Form
    pages:
    - id: 1
      name: application_date
      label: Application Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: name
      label: full_name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: panel_type
      label: panel_type
      hint: null
      type: select_one
      options:
      - Panel A
      - Panel B
      - Panel C
      required: true
    - id: 6
      name: panel_location
      label: panel_location
      hint: null
      type: select_multiple
      options:
      - Location A
      - Location B
      - Location C
      required: true
    - id: 7
      name: application_reason
      label: application_reason
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: resume
      label: resume
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: portfolio
      label: portfolio
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: references
      label: references
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: agreement
      label: agreement
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: signature
      label: signature
      hint: null
      type: text
      options: []
      required: true
