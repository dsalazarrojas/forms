inputSchema:
  type: object
  properties:
    title: Enhancement Request Form
    pages:
    - id: 1
      name: user_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: description
      label: Description
      hint: A clear and concise description of the enhancement request.
      type: text
      options: []
      required: false
    - id: 6
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: assigned_user
      label: Assigned User
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
