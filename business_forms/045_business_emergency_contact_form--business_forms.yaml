inputSchema:
  type: object
  properties:
    title: Business Emergency Contact Form
    pages:
    - id: 1
      name: personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Your complete name
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID or Badge Number
      hint: Your employee identification
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: Your department or division
      type: text
      options: []
      required: true
    - id: 5
      name: position_title
      label: Position Title
      hint: Your job title
      type: text
      options: []
      required: true
    - id: 6
      name: work_phone
      label: Work Phone
      hint: Your office phone number
      type: text
      options: []
      required: true
    - id: 7
      name: work_email
      label: Work Email
      hint: Your business email
      type: email
      options: []
      required: true
    - id: 8
      name: emergency_contacts
      label: -- Emergency Contacts --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of primary emergency contact
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_relationship
      label: Relationship to You
      hint: Family relation or connection
      type: select_one
      options:
      - Spouse
      - Parent
      - Child
      - Sibling
      - Friend
      - Other Family
      - Other
      required: true
    - id: 11
      name: emergency_phone_1
      label: Primary Contact Phone
      hint: First emergency contact number
      type: text
      options: []
      required: true
    - id: 12
      name: emergency_phone_2
      label: Secondary Contact Phone
      hint: Alternate contact number
      type: text
      options: []
      required: false
    - id: 13
      name: emergency_email
      label: Emergency Contact Email
      hint: Email address of contact
      type: email
      options: []
      required: false
    - id: 14
      name: secondary_contact
      label: -- Secondary Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: secondary_name
      label: Secondary Contact Name
      hint: Name of second contact
      type: text
      options: []
      required: false
    - id: 16
      name: secondary_relationship
      label: Secondary Relationship
      hint: Relation to you
      type: text
      options: []
      required: false
    - id: 17
      name: secondary_phone
      label: Secondary Contact Phone
      hint: Second contact number
      type: text
      options: []
      required: false
    - id: 18
      name: health_medical
      label: -- Health and Medical Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: blood_type
      label: Blood Type
      hint: Your blood type if known
      type: select_one
      options:
      - O+
      - O-
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - Unknown
      required: false
    - id: 20
      name: allergies
      label: Allergies
      hint: Any medication or food allergies
      type: text
      options: []
      required: false
    - id: 21
      name: medical_conditions
      label: Medical Conditions
      hint: Relevant medical conditions
      type: text
      options: []
      required: false
    - id: 22
      name: medications
      label: Current Medications
      hint: Medications you take regularly
      type: text
      options: []
      required: false
    - id: 23
      name: physician_name
      label: Physician Name
      hint: Your doctor's name
      type: text
      options: []
      required: false
    - id: 24
      name: physician_phone
      label: Physician Phone
      hint: Doctor's contact number
      type: text
      options: []
      required: false
    - id: 25
      name: special_instructions
      label: Special Emergency Instructions
      hint: Any special care instructions
      type: text
      options: []
      required: false
