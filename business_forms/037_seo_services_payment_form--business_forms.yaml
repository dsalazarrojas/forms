inputSchema:
  type: object
  properties:
    title: seo_services_payment_form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: services_billed
      label: Services Billed
      hint: null
      type: select_multiple
      options:
      - Keyword Research
      - On-Page Optimization
      - Off-Page Optimization
      required: true
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
