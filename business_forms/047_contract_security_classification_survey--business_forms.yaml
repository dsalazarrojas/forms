        name: classification_justification
        label: Classification Justification
        hint: Why this classification?
        type: text
        options: []
        required: true
      - id: 10
        name: sensitive_information_types
        label: Sensitive Information Types
        hint: What sensitive data is included?
        type: select_multiple
        options:
          - Personal identifiable information
          - Financial data
          - Trade secrets
          - Technical specifications
          - Pricing information
          - Customer lists
          - Strategic plans
          - Intellectual property
          - National security information
          - None
        required: true
      - id: 11
        name: data_handling_requirements
        label: Data Handling Requirements
        hint: How must data be handled?
        type: select_multiple
        options:
