          - Locked cabinet
          - Secure room
          - Approved safe
          - Electronic only
          - Secure server
        required: true
      - id: 15
        name: transmission_methods
        label: Transmission Methods
        hint: How can it be shared?
        type: select_multiple
        options:
          - Encrypted email
          - Secure file transfer
          - Hand delivery
          - Registered mail
          - Courier service
          - Secure portal
          - No electronic transmission
        required: true
      - id: 16
        name: marking_requirements
        label: Marking Requirements
        hint: How to mark documents?
        type: select_multiple
        options:
