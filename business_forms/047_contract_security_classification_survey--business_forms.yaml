        hint: Job title
        type: text
        options: []
        required: true
      - id: 3
        name: department
        label: Department
        hint: Your department
        type: select_one
        options:
          - Security
          - Legal
          - Compliance
          - IT
          - Operations
          - Risk Management
          - Other
        required: true
      - id: 4
        name: survey_date
        label: Survey Date
        hint: Date of survey
        type: date
        options: []
        required: true
      - id: 5
        name: contract_number
        label: Contract Number
        hint: Contract reference
        type: text
        options: []
        required: true
      - id: 6
        name: contract_title
        label: Contract Title
        hint: Name of contract
        type: text
        options: []
        required: true
      - id: 7
        name: contract_type
        label: Contract Type
        hint: Category
        type: select_one
        options:
          - Service agreement
          - Vendor contract
          - Partnership agreement
          - Licensing agreement
          - Government contract
          - Defense contract
          - Research contract
          - Other
        required: true
      - id: 8
        name: security_classification
        label: Security Classification
        hint: Classification level
        type: select_one
        options:
