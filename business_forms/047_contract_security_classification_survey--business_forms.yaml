          - 3 years
          - 5 years
          - 10 years
          - Permanent
          - Per contract terms
        required: true
      - id: 18
        name: destruction_requirements
        label: Destruction Requirements
        hint: How to dispose?
        type: select_one
        options:
          - Standard disposal
          - Shredding required
          - Incineration required
          - Certified destruction
          - Return to originator
        required: true
      - id: 19
        name: foreign_disclosure
        label: Foreign Disclosure
        hint: Can it be shared internationally?
        type: select_one
        options:
          - No restrictions
          - US persons only
          - Specific countries approved
          - No foreign disclosure
          - Case by case basis
        required: true
      - id: 20
        name: export_control
        label: Export Control
        hint: Is export controlled?
        type: select_one
        options:
          - Not export controlled
          - EAR controlled
          - ITAR controlled
          - Dual use
