inputSchema:
  type: object
  properties:
    title: Service Proposal Value Assessment
    pages:
    - id: 1
      name: proposed_service
      label: Proposed Service
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: capture_benefits
      label: Capture Benefits
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: capture_costs
      label: Capture Costs
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: overall_value
      label: Overall Value
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: rate
      label: Rate
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: review_service
      label: Review Service
      hint: null
      type: select_multiple
      options:
      - Service A
      - Service B
      - Service C
      required: true
    - id: 7
      name: capture_stakeholders
      label: Capture Stakeholders
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: expected_stakeholders
      label: Expected Stakeholders
      hint: null
      type: select_multiple
      options:
      - Stakeholder 1
      - Stakeholder 2
      - Stakeholder 3
      required: true
    - id: 9
      name: review_decision
      label: Review Decision
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
