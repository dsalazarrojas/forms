      hint: Enter an email address
      type: email
      options: []
      required: false
    - id: 12
      name: risk_freeze_frequency
      label: Risk Freeze Frequency
      hint: null
      type: select_multiple
      options:
      - Never
      - Monthly
      - Quarterly
      - Semiannually
      - Annually
      required: false
