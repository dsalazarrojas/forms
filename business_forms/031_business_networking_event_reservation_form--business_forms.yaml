inputSchema:
  type: object
  properties:
    title: Business Networking Event Reservation Form
    pages:
    - id: 1
      name: reservist_name
      label: Reservist Name
      hint: Full name of person making reservation
      type: text
      options: []
      required: true
    - id: 2
      name: reservist_email
      label: Email Address
      hint: Email for confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: reservist_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your organization name
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 6
      name: event_name
      label: Event Name
      hint: Name of the event
      type: select_one
      options:
      - Spring networking gala
      - Summer business mixer
      - Fall industry summit
      - Winter holiday networking
      - Monthly breakfast club
      - Executive roundtable
      - Startup pitch night
      required: true
    - id: 7
      name: event_date
      label: Event Date
      hint: Date of event
      type: date
      options: []
      required: true
    - id: 8
      name: venue_location
      label: Venue Location
      hint: Event venue
      type: text
      options: []
      required: false
    - id: 9
      name: number_of_reservations
      label: Number of Reservations
      hint: Total seats needed
      type: number
      options: []
      required: true
    - id: 10
      name: guest_names
      label: Guest Names
      hint: Names of additional attendees
      type: text
      options: []
      required: false
    - id: 11
      name: reservation_type
      label: Reservation Type
      hint: Type of reservation
      type: select_one
      options:
      - Individual seat
      - Table for 4
      - Table for 8
      - Table for 10
      - VIP table
      - Sponsor table
      required: true
    - id: 12
      name: meal_selection
      label: Meal Selection
      hint: Primary meal choice
      type: select_one
      options:
      - Chicken
      - Beef
      - Fish
      - Vegetarian
      - Vegan
      - No meal needed
      required: true
    - id: 13
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any allergies or restrictions
      type: text
      options: []
      required: false
    - id: 14
      name: beverage_preference
      label: Beverage Preference
      hint: Drink preference
      type: select_one
      options:
      - Cash bar
      - Open bar included
      - Non-alcoholic only
      - Wine with dinner
      - No preference
      required: false
    - id: 15
      name: table_preferences
      label: Table Preferences
      hint: Seating preferences
      type: text
      options: []
      required: false
    - id: 16
      name: networking_goals
      label: Networking Goals
      hint: What connections are you seeking
      type: select_multiple
      options:
      - New clients
      - Strategic partners
      - Industry peers
      - Mentors
      - Vendors
      - Investors
      - General networking
      required: true
    - id: 17
      name: business_focus_areas
      label: Your Business Focus Areas
      hint: What industries do you serve
      type: text
      options: []
      required: false
    - id: 18
      name: presentation_interest
      label: Presentation Interest
      hint: Would you like to present at future events
      type: select_one
      options:
      - Yes - interested
      - Maybe - depends on topic
      - No - not interested
      required: false
    - id: 19
      name: sponsorship_interest
      label: Sponsorship Interest
      hint: Interested in sponsoring events
      type: select_one
      options:
      - Yes - definitely
      - Maybe - send information
      - No - not interested
      required: false
    - id: 20
      name: payment_status
      label: Payment Status
      hint: Payment method
      type: select_one
      options:
      - Paid online
      - Will pay at door
      - Invoice requested
      - Complimentary
      required: true
    - id: 21
      name: special_requests
      label: Special Requests
      hint: Any special accommodations
      type: text
      options: []
      required: false
    - id: 22
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
