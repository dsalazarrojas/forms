inputSchema:
  type: object
  properties:
    title: currency_conversion_form
    pages:
    - id: 1
      name: base_currency
      label: base_currency
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: to_currency
      label: to_currency
      hint: null
      type: select_one
      options:
      - United States Dollar
      - Euro
      - Japanese Yen
      - Chinese Yuan
      - Indian Rupee
      - Korean Won
      required: false
    - id: 3
      name: amount
      label: amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: rate
      label: rate
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: convert
      label: convert
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: converted_amount
      label: converted_amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: reset
      label: reset
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: confirm
      label: confirm
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
