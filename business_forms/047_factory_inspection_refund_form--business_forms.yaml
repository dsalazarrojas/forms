inputSchema:
  type: object
  properties:
    title: Factory Inspecton Refund Form
    pages:
    - id: 1
      name: form_submission_info
      label: Form Submision Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: factory_inspection_date
      label: Factory Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: refund_request_date
      label: Refund Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: amount_refunded
      label: Amount Refunded
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: refund_details
      label: Refund Details
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: reason_for_refund
      label: Reason for Refund
      hint: null
      type: select_one
      options:
      - Refund because of inspection error
      - Refund for not finding any issues
      - Refund for other reason
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Credit card
      - Bank transfer
      - Other (please specify)
      required: false
    - id: 11
      name: other_payment_method
      label: Other Payment Method
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: signature
      label: Signature
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
