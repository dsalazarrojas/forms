inputSchema:
  type: object
  properties:
    title: Account Activation Request Form
    pages:
    - id: 1
      name: requestor_name
      label: Requestor Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: requestor_email
      label: Requestor Email
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 3
      name: requestor_phone
      label: Requestor Phone
      hint: Your phone number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Name of your company or organization
      type: text
      options: []
      required: true
    - id: 5
      name: company_address
      label: Company Address
      hint: Complete address of your company
      type: text
      options: []
      required: true
    - id: 6
      name: account_type_requested
      label: Account Type Requested
      hint: What type of account are you requesting?
      type: select_one
      options:
      - Standard Business Account
      - Premium Business Account
      - Enterprise Account
      - Trial Account
      - Partner Account
      - Other
      required: true
    - id: 7
      name: requested_service
      label: Requested Service
      hint: What service or product does the account relate to?
      type: text
      options: []
      required: true
    - id: 8
      name: number_of_users
      label: Number of Users
      hint: How many users will need access to this account?
      type: number
      options: []
      required: true
    - id: 9
      name: billing_contact_name
      label: Billing Contact Name
      hint: Name of the person responsible for billing
      type: text
      options: []
      required: true
    - id: 10
      name: billing_contact_email
      label: Billing Contact Email
      hint: Email address for billing communications
      type: email
      options: []
      required: true
    - id: 11
      name: billing_contact_phone
      label: Billing Contact Phone
      hint: Phone number for billing inquiries
      type: text
      options: []
      required: true
    - id: 12
      name: activation_reason
      label: Activation Reason
      hint: Why do you need this account activated?
      type: text
      options: []
      required: true
    - id: 13
      name: expected_usage_volume
      label: Expected Usage Volume
      hint: What volume of transactions or usage do you anticipate?
      type: select_one
      options:
      - Low (under 100/month)
      - Medium (100-500/month)
      - High (500-1000/month)
      - Very High (over 1000/month)
      - Variable
      required: true
    - id: 14
      name: special_requirements
      label: Special Requirements
      hint: Do you have any special requirements for the account?
      type: text
      options: []
      required: false
    - id: 15
      name: compliance_requirements
      label: Compliance Requirements
      hint: Are there any compliance requirements for this account?
      type: select_multiple
      options:
      - SOC 2
      - GDPR
      - HIPAA
      - PCI DSS
      - SOX
      - ISO 27001
      - None
      - Other
      required: true
    - id: 16
      name: requested_activation_date
      label: Requested Activation Date
      hint: When do you need the account activated?
      type: date
      options: []
      required: true
    - id: 17
      name: technical_contact_name
      label: Technical Contact Name
      hint: Name of the technical contact person
      type: text
      options: []
      required: true
    - id: 18
      name: technical_contact_email
      label: Technical Contact Email
      hint: Email address for technical communications
      type: email
      options: []
      required: true
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Any other information about your request
      type: text
      options: []
      required: false
    - id: 20
      name: terms_acknowledgment
      label: Terms Acknowledgment
      hint: Do you acknowledge that you have read and agree to the terms of service?
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
