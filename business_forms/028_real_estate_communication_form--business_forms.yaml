inputSchema:
  type: object
  properties:
    title: Real Estate Communication Form
    pages:
    - id: 1
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: schedule_call
      label: Schedule A Call
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: client_feedback
      label: Client Feedback
