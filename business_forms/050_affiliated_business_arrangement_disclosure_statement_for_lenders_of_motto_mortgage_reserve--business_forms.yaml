      name: disclosure_header
      label: -- Disclosure Statement --
      hint: For lenders of Motto Mortgage Reserve.
      type: note
      options: []
      required: false
    - id: 2
      name: borrower_name
      label: Borrower Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: lender_info_header
      label: -- Lender Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: lender_name
      label: Lender Name
      hint: Motto Mortgage Reserve Representative.
      type: text
      options: []
      required: true
    - id: 7
      name: relationship_disclosure
      label: Relationship Disclosure
      hint: Description of the business relationship.
      type: text
      options: []
      required: true
    - id: 8
      name: service_provider_header
      label: -- Service Provider Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: provider_name
