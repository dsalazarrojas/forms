      name: service_description
      label: Service Description
      hint: Nature of the service provided.
      type: text
      options: []
      required: true
    - id: 11
      name: estimated_charge
      label: Estimated Charge ($)
      hint: Range of charges for the service.
      type: text
      options: []
      required: true
    - id: 12
      name: acknowledgement_header
      label: -- Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: borrower_acknowledgement
      label: Borrower Acknowledgment
      hint: I have read this disclosure form and understand that I am referring you
        to purchase the above-described settlement service(s) and may receive a financial
        or other benefit as the result of this referral.
      type: select_one
      options:
      - I Acknowledge
      - Other
      required: true
    - id: 14
      name: signature
      label: Borrower Signature
      hint: null
      type: select_one
      options:
      - Signed
      - Other
      required: true
    - id: 15
      name: sign_date
      label: Date Signed
      hint: null
      type: date
      options: []
      required: true
