inputSchema:
  type: object
  properties:
    title: retail_sustainability_score_program_application
    pages:
    - id: 1
      name: application_details
      label: Application Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: practices
      label: Practices
      hint: null
      type: select_multiple
      options:
      - Reduce waste and pollution
      - Source materials sustainably
      - Improve supply chain management
      - Support biodiversity conservation
      - Engage customers and educate
      - Improve supply chain transparency and accountability
      - Manage chemical use
      - Improve water management
      - Engage with local communities
      - Improve employee engagement
      required: false
    - id: 3
      name: focus_areas
      label: Focus Areas
      hint: null
      type: select_multiple
      options:
      - Energy and Climate
      - Water and Waste
      - Supply Chain
      - Product and Packaging
      - Human Rights and Labor
      - Biodiversity and Ecosystems
      - Community and Social
      - Resource Efficiency
      required: false
    - id: 4
      name: supporting_documentation
      label: Supporting Documentation
      hint: Please provide any relevant documentation or data to support your application.
      type: text
      options: []
      required: false
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submission_confirmation
      label: Submission Confirmation
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submission_confirmation_agreement
      label: I confirm that the information provided is accurate
      hint: This form is a legally binding representation of the truth and I understand
        that false or misleading information can lead to program rejection.
      type: text
      options: []
      required: false
    - id: 8
      name: submission_confirmation_agreement_2
      label: I understand that this form is submitted with the understanding that
        the information provided will be subject to verification and audit
      hint: null
      type: text
      options: []
      required: false
