inputSchema:
  type: object
  properties:
    title: Coaching Questionnaire AmandaV
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Your legal full name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 6
      name: industry
      label: Industry
      hint: What industry are you in
      type: text
      options: []
      required: false
    - id: 7
      name: years_in_current_role
      label: Years in Current Role
      hint: How long in this position
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 8
      name: total_work_experience
      label: Total Work Experience
      hint: Years of professional experience
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 9
      name: coaching_interest
      label: Area of Coaching Interest
      hint: What coaching do you need
      type: select_one
      options:
      - Leadership Development
      - Career Transition
      - Work-Life Balance
      - Performance Improvement
      - Communication Skills
      - Confidence Building
      - Strategic Thinking
      - Other
      required: true
    - id: 10
      name: primary_challenge
      label: Primary Challenge You Face
      hint: What is your biggest challenge
      type: text
      options: []
      required: true
    - id: 11
      name: coaching_goals
      label: Coaching Goals
      hint: What do you want to achieve
      type: text
      options: []
      required: true
    - id: 12
      name: ideal_outcome
      label: Ideal Outcome from Coaching
      hint: What would success look like
      type: text
      options: []
      required: true
    - id: 13
      name: current_stress_level
      label: Current Stress Level
      hint: Rate your stress
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Very High
      required: true
    - id: 14
      name: work_life_balance
      label: Work-Life Balance Satisfaction
      hint: Rate your balance
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 15
      name: leadership_style
      label: How Would You Describe Your Leadership Style
      hint: Describe your approach
      type: text
      options: []
      required: false
    - id: 16
      name: team_size
      label: Size of Team You Lead
      hint: Number of direct reports
      type: select_one
      options:
      - No Direct Reports
      - 1-5 People
      - 6-10 People
      - 11-20 People
      - Over 20 People
      required: false
    - id: 17
      name: management_challenges
      label: Management Challenges
      hint: What challenges do you face leading others
      type: text
      options: []
      required: false
    - id: 18
      name: communication_strengths
      label: Communication Strengths
      hint: What are you good at
      type: text
      options: []
      required: false
    - id: 19
      name: communication_weaknesses
      label: Communication Weaknesses
      hint: What do you struggle with
      type: text
      options: []
      required: false
    - id: 20
      name: decision_making_style
      label: Decision-Making Style
      hint: How do you make decisions
      type: select_one
      options:
      - Quick and Decisive
      - Analytical and Deliberate
      - Collaborative
      - Intuitive
      - Depends on Situation
      required: false
    - id: 21
      name: feedback_reception
      label: How Do You Receive Feedback
      hint: Describe your relationship with feedback
      type: text
      options: []
      required: false
    - id: 22
      name: motivation_sources
      label: What Motivates You
      hint: What drives you
      type: text
      options: []
      required: true
    - id: 23
      name: values
      label: Core Personal Values
      hint: What values guide you
      type: text
      options: []
      required: true
    - id: 24
      name: learning_style
      label: Preferred Learning Style
      hint: How do you learn best
      type: select_one
      options:
      - Visual
      - Auditory
      - Reading and Writing
      - Kinesthetic
      - Mixed
      required: false
    - id: 25
      name: previous_development
      label: Previous Professional Development
      hint: Describe past training or coaching
      type: text
      options: []
      required: false
    - id: 26
      name: time_availability
      label: Time Available for Coaching
      hint: How much time can you commit
      type: select_one
      options:
      - Less than 2 hours per week
      - 2-5 hours per week
      - 5-10 hours per week
      - Over 10 hours per week
      required: true
    - id: 27
      name: preferred_session_format
      label: Preferred Session Format
      hint: How do you want to meet
      type: select_one
      options:
      - In Person
      - Video Call
      - Phone Call
      - Hybrid
      required: true
    - id: 28
      name: additional_information
      label: Additional Information
      hint: Anything else to share
      type: text
      options: []
      required: false
