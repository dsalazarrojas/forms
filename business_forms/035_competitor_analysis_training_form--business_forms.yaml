inputSchema:
  type: object
  properties:
    title: Competitor Analysis Training Form
    pages:
    - id: 1
      name: training_session_header
      label: -- Competitor Analysis Training Feedback and Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: trainee_full_name
      label: Trainee Name
      hint: Person who attended the training session
      type: text
      options: []
      required: true
    - id: 3
      name: department_team_trainee
      label: Department / Team
      hint: e.g., Sales, Product, Marketing
      type: text
      options: []
      required: true
    - id: 4
      name: training_date_comp
      label: Date of Training
      hint: When did the session occur?
      type: date
      options: []
      required: true
    - id: 5
      name: competitor_knowledge_header
      label: -- Competitor Knowledge Self-Assessment --
      hint: Rate your understanding after training
      type: note
      options: []
      required: false
    - id: 6
      name: knowledge_rating_top_competitor
      label: Understanding of our Primary Competitor
      hint: Their product, pricing, and tactics
      type: select_one
      options:
      - 1 - No Knowledge
      - '2'
      - '3'
      - '4'
      - 5 - Expert Knowledge
      required: true
    - id: 7
      name: usp_understanding_rating
      label: Understanding of our Unique Selling Proposition (USP) against others
      hint: How well can you articulate why we are better?
      type: select_one
      options:
      - Very Clear
      - Clear
      - Somewhat Clear
      - Unclear
      required: true
    - id: 8
      name: objection_handling_confidence
      label: Confidence in handling competitor-related objections from customers
      hint: Rating your ability to "battle" competitor claims
      type: select_one
      options:
      - High Confidence
      - Moderate Confidence
      - Low Confidence
      required: true
    - id: 9
      name: training_content_feedback_section
      label: -- Training Quality Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: most_valuable_training_part
      label: What was the most valuable part of the training?
      hint: e.g., Battlecards, Live demo, Roleplay
      type: text
      options: []
      required: true
    - id: 11
      name: training_gaps_identified
      label: Are there any competitors or topics we missed?
      hint: Suggestions for future training sessions
      type: text
      options: []
      required: false
    - id: 12
      name: training_materials_rating
      label: Rate the quality of the training materials (Slides, Handouts)
      hint: Overall quality rating
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: trainee_satisfaction_rating
      label: Overall satisfaction with the training session
      hint: Final satisfaction score
      type: select_one
      options:
      - Highly Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 14
      name: training_eval_date
      label: Date of Feedback
      hint: Today's date
      type: date
      options: []
      required: true
