inputSchema:
  type: object
  properties:
    title: Babysitting Application
    pages:
    - id: 1
      name: job_intro
      label: -- Professional Babysitting Application --
      hint: Join our network of trusted caregivers
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: preferred_employment_type
      label: Desired Employment Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Occasional/As-needed
      - Summer only
      required: true
    - id: 6
      name: requested_pay_rate
      label: Requested Hourly Rate ($)
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: education_status
      label: Highest Education Completed
      hint: null
      type: select_one
      options:
      - High School
      - Associate's Degree
      - Bachelor's Degree
      - Master's Degree or higher
      required: true
    - id: 8
      name: childcare_experience_years
      label: Years of Professional Childcare Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: age_group_preferences
      label: Age Groups You Are Comfortable With
      hint: null
      type: select_multiple
      options:
      - Newborns (0-6 months)
      - Infants (6-18 months)
      - Toddlers (18 months - 3 years)
      - Preschool (3-5 years)
      - School Age (5-12 years)
      - Teenagers
      required: true
    - id: 10
      name: certifications_check
      label: Do you have active certifications?
      hint: null
      type: select_multiple
      options:
      - CPR - Infant
      - CPR - Adult
      - First Aid
      - Lifeguard
      - Special Needs Training
      required: false
    - id: 11
      name: availability_note
      label: Availability Schedule
      hint: List days and times you can work
      type: text
      options: []
      required: true
    - id: 12
      name: background_check_willingness
      label: Are you willing to undergo a background check?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: references_summary
      label: List three professional references
      hint: Include Name, Phone, and Email
      type: text
      options: []
      required: true
    - id: 14
      name: why_hire_me
      label: Why should a family choose you as their babysitter?
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: signature_acknowledgment
      label: I certify that all information provided is true and correct
      hint: null
      type: select_one
      options:
      - I certify
      - Other
      required: true
