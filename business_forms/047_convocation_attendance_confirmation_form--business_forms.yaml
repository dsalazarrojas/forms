inputSchema:
  type: object
  properties:
    title: Convocation Attendance Confirmation Form
    pages:
    - id: 1
      name: graduate_name
      label: Graduate Full Name
      hint: Legal name of graduate
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID Number
      hint: University identification number
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Primary email for communication
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: section_degree_info
      label: -- Degree Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: degree_program
      label: Degree Program
      hint: What degree are you receiving
      type: text
      options: []
      required: true
    - id: 7
      name: major
      label: Major
      hint: Field of study
      type: text
      options: []
      required: true
    - id: 8
      name: minor
      label: Minor
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 9
      name: honors_distinction
      label: Honors or Distinction
      hint: If applicable
      type: select_one
      options:
      - Summa Cum Laude
      - Magna Cum Laude
      - Cum Laude
      - With Honors
      - None
      required: false
    - id: 10
      name: section_convocation_details
      label: -- Convocation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: convocation_date
      label: Convocation Date
      hint: Date of ceremony
      type: date
      options: []
      required: true
    - id: 12
      name: convocation_time
      label: Convocation Time
      hint: Time of ceremony
      type: time
      options: []
      required: true
    - id: 13
      name: venue_location
      label: Venue Location
      hint: Where will ceremony be held
      type: text
      options: []
      required: true
    - id: 14
      name: section_attendance
      label: -- Attendance Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: will_attend
      label: Will you attend the convocation
      hint: null
      type: select_one
      options:
      - Yes - I will attend
      - No - I will not attend
      required: true
    - id: 16
      name: number_of_guests
      label: Number of Guests
      hint: How many guests will accompany you
      type: number
      options: []
      required: false
    - id: 17
      name: guest_names
      label: Guest Names
      hint: List names of guests
      type: text
      options: []
      required: false
    - id: 18
      name: section_regalia
      label: -- Regalia --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: cap_gown_size
      label: Cap and Gown Size
      hint: null
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      - XXXL
      required: false
    - id: 20
      name: regalia_pickup
      label: Regalia Pickup Preference
      hint: null
      type: select_one
      options:
      - Pick Up on Campus
      - Mail to Address
      - Already Have
      required: false
    - id: 21
      name: section_accessibility
      label: -- Accessibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: accessibility_needs
      label: Do you have any accessibility needs
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 23
      name: accessibility_details
      label: Accessibility Details
      hint: Describe any accommodations needed
      type: text
      options: []
      required: false
    - id: 24
      name: wheelchair_access_required
      label: Is wheelchair access required
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 25
      name: section_parking
      label: -- Parking --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: parking_required
      label: Will you need parking
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 27
      name: number_of_vehicles
      label: Number of Vehicles
      hint: How many vehicles need parking
      type: number
      options: []
      required: false
    - id: 28
      name: disability_parking
      label: Is disability parking required
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 29
      name: section_reception
      label: -- Reception --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: attending_reception
      label: Will you attend the reception
      hint: null
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: false
    - id: 31
      name: reception_guests
      label: Number of Reception Guests
      hint: Including yourself
      type: number
      options: []
      required: false
    - id: 32
      name: dietary_requirements
      label: Dietary Requirements
      hint: For reception catering
      type: select_one
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Kosher
      - Halal
      - Other
      required: false
    - id: 33
      name: section_contact_preferences
      label: -- Contact Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 34
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      required: false
    - id: 35
      name: section_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 36
      name: special_requests
      label: Special Requests
      hint: Any special requirements
      type: text
      options: []
      required: false
    - id: 37
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 38
      name: confirmation_date
      label: Confirmation Date
      hint: Date of this confirmation
      type: date
      options: []
      required: true
