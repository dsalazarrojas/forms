inputSchema:
  type: object
  properties:
    title: Aircraft Cabin Safety Inspection Form
    pages:
    - id: 1
      name: inspector_name
      label: Inspector name
      hint: Name of the cabin inspector
      type: text
      options: []
      required: true
    - id: 2
      name: inspection_date
      label: Inspection date
      hint: Date inspection took place
      type: date
      options: []
      required: true
    - id: 3
      name: cabin_condition
      label: General cabin condition
      hint: Seats, overhead bins, and interior surfaces
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: safety_equipment_check
      label: Safety equipment check
      hint: Life vests, oxygen masks, extinguishers status
      type: text
      options: []
      required: true
    - id: 5
      name: emergency_exits
      label: Emergency exits operational
      hint: Check exit signs and mechanisms
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: lavatory_condition
      label: Lavatory condition
      hint: Cleanliness and functionality
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: galley_equipment
      label: Galley equipment status
      hint: Condition and secure storage of appliances
      type: text
      options: []
      required: false
    - id: 8
      name: findings_and_recommendations
      label: Findings and recommendations
      hint: Any corrective actions required
      type: text
      options: []
      required: true
    - id: 9
      name: inspector_signature
      label: Inspector signature
      hint: Acknowledge completion of checklist
      type: note
      options: []
      required: true
