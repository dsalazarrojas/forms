inputSchema:
  type: object
  properties:
    title: Appointment Request Form - White And Responsive
    pages:
    - id: 1
      name: your_information
      label: -- Your Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: scheduling_info
      label: -- Scheduling Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_type
      label: Service or Department
      hint: null
      type: select_one
      options:
      - General inquiry
      - Sales
      - Support
      - Technical
      - Consultation
      - Other
      required: true
    - id: 8
      name: appointment_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: appointment_time
      label: Preferred Time
      hint: null
      type: select_one
      options:
      - 8 AM - 9 AM
      - 9 AM - 10 AM
      - 10 AM - 11 AM
      - 11 AM - 12 PM
      - 1 PM - 2 PM
      - 2 PM - 3 PM
      - 3 PM - 4 PM
      - 4 PM - 5 PM
      - 5 PM - 6 PM
      required: true
    - id: 10
      name: communication_style
      label: -- Communication Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: meeting_type
      label: How would you like to meet?
      hint: null
      type: select_one
      options:
      - In-person
      - Phone call
      - Video call
      - Email
      - Text chat
      - No preference
      required: true
    - id: 12
      name: message_subject
      label: Subject or Topic
      hint: What is this appointment about?
      type: text
      options: []
      required: true
    - id: 13
      name: message_details
      label: Tell us more about your request
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: urgency_level
      label: How urgent is your request?
      hint: null
      type: select_one
      options:
      - Not urgent - standard scheduling
      - Moderate - prefer sooner
      - Urgent - ASAP
      required: false
    - id: 15
      name: business_info
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: business_name
      label: Business or Organization Name
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: industry
      label: Industry or Business Type
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: company_size
      label: Company Size
      hint: null
      type: select_one
      options:
      - Solo/Self-employed
      - 2-10 employees
      - 11-50 employees
      - 51-200 employees
      - 200+ employees
      - Not applicable
      required: false
    - id: 19
      name: additional_notes
      label: Additional Notes
      hint: Anything else we should know?
      type: text
      options: []
      required: false
    - id: 20
      name: confirmation
      label: I would like to receive a confirmation email
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
