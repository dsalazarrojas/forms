inputSchema:
  type: object
  properties:
    title: 90 Day Employee Evaluation Form
    pages:
    - id: 1
      name: section_header_employee
      label: "--- Employee Evaluation (90 Days) ---"
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: position_title
      label: Position / job title
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: evaluator_name
      label: Evaluator name
      hint: Supervisor or HR representative
      type: text
      options: []
      required: true
    - id: 5
      name: evaluation_date
      label: Evaluation date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: overall_performance_rating
      label: Overall performance rating (1-10)
      hint: 10 = exceptional performance
      type: integer
      options: []
      required: true
    - id: 7
      name: core_competencies_rating
      label: Core competencies assessment
      hint: Select best match
      type: select_one
      options:
        - Exceeds expectations
        - Meets expectations
        - Needs improvement
        - Unsatisfactory
      required: true
    - id: 8
      name: key_strengths
      label: Key strengths observed
      hint: Describe behaviors, outcomes, examples
      type: text
      options: []
      required: false
    - id: 9
      name: areas_for_improvement
      label: Areas for improvement / development plan
      hint: Include specific measurable actions
      type: text
      options: []
      required: true
    - id: 10
      name: attendance_and_punctuality
      label: Attendance & punctuality (1-5)
      hint: 5 = excellent
      type: integer
      options: []
      required: true
    - id: 11
      name: remote_work_adaptability
      label: Remote work adaptability
      hint: How well the employee works remotely (if applicable)
      type: select_one
      options:
        - Highly adaptable
        - Adequate
        - Needs support
        - Not applicable
      required: false
    - id: 12
      name: recommended_next_steps
      label: Recommended next steps (select one)
      hint: HR action recommended after review
      type: select_one
      options:
        - Continue in role
        - Extend probation with performance plan
        - Reassign responsibilities
        - Termination recommended
        - Further training required
      required: true
    - id: 13
      name: evaluator_comments
      label: Final evaluator comments
      hint: Summarize decision rationale and expectations
      type: text
      options: []
      required: false
    - id: 14
      name: evaluator_signature
      label: Evaluator signature
      hint: Type full name to serve as e-signature
      type: text
      options: []
      required: true
