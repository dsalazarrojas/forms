inputSchema:
  type: object
  properties:
    title: Graphic Design Service Agreement
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: scope_of_work
      label: Scope of Work
      hint: Describe the project scope including services provided.
      type: text
      options: []
      required: false
    - id: 3
      name: payment_schedule
      label: Payment Schedule
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: payment_terms
      label: Payment Terms
      hint: null
      type: select_one
      options:
      - Payment due on receipt of invoice
      - Payment due 14 days after project completion
      - Payment due on project completion
      required: false
    - id: 5
      name: deliverables
      label: Deliverables
      hint: List the deliverables included in the project.
      type: select_multiple
      options:
      - Final design concept
      - Revisions
      - Final design files
      - Design concept revisions
      - Final design files revisions
      - Presentation and design files
      - Design presentation files revisions
      required: false
    - id: 6
      name: copyright_protection
      label: Copyright Protection
      hint: Describe copyright protection for the work.
      type: text
      options: []
      required: false
    - id: 7
      name: communication
      label: Communication
      hint: Describe how often you'd like to hear from each other.
      type: text
      options: []
      required: false
    - id: 8
      name: payment_terms_notes
      label: Payment Terms Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: agreement_signatures
      label: Agreement Signatures
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: contract_review
      label: Contract Review
      hint: null
      type: select_one
      options:
      - Both parties
      - Designer only
      - Client only
      - Both client and designer
      required: false
    - id: 11
      name: contract_review_comments
      label: Contract Review Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: date_signed
      label: Date Signed
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: signed_by_client
      label: Signed by Client
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      required: false
