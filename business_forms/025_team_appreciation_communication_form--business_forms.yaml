inputSchema:
  type: object
  properties:
    title: Team Appreciation Communication Form
    pages:
    - id: 1
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: appreciation_type
      label: Appreciation Type
      hint: null
      type: select_one
      options:
      - Team Lunch
      - Team Dinner
      - Publicly Acknowledgment
      required: false
    - id: 3
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: employee_names
      label: Employee Names
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: assigned_to_other
      label: Other Assigned To
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: submitted_by_other
      label: Other Submitted By
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: form_id
      label: Form ID
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: form_id_other
      label: Other Form ID
      hint: null
      type: text
      options: []
      required: false
