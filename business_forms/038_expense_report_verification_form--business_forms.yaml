inputSchema:
  type: object
  properties:
    title: Expense Report Verification Form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: date_submitted
      label: Date Submitted
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: verification_status
      label: Verification Status
      hint: null
      type: select_one
      options:
      - Verified
      - Not Verified
      - Needs Review
      required: false
    - id: 4
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: claim_amount
      label: Claim Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: verification_comments
      label: Verification Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: submitter
      label: Submitter
      hint: null
      type: text
      options: []
      required: false
