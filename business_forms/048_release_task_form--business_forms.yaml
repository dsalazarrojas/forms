inputSchema:
  type: object
  properties:
    title: Release Task Form
    pages:
    - id: 1
      name: project_id
      label: project_id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      required: true
    - id: 3
      name: task_type
      label: Task Type
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Not Started
      - In Progress
      - Completed
      required: false
    - id: 8
      name: comment
      label: Comment
      hint: null
      type: text
      options: []
      required: false
