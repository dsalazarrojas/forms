inputSchema:
  type: object
  properties:
    title: Employee Communication Draft Review Request
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: draft_message
      label: Message Draft
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: context_provided
      label: Context Provided
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: deadline
      label: Deadline
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: reviewer_name
      label: Reviewer Name
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: review_type
      label: Review Type
      hint: Select "Review", "Approve", or "Reject"
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: meeting
      label: Meeting
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
