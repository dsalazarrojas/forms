    - id: 4
      name: inventory_reorder
      label: Reorder Inventory
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: inventory_reorder_threshold
      label: Reorder Threshold
      hint: null
      type: number
      options: []
      required: false
