inputSchema:
  type: object
  properties:
    title: Consumer Goods Brand Management Audit Form
    pages:
    - id: 1
      name: auditor_name
      label: Auditor Name
      hint: Name of the auditor
      type: text
      options: []
      required: true
    - id: 2
      name: auditor_id
      label: Auditor ID
      hint: Identification number
      type: text
      options: []
      required: true
    - id: 3
      name: audit_date
      label: Audit Date
      hint: Date of audit
      type: date
      options: []
      required: true
    - id: 4
      name: audit_time
      label: Audit Time
      hint: Time of audit
      type: time
      options: []
      required: true
    - id: 5
      name: store_name
      label: Store Name
      hint: Name of retail location
      type: text
      options: []
      required: true
    - id: 6
      name: store_number
      label: Store Number
      hint: Store identification number
      type: text
      options: []
      required: false
    - id: 7
      name: store_address
      label: Store Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 8
      name: store_city
      label: City
      hint: City location
      type: text
      options: []
      required: true
    - id: 9
      name: store_state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 10
      name: store_manager
      label: Store Manager
      hint: Name of store manager
      type: text
      options: []
      required: false
    - id: 11
      name: brand_name
      label: Brand Name
      hint: Brand being audited
      type: text
      options: []
      required: true
    - id: 12
      name: product_category
      label: Product Category
      hint: Category of products
      type: select_one
      options:
      - Food and Beverage
      - Personal Care
      - Household Products
      - Health and Wellness
      - Baby Products
      - Pet Products
      - Other
      required: true
    - id: 13
      name: shelf_presence
      label: Shelf Presence
      hint: Rate shelf visibility
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 14
      name: shelf_placement
      label: Shelf Placement
      hint: Select placement level
      type: select_one
      options:
      - Eye Level
      - Above Eye Level
      - Below Eye Level
      - Floor Level
      - End Cap
      - Checkout Area
      required: true
    - id: 15
      name: facings_count
      label: Number of Facings
      hint: Count of product facings
      type: number
      options: []
      required: true
    - id: 16
      name: stock_level
      label: Stock Level
      hint: Current inventory level
      type: select_one
      options:
      - Fully Stocked
      - Well Stocked
      - Adequate
      - Low Stock
      - Out of Stock
      required: true
    - id: 17
      name: out_of_stock_items
      label: Out of Stock Items
      hint: List any OOS products
      type: text
      options: []
      required: false
    - id: 18
      name: pricing_display
      label: Pricing Display
      hint: Is pricing clearly displayed
      type: select_one
      options:
      - Yes, Clear and Accurate
      - Yes, But Some Issues
      - No, Missing Prices
      - No, Incorrect Prices
      required: true
    - id: 19
      name: promotional_materials
      label: Promotional Materials
      hint: Are promotions displayed
      type: select_one
      options:
      - Yes, Well Displayed
      - Yes, But Limited
      - No Promotions
      - Expired Promotions
      required: true
    - id: 20
      name: signage_condition
      label: Signage Condition
      hint: Rate condition of signage
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Damaged
      - Missing
      required: true
    - id: 21
      name: competitor_presence
      label: Competitor Presence
      hint: Note competitor activity
      type: text
      options: []
      required: false
    - id: 22
      name: planogram_compliance
      label: Planogram Compliance
      hint: Is planogram followed
      type: select_one
      options:
      - Fully Compliant
      - Mostly Compliant
      - Partially Compliant
      - Not Compliant
      - No Planogram
      required: true
    - id: 23
      name: product_condition
      label: Product Condition
      hint: Rate product condition
      type: select_one
      options:
      - All Products Perfect
      - Minor Issues
      - Some Damage
      - Significant Damage
      - Major Issues
      required: true
    - id: 24
      name: cleanliness_rating
      label: Area Cleanliness
      hint: Rate cleanliness of display area
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 25
      name: photos_taken
      label: Photos Taken
      hint: Were photos documented
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 26
      name: issues_found
      label: Issues Found
      hint: Describe any issues
      type: text
      options: []
      required: false
    - id: 27
      name: recommendations
      label: Recommendations
      hint: Suggested actions
      type: text
      options: []
      required: false
    - id: 28
      name: follow_up_required
      label: Follow-up Required
      hint: Is follow-up needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 29
      name: overall_score
      label: Overall Audit Score
      hint: Rate overall performance
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
