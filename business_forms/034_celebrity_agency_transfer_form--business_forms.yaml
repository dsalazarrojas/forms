      name: notice_period_days
      label: Notice Period Required (days)
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: pending_commitments
      label: Pending Commitments or Projects
      hint: List any ongoing contracts or projects
      type: text
      options: []
      required: false
    - id: 24
      name: section_acknowledgment
