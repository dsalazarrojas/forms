      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: current_agent_contact
      label: Current Agent Contact Information
      hint: Phone and email
      type: text
      options: []
      required: true
    - id: 11
      name: representation_start_date
      label: Representation Start Date
