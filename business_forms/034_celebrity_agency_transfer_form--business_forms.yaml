      name: new_agency_name
      label: New Agency Name
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: new_agent_name
      label: New Agent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: new_agent_contact
      label: New Agent Contact Information
      hint: Phone and email
      type: text
      options: []
      required: true
