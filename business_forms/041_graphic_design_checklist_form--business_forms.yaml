inputSchema:
  type: object
  properties:
    title: Graphic Design Checklist Form
    pages:
    - id: 1
      name: project_info
      label: Project Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_info_2
      label: Project Description
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: design_requirements
      label: Design Requirements
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: color_scheme
      label: Color Scheme
      hint: null
      type: select_one
      options:
      - Monochromatic
      - Complementary
      - Analogous
      required: true
    - id: 5
      name: images
      label: Images
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: images_2
      label: Images 2
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: fonts
      label: Fonts and Typography
      hint: null
      type: select_multiple
      options:
      - Arial
      - Times New Roman
      - Calibri
      required: false
    - id: 8
      name: project_info_3
      label: Project Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: color_type
      label: Color Type
      hint: null
      type: select_one
      options:
      - RGB
      - CMYK
      required: false
    - id: 10
      name: design_file
      label: Design File
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: design_file_2
      label: Design File 2
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: deadline
      label: Project Deadline
      hint: Format - YYYY-MM-DD
      type: date
      options: []
      required: true
