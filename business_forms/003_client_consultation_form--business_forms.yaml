inputSchema:
  type: object
  properties:
    title: Client Consultation Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: section_project
      label: -- Project Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: consultation_goal
      label: What is the primary goal of this consultation?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: budget_range
      label: Estimated Budget Range
      hint: null
      type: select_one
      options:
      - Under $1
      - 0
      - $1
      - 000 - $5
      - 0
      - $5
      - 000 - $10
      - 0
      - Over $10
      - 0
      required: true
    - id: 8
      name: start_date
      label: Preferred Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: project_duration
      label: Expected Project Duration
      hint: null
      type: select_one
      options:
      - 1 month
      - 3 months
      - 6 months
      - Ongoing
      required: false
    - id: 10
      name: referral_source
      label: How did you hear about our services?
      hint: null
      type: select_one
      options:
      - Referral
      - Social Media
      - Search Engine
      - Advertisement
      - Other
      required: false
    - id: 11
      name: additional_notes
      label: Additional notes or requirements
      hint: null
      type: text
      options: []
      required: false
