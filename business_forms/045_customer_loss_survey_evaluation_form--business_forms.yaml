    - id: 23
      name: customer_loss_survey_evaluation_form_pages_23
      label: Was the reason for contact?
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: customer_loss_survey_evaluation_form_pages_24
      label: Was this a follow up contact?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 25
      name: customer_loss_survey_evaluation_form_pages_25
      label: Was the customer contacted by a supervisor?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
