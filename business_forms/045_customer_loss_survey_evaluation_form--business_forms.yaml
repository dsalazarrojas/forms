      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: customer_loss_survey_evaluation_form_pages_14
      label: What was the average order total with discount applied?
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: customer_loss_survey_evaluation_form_pages_15
      label: Was this a gift order?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 16
      name: customer_loss_survey_evaluation_form_pages_16
