inputSchema:
  type: object
  properties:
    title: Customer Loss Survey Evaluation Form
    pages:
    - id: 1
      name: customer_loss_survey_evaluation_form_pages_1
      label: What was the reason for the customer canceling?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_loss_survey_evaluation_form_pages_2
      label: What was the status of your customer service?
      hint: null
      type: select_one
      options:
      - Poor quality of products/services
      - Long wait time
      - Difficulty communicating with customer service
      - Other (please specify)
      required: false
    - id: 3
      name: customer_loss_survey_evaluation_form_pages_3
      label: Was this a single or repeat customer?
      hint: null
      type: select_multiple
      options:
      - Single customer
      - Multiple customers
      - Both
      required: false
    - id: 4
      name: customer_loss_survey_evaluation_form_pages_4
      label: Which of the following was the primary reason?
      hint: null
      type: select_one
      options:
      - Price
      - Quality
      - Service
      - Other
      required: false
    - id: 5
      name: customer_loss_survey_evaluation_form_pages_5
      label: Was this customer a new or repeat customer?
      hint: null
      type: select_one
      options:
      - New
      - Repeat
      required: false
    - id: 6
      name: customer_loss_survey_evaluation_form_pages_6
      label: How would you rate the quality of our service?
      hint: On a scale of 1-5 where 1 is very poor and 5 is excellent
      type: number
      options: []
      required: false
    - id: 7
      name: customer_loss_survey_evaluation_form_pages_7
      label: What was the average order value?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: customer_loss_survey_evaluation_form_pages_8
      label: What was the average order frequency?
      hint: null
      type: select_multiple
      options:
      - Less than once a month
      - Once a month
      - Every two weeks
      - Once a week
      - More than once a week
      required: false
    - id: 9
      name: customer_loss_survey_evaluation_form_pages_9
      label: What was the average order total?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: customer_loss_survey_evaluation_form_pages_10
      label: Was the customer satisfied with their order?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: customer_loss_survey_evaluation_form_pages_11
      label: Was this a sale or return?
      hint: null
      type: select_multiple
      options:
      - Sale
      - Return
      required: false
    - id: 12
      name: customer_loss_survey_evaluation_form_pages_12
