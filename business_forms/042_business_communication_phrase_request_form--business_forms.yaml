        - Within 24 Hours
        - Within 3 Days
        - Within 1 Week
        - Flexible
        required: true
      - id: 20
        name: usage_frequency
        label: How Often Will This Be Used
        hint: Frequency of use
        type: select_one
        options:
        - One-Time Use
        - Occasional Use
        - Regular Use
        - Ongoing Template
        required: true
      - id: 21
        name: additional_context
        label: Additional Context
        hint: Any other information
        type: text
        options: []
        required: false
