inputSchema:
  type: object
  properties:
    title: Business Sign Up Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      type: note
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Your business email
      type: email
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      required: true
    - id: 6
      name: section_business_info
      label: -- Business Information --
      type: note
      required: false
    - id: 7
      name: business_name
      label: Business Name
      hint: Name of your company
      type: text
      required: true
    - id: 8
      name: business_industry
      label: Industry
      hint: What industry is your business in
      type: select_one
      options:
      - Technology
      - Retail
      - Manufacturing
      - Services
      - Healthcare
      - Finance
      - Education
      - Other
      required: true
    - id: 9
      name: business_type
      label: Type of Business
      hint: Business structure
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - Corporation
      - Non-Profit
      - Other
      required: true
    - id: 10
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - 1 person
      - 2-5
      - 6-20
      - 21-50
      - 51-100
      - 100+
      required: true
    - id: 11
      name: years_in_business
      label: Years in Business
      hint: How long have you been operating
      type: number
      required: false
    - id: 12
      name: section_contact_address
      label: -- Contact Address --
      type: note
      required: false
    - id: 13
      name: street_address
      label: Street Address
      hint: Business address
      type: text
      required: true
    - id: 14
      name: city
      label: City
      hint: City
      type: text
      required: true
    - id: 15
      name: state_province
      label: State or Province
      hint: State or province
      type: text
      required: true
    - id: 16
      name: postal_code
      label: Postal Code
      hint: Zip or postal code
      type: text
      required: true
    - id: 17
      name: country
      label: Country
      hint: Country
      type: text
      required: false
    - id: 18
      name: section_interests
      label: -- Services and Interests --
      type: note
      required: false
    - id: 19
      name: interested_services
      label: Services You Are Interested In
      hint: Select all that apply
      type: select_multiple
      options:
      - Consulting
      - Training Programs
      - Software Solutions
      - Networking Events
      - Marketing Services
      - Financial Services
      - Membership Programs
      required: true
    - id: 20
      name: section_preferences
      label: -- Communication Preferences --
      type: note
      required: false
    - id: 21
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we reach you
      type: select_one
      options:
      - Email
      - Phone
      - Text Message
      - Fax
      required: false
    - id: 22
      name: newsletter_signup
      label: Subscribe to Newsletter
      hint: Receive updates and news
      type: select_one
      options:
      - Yes, sign me up
      - No, thanks
      required: false
    - id: 23
      name: website
      label: Business Website
      hint: Your website URL if applicable
      type: text
      required: false
    - id: 24
      name: additional_info
      label: Additional Information
      hint: Any other details about your business
      type: text
      required: false
