inputSchema:
  type: object
  properties:
    title: Bug Report Feedback Form
    pages:
      - id: 1
        name: reporter_name
        label: Your Name
        hint: Full name of person reporting
        type: text
        options: []
        required: false
      - id: 2
        name: email
        label: Email Address
        hint: Contact email for follow-up
        type: email
        options: []
        required: true
      - id: 3
        name: report_date
        label: Report Date
        hint: Date when bug was discovered
        type: date
        options: []
        required: true
      - id: 4
        name: application_name
        label: Application Name
        hint: Name of the software or app
        type: text
        options: []
        required: true
      - id: 5
        name: application_version
        label: Application Version
        hint: Version number if known
        type: text
        options: []
        required: false
      - id: 6
        name: bug_category
        label: Bug Category
        hint: Type of issue encountered
        type: select_one
        options:
          - Functional Error
          - User Interface Issue
          - Performance Issue
          - Security Issue
          - Data Issue
          - Compatibility Issue
          - Documentation Error
          - Other
        required: true
      - id: 7
        name: severity
        label: Severity Level
        hint: How severe is this bug
        type: select_one
        options:
          - Critical - System Crash
          - High - Major Functionality Broken
          - Medium - Minor Functionality Affected
          - Low - Cosmetic Issue
          - Trivial - Typo or Suggestion
        required: true
      - id: 8
        name: priority
        label: Priority Level
        hint: How urgently should this be fixed
        type: select_one
        options:
          - Urgent - Fix Immediately
          - High - Fix Soon
          - Medium - Fix When Possible
          - Low - Fix Later
          - Lowest - Backlog
        required: true
      - id: 9
        name: browser_used
        label: Browser Used
        hint: Which browser were you using
        type: select_one
        options:
          - Google Chrome
          - Mozilla Firefox
          - Safari
          - Microsoft Edge
          - Opera
          - Internet Explorer
          - Other
          - Not Applicable
        required: false
      - id: 10
        name: operating_system
        label: Operating System
        hint: What OS are you using
        type: select_one
        options:
          - Windows 11
          - Windows 10
          - macOS
          - Linux
          - iOS
          - Android
          - Other
        required: false
      - id: 11
        name: device_type
        label: Device Type
        hint: What device are you using
        type: select_one
        options:
          - Desktop
          - Laptop
          - Tablet
          - Smartphone
          - Other
        required: false
      - id: 12
        name: bug_title
        label: Bug Title
        hint: Brief summary of the issue
        type: text
        options: []
        required: true
      - id: 13
        name: bug_description
        label: Detailed Description
        hint: Describe the bug in detail
        type: text
        options: []
        required: true
      - id: 14
        name: steps_to_reproduce
        label: Steps to Reproduce
        hint: List steps to reproduce the bug
        type: text
        options: []
        required: true
      - id: 15
        name: expected_behavior
        label: Expected Behavior
        hint: What should have happened
        type: text
        options: []
        required: true
      - id: 16
        name: actual_behavior
        label: Actual Behavior
        hint: What actually happened
        type: text
        options: []
        required: true
      - id: 17
        name: frequency
        label: Frequency of Occurrence
        hint: How often does this occur
        type: select_one
        options:
          - Always
          - Often
          - Sometimes
          - Rarely
          - Only Once
        required: true
      - id: 18
        name: attachments
        label: Screenshots or Files Attached
        hint: Do you have screenshots to attach
        type: select_one
        options:
          - Yes - Will Attach
          - No - Not Available
        required: false
      - id: 19
        name: additional_comments
        label: Additional Comments
        hint: Any other relevant information
        type: text
        options: []
        required: false
      - id: 20
        name: contact_preference
        label: Contact Preference
        hint: How should we contact you for follow-up
        type: select_one
        options:
          - Email
          - Phone Call
          - No Contact Needed
        required: false
