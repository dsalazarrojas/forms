inputSchema:
  type: object
  properties:
    title: food_thawing_temperature_log
    pages:
    - id: 1
      name: thawing_temperature
      label: Temperature
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: thawing_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: temperature_unit
      label: Unit
      hint: null
      type: select_one
      options:
      - Fahrenheit
      - Celsius
      - Kelvin
      required: false
    - id: 5
      name: food_type
      label: Food Type
      hint: null
      type: select_multiple
      options:
      - Chicken
      - Fish
      - Meat
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: Additional notes about the thawing process
      type: note
      options: []
      required: false
    - id: 7
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
