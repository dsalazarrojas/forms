inputSchema:
  type: object
  properties:
    title: Thanksgiving Turkey Reservation Form
    pages:
    - id: 1
      name: turkey_type
      label: Turkey type
      hint: null
      type: select_multiple
      options:
      - Whole Turkey
      - Dinner
      - Dinner for 4
      - Dinner for 5
      required: false
    - id: 2
      name: guest_count
      label: Number of guests
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: reservation_time
      label: Reservation time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
