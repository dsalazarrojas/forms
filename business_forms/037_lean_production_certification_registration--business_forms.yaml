inputSchema:
  type: object
  properties:
    title: Lean Production Certification Registration
    pages:
    - id: 1
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: training_provider
      label: Training Provider
      hint: Training provider name
      type: text
      options: []
      required: false
    - id: 3
      name: experience
      label: Experience
      hint: Experience description
      type: text
      options: []
      required: false
    - id: 4
      name: preferred_sessions
      label: Preferred Sessions
      hint: Select sessions
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: certification_status
      label: Certification Status
      hint: Select certification status
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 6
      name: submission_details
      label: Submission Details
      hint: null
      type: text
      options: []
      required: false
