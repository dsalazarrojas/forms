inputSchema:
  type: object
  properties:
    title: Branded Website Service Application Form
    pages:
    - id: 1
      name: client_profile_header
      label: -- Client and Business Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name_val
      label: Client Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: biz_name
      label: Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email_addr
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: old_site_url
      label: Current Website URL
      hint: If any
      type: text
      options: []
      required: false
    - id: 6
      name: objectives_header
      label: -- Website Objectives --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: goals_select
      label: What are the primary goals for your new website?
      hint: Select all that apply
      type: select_multiple
      options:
      - Sell Products (E-commerce)
      - Lead Generation
      - Brand Awareness
      - Portfolio Showcase
      - Information Hub
      required: true
    - id: 8
      name: target_audience_desc
      label: Describe your target audience
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: design_pref
      label: Preferred Design Aesthetic
      hint: null
      type: select_one
      options:
      - Minimalist / Modern
      - Bold / Colorful
      - Professional / Corporate
      - Creative / Artistic
      required: true
    - id: 10
      name: tech_reqs_header
      label: -- Technical Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: cms_pref
      label: Do you have a preferred CMS platform?
      hint: null
      type: select_one
      options:
      - WordPress
      - Shopify
      - Webflow
      - Custom Development
      - No Preference
      required: true
    - id: 12
      name: page_count_est
      label: Approximate number of pages required
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: features_select
      label: Key Features Required
      hint: Select all that apply
      type: select_multiple
      options:
      - Contact Form
      - Blog Section
      - Online Booking
      - User Accounts
      - Social Media Integration
      required: true
    - id: 14
      name: timeline_budget_header
      label: -- Timeline and Budget --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: launch_dt_target
      label: Target Launch Date
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: budget_est_val
      label: Estimated Budget for Website Project
      hint: Currency amount
      type: number
      options: []
      required: true
    - id: 17
      name: extra_notes
      label: Any other specific requirements or inspiration links?
      hint: null
      type: text
      options: []
      required: false
