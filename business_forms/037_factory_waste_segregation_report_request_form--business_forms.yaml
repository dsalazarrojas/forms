inputSchema:
  type: object
  properties:
    title: Factory Waste Segregation Report Request Form
    pages:
    - id: 1
      name: user_email
      label: User Email
      hint: null
      type: email
      options: []
      required: true
    - id: 2
      name: date
      label: Report Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: shift_start
      label: Shift Start
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: shift_end
      label: Shift End
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: machine_id
      label: Machine ID
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: waste_code
      label: Waste Code
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 7
      name: waste_type
      label: Waste Type
      hint: null
      type: select_multiple
      options:
      - Paper
      - Plastic
      - Glass
      required: true
    - id: 8
      name: remarks
      label: Remarks
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submitted_on
      label: Submitted On
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: approved_by
      label: Approved By
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: proctor
      label: Proctor
      hint: null
      type: text
      options: []
      required: false
