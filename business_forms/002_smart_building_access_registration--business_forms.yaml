inputSchema:
  type: object
  properties:
    title: Smart Building Access Registration
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: building_name
      label: Building Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: access_level
      label: Access Level
      hint: null
      type: select_one
      options:
      - Admin
      - Manager
      - Staff
      - Tenant
      required: false
    - id: 4
      name: access_type
      label: Access Type
      hint: null
      type: select_multiple
      options:
      - Door
      - Elevator
      - Security Desk
      required: false
    - id: 5
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
