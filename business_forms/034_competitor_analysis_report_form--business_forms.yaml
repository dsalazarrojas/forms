        hint: Which of their campaigns are currently most visible?
        type: text
        options: []
        required: true
      - id: 11
        name: threat_assessment_rating
        label: Current Threat Level
        hint: How much of a threat do these moves pose to us?
        type: select_one
        options:
          - High (Critical action needed)
          - Moderate (Monitor closely)
          - Low (No immediate action)
        required: true
      - id: 12
        name: identified_opportunities_report
        label: Identified Opportunities for Us
        hint: Where can we win based on their weaknesses?
        type: text
        options: []
        required: true
      - id: 13
        name: key_takeaways_summary
        label: Key Takeaways and Actions
        hint: Summary of the report for leadership
        type: text
        options: []
        required: true
      - id: 14
        name: report_submission_date_final
        label: Date of Report
        hint: Date this report was finalized
        type: date
        options: []
        required: true
