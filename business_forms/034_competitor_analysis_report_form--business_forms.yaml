inputSchema:
  type: object
  properties:
    title: Competitor Analysis Report Form
    pages:
      - id: 1
        name: report_info_header
        label: -- Competitor Analysis Internal Report --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: report_title_subject
        label: Report Title / Subject
        hint: e.g., Q1 Competitor Landscape Analysis
        type: text
        options: []
        required: true
      - id: 3
        name: analyst_name_report
        label: Prepared By
        hint: Name of the report author
        type: text
        options: []
        required: true
      - id: 4
        name: competitors_included_in_report
        label: Competitors Included in Analysis
        hint: List all companies covered in this report
        type: text
        options: []
        required: true
      - id: 5
        name: report_period_start
        label: Analysis Start Date
        hint: Beginning of the observation period
        type: date
        options: []
        required: true
      - id: 6
        name: report_period_end
        label: Analysis End Date
        hint: End of the observation period
        type: date
        options: []
        required: true
      - id: 7
        name: competitor_strategy_obs_section
        label: -- Strategic Observations --
        hint: null
        type: note
        options: []
        required: false
      - id: 8
        name: recent_product_launches_obs
        label: Recent Product or Feature Launches
        hint: Describe any new offerings from competitors
        type: text
        options: []
        required: true
      - id: 9
        name: pricing_strategy_shifts
        label: Observed Pricing or Packaging Shifts
        hint: Are they raising prices or changing tiers?
        type: text
        options: []
        required: false
      - id: 10
        name: marketing_campaign_effectiveness
