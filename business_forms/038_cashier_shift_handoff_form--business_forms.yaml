inputSchema:
  type: object
  properties:
    title: Cashier Shift Handoff Form
    pages:
    - id: 1
      name: shift_information_section
      label: -- Shift Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: handoff_date
      label: Handoff Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 3
      name: business_location
      label: Business Location
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: register_number
      label: Cash Register Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: outgoing_cashier_section
      label: -- Outgoing Cashier Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: outgoing_cashier_name
      label: Outgoing Cashier Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: shift_start_time
      label: Shift Start Time
      hint: "HH:MM AM/PM"
      type: time
      options: []
      required: true
    - id: 8
      name: shift_end_time
      label: Shift End Time
      hint: "HH:MM AM/PM"
      type: time
      options: []
      required: true
    - id: 9
      name: incoming_cashier_section
      label: -- Incoming Cashier Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: incoming_cashier_name
      label: Incoming Cashier Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: cash_count_section
      label: -- Cash Count Report --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: opening_balance
      label: Opening Balance
      hint: Cash at start of shift
      type: number
      options: []
      required: true
    - id: 13
      name: total_sales
      label: Total Sales for Shift
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: returns_refunds
      label: Returns or Refunds
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: cash_drops
      label: Cash Drops or Deposits
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: expected_closing_balance
      label: Expected Closing Balance
      hint: Calculated from transactions
      type: number
      options: []
      required: true
    - id: 17
      name: actual_cash_count_section
      label: -- Actual Cash Count --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: actual_closing_balance
      label: Actual Closing Balance
      hint: Physical count
      type: number
      options: []
      required: true
    - id: 19
      name: cash_variance
      label: Cash Variance or Discrepancy
      hint: Expected minus Actual
      type: number
      options: []
      required: true
    - id: 20
      name: variance_explanation
      label: Explanation of Any Variance
      hint: If not zero
      type: text
      options: []
      required: false
    - id: 21
      name: register_condition_section
      label: -- Register and Equipment Condition --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: register_status
      label: Cash Register Status
      hint: null
      type: select_one
      options:
      - Good Working Order
      - Needs Repair
      - Malfunctioning
      - Other Issues
      required: true
    - id: 23
      name: equipment_issues
      label: Any Equipment Issues to Report?
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: general_notes_section
      label: -- General Notes --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: shift_notes
      label: General Shift Notes or Comments
      hint: Important information for next cashier
      type: text
      options: []
      required: false
