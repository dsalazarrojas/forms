inputSchema:
  type: object
  properties:
    title: Bond Application Form
    pages:
    - id: 1
      name: application_date
      label: Application Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: defendant_full_name
      label: Defendant Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: defendant_date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: defendant_address
      label: Current Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: defendant_city_state_zip
      label: City - State - Zip
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: defendant_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: defendant_ssn
      label: Social Security Number
      hint: Last four digits acceptable
      type: text
      options: []
      required: true
    - id: 8
      name: case_number
      label: Case Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: charges
      label: Charges
      hint: Description of charges
      type: text
      options: []
      required: true
    - id: 10
      name: court_name
      label: Court Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: judge_assigned
      label: Assigned Judge
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: arrest_date
      label: Arrest Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: employment_status
      label: Current Employment Status
      hint: null
      type: select_one
      options:
      - Employed - Full Time
      - Employed - Part Time
      - Self-Employed
      - Unemployed
      - Retired
      - Student
      - Disabled
      required: true
    - id: 14
      name: employer_name
      label: Current Employer Name
      hint: If employed
      type: text
      options: []
      required: false
    - id: 15
      name: annual_income
      label: Annual Income
      hint: Approximate amount
      type: number
      options: []
      required: false
    - id: 16
      name: housing_status
      label: Housing Status
      hint: null
      type: select_one
      options:
      - Own Home
      - Rent Home
      - Live with Family
      - No Fixed Address
      - Other
      required: true
    - id: 17
      name: family_ties
      label: Family Ties in Community
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: prior_convictions
      label: Prior Criminal Convictions
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: outstanding_warrants
      label: Outstanding Warrants
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: true
    - id: 20
      name: substance_abuse_history
      label: Substance Abuse History
      hint: null
      type: select_one
      options:
      - No History
      - Past History
      - Current Use
      - In Treatment
      - Prefer Not to Answer
      required: true
    - id: 21
      name: mental_health_history
      label: Mental Health History
      hint: null
      type: select_one
      options:
      - No History
      - Past History
      - Current Treatment
      - Hospitalized
      - Prefer Not to Answer
      required: true
    - id: 22
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 23
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 24
      name: emergency_contact_relationship
      label: Relationship to Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 25
      name: applicant_acknowledgment
      label: I acknowledge the accuracy of this information
      hint: null
      type: select_one
      options:
      - I Acknowledge
      - I Do Not Acknowledge
      required: true
