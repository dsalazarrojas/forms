inputSchema:
  type: object
  properties:
    title: Architecture Design Upload Form
    pages:
    - id: 1
      name: section_submitter_info
      label: -- Submitter Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: submitter_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: submitter_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: submitter_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: firm_or_studio
      label: Firm or Studio Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_project
      label: -- Project Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: project_name
      label: Project Name
      hint: Title of the architectural project
      type: text
      options: []
      required: true
    - id: 8
      name: project_type
      label: Project Type
      hint: null
      type: select_one
      options:
      - Residential
      - Commercial
      - Institutional
      - Industrial
      - Urban planning
      - Landscape design
      - Interior design
      - Mixed-use
      required: true
    - id: 9
      name: project_location
      label: Project Location
      hint: City, region, or address
      type: text
      options: []
      required: false
    - id: 10
      name: project_description
      label: Project Description
      hint: Brief description of the project
      type: text
      options: []
      required: true
    - id: 11
      name: completion_date
      label: Project Completion Date
      hint: When was it completed?
      type: date
      options: []
      required: false
    - id: 12
      name: section_designs
      label: -- Design Files --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: design_drawings
      label: Design Drawings
      hint: CAD, PDF, or image files
      type: text
      options: []
      required: true
    - id: 14
      name: renderings
      label: 3D Renderings or Visualizations
      hint: High-quality images or videos
      type: text
      options: []
      required: false
    - id: 15
      name: floor_plans
      label: Floor Plans or Layouts
      hint: PDF or image files
      type: text
      options: []
      required: false
    - id: 16
      name: elevation_sections
      label: Elevations and Sections
      hint: Detailed building views
      type: text
      options: []
      required: false
    - id: 17
      name: section_media
      label: -- Additional Media --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: project_photos
      label: Project Photos
      hint: Construction or completed project
      type: text
      options: []
      required: false
    - id: 19
      name: site_plans
      label: Site Plans or Context
      hint: Geographic location mapping
      type: text
      options: []
      required: false
    - id: 20
      name: technical_documents
      label: Technical Documents
      hint: Specifications, reports, etc
      type: text
      options: []
      required: false
    - id: 21
      name: section_details
      label: -- Design Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: design_approach
      label: Design Approach or Concept
      hint: Explain your design philosophy
      type: text
      options: []
      required: false
    - id: 23
      name: notable_features
      label: Notable Features or Innovations
      hint: What makes this project special?
      type: text
      options: []
      required: false
    - id: 24
      name: awards_recognition
      label: Awards or Recognition
      hint: Any notable achievements
      type: text
      options: []
      required: false
