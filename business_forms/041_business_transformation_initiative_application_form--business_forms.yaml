inputSchema:
  type: object
  properties:
    title: Business Transformation Initiative Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant Name
      hint: Full name of person submitting
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_role
      label: Your Role or Title
      hint: Your position in the organization
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 4
      name: company_email
      label: Contact Email
      hint: Business email address
      type: email
      options: []
      required: true
    - id: 5
      name: company_phone
      label: Contact Phone
      hint: Business phone number
      type: text
      options: []
      required: true
    - id: 6
      name: submission_date
      label: Application Submission Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 7
      name: initiative_title
      label: Initiative Title
      hint: Name of the transformation initiative
      type: text
      options: []
      required: true
    - id: 8
      name: initiative_description
      label: Initiative Description
      hint: Detailed description of the proposal
      type: text
      options: []
      required: true
    - id: 9
      name: business_area
      label: Business Area Being Transformed
      hint: Which area of the business
      type: select_one
      options:
      - Operations
      - Technology
      - Sales and Marketing
      - Customer Service
      - Finance
      - Human Resources
      - Supply Chain
      - Multiple Areas
      - Other
      required: true
    - id: 10
      name: transformation_scope
      label: Scope of Transformation
      hint: How comprehensive is this
      type: select_one
      options:
      - Enterprise-wide
      - Department-wide
      - Process-specific
      - Pilot Program
      - Other
      required: true
    - id: 11
      name: current_state
      label: Current State Assessment
      hint: Describe the current situation
      type: text
      options: []
      required: true
    - id: 12
      name: desired_future_state
      label: Desired Future State
      hint: What is the goal
      type: text
      options: []
      required: true
    - id: 13
      name: business_objectives
      label: Business Objectives
      hint: What you want to achieve
      type: text
      options: []
      required: true
    - id: 14
      name: success_metrics
      label: Success Metrics
      hint: How will you measure success
      type: text
      options: []
      required: true
    - id: 15
      name: timeline
      label: Proposed Timeline
      hint: Start date, phases, completion date
      type: text
      options: []
      required: true
    - id: 16
      name: budget_required
      label: Budget Required
      hint: Total investment needed
      type: number
      options: []
      required: true
    - id: 17
      name: resource_requirements
      label: Resource Requirements
      hint: People, technology, or assets needed
      type: text
      options: []
      required: true
    - id: 18
      name: risks_identified
      label: Risks and Mitigation Strategies
      hint: Potential challenges and how to address them
      type: text
      options: []
      required: false
    - id: 19
      name: expected_benefits
      label: Expected Benefits
      hint: Business benefits and outcomes
      type: text
      options: []
      required: true
    - id: 20
      name: approval_recommendation
      label: Internal Recommendation
      hint: Do you recommend this initiative
      type: select_one
      options:
      - Strongly Recommend
      - Recommend
      - Neutral
      - Do Not Recommend
      required: false
