inputSchema:
  type: object
  properties:
    title: Co Working Station Reassignment Request Form
    pages:
      - id: 1
        name: section_requestor
        label: -- Requestor Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: full_name
        label: Full Name
        hint: Enter your legal first and last name
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email Address
        hint: Work email address preferred
        type: email
        options: []
        required: true
      - id: 4
        name: department
        label: Department
        hint: Select your primary department
        type: select_one
        options: [Operations, Marketing, Sales, Engineering, Finance, HR]
        required: true
      - id: 5
        name: current_station_id
        label: Current Station ID
        hint: Located on the corner of your desk
        type: text
        options: []
        required: true
      - id: 6
        name: section_details
        label: -- Reassignment Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: requested_date
        label: Requested Reassignment Date
        hint: When would you like the change to take effect?
        type: date
        options: []
        required: true
      - id: 8
        name: reason_for_request
        label: Reason for Request
        hint: Primary reason for moving
        type: select_one
        options: [Space requirements, Team proximity, Equipment needs, Noise levels, Other]
        required: true
      - id: 9
        name: additional_details
        label: Additional Details
        hint: Please provide more context for your request
        type: text
        options: []
        required: false
      - id: 10
        name: preferred_area
        label: Preferred Station or Area
        hint: Specify a zone or specific station ID if known
        type: text
        options: []
        required: false
      - id: 11
        name: manager_name
        label: Manager Approval Name
        hint: Name of the person who approved this move
        type: text
        options: []
        required: true
      - id: 12
        name: approval_status
        label: Approval Status
        hint: Internal use only
        type: select_one
        options: [Pending, Approved, Denied, Waitlisted]
        required: false
