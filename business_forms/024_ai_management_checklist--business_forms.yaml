        value: security_scan
      - label: "'Human-in-the-loop' intervention points defined."
        value: hitl
      - label: Fallback / Disaster recovery plan established.
        value: disaster_recovery
      - label: Insurance / Liability coverage reviewed.
        value: liability
      required: true
    - id: 13
      name: performance_monitoring_header
