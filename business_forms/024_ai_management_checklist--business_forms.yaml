inputSchema:
  type: object
  properties:
    title: AI Management Checklist
    pages:
    - id: 1
      name: audit_details_header
      label: '--- Audit and Initiative Details ---'
      hint: Standard identifiers for the AI project management audit.
      type: note
      options: []
      required: false
    - id: 2
      name: project_manager_name
      label: Responsible Manager
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: ai_initiative_name
      label: AI Initiative / Project Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: audit_date
      label: Date of Assessment
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: strategy_checklist_header
      label: '--- 1. Strategic Alignment & Planning ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: strategic_items
      label: Planning Checklist
      hint: Check all that have been completed.
      type: select_multiple
      options:
      - Business objectives are clearly defined and measurable.
      - All key stakeholders have been identified and aligned.
      - Resource requirements (budget, staff, infra) are secured.
      - Buy-vs-Build analysis has been completed.
      required: true
    - id: 7
      name: technical_readiness_header
      label: '--- 2. Technical & Data Readiness ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: technical_items
      label: Technical Checklist
      hint: null
      type: select_multiple
      options:
      - Training data quality and volume have been verified.
      - Model scalability and performance requirements defined.
      - Integration with existing tech stack is planned.
      - Technical debt and maintenance costs estimated.
      required: true
    - id: 9
      name: governance_ethics_header
      label: '--- 3. Governance, Ethics & Compliance ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: governance_items
      label: Compliance Checklist
      hint: null
      type: select_multiple
      options:
      - GDPR / PII / Data Privacy review is complete.
      - Initial algorithmic bias assessment conducted.
      - Model explainability and transparency documented.
      - Ethical impact on end-users has been assessed.
      required: true
    - id: 11
      name: risk_security_header
      label: '--- 4. Risk & Security ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: risk_items
      label: Risk Management Checklist
      hint: null
      type: select_multiple
      options:
      - Adversarial attack vulnerability scan conducted.
      - '''Human-in-the-loop'' intervention points defined.'
      - Fallback / Disaster recovery plan established.
      - Insurance / Liability coverage reviewed.
      required: true
    - id: 13
      name: performance_monitoring_header
      label: '--- 5. Monitoring & Performance ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: monitoring_items
      label: Monitoring Checklist
      hint: null
      type: select_multiple
      options:
      - Real-time drift detection tools implemented.
      - KPI dashboards for business impact ready.
      - Periodic retraining schedule established.
      required: true
    - id: 15
      name: final_assessment_note
      label: '--- Final Assessment ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: management_approval_status
      label: Initiative Approval Status
      hint: null
      type: select_one
      options:
      - Ready for Deployment (All checks green)
      - Conditional Approval (Minor items pending)
      - Hold / Needs Revision (Critical gaps)
      required: true
    - id: 17
      name: critical_gaps_description
      label: Description of Critical Gaps (if any)
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: next_audit_date
      label: Next Scheduled Management Review
      hint: null
      type: date
      options: []
      required: true
    - id: 19
      name: notification_email
      label: Manager Email for Confirmation
      hint: null
      type: email
      options: []
      required: true
