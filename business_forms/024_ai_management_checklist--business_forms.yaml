      options:
      - label: Training data quality and volume have been verified.
        value: data_quality
      - label: Model scalability and performance requirements defined.
        value: scalability
      - label: Integration with existing tech stack is planned.
        value: integration
      - label: Technical debt and maintenance costs estimated.
        value: tech_debt
      required: true
