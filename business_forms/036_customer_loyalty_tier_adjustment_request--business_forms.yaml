      - 5 - Tier 5
      - 6 - Tier 6
      - 7 - Tier 7
      - 8 - Tier 8
      required: false
    - id: 9
      name: current_tier
      label: Current Tier
      hint: null
      type: select_one
      options:
      - 1 - Tier 1
      - 2 - Tier 2
      - 3 - Tier 3
      - 4 - Tier 4
      - 5 - Tier 5
      - 6 - Tier 6
      - 7 - Tier 7
      - 8 - Tier 8
      required: false
    - id: 10
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: employee_number
      label: Employee Number
      hint: null
      type: number
      options: []
      required: false
