inputSchema:
  type: object
  properties:
    title: Customer Loyalty Tier Adjustment Request
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: reason_for_request
      label: Reason for request
      hint: null
      type: select_multiple
      options:
      - Tier Downgrade
      - Tier Upgrade
      - Tier Swap
      required: false
    - id: 6
      name: loyalty_program
      label: Loyalty program
