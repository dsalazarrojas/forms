inputSchema:
  type: object
  properties:
    title: Agency Request Form
    pages:
    - id: 1
      name: header
      label: -- PR and Marketing Agency Request --
      hint: Submit your request to begin a collaboration with our agency
      type: note
      options: []
      required: false
    - id: 2
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Primary Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: business_email
      label: Business Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: service_requested
      label: Type of service requested - PR, SEO, Content Marketing, Social Media
      hint: select the primary service area
      type: select_one
      options:
      - Public Relations (PR)
      - Search Engine Optimization (SEO)
      - Content Marketing
      - Social Media Management
      - Paid Advertising (PPC)
      required: true
    - id: 6
      name: scope_header
      label: -- Project Scope --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: business_goals
      label: Current business goals and objectives
      hint: what are you trying to achieve
      type: text
      options: []
      required: true
    - id: 8
      name: target_audience
      label: Target Audience
      hint: who are your primary customers
      type: select_one
      options:
      - B2B (Business to Business)
      - B2C (Business to Consumer)
      - Non-Profit
      - Government / Public Sector
      required: true
    - id: 9
      name: monthly_budget
      label: Estimated Monthly Budget
      hint: choose your budget range
      type: select_one
      options:
      - Under $2,000
      - $2,000 - $5,000
      - $5,000 - $10,000
      - $10,000+
      required: true
    - id: 10
      name: key_competitors
      label: Key competitors in your industry
      hint: who else is in your market
      type: text
      options: []
      required: false
    - id: 11
      name: start_date
      label: Proposed Project Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: referral_source
      label: How did you hear about our agency?
      hint: null
      type: text
      options: []
      required: false
