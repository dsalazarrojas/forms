inputSchema:
  type: object
  properties:
    title: Content Background Assessment
    pages:
    - id: 1
      name: section_project_info
      label: -- Project Details --
      hint: Please complete this assessment for each content project.
      type: note
      options: []
      required: false
    - id: 2
      name: project_title
      label: Content Project Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: project_id
      label: Content Project Identification Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: section_content_needs
      label: -- Content Needs and Preferences --
      hint: Please share your content needs and preferences for this project.
      type: note
      options: []
      required: false
    - id: 5
      name: target_audience_description
      label: Description of the Target Audience
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: content_goals
      label: Primary Goals for the Content
      hint: Select all that apply
      type: select_multiple
      options:
      - Awareness
      - Education
      - Conversion
      - Retention
      - Engagement
      - Other
      required: true
    - id: 7
      name: brand_voice_preference
      label: Preferred Brand Voice
      hint: null
      type: select_one
      options:
      - Professional
      - Casual
      - Innovative
      - Traditional
      - Authoritative
      - Other
      required: true
    - id: 8
      name: preferred_content_format
      label: Preferred Content Format
      hint: null
      type: select_one
      options:
      - Blog Post
      - Video
      - Infographic
      - White Paper
      - Ebook
      - Podcast
      - Other
      required: true
    - id: 9
      name: key_messaging_points
      label: Key Messaging Points to Include
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: section_budget_timeline
      label: -- Budget and Timeline --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: estimated_budget
      label: Estimated Budget for the Project
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: project_deadline
      label: Requested Project Deadline
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: assessment_completed
      label: Assessment Completed?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: additional_comments
      label: Any additional details or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: signature_confirmation
      label: I confirm that the information provided is accurate
      hint: null
      type: select_one
      options:
      - I Agree
      - I Disagree
      required: true
