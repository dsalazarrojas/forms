inputSchema:
  type: object
  properties:
    title: Add A New Product
    pages:
    - id: 1
      name: product_identity_header
      label: -- Product Identity --
      hint: Basic details for the new catalog entry
      type: note
      options: []
      required: false
    - id: 2
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: sku_number
      label: SKU / Stock Keeping Unit
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: product_category
      label: Product Category
      hint: null
      type: select_one
      options:
      - Electronics
      - Home and Living
      - Apparel and Accessories
      - Health and Beauty
      - Toys and Games
      - Books and Media
      - Other
      required: true
    - id: 5
      name: product_brand
      label: Brand / Manufacturer
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: product_description
      label: Product Description
      hint: Provide a detailed description for the website listing
      type: text
      options: []
      required: true
    - id: 7
      name: pricing_inventory_header
      label: -- Pricing and Inventory --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: cost_price
      label: Cost Price (Internal)
      hint: What we pay for the item
      type: number
      options: []
      required: true
    - id: 9
      name: retail_price
      label: Retail Price (MSRP)
      hint: Price shown to customers
      type: number
      options: []
      required: true
    - id: 10
      name: wholesale_price
      label: Wholesale Price
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 11
      name: initial_stock_level
      label: Initial Stock Level
      hint: Current units in hand
      type: number
      options: []
      required: true
    - id: 12
      name: reorder_point
      label: Reorder Threshold
      hint: Minimum stock level to trigger alert
      type: number
      options: []
      required: true
    - id: 13
      name: dimensions_shipping_header
      label: -- Dimensions and Shipping --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: product_weight
      label: Product Weight (kg/lb)
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: package_dimensions
      label: Package Dimensions (L x W x H)
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: shipping_class
      label: Shipping Class
      hint: null
      type: select_one
      options:
      - Standard Shipping
      - Bulky / Oversized
      - Fragile / Special Handling
      - Digital Delivery
      required: true
    - id: 17
      name: image_status
      label: Product Image Status
      hint: null
      type: select_one
      options:
      - High-res images uploaded
      - Photography scheduled
      - Using manufacturer stock images
      required: true
    - id: 18
      name: launch_date
      label: Target Launch Date
      hint: null
      type: date
      options: []
      required: true
    - id: 19
      name: added_by_user
      label: Added By (User Name)
      hint: null
      type: text
      options: []
      required: true
