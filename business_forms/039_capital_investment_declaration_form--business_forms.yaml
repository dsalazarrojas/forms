inputSchema:
  type: object
  properties:
    title: Capital Investment Declaration Form
    pages:
    - id: 1
      name: intro_header
      label: -- Capital Investment Declaration Form --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_text
      label: Declare your capital investments for financial assessment and compliance
        purposes.
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: declarant_info_header
      label: -- Declarant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 5
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 6
      name: tax_id
      label: Tax ID or SSN
      hint: Tax identification number
      type: text
      options: []
      required: true
    - id: 7
      name: entity_type
      label: Entity Type
      hint: Select one
      type: select_one
      options:
      - Individual
      - Partnership
      - Corporation
      - LLC
      - Trust
      - Other
      required: true
    - id: 8
      name: email_address
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 10
      name: declaration_date
      label: Declaration Date
      hint: Date of declaration
      type: date
      options: []
      required: true
    - id: 11
      name: tax_year
      label: Tax Year
      hint: Year for declaration
      type: text
      options: []
      required: true
    - id: 12
      name: business_address
      label: Business Address
      hint: Your address
      type: text
      options: []
      required: true
    - id: 13
      name: investment_summary_header
      label: -- Investment Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: total_investments
      label: Total Capital Investments
      hint: Total dollar amount
      type: number
      options: []
      required: true
    - id: 15
      name: number_of_investments
      label: Number of Individual Investments
      hint: Count of investments
      type: number
      options: []
      required: true
    - id: 16
      name: investment_period_header
      label: -- Investment Period --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: investment_start_date
      label: Investment Period Start
      hint: When investments began
      type: date
      options: []
      required: true
    - id: 18
      name: investment_end_date
      label: Investment Period End
      hint: When reporting period ends
      type: date
      options: []
      required: true
    - id: 19
      name: investment_details_header
      label: -- Investment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: investment_1_type
      label: Investment 1 - Type
      hint: Select type
      type: select_one
      options:
      - Stock
      - Bond
      - Real Estate
      - Business Interest
      - Cryptocurrency
      - Mutual Fund
      - Other
      required: false
    - id: 21
      name: investment_1_description
      label: Investment 1 - Description
      hint: Describe the investment
      type: text
      options: []
      required: false
    - id: 22
      name: investment_1_amount
      label: Investment 1 - Amount
      hint: Dollar amount invested
      type: number
      options: []
      required: false
    - id: 23
      name: investment_1_date
      label: Investment 1 - Date
      hint: When investment was made
      type: date
      options: []
      required: false
    - id: 24
      name: investment_2_type
      label: Investment 2 - Type
      hint: Select type
      type: select_one
      options:
      - Stock
      - Bond
      - Real Estate
      - Business Interest
      - Cryptocurrency
      - Mutual Fund
      - Other
      required: false
    - id: 25
      name: investment_2_description
      label: Investment 2 - Description
      hint: Describe the investment
      type: text
      options: []
      required: false
    - id: 26
      name: investment_2_amount
      label: Investment 2 - Amount
      hint: Dollar amount invested
      type: number
      options: []
      required: false
    - id: 27
      name: investment_2_date
      label: Investment 2 - Date
      hint: When investment was made
      type: date
      options: []
      required: false
    - id: 28
      name: source_of_funds_header
      label: -- Source of Funds --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: funds_source
      label: Source of Investment Funds
      hint: Select all that apply
      type: select_multiple
      options:
      - Personal savings
      - Business income
      - Loan
      - Inheritance
      - Gift
      - Refinancing
      - Other
      required: true
    - id: 30
      name: foreign_investment
      label: Any Foreign Investments?
      hint: Select one
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 31
      name: foreign_details
      label: Foreign Investment Details
      hint: If yes, provide details
      type: text
      options: []
      required: false
    - id: 32
      name: returns_header
      label: -- Investment Returns --
      hint: null
      type: note
      options: []
      required: false
    - id: 33
      name: total_returns
      label: Total Investment Returns
      hint: Dividends, interest, gains
      type: number
      options: []
      required: false
    - id: 34
      name: return_type
      label: Type of Returns
      hint: Select all that apply
      type: select_multiple
      options:
      - Dividends
      - Interest
      - Capital gains
      - Rental income
      - Other
      - No returns
      required: false
    - id: 35
      name: financial_impact_header
      label: -- Financial Impact --
      hint: null
      type: note
      options: []
      required: false
    - id: 36
      name: impact_on_business
      label: Impact on Business Operations
      hint: Describe impact
      type: text
      options: []
      required: false
    - id: 37
      name: risk_assessment
      label: Risk Assessment
      hint: Select one
      type: select_one
      options:
      - Low risk
      - Moderate risk
      - High risk
      - Very high risk
      required: false
    - id: 38
      name: confirmation
      label: I certify that all information is accurate and complete
      hint: Required
      type: select_one
      options:
      - Yes, I confirm
      - 'No'
      required: true
