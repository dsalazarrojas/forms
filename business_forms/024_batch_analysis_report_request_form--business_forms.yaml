        options:
          - Standard (5-7 Business Days)
          - Expedited (2-3 Business Days)
          - Urgent (24 Hours - Surcharge Applies)
        required: true
      - id: 12
        name: sample_quantity_submitted
        label: Sample Quantity and Units
        hint: e.g. 500ml, 1kg, 10 units
        type: text
        options: []
        required: true
      - id: 13
        name: safety_handling_notes
        label: Special Handling or Safety Instructions
        hint: e.g. Biohazard, Flammable, Keep Chilled
        type: text
        options: []
