      - id: 2
        name: requestor_full_name
        label: Requestor Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: department_name
        label: Department or Division
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: contact_email
        label: Contact Email
        hint: For delivery of report
        type: email
        options: []
        required: true
      - id: 5
        name: batch_details_header
        label: -- Batch Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: batch_id_number
        label: Batch ID or Lot Number
        hint: null
        type: text
        options: []
        required: true
      - id: 7
        name: product_name
        label: Product or Sample Name
        hint: null
        type: text
        options: []
        required: true
      - id: 8
        name: manufacturing_date
        label: Date of Manufacture
        hint: null
        type: date
        options: []
        required: true
      - id: 9
        name: analysis_params_header
        label: -- Analysis Parameters --
        hint: null
        type: note
        options: []
        required: false
      - id: 10
        name: analysis_type_requested
        label: Type of Analysis Requested
        hint: Select all that apply
        type: select_multiple
        options:
