      name: door_locks_status
      label: Are all door locks functioning properly
      hint: null
      type: select_one
      options:
        - Yes - all operational
        - No - issues found
        - Partially - some issues
      required: true
    - id: 10
      name: door_lock_notes
      label: Notes on door lock issues (if any)
      hint: null
      type: text
      options: []
      required: false
