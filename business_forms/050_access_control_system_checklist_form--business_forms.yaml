      name: issues_found
      label: Summary of all issues found during inspection
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: corrective_actions_taken
      label: Corrective actions taken on site
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: maintenance_required
      label: Is maintenance or repair needed for any systems
      hint: null
      type: select_one
      options:
        - Yes - urgent
        - Yes - can be scheduled
        - No - all systems are fine
      required: true
    - id: 24
      name: overall_system_rating
      label: Overall access control system condition
      hint: null
      type: select_one
      options:
        - Excellent
        - Good
        - Satisfactory
        - Needs attention
        - Critical - immediate action required
      required: true
    - id: 25
      name: inspection_complete_date
      label: Date inspection was completed
      hint: null
      type: date
      options: []
      required: true
