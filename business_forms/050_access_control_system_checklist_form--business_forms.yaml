      name: electronic_access_section
      label: -- Electronic Access Systems --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: card_readers_status
      label: Card readers and badge scanners status
      hint: null
      type: select_one
      options:
        - All operational
        - Some not working
        - None working
        - Not applicable
      required: true
    - id: 13
      name: biometric_scanners_status
      label: Biometric scanners status (fingerprint, facial recognition)
      hint: null
      type: select_one
      options:
        - All operational
        - Some not working
        - None working
        - Not applicable
      required: true
    - id: 14
      name: keypad_status
      label: Keypads and PIN entry systems status
      hint: null
      type: select_one
      options:
        - All operational
        - Some not working
        - None working
        - Not applicable
      required: true
    - id: 15
      name: alarms_section
      label: -- Alarm Systems --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: intrusion_alarm_status
      label: Intrusion alarm system status
      hint: null
      type: select_one
      options:
        - Operational and armed
        - Operational but disarmed
        - Malfunctioning
        - Not applicable
      required: true
    - id: 17
      name: fire_alarm_status
      label: Fire alarm system status
      hint: null
      type: select_one
      options:
        - Operational
        - Needs maintenance
        - Malfunctioning
        - Not applicable
      required: true
    - id: 18
      name: surveillance_section
      label: -- Surveillance Systems --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: cctv_status
      label: CCTV cameras status
      hint: null
      type: select_one
      options:
        - All cameras operational
        - Some cameras offline
        - All cameras offline
        - Not applicable
      required: true
    - id: 20
      name: recording_system_status
