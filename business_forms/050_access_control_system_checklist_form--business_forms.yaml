inputSchema:
  type: object
  properties:
    title: Access Control System Checklist Form
    pages:
    - id: 1
      name: form_header
      label: -- Access Control System Checklist Form --
      hint: Complete this checklist to document the status of all access control components during your inspection.
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_name
      label: Inspector or technician name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: inspector_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: inspector_id
      label: Employee or badge ID
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: inspection_date
      label: Date of inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: inspection_time
      label: Time of inspection
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: facility_name
      label: Facility or building name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: locks_section
      label: -- Physical Locks and Doors --
      hint: null
      type: note
      options: []
      required: false
