inputSchema:
  type: object
  properties:
    title: COVID 19 Daily Wellness Assessment
    pages:
    - id: 1
      name: header
      label: -- Daily Wellness Check --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: participant_id
      label: Participant ID
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: location_section
      label: -- Location Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: location_type
      label: Current Location
      hint: null
      type: select_one
      options:
      - Home
      - Work
      - School
      - Community Space
      - Healthcare Facility
      - Other
      required: true
    - id: 7
      name: occupancy
      label: Number of people in close proximity
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: physical_health
      label: -- Physical Health --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: overall_health
      label: Overall health status today
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: energy_level
      label: Energy level
      hint: Rate 1-10
      type: number
      options: []
      required: true
    - id: 11
      name: sleep_quality
      label: Sleep quality last night
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - No Sleep
      required: true
    - id: 12
      name: appetite
      label: Appetite level
      hint: null
      type: select_one
      options:
      - Normal
      - Decreased
      - Increased
      - No Appetite
      required: true
    - id: 13
      name: symptom_section
      label: -- Symptom Review --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: symptoms_present
      label: Any COVID-19 symptoms today
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: current_symptoms
      label: Current symptoms
      hint: Select all that apply
      type: select_multiple
      options:
      - Fever
      - Cough
      - Fatigue
      - Headache
      - Loss of Taste or Smell
      - Difficulty Breathing
      - Other
      required: false
    - id: 16
      name: mental_health
      label: -- Mental Wellness --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: mood
      label: Current mood
      hint: null
      type: select_one
      options:
      - Happy
      - Neutral
      - Anxious
      - Sad
      - Stressed
      required: true
    - id: 18
      name: stress_level
      label: Stress level today
      hint: Rate 1-10
      type: number
      options: []
      required: true
    - id: 19
      name: isolation_impact
      label: Feeling isolated
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Somewhat
      required: true
    - id: 20
      name: additional_notes
      label: Additional wellness notes
      hint: null
      type: text
      options: []
      required: false
