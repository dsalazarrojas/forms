inputSchema:
  type: object
  properties:
    title: Coaching Feedback Form
    pages:
      - id: 1
        name: section_client_info
        label: -- Client Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: client_name
        label: Your Name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email Address
        hint: For follow-up communication
        type: email
        options: []
        required: true
      - id: 4
        name: coaching_program
        label: Coaching Program
        hint: Which program or service are you giving feedback for
        type: select_one
        options:
          - Personal Training
          - Nutrition Coaching
          - Performance Coaching
          - Wellness Coaching
          - Group Classes
        required: true
      - id: 5
        name: coaching_duration
        label: How long have you been coached by us
        hint: Approximate duration
        type: select_one
        options:
          - Less than 1 month
          - 1-3 months
          - 3-6 months
          - 6-12 months
          - More than 1 year
        required: true
      - id: 6
        name: section_progress
        label: -- Progress and Results --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: goal_progress
        label: Progress toward your goals
        hint: Rate your progress from 1 - no progress to 5 - excellent progress
        type: select_one
        options:
          - "1 - No progress"
          - "2 - Minimal progress"
          - "3 - Moderate progress"
          - "4 - Good progress"
          - "5 - Excellent progress"
        required: true
      - id: 8
        name: results_achieved
        label: Measurable results achieved
        hint: What specific improvements have you noticed
        type: text
        options: []
        required: false
      - id: 9
        name: section_coaching_quality
        label: -- Coaching Quality --
        hint: null
        type: note
        options: []
        required: false
      - id: 10
        name: personalization
        label: Was your coaching personalized to your needs
        hint: Rate from 1 - generic to 5 - highly personalized
        type: select_one
        options:
          - "1 - Generic approach"
          - "2 - Somewhat personalized"
          - "3 - Moderate personalization"
          - "4 - Very personalized"
          - "5 - Highly personalized"
        required: true
      - id: 11
        name: coach_support
        label: Level of Support from Coach
        hint: How supportive and motivating was your coach
        type: select_one
        options:
          - "1 - Unsupportive"
          - "2 - Minimally supportive"
          - "3 - Adequately supportive"
          - "4 - Very supportive"
          - "5 - Exceptionally supportive"
        required: true
      - id: 12
        name: session_frequency
        label: Session frequency met your needs
        hint: Were sessions scheduled appropriately
        type: select_one
        options:
          - Too frequent
          - Slightly too frequent
          - Just right
          - Could be more frequent
          - Much more frequent needed
        required: false
      - id: 13
        name: section_expertise
        label: -- Coach Expertise --
        hint: null
        type: note
        options: []
        required: false
      - id: 14
        name: expert_knowledge
        label: Coach expertise in their field
        hint: Rate the coach's professional knowledge
        type: select_one
        options:
          - "1 - Lacking"
          - "2 - Fair"
          - "3 - Good"
          - "4 - Strong"
          - "5 - Expert level"
        required: true
      - id: 15
        name: technique_instruction
        label: Quality of technique and instruction
        hint: How well did coach teach proper form and technique
        type: select_one
        options:
          - "1 - Poor"
          - "2 - Fair"
          - "3 - Good"
          - "4 - Very Good"
          - "5 - Excellent"
        required: true
      - id: 16
        name: section_recommendations
        label: -- Recommendations --
        hint: null
        type: note
        options: []
        required: false
      - id: 17
        name: recommend_to_others
        label: Would you recommend our coaching to others
        hint: null
        type: select_one
        options:
          - "Yes, highly recommend"
          - "Yes, I would recommend"
          - "Neutral"
          - "No, would not recommend"
          - "No, would not recommend at all"
        required: true
      - id: 18
        name: continue_coaching
        label: Will you continue coaching with us
        hint: null
        type: select_one
        options:
          - "Definitely yes"
          - "Probably yes"
          - "Unsure"
          - "Probably no"
          - "Definitely no"
        required: true
      - id: 19
        name: feedback_comments
        label: Additional feedback or suggestions
        hint: Any other comments about your coaching experience
        type: text
        options: []
        required: false
