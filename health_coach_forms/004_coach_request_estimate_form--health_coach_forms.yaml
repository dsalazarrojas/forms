inputSchema:
  type: object
  properties:
    title: Coach Request Estimate Form
    pages:
    - id: 1
      name: section_client_info
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: Full name of the person requesting the coach
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company or Organization Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_request_details
      label: -- Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: coach_type
      label: Type of Coach Needed
      hint: null
      type: select_one
      options:
      - Health and Wellness Coach
      - Life Coach
      - Executive Coach
      - Career Coach
      - Sports Coach
      - Business Coach
      required: true
    - id: 8
      name: coaching_hours
      label: Number of Coaching Hours
      hint: Estimated total hours needed
      type: number
      options: []
      required: true
    - id: 9
      name: coaching_duration
      label: Coaching Duration
      hint: Total timeframe for coaching engagement
      type: select_one
      options:
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - Ongoing
      required: true
    - id: 10
      name: start_date
      label: Desired Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: coaching_focus
      label: Focus Areas for Coaching
      hint: Select all that apply
      type: select_multiple
      options:
      - Performance improvement
      - Leadership development
      - Communication skills
      - Goal setting
      - Conflict resolution
      - Professional growth
      - Work-life balance
      required: true
    - id: 12
      name: section_preferences
      label: -- Coaching Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: delivery_method
      label: Preferred Delivery Method
      hint: null
      type: select_one
      options:
      - In-person
      - Virtual
      - Hybrid
      required: true
    - id: 14
      name: session_frequency
      label: Preferred Session Frequency
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-weekly
      - Monthly
      - As needed
      required: true
    - id: 15
      name: session_duration
      label: Preferred Session Duration
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 1 hour
      - 90 minutes
      - 2 hours
      required: true
    - id: 16
      name: section_budget
      label: -- Budget Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: budget_range
      label: Budget Range
      hint: null
      type: select_one
      options:
      - Under 1000
      - 1000-5000
      - 5000-10000
      - 10000-25000
      - 25000+
      required: false
    - id: 18
      name: additional_notes
      label: Additional Notes or Requirements
      hint: Any special requirements or preferences
      type: text
      options: []
      required: false
