inputSchema:
  type: object
  properties:
    title: Ob Gyn Patient History Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - None
      - Asthma
      - Diabetes
      - Epilepsy
      - Hypertension
      required: false
    - id: 3
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medications
      label: Medications
      hint: null
      type: select_one
      options:
      - None
      - Antihistamine
      - Blood Thinners
      - Insulins
      required: false
    - id: 5
      name: medical_history2
      label: Medical History 2
      hint: null
      type: text
      options: []
      required: false
