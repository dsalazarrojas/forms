inputSchema:
  type: object
  properties:
    title: diet_consultation_appointment_form
    pages:
    - id: 1
      name: user_information
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: appointment_details
      label: Consultation Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: availability
      label: Availability
      hint: Select your availability for the consultation
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: false
    - id: 5
      name: appointment_start_time
      label: Start Time
      hint: null
      type: select_one
      options:
      - 9:00 AM
      - 10:00 AM
      - 11:00 AM
      - 1:00 PM
      - 2:00 PM
      - 3:00 PM
      required: false
    - id: 6
      name: consultation_duration
      label: Consultation Duration
      hint: Select how long the consultation will last
      type: select_one
      options:
      - 15 minutes
      - 30 minutes
      - 45 minutes
      - 60 minutes
      required: false
    - id: 7
      name: additional_info
      label: Additional Information
      hint: Please enter any additional information
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: assigned_user
      label: Assigned User
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: assigned_time
      label: Assigned Time
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
