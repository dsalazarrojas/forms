inputSchema:
  type: object
  properties:
    title: Nutrition Coaching Intake Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_conditions
      label: Medical Conditions
      hint: List any medical conditions you are aware of that could affect the treatment
        of your nutrition program.
      type: select_multiple
      options:
      - Diabetes
      - Hypertension
      - Heart Disease
      - High Cholesterol
      - High Blood Pressure
      - Sleep Apnea
      - Pregnancy
      required: false
    - id: 4
      name: medical_procedures
      label: Medical Procedures
      hint: List any past surgeries, hospitalizations or medical procedures.
      type: text
      options: []
      required: false
    - id: 5
