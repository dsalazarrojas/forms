inputSchema:
  type: object
  properties:
    title: Wellness Survey
    pages:
    - id: 1
      name: patient_info
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: physical_activity
      label: Physical Activity Level
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Sedentary''}'
      - '{''id'': 2, ''label'': ''Light''}'
      - '{''id'': 3, ''label'': ''Moderate''}'
      - '{''id'': 4, ''label'': ''High''}'
      - '{''id'': 5, ''label'': ''Very High''}'
      required: false
    - id: 3
      name: medical_history
      label: Medical History
      hint: List any medical conditions you have or had in the past.
      type: text
      options: []
      required: false
    - id: 4
      name: mental_status
      label: Mental Status
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Good''}'
      - '{''id'': 2, ''label'': ''Fair''}'
      - '{''id'': 3, ''label'': ''Bad''}'
      - '{''id'': 4, ''label'': ''Very Bad''}'
      required: false
    - id: 5
      name: sleep_quality
      label: Sleep Quality
      hint: How would you rate your sleep quality?
      type: number
      options: []
      required: false
    - id: 6
      name: exercise_frequency
      label: Exercise Frequency
      hint: How often do you exercise?
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''Never''}'
      - '{''id'': 2, ''label'': ''Rarely''}'
      - '{''id'': 3, ''label'': ''Occasionally''}'
      - '{''id'': 4, ''label'': ''Often''}'
      - '{''id'': 5, ''label'': ''Very Often''}'
      required: false
    - id: 7
      name: nutrition_info
      label: Nutrition Information
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Poor''}'
      - '{''id'': 2, ''label'': ''Fair''}'
      - '{''id'': 3, ''label'': ''Good''}'
      - '{''id'': 4, ''label'': ''Very Good''}'
      required: false
    - id: 8
      name: health_insurance
      label: Health Insurance
      hint: Do you have any health insurance?
      type: select_one
      options:
      - '{''id'': 1, ''label'': True}'
      - '{''id'': 2, ''label'': False}'
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency Contact
      hint: Name and phone number of emergency contact person
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_phone
      label: Emergency Contact Phone Number
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''Landline''}'
      - '{''id'': 2, ''label'': ''Cellphone''}'
      - '{''id'': 3, ''label'': ''Other''}'
      required: false
