inputSchema:
  type: object
  properties:
    title: COVID 19 Out Of State Travel Screening Form
    pages:
    - id: 1
      name: section_traveler_info
      label: -- Traveler Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: traveler_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: traveler_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: traveler_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: home_state
      label: Home State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_travel_details
      label: -- Travel Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: travel_destination
      label: Destination State
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: travel_purpose
      label: Purpose of Travel
      hint: null
      type: select_one
      options:
      - Business
      - Family visit
      - Vacation
      - Medical appointment
      - Essential work
      - Other
      required: true
    - id: 10
      name: departure_date
      label: Departure Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: return_date
      label: Expected Return Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: travel_mode
      label: Method of Travel
      hint: null
      type: select_multiple
      options:
      - Personal vehicle
      - Commercial flight
      - Train
      - Bus
      - Other
      required: true
    - id: 13
      name: section_health_assessment
      label: -- Health Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: current_symptoms
      label: Do you currently have any COVID-19 symptoms?
      hint: null
      type: select_one
      options:
      - false
      - true
      required: true
    - id: 15
      name: symptom_details
      label: If yes, describe symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: fever
      label: Do you have a fever?
      hint: null
      type: select_one
      options:
      - false
      - true
      - Do not know
      required: true
    - id: 17
      name: cough_shortness_breath
      label: Do you have a cough or shortness of breath?
      hint: null
      type: select_one
      options:
      - false
      - true
      required: true
    - id: 18
      name: close_contact
      label: Have you had close contact with a confirmed COVID-19 case in the past
        14 days?
      hint: null
      type: select_one
      options:
      - false
      - true
      - Unsure
      required: true
    - id: 19
      name: diagnosed_covid
      label: Have you been diagnosed with COVID-19 in the past 14 days?
      hint: null
      type: select_one
      options:
      - false
      - true
      - Uncertain
      required: true
    - id: 20
      name: section_vaccination
      label: -- Vaccination Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: vaccination_status
      label: Are you fully vaccinated?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Partially vaccinated
      - Prefer not to answer
      required: true
    - id: 22
      name: vaccination_date
      label: Date of last vaccination dose
      hint: null
      type: date
      options: []
      required: false
    - id: 23
      name: section_screening_result
      label: -- Screening Result --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: screening_approved
      label: Based on this screening, travel is approved
      hint: null
      type: select_one
      options:
      - true
      - false
      - Requires further evaluation
      required: true
    - id: 25
      name: screening_date
      label: Screening Date
      hint: null
      type: date
      options: []
      required: true
