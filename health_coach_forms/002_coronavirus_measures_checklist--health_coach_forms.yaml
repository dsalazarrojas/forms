      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: exposure
      label: exposure
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: symptoms_date
      label: symptoms_date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: temperature_taken_at
