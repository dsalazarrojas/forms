      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email_confirmation
      label: Confirm Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone_confirmation
      label: Confirm Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: birthdate_confirmation
      label: Confirm Date of Birth
      hint: null
      type: date
      options: []
      required: true
