inputSchema:
  type: object
  properties:
    title: Gym Sign Up Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: birthdate
      label: Date of Birth
      hint: Enter birthdate in YYYY-MM-DD format
      type: date
      options: []
      required: false
    - id: 6
      name: membership_length
      label: Membership Length
