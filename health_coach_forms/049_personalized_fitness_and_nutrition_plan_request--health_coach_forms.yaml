inputSchema:
  type: object
  properties:
    title: Personalized Fitness And Nutrition Plan Request
    pages:
    - id: 1
      name: client_goals
      label: Client Goals
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: activity_level
      label: Activity Level
      hint: null
      type: select_one
      options:
      - sedentary
      - lightly active
      - moderately active
      - very often active
      required: false
    - id: 3
      name: goals_frequency
      label: Goals Frequency
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: client_details
      label: Client Details
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: diet_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_multiple
      options:
      - vegetarian
      - vegan
      - gluten free
      - other
      required: false
    - id: 6
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - diabetes
      - high blood pressure
      - other
      required: false
    - id: 7
      name: health_details
      label: Health Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: goals
      label: Goals
      hint: null
      type: select_one
      options:
      - weight loss
      - muscle gain
      - endurance
      - other
      required: false
    - id: 9
      name: nutrition_plan
      label: Nutrition Plan
      hint: null
      type: select_multiple
      options:
      - macro caloric deficit
      - maintenance
      - surplus
      required: false
    - id: 10
      name: frequency
      label: Frequency
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: training_program
      label: Training Program
      hint: null
      type: select_multiple
      options:
      - cardio
      - strength
      - endurance
      - other
      required: false
    - id: 12
      name: supplements
      label: Supplements
      hint: null
      type: select_multiple
      options:
      - protein shakes
      - protein pills
      - other
      required: false
    - id: 13
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
