inputSchema:
  type: object
  properties:
    title: Certification Exam
    pages:
    - id: 1
      name: exam_taker_name
      label: Exam Taker Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: exam_date
      label: Exam Date
      hint: Date taking the certification exam
      type: date
      options: []
      required: true
    - id: 3
      name: exam_time
      label: Exam Time
      hint: Start time of exam
      type: time
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Contact email for exam results
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 6
      name: candidate_id
      label: Candidate ID Number
      hint: Provided exam identifier
      type: text
      options: []
      required: true
    - id: 7
      name: certification_program
      label: Certification Program
      hint: Which program are you testing for
      type: select_one
      options:
      - Health Coach Level 1
      - Health Coach Level 2
      - Advanced Health Coach
      - Nutrition Specialist
      - Wellness Coordinator
      required: true
    - id: 8
      name: previous_attempts
      label: Number of Previous Attempts
      hint: How many times have you taken this exam
      type: number
      options: []
      required: false
    - id: 9
      name: question_1
      label: Question 1 - Client assessment principles
      hint: Select the correct answer
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      required: true
    - id: 10
      name: question_2
      label: Question 2 - Nutrition fundamentals
      hint: Select the correct answer
      type: select_one
      options:
      - Option A
