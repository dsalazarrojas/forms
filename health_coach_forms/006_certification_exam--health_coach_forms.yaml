      - Option C
      - Option D
      required: true
    - id: 11
      name: question_3
      label: Question 3 - Behavior change strategies
      hint: Select the correct answer
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      required: true
    - id: 12
      name: question_4
      label: Question 4 - Exercise recommendations
      hint: Select the correct answer
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      required: true
    - id: 13
      name: question_5
      label: Question 5 - Professional ethics
      hint: Select the correct answer
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      required: true
    - id: 14
      name: question_6
      label: Question 6 - Client communication
      hint: Select the correct answer
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      required: true
    - id: 15
      name: question_7
      label: Question 7 - Goal setting frameworks
      hint: Select the correct answer
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      required: true
    - id: 16
      name: question_8
      label: Question 8 - Health assessment tools
      hint: Select the correct answer
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      - Option D
      required: true
    - id: 17
      name: exam_environment
      label: Testing Environment
      hint: Where are you taking this exam
      type: select_one
      options:
      - Home
      - Testing Center
      - Workplace
      - Educational Institution
      required: false
    - id: 18
      name: accommodations_needed
      label: Testing Accommodations Needed
      hint: Any special accommodations required
      type: select_one
      options:
      - None
      - Extended Time
      - Screen Reader
      - Large Print
      - Other
      required: false
    - id: 19
      name: exam_attestation
      label: I attest I am taking this exam independently
      hint: Confirm exam integrity
      type: select_one
      options:
      - Yes, I Agree
      - 'No'
      required: true
