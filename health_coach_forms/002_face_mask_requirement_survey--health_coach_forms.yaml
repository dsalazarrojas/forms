inputSchema:
  type: object
  properties:
    title: Face Mask Requirement Survey
    pages:
    - id: 1
      name: face_mask_requirement_survey_page
      label: face_mask_requirement_survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: face_mask_type_page
      label: face_mask_type
      hint: null
      type: select_one
      options:
      - Surgical
      - Cloth
      - N95
      - Other
      required: false
    - id: 3
      name: face_mask_frequency_page
      label: face_mask_frequency
      hint: null
      type: select_multiple
      options:
      - Always
      - When in close proximity
      - When in close proximity and outside
      - Never
      required: false
    - id: 4
      name: face_mask_requiring_page
      label: face_mask_requiring
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: face_mask_preventing_page
      label: face_mask_preventing
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
