inputSchema:
  type: object
  properties:
    title: First Aid Training Sign Up Form
    pages:
    - id: 1
      name: first_aid_training
      label: First Aid Training
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: class_date
      label: Class Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: class_time
      label: Class Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: first_aid_training_classes
      label: First Aid Training Classes
      hint: null
      type: select_one
      options:
      - Class 1
      - Class 2
      - Class 3
      required: true
    - id: 9
      name: first_aid_training_coordinator
      label: First Aid Training Coordinator
      hint: null
      type: select_one
      options:
      - Coordinator 1
      - Coordinator 2
      - Coordinator 3
      required: true
    - id: 10
      name: class_location
      label: Class Location
      hint: null
      type: select_multiple
      options:
      - Location 1
      - Location 2
      - Location 3
      required: true
