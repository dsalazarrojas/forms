inputSchema:
  type: object
  properties:
    title: COVID 19 Phase 1B Vaccination Registration Form
    pages:
    - id: 1
      name: section_officer_info
      label: -- Personnel Information --
      hint: This phase is for Law Enforcement and Fire personnel
      type: note
      options: []
      required: false
    - id: 2
      name: registrant_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: birth_date
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: agency_name
      label: Agency or Organization Name
      hint: e.g. City Fire Dept, County Sheriff
      type: text
      options: []
      required: true
    - id: 5
      name: personnel_department
      label: Department
      hint: null
      type: select_one
      options:
      - Law Enforcement
      - Fire Department
      - EMS
      - Corrections
      - Dispatch
      required: true
    - id: 6
      name: badge_id
      label: Badge or Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: work_phone
      label: Work Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: personal_email
      label: Personal Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: duty_station
      label: Duty Station Address
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: section_health_check
      label: -- Health Screening --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: previous_infection
      label: Have you tested positive for COVID-19 in the last 90 days?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: vaccination_consent
      label: I consent to receive the vaccine at no charge as part of Phase 1B
      hint: null
      type: select_one
      options:
      - true
      - I consent
      required: true
