inputSchema:
  type: object
  properties:
    title: parent-teacher-conference-survey
    pages:
    - id: 1
      name: conference_experience
      label: What was your experience at the conference?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: communication
      label: How would you rate the communication between your child's teacher and
        you?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: comments
      label: Do you have any comments about the conference?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: teacher_communication
      label: How would you rate the communication between your child's teacher and
        you?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: communication_between_parents
      label: How would you rate the communication between you and your child's teacher?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: future_conferences
      label: How likely are you to attend future parent-teacher conferences?
      hint: null
      type: select_multiple
      options:
      - Definitely
      - Somewhat
      - Not very
      - Not at all
      required: false
    - id: 7
      name: suggestions
      label: Do you have any suggestions for improving future parent-teacher conferences?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: feedback
      label: Additional feedback about the conference
      hint: null
      type: text
      options: []
      required: false
