      hint: Please specify the form of application.
      type: select_one
      options:
      - application-for-training
      - application-for-practice
      - application-for-education
      required: false
    - id: 10
      name: application_forms_page_10
      label: application-forms
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: hand_washing_forms_page_11
      label: hand-washing-forms
      hint: null
      type: select_multiple
      options:
      - forms-for-training
      - forms-for-practice
      - forms-for-education
      required: false
    - id: 12
      name: hand_washing_page_12
      label: hand-washing-question
