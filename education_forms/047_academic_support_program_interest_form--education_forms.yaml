inputSchema:
  type: object
  properties:
    title: Academic Support Program Interest Form
    pages:
    - id: 1
      name: support_program_interest_intro
      label: Academic Support Program Interest
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Full name of the student expressing interest
      type: text
      options: []
      required: true
    - id: 3
      name: student_email
      label: Email Address
      hint: Student's institutional or personal email
      type: email
      options: []
      required: true
    - id: 4
      name: student_id
      label: Student ID
      hint: Official student identification number
      type: text
      options: []
      required: true
    - id: 5
      name: academic_program
      label: Academic Program
      hint: Current program or major
      type: text
      options: []
      required: true
    - id: 6
      name: academic_year
      label: Academic Year
      hint: Current year in the program (freshman, sophomore, etc.)
      type: select_one
      options: ["Freshman", "Sophomore", "Junior", "Senior", "Graduate student", "Postgraduate", "Other"]
      required: true
    - id: 7
      name: support_program_interest
      label: Academic Support Program Interest
      hint: Which academic support program are you interested in?
      type: select_one
      options: ["Tutoring services", "Writing center", "Math lab", "Study groups", "Academic coaching", "Disability services", "Library research support", "Other"]
      required: true
    - id: 8
      name: specific_subject_area
      label: Specific Subject Area
      hint: What subject area do you need support in?
      type: text
      options: []
      required: false
    - id: 9
      name: support_frequency_need
      label: Support Frequency Need
      hint: How often would you like to receive support?
      type: select_one
      options: ["Weekly", "Bi-weekly", "As needed", "Intensive short-term", "Long-term ongoing", "One-time consultation"]
      required: true
    - id: 10
      name: preferred_support_format
      label: Preferred Support Format
      hint: How would you prefer to receive support?
      type: select_one
      options: ["One-on-one", "Group sessions", "Online/virtual", "In-person", "Hybrid", "Self-paced modules", "Other"]
      required: true
    - id: 11
      name: availability_time_slots
      label: Available Time Slots
      hint: When are you typically available for support sessions?
      type: text
      options: []
      required: false
    - id: 12
      name: academic_challenges
      label: Academic Challenges
      hint: What specific academic challenges are you facing?
      type: text
      options: []
      required: false
    - id: 13
      name: previous_support_experience
      label: Previous Support Experience
      hint: Have you used academic support services before?
      type: select_one
      options: ["Yes, regularly", "Yes, occasionally", "No, but interested", "No, and not interested"]
      required: true
    - id: 14
      name: accommodation_requirements
      label: Accommodation Requirements
      hint: Do you have any special accommodation needs?
      type: text
      options: []
      required: false
    - id: 15
      name: expected_outcomes
      label: Expected Outcomes
      hint: What do you hope to achieve through these services?
      type: text
      options: []
      required: false
    - id: 16
      name: consent_to_contact
      label: Consent to Contact
      hint: Do you consent to being contacted by support staff?
      type: select_one
      options: ["Yes, I consent", "Yes, via email only", "Yes, via phone only", "No, do not contact"]
      required: true
    - id: 17
      name: additional_comments
      label: Additional Comments
      hint: Any other information about your support needs?
      type: text
      options: []
      required: false
