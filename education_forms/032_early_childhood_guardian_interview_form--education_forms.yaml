inputSchema:
  type: object
  properties:
    title: Early Childhood Guardian Interview Form
    pages:
    - id: 1
      name: child_name
      label: Child Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: guardian_relationship
      label: Guardian Relationship
      hint: null
      type: select_one
      options:
      - Parent
      - Grandparent
      - Other
      required: false
    - id: 3
      name: child_gender
      label: Child Gender
      hint: null
      type: select_multiple
      options:
      - Female
      - Male
      - Other
      required: false
