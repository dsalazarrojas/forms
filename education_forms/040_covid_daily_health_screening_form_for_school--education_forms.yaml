inputSchema:
  type: object
  properties:
    title: COVID Daily Health Screening Form For School
    pages:
    - id: 1
      name: daily_student_header
      label: -- Student Information --
      hint: Please provide your information
      type: note
      options: []
      required: false
    - id: 2
      name: daily_student_name
      label: Student Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: daily_date_of_birth
      Label: Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: daily_grade_level
      label: Grade Level
      hint: Your current grade
      type: text
      options: []
      required: true
    - id: 5
      name: daily_screening_date
      Label: Screening Date
      hint: Date of this screening
      type: date
      options: []
      required: true
    - id: 6
      name: daily_parent_contact_header
      label: -- Parent or Guardian Contact --
      hint: Emergency contact information
      type: note
      options: []
      required: false
    - id: 7
      name: daily_parent_name
      Label: Parent or Guardian Name
      hint: Name of parent or guardian
      type: text
      options: []
      required: false
    - id: 8
      name: daily_parent_phone
      label: Parent or Guardian Phone
      hint: Contact phone number
      type: phone
      options: []
      required: false
    - id: 9
      name: daily_symptom_screening_header
      Label: -- COVID-19 Symptom Screening --
      hint: Please answer these questions about symptoms
      type: note
      options: []
      required: false
    - id: 10
      name: daily_fever
      label: Do You Have a Fever
      hint: Temperature of 100.4F or higher
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 11
      name: daily_cough
      Label: Do You Have a Cough
      hint: New or worsening cough
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 12
      name: daily_shortness_of_breath
      label: Do You Have Shortness of Breath
      hint: Difficulty breathing or chest pain
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 13
      name: daily_loss_taste_smell
      Label: Loss of Taste or Smell
      hint: New loss of taste or smell
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 14
      name: daily_body_aches
      label: Body Aches or Fatigue
      hint: Unusual muscle aches or tiredness
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 15
      name: daily_sore_throat
      Label: Sore Throat
      hint: Throat pain or difficulty swallowing
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 16
      name: daily_headache
      label: Headache
      hint: Unusual headache
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 17
      name: daily_nausea_vomiting
      Label: Nausea or Vomiting
      hint: Stomach upset or vomiting
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 18
      name: daily_exposure_header
      label: -- Exposure Assessment --
      hint: About your exposure to COVID-19
      type: note
      options: []
      required: false
    - id: 19
      name: daily_close_contact
      Label: Close Contact with Someone Ill
      hint: Been near someone who is sick
      type: select_one
      options:
      - No close contact
      - Yes, close contact
      - Unsure
      required: true
    - id: 20
      name: daily_covid_positive_contact
      label: Contact with COVID-19 Positive Person
      hint: Been with someone who tested positive
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 21
      name: daily_screening_result_header
      Label: -- Screening Clearance --
      hint: Result of health screening
      type: note
      options: []
      required: false
    - id: 22
      name: daily_cleared_to_attend
      label: Cleared to Attend School Today
      hint: Based on screening answers
      type: select_one
      options:
      - Yes, cleared to attend
      - No, not cleared to attend
      - Conditional clearance
      required: true
    - id: 23
      name: daily_reason_if_not_cleared
      Label: Reason for Non-Clearance if Applicable
      hint: Why student cannot attend
      type: text
      options: []
      required: false
    - id: 24
      name: daily_follow_up_needed
      label: Follow-Up Needed
      hint: Any follow-up action required
      type: select_one
      options:
      - No follow-up
      - Parental notification
      - Physician consultation
      - Stay home and monitor
      - Get tested
      required: false
    - id: 25
      name: daily_screening_complete_date
      Label: Date and Time Screening Completed
      hint: When this screening was finished
      type: time
      options: []
      required: true
