inputSchema:
  type: object
  properties:
    title: School Board Meeting Registration
    pages:
    - id: 1
      name: attendee_details
      label: Attendee Details
      hint: Please provide attendee's name and title
      type: text
      options: []
      required: true
    - id: 2
      name: meeting_details
      label: Meeting Details
      hint: Meeting date, time, and location
      type: text
      options: []
      required: false
    - id: 3
      name: participation_details
      label: Participation Details
      hint: Participation type and other details
      type: select_one
      options:
      - Member of the School Committee
      - Staff Member
      - Guest
      required: true
    - id: 4
      name: comments_and_questions
      label: Comments and Questions
      hint: Comments and questions for the meeting
      type: text
      options: []
      required: false
    - id: 5
      name: accessibility_requests
      label: Accessibility Requests
      hint: Accessibility requests
      type: select_multiple
      options:
      - Accessible meeting materials
      - Sign language interpreter
      - Other (please specify)
      required: false
    - id: 6
      name: meeting_attendance
      label: Meeting Attendance
      hint: Confirm meeting attendance
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 7
      name: meeting_agenda_items
      label: Meeting Agenda Items
      hint: Meeting agenda items
      type: text
      options: []
      required: false
