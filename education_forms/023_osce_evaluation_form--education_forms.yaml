inputSchema:
  type: object
  properties:
    title: osce_evaluation_form
    pages:
    - id: 1
      name: page_1
      label: Introduction
      hint: Please provide a brief introduction to this OSCE evaluation form.
      type: text
      options: []
      required: false
    - id: 2
      name: osce_satisfaction
      label: Satisfaction with OSCE program
      hint: Rate your level of satisfaction with the OSCE program
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 3
      name: osce_experience
      label: Overall experience with OSCE program
      hint: Rate your overall experience with the OSCE program
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: osce_likes
      label: What did you like most about OSCE program
      hint: Please provide your reasons for liking the OSCE program
      type: text
      options: []
      required: false
    - id: 5
      name: osce_dislikes
      label: What did you like least about OSCE program
      hint: Please provide your reasons for disliking the OSCE program
      type: text
      options: []
      required: false
    - id: 6
      name: osce_teaching
      label: OSCE teaching quality
      hint: Rate the quality of teaching in the OSCE program
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: osce_expectations
      label: Expectations for OSCE program future
      hint: Please provide your expectations for the OSCE program in the future
      type: text
      options: []
      required: false
    - id: 8
      name: osce_improvements
      label: Recommendations for OSCE program improvements
      hint: Please provide your suggestions for improving the OSCE program
      type: text
      options: []
      required: false
    - id: 9
      name: osce_value
      label: OSCE program value
      hint: Rate the value of the OSCE program
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 10
      name: osce_relevance
      label: OSCE program relevance
      hint: Rate the relevance of the OSCE program to your field of practice
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 11
      name: osce_suggestions
      label: Suggestions for OSCE program development
      hint: Please provide your suggestions for developing the OSCE program
      type: text
      options: []
      required: false
    - id: 12
      name: osce_final_thoughts
      label: Final thoughts and comments
      hint: Please provide any final thoughts or comments about the OSCE program
      type: text
      options: []
      required: false
