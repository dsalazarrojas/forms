inputSchema:
  type: object
  properties:
    title: Student Information Collection Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: student_address
      label: Student Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: student_grade
      label: Grade
      hint: null
      type: select_one
      options:
      - Grade 1
      - Grade 2
      - Grade 3
      - Grade 4
      - Grade 5
      required: false
    - id: 8
      name: student_subject
      label: Subject
      hint: null
      type: select_multiple
      options:
      - Math
      - Science
      - English
      required: true
