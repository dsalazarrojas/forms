inputSchema:
  type: object
  properties:
    title: Digital Literacy Workshop Participation Consent Form
    pages:
    - id: 1
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: emergency_info
      label: Emergency Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: accessibility_needs
      label: Accessibility Needs
      hint: null
      type: select_one
      options:
      - None
      - Partially mobility impaired
      - Wheel chair
      - Other (please specify)
      required: false
    - id: 4
      name: participation_consent
      label: Participation Consent
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact Email
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_other_contact_info
      label: Other Contact Info
      hint: null
      type: text
      options: []
      required: false
