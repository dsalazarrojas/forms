      name: reading_log
      label: Reading Log
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reflection
      label: Reflection
      hint: How did you feel about the reading?
      type: text
      options: []
      required: false
    - id: 3
      name: goals
      label: Goals
      hint: What are your goals for the next reading session?
      type: text
      options: []
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Category 1
      - Category 2
      - Category 3
      required: false
    - id: 7
      name: progress
      label: Progress
      hint: How much progress have you made?
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 8
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
