inputSchema:
  type: object
  properties:
    title: Sea Level Changes Quiz
    pages:
    - id: 1
      name: general_info
      label: Sea Level Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: sea_level_rise
      label: What is sea level rise?
      hint: null
      type: select_one
      options:
      - '{''Sea Level Rise'': ''0-1 meters''}'
      - '{''Sea Level Rise'': ''1-2 meters''}'
      - '{''Sea Level Rise'': ''2-3 meters''}'
      - '{''Sea Level Rise'': ''3-4 meters''}'
      - '{''Sea Level Rise'': ''4-5 meters''}'
      - '{''Sea Level Rise'': ''5-6 meters''}'
      - '{''Sea Level Rise'': ''6-7 meters''}'
      - '{''Sea Level Rise'': ''7-8 meters''}'
      - '{''Sea Level Rise'': ''More than 8 meters''}'
      required: false
    - id: 3
      name: measurement
      label: How do you typically measure sea level?
      hint: null
      type: select_multiple
      options:
      - tide_stick
      - satellite_imagery
      - sea_level_gauge
      - other
      required: false
    - id: 4
      name: impacts
      label: What are the potential impacts of sea level rise on your community?
      hint: null
      type: select_multiple
      options:
      - erosion
      - flooding
      - saltwater_infiltration
      - increased_salinity
      - increased_sedimentation
      - loss_of_biodiversity
      - loss_of_habitat
      - displacement
      - other
      required: false
    - id: 5
      name: sea_level_mitigation
      label: What do you think can be done to mitigate sea level rise?
      hint: null
      type: select_multiple
      options:
      - educate
      - build_flood_defenses
      - adapt_to_new_conditions
      - move_to_higher_ground
      - sea_level_gates
      - restore_wetlands
      - other
      required: false
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
