inputSchema:
  type: object
  properties:
    title: Sea Level Changes Quiz
    pages:
    - id: 1
      name: general_info
      label: Sea Level Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: sea_level_rise
      label: What is sea level rise?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      - Option 6
      - Option 7
      - Option 8
      - Option 9
      required: false
    - id: 3
      name: measurement
      label: How do you typically measure sea level?
      hint: null
      type: select_multiple
      options:
      - tide stick
      - satellite imagery
      - sea level gauge
      - other
      required: false
    - id: 4
      name: impacts
      label: What are the potential impacts of sea level rise on your community?
      hint: null
      type: select_multiple
      options:
      - erosion
      - flooding
      - saltwater infiltration
      - increased salinity
      - increased sedimentation
      - loss of biodiversity
      - loss of habitat
      - displacement
      - other
      required: false
    - id: 5
      name: sea_level_mitigation
      label: What do you think can be done to mitigate sea level rise?
      hint: null
      type: select_multiple
      options:
      - educate
      - build flood defenses
      - adapt to new conditions
      - move to higher ground
      - sea level gates
      - restore wetlands
      - other
      required: false
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
