      - Somewhat Well
      - Neutral
      - Somewhat Poorly
      - Very Poorly
      required: false
    - id: 9
      name: student_satisfaction
      label: How satisfied are you with this course?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 10
      name: course_relevance
      label: How relevant is this course to your major/minor?
      hint: null
      type: select_one
      options:
      - Very Relevant
      - Somewhat Relevant
      - Neutral
      - Somewhat Irrelevant
      - Very Irrelevant
      required: false
    - id: 11
      name: course_organization
      label: How well was the course organized?
      hint: null
      type: select_one
