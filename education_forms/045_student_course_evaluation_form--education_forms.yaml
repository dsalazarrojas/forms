inputSchema:
  type: object
  properties:
    title: Student Course Evaluation Form
    pages:
    - id: 1
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: course_grade
      label: What grade are you in?
      hint: null
      type: select_one
      options:
      - Senior
      - Junior
      - Sophomore
      - Freshman
      required: false
    - id: 4
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 5
      name: teacher_quality
      label: How would you rate the quality of instruction?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: course_materials
      label: How clear and effective were the course materials?
      hint: null
      type: select_one
      options:
      - Very Clear
      - Somewhat Clear
      - Neutral
      - Somewhat Confusing
      - Very Confusing
      required: false
    - id: 7
      name: teacher_help
      label: How well did the instructor explain the material?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 8
      name: communication_skills
      label: How well did the instructor communicate the material?
      hint: null
