inputSchema:
  type: object
  properties:
    title: Virtual Teaching Observation Recording Consent Form
    pages:
    - id: 1
      name: teacher_consent
      label: Teacher Consent
      hint: null
      type: select_one
      options:
      - I am a licensed teacher
      - I am a non-licensed teacher
      - I am a non-teaching staff
      required: true
    - id: 2
      name: participant_consent
      label: Participant Consent
      hint: null
      type: select_one
      options:
      - I am a participant in this virtual class
      - I am not a participant in this virtual class
      required: true
    - id: 3
      name: observation_recording_consent
      label: Observation Recording Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: participant_informed_consent
      label: Participant Informed Consent
      hint: null
      type: note
      options: []
      required: false
    - id: 5
