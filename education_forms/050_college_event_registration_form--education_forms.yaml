inputSchema:
  type: object
  properties:
    title: College Event Registration Form
    pages:
    - id: 1
      name: attendee_first_name
      label: First Name
      hint: Given name
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_last_name
      label: Last Name
      hint: Family name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: student_id
      label: Student ID Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 6
      name: attendee_type
      label: Your Status
      hint: Affiliation
      type: select_one
      options:
      - Current Student
      - Prospective Student
      - Alumni
      - Faculty
      - Staff
      - Community Member
      - Guest
      required: true
    - id: 7
      name: school_name
      label: School Name
      hint: Your institution
      type: text
      options: []
      required: true
    - id: 8
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: false
    - id: 9
      name: major
      label: Major or Field of Study
      hint: If student
      type: text
      options: []
      required: false
    - id: 10
      name: class_year
      label: Class Year
      hint: Graduation year
      type: number
      options: []
      required: false
    - id: 11
      name: event_name
      label: Event Name
      hint: Which event
      type: text
      options: []
      required: true
    - id: 12
      name: event_date
      label: Event Date
      hint: When held
      type: date
      options: []
      required: true
    - id: 13
      name: registration_date
      label: Registration Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 14
      name: activities_selection
      label: Activities You Plan to Attend
      hint: Select all that apply
      type: select_multiple
      options:
      - Keynote Address
      - Panel Discussion
      - Workshop Session A
      - Workshop Session B
      - Networking Reception
      - Poster Presentation
      - Competition
      - Awards Ceremony
      - Social Event
      - Other
      required: true
    - id: 15
      name: workshop_preference
      label: Workshop Preference
      hint: If attending workshop
      type: select_one
      options:
      - Workshop A - Morning
      - Workshop B - Afternoon
      - Both Workshops
      - No Workshop
      required: false
    - id: 16
      name: role_in_event
      label: Your Role in Event
      hint: How participating
      type: select_one
      options:
      - Attendee
      - Presenter
      - Panelist
      - Volunteer
      - Sponsor
      - Organizer
      required: true
    - id: 17
      name: presentation_title
      label: Presentation Title
      hint: If presenting
      type: text
      options: []
      required: false
    - id: 18
      name: presentation_abstract
      label: Presentation Abstract
      hint: Brief description
      type: text
      options: []
      required: false
    - id: 19
      name: tshirt_size
      label: T-Shirt Size
      hint: For event shirt
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      - XXXL
      required: false
    - id: 20
      name: meal_preference
      label: Meal Preference
      hint: If meals provided
      type: select_one
      options:
      - No Preference
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Kosher
      - Halal
      - Other
      required: false
    - id: 21
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any restrictions
      type: text
      options: []
      required: false
    - id: 22
      name: accommodation_needed
      label: Accessibility Accommodations Needed
      hint: Any accommodations
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 23
      name: accommodation_details
      label: Accommodation Details
      hint: What is needed
      type: text
      options: []
      required: false
    - id: 24
      name: transportation_needed
      label: Transportation Assistance Needed
      hint: Shuttle or directions
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 25
      name: housing_needed
      label: Housing Assistance Needed
      hint: Hotel recommendations
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 26
      name: registration_fee
      label: Registration Fee
      hint: Fee amount
      type: text
      options: []
      required: true
    - id: 27
      name: fee_waiver
      label: Fee Waiver Request
      hint: If needed
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 28
      name: payment_method
      label: Payment Method
      hint: How paying
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Check
      - Invoice
      - Waived
      required: true
    - id: 29
      name: how_heard
      label: How Did You Hear About This Event
      hint: Information source
      type: select_one
      options:
      - Email
      - Website
      - Social Media
      - Professor
      - Friend
      - Flyer
      - Other
      required: true
    - id: 30
      name: networking_interest
      label: Interested in Networking Opportunities
      hint: Meet other attendees
      type: select_one
      options:
      - Yes Very Interested
      - Somewhat Interested
      - Not Interested
      required: false
    - id: 31
      name: topics_of_interest
      label: Topics You Are Most Interested In
      hint: Select interests
      type: text
      options: []
      required: false
    - id: 32
      name: expectations
      label: What Do You Hope to Gain from This Event
      hint: Your goals
      type: text
      options: []
      required: false
    - id: 33
      name: previous_attendance
      label: Have You Attended This Event Before
      hint: Previous years
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 34
      name: referral
      label: Who Referred You
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 35
      name: additional_comments
      label: Additional Comments or Questions
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 36
      name: terms_accepted
      label: Terms and Conditions
      hint: I agree to event policies
      type: select_one
      options:
      - Yes I Accept
      - false
      required: true
