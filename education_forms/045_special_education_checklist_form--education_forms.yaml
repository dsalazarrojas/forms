inputSchema:
  type: object
  properties:
    title: special_education_checklist_form
    pages:
    - id: 1
      name: student_name
      label: student_name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: student_id
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: date_of_birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: educational_background
      label: educational_background
      hint: null
      type: select_one
      options:
      - General Ed
      - Special Ed
      - Gifted Ed
      required: true
    - id: 5
      name: accommodations_needed
      label: accommodations_needed
      hint: null
      type: select_multiple
      options:
      - Speech Therapy
      - Occupational Therapy
      - Physical Therapy
      required: true
    - id: 6
      name: services_needed
      label: services_needed
      hint: null
      type: select_multiple
      options:
      - IEP
      - IEP-Modified
      required: false
    - id: 7
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
