inputSchema:
  type: object
  properties:
    title: Calligraphy Registration Form
    pages:
    - id: 1
      name: attendee_info_header
      label: -- Student Registration Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_full_name
      label: Student Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_email
      label: Student Email Address
      hint: For course materials and links
      type: email
      options: []
      required: true
    - id: 4
      name: student_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: course_selection_header
      label: -- Course and Schedule --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: workshop_selection
      label: Workshop - Class Selection
      hint: Choose the session you wish to attend
      type: select_one
      options:
      - Intro to Modern Calligraphy
      - Copperplate Foundations
      - Brush Lettering Workshop
      - Flourishing Masterclass
      - Wedding Stationery Design
      required: true
    - id: 7
      name: session_date
      label: Preferred Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: experience_level
      label: Your Current Experience Level
      hint: Helps instructors tailor the material
      type: select_one
      options:
      - Absolute Beginner
      - Beginner with some knowledge
      - Intermediate
      - Advanced
      required: true
    - id: 9
      name: supplies_needed
      label: Do you need a starter supply kit?
      hint: Kit includes pen holder, nibs, ink, and practice pads
      type: select_one
      options:
      - Yes - I need a kit ($45 extra)
      - No - I will bring my own supplies
      required: true
    - id: 10
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: For workshops including lunch/snacks
      type: text
      options: []
      required: false
    - id: 11
      name: referral_source
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Social Media
      - Friend or Family
      - Search Engine
      - Local Advertisement
      - Other
      required: false
    - id: 12
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      - Cash at Workshop
      required: true
    - id: 13
      name: terms_and_conditions
      label: Terms and Conditions Agreement
      hint: I understand the cancellation and refund policy
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 14
      name: student_signature
      label: Digital Signature - Full Name
      hint: null
      type: text
      options: []
      required: true
