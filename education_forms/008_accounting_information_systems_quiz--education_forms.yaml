inputSchema:
  type: object
  properties:
    title: Accounting Information Systems Quiz
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: q1_ais_definition
      label: What does AIS stand for?
      hint: null
      type: select_one
      options:
      - Accounting Information System
      - Advanced Information Storage
      - Account Internal System
      required: true
    - id: 4
      name: q2_data_vs_information
      label: Which of the following is considered processed data?
      hint: null
      type: select_one
      options:
      - Data
      - Information
      - Both
      - Neither
      required: true
    - id: 5
      name: q3_ais_components
      label: Select components of an AIS
      hint: Choose all that apply
      type: select_multiple
      options:
      - People
      - Procedures
      - Software
      - Data
      - Infrastructure
      - Internal Controls
      required: true
    - id: 6
      name: q4_erp_integration
      label: What is a primary benefit of ERP systems?
      hint: null
      type: select_one
      options:
      - Centralized Data
      - Fragmented Reports
      - Manual Entry Only
      required: true
    - id: 7
      name: q5_internal_control_purpose
      label: What is the main goal of internal controls?
      hint: null
      type: select_one
      options:
      - Prevent Fraud and Error
      - Increase Sales Volume
      - Decrease Staff Count
      required: true
    - id: 8
      name: q6_real_time_processing
      label: Processing transactions as they occur is called
      hint: null
      type: select_one
      options:
      - Batch Processing
      - Real-time Processing
      - Offline Processing
      required: true
    - id: 9
      name: self_assessment_score
      label: Rate your understanding of AIS concepts
      hint: 1 - lowest, 10 - highest
      type: number
      options: []
      required: false
    - id: 10
      name: quiz_date
      label: Quiz Date
      hint: null
      type: date
      options: []
      required: true
