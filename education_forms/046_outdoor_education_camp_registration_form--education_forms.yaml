inputSchema:
  type: object
  properties:
    title: outdoor_education_camp_registration_form
    pages:
    - id: 1
      name: personal_info
      label: Personal Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: guardian_info
      label: Guardian Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: camper_info
      label: Camper Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: emergency_contact
      label: Emergency Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_medical_info
      label: Emergency Medical Information
      hint: Please provide any medical conditions or allergies that we should be aware
        of.
      type: text
      options: []
      required: false
    - id: 6
      name: activity_selection
      label: Activity Selection
      hint: Please select all activities you are interested in participating in.
      type: select_multiple
      options:
      - hiking
      - kayaking
      - swimming
      - rock climbing
      required: false
    - id: 7
      name: activity_date
      label: Activity Date
      hint: What date would you like to participate in the activity you selected?
      type: date
      options: []
      required: false
    - id: 8
      name: payment_info
      label: Payment Information
      hint: We require a deposit to secure your spot.
      type: text
      options: []
      required: false
    - id: 9
      name: confirmation
      label: Confirm Registration
      hint: null
      type: text
      options: []
      required: false
