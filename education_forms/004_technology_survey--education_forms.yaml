inputSchema:
  type: object
  properties:
    title: Technology Survey
    pages:
    - id: 1
      name: education_level
      label: What is your highest level of education completed?
      hint: null
      type: select_one
      options:
      - high school
      - some college
      - bachelor degree
      - master degree
      - doctorate
      - other
      required: false
    - id: 2
      name: technology_experience_workplace
      label: How would you rate your experience with technology at work?
      hint: null
      type: select_one
      options:
      - beginner
      - intermediate
      - advanced
      - expert
      required: false
    - id: 3
      name: technology_experience_classroom
      label: How would you rate your experience with technology in the classroom?
      hint: null
      type: select_one
      options:
      - beginner
      - intermediate
      - advanced
      - expert
      required: false
    - id: 4
      name: technology_importance
      label: How important is technology to your job?
      hint: null
      type: select_one
      options:
      - not at all
      - somewhat
      - neutral
      - very important
      required: false
    - id: 5
      name: technology_hobby
      label: What is your favorite technology-related hobby or activity?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: technology_use_personal
      label: How often do you use technology for personal projects or hobbies?
      hint: null
      type: select_one
      options:
      - never
      - occasionally
      - sometimes
      - often
      - always
      required: false
    - id: 7
      name: technology_interest
      label: What is your level of interest in learning more about technology?
      hint: null
      type: select_one
      options:
      - not at all
      - somewhat
      - neutral
      - very important
      required: false
    - id: 8
      name: online_resources
      label: Do you prefer to learn through online resources or in-person tutorials?
      hint: null
      type: select_one
      options:
      - online
      - in person
      required: false
    - id: 9
      name: online_experience
      label: How would you rate your experience with online learning platforms?
      hint: null
      type: select_one
      options:
      - beginner
      - intermediate
      - advanced
      - expert
      required: false
    - id: 10
      name: online_use
      label: How often do you use online resources for learning?
      hint: null
      type: select_one
      options:
      - never
      - occasionally
      - sometimes
      - often
      - always
      required: false
    - id: 11
      name: online_language
      label: What is your preferred language for online learning (e.g., programming
        languages, languages)?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: technology_comments
      label: Any additional comments or suggestions for improving technology education?
      hint: null
      type: text
      options: []
      required: false
