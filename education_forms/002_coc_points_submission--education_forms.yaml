inputSchema:
  type: object
  properties:
    title: CoC Points Submission
    pages:
    - id: 1
      name: section_submitter
      label: -- Submitter Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: sca_name
      label: SCA Name
      hint: Your name within the Society
      type: text
      options: []
      required: true
    - id: 3
      name: legal_name
      label: Legal Name
      hint: Your legal first and last name
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: branch_barony
      label: Branch or Barony
      hint: Which local group do you belong to?
      type: text
      options: []
      required: true
    - id: 6
      name: section_entry
      label: -- Arts and Sciences Entry --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: category_of_entry
      label: Category of Entry
      hint: Select the most relevant category
      type: select_one
      options:
      - Costuming
      - Cooking
      - Armoring
      - Needlework
      - Calligraphy
      - Research
      - Performance
      - Other
      required: true
    - id: 8
      name: description_of_work
      label: Description of Work
      hint: Briefly describe what you created or researched
      type: text
      options: []
      required: true
    - id: 9
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: points_claimed
      label: Points Claimed
      hint: Number of points according to the handbook
      type: number
      options: []
      required: true
    - id: 11
      name: documentation_link
      label: Documentation Link
      hint: URL to digital documentation or photos if available
      type: text
      options: []
      required: false
    - id: 12
      name: signature_verification
      label: Signature and Verification
      hint: Type your name to verify this submission
      type: text
      options: []
      required: true
