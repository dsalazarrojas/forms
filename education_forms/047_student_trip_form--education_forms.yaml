inputSchema:
  type: object
  properties:
    title: Student Trip Form
    pages:
    - id: 1
      name: order_tickets
      label: order_tickets
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: select_check_out_time
      label: select_check_out_time
      hint: null
      type: select_one
      options:
      - 08:00
      - '720'
      - '960'
      required: false
    - id: 3
      name: select_meal_preferences
      label: select_meal_preferences
      hint: null
      type: select_multiple
      options:
      - Breakfast
      - Lunch
      - Dinner
      required: false
    - id: 4
      name: enter_contact_information
      label: enter_contact_information
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - In Person
      required: false
