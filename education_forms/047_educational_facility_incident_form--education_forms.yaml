inputSchema:
  type: object
  properties:
    title: Educational Facility Incident Form
    pages:
    - id: 1
      name: incident_type
      label: What type of incident
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: incident_date
      label: Date of incident
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: incident_location
      label: Location of incident
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: incident_description
      label: Description of incident
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: incident_investigation_status
      label: Investigation status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 6
      name: incident_reported_by
      label: Reported by
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: incident_safety_measures
      label: Safety measures taken
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: incident_incident_reporter
      label: Incident reporter
      hint: null
      type: text
      options: []
      required: false
