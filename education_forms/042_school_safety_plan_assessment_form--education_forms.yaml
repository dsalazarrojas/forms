inputSchema:
  type: object
  properties:
    title: School Safety Plan Assessment Form
    pages:
    - id: 1
      name: school_safety_plan
      label: School Safety Plan
      hint: null
      type: select_multiple
      options:
      - Locking doors
      - Conducting drills
      - Emergency exit plan
      - First aid kit
      - Safety protocols
      required: true
    - id: 2
      name: review_frequency
      label: Review Frequency
      hint: null
      type: select_one
      options:
      - Frequent
      - Less frequent
      - Rarely
      - Never
      required: true
    - id: 3
      name: review_protocol
      label: Review Protocol
      hint: null
      type: select_multiple
      options:
      - Review protocols
      - Conducting drills
      - Locking doors
      - Safety measures
      required: true
    - id: 4
      name: contact_information
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - Principal
      - Facilities manager
      - Security officer
      - Safety officer
      - Maintenance staff
      required: true
    - id: 5
      name: review_status
      label: Review Status
      hint: null
      type: select_one
      options:
      - Completed
      - In progress
      - Not started
      required: true
    - id: 6
      name: review_comments
      label: Review Comments
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: review_responsible
      label: Review Responsible
      hint: null
      type: select_one
      options:
      - School administration
      - Safety officer
      - School board
      required: true
    - id: 8
      name: review_due_date
      label: Review Due Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: review_completed
      label: Review Completed
      hint: null
      type: select_one
      options:
      - Complete
      - Not completed
      required: true
    - id: 10
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
