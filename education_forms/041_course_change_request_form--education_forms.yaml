inputSchema:
  type: object
  properties:
    title: Course Change Request Form
    pages:
    - id: 1
      name: student_id
      label: Student Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: course_id
      label: Course Id
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: new_course_id
      label: New Course Id
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: faculty_approval
      label: Faculty Approval
      hint: null
      type: select_multiple
      options:
