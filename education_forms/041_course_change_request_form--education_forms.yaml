      - Closed
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - Other
      required: false
    - id: 9
      name: created_by
      label: Created By
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - Other
      required: false
    - id: 10
      name: updated_by
      label: Updated By
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - Other
      required: false
