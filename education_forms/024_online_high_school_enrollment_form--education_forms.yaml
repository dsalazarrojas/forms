inputSchema:
  type: object
  properties:
    title: Online High School Enrollment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - 9th
      - 10th
      - 11th
      - 12th
      - Senior
      - Pre-Senior
      required: true
    - id: 8
      name: school_type
      label: School Type
      hint: null
      type: select_one
      options:
      - High School
      - Middle School
      - Elementary School
      required: true
    - id: 9
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
