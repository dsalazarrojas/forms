inputSchema:
  type: object
  properties:
    title: Student Daily Feedback Form
    pages:
    - id: 1
      name: student_feedback
      label: Feedback Form
      hint: null
      type: select_multiple
      options:
      - Feedback is very good
      - Feedback is good
      - Feedback is fair
      - Feedback is poor
      required: false
    - id: 2
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: feedback_type
      label: Feedback Type
      hint: null
      type: select_one
      options:
      - Meeting
      - Lecture
      - Assignment
      - Project
      required: false
    - id: 7
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: educator_name
      label: Educator Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: educator_id
      label: Educator ID
      hint: null
      type: number
      options: []
      required: false
