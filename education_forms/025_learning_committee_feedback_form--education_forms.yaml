inputSchema:
  type: object
  properties:
    title: Learning Committee Feedback Form
    pages:
    - id: 1
      name: page_1_feedback
      label: Feedback on the program
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: page_2_support
      label: Feedback on the program support
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: page_3_rating
      label: How would you rate the program?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: page_4_completion
      label: Date and Time of Completion
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: page_5_contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
