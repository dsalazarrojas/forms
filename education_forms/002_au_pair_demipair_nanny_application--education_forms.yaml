inputSchema:
  type: object
  properties:
    title: Au Pair Demipair Nanny Application
    pages:
    - id: 1
      name: section_applicant_info
      label: -- Applicant Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: nationality
      label: Nationality
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Include country code
      type: text
      options: []
      required: true
    - id: 7
      name: section_education
      label: -- Education and Skills --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: education_level
      label: Highest Education Level
      hint: null
      type: select_one
      options:
      - High School
      - Vocational Training
      - Associate Degree
      - Bachelor Degree
      - Master Degree
      required: true
    - id: 9
      name: languages_spoken
      label: Languages Spoken
      hint: List all languages and proficiency
      type: text
      options: []
      required: true
    - id: 10
      name: first_aid_certified
      label: First Aid Certified
      hint: null
      type: select_one
      options:
      - true
      - false
      - In Progress
      required: true
    - id: 11
      name: section_experience
      label: -- Childcare Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: childcare_experience_years
      label: Years of Childcare Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: age_groups_experienced
      label: Age Groups Experienced
      hint: Select all that apply
      type: select_multiple
      options:
      - Newborns (0-1)
      - Toddlers (1-3)
      - Preschool (3-5)
      - School Age (6-12)
      - Teens (13+)
      required: true
    - id: 14
      name: motivation_statement
      label: Why do you want to be an Au Pair or Nanny?
      hint: Describe your interest in the program
      type: text
      options: []
      required: true
    - id: 15
      name: section_availability
      label: -- Availability and Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: preferred_start_date
      label: Preferred Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: duration_stay_months
      label: Intended Duration of Stay (Months)
      hint: null
      type: number
      options: []
      required: true
    - id: 18
      name: smoking_status
      label: Do you smoke?
      hint: null
      type: select_one
      options:
      - Non-smoker
      - Occasional smoker
      - Smoker
      required: true
    - id: 19
      name: drivers_license
      label: Do you have a valid Driver's License?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: health_conditions
      label: Relevant Health Conditions
      hint: Please list any allergies or chronic conditions
      type: text
      options: []
      required: false
