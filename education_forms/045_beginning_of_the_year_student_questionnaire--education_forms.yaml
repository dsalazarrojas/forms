        hint: null
        type: text
        options: []
        required: false
      - id: 13
        name: favorite_book_or_movie
        label: What is a favorite book, movie, or game you enjoyed recently?
        hint: null
        type: text
        options: []
        required: false
      - id: 14
        name: goal_for_this_year
        label: What is one goal you have for yourself this school year?
        hint: null
        type: text
        options: []
        required: true
      - id: 15
        name: teacher_help_preference
        label: What can I do as your teacher to help you succeed?
        hint: null
        type: text
        options: []
        required: false
      - id: 16
        name: something_unique_about_me
        label: Tell me one unique thing about you that I should know!
        hint: null
        type: text
        options: []
        required: false
      - id: 17
        name: questionnaire_date
        label: Date
        hint: null
        type: date
        options: []
        required: true
