inputSchema:
  type: object
  properties:
    title: Beginning Of The Year Student Questionnaire
    pages:
      - id: 1
        name: section_getting_to_know_you
        label: -- Getting To Know You --
        hint: Welcome to our class! Please share a bit about yourself.
        type: note
        options: []
        required: false
      - id: 2
        name: student_preferred_name
        label: What name do you like to be called?
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: pronouns_optional
        label: What are your preferred pronouns?
        hint: null
        type: text
        options: []
        required: false
      - id: 4
        name: three_words_describe_me
        label: What are three words that describe you?
        hint: null
        type: text
        options: []
        required: true
      - id: 5
        name: favorite_subject_school
        label: What is your favorite subject in school?
        hint: null
        type: select_one
        options:
          - Math
          - Science
          - English / Language Arts
          - Social Studies / History
          - Art / Music
          - Physical Education
          - Other
        required: true
      - id: 6
        name: subject_least_favorite
        label: What is your least favorite subject?
        hint: null
        type: select_one
        options:
          - Math
          - Science
          - English / Language Arts
          - Social Studies / History
          - Art / Music
          - Physical Education
          - Other
        required: true
      - id: 7
        name: section_learning_preferences
        label: -- How You Learn Best --
        hint: null
        type: note
        options: []
        required: false
      - id: 8
        name: preferred_learning_style
        label: How do you learn best?
        hint: Select all that apply
        type: select_multiple
        options:
          - Watching / Visuals
          - Listening / Discussions
          - Reading / Writing
          - Doing / Hands-on activities
          - Working alone
          - Working in groups
        required: true
      - id: 9
        name: classroom_seating_preference
        label: Where do you feel most focused in the classroom?
        hint: null
        type: select_one
        options:
          - Near the front
          - Near the back
          - Near a window
          - In a quiet corner
          - No preference
        required: false
      - id: 10
        name: homework_comfort_level
        label: How do you feel about homework?
        hint: null
        type: select_one
        options:
          - I usually get it done quickly
          - I try but sometimes need help
          - It is often very difficult for me
          - I find it hard to find time at home
        required: true
      - id: 11
        name: section_interests_and_goals
        label: -- Interests and Goals --
        hint: null
        type: note
        options: []
