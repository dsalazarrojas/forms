inputSchema:
  type: object
  properties:
    title: EMT Clinical Evaluation Form
    pages:
    - id: 1
      name: patient_info
      label: Patient Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_history_conditions
      label: Medical History Conditions
      hint: null
      type: select_multiple
      options:
      - Hypertension
      - Diabetes
      - Asthma
      - Cancer
      required: false
    - id: 4
      name: vital_signs
      label: Vital Signs
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: medical_history_allergies
      label: Medical History Allergies
      hint: null
      type: select_multiple
      options:
      - Penicillin
      - Erythromycin
      - Polypeptides
      required: false
    - id: 6
      name: medical_history_surgeries
      label: Medical History Surgeries
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: medical_history_falls
      label: Medical History Falls
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: medical_history_injuries
      label: Medical History Injuries
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: medical_history_other
      label: Medical History Other
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: medications
      label: Medications
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: medical_history_medical_device
      label: Medical History Medical Device
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: medical_history_other_medical_device
      label: Medical History Other Medical Device
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: medical_history_other_other
      label: Medical History Other Other
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
