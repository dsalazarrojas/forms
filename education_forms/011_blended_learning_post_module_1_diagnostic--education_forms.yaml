inputSchema:
  type: object
  properties:
    title: Blended Learning Post Module 1 Diagnostic
    pages:
    - id: 1
      name: student_info_header
      label: -- Student Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: student_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: diagnostic_header
      label: -- Module 1 Diagnostic Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: understanding_level
      label: How would you rate your understanding of Module 1?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: mastered_topics
      label: Which topics did you master in Module 1?
      hint: Select all that apply
      type: select_multiple
      options:
      - Introduction to Blended Learning
      - Online vs Offline Integration
      - Student Engagement Strategies
      - Assessment Tools
      required: true
    - id: 8
      name: challenging_concepts
      label: Which concept from Module 1 was most challenging for you?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: resource_usage
      label: Did you utilize all provided online resources for Module 1?
      hint: null
      type: select_one
      options:
      - Yes - All of them
      - Most of them
      - Only a few
      - None
      required: true
    - id: 10
      name: instructor_feedback
      label: Any feedback for the instructor regarding Module 1?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: module_study_hours
      label: Approximately how many hours did you spend on this module?
      hint: Enter a whole number
      type: number
      options: []
      required: true
    - id: 12
      name: completion_date
      label: Date of Completion
      hint: null
      type: date
      options: []
      required: true
