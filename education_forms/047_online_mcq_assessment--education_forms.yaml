inputSchema:
  type: object
  properties:
    title: Online MCQ Assessment
    pages:
    - id: 1
      name: question_1
      label: What is your age?
      hint: null
      type: select_one
      options:
      - a. 18-24
      - b. 25-34
      - c. 35-44
      - d. 45-54
      required: false
    - id: 2
      name: question_2
      label: What is your educational background?
      hint: null
      type: select_one
      options:
      - a. High school
      - b. Bachelor's degree
      - c. Master's degree
      - d. Doctoral degree
      required: false
    - id: 3
      name: question_3
      label: How would you rate your computer skills?
      hint: null
      type: select_one
      options:
      - a. Beginner
      - b. Intermediate
      - c. Advanced
      required: false
    - id: 4
      name: question_4
      label: What is your primary language spoken at home?
      hint: null
      type: select_multiple
      options:
      - a. English
      - b. Other (please specify)
      required: false
    - id: 5
      name: question_5
      label: How many hours do you spend online daily?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: question_6
      label: What is your preferred time of day for online activities?
      hint: null
      type: select_one
      options:
      - a. Morning
      - b. Afternoon
      - c. Evening
      - d. Anytime
      required: false
    - id: 7
      name: question_7
      label: Do you agree or disagree with the following statement?
      hint: null
      type: select_one
      options:
      - a. Yes
      - b. No
      required: false
    - id: 8
      name: question_8
      label: What is your preferred mode of communication for online interactions?
      hint: null
      type: select_multiple
      options:
      - a. Email
      - b. Phone call
      - c. Video call
      - d. Social media
      required: false
    - id: 9
      name: question_9
      label: How would you rate your experience with online learning platforms?
      hint: null
      type: select_one
      options:
      - a. Very good
      - b. Good
      - c. Average
      - d. Poor
      required: false
    - id: 10
      name: question_10
      label: What is your level of satisfaction with the current online learning platform?
      hint: null
      type: select_one
      options:
      - a. Very satisfied
      - b. Satisfied
      - c. Neutral
      - d. Dissatisfied
      required: false
    - id: 11
      name: question_11
      label: How often do you use online resources for learning?
      hint: null
      type: select_one
      options:
      - a. Frequently
      - b. Occasionally
      - c. Rarely
      - d. Never
      required: false
    - id: 12
      name: question_12
      label: How would you rate your ability to find relevant online content?
      hint: null
      type: select_one
      options:
      - a. Very good
      - b. Good
      - c. Average
      - d. Poor
      required: false
    - id: 13
      name: question_13
      label: What is your preferred device for online activities?
      hint: null
      type: select_one
      options:
      - a. Laptop
      - b. Smartphone
      - c. Tablet
      - d. Other (please specify)
      required: false
