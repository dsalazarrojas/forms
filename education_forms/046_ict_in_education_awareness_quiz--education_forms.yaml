inputSchema:
  type: object
  properties:
    title: ICT In Education Awareness Quiz
    pages:
    - id: 1
      name: quiz_name
      label: ICT Awareness Quiz
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: quiz_type
      label: Quiz Type
      hint: null
      type: select_one
      options:
      - ICT Awareness
      - Digital Literacy
      - Technology Integration
      required: true
    - id: 6
      name: questions_1
      label: What is the primary purpose of ICT in education?
      hint: null
      type: select_one
      options:
      - Improve student engagement and motivation
      - Enhance learning outcomes
      - Both A and B
      - Other
      required: true
    - id: 7
      name: questions_2
      label: Which of the following are the main benefits of ICT in education?
      hint: null
      type: select_multiple
      options:
      - Improve access to information
      - Increase collaboration
      - Enhance assessment and feedback
      - All of the above
      required: true
    - id: 8
      name: questions_3
      label: What are some common barriers to adopting ICT in education?
      hint: null
      type: select_multiple
      options:
      - Lack of funding
      - Insufficient infrastructure
      - Limited resources
      - Other
      required: true
    - id: 9
      name: questions_4
      label: Which of the following best describe the role of teachers in the ICT-rich
        classroom?
      hint: null
      type: select_multiple
      options:
      - Facilitators of learning
      - Managers of technology
      - Both A and B
      - Other
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
