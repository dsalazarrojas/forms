inputSchema:
  type: object
  properties:
    title: School Admission Enquiry Form
    pages:
    - id: 1
      name: school_id
      label: School ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: course
      label: Course
      hint: null
      type: select_one
      options:
      - 10th
      - 11th
      - 12th
      - Diploma
      - Other
      required: true
    - id: 7
      name: school_type
      label: School Type
      hint: null
      type: select_one
      options:
      - Public
      - Private
      - Government
      - Other
      required: false
    - id: 8
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: enquiry_type
      label: Type of Enquiry
      hint: null
      type: select_multiple
      options:
      - General Enquiry
      - Admission Enquiry
      - Scholarship Enquiry
      - Other
      required: true
