inputSchema:
  type: object
  properties:
    title: Faculty Acceptance Form
    pages:
    - id: 1
      name: faculty_acceptance_form
      label: faculty_acceptance_form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: job_title
      label: Job Title
      hint: null
      type: select_one
      options:
      - Associate Professor
      - Assistant Professor
      - Lecturer
      - Full Professor
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - Department of Education
      - Department of Engineering
      - Department of Humanities
      required: false
    - id: 5
      name: job_start_date
      label: Job Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: job_end_date
      label: Job End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: salary
      label: Salary
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: job_classification
      label: Job Classification
      hint: null
      type: select_one
      options:
      - Faculty
      - Staff
      - Contract
      required: false
    - id: 9
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Tenure-Track
      - Non-Tenure
      - Visiting
      required: false
