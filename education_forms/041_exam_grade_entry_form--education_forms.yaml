inputSchema:
  type: object
  properties:
    title: Exam Grade Entry Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: grade_received
      label: Grade Received
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: grade_scale
      label: Grade Scale
      hint: null
      type: select_one
      options:
      - A
      - B
      - C
      - D
      - F
      required: false
    - id: 4
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: exam_date
      label: Exam Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: score_range
      label: Score Range
      hint: null
      type: select_multiple
      options:
      - Low
      - High
      - Medium
      required: false
    - id: 10
      name: grading_scale
      label: Grading Scale
      hint: null
      type: select_one
      options:
      - 0-50
      - 51-70
      - 71-85
      - 86-100
      required: false
    - id: 11
      name: final_exam_grade
      label: Final Exam Grade
      hint: null
      type: select_one
      options:
      - Not Applicable
      - Applicable
      required: false
