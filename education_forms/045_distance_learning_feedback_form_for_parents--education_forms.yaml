inputSchema:
  type: object
  properties:
    title: Distance Learning Feedback Form For Parents
    pages:
    - id: 1
      name: general_feedback
      label: Parent Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: technical_support
      label: technical-support
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: virtual_class_improvement
      label: virtual-class-improvement
      hint: null
      type: select_one
      options:
      - Video quality
      - Audio quality
      - Lag
      - Connection
      - Other (please specify)
      required: true
    - id: 4
      name: communication
      label: communication
      hint: null
      type: select_multiple
      options:
      - Response time
      - Clarity of instructions
      - Availability of materials
      required: false
    - id: 5
      name: other_areas_for_improvement
      label: other-areas-for-improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: suggestions
      label: suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: other_contact_info
      label: other-contact-info
      hint: null
      type: text
      options: []
      required: false
