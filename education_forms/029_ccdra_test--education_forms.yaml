inputSchema:
  type: object
  properties:
    title: CCDRA Member Site Test
    pages:
    - id: 1
      name: exam_intro_section
      label: -- CCDRA Professional Examination --
      hint: Please complete this test within the 60-minute time limit.
      type: note
      options: []
      required: false
    - id: 2
      name: member_full_name
      label: Member Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: ccdra_member_id
      label: CCDRA Member ID
      hint: Found on your membership card
      type: text
      options: []
      required: true
    - id: 4
      name: test_attempt_number
      label: Attempt Number
      hint: null
      type: select_one
      options:
      - First Attempt
      - Second Attempt
      required: true
    - id: 5
      name: exam_section_1
      label: -- Section 1 - Ethics and Professionalism --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: ethics_question_1
      label: Which of the following defines professional impartiality in court reporting?
      hint: Select the best answer
      type: select_one
      options:
      - Assisting one legal team with strategy
      - Maintaining neutral conduct for all parties
      - Advising the judge on witness credibility
      required: true
    - id: 7
      name: ethics_question_2
      label: How should a reporter handle an off-the-record request?
      hint: null
      type: select_one
      options:
      - Always stop immediately
      - Stop only if all parties agree
      - Continue writing regardless
      required: true
    - id: 8
      name: exam_section_2
      label: -- Section 2 - Technical Procedures --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: technical_question_1
      label: Define 'Real-time' transcription latency requirements
      hint: null
      type: select_one
      options:
      - Under 5 seconds
      - Under 2 seconds
      - Under 10 seconds
      required: true
    - id: 10
      name: technical_question_2
      label: What is the procedure for a broken equipment emergency?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: exam_section_3
      label: -- Section 3 - Legal Terminology --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: legal_term_match_1
      label: Define 'In Camera' proceedings
      hint: null
      type: select_one
      options:
      - Recorded via video camera
      - Private hearing in judge's chambers
      - Public gallery seating area
      required: true
    - id: 13
      name: legal_term_match_2
      label: Define 'Writ of Mandamus'
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: integrity_pledge
      label: I certify that I have completed this test without outside assistance
      hint: null
      type: select_one
      options:
      - I So Certify
      - Other
      required: true
    - id: 15
      name: test_submission_timestamp
      label: Date and Time of Completion
      hint: null
      type: date
      options: []
      required: true
