inputSchema:
  type: object
  properties:
    title: student_virtual_profile_display_consent_form
    pages:
    - id: 1
      name: student_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: What is your student ID?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: email
      label: What is your email address?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_confidentiality
      label: Do you want to keep your email confidential?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: student_virtual_profile_display_consent
      label: Do you consent to display your virtual profile?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: student_profile_display_preference
      label: Do you want your student profile to be displayed?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: other
      label: Is there anything else you would like to add?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date
      label: What is your date of birth?
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: What time do you prefer to be contacted?
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: email_confidentiality_duplicate
      label: Email Confidentiality Duplicate
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: profile_display_preference_duplicate
      label: Profile Display Preference Duplicate
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
