inputSchema:
  type: object
  properties:
    title: Course Transfer Application Form
    pages:
    - id: 1
      name: application_details
      label: Application Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student
      label: Student
      hint: Enter student ID or last name and first name
      type: text
      options: []
      required: false
    - id: 3
      name: course_details
      label: Course Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: current_course
      label: Current Course
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: transfer_course
      label: Transfer Course
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 6
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: confirm
      label: Confirm
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
