inputSchema:
  type: object
  properties:
    title: Science Fair Project Form
    pages:
    - id: 1
      name: experiment_name
      label: Experiment Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: project_category
      label: Project Category
      hint: null
      type: select_one
      options:
      - Biology
      - Chemistry
      - Physics
      - Mathematics
      - Other
      required: false
    - id: 4
      name: research_question
      label: Research Question
      hint: What question or problem are you trying to answer?
      type: text
      options: []
      required: false
    - id: 5
      name: methodology
      label: Methodology
      hint: A description of the methods and procedures used to conduct the research.
      type: text
      options: []
      required: false
    - id: 6
      name: results
      label: Results
      hint: A description of the data collected and any significant findings.
      type: text
      options: []
      required: false
    - id: 7
      name: conclusion
      label: Conclusion
      hint: A summary of what was learned from the research and what the implications
        might be.
      type: text
      options: []
      required: false
    - id: 8
      name: references
      label: References
      hint: List any sources or references used in the research.
      type: text
      options: []
      required: false
