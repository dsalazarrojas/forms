inputSchema:
  type: object
  properties:
    title: Student Grievance Form
    pages:
    - id: 1
      name: student_details
      label: Student Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: grievance_type
      label: Grievance Type
      hint: null
      type: select_one
      options:
      - Academic Disputes
      - Discrimination
      - Harassment
      - Other
      - Unfair Treatment
      required: false
    - id: 3
      name: date_of_incident
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_of_incident
      label: Time of Incident
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: location_of_incident
      label: Location of Incident
      hint: null
      type: text
      options: []
      required: false
