inputSchema:
  type: object
  properties:
    title: Primary School Swimming Carnival Nomination Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_grade
      label: Student Grade
      hint: null
      type: select_one
      options:
      - '3'
      - '4'
      - '5'
      - '6'
      - '7'
      - '8'
      required: true
    - id: 3
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Enter phone number
      type: text
      options: []
      required: false
    - id: 5
      name: event_date
      label: Event Date
      hint: Date of event
      type: date
      options: []
      required: false
    - id: 6
      name: event_time
      label: Event Time
      hint: Time of event
      type: time
      options: []
      required: false
    - id: 7
      name: event_location
      label: Event Location
      hint: Venue of event
      type: text
      options: []
      required: false
    - id: 8
      name: event_details
      label: Event Details
      hint: Description of event
      type: note
      options: []
      required: false
    - id: 9
      name: teacher_email
      label: Teacher Email
      hint: Email of teacher
      type: email
      options: []
      required: false
    - id: 10
      name: teacher_phone
      label: Teacher Phone
      hint: Phone number of teacher
      type: text
      options: []
      required: false
    - id: 11
      name: teacher_name
      label: Teacher
      hint: Name of teacher
      type: text
      options: []
      required: false
    - id: 12
      name: teacher_grade
      label: Teacher Grade
      hint: Grade of teacher
      type: text
      options: []
      required: false
    - id: 13
      name: teacher_department
      label: Teacher Department
      hint: Department of teacher
      type: text
      options: []
      required: false
    - id: 14
      name: student_carnival_status
      label: Student Carnival Status
      hint: Status of students participation in the event
      type: select_multiple
      options:
      - Registered
      - Not Registered
      required: true
    - id: 15
      name: event_comments
      label: Comments
      hint: Additional comments on students participation
      type: note
      options: []
      required: false
