inputSchema:
  type: object
  properties:
    title: Internship Experience Evaluation Form
    pages:
    - id: 1
      name: first_experience
      label: First Experience
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: second_experience
      label: Second Experience
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: improvements
      label: Improvements
      hint: Provide specific ways the program could be improved.
      type: text
      options: []
      required: true
    - id: 4
      name: recommendation
      label: Recommendation
      hint: Would you recommend this internship experience to a friend?
      type: select_one
      options:
      - Yes, I recommend it
      - No, I do not recommend it
      required: true
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: internship_type
      label: Internship Type
      hint: What type of internship were you doing?
      type: select_one
      options:
      - Summer Internship
      - Co-op Program
      - Part-time Internship
      - Full-time Internship
      required: true
    - id: 7
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: supervisor
      label: Supervisor
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: duration
      label: Duration
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: hours
      label: Hours Worked
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: rating_2
      label: Rating 2
      hint: null
      type: number
      options: []
      required: true
