inputSchema:
  type: object
  properties:
    title: Campus Return Confirmation Form
    pages:
    - id: 1
      name: section_individual_info
      label: -- Individual Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: individual_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: individual_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: individual_id
      label: Student or Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: individual_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: individual_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: individual_role
      label: Role on Campus
      hint: null
      type: select_one
      options:
      - Student
      - Faculty
      - Staff
      - Visitor
      - Other
      required: true
    - id: 8
      name: individual_department
      label: Department or School
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: section_return_details
      label: -- Return Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: return_date
      label: Date of Return to Campus
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: return_time
      label: Estimated Time of Return
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: return_location
      label: Primary Location on Campus
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: return_frequency
      label: Frequency of Campus Presence
      hint: null
      type: select_one
      options:
      - Full-time (Daily)
      - Part-time (Several days a week)
      - Occasional (Weekly)
      - Rare (Monthly or less)
      required: true
    - id: 14
      name: section_housing
      label: -- Housing Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: on_campus_housing
      label: Will you live on campus
      hint: null
      type: select_one
      options:
      - true
      - false
      - Undecided
      required: true
    - id: 16
      name: housing_location
      label: Housing Location or Dorm
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: section_health_safety
      label: -- Health and Safety Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: health_screening
      label: I have completed required health screening
      hint: null
      type: select_one
      options:
      - true
      - false
      - In Progress
      required: true
    - id: 19
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      - Prefer not to say
      required: true
    - id: 20
      name: testing_willingness
      label: Willing to participate in health testing if required
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 21
      name: section_accommodations
      label: -- Special Accommodations --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: medical_accommodations
      label: Medical or Accessibility Accommodations Needed
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: dietary_accommodations
      label: Dietary Restrictions or Accommodations
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: section_confirmation
      label: -- Return Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: return_confirmed
      label: I confirm my return to campus on the specified date
      hint: null
      type: select_one
      options:
      - Yes, I confirm
      - false
      - Tentative
      required: true
