      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: amount_donated
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: purpose_donated
      label: Purpose of Donation
      hint: null
