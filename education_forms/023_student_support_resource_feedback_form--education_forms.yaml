inputSchema:
  type: object
  properties:
    title: Student Support Resource Feedback Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_name
      label: Service Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: service_quality
      label: Service Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: student_satisfaction
      label: Student Satisfaction
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 6
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: submitted
      label: Submitted
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
