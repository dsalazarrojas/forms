inputSchema:
  type: object
  properties:
    title: Online Course Payment Form
    pages:
    - id: 1
      name: course_title
      label: Course Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_price
      label: Price
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: course_description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: instructor_email
      label: Instructor Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Card Number
      - Card Expiration Date
      - Card Security Code
      - Card Type
      required: false
    - id: 7
      name: payment_method_type
      label: Type
      hint: null
      type: select_one
      options:
      - Credit
      - Debit
      - Other
      required: false
    - id: 8
      name: payment_method_card_details
      label: Card Details
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: payment_method_other_type
      label: Other Type
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
