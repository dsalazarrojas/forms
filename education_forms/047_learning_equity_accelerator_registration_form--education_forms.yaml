      label: What is your title in the form?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: contact_terms_conditions
      label: Have you read and agreed to the terms and conditions?
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: contact_further_comments
      label: What are your further comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: contact_privacy
      label: Do you have any comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: contact_agreed_terms
      label: What is your agreement status with the terms and conditions?
      hint: null
      type: radio
      options:
      - Agreed
      - Not Agreed
      required: false
