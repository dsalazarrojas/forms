inputSchema:
  type: object
  properties:
    title: Learning Equity Accelerator Registration Form
    pages:
    - id: 1
      name: contact_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: organization_name
      label: What is your organization name?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: role_in_organization
      label: What is your role in the organization?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_address
      label: What is your address?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_state
      label: What is your state?
      hint: null
      type: select_one
      options:
      - Alabama
      - Alaska
      - Arizona
      - Arkansas
      - California
      - Colorado
      - Connecticut
      - Delaware
      - District of Columbia
      - Florida
      - Georgia
      - Hawaii
      - Idaho
      - Illinois
      - Indiana
      - Iowa
      - Kansas
      - Kentucky
      - Louisiana
      - Maine
      - Maryland
      - Massachusetts
      - Michigan
      - Minnesota
      - Mississippi
      - Missouri
      - Montana
      - Nebraska
      - Nevada
      - New Hampshire
      - New Jersey
      - New Mexico
      - New York
      - North Carolina
      - North Dakota
      - Ohio
      - Oklahoma
      - Oregon
      - Pennsylvania
      - Rhode Island
      - South Carolina
      - South Dakota
      - Tennessee
      - Texas
      - Utah
      - Vermont
      - Virginia
      - Washington
      - West Virginia
      - Wisconsin
      - Wyoming
      required: false
    - id: 6
      name: contact_country
      label: What is your country?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: contact_preferences
      label: What type of information do you want to be contacted with (email, phone,
        mail)?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Mail
      required: false
    - id: 8
      name: contact_comments
      label: What are your comments?
      hint: null
      type: text
      options: []
