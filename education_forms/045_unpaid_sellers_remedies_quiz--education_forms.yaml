inputSchema:
  type: object
  properties:
    title: Unpaid Sellers Remedies Quiz
    pages:
    - id: 1
      name: introduction
      label: Sellers Remedies Quiz
      hint: Welcome to the Sellers Remedies Quiz!
      type: note
      options: []
      required: false
    - id: 2
      name: product_details
      label: What is your product?
      hint: Please provide product details.
      type: text
      options: []
      required: false
    - id: 3
      name: seller_experiences
      label: What do you do to overcome common selling challenges?
      hint: Please provide your experiences.
      type: text
      options: []
      required: false
    - id: 4
      name: remedies
      label: What remedies do you use to overcome common selling challenges?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: additional_information
      label: Do you have any additional information about your selling process?
      hint: Please provide any additional information.
      type: text
      options: []
      required: false
    - id: 6
      name: remedies_effectiveness
      label: How effective are the remedies you use?
      hint: Please rate the effectiveness of your remedies.
      type: number
      options: []
      required: false
    - id: 7
      name: challenge_overcome
      label: Which challenge have you overcome using your remedies?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 8
      name: additional_tips
      label: Do you have any additional tips for selling?
      hint: Please provide any additional tips.
      type: text
      options: []
      required: false
    - id: 9
      name: remedies_cost
      label: What is the cost of your remedies?
      hint: Please provide the cost.
      type: number
      options: []
      required: false
    - id: 10
      name: remedies_time
      label: How long do you spend on remedies?
      hint: Please provide the time.
      type: time
      options: []
      required: false
    - id: 11
      name: remedies_results
      label: What results do you get from your remedies?
      hint: Please provide results.
      type: text
      options: []
      required: false
    - id: 12
      name: quiz_end
      label: Thank you for taking the quiz!
      hint: You have completed the Sellers Remedies Quiz.
      type: note
      options: []
      required: false
    - id: 13
      name: additional_questions
      label: Do you have any additional questions about the quiz?
      hint: Please ask your questions.
      type: text
      options: []
      required: false
    - id: 14
      name: feedback
      label: Can you provide feedback about the quiz?
      hint: Please provide feedback.
      type: text
      options: []
      required: false
    - id: 15
      name: suggestions
      label: Do you have any suggestions for future quizzes?
      hint: Please provide suggestions.
      type: text
      options: []
      required: false
    - id: 16
      name: conclusion
      label: Thank you again for taking the quiz!
      hint: Conclusion.
      type: note
      options: []
      required: false
    - id: 17
      name: follow_up_questions
      label: Do you have any follow-up questions?
      hint: Please provide questions.
      type: text
      options: []
      required: false
    - id: 18
      name: additional_comments
      label: Do you have any additional comments?
      hint: Please provide comments.
      type: text
      options: []
      required: false
