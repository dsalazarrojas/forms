inputSchema:
  type: object
  properties:
    title: Class Media Center Visit Schedule
    pages:
    - id: 1
      name: teacher_name
      label: Teacher Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: School email
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 4
      name: grade_level
      label: Grade Level
      hint: Your class grade
      type: select_one
      options:
      - Kindergarten
      - Grade 1
      - Grade 2
      - Grade 3
      - Grade 4
      - Grade 5
      - Grade 6
      - Grade 7
      - Grade 8
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      required: true
    - id: 5
      name: class_name
      label: Class Name or Subject
      hint: e.g. English 101
      type: text
      options: []
      required: true
    - id: 6
      name: number_of_students
      label: Number of Students
      hint: Expected attendance
      type: number
      options: []
      required: true
    - id: 7
      name: number_of_chaperones
      label: Number of Chaperones
      hint: Additional adults
      type: number
      options: []
      required: false
    - id: 8
      name: preferred_date
      label: Preferred Visit Date
      hint: First choice
      type: date
      options: []
      required: true
    - id: 9
      name: preferred_time
      label: Preferred Time
      hint: Start time
      type: time
      options: []
      required: true
    - id: 10
      name: visit_duration
      label: Expected Duration
      hint: How long will you stay
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 1.5 hours
      - 2 hours
      - Full class period
      required: true
    - id: 11
      name: alternative_date
      label: Alternative Date
      hint: Second choice
      type: date
      options: []
      required: false
    - id: 12
      name: visit_purpose
      label: Purpose of Visit
      hint: Why are you visiting
      type: select_one
      options:
      - Book checkout
      - Research project
      - Story time
      - Library orientation
      - Computer lab use
      - Reading time
      - Special program
      - Other
      required: true
    - id: 13
      name: activities_planned
      label: Planned Activities
      hint: What will students do
      type: text
      options: []
      required: true
    - id: 14
      name: special_needs
      label: Are There Special Needs or Accommodations
      hint: For any students
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: special_needs_details
      label: Please Describe Special Needs
      hint: If yes, provide details
      type: text
      options: []
      required: false
    - id: 16
      name: technology_needed
      label: Will You Need Technology Resources
      hint: Computers, tablets, projectors
      type: select_one
      options:
      - Yes, computers
      - Yes, tablets
      - Yes, projector
      - Yes, multiple resources
      - No technology needed
      required: true
    - id: 17
      name: books_needed
      label: Will You Need Specific Books or Materials
      hint: From the library
      type: select_one
      options:
      - Yes, fiction books
      - Yes, non-fiction books
      - Yes, reference materials
      - Yes, specific titles
      - No specific materials needed
      required: true
    - id: 18
      name: book_titles
      label: List Specific Titles or Topics
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 19
      name: librarian_assistance
      label: Will You Need Librarian Assistance
      hint: During your visit
      type: select_one
      options:
      - Yes, full assistance
      - Yes, partial assistance
      - No, we are self-sufficient
      required: true
    - id: 20
      name: assistance_details
      label: Describe Assistance Needed
      hint: If yes, what kind
      type: text
      options: []
      required: false
    - id: 21
      name: previous_visits
      label: Has Your Class Visited Before
      hint: This school year
      type: select_one
      options:
      - Yes, multiple times
      - Yes, once
      - No, first visit
      required: true
    - id: 22
      name: additional_comments
      label: Additional Comments or Requests
      hint: Any other information
      type: text
      options: []
      required: false
