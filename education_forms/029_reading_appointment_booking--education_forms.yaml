inputSchema:
  type: object
  properties:
    title: reading_appointment_booking
    pages:
    - id: 1
      name: session_request
      label: Session Request
      hint: Briefly describe your reading request
      type: text
      options: []
      required: true
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_age
      label: Student Age
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: parent_permission
      label: Parent Permission
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: student_grade
      label: Student Grade
      hint: null
      type: select_multiple
      options:
      - 1-2
      - 3-4
      - 5-6
      - 7-8
      - 9-12
      - High School
      - Other (please specify)
      required: false
    - id: 8
      name: preferred_time
      label: Preferred Time
      hint: 09:00 AM-06:00 PM
      type: time
      options: []
      required: false
    - id: 9
      name: reader_name
      label: Reader Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: reader_phone
      label: Reader Name
      hint: null
      type: text
      options: []
      required: false
