inputSchema:
  type: object
  properties:
    title: Graduate Student Application Form
    pages:
    - id: 1
      name: personal_details
      label: Personal Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: academic_history
      label: Academic History
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: education_background
      label: Education Background
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: application_form
      label: Application Form
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_status
      label: Student Status
      hint: null
      type: select_one
      options:
      - In Progress
      - Completed
      - Deferred
      - Denied
      required: false
    - id: 7
      name: program_selection
      label: Program Selection
      hint: Select all programs that apply
      type: select_multiple
      options:
      - Master
      - PhD
      - Certificate
      required: false
    - id: 8
      name: degree_selection
      label: Degree Selection
      hint: null
      type: select_one
      options:
      - Bachelor
      - Master
      - Doctoral
      required: false
    - id: 9
      name: application_status
      label: Application Status
      hint: null
      type: select_one
      options:
      - In Progress
      - Completed
      - Withdrawn
      required: false
    - id: 10
      name: submit_application
      label: Submit Application
      hint: Submit your application to be reviewed
      type: select_one
      options:
      - Submit
      - Save for Later
      - Cancel
      required: false
    - id: 11
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: date_of_application
      label: Date of Application
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: date_of_entry
      label: Date of Entry
      hint: null
      type: date
      options: []
      required: false
