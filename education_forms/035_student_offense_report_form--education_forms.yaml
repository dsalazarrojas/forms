      name: offense_grade
      label: Offense Grade
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 6
      name: action_taken
      label: Actions Taken
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: conversation_summary
      label: Conversation Summary
      hint: Summary of conversation with guardian
      type: text
      options: []
      required: false
    - id: 8
      name: student_signature
      label: Student Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: guardian_signature
      label: Guardian Signature
      hint: null
      type: text
      options: []
      required: false
