inputSchema:
  type: object
  properties:
    title: Student Offense Report Form
    pages:
    - id: 1
      name: student_information
      label: Student Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: offense_details
      label: Offense Details
