inputSchema:
  type: object
  properties:
    title: Medical Academy Admission Form
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: medical_specialty
      label: Medical Specialty
      hint: null
      type: select_one
      options:
      - Cardiology
      - Dermatology
      - Endocrinology
      - Gastroenterology
      required: false
    - id: 7
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: specialty_preference
      label: Preferred Specialty
      hint: null
      type: select_one
      options:
      - Cardiology
      - Dermatology
      - Endocrinology
      - Gastroenterology
      required: false
    - id: 9
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: consent
      label: Consent
      hint: null
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: false
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
