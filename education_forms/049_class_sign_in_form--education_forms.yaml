inputSchema:
  type: object
  properties:
    title: Class Sign In Form
    pages:
    - id: 1
      name: student_header
      label: -- Student Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: class_info_header
      label: -- Class Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: class_name
      label: Class Name or Section
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: class_date
      label: Class Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: class_time
      label: Class Time
      hint: When the class started
      type: time
      options: []
      required: true
    - id: 10
      name: attendance_header
      label: -- Attendance Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: arrival_time
      label: Time of Arrival
      hint: Actual time you arrived
      type: time
      options: []
      required: true
    - id: 12
      name: attendance_status
      label: Attendance Status
      hint: null
      type: select_one
      options:
      - Present
      - Late arrival
      - Left early
      - Excused absence
      - Unexcused absence
      required: true
    - id: 13
      name: departure_time
      label: Time of Departure
      hint: If applicable
      type: time
      options: []
      required: false
    - id: 14
      name: participation_header
      label: -- Participation and Engagement --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: participation_level
      label: Level of Participation
      hint: null
      type: select_one
      options:
      - Active participation
      - Moderate participation
      - Minimal participation
      - Did not participate
      - Not applicable
      required: false
    - id: 16
      name: equipment_access
      label: Had access to required technology and equipment
      hint: For online or hybrid classes
      type: select_one
      options:
      - 'True'
      - Partial
      - 'False'
      - Not applicable
      required: false
    - id: 17
      name: notes_header
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: reason_if_late
      label: Reason for Late Arrival
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 19
      name: reason_if_absent
      label: Reason for Absence or Early Departure
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 20
      name: special_notes
      label: Special Notes or Comments
      hint: Any issues or concerns
      type: text
      options: []
      required: false
    - id: 21
      name: health_status
      label: Health and Wellness Status
      hint: Feeling well, any concerns
      type: text
      options: []
      required: false
    - id: 22
      name: acknowledgment
      label: I confirm this attendance information is accurate
      hint: null
      type: select_one
      options:
      - Yes, confirmed
      - 'False'
      required: true
