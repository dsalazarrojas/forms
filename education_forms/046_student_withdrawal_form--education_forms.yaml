inputSchema:
  type: object
  properties:
    title: Student Withdrawal Form
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: course_id
      label: Course ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: reason_for_withdrawal
      label: Reason For Withdrawal
      hint: null
      type: select_one
      options:
      - Financial reasons
      - Academic reasons
      - Other
      required: false
    - id: 4
      name: date_of_withdrawal
      label: Date Of Withdrawal
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
