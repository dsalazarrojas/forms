inputSchema:
  type: object
  properties:
    title: Student ID Card Registration Form
    pages:
    - id: 1
      name: student_id_card_type
      label: Student ID Card Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: student_id_number
      label: Student ID Number
      hint: Enter a unique ID number
      type: number
      options: []
      required: false
    - id: 3
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: student_email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 5
      name: student_phone
      label: Phone
      hint: Enter a phone number
      type: text
      options: []
      required: false
    - id: 6
      name: student_birthdate
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 7
      name: student_photo
      label: Student Photo
      hint: null
      type: text
      options: []
      required: false
