inputSchema:
  type: object
  properties:
    title: SI Units Quiz
    pages:
    - id: 1
      name: base_units
      label: base-units
      hint: null
      type: select_multiple
      options:
      - Meter
      - Kilogram
      - Ampere
      - Kelvin
      - Siemens
      - Candela
      - Rattus
      - Radian
      - Steradian
      - Simension
      - Mole
      - Farad
      - Weber
      - Coulomb
      - Sieve
      required: false
    - id: 2
      name: derived_units
      label: derived-units
      hint: null
      type: select_multiple
      options:
      - Joule
      - Newton
      - Watt
      - Hertz
      - Tesla
      - Ampere per Meter
      - Farad per Meter
      - Radian per Second
      - Steradian per Meter
      - Mole per cubic Meter
      - Kelvin per Kelvin
      - Meters per Second
      - Ampere per Cubic Meter
      required: false
    - id: 3
      name: unit_symbols
      label: unit-symbols
      hint: null
      type: select_multiple
      options:
      - kg
      - m
      - kg/m
      - A
      - °C
      - s
      - A/m
      - V
      - A·m
      - rad
      - s/m
      - m/s
      - rad/s
      - V/m
      - A·C/m
      - rad/m
      required: false
    - id: 4
      name: prefixes
      label: prefixes
      hint: null
      type: select_multiple
      options:
      - mega
      - giga
      - micro
      - kilo
      - centi
      - mili
      - deci
      - deca
      required: false
    - id: 5
      name: base_si_unit
      label: base-si-unit
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: derived_si_unit
      label: derived-si-unit
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: si_prefix
      label: si-prefix
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: si_symbol
      label: si-symbol
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: derived_units2
      label: derived-units2
      hint: null
      type: select_multiple
      options:
      - Ampere
      - Ampere per Meter
      - A/m
      - A·m/m
      required: false
    - id: 10
      name: base_symbols
      label: base-symbols
      hint: null
      type: select_multiple
      options:
      - m
      - kg
      - A
      - kg/m
      - °C
      required: false
    - id: 11
      name: si_base_quantity
      label: si-base-quantity
      hint: null
      type: text
      options: []
      required: false
