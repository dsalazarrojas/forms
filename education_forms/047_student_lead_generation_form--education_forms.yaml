inputSchema:
  type: object
  properties:
    title: Student Lead Generation Form
    pages:
    - id: 1
      name: student_name
      label: student_name
      hint: Student Name
      type: text
      options: []
      required: false
    - id: 2
      name: contact_number
      label: contact_number
      hint: Contact Number
      type: text
      options: []
      required: false
    - id: 3
      name: email
