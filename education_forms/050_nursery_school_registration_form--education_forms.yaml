inputSchema:
  type: object
  properties:
    title: Nursery School Registration Form
    pages:
    - id: 1
      name: child_name
      label: Child Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: address
      label: home_address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: parent_name
      label: parent_name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_number
      label: contact_number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: date_of_birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: birthplace
      label: birthplace
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: school_name
      label: school_name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: grade_level
      label: grade_level
      hint: Grade Level (e.g. Pre-K)
      type: select_one
      options:
      - Preschool
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      required: true
    - id: 9
      name: start_date
      label: start_date
      hint: Enrollment Date
      type: date
      options: []
      required: false
    - id: 10
      name: end_date
      label: end_date
      hint: Graduation Date
      type: date
      options: []
      required: false
    - id: 11
      name: notes
      label: notes
      hint: Additional comments
      type: note
      options: []
      required: false
