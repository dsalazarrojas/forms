inputSchema:
  type: object
  properties:
    title: Educational Grant Application Form
    pages:
    - id: 1
      name: applicant_info
      label: Applicant Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: institution_info
      label: Institution Info
      hint: null
      type: text
      options: []
      required: false
