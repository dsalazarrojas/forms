inputSchema:
  type: object
  properties:
    title: School Tuition Billing Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - MasterCard
      - American Express
      required: false
    - id: 5
      name: tuition_amount
      label: Tuition Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: fee_amount
      label: Fee Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Paid
      - Pending
      - Overdue
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: payment_reference
      label: Payment Reference
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
