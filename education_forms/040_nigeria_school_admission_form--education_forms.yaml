inputSchema:
  type: object
  properties:
    title: Nigeria School Admission Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: parent_contact_number
      label: Parent Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: student_address
      label: Student Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: student_class
      label: Student Class
      hint: null
      type: select_one
      options:
      - S1
      - S2
      - S3
      - S4
      - S5
      required: true
    - id: 8
      name: student_school
      label: Student School
      hint: null
      type: select_multiple
      options:
      - Loris
      - Nuru
      - Saka
      - Akin
      - Oloye
      required: true
    - id: 9
      name: student_subject
      label: Student Subject
      hint: null
      type: select_multiple
      options:
      - Maths
      - Science
      - English
      - History
      - Geography
      required: true
    - id: 10
      name: student_note
      label: Student Note
      hint: null
      type: note
      options: []
      required: true
