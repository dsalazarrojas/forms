inputSchema:
  type: object
  properties:
    title: Doctoral Exam Appointment Schedule
    pages:
    - id: 1
      name: exam_appointment_date
      label: Exam Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: selected_time_slots
      label: Selected Time Slots
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: faculty_name
      label: Faculty Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: exam_durations
      label: Exam Durations
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: exam_type
      label: Exam Type
      hint: null
      type: select_one
      options:
      - Type A
      - Type B
      - Type C
      required: false
