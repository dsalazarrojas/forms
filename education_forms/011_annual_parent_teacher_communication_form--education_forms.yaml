inputSchema:
  type: object
  properties:
    title: Annual Parent Teacher Communication Form
    pages:
    - id: 1
      name: parent_name
      label: Parent Name
      hint: Full name of parent or guardian
      type: text
      options: []
      required: true
    - id: 2
      name: parent_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: parent_phone
      label: Phone Number
      hint: Best contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: student_name
      label: Student Name
      hint: Full name of student
      type: text
      options: []
      required: true
    - id: 5
      name: student_grade
      label: Student Grade Level
      hint: null
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - Middle School
      - High School
      required: true
    - id: 6
      name: teacher_name
      label: Teacher Name
      hint: Name of student's teacher
      type: text
      options: []
      required: true
    - id: 7
      name: school_year
      label: School Year
      hint: E.g., 2024-2025
      type: text
      options: []
      required: false
    - id: 8
      name: communication_frequency
      label: Preferred communication frequency
      hint: How often would you like updates
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-weekly
      - Monthly
      - As needed
      required: true
    - id: 9
      name: preferred_contact_method
      label: Preferred contact method
      hint: null
      type: select_one
      options:
      - Email
      - Phone call
      - Text message
      - In-person meeting
      - School portal
      - No preference
      required: true
    - id: 10
      name: academic_progress
      label: Rate student's academic progress
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Needs improvement
      - Struggling
      required: true
    - id: 11
      name: behavioral_concerns
      label: Are there behavioral concerns
      hint: null
      type: select_one
      options:
      - No concerns
      - Minor concerns
      - Moderate concerns
      - Significant concerns
      required: true
    - id: 12
      name: behavioral_details
      label: Details about behavioral concerns
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 13
      name: social_development
      label: Rate student's social development
      hint: Interactions with peers
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Needs improvement
      - Struggling
      required: true
    - id: 14
      name: classroom_participation
      label: Rate student's classroom participation
      hint: Engagement and involvement
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Minimal
      - Not participating
      required: true
    - id: 15
      name: homework_completion
      label: Homework completion rate
      hint: null
      type: select_one
      options:
      - Always completes
      - Usually completes
      - Sometimes completes
      - Rarely completes
      - Never completes
      required: true
    - id: 16
      name: parent_concerns
      label: Parent concerns or questions
      hint: Anything you want to discuss
      type: text
      options: []
      required: false
    - id: 17
      name: home_support
      label: Student receives adequate support at home
      hint: null
      type: select_one
      options:
      - Strongly agree
      - Agree
      - Neutral
      - Disagree
      - Need support
      required: true
    - id: 18
      name: special_needs
      label: Any special learning needs
      hint: Accommodations or special services required
      type: text
      options: []
      required: false
    - id: 19
      name: meeting_request
      label: Would you like to schedule a conference meeting
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 20
      name: preferred_meeting_times
      label: Preferred meeting times
      hint: Days and times that work best
      type: text
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional comments or feedback
      hint: null
      type: text
      options: []
      required: false
