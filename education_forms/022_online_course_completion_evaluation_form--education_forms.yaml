inputSchema:
  type: object
  properties:
    title: online_course_completion_evaluation_form
    pages:
    - id: 1
      name: intro
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_effectiveness
      label: How would you rate the effectiveness of this course?
      hint: null
      type: select_one
      options:
      - Highly effective
      - Somewhat effective
      - Not very effective
      - Not at all effective
      required: true
    - id: 3
      name: instructor_support
      label: How would you rate the support received from the instructor?
      hint: null
      type: select_one
      options:
      - Highly supportive
      - Somewhat supportive
      - Not very supportive
      - Not at all supportive
      required: true
    - id: 4
      name: overall_experience
      label: Overall, how would you rate your experience with this course?
      hint: null
      type: select_one
      options:
      - Highly satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Highly dissatisfied
      required: true
    - id: 5
      name: recommend
      label: Would you recommend this course to a friend or colleague?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: feedback
      label: Any additional feedback about the course?
      hint: Please provide any comments or suggestions about the course.
      type: text
      options: []
      required: true
