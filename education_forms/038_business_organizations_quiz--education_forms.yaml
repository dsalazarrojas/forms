inputSchema:
  type: object
  properties:
    title: Business Organizations Quiz
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: Your student identification number
      type: text
      options: []
      required: true
    - id: 3
      name: course_name
      label: Course Name
      hint: Name of course
      type: text
      options: []
      required: true
    - id: 4
      name: quiz_date
      label: Quiz Date
      hint: Date of quiz submission
      type: date
      options: []
      required: true
    - id: 5
      name: question_1
      label: Question 1 - What is a sole proprietorship
      hint: Select the best answer
      type: select_one
      options:
      - A business owned by one person
      - A business owned by multiple people
      - A corporation with one shareholder
      - A government entity
      required: true
    - id: 6
      name: question_2
      label: Question 2 - What is a key advantage of an LLC
      hint: Select the best answer
      type: select_one
      options:
      - Unlimited liability
      - Limited liability protection
      - Double taxation
      - Required board of directors
      required: true
    - id: 7
      name: question_3
      label: Question 3 - Which organization type has double taxation
      hint: Select the best answer
      type: select_one
      options:
      - Sole proprietorship
      - Partnership
      - C Corporation
      - LLC
      required: true
    - id: 8
      name: question_4
      label: Question 4 - What is a partnership
      hint: Select the best answer
      type: select_one
      options:
      - A business owned by one person
      - A business owned by two or more people
      - A non-profit organization
      - A government agency
      required: true
    - id: 9
      name: question_5
      label: Question 5 - What is the main purpose of a non-profit
      hint: Select the best answer
      type: select_one
      options:
      - Generate profit for owners
      - Serve a public or social purpose
      - Avoid all taxes
      - Operate without employees
      required: true
    - id: 10
      name: question_6
      label: Question 6 - Who owns a corporation
      hint: Select the best answer
      type: select_one
      options:
      - The CEO
      - The employees
      - The shareholders
      - The government
      required: true
    - id: 11
      name: question_7
      label: Question 7 - What is limited liability
      hint: Select the best answer
      type: select_one
      options:
      - Owners are personally responsible for all debts
      - Owners liability is limited to their investment
      - The business cannot take loans
      - The business has limited lifespan
      required: true
    - id: 12
      name: question_8
      label: Question 8 - Which is a disadvantage of a sole proprietorship
      hint: Select the best answer
      type: select_one
      options:
      - Easy to start
      - Complete control
      - Unlimited personal liability
      - Pass-through taxation
      required: true
    - id: 13
      name: question_9
      label: Question 9 - What is an S Corporation
      hint: Select the best answer
      type: select_one
      options:
      - A large public corporation
      - A corporation with special tax status
      - A sole proprietorship
      - A non-profit
      required: true
    - id: 14
      name: question_10
      label: Question 10 - What is a cooperative
      hint: Select the best answer
      type: select_one
      options:
      - A business owned and operated by members
      - A government organization
      - A type of corporation
      - A sole proprietorship
      required: true
    - id: 15
      name: question_11
      label: Question 11 - Which organization type is best for raising capital
      hint: Select the best answer
      type: select_one
      options:
      - Sole proprietorship
      - Partnership
      - Corporation
      - LLC
      required: true
    - id: 16
      name: question_12
      label: Question 12 - What is pass-through taxation
      hint: Select the best answer
      type: select_one
      options:
      - Business pays taxes separately
      - Profits pass to owners personal taxes
      - No taxes are paid
      - Taxes are deferred
      required: true
    - id: 17
      name: question_13
      label: Question 13 - Which has the most regulatory requirements
      hint: Select the best answer
      type: select_one
      options:
      - Sole proprietorship
      - Partnership
      - Corporation
      - LLC
      required: true
    - id: 18
      name: question_14
      label: Question 14 - What is a franchise
      hint: Select the best answer
      type: select_one
      options:
      - A type of partnership
      - A business using another companys model
      - A non-profit organization
      - A government entity
      required: true
    - id: 19
      name: question_15
      label: Question 15 - Which is true about LLCs
      hint: Select the best answer
      type: select_one
      options:
      - Must have at least 100 members
      - Combine features of partnerships and corporations
      - Cannot make a profit
      - Must be publicly traded
      required: true
    - id: 20
      name: confidence_level
      label: Confidence Level
      hint: How confident are you in your answers
      type: select_one
      options:
      - Very confident
      - Confident
      - Somewhat confident
      - Not confident
      required: true
    - id: 21
      name: study_time
      label: Hours Spent Studying
      hint: How many hours did you study
      type: number
      options: []
      required: false
    - id: 22
      name: additional_comments
      label: Additional Comments
      hint: Any feedback about the quiz
      type: text
      options: []
      required: false
