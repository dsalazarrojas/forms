inputSchema:
  type: object
  properties:
    title: Student Loan Assistance Request Form
    pages:
    - id: 1
      name: student_loan_assistance_request
      label: Student Loan Assistance Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: current_employment_status
      label: Current Employment Status
      hint: null
      type: select_one
      options:
      - Unemployed
      - Part-time
      - Full-time
      - Other
      required: false
    - id: 3
      name: student_loan_type
      label: Student Loan Type
      hint: null
      type: select_multiple
      options:
      - Federal Loans
      - Private Loans
      - Parent Loans
      required: false
    - id: 4
      name: annual_income
      label: Annual Income
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: loan_amount
      label: Loan Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: loan_interest_rate
      label: Loan Interest Rate
      hint: null
      type: select_one
      options:
      - '6.9'
      - '7.0'
      - Other
      required: false
    - id: 7
      name: student_loan_balance
      label: Student Loan Balance
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: loan_payment_status
      label: Loan Payment Status
      hint: null
      type: select_one
      options:
      - Making Payments
      - Behind on Payments
      - In Default
      required: false
    - id: 9
      name: loan_counseling_status
      label: Loan Counseling Status
      hint: null
      type: select_one
      options:
      - Completed
      - Incomplete
      required: false
    - id: 10
      name: annual_income_hint
      label: Annual Income Hint
      hint: Enter your annual income
      type: text
      options: []
      required: false
    - id: 11
      name: loan_payment_plan
      label: Loan Payment Plan
      hint: null
      type: select_multiple
      options:
      - Standard Repayment
      - Graduated Repayment
      - Income-Driven Repayment
      required: false
    - id: 12
      name: loan_forgiveness_option
      label: Loan Forgiveness Option
      hint: null
      type: select_multiple
      options:
      - Public Service Forgiveness
      - Teacher Forgiveness
      - Perkins Loan Forgiveness
      required: false
    - id: 13
      name: student_loan_assistance_request_2
      label: Student Loan Assistance Request 2
      hint: null
      type: text
      options: []
      required: false
