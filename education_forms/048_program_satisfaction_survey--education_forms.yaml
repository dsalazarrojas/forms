inputSchema:
  type: object
  properties:
    title: Program Satisfaction Survey
    pages:
    - id: 1
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: program_satisfaction
      label: How satisfied are you with our program?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: course_satisfaction
      label: How satisfied are you with the courses?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: communication
      label: Communication
      hint: How would you rate the communication with our team?
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Bad
      - Very Bad
      required: false
    - id: 5
      name: feedback
      label: What would you like to tell us about your experience?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date
      label: When were you in the program?
      hint: null
      type: date
      options: []
      required: false
