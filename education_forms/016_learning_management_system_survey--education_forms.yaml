inputSchema:
  type: object
  properties:
    title: Learning Management System Survey
    pages:
    - id: 1
      name: user_info
      label: User info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating
      label: Rate your experience
      hint: null
      type: select_multiple
      options:
      - Very poor
      - Poor
      - Neutral
      - Good
      - Excellent
      required: false
    - id: 3
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: contact_info
      label: Contact info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: course_enrolled
      label: Courses enrolled
      hint: null
      type: select_multiple
      options:
      - Math
      - Science
      - English
      required: false
