inputSchema:
  type: object
  properties:
    title: 2D Mensuration Quiz
    pages:
    - id: 1
      name: section_header_student_info
      label: '--- Student Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter your full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: We'll use this to send your results
      type: email
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Grade / Year level
      hint: e.g., 10th Grade, Year 4
      type: text
      options: []
      required: true
    - id: 5
      name: school_name
      label: School or institution name
      hint: Leave blank if not applicable
      type: text
      options: []
      required: false
    - id: 6
      name: subject_area
      label: Subject area
      hint: Choose the main subject you are studying
      type: select_one
      options:
      - Mathematics
      - Science
      - Language Arts
      - Social Studies
      - Arts
      - Physical Education
      - Technology
      - Other
      required: true
    - id: 7
      name: learning_style
      label: Preferred learning style
      hint: How do you learn best?
      type: select_one
      options:
      - Visual
      - Auditory
      - Reading/Writing
      - Hands-on/Kinesthetic
      required: false
    - id: 8
      name: hours_studied
      label: Average study hours per week
      hint: Enter a whole number
      type: integer
      options: []
      required: false
    - id: 9
      name: quiz_date
      label: Quiz attempt date
      hint: Select the date you completed the quiz
      type: date
      options: []
      required: true
    - id: 10
      name: quiz_attempt_number
      label: Attempt number
      hint: 1 for first attempt, 2 for second, etc.
      type: integer
      options: []
      required: false
    - id: 11
      name: total_questions
      label: Total number of questions
      hint: Number of questions in the quiz
      type: integer
      options: []
      required: false
    - id: 12
      name: questions_answered
      label: Questions answered
      hint: How many did you answer?
      type: integer
      options: []
      required: false
    - id: 13
      name: score_percentage
      label: Score (percentage)
      hint: e.g., 85.5
      type: decimal
      options: []
      required: false
    - id: 14
      name: difficulty_rating
      label: How difficult did you find the quiz?
      hint: Choose the option that best describes your experience
      type: select_one
      options:
      - Very Easy
      - Easy
      - Moderate
      - Hard
      - Very Hard
      required: false
    - id: 15
      name: section_header_feedback
      label: '--- Feedback ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: satisfaction
      label: How satisfied are you with the 2D Mensuration Quiz?
      hint: Select one
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 17
      name: challenges
      label: Main challenges faced (select all)
      hint: Leave blank if none
      type: select_multiple
      options:
      - Time management
      - Difficult material
      - Lack of resources
      - Motivation
      - Technology issues
      - Large class sizes
      required: false
    - id: 18
      name: preferred_study_time
      label: Preferred study time
      hint: When do you study most effectively?
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Night
      - Flexible
