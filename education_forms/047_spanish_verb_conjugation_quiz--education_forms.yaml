        tense?
      hint: null
      type: select_multiple
      options:
      - habló (he/she/it spoke)
      - hablamos (we speak)
      - hablan (they speak)
      - hablo (I speak)
      - hablas (you speak)
      - habla (he/she/it speaks)
      - hablábamos (we spoke)
      - hablás (you spoke)
      - hablaron (they spoke)
      required: false
