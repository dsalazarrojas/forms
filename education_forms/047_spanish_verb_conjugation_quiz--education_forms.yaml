      label: Conjugate the verb 'hablar' in the present tense.
      hint: null
      type: select_one
      options:
      - hablo (I speak)
      - hableo (I speak)
      - hablo (hablo)
      - hablo (he speaks)
      - habla (she/he/it speaks)
      required: true
