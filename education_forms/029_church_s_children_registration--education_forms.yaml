inputSchema:
  type: object
  properties:
    title: Church's Children Registration
    pages:
    - id: 1
      name: child_name
      label: Child's Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: child_nickname
      label: Child's Preferred Name
      hint: What they like to be called
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Child's Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: age
      label: Current Age
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      required: true
    - id: 6
      name: grade_level
      label: Current Grade Level
      hint: null
      type: select_one
      options:
      - Preschool
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      required: true
    - id: 7
      name: parent_name
      label: Parent/Guardian Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: parent_email
      label: Parent/Guardian Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: parent_phone
      label: Parent/Guardian Phone Number
      hint: Best contact during program
      type: text
      options: []
      required: true
    - id: 10
      name: home_address
      label: Home Address
      hint: Street, city, state, zip
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: If parent unavailable
      type: text
      options: []
      required: true
    - id: 12
      name: authorized_pickup
      label: Who Is Authorized to Pick Up Your Child
      hint: List all individuals
      type: text
      options: []
      required: true
    - id: 13
      name: program_selection
      label: Which Program Are You Registering For
      hint: Select all that apply
      type: select_multiple
      options:
      - Sunday School
      - Children's Church
      - Vacation Bible School
      - After School Program
      - Summer Camp
      - Youth Group
      - Bible Study
      - Choir
      required: true
    - id: 14
      name: allergies
      label: Does Your Child Have Any Allergies
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: allergies_detail
      label: Please Describe Allergies
      hint: Food, medication, environmental
      type: text
      options: []
      required: false
    - id: 16
      name: medical_conditions
      label: Does Your Child Have Any Medical Conditions
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: medical_conditions_detail
      label: Please Describe Medical Conditions
      hint: Include any special needs
      type: text
      options: []
      required: false
    - id: 18
      name: medications
      label: Is Your Child Taking Any Medications
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: medications_detail
      label: Please List Medications
      hint: Include dosage instructions
      type: text
      options: []
      required: false
    - id: 20
      name: behavioral_needs
      label: Any Behavioral Considerations
      hint: For caregiver awareness
      type: text
      options: []
      required: false
    - id: 21
      name: special_instructions
      label: Special Instructions for Caregivers
      hint: Comfort items, routines, etc.
      type: text
      options: []
      required: false
    - id: 22
      name: photo_release
      label: Photo Release Permission
      hint: Photos may be taken for church use
      type: select_one
      options:
      - I grant permission
      - I do not grant permission
      required: true
    - id: 23
      name: pickup_policy
      label: Pickup Policy Acknowledgment
      hint: Only authorized persons may pick up
      type: select_one
      options:
      - I understand and agree
      - I have questions
      required: true
    - id: 24
      name: parent_signature
      label: Parent/Guardian Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 25
      name: signature_date
      label: Date of Signature
      hint: null
      type: date
      options: []
      required: true
