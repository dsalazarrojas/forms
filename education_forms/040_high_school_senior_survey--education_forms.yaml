      options:
      - '{''value'': ''Class Officer''}'
      - '{''value'': ''School Organization''}'
      - '{''value'': ''Student Club''}'
      - '{''value'': ''Other''}'
      required: false
    - id: 9
      name: favorite_activities
      label: Favorite Activities
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Sports''}'
      - '{''value'': ''Clubs''}'
      - '{''value'': ''Organizations''}'
      - '{''value'': ''Other''}'
      required: false
    - id: 10
      name: student_satisfaction
      label: Student Satisfaction
      hint: null
      type: select_one
      options:
      - '{''value'': ''Very Satisfied''}'
      - '{''value'': ''Somewhat Satisfied''}'
      - '{''value'': ''Not Satisfied''}'
      required: false
