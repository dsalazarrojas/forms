inputSchema:
  type: object
  properties:
    title: University Senate Petition Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: department
      label: Department
      hint: Select one of the University departments
      type: select_one
      options:
      - '{''name'': ''Department of Education''}'
      - '{''name'': ''Department of Science''}'
      - '{''name'': ''Department of Arts''}'
      - '{''name'': ''Department of Business''}'
      required: true
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
