      name: committee_application_header
      label: -- Admissions Committee Application --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_full_name
      label: Full Name
      hint: Enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_email
      label: Email Address
      hint: Valid email for communication
      type: email
      options: []
      required: true
    - id: 4
      name: applicant_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: applicant_address
      label: Address
      hint: Current residential address
      type: text
      options: []
      required: true
    - id: 6
      name: applicant_city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 7
      name: applicant_state
      label: State/Province
      hint: State or province of residence
      type: text
      options: []
      required: true
    - id: 8
      name: applicant_zip
      label: ZIP/Postal Code
      hint: Postal code of residence
      type: text
      options: []
      required: true
    - id: 9
      name: applicant_country
      label: Country
      hint: Country of residence
      type: text
      options: []
      required: true
