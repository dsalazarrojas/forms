      hint: Email address of your first reference
      type: email
      options: []
      required: true
    - id: 27
      name: reference_1_phone
      label: Reference 1 Phone
      hint: Phone number of your first reference
      type: text
      options: []
      required: true
    - id: 28
      name: reference_2_name
      label: Reference 2 Name
      hint: Name of your second reference
      type: text
      options: []
      required: false
    - id: 29
      name: reference_2_position
      label: Reference 2 Position
      hint: Position/title of your second reference
      type: text
      options: []
      required: false
    - id: 30
      name: reference_2_email
      label: Reference 2 Email
      hint: Email address of your second reference
      type: email
      options: []
      required: false
    - id: 31
      name: reference_2_phone
      label: Reference 2 Phone
      hint: Phone number of your second reference
      type: text
      options: []
      required: false
    - id: 32
      name: application_date
      label: Application Date
      hint: Date of submitting this application
      type: date
      options: []
      required: true
    - id: 33
      name: applicant_signature
      label: Applicant Signature
      hint: Electronic signature to confirm application
      type: text
      options: []
      required: true
