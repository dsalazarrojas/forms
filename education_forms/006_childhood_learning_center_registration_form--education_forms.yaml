inputSchema:
  type: object
  properties:
    title: Childhood Learning Center Registration Form
    pages:
    - id: 1
      name: child_information
      label: -- Child Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: child_first_name
      label: Child First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: child_last_name
      label: Child Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: false
    - id: 6
      name: address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: parent_information
      label: -- Parent or Guardian Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: parent_first_name
      label: Parent First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: parent_last_name
      label: Parent Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: relationship
      label: Relationship to Child
      hint: null
      type: select_one
      options:
      - Mother
      - Father
      - Guardian
      - Other
      required: true
    - id: 14
      name: parent_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 15
      name: parent_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: enrollment_information
      label: -- Enrollment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: program_type
      label: Program Type
      hint: null
      type: select_one
      options:
      - Part-time (2-3 days)
      - Part-time (4 days)
      - Full-time (5 days)
      - Extended hours
      required: true
    - id: 18
      name: start_date
      label: Desired Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 19
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - Infants (0-12 months)
      - Toddlers (1-3 years)
      - Preschool (3-5 years)
      - Pre-K (4-5 years)
      required: true
    - id: 20
      name: special_needs
      label: Does the child have any special needs or allergies
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 21
      name: special_needs_details
      label: Please describe any special needs or allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: emergency_contact
      label: -- Emergency Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: emergency_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 24
      name: emergency_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 25
      name: emergency_relationship
      label: Relationship to Child
      hint: null
      type: text
      options: []
      required: true
