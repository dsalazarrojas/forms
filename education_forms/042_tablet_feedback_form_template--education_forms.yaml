inputSchema:
  type: object
  properties:
    title: Tablet Feedback Form Template
    pages:
    - id: 1
      name: page_one
      label: General Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: page_two
      label: Specific Feedback
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 3
      name: page_three
      label: Satisfaction
      hint: How satisfied are you with your learning experience?
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 4
      name: page_four
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: page_five
      label: Rating
      hint: Rate your overall experience on a scale from 1 to 5.
      type: number
      options: []
      required: false
    - id: 6
      name: page_six
      label: Recommendation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: page_seven
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: page_eight
      label: Page 8
      hint: null
      type: email
      options: []
      required: false
