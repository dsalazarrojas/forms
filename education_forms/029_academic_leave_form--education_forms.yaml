inputSchema:
  type: object
  properties:
    title: Academic Leave Form
    pages:
      - id: 1
        name: section_student
        label: -- Student Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: student_name
        label: Student name
        hint: Full legal name
        type: text
        options: []
        required: true
      - id: 3
        name: student_id
        label: Student identification number
        hint: University ID
        type: text
        options: []
        required: true
      - id: 4
        name: program
        label: Program or major
        hint: Degree program
        type: text
        options: []
        required: false
      - id: 5
        name: leave_type
        label: Type of leave requested
        hint: Select appropriate leave category
        type: select_one
        options:
          - Medical leave
          - Personal leave
          - Maternity or paternity leave
          - Study abroad leave
          - Other
        required: true
      - id: 6
        name: start_date
        label: Leave start date
        hint: When leave begins
        type: date
        options: []
        required: true
      - id: 7
        name: end_date
        label: Expected end date
        hint: Expected return date if known
        type: date
        options: []
        required: false
      - id: 8
        name: reason
        label: Reason for leave
        hint: Provide brief justification
        type: text
        options: []
        required: true
      - id: 9
        name: supporting_documents
        label: Supporting documents
        hint: Medical certificates or other documentation
        type: text
        options: []
        required: false
      - id: 10
        name: signature
        label: Signature name
        hint: Type full name to sign
        type: text
        options: []
        required: true
      - id: 11
        name: submission_date
        label: Submission date
        hint: Date of request submission
        type: date
        options: []
        required: true
