inputSchema:
  type: object
  properties:
    title: Letter Writing Guide
    pages:
    - id: 1
      name: purpose
      label: What is the purpose of this letter?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: recipient
      label: Who is the recipient of this letter?
      hint: null
      type: select_one
      options:
      - To whom
      - From whom
      required: true
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: salutation
      label: salutation
      hint: null
      type: select_multiple
      options:
      - Mr.
      - Ms.
      - Dr.
      - Prof.
      - Other
      required: true
    - id: 6
      name: greeting
      label: Greeting
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: body
      label: Body
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: closing
      label: Closing
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
