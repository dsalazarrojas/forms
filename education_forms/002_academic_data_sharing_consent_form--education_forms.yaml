inputSchema:
  type: object
  properties:
    title: Academic Data Sharing Consent Form
    pages:
      - id: 1
        name: section_consent_intro
        label: -- Consent and Overview --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: participant_name
        label: Participant name
        hint: Full legal name of the participant
        type: text
        options: []
        required: true
      - id: 3
        name: participant_email
        label: Participant email
        hint: Contact email for consent follow up
        type: email
        options: []
        required: true
      - id: 4
        name: institution
        label: Institution or department
        hint: Affiliated institution
        type: text
        options: []
        required: false
      - id: 5
        name: dataset_description
        label: Description of data to be shared
        hint: Brief summary of the dataset and contents
        type: text
        options: []
        required: true
      - id: 6
        name: sharing_purpose
        label: Purpose of data sharing
        hint: How the shared data will be used
        type: select_one
        options:
          - Research collaboration
          - Publication and replication
          - Teaching and training
          - Public access
          - Other
        required: true
      - id: 7
        name: consent_duration
        label: Consent duration
        hint: Period for which consent is granted
        type: select_one
        options:
          - Indefinite
          - 1 year
          - 3 years
          - Until project end
          - Other
        required: true
      - id: 8
        name: consent_restrictions
        label: Restrictions on data use
        hint: Any limitations or required approvals
        type: text
        options: []
        required: false
      - id: 9
        name: data_protection_measures
        label: Data protection measures
        hint: How personal or sensitive data will be protected
        type: text
        options: []
        required: false
      - id: 10
        name: signature_name
        label: Electronic signature name
        hint: Type full name to sign consent
        type: text
        options: []
        required: true
      - id: 11
        name: signature_date
        label: Signature date
        hint: Date of consent
        type: date
        options: []
        required: true
