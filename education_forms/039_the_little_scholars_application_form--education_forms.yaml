inputSchema:
  type: object
  properties:
    title: The Little Scholars Application Form
    pages:
    - id: 1
      name: student_name
      label: student_name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_person
      label: contact_person
      hint: null
      type: select_one
      options:
      - '{''name'': ''John''}'
      - '{''name'': ''Jane''}'
      - '{''name'': ''Other''}'
      required: false
    - id: 3
      name: date_of_birth
      label: date_of_birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: school_name
      label: school_name
      hint: null
      type: select_multiple
      options:
      - '{''name'': ''ABC School''}'
      - '{''name'': ''DEF School''}'
      - '{''name'': ''GHI School''}'
      required: true
    - id: 5
      name: address
      label: address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: parent_signature
      label: parent_signature
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: school_signature
      label: school_signature
      hint: null
      type: text
      options: []
      required: false
