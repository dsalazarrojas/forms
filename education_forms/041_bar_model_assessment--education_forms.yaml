inputSchema:
  type: object
  properties:
    title: Bar Model Assessment
    pages:
    - id: 1
      name: assessment_date
      label: Assessment Date
      hint: Date of assessment
      type: date
      options: []
      required: true
    - id: 2
      name: student_name
      label: Student Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: Student identification number
      type: text
      options: []
      required: false
    - id: 4
      name: grade_level
      label: Grade Level
      hint: What grade are you in?
      type: select_one
      options:
      - Grade 3
      - Grade 4
      - Grade 5
      - Grade 6
      - Grade 7
      - Grade 8
      - Grade 9
      - Grade 10
      required: true
    - id: 5
      name: teacher_name
      label: Teacher Name
      hint: Name of your teacher
      type: text
      options: []
      required: true
    - id: 6
      name: school_name
      label: School Name
      hint: Your school
      type: text
      options: []
      required: true
    - id: 7
      name: problem_type
      label: Type of Bar Model Problem
      hint: Select the problem category
      type: select_one
      options:
      - Part-Whole Addition
      - Part-Whole Subtraction
      - Comparison
      - Multi-Step Problem
      - Fraction Problem
      - Ratio Problem
      - Other
      required: true
    - id: 8
      name: problem_statement
      label: Original Problem Statement
      hint: Copy of the word problem
      type: text
      options: []
      required: true
    - id: 9
      name: understanding_check
      label: I Understand the Problem
      hint: Do you understand what's being asked?
      type: select_one
      options:
      - 'True'
      - Somewhat
      - 'False'
      required: true
    - id: 10
      name: bar_model_description
      label: Bar Model Description
      hint: Describe the bar model you created
      type: text
      options: []
      required: true
    - id: 11
      name: solution_method
      label: Solution Method Used
      hint: How did you solve it?
      type: select_one
      options:
      - Single Bar Unit
      - Multiple Bar Units
      - Comparison Bars
      - Fractional Bars
      - Ratio Bars
      - Multiple Steps
      required: true
    - id: 12
      name: answer_provided
      label: Final Answer
      hint: What is your solution?
      type: text
      options: []
      required: true
    - id: 13
      name: work_shown
      label: Work Shown
      hint: Describe your mathematical work
      type: text
      options: []
      required: true
    - id: 14
      name: correct_answer
      label: Is Your Answer Correct?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: false
    - id: 15
      name: strategy_effectiveness
      label: Bar Model Strategy Effectiveness
      hint: How helpful was the bar model?
      type: select_one
      options:
      - Very Helpful
      - Helpful
      - Somewhat Helpful
      - Not Helpful
      required: true
    - id: 16
      name: confidence_level
      label: Confidence in Your Solution
      hint: How confident are you?
      type: select_one
      options:
      - Very Confident
      - Confident
      - Somewhat Confident
      - Not Confident
      required: true
    - id: 17
      name: difficulty_level
      label: Difficulty Level of Problem
      hint: Rate the problem difficulty
      type: select_one
      options:
      - Easy
      - Moderate
      - Challenging
      - Very Difficult
      required: false
    - id: 18
      name: areas_needing_help
      label: Areas Where You Need Help
      hint: What was confusing?
      type: text
      options: []
      required: false
    - id: 19
      name: time_spent
      label: Time Spent on Problem (minutes)
      hint: How long did this take?
      type: number
      options: []
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other observations?
      type: text
      options: []
      required: false
