inputSchema:
  type: object
  properties:
    title: Questionnaire For Equity & Managing Diversity At Workplace
    pages:
    - id: 1
      name: survey_title
      label: Form Title
      hint: Enter a title for the form
      type: text
      options: []
      required: true
    - id: 2
      name: form_category
      label: Form Category
      hint: Select a category for the form
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: form_description
      label: Description
      hint: Enter a brief description of the form
      type: text
      options: []
      required: false
    - id: 4
      name: output_file_name
      label: Output File Name
      hint: Enter the name of the output file
      type: text
      options: []
      required: true
    - id: 5
      name: output_file_type
      label: File Type
      hint: Select the file type (e.g., PDF, CSV, etc.)
      type: select_one
      options:
      - PDF
      - CSV
      - Excel
      required: false
    - id: 6
      name: output_file_size
      label: File Size
      hint: Enter the size of the output file
      type: number
      options: []
      required: true
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: Select the tool assigned for the form
      type: select_one
      options:
      - Tool 1
      - Tool 2
      - Tool 3
      required: false
    - id: 8
      name: help_message_1
      label: Help Message 1
      hint: Enter a help message for the form
      type: text
      options: []
      required: false
    - id: 9
      name: help_message_2
      label: Help Message 2
      hint: Enter another help message for the form
      type: text
      options: []
      required: false
    - id: 10
      name: help_message_3
      label: Help Message 3
      hint: Enter additional help message for the form
      type: text
      options: []
      required: false
