inputSchema:
  type: object
  properties:
    title: After School Care Sign Out Sheet Form
    pages:
    - id: 1
      name: student_information_section
      label: Student Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_full_name
      label: Student Full Name
      hint: Enter the student's complete legal name
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: Student identification number
      type: text
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Grade Level
      hint: Current grade level of the student
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 5
      name: classroom_teacher
      label: Classroom Teacher
      hint: Name of the student's regular classroom teacher
      type: text
      options: []
      required: true
    - id: 6
      name: sign_out_date
      label: Sign Out Date
      hint: Date when the student is signing out
      type: date
      options: []
      required: true
    - id: 7
      name: sign_out_time
      label: Sign Out Time
      hint: Time when the student is signing out
      type: time
      options: []
      required: true
    - id: 8
      name: authorized_pickup_person_section
      label: Authorized Pickup Person
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: pickup_person_name
      label: Pickup Person Full Name
      hint: Full name of the person picking up the student
      type: text
      options: []
      required: true
    - id: 10
      name: pickup_person_relationship
      label: Relationship to Student
      hint: Relationship of pickup person to the student
      type: select_one
      options:
      - Parent
      - Guardian
      - Grandparent
      - Sibling
      - Aunt/Uncle
      - Family Friend
      - Babysitter
      - Other
      required: true
    - id: 11
      name: pickup_person_phone
      label: Pickup Person Phone
      hint: Phone number of the person picking up the student
      type: text
      options: []
      required: true
    - id: 12
      name: pickup_person_id
      label: Pickup Person ID
      hint: Driver's license or other ID number of pickup person
      type: text
      options: []
      required: true
    - id: 13
      name: pickup_authorization
      label: Pickup Authorization
      hint: Is this person authorized to pick up the student?
      type: select_one
      options:
      - Yes - On file
      - Yes - Special permission
      - No - Not authorized
      required: true
    - id: 14
      name: pickup_verification_section
      label: Pickup Verification
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: verification_method
      label: Verification Method
      hint: How was the pickup person verified?
      type: select_one
      options:
      - Photo ID presented
      - Password provided
      - Pre-arranged signal
      - Called parent for confirmation
      - Other
      required: true
    - id: 16
      name: authorized_by_staff
      label: Authorized by Staff Member
      hint: Name of staff member authorizing the pickup
      type: text
      options: []
      required: true
    - id: 17
      name: staff_signature
      label: Staff Signature
      hint: Signature of staff member releasing the student
      type: text
      options: []
      required: true
    - id: 18
      name: pickup_location
      label: Pickup Location
      hint: Where was the student picked up?
      type: select_one
      options:
      - Front Office
      - Main Entrance
      - Playground
      - Parking Lot
      - Classroom
      - Other
      required: true
    - id: 19
      name: transportation_method
      label: Transportation Method
      hint: How is the student getting home?
      type: select_one
      options:
      - Car
      - Bus
      - Walk
      - Bicycle
      - Other
      required: true
    - id: 20
      name: special_instructions
      label: Special Instructions
      hint: Any special instructions or notes about the pickup
      type: text
      options: []
      required: false
    - id: 21
      name: emergency_contact_section
      label: Emergency Contact
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact on file
      type: text
      options: []
      required: true
    - id: 23
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number of emergency contact
      type: text
      options: []
      required: true
    - id: 24
      name: parent_guardian_notification
      label: Parent/Guardian Notification
      hint: Was the parent/guardian notified of pickup?
      type: select_one
      options:
      - true
      - false
      - Not required
      required: true
    - id: 25
      name: sign_out_confirmation_section
      label: Sign Out Confirmation
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: student_released_safely
      label: Student Released Safely
      hint: I confirm that the student was released safely to the authorized person
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 27
      name: information_accuracy
      label: Information Accuracy
      hint: I confirm that all information entered is accurate
      type: select_one
      options:
      - true
      - false
      required: true
