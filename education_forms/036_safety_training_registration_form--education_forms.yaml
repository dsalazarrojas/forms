inputSchema:
  type: object
  properties:
    title: Safety Training Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: training_program
      label: Training Program
      hint: null
      type: select_one
      options:
      - First Aid and CPR
      - Fire Safety
      - Hazardous Materials
      required: false
    - id: 3
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
