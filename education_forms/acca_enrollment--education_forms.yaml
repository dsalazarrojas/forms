    - id: 3
      name: email_address
      label: Email address
      hint: University or personal email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Include country code (e.g., +44 ...)
      type: phone
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: age
      label: Age
      hint: If unknown, leave blank
      type: integer
      options: []
      required: false
    - id: 7
      name: mailing_address
      label: Mailing address
      hint: Street, city, postal code
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact
      label: Emergency contact name
      hint: Include relationship (e.g., parent, spouse)
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_phone
      label: Emergency contact phone
      hint: Best reachable number
      type: phone
      options: []
      required: false
