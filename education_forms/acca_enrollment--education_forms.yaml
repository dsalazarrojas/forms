    - id: 15
      name: position_or_role
      label: Job title or student level
      hint: e.g., Finance Assistant, Final-year student
      type: text
      options: []
      required: false
    - id: 16
      name: highest_qualification
      label: Highest academic qualification
      hint: Select the highest completed qualification
      type: select_one
      options:
