      - Bachelor's degree
      - Postgraduate degree
      - Professional qualification
      - Other
      required: false
    - id: 17
      name: funding_source
      label: Funding source for studies
      hint: How will your ACCA costs be covered?
      type: select_one
      options:
      - Self-funded
      - Employer-sponsored
      - Scholarship
      - Government sponsorship
      - Other
      required: false
    - id: 18
      name: supporting_documents
      label: Supporting documents submitted
      hint: Select all that apply
      type: select_multiple
      options:
