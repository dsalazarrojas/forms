      name: section_header_program
      label: '--- Program & Enrollment ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: registration_type
      label: Registration type
      hint: Choose the category that applies
      type: select_one
      options:
      - New registrant
      - Returning registrant
      - Transfer from another program
      - Conversion candidate
      required: true
    - id: 12
      name: experience_level
      label: Accounting/finance experience level
      hint: Select the option that best describes prior experience
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Professional
      required: false
    - id: 13
      name: preferred_study_mode
      label: Preferred study mode
      hint: Select how you intend to study for ACCA
      type: select_one
      options:
      - Full-time
      - Part-time
      - Online
      - Self-study
      required: true
    - id: 14
      name: institution_or_employer
      label: Institution or employer (if applicable)
      hint: Name of current employer or educational institution, or N/A
      type: text
      options: []
