inputSchema:
  type: object
  properties:
    title: Scholarship Authorization Form
    pages:
    - id: 1
      name: applicant_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Please enter a valid email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: grade_level
      label: Grade Level
      hint: Select the highest grade level attended
      type: select_one
      options:
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      - Postsecondary
      required: true
    - id: 8
      name: academic_program
      label: Academic Program
      hint: null
      type: select_multiple
      options:
      - Program 1
      - Program 2
      - Program 3
      required: true
    - id: 9
      name: authorization_type
      label: Authorization Type
      hint: null
      type: select_one
      options:
      - Type A
      - Type B
      - Type C
      required: true
