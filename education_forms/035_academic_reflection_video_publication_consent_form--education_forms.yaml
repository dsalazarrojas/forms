inputSchema:
  type: object
  properties:
    title: Academic Reflection Video Publication Consent Form
    pages:
    - id: 1
      name: video_consent_intro
      label: Academic Reflection Video Publication Consent
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Full name of the person giving consent
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email Address
      hint: Contact email for the participant
      type: email
      options: []
      required: true
    - id: 4
      name: participant_institution
      label: Institution
      hint: University or organization affiliation
      type: text
      options: []
      required: true
    - id: 5
      name: video_title
      label: Video Title
      hint: Title of the academic reflection video
      type: text
      options: []
      required: true
    - id: 6
      name: video_topic
      label: Video Topic
      hint: Main topic or theme of the video
      type: text
      options: []
      required: true
    - id: 7
      name: recording_date
      label: Recording Date
      hint: Date when the video recording will take place
      type: date
      options: []
      required: true
    - id: 8
      name: consent_to_video_recording
      label: Consent to Video Recording
      hint: Do you consent to being video recorded for this reflection?
      type: select_one
      options: ["Yes, I consent", "Yes, with conditions", "No, I do not consent"]
      required: true
    - id: 9
      name: consent_to_audio_recording
      label: Consent to Audio Recording
      hint: Do you consent to having your voice recorded for this reflection?
      type: select_one
      options: ["Yes, I consent", "Yes, with conditions", "No, I do not consent"]
      required: true
    - id: 10
      name: consent_to_image_use
      label: Consent to Image Use
      hint: Do you consent to your image being used in the video?
      type: select_one
      options: ["Yes, I consent", "Yes, with conditions", "No, I do not consent"]
      required: true
    - id: 11
      name: consent_to_publication
      label: Consent to Publication
      hint: Do you consent to the video being published online?
      type: select_one
      options: ["Yes, I consent", "Yes, with editorial review", "No, not for publication", "Conditional on anonymity"]
      required: true
    - id: 12
      name: consent_to_distribution
      label: Consent to Distribution
      hint: Do you consent to the video being distributed to others?
      type: select_one
      options: ["Yes, for educational purposes", "Yes, with restrictions", "No, only for course participants", "No, I do not consent"]
      required: true
    - id: 13
      name: video_purpose
      label: Purpose of Video
      hint: What is the intended purpose of the video?
      type: text
      options: []
      required: true
    - id: 14
      name: access_restriction_preferences
      label: Access Restriction Preferences
      hint: How should access to the video be restricted?
      type: select_one
      options: ["Open to public", "Restricted to institution", "Limited to course participants", "Private to session attendees", "Other restrictions"]
      required: true
    - id: 15
      name: video_retention_period
      label: Video Retention Period
      hint: How long should the video be retained?
      type: select_one
      options: ["One semester", "One academic year", "Three years", "Permanent", "Until I request removal"]
      required: true
    - id: 16
      name: special_requests_conditions
      label: Special Requests or Conditions
      hint: Do you have any special requests or conditions for the video?
      type: text
      options: []
      required: false
    - id: 17
      name: withdrawal_rights_acknowledged
      label: Withdrawal Rights Acknowledged
      hint: Do you understand you can withdraw consent at any time?
      type: select_one
      options: ["Yes, I understand", "No, need clarification"]
      required: true
