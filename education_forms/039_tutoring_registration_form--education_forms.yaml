inputSchema:
  type: object
  properties:
    title: Tutoring Registration Form
    pages:
    - id: 1
      name: form_id
      label: form_id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - phone
      - email
      - text
      required: false
    - id: 5
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: learning_needs
      label: Learning Needs
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: student_level
      label: Student Level
      hint: null
      type: select_one
      options:
      - beginner
      - intermediate
      - advanced
      required: false
    - id: 8
      name: subject
      label: Subject
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
