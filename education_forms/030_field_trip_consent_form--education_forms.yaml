    - id: 18
      name: student_agreement
      label: Student Agreement
      hint: null
      type: select_multiple
      options:
      - I understand that I am going on a school-sponsored field trip.
      - I understand that I am being supervised by a teacher or staff member at all
        times during the trip.
      - I understand that I will be required to follow all school rules and safety
        guidelines during the trip.
      - I understand that I will be held accountable for any damages or losses incurred
        during the trip.
      - I understand that I will receive a copy of this signed consent form.
      - I understand that this field trip is a school-sponsored trip and not a private
        activity.
      - I am aware that my parent/guardian has signed this form, indicating that they
        are aware of the trip details and have given their permission for me to attend.
      required: true
    - id: 19
      name: parent_agreement
      label: Parent Agreement
      hint: null
      type: select_multiple
      options:
      - I, the parent/guardian, understand that I am responsible for my child's safety
        and well-being during the trip.
      - I, the parent/guardian, understand that the school will have a teacher or
        staff member accompanying my child at all times during the trip.
      - I, the parent/guardian, understand that my child will be required to follow
        all school rules and safety guidelines during the trip.
      - I, the parent/guardian, understand that my child will be held accountable
        for any damages or losses incurred during the trip.
      - I, the parent/guardian, understand that I will receive a copy of this signed
