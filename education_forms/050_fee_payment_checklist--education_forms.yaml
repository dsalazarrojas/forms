inputSchema:
  type: object
  properties:
    title: Fee Payment Checklist
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Cash
      - Check
      - Online Banking
      required: true
    - id: 3
      name: amount_paid
      label: Amount Paid
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: fee_type
      label: Fee Type
      hint: null
      type: select_one
      options:
      - Regular Fee
      - Late Fee
      - Discounted Fee
      required: true
    - id: 8
      name: payment_method_other
      label: Other Payment Method
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
