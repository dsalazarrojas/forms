inputSchema:
  type: object
  properties:
    title: Child Education Case Research Consent Form
    pages:
    - id: 1
      name: section_researcher_info
      label: -- Researcher Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: study_title
      label: Research Study Title
      hint: As provided by the lead investigator
      type: text
      options: []
      required: true
    - id: 3
      name: section_participant_details
      label: -- Participant Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 5
      name: child_name
      label: Child Full Name
      hint: Student participant name
      type: text
      options: []
      required: true
    - id: 6
      name: child_dob
      label: Child Date of Birth
      hint: To verify age eligibility
      type: date
      options: []
      required: true
    - id: 7
      name: section_consent_details
      label: -- Consent Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: participation_consent
      label: Do you consent to the child participation?
      hint: Participation is voluntary
      type: select_one
      options:
      - Yes - I Consent
      - No - I Do Not Consent
      required: true
    - id: 9
      name: consent_areas
      label: Consent for Specific Research Activities
      hint: Select all that apply
      type: select_multiple
      options:
      - One-on-one Interviews
      - Classroom Observation
      - Collection of Academic Data
      - Standardized Testing
      required: true
    - id: 10
      name: recording_consent
      label: Consent for audio or video recording?
      hint: Recordings used for research purposes only
      type: select_one
      options:
      - Yes - Audio and Video
      - Yes - Audio Only
      - No Recording Allowed
      required: true
    - id: 11
      name: section_confidentiality
      label: -- Confidentiality Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: understand_confidentiality
      label: Do you understand the confidentiality protocols?
      hint: All data will be de-identified
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: electronic_signature
      label: Electronic Signature - Full Name
      hint: Please type your full name
      type: text
      options: []
      required: true
    - id: 14
      name: today_date
      label: Today Date
      hint: Date of consent
      type: date
      options: []
      required: true
