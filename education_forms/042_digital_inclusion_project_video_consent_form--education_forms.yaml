inputSchema:
  type: object
  properties:
    title: Digital Inclusion Project Video Consent Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: video_recording
      label: Video Recording Information
      hint: null
      type: select_one
      options:
      - Record Video
      - Do Not Record Video
      required: true
    - id: 3
      name: consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - I consent to being recorded
      - I do not consent to being recorded
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: note
      label: Notes
      hint: null
      type: note
      options: []
      required: false
