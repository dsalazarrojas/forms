inputSchema:
  type: object
  properties:
    title: Educational Content Creator Survey
    pages:
    - id: 1
      name: user_input_1
      label: What is your primary job title?
      hint: null
      type: select_multiple
      options:
      - Teacher
      - Professor
      - Administrator
      - Staff
      required: false
    - id: 2
      name: user_input_2
      label: How long have you been creating educational content?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: user_input_3
      label: How many hours do you spend creating content per week?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: user_input_4
      label: What type of content do you mostly create?
      hint: null
      type: select_one
      options:
      - Books
      - Courses
      - Videos
      - Podcasts
      - Blogs
      required: false
    - id: 5
      name: user_input_5
      label: How often do you share your content on social media?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 6
      name: user_input_6
      label: What is your primary goal for creating educational content?
      hint: null
      type: select_one
      options:
      - Improve student outcomes
      - Engage with students
      - Enhance my professional development
      - Other
      required: false
    - id: 7
      name: user_input_7
      label: How long have you been a teacher?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: user_input_8
      label: What motivates you to create educational content?
      hint: null
      type: select_multiple
      options:
      - Improve student outcomes
      - Engage with students
      - Enhance my professional development
      - Other
      required: false
    - id: 9
      name: user_input_9
      label: Do you use any tools to measure your content engagement?
      hint: null
      type: select_multiple
      options:
      - Google Analytics
      - Google Optimize
      - YouTube Analytics
      - Other
      required: false
    - id: 10
      name: user_input_10
      label: What type of content do you mostly create for your students?
      hint: null
      type: select_multiple
      options:
      - Lesson plans
      - Quizzes
      - Presentations
      - Other
      required: false
    - id: 11
      name: user_input_11
      label: How do you usually distribute your educational content?
      hint: null
      type: select_multiple
      options:
      - Email
      - Website
      - Social media
      - Other
      required: false
    - id: 12
      name: user_input_12
      label: Which of the following best describes your experience with educational
        technology?
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: false
    - id: 13
      name: user_input_13
      label: How many students do you usually teach per year?
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: user_input_14
      label: Do you usually work with other educators?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 15
      name: user_input_15
      label: What is your highest level of education completed?
      hint: null
      type: select_one
      options:
      - High school diploma or equivalent
      - Some college
      - Bachelor's degree
      - Master's degree
      - Doctoral degree
      required: false
    - id: 16
      name: user_input_16
      label: How many years of experience do you have in education?
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: user_input_17
      label: What type of content do you usually create for your institution?
      hint: null
      type: select_multiple
      options:
      - Courses
      - Lesson plans
      - Presentations
      - Other
      required: false
    - id: 18
      name: user_input_18
      label: Do you usually work on a computer for more than 6 hours a day?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: user_input_19
      label: How many students do you usually teach per class?
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: user_input_20
      label: Do you usually work on educational content during your free time?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 21
      name: user_input_21
      label: Do you usually share your content with other educators?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: user_input_22
      label: What kind of support do you usually receive from your institution for
        creating educational content?
      hint: null
      type: select_multiple
      options:
      - Financial support
      - Time
      - Feedback
      - Resources
      - Other
      required: false
    - id: 23
      name: user_input_23
      label: Do you usually work with a mentor or supervisor?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 24
      name: user_input_24
      label: Do you have any other comments about creating educational content?
      hint: null
      type: note
      options: []
      required: false
