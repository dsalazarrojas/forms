      options:
      - Transfer of heat by touching
      - Transfer of heat by movement of fluid/air
      - Transfer of heat by light waves
      - None of the above
      required: true
    - id: 6
      name: q2_jet_stream
      label: 2. Where are Jet Streams found?
      hint: null
      type: select_one
      options:
      - In the ocean
      - In the upper troposphere
      - Underground
      - Near the equator surface
      required: true
    - id: 7
      name: q3_coriolis
      label: "3. The Coriolis Effect causes winds to:"
      hint: null
      type: select_one
      options:
