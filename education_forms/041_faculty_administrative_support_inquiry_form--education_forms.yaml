inputSchema:
  type: object
  properties:
    title: Faculty Administrative Support Inquiry Form
    pages:
    - id: 1
      name: form_name
      label: form name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_department
      label: department
      hint: null
      type: select_one
      options:
      - Department of Mathematics
      - School of Engineering
      - Office of the Chancellor
      required: false
    - id: 3
      name: form_email
      label: email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 4
      name: form_phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_message
      label: message
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: form_date
      label: date
      hint: null
      type: date
      options: []
      required: false
