inputSchema:
  type: object
  properties:
    title: Academic Text Evaluation Survey
    pages:
    - id: 1
      name: survey_header
      label: -- Academic Text Evaluation Survey --
      hint: Provide your evaluation and feedback on the scholarly text assigned for review.
      type: note
      options: []
      required: false
    - id: 2
      name: reviewer_name
      label: Reviewer full name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: reviewer_email
      label: Reviewer email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: reviewer_affiliation
      label: Institutional affiliation
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: text_title
      label: Title of the text being evaluated
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: text_author
      label: Author(s) of the text
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: text_type
      label: Type of text
      hint: null
      type: select_one
      options:
        - Textbook
        - Research article
        - Monograph
        - Edited volume
        - Course reader
        - Other
      required: true
    - id: 8
      name: clarity_rating
      label: How would you rate the clarity and readability of the text
      hint: null
      type: select_one
      options:
        - Poor
        - Fair
        - Good
        - Very Good
        - Excellent
      required: true
    - id: 9
      name: accuracy_rating
      label: How accurate and up-to-date is the content
