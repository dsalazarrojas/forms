      type: select_one
      options:
        - Poor
        - Fair
        - Good
        - Very Good
        - Excellent
      required: true
    - id: 10
      name: relevance_rating
      label: How relevant is the text to its intended academic audience
      hint: null
      type: select_one
      options:
        - Not relevant
        - Slightly relevant
        - Moderately relevant
        - Very relevant
        - Extremely relevant
      required: true
    - id: 11
      name: organization_rating
      label: How well organized is the text
      hint: null
      type: select_one
      options:
        - Poor
        - Fair
        - Good
        - Very Good
        - Excellent
      required: true
    - id: 12
      name: pedagogical_value
      label: How effective is the text as a learning resource
