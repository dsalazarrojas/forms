inputSchema:
  type: object
  properties:
    title: Peer Evaluation By Dr. Baloran
    pages:
    - id: 1
      name: first_page
      label: First Name
      hint: Enter your first name
      type: text
      options: []
      required: true
    - id: 2
      name: email_page
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 3
      name: phone_page
      label: Phone Number
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 4
      name: rating_page
      label: Rating of Dr. Baloran's Teaching Style
      hint: Good or Fair
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 5
      name: note_page
      label: Additional Comments
      hint: Provide any additional comments about Dr. Baloran's performance
      type: note
      options: []
      required: false
    - id: 6
      name: date_page
      label: Date of Evaluation
      hint: Enter the date of the evaluation
      type: date
      options: []
      required: true
    - id: 7
      name: time_page
      label: Time of Evaluation
      hint: Enter the time of the evaluation
      type: time
      options: []
      required: true
    - id: 8
      name: second_page
      label: Rating of Dr. Baloran's Communication Skills
      hint: Good or Fair
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 9
      name: third_page
      label: Rating of Dr. Baloran's Organization and Preparation
      hint: Good or Fair
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 10
      name: fourth_page
      label: Additional Comments (2)
      hint: Provide any additional comments about Dr. Baloran's performance
      type: note
      options: []
      required: false
