inputSchema:
  type: object
  properties:
    title: Academic Interview Registration Form
    pages:
      - id: 1
        name: section_registration
        label: -- Registration Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: candidate_name
        label: Candidate name
        hint: Full name for scheduling
        type: text
        options: []
        required: true
      - id: 3
        name: position_applied
        label: Position applied for
        hint: Job title or role
        type: text
        options: []
        required: true
      - id: 4
        name: contact_email
        label: Contact email
        hint: For interview details
        type: email
        options: []
        required: true
      - id: 5
        name: preferred_interview_dates
        label: Preferred interview dates
        hint: List available dates and times
        type: text
        options: []
        required: true
      - id: 6
        name: interview_mode
        label: Interview mode
        hint: Choose preferred format
        type: select_one
        options:
          - In person
          - Video conference
          - Phone call
        required: true
      - id: 7
        name: panel_members
        label: Panel members
        hint: Names of interviewers if known
        type: text
        options: []
        required: false
      - id: 8
        name: accommodations_needed
        label: Accommodations needed
        hint: Accessibility or other needs
        type: text
        options: []
        required: false
      - id: 9
        name: cv_and_documents
        label: CV and supporting documents provided
        hint: List attached documents
        type: text
        options: []
        required: false
      - id: 10
        name: additional_notes
        label: Additional notes
        hint: Any other information for organisers
        type: text
        options: []
        required: false
