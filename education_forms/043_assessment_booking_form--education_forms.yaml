inputSchema:
  type: object
  properties:
    title: Assessment Booking Form
    pages:
    - id: 1
      name: student_name_booking
      label: Student Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id_number
      label: Student ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_email_booking
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: course_module_name
      label: Course or Module Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: assessment_type_selection
      label: Select Assessment Type
      hint: null
      type: select_one
      options:
      - Written Examination
      - Practical Lab Assessment
      - Oral Presentation
      - Project Submission Review
      required: true
    - id: 6
      name: preferred_booking_date
      label: Preferred Assessment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: preferred_booking_time
      label: Preferred Time Slot
      hint: null
      type: select_one
      options:
      - Morning - 9 AM to 12 PM
      - Afternoon - 1 PM to 4 PM
      - Evening - 5 PM to 8 PM
      required: true
    - id: 8
      name: accommodation_needed_flag
      label: Do you require special accommodations
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: accommodation_details_text
      label: Details of Required Accommodations
      hint: Required if Yes is selected above
      type: text
      options: []
      required: false
    - id: 10
      name: guidelines_review_confirm
      label: I have reviewed the assessment guidelines and relevant documents
      hint: null
      type: select_one
      options:
      - Yes, I have reviewed them
      - Other
      required: true
    - id: 11
      name: student_phone_booking
      label: Contact Phone Number
      hint: For urgent scheduling changes
      type: text
      options: []
      required: true
