inputSchema:
  type: object
  properties:
    title: Academic Peer Network Participation Request Form
    pages:
      - id: 1
        name: section_participant
        label: -- Participant Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: full_name
        label: Full name
        hint: Participant full name
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email address
        hint: Contact for network activities
        type: email
        options: []
        required: true
      - id: 4
        name: institution
        label: Institution
        hint: Affiliated organization
        type: text
        options: []
        required: false
      - id: 5
        name: area_of_interest
        label: Area of interest
        hint: Topics you want to engage with
        type: select_multiple
        options:
          - Research collaboration
          - Peer mentoring
          - Teaching practice
          - Policy engagement
        required: false
      - id: 6
        name: preferred_activity_type
        label: Preferred activity type
        hint: How you wish to participate
        type: select_one
        options:
          - Attend events
          - Host sessions
          - Contribute resources
          - Volunteer
        required: true
      - id: 7
        name: availability
        label: Availability for participation
        hint: Times or days you are typically available
        type: text
        options: []
        required: false
      - id: 8
        name: prior_network_experience
        label: Prior network experience
        hint: Describe previous related participation
        type: text
        options: []
        required: false
      - id: 9
        name: communication_preference
        label: Communication preference
        hint: Best way to receive updates
        type: select_one
        options:
          - Email
          - Newsletter
          - Slack or messaging
        required: false
      - id: 10
        name: additional_comments
        label: Additional comments
        hint: Any other information for organizers
        type: text
        options: []
        required: false
