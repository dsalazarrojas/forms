    - id: 5
      name: participant_answers
      label: participant answers
      hint: null
      type: select_one
      options:
      - participant answers
      - Other
      required: false
    - id: 6
      name: review
      label: review
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
