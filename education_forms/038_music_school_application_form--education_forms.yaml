inputSchema:
  type: object
  properties:
    title: music_school_application_form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: music_instruments
      label: Music Instruments
      hint: null
      type: select_multiple
      options:
      - Piano
      - Guitar
      - Singing
      - Violin
      required: true
    - id: 8
      name: music_style
      label: Music Style
      hint: null
      type: select_one
      options:
      - Classical
      - Pop
      - Jazz
      - Rock
      required: true
    - id: 9
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: agreement
      label: Agreement
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
