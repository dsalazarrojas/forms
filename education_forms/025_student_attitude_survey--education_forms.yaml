inputSchema:
  type: object
  properties:
    title: Student Attitude Survey
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_class
      label: student_class
      hint: null
      type: select_one
      options:
      - '{''option1'': ''Class A''}'
      - '{''option2'': ''Class B''}'
      - '{''option3'': ''Class C''}'
      - '{''option4'': ''Class D''}'
      required: true
    - id: 3
      name: question_1
      label: What motivates you?
      hint: null
      type: select_multiple
      options:
      - '{''option1'': ''Option 1''}'
      - '{''option2'': ''Option 2''}'
      - '{''option3'': ''Option 3''}'
      required: true
    - id: 4
      name: question_2
      label: Which class do you like?
      hint: null
      type: select_one
      options:
      - '{''option1'': ''Option 1''}'
      - '{''option2'': ''Option 2''}'
      required: true
    - id: 5
      name: student_attitude
      label: Student Attitude
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
