inputSchema:
  type: object
  properties:
    title: Academic Transcript Release Form
    pages:
    - id: 1
      name: transcript_release_intro
      label: Academic Transcript Release Authorization
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Full name of the student authorizing transcript release
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: Official student identification number
      type: text
      options: []
      required: true
    - id: 4
      name: student_email
      label: Student Email
      hint: Current email address for student
      type: email
      options: []
      required: true
    - id: 5
      name: recipient_name
      label: Recipient Name
      hint: Full name of the person or organization receiving the transcript
      type: text
      options: []
      required: true
    - id: 6
      name: recipient_institution
      label: Recipient Institution/Organization
      hint: Institution or organization name of the transcript recipient
      type: text
      options: []
      required: true
    - id: 7
      name: recipient_address
      label: Recipient Address
      hint: Complete mailing address for the transcript recipient
      type: text
      options: []
      required: true
    - id: 8
      name: transcript_type
      label: Type of Transcript
      hint: What type of transcript is being requested?
      type: select_one
      options: ["Official transcript", "Unofficial transcript", "Partial transcript", "Degree verification", "Course verification", "Other"]
      required: true
    - id: 9
      name: academic_periods_covered
      label: Academic Periods Covered
      hint: Which academic periods should be included in the transcript?
      type: text
      options: []
      required: true
    - id: 10
      name: release_purpose
      label: Purpose of Release
      hint: Why is this transcript being released?
      type: text
      options: []
      required: true
    - id: 11
      name: release_authorization_period
      label: Authorization Validity Period
      hint: How long should this authorization remain valid?
      type: select_one
      options: ["One-time request", "30 days", "60 days", "90 days", "6 months", "1 year", "Indefinite"]
      required: true
    - id: 12
      name: fee_acknowledgment
      label: Fee Acknowledgment
      hint: Do you acknowledge that fees may apply for transcript processing?
      type: select_one
      options: ["Yes, I acknowledge", "Yes, and I will pay promptly", "No, I believe it's free", "Need clarification"]
      required: true
    - id: 13
      name: privacy_rights_acknowledgment
      label: Privacy Rights Acknowledgment
      hint: Do you understand you have rights regarding your educational records?
      type: select_one
      options: ["Yes, I understand", "No, need clarification"]
      required: true
    - id: 14
      name: revocation_rights_acknowledgment
      label: Revocation Rights Acknowledgment
      hint: Do you understand you can revoke this authorization at any time?
      type: select_one
      options: ["Yes, I understand", "No, need clarification"]
      required: true
    - id: 15
      name: electronic_signature_consent
      label: Electronic Signature Consent
      hint: Do you consent to using an electronic signature for this authorization?
      type: select_one
      options: ["Yes, I consent", "No, I prefer handwritten signature"]
      required: true
    - id: 16
      name: student_signature
      label: Student Signature
      hint: Type your full name as your electronic signature
      type: text
      options: []
      required: true
    - id: 17
      name: signature_date
      label: Date of Signature
      hint: Date when this authorization is signed
      type: date
      options: []
      required: true
