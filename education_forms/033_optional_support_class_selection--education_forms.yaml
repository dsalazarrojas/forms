inputSchema:
  type: object
  properties:
    title: Optional Support Class Selection
    pages:
    - id: 1
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - grade 6
      - grade 7
      - grade 8
      - grade 9
      - grade 10
      - grade 11
      - grade 12
      required: false
    - id: 3
      name: interest_level
      label: Interest Level
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: preferred_days
      label: Preferred Days
      hint: null
      type: select_multiple
      options:
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
      - sunday
      required: false
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
