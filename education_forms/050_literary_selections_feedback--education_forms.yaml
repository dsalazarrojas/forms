inputSchema:
  type: object
  properties:
    title: Literary Selections Feedback
    pages:
    - id: 1
      name: ratings
      label: What is your rating for this literary selection?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: true
    - id: 2
      name: comments
      label: Do you have any comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: file_uploader
      label: Can you upload any relevant files?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: time_spent
      label: How many hours do you estimate you spent reading this literary selection?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: publication_date
      label: What is the publication date of this literary selection?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_day
      label: What time of day did you read this literary selection?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: other_ratings
      label: Which other literary selections have you read recently?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: false
    - id: 8
      name: overall_experience
      label: How would you rate your overall experience with this literary selection?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: true
    - id: 9
      name: other_feedback
