inputSchema:
  type: object
  properties:
    title: Student Attendance Tracking Form
    pages:
    - id: 1
      name: student_attendance_form
      label: Student Attendance
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: is_absent
      label: Is Absent
      hint: Check if student is absent
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: checked_by
      label: Checked By
      hint: null
      type: select_multiple
      options:
      - Student
      - Teacher
      - Both
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: checked_in
      label: Checked In
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
