      name: community_impact
      label: How do you impact your local community
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: partnerships
      label: Community partnerships or collaborations
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: stakeholders_section
      label: -- Stakeholders --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: key_stakeholders
      label: Key stakeholders in your organization
      hint: Select all that apply
      type: select_multiple
      options:
      - Children
      - Parents
      - Staff
      - Teachers
      - Community members
      - Board members
      - Local government
      required: true
    - id: 22
      name: engagement_method
