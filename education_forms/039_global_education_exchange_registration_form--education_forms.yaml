inputSchema:
  type: object
  properties:
    title: global_education_exchange_registration_form
    pages:
    - id: 1
      name: exchange_participant_info
      label: exchange_participant_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_type
      label: participant_type
      hint: null
      type: select_one
      options:
      - Student
      - Teacher
      - Other
      - Parent/Guardian
      required: false
    - id: 3
      name: participant_details
      label: participant_details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_info
      label: contact_info
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Address
      - Fax
      required: false
    - id: 5
      name: education_level
      label: education_level
      hint: null
      type: select_one
      options:
      - High School
      - Bachelor
      - Master
      - Doctoral
      required: false
    - id: 6
      name: education_field
      label: education_field
      hint: null
      type: select_multiple
      options:
      - Arts
      - Engineering
      - Science
      - Languages
      required: false
    - id: 7
      name: language_proficiency
      label: language_proficiency
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Chinese
      required: false
    - id: 8
      name: preferred_location
      label: preferred_location
      hint: null
      type: select_multiple
      options:
      - USA
      - Europe
      - Asia
      - Africa
      required: false
    - id: 9
      name: exchange_program
      label: exchange_program
      hint: null
      type: select_one
      options:
      - Short-Term
      - Long-Term
      - Summer
      required: false
    - id: 10
      name: participant_status
      label: participant_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: false
    - id: 11
      name: exchange_start_date
      label: exchange_start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: exchange_end_date
      label: exchange_end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: participant_termination_date
      label: participant_termination_date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: participant_termination_reason
      label: participant_termination_reason
      hint: null
      type: select_multiple
      options:
      - Expiration of Exchange
      - Participant's request
      - Other
      required: false
    - id: 15
      name: exchange_renewal_date
      label: exchange_renewal_date
      hint: null
      type: date
      options: []
      required: false
