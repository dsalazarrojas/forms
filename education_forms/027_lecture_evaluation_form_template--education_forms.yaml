inputSchema:
  type: object
  properties:
    title: Lecture Evaluation Form Template
    pages:
    - id: 1
      name: introduction
      label: Overall Quality of the Lecture
      hint: Please provide a brief overview of your experience.
      type: text
      options: []
      required: false
    - id: 2
      name: overall_rating
      label: Overall Rating
      hint: Rate the overall quality of the lecture.
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 3
      name: feedback
      label: Feedback
      hint: Please provide any comments or suggestions.
      type: note
      options: []
      required: false
    - id: 4
      name: lecturer_name
      label: Lecturer's Name
      hint: Please provide the lecturer's name.
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_lecture
      label: Date of the Lecture
      hint: Please provide the date of the lecture.
      type: date
      options: []
      required: true
    - id: 6
      name: time_of_lecture
      label: Time of the Lecture
      hint: Please provide the time of the lecture.
      type: time
      options: []
      required: true
    - id: 7
      name: helpfulness
      label: How Helpful?
      hint: How helpful was the content?
      type: number
      options: []
      required: true
    - id: 8
      name: relevance
      label: Relevance
      hint: How relevant was the content?
      type: number
      options: []
      required: true
    - id: 9
      name: enjoyment
      label: Enjoyment
      hint: How enjoyable was the lecture?
      type: number
      options: []
      required: true
    - id: 10
      name: pace
      label: Pace
      hint: How well-paced was the lecture?
      type: number
      options: []
      required: true
    - id: 11
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall satisfaction.
      type: number
      options: []
      required: true
    - id: 12
      name: would_recommend
      label: Would Recommend
      hint: Would you recommend this lecture?
      type: text
      options: []
      required: true
    - id: 13
      name: comments
      label: Comments
      hint: Please provide any additional comments or suggestions.
      type: note
      options: []
      required: true
    - id: 14
      name: would_recommend_lecture_to
      label: Would Recommend to Others
      hint: Would you recommend this lecture to others?
      type: text
      options: []
      required: true
