inputSchema:
  type: object
  properties:
    title: Afternoon Absence Form
    pages:
    - id: 1
      name: header
      label: -- Afternoon Absence Notification --
      hint: Please submit this form if the student will be absent during the afternoon
        session
      type: note
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: emergency_contact
      label: Emergency Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: student_name
      label: Student Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: student_id
      label: Student ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: absence_date
      label: Date of Absence
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: absence_reason
      label: Reason for absence
      hint: Select the primary reason
      type: select_one
      options:
      - Medical Appointment
      - Family Emergency
      - Personal Reasons
      - Illness
      - Other
      required: true
    - id: 8
      name: other_reason
      label: If Other, please specify
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: departure_time
      label: Departure Time
      hint: When will the student leave the premises
      type: time
      options: []
      required: true
    - id: 10
      name: return_status
      label: Will the student return today?
      hint: Indicate if student is expected back before end of day
      type: select_one
      options:
      - 'True'
      - 'False'
      - Uncertain
      required: true
    - id: 11
      name: missed_classes
      label: Subjects or classes that will be missed
      hint: Select all applicable afternoon periods
      type: select_multiple
      options:
      - Period 5
      - Period 6
      - Period 7
      - Period 8
      - After-school Clubs
      required: false
