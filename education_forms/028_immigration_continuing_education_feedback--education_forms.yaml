inputSchema:
  type: object
  properties:
    title: Immigration Continuing Education Feedback
    pages:
    - id: 1
      name: main_page
      label: Main page
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 2
      name: session_evaluation
      label: What was your overall impression of the session?
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: feedback
      label: What did you find most helpful or engaging?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: future_topics
      label: What topics would you like to see covered in future sessions?
      hint: null
      type: select_multiple
      options:
      - Topic 1
      - Topic 2
      - Topic 3
      required: false
    - id: 5
      name: professional_impact
      label: How will the knowledge you gained impact your work?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 6
      name: suggestions
      label: Do you have any suggestions or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: session_topics
      label: How would you rate the relevance of the session topics?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: presentation
      label: How would you rate the presentation style of the session?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 9
      name: materials
      label: How would you rate the materials provided?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 10
      name: overall_experience
      label: Overall, how would you rate the session?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
