inputSchema:
  type: object
  properties:
    title: Academic Partnership Success Factors Survey
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organization_type
      label: Organization type
      hint: Select your organization type
      type: select_one
      options:
        - University
        - Industry partner
        - Non profit
        - Government
        - Other
      required: true
    - id: 3
      name: partnership_duration
      label: Partnership duration
      hint: How long the partnership has existed
      type: text
      options: []
      required: false
    - id: 4
      name: success_factors
      label: Key success factors
      hint: Select up to three factors
      type: select_multiple
      options:
        - Clear objectives
        - Mutual benefits
        - Dedicated resources
        - Strong communication
        - Leadership support
      required: true
    - id: 5
      name: challenges
      label: Main challenges experienced
      hint: Describe persistent obstacles
      type: text
      options: []
      required: false
    - id: 6
      name: impact_measurement
      label: How is impact measured
      hint: Metrics or evaluation approaches used
      type: text
      options: []
      required: false
    - id: 7
      name: improvement_recommendations
      label: Recommendations to improve partnerships
      hint: Practical steps for institutions and partners
      type: text
      options: []
      required: false
    - id: 8
      name: willingness_to_collaborate
      label: Willingness to engage in future collaborations
      hint: Indicate future collaboration interest
      type: select_one
      options:
        - Yes
        - Maybe
        - No
      required: true
    - id: 9
      name: contact_email
      label: Contact email for follow up
      hint: Optional email if follow up is desired
      type: email
      options: []
      required: false
