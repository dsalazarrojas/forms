inputSchema:
  type: object
  properties:
    title: Space Debris Awareness Quiz
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question_1
      label: What is space debris?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: question_2
      label: What is the main causes of space debris?
      hint: null
      type: select_one
      options:
      - Asteroids
      - Meteorites
      - Other
      required: true
    - id: 4
      name: question_3
      label: When did space debris first appear?
      hint: null
      type: select_multiple
      options:
      - '1957'
      - '1967'
      - Other
      required: true
    - id: 5
      name: question_4
      label: What is the impact of space debris?
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: question_5
      label: How often do you think space debris is found in space?
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      required: true
    - id: 7
      name: question_6
      label: How much space debris can be found in a single orbit?
      hint: null
      type: select_multiple
      options:
      - 1-10
      - 10-100
      - More than 100
      required: true
    - id: 8
      name: question_7
      label: What can be the most effective way to reduce space debris?
      hint: null
      type: select_one
      options:
      - Recycling
      - De-orbiting
      - Other
      required: true
    - id: 9
      name: question_8
      label: What is your level of concern about space debris?
      hint: null
      type: select_multiple
      options:
      - Very high
      - High
      - Medium
      - Low
      - None
      required: true
