inputSchema:
  type: object
  properties:
    title: Remote Learning Parent Inquiry Form
    pages:
    - id: 1
      name: school_code
      label: School Code
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: feedback
      label: Feedback
      hint: Please provide feedback on our remote learning experience.
      type: text
      options: []
      required: false
    - id: 4
      name: category
      label: Category
      hint: Select a category for your feedback.
      type: select_one
      options:
      - option_1
      - option_2
      - option_3
      required: true
    - id: 5
      name: sub_category
      label: Sub Category
      hint: Select a sub category for your feedback.
      type: select_multiple
      options:
      - option_1
      - option_2
      - option_3
      required: true
    - id: 6
      name: date_of_inquiry
      label: Date of Inquiry
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: contact_details
      label: Contact Details
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
