inputSchema:
  type: object
  properties:
    title: Career Cluster Survey
    pages:
      - id: 1
        name: header
        label: -- Career Cluster Survey --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Respondent name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 3
        name: school_or_college
        label: School or college
        hint: Institution name
        type: text
        options: []
        required: true
      - id: 4
        name: interested_clusters
        label: Interested career clusters
        hint: Select clusters of interest
        type: select_multiple
        options:
          - Health science
          - Information technology
          - Business management
          - Arts design
          - Engineering
        required: true
      - id: 5
        name: interest_level
        label: Interest level in chosen cluster
        hint: Self assessment
        type: select_one
        options:
          - High
          - Moderate
          - Low
        required: false
      - id: 6
        name: preferred_learning_modes
        label: Preferred learning modes
        hint: How student prefers to learn
        type: select_multiple
        options:
          - Classroom
          - Hands on labs
          - Internships
          - Online courses
        required: false
      - id: 7
        name: career_goal_timeline
        label: Career goal timeline
        hint: When student expects to enter field
        type: select_one
        options:
          - Immediately after graduation
          - Within two years
          - Longer term
        required: false
      - id: 8
        name: barriers_to_entry
