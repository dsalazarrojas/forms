inputSchema:
  type: object
  properties:
    title: Applicants Registration Form
    pages:
    - id: 1
      name: student_info_header
      label: -- Personal and Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: true
    - id: 6
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: residential_address
      label: Full Residential Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: academic_background_header
      label: -- Academic Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: highest_education_level
      label: Highest Education Level Completed
      hint: null
      type: select_one
      options:
      - High School
      - Vocational Certificate
      - Associate Degree
      - Bachelor Degree
      - Master Degree or Above
      required: true
    - id: 11
      name: school_university_name
      label: Name of Last Institution Attended
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: graduation_year
      label: Year of Graduation
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: enrollment_details_header
      label: -- Enrollment Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: course_of_interest
      label: Select Course of Interest
      hint: null
      type: select_one
      options:
      - Digital Marketing Essentials
      - Data Analytics Foundation
      - Business Management
      - Graphic Design Bootcamp
      - Full Stack Development
      - Project Management Professional
      required: true
    - id: 15
      name: preferred_learning_mode
      label: Preferred Learning Mode
      hint: null
      type: select_one
      options:
      - Full-time On-campus
      - Part-time On-campus
      - Online Self-paced
      - Online Live Classes
      required: true
    - id: 16
      name: preferred_intake_period
      label: Preferred Intake Period
      hint: null
      type: select_one
      options:
      - Spring Intake (March)
      - Summer Intake (June)
      - Fall Intake (September)
      - Winter Intake (December)
      required: true
    - id: 17
      name: referral_info
      label: How did you hear about our training center?
      hint: null
      type: select_one
      options:
      - Social Media
      - Google Search
      - Friend or Family
      - Newspaper Advertisement
      - Education Fair
      required: false
    - id: 18
      name: additional_inquiries
      label: Any questions or specific requirements?
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: parent_guardian_consent
      label: Parent/Guardian Consent (If applicant is under 18)
      hint: Please provide name and contact if applicable
      type: text
      options: []
      required: false
