inputSchema:
  type: object
  properties:
    title: soil_science_quiz
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: This is the introduction to the soil science quiz.
      type: text
      options: []
      required: false
    - id: 2
      name: soil_types
      label: soil types
      hint: Choose the correct type of soil.
      type: select_one
      options:
      - sand
      - silt
      - clay
      required: false
    - id: 3
      name: soil_composition
      label: soil composition
      hint: Describe the primary component of soil that affects its structure.
      type: text
      options: []
      required: false
    - id: 4
      name: soil_processes
      label: soil processes
      hint: Choose the process by which soil loses its nutrients.
      type: select_one
      options:
      - leaching
      - erosion
      - weathering
      required: false
    - id: 5
      name: soil_properties
      label: soil properties
      hint: Choose the relationship between pH and soil fertility.
      type: select_multiple
      options:
      - pH affects soil fertility
      - pH does not affect soil fertility
      - pH affects soil structure
      - pH does not affect soil structure
      required: false
    - id: 6
      name: conservation
      label: conservation
      hint: Choose the primary goal of soil conservation.
      type: select_one
      options:
      - prevent soil erosion
      - prevent soil erosion and improve fertility
      - improve soil fertility
      required: false
    - id: 7
      name: fertility
      label: fertility
      hint: Choose the factor that affects soil fertility.
      type: select_multiple
      options:
      - organic matter
      - pH
      - water content
      - temperature
      required: false
    - id: 8
      name: microbiology
      label: microbiology
      hint: Describe the role of microorganisms in soil formation.
      type: text
      options: []
      required: false
    - id: 9
      name: erosion
      label: erosion
      hint: Choose the causes of soil erosion.
      type: select_multiple
      options:
      - water erosion
      - wind erosion
      - tillage
      - deforestation
      required: false
    - id: 10
      name: water
      label: water
      hint: Choose the importance of water in soil formation.
      type: select_multiple
      options:
      - water affects soil formation
      - water does not affect soil formation
      - water affects soil fertility
      - water does not affect soil fertility
      required: false
    - id: 11
      name: nutrients
      label: nutrients
      hint: Choose the essential nutrients for plant growth.
      type: select_multiple
      options:
      - nitrogen
      - phosphorus
      - potassium
      - magnesium
      required: false
    - id: 12
      name: conclusion
      label: conclusion
      hint: Summarize what you have learned from this quiz.
      type: note
      options: []
      required: false
