inputSchema:
  type: object
  properties:
    title: Admission Website Usability Survey Form
    pages:
    - id: 1
      name: survey_header
      label: -- Admission Website Usability Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Name
      hint: Your name (optional)
      type: text
      options: []
      required: false
    - id: 3
      name: respondent_email
      label: Email Address
      hint: Your email address (optional)
      type: email
      options: []
      required: false
    - id: 4
      name: user_type
      label: User Type
      hint: What best describes your role?
      type: select_one
      options:
      - Prospective Student
      - Parent/Guardian
      - Counselor
      - Educator
      - Other
      required: true
    - id: 5
      name: visit_purpose
      label: Purpose of Visit
      hint: What brought you to the admission website?
      type: select_one
      options:
      - Researching programs
      - Starting application
      - Checking requirements
      - Finding deadlines
      - Other
      required: true
    - id: 6
      name: overall_navigation_rating
      label: Overall Navigation Rating
      hint: How would you rate the overall navigation of the website?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: find_application_process
      label: Ease of Finding Application Process
      hint: How easy was it to find information about the application process?
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 8
      name: find_requirements
      label: Ease of Finding Requirements
      hint: How easy was it to find admission requirements?
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 9
      name: find_deadlines
      label: Ease of Finding Deadlines
      hint: How easy was it to find application deadlines?
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 10
      name: find_financial_info
      label: Ease of Finding Financial Information
      hint: How easy was it to find financial aid or tuition information?
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 11
      name: website_design_rating
      label: Website Design Rating
      hint: How would you rate the visual design of the website?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: mobile_friendly
      label: Mobile-Friendly Experience
      hint: How would you rate the mobile experience of the website?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: search_functionality
      label: Search Functionality
      hint: How would you rate the search functionality?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: information_clarity
      label: Clarity of Information
      hint: How clear was the information presented on the website?
      type: select_one
      options:
      - Very Clear
      - Clear
      - Neutral
      - Unclear
      - Very Unclear
      required: true
    - id: 15
      name: application_process_clarity
      label: Clarity of Application Process
      hint: How clear was the application process explained?
      type: select_one
      options:
      - Very Clear
      - Clear
      - Neutral
      - Unclear
      - Very Unclear
      required: true
    - id: 16
      name: document_upload_process
      label: Document Upload Process
      hint: How would you rate the document upload process?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: technical_issues
      label: Technical Issues Encountered
      hint: Did you experience any technical issues?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: technical_issues_description
      label: Technical Issues Description
      hint: If yes, please describe the technical issues you encountered
      type: text
      options: []
      required: false
    - id: 19
      name: positive_aspects
      label: Positive Aspects
      hint: What did you like most about the website?
      type: text
      options: []
      required: false
    - id: 20
      name: improvement_suggestions
      label: Improvement Suggestions
      hint: What suggestions do you have for improving the website?
      type: text
      options: []
      required: false
    - id: 21
      name: likelihood_to_recommend
      label: Likelihood to Recommend
      hint: How likely are you to recommend this website to others? (1 = Not at all
        likely, 10 = Extremely likely)
      type: number
      options: []
      required: true
    - id: 22
      name: survey_date
      label: Survey Date
      hint: Date of completing this survey
      type: date
      options: []
      required: true
