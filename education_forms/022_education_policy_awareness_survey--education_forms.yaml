inputSchema:
  type: object
  properties:
    title: Education Policy Awareness Survey
    pages:
    - id: 1
      name: student_role
      label: what_is_your_student_role
      hint: null
      type: select_one
      options:
      - Student
      - Teacher
      - Parent
      - Other
      required: true
