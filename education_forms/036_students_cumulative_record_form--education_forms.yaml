      - English 202
      - Science 101
      - History 101
      required: false
    - id: 6
      name: course_2
      label: Course 2
      hint: null
      type: select_multiple
      options:
      - Math 202
      - English 203
      - Science 202
      - History 202
      required: false
    - id: 7
      name: term_start_date
      label: Term Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: term_end_date
      label: Term End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
