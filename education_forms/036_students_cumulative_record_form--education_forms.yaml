inputSchema:
  type: object
  properties:
    title: Students Cumulative Record Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_id
      label: Student Id
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: true
    - id: 4
      name: student_grade
      label: Student Grade
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: course_1
      label: Course 1
      hint: null
