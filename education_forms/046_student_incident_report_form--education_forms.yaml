      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: incident_witnesses
      label: Incident Witnesses
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: incident_suspended
      label: Was student suspended?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: incident_touched
      label: Touched during incident
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
