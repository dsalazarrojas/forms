inputSchema:
  type: object
  properties:
    title: Classroom Based Assessment Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Full name of the student
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID Number
      hint: Student identification number
      type: text
      options: []
      required: true
    - id: 3
      name: teacher_name
      label: Teacher Name
      hint: Name of the instructor
      type: text
      options: []
      required: true
    - id: 4
      name: subject
      label: Subject Area
      hint: Subject being assessed
      type: text
      options: []
      required: true
    - id: 5
      name: assessment_date
      label: Assessment Date
      hint: Date of the assessment
      type: date
      options: []
      required: true
    - id: 6
      name: section_header_academic
      label: -- Academic Performance --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: knowledge_understanding
      label: Knowledge and Understanding of Concepts
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: application_skills
      label: Application of Skills and Knowledge
      hint: Can the student apply what they have learned?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: problem_solving
      label: Problem-Solving Ability
      hint: How well does the student solve problems?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: critical_thinking
      label: Critical Thinking Skills
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: section_header_communication
      label: -- Communication and Collaboration --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: oral_communication
      label: Oral Communication Skills
      hint: Can the student express ideas clearly verbally?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: written_communication
      label: Written Communication Skills
      hint: Can the student express ideas clearly in writing?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: collaboration_teamwork
      label: Collaboration and Teamwork
      hint: How well does the student work with peers?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: section_header_behavior
      label: -- Behavior and Engagement --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: class_participation
      label: Class Participation
      hint: How active is the student in class?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: on_task_behavior
      label: On-Task Behavior
      hint: Does the student stay focused on assignments?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 18
      name: homework_completion
      label: Homework Completion
      hint: Does the student complete assignments on time?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 19
      name: attention_to_detail
      label: Attention to Detail
      hint: Does the student show care in their work?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 20
      name: section_header_strengths
      label: -- Strengths and Areas for Growth --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: student_strengths
      label: Key Strengths
      hint: Describe the student's major strengths
      type: text
      options: []
      required: true
    - id: 22
      name: areas_for_growth
      label: Areas for Growth
      hint: Identify areas where the student needs improvement
      type: text
      options: []
      required: true
    - id: 23
      name: recommended_support
      label: Recommended Support or Interventions
      hint: What support would help this student succeed?
      type: text
      options: []
      required: false
    - id: 24
      name: overall_assessment_score
      label: Overall Assessment Score
      hint: Grade or percentage (0-100)
      type: number
      options: []
      required: true
