inputSchema:
  type: object
  properties:
    title: School Counselor Interview Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: counselor_name
      label: Counselor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: school_year
      label: School Year
      hint: null
      type: select_one
      options:
      - Freshman
      - Sophomore
      - Junior
      - Senior
      required: false
    - id: 4
      name: student_grade
      label: Student Grade
      hint: null
      type: select_multiple
      options:
      - '9'
      - '10'
      - '11'
      - '12'
      required: false
    - id: 5
      name: reason_for_counseling
      label: Reason for Counseling
      hint: Please specify the reason for the student being in counseling.
      type: text
      options: []
      required: false
    - id: 6
      name: counseling_outcomes
      label: Counseling Outcomes
      hint: Describe the outcomes of the counseling session.
      type: text
      options: []
      required: false
    - id: 7
      name: additional_notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
