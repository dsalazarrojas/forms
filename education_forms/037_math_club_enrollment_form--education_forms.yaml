inputSchema:
  type: object
  properties:
    title: Math Club Enrollment Form
    pages:
    - id: 1
      name: student_info
      label: Student Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_math_level
      label: Math Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 3
      name: math_club_interest
      label: Math Club Interest
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: math_club_commitment
      label: Math Club Commitment
      hint: null
      type: time
      options: []
      required: false
