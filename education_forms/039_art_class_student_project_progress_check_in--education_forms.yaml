      hint: null
      type: select_one
      options:
      - Very confident
      - Confident
      - Somewhat confident
      - Lacking confidence
      - Need significant help
      required: true
    - id: 19
      name: materials_access
      label: Access to Materials and Resources
      hint: null
      type: select_one
      options:
      - Excellent access
      - Good access
      - Adequate access
      - Limited access
      - No access
      required: true
    - id: 20
      name: support_needed
      label: Additional Support Needed
      hint: null
      type: select_multiple
      options:
      - Technique instruction
      - Material recommendations
      - Design feedback
      - Time management help
      - Motivation or encouragement
      - Peer feedback
      - None
      required: false
    - id: 21
      name: section_quality
      label: -- Work Quality Assessment --
      hint: null
      type: note
      options: []
      required: false
