      name: percent_complete
      label: Percentage of Project Complete
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: progress_status
      label: Current Progress Status
      hint: null
      type: select_one
      options:
      - Ahead of schedule
      - On schedule
      - Slightly behind
      - Significantly behind
      - Complete
      required: true
    - id: 15
      name: current_phase
      label: Current Phase of Project
      hint: Planning, sketching, drafting, final, etc.
      type: text
      options: []
      required: true
