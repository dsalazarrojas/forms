      required: true
    - id: 23
      name: creativity_level
      label: Creativity and Originality
      hint: null
      type: select_one
      options:
      - Highly creative
      - Creative
      - Moderately creative
      - Limited creativity
      - Copying reference
      required: true
    - id: 24
      name: concept_development
      label: Concept Development
      hint: null
      type: select_one
      options:
      - Well developed
      - Developed
      - Partially developed
      - Underdeveloped
      - Unclear
      required: true
    - id: 25
      name: section_feedback
      label: -- Student Self-Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: self_satisfaction
      label: How satisfied are you with your progress
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 27
      name: next_steps
      label: Next Steps or Goals for Project
      hint: null
      type: text
      options: []
      required: true
    - id: 28
      name: instructor_feedback
      label: Instructor Feedback or Comments
      hint: null
      type: text
      options: []
      required: false
