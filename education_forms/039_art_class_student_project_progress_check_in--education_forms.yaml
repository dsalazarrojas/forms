      name: section_student_info
      label: -- Student and Class Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: class_name
      label: Class Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: check_in_date
      label: Check-in Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: section_project_info
      label: -- Project Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: project_title
      label: Project Title
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: project_medium
      label: Project Medium or Medium
      hint: Drawing, painting, sculpture, etc.
      type: text
      options: []
      required: true
    - id: 10
      name: project_start_date
      label: Project Start Date
      hint: null
      type: date
      options: []
      required: true
