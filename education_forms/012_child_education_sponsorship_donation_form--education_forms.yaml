inputSchema:
  type: object
  properties:
    title: Child Education Sponsorship Donation Form
    pages:
    - id: 1
      name: section_donor_info
      label: -- Donor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: donor_name
      label: Donor Full Name
      hint: Personal or Corporate name
      type: text
      options: []
      required: true
    - id: 3
      name: donor_email
      label: Donor Email Address
      hint: For receipt and acknowledgement
      type: email
      options: []
      required: true
    - id: 4
      name: donor_phone
      label: Donor Phone Number
      hint: Optional contact info
      type: text
      options: []
      required: false
    - id: 5
      name: section_donation_selection
      label: -- Donation Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: sponsorship_type
      label: Sponsorship Type
      hint: Choose your contribution frequency
      type: select_one
      options:
      - One-time Gift
      - Monthly Recurring
      - Annual Sponsorship
      required: true
    - id: 7
      name: donation_amount_selection
      label: Suggested Donation Amount
      hint: Select an amount or enter custom below
      type: select_one
      options:
      - $25 - Monthly Support
      - $50 - Supply Kit
      - $100 - Tuition Assistance
      - $500 - Major Initiative
      - Custom Amount
      required: true
    - id: 8
      name: custom_amount
      label: Custom Donation Amount
      hint: Enter numeric value only
      type: number
      options: []
      required: false
    - id: 9
      name: primary_initiative
      label: Primary Initiative to Support
      hint: Where should your funds go?
      type: select_one
      options:
      - Student Scholarships
      - School Supplies and Tech
      - Teacher Training
      - Facility Improvements
      required: true
    - id: 10
      name: section_payment_pref
      label: -- Payment Method Preference --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: payment_method
      label: Preferred Payment Method
      hint: Secure processing will follow
      type: select_one
      options:
      - Credit or Debit Card
      - PayPal
      - Bank Transfer (ACH)
      required: true
    - id: 12
      name: section_anonymous
      label: -- Anonymous Donation Options --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: is_anonymous
      label: Anonymous Donation?
      hint: Select yes to keep your name private
      type: select_one
      options:
      - Yes - Keep my donation anonymous
      - No - Publicly acknowledge my gift
      required: true
