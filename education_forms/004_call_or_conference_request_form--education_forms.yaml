inputSchema:
  type: object
  properties:
    title: Call Or Conference Request Form
    pages:
    - id: 1
      name: contact_info_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: organization_school
      label: Organization or School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Where we should send the calendar invitation
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: For day-of-meeting contact
      type: text
      options: []
      required: true
    - id: 6
      name: meeting_details_header
      label: -- Meeting Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: meeting_topic
      label: Topic of Discussion
      hint: Brief summary of what you would like to discuss
      type: text
      options: []
      required: true
    - id: 8
      name: meeting_type
      label: Preferred Meeting Type
      hint: How would you like to connect?
      type: select_one
      options:
      - Phone Call
      - Video Conference (Zoom/Teams)
      - In-Person Meeting
      required: true
    - id: 9
      name: preferred_date_1
      label: Preferred Date - Option 1
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: preferred_time_1
      label: Preferred Time - Option 1
      hint: Please include timezone if different from EST
      type: text
      options: []
      required: true
    - id: 11
      name: preferred_date_2
      label: Preferred Date - Option 2
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: preferred_time_2
      label: Preferred Time - Option 2
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: estimated_duration
      label: Estimated Duration
      hint: How much time do you anticipate needing?
      type: select_one
      options:
      - 15 Minutes
      - 30 Minutes
      - 45 Minutes
      - 60 Minutes
      required: true
    - id: 14
      name: additional_participants
      label: Names of Additional Participants
      hint: List anyone else who will be joining the call
      type: text
      options: []
      required: false
    - id: 15
      name: relevant_documents
      label: Links to Relevant Documents
      hint: Shared drives, portfolios, or background info
      type: text
      options: []
      required: false
    - id: 16
      name: special_instructions
      label: Special Instructions or Accessibility Needs
      hint: Any accommodations required for the meeting
      type: text
      options: []
      required: false
