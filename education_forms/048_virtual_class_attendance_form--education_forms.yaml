inputSchema:
  type: object
  properties:
    title: Virtual Class Attendance Form
    pages:
    - id: 1
      name: virtual_class_attendance_form
      label: Virtual Class Attendance
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: date
      label: Date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 3
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: class_code
      label: Class Code
      hint: 3-digit code for the class
      type: text
      options: []
      required: false
    - id: 5
      name: student_name
      label: Student Name
      hint: Student name
      type: text
      options: []
      required: false
    - id: 6
      name: attendance_status
      label: Attendance Status
      hint: null
      type: select_multiple
      options:
      - Present
      - Absent
      - Late
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: Additional comments about the student's attendance status
      type: text
      options: []
      required: false
