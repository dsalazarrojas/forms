      - Option 2
      - Option 3
      required: true
    - id: 7
      name: examiner_name
      label: Examiner Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: examiner_position
      label: Examiner Position
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: true
    - id: 9
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: exam_score
      label: Exam Score
      hint: null
      type: number
      options: []
      required: true
