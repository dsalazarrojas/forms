inputSchema:
  type: object
  properties:
    title: Student Data Base Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: student_date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: student_grade
      label: Grade
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: selected_program
      label: Selected Program
      hint: null
      type: select_one
      options:
      - A
      - B
      - C
      required: false
    - id: 7
      name: selected_program_other
      label: Other Program (if not listed above)
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: selected_program_other_program
      label: Other Program
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: student_status
      label: Student Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Unknown
      required: false
