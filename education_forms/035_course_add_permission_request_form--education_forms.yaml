      label: Approval Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: form_submissions
      label: Form Submissions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: submitter_name
      label: Submitter's Name
      hint: null
      type: text
      options: []
      required: false
