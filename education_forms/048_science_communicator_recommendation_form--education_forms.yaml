inputSchema:
  type: object
  properties:
    title: Science Communicator Recommendation Form
    pages:
    - id: 1
      name: education_level
      label: Education Level
      hint: null
      type: select_one
      options:
      - 9th-12th
      - Baccalaureate
      - Master
      - Doctoral
      required: true
    - id: 2
      name: science_background
      label: Science Background
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: communication_skills
      label: Communication Skills
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: recommender_name
      label: Recommender Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: recommender_position
      label: Recommender Position
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: recommender_institution
      label: Recommender Institution
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: recommender_email
      label: Recommender Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: recommender_date
      label: Recommender Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: recommender_time
      label: Recommender Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: recommender_agreed
      label: Recommender Agreed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: recommender_additional_comments
      label: Recommender Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: recommender_comments
      label: Recommender Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: recommender_signature
      label: Recommender Signature
      hint: null
      type: text
      options: []
      required: false
