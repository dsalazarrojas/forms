inputSchema:
  type: object
  properties:
    title: AMC Answer Sheet
    pages:
    - id: 1
      name: student_full_name
      label: Student Full Name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID Number
      hint: Your unique identification number
      type: text
      options: []
      required: true
    - id: 3
      name: exam_date
      label: Exam Date
      hint: Date when the exam is taken
      type: date
      options: []
      required: true
    - id: 4
      name: exam_type
      label: Exam Type
      hint: Which AMC exam are you taking?
      type: select_one
      options:
      - AMC 10A
      - AMC 10B
      - AMC 12A
      - AMC 12B
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Current grade in school
      type: number
      options: []
      required: true
    - id: 6
      name: school_name
      label: School Name
      hint: Name of your school
      type: text
      options: []
      required: true
    - id: 7
      name: teacher_name
      label: Teacher or Proctor Name
      hint: Name of the supervising teacher
      type: text
      options: []
      required: true
    - id: 8
      name: question_1_answer
      label: Question 1 Answer
      hint: Enter your answer for question 1 (A, B, C, D, or E)
      type: select_one
      options:
      - A
      - B
      - C
      - D
      - E
      - Blank
      required: false
