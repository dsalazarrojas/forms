inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: course_progress
      label: Course Progress
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_title
      label: course_title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: course_description
      label: course_description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: grade
      label: grade
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: course_completion_date
      label: Course Completion Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: course_status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 7
      name: course_status_updated_at
      label: Updated
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: course_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: course_status_updated_by
      label: Updated By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: course_completion_form_id
      label: course_completion_form_id
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: course_status_awaiting_approval
      label: Status - Awaiting Approval
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 12
      name: course_status_completed
      label: Status - Completed
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 13
      name: course_status_dropped
      label: Status - Dropped
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
