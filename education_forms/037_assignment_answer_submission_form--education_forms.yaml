inputSchema:
  type: object
  properties:
    title: Assignment Answer Submission Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID Number
      hint: School ID
      type: text
      options: []
      required: true
    - id: 3
      name: grade_level
      label: Grade Level
      hint: Which grade
      type: select_one
      options:
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      - Undergraduate
      - Graduate
      required: true
    - id: 4
      name: email
      label: School Email
      hint: Student email
      type: email
      options: []
      required: true
    - id: 5
      name: subject
      label: Subject
      hint: Course subject
      type: select_one
      options:
      - Mathematics
      - Science
      - English
      - History
      - Foreign Language
      - Arts
      - Physical Education
      - Other
      required: true
    - id: 6
      name: assignment_name
      label: Assignment Name
      hint: Title of assignment
      type: text
      options: []
      required: true
    - id: 7
      name: assignment_type
      label: Assignment Type
      hint: What kind
      type: select_one
      options:
      - Homework
      - Quiz
      - Test
      - Project
      - Essay
      - Lab Report
      - Presentation
      - Other
      required: true
    - id: 8
      name: assignment_date
      label: Assignment Date
      hint: When assigned
      type: date
      options: []
      required: true
    - id: 9
      name: due_date
      label: Due Date
      hint: When due
      type: date
      options: []
      required: true
    - id: 10
      name: submission_date
      label: Submission Date
      hint: When submitting
      type: date
      options: []
      required: true
    - id: 11
      name: answer_format
      label: Answer Format
      hint: How answers are formatted
      type: select_one
      options:
      - Written Document
      - Multiple Choice Sheet
      - Digital File
      - Handwritten Scanned
      - Online Quiz
      - Other
      required: true
    - id: 12
      name: file_attachment
      label: Attach Answer File
      hint: Upload submission
      type: text
      options: []
      required: true
    - id: 13
      name: answer_text
      label: Type Answers Here
      hint: If text submission
      type: text
      options: []
      required: false
    - id: 14
      name: question_1_answer
      label: Question 1 Answer
      hint: First answer
      type: text
      options: []
      required: false
    - id: 15
      name: question_2_answer
      label: Question 2 Answer
      hint: Second answer
      type: text
      options: []
      required: false
    - id: 16
      name: question_3_answer
      label: Question 3 Answer
      hint: Third answer
      type: text
      options: []
      required: false
    - id: 17
      name: total_questions_answered
      label: Total Questions Answered
      hint: Count
      type: number
      options: []
      required: true
    - id: 18
      name: time_spent_minutes
      label: Time Spent in Minutes
      hint: How long took
      type: number
      options: []
      required: false
    - id: 19
      name: resources_used
      label: Resources Used
      hint: What helped you
      type: select_multiple
      options:
      - Textbook
      - Class Notes
      - Online Research
      - Tutor
      - Study Group
      - Teacher Help
      - None
      required: true
    - id: 20
      name: difficulty_level
      label: Perceived Difficulty Level
      hint: How hard was it
      type: select_one
      options:
      - Very Easy
      - Easy
      - Moderate
      - Difficult
      - Very Difficult
      required: true
    - id: 21
      name: help_needed
      label: Do You Need Help Understanding
      hint: Need clarification
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: help_topics
      label: Topics Needing Help
      hint: What to review
      type: text
      options: []
      required: false
    - id: 23
      name: academic_honesty
      label: I Confirm This Is My Own Work
      hint: Honesty statement
      type: select_one
      options:
      - Yes I Confirm
      - 'No'
      required: true
    - id: 24
      name: student_signature
      label: Student Signature
      hint: Type name
      type: text
      options: []
      required: true
