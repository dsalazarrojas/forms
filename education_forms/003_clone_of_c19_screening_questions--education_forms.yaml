inputSchema:
  type: object
  properties:
    title: Clone Of C19 Screening Questions
    pages:
    - id: 1
      name: screening_header
      label: -- COVID Screening --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Student or participant name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_screening
      label: Date of screening
      hint: YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 4
      name: have_symptoms
      label: Do you have any symptoms
      hint: Select yes if symptomatic
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 5
      name: symptoms_list
      label: Symptoms experienced
      hint: List symptoms if any
      type: text
      options: []
      required: false
    - id: 6
      name: recent_positive_test
      label: Recently tested positive for COVID
      hint: Within the last 14 days
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 7
      name: close_contact
      label: Close contact with confirmed case
      hint: Within the last 14 days
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 8
      name: temperature_reading
      label: Temperature reading in degrees C
      hint: Enter numeric value if available
      type: number
      options: []
      required: false
    - id: 9
      name: additional_comments
      label: Additional comments
      hint: Any other information for screening
      type: text
      options: []
      required: false
    - id: 10
      name: consent_statement
      label: Consent to follow school guidance
      hint: I agree to follow public health guidance
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
