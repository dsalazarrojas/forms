inputSchema:
  type: object
  properties:
    title: Tech Skill Course Lead Generation Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: course_title
      label: Course Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: course_description
      label: Course Description
      hint: Briefly describe the course
      type: note
      options: []
      required: false
    - id: 7
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How would you like to be contacted?
      type: select_one
      options:
      - Phone Call
      - Email
      - SMS
      required: true
    - id: 8
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Chinese
      required: true
    - id: 9
      name: location
      label: Location
      hint: City, State, or Zip
      type: text
      options: []
      required: true
    - id: 10
      name: interested_in_follow_up
      label: Interested in Follow-up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: follow_up_frequency
      label: Follow-up Frequency
      hint: null
      type: select_one
      options:
      - Once a week
      - Twice a week
      - Daily
      - Never
      required: true
    - id: 12
      name: follow_up_message
      label: Follow-up Message
      hint: Leave a message to support faster follow-up
      type: note
      options: []
      required: false
    - id: 13
      name: follow_up_time
      label: Follow-up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: course_format
      label: Course Format
      hint: null
      type: select_multiple
      options:
      - In-person
      - Online
      - Hybrid
      required: true
    - id: 15
      name: course_level
      label: Course Level
      hint: null
      type: select_one
      options:
      - Basic
      - Intermediate
      - Advanced
      required: true
    - id: 16
      name: course_duration
      label: Course Duration
      hint: null
      type: select_one
      options:
      - One week
      - Four weeks
      - Eight weeks
      - Longer than eight weeks
      required: true
    - id: 17
      name: course_start_date
      label: Course Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 18
      name: course_end_date
      label: Course End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 19
      name: course_start_time
      label: Course Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 20
      name: course_end_time
      label: Course End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 21
      name: course_frequency
      label: Course Frequency
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-weekly
      - Monthly
      required: true
    - id: 22
      name: course_time_zone
      label: Course Time Zone
      hint: null
      type: select_one
      options:
      - EST
      - PST
      - MST
      - CST
      required: true
    - id: 23
      name: course_language
      label: Course Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Chinese
      required: true
    - id: 24
      name: course_price
      label: Course Price
      hint: null
      type: number
      options: []
      required: true
    - id: 25
      name: follow_up_method
      label: Follow-up Method
      hint: How would you like to be contacted for follow-up?
      type: select_one
      options:
      - Phone Call
      - Email
      - SMS
      required: true
