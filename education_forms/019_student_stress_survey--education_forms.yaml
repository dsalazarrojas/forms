      options:
      - Highly Stressed
      - Moderately Stressed
      - Slightly Stressed
      - Not Stressed
      required: false
    - id: 7
      name: finances
      label: Finances
      hint: null
      type: select_one
      options:
      - Highly Stressed
      - Moderately Stressed
      - Slightly Stressed
      - Not Stressed
      required: false
    - id: 8
      name: health_and_physical_activity
      label: Health and physical activity
      hint: null
      type: select_one
      options:
      - Highly Stressed
      - Moderately Stressed
      - Slightly Stressed
      - Not Stressed
      required: false
    - id: 9
      name: academic_expectations
      label: Academic expectations
      hint: null
      type: select_one
      options:
      - Highly Stressed
      - Moderately Stressed
      - Slightly Stressed
      - Not Stressed
      required: false
    - id: 10
      name: social_media
      label: Social Media
      hint: null
      type: select_one
      options:
      - Highly Stressed
      - Moderately Stressed
      - Slightly Stressed
      - Not Stressed
      required: false
