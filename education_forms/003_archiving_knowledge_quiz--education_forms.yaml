      hint: null
      type: select_multiple
      options:
      - Description of content
      - Access restrictions
      - Creation date information
      - File size information
      required: true
    - id: 10
      name: question_4
      label: Which is a key consideration for archive storage
      hint: null
      type: select_one
      options:
      - Temperature control
      - Network speed
      - User password complexity
      - Monitor refresh rate
      required: true
    - id: 11
      name: question_5
      label: What is digital obsolescence
      hint: null
