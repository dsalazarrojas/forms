      name: section_quiz
      label: -- Knowledge Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: question_1
      label: What is the primary goal of digital archiving
      hint: null
      type: select_one
      options:
      - To preserve materials for future access
      - To make files smaller in size
      - To encrypt sensitive data
      - To backup server systems
      required: true
    - id: 8
      name: question_2
      label: Which file format is best for long-term preservation
      hint: null
      type: select_one
      options:
      - JPEG
      - PDF/A
      - DOCX
      - MP4
      required: true
