inputSchema:
  type: object
  properties:
    title: Academic Records Authorization Form
    pages:
    - id: 1
      name: records_authorization_intro
      label: Academic Records Authorization
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Full name of the student authorizing record release
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID
      hint: Official student identification number
      type: text
      options: []
      required: true
    - id: 4
      name: student_email
      label: Student Email
      hint: Current email address for student
      type: email
      options: []
      required: true
    - id: 5
      name: authorized_party_name
      label: Authorized Party Name
      hint: Full name of the person or organization receiving the records
      type: text
      options: []
      required: true
    - id: 6
      name: authorized_party_institution
      label: Authorized Party Institution/Organization
      hint: Institution or organization name of the authorized party
      type: text
      options: []
      required: true
    - id: 7
      name: authorized_party_address
      label: Authorized Party Address
      hint: Complete mailing address for the authorized party
      type: text
      options: []
      required: true
    - id: 8
      name: records_type_requested
      label: Type of Records Requested
      hint: What specific records are being requested?
      type: select_multiple
      options: ["Official transcripts", "Course syllabi", "Grades", "Degree verification", "Enrollment verification", "Academic standing", "Test scores", "Other"]
      required: false
    - id: 9
      name: academic_periods_covered
      label: Academic Periods Covered
      hint: Which academic periods should be included in the records?
      type: text
      options: []
      required: true
    - id: 10
      name: authorization_purpose
      label: Purpose of Authorization
      hint: Why are these records being requested?
      type: text
      options: []
      required: true
    - id: 11
      name: authorization_validity_period
      label: Authorization Validity Period
      hint: How long should this authorization remain valid?
      type: select_one
      options: ["One-time request", "30 days", "60 days", "90 days", "6 months", "1 year", "Indefinite"]
      required: true
    - id: 12
      name: fee_payment_acknowledgment
      label: Fee Payment Acknowledgment
      hint: Do you acknowledge that fees may apply for record processing?
      type: select_one
      options: ["Yes, I acknowledge", "Yes, and I will pay promptly", "No, I believe it's free", "Need clarification"]
      required: true
    - id: 13
      name: privacy_rights_acknowledgment
      label: Privacy Rights Acknowledgment
      hint: Do you understand you have the right to inspect these records before release?
      type: select_one
      options: ["Yes, I understand", "No, I waive this right", "Need clarification"]
      required: true
    - id: 14
      name: revocation_rights_acknowledgment
      label: Revocation Rights Acknowledgment
      hint: Do you understand you can revoke this authorization at any time?
      type: select_one
      options: ["Yes, I understand", "No, need clarification"]
      required: true
    - id: 15
      name: signature_consent
      label: Electronic Signature Consent
      hint: Do you consent to using an electronic signature for this authorization?
      type: select_one
      options: ["Yes, I consent", "No, I prefer handwritten signature"]
      required: true
    - id: 16
      name: student_signature
      label: Student Signature
      hint: Type your full name as your electronic signature
      type: text
      options: []
      required: true
    - id: 17
      name: signature_date
      label: Date of Signature
      hint: Date when this authorization is signed
      type: date
      options: []
      required: true
