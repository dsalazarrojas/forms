inputSchema:
  type: object
  properties:
    title: Scholarship Apply Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: gpa
      label: GPA
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: student_address
      label: Student Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student
      label: Student
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: academic_program
      label: Academic Program
      hint: null
      type: select_one
      options:
      - Program 1
      - Program 2
      - Program 3
      required: false
    - id: 8
      name: scholarship_essay
      label: Scholarship Essay
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
