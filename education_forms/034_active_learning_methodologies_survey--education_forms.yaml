inputSchema:
  type: object
  properties:
    title: Active Learning Methodologies Survey
    pages:
    - id: 1
      name: educator_role
      label: Your Role in Education
      hint: Select your primary role in the educational environment
      type: select_one
      options: ["Teacher", "Professor", "Instructional Designer", "School Administrator", "Curriculum Coordinator", "Student", "Other"]
      required: true
    - id: 2
      name: education_level
      label: Education Level Taught
      hint: What level of education do you primarily teach
      type: select_one
      options: ["Elementary", "Middle School", "High School", "College/University", "Adult Education", "Professional Training", "Other"]
      required: true
    - id: 3
      name: years_experience
      label: Years of Teaching Experience
      hint: How many years of experience do you have in teaching
      type: select_one
      options: ["Less than 1 year", "1-3 years", "4-7 years", "8-15 years", "More than 15 years"]
      required: true
    - id: 4
      name: active_learning_familiarity
      label: Familiarity with Active Learning Methodologies
      hint: How familiar are you with active learning methodologies
      type: select_one
      options: ["Very familiar", "Somewhat familiar", "Heard of it but not familiar", "Not familiar at all"]
      required: true
    - id: 5
      name: active_learning_implementation
      label: Do You Implement Active Learning Strategies
      hint: Are you currently using active learning strategies in your teaching
      type: select_one
      options: ["Yes, regularly", "Yes, occasionally", "No, but planning to", "No, not interested", "No, unfamiliar with methods"]
      required: true
    - id: 6
      name: commonly_used_strategies
      label: Commonly Used Active Learning Strategies
      hint: Select the active learning strategies you currently use
      type: select_multiple
      options: ["Think-Pair-Share", "Case Studies", "Problem-Based Learning", "Collaborative Learning", "Interactive Lectures", "Peer Instruction", "Flipped Classroom", "Gamification", "None"]
      required: false
    - id: 7
      name: implementation_challenges
      label: Challenges in Implementing Active Learning
      hint: Select all challenges you face in implementing active learning
      type: select_multiple
      options: ["Large class sizes", "Limited time", "Student resistance", "Lack of resources", "Institutional support", "Assessment difficulties", "Physical space constraints", "None"]
      required: false
    - id: 8
      name: student_engagement_improvement
      label: Improvement in Student Engagement
      hint: Have you observed improvement in student engagement with active learning
      type: select_one
      options: ["Significant improvement", "Moderate improvement", "Slight improvement", "No change", "Declined"]
      required: true
    - id: 9
      name: learning_outcomes_improvement
      label: Improvement in Learning Outcomes
      hint: Have you observed improvement in learning outcomes with active learning
      type: select_one
      options: ["Significant improvement", "Moderate improvement", "Slight improvement", "No change", "Declined"]
      required: true
    - id: 10
      name: professional_development_needs
      label: Professional Development Needs
      hint: What type of professional development do you need for active learning
      type: select_multiple
      options: ["Workshops", "Online courses", "Peer mentoring", "Conference attendance", "Resource materials", "Technology training", "None currently needed"]
      required: false
    - id: 11
      name: institutional_support_level
      label: Level of Institutional Support
      hint: How would you rate your institution's support for active learning
      type: select_one
      options: ["Excellent", "Good", "Adequate", "Poor", "No support"]
      required: true
    - id: 12
      name: additional_resources_desired
      label: Additional Resources Desired
      hint: What additional resources would help you implement active learning
      type: text
      options: []
      required: false
    - id: 13
      name: success_stories
      label: Success Stories or Examples
      hint: Share any success stories or examples of active learning implementation
      type: text
      options: []
      required: false
