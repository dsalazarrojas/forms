inputSchema:
  type: object
  properties:
    title: City Year Event Proposal Form
    pages:
    - id: 1
      name: proposer_info_header
      label: -- Proposer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: proposer_name
      label: Proposer Name
      hint: Person submitting the proposal
      type: text
      options: []
      required: true
    - id: 3
      name: proposer_organization
      label: Organization or School
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: proposer_email
      label: Proposer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: proposer_phone
      label: Proposer Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: event_details_header
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: event_description
      label: Event Description
      hint: What is this event and what will it accomplish
      type: text
      options: []
      required: true
    - id: 9
      name: event_date
      label: Proposed Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: event_duration
      label: Event Duration
      hint: How long will the event run
      type: text
      options: []
      required: true
    - id: 11
      name: event_location
      label: Proposed Location
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: expected_attendance
      label: Expected Number of Participants
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: target_audience
      label: Target Audience
      hint: null
      type: select_one
      options:
      - Youth - K-12
      - Young adults - 18-25
      - Adults - 25-65
      - Seniors - 65+
      - Mixed/All ages
      - Other
      required: true
    - id: 14
      name: objectives_header
      label: -- Event Objectives and Impact --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: learning_outcomes
      label: Learning or Development Outcomes
      hint: What will participants learn or gain
      type: text
      options: []
      required: true
    - id: 16
      name: community_impact
      label: Expected Community Impact
      hint: How will this benefit the community
      type: text
      options: []
      required: true
    - id: 17
      name: alignment_city_year
      label: How does this align with City Year mission
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: budget_header
      label: -- Budget and Resources --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: estimated_budget
      label: Estimated Budget
      hint: Approximate total cost
      type: number
      options: []
      required: true
    - id: 20
      name: funding_sources
      label: Proposed Funding Sources
      hint: Where will funding come from
      type: text
      options: []
      required: false
    - id: 21
      name: required_resources
      label: Required Resources and Materials
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: approval_status
      label: Ready for Approval
      hint: null
      type: select_one
      options:
      - Yes, ready to submit
      - No, needs more work
      required: true
