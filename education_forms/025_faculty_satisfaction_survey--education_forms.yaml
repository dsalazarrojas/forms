inputSchema:
  type: object
  properties:
    title: Faculty Satisfaction Survey
    pages:
    - id: 1
      name: intro
      label: Welcome to our Faculty Satisfaction Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: course_id
      label: Which course are you taking?
      hint: null
      type: select_one
      options:
      - '{''value'': 1, ''label'': ''Math''}'
      - '{''value'': 2, ''label'': ''Science''}'
      - '{''value'': 3, ''label'': ''History''}'
      required: false
    - id: 3
      name: teaching_quality
      label: Teaching Quality
      hint: How would you rate the quality of your teacher's teaching?
      type: number
      options: []
      required: false
    - id: 4
      name: class_size
      label: Class Size
      hint: How big do you think the ideal class size should be?
      type: number
      options: []
      required: false
    - id: 5
      name: teacher_support
      label: How much support do you think your teacher gives you?
      hint: null
      type: select_one
      options:
      - '{''value'': 1, ''label'': ''Much more than enough''}'
      - '{''value'': 2, ''label'': ''Just enough''}'
      - '{''value'': 3, ''label'': ''A little less than enough''}'
      required: false
    - id: 6
      name: materials_provided
      label: How would you rate the materials provided?
      hint: null
      type: select_multiple
      options:
      - '{''value'': 1, ''label'': ''Excellent''}'
      - '{''value'': 2, ''label'': ''Good''}'
      - '{''value'': 3, ''label'': ''Fair''}'
      - '{''value'': 4, ''label'': ''Poor''}'
      required: false
    - id: 7
      name: communication
      label: Communication
      hint: How well did your teacher communicate?
      type: note
      options: []
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you with your course?
      type: select_one
      options:
      - '{''value'': 1, ''label'': ''Very satisfied''}'
      - '{''value'': 2, ''label'': ''Satisfied''}'
      - '{''value'': 3, ''label'': ''Neutral''}'
      - '{''value'': 4, ''label'': ''Dissatisfied''}'
      - '{''value'': 5, ''label'': ''Very dissatisfied''}'
      required: false
    - id: 9
      name: comments
      label: Do you have any comments or suggestions?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
