      options:
      - Elementary students
      - High school students
      - College students
      - Working professionals
      - Executives
      - General public
      required: true
    - id: 9
      name: subject_area
      label: Subject area or topic focus
      hint: What subject will this resource cover?
      type: text
      options: []
      required: true
    - id: 10
      name: resource_format
      label: Preferred format for the resource
      hint: What type of learning material do you need?
      type: select_one
      options:
      - Interactive course
      - Video series
      - Textbook chapters
      - Workshop materials
      - Assessment tools
      - Mobile app content
      required: true
    - id: 11
      name: estimated_duration
      label: Estimated duration or length
      hint: How long should the resource be?
      type: text
      options: []
      required: false
    - id: 12
      name: section_header_learning_objectives
      label: '--- Learning Objectives ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: primary_learning_goals
      label: Primary learning goals
      hint: What should learners be able to do after completing this resource?
      type: text
      options: []
      required: true
    - id: 14
      name: prerequisite_knowledge
      label: Prerequisite knowledge required
      hint: What should learners already know before starting?
      type: text
      options: []
      required: false
    - id: 15
      name: assessment_methods
      label: Preferred assessment methods
      hint: How should learner progress be evaluated?
      type: select_multiple
      options:
      - Quizzes
      - Projects
      - Peer reviews
      - Practical exercises
      - Case studies
      - Simulations
      required: false
    - id: 16
      name: accessibility_requirements
      label: Accessibility requirements
      hint: Any special accommodations needed?
      type: text
      options: []
      required: false
    - id: 17
      name: section_header_timeline_budget
      label: '--- Timeline and Budget ---'
      hint: null
      type: note
      options: []
      required: false
