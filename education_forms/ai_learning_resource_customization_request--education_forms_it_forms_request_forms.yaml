      name: section_header_requester_info
      label: '--- Requester Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: We'll use this to contact you about your request
      type: email
      options: []
      required: true
    - id: 4
      name: institution_organization
      label: Institution or organization
      hint: Name of your school, company, or organization
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job title or role
      hint: e.g., Teacher, Training Manager, L&D Specialist
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_resource_details
      label: '--- Resource Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: resource_title
      label: Desired title for the customized resource
      hint: What would you like to name this learning material?
      type: text
      options: []
      required: false
    - id: 8
      name: target_audience
      label: Target audience for this resource
      hint: Who will be using this material?
