      hint: Any specific tools, technologies, or restrictions?
      type: text
      options: []
      required: false
    - id: 23
      name: previous_experience
      label: Previous experience with similar resources
      hint: Have you used similar AI learning materials before?
      type: select_one
      options:
      - First time
      - Beginner level
      - Intermediate experience
      - Advanced user
      required: false
    - id: 24
      name: expected_impact
      label: Expected impact or success metrics
      hint: How will you measure the success of this resource?
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
