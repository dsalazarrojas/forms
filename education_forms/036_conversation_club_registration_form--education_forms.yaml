inputSchema:
  type: object
  properties:
    title: Conversation Club Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Full Name
      hint: Legal name of participant
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Primary email for communication
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: For age grouping
      type: date
      options: []
      required: false
    - id: 5
      name: nationality
      label: Nationality
      hint: Your nationality
      type: text
      options: []
      required: false
    - id: 6
      name: section_language_info
      label: -- Language Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: native_language
      label: Native Language
      hint: Your first language
      type: text
      options: []
      required: true
    - id: 8
      name: target_language
      label: Language You Want to Practice
      hint: Which language are you learning
      type: text
      options: []
      required: true
    - id: 9
      name: proficiency_level
      label: Current Proficiency Level
      hint: In your target language
      type: select_one
      options:
      - Beginner
      - Elementary
      - Intermediate
      - Upper Intermediate
      - Advanced
      - Native
      required: true
    - id: 10
      name: language_certification
      label: Do you have any language certifications
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 11
      name: certification_details
      label: Certification Details
      hint: List any certifications
      type: text
      options: []
      required: false
    - id: 12
      name: section_club_preferences
      label: -- Club Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: session_preference
      label: Preferred Session Time
      hint: When can you attend
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekend
      - Flexible
      required: true
    - id: 14
      name: meeting_format
      label: Preferred Meeting Format
      hint: null
      type: select_one
      options:
      - In Person
      - Online
      - Hybrid
      required: true
    - id: 15
      name: group_size_preference
      label: Group Size Preference
      hint: null
      type: select_one
      options:
      - Small Group 2-4 people
      - Medium Group 5-8 people
      - Large Group 9+ people
      - No Preference
      required: false
    - id: 16
      name: conversation_topics
      label: Topics You Are Interested In
      hint: Select all that apply
      type: select_multiple
      options:
      - Daily Life
      - Travel
      - Culture
      - Business
      - Technology
      - Arts and Literature
      - Current Events
      - Hobbies
      - Food and Cooking
      - Sports
      required: true
    - id: 17
      name: section_experience
      label: -- Language Learning Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: learning_goals
      label: Your Language Learning Goals
      hint: What do you want to achieve
      type: text
      options: []
      required: true
    - id: 19
      name: previous_experience
      label: Previous Language Exchange Experience
      hint: null
      type: select_one
      options:
      - Yes - Extensive
      - Yes - Some
      - No - First Time
      required: true
    - id: 20
      name: years_studying
      label: How long have you been studying this language
      hint: null
      type: select_one
      options:
      - Less than 6 months
      - 6 months to 1 year
      - 1-3 years
      - 3-5 years
      - Over 5 years
      required: false
    - id: 21
      name: section_availability
      label: -- Availability --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: available_days
      label: Available Days
      hint: Select all that apply
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 23
      name: frequency_preference
      label: How often do you want to meet
      hint: null
      type: select_one
      options:
      - Once a week
      - Twice a week
      - Three times a week
      - Once a month
      - Flexible
      required: true
    - id: 24
      name: start_date_preference
      label: When would you like to start
      hint: null
      type: select_one
      options:
      - Immediately
      - Within 1 week
      - Within 2 weeks
      - Next month
      required: true
    - id: 25
      name: section_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: teaching_skills
      label: Can you teach your native language
      hint: null
      type: select_one
      options:
      - Yes - Experienced
      - Yes - Willing to Try
      - false
      required: false
    - id: 27
      name: special_interests
      label: Special Interests or Hobbies
      hint: For matching with conversation partners
      type: text
      options: []
      required: false
    - id: 28
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any accommodations required
      type: text
      options: []
      required: false
    - id: 29
      name: how_did_you_hear
      label: How did you hear about the conversation club
      hint: null
      type: select_one
      options:
      - Website
      - Social Media
      - Friend
      - School or University
      - Advertisement
      - Other
      required: false
    - id: 30
      name: additional_comments
      label: Additional Comments
      hint: Anything else you would like to share
      type: text
      options: []
      required: false
    - id: 31
      name: terms_accepted
      label: I agree to follow club guidelines
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 32
      name: registration_date
      label: Registration Date
      hint: Date of registration
      type: date
      options: []
      required: true
