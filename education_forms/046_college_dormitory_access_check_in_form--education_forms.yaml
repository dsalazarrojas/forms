inputSchema:
  type: object
  properties:
    title: College Dormitory Access Check In Form
    pages:
    - id: 1
      name: visitor_name
      label: Visitor Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: visitor_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: visitor_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: visitor_type
      label: Visitor Type
      hint: Category of visitor
      type: select_one
      options:
      - Student Resident
      - Student Non-Resident
      - Faculty or Staff
      - Parent or Family
      - Delivery Person
      - Maintenance Worker
      - Guest
      - Other
      required: true
    - id: 5
      name: student_id
      label: Student ID Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 6
      name: dormitory_name
      label: Dormitory Name
      hint: Which building
      type: select_one
      options:
      - Adams Hall
      - Baker House
      - Clark Tower
      - Davis Commons
      - Evans Hall
      - Ford Residence
      - Grant Tower
      - Other
      required: true
    - id: 7
      name: room_number
      label: Room Number Being Visited
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 8
      name: resident_name
      label: Resident Name Being Visited
      hint: Student name
      type: text
      options: []
      required: false
    - id: 9
      name: check_in_date
      label: Check-In Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 10
      name: check_in_time
      label: Check-In Time
      hint: Entry time
      type: time
      options: []
      required: true
    - id: 11
      name: purpose_of_visit
      label: Purpose of Visit
      hint: Why visiting
      type: select_one
      options:
      - Social Visit
      - Study Session
      - Emergency
      - Delivery
      - Maintenance
      - Official Business
      - Moving In
      - Moving Out
      - Other
      required: true
    - id: 12
      name: purpose_details
      label: Purpose Details
      hint: More information
      type: text
      options: []
      required: false
    - id: 13
      name: expected_duration
      label: Expected Duration of Visit
      hint: How long staying
      type: select_one
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-4 hours
      - 4-8 hours
      - Overnight
      - Multiple Days
      required: true
    - id: 14
      name: expected_checkout_time
      label: Expected Check-Out Time
      hint: When leaving
      type: time
      options: []
      required: false
    - id: 15
      name: vehicle_present
      label: Do You Have a Vehicle
      hint: Car on premises
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: vehicle_make
      label: Vehicle Make
      hint: Car brand
      type: text
      options: []
      required: false
    - id: 17
      name: vehicle_model
      label: Vehicle Model
      hint: Car model
      type: text
      options: []
      required: false
    - id: 18
      name: vehicle_color
      label: Vehicle Color
      hint: Car color
      type: text
      options: []
      required: false
    - id: 19
      name: license_plate
      label: License Plate Number
      hint: Plate number
      type: text
      options: []
      required: false
    - id: 20
      name: parking_location
      label: Parking Location
      hint: Where parked
      type: text
      options: []
      required: false
    - id: 21
      name: items_brought
      label: Are You Bringing Large Items
      hint: Packages or equipment
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 22
      name: items_description
      label: Items Description
      hint: What items
      type: text
      options: []
      required: false
    - id: 23
      name: overnight_guest
      label: Is This an Overnight Guest
      hint: Staying overnight
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 24
      name: overnight_approval
      label: Overnight Approval Status
      hint: If applicable
      type: select_one
      options:
      - Pre-Approved
      - Pending Approval
      - Not Applicable
      required: false
    - id: 25
      name: resident_confirmation
      label: Has Resident Confirmed This Visit
      hint: Resident verification
      type: select_one
      options:
      - Yes Confirmed
      - No Not Yet
      - Self Check-In
      required: true
    - id: 26
      name: id_verified
      label: ID Verification Status
      hint: ID checked
      type: select_one
      options:
      - Yes Verified
      - false
      required: true
    - id: 27
      name: key_issued
      label: Temporary Key Issued
      hint: If applicable
      type: select_one
      options:
      - true
      - false
      - Not Applicable
      required: true
    - id: 28
      name: key_number
      label: Key Number
      hint: Key identifier
      type: text
      options: []
      required: false
    - id: 29
      name: staff_name
      label: Staff Member Processing Check-In
      hint: Desk staff name
      type: text
      options: []
      required: true
    - id: 30
      name: additional_notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
