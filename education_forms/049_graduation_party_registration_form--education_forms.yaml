inputSchema:
  type: object
  properties:
    title: Graduation Party Registration Form
    pages:
    - id: 1
      name: graduation_party_details
      label: Graduation Party Details
      hint: Enter your Graduation Party details.
      type: text
      options: []
      required: true
    - id: 2
      name: graduation_party_attendee_name
      label: Graduation Party Attendee Name
      hint: Enter the name of the party attendee.
      type: text
      options: []
      required: true
    - id: 3
      name: graduation_party_attendee_email
      label: Graduation Party Attendee Email
      hint: Enter the email address of the party attendee.
      type: email
      options: []
      required: true
    - id: 4
      name: graduation_party_attendee_phone
      label: Graduation Party Attendee Phone
      hint: Enter the phone number of the party attendee.
      type: text
      options: []
      required: true
