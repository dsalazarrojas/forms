      name: graduation_party_date
      label: Graduation Party Date
      hint: Enter the date of the party.
      type: date
      options: []
      required: true
    - id: 6
      name: graduation_party_time
      label: Graduation Party Time
      hint: Enter the time of the party.
      type: time
      options: []
      required: true
    - id: 7
      name: graduation_party_theme
