inputSchema:
  type: object
  properties:
    title: Academic Records Request Form
    pages:
    - id: 1
      name: records_request_intro
      label: Academic Records Request
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester Name
      hint: Full name of the person requesting the records
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Requester Email
      hint: Email address for communication about this request
      type: email
      options: []
      required: true
    - id: 4
      name: requester_student_id
      label: Student ID (if applicable)
      hint: If you are a former student, provide your student ID
      type: text
      options: []
      required: false
    - id: 5
      name: requester_relationship
      label: Relationship to Institution
      hint: What is your relationship to the institution?
      type: select_one
      options: ["Current student", "Former student", "Parent/guardian", "Employer", "Government agency", "Other educational institution", "Other"]
      required: true
    - id: 6
      name: record_type_requested
      label: Type of Record Requested
      hint: What type of academic record are you requesting?
      type: select_one
      options: ["Official transcript", "Unofficial transcript", "Degree verification", "Enrollment verification", "Course completion certificate", "Test scores", "Other"]
      required: true
    - id: 7
      name: academic_period_from
      label: Academic Period From
      hint: Start date for the academic period you need records for
      type: date
      options: []
      required: false
    - id: 8
      name: academic_period_to
      label: Academic Period To
      hint: End date for the academic period you need records for
      type: date
      options: []
      required: false
    - id: 9
      name: destination_address
      label: Destination Address
      hint: Where should the records be sent?
      type: text
      options: []
      required: true
    - id: 10
      name: delivery_method
      label: Delivery Method
      hint: How would you like to receive the records?
      type: select_one
      options: ["Mail to address provided", "Pick up in person", "Electronic delivery", "Secure portal", "Other"]
      required: true
    - id: 11
      name: urgency_level
      label: Urgency Level
      hint: How urgent is this request?
      type: select_one
      options: ["Standard processing", "Expedited processing", "Rush processing", "Emergency"]
      required: true
    - id: 12
      name: purpose_of_request
      label: Purpose of Request
      hint: Why do you need these academic records?
      type: text
      options: []
      required: true
    - id: 13
      name: special_instructions
      label: Special Instructions
      hint: Any special instructions for processing this request?
      type: text
      options: []
      required: false
    - id: 14
      name: fee_payment_method
      label: Fee Payment Method
      hint: How will you pay any applicable fees?
      type: select_one
      options: ["Credit card", "Check", "Money order", "Wire transfer", "Payment plan", "Fee waiver requested"]
      required: true
    - id: 15
      name: additional_recipients
      label: Additional Recipients
      hint: Should copies be sent to anyone else?
      type: text
      options: []
      required: false
    - id: 16
      name: previous_request_number
      label: Previous Request Number (if applicable)
      hint: If this is a follow-up to a previous request, provide the reference number
      type: text
      options: []
      required: false
    - id: 17
      name: consent_to_processing
      label: Consent to Processing
      hint: Do you consent to the processing of your request according to institutional policies?
      type: select_one
      options: ["Yes, I consent", "Yes, with questions", "Need clarification before proceeding"]
      required: true
