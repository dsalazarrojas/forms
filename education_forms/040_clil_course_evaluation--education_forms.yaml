inputSchema:
  type: object
  properties:
    title: Clil Course Evaluation
    pages:
    - id: 1
      name: intro_section
      label: CLIL Course Evaluation Form
      hint: Please provide your feedback on this course
      type: note
      options: []
      required: false
    - id: 2
      name: student_info
      label: -- Student Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: semester
      label: Semester or Term
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date_of_evaluation
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: overall_section
      label: -- Overall Course Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: overall_rating
      label: Overall Course Rating - 1 to 10
      hint: 1 = Poor, 10 = Excellent
      type: number
      options: []
      required: true
    - id: 11
      name: overall_satisfaction
      label: Overall Satisfaction with the Course
      hint: null
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 12
      name: content_section
      label: -- Course Content --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: content_quality
      label: Quality of Course Content
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 14
      name: content_relevance
      label: Content Was Relevant and Up-to-Date
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
