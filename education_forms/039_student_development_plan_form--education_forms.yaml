inputSchema:
  type: object
  properties:
    title: Student Development Plan Form
    pages:
    - id: 1
      name: student_id
      label: student_id
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: grade_level
      label: grade level
      hint: null
      type: select_one
      options:
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      - High School
      required: false
    - id: 4
      name: subject_area
      label: subject_area
      hint: null
      type: select_one
      options:
      - Math
      - English
      - Science
      - History
      - Art
      required: true
    - id: 5
      name: school_year
      label: school_year
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: goals
      label: goals
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submitted_by
      label: submitted_by
      hint: null
      type: select_one
      options:
      - Student
      - Teacher
      - Parent
      required: true
    - id: 9
      name: submitted_at
      label: submitted_at
      hint: null
      type: time
      options: []
      required: true
