inputSchema:
  type: object
  properties:
    title: Internship Abroad Admission Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: nationality
      label: Nationality
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: language_proficiency
      label: Language Proficiency
      hint: null
      type: select_one
      options:
      - English
      - French
      - Spanish
      - Other (please specify)
      required: true
    - id: 7
      name: university_applying_to
      label: University or Institution Applying to
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: program_applying_for
      label: Program or Course Applying for
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: education_level
      label: Student's Current Level of Education
      hint: null
      type: select_one
      options:
      - High School
      - Undergraduate
      - Graduate
      required: true
    - id: 10
      name: reason_for_participating
      label: Reason for Participating in the Internship Program
      hint: null
      type: text
      options: []
      required: false
