inputSchema:
  type: object
  properties:
    title: BCC Student Registration Form
    pages:
    - id: 1
      name: student_first_name
      label: Student First Name
      hint: Legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: student_last_name
      label: Student Last Name
      hint: Legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: student_middle_name
      label: Student Middle Name
      hint: Optional middle name
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 6
      name: home_address
      label: Home Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 10
      name: parent_guardian_name
      label: Parent or Guardian Full Name
      hint: Primary contact name
      type: text
      options: []
      required: true
    - id: 11
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 12
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Primary contact phone
      type: text
      options: []
      required: true
    - id: 13
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: true
    - id: 15
      name: emergency_contact_relation
      label: Emergency Contact Relation
      hint: Relation to student
      type: text
      options: []
      required: true
    - id: 16
      name: grade_level
      label: Grade Level
      hint: Current or entering grade
      type: select_one
      options:
      - Kindergarten
      - Grade 1
      - Grade 2
      - Grade 3
      - Grade 4
      - Grade 5
      - Grade 6
      - Grade 7
      - Grade 8
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      required: true
    - id: 17
      name: previous_school
      label: Previous School Attended
      hint: Name of last school
      type: text
      options: []
      required: false
    - id: 18
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: List any conditions staff should know about
      type: text
      options: []
      required: false
    - id: 19
      name: medications
      label: Current Medications
      hint: List any medications taken at school
      type: text
      options: []
      required: false
    - id: 20
      name: transportation_method
      label: Transportation Method
      hint: How will student get to school
      type: select_one
      options:
      - School bus
      - Parent drop-off
      - Parent pick-up
      - Walk
      - Public transit
      - Other
      required: true
    - id: 21
      name: lunch_program
      label: Lunch Program Participation
      hint: Will student participate in lunch program
      type: select_one
      options:
      - Yes, full price
      - Yes, reduced price
      - Yes, free lunch
      - No, bring from home
      required: true
    - id: 22
      name: after_school_activities
      label: Interest in After-School Activities
      hint: Select areas of interest
      type: select_multiple
      options:
      - Sports
      - Arts and crafts
      - Music
      - Tutoring
      - Computer club
      - Drama
      - None
      required: false
    - id: 23
      name: enrollment_term
      label: Enrollment Term
      hint: Academic term for enrollment
      type: select_one
      options:
      - Fall Semester
      - Spring Semester
      - Summer Session
      - Full Year
      required: true
    - id: 24
      name: registration_date
      label: Registration Date
      hint: Date of registration
      type: date
      options: []
      required: true
    - id: 25
      name: parent_signature_consent
      label: Parent or Guardian Consent
      hint: I consent to my child's enrollment
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
