inputSchema:
  type: object
  properties:
    title: Student Technology Device Use Agreement Form
    pages:
    - id: 1
      name: student_name
      label: Student name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id_number
      label: Student ID number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_signed
      label: Date signed
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: device_use_policy
      label: Device Use Policy
      hint: null
      type: select_one
      options:
      - Accept
      - Accept with some conditions
      - Decline
      required: true
    - id: 5
      name: device_type
      label: Device type
      hint: null
      type: select_one
      options:
      - laptop
      - tablet
      - desktop
      - smartphone
      required: true
    - id: 6
      name: device_condition
      label: Device condition
      hint: null
      type: select_multiple
      options:
      - good
      - fair
      - poor
      required: true
    - id: 7
      name: agreement_duration
      label: Agreement duration
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: student_signature
      label: Student signature
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: institution_signature
      label: Institution signature
      hint: null
      type: note
      options: []
      required: true
    - id: 10
      name: device_return_status
      label: Device return status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: device_return_note
      label: Device return note
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: student_contact_number
      label: Student contact number
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: student_contact_email
      label: Student contact email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: student_contact_number_2
      label: Student Contact Number 2
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: date_signed_2
      label: Date Signed 2
      hint: null
      type: date
      options: []
      required: false
