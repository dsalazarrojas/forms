inputSchema:
  type: object
  properties:
    title: Supported Tasks For Learners
    pages:
    - id: 1
      name: learner_support_needs
      label: Learner Support Needs
      hint: null
      type: select_one
      options:
      - Need help with coursework
      - Need help with projects
      - Need help with other
      - Other (please specify)
      required: false
    - id: 2
      name: support_methods
      label: Support Methods
      hint: null
      type: select_multiple
      options:
      - Online video tutorials
      - One-on-one tutoring
      - Group work
      - Phone call
      - Email
      - Other (please specify)
      required: false
    - id: 3
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 4
      name: other_methods
      label: Other Methods
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: other_needs_specify
