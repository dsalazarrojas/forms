inputSchema:
  type: object
  properties:
    title: Classroom Policies Acknowledgement
    pages:
    - id: 1
      name: policy_intro
      label: -- Classroom Policies Acknowledgement --
      hint: Please review the classroom policies with your child before signing.
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: grade_level
      label: Grade Level
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: policy_1_attendance
      label: I understand that attendance is mandatory and I must report absences
        by 8-30 AM.
      hint: Attendance Policy
      type: select_one
      options:
      - Yes, I agree
      - Other
      required: true
    - id: 7
      name: policy_2_homework
      label: I agree to support my child in completing homework assignments and checking
        the folder daily.
      hint: Homework Policy
      type: select_one
      options:
      - Yes, I agree
      - Other
      required: true
    - id: 8
      name: policy_3_behavior
      label: I have read the Classroom Behavior and Discipline policy.
      hint: Behavior Policy
      type: select_one
      options:
      - Yes, I have read it
      - Other
      required: true
    - id: 9
      name: policy_4_technology
      label: I understand the acceptable use policy for classroom technology and devices.
      hint: Technology Policy
      type: select_one
      options:
      - Yes, I understand
      - Other
      required: true
    - id: 10
      name: policy_5_snacks
      label: I am aware that this is a nut-free classroom.
      hint: Health and Safety
      type: select_one
      options:
      - Yes, I am aware
      - Other
      required: true
    - id: 11
      name: electronic_signature
      label: Please type your full name as an electronic signature
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: date_signed
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: additional_comments
      label: Any questions or comments for the teacher?
      hint: null
      type: text
      options: []
      required: false
