inputSchema:
  type: object
  properties:
    title: Student Media Release Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: A valid email address
      type: email
      options: []
      required: true
    - id: 4
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: parent_email
      label: Parent Email
      hint: A valid email address
      type: email
      options: []
      required: true
    - id: 6
      name: photo_permission
      label: Photo Permission
      hint: null
      type: select_multiple
      options:
      - Yes, I give permission
      - No, not at this time
      - I don't want to give permission, contact me for an alternative
      required: false
    - id: 7
      name: name_permission
      label: Name Permission
      hint: null
      type: select_multiple
      options:
      - Yes, I give permission
      - No, not at this time
      - I don't want to give permission, contact me for an alternative
      required: false
    - id: 8
      name: publication_permission
      label: Publication Permission
      hint: null
      type: select_multiple
      options:
      - Print
      - Electronic publication
      - Website
      - Other (please specify)
      required: true
    - id: 9
      name: publication_venue
      label: Where will you be published?
      hint: e.g. school website, local newspaper, yearbook
      type: text
      options: []
      required: true
    - id: 10
      name: publication_type
      label: Publication type
      hint: e.g. print, digital, video
      type: text
      options: []
      required: true
    - id: 11
      name: student_signature
      label: Student signature
      hint: null
      type: note
      options: []
      required: true
