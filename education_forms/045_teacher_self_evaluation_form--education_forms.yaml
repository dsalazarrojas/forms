inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: teacher_performance_rating
      label: Teacher Performance Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: self_reflection_on_goals
      label: Self Reflection on Goals
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: areas_of_improvement
      label: Areas of Improvement
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: teacher_comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: teaching_methods
      label: Teaching Methods
      hint: null
      type: select_one
      options:
      - Teaching Methods
      - Online Classes
      - In-person Classes
      required: false
    - id: 8
      name: teaching_hours
      label: Teaching Hours
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: self_evaluation_form_completion_date
      label: Self Evaluation Form Completion Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: evaluation_frequency
      label: Evaluation Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Bi-Annual
      - Annual
      required: false
    - id: 11
      name: self_evaluation_form_completion_time
      label: Self Evaluation Form Completion Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Admin
      - Peer
      - Self
      required: false
    - id: 13
      name: review_status
      label: Review Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Rejected
      - In Progress
      required: false
