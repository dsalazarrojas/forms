inputSchema:
  type: object
  properties:
    title: Academic Success Workshop Series Registration
    pages:
    - id: 1
      name: workshop_series_intro
      label: Academic Success Workshop Series Registration
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Full name of the person registering
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email Address
      hint: Contact email for workshop communications
      type: email
      options: []
      required: true
    - id: 4
      name: participant_student_id
      label: Student ID (if applicable)
      hint: If you are a student, provide your student ID
      type: text
      options: []
      required: false
    - id: 5
      name: academic_level
      label: Academic Level
      hint: What is your current academic level?
      type: select_one
      options:
      - Freshman undergraduate
      - Sophomore undergraduate
      - Junior undergraduate
      - Senior undergraduate
      - Graduate student
      - Postgraduate
      - Faculty member
      - Staff member
      - Other
      required: true
    - id: 6
      name: academic_program
      label: Academic Program or Department
      hint: Current program or department affiliation
      type: text
      options: []
      required: true
    - id: 7
      name: workshop_series_choice
      label: Workshop Series Choice
      hint: Which workshop series are you registering for?
      type: select_one
      options:
      - Study Skills Mastery
      - Time Management
      - Research Methods
      - Academic Writing
      - Critical Thinking
      - Exam Preparation
      - Career Planning
      - Other
      required: true
    - id: 8
      name: specific_workshop_topics
      label: Specific Topics of Interest
      hint: Which specific topics within the series interest you most?
      type: text
      options: []
      required: false
    - id: 9
      name: availability_days
      label: Available Days
      hint: Which days of the week work best for attending workshops?
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 10
      name: availability_time_slot
      label: Available Time Slot
      hint: What time slot works best for attending workshops?
      type: select_one
      options:
      - Morning (8am-12pm)
      - Afternoon (12pm-4pm)
      - Evening (4pm-8pm)
      - Flexible
      - Weekends only
      required: true
    - id: 11
      name: preferred_format
      label: Preferred Workshop Format
      hint: How would you prefer to attend the workshops?
      type: select_one
      options:
      - In-person
      - Virtual
      - Hybrid
      - No preference
      - Depends on topic
      required: true
    - id: 12
      name: previous_workshop_participation
      label: Previous Workshop Participation
      hint: Have you attended similar workshops before?
      type: select_one
      options:
      - Yes, multiple times
      - Yes, once or twice
      - No, but interested
      - No, and not interested
      required: true
    - id: 13
      name: learning_goals
      label: Learning Goals
      hint: What are your primary goals for attending these workshops?
      type: text
      options: []
      required: false
    - id: 14
      name: accommodation_needs
      label: Accommodation Needs
      hint: Do you require any special accommodations for participation?
      type: text
      options: []
      required: false
    - id: 15
      name: accessibility_requirements
      label: Accessibility Requirements
      hint: Do you have any accessibility requirements?
      type: text
      options: []
      required: false
    - id: 16
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact person
      type: text
      options: []
      required: true
    - id: 17
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
