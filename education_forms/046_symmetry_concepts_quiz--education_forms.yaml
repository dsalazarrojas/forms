inputSchema:
  type: object
  properties:
    title: symmetry_concepts_quiz
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: grade_level
      label: Grade Level
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: line_symmetry
      label: Line Symmetry
      hint: null
      type: select_one
      options:
      - Dihedral angle
      - Reflection line
      required: true
    - id: 5
      name: rotational_symmetry
      label: Rotational Symmetry
      hint: null
      type: select_multiple
      options:
      - Dihedral angle
      - Reflection axis
      - None of the above
      required: true
    - id: 6
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: submission
      label: Submission
      hint: null
      type: date
      options: []
      required: true
