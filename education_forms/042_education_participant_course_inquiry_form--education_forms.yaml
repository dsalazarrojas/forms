inputSchema:
  type: object
  properties:
    title: Education Participant Course Inquiry Form
    pages:
    - id: 1
      name: course_inquiry
      label: What is your course of interest
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - en
      - es
      - fr
      - cn
      required: false
    - id: 6
      name: course_type
      label: Course Type
      hint: null
      type: select_multiple
      options:
      - Bachelor Degree
      - Master Degree
      - Doctorate Degree
      required: true
    - id: 7
      name: course_level
      label: Course Level
      hint: null
      type: select_one
      options:
      - Basic
      - Intermediate
      - Advanced
      required: true
    - id: 8
      name: preferred_format
      label: Preferred Format
      hint: null
      type: select_multiple
      options:
      - Online
      - In-person
      - Hybrid
      required: false
    - id: 9
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: duration
      label: Duration
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
