inputSchema:
  type: object
  properties:
    title: instruction_builder_survey
    pages:
    - id: 1
      name: introduction
      label: What is your role in your organization?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: role
      label: What is your role?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: role_other
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Which department do you work in?
      hint: null
      type: select_multiple
      options:
      - Accounting
      - Administration
      - Human Resources
      - Information Technology
      - Marketing
      - Operations
      - Other (please specify)
      required: true
    - id: 5
      name: location
      label: What is your location?
      hint: null
      type: select_one
      options:
      - Remote
      - On-site
      required: true
    - id: 6
      name: email
      label: What is your email?
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: instructions
      label: How often do you receive instructions?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 9
      name: training_programs
      label: How often do you attend training programs?
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 10
      name: quality
      label: What factors influence the quality of your instructions?
      hint: null
      type: select_multiple
      options:
      - Clear instructions
      - Engaging content
      - Effective communication
      - Timely completion
      - Other (please specify)
      required: true
    - id: 11
      name: effectiveness
      label: What factors influence the effectiveness of your instructions?
      hint: null
      type: select_multiple
      options:
      - Clear instructions
      - Engaging content
      - Effective communication
      - Timely completion
      - Other (please specify)
      required: true
    - id: 12
      name: completion_time
      label: How much time do you typically spend on instructions?
      hint: null
      type: time
      options: []
      required: true
    - id: 13
      name: completion_frequency
      label: How often do you complete instructions?
      hint: null
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 14
      name: training_evaluation
      label: How do you evaluate training?
      hint: null
      type: select_multiple
      options:
      - Engaging content
      - Effective communication
      - Clear instructions
      - Timely completion
      - Other (please specify)
      required: true
    - id: 15
      name: feedback
      label: Would you be interested in providing feedback on our training materials?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: email_notification
      label: Would you like to receive email notifications about new instruction materials?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 17
      name: other
      label: Is there anything else you would like to share with us?
      hint: null
      type: text
      options: []
      required: false
