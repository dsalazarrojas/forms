inputSchema:
  type: object
  properties:
    title: CPD Request Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Work Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: position
      label: Job Title or Position
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: manager_name
      label: Direct Manager Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: request_date
      label: Date of Request
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: training_type
      label: Type of CPD Training Requested
      hint: null
      type: select_one
      options:
      - Course or workshop
      - Conference attendance
      - Certification program
      - Online training
      - Professional conference
      - Mentoring or coaching
      - Other
      required: true
    - id: 9
      name: training_title
      label: Training Title or Program Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: training_provider
      label: Training Provider or Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: training_location
      label: Training Location
      hint: City, venue, or online
      type: text
      options: []
      required: false
    - id: 12
      name: training_duration
      label: Duration of Training
      hint: null
      type: select_one
      options:
      - Single day
      - 2-3 days
      - 1-2 weeks
      - 1-3 months
      - Self-paced online
      - Ongoing
      required: true
    - id: 13
      name: start_date
      label: Requested Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: cost
      label: Estimated Cost
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 15
      name: business_justification
      label: Business Justification
      hint: How does this support your role and organization
      type: text
      options: []
      required: true
    - id: 16
      name: learning_objectives
      label: Learning Objectives
      hint: What you hope to learn or achieve
      type: text
      options: []
      required: true
    - id: 17
      name: skill_gap
      label: Skills Gap This Will Address
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: priority
      label: Priority Level
      hint: How urgent is this training
      type: select_one
      options:
      - High - needed immediately
      - Medium - needed within 3 months
      - Low - needed within 6 months
      required: true
    - id: 19
      name: manager_approval
      label: Manager Approval Status
      hint: null
      type: select_one
      options:
      - Approved
      - Pending approval
      - Not yet discussed
      required: true
    - id: 20
      name: additional_notes
      label: Additional Notes or Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
