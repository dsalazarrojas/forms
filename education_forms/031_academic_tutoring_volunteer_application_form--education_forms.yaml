inputSchema:
  type: object
  properties:
    title: Academic Tutoring Volunteer Application Form
    pages:
    - id: 1
      name: form_header
      label: -- Academic Tutoring Volunteer Application --
      hint: Apply to become a volunteer tutor. Please complete all required fields.
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: applicant_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: applicant_phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: student_id
      label: Student ID number (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: current_status
      label: Current status
      hint: null
      type: select_one
      options:
      - Undergraduate Student
      - Graduate Student
      - Faculty
      - Alumni
      - Community Member
      required: true
    - id: 8
      name: major_or_field
      label: Major or field of expertise
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: gpa
      label: Current GPA (students only)
      hint: On a 4.0 scale
      type: number
      options: []
      required: false
    - id: 10
      name: subjects_to_tutor
      label: Which subjects are you qualified to tutor (select all that apply)
      hint: null
      type: select_multiple
      options:
      - Mathematics
      - English and Writing
      - Sciences (Biology, Chemistry, Physics)
      - Computer Science
      - Business and Economics
      - Foreign Languages
      - Social Sciences
      required: true
    - id: 11
      name: tutoring_experience
      label: Do you have previous tutoring or teaching experience
      hint: null
      type: select_one
      options:
      - Yes - extensive experience (2+ years)
      - Yes - some experience (less than 2 years)
      - No - but willing to learn
      required: true
    - id: 12
      name: experience_details
      label: Briefly describe your relevant tutoring or teaching experience
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: availability
      label: When are you available for tutoring sessions (select all that apply)
      hint: null
      type: select_multiple
      options:
      - Weekday mornings
      - Weekday afternoons
      - Weekday evenings
      - Weekends
      required: true
    - id: 14
      name: hours_per_week
      label: How many hours per week can you commit to tutoring
      hint: null
      type: select_one
      options:
      - 1-3 hours
      - 4-6 hours
      - 7-10 hours
      - More than 10 hours
      required: true
    - id: 15
      name: format_preference
      label: Preferred tutoring format
      hint: null
      type: select_one
      options:
      - In-person
      - Online
      - Either
      required: true
    - id: 16
      name: why_volunteer
      label: Why are you interested in volunteering as a tutor
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: background_check_consent
      label: Do you consent to a background check if required
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: agreement
      label: I agree to follow all tutoring program policies and maintain professional
        conduct
      hint: null
      type: select_one
      options:
      - Yes - I agree
      - Other
      required: true
