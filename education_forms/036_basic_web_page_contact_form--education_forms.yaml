inputSchema:
  type: object
  properties:
    title: Basic Web Page Contact Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: company
      label: Company name (optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_2
      label: -- Message Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: message
      label: Your message
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: section_header_3
      label: -- Contact Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: preferred_contact_method
      label: Preferred contact method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text Message
      required: false
    - id: 11
      name: message_received_notification
      label: Notify me when you receive this message
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 12
      name: confirmation
      label: I confirm this information is accurate
      hint: null
      type: select_one
      options:
      - I Confirm
      - I Need to Review
      required: true
