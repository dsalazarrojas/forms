inputSchema:
  type: object
  properties:
    title: After School Multimedia Class Registration
    pages:
    - id: 1
      name: student_information_section
      label: Student Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_full_name
      label: Student Full Name
      hint: Enter the student's complete legal name
      type: text
      options: []
      required: true
    - id: 3
      name: student_date_of_birth
      label: Student Date of Birth
      hint: Date of birth for the student
      type: date
      options: []
      required: true
    - id: 4
      name: student_grade
      label: Current Grade Level
      hint: What grade is the student currently in?
      type: select_one
      options:
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 5
      name: student_school
      label: School Attended
      hint: Name of the school the student attends
      type: text
      options: []
      required: true
    - id: 6
      name: student_id_number
      label: Student ID Number
      hint: Student identification number (if available)
      type: text
      options: []
      required: false
    - id: 7
      name: multimedia_class_selection_section
      label: Multimedia Class Selection
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: selected_class
      label: Select Multimedia Class
      hint: Which multimedia class would you like your child to join?
      type: select_one
      options:
      - Video Production
      - Digital Photography
      - Graphic Design
      - Animation
      - Web Design
      - Game Development
      - Audio Production
      - Social Media Marketing
      - 3D Modeling
      - Digital Art
      - Other
      required: true
    - id: 9
      name: class_level
      label: Class Level
      hint: What level of class is appropriate for your child?
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 10
      name: class_schedule_preference
      label: Class Schedule Preference
      hint: Which days would you prefer for the class?
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: true
    - id: 11
      name: class_time_preference
      label: Class Time Preference
      hint: What time works best for the class?
      type: select_one
      options:
      - 3:00 PM - 4:00 PM
      - 4:00 PM - 5:00 PM
      - 5:00 PM - 6:00 PM
      - 6:00 PM - 7:00 PM
      - Flexible
      required: true
    - id: 12
      name: parent_guardian_information_section
      label: Parent/Guardian Information
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: parent_guardian_name
      label: Parent/Guardian Full Name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 14
      name: parent_guardian_relationship
      label: Relationship to Student
      hint: Your relationship to the student
      type: select_one
      options:
      - Mother
      - Father
      - Guardian
      - Grandparent
      - Aunt/Uncle
      - Other
      required: true
    - id: 15
      name: parent_guardian_email
      label: Email Address
      hint: Email for class updates and communication
      type: email
      options: []
      required: true
    - id: 16
      name: parent_guardian_phone
      label: Phone Number
      hint: Primary phone number for contact
      type: text
      options: []
      required: true
    - id: 17
      name: emergency_contact_information_section
      label: Emergency Contact Information
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact person
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship of emergency contact to the student
      type: text
      options: []
      required: true
    - id: 20
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
    - id: 21
      name: technology_access_section
      label: Technology Access
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: computer_access
      label: Computer Access
      hint: Does your child have access to a computer/laptop at home?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Shared access
      required: true
    - id: 23
      name: internet_access
      label: Internet Access
      hint: Is reliable internet access available at home?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Limited
      required: true
    - id: 24
      name: technology_experience
      label: Technology Experience
      hint: What is your child's experience level with technology?
      type: select_one
      options:
      - Beginner
      - Some experience
      - Intermediate
      - Advanced
      required: true
    - id: 25
      name: software_experience
      label: Software Experience
      hint: Does your child have experience with multimedia software?
      type: text
      options: []
      required: false
    - id: 26
      name: medical_information_section
      label: Medical Information
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: medical_conditions
      label: Medical Conditions
      hint: Does your child have any medical conditions we should know about?
      type: text
      options: []
      required: false
    - id: 28
      name: medications
      label: Current Medications
      hint: Is your child currently taking any medications?
      type: text
      options: []
      required: false
    - id: 29
      name: allergies
      label: Allergies
      hint: Does your child have any allergies (food, medication, environmental)?
      type: text
      options: []
      required: false
    - id: 30
      name: transportation_information_section
      label: Transportation Information
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: transportation_method
      label: Transportation Method
      hint: How will your child get home from the after-school program?
      type: select_one
      options:
      - Picked up by parent/guardian
      - School bus
      - Walk
      - Other authorized adult
      - Other
      required: true
    - id: 32
      name: authorized_adults
      label: Other Authorized Adults
      hint: List any other adults authorized to pick up your child
      type: text
      options: []
      required: false
    - id: 33
      name: dismissal_instructions
      label: Dismissal Instructions
      hint: Special instructions for dismissing your child
      type: text
      options: []
      required: false
    - id: 34
      name: registration_agreements_section
      label: Registration Agreements
      hint: null
      type: note
      options: []
      required: false
    - id: 35
      name: terms_agreement
      label: Terms and Conditions Agreement
      hint: I agree to the terms and conditions of the multimedia class program
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 36
      name: photo_release_agreement
      label: Photo Release Agreement
      hint: I give permission for my child to be photographed during class activities
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 37
      name: technology_use_agreement
      label: Technology Use Agreement
      hint: I agree that my child will use technology responsibly and follow all digital
        citizenship guidelines
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 38
      name: signature
      label: Parent/Guardian Signature
      hint: Electronic signature to confirm registration
      type: text
      options: []
      required: true
