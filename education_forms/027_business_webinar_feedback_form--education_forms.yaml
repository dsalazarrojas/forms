inputSchema:
  type: object
  properties:
    title: Business Webinar Feedback Form
    pages:
    - id: 1
      name: attendee_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_email
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company or Organization
      hint: Your employer or organization
      type: text
      options: []
      required: false
    - id: 4
      name: webinar_title
      label: Webinar Title
      hint: Name of the webinar you attended
      type: text
      options: []
      required: true
    - id: 5
      name: webinar_date
      label: Webinar Date
      hint: When did you attend?
      type: date
      options: []
      required: true
    - id: 6
      name: speaker_name
      label: Speaker or Presenter Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: attendance_reason
      label: Why Did You Attend This Webinar?
      hint: null
      type: select_one
      options:
      - Professional development
      - Required or assigned
      - Curiosity about topic
      - Networking
      - Client or customer recommendation
      - Email invitation
      - Saw advertisement
      - Other
      required: true
    - id: 8
      name: content_relevance
      label: How Relevant Was the Content?
      hint: null
      type: select_one
      options:
      - Highly relevant
      - Relevant
      - Somewhat relevant
      - Slightly relevant
      - Not relevant
      required: true
    - id: 9
      name: content_quality
      label: Quality of the Content
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 10
      name: speaker_effectiveness
      label: Speaker Effectiveness
      hint: How well did the speaker present?
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 11
      name: presentation_clarity
      label: Clarity of Presentation
      hint: null
      type: select_one
      options:
      - Very clear
      - Clear
      - Somewhat clear
      - Unclear
      - Very unclear
      required: true
    - id: 12
      name: pacing
      label: Pacing of the Webinar
      hint: null
      type: select_one
      options:
      - Too fast
      - Good pace
      - Too slow
      - Inconsistent pace
      required: true
    - id: 13
      name: technical_quality
      label: Technical Quality
      hint: Audio, video, slide quality
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 14
      name: interactive_elements
      label: Quality of Interactive Elements
      hint: Q&A, polls, discussions, etc.
      type: select_one
      options:
      - Excellent engagement
      - Good engagement
      - Adequate engagement
      - Limited engagement
      - No interaction
      required: true
    - id: 15
      name: learning_outcomes
      label: Achieved Learning Outcomes
      hint: Did you learn what you needed?
      type: select_one
      options:
      - Exceeded expectations
      - Met expectations
      - Partially met
      - Minimal learning
      - No learning
      required: true
    - id: 16
      name: practical_application
      label: Applicability to Your Work
      hint: Can you apply what you learned?
      type: select_one
      options:
      - Highly applicable
      - Applicable
      - Somewhat applicable
      - Minimally applicable
      - Not applicable
      required: true
    - id: 17
      name: materials_quality
      label: Quality of Reference Materials
      hint: Slides, handouts, resources provided
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: false
    - id: 18
      name: recommendation_likelihood
      label: Would You Recommend This Webinar?
      hint: null
      type: select_one
      options:
      - Definitely would recommend
      - Probably would recommend
      - Unsure
      - Probably would not recommend
      - Definitely would not recommend
      required: true
    - id: 19
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: What could have been better?
      type: text
      options: []
      required: false
    - id: 20
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
