inputSchema:
  type: object
  properties:
    title: Father Son Learning Survey
    pages:
    - id: 1
      name: father_son_learning_survey_title
      label: Title
      hint: Enter the title of the survey
      type: text
      options: []
      required: true
    - id: 2
      name: father_son_learning_survey_category
      label: Category
      hint: Choose the category that best describes this survey
      type: select_one
      options:
      - Personal
      - Professional
      - Educational
      - Other
      required: true
    - id: 3
      name: father_son_learning_survey_description
      label: Description
      hint: Briefly describe the purpose and objective of the survey
      type: text
      options: []
      required: true
    - id: 4
      name: father_son_learning_survey_hobbies
      label: Hobbies
      hint: What are some activities the father and son enjoy doing together?
      type: select_multiple
      options:
      - Reading
      - Sports
      - Playing Video Games
      - Playing an Instrument
      - Learning
      - Other (please specify)
      required: true
    - id: 5
      name: father_son_learning_survey_conversation_topics
      label: Conversation Topics
      hint: What subjects do the father and son usually discuss?
      type: select_multiple
      options:
      - Schoolwork
      - Hobbies
      - Interests
      - Goals
      - Values
      - Other (please specify)
      required: true
    - id: 6
      name: father_son_learning_survey_reflections
      label: Reflections
      hint: How often do you reflect on your relationship with your son?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Rarely
      required: true
    - id: 7
      name: father_son_learning_survey_reflections_frequency
      label: Reflections Frequency
      hint: How often do you take time to reflect on your relationship with your son?
      type: select_one
      options:
      - 10 minutes
      - 30 minutes
      - 1 hour
      - 2 hours
      - More than 2 hours
      required: true
    - id: 8
      name: father_son_learning_survey_suggestions
      label: Suggestions
      hint: What are some suggestions for improving the father-son relationship?
      type: text
      options: []
      required: true
    - id: 9
      name: father_son_learning_survey_active_role
      label: Active Role
      hint: How often do you take an active role in your son's education?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Rarely
      required: true
    - id: 10
      name: father_son_learning_survey_education
      label: Education
      hint: What is your son's current level of education?
      type: select_one
      options:
      - Primary School
      - Secondary School
      - University
      - College
      - Other
      required: true
    - id: 11
      name: father_son_learning_survey_other_hobbies
      label: Other Hobbies
      hint: Please specify any other activities you enjoy with your son
      type: text
      options: []
      required: false
    - id: 12
      name: father_son_learning_survey_other_topics
      label: Other Topics
      hint: Please specify any other subjects you discuss with your son
      type: text
      options: []
      required: false
