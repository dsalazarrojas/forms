inputSchema:
  type: object
  properties:
    title: Student Re Enrollment Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: parent_contact_number
      label: Parent Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_grade_level
      label: Student Grade Level
      hint: null
      type: select_one
      options:
      - High School
      - Elementary School
      - Middle School
      - College
      - University
      required: false
    - id: 7
      name: student_grade_level_other
      label: If other, please specify
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: student_program
      label: Student Program
      hint: null
      type: select_multiple
      options:
      - Program A
      - Program B
      - Program C
      - Program D
      required: false
    - id: 9
      name: student_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: student_end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: student_status
      label: Student Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      - Withdrawn
      required: false
    - id: 12
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
