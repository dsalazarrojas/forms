inputSchema:
  type: object
  properties:
    title: Chlorine Safety Knowledge Quiz
    pages:
    - id: 1
      name: participant_information
      label: Participant Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: For results
      type: email
      options: []
      required: false
    - id: 4
      name: organization
      label: Organization or Company
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: quiz_instructions
      label: Quiz Instructions
      hint: Answer all questions to the best of your ability
      type: note
      options: []
      required: false
    - id: 9
      name: question_1
      label: Question 1 - What is the chemical symbol for chlorine
      hint: null
      type: select_one
      options:
      - Cl
      - Ch
      - Cr
      - Co
      - Ca
      required: true
    - id: 10
      name: question_2
      label: Question 2 - What color is chlorine gas
      hint: null
      type: select_one
      options:
      - Yellow-green
      - Blue
      - Red
      - Colorless
      - White
      required: true
    - id: 11
      name: question_3
      label: Question 3 - How does chlorine smell
      hint: null
      type: select_one
      options:
      - Pungent, bleach-like odor
      - Sweet
      - No odor
      - Rotten eggs
      - Fruity
      required: true
    - id: 12
      name: question_4
      label: Question 4 - Is chlorine gas heavier or lighter than air
      hint: null
      type: select_one
      options:
      - Heavier than air
      - Lighter than air
      - Same weight
      - Depends on temperature
      required: true
    - id: 13
      name: question_5
      label: Question 5 - What is the primary health effect of chlorine exposure
      hint: null
      type: select_one
      options:
      - Respiratory irritation
      - Skin rash only
      - Headache
      - Nausea only
      - Hearing loss
      required: true
    - id: 14
      name: question_6
      label: Question 6 - What should you do first if you detect a chlorine leak
      hint: null
      type: select_one
      options:
      - Evacuate the area immediately
      - Try to fix the leak
      - Open windows
      - Continue working
      - Call a coworker
      required: true
    - id: 15
      name: question_7
      label: Question 7 - What type of respirator is required for chlorine handling
      hint: null
      type: select_one
      options:
      - Full-face air-purifying respirator
      - Dust mask
      - Surgical mask
      - No respirator needed
      - Cloth face covering
      required: true
    - id: 16
      name: question_8
      label: Question 8 - What is the OSHA permissible exposure limit for chlorine
      hint: 8-hour time-weighted average
      type: select_one
      options:
      - 0.5 ppm
      - 1.0 ppm
      - 5.0 ppm
      - 10.0 ppm
      - 50.0 ppm
      required: true
    - id: 17
      name: question_9
      label: Question 9 - What should never be mixed with chlorine
      hint: Dangerous combination
      type: select_one
      options:
      - Ammonia
      - Water
      - Salt
      - Soap
      - Vinegar
      required: true
    - id: 18
      name: question_10
      label: Question 10 - What is the proper storage temperature for chlorine
      hint: null
      type: select_one
      options:
      - Cool, dry, well-ventilated area
      - Hot, humid area
      - Direct sunlight
      - Freezing temperatures
      - Any temperature
      required: true
    - id: 19
      name: question_11
      label: Question 11 - What emergency equipment should be available where chlorine
        is used
      hint: null
      type: select_one
      options:
      - Eyewash station and safety shower
      - Fire extinguisher only
      - First aid kit only
      - Nothing special needed
      - Water hose
      required: true
    - id: 20
      name: question_12
      label: Question 12 - How should chlorine containers be stored
      hint: null
      type: select_one
      options:
      - Upright and secured
      - On their side
      - Stacked loosely
      - In direct sunlight
      - Near heat sources
      required: true
    - id: 21
      name: question_13
      label: Question 13 - What is the immediate first aid for chlorine eye exposure
      hint: null
      type: select_one
      options:
      - Flush with water for 15 minutes
      - Rub the eyes
      - Apply eye drops
      - Cover with cloth
      - Wait for help
      required: true
    - id: 22
      name: question_14
      label: Question 14 - What is the immediate first aid for chlorine skin exposure
      hint: null
      type: select_one
      options:
      - Remove contaminated clothing and flush with water
      - Apply lotion
      - Cover with bandage
      - Apply ice
      - Do nothing
      required: true
    - id: 23
      name: question_15
      label: Question 15 - Who should be notified immediately in case of a major chlorine
        leak
      hint: null
      type: select_one
      options:
      - Emergency services and supervisor
      - Only your coworker
      - No one
      - Social media
      - Family members
      required: true
    - id: 24
      name: question_16
      label: Question 16 - What does MSDS or SDS stand for
      hint: Safety documentation
      type: select_one
      options:
      - Material Safety Data Sheet or Safety Data Sheet
      - Maximum Safety Distribution System
      - Minimum Standard Data Sheet
      - Material Storage Data System
      - None of the above
      required: true
    - id: 25
      name: question_17
      label: Question 17 - Can chlorine react violently with other substances
      hint: null
      type: select_one
      options:
      - Yes, with many substances
      - No, it is inert
      - Only with water
      - Only at high temperatures
      - Never
      required: true
    - id: 26
      name: question_18
      label: Question 18 - What is the boiling point of chlorine
      hint: Approximately
      type: select_one
      options:
      - -34 degrees Celsius
      - 0 degrees Celsius
      - 100 degrees Celsius
      - 34 degrees Celsius
      - -100 degrees Celsius
      required: true
    - id: 27
      name: question_19
      label: Question 19 - What warning label should be on chlorine containers
      hint: null
      type: select_one
      options:
      - Poison, corrosive, oxidizer
      - Flammable
      - Explosive
      - Radioactive
      - Biohazard
      required: true
    - id: 28
      name: question_20
      label: Question 20 - How often should chlorine safety training be conducted
      hint: null
      type: select_one
      options:
      - Annually and when procedures change
      - Once ever
      - Every 5 years
      - Monthly
      - Never
      required: true
    - id: 29
      name: self_assessment
      label: Self-Assessment
      hint: Your confidence level
      type: note
      options: []
      required: false
    - id: 30
      name: confidence_level
      label: How confident do you feel about chlorine safety
      hint: null
      type: select_one
      options:
      - Very confident
      - Confident
      - Somewhat confident
      - Not very confident
      - Not confident at all
      required: true
    - id: 31
      name: additional_training_needed
      label: Do you feel you need additional training
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 32
      name: training_topics
      label: What topics would you like more training on
      hint: Select all that apply
      type: select_multiple
      options:
      - Emergency procedures
      - Proper PPE usage
      - Leak detection
      - First aid
      - Storage requirements
      - Handling procedures
      - Regulatory compliance
      - None
      required: false
    - id: 33
      name: quiz_feedback
      label: Quiz Feedback
      hint: Your thoughts
      type: note
      options: []
      required: false
    - id: 34
      name: quiz_difficulty
      label: How would you rate the difficulty of this quiz
      hint: null
      type: select_one
      options:
      - Very easy
      - Easy
      - Moderate
      - Difficult
      - Very difficult
      required: false
    - id: 35
      name: additional_comments
      label: Additional Comments or Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 36
      name: participant_signature
      label: Participant Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 37
      name: quiz_date
      label: Date of Quiz
      hint: null
      type: date
      options: []
      required: true
