inputSchema:
  type: object
  properties:
    title: Student Warning Form Template
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: incident_name
      label: Name of Student Committed Infraction
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_incident
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: time_of_incident
      label: Time of Incident
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: infraction_nature
      label: Nature of Infraction
      hint: null
      type: select_one
      options:
      - Academic dishonesty
      - Misconduct on campus
      - Other (please specify)
      required: true
    - id: 7
      name: reason_for_warning
      label: Reason for Warning
      hint: null
      type: select_multiple
      options:
      - First-time offender
      - Repeat offender
      - Other (please specify)
      required: true
    - id: 8
      name: next_action
      label: Recommended Action
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: additional_information
      label: Additional Information
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: prior_warnings
      label: Has this student received any prior warnings?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 11
      name: questions_or_concerns
      label: Do you have any questions or concerns about this warning?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 12
      name: final_comments
      label: Are there any other relevant comments to add?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: repeat_offender
      label: Is this student a repeat offender?
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: warning_given
      label: Has this warning been given to the student?
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: true
