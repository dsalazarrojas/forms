inputSchema:
  type: object
  properties:
    title: Scholar Progress Survey
    pages:
    - id: 1
      name: student_academic_period
      label: selected_academic_period
      hint: null
      type: select_one
      options:
      - January
      - February
      - March
      - April
      - May
      - June
      required: true
    - id: 2
      name: student_academic_ratings
