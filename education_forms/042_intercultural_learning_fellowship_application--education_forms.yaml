inputSchema:
  type: object
  properties:
    title: Intercultural Learning Fellowship Application
    pages:
    - id: 1
      name: applicant_name
      label: Applicant Name
      hint: What is your name?
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Applicant Email
      hint: What is your email address?
      type: email
      options: []
      required: true
    - id: 3
      name: cv_upload
      label: CV Upload
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: motivation
      label: Motivation
      hint: Please describe your motivation for this fellowship
      type: text
      options: []
      required: false
    - id: 5
      name: university_name
      label: University Name
      hint: What is your current or intended university name?
      type: text
      options: []
      required: true
    - id: 6
      name: program_name
      label: Program Name
      hint: What is the name of your desired program?
      type: text
      options: []
      required: true
    - id: 7
      name: motivation_attachment
      label: Motivation Attachment
      hint: Please attach a document describing your motivation
      type: text
      options: []
      required: false
