inputSchema:
  type: object
  properties:
    title: Academic Innovation Archive Consent Form
    pages:
    - id: 1
      name: section_archive_intro
      label: -- Archive Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contributor_name
      label: Contributor name
      hint: Name of the person submitting material
      type: text
      options: []
      required: true
    - id: 3
      name: contributor_email
      label: Contributor email
      hint: Contact for archive correspondence
      type: email
      options: []
      required: true
    - id: 4
      name: material_description
      label: Description of material
      hint: Summary of items to be archived
      type: text
      options: []
      required: true
    - id: 5
      name: rights_and_permissions
      label: Rights and permissions held
      hint: Confirm you have rights to submit material
      type: select_one
      options:
      - I hold full rights
      - Shared rights with coauthors
      - Permission obtained from rights holder
      - Other
      required: true
    - id: 6
      name: consent_to_store
      label: Consent to store materials indefinitely
      hint: Permission to retain in archives
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: access_restrictions
      label: Access restrictions requested
      hint: Any embargoes or restricted access requirements
      type: text
      options: []
      required: false
    - id: 8
      name: citation_preference
      label: Citation preference
      hint: How contributor wishes to be cited
      type: text
      options: []
      required: false
    - id: 9
      name: signature_name
      label: Signature name
      hint: Type full name to confirm consent
      type: text
      options: []
      required: true
    - id: 10
      name: signature_date
      label: Signature date
      hint: Date of consent
      type: date
      options: []
      required: true
