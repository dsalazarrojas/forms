inputSchema:
  type: object
  properties:
    title: Advocacy Training Completion Certificate Request
    pages:
    - id: 1
      name: participant_details_header
      label: -- Participant Details --
      hint: Please provide details for your certificate.
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: As it should appear on the certificate.
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: As it should appear on the certificate.
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: We will send the digital certificate here.
      type: email
      options: []
      required: true
    - id: 5
      name: organization
      label: Organization
      hint: Optional.
      type: text
      options: []
      required: false
    - id: 6
      name: training_details_header
      label: -- Training Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: training_module
      label: Training Module Completed
      hint: Select the specific course.
      type: select_one
      options:
      - Introduction to Advocacy
      - Advanced Lobbying Strategies
      - Digital Campaigning
      - Grassroots Organizing
      - Media Relations for Advocates
      required: true
    - id: 8
      name: completion_date
      label: Date of Completion
      hint: When did you finish the course?
      type: date
      options: []
      required: true
    - id: 9
      name: instructor_name
      label: Instructor Name
      hint: If applicable.
      type: text
      options: []
      required: false
    - id: 10
      name: feedback_header
      label: -- Brief Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: satisfaction
      label: Overall Satisfaction
      hint: Rate the training.
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: false
    - id: 12
      name: key_takeaway
      label: Key Takeaway
      hint: What was the most valuable thing you learned?
      type: text
      options: []
      required: false
    - id: 13
      name: verification_code
      label: Course Verification Code
      hint: Provided at the end of the session.
      type: text
      options: []
      required: true
