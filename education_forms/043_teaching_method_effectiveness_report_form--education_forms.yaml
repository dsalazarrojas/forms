inputSchema:
  type: object
  properties:
    title: Teaching Method Effectiveness Report Form
    pages:
    - id: 1
      name: classroom_context
      label: Classroom Context
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: teaching_method
      label: Teaching Method
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_attendance
      label: Student Attendance
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: method_effectiveness
      label: Method Effectiveness
      hint: null
      type: select_one
      options:
      - Highly effective
      - Effective
      - Somewhat effective
      - Not very effective
      required: true
    - id: 8
      name: overall_rating
      label: Overall Rating
      hint: null
      type: select_multiple
      options:
      - Highly effective
      - Somewhat effective
      - Effective
      - Somewhat ineffective
      - Not very effective
      required: true
    - id: 9
      name: recommendations
      label: Recommendations
      hint: null
      type: text
      options: []
      required: false
