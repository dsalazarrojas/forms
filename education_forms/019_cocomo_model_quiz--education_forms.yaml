inputSchema:
  type: object
  properties:
    title: COCOMO Model Quiz
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For results delivery
      type: email
      options: []
      required: true
    - id: 3
      name: institution
      label: Institution
      hint: School or organization
      type: text
      options: []
      required: false
    - id: 4
      name: course_name
      label: Course Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 5
      name: quiz_instructions
      label: Quiz Instructions
      hint: This quiz tests your knowledge of the COCOMO software cost estimation
        model. Select the best answer for each question.
      type: note
      options: []
      required: false
    - id: 6
      name: question_1
      label: Question 1 - What does COCOMO stand for
      hint: Select the correct expansion
      type: select_one
      options:
      - Constructive Cost Model
      - Computer Cost Model
      - Comprehensive Cost Model
      - Calculated Cost Model
      required: true
    - id: 7
      name: question_2
      label: Question 2 - Who developed COCOMO
      hint: The creator of the model
      type: select_one
      options:
      - Barry Boehm
      - Fred Brooks
      - Grady Booch
      - James Martin
      required: true
    - id: 8
      name: question_3
      label: Question 3 - What is COCOMO primarily used for
      hint: Main application
      type: select_one
      options:
      - Software cost and effort estimation
      - Hardware cost estimation
      - Project scheduling only
      - Quality assurance
      required: true
    - id: 9
      name: question_4
      label: Question 4 - How many levels does Basic COCOMO have
      hint: Number of project modes
      type: select_one
      options:
      - Three - Organic Semi-detached Embedded
      - Two - Simple and Complex
      - Four - Small Medium Large Very Large
      - Five - A through E
      required: true
    - id: 10
      name: question_5
      label: Question 5 - What is the primary input for COCOMO
      hint: Main metric used
      type: select_one
      options:
      - KLOC - Thousands of Lines of Code
      - Function Points
      - Story Points
      - Use Case Points
      required: true
    - id: 11
      name: question_6
      label: Question 6 - Which COCOMO version includes cost drivers
      hint: Enhanced version
      type: select_one
      options:
      - Intermediate COCOMO
      - Basic COCOMO
      - Simple COCOMO
      - Advanced COCOMO
      required: true
    - id: 12
      name: question_7
      label: Question 7 - What are cost drivers in COCOMO
      hint: Definition
      type: select_one
      options:
      - Factors that affect development effort
      - Financial costs only
      - Team size multipliers
      - Hardware expenses
      required: true
    - id: 13
      name: question_8
      label: Question 8 - Which is NOT a COCOMO cost driver category
      hint: Identify the incorrect category
      type: select_one
      options:
      - Marketing Factors
      - Product Attributes
      - Hardware Attributes
      - Personnel Attributes
      required: true
    - id: 14
      name: question_9
      label: Question 9 - What does COCOMO II add
      hint: Improvement over original
      type: select_one
      options:
      - Support for modern development practices
      - Only hardware cost estimation
      - Only agile methodology support
      - Nothing it is the same
      required: true
    - id: 15
      name: question_10
      label: Question 10 - In which project mode is effort highest for same KLOC
      hint: Most complex mode
      type: select_one
      options:
      - Embedded
      - Organic
      - Semi-detached
      - All are equal
      required: true
    - id: 16
      name: question_11
      label: Question 11 - Select all that apply - COCOMO outputs include
      hint: Multiple answers possible
      type: select_multiple
      options:
      - Effort in person-months
      - Development time
      - Team size recommendation
      - Hardware requirements
      - Cost estimate
      required: true
    - id: 17
      name: question_12
      label: Question 12 - What is a limitation of COCOMO
      hint: Known weakness
      type: select_one
      options:
      - Requires accurate size estimation
      - Too complex to use
      - Only works for small projects
      - Cannot estimate time
      required: true
    - id: 18
      name: confidence_level
      label: Confidence Level
      hint: How confident are you in your answers
      type: select_one
      options:
      - Very Confident
      - Somewhat Confident
      - Neutral
      - Not Very Confident
      - Not Confident At All
      required: true
    - id: 19
      name: study_time
      label: Hours Spent Studying
      hint: How long did you study
      type: number
      options: []
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any feedback about the quiz
      type: text
      options: []
      required: false
