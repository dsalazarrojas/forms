inputSchema:
  type: object
  properties:
    title: Aircraft Maintenance Engineering Application Form
    pages:
    - id: 1
      name: applicant_first_name
      label: First Name
      hint: Legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_last_name
      label: Last Name
      hint: Legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: address
      label: Street Address
      hint: Mailing address
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 9
      name: date_of_birth
      label: Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 10
      name: position_applied
      label: Position Applied For
      hint: Job title
      type: select_one
      options:
      - Aircraft Maintenance Engineer
      - A&P Mechanic
      - Avionics Technician
      - Powerplant Mechanic
      - Airframe Mechanic
      - Maintenance Inspector
      - Lead Technician
      - Other
      required: true
    - id: 11
      name: available_start_date
      label: Available Start Date
      hint: When can you start
      type: date
      options: []
      required: true
    - id: 12
      name: employment_type
      label: Employment Type Desired
      hint: Full-time or part-time
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Temporary
      - Any
      required: true
    - id: 13
      name: faa_certifications
      label: FAA Certifications
      hint: Select all that apply
      type: select_multiple
      options:
      - A&P (Airframe and Powerplant)
      - Airframe only
      - Powerplant only
      - IA (Inspection Authorization)
      - Avionics
      - None
      required: true
    - id: 14
      name: certificate_numbers
      label: Certificate Numbers
      hint: List your certificate numbers
      type: text
      options: []
      required: false
    - id: 15
      name: other_certifications
      label: Other Certifications
      hint: Additional qualifications
      type: text
      options: []
      required: false
    - id: 16
      name: years_experience
      label: Years of Experience
      hint: Total maintenance experience
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - More than 10 years
      required: true
    - id: 17
      name: aircraft_experience
      label: Aircraft Experience
      hint: Types of aircraft worked on
      type: select_multiple
      options:
      - Single engine piston
      - Multi-engine piston
      - Turboprop
      - Light jet
      - Mid-size jet
      - Heavy jet
      - Helicopter
      - Military
      required: true
    - id: 18
      name: education_level
      label: Education Level
      hint: Highest level completed
      type: select_one
      options:
      - High school diploma
      - Associate degree
      - Bachelor degree
      - Master degree
      - Other
      required: true
    - id: 19
      name: aviation_school
      label: Aviation Maintenance School
      hint: School name if attended
      type: text
      options: []
      required: false
    - id: 20
      name: graduation_year
      label: Graduation Year
      hint: Year of graduation
      type: number
      options: []
      required: false
    - id: 21
      name: military_experience
      label: Military Aviation Experience
      hint: Did you serve in military
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 22
      name: military_branch
      label: Military Branch
      hint: Which branch
      type: text
      options: []
      required: false
    - id: 23
      name: military_specialty
      label: Military Specialty
      hint: Your role
      type: text
      options: []
      required: false
    - id: 24
      name: previous_employer
      label: Most Recent Employer
      hint: Company name
      type: text
      options: []
      required: true
    - id: 25
      name: previous_employer_dates
      label: Dates of Employment
      hint: Start and end dates
      type: text
      options: []
      required: true
    - id: 26
      name: reason_for_leaving
      label: Reason for Leaving
      hint: Why did you leave
      type: text
      options: []
      required: false
    - id: 27
      name: specialized_skills
      label: Specialized Skills
      hint: List your technical skills
      type: text
      options: []
      required: true
    - id: 28
      name: software_proficiency
      label: Software Proficiency
      hint: Maintenance software you know
      type: select_multiple
      options:
      - AMOS
      - TRAX
      - Maintenix
      - SAP
      - Oracle
      - Other
      - None
      required: false
    - id: 29
      name: shift_availability
      label: Shift Availability
      hint: Which shifts can you work
      type: select_multiple
      options:
      - Day shift
      - Evening shift
      - Night shift
      - Rotating shifts
      - Weekends
      - On-call
      required: true
    - id: 30
      name: travel_willingness
      label: Willingness to Travel
      hint: Can you travel for work
      type: select_one
      options:
      - Yes, extensively
      - Yes, occasionally
      - Limited travel
      - No travel
      required: true
    - id: 31
      name: salary_expectations
      label: Salary Expectations
      hint: Expected annual salary
      type: select_one
      options:
      - Under $50,000
      - $50,000-$70,000
      - $70,000-$90,000
      - $90,000-$120,000
      - Over $120,000
      - Negotiable
      required: false
    - id: 32
      name: references_available
      label: References Available
      hint: Can you provide references
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 33
      name: drug_screen_consent
      label: Drug Screen Consent
      hint: Do you consent to screening
      type: select_one
      options:
      - Yes, I consent
      - false
      required: true
    - id: 34
      name: background_check_consent
      label: Background Check Consent
      hint: Do you consent to check
      type: select_one
      options:
      - Yes, I consent
      - false
      required: true
    - id: 35
      name: cover_letter
      label: Cover Letter
      hint: Brief statement of interest
      type: text
      options: []
      required: false
    - id: 36
      name: resume_attached
      label: Resume Attached
      hint: Have you attached resume
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 37
      name: applicant_signature
      label: Applicant Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 38
      name: application_date
      label: Application Date
      hint: Date of application
      type: date
      options: []
      required: true
