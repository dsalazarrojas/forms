inputSchema:
  type: object
  properties:
    title: Academic Library Survey
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patron_type
      label: Patron type
      hint: Describe your primary role as library user
      type: select_one
      options:
        - Student
        - Faculty
        - Staff
        - Visitor
      required: true
    - id: 3
      name: frequency_of_use
      label: Frequency of library use
      hint: How often do you use library services
      type: select_one
      options:
        - Daily
        - Weekly
        - Monthly
        - Rarely
      required: true
    - id: 4
      name: satisfaction_resources
      label: Satisfaction with resources
      hint: Rate current collection and digital resources
      type: select_one
      options:
        - Very satisfied
        - Satisfied
        - Neutral
        - Dissatisfied
      required: true
    - id: 5
      name: accessibility
      label: Accessibility of services and space
      hint: Rate how accessible services are
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
      required: true
    - id: 6
      name: desired_services
      label: Services you would like the library to offer
      hint: Select up to three options
      type: select_multiple
      options:
        - Extended hours
        - Research consultations
        - Technology lending
        - Workshops and training
      required: false
    - id: 7
      name: open_comments
      label: Open comments and suggestions
      hint: Any other feedback for improvement
      type: text
      options: []
      required: false
    - id: 8
      name: contact_email
      label: Optional contact email
      hint: Leave email if you want a response
      type: email
      options: []
      required: false
