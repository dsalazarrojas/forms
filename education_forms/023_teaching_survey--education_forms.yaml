inputSchema:
  type: object
  properties:
    title: Teaching Survey
    pages:
    - id: 1
      name: teacher_id
      label: Teacher Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: what_did_you_learn
      label: What did you learn in the last week?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: what_was_the_most_challenging_part
      label: What was the most challenging part of the experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: how_would_you_rate_your_experience
      label: How would you rate your experience?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: what_could_be_improved
      label: What could be improved?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: how_likely_would_you_recommend_the_course
      label: How likely are you to recommend the course?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: do_you_need_help_or_resources
      label: Do you need help or resources?
      hint: null
      type: select_multiple
      options:
      - Help with lesson planning
      - Need more resources
      - Other
      required: false
    - id: 8
      name: how_do_you_rate_the_teacher
      label: How do you rate the teacher?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: how_do_you_rate_the_teaching_assistant
      label: How do you rate the teaching assistant?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: false
    - id: 10
      name: what_other_comments_do_you_have
      label: What other comments do you have?
      hint: null
      type: text
      options: []
      required: false
