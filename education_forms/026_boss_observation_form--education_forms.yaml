inputSchema:
  type: object
  properties:
    title: BOSS Observation Form
    pages:
    - id: 1
      name: observation_date
      label: Observation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: observer_name
      label: Observer Name
      hint: Teacher or staff member conducting observation
      type: text
      options: []
      required: true
    - id: 3
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - Middle School
      - High School
      required: true
    - id: 5
      name: classroom_subject
      label: Subject or Class
      hint: What class or subject?
      type: text
      options: []
      required: true
    - id: 6
      name: time_of_day
      label: Time of Observation
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: observation_location
      label: Location of Observation
      hint: Classroom, cafeteria, playground, etc.
      type: text
      options: []
      required: false
    - id: 8
      name: duration_minutes
      label: Duration of Observation (in minutes)
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: behavior_observed
      label: Behavior Observed
      hint: Select all that apply
      type: select_multiple
      options:
      - On-task behavior
      - Off-task behavior
      - Positive interaction with peers
      - Negative interaction with peers
      - Following instructions
      - Not following instructions
      - Raising hand to participate
      - Not participating
      - Disruptive behavior
      - Respectful behavior
      required: true
    - id: 10
      name: specific_behaviors
      label: Specific Behaviors Observed
      hint: Describe in detail
      type: text
      options: []
      required: true
    - id: 11
      name: triggers_or_antecedents
      label: Triggers or Antecedents
      hint: What happened before the behavior?
      type: text
      options: []
      required: false
    - id: 12
      name: consequences_observed
      label: Consequences of Behavior
      hint: What happened after the behavior?
      type: text
      options: []
      required: false
    - id: 13
      name: academic_engagement
      label: Academic Engagement Level
      hint: How engaged was the student?
      type: select_one
      options:
      - Highly engaged
      - Moderately engaged
      - Minimally engaged
      - Not engaged
      - Off-task
      required: true
    - id: 14
      name: social_interactions
      label: Social Interactions
      hint: How did the student interact with others?
      type: select_one
      options:
      - Positive throughout
      - Mostly positive
      - Mixed
      - Mostly negative
      - Negative throughout
      required: false
    - id: 15
      name: strengths_noted
      label: Student Strengths Observed
      hint: What did the student do well?
      type: text
      options: []
      required: false
    - id: 16
      name: areas_for_improvement
      label: Areas for Improvement
      hint: What could be improved?
      type: text
      options: []
      required: false
    - id: 17
      name: recommendations
      label: Recommendations
      hint: Suggested interventions or support
      type: text
      options: []
      required: false
    - id: 18
      name: follow_up_needed
      label: Follow-up Action Needed?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Pending
      required: false
