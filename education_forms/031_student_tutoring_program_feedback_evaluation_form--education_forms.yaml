inputSchema:
  type: object
  properties:
    title: student_tutoring_program_feedback_evaluation_form
    pages:
    - id: 1
      name: form_start
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: helpful
      label: helpful
      hint: null
      type: select_one
      options:
      - Helpful
      - Not helpful
      - Neither helpful nor not helpful
      required: true
    - id: 5
      name: suggestions
      label: suggestions
      hint: null
      type: select_multiple
      options:
      - Improved the program
      - Improved the program but not significantly
      - Not improved the program
      - Neither improved nor not improved the program
      required: true
    - id: 6
      name: frequency
      label: frequency
      hint: How often would you like to receive program services?
      type: number
      options: []
      required: true
    - id: 7
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submit
      label: submit
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
