      - Mindfulness
      - Self-Care
      - Other (please specify)
      required: false
    - id: 6
      name: workshop_schedule
      label: Workshop Schedule
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: workshop_facilitator
      label: Workshop Facilitator
      hint: null
      type: select_one
      options:
      - Jim
      - Jane
      - Other (please specify)
      required: false
    - id: 8
      name: workshop_location
      label: Workshop Location
      hint: null
      type: text
      options: []
      required: false
