      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participant_preferences
      label: Participant Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: workshop_topics
      label: Workshop Topics
