inputSchema:
  type: object
  properties:
    title: Extension Cord Safety Checklist
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_info
      label: Inspector Information
      hint: null
      type: select_one
      options:
      - Safety Officer
      - Safety Inspector
      - Facility Team
      - None
      required: false
    - id: 3
      name: cord_status
      label: Cord Status
      hint: null
      type: select_one
      options:
      - Good
      - Hazardous
      - Not Inspected
      required: false
    - id: 4
      name: cord_length
      label: Cord Length
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: cord_type
      label: Cord Type
      hint: null
      type: select_multiple
      options:
      - Power
      - Non-Power
      required: false
    - id: 6
      name: cord_condition
      label: Cord Condition
      hint: null
      type: select_one
      options:
      - Good
      - Damaged
      - Not Inspected
      required: false
    - id: 7
      name: cord_hazards
      label: Hazards
      hint: null
      type: select_multiple
      options:
      - Water
      - Fire
      - Electrical
      - Other
      required: false
    - id: 8
      name: cord_notes
      label: Cord Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: photo
      label: Photo
      hint: null
      type: text
      options: []
      required: false
