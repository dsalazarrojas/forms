inputSchema:
  type: object
  properties:
    title: Makeup Survey
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: makeup_frequency
      label: How often do you wear makeup?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: makeup_usage
      label: What type of makeup do you usually wear?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: makeup_routine
      label: How long do you spend each day on makeup?
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: favorite_product
      label: Favorite product
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: usage_reason
      label: Reason for using makeup
      hint: null
      type: checkbox
      options:
      - Option 1
      - Option 2
      required: false
    - id: 7
      name: time_using
      label: How long have you been using makeup?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: satisfaction
      label: Satisfied with current routine
      hint: null
      type: radio
      options:
      - Option 1
      - Option 2
      required: false
    - id: 9
      name: makeup_brand
      label: Makeup Brand
      hint: null
      type: text
      options: []
      required: false
