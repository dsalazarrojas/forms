inputSchema:
  type: object
  properties:
    title: Lip Product Subscription Form
    pages:
    - id: 1
      name: subscription_frequency
      label: How often do you want to receive your lip product
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Biweekly
      - Monthly
      required: false
    - id: 2
      name: lip_product_preference
      label: What lip product are you interested in
      hint: null
      type: select_multiple
      options:
      - Lipstick
      - Lip gloss
      - Lip liner
      - Lip balm
      required: false
    - id: 3
      name: start_date
      label: Start date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: end_date
      label: End date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: customer_notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
