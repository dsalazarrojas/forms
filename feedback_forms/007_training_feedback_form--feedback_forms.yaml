inputSchema:
  type: object
  properties:
    title: Training Feedback Form
    pages:
    - id: 1
      name: session_id
      label: Session ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: date_of_session
      label: Date of Session
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: trainer_name
      label: Trainer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: suggestions_for_improvement
      label: Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Trainer
      - Trainee
      required: true
    - id: 11
      name: submitted_at
      label: Submitted At
      hint: null
      type: date
      options: []
      required: true
