inputSchema:
  type: object
  properties:
    title: Staff Training Content Evaluation Form
    pages:
    - id: 1
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: trainer_name
      label: Trainer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: session_location
      label: Session Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: content_topics
      label: Content Topics
      hint: null
      type: select_multiple
      options:
      - Topic 1
      - Topic 2
      - Topic 3
      required: false
    - id: 5
      name: evaluation_scale
      label: Evaluation Scale
      hint: null
      type: select_one
      options:
      - Scale 1
      - Scale 2
      - Scale 3
      required: false
    - id: 6
      name: evaluation_comments
      label: Evaluation Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: recommendations
      label: Recommendations
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: training_outcome
      label: Training Outcome
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
