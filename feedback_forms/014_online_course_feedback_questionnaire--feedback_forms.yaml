inputSchema:
  type: object
  properties:
    title: Online Course Feedback Questionnaire
    pages:
    - id: 1
      name: overall_impression
      label: Briefly describe your overall impression of the course
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: feedback
      label: Feedback on the course content
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: rating
      label: Course Rating
      hint: Scale 1-10
      type: number
      options: []
      required: true
    - id: 4
      name: course_completion_info
      label: Date and Time of Course Completion
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: course_name
      label: What is the name of the course you took?
      hint: null
      type: select_one
      options:
      - Course 1
      - Course 2
      - Course 3
      required: true
    - id: 6
      name: courses_submitted
      label: Which courses have you submitted so far?
      hint: Select all that apply
      type: select_multiple
      options:
      - Course 1
      - Course 2
      required: false
    - id: 7
      name: submitted_by
      label: Your name
      hint: null
      type: text
      options: []
      required: false
