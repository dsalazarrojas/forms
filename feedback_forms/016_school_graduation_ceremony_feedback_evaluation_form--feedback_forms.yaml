inputSchema:
  type: object
  properties:
    title: School Graduation Ceremony Feedback Evaluation Form
    pages:
    - id: 1
      name: ceremony_attendance
      label: Ceremony Attendance
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: ceremony_attendance
      label: Were you a guest at the graduation ceremony?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: graduation_ceremony
      label: How would you rate the overall quality of the graduation ceremony?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: graduation_ceremony_assisted
      label: Were you assisted by a staff member during the graduation ceremony?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: graduation_ceremony_feedback
      label: What could be improved in the graduation ceremony?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: graduation_ceremony_comments
      label: Any additional comments?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: graduation_ceremony_attendance
      label: How many people attended the graduation ceremony?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: graduation_ceremony_duration
      label: How long did you stay at the graduation ceremony?
      hint: null
      type: select_one
      options:
      - Less than 30 minutes
      - 30 minutes to 1 hour
      - 1-2 hours
      - 2-3 hours
      - More than 3 hours
      required: true
