inputSchema:
  type: object
  properties:
    title: Student Satisfaction Questionnaire
    pages:
    - id: 1
      name: student_identifier
      label: Student Identifier
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: course_satisfaction
      label: How satisfied are you with this course?
      hint: On a scale of 1-5
      type: number
      options: []
      required: false
    - id: 5
      name: communication_with_instructor
      label: How would you rate communication with the instructor?
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very good''}'
      - '{''label'': ''Fair''}'
      - '{''label'': ''Poor''}'
      - '{''label'': ''Very poor''}'
      - '{''label'': ''Excellent''}'
      required: false
    - id: 6
      name: course_materials
      label: How would you rate the course materials?
      hint: null
      type: select_one
      options:
      - '{''label'': ''Very good''}'
      - '{''label'': ''Fair''}'
      - '{''label'': ''Poor''}'
      - '{''label'': ''Very poor''}'
      - '{''label'': ''Excellent''}'
      required: false
    - id: 7
      name: feedback
      label: Do you have any suggestions or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall how satisfied are you with this course?
      hint: On a scale of 1-5
      type: number
      options: []
      required: false
