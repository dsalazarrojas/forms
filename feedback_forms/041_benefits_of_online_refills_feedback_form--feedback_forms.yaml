inputSchema:
  type: object
  properties:
    title: Benefits Of Online Refills Feedback Form
    pages:
    - id: 1
      name: feedback_date
      label: Date of Feedback
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: online_refill_usage
      label: How Often Do You Use Online Refills
      hint: null
      type: select_one
      options:
      - Very Frequently
      - Frequently
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 6
      name: ease_of_use
      label: Ease of Using Online Refill System
      hint: null
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 7
      name: website_navigation
      label: Website Navigation and User Interface
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 8
      name: time_to_refill
      label: Time Required to Complete Refill
      hint: null
      type: select_one
      options:
      - Very Quick (less than 1 minute)
      - Quick (1-2 minutes)
      - Moderate (2-5 minutes)
      - Slow (5-10 minutes)
      - Very Slow (more than 10 minutes)
      required: true
    - id: 9
      name: prescription_selection
      label: Prescription Selection Process
      hint: How easy was it to select prescriptions
      type: select_one
      options:
      - Very Easy
      - Easy
      - Moderate
      - Difficult
      - Very Difficult
      required: true
    - id: 10
      name: payment_process
      label: Payment Process
      hint: null
      type: select_one
      options:
      - Very Easy
      - Easy
      - Moderate
      - Difficult
      - Very Difficult
      required: true
    - id: 11
      name: security_confidence
      label: Confidence in System Security
      hint: How secure do you feel your information is
      type: select_one
      options:
      - Very Confident
      - Confident
      - Neutral
      - Not Confident
      - Very Not Confident
      required: true
    - id: 12
      name: delivery_experience
      label: Delivery Experience
      hint: How was your prescription delivery
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 13
      name: delivery_speed
      label: Speed of Delivery
      hint: null
      type: select_one
      options:
      - Faster than Expected
      - As Expected
      - Slower than Expected
      - Much Slower than Expected
      required: false
    - id: 14
      name: communication_quality
      label: Communication About Refill Status
      hint: Did you receive adequate updates
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 15
      name: customer_support
      label: Customer Support Quality
      hint: When you needed help, was support responsive
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: false
    - id: 16
      name: overall_satisfaction
      label: Overall Satisfaction with Online Refills
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 17
      name: main_benefits
      label: Main Benefits of Online Refills
      hint: What advantages have you experienced
      type: text
      options: []
      required: false
    - id: 18
      name: main_drawbacks
      label: Main Drawbacks or Challenges
      hint: What could be improved
      type: text
      options: []
      required: false
    - id: 19
      name: recommend_service
      label: Would You Recommend Online Refills
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Unsure
      - Probably No
      - Definitely No
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments or Suggestions
      hint: null
      type: text
      options: []
      required: false
