inputSchema:
  type: object
  properties:
    title: Member Facility Satisfaction Report Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: facility_name
      label: Facility Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_visited
      label: Date Visited
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 6
      name: service_quality
      label: Service Quality
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: cleanliness
      label: Cleanliness
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: staff_friendliness
      label: Staff Friendliness
      hint: null
      type: select_one
      options:
      - Very Friendly
      - Somewhat Friendly
      - Not Very Friendly
      - Not At All Friendly
      required: false
    - id: 9
      name: facilities
      label: Facilities
      hint: null
      type: select_one
      options:
      - Very Clean
      - Somewhat Clean
      - Neutral
      - Somewhat Unclean
      - Not At All Clean
      required: false
    - id: 10
      name: parking
      label: Parking
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
