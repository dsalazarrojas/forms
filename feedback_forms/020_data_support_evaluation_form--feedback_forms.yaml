inputSchema:
  type: object
  properties:
    title: Data Support Evaluation Form
    pages:
    - id: 1
      name: page_1
      label: Initial Contact with Support
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: rating_score
      label: Rating Score
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: areas_for_improvement
      label: Areas for Improvement
      hint: null
      type: select_multiple
      options:
      - Communication
      - Response Time
      - Knowledge
      - Problem Solving
      - Overall Experience
      required: true
    - id: 4
      name: contact_frequency
      label: Contact Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 5
      name: basis_for_rating
      label: Basis for Rating
      hint: null
      type: select_one
      options:
      - Experience
      - Knowledge
      - Communication
      - Response Time
      required: true
    - id: 6
      name: average_rating
      label: Average Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 9
      name: team_member_rating
      label: Team Member Rating
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Bad
      - Very Bad
      required: false
    - id: 10
      name: team_lead_rating
      label: Team Lead Rating
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Bad
      - Very Bad
      required: false
    - id: 11
      name: support_team_performance
      label: Support Team Performance
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_one
      options:
      - Scale 1-5
      - Scale 1-10
      - Scale 6-10
      required: true
    - id: 13
      name: rating_score_2
      label: Rating Score 2
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: rating_scale_type
      label: Rating Scale Type
      hint: null
      type: select_one
      options:
      - Linear
      - Non-Linear
      required: true
    - id: 15
      name: rating_score_total
      label: Rating Score Total
      hint: null
      type: number
      options: []
      required: true
