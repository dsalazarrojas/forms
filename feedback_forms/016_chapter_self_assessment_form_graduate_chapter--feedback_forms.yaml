        hint: rate member involvement
        type: select_one
        options:
          - Low
          - Moderate
          - High
        required: true
      - id: 6
        name: community_impact
        label: community impact
        hint: rate chapter community initiatives
        type: select_one
        options:
          - Low
          - Moderate
          - High
        required: true
      - id: 7
