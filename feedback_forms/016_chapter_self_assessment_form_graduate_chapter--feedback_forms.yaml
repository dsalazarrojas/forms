inputSchema:
  type: object
  properties:
    title: Chapter Self Assessment Form Graduate Chapter
    pages:
      - id: 1
        name: header
        label: -- Graduate Chapter Self Assessment --
        hint: Annual self assessment for graduate chapter performance and governance
        type: note
        options: []
        required: false
      - id: 2
        name: chapter_name
        label: chapter name
        hint: name of the graduate chapter
        type: text
        options: []
        required: true
      - id: 3
        name: assessment_period
        label: assessment period
        hint: timeframe for this self assessment
        type: text
        options: []
        required: true
      - id: 4
        name: governance_rating
        label: governance rating
