inputSchema:
  type: object
  properties:
    title: Business Accelerator Program Feedback Questionnaire
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company Name
      hint: Name of your startup or business
      type: text
      options: []
      required: true
    - id: 4
      name: program_cohort
      label: Program Cohort
      hint: Which cohort did you participate in
      type: text
      options: []
      required: true
    - id: 5
      name: program_duration
      label: Program Duration
      hint: Length of your participation
      type: select_one
      options:
      - 1-3 Months
      - 3-6 Months
      - 6-12 Months
      - More than 12 Months
      required: true
    - id: 6
      name: industry
      label: Industry
      hint: Your business industry
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - E-commerce
      - Education
      - Clean Energy
      - Food and Beverage
      - Manufacturing
      - Services
      - Other
      required: true
    - id: 7
      name: program_content
      label: Program Content
      hint: Feedback on program content
      type: note
      options: []
      required: false
    - id: 8
      name: content_quality
      label: Content Quality
      hint: Rate the quality of program content
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 9
      name: content_relevance
      label: Content Relevance
      hint: How relevant was the content to your business
      type: select_one
      options:
      - Very Relevant
      - Relevant
      - Somewhat Relevant
      - Not Very Relevant
      - Not Relevant
      required: true
    - id: 10
      name: curriculum_rating
      label: Curriculum Rating
      hint: Rate the overall curriculum
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 11
      name: mentorship
      label: Mentorship
      hint: Feedback on mentorship
      type: note
      options: []
      required: false
    - id: 12
      name: mentor_quality
      label: Mentor Quality
      hint: Rate the quality of mentors
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 13
      name: mentor_availability
      label: Mentor Availability
      hint: Were mentors accessible when needed
      type: select_one
      options:
      - Always Available
      - Usually Available
      - Sometimes Available
      - Rarely Available
      - Never Available
      required: true
    - id: 14
      name: mentorship_impact
      label: Mentorship Impact
      hint: How impactful was the mentorship
      type: select_one
      options:
      - Very Impactful
      - Impactful
      - Somewhat Impactful
      - Not Very Impactful
      - Not Impactful
      required: true
    - id: 15
      name: resources_support
      label: Resources and Support
      hint: Feedback on resources provided
      type: note
      options: []
      required: false
    - id: 16
      name: resource_quality
      label: Resource Quality
      hint: Rate the quality of resources
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 17
      name: networking_opportunities
      label: Networking Opportunities
      hint: Rate networking opportunities
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 18
      name: facilities
      label: Facilities and Infrastructure
      hint: Rate the physical or virtual facilities
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 19
      name: program_outcomes
      label: Program Outcomes
      hint: Results from the program
      type: note
      options: []
      required: false
    - id: 20
      name: business_growth
      label: Business Growth Since Program
      hint: How has your business grown
      type: select_one
      options:
      - Significant Growth
      - Moderate Growth
      - Slight Growth
      - No Change
      - Decline
      required: true
    - id: 21
      name: funding_secured
      label: Funding Secured
      hint: Did you secure funding through the program
      type: select_one
      options:
      - Yes - Fully Funded
      - Yes - Partially Funded
      - In Progress
      - 'False'
      - Not Seeking Funding
      required: true
    - id: 22
      name: skills_gained
      label: Skills Gained
      hint: What skills did you gain
      type: select_multiple
      options:
      - Business Strategy
      - Financial Management
      - Marketing
      - Sales
      - Product Development
      - Fundraising
      - Leadership
      - Networking
      - Pitching
      - Other
      required: true
    - id: 23
      name: would_recommend
      label: Would You Recommend This Program
      hint: Would you recommend to other entrepreneurs
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Neutral
      - Probably No
      - Definitely No
      required: true
    - id: 24
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you overall
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 25
      name: program_improvements
      label: Suggested Improvements
      hint: How can the program be improved
      type: text
      options: []
      required: false
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
