      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_score
      label: Feedback Score
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: feedback_details
      label: Feedback Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: feedback_category
      label: Feedback Category
      hint: null
      type: select_one
      options:
      - HRIS
      - Non-HRIS
      - Other
      required: false
    - id: 7
      name: feedback_text
      label: Additional Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
