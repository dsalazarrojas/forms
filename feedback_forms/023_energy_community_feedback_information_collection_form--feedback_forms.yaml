inputSchema:
  type: object
  properties:
    title: Energy Community Feedback Information Collection Form
    pages:
    - id: 1
      name: member_name
      label: Member Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: initiative
      label: initiative
      hint: Select a specific energy community initiative
      type: select_one
      options:
      - Community Solar
      - Community Wind
      - Community Hydro
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
