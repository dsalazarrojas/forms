inputSchema:
  type: object
  properties:
    title: Client Consultation Satisfaction Poll
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Optional - for follow-up
      type: text
      options: []
      required: false
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Optional - for follow-up
      type: text
      options: []
      required: false
    - id: 3
      name: client_email
      label: Email Address
      hint: For survey results
      type: email
      options: []
      required: false
    - id: 4
      name: consultation_date
      label: Date of Consultation
      hint: When was your appointment?
      type: date
      options: []
      required: true
    - id: 5
      name: consultant_name
      label: Consultant Name
      hint: Who did you meet with?
      type: text
      options: []
      required: false
    - id: 6
      name: service_type
      label: Service Type
      hint: What consultation did you receive?
      type: select_one
      options:
      - Initial Consultation
      - Follow-Up Consultation
      - Treatment Consultation
      - Product Consultation
      - General Inquiry
      - Other
      required: true
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction with Consultation
      hint: Your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: consultant_knowledge
      label: Consultant Knowledge and Expertise
      hint: How knowledgeable was the consultant?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: consultant_professionalism
      label: Consultant Professionalism
      hint: Professional behavior
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: communication_clarity
      label: Clarity of Communication
      hint: How well did they explain things?
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: time_spent
      label: Time Spent During Consultation
      hint: Was it adequate?
      type: select_one
      options:
      - More Than Enough
      - Adequate
      - Too Rushed
      - Too Long
      required: true
    - id: 12
      name: questions_addressed
      label: Were All Your Questions Addressed?
      hint: Question coverage
      type: select_one
      options:
      - Yes, All Questions Answered
      - Most Questions Answered
      - Some Questions Answered
      - Few Questions Answered
      - No Questions Answered
      required: true
    - id: 13
      name: information_provided
      label: Quality of Information Provided
      hint: Usefulness of information
      type: select_one
      options:
      - Very Helpful
      - Helpful
      - Neutral
      - Not Very Helpful
      - Not Helpful at All
      required: true
    - id: 14
      name: wait_time
      label: Wait Time Before Consultation
      hint: How long did you wait?
      type: select_one
      options:
      - No Wait
      - Under 10 Minutes
      - 10-20 Minutes
      - 20-30 Minutes
      - Over 30 Minutes
      required: true
    - id: 15
      name: wait_time_satisfaction
      label: Satisfaction With Wait Time
      hint: Was it acceptable?
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 16
      name: facility_comfort
      label: Comfort of Facility
      hint: Environment and atmosphere
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: scheduling_ease
      label: Ease of Scheduling Appointment
      hint: Booking experience
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 18
      name: value_for_time
      label: Value for Time Invested
      hint: Was it worthwhile?
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Very Poor Value
      required: true
    - id: 19
      name: likely_to_return
      label: How Likely Are You to Return?
      hint: Future visits
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 20
      name: recommend_to_others
      label: How Likely Are You to Recommend Us?
      hint: To friends or family
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 21
      name: improvement_areas
      label: What Could We Improve?
      hint: Select all that apply
      type: select_multiple
      options:
      - Wait Times
      - Communication
      - Consultant Knowledge
      - Facility Comfort
      - Scheduling Process
      - Follow-Up
      - Pricing Information
      - Nothing - All Good
      - Other
      required: true
    - id: 22
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 23
      name: follow_up_permission
      label: May We Contact You for Follow-Up?
      hint: For service improvement
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 24
      name: poll_completion_date
      label: Poll Completion Date
      hint: null
      type: date
      options: []
      required: true
