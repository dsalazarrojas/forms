inputSchema:
  type: object
  properties:
    title: Returns Coordinator Feedback Form
    pages:
    - id: 1
      name: return_case
      label: Return Case
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: return_case_description
      label: Return Case Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: reason_for_return
      label: Reason for Return
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: return_status
      label: Return Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 5
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: return_time
      label: Return Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: customer_communication
      label: Customer Communication
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: team_member_comments
      label: Team Member Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: return_frequency
      label: Return Frequency
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
