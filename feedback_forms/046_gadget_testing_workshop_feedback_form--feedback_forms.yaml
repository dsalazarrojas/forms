inputSchema:
  type: object
  properties:
    title: Gadget Testing Workshop Feedback Form
    pages:
    - id: 1
      name: workshop_participation
      label: Workshop Participation
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: gadget_impression
      label: What was your impression of the gadget?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: gadget_design
      label: How would you rate the gadget's design?
      hint: null
      type: select_one
      options:
      - Unsatisfactory
      - Fair
      - Good
      - Very Good
      - Excellent
      required: false
    - id: 4
      name: gadget_ease_of_use
      label: How easy was it to use the gadget?
      hint: null
      type: select_one
      options:
      - Very Difficult
      - Somewhat Difficult
      - Neutral
      - Somewhat Easy
      - Very Easy
      required: false
    - id: 5
      name: gadget_value
      label: What value do you think the gadget provides?
      hint: null
      type: select_multiple
      options:
      - Very Low
      - Low
      - Neutral
      - High
      - Very High
      required: false
    - id: 6
      name: workshop_experience
      label: How would you rate your overall experience with the workshop?
      hint: null
      type: select_one
      options:
      - Very Poor
      - Poor
      - Neutral
      - Good
      - Very Good
      - Excellent
      required: false
    - id: 7
      name: gadget_improvement
      label: What can be improved in the gadget?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: participant_organization
      label: Participant Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: participant_job_title
      label: Participant Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: participant_department
      label: Participant Department
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: participant_location
      label: Participant Location
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
