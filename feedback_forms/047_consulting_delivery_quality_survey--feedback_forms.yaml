inputSchema:
  type: object
  properties:
    title: Consulting Delivery Quality Survey
    pages:
      - id: 1
        name: section_delivery_feedback
        label: -- Delivery Feedback --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: client_name
        label: Client name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 3
        name: project_name
        label: Project name
        hint: Consulting engagement name
        type: text
        options: []
        required: true
      - id: 4
        name: quality_of_work
        label: Quality of work
        hint: Rate quality of delivered work
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 5
        name: timeliness_of_delivery
        label: Timeliness of delivery
        hint: Rate adherence to agreed schedule
        type: select_one
        options:
          - On time
          - Minor delays
          - Significant delays
        required: true
      - id: 6
        name: clarity_of_recommendations
        label: Clarity of recommendations
        hint: Rate how actionable recommendations were
        type: select_one
        options:
          - Clear and actionable
          - Somewhat clear
          - Not clear
        required: true
      - id: 7
        name: likelihood_to_recommend
        label: Likelihood to recommend
        hint: Would you recommend this consultancy
        type: select_one
        options:
          - Very likely
          - Likely
          - Unlikely
          - Very unlikely
        required: true
      - id: 8
        name: additional_comments
        label: Additional comments
        hint: Optional feedback or suggestions
        type: text
        options: []
        required: false
