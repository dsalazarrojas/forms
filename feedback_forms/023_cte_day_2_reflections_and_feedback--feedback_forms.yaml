inputSchema:
  type: object
  properties:
    title: CTE Day 2 Reflections And Feedback
    pages:
    - id: 1
      name: feedback_intro
      label: -- CTE Day 2 Feedback and Reflection --
      hint: Professional Development Session 2
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: optional
      type: text
      options: []
      required: false
    - id: 3
      name: school_division
      label: School or Division
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: reflection_header
      label: -- Daily Reflections --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: key_takeaway
      label: What was your most significant takeaway from today's sessions
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: session_most_valuable
      label: Which session did you find most valuable
      hint: null
      type: select_one
      options:
      - Morning Workshop
      - Lunch and Learn
      - Afternoon Deep Dive
      - Peer Collaboration Session
      - Keynote Speaker
      required: true
    - id: 7
      name: application_to_practice
      label: How will you apply today's learning to your classroom or office
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: unanswered_questions
      label: Do you have any remaining questions from Day 2
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: logistics_header
      label: -- Event Logistics Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: venue_rating
      label: Rate the venue and facilities
      hint: 1 is Poor, 5 is Excellent
      type: number
      options: []
      required: true
    - id: 11
      name: catering_satisfaction
      label: Were you satisfied with the catering options
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: false
    - id: 12
      name: pacing_rating
      label: How was the pacing of the day
      hint: null
      type: select_one
      options:
      - Too Fast
      - Just Right
      - Too Slow
      required: true
    - id: 13
      name: overall_experience
      label: Overall rating for Day 2
      hint: null
      type: select_one
      options:
      - Outstanding
      - Good
      - Fair
      - Needs Improvement
      required: true
    - id: 14
      name: suggestions_for_day_3
      label: Suggestions or requests for Day 3
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: follow_up_interest
      label: Are you interested in a follow-up coaching session
      hint: null
      type: select_one
      options:
      - true
      - false
      - Maybe later
      required: false
