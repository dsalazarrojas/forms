inputSchema:
  type: object
  properties:
    title: Animal Product Quality Review Request Form
    pages:
    - id: 1
      name: requester_name
      label: Requester Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: requester_email
      label: Requester Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 3
      name: requester_phone
      label: Requester Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Quality Assurance
      - Production
      - Research and Development
      - Customer Service
      - Sales and Marketing
      - Management
      - Other
      required: true
    - id: 5
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: product_name
      label: Product Name
      hint: Name of product for review
      type: text
      options: []
      required: true
    - id: 7
      name: product_code
      label: Product Code or SKU
      hint: Product identifier
      type: text
      options: []
      required: false
    - id: 8
      name: batch_lot_number
      label: Batch or Lot Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 9
      name: review_type
      label: Type of Review Requested
      hint: Select primary review type
      type: select_one
      options:
      - Quality Audit
      - Safety Assessment
      - Compliance Review
      - Customer Complaint Investigation
      - Process Improvement
      - Supplier Evaluation
      - Other
      required: true
    - id: 10
      name: priority_level
      label: Priority Level
      hint: How urgent is this review
      type: select_one
      options:
      - Critical - Immediate Action Required
      - High - Within 24 Hours
      - Medium - Within 1 Week
      - Low - Routine Review
      required: true
    - id: 11
      name: issue_description
      label: Description of Issue or Concern
      hint: Provide detailed information
      type: text
      options: []
      required: true
    - id: 12
      name: issue_category
      label: Issue Category
      hint: Select all that apply
      type: select_multiple
      options:
      - Product Defect
      - Packaging Issue
      - Labeling Error
      - Contamination Concern
      - Quality Variation
      - Customer Complaint
      - Regulatory Compliance
      - Supplier Issue
      - Other
      required: true
    - id: 13
      name: affected_quantity
      label: Estimated Quantity Affected
      hint: Number of units or batches
      type: number
      options: []
      required: false
    - id: 14
      name: customer_impact
      label: Has This Affected Customers
      hint: null
      type: select_one
      options:
      - Yes - Multiple Customers
      - Yes - Single Customer
      - Potential Impact
      - No Customer Impact
      - Unknown
      required: true
    - id: 15
      name: evidence_attached
      label: Do You Have Supporting Evidence
      hint: Photos documents or samples
      type: select_one
      options:
      - Yes - Will Attach Separately
      - false
      required: true
    - id: 16
      name: previous_occurrences
      label: Has This Issue Occurred Before
      hint: null
      type: select_one
      options:
      - Yes - Frequent
      - Yes - Occasional
      - Yes - Once Before
      - No - First Occurrence
      - Unknown
      required: true
    - id: 17
      name: suggested_actions
      label: Suggested Immediate Actions
      hint: What should be done now
      type: text
      options: []
      required: false
    - id: 18
      name: stakeholders_notified
      label: Which Stakeholders Have Been Notified
      hint: Select all that apply
      type: select_multiple
      options:
      - Quality Manager
      - Production Manager
      - Senior Management
      - Customer Service
      - Regulatory Affairs
      - Supplier
      - None Yet
      required: true
    - id: 19
      name: expected_outcome
      label: Expected Outcome from Review
      hint: What do you hope to achieve
      type: text
      options: []
      required: false
    - id: 20
      name: deadline
      label: Requested Completion Date
      hint: When should review be completed
      type: date
      options: []
      required: false
    - id: 21
      name: additional_information
      label: Additional Information
      hint: Any other relevant details
      type: text
      options: []
      required: false
