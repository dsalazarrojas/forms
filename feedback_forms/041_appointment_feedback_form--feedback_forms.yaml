inputSchema:
  type: object
  properties:
    title: Appointment Feedback Form
    pages:
    - id: 1
      name: client_information
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: appointment_details
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: service_received
      label: Service Received
      hint: null
      type: select_one
      options:
      - Hair styling
      - Facial
      - Massage
      - Nail service
      - Medical consultation
      - Other
      required: true
    - id: 8
      name: service_provider
      label: Service Provider Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: satisfaction_section
      label: -- Satisfaction Rating --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: overall_satisfaction
      label: Overall satisfaction with your appointment
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 11
      name: service_quality
      label: Quality of service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 12
      name: provider_professionalism
      label: Provider professionalism and courtesy
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 13
      name: cleanliness
      label: Cleanliness and hygiene
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 14
      name: wait_time
      label: How was the wait time?
      hint: null
      type: select_one
      options:
      - No wait
      - Minimal wait
      - Acceptable wait
      - Long wait
      - Excessive wait
      required: false
    - id: 15
      name: facility_experience
      label: -- Facility Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: facility_comfort
      label: Comfort of facility
      hint: null
      type: select_one
      options:
      - Very comfortable
      - Comfortable
      - Average
      - Uncomfortable
      - Very uncomfortable
      required: false
    - id: 17
      name: facility_atmosphere
      label: Atmosphere and ambiance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: false
    - id: 18
      name: results_satisfaction
      label: -- Results and Value --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: results_expectations
      label: Did results meet your expectations?
      hint: null
      type: select_one
      options:
      - Exceeded expectations
      - Met expectations
      - Partially met
      - Did not meet expectations
      required: true
    - id: 20
      name: value_for_money
      label: Value for money
      hint: null
      type: select_one
      options:
      - Excellent value
      - Good value
      - Fair value
      - Poor value
      - Very poor value
      required: false
    - id: 21
      name: would_recommend
      label: Would you recommend us to others?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Yes, probably
      - Maybe
      - Probably not
      - Definitely not
      required: true
    - id: 22
      name: improvement_suggestions
      label: Suggestions for improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: additional_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
