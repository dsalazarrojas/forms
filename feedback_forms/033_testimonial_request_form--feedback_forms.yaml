inputSchema:
  type: object
  properties:
    title: Testimonial Request Form
    pages:
    - id: 1
      name: testimonial_input
      label: What would you like to say about us
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_rating
      label: Rate our services
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: publication_consent
      label: Publish my testimonial
      hint: null
      type: select_multiple
      options:
      - Yes, I consent to publish my testimonial
      - No, do not publish my testimonial
      required: false
