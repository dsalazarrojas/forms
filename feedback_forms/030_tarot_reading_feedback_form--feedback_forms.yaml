inputSchema:
  type: object
  properties:
    title: Tarot Reading Feedback Form
    pages:
    - id: 1
      name: tarot_reading_feedback_form_1
      label: What was your overall experience?
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Somewhat Good
      - Somewhat Bad
      - Very Bad
      required: false
    - id: 2
      name: tarot_reading_feedback_form_2
      label: How would you rate the tarot reading?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: tarot_reading_feedback_form_3
      label: What was the tarot reader's demeanor during the reading?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: tarot_reading_feedback_form_4
      label: Were you able to connect with the tarot reader?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
