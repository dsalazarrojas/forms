inputSchema:
  type: object
  properties:
    title: Facility Access Control Experience Survey
    pages:
    - id: 1
      name: user_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: facility_access_control_rating
      label: Facility Access Control
      hint: null
      type: number
      options: []
      required: true
