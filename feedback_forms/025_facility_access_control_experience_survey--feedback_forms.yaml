      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_user
      label: Assigned To
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments_on_assigned_user
      label: Comments On Assigned User
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
