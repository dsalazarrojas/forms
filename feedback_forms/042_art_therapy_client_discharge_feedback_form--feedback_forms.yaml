inputSchema:
  type: object
  properties:
    title: Art Therapy Client Discharge Feedback Form
    pages:
    - id: 1
      name: discharge_date
      label: Discharge Date
      hint: Date of discharge
      type: date
      options: []
      required: true
    - id: 2
      name: client_name
      label: Client Name
      hint: Client full name
      type: text
      options: []
      required: true
    - id: 3
      name: client_id
      label: Client ID
      hint: Client identification number
      type: text
      options: []
      required: false
    - id: 4
      name: therapist_name
      label: Therapist Name
      hint: Name of treating therapist
      type: text
      options: []
      required: true
    - id: 5
      name: treatment_start_date
      label: Treatment Start Date
      hint: When did treatment begin
      type: date
      options: []
      required: true
    - id: 6
      name: treatment_end_date
      label: Treatment End Date
      hint: End date of treatment
      type: date
      options: []
      required: true
    - id: 7
      name: number_of_sessions
      label: Number of Sessions
      hint: Total sessions attended
      type: number
      options: []
      required: true
    - id: 8
      name: discharge_reason
      label: Discharge Reason
      hint: Reason for discharge
      type: select_one
      options:
      - Treatment Goals Met
      - Client Initiated
      - Therapist Recommendation
      - Referral to Another Provider
      - Insurance Limitations
      - Other
      required: true
    - id: 9
      name: discharge_reason_details
      label: Discharge Reason Details
      hint: Provide more details
      type: text
      options: []
      required: false
    - id: 10
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 11
      name: therapist_relationship
      label: Therapist Relationship
      hint: Rate your relationship with therapist
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 12
      name: art_activities_helpfulness
      label: Art Activities Helpfulness
      hint: How helpful were art activities
      type: select_one
      options:
      - Very Helpful
      - Helpful
      - Neutral
      - Not Very Helpful
      - Not Helpful
      required: true
    - id: 13
      name: favorite_activities
      label: Favorite Activities
      hint: Which activities did you find most helpful
      type: select_multiple
      options:
      - Drawing
      - Painting
      - Sculpture
      - Collage
      - Journaling
      - Group Art Making
      - Individual Projects
      - Guided Imagery
      required: false
    - id: 14
      name: emotional_progress
      label: Emotional Progress
      hint: Rate your emotional progress
      type: select_one
      options:
      - Significant Improvement
      - Moderate Improvement
      - Some Improvement
      - Little Improvement
      - No Improvement
      required: true
    - id: 15
      name: coping_skills_developed
      label: Coping Skills Developed
      hint: Have you developed new coping skills
      type: select_one
      options:
      - Yes - Many New Skills
      - Yes - Some New Skills
      - Somewhat
      - 'False'
      required: true
    - id: 16
      name: coping_skills_list
      label: Coping Skills List
      hint: List skills you developed
      type: text
      options: []
      required: false
    - id: 17
      name: self_awareness
      label: Self Awareness
      hint: Rate your self-awareness improvement
      type: select_one
      options:
      - Significant Improvement
      - Moderate Improvement
      - Some Improvement
      - Little Improvement
      - No Improvement
      required: true
    - id: 18
      name: would_recommend
      label: Would Recommend
      hint: Would you recommend art therapy
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Unsure
      - Probably No
      - Definitely No
      required: true
    - id: 19
      name: environment_comfort
      label: Environment Comfort
      hint: Rate the comfort of the therapy environment
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 20
      name: materials_quality
      label: Materials Quality
      hint: Rate the quality of art materials
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 21
      name: session_length
      label: Session Length
      hint: Was the session length appropriate
      type: select_one
      options:
      - Too Short
      - Just Right
      - Too Long
      required: true
    - id: 22
      name: session_frequency
      label: Session Frequency
      hint: Was the frequency appropriate
      type: select_one
      options:
      - Should Be More Frequent
      - Just Right
      - Should Be Less Frequent
      required: true
    - id: 23
      name: goals_achieved
      label: Goals Achieved
      hint: Were your treatment goals achieved
      type: select_one
      options:
      - Fully Achieved
      - Mostly Achieved
      - Partially Achieved
      - Not Achieved
      required: true
    - id: 24
      name: continued_art_practice
      label: Continued Art Practice
      hint: Do you plan to continue art making
      type: select_one
      options:
      - Yes - Definitely
      - Probably Yes
      - Unsure
      - Probably No
      - 'False'
      required: true
    - id: 25
      name: follow_up_needed
      label: Follow Up Needed
      hint: Do you need follow-up services
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 26
      name: follow_up_preferences
      label: Follow Up Preferences
      hint: What type of follow-up
      type: text
      options: []
      required: false
    - id: 27
      name: additional_feedback
      label: Additional Feedback
      hint: Any other comments
      type: text
      options: []
      required: false
    - id: 28
      name: client_signature
      label: Client Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
