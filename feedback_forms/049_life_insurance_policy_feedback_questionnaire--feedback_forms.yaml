inputSchema:
  type: object
  properties:
    title: Life Insurance Policy Feedback Questionnaire
    pages:
    - id: 1
      name: policy_rating
      label: Policy Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: policy_rating_description
      label: Policy Rating Description
      hint: Please describe your experience with this policy.
      type: text
      options: []
      required: false
    - id: 3
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 4
      name: policy_recommendation
      label: Policy Recommendation
      hint: null
      type: select_multiple
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neither Agree nor Disagree
      - Strongly Disagree
      - No Opinion
      required: false
    - id: 5
      name: additional_comments
      label: Additional Comments
      hint: Please provide any additional comments.
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: company_website
      label: Company Website
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: policy_name
      label: Policy Name
      hint: null
      type: text
      options: []
      required: false
