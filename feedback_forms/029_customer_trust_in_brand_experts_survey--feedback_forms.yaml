inputSchema:
  type: object
  properties:
    title: Customer Trust In Brand Experts Survey
    pages:
    - id: 1
      name: introduction
      label: What is your experience with our brand experts?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating
      label: How would you rate our brand experts on a scale of 1-5?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: rating_comment
      label: What is your reason for this rating?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: feedback
      label: What are your thoughts on what we did well or what we could improve?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: rating_date
      label: When did you last visit one of our brand experts?
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: rating_time
      label: What time did you last visit one of our brand experts?
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: expert_name
      label: What is the name of the expert you met with?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: expert_specialization
      label: What kind of expert was it?
      hint: null
      type: select_one
      options:
      - General Medicine
      - Surgery
      - Pediatrics
      - Cardiology
      - Other
      required: true
    - id: 10
      name: expert_location
      label: Where was the meeting held?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: overall_experience
      label: What was your overall experience with this brand expert?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: rating_quality
      label: What was the quality of the expert?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      - No Answer
      required: false
    - id: 13
      name: expert_friendliness
      label: How friendly was the expert?
      hint: null
      type: select_one
      options:
      - Very Friendly
      - Somewhat Friendly
      - Neutral
      - Somewhat Unfriendly
      - Very Unfriendly
      required: false
    - id: 14
      name: expert_listening_skill
      label: How good was the expert listening?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - No Answer
      required: false
    - id: 15
      name: expert_response_speed
      label: How fast was the expert response?
      hint: null
      type: select_one
      options:
      - Very Fast
      - Somewhat Fast
      - Neutral
      - Somewhat Slow
      - Very Slow
      required: false
    - id: 16
      name: expert_helpfulness
      label: How helpful was the expert?
      hint: null
      type: select_one
      options:
      - Very Helpful
      - Somewhat Helpful
      - Neutral
      - Somewhat Unhelpful
      - Very Unhelpful
      required: false
    - id: 17
      name: expert_professionalism
      label: How professional was the expert?
      hint: null
      type: select_one
      options:
      - Very Professional
      - Somewhat Professional
      - Neutral
      - Somewhat Unprofessional
      - Very Unprofessional
      required: false
    - id: 18
      name: expert_expertise
      label: How much expertise did the expert have?
      hint: null
      type: select_one
      options:
      - Very Expert
      - Somewhat Expert
      - Neutral
      - Somewhat Non-Expert
      - Very Non-Expert
      required: false
    - id: 19
      name: expert_will_revisit
      label: Would you re-visit this expert?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 20
      name: expert_recommend
      label: Would you recommend this expert to others?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 21
      name: expert_rating_average
      label: What is your rating average for this expert?
      hint: null
      type: number
      options: []
      required: true
    - id: 22
      name: expert_rating_scale
      label: On a scale of 1-5
      hint: null
      type: number
      options: []
      required: true
    - id: 23
      name: expert_rating_average_time
      label: How much time did you spend with this expert?
      hint: null
      type: time
      options: []
      required: true
    - id: 24
      name: expert_rating_average_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: true
    - id: 25
      name: submitted
      label: Submit
      hint: null
      type: select_multiple
      options:
      - Submit and get a confirmation email
      - Submit and no email
      required: true
