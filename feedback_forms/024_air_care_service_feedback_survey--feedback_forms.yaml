inputSchema:
  type: object
  properties:
    title: Air Care Service Feedback Survey
    pages:
    - id: 1
      name: customer_name
      label: Customer name
      hint: Optional for anonymous feedback
      type: text
      options: []
      required: false
    - id: 2
      name: service_date
      label: Service date
      hint: Date of the appointment
      type: date
      options: []
      required: false
    - id: 3
      name: technician_professionalism
      label: Technician professionalism
      hint: Rate technician conduct and skills
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: service_timeliness
      label: Service timeliness
      hint: Was the service on time as scheduled
      type: select_one
      options:
      - On time
      - Late
      - Very late
      required: true
    - id: 5
      name: issue_resolved
      label: Was the issue resolved
      hint: Customer reported outcome
      type: select_one
      options:
      - 'True'
      - Partially
      - 'False'
      required: true
    - id: 6
      name: value_for_money
      label: Value for money
      hint: Satisfaction with pricing
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: would_recommend
      label: Would you recommend us
      hint: Likelihood to recommend service
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 8
      name: suggestions
      label: Suggestions for improvement
      hint: Feedback to improve service delivery
      type: text
      options: []
      required: false
    - id: 9
      name: follow_up_requested
      label: Follow up requested
      hint: Would you like a follow up from our team
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
