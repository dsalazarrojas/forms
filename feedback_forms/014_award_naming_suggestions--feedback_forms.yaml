inputSchema:
  type: object
  properties:
    title: Award Naming Suggestions
    pages:
      - id: 1
        name: submitter_name
        label: Your Name
        hint: Optional - enter your name
        type: text
        options: []
        required: false
      - id: 2
        name: submitter_email
        label: Email Address
        hint: For follow-up if your name is selected
        type: email
        options: []
        required: false
      - id: 3
        name: department
        label: Department or Division
        hint: Where do you work
        type: text
        options: []
        required: false
      - id: 4
        name: years_with_organization
        label: Years with Organization
        hint: How long have you been here
        type: select_one
        options:
          - Less than 1 year
          - 1-3 years
          - 4-7 years
          - 8-15 years
          - More than 15 years
        required: false
      - id: 5
        name: award_category
        label: Award Category
        hint: Which award are you naming
        type: select_one
        options:
          - Employee of the year
          - Leadership excellence
          - Innovation award
          - Customer service award
          - Team achievement
          - Lifetime achievement
          - Rising star
          - Community service
          - Safety award
          - Other
        required: true
      - id: 6
        name: suggested_name_1
        label: Suggested Award Name 1
        hint: Your first name suggestion
        type: text
        options: []
        required: true
      - id: 7
        name: name_rationale_1
        label: Rationale for Name 1
        hint: Why did you choose this name
        type: text
        options: []
        required: true
      - id: 8
        name: suggested_name_2
        label: Suggested Award Name 2
        hint: Your second name suggestion
        type: text
        options: []
        required: false
      - id: 9
        name: name_rationale_2
        label: Rationale for Name 2
        hint: Why did you choose this name
        type: text
        options: []
        required: false
      - id: 10
        name: suggested_name_3
        label: Suggested Award Name 3
        hint: Your third name suggestion
        type: text
        options: []
        required: false
      - id: 11
        name: name_rationale_3
        label: Rationale for Name 3
        hint: Why did you choose this name
        type: text
        options: []
        required: false
      - id: 12
        name: naming_inspiration
        label: Naming Inspiration
        hint: What inspired your suggestions
        type: select_one
        options:
          - Company values
          - Industry terminology
          - Historical figure
          - Company founder/leader
          - Nature or symbols
          - Acronym
          - Other
        required: false
      - id: 13
        name: tone_preference
        label: Preferred Tone
        hint: What tone should the name convey
        type: select_one
        options:
          - Formal and prestigious
          - Professional and dignified
          - Modern and innovative
          - Friendly and approachable
          - Inspirational
          - Traditional
        required: true
      - id: 14
        name: should_honor_person
        label: Should Award Honor a Person
        hint: Should the award be named after someone
        type: select_one
        options:
          - "Yes, company founder"
          - "Yes, former leader"
          - "Yes, industry pioneer"
          - "No, keep it generic"
          - Unsure
        required: true
      - id: 15
        name: suggested_honoree
        label: Suggested Honoree
        hint: If yes, who should it honor
        type: text
        options: []
        required: false
      - id: 16
        name: award_criteria_suggestion
        label: Award Criteria Suggestion
        hint: What should recipients be recognized for
        type: text
        options: []
        required: false
      - id: 17
        name: trophy_design_idea
        label: Trophy or Plaque Design Idea
        hint: Any ideas for the physical award
        type: text
        options: []
        required: false
      - id: 18
        name: presentation_timing
        label: When Should Award Be Presented
        hint: Best timing for the ceremony
        type: select_one
        options:
          - Annual gala
          - Quarterly meeting
          - Monthly all-hands
          - Department meeting
          - On achievement
        required: false
      - id: 19
        name: prize_suggestion
        label: Prize or Benefit Suggestion
        hint: What should winners receive
        type: text
        options: []
        required: false
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other thoughts about this award
        type: text
        options: []
        required: false
