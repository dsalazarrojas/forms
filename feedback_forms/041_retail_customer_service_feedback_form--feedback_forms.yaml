inputSchema:
  type: object
  properties:
    title: Retail Customer Service Feedback Form
    pages:
    - id: 1
      name: customer_service_experience
      label: How was your customer service experience?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: product_satisfaction
      label: How would you rate your experience with our products?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 3
      name: sales_support
      label: How would you rate the sales support you received from our staff?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 4
      name: store_climate
      label: How would you rate the climate of our store?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 5
      name: staff_friendliness
      label: How friendly was our staff?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: product_availability
      label: How was the availability of products during your visit?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: store_location
      label: How easy was it to find our store?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: staff_helpfulness
      label: How helpful was our staff during your visit?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: overall_satisfaction
      label: Overall, how satisfied are you with your shopping experience?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: additional_comments
      label: Any additional comments?
      hint: null
      type: text
      options: []
      required: false
