      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: role
      label: Role
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: course_facilitator
      label: Course facilitator name
      hint: null
      type: text
      options: []
      required: false
