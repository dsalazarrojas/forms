inputSchema:
  type: object
  properties:
    title: Learning Facilitator Feedback Form
    pages:
    - id: 1
      name: introduction
      label: What is your role as a learning facilitator?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_on_conducting
      label: How would you rate your overall experience conducting this course?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: feedback_on_content
      label: How would you rate the course content?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: feedback_on_facilitator
      label: How would you rate the facilitator?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: feedback_on_facilitator
      label: How would you rate the facilitator?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: comments
