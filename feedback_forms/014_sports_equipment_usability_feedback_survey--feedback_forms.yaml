inputSchema:
  type: object
  properties:
    title: Sports Equipment Usability Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: section_1
      label: General Feedback
      hint: Please share your overall thoughts about the sports equipment.
      type: text
      options: []
      required: false
    - id: 3
      name: section_2
      label: Ease of Use
      hint: How easy was it to use the equipment?
      type: select_one
      options:
      - Very Easy
      - Somewhat Easy
      - Neutral
      - Somewhat Hard
      - Very Hard
      required: true
    - id: 4
      name: section_3
      label: Comfort
      hint: How comfortable did you find the equipment?
      type: select_one
      options:
      - Very Comfortable
      - Somewhat Comfortable
      - Neutral
      - Somewhat Uncomfortable
      - Very Uncomfortable
      required: true
    - id: 5
      name: section_4
      label: Quality
      hint: How would you rate the quality of the equipment?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: section_5
      label: Recommendation
      hint: How likely are you to recommend the equipment to others?
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Neutral
      - Somewhat Unlikely
      - Very Unlikely
      required: true
    - id: 7
      name: section_6
      label: Demographics
      hint: Please answer the following questions about yourself.
      type: text
      options: []
      required: false
    - id: 8
      name: section_8
      label: Additional Comments
      hint: Do you have any additional comments or suggestions?
      type: text
      options: []
      required: false
