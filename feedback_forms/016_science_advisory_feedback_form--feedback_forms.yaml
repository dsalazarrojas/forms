      name: research_group_name
      label: Research Group Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: assigned_researcher_name
      label: Assigned Researcher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: session_location
      label: Session Location
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: session_duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: false
