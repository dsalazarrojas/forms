inputSchema:
  type: object
  properties:
    title: Science Advisory Feedback Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: session_id
      label: Session ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_session
      label: Date of Session
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: session_goals
      label: Session Goals
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: session_objectives
      label: Session Objectives
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: session_attendance
      label: Session Attendance
      hint: null
      type: select_one
      options:
      - 1-5
      - 6-10
      - 11-15
      - 16-20
      - 21-25
      - 26 or more
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_multiple
      options:
      - Not Satisfied
      - Somewhat Satisfied
      - Very Satisfied
      - Extremely Satisfied
      required: false
    - id: 9
      name: feedback
      label: Feedback
      hint: null
