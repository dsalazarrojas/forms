inputSchema:
  type: object
  properties:
    title: Collaboration Preferences Survey
    pages:
      - id: 1
        name: respondent_name
        label: Full Name
        hint: Optional - your name
        type: text
        options: []
        required: false
      - id: 2
        name: email
        label: Email Address
        hint: For follow-up if needed
        type: email
        options: []
        required: false
      - id: 3
        name: department
        label: Department
        hint: Your department
        type: text
        options: []
        required: true
      - id: 4
        name: job_title
        label: Job Title
        hint: Your position
        type: text
        options: []
        required: true
      - id: 5
        name: years_experience
        label: Years of Professional Experience
        hint: Total work experience
        type: select_one
        options:
          - Less than 1 year
          - 1-3 years
          - 3-5 years
          - 5-10 years
          - 10-15 years
          - Over 15 years
        required: true
      - id: 6
        name: work_arrangement
        label: Current Work Arrangement
        hint: How do you work
        type: select_one
        options:
          - Fully Remote
          - Mostly Remote
          - Hybrid
          - Mostly On-Site
          - Fully On-Site
        required: true
      - id: 7
        name: preferred_communication_method
        label: Preferred Communication Method
        hint: How do you prefer to communicate
        type: select_one
        options:
          - Email
          - Instant Messaging
          - Video Calls
          - Phone Calls
          - In-Person Meetings
          - Written Documents
        required: true
      - id: 8
        name: communication_methods_used
        label: Communication Methods You Use Regularly
        hint: Select all that apply
        type: select_multiple
        options:
          - Email
          - Slack
          - Microsoft Teams
          - Zoom
          - Google Meet
          - Phone
          - In-Person
          - Project Management Tools
          - Shared Documents
        required: true
      - id: 9
        name: meeting_preference
        label: Meeting Preference
        hint: How do you prefer meetings
        type: select_one
        options:
          - Video Preferred
          - Audio Only Preferred
          - In-Person Preferred
          - No Preference
          - Prefer No Meetings
        required: true
      - id: 10
        name: meeting_frequency
        label: Ideal Meeting Frequency
        hint: How often for team meetings
        type: select_one
        options:
          - Daily
          - 2-3 Times Per Week
          - Weekly
          - Bi-Weekly
          - Monthly
          - As Needed Only
        required: true
      - id: 11
        name: meeting_duration
