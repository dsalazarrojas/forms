          - Communication Barriers
          - Tool Overload
          - Too Many Meetings
          - Lack of Clear Goals
          - Unclear Roles
          - Insufficient Feedback
          - Technology Issues
          - Work-Life Balance
          - None
        required: true
      - id: 23
        name: collaboration_strengths
        label: Your Collaboration Strengths
        hint: Select all that apply
        type: select_multiple
        options:
          - Active Listening
          - Clear Communication
          - Reliability
          - Flexibility
          - Problem Solving
          - Empathy
          - Leadership
          - Technical Expertise
          - Organization
          - Creativity
        required: true
      - id: 24
        name: improvement_suggestions
        label: Suggestions for Improving Collaboration
        hint: What would help
        type: text
        options: []
        required: false
      - id: 25
        name: training_interest
        label: Collaboration Training Interest
        hint: Would you like training
        type: select_one
        options:
          - Yes Very Interested
          - Somewhat Interested
          - Not Interested
          - Already Trained
        required: true
      - id: 26
        name: additional_comments
        label: Additional Comments
        hint: Any other thoughts
        type: text
        options: []
        required: false
