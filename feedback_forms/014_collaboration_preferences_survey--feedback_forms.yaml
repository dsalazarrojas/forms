          - Microsoft 365
          - Slack
          - Microsoft Teams
          - Asana
          - Trello
          - Jira
          - Monday.com
          - Notion
          - Confluence
          - SharePoint
          - Other
        required: true
      - id: 13
        name: tool_satisfaction
