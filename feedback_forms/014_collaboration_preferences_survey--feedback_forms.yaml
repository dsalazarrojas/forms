          - Standard 9AM-5PM
          - Afternoon 12PM-8PM
          - Evening 2PM-10PM
          - Flexible Hours
          - Irregular Schedule
        required: true
      - id: 21
        name: response_time_expectation
        label: Expected Response Time
        hint: How quickly should people respond
        type: select_one
        options:
          - Immediate
          - Within 1 Hour
          - Within 4 Hours
          - Within 24 Hours
          - Within 48 Hours
          - No Urgency
        required: true
      - id: 22
        name: collaboration_challenges
        label: Collaboration Challenges You Face
        hint: Select all that apply
        type: select_multiple
        options:
