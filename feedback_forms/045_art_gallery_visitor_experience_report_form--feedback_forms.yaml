inputSchema:
  type: object
  properties:
    title: Art Gallery Visitor Experience Report Form
    pages:
    - id: 1
      name: visitor_name
      label: Visitor name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: visit_date
      label: Visit date
      hint: Date of visit
      type: date
      options: []
      required: true
    - id: 3
      name: overall_rating
      label: Overall rating
      hint: Rate your visitor experience
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: exhibits_rating
      label: Exhibits rating
      hint: Quality of exhibits
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: staff_service
      label: Staff service
      hint: Helpfulness and friendliness
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: facilities
      label: Facilities
      hint: Cleanliness and amenities
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: value_for_money
      label: Value for money
      hint: Ticket price compared to experience
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: recommend_to_others
      label: Recommend to others
      hint: Would you recommend this gallery
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: suggestions
      label: Suggestions
      hint: How can we improve
      type: text
      options: []
      required: false
    - id: 10
      name: contact_for_follow_up
      label: Contact for follow up
      hint: Provide email if you want a response
      type: email
      options: []
      required: false
