inputSchema:
  type: object
  properties:
    title: Meeting Assistant Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 8
      name: meeting_attendees
      label: Meeting Attendees
      hint: null
      type: select_multiple
      options:
      - Alice
      - Bob
      - Charlie
      required: false
