inputSchema:
  type: object
  properties:
    title: Student Leadership Teacher Evaluation Form
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: demonstrates_initiative
      label: Demonstrates
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      required: true
    - id: 4
      name: leads_others
      label: Leads
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      - Not at all
      required: true
    - id: 5
      name: takes_responsibility
      label: Takes
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      required: true
    - id: 6
      name: comments_on_student
      label: Comments on Student
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: teacher_comments
      label: Comments on Teacher
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: student_leadership_trend
      label: Student Leadership Trend
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: comments_on_teacher
      label: Comments on Teacher (2)
      hint: null
      type: note
      options: []
      required: false
