inputSchema:
  type: object
  properties:
    title: Pre Experience Feedback Survey
    pages:
    - id: 1
      name: participant_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_how_heard
      label: How did you hear about this event?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participant_rating
      label: How would you rate this event?
      hint: Rate from 1 to 5
      type: number
      options: []
      required: false
    - id: 4
      name: participant_favorite_part
      label: What was your favorite part of the event?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: participant_event_rating
      label: How would you rate the event organization?
      hint: Rate from 1 to 5
      type: number
      options: []
      required: false
    - id: 6
      name: participant_background
      label: What is your background in relation to this field/event?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: participant_experience_length
      label: How long have you been working/practicing in this field?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: participant_motive
      label: What motivated you to participate in this event?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: participant_experience
      label: Do you have any experience in events similar to this one?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: participant_experience_other
      label: If you don't have experience in events similar to this one, can you describe
        your experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: participant_expectations
      label: What were your expectations for this event?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: participant_expectations_other
      label: If you don't have any expectations, please describe why?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: participant_expectations_met
      label: How were your expectations met?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: participant_suggestion
      label: Do you have any suggestions for improvement?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: event_organizer_background
      label: What was your background in relation to the event organization?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: participant_additional_info
      label: Is there anything you'd like to add or comment about your experience?
      hint: null
      type: text
      options: []
      required: false
