inputSchema:
  type: object
  properties:
    title: Galvanizing Process Feedback
    pages:
    - id: 1
      name: galvanizing_process_feedback
      label: Galvanizing Process Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: issue_encountered
      label: Issues Encountered
      hint: List any issues that occurred during the galvanizing process.
      type: select_multiple
      options:
      - Issue 1
      - Issue 2
      - Issue 3
      required: false
    - id: 3
      name: satisfaction
      label: Satisfaction
      hint: Rate your satisfaction after each galvanizing process run.
      type: number
      options: []
      required: false
    - id: 4
      name: process_comments
      label: Process Comments
      hint: Add any additional comments about the galvanizing process.
      type: text
      options: []
      required: false
    - id: 5
      name: galvanizing_process_satisfaction
      label: Galvanizing Process Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: production_time
      label: Production Time
      hint: Enter the production time for the galvanizing process.
      type: number
      options: []
      required: false
    - id: 7
      name: production_cost
      label: Production Cost
      hint: Enter the production cost for the galvanizing process.
      type: number
      options: []
      required: false
    - id: 8
      name: production_date
      label: Production Date
      hint: Enter the production date for the galvanizing process.
      type: date
      options: []
      required: false
    - id: 9
      name: galvanizing_machine_operator
      label: Galvanizing Machine Operator
      hint: Identify the operator of the galvanizing machine.
      type: select_one
      options:
      - Operator 1
      - Operator 2
      - Operator 3
      required: false
    - id: 10
      name: galvanizing_maintenace_procedures_followed
      label: Galvanizing Maintainance Procedures Followed
      hint: List any maintenance procedures followed during the galvanizing process.
      type: select_multiple
      options:
      - Procedure 1
      - Procedure 2
      - Procedure 3
      required: false
    - id: 11
      name: customer_comments
      label: Customer Comments
      hint: Add any additional comments from the customer.
      type: text
      options: []
      required: false
    - id: 12
      name: customer_contact
      label: Customer Contact
      hint: Enter the customer contact information.
      type: text
      options: []
      required: false
    - id: 13
      name: galvanizing_machine_type
      label: Galvanizing Machine Type
      hint: Identify the type of galvanizing machine used.
      type: select_one
      options:
      - Machine 1
      - Machine 2
      - Machine 3
      required: false
    - id: 14
      name: galvanizing_machine_model
      label: Galvanizing Machine Model
      hint: Identify the model number of the galvanizing machine.
      type: text
      options: []
      required: false
    - id: 15
      name: issue_reopened
      label: Issue Reopened
      hint: Was the issue reopened after being closed?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 16
      name: galvanizing_process_run_date
      label: Galvanizing Process Run Date
      hint: Enter the date the galvanizing process was run.
      type: date
      options: []
      required: false
    - id: 17
      name: galvanizing_process_run_time
      label: Galvanizing Process Run Time
      hint: Enter the time the galvanizing process was run.
      type: time
      options: []
      required: false
    - id: 18
      name: galvanizing_machine_hours_run
      label: Galvanizing Machine Hours Run
      hint: Enter the hours run on the galvanizing machine.
      type: number
      options: []
      required: false
    - id: 19
      name: galvanizing_process_run_by
      label: Galvanizing Process Run By
      hint: Identify who ran the galvanizing process.
      type: select_one
      options:
      - Person 1
      - Person 2
      - Person 3
      required: false
    - id: 20
      name: galvanizing_process_savings
      label: Galvanizing Process Savings
      hint: Enter any cost savings from the galvanizing process.
      type: number
      options: []
      required: false
    - id: 21
      name: galvanizing_process_cost
      label: Galvanizing Process Cost
      hint: Enter the cost of the galvanizing process.
      type: number
      options: []
      required: false
    - id: 22
      name: galvanizing_process_yield
      label: Galvanizing Process Yield
      hint: Enter the yield of the galvanizing process.
      type: number
      options: []
      required: false
    - id: 23
      name: galvanizing_machine_capacity
      label: Galvanizing Machine Capacity
      hint: Identify the capacity of the galvanizing machine.
      type: text
      options: []
      required: false
    - id: 24
      name: galvanizing_process_notes
      label: Galvanizing Process Notes
      hint: Add any additional notes about the galvanizing process.
      type: text
      options: []
      required: false
    - id: 25
      name: galvanizing_process_completed
      label: Galvanizing Process Completed
      hint: Was the galvanizing process completed successfully?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
