inputSchema:
  type: object
  properties:
    title: Contact Form Treehouse Theme
    pages:
      - id: 1
        name: header
        label: -- Feedback Form --
        hint: Use this form to share feedback or report issues
        type: note
        options: []
        required: false
      - id: 2
        name: user_name
        label: Name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email address
        hint: Contact email for reply
        type: email
        options: []
        required: true
      - id: 4
        name: subject
        label: Subject
        hint: Short summary of your message
        type: text
        options: []
        required: true
      - id: 5
        name: message
        label: Message
        hint: Provide detailed feedback or questions
        type: text
        options: []
        required: true
      - id: 6
        name: urgency
        label: Urgency level
        hint: Optional indicator of urgency
        type: select_one
        options:
          - Low
          - Medium
          - High
        required: false
      - id: 7
        name: attach_files_note
        label: Attach files via email if needed
        hint: Use email for images or large attachments
        type: note
        options: []
        required: false
      - id: 8
        name: additional_comments
        label: Additional comments
        hint: Any other context to help our team
        type: text
        options: []
        required: false
