inputSchema:
  type: object
  properties:
    title: lash_artist_skill_perception_survey
    pages:
    - id: 1
      name: lash_artist_survey_1
      label: How would you rate your overall skill level?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 2
      name: lash_artist_survey_2
      label: How often do you perform lash applications?
      hint: null
      type: select_one
      options:
      - Every day
      - Several times a week
      - Rarely
      required: false
    - id: 3
      name: lash_artist_survey_3
      label: How many years have you been doing lash work?
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - More than 2 years
      required: false
    - id: 4
      name: lash_artist_survey_4
      label: What type of lash application technique do you use?
      hint: null
      type: select_multiple
      options:
      - Traditional lash curl
      - Hand drawn lash curl
      - Machine lash
      required: false
    - id: 5
      name: lash_artist_survey_5
      label: Which type of product do you usually work with?
      hint: null
      type: select_one
      options:
      - Mega volume lashes
      - Individual lashes
      required: false
    - id: 6
      name: lash_artist_survey_6
      label: Do you have any formal education or training in lash art?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: lash_artist_survey_7
      label: How many clients do you have per week?
      hint: null
      type: select_one
      options:
      - Less than 10
      - 10-20
      - More than 20
      required: false
    - id: 8
      name: lash_artist_survey_8
      label: Average client session duration (in minutes)?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: lash_artist_survey_9
      label: Do you have any certifications or diplomas?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: lash_artist_survey_10
      label: Do you have any other hobbies?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: lash_artist_survey_11
      label: Do you have any other work experience in the beauty industry?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: lash_artist_survey_12
      label: How do you rate your overall satisfaction level?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 13
      name: lash_artist_survey_13
      label: What is your average session price?
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: lash_artist_survey_14
      label: Would you like to receive more feedback surveys?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
