inputSchema:
  type: object
  properties:
    title: Workspace Login Experience Survey
    pages:
    - id: 1
      name: login_frequency
      label: Frequency of login
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: devices_used
      label: Devices used for login
      hint: null
      type: select_multiple
      options:
      - Laptop
      - Tablet
      - Desktop
      - Smartphone
      - Other
      required: false
    - id: 3
      name: browsers_used
      label: Browsers used for login
      hint: null
      type: select_one
      options:
      - Chrome
      - Firefox
      - Edge
      - Safari
      - Other
      required: false
    - id: 4
      name: issues_encountered
      label: Issues encountered during login
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: satisfaction_score
      label: Satisfaction score
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: satisfaction_comment
      label: Satisfaction comment
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: login_device_satisfaction
      label: Satisfaction with device used for login
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 8
      name: login_browser_satisfaction
      label: Satisfaction with browser used for login
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
