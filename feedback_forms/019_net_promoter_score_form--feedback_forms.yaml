inputSchema:
  type: object
  properties:
    title: Net Promoter Score Form
    pages:
    - id: 1
      name: net_promoter_score
      label: How likely are you to recommend our company?
      hint: null
      type: select_one
      options:
      - 1 - Not at all likely
      - 2 - Not likely
      - 3 - Neutral
      - 4 - Likely
      - 5 - Very likely
      required: false
    - id: 2
      name: why_no_recommendation
      label: Why would you not recommend our company?
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: how_likely_recommend
      label: How likely are you to refer a friend or family member to our company?
      hint: null
      type: select_multiple
      options:
      - 1 - 0
      - 2 - 1
      - 3 - 2
      - 4 - 3
      - 5 - 4
      - 6 - 5
      required: false
    - id: 4
      name: comments
      label: Any additional comments?
      hint: null
      type: note
      options: []
      required: false
