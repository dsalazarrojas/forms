inputSchema:
  type: object
  properties:
    title: Streaming Support Feedback Form
    pages:
    - id: 1
      name: user_name
      label: username
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: feedback_message
      label: feedback_message
      hint: What is your feedback?
      type: text
      options: []
      required: false
    - id: 4
      name: streaming_quality
      label: streaming_quality
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: support_agent
      label: support_agent
      hint: null
      type: select_one
      options:
      - Chat Jimmy
      - Not Selected
      required: false
    - id: 6
      name: support_time
      label: support_time
      hint: When did you have your support interaction?
      type: date
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: additional_comments
      hint: Is there anything else you would like to add?
      type: text
      options: []
      required: false
    - id: 8
      name: streaming_support_feedback_form_additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
