inputSchema:
  type: object
  properties:
    title: Landscape Customer Satisfaction Survey
    pages:
    - id: 1
      name: customer_overall_experience
      label: Customer Overall Experience
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: landscaping_services
      label: Landscaping Services
      hint: null
      type: select_multiple
      options:
      - Cutting Lawn Mowers
      - Trimming Trees
      - Pruning Bushes
      - Planting Flowers
      - Fertilizing Soil
      - Pest Control
      required: true
    - id: 3
      name: communication_with_technician
      label: Communication with Technician
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: customer_service
      label: Customer Service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: technician_attitude
      label: Technician Attitude
      hint: null
      type: select_multiple
      options:
      - Friendly
      - Helpful
      - Professional
      - Knowledgeable
      - Courteous
      required: false
    - id: 6
      name: technician_knowledge
      label: Technician Knowledge
      hint: null
      type: select_multiple
      options:
      - Good
      - Excellent
      - Fair
      - Poor
      required: false
    - id: 7
      name: technician_workmanship
      label: Technician Workmanship
      hint: null
      type: select_multiple
      options:
      - Good
      - Excellent
      - Fair
      - Poor
      required: false
    - id: 8
      name: customer_information
      label: Customer Information
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
