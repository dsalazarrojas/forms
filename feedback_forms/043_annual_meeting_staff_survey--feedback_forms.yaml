inputSchema:
  type: object
  properties:
    title: Annual Meeting Staff Survey
    pages:
    - id: 1
      name: staff_name
      label: Full Name
      hint: Optional - can be anonymous
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email Address
      hint: Optional
      type: email
      options: []
      required: false
    - id: 3
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Human Resources
      - Finance
      - Operations
      - Marketing
      - Sales
      - IT
      - Engineering
      - Customer Service
      - Legal
      - Executive
      - Other
      - Prefer Not to Say
      required: false
    - id: 4
      name: position_level
      label: Position Level
      hint: Your level
      type: select_one
      options:
      - Entry Level
      - Mid-Level
      - Senior
      - Manager
      - Director
      - Executive
      - Other
      required: false
    - id: 5
      name: meeting_year
      label: Meeting Year
      hint: Which meeting?
      type: select_one
      options:
      - '2026'
      - '2025'
      - '2024'
      - '2023'
      required: true
    - id: 6
      name: attendance_type
      label: Attendance Type
      hint: How did you attend?
      type: select_one
      options:
      - In Person
      - Virtual
      - Hybrid
      required: true
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate the meeting
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: meeting_content
      label: Meeting Content Quality
      hint: Rate the content
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 9
      name: presentation_quality
      label: Presentation Quality
      hint: Rate presentations
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 10
      name: speaker_effectiveness
      label: Speaker Effectiveness
      hint: Rate speakers
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 11
      name: relevance_to_role
      label: Relevance to Your Role
      hint: How relevant?
      type: select_one
      options:
      - Very Relevant
      - Relevant
      - Somewhat Relevant
      - Not Very Relevant
      - Not Relevant
      required: true
    - id: 12
      name: information_clarity
      label: Information Clarity
      hint: How clear?
      type: select_one
      options:
      - Very Clear
      - Clear
      - Somewhat Clear
      - Unclear
      - Very Unclear
      required: true
    - id: 13
      name: meeting_length
      label: Meeting Length
      hint: Was it appropriate?
      type: select_one
      options:
      - Too Long
      - Just Right
      - Too Short
      required: true
    - id: 14
      name: pacing
      label: Pacing
      hint: Rate the pace
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 15
      name: q_and_a_sessions
      label: Q and A Sessions
      hint: Were they helpful?
      type: select_one
      options:
      - Very Helpful
      - Helpful
      - Neutral
      - Not Helpful
      - Did Not Attend
      required: false
    - id: 16
      name: networking_opportunities
      label: Networking Opportunities
      hint: Rate networking
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      - Not Applicable
      required: false
    - id: 17
      name: technology_platform
      label: Technology Platform
      hint: Rate the platform
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      - Not Applicable
      required: false
    - id: 18
      name: materials_provided
      label: Materials Provided
      hint: Were they useful?
      type: select_one
      options:
      - Very Useful
      - Useful
      - Neutral
      - Not Useful
      - Not Provided
      required: false
    - id: 19
      name: key_takeaways
      label: Key Takeaways
      hint: What did you learn?
      type: text
      options: []
      required: false
    - id: 20
      name: most_valuable_session
      label: Most Valuable Session
      hint: Which was best?
      type: text
      options: []
      required: false
    - id: 21
      name: least_valuable_session
      label: Least Valuable Session
      hint: Which needs improvement?
      type: text
      options: []
      required: false
    - id: 22
      name: topics_for_future
      label: Topics for Future Meetings
      hint: What to cover next?
      type: text
      options: []
      required: false
    - id: 23
      name: likelihood_to_recommend
      label: Likelihood to Recommend
      hint: Would you recommend?
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 24
      name: suggestions_for_improvement
      label: Suggestions for Improvement
      hint: What could be better?
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
