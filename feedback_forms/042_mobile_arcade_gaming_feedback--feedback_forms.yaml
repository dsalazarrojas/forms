inputSchema:
  type: object
  properties:
    title: Mobile Arcade Gaming Feedback
    pages:
    - id: 1
      name: how_often_do_you_play
      label: How often do you play?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 2
      name: favorite_title
      label: Favorite Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: feature_ideas
      label: Feature Ideas
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: how_much_time_do_you_play
      label: How much time do you play?
      hint: null
      type: select_multiple
      options:
      - 1-2 hours
      - 2-4 hours
      - 4-6 hours
      - More than 6 hours
      required: true
    - id: 5
      name: favorite_genre
      label: Favorite Genre
      hint: null
      type: select_multiple
      options:
      - Action
      - Role Playing
      - Strategy
      - Sports
      - Simulation
      required: true
    - id: 6
      name: favorite_platform
      label: Favorite Platform
      hint: null
      type: select_multiple
      options:
      - Console
      - Mobile
      - PC
      - Handheld
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: experience
      label: How would you rate your experience with mobile arcade games?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: play_time_next_month
      label: How often do you think you will play next month?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 10
      name: favorite_type
      label: Favorite type of game?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
