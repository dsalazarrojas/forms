inputSchema:
  type: object
  properties:
    title: Contact Form Notepad Theme
    pages:
    - id: 1
      name: header_note
      label: -- Feedback and Contact --
      hint: Friendly feedback form for website visitors
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_name
      label: Your name
      hint: Name you prefer to be addressed by
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: We will use this to respond
      type: email
      options: []
      required: true
    - id: 4
      name: topic
      label: Topic of feedback
      hint: Short topic line
      type: text
      options: []
      required: true
    - id: 5
      name: feedback_type
      label: Feedback type
      hint: Choose the category that best fits your message
      type: select_one
      options:
      - Website
      - Product
      - Service
      - Other
      required: true
    - id: 6
      name: message
      label: Message
      hint: Describe your feedback in detail
      type: text
      options: []
      required: true
    - id: 7
      name: allow_publication
      label: Permission to publish feedback
      hint: We may use anonymized feedback for marketing
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: preferred_response
      label: Preferred response method
      hint: How would you like us to reply
      type: select_one
      options:
      - Email
      - Phone
      - No response needed
      required: false
    - id: 9
      name: additional_notes
      label: Additional notes
      hint: Any extra context to help our team
      type: text
      options: []
      required: false
