inputSchema:
  type: object
  properties:
    title: Virtual Launch Event Feedback Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: event_success
      label: Event Success
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: attendees_experience
      label: Attendees Experience
      hint: null
      type: select_one
      options:
      - Very Good
      - Average
      - Poor
      required: true
    - id: 9
      name: areas_for_improvement
      label: Areas For Improvement
      hint: null
      type: select_multiple
      options:
      - Time Management
      - Content Quality
      - Registration Flow
      required: false
    - id: 10
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very High
      - High
      - Neutral
      - Low
      - Very Low
      required: true
