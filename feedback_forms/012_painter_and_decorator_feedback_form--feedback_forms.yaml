      options:
      - male
      - female
      - non binary
      required: true
    - id: 13
      name: form_13
      label: staff_wore_gloves
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: form_14
      label: staff_wore_mask
      hint: null
      type: select_multiple
      options:
