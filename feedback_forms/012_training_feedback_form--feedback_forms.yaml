inputSchema:
  type: object
  properties:
    title: Training Feedback Form
    pages:
    - id: 1
      name: training_feedback
      label: Training Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: training_facilitator
      label: Training Facilitator
      hint: null
      type: select_one
      options:
      - Facilitator1
      - Facilitator2
      - Facilitator3
      - Facilitator4
      required: false
    - id: 5
      name: training_session
      label: Training Session
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
