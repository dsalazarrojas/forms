inputSchema:
  type: object
  properties:
    title: Connector Feedback Survey
    pages:
      - id: 1
        name: survey_date
        label: Survey Date
        hint: Date of feedback submission
        type: date
        options: []
        required: true
      - id: 2
        name: respondent_name
        label: Your Name
        hint: Optional - may remain anonymous
        type: text
        options: []
        required: false
      - id: 3
        name: respondent_email
        label: Email Address
        hint: For follow-up if needed
        type: email
        options: []
        required: false
      - id: 4
        name: organization
        label: Organization
        hint: Your company or organization
        type: text
        options: []
        required: false
      - id: 5
        name: connector_name
        label: Connector Name
        hint: Which connector are you providing feedback on
        type: text
        options: []
        required: true
      - id: 6
        name: connector_version
        label: Connector Version
        hint: Version number if known
        type: text
        options: []
        required: false
      - id: 7
        name: usage_duration
        label: How Long Have You Used This Connector
        hint: Duration of usage
        type: select_one
        options:
          - Less than 1 month
          - 1 to 3 months
          - 3 to 6 months
          - 6 to 12 months
          - More than 1 year
        required: true
      - id: 8
        name: usage_frequency
        label: How Often Do You Use This Connector
        hint: Frequency of use
        type: select_one
        options:
          - Daily
          - Weekly
          - Monthly
          - Occasionally
          - Rarely
        required: true
      - id: 9
        name: use_case
        label: Primary Use Case
        hint: How do you primarily use this connector
        type: select_one
        options:
          - Data Integration
          - API Connection
          - Data Migration
          - Real-time Sync
          - Batch Processing
          - Testing or Development
          - Other
        required: true
      - id: 10
        name: ease_of_setup
        label: Ease of Initial Setup
        hint: How easy was it to set up
        type: select_one
        options:
          - Very Easy
          - Easy
          - Neutral
          - Difficult
          - Very Difficult
        required: true
      - id: 11
        name: ease_of_use
        label: Ease of Use
        hint: How easy is it to use daily
        type: select_one
        options:
          - Very Easy
          - Easy
          - Neutral
          - Difficult
          - Very Difficult
        required: true
      - id: 12
        name: reliability
        label: Reliability Rating
        hint: How reliable is the connector
        type: select_one
        options:
          - Excellent - No Issues
          - Good - Rare Issues
          - Fair - Occasional Issues
          - Poor - Frequent Issues
          - Very Poor - Constant Issues
        required: true
      - id: 13
        name: performance
        label: Performance Rating
        hint: How is the speed and performance
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very Poor
        required: true
      - id: 14
        name: documentation_quality
        label: Quality of Documentation
        hint: How helpful is the documentation
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very Poor
          - Did Not Use
        required: true
      - id: 15
        name: support_experience
        label: Support Experience
        hint: Quality of technical support
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very Poor
          - Did Not Contact Support
        required: true
      - id: 16
        name: features_satisfaction
        label: Satisfaction with Features
        hint: How satisfied with available features
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 17
        name: missing_features
        label: Missing Features
        hint: What features would you like to see
        type: text
        options: []
        required: false
      - id: 18
        name: issues_encountered
        label: Issues Encountered
        hint: Describe any problems you experienced
        type: text
        options: []
        required: false
      - id: 19
        name: issue_frequency
        label: How Often Do Issues Occur
        hint: Frequency of problems
        type: select_one
        options:
          - Never
          - Rarely
          - Sometimes
          - Often
          - Very Often
        required: true
      - id: 20
        name: issue_resolution
        label: How Well Are Issues Resolved
        hint: Effectiveness of issue resolution
        type: select_one
        options:
          - Always Resolved
          - Usually Resolved
          - Sometimes Resolved
          - Rarely Resolved
          - Never Resolved
          - No Issues Experienced
        required: true
      - id: 21
        name: integration_quality
        label: Quality of Integration
        hint: How well does it integrate with your systems
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very Poor
        required: true
      - id: 22
        name: value_for_cost
        label: Value for Cost
        hint: Is the connector worth the price
        type: select_one
        options:
          - Excellent Value
          - Good Value
          - Fair Value
          - Poor Value
          - Not Applicable - Free
        required: true
      - id: 23
        name: would_recommend
        label: Would You Recommend This Connector
        hint: Likelihood of recommending to others
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Neutral
          - Probably No
          - Definitely No
        required: true
      - id: 24
        name: improvements_suggested
        label: Suggested Improvements
        hint: How can we improve this connector
        type: text
        options: []
        required: false
      - id: 25
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
