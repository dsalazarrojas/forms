inputSchema:
  type: object
  properties:
    title: Hotel Guest Review Report Form
    pages:
    - id: 1
      name: stay_date
      label: Stay Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: rating
      label: Rating
      hint: Select a rating between 1-5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 3
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall satisfaction with this stay
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: checkin_check_out
      label: Checkin/Check out
      hint: Checkin Date - Check out Date
      type: text
      options: []
      required: false
    - id: 5
      name: room_quality
      label: Room Quality
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: cleanliness
      label: Cleanliness
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: value_for_money
      label: Value For Money
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: service
      label: Service
      hint: Front desk staff, concierge, housekeeping, etc.
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: food_and_beverage
      label: Food and Beverage
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 10
      name: location
      label: Location
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 11
      name: overall_recommendation
      label: Overall Recommendation
      hint: Would you recommend this hotel?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
