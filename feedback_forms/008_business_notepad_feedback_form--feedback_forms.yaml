inputSchema:
  type: object
  properties:
    title: Business Notepad Feedback Form
    pages:
    - id: 1
      name: section_feedback_intro
      label: -- Your Feedback Matters --
      type: note
      required: false
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Optional - helps us follow up with you
      type: text
      required: false
    - id: 3
      name: respondent_email
      label: Email Address
      hint: If you would like us to follow up
      type: email
      required: false
    - id: 4
      name: respondent_department
      label: Your Department
      hint: Which team are you part of
      type: text
      required: false
    - id: 5
      name: section_satisfaction
      label: -- Satisfaction Rating --
      type: note
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction Level
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Dissatisfied
      - Dissatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 7
      name: product_quality
      label: Quality of Our Product - Service
      hint: How would you rate quality
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 8
      name: customer_service
      label: Customer Service Quality
      hint: Rate our support and responsiveness
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 9
      name: value_for_money
      label: Value for Money
      hint: Does our offering provide good value
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 10
      name: section_feedback
      label: -- Detailed Feedback --
      type: note
      required: false
    - id: 11
      name: what_went_well
      label: What Went Well
      hint: What did we do right
      type: text
      required: false
    - id: 12
      name: what_needs_improvement
      label: What Needs Improvement
      hint: What could we do better
      type: text
      required: false
    - id: 13
      name: specific_issues
      label: Did You Experience Any Specific Issues
      hint: Describe any problems encountered
      type: text
      required: false
    - id: 14
      name: section_recommendations
      label: -- Recommendations --
      type: note
      required: false
    - id: 15
      name: likelihood_recommend
      label: How Likely Are You to Recommend Us
      hint: On a scale of 1-10, with 10 being most likely
      type: number
      required: false
    - id: 16
      name: feature_requests
      label: Requested Features or Services
      hint: What would you like us to offer
      type: text
      required: false
    - id: 17
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback you would like to share
      type: text
      required: false
    - id: 18
      name: followup_permission
      label: May We Follow Up With You
      hint: Can we contact you regarding this feedback
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
