inputSchema:
  type: object
  properties:
    title: UX Design User Experience Information Collection Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: select_multiple
      options:
      - Select multiple options
      - Other
      required: false
    - id: 2
      name: satisfaction_rating
      label: Satisfaction Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: usability_rating
      label: Usability Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: user_habits
      label: User Habits
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: product_team_priority
      label: Product Team Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: user_feedback
      label: User Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: product_improvements
      label: Product Improvements
      hint: null
      type: select_multiple
      options:
      - Select multiple options
      - Other
      required: false
    - id: 8
      name: user_satisfaction
      label: User Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
