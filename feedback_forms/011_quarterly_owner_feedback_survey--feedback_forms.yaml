inputSchema:
  type: object
  properties:
    title: Quarterly Owner Feedback Survey
    pages:
    - id: 1
      name: owner_name
      label: Owner Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: property_location
      label: Property Location
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - Apartment
      - House
      - Townhouse
      - Commercial Property
      - Land
      - Condo
      - Office
      required: true
    - id: 5
      name: feedback
      label: What would you like to feedback about the property
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: satisfaction
      label: How satisfied are you with our service
      hint: null
      type: select_multiple
      options:
      - Not Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Disatisfied
      - Satisfied
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: follow_up
      label: Follow-up date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: Time of Visit
      hint: null
      type: time
      options: []
      required: true
