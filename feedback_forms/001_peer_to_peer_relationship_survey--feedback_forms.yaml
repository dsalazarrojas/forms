inputSchema:
  type: object
  properties:
    title: Peer To Peer Relationship Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: peer_1_first_name
      label: peers first name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: peer_1_last_name
      label: peers last name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: relationship_duration
      label: relationship duration
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: question1
      label: How often do you think you interact with your peer in a given week?
      hint: null
      type: select_one
      options:
      - Almost Every Day
      - A Few Times a Week
      - Less than Once a Week
      - Never
      required: true
    - id: 6
      name: question2
      label: how do you perceive your peer's behavior
      hint: null
      type: select_multiple
      options:
      - Trustworthy
      - Untrustworthy
      - Somewhat Trustworthy
      - Somewhat Untrustworthy
      required: true
    - id: 7
      name: question3
      label: How do you rate your relationship
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Bad
      required: true
    - id: 8
      name: question4
      label: How would you describe your feelings about your peer
      hint: null
      type: select_multiple
      options:
      - Strongly Positive
      - Somewhat Positive
      - Negative
      - Neutral
      required: true
    - id: 9
      name: question5
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
