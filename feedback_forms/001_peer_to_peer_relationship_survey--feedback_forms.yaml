inputSchema:
  type: object
  properties:
    title: Peer To Peer Relationship Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: peer_1_first_name
      label: peers first name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: peer_1_last_name
      label: peers last name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: relationship_duration
      label: relationship duration
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: question1
      label: How often do you think you interact with your peer in a given week?
      hint: null
      type: select_one
      options:
      - '{''id'': 10, ''label'': ''Almost Every Day''}'
      - '{''id'': 11, ''label'': ''A Few Times a Week''}'
      - '{''id'': 12, ''label'': ''Less than Once a Week''}'
      - '{''id'': 13, ''label'': ''Never''}'
      required: true
    - id: 6
      name: question2
      label: how do you perceive your peer's behavior
      hint: null
      type: select_multiple
      options:
      - '{''id'': 20, ''label'': ''Trustworthy''}'
      - '{''id'': 21, ''label'': ''Untrustworthy''}'
      - '{''id'': 22, ''label'': ''Somewhat Trustworthy''}'
      - '{''id'': 23, ''label'': ''Somewhat Untrustworthy''}'
      required: true
    - id: 7
      name: question3
      label: How do you rate your relationship
      hint: null
      type: select_one
      options:
      - '{''id'': 40, ''label'': ''Excellent''}'
      - '{''id'': 41, ''label'': ''Good''}'
      - '{''id'': 42, ''label'': ''Bad''}'
      required: true
    - id: 8
      name: question4
      label: How would you describe your feelings about your peer
      hint: null
      type: select_multiple
      options:
      - '{''id'': 24, ''label'': ''Strongly Positive''}'
      - '{''id'': 25, ''label'': ''Somewhat Positive''}'
      - '{''id'': 26, ''label'': ''Negative''}'
      - '{''id'': 27, ''label'': ''Neutral''}'
      required: true
    - id: 9
      name: question5
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
