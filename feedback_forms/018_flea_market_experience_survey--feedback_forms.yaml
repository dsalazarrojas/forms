inputSchema:
  type: object
  properties:
    title: Flea Market Experience Survey
    pages:
    - id: 1
      name: visitor_interest
      label: What type of products or services do you like?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: vendor_rating
      label: How would you rate our vendors?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 3
      name: event_experience
      label: How would you rate your experience at this event?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 4
      name: recommendations
      label: Are there any vendors or services you would recommend to others?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: Any comments or feedback?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: vendor_quality
      label: What do you think is the quality of the products or services we offered?
      hint: null
      type: select_multiple
      options:
      - Good
      - Poor
      required: false
    - id: 7
      name: return_visit
