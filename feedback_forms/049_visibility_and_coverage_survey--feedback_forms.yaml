inputSchema:
  type: object
  properties:
    title: Visibility And Coverage Survey
    pages:
    - id: 1
      name: survey_organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question1
      label: What is the purpose of this survey?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: question1_answer
      label: To understand customer needs and preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: question2
      label: How would you rate the visibility of our product/service?
      hint: null
      type: select_one
      options:
      - Not visible
      - Somewhat visible
      - Highly visible
      required: false
    - id: 5
      name: question3
      label: How would you rate the coverage of our product/service?
      hint: null
      type: select_multiple
      options:
      - Not covered
      - Somewhat covered
      - Highly covered
      - Very highly covered
      - Extremely highly covered
      - Completely covered
      required: false
    - id: 6
      name: question4
      label: Have you ever used this product/service before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: feedback
      label: What feedback do you have about our product/service?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: question5
      label: What would you suggest we do next?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: question6
      label: How likely are you to recommend our product/service to a friend?
      hint: null
      type: select_one
      options:
      - Not likely
      - Somewhat likely
      - Highly likely
      - Very likely
      - Extremely likely
      required: false
    - id: 10
      name: question7
      label: How likely are you to use our product/service again?
      hint: null
      type: select_one
      options:
      - Not likely
      - Somewhat likely
      - Highly likely
      - Very likely
      - Extremely likely
      required: false
