inputSchema:
  type: object
  properties:
    title: Seasonal Collection Feedback Poll
    pages:
    - id: 1
      name: latest_lineup
      label: What was your impression of our latest lineup?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: product_interest
      label: Which product are you most interested in?
      hint: null
      type: select_multiple
      options:
      - Product A
      - Product B
      - Product C
      required: true
    - id: 3
      name: product_impression
      label: What is your overall impression of Product A?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 4
      name: product_impression_product_b
      label: What is your overall impression of Product B?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 5
      name: product_impression_product_c
      label: What is your overall impression of Product C?
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 6
      name: seasonality
      label: How seasonal do you find our collection?
      hint: null
      type: select_one
      options:
      - Very seasonal
      - Somewhat seasonal
      - Not very seasonal
      required: true
    - id: 7
      name: future_release
      label: Will you be interested in our future releases?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: contact_info
      label: Would you like to be contacted for future releases?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: contact_message
      label: Message
      hint: null
      type: note
      options: []
      required: false
