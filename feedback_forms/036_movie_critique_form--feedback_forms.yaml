inputSchema:
  type: object
  properties:
    title: movie_critique_form
    pages:
    - id: 1
      name: movie_title
      label: Movie Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reviewer_name
      label: Reviewer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: genre
      label: Genre
      hint: null
      type: select_one
      options:
      - Action
      - Comedy
      - Drama
      - Horror
      - Sci-Fi
      - Romance
      - Thriller
      - Documentary
      required: false
    - id: 5
      name: review
      label: Review
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: enjoyed
      label: What did you enjoy most about the movie?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: disliked
      label: What did you dislike most about the movie?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: recommended
      label: Would you recommend this movie?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 9
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
