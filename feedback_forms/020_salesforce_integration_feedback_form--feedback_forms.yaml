inputSchema:
  type: object
  properties:
    title: salesforce_integration_feedback_form
    pages:
    - id: 1
      name: salesforce_integration
      label: Salesforce Integration
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: feedback_question_1
      label: What do you think about the current integration?
      hint: Your feedback helps us improve the integration!
      type: text
      options: []
      required: false
    - id: 3
      name: feedback_question_2
      label: How can we improve the current integration?
      hint: Your suggestions are valuable, thanks for sharing!
      type: text
      options: []
      required: false
    - id: 4
      name: category
      label: Category
      hint: Select a category that best describes your feedback
      type: select_multiple
      options:
      - bug
      - feature request
      - general
      required: false
