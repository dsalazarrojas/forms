      options:
      - New Features
      - Not Impressed
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 2
      name: feature_name_1
      label: Feature Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: description_1
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: category_1
      label: Category
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating_1
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: comments_1
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: screenshot_1
      label: Screenshot URL
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
