inputSchema:
  type: object
  properties:
    title: Community Outreach Feedback Survey
    pages:
      - id: 1
        name: introduction
        label: Welcome to Our Feedback Survey
        hint: Your input helps us improve our community outreach programs
        type: note
        options: []
        required: false
      - id: 2
        name: program_name
        label: Which Program Did You Participate In
        hint: Select from the list
        type: select_one
        options:
        - Youth Mentorship
        - Senior Support Services
        - Health and Wellness
        - Education Programs
        - Job Training
        - Food Assistance
        - Housing Support
        - Other
        required: true
      - id: 3
        name: participation_date
        label: Date of Participation
        hint: Approximate date
        type: date
        options: []
        required: false
      - id: 4
        name: overall_satisfaction
        label: Overall Satisfaction Rating
        hint: 1 being very dissatisfied, 5 being very satisfied
        type: select_one
        options:
        - 1 - Very Dissatisfied
        - 2 - Dissatisfied
        - 3 - Neutral
        - 4 - Satisfied
        - 5 - Very Satisfied
        required: true
      - id: 5
        name: program_quality
        label: How Would You Rate the Program Quality
        hint: null
        type: select_one
        options:
        - Excellent
        - Good
        - Fair
        - Poor
        required: true
      - id: 6
        name: staff_helpfulness
        label: Staff Helpfulness Rating
        hint: null
        type: select_one
        options:
        - Very Helpful
        - Helpful
        - Neutral
        - Unhelpful
        - Very Unhelpful
        required: true
      - id: 7
        name: met_expectations
        label: Did the Program Meet Your Expectations
        hint: null
        type: select_one
        options:
        - Exceeded Expectations
        - Met Expectations
        - Below Expectations
        required: true
      - id: 8
        name: program_benefits
        label: What Benefits Did You Gain
        hint: Select all that apply
        type: select_multiple
        options:
        - Improved Knowledge
        - New Skills
        - Better Health
        - Community Connections
        - Employment Opportunities
        - Emotional Support
        - Financial Assistance
        - Other
        required: false
      - id: 9
        name: likelihood_recommend
        label: How Likely Are You to Recommend This Program
        hint: null
        type: select_one
        options:
        - Very Likely
        - Likely
        - Neutral
        - Unlikely
        - Very Unlikely
        required: true
      - id: 10
        name: areas_improvement
        label: What Areas Need Improvement
        hint: Be specific
        type: text
        options: []
        required: false
      - id: 11
        name: additional_services
        label: What Additional Services Would You Like
        hint: null
        type: text
        options: []
        required: false
      - id: 12
        name: communication_rating
        label: How Would You Rate Our Communication
        hint: null
        type: select_one
        options:
        - Excellent
        - Good
        - Fair
        - Poor
        required: true
      - id: 13
        name: future_participation
        label: Would You Participate in Future Programs
        hint: null
        type: select_one
        options:
        - Definitely Yes
        - Probably Yes
        - Maybe
        - Probably No
        - Definitely No
        required: true
      - id: 14
        name: demographic_age
        label: Age Group
        hint: Optional demographic information
        type: select_one
        options:
        - Under 18
        - 18-24
        - 25-34
        - 35-44
        - 45-54
        - 55-64
        - 65+
        required: false
      - id: 15
        name: additional_comments
        label: Any Additional Comments or Suggestions
        hint: We value your feedback
        type: text
        options: []
        required: false
