inputSchema:
  type: object
  properties:
    title: Garlic Product Feedback Survey
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating
      label: How do you like the product?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 3
      name: feedback
      label: What do you think could be improved?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: product_satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
