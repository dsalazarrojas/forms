inputSchema:
  type: object
  properties:
    title: Automotive Module Feedback Form
    pages:
    - id: 1
      name: section_header_respondent
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: respondent_phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: customer_id
      label: Customer ID or Account Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_service
      label: -- Service or Module Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_received
      label: Service or Module Used
      hint: null
      type: select_one
      options:
      - Service A
      - Service B
      - Service C
      - Module 1
      - Module 2
      - Module 3
      - Other
      required: true
    - id: 8
      name: service_date
      label: Date of Service
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: staff_member
      label: Staff Member Worked With
      hint: Name of technician or representative
      type: text
      options: []
      required: false
    - id: 10
      name: section_header_rating
      label: -- Service Rating --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: overall_satisfaction
      label: Overall Satisfaction with Service
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 12
      name: quality_rating
      label: Quality of Work or Service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: timeliness_rating
      label: Timeliness of Service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: staff_professionalism
      label: Staff Professionalism and Knowledge
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: value_for_money
      label: Value for Money
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: section_header_feedback
      label: -- Detailed Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: strengths
      label: What did we do well?
      hint: Describe the positive aspects of the service
      type: text
      options: []
      required: true
    - id: 18
      name: improvements
      label: What could we improve?
      hint: Areas for improvement or concern
      type: text
      options: []
      required: true
    - id: 19
      name: specific_issues
      label: Any Specific Issues or Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: section_header_recommend
      label: -- Recommendation --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: would_recommend
      label: Would you recommend us to others?
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably Not
      - Definitely Not
      required: true
    - id: 22
      name: recommendation_likelihood
      label: How likely are you to use our service again?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Likely
      - Uncertain
      - Unlikely
      - Very Unlikely
      required: true
    - id: 23
      name: section_header_followup
      label: -- Follow-up --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: contact_followup
      label: May we contact you to discuss feedback?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: feedback_date
      label: Date of Feedback
      hint: null
      type: date
      options: []
      required: true
