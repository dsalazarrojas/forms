      name: interaction_time
      label: How long did you spend on this page
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: navigation_flow
      label: What navigation flow did you use?
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''A'', ''label'': ''A''}'
      - '{''id'': 2, ''name'': ''B'', ''label'': ''B''}'
      - '{''id'': 3, ''name'': ''C'', ''label'': ''C''}'
      required: false
    - id: 3
      name: feedback
      label: How would you rate your experience?
      hint: Please provide a score between 1-5
      type: number
      options: []
      required: false
    - id: 4
      name: suggestion
      label: Do you have any suggestions for our team?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
