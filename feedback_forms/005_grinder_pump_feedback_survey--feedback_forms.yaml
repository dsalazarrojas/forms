inputSchema:
  type: object
  properties:
    title: Grinder Pump Feedback Survey
    pages:
    - id: 1
      name: user_satisfaction
      label: How satisfied are you with the grinder pump?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Not satisfied
      - Not at all satisfied
      required: false
    - id: 2
      name: issue_reports
      label: What issues have you experienced with the grinder pump?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: pump_performance
      label: How often do you run the grinder pump?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times per week
      - Once a week
      - Less than once a week
      required: false
    - id: 4
      name: improvement_suggestions
      label: What suggestions do you have for improvements to the grinder pump?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: user_info
      label: Your Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Your Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: contact_info
      label: What is your contact information?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
