inputSchema:
  type: object
  properties:
    title: Building Occupancy Optimization Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: When completing this survey
      type: date
      options: []
      required: true
    - id: 2
      name: building_name
      label: Building Name
      hint: Which building are you in
      type: text
      options: []
      required: true
    - id: 3
      name: floor_number
      label: Floor Number
      hint: Which floor
      type: text
      options: []
      required: false
    - id: 4
      name: workspace_type
      label: Type of Workspace You Use
      hint: Office, meeting room, open area, etc
      type: select_one
      options:
      - Individual Office
      - Shared Workspace
      - Meeting Room
      - Open Floor Plan
      - Hot Desk
      - Other
      required: true
    - id: 5
      name: daily_usage
      label: How Often Do You Use This Space
      hint: Frequency of usage
      type: select_one
      options:
      - Every Day
      - Several Times Per Week
      - Weekly
      - Few Times Per Month
      - Rarely
      required: true
    - id: 6
      name: hours_spent
      label: Average Hours Spent Daily
      hint: How many hours per day
      type: number
      options: []
      required: false
    - id: 7
      name: space_adequacy
      label: Space Adequacy for Your Needs
      hint: Is the space big enough
      type: select_one
      options:
      - More Than Adequate
      - Adequate
      - Somewhat Adequate
      - Inadequate
      required: true
    - id: 8
      name: privacy_level
      label: Privacy Level
      hint: Is there adequate privacy
      type: select_one
      options:
      - Very Private
      - Private
      - Moderate Privacy
      - Limited Privacy
      - No Privacy
      required: true
    - id: 9
      name: collaboration_space
      label: Collaboration Space Availability
      hint: Easy to find meeting spaces
      type: select_one
      options:
      - Abundant
      - Adequate
      - Limited
      - Insufficient
      required: true
    - id: 10
      name: comfort_level
      label: Overall Comfort Level
      hint: Workspace comfort
      type: select_one
      options:
      - Very Comfortable
      - Comfortable
      - Neutral
      - Uncomfortable
      - Very Uncomfortable
      required: true
    - id: 11
      name: temperature_comfort
      label: Temperature and Climate Control
      hint: Is it the right temperature
      type: select_one
      options:
      - Always Comfortable
      - Usually Comfortable
      - Sometimes Uncomfortable
      - Often Uncomfortable
      required: true
    - id: 12
      name: lighting_quality
      label: Lighting Quality
      hint: Is lighting adequate
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: noise_level
      label: Noise Level
      hint: Is it too noisy
      type: select_one
      options:
      - Very Quiet
      - Quiet
      - Moderate
      - Noisy
      - Very Noisy
      required: true
    - id: 14
      name: technology_support
      label: Technology Support in Space
      hint: WiFi, outlets, connectivity
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: furniture_quality
      label: Furniture and Ergonomics
      hint: Comfort and quality of furniture
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: amenities_access
      label: Access to Amenities
      hint: Break rooms, coffee, etc
      type: select_one
      options:
      - Very Accessible
      - Accessible
      - Somewhat Accessible
      - Not Accessible
      required: true
    - id: 17
      name: usage_patterns
      label: Space Usage Could Be Optimized
      hint: Is space used efficiently
      type: select_one
      options:
      - Significantly
      - Moderately
      - Slightly
      - Not At All
      required: false
    - id: 18
      name: optimization_suggestions
      label: Suggestions for Space Optimization
      hint: How to improve space usage
      type: text
      options: []
      required: false
    - id: 19
      name: missing_facilities
      label: Missing or Needed Facilities
      hint: What is not available
      type: text
      options: []
      required: false
    - id: 20
      name: overall_satisfaction
      label: Overall Satisfaction With Space
      hint: General satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
