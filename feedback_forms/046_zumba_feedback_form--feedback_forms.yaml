      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: instructor_name
      label: InstructorName
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: instructor_id
      label: InstructorID
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
