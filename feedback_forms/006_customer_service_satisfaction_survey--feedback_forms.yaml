inputSchema:
  type: object
  properties:
    title: Customer Service Satisfaction Survey
    pages:
    - id: 1
      name: service_satisfaction
      label: How satisfied are you with our service?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 2
      name: service_quality
      label: How would you rate the quality of our service?
      hint: Please provide a rating
      type: number
      options: []
      required: true
    - id: 3
      name: staff_helpfulness
      label: How helpful were the staff members you interacted with?
      hint: null
      type: select_one
      options:
      - Very helpful
      - Somewhat helpful
      - Not very helpful
      - Not at all helpful
      required: true
    - id: 4
      name: communication
      label: How would you rate the communication with our staff?
      hint: Please provide a rating
      type: number
      options: []
      required: true
    - id: 5
      name: resolution
      label: How quickly were your issues resolved?
      hint: null
      type: select_one
      options:
      - Very quickly
      - Somewhat quickly
      - Not very quickly
      - Not at all quickly
      required: true
    - id: 6
      name: resolution_time
      label: How long did it take for your issue to be resolved?
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: staff_availability
      label: Was the staff available to help you during your visit?
      hint: null
      type: select_one
      options:
      - Always
      - Most of the time
      - Sometimes
      - Never
      required: true
    - id: 8
      name: resolution_method
      label: How would you like to have your issue resolved?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Chat
      - In-person
      - Other
      required: true
    - id: 9
      name: email
      label: Do you want to be contacted by email?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: phone
      label: Do you want to be contacted by phone?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: chat
      label: Would you like to be contacted by chat?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
