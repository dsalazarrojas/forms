inputSchema:
  type: object
  properties:
    title: Client Satisfaction Communication Form
    pages:
    - id: 1
      name: client_info
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: Full name or company name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Contact Person Name
      hint: Primary contact at the client organization
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: relationship_length
      label: How long have you been working with us?
      hint: null
      type: select_one
      options:
      - Less than 3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - More than 2 years
      required: true
    - id: 7
      name: communication_overview
      label: -- Communication Effectiveness --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: communication_frequency
      label: Communication frequency is appropriate for your needs
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 9
      name: clarity_rating
      label: Rate the clarity of our communications - 1 to 10
      hint: 1 = Not clear, 10 = Very clear
      type: number
      options: []
      required: true
    - id: 10
      name: responsiveness_rating
      label: How responsive are we to your messages and inquiries?
      hint: null
      type: select_one
      options:
      - Very Unresponsive
      - Unresponsive
      - Neutral
      - Responsive
      - Very Responsive
      required: true
    - id: 11
      name: response_time
      label: Our typical response time meets your expectations
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 12
      name: channel_preferences
      label: -- Communication Channels --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: preferred_channel
      label: Your preferred communication channel
      hint: null
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Video Call
      - In-Person Meeting
      - Project Management Tool
      required: true
    - id: 14
      name: channel_effectiveness
      label: Our current communication channels work well for you
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 15
      name: additional_channels
      label: Would additional communication channels be helpful?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: content_quality
      label: -- Communication Content --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: information_relevance
      label: The information we communicate is relevant to your needs
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 18
      name: proactive_communication
      label: We proactively keep you informed of relevant updates
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 19
      name: transparency_level
      label: How transparent is our communication with you?
      hint: null
      type: select_one
      options:
      - Not transparent
      - Somewhat transparent
      - Neutral
      - Mostly transparent
      - Very transparent
      required: true
    - id: 20
      name: professionalism_level
      label: Our communication is professional and courteous
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 21
      name: satisfaction_section
      label: -- Overall Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: overall_satisfaction
      label: Overall satisfaction with our communications
      hint: null
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 23
      name: satisfaction_score
      label: Rate your overall satisfaction - 1 to 10
      hint: 1 = Very unsatisfied, 10 = Very satisfied
      type: number
      options: []
      required: true
    - id: 24
      name: improvement_suggestions
      label: What could we improve in our communications?
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional comments or feedback
      hint: null
      type: text
      options: []
      required: false
