inputSchema:
  type: object
  properties:
    title: Guest Satisfaction Quiz
    pages:
    - id: 1
      name: intro
      label: Welcome to our quiz
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rating_score
      label: How would you rate your overall experience
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: staff_interactions
      label: How would you rate your staff interactions
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: food_quality
      label: How would you rate the quality of food
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: service_quality
      label: How would you rate the quality of service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: ambience
      label: What do you think of the ambience of our hotel
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: value_for_money
      label: Do you think you got value for money
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: suggestions
      label: Do you have any suggestions
      hint: We appreciate any feedback
      type: text
      options: []
      required: false
