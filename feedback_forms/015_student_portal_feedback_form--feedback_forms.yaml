inputSchema:
  type: object
  properties:
    title: Student Portal Feedback Form
    pages:
    - id: 1
      name: portal_satisfaction
      label: Portal Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 2
      name: feature_usage
      label: Feature Usage
      hint: null
      type: select_multiple
      options:
      - Very Often
      - Sometimes
      - Rarely
      required: false
    - id: 3
      name: technical_issues
      label: Technical Issues
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: suggestions
      label: Suggestions
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: name
      label: Name
      hint: Full name of student
      type: text
      options: []
      required: false
    - id: 8
      name: school_id
      label: School ID
      hint: null
      type: number
      options: []
      required: false
