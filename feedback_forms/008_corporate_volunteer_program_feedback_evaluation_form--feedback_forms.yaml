inputSchema:
  type: object
  properties:
    title: corporate_volunteer_program_feedback_evaluation_form
    pages:
    - id: 1
      name: program_name
      label: Program Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: volunteer_name
      label: Volunteer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: program_date
      label: Program Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: volunteer_hours
      label: Volunteer Hours
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: feedback
      label: Feedback
      hint: Please provide feedback on your experience with the Corporate Volunteer
        Program.
      type: text
      options: []
      required: true
    - id: 7
      name: suggestions
      label: Suggestions for Future Programs
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: company_name
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: program_location
      label: Program Location
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: evaluation
      label: Evaluation
      hint: null
      type: select_one
      options:
      - Corporate Volunteer Program
      - Volunteer Activity
      - Program Location
      - Other
      required: true
    - id: 11
      name: program_outcome
      label: Program Outcome
      hint: null
      type: select_one
      options:
      - Positive
      - Neutral
      - Negative
      required: true
