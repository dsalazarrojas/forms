inputSchema:
  type: object
  properties:
    title: Favorite Channel Submission Form
    pages:
    - id: 1
      name: channel_1
      label: What is your favorite channel
      hint: Please provide the name of your favorite channel
      type: text
      options: []
      required: false
    - id: 2
      name: time_1
      label: When is your favorite time to visit
      hint: HH -MM 24 hour format
      type: time
      options: []
      required: false
    - id: 3
      name: frequency_1
      label: How often do you visit your favorite channel
      hint: Never, occasionally, frequently, always
      type: select_one
      options:
      - Never
      - Occasionally
      - Frequently
      - Always
      required: false
    - id: 4
      name: interaction_1
      label: How do you usually interact with your channel
      hint: Select all that apply
      type: select_multiple
      options:
      - Social Media
      - Mobile App
      - Website
      required: false
    - id: 5
      name: type_1
      label: What type of content do you usually consume on your channel
      hint: Select one option that best describes the content type
      type: select_one
      options:
      - Live stream
      - Video on-demand
      required: false
    - id: 6
      name: recommend_1
      label: Would you recommend our channel to a friend?
      hint: Scale - 1-5
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 7
      name: more_info_1
      label: Tell us more about your favorite channel
      hint: Please provide additional comments
      type: note
      options: []
      required: false
    - id: 8
      name: channels_1
      label: What makes our channel unique from others?
      hint: Select all that apply
      type: select_multiple
      options:
      - Content variety
      - Content quality
      - User engagement
      - Community interaction
      - Unique features
      - Other
      required: false
    - id: 9
      name: email
      label: What is your email address?
      hint: Format - example@example.com
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: channel_name
      label: Can you describe your favorite channel in one sentence?
      hint: Provide a brief summary
      type: text
      options: []
      required: false
    - id: 12
      name: channels_2
      label: How likely are you to recommend our channel to a friend?
      hint: Select one option
      type: select_one
      options:
      - Not likely
      - Somewhat likely
      - Very likely
      - Extremely likely
      required: false
