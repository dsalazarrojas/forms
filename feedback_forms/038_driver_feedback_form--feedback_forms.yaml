inputSchema:
  type: object
  properties:
    title: driver_feedback_form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: driver_service_rating
      label: How do you rate the service of the driver
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: communication
      label: Communication skills of the driver
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Bad
      required: true
    - id: 4
      name: appearance
      label: Cleanliness and appearance of the vehicle
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Bad
      required: true
    - id: 5
      name: driver_attitude
      label: Attitude of the driver
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Bad
      required: true
    - id: 6
      name: overall_satisfaction
      label: Overall satisfaction with the driver
      hint: null
      type: select_one
      options:
      - Highly Satisfied
      - Moderately Satisfied
      - Not Satisfied
      required: true
    - id: 7
      name: driver_feedback
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: driver_phone
      label: Driver phone number
      hint: null
      type: text
      options: []
      required: false
