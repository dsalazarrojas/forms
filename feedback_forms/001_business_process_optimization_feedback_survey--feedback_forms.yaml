inputSchema:
  type: object
  properties:
    title: Business Process Optimization Feedback Survey
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_email
      label: Email Address
      hint: Your work email
      type: email
      options: []
      required: true
    - id: 3
      name: department
      label: Which department do you work in?
      hint: Select your primary department
      type: select_one
      options:
      - Operations
      - Finance
      - Human Resources
      - Sales
      - Marketing
      - IT
      required: true
    - id: 4
      name: process_area
      label: Which process area does this feedback relate to?
      hint: null
      type: select_one
      options:
      - Data Entry and Processing
      - Approvals and Authorizations
      - Reporting and Analytics
      - Customer Service
      - Project Management
      - Other
      required: true
    - id: 5
      name: current_efficiency
      label: How would you rate the current efficiency of this process?
      hint: Scale 1-5, where 1 is very inefficient
      type: select_one
      options:
      - 1 - Very Inefficient
      - 2 - Inefficient
      - 3 - Neutral
      - 4 - Efficient
      - 5 - Very Efficient
      required: true
    - id: 6
      name: main_challenges
      label: What are the main challenges with this process?
      hint: Select all that apply
      type: select_multiple
      options:
      - Too many manual steps
      - Lack of automation
      - Unclear procedures
      - Inconsistent execution
      - Poor communication
      - System integration issues
      required: true
    - id: 7
      name: time_spent_daily
      label: How much time do you spend on this process daily?
      hint: In hours
      type: number
      options: []
      required: false
    - id: 8
      name: improvement_suggestions
      label: What improvements would you suggest?
      hint: Provide specific recommendations
      type: text
      options: []
      required: false
    - id: 9
      name: automation_potential
      label: Could this process benefit from automation?
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Unsure
      - Probably No
      - Definitely No
      required: true
    - id: 10
      name: impact_assessment
      label: How would you rate the potential business impact of optimizing this process?
      hint: null
      type: select_one
      options:
      - High Impact
      - Medium Impact
      - Low Impact
      - Minimal Impact
      required: true
    - id: 11
      name: implementation_timeline
      label: What is your preferred implementation timeline?
      hint: null
      type: select_one
      options:
      - Immediate (0-30 days)
      - Short-term (1-3 months)
      - Medium-term (3-6 months)
      - Long-term (6+ months)
      required: false
    - id: 12
      name: team_readiness
      label: Is your team ready for this optimization?
      hint: null
      type: select_one
      options:
      - Fully ready
      - Mostly ready
      - Needs preparation
      - Not ready
      required: true
    - id: 13
      name: training_required
      label: What training or support would be needed?
      hint: Select all that apply
      type: select_multiple
      options:
      - System training
      - Process documentation
      - Change management support
      - Technical support
      - No additional training needed
      required: false
    - id: 14
      name: metrics_important
      label: Which metrics are most important to track?
      hint: null
      type: select_multiple
      options:
      - Processing time
      - Error rate
      - Cost reduction
      - Employee satisfaction
      - Customer satisfaction
      required: false
    - id: 15
      name: additional_feedback
      label: Any additional feedback or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: willing_to_participate
      label: Are you willing to participate in optimization discussions?
      hint: null
      type: select_one
      options:
      - 'True'
      - Maybe
      - 'False'
      required: true
    - id: 17
      name: contact_permission
      label: May we contact you for follow-up questions?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
