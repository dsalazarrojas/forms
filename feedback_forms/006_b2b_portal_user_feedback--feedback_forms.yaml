inputSchema:
  type: object
  properties:
    title: B2B Portal User Feedback
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_company
      label: Company Name
      hint: Your organization name
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_title
      label: Your Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: respondent_email
      label: Email Address
      hint: For follow-up contact
      type: email
      options: []
      required: true
    - id: 5
      name: portal_usage_frequency
      label: How often do you use the B2B portal?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Occasionally
      - Rarely
      required: true
    - id: 6
      name: portal_satisfaction
      label: Overall portal satisfaction rating
      hint: Rate from 1 (very dissatisfied) to 10 (very satisfied)
      type: number
      options: []
      required: true
    - id: 7
      name: ease_of_navigation
      label: How easy is the portal to navigate?
      hint: null
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 8
      name: feature_effectiveness
      label: Are the portal features effective for your needs?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: false
    - id: 9
      name: most_useful_features
      label: Which features do you find most useful?
      hint: Select all that apply
      type: select_multiple
      options:
      - Order Management
      - Inventory Tracking
      - Pricing Information
      - Account Management
      - Reports and Analytics
      - Communication Tools
      - Document Storage
      - Mobile Access
      required: false
    - id: 10
      name: least_useful_features
      label: Which features are least useful?
      hint: Select all that apply
      type: select_multiple
      options:
      - Order Management
      - Inventory Tracking
      - Pricing Information
      - Account Management
      - Reports and Analytics
      - Communication Tools
      - Document Storage
      - Mobile Access
      required: false
    - id: 11
      name: support_experience
      label: How would you rate support experience?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Have not used support
      required: false
    - id: 12
      name: feature_requests
      label: What new features would you like to see?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: improvement_suggestions
      label: What could be improved?
      hint: Provide specific suggestions
      type: text
      options: []
      required: false
    - id: 14
      name: recommend_portal
      label: Would you recommend this portal to other businesses?
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Unsure
      - Probably No
      - Definitely No
      required: false
