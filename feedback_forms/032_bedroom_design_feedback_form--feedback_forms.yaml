inputSchema:
  type: object
  properties:
    title: Bedroom Design Feedback Form
    pages:
    - id: 1
      name: section_client_intro
      label: -- Design Project Feedback --
      hint: Your feedback helps us refine your dream bedroom design
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: project_phase
      label: Which phase of the design are you providing feedback on?
      hint: null
      type: select_one
      options:
      - Initial Concept / Moodboard
      - Furniture Layout / Floor Plan
      - Color Palette and Textiles
      - Final Rendering
      required: true
    - id: 4
      name: section_design_elements
      label: -- Design Element Feedback --
      hint: Rate how well each element meets your expectations
      type: note
      options: []
      required: false
    - id: 5
      name: spatial_layout_satisfaction
      label: Overall Spatial Layout and Flow
      hint: 1 to 5 scale
      type: number
      options: []
      required: true
    - id: 6
      name: color_palette_satisfaction
      label: Color Palette and Mood
      hint: 1 to 5 scale
      type: number
      options: []
      required: true
    - id: 7
      name: furniture_selection_satisfaction
      label: Furniture Style and Selection
      hint: 1 to 5 scale
      type: number
      options: []
      required: true
    - id: 8
      name: storage_solutions_satisfaction
      label: Adequacy of Storage Solutions
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: lighting_plan_satisfaction
      label: Lighting Plan and Fixtures
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: section_specific_critique
      label: -- Specific Comments --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: element_you_love_most
      label: What element of the design do you love the most?
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: element_to_change
      label: What specific element would you like to change or remove?
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: additional_requirements
      label: Are there any new requirements or items to be added?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: budget_alignment
      label: Does the current design feel aligned with your budget?
      hint: null
      type: select_one
      options:
      - 'True'
      - Mostly
      - Needs adjustment
      - Unsure
      required: true
    - id: 15
      name: next_steps_readiness
      label: Are you ready to move to the next phase based on this design?
      hint: null
      type: select_one
      options:
      - Yes, proceed
      - Yes, with the noted changes
      - No, I need a revised concept
      required: true
    - id: 16
      name: feedback_submission_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
