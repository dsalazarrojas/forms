inputSchema:
  type: object
  properties:
    title: Hospitality AI Chatbot Survey
    pages:
    - id: 1
      name: survey_page
      label: How would you rate our service?
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: hospitality_service_usage
      label: How often have you used our chatbot in the past?
      hint: null
      type: select_one
      options:
      - '{''label'': ''Never''}'
      - '{''label'': ''Rarely''}'
      - '{''label'': ''Sometimes''}'
      - '{''label'': ''Often''}'
      required: false
    - id: 3
      name: user_experience
      label: How was your overall experience with our chatbot?
      hint: On a scale of 1 to 10
      type: number
      options: []
      required: false
    - id: 4
      name: chatbot_feature
      label: Which of the following features would you like to see added to our chatbot?
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Chatbot Response''}'
      - '{''label'': ''Contextualization''}'
      - '{''label'': ''Customization''}'
      - '{''label'': ''Integration with third-party services''}'
      required: false
    - id: 5
      name: interaction_type
      label: How did you interact with our chatbot?
      hint: null
      type: select_one
      options:
      - '{''label'': ''Text''}'
      - '{''label'': ''Voice''}'
      - '{''label'': ''Visual''}'
      required: false
    - id: 6
      name: feedback_type
      label: What type of feedback do you have for our chatbot?
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Technical''}'
      - '{''label'': ''Functional''}'
      - '{''label'': ''User Experience''}'
      required: false
    - id: 7
      name: rating
      label: How would you rate our chatbot?
      hint: On a scale of 1 to 5
      type: number
      options: []
      required: false
    - id: 8
      name: comment
      label: Is there anything else you'd like to tell us?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_method
      label: How would you like to get in touch with us?
      hint: null
      type: select_one
      options:
      - '{''label'': ''Phone''}'
      - '{''label'': ''Email''}'
      - '{''label'': ''Chat''}'
      required: false
    - id: 10
      name: email_address
      label: Your email address
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: name
      label: Your name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: company_name
      label: Company name (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: company_website
      label: Company website (if applicable)
      hint: null
      type: text
      options: []
      required: false
