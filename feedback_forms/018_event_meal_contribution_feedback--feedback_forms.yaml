inputSchema:
  type: object
  properties:
    title: Event Meal Contribution Feedback
    pages:
    - id: 1
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Scale 1
      - Scale 2
      - Scale 3
      - Scale 4
      - Scale 5
      required: true
    - id: 2
      name: comments
      label: Comments
      hint: Please provide detailed feedback about your experience.
      type: text
      options: []
      required: true
    - id: 3
      name: would_recontribute
      label: Would You Re-contribute?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 4
      name: future_interest
      label: Future Contribution Interest
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      - Very Likely
      - Highly Likely
      - Not Likely
      required: true
    - id: 5
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: repeat_1
      label: Repeat of previous questions
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: repeat_2
      label: Repeat 2
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: repeat_3
      label: Repeat 3
      hint: null
      type: text
      options: []
      required: false
