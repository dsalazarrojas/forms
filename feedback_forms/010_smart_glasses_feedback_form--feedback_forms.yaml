inputSchema:
  type: object
  properties:
    title: Smart Glasses Feedback Form
    pages:
    - id: 1
      name: feedback_form
      label: Feedback Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How would you rate your overall satisfaction with the product?
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 3
      name: suggestions
      label: Suggestions
      hint: Any feedback or suggestions for improvements?
      type: text
      options: []
      required: false
    - id: 4
      name: product_usability
      label: Product Usability
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: product_features
      label: Product Features
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: experience
      label: Experience
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: product_image_quality
      label: Product Image Quality
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: true
    - id: 8
      name: would_recommend
      label: Would you recommend this product?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: contact_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: contact_email
      label: Your Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: contact_phone
      label: Your Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: feedback_description
      label: Feedback Description
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
