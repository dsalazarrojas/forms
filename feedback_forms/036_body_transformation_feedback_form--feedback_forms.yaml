inputSchema:
  type: object
  properties:
    title: Body Transformation Feedback Form
    pages:
    - id: 1
      name: client_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 4
      name: program_start_date
      label: Program Start Date
      hint: When you began the transformation
      type: date
      options: []
      required: true
    - id: 5
      name: program_duration
      label: Program Duration
      hint: How long have you been in the program
      type: select_one
      options:
      - 1-4 weeks
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - Over 1 year
      required: true
    - id: 6
      name: program_type
      label: Type of Program
      hint: What program are you following
      type: text
      options: []
      required: true
    - id: 7
      name: trainer_name
      label: Your Trainer or Coach Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: weight_change
      label: Weight Change
      hint: Pounds lost or gained
      type: number
      options: []
      required: false
    - id: 9
      name: goal_achievement
      label: How close are you to your goal
      hint: null
      type: select_one
      options:
      - Achieved Goal Completely
      - On Track to Achieve
      - Halfway There
      - Just Beginning
      - Not Making Progress
      required: true
    - id: 10
      name: physical_changes_noticed
      label: Physical Changes Noticed
      hint: Select all that apply
      type: select_multiple
      options:
      - Weight Loss
      - Muscle Gain
      - Increased Strength
      - Improved Endurance
      - Better Flexibility
      - Improved Posture
      - Visible Muscle Definition
      - Clothing Fits Better
      - Other
      required: true
    - id: 11
      name: energy_levels
      label: Energy Levels
      hint: null
      type: select_one
      options:
      - Significantly Increased
      - Increased
      - Stayed the Same
      - Decreased
      - Significantly Decreased
      required: true
    - id: 12
      name: confidence_improvement
      label: Confidence Improvement
      hint: null
      type: select_one
      options:
      - Significantly Improved
      - Improved
      - Stayed the Same
      - Decreased
      - Significantly Decreased
      required: true
    - id: 13
      name: training_satisfaction
      label: Satisfaction with Training Program
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 14
      name: trainer_support
      label: Trainer Support and Guidance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: program_difficulty
      label: Difficulty Level of Program
      hint: null
      type: select_one
      options:
      - Too Easy
      - Slightly Easy
      - Just Right
      - Slightly Challenging
      - Too Difficult
      required: true
    - id: 16
      name: nutrition_guidance_quality
      label: Quality of Nutrition Guidance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Provided
      required: true
    - id: 17
      name: motivation_level
      label: Current Motivation Level
      hint: null
      type: select_one
      options:
      - Very Motivated
      - Motivated
      - Neutral
      - Losing Motivation
      - Unmotivated
      required: true
    - id: 18
      name: program_adherence
      label: How Well You Followed the Program
      hint: null
      type: select_one
      options:
      - Perfectly - 100 percent
      - Mostly - 80-99 percent
      - Partially - 60-79 percent
      - Some - 40-59 percent
      - Little - Below 40 percent
      required: true
    - id: 19
      name: biggest_challenge
      label: Biggest Challenge During Program
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: success_factors
      label: What Contributed to Your Success
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: would_recommend
      label: Would You Recommend This Program
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 22
      name: improvement_suggestions
      label: Suggestions for Program Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: future_plans
      label: Future Fitness Plans
      hint: What will you do after the program
      type: text
      options: []
      required: false
    - id: 24
      name: overall_satisfaction
      label: Overall Satisfaction with Transformation
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
