inputSchema:
  type: object
  properties:
    title: Nightlife Experience Feedback
    pages:
    - id: 1
      name: overall_experience
      label: Overall Experience
      hint: How would you rate the overall experience?
      type: number
      options: []
      required: true
    - id: 2
      name: service
      label: Service Quality
      hint: How would you rate the service quality?
      type: number
      options: []
      required: true
    - id: 3
      name: ambiance
      label: Ambiance
      hint: What was the ambiance like?
      type: text
      options: []
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: Your Email
      type: email
      options: []
      required: false
    - id: 6
      name: assigned_tool
      label: Assigned Tool
      hint: Were you assigned a tool?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: submitted
      label: Submission Date
      hint: (YYYY-MM-DD)
      type: date
      options: []
      required: true
    - id: 8
      name: assigned_tool_type
      label: Tool Type
      hint: What type of tool was assigned?
      type: select_one
      options:
      - Tool 1
      - Tool 2
      - Tool 3
      required: true
    - id: 9
      name: comments_on_tool
      label: Comments on Tool
      hint: What were your thoughts on the tool?
      type: text
      options: []
      required: false
