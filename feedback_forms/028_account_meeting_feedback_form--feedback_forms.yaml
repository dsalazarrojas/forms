inputSchema:
  type: object
  properties:
    title: Account Meeting Feedback Form
    pages:
    - id: 1
      name: section_meeting_info
      label: -- Meeting Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_company
      label: Client Company
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: account_manager_name
      label: Account Manager Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: meeting_type
      label: Meeting Type
      hint: null
      type: select_one
      options:
        - Initial consultation
        - Quarterly business review
        - Project update
        - Strategy session
        - Issue resolution
        - Contract renewal
        - Other
      required: true
    - id: 8
      name: section_feedback
      label: -- Meeting Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall Satisfaction with the Meeting
      hint: null
      type: select_one
      options:
        - Very Satisfied
        - Satisfied
        - Neutral
        - Dissatisfied
        - Very Dissatisfied
      required: true
    - id: 10
      name: meeting_preparedness
      label: Was the Account Manager Well-Prepared
      hint: null
      type: select_one
      options:
        - Excellent preparation
        - Good preparation
        - Adequate
        - Poorly prepared
      required: true
    - id: 11
      name: agenda_covered
      label: Were All Agenda Items Covered
      hint: null
      type: select_one
      options:
        - Yes, completely
        - Mostly
        - Partially
        - No
      required: true
    - id: 12
      name: communication_clarity
      label: How Clear Was the Communication
      hint: null
      type: select_one
      options:
        - Very clear
        - Clear
        - Somewhat clear
        - Unclear
      required: true
    - id: 13
      name: action_items_clear
      label: Were Action Items and Next Steps Clearly Defined
      hint: null
      type: select_one
      options:
        - Yes, very clear
        - Somewhat clear
        - No, unclear
      required: true
    - id: 14
      name: most_valuable_topic
      label: What Was the Most Valuable Part of the Meeting
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: topics_missing
      label: Were There Any Topics You Wanted to Discuss That Were Not Covered
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: recommend_account_manager
      label: Would You Recommend Your Account Manager to a Colleague
      hint: null
      type: select_one
      options:
        - Definitely yes
        - Probably yes
        - Not sure
        - Probably not
        - Definitely not
      required: true
    - id: 17
      name: additional_feedback
      label: Additional Feedback or Suggestions
      hint: null
      type: text
      options: []
      required: false
