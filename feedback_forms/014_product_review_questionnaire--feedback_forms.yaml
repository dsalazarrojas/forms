inputSchema:
  type: object
  properties:
    title: Product Review Questionnaire
    pages:
    - id: 1
      name: product_review_questionnaire_form
      label: Product Review Questionnaire Form
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: product_rating
      label: Product Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: product_recommend
      label: Would you recommend this product?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: product_comment
      label: Product Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: product_price
      label: How much would you pay for this product?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: product_worthwhile
      label: Was this product worth the price?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: product_purpose
      label: What is the purpose of this product for you?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
