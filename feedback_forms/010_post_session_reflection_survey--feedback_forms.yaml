      name: session_reflection
      label: Session Reflection
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating
      label: Session Satisfaction
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: rating_scale
      label: Rating Scale
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
