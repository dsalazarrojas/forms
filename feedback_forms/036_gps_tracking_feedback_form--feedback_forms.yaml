inputSchema:
  type: object
  properties:
    title: GPS Tracking Feedback Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rate_accuracy
      label: Rate Accuracy
      hint: Select one of the options below
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 3
      name: has_issues
      label: Has Issues
      hint: null
      type: select_multiple
      options:
      - GPS Data Inaccuracy
      - GPS Signal Loss
      - Other (please specify)
      required: false
    - id: 4
      name: rate_issue_severity
      label: Rate Issue Severity
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: issue_details
      label: Issue Details
      hint: Provide more information about the issue
      type: text
      options: []
      required: false
    - id: 6
      name: rate_solution_satisfaction
      label: Rate Solution Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Neutral
      - Unsatisfied
      required: false
    - id: 7
      name: solution_comments
      label: Solution Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: rate_feedback
      label: Rate Feedback
      hint: null
      type: select_one
      options:
      - Highly Likely
      - Not Likely
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
