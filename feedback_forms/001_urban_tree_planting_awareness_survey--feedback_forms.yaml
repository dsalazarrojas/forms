      name: agreement
      label: Agreement
      hint: null
      type: select_one
      options:
      - Agree
      - Disagree
      required: false
    - id: 11
      name: tree_planted
      label: How many trees have you planted in your lifetime?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: trees_planted_last_year
      label: How many trees have you planted in the last year?
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: trees_planted_last_month
      label: How many trees have you planted in the last month?
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: tree_planting_frequency
      label: How often do you plant trees?
      hint: null
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      required: false
    - id: 15
      name: tree_planting_method
      label: How do you usually plant trees?
      hint: null
      type: select_one
      options:
      - Hand
      - Machine
      required: false
