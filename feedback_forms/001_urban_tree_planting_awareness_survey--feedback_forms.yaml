      name: tree_age
      label: What is the age of the trees you usually plant?
      hint: null
      type: select_multiple
      options:
      - 0-3 months
      - 3-6 months
      - 6-12 months
      - Over 1 year
      required: false
    - id: 19
      name: tree_care
      label: How do you usually care for your trees?
      hint: null
      type: select_multiple
      options:
      - No care
      - Some care
      - Full care
      required: false
    - id: 20
      name: tree_mortality
      label: What is the mortality rate of your trees?
      hint: null
      type: select_one
      options:
      - Less than 10%
      - 10-20%
      - 20-30%
      - Over 30%
      required: false
    - id: 21
      name: tree_diameter
      label: What is the diameter of the trees you usually plant?
      hint: null
      type: select_multiple
