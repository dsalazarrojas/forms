      hint: null
      type: select_multiple
      options:
      - Less than 1 meter
      - 1-2 meters
      - 2-5 meters
      - Over 5 meters
      required: false
    - id: 23
      name: tree_species_list
      label: List the tree species you usually plant
      hint: null
      type: select_multiple
      options:
      - Oak
      - Maple
      - Pine
      - Other (please specify)
      required: false
    - id: 24
      name: tree_species_list_other
      label: Other tree species
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: tree_diameter_range
      label: What is the diameter range of the trees you usually plant?
      hint: null
      type: text
      options: []
      required: false
