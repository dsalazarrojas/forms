inputSchema:
  type: object
  properties:
    title: Urban Tree Planting Awareness Survey
    pages:
    - id: 1
      name: introduction
      label: Urban Tree Planting Awareness Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: awareness_score
      label: What level of awareness do you have about tree planting?
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 3
      name: barriers
      label: What are some barriers to tree planting in your city?
      hint: null
      type: select_multiple
      options:
      - Lack of funding
      - Lack of knowledge
      - Lack of support
      - Other (please specify)
      required: false
    - id: 4
      name: interest_score
      label: How interested are you in tree planting?
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 5
      name: benefits
      label: What benefits do you see from tree planting?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: concerns
      label: What concerns do you have about tree planting?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submission
      label: How can we contact you for further information?
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: comments
      label: Any comments or suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submit
      label: Submit
      hint: null
      type: note
      options: []
      required: false
