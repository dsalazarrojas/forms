inputSchema:
  type: object
  properties:
    title: Student Daily Feedback Form
    pages:
    - id: 1
      name: student_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: feedback_question
      label: What question do you want to give feedback on?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: student_feedback
      label: What feedback do you want to give?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: educator_response
      label: How did the educator respond?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: category
      label: What is your category? (e.g. math, science, history)
      hint: null
      type: select_one
      options:
      - Math
      - Science
      - History
      - Other
      required: true
    - id: 6
      name: student_email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: student_phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date
      label: What is the date of your last class?
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: time
      label: What time is your last class?
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: note
      label: Do you have any additional notes or comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: student_comments
      label: What are your comments about the class?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: category_other
      label: What is your response to other category?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: category_1
      label: What is your response to category 1?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 14
      name: category_2
      label: What is your response to category 2?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 15
      name: category_3
      label: What is your response to category 3?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 16
      name: student_category
      label: Do you have any other categories you would like to add?
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: false
