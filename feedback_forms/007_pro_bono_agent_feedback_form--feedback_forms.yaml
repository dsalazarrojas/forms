inputSchema:
  type: object
  properties:
    title: Pro Bono Agent Feedback Form
    pages:
    - id: 1
      name: pro_bono_agent_feedback
      label: Pro Bono Agent Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pro_bono_service_quality_rating
      label: Pro Bono Service Quality Rating
      hint: null
      type: select_one
      options:
      - Very Poor
      - Poor
      - Fair
      - Good
      - Excellent
      required: false
    - id: 3
      name: pro_bono_service_usefulness_rating
      label: Pro Bono Service Usefulness Rating
      hint: null
      type: select_one
      options:
      - Not at All
      - A Little
      - Somewhat
      - Quite a bit
      - Very Much
      required: false
    - id: 4
      name: pro_bono_service_outcome_rating
      label: Pro Bono Service Outcome Rating
      hint: null
      type: select_one
      options:
      - Not Met
      - Somewhat Met
      - Mostly Met
      - Almost Met
      - Completely Met
      required: false
    - id: 5
      name: pro_bono_service_value_rating
      label: Pro Bono Service Value Rating
      hint: null
      type: select_one
      options:
      - Not at All
      - A Little
      - Somewhat
      - Quite a bit
      - Very Much
      required: false
    - id: 6
      name: pro_bono_agent_name
      label: Pro Bono Agent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: pro_bono_service_description
      label: Pro Bono Service Description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: pro_bono_agent_training
      label: Pro Bono Agent Training
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: pro_bono_agent_comments
      label: Pro Bono Agent Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: pro_bono_service_outcome_impact
      label: Pro Bono Service Outcome Impact
      hint: null
      type: text
      options: []
      required: false
