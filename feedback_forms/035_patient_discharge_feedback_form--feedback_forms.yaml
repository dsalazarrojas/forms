inputSchema:
  type: object
  properties:
    title: Patient Discharge Feedback Form
    pages:
    - id: 1
      name: patient_discharge_form_1
      label: Feedback on Discharge
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_discharge_form_2
      label: How would you rate your overall satisfaction with the care provided?
      hint: null
      type: select_one
      options:
      - Very Good
      - Neutral
      - Very Bad
      required: false
    - id: 3
      name: patient_discharge_form_3
      label: Was the care team approachable and friendly?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - No Response
      required: false
    - id: 4
      name: patient_discharge_form_4
      label: Was the care team responsive to your questions?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: patient_discharge_form_5
      label: Was the environment clean and safe?
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Neutral
      - Very Bad
      required: false
    - id: 6
      name: patient_discharge_form_6
      label: Was the care team knowledgeable?
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Neutral
      - Very Bad
      required: false
    - id: 7
      name: patient_discharge_form_7
      label: Were all your questions answered?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: patient_discharge_form_8
      label: Was the discharge process smooth?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: patient_discharge_form_9
      label: Do you have any additional feedback or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: patient_discharge_form_10
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
