inputSchema:
  type: object
  properties:
    title: youtube_channel_feedback_form_template
    pages:
    - id: 1
      name: feedback_form
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Feedback
      - Other
      - None
      required: false
    - id: 4
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: youtube_channel
      label: Youtube Channel
      hint: null
      type: select_one
      options:
      - Gaming
      - Vlog
      - Educational
      - Music
      - Other
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: Any additional comments
      type: text
      options: []
      required: false
    - id: 10
      name: feedback
      label: Submit
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      required: false
