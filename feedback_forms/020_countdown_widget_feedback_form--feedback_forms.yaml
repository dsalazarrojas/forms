inputSchema:
  type: object
  properties:
    title: Countdown Widget Feedback Form
    pages:
    - id: 1
      name: user_feedback
      label: User Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: widget_rating
      label: Widget Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: widget_rating_scale
      label: Widget Rating Scale
      hint: null
      type: select_one
      options:
      - Poor
      - Average
      - Good
      - Excellent
      - Outstanding
      required: false
    - id: 4
      name: widget_features
      label: Widget Features
      hint: null
      type: select_multiple
      options:
      - Countdown Timer
      - Progress Bar
      - Countdown Button
      - Auto Update
      - Countdown Sound
      required: false
    - id: 5
      name: submit
      label: Submit
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
