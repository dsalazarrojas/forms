inputSchema:
  type: object
  properties:
    title: Report Writing Workshop Feedback
    pages:
    - id: 1
      name: participant_rating
      label: Participant rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 2
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - 1 - Unsatisfied
      - 2 - Neutral
      - 3 - Satisfied
      required: true
    - id: 3
      name: what_did_we_get_right
      label: What did we get right
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: what_did_we_miss
      label: What did we miss
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: what_did_we_get_wrong
      label: What did we get wrong
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
