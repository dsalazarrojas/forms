inputSchema:
  type: object
  properties:
    title: Website User Experience Survey Form
    pages:
    - id: 1
      name: user_experience_survey_form
      label: How was your overall experience with our website?
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Bad
      required: false
    - id: 2
      name: website_visit
      label: What is your favorite feature on our website?
      hint: null
      type: select_multiple
      options:
      - Homepage
      - About
      - Support
      - Blog
      required: false
    - id: 3
      name: website_navigation
      label: How easy is it to navigate our website?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: user_help
      label: Do you feel helped?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: feedback
      label: Do you have any feedback for us?
      hint: null
      type: note
      options: []
      required: false
