inputSchema:
  type: object
  properties:
    title: Spa Service Discovery Channel Survey
    pages:
    - id: 1
      name: spa_service_discovery_channel_survey
      label: What type of services do you offer?
      hint: null
      type: select_one
      options:
      - Massage
      - Haircut
      - Nail
      - Facial
      - Body treatments
      - Manicure
      - Pedicure
      required: false
    - id: 2
      name: spa_service_discovery_channel_survey_2
      label: How do you currently market your services?
      hint: null
      type: select_multiple
      options:
      - Social media
      - Online advertising
      - Word of mouth
      - Local advertising
      - Print media
      required: false
    - id: 3
      name: spa_service_discovery_channel_survey_3
      label: What is your average client base like?
      hint: null
      type: select_multiple
      options:
      - Demographics
      - Age
      - Gender
      - Location
      - Client base size
      - Average client satisfaction
      required: false
    - id: 4
      name: spa_service_discovery_channel_survey_4
      label: Which of the following platforms do you currently use to promote your
        business?
      hint: null
      type: select_multiple
      options:
      - Facebook
      - Instagram
      - Twitter
      - Email marketing
      - Text message
      - Other
      required: false
    - id: 5
      name: spa_service_discovery_channel_survey_5
      label: What percentage of your business do you attribute to social media marketing?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: spa_service_discovery_channel_survey_6
      label: What is the typical process that your clients go through in order to
        find out about your services?
      hint: null
      type: select_multiple
      options:
      - Online advertising
      - Word of mouth
      - Referral
      - Social media post
      - Local search
      - Newspaper/ magazine
      required: false
    - id: 7
      name: spa_service_discovery_channel_survey_7
      label: How much time do you spend on social media per week?
      hint: null
      type: select_one
      options:
      - Less than 5 hours
      - 5-10 hours
      - 10-15 hours
      - More than 15 hours
      required: false
    - id: 8
      name: spa_service_discovery_channel_survey_8
      label: How much time do you spend in person at events and marketing activities?
      hint: null
      type: select_one
      options:
      - Less than 5 hours
      - 5-10 hours
      - 10-15 hours
      - More than 15 hours
      required: false
    - id: 9
      name: spa_service_discovery_channel_survey_9
      label: Do you have any upcoming events or marketing activities?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: spa_service_discovery_channel_survey_10
      label: What is the typical time of year for your events?
      hint: null
      type: select_one
      options:
      - Winter
      - Spring
      - Summer
      - Autumn
      required: false
    - id: 11
      name: spa_service_discovery_channel_survey_11
      label: spa_service_discovery_channel_survey_11
      hint: null
      type: select_multiple
      options:
      - Spa day
      - New year
      - Summer
      - Spring break
      required: false
    - id: 12
      name: spa_service_discovery_channel_survey_12
      label: spa_service_discovery_channel_survey_12
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: spa_service_discovery_channel_survey_13
      label: spa_service_discovery_channel_survey_13
      hint: null
      type: select_multiple
      options:
      - Spa services offered
      - Services offered
      - Product/services offered
      - Services offered at a spa
      required: false
