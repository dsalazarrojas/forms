inputSchema:
  type: object
  properties:
    title: Artisan Delegation Impact Survey
    pages:
    - id: 1
      name: respondent_name
      label: Respondent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: artisan_group
      label: Artisan Group or Network Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: survey_date
      label: Survey Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: role
      label: Your Role in the Organization
      hint: null
      type: select_one
      options:
      - Leader
      - Member
      - Delegate
      - Partner
      - Supporter
      required: true
    - id: 5
      name: delegation_program
      label: Which Delegation Program
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: delegation_duration
      label: Delegation Duration - Months
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: impact_rating
      label: Rate Overall Impact - Scale 1-10
      hint: 1 = No Impact, 10 = Significant Impact
      type: number
      options: []
      required: true
    - id: 8
      name: economic_impact
      label: Economic Impact on Participants
      hint: null
      type: select_one
      options:
      - Increased Income
      - New Markets Accessed
      - Improved Skills
      - No Change
      - Negative Impact
      required: true
    - id: 9
      name: skill_development
      label: Skills Developed or Enhanced
      hint: null
      type: select_multiple
      options:
      - Leadership
      - Business Management
      - Marketing
      - Production Techniques
      - Negotiation
      - Networking
      required: false
    - id: 10
      name: challenges_faced
      label: Main Challenges Faced
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: sustainability
      label: Program Sustainability Outlook
      hint: null
      type: select_one
      options:
      - Very Likely to Continue
      - Likely
      - Uncertain
      - Unlikely
      - Not Sustainable
      required: false
    - id: 12
      name: success_factors
      label: Key Success Factors
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: improvements_suggested
      label: Suggested Improvements
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: recommendations
      label: Recommendations for Future Delegations
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: follow_up_interest
      label: Interest in Follow-up Interviews
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 16
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
