inputSchema:
  type: object
  properties:
    title: Customer Experience Evaluation
    pages:
    - id: 1
      name: introduction
      label: Welcome to the customer experience evaluation form
      hint: This form helps us to better understand your experience with our services
      type: text
      options: []
      required: true
    - id: 2
      name: rating
      label: How satisfied are you with our services
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 3
      name: comment
      label: What would you like to suggest
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: How would you like to be contacted
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: How would you like to be contacted?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: date
      label: When did you last visit us?
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: At what time did you last visit us?
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: note
      label: Any other comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: feedback
      label: Thank you for taking the time to help us improve
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 14
      name: contact_method
      label: Preferred contact method
      hint: You can also select multiple options if desired
      type: select_multiple
      options:
      - Phone
      - Email
      - Other (please specify)
      required: true
