inputSchema:
  type: object
  properties:
    title: Hub Management Feedback Survey
    pages:
    - id: 1
      name: survey_start
      label: Survey Start
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question_1
      label: What do you think of our services?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: question_2
      label: How can we improve our services?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: question_3
      label: Rate our services (1-5)
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: question_4
      label: How likely are you to recommend us?
      hint: null
      type: select_one
      options:
      - '{''text'': ''Very Likely''}'
      - '{''text'': ''Somewhat Likely''}'
      - '{''text'': ''Not Likely''}'
      required: true
    - id: 6
      name: question_5
      label: How would you rate our communication?
      hint: null
      type: select_multiple
      options:
      - '{''text'': ''Good''}'
      - '{''text'': ''Fair''}'
      - '{''text'': ''Poor''}'
      required: true
    - id: 7
      name: question_6
      label: When was your last interaction with us?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: question_7
      label: What time of day was your last interaction with us?
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: question_8
      label: Is there anything else you'd like to tell us?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: question_9
      label: Your Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: question_10
      label: Your Phone
      hint: null
      type: text
      options: []
      required: true
