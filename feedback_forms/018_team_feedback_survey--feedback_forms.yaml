    - id: 11
      name: collaboration_tools
      label: collaboration-tools
      hint: null
      type: select_multiple
      options:
      - Asana
      - Trello
      - Slack
      - Microsoft Teams
      required: false
    - id: 12
      name: work_satisfaction
      label: work-satisfaction
      hint: null
      type: select_one
      options:
      - Very dissatisfied
