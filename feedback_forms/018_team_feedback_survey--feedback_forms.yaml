      - Team members often share knowledge and ideas
      - Team members often help each other with work
      - Team members often communicate effectively
      required: false
    - id: 5
      name: problem_prophetsolving
      label: problem-solving
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: decision_making
      label: decision-making
      hint: null
      type: select_one
      options:
      - Top-down
      - Bottom-up
      - Both
