inputSchema:
  type: object
  properties:
    title: in-flight-service-request-form
    pages:
    - id: 1
      name: flight_number
      label: Flight Number
      hint: Enter flight number
      type: text
      options: []
      required: true
    - id: 2
      name: passenger_name
      label: Passenger Name
      hint: Enter passenger name
      type: text
      options: []
      required: true
    - id: 3
      name: request_type
      label: Request Type
      hint: Select type of request
      type: select_multiple
      options:
      - Urgent
      - Non Urgent
      - Other
      required: true
    - id: 4
      name: issue
      label: Issue Description
      hint: Describe your issue
      type: text
      options: []
      required: true
    - id: 5
      name: preferred_action
      label: Preferred Action
      hint: Select action to take
      type: select_one
      options:
      - Call Passenger
      - Call Passenger (If Available)
      - No Action
      required: true
    - id: 6
      name: follow_up
      label: Follow Up
      hint: Follow up action
      type: select_multiple
      options:
      - 15 min
      - 30 min
      - 1 hour
      - 1 hour 30 min
      - 2 hours
      - 3 hours
      - 4 hours
      - 5 hours
      - 6 hours
      - 7 hours
      - 8 hours
      required: false
    - id: 7
      name: note
      label: Additional Notes
      hint: Additional comments
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: Enter email
      type: email
      options: []
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: Enter phone number
      type: text
      options: []
      required: true
    - id: 10
      name: passenger_location
      label: Passenger Location
      hint: Enter passenger location
      type: text
      options: []
      required: false
    - id: 11
      name: crew_location
      label: Crew Location
      hint: Enter crew location
      type: text
      options: []
      required: false
    - id: 12
      name: flight_status
      label: Flight Status
      hint: Enter flight status
      type: select_one
      options:
      - On Board
      - Departed
      - Landed
      - Cancelled
      required: false
    - id: 13
      name: service_request_date
      label: Service Request Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: service_request_time
      label: Service Request Time
      hint: null
      type: time
      options: []
      required: true
    - id: 15
      name: customer_service_agent
      label: Customer Service Agent
      hint: Enter Customer Service Agent
      type: select_one
      options:
      - John Doe
      - Jane Doe
      required: false
    - id: 16
      name: customer_service_team
      label: Customer Service Team
      hint: null
      type: select_multiple
      options:
      - Service Team 1
      - Service Team 2
      required: false
    - id: 17
      name: customer_service_shift
      label: Customer Service Shift
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 18
      name: customer_service_status
      label: Service Status
      hint: null
      type: select_one
      options:
      - On Board
      - Departed
      - Landed
      - Cancelled
      required: false
    - id: 19
      name: customer_service_action
      label: Service Action
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: flight_number_2
      label: Flight Number 2
      hint: null
      type: text
      options: []
      required: false
    - id: 21
