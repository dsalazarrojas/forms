inputSchema:
  type: object
  properties:
    title: parent_teacher_meeting_feedback_questionnaire
    pages:
    - id: 1
      name: meeting_details
      label: Meeting Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: meeting_outcome
      label: Meeting Outcome
      hint: How would you rate this meeting's overall outcome?
      type: number
      options: []
      required: false
    - id: 3
      name: teacher_performance
      label: Teacher Performance
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: false
    - id: 4
      name: teacher_support
      label: Teacher Support
      hint: How well did the teacher explain the material in class?
      type: number
      options: []
      required: false
    - id: 5
      name: meeting_satisfaction
      label: Meeting Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: Is there anything else you would like to comment on this meeting?
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
