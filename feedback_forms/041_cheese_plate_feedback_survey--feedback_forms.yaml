        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: cheese_variety_rating_score
        label: Rating of Cheese Variety and Selection
        hint: null
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 6
        name: cheese_freshness_rating_score
        label: Rating of Freshness and Quality
        hint: null
        type: select_one
        options:
          - Very Fresh
          - Fresh
          - Average
          - Not Fresh
        required: true
      - id: 7
        name: plate_presentation_rating_score
        label: Rating of Plate Presentation / Aesthetics
        hint: null
        type: select_one
        options:
          - 5 - Stunning
          - 4 - Attractive
          - 3 - Standard
          - 2 - Unappealing
        required: true
