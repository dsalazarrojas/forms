          - Dried / Fresh Fruits
          - Candied Nuts
          - Artisan Crackers / Breads
          - Honey / Preserves
        required: false
      - id: 11
        name: portion_size_satisfaction_rating
        label: Were the portion sizes appropriate
        hint: null
        type: select_one
        options:
          - Just Right
          - Too Small
          - Too Large
        required: true
      - id: 12
        name: value_for_money_rating_score
