inputSchema:
  type: object
  properties:
    title: Coaching Feedback Form
    pages:
    - id: 1
      name: section_client_info
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: coach_name
      label: Coach Name
      hint: Name of the coach you worked with
      type: text
      options: []
      required: true
    - id: 5
      name: session_date
      label: Session Date
      hint: Date of the coaching session
      type: date
      options: []
      required: true
    - id: 6
      name: section_performance
      label: -- Performance and Progress --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: current_performance_level
      label: Your Current Performance Level
      hint: How well are you performing in your goal area?
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 8
      name: progress_since_last_session
      label: Progress Since Last Coaching Session
      hint: How much have you improved?
      type: select_one
      options:
      - Significant progress
      - Good progress
      - Some progress
      - Little progress
      - No progress
      required: true
