      name: session_usefulness
      label: How useful was this coaching session?
      hint: Rate the value of the session
      type: select_one
      options:
      - Very useful
      - Useful
      - Somewhat useful
      - Not useful
      required: true
    - id: 11
      name: clarity_of_guidance
      label: Clarity of Coach Guidance
      hint: Were the coach instructions clear?
      type: select_one
      options:
      - Very clear
      - Clear
      - Somewhat clear
      - Unclear
      required: true
    - id: 12
      name: actionable_advice
      label: Actionable Advice Provided
      hint: Could you implement the advice given?
      type: select_one
      options:
      - Very actionable
      - Actionable
