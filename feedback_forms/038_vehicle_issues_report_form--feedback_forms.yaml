inputSchema:
  type: object
  properties:
    title: vehicle_issues_report_form
    pages:
    - id: 1
      name: vehicle_details
      label: Vehicle Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: problem_description
      label: Problem Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: problem_type
      label: Problem Type
      hint: null
      type: select_one
      options:
      - Problem with Vehicle
      - Problem with Engine
      - Problem with Transmission
      required: false
    - id: 4
      name: problem_date
      label: Problem Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: problem_time
      label: Problem Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: vehicle_condition
      label: Vehicle Condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      - Bad
      required: false
    - id: 7
      name: vehicle_problem
      label: Vehicle Problem
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: vehicle_problem_2
      label: Vehicle Problem 2
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: vehicle_problem_3
      label: Vehicle Problem 3
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: vehicle_repair_history
      label: Vehicle Repair History
      hint: null
      type: text
      options: []
      required: false
