inputSchema:
  type: object
  properties:
    title: Charity Event Feedback Questionnaire
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: respondent_email
      label: Email Address
      hint: For follow-up
      type: email
      options: []
      required: false
    - id: 3
      name: event_attended
      label: Which Event Did You Attend
      hint: Event name
      type: text
      options: []
      required: true
    - id: 4
      name: attendance_date
      label: Date of Attendance
      hint: When you attended
      type: date
      options: []
      required: true
    - id: 5
      name: first_time_attendee
      label: Is this your first time attending
      hint: Attendance history
      type: select_one
      options:
      - Yes first time
      - No attended before
      - Regular attendee
      required: true
    - id: 6
      name: hear_about_event
      label: How did you hear about this event
      hint: Discovery method
      type: select_one
      options:
      - Social media
      - Email newsletter
      - Website
      - Friend or family
      - Print media
      - Radio or TV
      - Other
      required: true
    - id: 7
      name: registration_experience
      label: How was the registration experience
      hint: Sign-up process
      type: select_one
      options:
      - Very easy
      - Easy
      - Neutral
      - Difficult
      - Very difficult
      required: true
    - id: 8
      name: check_in_experience
      label: How was the check-in experience
      hint: Arrival process
      type: select_one
      options:
      - Very smooth
      - Smooth
      - Neutral
      - Problematic
      - Very problematic
      required: true
    - id: 9
      name: staff_friendliness
      label: How friendly was the staff
      hint: Staff interaction
      type: select_one
      options:
      - Very friendly
      - Friendly
      - Neutral
      - Unfriendly
      - Very unfriendly
      required: true
    - id: 10
      name: cause_importance
      label: How important is the cause to you
      hint: Personal connection
      type: select_one
      options:
      - Very important
      - Important
      - Somewhat important
      - Not very important
      - Not important
      required: true
    - id: 11
      name: fundraising_effectiveness
      label: How effective was the fundraising
      hint: Fundraising activities
      type: select_one
      options:
      - Very effective
      - Effective
      - Neutral
      - Ineffective
      - Very ineffective
      required: true
    - id: 12
      name: donation_likelihood
      label: How likely to donate in the future
      hint: Future giving
      type: select_one
      options:
      - Very likely
      - Likely
      - Neutral
      - Unlikely
      - Very unlikely
      required: true
    - id: 13
      name: volunteer_interest
      label: Interested in volunteering
      hint: Future involvement
      type: select_one
      options:
      - Yes definitely
      - Maybe
      - 'False'
      required: true
    - id: 14
      name: event_rating
      label: Overall Event Rating
      hint: 1 to 5 scale
      type: select_one
      options:
      - 5 stars - Excellent
      - 4 stars - Good
      - 3 stars - Average
      - 2 stars - Poor
      - 1 star - Very poor
      required: true
    - id: 15
      name: suggestions
      label: Suggestions for Improvement
      hint: Your ideas
      type: text
      options: []
      required: false
    - id: 16
      name: additional_comments
      label: Additional Comments
      hint: Anything else
      type: text
      options: []
      required: false
