inputSchema:
  type: object
  properties:
    title: Fashion Show Feedback Form
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: time_slot
      label: Time Slot
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: fashion_show_name
      label: Fashion Show Name
      hint: Enter the name of the fashion show
      type: text
      options: []
      required: true
    - id: 4
      name: feedback_question_1
      label: How would you rate the overall quality of the event?
      hint: null
      type: select_one
      options:
      - excellent
      - very good
      - good
      - neutral
      - bad
      - very bad
      required: true
    - id: 5
      name: feedback_question_2
      label: How would you rate the organization of the event?
      hint: null
      type: select_one
      options:
      - excellent
      - very good
      - good
      - neutral
      - bad
      - very bad
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: Enter any additional comments or suggestions
      type: text
      options: []
      required: false
    - id: 7
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 9
      name: feedback_question_3
      label: Was the event value for money?
      hint: null
      type: select_one
      options:
      - excellent
      - very good
      - good
      - neutral
      - bad
      - very bad
      required: true
    - id: 10
      name: feedback_question_4
      label: How likely are you to attend another fashion event like this in the future?
      hint: null
      type: select_one
      options:
      - excellent
      - very good
      - good
      - neutral
      - bad
      - very bad
      required: true
    - id: 11
      name: feedback_question_5
      label: Was there anything we did well?
      hint: null
      type: select_multiple
      options:
      - excellent
      - very good
      - good
      - neutral
      - bad
      - very bad
      required: false
