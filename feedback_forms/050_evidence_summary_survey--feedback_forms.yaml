inputSchema:
  type: object
  properties:
    title: Evidence Summary Survey
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: evidence_selection
      label: Select Relevant Evidence or Findings
      hint: Select the relevant evidence or findings for this survey
      type: select_multiple
      options:
      - Evidence of a positive impact
      - Evidence of no impact
      - None of the above
      required: false
    - id: 3
      name: summary_statement
      label: Summary of Findings or Evidence
      hint: Provide a brief summary of the findings or evidence
      type: text
      options: []
      required: false
    - id: 4
      name: impact_statement
      label: Impact Statement
      hint: Describe the impact of the findings or evidence on the outcome
      type: text
      options: []
      required: false
    - id: 5
      name: recommendation
      label: Recommendation
      hint: If applicable, provide recommendations for future action or further investigation
      type: text
      options: []
      required: false
    - id: 6
      name: evidence_statement
      label: Detailed Description of Evidence or Findings
      hint: Provide a detailed description of the evidence or findings
      type: text
      options: []
      required: false
    - id: 7
      name: reference_statement
      label: Reference or Citation
      hint: Provide a reference or citation for the evidence or findings
      type: text
      options: []
      required: false
    - id: 8
      name: other_statement
      label: Other
      hint: Other (please specify)
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - other
      required: false
    - id: 10
      name: participant_info_general
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: participant_info_tool
      label: Participant Info Tool
      hint: null
      type: text
      options: []
      required: false
