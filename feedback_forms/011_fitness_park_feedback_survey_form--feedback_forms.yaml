inputSchema:
  type: object
  properties:
    title: Fitness Park Feedback Survey Form
    pages:
    - id: 1
      name: fitness_park_feedback
      label: Fitness Park Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: fitness_park_equipment
      label: Equipment
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: fitness_park_cleanliness
      label: Cleanliness
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: fitness_park_overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: true
    - id: 5
      name: fitness_park_ratings
      label: Ratings
      hint: null
      type: text
      options: []
      required: false
