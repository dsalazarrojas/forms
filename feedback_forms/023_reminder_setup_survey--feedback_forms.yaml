inputSchema:
  type: object
  properties:
    title: Reminder Setup Survey
    pages:
    - id: 1
      name: client_preferences
      label: client_preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: notification_method
      label: notification_method
      hint: null
      type: select_one
      options:
      - email
      - phone
      - text
      required: false
    - id: 3
      name: reminder_time
      label: reminder_time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: end_date
      label: end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: frequency
      label: frequency
      hint: null
      type: select_multiple
      options:
      - daily
      - weekly
      - monthly
      required: false
    - id: 7
      name: notification_frequency
      label: notification_frequency
      hint: null
      type: select_one
      options:
      - never
      - every day
      - every week
      - every month
      required: false
    - id: 8
      name: reminder_message
      label: reminder_message
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: reminder_note
      label: reminder_note
      hint: null
      type: note
      options: []
      required: false
