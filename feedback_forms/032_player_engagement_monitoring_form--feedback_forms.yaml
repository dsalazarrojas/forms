inputSchema:
  type: object
  properties:
    title: player_engagement_monitoring_form
    pages:
    - id: 1
      name: player_name
      label: Player Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: role
      label: Role
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: training_session_date
      label: Training Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: training_session_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
      hint: Select a rating from 1 to 10
      type: number
      options: []
      required: false
    - id: 6
      name: rating_comment
      label: Rating Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: player_satisfaction
      label: Player Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 9
      name: session_notes
      label: Session Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submit_button_label
      label: Submit
      hint: null
      type: text
      options: []
      required: false
