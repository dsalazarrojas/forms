inputSchema:
  type: object
  properties:
    title: Reception Service Feedback Questionnaire
    pages:
    - id: 1
      name: reception_service_feedback_questionnaire
      label: Reception Service Feedback Questionnaire
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: reception_service_rating
      label: How would you rate our Reception Service?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: reception_service_suggestions
      label: Do you have any suggestions or complaints about our Reception Service?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: reception_service_satisfaction
      label: How satisfied are you with our Reception Service?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 5
      name: reception_service_frequent_use
      label: How many times have you used our Reception Service?
      hint: null
      type: select_multiple
      options:
      - Once
      - Multiple Times
      - Never
      required: false
    - id: 6
      name: reception_service_favourite
      label: Is your Reception Service one of your favourite services?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: reception_service_improve
      label: How can we improve our Reception Service?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: reception_service_comment
      label: Do you have any additional comments about our Reception Service?
      hint: null
      type: text
      options: []
      required: false
