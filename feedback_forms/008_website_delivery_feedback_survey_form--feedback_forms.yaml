inputSchema:
  type: object
  properties:
    title: website_delivery_feedback_survey_form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 7
      name: rating_options
      label: How did we do?
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Good
      - Poor
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
