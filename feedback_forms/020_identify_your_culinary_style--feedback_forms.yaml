inputSchema:
  type: object
  properties:
    title: Identify Your Culinary Style
    pages:
    - id: 1
      name: cuisines
      label: Favorite cuisines
      hint: Select your preferred cuisines
      type: select_multiple
      options:
      - Italian
      - Chinese
      - Indian
      - Japanese
      - Mexican
      - French
      - Middle Eastern
      - Thai
      required: false
    - id: 2
      name: cooking_techniques
      label: Cooking techniques
      hint: Select your preferred cooking techniques
      type: select_one
      options:
      - Grilling
      - Frying
      - Baking
      - Boiling
      - Steaming
      required: false
    - id: 3
      name: dish_types
      label: Favorite dish types
      hint: Select your preferred dish types
      type: select_one
      options:
      - Salads
      - Soups
      - Casseroles
      - Stir-fries
      - Curries
      required: false
    - id: 4
      name: flavor_profiles
      label: Preferred flavors
      hint: Select your preferred flavors
      type: select_one
      options:
      - Spicy
      - Sweet
      - Salty
      - Sour
      - Sour-sweet
      - Salty-sweet
      required: false
