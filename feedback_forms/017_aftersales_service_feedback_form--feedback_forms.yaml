inputSchema:
  type: object
  properties:
    title: Aftersales Service Feedback Form
    pages:
    - id: 1
      name: service_overview
      label: -- Service Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer name
      hint: Name of the person providing feedback
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact email
      hint: Optional email for follow up
      type: email
      options: []
      required: false
    - id: 4
      name: product_purchased
      label: Product purchased
      hint: Product related to aftersales service
      type: text
      options: []
      required: true
    - id: 5
      name: service_date
      label: Service date
      hint: Date when aftersales service occurred
      type: date
      options: []
      required: true
    - id: 6
      name: satisfaction_rating
      label: Overall satisfaction rating
      hint: Select the level of satisfaction
      type: select_one
      options: [Very satisfied, Satisfied, Neutral, Dissatisfied, Very dissatisfied]
      required: true
    - id: 7
      name: timeliness
      label: Timeliness of service
      hint: Was service completed in expected timeframe
      type: select_one
      options: [On time, Slight delay, Major delay]
      required: true
    - id: 8
      name: technician_professionalism
      label: Technician professionalism
      hint: Rate conduct and communication
      type: select_one
      options: [Excellent, Good, Fair, Poor]
      required: true
    - id: 9
      name: resolution_status
      label: Was the issue resolved
      hint: Current status after service
      type: select_one
      options: [Resolved, Partially resolved, Not resolved]
      required: true
    - id: 10
      name: comments
      label: Additional comments
      hint: Suggestions or concerns
      type: text
      options: []
      required: false
