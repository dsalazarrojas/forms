inputSchema:
  type: object
  properties:
    title: Service Non Renewal Feedback Survey
    pages:
    - id: 1
      name: service_cancellation_reason
      label: Service Cancellation Reason
      hint: null
      type: select_multiple
      options:
      - Reason 1
      - Reason 2
      - Reason 3
      required: true
    - id: 2
      name: cancellation_date
      label: Non Renewal Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 4
      name: suggestion
      label: Suggestion
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: E mail
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
