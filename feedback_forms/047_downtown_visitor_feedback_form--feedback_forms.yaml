      name: feedback_category
      label: Feedback Category
      hint: null
      type: select_multiple
      options:
      - Parking
      - Cleanliness
      - Accessibility
      - Other
      required: true
    - id: 2
      name: visitor_name
      label: Visitor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: visitor_message
      label: Visitor Message
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_visited
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: false
