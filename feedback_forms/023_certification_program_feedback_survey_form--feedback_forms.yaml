        hint: How was the program workload
        type: select_one
        options:
          - Too light
          - Appropriate
          - Too heavy
        required: true
      - id: 14
        name: pace_assessment
        label: Pace Assessment
        hint: How was the program pace
        type: select_one
        options:
          - Too slow
          - Appropriate
          - Too fast
        required: true
      - id: 15
        name: skill_improvement
        label: Skill Improvement
        hint: How much did your skills improve
        type: select_one
        options:
          - Significantly improved
          - Moderately improved
          - Slightly improved
          - No improvement
        required: true
      - id: 16
        name: exam_preparation
        label: Exam Preparation
        hint: How well did the program prepare you for the certification exam
        type: select_one
        options:
          - Extremely well
          - Very well
          - Adequately
          - Poorly
          - Did not include exam prep
