inputSchema:
  type: object
  properties:
    title: Certification Program Feedback Survey Form
    pages:
      - id: 1
        name: survey_date
        label: Survey Date
        hint: Date of feedback submission
        type: date
        options: []
        required: true
      - id: 2
        name: participant_name
        label: Participant Name
        hint: Your full name
        type: text
        options: []
        required: false
      - id: 3
        name: participant_email
        label: Email Address
        hint: Email for follow-up
        type: email
        options: []
        required: false
      - id: 4
        name: certification_program
        label: Certification Program
        hint: Which program did you complete
        type: text
        options: []
        required: true
      - id: 5
        name: program_completion_date
        label: Program Completion Date
        hint: When did you complete the program
        type: date
        options: []
        required: true
      - id: 6
        name: program_duration
        label: Program Duration
        hint: How long was the program
        type: select_one
        options:
          - Less than 1 week
          - 1-2 weeks
          - 3-4 weeks
          - 1-3 months
          - 3-6 months
          - More than 6 months
        required: true
      - id: 7
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: How satisfied were you with the program
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 8
        name: content_quality
        label: Content Quality
        hint: Rate the quality of program content
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: content_relevance
        label: Content Relevance
        hint: How relevant was the content to your goals
        type: select_one
        options:
          - Extremely relevant
          - Very relevant
          - Somewhat relevant
          - Not very relevant
          - Not relevant at all
        required: true
      - id: 10
        name: instructor_effectiveness
        label: Instructor Effectiveness
        hint: Rate the effectiveness of instructors
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
          - No instructor
        required: true
      - id: 11
        name: materials_quality
        label: Materials Quality
        hint: Rate the quality of learning materials
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
        required: true
      - id: 12
        name: platform_usability
        label: Platform Usability
        hint: Rate the ease of using the learning platform
        type: select_one
        options:
          - Excellent
          - Very good
          - Good
          - Fair
          - Poor
        required: true
      - id: 13
        name: workload_assessment
