inputSchema:
  type: object
  properties:
    title: Panel Interview Feedback Form
    pages:
    - id: 1
      name: panel_interview_feedback_form
      label: Feedback
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: interviewer_name
      label: Interviewer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: candidate_name
      label: Candidate Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: candidate_position
      label: Candidate Position
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: panelist_name
      label: Panelist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_interview
      label: Date of Interview
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: interview_start_time
      label: Interview Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: interview_end_time
      label: Interview End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: feedback_questions
      label: Feedback Questions
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 10
      name: feedback_score
      label: Feedback Score
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 13
      name: recommendation
      label: Recommendation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
