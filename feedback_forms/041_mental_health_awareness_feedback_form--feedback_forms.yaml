inputSchema:
  type: object
  properties:
    title: Mental Health Awareness Feedback Form
    pages:
    - id: 1
      name: mental_health_form_1
      label: What do you think about this form?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_professional
      label: Have you been a mental health professional?
      hint: null
      type: select_one
      options:
      - Psychiatrist
      - Psychologist
      - Counselor
      - Social Worker
      - Other
      required: false
    - id: 3
      name: mental_health_concerns
      label: What mental health concerns do you have?
      hint: null
      type: select_multiple
      options:
      - Anxiety
      - Depression
      - Bipolar Disorder
      - Attention Deficit Hyperactivity Disorder (ADHD)
      - Other
      required: false
    - id: 4
      name: feedback
      label: Additional feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_method
      label: Preferred method of contact
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: mental_health_professionals_other
      label: Other mental health professionals
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: experiences
      label: Can you describe your mental health experiences?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: received_help
      label: Have you received help from a mental health professional?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: stay_in_touch
      label: Preferred way of staying in touch
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Mail
      required: false
    - id: 10
      name: suggestions
      label: Comments or suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: recent_visit
      label: Date of last visit
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
