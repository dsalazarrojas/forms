inputSchema:
  type: object
  properties:
    title: Nail Studio Clean Beauty Interest Survey
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: nail_type
      label: Nail Type
      hint: null
      type: select_one
      options:
      - French
      - Acrylic
      - Gel
      - Dip
      - Naked
      required: true
    - id: 3
      name: nail_product
      label: Nail Product
      hint: null
      type: select_one
      options:
      - Lacquer
      - Gel Polish
      - Dip Powder
      - Nail Art
      - Other
      required: true
    - id: 4
      name: nail_color
      label: Nail Color
      hint: null
      type: select_multiple
      options:
      - Red
      - Pink
      - Purple
      - Blue
      - Green
      - Yellow
      - Orange
      - Black
      - White
      - Brown
      required: true
    - id: 5
      name: nail_solution
      label: Nail Solution
      hint: null
      type: select_one
      options:
      - Base Coat
      - Top Coat
      - Cleanser
      - Remover
      - Moisturizer
      required: true
    - id: 6
      name: nail_beauty_trends
      label: Nail Beauty Trends
      hint: null
      type: select_multiple
      options:
      - Natural and Organic
      - Sustainable and Eco-Friendly
      - Innovative and Trendy
      - Other
      required: false
    - id: 7
      name: nail_satisfaction
      label: Nail Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: nail_comments
      label: Nail Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_info
      label: Contact Info
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: contact_address
      label: Contact Address
      hint: null
      type: text
      options: []
      required: false
