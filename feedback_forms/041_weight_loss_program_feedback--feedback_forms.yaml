inputSchema:
  type: object
  properties:
    title: Weight Loss Program Feedback
    pages:
    - id: 1
      name: introduction
      label: How did you hear about this program?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: program_name
      label: Weight loss program
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: program_length
      label: How long did you participate in the program?
      hint: null
      type: select_one
      options:
      - 2 weeks
      - 4 weeks
      - 6 weeks
      - 8 weeks
      - 12 weeks
      required: false
    - id: 4
      name: program_type
      label: What type of program did you participate in?
      hint: null
      type: select_multiple
      options:
      - Online
      - In-person
      - Hybrid
      - Virtual
      required: false
    - id: 5
      name: program_rating
      label: How would you rate your overall experience?
      hint: null
      type: select_one
      options:
      - 1/5
      - 2/5
      - 3/5
      - 4/5
      - 5/5
      required: false
    - id: 6
      name: rating_comment
      label: Why did you rate your experience this way?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: feedback_comments
      label: What were your thoughts about your experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: rating_satisfied
      label: Were you satisfied with your experience?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 9
      name: rating_reasons
      label: Why did you feel this way?
      hint: null
      type: select_multiple
      options:
      - Lack of time
      - Cost was too high
      - Program was too difficult
      - Too many commitments
      - Other (please specify in the box below)
      required: false
    - id: 10
      name: other_reasons
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: program_improvements
      label: What could we improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: additional_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
