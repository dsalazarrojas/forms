inputSchema:
  type: object
  properties:
    title: Group Project Feedback Form
    pages:
    - id: 1
      name: overall_satisfaction
      label: How do you feel about the project overall?
      hint: Rate your overall satisfaction with the project.
      type: number
      options: []
      required: true
    - id: 2
      name: project_title
      label: What do you think about the project title?
      hint: Provide your thoughts about the project title.
      type: text
      options: []
      required: true
    - id: 3
      name: session_id
      label: What is your session ID?
      hint: Please provide your session ID for reference.
      type: number
      options: []
      required: true
    - id: 4
      name: feedback_question_1
      label: What did you like most about the project?
      hint: Briefly describe what you liked most about the project.
      type: text
      options: []
      required: true
    - id: 5
      name: feedback_question_2
      label: What did you like least about the project?
      hint: Briefly describe what you liked least about the project.
      type: text
      options: []
      required: true
    - id: 6
      name: rating_scale
      label: How would you rate this project?
      hint: Rate this project on a scale of 1-5.
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 7
      name: feedback_question_3
      label: Do you have any suggestions for improvement?
      hint: Provide any suggestions you have for improving the project.
      type: text
      options: []
      required: true
    - id: 8
      name: overall_satisfaction_2
      label: How satisfied are you with the project?
      hint: Rate your overall satisfaction with the project.
      type: number
      options: []
      required: false
    - id: 9
      name: overall_satisfaction_3
      label: Overall Satisfaction 3
      hint: Rate your overall satisfaction with the project.
      type: number
      options: []
      required: false
    - id: 10
      name: feedback_question_4
      label: What did you find most helpful about the project?
      hint: Briefly describe what you found most helpful about the project.
      type: text
      options: []
      required: false
    - id: 11
      name: feedback_question_5
      label: What did you find least helpful about the project?
      hint: Briefly describe what you found least helpful about the project.
      type: text
      options: []
      required: false
    - id: 12
      name: feedback_question_6
      label: Do you have any other feedback about the project?
      hint: Provide any additional feedback about the project.
      type: text
      options: []
      required: false
