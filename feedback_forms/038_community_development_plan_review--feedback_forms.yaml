inputSchema:
  type: object
  properties:
    title: Development Plan Review
    pages:
      - id: 1
        name: reviewer_name
        label: Reviewer name
        hint: Optional for anonymous feedback
        type: text
        options: []
        required: false
      - id: 2
        name: plan_section
        label: Plan section being reviewed
        hint: e g transportation housing design
        type: text
        options: []
        required: true
      - id: 3
        name: clarity_of_plan
        label: Clarity of plan content
        hint: Rate clarity from very clear to very unclear
        type: select_one
        options:
          - Very clear
          - Clear
          - Somewhat unclear
          - Very unclear
        required: true
      - id: 4
        name: concerns
        label: Concerns or potential issues
        hint: Describe any issues identified
        type: text
        options: []
        required: false
      - id: 5
        name: suggested_changes
        label: Suggested changes or improvements
        hint: Recommendations for revision
        type: text
        options: []
        required: false
      - id: 6
        name: recommendation
        label: Recommendation for approval
        hint: Approve with changes or reject
        type: select_one
        options:
          - Approve
          - Approve with changes
          - Do not approve
        required: true
