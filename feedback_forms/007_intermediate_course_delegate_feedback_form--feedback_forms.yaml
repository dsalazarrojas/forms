inputSchema:
  type: object
  properties:
    title: Intermediate Course Delegate Feedback Form
    pages:
    - id: 1
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_provider
      label: Course Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: course_type
      label: Course Type
      hint: null
      type: select_one
      options:
      - Label1
      - Label2
      - Label3
      required: false
    - id: 4
      name: course_level
      label: Course Level
      hint: null
      type: select_one
      options:
      - Label1
      - Label2
      - Label3
      required: true
    - id: 5
      name: course_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: course_end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: feedback_score
      label: Feedback Score
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: feedback_text
      label: Feedback Text
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: course_status
      label: Course Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 10
      name: course_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
