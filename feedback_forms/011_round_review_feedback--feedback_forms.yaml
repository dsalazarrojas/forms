inputSchema:
  type: object
  properties:
    title: Round Review Feedback
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_id
      label: Event Id
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: rating_scale
      label: Rating Scale
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Poor
      - Not at all
      required: false
    - id: 4
      name: comment
      label: Comment
      hint: null
      type: text
      options: []
      required: false
