inputSchema:
  type: object
  properties:
    title: University Curriculum Effectiveness Review Evaluation Form
    pages:
    - id: 1
      name: program_id
      label: Program ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: program_name
      label: program name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: department_name
      label: department name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: program_type
      label: program type
      hint: null
      type: select_one
      options:
      - Bachelors
      - Masters
      - Doctoral
      required: true
    - id: 5
      name: academic_year
      label: academic year
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: feedback_score
      label: feedback score
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: feedback_comment
      label: feedback comment
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: additional comments
      hint: null
      type: text
      options: []
      required: false
