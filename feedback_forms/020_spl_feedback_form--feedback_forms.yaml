inputSchema:
  type: object
  properties:
    title: SPL Feedback Form
    pages:
    - id: 1
      name: general_performance
      label: Feedback on general performance
      hint: Provide your comments on overall performance.
      type: text
      options: []
      required: true
    - id: 2
      name: specific_skills
      label: Feedback on specific skills
      hint: Select the skills you'd like to give feedback on.
      type: select_multiple
      options:
      - Strengths
      - Weaknesses
      - Other
      required: true
    - id: 3
      name: date
      label: Date of performance
      hint: When did this performance occur?
      type: date
      options: []
      required: true
    - id: 4
      name: time
      label: Time of performance
      hint: What time did this performance occur?
      type: time
      options: []
      required: false
    - id: 5
      name: goals
      label: Goals
      hint: What are your goals for this performance?
      type: text
      options: []
      required: true
    - id: 6
      name: note
      label: Additional comments
      hint: Is there anything else you'd like to mention?
      type: note
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone number
      hint: Leave your phone number for follow-up.
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: Submit your feedback.
      type: text
      options: []
      required: true
    - id: 9
      name: select_category
      label: Select Category
      hint: Select a category for feedback
      type: select_one
      options:
      - Soccer
      - Basketball
      - Tennis
      - Volleyball
      required: true
