inputSchema:
  type: object
  properties:
    title: Altitude Attainment Feedback Survey
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_training
      label: Date of Training
      type: date
      options: []
      required: true
    - id: 3
      name: program_name
      label: Program Name
      type: select_one
      options:
      - Leadership Development
      - Technical Skills Workshop
      - Team Building Retreat
      - Communication Mastery
      - Strategic Planning Session
      required: true
    - id: 4
      name: overall_satisfaction
      label: Overall Satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 5
      name: instructor_rating
      label: Instructor Rating
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 6
      name: content_relevance
      label: Content Relevance
      hint: How relevant was the training content to your job?
      type: select_one
      options:
      - Highly Relevant
      - Relevant
      - Somewhat Relevant
      - Not Relevant
      required: true
    - id: 7
      name: key_takeaways
      label: Key Takeaways
      hint: Please list 1-3 key things you learned.
      type: text
      options: []
      required: false
    - id: 8
      name: facility_feedback
      label: Facility Feedback
      hint: Comments on the venue, equipment, or food.
      type: text
      options: []
      required: false
    - id: 9
      name: suggestions_improvement
      label: Suggestions for Improvement
      type: text
      options: []
      required: false
    - id: 10
      name: would_recommend
      label: Would you recommend this training to a colleague?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
