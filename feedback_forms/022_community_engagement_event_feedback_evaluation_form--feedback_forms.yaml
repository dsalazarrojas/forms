inputSchema:
  type: object
  properties:
    title: Community Engagement Event Feedback Evaluation Form
    pages:
      - id: 1
        name: attendee_name
        label: Name (Optional)
        hint: Your name if you wish to share
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: For follow-up communications
        type: email
        options: []
        required: false
      - id: 3
        name: event_name
        label: Event Name
        hint: Which event did you attend?
        type: text
        options: []
        required: true
      - id: 4
        name: event_date
        label: Event Date
        hint: When was the event?
        type: date
        options: []
        required: true
      - id: 5
        name: attendance_type
        label: How Did You Attend
        hint: In person or virtual?
        type: select_one
        options:
          - In Person
          - Virtual
          - Hybrid
        required: true
      - id: 6
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall experience
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 7
        name: event_organization
        label: Event Organization
        hint: Rate the organization
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 8
        name: content_quality
        label: Content Quality
        hint: Rate the event content
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: speaker_quality
        label: Speaker or Presenter Quality
        hint: Rate the speakers
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Applicable
        required: true
      - id: 10
        name: venue_quality
        label: Venue Quality
        hint: Rate the venue
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Applicable
        required: true
      - id: 11
        name: networking_opportunities
        label: Networking Opportunities
        hint: Rate networking chances
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 12
        name: value_for_time
        label: Value for Time Spent
        hint: Was it worth your time?
        type: select_one
        options:
          - Excellent Value
          - Good Value
          - Fair Value
          - Poor Value
        required: true
      - id: 13
        name: highlight_favorite
        label: Favorite Part of Event
        hint: What did you enjoy most?
        type: text
        options: []
        required: false
      - id: 14
        name: areas_for_improvement
        label: Areas for Improvement
        hint: What could be better?
        type: text
        options: []
        required: false
      - id: 15
        name: learned_something
        label: Did You Learn Something New
        hint: Was the event educational?
        type: select_one
        options:
          - Yes, A Lot
          - Yes, Some
          - Not Really
          - No
        required: true
      - id: 16
        name: would_attend_again
        label: Would You Attend Again
        hint: Will you come to future events?
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Maybe
          - Probably No
          - Definitely No
        required: true
      - id: 17
        name: recommend_to_others
        label: Would You Recommend to Others
        hint: Likelihood to recommend
        type: select_one
        options:
          - Very Likely
          - Likely
          - Neutral
          - Unlikely
          - Very Unlikely
        required: true
      - id: 18
        name: future_topics
        label: Topics for Future Events
        hint: What would you like to see?
        type: text
        options: []
        required: false
      - id: 19
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
