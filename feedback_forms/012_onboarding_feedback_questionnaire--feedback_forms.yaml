      - Neither Satisfied nor Unsatisfied
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 20
      name: manager_name_5
      label: What are your comments on your onboarding experience with your manager?
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: onboarding_length_2
      label: What is your onboarding length?
      hint: null
      type: number
      options: []
      required: false
    - id: 22
      name: manager_name_6
      label: Manager Name 6
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neither Satisfied nor Unsatisfied
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 23
      name: email_3
      label: Email 3
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: email_4
      label: Email 4
      hint: null
      type: email
      options: []
      required: false
    - id: 25
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
