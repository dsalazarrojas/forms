inputSchema:
  type: object
  properties:
    title: Onboarding Feedback Questionnaire
    pages:
    - id: 1
      name: onboarding_first_impressions
      label: What were your first impressions of our company culture?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: onboarding_process
      label: How did you feel about the onboarding process?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: onboarding_expectations
      label: What were your expectations before joining the company, and how were
        they met?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: feedback_manager
      label: Who would you like to give feedback to about your onboarding experience?
      hint: null
      type: select_one
      options:
      - Manager 1
      - Manager 2
      - Manager 3
      - Manager 4
      - Manager 5
      required: false
    - id: 5
      name: onboarding_experience
      label: Rate your overall experience with the onboarding process.
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neither Satisfied nor Unsatisfied
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 6
      name: feedback_frequency
      label: How frequently do you give feedback to your manager?
      hint: null
      type: select_one
      options:
      - Never
      - Occasionally
      - Frequently
      - Daily
      required: false
    - id: 7
      name: next_steps
      label: What actions would you like to see taken as a result of your feedback?
      hint: null
      type: select_multiple
      options:
      - Send email
      - Create task
      - Create issue
      - None
      required: false
    - id: 8
      name: onboarding_length
      label: What are your thoughts on the length of the onboarding process?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: onboarding_date
      label: What is your onboarding date?
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: manager_score
      label: Rate your satisfaction with your manager's feedback.
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neither Satisfied nor Unsatisfied
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 11
      name: employee_score
      label: Rate your satisfaction with your own feedback.
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neither Satisfied nor Unsatisfied
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 12
      name: overall_experience
      label: How satisfied are you with your overall experience on the company?
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neither Satisfied nor Unsatisfied
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 13
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: email_2
      label: How frequently do you use email to give feedback?
      hint: null
      type: select_one
      options:
      - Never
      - Occasionally
      - Frequently
      - Daily
      required: false
    - id: 15
      name: email_comments
      label: What are your comments on email?
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: manager_name
      label: What is your manager's name?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: manager_name_2
      label: How would you rate the length of time you have spent onboarding?
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: manager_name_3
      label: Manager Name 3
      hint: null
