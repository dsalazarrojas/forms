inputSchema:
  type: object
  properties:
    title: Gym Class Participation Motivation Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendance_frequency
      label: How often do you attend gym class?
      hint: null
      type: select_one
      options:
      - Gym Class Regularly
      - Rarely
      - Never
      required: false
    - id: 3
      name: motivation_level
      label: What motivates you to attend gym class?
      hint: null
      type: select_multiple
      options:
      - Enjoy physical activity
      - Improve physical fitness
      - Improve mental well-being
      - Other (please specify)
      required: false
    - id: 4
      name: satisfaction_level
      label: How satisfied are you with the gym class experience?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: feedback
      label: Any other comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: other_comments
      label: Other comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_tool
      label: Assigned tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
