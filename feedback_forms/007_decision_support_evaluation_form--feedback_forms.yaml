inputSchema:
  type: object
  properties:
    title: decision_support_evaluation_form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: section_1
      label: Section 1
      hint: null
      type: select_one
      options:
      - I strongly agree
      - I somewhat agree
      - I neither agree nor disagree
      - I somewhat disagree
      - I strongly disagree
      required: false
    - id: 3
      name: question_1
      label: How satisfied are you with the decision support?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 4
      name: time_of_interaction
      label: What is the time you first interacted with this service?
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: experience_description
      label: Briefly describe your experience with this service
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: time_spent
      label: How much time did you spend on this interaction?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: frequency
      label: How often will you use this service in the future?
      hint: null
      type: select_multiple
      options:
      - Very often
      - Somewhat often
      - Rarely
      - Never
      required: false
    - id: 8
      name: usage_frequency
      label: How many times have you used this service?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: past_experience
      label: Have you ever used this service before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: feedback
      label: Additional feedback or suggestions?
      hint: null
      type: text
      options: []
      required: false
