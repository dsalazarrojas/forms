      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_to
      label: Assigned to
      hint: null
      type: select_multiple
      options:
      - Team A
      - Team B
      - Team C
      - Team D
      required: false
