    - id: 6
      name: client_satisfaction
      label: Client Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: agent_feedback
      label: Agent Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: agent_satisfaction
      label: Agent Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: transaction_agent_communication
      label: Transaction Agent Communication
      hint: How would you rate the communication with the transaction agent?
      type: select_multiple
      options:
      - Good
      - Bad
      required: false
    - id: 10
      name: transaction_agent_availability
      label: Transaction Agent Availability
      hint: null
