inputSchema:
  type: object
  properties:
    title: Adult Interaction Feedback Form
    pages:
    - id: 1
      name: feedback_date
      label: Feedback Date
      hint: Date when the interaction occurred
      type: date
      options: []
      required: true
    - id: 2
      name: interaction_type
      label: Type of Interaction
      hint: Select the type of interaction that took place
      type: select_one
      options:
      - Meeting
      - Phone Call
      - Email Exchange
      - Video Conference
      - In-Person Conversation
      required: true
    - id: 3
      name: interaction_participants
      label: Participants Involved
      hint: Names of individuals involved in the interaction
      type: text
      options: []
      required: true
    - id: 4
      name: interaction_purpose
      label: Purpose of Interaction
      hint: Brief description of why the interaction occurred
      type: text
      options: []
      required: true
    - id: 5
      name: communication_quality_rating
      label: Communication Quality Rating
      hint: Rate the overall quality of communication on a scale of 1-5
      type: number
      options: []
      required: true
    - id: 6
      name: active_listening_observed
      label: Active Listening Observed
      hint: Did the participants demonstrate active listening skills
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Partially
      required: false
    - id: 7
      name: communication_strengths
      label: Communication Strengths
      hint: What aspects of the interaction were particularly effective
      type: text
      options: []
      required: false
    - id: 8
      name: improvement_areas
      label: Areas for Improvement
      hint: What could be improved in future interactions
      type: text
      options: []
      required: false
    - id: 9
      name: resolution_achieved
      label: Resolution Achieved
      hint: Was the purpose of the interaction successfully resolved
      type: select_one
      options:
      - Fully Resolved
      - Partially Resolved
      - Not Resolved
      - N/A
      required: false
    - id: 10
      name: follow_up_needed
      label: Follow Up Needed
      hint: Is follow-up action required after this interaction
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - TBD
      required: false
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: Any other observations or feedback about the interaction
      type: text
      options: []
      required: false
