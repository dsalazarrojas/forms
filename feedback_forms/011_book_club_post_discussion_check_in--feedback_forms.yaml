inputSchema:
  type: object
  properties:
    title: Book Club Post Discussion Check In
    pages:
      - id: 1
        name: member_name
        label: Full Name
        hint: Enter your first and last name
        type: text
        options: []
        required: true
      - id: 2
        name: email_address
        label: Email Address
        hint: Your contact email
        type: email
        options: []
        required: true
      - id: 3
        name: meeting_date
        label: Meeting Date
        hint: Date of the discussion meeting
        type: date
        options: []
        required: true
      - id: 4
        name: book_title
        label: Book Title Discussed
        hint: Title of the book discussed
        type: text
        options: []
        required: true
      - id: 5
        name: book_author
        label: Book Author
        hint: Author of the book
        type: text
        options: []
        required: true
      - id: 6
        name: overall_satisfaction
        label: Overall Satisfaction with Discussion
        hint: How satisfied were you with today discussion
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 7
        name: discussion_quality
        label: Quality of Discussion
        hint: Rate the quality of discussion
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 8
        name: facilitator_rating
        label: Facilitator Performance
        hint: Rate the discussion facilitator
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: false
      - id: 9
        name: participation_level
        label: Your Level of Participation
        hint: How much did you participate
        type: select_one
        options:
          - Very Active
          - Moderately Active
          - Somewhat Active
          - Mostly Listened
          - Did Not Participate
        required: true
      - id: 10
        name: comfort_level
        label: How comfortable did you feel sharing
        hint: Your comfort level during discussion
        type: select_one
        options:
          - Very Comfortable
          - Comfortable
          - Neutral
          - Uncomfortable
          - Very Uncomfortable
        required: true
      - id: 11
        name: most_valuable_aspect
        label: Most Valuable Aspect of Discussion
        hint: What did you find most valuable
        type: select_one
        options:
          - Different perspectives shared
          - Deep analysis of themes
          - Character discussions
          - Historical context
          - Personal connections
          - Group dynamics
        required: true
      - id: 12
        name: topics_wanted
        label: Topics You Wanted More Discussion On
        hint: What would you like to explore more
        type: text
        options: []
        required: false
      - id: 13
        name: meeting_length
        label: How was the meeting length
        hint: Was the duration appropriate
        type: select_one
        options:
          - Too Short
          - Just Right
          - Too Long
        required: true
      - id: 14
        name: location_rating
        label: Meeting Location Rating
        hint: Rate the meeting location
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: false
      - id: 15
        name: would_recommend
        label: Would you recommend this book club
        hint: Would you recommend to others
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 16
        name: next_meeting_interest
        label: Interest in Next Meeting
        hint: How likely will you attend next
        type: select_one
        options:
          - Very Likely
          - Likely
          - Not Sure
          - Unlikely
          - Very Unlikely
        required: true
      - id: 17
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: How can we improve future discussions
        type: text
        options: []
        required: false
      - id: 18
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback to share
        type: text
        options: []
        required: false
