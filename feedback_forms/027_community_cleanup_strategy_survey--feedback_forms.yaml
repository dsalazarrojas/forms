inputSchema:
  type: object
  properties:
    title: Cleanup Strategy Survey
    pages:
      - id: 1
        name: respondent_area
        label: Neighborhood area
        hint: Area or street name
        type: text
        options: []
        required: true
      - id: 2
        name: priority_issues
        label: Priority cleanup issues
        hint: Select top concerns in your area
        type: select_multiple
        options:
          - Litter and trash
          - Illegal dumping
          - Overgrown vegetation
          - Recycling access
          - Hazardous waste
        required: true
      - id: 3
        name: volunteer_availability
        label: Volunteer availability
        hint: Times or days when volunteers are available
        type: text
        options: []
        required: false
      - id: 4
        name: preferred_cleanup_scale
        label: Preferred cleanup scale
        hint: Choose scale of projects
        type: select_one
        options:
          - Block level
          - Neighborhood level
          - City wide
        required: true
      - id: 5
        name: support_needed
        label: Support needed from organization
        hint: Resources training equipment or funding
        type: text
        options: []
        required: false
      - id: 6
        name: additional_comments
        label: Additional comments or suggestions
        hint: Open ended feedback
        type: text
        options: []
        required: false
