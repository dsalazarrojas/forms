inputSchema:
  type: object
  properties:
    title: Municipality Citizen Input Information Collection Form
    pages:
    - id: 1
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: resident_department
      label: resident_department
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: service_concerns
      label: service_concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: resident_information
      label: resident_information
      hint: null
      type: select_one
      options:
      - None
      - Mayor
      - Department 1
      - Department 2
      required: true
    - id: 5
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: resident_feedback_rating
      label: resident_feedback_rating
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Neutral
      - Bad
      - Very Bad
      required: true
    - id: 11
      name: additional_comments
      label: additional_comments
      hint: null
      type: note
      options: []
      required: false
