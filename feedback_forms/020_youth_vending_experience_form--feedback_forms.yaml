inputSchema:
  type: object
  properties:
    title: Youth Vending Experience Form
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_date
      label: event date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: event_time
      label: event time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: event_type
      label: event type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: participants
      label: participants
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: rating_scale
      label: rating scale
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 9
      name: follow_up
      label: follow up
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
