inputSchema:
  type: object
  properties:
    title: Catering Survey
    pages:
    - id: 1
      name: section_respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: respondent_email
      label: Email Address
      hint: Optional
      type: email
      options: []
      required: false
    - id: 4
      name: respondent_phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: section_event_reference
      label: -- Event Reference --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: catering_company
      label: Catering Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: event_type
      label: Type of Event
      hint: null
      type: select_one
      options:
      - Wedding
      - Corporate Event
      - Birthday Party
      - Anniversary
      - Graduation
      - Funeral Reception
      - Conference
      - Other
      required: true
    - id: 9
      name: section_overall_satisfaction
      label: -- Overall Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: overall_rating
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 11
      name: likelihood_recommend
      label: How likely are you to recommend this catering company?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 12
      name: would_use_again
      label: Would you use this catering service again?
      hint: null
      type: select_one
      options:
      - Definitely
      - Probably
      - Maybe
      - Probably Not
      - Definitely Not
      required: true
    - id: 13
      name: section_food_quality
      label: -- Food Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: food_taste_rating
      label: Taste and Flavor
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 15
      name: food_presentation
      label: Food Presentation and Appearance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 16
      name: food_temperature
      label: Food Temperature
      hint: Served at appropriate temperature
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 17
      name: section_service_quality
      label: -- Service Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: staff_professionalism
      label: Staff Professionalism
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 19
      name: staff_attentiveness
      label: Staff Attentiveness
      hint: Responsive to guest needs
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 20
      name: service_speed
      label: Service Efficiency and Speed
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 21
      name: section_value
      label: -- Value and Pricing --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: value_for_money
      label: Value for Money
      hint: null
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Not Worth the Cost
      required: true
    - id: 23
      name: price_transparency
      label: Pricing Transparency
      hint: Clear costs, no hidden fees
      type: select_one
      options:
      - Very Clear
      - Clear
      - Neutral
      - Unclear
      - Very Unclear
      required: false
    - id: 24
      name: section_feedback
      label: -- Additional Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: comments
      label: Additional Comments or Suggestions
      hint: What could they improve?
      type: text
      options: []
      required: false
