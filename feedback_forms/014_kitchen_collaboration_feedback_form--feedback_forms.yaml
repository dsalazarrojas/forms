inputSchema:
  type: object
  properties:
    title: Kitchen Collaboration Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: feedback_type
      label: What type of feedback?
      hint: null
      type: select_one
      options:
      - General
      - Suggestion
      - Issue
      required: false
    - id: 5
      name: comment
      label: Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: submission_date_time
      label: Submission Date & Time
      hint: null
      type: text
      options: []
      required: false
