inputSchema:
  type: object
  properties:
    title: digital_wellness_education_series_evaluation_form
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: overall_ratings
      label: overall_ratings
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: workshop_topics
      label: workshop_topics
      hint: Which topics do you think should be included in future workshops?
      type: select_multiple
      options:
      - Mindfulness and Meditation
      - Nutrition and Wellness
      - Stress Management
      - Mindful Movement
      - Other (please specify)
      required: false
    - id: 4
      name: future_workshops
      label: future_workshops
      hint: How can we improve future workshops?
      type: text
      options: []
      required: false
    - id: 5
      name: workshop_attendance
      label: workshop_attendance
      hint: null
      type: select_one
      options:
      - Not Attended
      - Partially Attended
      - Fully Attended
      - Will Attend in the Future
      required: false
    - id: 6
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
