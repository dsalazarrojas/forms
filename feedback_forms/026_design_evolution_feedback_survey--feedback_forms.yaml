inputSchema:
  type: object
  properties:
    title: Design Evolution Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction to the Design Evolution Feedback Survey
      hint: Please take a few minutes to provide your feedback on the current design
        evolution process.
      type: text
      options: []
      required: false
    - id: 2
      name: feedback
      label: What do you think about the current design evolution process?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: select_one_feedback_option
      label: Select one option that best describes your feedback.
      hint: null
      type: select_one
      options:
      - The design evolution process is well-organized and structured.
      - The design evolution process is disorganized and unstructured.
      - I'm not sure.
      required: false
    - id: 4
      name: select_multiple_feedback_options
      label: Select multiple options that best describe your feedback.
      hint: null
      type: select_multiple
      options:
      - The design evolution process is well-organized and structured.
      - The design evolution process is disorganized and unstructured.
      - I'm not sure.
      required: false
    - id: 5
      name: date_of_last_feedback
      label: When was your last feedback given?
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_of_last_feedback
      label: What time was your last feedback given?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: design_preferences
      label: What type of design preferences do you have for the current design evolution
        process?
      hint: null
      type: select_multiple
      options:
      - Simple and intuitive design.
      - Complex and detailed design.
      - Customizable design.
      required: false
    - id: 8
      name: demographic_information
      label: Demographic Information
      hint: Please provide your demographic information for analysis purposes.
      type: text
      options: []
      required: false
