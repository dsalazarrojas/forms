inputSchema:
  type: object
  properties:
    title: epic_feedback_survey
    pages:
    - id: 1
      name: survey_page
      label: Survey Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_info
      label: Participant Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: questions
      label: Questions
      hint: null
      type: select_one
      options:
      - What did you enjoy most about the service?
      - What did you enjoy least about the service?
      - How likely are you to recommend the service?
      - Comments
      - Contact Info
      required: false
