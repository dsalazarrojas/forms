inputSchema:
  type: object
  properties:
    title: Peer Code Review Feedback Form
    pages:
    - id: 1
      name: review_form
      label: Review Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: code_submission
      label: Code Submission
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: reviewer_comment
      label: Reviewer Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: review_status
      label: Review Status
      hint: null
      type: select_one
      options:
      - Approved
      - Rejected
      - Deferred
      required: false
    - id: 5
      name: action_item
      label: Action Item
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: action_item_status
      label: Action Item Status
      hint: null
      type: select_one
      options:
      - Open
      - In Progress
      - Closed
      required: false
    - id: 7
      name: action_item_due_date
      label: Action Item Due Date
      hint: null
      type: date
      options: []
      required: false
