inputSchema:
  type: object
  properties:
    title: Agent Feedback Form
    pages:
    - id: 1
      name: header
      label: -- Real Estate Agent Service Feedback --
      hint: help us maintain high standards of service
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Customer Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: agent_name
      label: Name of Real Estate Agent
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: transaction_date
      label: Date of Transaction or Interaction
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: service_type
      label: Type of service - Buying, Selling, Renting, Property Management
      hint: null
      type: select_one
      options:
      - Buying a home
      - Selling a home
      - Renting / Leasing
      - Property Management
      - General Consultation
      required: true
    - id: 6
      name: evaluation_header
      label: -- Service Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: professionalism_rating
      label: Professionalism and courtesy of the agent
      hint: scale of 1 to 5
      type: select_one
      options:
      - 5 - Exceptional
      - 4 - Professional
      - 3 - Average
      - 2 - Unprofessional
      - 1 - Poor
      required: true
    - id: 8
      name: knowledge_rating
      label: Agent's knowledge of the local market
      hint: expertise and data accuracy
      type: select_one
      options:
      - Highly Expert
      - Knowledgeable
      - Fair
      - Poor Knowledge
      required: true
    - id: 9
      name: communication_rating
      label: Effectiveness of communication and responsiveness
      hint: null
      type: select_one
      options:
      - Always responsive
      - Mostly responsive
      - Slow response
      - Difficult to reach
      required: true
    - id: 10
      name: negotiation_rating
      label: Negotiation skills and outcome satisfaction
      hint: did they get you the best deal
      type: select_one
      options:
      - Extremely Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      required: true
    - id: 11
      name: overall_satisfaction
      label: Overall satisfaction with the agent's service
      hint: null
      type: select_one
      options:
      - 10 - Excellent
      - 8 - Good
      - 6 - Average
      - 4 - Below Average
      - 2 - Poor
      required: true
    - id: 12
      name: strengths_feedback
      label: What did the agent do exceptionally well?
      hint: specific positive feedback
      type: text
      options: []
      required: false
    - id: 13
      name: improvement_feedback
      label: Any areas where the agent could improve?
      hint: constructive criticism
      type: text
      options: []
      required: false
    - id: 14
      name: future_use
      label: Would you use this agent again in the future?
      hint: null
      type: select_one
      options:
      - Definitely
      - Likely
      - Unsure
      - Not likely
      required: true
