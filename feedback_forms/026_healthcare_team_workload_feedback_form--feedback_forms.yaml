inputSchema:
  type: object
  properties:
    title: Healthcare Team Workload Feedback Form
    pages:
    - id: 1
      name: overall_satisfaction
      label: Overall
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: stress_level
      label: Stress Level
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: workload_hours_worked
      label: Workload Hours
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: workload_satisfaction
      label: Workload Satisfaction
      hint: Please select all that apply.
      type: select_multiple
      options:
      - Very Low
      - Low
      - Medium
      - High
      - Very High
      required: false
    - id: 5
      name: job_satisfaction
      label: Job Satisfaction
      hint: How satisfied are you with your job?
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: false
    - id: 6
      name: work_life_balance
      label: Work Life Balance
      hint: Please select all that apply.
      type: select_multiple
      options:
      - Very Poor
      - Poor
      - Neutral
      - Good
      - Very Good
      required: false
    - id: 7
      name: support_from_management
      label: Support from Management
      hint: How would you rate the level of support from your management team?
      type: select_one
      options:
      - Very Poor
      - Poor
      - Neutral
      - Good
      - Very Good
      required: false
    - id: 8
      name: communication_with_colleagues
      label: Communication with Colleagues
      hint: Please select all that apply.
      type: select_multiple
      options:
      - Very Poor
      - Poor
      - Neutral
      - Good
      - Very Good
      required: false
    - id: 9
      name: collaboration_with_other_teams
      label: Collaboration with Other Teams
      hint: How would you rate the level of collaboration with other teams?
      type: select_one
      options:
      - Very Poor
      - Poor
      - Neutral
      - Good
      - Very Good
      required: false
    - id: 10
      name: time_management_skills
      label: Time Management Skills
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: feedback_frequency
      label: Feedback Frequency
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: feedback_quality
      label: Feedback Quality
      hint: Please select all that apply.
      type: select_multiple
      options:
      - Very Low
      - Low
      - Medium
      - High
      - Very High
      required: false
    - id: 13
      name: communication_with_supervisors
      label: Communication with Supervisors
      hint: How would you rate the level of communication with your supervisors?
      type: select_one
      options:
      - Very Poor
      - Poor
      - Neutral
      - Good
      - Very Good
      required: false
    - id: 14
      name: workload_satisfaction_change
      label: Change in Workload Satisfaction
      hint: If you selected 'Decreased', 'Stable', or 'Increased', please select the
        corresponding change in satisfaction level.
      type: select_multiple
      options:
      - Significantly Decreased
      - Decreased
      - Stable
      - Increased
      - Significantly Increased
      required: false
    - id: 15
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: suggestions
      label: Suggestions
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: open_ended
      label: Open-Ended
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: overall_impressions
      label: Overall Impressions
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: action_planning
      label: Action Planning
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: follow_up
      label: Follow-up
      hint: Please select all that apply.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Not Applicable
      required: false
    - id: 22
      name: date_of_last_contact
      label: Date of Last Contact
      hint: null
      type: date
      options: []
      required: false
    - id: 23
      name: last_action_taken
      label: Last Action Taken
      hint: null
      type: time
      options: []
      required: false
    - id: 24
      name: frequency_of_contacts
      label: Frequency of Contacts
      hint: Please select all that apply.
      type: select_multiple
      options:
      - Less than once a month
      - About once a month
      - About once a week
      - About once a day
      - More than once a day
      required: false
    - id: 25
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
