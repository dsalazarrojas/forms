        type: select_one
        options:
          - Excellent
          - Good
          - Satisfactory
          - Fair
          - Poor
        required: true
      - id: 11
        name: value_rating
        label: Value for Price Rating
        hint: Was it worth the price
        type: select_one
        options:
          - Excellent value
          - Good value
          - Fair value
          - Below average value
          - Poor value
        required: true
      - id: 12
        name: durability_rating
        label: Durability Rating
        hint: How well does it hold up
        type: select_one
        options:
          - Excellent
          - Good
          - Satisfactory
          - Fair
          - Poor
