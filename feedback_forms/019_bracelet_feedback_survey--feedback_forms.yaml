      - id: 2
        name: respondent_name
        label: Your Name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 3
        name: email
        label: Email Address
        hint: For follow-up if needed
        type: email
        options: []
        required: false
      - id: 4
        name: purchase_date
        label: When Did You Purchase This Bracelet
        hint: Date of purchase
        type: date
        options: []
        required: false
      - id: 5
        name: section_header_product
        label: -- Product Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: bracelet_style
        label: Bracelet Style
        hint: Which style did you purchase
        type: text
        options: []
        required: false
      - id: 7
        name: bracelet_color
        label: Bracelet Color
        hint: Color of bracelet purchased
        type: text
        options: []
        required: false
      - id: 8
        name: material_type
        label: Material Type
        hint: What is the bracelet made from
        type: select_one
        options:
