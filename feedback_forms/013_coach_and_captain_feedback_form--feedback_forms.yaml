inputSchema:
  type: object
  properties:
    title: Coach And Captain Feedback Form
    pages:
    - id: 1
      name: header
      label: -- Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Respondent name
      hint: Player or staff name
      type: text
      options: []
      required: false
    - id: 3
      name: role
      label: Role
      hint: Coach, captain, or player
      type: select_one
      options:
      - Coach
      - Captain
      - Player
      - Other
      required: true
    - id: 4
      name: date_of_game
      label: Date of game or practice
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 5
      name: strengths_observed
      label: Strengths observed
      hint: Key positive observations
      type: text
      options: []
      required: true
    - id: 6
      name: areas_for_improvement
      label: Areas for improvement
      hint: Specific coaching suggestions
      type: text
      options: []
      required: true
    - id: 7
      name: overall_rating
      label: Overall performance rating
      hint: 1 low to 5 high
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 8
      name: support_needed
      label: Support needed from organization
      hint: Resources or training requested
      type: text
      options: []
      required: false
    - id: 9
      name: follow_up_required
      label: Follow up required
      hint: Indicate if follow up is needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Free text
      type: text
      options: []
      required: false
