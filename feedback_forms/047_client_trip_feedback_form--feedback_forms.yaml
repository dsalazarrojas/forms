inputSchema:
  type: object
  properties:
    title: Client Trip Feedback Form
    pages:
    - id: 1
      name: feedback_intro
      label: -- Trip Feedback Survey --
      hint: Tell us about your recent trip experience
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: trip_destination
      label: Trip Destination
      hint: Where did you travel to?
      type: text
      options: []
      required: true
    - id: 5
      name: trip_date
      label: Trip Date
      hint: When did you travel?
      type: date
      options: []
      required: true
    - id: 6
      name: trip_duration
      label: Trip Duration
      hint: How many days or nights?
      type: text
      options: []
      required: false
    - id: 7
      name: trip_purpose
      label: Trip Purpose
      hint: null
      type: select_one
      options:
      - Leisure vacation
      - Business travel
      - Family visit
      - Adventure
      - Honeymoon
      - Other
      required: true
    - id: 8
      name: travel_package_type
      label: Travel Package Used
      hint: null
      type: select_one
      options:
      - All-inclusive
      - Customized itinerary
      - Group tour
      - Independent travel
      - Other
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall Trip Satisfaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 10
      name: accommodations_quality
      label: Quality of Accommodations
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 11
      name: activities_experiences
      label: Quality of Activities and Experiences
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 12
      name: value_for_money
      label: Value for Money
      hint: Was the price worth the experience?
      type: select_one
      options:
      - Excellent value
      - Good value
      - Fair value
      - Poor value
      - Overpriced
      required: true
    - id: 13
      name: travel_guide_quality
      label: Quality of Travel Guide or Agent Support
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: false
    - id: 14
      name: food_dining
      label: Food and Dining Experience
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: false
    - id: 15
      name: local_attractions
      label: Local Attractions and Sights
      hint: null
      type: select_one
      options:
      - Exceeded expectations
      - Met expectations
      - Below expectations
      required: false
    - id: 16
      name: would_return
      label: Would You Return to This Destination?
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Uncertain
      - Probably not
      - Definitely not
      required: true
    - id: 17
      name: would_recommend
      label: Would You Recommend This Trip to Others?
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Uncertain
      - Probably not
      - Definitely not
      required: true
    - id: 18
      name: highlights
      label: Best Part of Your Trip
      hint: What was your favorite experience?
      type: text
      options: []
      required: false
    - id: 19
      name: improvements
      label: What Could Be Improved?
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: additional_feedback
      label: Additional Comments or Suggestions
      hint: null
      type: text
      options: []
      required: false
