inputSchema:
  type: object
  properties:
    title: Audio Editing Feedback Survey
    pages:
      - id: 1
        name: client_full_name
        label: Client Full Name
        hint: Name of client providing feedback
        type: text
        options: []
        required: true
      - id: 2
        name: client_email
        label: Email Address
        hint: Contact email address
        type: email
        options: []
        required: true
      - id: 3
        name: project_name
        label: Project Name
        hint: Name or title of the audio project
        type: text
        options: []
        required: true
      - id: 4
        name: project_type
        label: Project Type
        hint: Type of audio project
        type: select_one
        options:
          - Podcast Episode
          - Music Track
          - Audiobook
          - Voice Over
          - Radio Commercial
          - Film Score
          - Sound Design
          - Other
        required: true
      - id: 5
        name: completion_date
        label: Completion Date
        hint: When was the project delivered?
        type: date
        options: []
        required: true
      - id: 6
        name: editor_name
        label: Audio Editor Name
        hint: Name of the editor who worked on your project
        type: text
        options: []
        required: true
      - id: 7
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall satisfaction with the editing
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 8
        name: audio_quality_rating
        label: Audio Quality Rating
        hint: Rate the final audio quality
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: editing_precision
        label: Editing Precision
        hint: Rate the precision and accuracy of edits
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: noise_reduction_quality
        label: Noise Reduction Quality
        hint: Rate the noise reduction and cleanup
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
          - Not applicable
        required: true
      - id: 11
        name: pacing_and_timing
        label: Pacing and Timing
        hint: Rate the pacing and timing of the edit
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 12
        name: communication_rating
        label: Communication Rating
        hint: Rate communication with the editor
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 13
        name: turnaround_time
        label: Turnaround Time
        hint: Was the project delivered on time?
        type: select_one
        options:
          - Delivered early
          - Delivered on time
          - Slightly delayed
          - Significantly delayed
        required: true
      - id: 14
        name: revision_requests
        label: Revision Requests
        hint: Did you need to request revisions?
        type: select_one
        options:
          - No revisions needed
          - 1 revision
          - 2-3 revisions
          - 4+ revisions
        required: true
      - id: 15
        name: revision_handling
        label: Revision Handling
        hint: How well were revisions handled?
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
          - Not applicable
        required: false
      - id: 16
        name: value_for_money
        label: Value for Money
        hint: Rate the value for the price paid
        type: select_one
        options:
          - Excellent value
          - Good value
          - Fair value
          - Poor value
        required: true
      - id: 17
        name: would_recommend
        label: Would Recommend
        hint: Would you recommend our services?
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 18
        name: would_use_again
        label: Would Use Again
        hint: Would you use our services again?
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 19
        name: strengths
        label: Strengths
        hint: What did we do well?
        type: text
        options: []
        required: false
      - id: 20
        name: areas_for_improvement
        label: Areas for Improvement
        hint: What could we improve?
        type: text
        options: []
        required: false
      - id: 21
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback or suggestions
        type: text
        options: []
        required: false
