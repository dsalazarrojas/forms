inputSchema:
  type: object
  properties:
    title: Education Feedback Form
    pages:
      - id: 1
        name: participant_name
        label: Participant name
        hint: Optional for anonymous feedback
        type: text
        options: []
        required: false
      - id: 2
        name: course_name
        label: Course or workshop name
        hint: Title of the session attended
        type: text
        options: []
        required: true
      - id: 3
        name: instructor_effectiveness
        label: Instructor effectiveness
        hint: Rate from 1 lowest to 5 highest
        type: select_one
        options:
          - 1
          - 2
          - 3
          - 4
          - 5
        required: true
      - id: 4
        name: content_relevance
        label: Content relevance
        hint: How relevant was the content to your needs
        type: select_one
        options:
          - Very relevant
          - Somewhat relevant
          - Not relevant
        required: true
      - id: 5
        name: logistics_and_facility
        label: Logistics and facility quality
        hint: Evaluate venue materials and scheduling
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: false
      - id: 6
        name: suggestions_for_improvement
        label: Suggestions for improvement
        hint: Ideas to improve future sessions
        type: text
        options: []
        required: false
