inputSchema:
  type: object
  properties:
    title: Event Debrief Form
    pages:
    - id: 1
      name: event_debrief_form_1
      label: What was the purpose of the event?
      hint: Please describe the main purpose of the event.
      type: text
      options: []
      required: true
    - id: 2
      name: event_debrief_form_2
      label: When did the event take place?
      hint: Date of the event.
      type: date
      options: []
      required: true
    - id: 3
      name: event_debrief_form_3
      label: Where was the event held?
      hint: Venue of the event.
      type: text
      options: []
      required: true
    - id: 4
      name: event_debrief_form_4
      label: What was the duration of the event?
      hint: How long did the event last?
      type: number
      options: []
      required: true
    - id: 5
      name: event_debrief_form_5
      label: Who was the debriefer?
      hint: Name of the person who debriefed the event.
      type: text
      options: []
      required: true
    - id: 6
      name: event_debrief_form_6
      label: What was the reason for debriefing the event?
      hint: Description of the reason for debriefing.
      type: text
      options: []
      required: true
    - id: 7
      name: event_debrief_form_7
      label: How did you find the debriefing process?
      hint: Rate your experience with the debriefing process.
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: event_debrief_form_8
      label: Any suggestions for improvement?
      hint: Describe any suggestions you have for improving the debriefing process.
      type: text
      options: []
      required: false
    - id: 9
      name: event_debrief_form_9
      label: Did you have any concerns during the debriefing process?
      hint: Describe any concerns you had during the debriefing process.
      type: text
      options: []
      required: false
