inputSchema:
  type: object
  properties:
    title: Cafe Feedback Form
    pages:
    - id: 1
      name: section_visit_info
      label: -- Visit Details --
      hint: We value your feedback to improve our cafe experience
      type: note
      options: []
      required: false
    - id: 2
      name: visit_date
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: visit_time
      label: Approximate Time of Visit
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: visit_type
      label: Type of Visit
      hint: null
      type: select_one
      options:
      - Dine-in
      - Takeaway
      - Online Delivery
      required: true
    - id: 5
      name: section_ratings
      label: -- Quality and Service Ratings --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: food_quality
      label: Quality of Food
      hint: 1 is Poor, 5 is Excellent
      type: number
      options: []
      required: true
    - id: 7
      name: beverage_quality
      label: Quality of Beverages
      hint: coffee, tea, etc.
      type: number
      options: []
      required: true
    - id: 8
      name: service_speed
      label: Speed of Service
      hint: null
      type: select_one
      options:
      - Fast
      - Reasonable
      - Slow
      - Very Slow
      required: true
    - id: 9
      name: staff_friendliness
      label: Staff Friendliness and Professionalism
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: cleanliness_rating
      label: Cleanliness of Dining Area and Restrooms
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: true
    - id: 11
      name: section_atmosphere
      label: -- Atmosphere and Environment --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: ambiance_rating
      label: Cafe Ambiance and Music
      hint: null
      type: select_one
      options:
      - Very Pleasant
      - Good
      - Neutral
      - Too Loud/Distracting
      required: false
    - id: 13
      name: wifi_performance
      label: WiFi Performance (if used)
      hint: null
      type: select_one
      options:
      - Fast
      - Reliable
      - Slow/Unreliable
      - Did not use
      required: false
    - id: 14
      name: section_comments
      label: -- Final Thoughts --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: value_for_money
      label: Value for Money
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: recommendation_likelihood
      label: Likelihood to recommend us to a friend
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: general_comments
      label: Please share any specific comments or suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: loyalty_interest
      label: Would you like to join our loyalty program
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Already a member
      required: false
    - id: 19
      name: contact_email
      label: Email Address for follow-up
      hint: optional
      type: email
      options: []
      required: false
