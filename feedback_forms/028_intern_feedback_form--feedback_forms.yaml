    - id: 6
      name: feedback_question_1
      label: feedback_question_1
      hint: null
      type: select_multiple
      options:
      - What was the most valuable skill you gained during your internship?
      - What was the most challenging part of your internship?
      - What did you enjoy most about your internship?
      - Would you like to work with this company again?
      required: false
    - id: 7
      name: feedback_question_2
      label: feedback_question_2
      hint: null
      type: select_multiple
      options:
      - What was the most surprising part of your internship?
      - Were there any challenges you faced that you did not have the necessary resources
        or support to overcome?
      - Did you have the opportunity to take on responsibilities that matched your
        career goals?
      - Were there any instances where you felt undervalued or unappreciated?
      required: false
    - id: 8
      name: feedback_question_3
      label: feedback_question_3
      hint: null
      type: select_multiple
      options:
      - Were there any company policies or practices that you felt were not in line
        with your personal values or goals?
      - Did you feel like you had a clear understanding of your role and responsibilities?
      - Were there any times where you felt like you had to work outside of your role?
      - Were there any company resources or tools that were not available to you?
      required: false
    - id: 9
      name: feedback_question_4
      label: feedback_question_4
      hint: null
      type: select_multiple
      options:
      - Was there a moment where you felt like you had to work with someone who was
        not a good fit for the team?
      - Were there any times where you felt like you had to work on something that
        was not a good fit for your skills or interests?
      - Did you feel like you had a good relationship with your supervisor or manager?
      - Were there any times where you felt like you were not given the necessary
        guidance or support?
      required: false
    - id: 10
      name: feedback_question_5
