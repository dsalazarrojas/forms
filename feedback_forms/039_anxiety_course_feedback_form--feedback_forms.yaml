inputSchema:
  type: object
  properties:
    title: Anxiety Course Feedback Form
    pages:
    - id: 1
      name: section_course_feedback
      label: -- Course Feedback --
      hint: Collect participant feedback on the anxiety course
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Optional for anonymous feedback
      type: text
      options: []
      required: false
    - id: 3
      name: course_date
      label: Course date attended
      hint: Date of the session attended
      type: date
      options: []
      required: true
    - id: 4
      name: instructor_effectiveness
      label: Instructor effectiveness rating
      hint: Rate clarity empathy and responsiveness
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very good
      - Excellent
      required: true
    - id: 5
      name: course_content_relevance
      label: Course content relevance
      hint: How useful was the course material
      type: select_one
      options:
      - Not relevant
      - Somewhat relevant
      - Relevant
      - Highly relevant
      required: true
    - id: 6
      name: skills_gained
      label: Skills or techniques gained
      hint: List practical techniques learned
      type: text
      options: []
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall satisfaction 1 to 5
      hint: General evaluation of the course
      type: number
      options: []
      required: true
    - id: 8
      name: suggestions
      label: Suggestions for improvement
      hint: Content delivery logistics or follow up support
      type: text
      options: []
      required: false
