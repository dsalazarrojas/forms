      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: duration_used
      label: How Long Have You Used This Equipment?
      hint: null
      type: select_one
      options:
      - Less than 1 month
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - Over 1 year
      required: true
    - id: 13
      name: frequency_use
