inputSchema:
  type: object
  properties:
    title: Contact Us Template
    pages:
    - id: 1
      name: section_sender
      label: -- Sender Details --
      hint: Please fill out the form below.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Your Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Your Email Address
      hint: We'll use this for follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Your Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: subject_header
      label: Inquiry Subject
      hint: null
      type: select_one
      options:
      - General Question
      - Technical Support
      - Billing Inquiry
      - Feedback
      - Request Call Back
      - Partnership
      - Careers
      required: true
    - id: 6
      name: message_details
      label: Message / Description of the Issue
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: follow_up_needed
      label: Do you require a response to this message?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: preferred_contact_method
      label: How should we contact you?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      - No preference
      required: true
    - id: 9
      name: newsletter_opt_in
      label: Sign up for our newsletter?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: referral_source
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Search Engine
      - Social Media
      - Referral
      - Advertisement
      - Other
      required: false
    - id: 11
      name: privacy_agreement
      label: I agree to the terms and conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
