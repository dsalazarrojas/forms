inputSchema:
  type: object
  properties:
    title: Customer Advocacy Assessment Form
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Very dissatisfied
      - Somewhat dissatisfied
      - Neutral
      - Somewhat satisfied
      - Satisfied
      required: false
    - id: 6
      name: loyalty_level
      label: Loyalty Level
      hint: null
      type: select_one
      options:
      - Very Low
      - Somewhat Low
      - Neutral
      - Somewhat High
      - Very High
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Not Satisfied
      - Slightly Satisfied
      - Somewhat Satisfied
      - Very Satisfied
      - Extremely Satisfied
      required: false
