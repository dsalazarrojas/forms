inputSchema:
  type: object
  properties:
    title: Virtual Learning Environment Design Feedback Survey
    pages:
    - id: 1
      name: usability_rating
      label: Usability Rating
      hint: How would you rate the usability of the Virtual Learning Environment?
      type: number
      options: []
      required: true
    - id: 2
      name: feature_feedback
      label: Feature Feedback
      hint: What features of the Virtual Learning Environment do you find most useful?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 3
      name: additional_feedback
      label: Additional Feedback
      hint: Are there any additional features you would like to see implemented in
        the Virtual Learning Environment?
      type: text
      options: []
      required: false
    - id: 4
      name: improvement_suggestions
      label: Improvement Suggestions
      hint: What are your suggestions for improvement?
      type: text
      options: []
      required: false
    - id: 5
      name: documentation_quality
      label: Documentation Quality
      hint: How would you rate the quality of the Virtual Learning Environment's documentation
        and support?
      type: number
      options: []
      required: true
    - id: 6
      name: issues_performance
      label: Issues with Performance
      hint: Are there any issues with the Virtual Learning Environment's performance
        or functionality?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 7
      name: navigation_suggestions
      label: Navigation and User Flow Suggestions
      hint: Do you have any suggestions for the Virtual Learning Environment's navigation
        and user flow?
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 8
      name: overall_user_experience
      label: Overall User Experience
      hint: How would you rate the overall user experience of the Virtual Learning
        Environment?
      type: number
      options: []
      required: true
    - id: 9
      name: other_comments
      label: Other Comments or Suggestions
      hint: Are there any other comments or suggestions you would like to make about
        the Virtual Learning Environment?
      type: text
      options: []
      required: false
    - id: 10
      name: support_quality
      label: Support Quality
      hint: How would you rate the support quality available in the Virtual Learning
        Environment?
      type: number
      options: []
      required: true
