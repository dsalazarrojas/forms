inputSchema:
  type: object
  properties:
    title: corporate_training_discharge_feedback_form
    pages:
    - id: 1
      name: training_effectiveness
      label: training_effectiveness
      hint: null
      type: select_one
      options:
      - Very good
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: future_programs
      label: future_programs
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: data_collection
      label: data_collection
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: session_insights
      label: session_insights
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: department
      label: department
      hint: null
      type: select_one
      options:
      - HR
      - Sales
      - Support
      - Marketing
      required: true
    - id: 8
      name: assigned_to
      label: assigned_to
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Jim
      required: true
