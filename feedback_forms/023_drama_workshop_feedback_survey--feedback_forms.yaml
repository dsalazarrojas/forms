      options: []
      required: false
    - id: 5
      name: workshop_content
      label: Workshop Content
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: workshop_organization
      label: Workshop Organization
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: instructor_performance
      label: Instructor Performance
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
