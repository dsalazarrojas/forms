inputSchema:
  type: object
  properties:
    title: customer_support_escalation_request_form
    pages:
    - id: 1
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: issue_description
      label: Issue Description
      hint: Briefly describe the issue
      type: text
      options: []
      required: true
    - id: 3
      name: escalation_reason
      label: Escalation Reason
      hint: Explain why the issue needs to be escalated
      type: text
      options: []
      required: true
    - id: 4
      name: expected_resolution
      label: Expected Resolution
      hint: State the expected resolution or outcome
      type: text
      options: []
      required: true
    - id: 5
      name: attachments
      label: Attachments
      hint: null
      type: select_multiple
      options:
      - File
      - Image
      - Video
      - Audio
      - Other
      required: false
    - id: 6
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - chatjimmy
      - support team
      - other user
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: follow_up
      label: Follow-up
      hint: null
      type: date
      options: []
      required: false
