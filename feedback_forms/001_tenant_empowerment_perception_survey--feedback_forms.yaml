inputSchema:
  type: object
  properties:
    title: Tenant Empowerment Perception Survey
    pages:
    - id: 1
      name: communication_satisfaction
      label: How would you rate your overall satisfaction with communication from
        your landlord/property manager?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: communication_frequency
      label: How often do you communicate with your landlord/property manager?
      hint: null
      type: select_one
      options:
      - Very frequent
      - Frequent
      - Occasional
      - Rare
      required: false
    - id: 3
      name: communication_channel
      label: Which of the following channels do you most often use to communicate
        with your landlord/property manager?
      hint: null
      type: select_multiple
      options:
      - email
      - phone
      - in person
      required: true
    - id: 4
      name: tenant_awareness
      label: How would you rate your awareness of maintenance and repairs in your
        building/property?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: maintenance_frequency
      label: How often do you experience maintenance or repairs in your building/property?
      hint: null
      type: select_one
      options:
      - Very frequent
      - Frequent
      - Occasional
      - Rare
      required: false
    - id: 6
      name: communication_effectiveness
      label: How would you rate the effectiveness of communication from your landlord/property
        manager?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: communication_satisfaction_2
      label: How satisfied are you with the overall condition of your building/property?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: maintenance_satisfaction
      label: How would you rate the satisfaction with maintenance and repairs in your
        building/property?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: feedback
      label: How often do you provide feedback to your landlord/property manager?
      hint: null
      type: select_one
      options:
      - Very frequent
      - Frequent
      - Occasional
      - Rare
      required: true
    - id: 10
      name: tenant_survey
      label: How would you rate your satisfaction with the overall condition of your
        building/property?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: maintenance_awareness
      label: How often do you receive maintenance or repair notifications from your
        landlord/property manager?
      hint: null
      type: select_multiple
      options:
      - Very frequent
      - Frequent
      - Occasional
      - Rare
      required: false
    - id: 12
      name: maintenance_frequency_2
      label: How often do you experience issues with maintenance and repairs in your
        building/property?
      hint: null
      type: select_one
      options:
      - Very frequent
      - Frequent
      - Occasional
      - Rare
      required: false
    - id: 13
      name: maintenance_satisfaction_2
      label: How would you rate your satisfaction with the overall condition of maintenance
        and repairs in your building/property?
      hint: null
      type: number
      options: []
      required: true
