inputSchema:
  type: object
  properties:
    title: delivery_service_feedback_form
    pages:
    - id: 1
      name: delivery_service_feedback_form
      label: What was the quality of the delivery experience?
      hint: null
      type: select_multiple
      options:
      - Good
      - Poor
      required: true
    - id: 2
      name: delivery_service_rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: delivery_service_rating_value
      label: rating
      hint: Please select a rating between 1-5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: delivery_service_feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: delivery_service_rating_date
      label: Rating Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: delivery_service_comment
      label: delivery_service_comment
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: delivery_service_satisfaction
      label: delivery_service_satisfaction
      hint: null
      type: select_one
      options:
      - satisfied
      - unsatisfied
      required: true
    - id: 8
      name: delivery_service_service_area
      label: delivery_service_area
      hint: null
      type: select_one
      options:
      - Area 1
      - Area 2
      - Area 3
      required: false
    - id: 9
      name: delivery_service_service_subcategory
      label: delivery_service_subcategory
      hint: null
      type: select_one
      options:
      - Subcategory 1
      - Subcategory 2
      required: true
    - id: 10
      name: delivery_service_service_subcategory_other
      label: delivery_service_subcategory_other
      hint: null
      type: text
      options: []
      required: false
