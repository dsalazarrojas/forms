inputSchema:
  type: object
  properties:
    title: Application Assistance Survey
    pages:
      - id: 1
        name: user_name
        label: User name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: service_used
        label: Service used
        hint: Which application service required assistance
        type: text
        options: []
        required: true
      - id: 3
        name: ease_of_use
        label: Ease of use
        hint: How easy was the application to use
        type: select_one
        options: [Very easy, Easy, Neutral, Difficult, Very difficult]
        required: true
      - id: 4
        name: issue_resolved
        label: Was the issue resolved
        hint: Outcome of the assistance
        type: select_one
        options: [Yes, No, Partially]
        required: true
      - id: 5
        name: support_rating
        label: Support rating
        hint: Rate the support interaction
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 6
        name: response_time
        label: Response time satisfaction
        hint: Was the response timely
        type: select_one
        options: [Very satisfied, Satisfied, Neutral, Dissatisfied]
        required: true
      - id: 7
        name: suggestions
        label: Suggestions for improvement
        hint: Short suggestions to improve the process
        type: text
        options: []
        required: false
      - id: 8
        name: follow_up_contact
        label: Follow up contact
        hint: Provide email if follow up is needed
        type: email
        options: []
        required: false
      - id: 9
        name: additional_comments
        label: Additional comments
        hint: Any other comments
        type: text
        options: []
        required: false
      - id: 10
        name: consent_to_contact
        label: Consent to contact for follow up
        hint: Allow us to contact you regarding your feedback
        type: select_one
        options: [Yes, No]
        required: true
