inputSchema:
  type: object
  properties:
    title: group_therapy_client_feedback_form
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: session_id
      label: Session ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: therapist_name
      label: Therapist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: overall_rating
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: rating_questions
      label: Rating Questions
      hint: null
      type: select_multiple
      options:
      - Q1 - Was the session helpful?
      - Q2 - Was the therapist professional?
      - Q3 - Was the session a waste of time?
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 8
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: therapist_rating
      label: Therapist Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 11
      name: client_recommend
      label: Client Recommend
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: session_notes
      label: Session Notes
      hint: null
      type: select_multiple
      options:
      - Strengths
      - Weaknesses
      - Areas for improvement
      required: false
