inputSchema:
  type: object
  properties:
    title: Product Feature Priority Poll
    pages:
    - id: 1
      name: form_header
      label: Product Feature Suggestion
      hint: Suggest a new product feature.
      type: note
      options: []
      required: false
    - id: 2
      name: product_name
      label: Product Feature Name
      hint: Enter the name of the feature.
      type: text
      options: []
      required: true
    - id: 3
      name: description
      label: Description
      hint: Describe the feature.
      type: text
      options: []
      required: true
    - id: 4
      name: priority
      label: Priority
      hint: Select the priority level.
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 5
      name: expected_outcomes
      label: Expected Outcomes
      hint: Select one or more expected outcomes.
      type: select_multiple
      options:
      - Increased customer satisfaction
      - Improved customer engagement
      - Increased revenue
      - Other (please specify)
      required: true
    - id: 6
      name: goals
      label: Main Goal
      hint: Enter the main goal of the feature.
      type: text
      options: []
      required: true
    - id: 7
      name: email
      label: Contact Email
      hint: Enter your email for follow-up.
      type: email
      options: []
      required: true
    - id: 8
      name: feedback
      label: Feedback
      hint: Share any feedback.
      type: text
      options: []
      required: false
