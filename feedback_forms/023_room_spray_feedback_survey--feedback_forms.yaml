      - option_2
      - option_3
      required: false
    - id: 4
      name: performance_rating
      label: performance
      hint: How would you rate this product
      type: number
      options: []
      required: true
    - id: 5
      name: satisfaction_rating
      label: satisfaction
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: email
      label: email
      hint: Enter your email
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 9
      name: assigned_tool
      label: assigned tool
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: output_file
      label: output file
      hint: null
      type: text
      options: []
      required: false
