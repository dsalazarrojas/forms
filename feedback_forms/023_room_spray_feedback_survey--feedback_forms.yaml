inputSchema:
  type: object
  properties:
    title: room_spray_feedback_survey
    pages:
    - id: 1
      name: customer_name
      label: customer name
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: product_name
      label: product name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: scent_preference
