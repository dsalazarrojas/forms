inputSchema:
  type: object
  properties:
    title: Teaching Session Feedback Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: session_duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: overall_rating
      label: Overall Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: trainer_name
      label: Trainer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: suggestions
      label: Suggestions
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
