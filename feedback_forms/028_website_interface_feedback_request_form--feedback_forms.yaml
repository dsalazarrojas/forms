inputSchema:
  type: object
  properties:
    title: Website Interface Feedback Request Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: browser_type
      label: Browser
      hint: null
      type: select_one
      options:
      - Chrome
      - Firefox
      - Safari
      - Edge
      - Opera
      required: false
    - id: 3
      name: device_type
      label: Device
      hint: null
      type: select_one
      options:
      - Desktop
      - Mobile
      - Tablet
      - Laptop
      required: false
    - id: 4
      name: issue_type
      label: Issue Type
      hint: null
      type: select_multiple
      options:
      - Bug
      - Feature
      - Feedback
      required: false
    - id: 5
      name: description
      label: Description
      hint: Describe the issue
      type: text
      options: []
      required: false
    - id: 6
      name: screenshot
      label: Screenshot
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Reset
      required: false
    - id: 9
      name: user_comment
      label: User Comment
      hint: Add any additional comment
      type: text
      options: []
      required: false
