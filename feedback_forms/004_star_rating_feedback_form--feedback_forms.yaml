inputSchema:
  type: object
  properties:
    title: Star Rating Feedback Form
    pages:
    - id: 1
      name: star_rating
      label: star_rating
      hint: null
      type: select_one
      options:
      - 1 Star
      - 2 Stars
      - 3 Stars
      - 4 Stars
      - 5 Stars
      required: false
    - id: 2
      name: rating_comment
      label: comment
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating_date
      label: rated_on
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
