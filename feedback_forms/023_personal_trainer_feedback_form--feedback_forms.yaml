inputSchema:
  type: object
  properties:
    title: Personal Trainer Feedback Form
    pages:
    - id: 1
      name: personal_trainer_feedback_form
      label: Feedback on Session
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: training_session_id
      label: Training Session
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: rate_training_session
      label: Rate Training Session
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: rate_trainer
      label: Rate Trainer
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: feedback
      label: Additional Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
