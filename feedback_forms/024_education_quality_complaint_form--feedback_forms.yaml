inputSchema:
  type: object
  properties:
    title: Education Quality Complaint Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: complaint_description
      label: Complaint Description
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: institution
      label: Institution
      hint: null
      type: select_one
      options:
      - School of Education
      - Academic Center
      - Institution
      required: true
    - id: 6
      name: complaint_type
      label: Complaint Type
      hint: null
      type: select_one
      options:
      - Academic Support
      - Facilities
      - Teaching
      required: true
    - id: 7
      name: description
      label: Description
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: attachment
      label: Attachment
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: submission
      label: Submission
      hint: null
      type: select_one
      options:
      - Online Submission
      - In-Person Submission
      - Other
      required: false
    - id: 10
      name: follow_up
      label: Follow-up
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text
      - No Follow-up Needed
      required: false
    - id: 11
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
    - id: 14
      name: assigned_to
      label: Assigned To
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: review_status
      label: Review Status
      hint: null
      type: select_multiple
      options:
      - Awaiting Review
      - Under Review
      - Approved
      - Approved with Conditions
      - Declined
      required: false
