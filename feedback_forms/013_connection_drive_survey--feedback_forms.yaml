inputSchema:
  type: object
  properties:
    title: Connection Drive Survey
    pages:
    - id: 1
      name: section_intro
      label: -- Connection Drive Feedback --
      hint: Your feedback helps us build better connections and improve future drives.
      type: note
      options: []
      required: false
    - id: 2
      name: participant_type
      label: I participated as a
      hint: null
      type: select_one
      options:
      - Attendee / Participant
      - Organizer / Staff
      - Partner / Sponsor
      - Volunteer
      required: true
    - id: 3
      name: event_location
      label: Which Connection Drive location did you visit?
      hint: null
      type: select_one
      options:
      - Main Campus
      - Downtown Hub
      - Virtual / Online
      - Satellite Office
      required: true
    - id: 4
      name: section_experience
      label: -- Your Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: overall_satisfaction
      label: How satisfied were you with the overall event?
      hint: null
      type: select_one
      options:
      - 5 - Extremely Satisfied
      - 4 - Satisfied
      - 3 - Neutral
      - 2 - Dissatisfied
      - 1 - Extremely Dissatisfied
      required: true
    - id: 6
      name: connection_quality_rating
      label: How would you rate the quality of connections you made?
      hint: null
      type: select_one
      options:
      - 5 - Excellent
      - 4 - Good
      - 3 - Average
      - 2 - Poor
      - 1 - N/A
      required: true
    - id: 7
      name: key_takeaway
      label: What was your single most valuable takeaway?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_logistics
      label: -- Event Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: organization_rating
      label: How well-organized was the event?
      hint: null
      type: select_one
      options:
      - 5 - Very well-organized
      - 4 - Well-organized
      - 3 - Adequately organized
      - 2 - Poorly organized
      - 1 - Disorganized
      required: true
    - id: 10
      name: timing_suitability
      label: Was the timing and duration of the event appropriate?
      hint: null
      type: select_one
      options:
      - Just right
      - Too long
      - Too short
      required: true
    - id: 11
      name: section_future
      label: -- Future Improvements --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: improvement_suggestions
      label: What is one thing we could do better next time?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: future_participation_interest
      label: Would you participate in a future Connection Drive?
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Not sure
      - 'False'
      required: true
    - id: 14
      name: contact_for_followup
      label: May we contact you for further feedback or case studies?
      hint: null
      type: select_one
      options:
      - Yes, my email is below
      - No, keep it anonymous
      required: true
    - id: 15
      name: email_address
      label: Email Address (optional)
      hint: null
      type: email
      options: []
      required: false
