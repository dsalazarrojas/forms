inputSchema:
  type: object
  properties:
    title: Device Upgrade Feedback Survey
    pages:
    - id: 1
      name: user_input_page
      label: User Input Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_rating
      label: Rating
      hint: null
      type: select_one
      options:
      - 1 - Not Satisfied
      - 2 - Satisfied
      - 3 - Very Satisfied
      required: true
    - id: 3
      name: comment
      label: Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: E-Mail
      hint: null
      type: email
      options: []
      required: false
