inputSchema:
  type: object
  properties:
    title: Digital Record System Feedback Form
    pages:
    - id: 1
      name: name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: feedback
      label: Can you provide some feedback about your experience with the Digital
        Record System?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: rating
      label: How would you rate your experience with the Digital Record System?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Bad
      required: true
    - id: 5
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: select
      label: Have you used the Digital Record System in the past?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: date
      label: What is your preferred date of use for the Digital Record System?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: note
      label: Do you have any additional comments or notes about your experience with
        the Digital Record System?
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: submit
      label: Please submit your feedback.
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: time
      label: What is your preferred time of use for the Digital Record System?
      hint: null
      type: time
      options: []
      required: true
