inputSchema:
  type: object
  properties:
    title: Winter Apparel Feedback Survey
    pages:
    - id: 1
      name: quality_rating
      label: How would you rate the quality of this winter apparel?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: features_rating
      label: Which features do you like about this winter apparel?
      hint: null
      type: select_multiple
      options:
      - Snowflake pattern
      - Insulated
      - Waterproof
      - Breathable
      required: true
    - id: 3
      name: recommendations
      label: What features do you wish were included in this report?
      hint: null
      type: select_multiple
      options:
      - Improved fit
      - Better material
      - Increased warmth
      - More style options
      required: true
    - id: 4
      name: price_rating
      label: Overall price value?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: brand_reliability
      label: How would you rate the brand's overall reputation?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: purchase_frequency
      label: How often do you buy winter apparel from this brand?
      hint: null
      type: select_one
      options:
      - Every time
      - Sometimes
      - Rarely
      - Never
      required: true
    - id: 7
      name: customer_service
      label: How would you rate the customer service?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: overall_experience
      label: What was your overall experience with this winter apparel?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: purchase_location
      label: Where did you purchase this winter apparel?
      hint: null
      type: select_one
      options:
      - Online
      - In-store
      - Both
      required: true
    - id: 10
      name: satisfaction
      label: How would you rate your level of satisfaction?
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: recommendation
      label: Will you recommend this winter apparel to a friend?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: comments
      label: Additional comments or suggestions
      hint: null
      type: text
      options: []
      required: false
