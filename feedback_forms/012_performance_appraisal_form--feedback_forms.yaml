inputSchema:
  type: object
  properties:
    title: Performance Appraisal Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: performance_period
      label: Performance Period
      hint: null
      type: select_one
      options:
      - First Quarter
      - Second Quarter
      - Third Quarter
      - Fourth Quarter
      required: true
    - id: 3
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: performance_score
      label: Performance Score
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: areas_of_improvement
      label: Areas of Improvement
      hint: null
      type: select_multiple
      options:
      - First Quarter
      - Second Quarter
      - Third Quarter
      - Fourth Quarter
      required: true
    - id: 7
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: evaluator_name
      label: Evaluator Name
      hint: null
      type: text
      options: []
      required: false
