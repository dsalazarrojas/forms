inputSchema:
  type: object
  properties:
    title: Patient Feedback Submission Form
    pages:
    - id: 1
      name: patient_feedback_form_1
      label: Patient Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_feedback_form_2
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: feedback_question_1
      label: How would you rate the overall quality of your visit?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: feedback_question_2
      label: How would you rate the care provided by your doctor?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: feedback_question_3
      label: Were you treated with dignity and respect?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: feedback_question_4
      label: Were you provided with all necessary medical information about your visit?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: patient_feedback_form_8
      label: Do you have any recommendations or feedback?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: patient_feedback_form_9
      label: Would you like to leave us a comment?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: patient_feedback_form_11
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: patient_feedback_form_12
      label: Time
      hint: null
      type: time
      options: []
      required: true
