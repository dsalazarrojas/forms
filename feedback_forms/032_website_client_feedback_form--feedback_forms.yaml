      name: page1
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: Enter a valid email
      type: email
      options: []
      required: false
    - id: 4
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
