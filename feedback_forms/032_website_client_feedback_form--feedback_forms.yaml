      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Website Usability
      - Website Content
      - Website Design
      - Website Performance
      - Website Features
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: note
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
