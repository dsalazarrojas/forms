        name: visitor_type
        label: Are You a Visitor or Vendor?
        hint: What is your role at this market?
        type: select_one
        options:
          - Visitor - Browsing Only
          - Visitor - Made Purchase
          - Vendor - Displaying Products
          - Vendor - Selling Products
          - Staff or Organizer
        required: true
      - id: 3
        name: respondent_name
        label: Your Name (Optional)
        hint: Your first and last name
        type: text
        options: []
        required: false
      - id: 4
        name: email_address
        label: Email Address (Optional)
        hint: For follow-up communications
        type: email
        options: []
        required: false
      - id: 5
        name: visit_date
        label: Today's Date
        hint: When are you visiting the market?
        type: date
        options: []
        required: true
      - id: 6
