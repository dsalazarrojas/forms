inputSchema:
  type: object
  properties:
    title: Bishop Feedback Survey
    pages:
      - id: 1
        name: feedback_intro
        label: -- Bishop Leadership Feedback Survey --
        hint: Your honest feedback helps us serve our parish community better
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Your Name
        hint: Optional - provide your name or remain anonymous
        type: text
        options: []
        required: false
      - id: 3
        name: respondent_email
        label: Email Address
        hint: We will not share your contact information
        type: email
        options: []
        required: false
      - id: 4
        name: parish_name
        label: Parish Name
        hint: null
        type: text
        options: []
        required: true
      - id: 5
        name: leadership_clarity_rating
        label: Rate the Bishop's clarity in communicating vision - Unclear (1) to Very Clear (5)
        hint: How well does the bishop communicate the diocesan vision?
        type: select_one
        options: ["1 - Unclear", "2 - Somewhat Unclear", "3 - Neutral", "4 - Clear", "5 - Very Clear"]
        required: true
      - id: 6
        name: pastoral_care_rating
        label: Rate pastoral care accessibility - Poor (1) to Excellent (5)
        hint: How accessible is the bishop for pastoral matters?
        type: select_one
        options: ["1 - Poor", "2 - Fair", "3 - Good", "4 - Very Good", "5 - Excellent"]
        required: true
      - id: 7
        name: financial_stewardship_rating
        label: Rate financial stewardship - Poor (1) to Excellent (5)
        hint: null
        type: select_one
        options: ["1 - Poor", "2 - Fair", "3 - Good", "4 - Very Good", "5 - Excellent"]
        required: true
      - id: 8
        name: community_engagement_rating
        label: Rate community engagement efforts - Poor (1) to Excellent (5)
        hint: null
        type: select_one
        options: ["1 - Poor", "2 - Fair", "3 - Good", "4 - Very Good", "5 - Excellent"]
        required: true
      - id: 9
        name: communication_frequency_rating
        label: Rate frequency of communication - Too Infrequent (1) to Too Frequent (5)
        hint: Is the bishop communicating with the parish at an appropriate frequency?
        type: select_one
        options: ["1 - Too Infrequent", "2 - Infrequent", "3 - Appropriate", "4 - Frequent", "5 - Too Frequent"]
        required: true
      - id: 10
        name: strengths_feedback
        label: What are the bishop's greatest strengths?
        hint: Please provide specific examples if possible
        type: text
        options: []
        required: false
      - id: 11
        name: improvement_areas
        label: What areas could the bishop improve?
        hint: Constructive feedback is appreciated
        type: text
        options: []
        required: false
      - id: 12
        name: overall_satisfaction
        label: Overall satisfaction with bishop's leadership - Dissatisfied (1) to Very Satisfied (5)
        hint: null
        type: select_one
        options: ["1 - Very Dissatisfied", "2 - Dissatisfied", "3 - Neutral", "4 - Satisfied", "5 - Very Satisfied"]
        required: true
      - id: 13
        name: additional_comments
        label: Additional comments or suggestions
        hint: null
        type: text
        options: []
        required: false
      - id: 14
        name: willing_to_discuss
        label: Are you willing to discuss your feedback further?
        hint: null
        type: select_one
        options: ["Yes", "No", "Prefer not to say"]
        required: false
      - id: 15
        name: survey_completion_date
        label: Today's Date
        hint: null
        type: date
        options: []
        required: true
