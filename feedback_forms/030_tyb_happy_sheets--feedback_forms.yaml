      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Contact email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: feedback
      label: Additional comment
      hint: null
      type: note
      options: []
