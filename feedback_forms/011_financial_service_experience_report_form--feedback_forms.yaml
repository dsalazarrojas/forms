inputSchema:
  type: object
  properties:
    title: Financial Service Experience Report Form
    pages:
    - id: 1
      name: page_1
      label: Financial Service Experience Report
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Banks and credit unions
      - Credit unions
      - Financial planners
      required: false
    - id: 3
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - In-person
      - Online
      required: true
    - id: 4
      name: service_quality
      label: Service Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: service_satisfaction
      label: Service Satisfaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 7
      name: service_problems
      label: Service Problems
      hint: null
      type: select_multiple
      options:
      - Problem with staff
      - Problem with products
      - Problem with communication
      required: false
    - id: 8
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: follow_up
      label: Follow-up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: service_improvements
      label: Service Improvements
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: other_services
      label: Other Services
      hint: null
      type: select_multiple
      options:
      - Banks and credit unions
      - Credit unions
      - Financial planners
      required: false
    - id: 12
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
