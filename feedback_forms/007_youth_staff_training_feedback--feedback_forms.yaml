    - id: 14
      name: feedback
      label: Feedback
      hint: Please select all that apply.
      type: select_multiple
      options:
      - Feedback on the training session was provided in a timely and professional
        manner.
      - The training session was conducted in a professional and respectful environment.
      - The trainer provided clear and concise instructions.
      - The trainer was knowledgeable about the subject matter.
