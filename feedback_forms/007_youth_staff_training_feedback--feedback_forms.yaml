inputSchema:
  type: object
  properties:
    title: Youth Staff Training Feedback
    pages:
    - id: 1
      name: session_id
      label: Session ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: rating
      label: Overall Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 3
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: suggestion
      label: Suggestion
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: rating_trainer
      label: Trainer
      hint: Rate the trainer's overall performance.
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 8
