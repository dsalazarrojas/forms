inputSchema:
  type: object
  properties:
    title: DIY Lease Course Feedback
    pages:
    - id: 1
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_score
      label: Feedback
      hint: null
      type: select_one
      options:
      - Not Satisfied
      - Satisfied
      - Very Satisfied
      required: true
    - id: 3
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 5
      name: submit_date
      label: Submit Date
      hint: Date of submission
      type: date
      options: []
      required: false
