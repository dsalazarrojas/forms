inputSchema:
  type: object
  properties:
    title: e_learning_session_feedback_form
    pages:
    - id: 1
      name: session_feedback
      label: Session Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rating
      label: Rating
      hint: Rate this session
      type: number
      options: []
      required: false
    - id: 3
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: instructor_feedback
      label: Instructor Feedback
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
