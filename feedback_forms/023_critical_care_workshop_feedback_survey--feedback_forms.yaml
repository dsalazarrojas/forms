inputSchema:
  type: object
  properties:
    title: Critical Care Workshop Feedback Survey
    pages:
    - id: 1
      name: workshop_participation
      label: What was your overall experience of the Critical Care Workshop?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: workshop_facilities
      label: Were the facilities and equipment adequate for the workshop?
      hint: null
      type: select_multiple
      options:
      - Facilities were excellent
      - Facilities were adequate
      - Facilities were subpar
      required: true
    - id: 3
      name: workshop_materials
      label: Were the materials and handouts provided useful?
      hint: null
      type: select_one
      options:
      - Very useful
      - Somewhat useful
      - Not very useful
      - Not at all useful
      required: true
    - id: 4
      name: workshop_length
      label: Was the workshop too long or too short?
      hint: null
      type: select_one
      options:
      - Just right
      - Too long
      - Too short
      - No opinion
      required: true
    - id: 5
      name: workshop_presentation
      label: How would you rate the presentation quality?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: workshop_food_drink
      label: Were the food and drink provided sufficient?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: workshop_speaker
      label: How would you rate the workshop speaker?
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: workshop_learning
      label: How would you rate the learning experience?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: workshop_comments
      label: Do you have any comments about the workshop?
      hint: null
      type: text
      options: []
      required: false
