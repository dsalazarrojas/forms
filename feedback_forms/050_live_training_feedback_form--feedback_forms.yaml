inputSchema:
  type: object
  properties:
    title: Live Training Feedback Form
    pages:
    - id: 1
      name: training_program
      label: Training Program
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: session_leaders
      label: Session Leaders
      hint: null
      type: select_one
      options:
      - Leader 1
      - Leader 2
      - Leader 3
      - Leader 4
      required: false
    - id: 8
      name: feedback_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: feedback_rating
      label: Feedback Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: participant_comments
      label: Participant Comments
      hint: null
      type: text
      options: []
      required: true
