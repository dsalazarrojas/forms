        name: barriers_encountered
        label: Barriers Encountered
        hint: Select all that apply
        type: select_multiple
        options:
          - None
          - Steps Without Ramps
          - Narrow Doorways
          - Heavy Doors
          - Poor Signage
          - Inaccessible Restrooms
          - Broken Elevators
          - Obstructed Pathways
          - Inadequate Lighting
          - Poor Parking Access
        required: true
      - id: 19
        name: positive_features
        label: Positive Features Noted
        hint: What worked well
        type: text
        options: []
        required: false
      - id: 20
        name: improvement_suggestions
        label: Suggestions for Improvement
        hint: Your recommendations
        type: text
        options: []
        required: false
      - id: 21
        name: overall_experience
        label: Overall Accessibility Experience
        hint: Overall rating
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
