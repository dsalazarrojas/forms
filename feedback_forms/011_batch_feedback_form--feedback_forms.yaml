inputSchema:
  type: object
  properties:
    title: Batch Feedback Form
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Optional - for follow-up
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: Where we can contact you
        type: email
        options: []
        required: false
      - id: 3
        name: batch_identifier
        label: Batch or Session Identifier
        hint: Which batch are you providing feedback for
        type: text
        options: []
        required: true
      - id: 4
        name: batch_type
        label: Batch Type
        hint: What type of batch was this
        type: select_one
        options:
          - Training Session
          - Production Batch
          - Service Delivery
          - Workshop
          - Product Release
          - Other
        required: true
      - id: 5
        name: completion_date
        label: Completion Date
        hint: When did you complete this batch
        type: date
        options: []
        required: true
      - id: 6
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall experience
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 7
        name: quality_rating
        label: Quality Rating
        hint: Rate the quality
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 8
        name: met_expectations
        label: Did This Meet Your Expectations
        hint: Yes or no
        type: select_one
        options:
          - Yes - Exceeded Expectations
          - Yes - Met Expectations
          - Partially Met Expectations
          - No - Did Not Meet Expectations
        required: true
      - id: 9
        name: what_worked_well
        label: What Worked Well
        hint: Positive aspects
        type: text
        options: []
        required: true
      - id: 10
        name: what_needs_improvement
        label: What Needs Improvement
        hint: Areas for improvement
        type: text
        options: []
        required: true
      - id: 11
        name: consistency_rating
        label: Consistency Rating
        hint: How consistent was this batch compared to others
        type: select_one
        options:
          - Very Consistent
          - Somewhat Consistent
          - Inconsistent
          - Very Inconsistent
        required: false
      - id: 12
        name: would_recommend
        label: Would You Recommend This
        hint: To others
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 13
        name: additional_feedback
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
