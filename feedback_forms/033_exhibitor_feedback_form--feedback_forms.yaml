inputSchema:
  type: object
  properties:
    title: Exhibitor Feedback Form
    pages:
    - id: 1
      name: name
      label: Exhibitor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - 1-2 stars
      - 3-4 stars
      - 5 stars
      required: false
    - id: 4
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
