inputSchema:
  type: object
  properties:
    title: Magazine Writing Challenge Submission
    pages:
    - id: 1
      name: form_id
      label: Submission Form ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: first_name
      label: First Name
      hint: First name of author or submitter
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: manuscript
      label: Manuscript
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: Email of submitter or author
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: Phone number of submitter or author
      type: text
      options: []
      required: true
    - id: 7
      name: author_bio
      label: Author Bio
      hint: A brief author bio or statement
      type: text
      options: []
      required: true
    - id: 8
      name: manuscript_type
      label: Manuscript Type
      hint: null
      type: select_one
      options:
      - Novel
      - Short Story
      - Essay
      - Poem
      - Other
      required: true
    - id: 9
      name: manuscript_length
      label: Manuscript Length
      hint: Manuscript length
      type: select_one
      options:
      - Less than 1000 words
      - 1000-2000 words
      - 2001-5000 words
      - 5001-10000 words
      - Greater than 10000 words
      required: true
    - id: 10
      name: author_experience
      label: Author Experience
      hint: Check all relevant experience
      type: select_multiple
      options:
      - Published Author
      - Published Illustrator/Artist
      - Self-Published Author
      - Published Poet
      - Published Playwright/Screenwriter
      required: true
    - id: 11
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: manuscript_file
      label: Manuscript File
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: manuscript_file_description
      label: Manuscript File Description
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: entry_fees
      label: Entry Fees
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: is_paid
      label: Paid Entry
      hint: Check if this entry requires payment
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
