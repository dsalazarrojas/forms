inputSchema:
  type: object
  properties:
    title: 90 Day Equipment Inspection Form
    pages:
    - id: 1
      name: section_header_equipment
      label: '--- Equipment Identification ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: equipment_id
      label: Equipment ID / asset tag
      hint: Manufacturer tag or internal asset number
      type: text
      options: []
      required: true
    - id: 3
      name: equipment_type
      label: Equipment type/model
      hint: e.g., Forklift Model X, Tractor 2000
      type: text
      options: []
      required: true
    - id: 4
      name: location
      label: Location or site
      hint: Building, lot or vehicle assignment
      type: text
      options: []
      required: true
    - id: 5
      name: inspection_date
      label: Inspection date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: inspector_name
      label: Inspector name
      hint: Full name of inspector
      type: text
      options: []
      required: true
    - id: 7
      name: operating_hours_or_mileage
      label: Operating hours or mileage
      hint: Provide hours or miles at inspection
      type: decimal
      options: []
      required: false
    - id: 8
      name: visual_condition
      label: Visual condition assessment
      hint: Overall visible condition
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: safety_checks_passed
      label: Safety checks passed (select all that apply)
      hint: Mark all inspected items that passed
      type: select_multiple
      options:
      - Brakes
      - Lights and signals
      - Tires and wheels
      - Fluid leaks
      - Steering and suspension
      - Emergency equipment
      required: true
    - id: 10
      name: maintenance_required
      label: Maintenance required?
      hint: If yes, describe action in recommended_actions
      type: select_one
      options:
      - 'False'
      - Yes - minor
      - Yes - major
      required: true
    - id: 11
      name: recommended_actions
      label: Recommended actions / repairs
      hint: Describe parts, repair steps, or vendor needed
      type: text
      options: []
      required: false
    - id: 12
      name: next_inspection_date
      label: Next scheduled inspection date
      hint: Suggested date based on 90-day cycle
      type: date
      options: []
      required: false
    - id: 13
      name: inspector_notes
      label: Inspector notes and observations
      hint: Any safety concerns, nonconformances, or immediate hazards
      type: text
      options: []
      required: false
    - id: 14
      name: inspector_signature
      label: Inspector signature
      hint: Type full name to serve as electronic signature
      type: text
      options: []
      required: true
