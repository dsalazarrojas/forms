inputSchema:
  type: object
  properties:
    title: Dance Competition Registration Form
    pages:
    - id: 1
      name: dancer_details
      label: Dancer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: performance_details
      label: Performance Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: competition_details
      label: Competition Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_details
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: performance_details_2
      label: Dance Routine Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: competition_level
      label: Level of Competition
      hint: null
      type: select_multiple
      options:
      - High
      - Low
      required: false
    - id: 8
      name: competition_format
      label: Competition Format
      hint: null
      type: select_one
      options:
      - Dance Solo
      - Dance Duo/Trio
      - Dance Group
      - Master Class
      - Other
      required: false
    - id: 9
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Ballet
      - Ballroom
      - Contemporary
      - Hip Hop
      - Jazz
      - Tap
      - Theatre/Character
      - Vocal
      - Other
      required: false
    - id: 10
      name: style
      label: Style
      hint: null
      type: select_multiple
      options:
      - Ballroom
      - Latin
      - Salsa
      - Tango
      - Other
      required: false
    - id: 11
      name: age_group
      label: Age Group
      hint: null
      type: select_multiple
      options:
      - Adult
      - Junior
      - Senior
      - Other
      required: false
    - id: 12
      name: gender
      label: Gender
      hint: null
      type: select_multiple
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 13
      name: emergency_contact_relationship
      label: Relationship
      hint: null
      type: select_multiple
      options:
      - Parent/Parent
      - Spouse/Partner
      - Other
      required: false
    - id: 14
      name: competition_level_2
      label: Competition Level 2
      hint: null
      type: select_one
      options:
      - Preliminary
      - Regional
      - Sectional
      - Preliminary-Sectional
      - Regional-Sectional
      - Championship
      required: false
    - id: 15
      name: performance_time
      label: Performance Time
      hint: null
      type: time
      options: []
      required: true
    - id: 16
      name: performance_date
      label: Performance Date
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: fee
      label: Fee
      hint: null
      type: select_multiple
      options:
      - '15.0'
      - '30.0'
      - '40.0'
      - '60.0'
      - Other
      required: false
    - id: 18
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Cheque/Postal Money Order (Payable to <NAME>)
      - Cash
      - Interac/Email Transfer
      - Credit/Debit Card
      - Other
      required: false
    - id: 19
      name: registration_number
      label: Registration Number
      hint: null
      type: number
      options: []
      required: true
    - id: 20
      name: dancer_signature
      label: Dancer Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 21
      name: emergency_contact_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: emergency_contact_phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: emergency_contact_relationship_2
      label: Emergency Contact Relationship 2
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: emergency_contact_phone_number_2
      label: Emergency Contact Phone Number 2
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: emergency_contact_note
      label: Note
      hint: null
      type: note
      options: []
      required: false
