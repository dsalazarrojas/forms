inputSchema:
  type: object
  properties:
    title: Strength Competition Entry Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: First name of the participant
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: Last name of the participant
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: Participant email address
      type: email
      options: []
      required: true
    - id: 4
      name: weight
      label: Weight
      hint: Participant's weight (kg)
      type: number
      options: []
      required: true
    - id: 5
      name: division
      label: Division
      hint: Division to compete in
      type: select_one
      options:
      - '{1: ''Men''}'
      - '{2: ''Women''}'
      - '{3: ''Masters''}'
      required: true
    - id: 6
      name: age
      label: Age
      hint: Age of the participant
      type: number
      options: []
      required: false
    - id: 7
      name: height
      label: Height
      hint: Height of the participant (cm)
      type: number
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: Participant's contact phone number
      type: text
      options: []
      required: false
    - id: 9
      name: division_description
      label: Division Description
      hint: A description of the participant's division
      type: note
      options: []
      required: true
    - id: 10
      name: competition_date
      label: Competition Date
      hint: Date of the competition
      type: date
      options: []
      required: true
    - id: 11
      name: competition_time
      label: Competition Time
      hint: Time of the competition
      type: time
      options: []
      required: true
    - id: 12
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - '{1: ''chatjimmy''}'
      - '{2: ''Other''}'
      required: false
    - id: 13
      name: notes
      label: Notes
      hint: Additional information about the participant
      type: text
      options: []
      required: false
