inputSchema:
  type: object
  properties:
    title: Art Gallery Painting Tournament Entry Form
    pages:
    - id: 1
      name: artist_name
      label: Artist name
      hint: Full name of entrant
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact email
      hint: For competition correspondence
      type: email
      options: []
      required: true
    - id: 3
      name: artwork_title
      label: Artwork title
      hint: Title of submitted painting
      type: text
      options: []
      required: true
    - id: 4
      name: medium
      label: Medium
      hint: Materials used in the work
      type: text
      options: []
      required: true
    - id: 5
      name: dimensions
      label: Dimensions
      hint: Width x height
      type: text
      options: []
      required: true
    - id: 6
      name: entry_fee_paid
      label: Entry fee paid
      hint: Confirmation of fee payment
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: image_filename
      label: Image filename
      hint: Uploaded image file name
      type: text
      options: []
      required: true
    - id: 8
      name: artist_statement
      label: Artist statement
      hint: Short statement about the work
      type: text
      options: []
      required: false
    - id: 9
      name: agree_terms
      label: Agree to competition terms
      hint: Confirm acceptance of rules
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any other information
      type: text
      options: []
      required: false
