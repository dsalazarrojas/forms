inputSchema:
  type: object
  properties:
    title: Contestant Application Form
    pages:
    - id: 1
      name: applicant_personal_header
      label: -- Applicant Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: gender_identification
      label: Gender
      hint: null
      type: select_one
      options:
      - Female
      - Male
      - Non-binary
      - Prefer not to say
      required: true
    - id: 5
      name: contact_details_header
      label: -- Contact Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: primary_phone
      label: Primary Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: physical_measurements_header
      label: -- Measurements and Details --
      hint: Required for costume and logistics planning
      type: note
      options: []
      required: false
    - id: 9
      name: height_cm
      label: Height (cm)
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: talent_performance_desc
      label: Talent/Performance Description
      hint: What will you be performing (e.g., Singing, Dance, Speech)
      type: text
      options: []
      required: true
    - id: 11
      name: background_info_header
      label: -- Experience and Motivation --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: previous_titles_awards
      label: Previous Contest Titles or Awards
      hint: List major achievements (Max 3)
      type: text
      options: []
      required: false
    - id: 13
      name: why_entering_contest
      label: Why do you want to participate in this contest
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: guardian_info_header
      label: -- Guardian Info (If under 18) --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: guardian_name
      label: Parent/Guardian Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: application_fee_reference
      label: Application Fee Reference Number
      hint: Provide your transaction ID
      type: text
      options: []
      required: true
    - id: 17
      name: application_date
      label: Date of Application
      hint: null
      type: date
      options: []
      required: true
    - id: 18
      name: terms_acceptance
      label: I agree to all contest rules and regulations
      hint: null
      type: select_one
      options:
      - I Agree
      - Other
      required: true
