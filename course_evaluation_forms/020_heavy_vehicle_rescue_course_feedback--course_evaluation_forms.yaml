      type: text
      options: []
      required: true
    - id: 4
      name: instructor_rating
      label: Instructor Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: course_rating
      label: Course Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: improvement_notes
      label: Improvement Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
