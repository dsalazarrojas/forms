      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: course_instructor
      label: course instructor
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
