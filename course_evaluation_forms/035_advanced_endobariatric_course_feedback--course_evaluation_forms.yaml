inputSchema:
  type: object
  properties:
    title: Advanced Endobariatric Course Feedback
    pages:
    - id: 1
      name: feedback_header
      label: -- Course Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: Attendee name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: session_date
      label: Session date attended
      hint: Date of course session
      type: date
      options: []
      required: true
    - id: 4
      name: content_relevance
      label: Content relevance to practice
      hint: Rate from poor to excellent
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 5
      name: hands_on_training_quality
      label: Hands on training quality
      hint: Rate practical sessions
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 6
      name: faculty_clarity
      label: Faculty clarity and expertise
      hint: Rate instructor performance
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      required: true
    - id: 7
      name: suggestions
      label: Suggestions for future courses
      hint: Topic or format recommendations
      type: text
      options: []
      required: false
    - id: 8
      name: recommend_course
      label: Would you recommend this course
      hint: Select yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: overall_rating
      label: Overall rating
      hint: Rate from 1 to 5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
