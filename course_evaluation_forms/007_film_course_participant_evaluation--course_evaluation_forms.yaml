inputSchema:
  type: object
  properties:
    title: Film Course Participant Evaluation
    pages:
    - id: 1
      name: introduction_page
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: feedback_on_lessons
      label: Feedback on Lessons
      hint: What did you learn about film craft? What would you like to know more
        about?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: feedback_on_exercises
      label: Feedback on Exercises
      hint: How would you rate the exercises and activities?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: instructor_performance
      label: Instructor Performance
      hint: How did the instructor perform?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How do you feel about your overall experience?
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 6
      name: additional_comments
      label: Additional Comments
      hint: Do you have any additional comments or suggestions?
      type: text
      options: []
      required: false
