      type: text
      options: []
      required: false
    - id: 12
      name: course_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: form_completed
      label: Form Completed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: course_completed
      label: Completed
      hint: null
