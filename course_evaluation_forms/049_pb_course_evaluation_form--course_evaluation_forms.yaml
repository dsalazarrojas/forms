inputSchema:
  type: object
  properties:
    title: PB Course Evaluation Form
    pages:
    - id: 1
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: evaluation_type
      label: Evaluation Type
      hint: null
      type: select_one
      options:
      - Formative
      - Summative
      required: true
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
