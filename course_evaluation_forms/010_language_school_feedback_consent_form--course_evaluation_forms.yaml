inputSchema:
  type: object
  properties:
    title: Language School Feedback & Consent Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: consent_to_use_feedback
      label: Consent to Use Feedback
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: language_school_name
      label: Language School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: school_email
      label: School Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: course_start_date
      label: Course Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: course_end_date
      label: Course End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 15
      name: day
      label: Day
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: language
      label: Language
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      - German
      - Japanese
      - Mandarin
      required: true
