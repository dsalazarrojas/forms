inputSchema:
  type: object
  properties:
    title: Women's Self Defense Course Feedback
    pages:
    - id: 1
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: feedback_comments
      label: Feedback Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: overall_rating
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: instructor_performance
      label: Instructor Performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: class_materials
      label: Class Materials
      hint: null
      type: select_multiple
      options:
      - Materials were sufficient
      - Materials were not sufficient
      - Materials were average
      required: false
    - id: 8
      name: course_organization
      label: Course Organization
      hint: null
      type: select_multiple
      options:
      - Well-organized
      - Not Well-organized
      - Average Organization
      required: false
    - id: 9
      name: instructor_presentation
      label: Instructor Presentation
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: feedback_to_instructor
      label: Feedback to Instructor
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: will_attend_again
      label: Will Attend Again
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: recommend_course
      label: Recommend Course
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
