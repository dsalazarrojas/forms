inputSchema:
  type: object
  properties:
    title: Course Evaluation
    pages:
    - id: 1
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: score
      label: Score
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
