inputSchema:
  type: object
  properties:
    title: Birth Arts International Parental Birth Evaluation Form
    pages:
    - id: 1
      name: section_intro
      label: -- Birth Experience Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_text
      label: Thank you for using our doula services
      hint: Please share your birth experience feedback
      type: note
      options: []
      required: false
    - id: 3
      name: parent_first_name
      label: Parent First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 4
      name: parent_last_name
      label: Parent Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 5
      name: parent_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: doula_name
      label: Doula Name
      hint: Your doula's name
      type: text
      options: []
      required: true
    - id: 7
      name: evaluation_date
      label: Birth Date
      hint: When was your birth
      type: date
      options: []
      required: true
    - id: 8
      name: section_birth_experience
      label: -- Birth Experience Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: Overall Birth Experience Satisfaction
      hint: Rate your satisfaction 1-10
      type: number
      options: []
      required: true
    - id: 10
      name: doula_support_quality
      label: Quality of Doula Support
      hint: Rate the doula support you received
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: doula_communication
      label: Doula Communication and Presence
      hint: How was the doula's communication
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: emotional_support
      label: Emotional Support Provided
      hint: Rate emotional support
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: physical_comfort
      label: Physical Comfort Measures
      hint: Help with position changes and comfort
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: advocacy
      label: Advocacy and Information
      hint: How well did doula advocate for you
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: section_impact
      label: -- Impact on Birth Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: doula_impact
      label: How Did Doula Support Impact Your Birth
      hint: Describe the impact
      type: text
      options: []
      required: true
    - id: 17
      name: positive_aspects
      label: What Was Most Helpful About Doula Support
      hint: Best aspects of the experience
      type: text
      options: []
      required: true
    - id: 18
      name: pain_management
      label: Help with Pain Management
      hint: Rate pain management support
      type: select_one
      options:
      - Very Helpful
      - Helpful
      - Somewhat Helpful
      - Not Helpful
      required: true
    - id: 19
      name: confidence_support
      label: Support in Building Confidence
      hint: Did doula help build your confidence
      type: select_one
      options:
      - Very Much
      - Somewhat
      - A Little
      - Not At All
      required: true
    - id: 20
      name: birth_outcome_satisfaction
      label: Satisfaction with Birth Outcome
      hint: How satisfied with how birth went
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 21
      name: section_medical
      label: -- Medical Team Interaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: medical_team_collaboration
      label: Doula Collaboration with Medical Team
      hint: How well did they work together
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 23
      name: communication_with_doctors
      label: Felt Heard by Medical Providers
      hint: Did providers listen to you
      type: select_one
      options:
      - Completely
      - Mostly
      - Somewhat
      - Not Really
      - Not at All
      required: false
    - id: 24
      name: section_recommendations
      label: -- Feedback and Recommendations --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: would_recommend_doula
      label: Would You Recommend This Doula
      hint: Would you suggest to others
      type: select_one
      options:
      - Strongly Recommend
      - Recommend
      - Neutral
      - Not Recommend
      - Strongly Advise Against
      required: true
    - id: 26
      name: would_use_doula_again
      label: Would You Use Doula Support for Future Birth
      hint: Would you hire again
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 27
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: How could doula better support you
      type: text
      options: []
      required: false
    - id: 28
      name: additional_feedback
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 29
      name: section_follow_up
      label: -- Follow-up and Support --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: postpartum_contact
      label: Postpartum Contact or Follow-up Provided
      hint: Did doula follow up after birth
      type: select_one
      options:
      - Yes, Excellent Follow-up
      - Yes, Some Follow-up
      - Minimal Follow-up
      - No Follow-up
      required: false
    - id: 31
      name: resource_information
      label: Received Resource Information
      hint: Did doula provide resources
      type: select_one
      options:
      - Yes, Comprehensive Resources
      - Yes, Some Resources
      - Minimal Resources
      - No Resources
      required: false
    - id: 32
      name: permission_testimonial
      label: May We Use Your Comments as Testimonial
      hint: Permission to share feedback
      type: select_one
      options:
      - Yes, Use My Feedback
      - No, Keep Private
      required: false
