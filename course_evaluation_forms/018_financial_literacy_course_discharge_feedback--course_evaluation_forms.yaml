inputSchema:
  type: object
  properties:
    title: Financial Literacy Course Discharge Feedback
    pages:
    - id: 1
      name: course_satisfaction
      label: Course Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 2
      name: instructor_performance
      label: Instructor Performance
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: instruction_quality
      label: Instruction Quality
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 4
      name: course_materials
      label: Course Materials
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 5
      name: course_duration
      label: Course Duration
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: course_facilitator
      label: Course Facilitator
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      - Very Poor
      required: false
    - id: 7
      name: comments_and_suggestions
      label: Comments and Suggestions
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: financial_literacy_outcome
      label: Financial Literacy Outcome
      hint: null
      type: select_one
      options:
      - Improved
      - No Change
      - Declined
      required: true
