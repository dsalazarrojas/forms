title: Brand perception survey
description: Generate a Brand perception survey survey for the "Concept testing surveys" category. Use the template name: "Brand perception survey template".
questions:
  - text: Overall, how satisfied are you with brand perception survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Brand, Perception, Survey, Concept]
  - text: How often do you interact with brand perception survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
