description: Gather insights into competitor offerings and market perceptions to inform
  future product development.
questions:
- options:
  - Very familiar
  - Somewhat familiar
  - Neutral
  - Not very familiar
  - Not at all familiar
  text: How familiar are you with the main competitors in this market?
  type: single
- options:
  - Excellent
  - Good
  - Average
  - Below average
  - Poor
  text: How would you rate the overall quality of competitor products/services?
  type: single
- options:
  - Pricing
  - Feature set
  - User experience
  - Customer support
  - Innovation
  - Brand recognition
  text: Which of the following aspects do competitors generally excel at? (select
    all that apply)
  type: multiple
- options:
  - High cost
  - Missing features
  - Complex UI
  - Slow support
  - Outdated tech
  - Poor reputation
  text: Which areas do competitors struggle with or have weaknesses in? (select all
    that apply)
  type: multiple
- text: What key features or benefits do competitor products offer that you find most
    compelling?
  type: text
- text: What frustrates you most about current competitor solutions?
  type: text
title: Competitor research survey
