description: A survey to gather feedback from a focus group on a new concept.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with the concept presented?
  type: single
- options:
  - Overall idea
  - Potential benefits
  - Ease of use
  - Design aesthetics
  - Innovativeness
  - Perceived value
  text: Which aspects of the concept most influenced your opinion?
  type: multiple
- options:
  - true
  - false
  - Maybe
  text: Would you recommend this concept to others?
  type: single
- text: What would you improve or change about the concept?
  type: text
- text: Do you have any additional comments or feedback?
  type: text
title: Focus group survey
