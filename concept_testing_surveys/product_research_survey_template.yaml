description: Gathering initial reactions and feedback on a new product concept.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with this product concept?
  type: single
- options:
  - Design
  - Potential features
  - Price point
  - Performance potential
  - Ease of use
  - Innovation
  text: Which aspects influenced your opinion of this concept most? (Select all that
    apply)
  type: multiple
- options:
  - Very likely
  - Somewhat likely
  - Neutral
  - Somewhat unlikely
  - Very unlikely
  text: How likely are you to consider using this product if it were available?
  type: single
- text: What improvements would you suggest for this product concept?
  type: text
- text: Do you have any other feedback or thoughts on this concept?
  type: text
title: Product research survey
