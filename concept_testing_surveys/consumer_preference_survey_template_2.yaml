description: Gather insights on consumer preferences for a new concept.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with this concept?
  type: single
- options:
  - Design
  - Price
  - Performance
  - Features
  - Support
  - Usability
  text: Which aspects influenced your opinion of this concept? (select all that apply)
  type: multiple
- options:
  - Very likely
  - Somewhat likely
  - Neutral
  - Not very likely
  - Not at all likely
  text: How likely are you to adopt or use this concept?
  type: single
- text: What would you improve or change about this concept?
  type: text
- text: Do you have any additional comments or feedback?
  type: text
title: Consumer preference survey
