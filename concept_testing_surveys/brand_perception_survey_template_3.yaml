description: A survey to gauge initial perceptions of a brand concept and gather feedback.
questions:
- options:
  - Very positive
  - Positive
  - Neutral
  - Negative
  - Very negative
  text: Overall, how would you describe your initial perception of this brand concept?
  type: single
- options:
  - Design/Visuals
  - Messaging/Values
  - Potential use
  - Uniqueness
  - Price perception
  - Reputation
  text: Which aspects most influenced your current perception of the brand concept?
    (select all that apply)
  type: multiple
- options:
  - Very likely
  - Somewhat likely
  - Neutral
  - Not very likely
  - Not at all likely
  text: Based on your current understanding, how likely are you to engage further
    with this brand concept?
  type: single
- text: What aspects, if any, would you improve or change about this brand concept?
  type: text
- text: Do you have any additional comments or feedback regarding this brand concept?
  type: text
title: Brand perception survey
