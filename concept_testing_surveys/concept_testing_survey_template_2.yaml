description: A survey to gather initial impressions and feedback on a presented concept.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with the concept presented?
  type: single
- options:
  - Design
  - Functionality
  - Value proposition
  - Ease of use
  - Problem solved
  text: Which aspects of the concept influenced your overall opinion the most? (Select
    all that apply)
  type: multiple
- options:
  - Very likely
  - Somewhat likely
  - Neutral
  - Not very likely
  - Not at all likely
  text: Based on this concept, how likely would you be to use a product or service
    built from it?
  type: single
- text: What do you find most appealing about the concept?
  type: text
- text: What would you improve or change about the concept?
  type: text
- text: Do you have any additional comments or feedback regarding the concept?
  type: text
title: Concept testing survey
