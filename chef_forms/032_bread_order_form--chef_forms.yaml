inputSchema:
  type: object
  properties:
    title: Bread Order Form
    pages:
    - id: 1
      name: bakery_name
      label: Bakery Name
      hint: Name of your bakery
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Name
      hint: Primary contact person
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Email for order communications
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Phone number for order questions
      type: text
      options: []
      required: true
    - id: 5
      name: delivery_address
      label: Delivery Address
      hint: Where should bread be delivered
      type: text
      options: []
      required: true
    - id: 6
      name: delivery_frequency
      label: Delivery Frequency
      hint: How often do you need deliveries
      type: select_one
      options:
      - Daily
      - 3 Times Per Week
      - Twice Per Week
      - Weekly
      - Bi-Weekly
      - Monthly
      required: true
    - id: 7
      name: delivery_day
      label: Preferred Delivery Day
      hint: Which day for delivery
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 8
      name: delivery_time
      label: Preferred Delivery Time
      hint: What time works best
      type: time
      options: []
      required: true
    - id: 9
      name: bread_types
      label: Bread Types
      hint: Select bread types you want to order
      type: select_multiple
      options:
      - Sourdough Loaf
      - French Baguette
      - Whole Wheat
      - White Sandwich Bread
      - Rye Bread
      - Multigrain
      - Ciabatta
      - Focaccia
      - Brioche
      - Dinner Rolls
      - Hamburger Buns
      - Hot Dog Buns
      required: true
    - id: 10
      name: quantities
      label: Quantities
      hint: Specify quantity for each type
      type: text
      options: []
      required: true
    - id: 11
      name: slice_preference
      label: Slice Preference
      hint: Do you want bread sliced
      type: select_one
      options:
      - Unsliced
      - Thin Sliced
      - Medium Sliced
      - Thick Sliced
      - Mixed
      required: true
    - id: 12
      name: packaging_preference
      label: Packaging Preference
      hint: How should bread be packaged
      type: select_one
      options:
      - Individual Bags
      - Bulk Packaging
      - Paper Bags
      - Plastic Bags
      required: true
    - id: 13
      name: quality_specifications
      label: Quality Specifications
      hint: Any specific quality requirements
      type: text
      options: []
      required: false
    - id: 14
      name: labeling_requirements
      label: Labeling Requirements
      hint: Do you need custom labels
      type: select_one
      options:
      - No Labels Needed
      - Standard Labels
      - Custom Labels Required
      required: true
    - id: 15
      name: storage_instructions
      label: Storage Instructions
      hint: Any special storage needs
      type: text
      options: []
      required: false
    - id: 16
      name: payment_terms
      label: Payment Terms
      hint: Preferred payment arrangement
      type: select_one
      options:
      - Pay on Delivery
      - Net 7
      - Net 15
      - Net 30
      - Prepaid
      required: true
    - id: 17
      name: start_date
      label: Start Date
      hint: When should deliveries begin
      type: date
      options: []
      required: true
    - id: 18
      name: special_notes
      label: Special Notes
      hint: Any other information for the supplier
      type: text
      options: []
      required: false
