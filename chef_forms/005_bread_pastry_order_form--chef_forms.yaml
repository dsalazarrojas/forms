inputSchema:
  type: object
  properties:
    title: Bread & Pastry Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Full name of the person ordering
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For order confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Contact number for delivery
      type: text
      options: []
      required: true
    - id: 4
      name: delivery_address
      label: Delivery Address
      hint: Where should we deliver
      type: text
      options: []
      required: true
    - id: 5
      name: city
      label: City
      hint: City of delivery
      type: text
      options: []
      required: true
    - id: 6
      name: postal_code
      label: Postal Code
      hint: Delivery postal code
      type: text
      options: []
      required: true
    - id: 7
      name: delivery_date
      label: Desired Delivery Date
      hint: When would you like your order
      type: date
      options: []
      required: true
    - id: 8
      name: delivery_time
      label: Preferred Delivery Time
      hint: Morning or afternoon
      type: select_one
      options:
      - Morning (8 AM - 12 PM)
      - Afternoon (12 PM - 5 PM)
      - Evening (5 PM - 8 PM)
      - Flexible
      required: true
    - id: 9
      name: bread_types
      label: Bread Types - Select Items
      hint: Choose the breads you want
      type: select_multiple
      options:
      - Sourdough
      - Whole Wheat
      - Rye
      - Ciabatta
      - Focaccia
      - Baguette
      - Multigrain
      - Gluten-Free
      required: true
    - id: 10
      name: bread_quantity
      label: Total Bread Quantity
      hint: Number of loaves or items
      type: number
      options: []
      required: true
    - id: 11
      name: pastry_types
      label: Pastry Types - Select Items
      hint: Choose the pastries you want
      type: select_multiple
      options:
      - Croissants
      - Pain au Chocolat
      - Danish Pastries
      - Eclairs
      - Macarons
      - Tarts
      - Donuts
      - Scones
      required: false
    - id: 12
      name: pastry_quantity
      label: Total Pastry Quantity
      hint: Number of pastries
      type: number
      options: []
      required: false
    - id: 13
      name: custom_requests
      label: Custom Requests
      hint: Any special requests or allergies
      type: text
      options: []
      required: false
    - id: 14
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Select any dietary requirements
      type: select_multiple
      options:
      - Gluten-free
      - Dairy-free
      - Vegan
      - Nut-free
      - Low-sugar
      - No restrictions
      required: false
    - id: 15
      name: order_occasion
      label: Order Occasion
      hint: What is this order for
      type: select_one
      options:
      - Personal consumption
      - Party or event
      - Corporate order
      - Wedding
      - Catering
      - Other
      required: false
    - id: 16
      name: packaging_preference
      label: Packaging Preference
      hint: How would you like items packaged
      type: select_one
      options:
      - Standard cardboard box
      - Gift box
      - Eco-friendly packaging
      - Paper bag
      required: false
    - id: 17
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Online Transfer
      - Cash on Delivery
      - PayPal
      required: true
    - id: 18
      name: special_instructions
      label: Special Instructions
      hint: Any additional notes
      type: text
      options: []
      required: false
