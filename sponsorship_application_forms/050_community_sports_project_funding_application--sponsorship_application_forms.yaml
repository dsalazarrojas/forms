inputSchema:
  type: object
  properties:
    title: Community Sports Project Funding Application
    pages:
    - id: 1
      name: applicant_info
      label: Applicant Information
      hint: Your contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: title
      label: Title or Position
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: organization_type
      label: Organization Type
      hint: null
      type: select_one
      options:
      - Youth Sports League
      - Community Sports Club
      - School Team
      - Recreation Department
      - Nonprofit Organization
      - Other
      required: true
    - id: 7
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: zip_code
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: project_info
      label: Project Information
      hint: Details about your project
      type: note
      options: []
      required: false
    - id: 14
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: project_description
      label: Project Description
      hint: What is your project
      type: text
      options: []
      required: true
    - id: 16
      name: sport_type
      label: Sport or Activity
      hint: null
      type: select_one
      options:
      - Basketball
      - Soccer
      - Baseball
      - Softball
      - Football
      - Volleyball
      - Tennis
      - Swimming
      - Track and Field
      - Multi-Sport
      - Other
      required: true
    - id: 17
      name: project_goals
      label: Project Goals
      hint: What do you want to achieve
      type: text
      options: []
      required: true
    - id: 18
      name: target_audience
      label: Target Audience
      hint: Who will benefit
      type: text
      options: []
      required: true
    - id: 19
      name: participants_count
      label: Expected Number of Participants
      hint: null
      type: number
      options: []
      required: true
    - id: 20
      name: age_groups
      label: Age Groups Served
      hint: Select all that apply
      type: select_multiple
      options:
      - Under 6
      - 6-10 years
      - 11-14 years
      - 15-18 years
      - 19-25 years
      - Adults
      - Seniors
      required: true
    - id: 21
      name: timeline
      label: Project Timeline
      hint: Start and end dates
      type: note
      options: []
      required: false
    - id: 22
      name: start_date
      label: Project Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 23
      name: end_date
      label: Project End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 24
      name: duration
      label: Project Duration
      hint: null
      type: select_one
      options:
      - One-Time Event
      - Less than 1 Month
      - 1-3 Months
      - 3-6 Months
      - 6-12 Months
      - Ongoing
      required: true
