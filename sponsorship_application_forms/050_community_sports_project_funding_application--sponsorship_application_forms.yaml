      name: budget_section
      label: Budget Information
      hint: Financial details
      type: note
      options: []
      required: false
    - id: 26
      name: total_budget
      label: Total Project Budget
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 27
      name: amount_requested
      label: Amount Requested
      hint: In dollars
      type: number
      options: []
      required: true
    - id: 28
      name: budget_breakdown
      label: Budget Breakdown
      hint: How will funds be used
      type: text
      options: []
      required: true
    - id: 29
      name: funding_sources
      label: Other Funding Sources
      hint: Select all that apply
      type: select_multiple
      options:
      - Organization Funds
      - Participant Fees
      - Fundraising
      - Other Grants
      - Corporate Sponsorship
      - Individual Donations
      - None
      required: true
    - id: 30
      name: other_funding_amount
      label: Amount from Other Sources
      hint: In dollars
      type: number
      options: []
      required: false
    - id: 31
      name: expenses
      label: Major Expense Categories
      hint: Select all that apply
      type: select_multiple
      options:
      - Equipment
      - Facilities
      - Uniforms
      - Transportation
      - Insurance
      - Staff or Coaches
      - Officials
      - Marketing
      - Administrative
      - Other
      required: true
    - id: 32
      name: sustainability
      label: How Will the Project Be Sustained
      hint: After funding ends
      type: text
      options: []
      required: true
    - id: 33
      name: impact
      label: Expected Community Impact
      hint: What difference will it make
      type: text
      options: []
      required: true
    - id: 34
      name: success_metrics
      label: How Will You Measure Success
      hint: Key performance indicators
      type: text
      options: []
      required: true
    - id: 35
      name: organization_history
      label: Organization History
      hint: How long have you operated
      type: text
      options: []
      required: false
    - id: 36
      name: previous_funding
      label: Have You Received Funding Before
      hint: null
      type: select_one
      options:
      - Yes - From This Source
      - Yes - From Other Sources
      - No - First Time
      required: true
    - id: 37
      name: previous_details
      label: Previous Funding Details
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 38
      name: supporting_documents
      label: Supporting Documents
      hint: What are you including
      type: select_multiple
      options:
      - Budget Spreadsheet
      - Project Plan
      - Organization Bylaws
      - Tax-Exempt Status
      - Letters of Support
      - Photos
      - Other
      required: false
    - id: 39
      name: references
      label: Professional References
      hint: Names and contact info
      type: text
      options: []
      required: false
    - id: 40
      name: additional_comments
      label: Additional Comments
      hint: Anything else to share
      type: text
      options: []
      required: false
    - id: 41
      name: certification
      label: I Certify This Information Is Accurate
      hint: null
      type: select_one
      options:
      - Yes - I Certify
      - No - I Do Not Certify
      required: true
    - id: 42
      name: applicant_signature
      label: Applicant Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 43
      name: signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
