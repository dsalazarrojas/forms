inputSchema:
  type: object
  properties:
    title: Equipment Inventory Record Form
    pages:
    - id: 1
      name: asset_name
      label: Asset Name
      hint: Enter asset name here
      type: text
      options: []
      required: true
    - id: 2
      name: asset_type
      label: Asset Type
      hint: Choose an asset type
      type: select_one
      options:
      - Asset
      - Equipment
      - Vehicle
      - Tool
      - Other
      required: true
    - id: 3
      name: asset_tag
      label: Asset Tag
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: serial_number
      label: Serial Number
      hint: Enter serial number here
      type: text
      options: []
      required: true
    - id: 5
      name: location
      label: Location
      hint: Where can be found?
      type: text
      options: []
      required: true
    - id: 6
      name: condition
      label: Condition
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: purchase_date
      label: Purchase Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: purchase_cost
      label: Purchase Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: last_inspection_date
      label: Last Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: next_inspection_date
      label: Next Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: asset_owner
      label: Asset Owner
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
