inputSchema:
  type: object
  properties:
    title: GoFundMe Donation Form
    pages:
    - id: 1
      name: form_title
      label: form_title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: full_name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: donation_amount
      label: donation_amount
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: donation_frequency
      label: donation_frequency
      hint: Select one-time or recurring donation
      type: select_one
      options:
      - One-Time
      - Recurring
      required: true
    - id: 5
      name: payment_method
      label: payment_method
      hint: Select one or more payment methods
      type: select_multiple
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 6
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: address_1
      label: address_1
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: address_2
      label: address_2
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: city
      label: city
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: zip
      label: zip
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: cause
      label: cause
      hint: null
      type: select_multiple
      options:
      - Animal Shelter
      - Environment
      - Education
      - Health
      - Homelessness
      required: false
