inputSchema:
  type: object
  properties:
    title: AE FUNDRAISING PUBG Tournament Registration
    pages:
    - id: 1
      name: section_header_event_info
      label: '--- Event & Donation Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: registration_date
      label: Registration date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: full_name
      label: Full name
      hint: Enter full legal name or preferred display name
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email address
      hint: Confirmation and event updates will be sent here
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone number
      hint: Optional but helpful for urgent contact
      type: phone
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of birth
      hint: Participants must be 16+ (minimum age may apply)
      type: date
      options: []
      required: false
    - id: 7
      name: age
      label: Age
      hint: null
      type: integer
      options: []
      required: false
    - id: 8
      name: registration_type
      label: Registration type
      hint: Solo players enter "Solo"; team leaders choose "Team (captain)"
      type: select_one
      options:
      - Solo
      - Team (captain)
      - Spectator
      required: true
    - id: 9
      name: team_name
      label: Team name (if registering as a team)
      hint: Leave blank if Solo or Spectator
      type: text
      options: []
      required: false
    - id: 10
      name: teammate_usernames
      label: Teammate in-game names (comma-separated)
      hint: Enter up to 3 teammate PUBG usernames
      type: text
      options: []
      required: false
    - id: 11
      name: experience_level
      label: Experience level
      hint: Choose the option that best describes your average skill
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Professional
      required: true
    - id: 12
      name: platform
      label: Platform
      hint: Which platform will you play on?
      type: select_one
      options:
      - PC
      - Mobile
      - Console
      required: true
    - id: 13
      name: donation_amount
      label: Donation amount (USD)
      hint: Minimum suggested donation $5. Enter 0 to register without donating
      type: decimal
      options: []
      required: true
    - id: 14
      name: payment_method
      label: Preferred payment method for donation
      hint: Used to reconcile donations after registration
      type: select_one
      options:
      - PayPal
      - Bank transfer
      - Cash on arrival
      - Other
      required: true
    - id: 15
      name: how_heard
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Social media
      - Friend or family
      - Gaming community/forum
      - Streamer
      - Flyer or poster
      - Other
      required: false
    - id: 16
      name: dietary_requirements
      label: Dietary restrictions (if provided meals)
      hint: List allergies or restrictions, or leave blank
      type: text
      options: []
      required: false
    - id: 17
      name: emergency_contact_name
      label: Emergency contact name
      hint: Provide someone we can contact in case of emergency
      type: text
      options: []
      required: false
    - id: 18
      name: emergency_contact_phone
      label: Emergency contact phone
      hint: null
      type: phone
      options: []
      required: false
    - id: 19
      name: consent_photos
      label: Consent to be photographed/streamed
      hint: Photos/streams may be used for promotion
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 20
      name: waivers_and_agreements
      label: Acknowledgement of rules and waiver
      hint: By selecting "I agree" you accept the tournament rules and liability waiver
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 21
      name: additional_comments
      label: Additional comments or notes
      hint: Include accessibility requests, scheduling constraints, or questions
      type: text
      options: []
      required: false
