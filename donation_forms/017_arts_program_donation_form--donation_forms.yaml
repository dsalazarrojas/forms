inputSchema:
  type: object
  properties:
    title: Arts Program Donation Form
    pages:
    - id: 1
      name: donation_header
      label: -- Support the Arts --
      hint: Your contribution helps us keep the arts alive in our community
      type: note
      options: []
      required: false
    - id: 2
      name: donor_full_name
      label: Donor Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: donor_email
      label: Email Address
      hint: For your tax-deductible receipt
      type: email
      options: []
      required: true
    - id: 4
      name: donation_amount
      label: Donation Amount
      hint: Select or enter an amount in USD
      type: select_one
      options:
      - 25
      - 50
      - 100
      - 250
      - 500
      - Other Amount
      required: true
    - id: 5
      name: custom_amount
      label: Other Amount
      hint: Enter value if Other Amount selected above
      type: number
      options: []
      required: false
    - id: 6
      name: frequency
      label: Donation Frequency
      hint: null
      type: select_one
      options:
      - One-time Gift
      - Monthly Recurring
      - Annual Recurring
      required: true
    - id: 7
      name: designation
      label: Where should your gift be directed
      hint: null
      type: select_one
      options:
      - General Fund - Greatest Need
      - Youth Art Scholarships
      - Community Mural Projects
      - Senior Art Workshops
      - Gallery Maintenance
      required: true
    - id: 8
      name: tribute_info
      label: Is this gift in honor or memory of someone
      hint: e.g. In Memory of Jane Doe
      type: text
      options: []
      required: false
    - id: 9
      name: corporate_match
      label: Does your employer match donations
      hint: null
      type: select_one
      options:
      - true
      - false
      - I dont know
      required: false
    - id: 10
      name: newsletter_opt_in
      label: Subscribe to our monthly arts newsletter
      hint: null
      type: select_one
      options:
      - Yes, please
      - No, thanks
      required: false
