inputSchema:
  type: object
  properties:
    title: Community Center Donation Form
    pages:
    - id: 1
      name: donor_name
      label: Donor name
      hint: Individual or organization name
      type: text
      options: []
      required: true
    - id: 2
      name: donor_email
      label: Donor email
      hint: Where donation receipt will be sent
      type: email
      options: []
      required: true
    - id: 3
      name: donation_amount
      label: Donation amount
      hint: Enter numeric amount in local currency
      type: number
      options: []
      required: true
    - id: 4
      name: donation_purpose
      label: Donation purpose
      hint: Designate a program or general fund
      type: select_one
      options:
      - General support
      - Youth programs
      - Facility improvements
      - Scholarships
      - Other
      required: false
    - id: 5
      name: recurring_donation
      label: Set up recurring donation
      hint: Choose recurrence frequency
      type: select_one
      options:
      - One time
      - Monthly
      - Quarterly
      - Annually
      required: true
    - id: 6
      name: payment_method
      label: Payment method
      hint: Choose a payment option
      type: select_one
      options:
      - Credit card
      - Bank transfer
      - Check
      - Online payment portal
      required: true
    - id: 7
      name: anonymous_donation
      label: Make donation anonymous
      hint: If yes donor will not be listed publicly
      type: select_one
      options:
      - Yes make anonymous
      - No display name
      required: false
    - id: 8
      name: mailing_address
      label: Mailing address for receipts
      hint: Optional postal address
      type: text
      options: []
      required: false
