inputSchema:
  type: object
  properties:
    title: Campaign Pledge Validation Form
    pages:
    - id: 1
      name: donor_first_name
      label: Donor First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 2
      name: donor_last_name
      label: Donor Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: donor_email
      label: Donor Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: donor_phone
      label: Donor Phone
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: donor_address
      label: Donor Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 6
      name: donor_city
      label: City
      hint: City or town
      type: text
      options: []
      required: true
    - id: 7
      name: donor_state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 8
      name: donor_zip
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 9
      name: campaign_name
      label: Campaign Name
      hint: Which campaign
      type: text
      options: []
      required: true
    - id: 10
      name: pledge_amount
      label: Pledge Amount
      hint: Dollar amount
      type: number
      options: []
      required: true
    - id: 11
      name: pledge_currency
      label: Currency
      hint: Select currency
      type: select_one
      options:
      - USD
      - CAD
      - EUR
      - GBP
      - AUD
      - Other
      required: true
    - id: 12
      name: pledge_type
      label: Pledge Type
      hint: Select type
      type: select_one
      options:
      - One-time pledge
      - Monthly recurring
      - Quarterly recurring
      - Annual recurring
      - Multi-year pledge
      required: true
    - id: 13
      name: pledge_start_date
      label: Pledge Start Date
      hint: When will payments begin
      type: date
      options: []
      required: true
    - id: 14
      name: pledge_end_date
      label: Pledge End Date
      hint: If applicable
      type: date
      options: []
      required: false
    - id: 15
      name: payment_method
      label: Preferred Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - Bank transfer
      - Check
      - Cash
      - PayPal
      - Other
      required: true
    - id: 16
      name: pledge_purpose
      label: Pledge Purpose or Designation
      hint: What is this for
      type: select_one
      options:
      - General fund
      - Specific program
      - Capital campaign
      - Emergency relief
      - Scholarship fund
      - Building fund
      - Other
      required: true
    - id: 17
      name: pledge_purpose_other
      label: If Other - Specify
      hint: Describe
      type: text
      options: []
      required: false
    - id: 18
      name: employer_match
      label: Is Your Employer Matching This Gift
      hint: Yes or no
      type: select_one
      options:
      - Yes - will submit
      - Yes - need information
      - false
      - Not sure
      required: true
    - id: 19
      name: anonymity_request
      label: Do You Wish to Remain Anonymous
      hint: Yes or no
      type: select_one
      options:
      - No - public acknowledgment okay
      - Anonymous to public only
      - Fully anonymous
      required: true
    - id: 20
      name: acknowledgment_preference
      label: How Would You Like to Be Acknowledged
      hint: Select preference
      type: select_one
      options:
      - Public listing
      - Private thank you only
      - No acknowledgment
      - Newsletter mention
      - Event recognition
      required: false
    - id: 21
      name: pledge_validated_by
      label: Validated By
      hint: Staff member name
      type: text
      options: []
      required: false
    - id: 22
      name: validation_date
      label: Validation Date
      hint: Date validated
      type: date
      options: []
      required: false
    - id: 23
      name: validation_method
      label: Validation Method
      hint: How was it validated
      type: select_one
      options:
      - Phone call
      - Email confirmation
      - Written letter
      - In person
      - Online verification
      required: false
    - id: 24
      name: validation_notes
      label: Validation Notes
      hint: Any notes
      type: text
      options: []
      required: false
    - id: 25
      name: pledge_status
      label: Pledge Status
      hint: Current status
      type: select_one
      options:
      - Pending validation
      - Validated
      - Payment received
      - Partially fulfilled
      - Fully fulfilled
      - Cancelled
      required: true
    - id: 26
      name: donor_commitment_level
      label: Donor Commitment Level
      hint: Staff assessment
      type: select_one
      options:
      - Very committed
      - Committed
      - Somewhat committed
      - Uncertain
      - Low commitment
      required: false
    - id: 27
      name: follow_up_needed
      label: Is Follow-up Needed
      hint: Yes or no
      type: select_one
      options:
      - Yes - schedule call
      - Yes - send information
      - No - all set
      required: true
    - id: 28
      name: follow_up_date
      label: Follow-up Date
      hint: If needed
      type: date
      options: []
      required: false
    - id: 29
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
