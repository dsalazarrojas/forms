inputSchema:
  type: object
  properties:
    title: Burn Unit Expansion Donation Form
    pages:
    - id: 1
      name: header
      label: -- Donation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: donor_full_name
      label: Donor full name
      hint: Name as it should appear on donation records
      type: text
      options: []
      required: true
    - id: 3
      name: donor_email
      label: Donor email
      hint: For donation receipts and acknowledgements
      type: email
      options: []
      required: true
    - id: 4
      name: donation_amount
      label: Donation amount
      hint: Enter amount in local currency
      type: number
      options: []
      required: true
    - id: 5
      name: donation_type
      label: Donation type
      hint: Choose one
      type: select_one
      options:
      - One time
      - Monthly pledge
      - In honor of someone
      required: true
    - id: 6
      name: tribute_name
      label: Tribute name
      hint: If donation is in honor of someone leave blank otherwise
      type: text
      options: []
      required: false
    - id: 7
      name: contact_phone
      label: Contact phone
      hint: Optional phone number for donor
      type: text
      options: []
      required: false
    - id: 8
      name: billing_address
      label: Billing address
      hint: Street address for receipts if required
      type: text
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment method
      hint: Select preferred payment method
      type: select_one
      options:
      - Credit card
      - Bank transfer
      - Check
      - Online payment gateway
      required: true
    - id: 10
      name: agree_receipt
      label: Request donation receipt
      hint: Choose if you would like a receipt emailed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: message_to_recipients
      label: Message to recipients
      hint: Optional message to include with tribute
      type: text
      options: []
      required: false
