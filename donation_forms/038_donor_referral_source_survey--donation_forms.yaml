inputSchema:
  type: object
  properties:
    title: Donor Referral Source Survey
    pages:
    - id: 1
      name: motivated_to_support
      label: What motivated you to support our organization?
      hint: null
      type: select_one
      options:
      - Donor Newsletter
      - Social Media
      - Referral from a friend or family member
      - Online search
      - Word of mouth
      - Volunteer
      - Event
      - Radio or TV ad
      - Other
      required: true
    - id: 2
      name: referred_someone
      label: Have you referred anyone to our organization before?
      hint: null
      type: select_multiple
      options:
      - Donor Newsletter
      - Social Media
      - Referral from a friend or family member
      - Online search
      required: true
    - id: 3
      name: initial_heard_about
      label: How did you hear about us initially?
      hint: null
      type: select_one
      options:
      - Donor Newsletter
      - Social Media
      - Referral from a friend or family member
      - Online search
      - Word of mouth
      - Volunteer
      - Event
      - Radio or TV ad
      required: true
    - id: 4
      name: interacted_with_organization
      label: Have you ever interacted with our organization through social media?
      hint: null
      type: select_multiple
      options:
      - Facebook
      - Twitter
      - Instagram
      - YouTube
      - LinkedIn
      - Other
      required: false
    - id: 5
      name: has_friend_support
      label: Do you have any friends or family members who support our organization?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: referral_info
      label: What is your contact information for the person who referred you to our
        organization?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: heard_mission_values
      label: How did you hear about our organization's mission or values?
      hint: null
      type: select_one
      options:
      - Donor Newsletter
      - Social Media
      - Referral from a friend or family member
      - Online search
      - Word of mouth
      - Volunteer
      - Event
      - Radio or TV ad
      - Other
      required: true
    - id: 8
      name: attended_event
      label: Have you ever attended an event hosted by our organization?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: heard_event_info
      label: How did you hear about our organization's events?
      hint: null
      type: select_multiple
      options:
      - Donor Newsletter
      - Social Media
      - Referral from a friend or family member
      - Online search
      - Word of mouth
      - Volunteer
      - Event
      - Radio or TV ad
      - Other
      required: false
    - id: 10
      name: comments
      label: Do you have any other questions or comments about our organization?
      hint: null
      type: text
      options: []
      required: false
