inputSchema:
  type: object
  properties:
    title: Authorize.Net Donation Form
    pages:
    - id: 1
      name: donation_date
      label: Donation Date
      hint: Date of this donation
      type: date
      options: []
      required: true
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Your email contact
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 6
      name: street_address
      label: Street Address
      hint: Your residential address
      type: text
      options: []
      required: false
    - id: 7
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: false
    - id: 8
      name: state
      label: State or Province
      hint: Your state
      type: text
      options: []
      required: false
    - id: 9
      name: zip_code
      label: ZIP or Postal Code
      hint: Your postal code
      type: text
      options: []
      required: false
    - id: 10
      name: country
      label: Country
      hint: Your country
      type: text
      options: []
      required: false
    - id: 11
      name: donation_type
      label: Type of Donation
      hint: What are you donating for
      type: select_one
      options:
      - General Fund
      - Specific Program/Project
      - Scholarship Fund
      - Research Fund
      - Environmental Conservation
      - Wildlife Protection
      - Other Cause
      required: true
    - id: 12
      name: donation_amount
      label: Donation Amount
      hint: How much would you like to donate
      type: number
      options: []
      required: true
    - id: 13
      name: donation_frequency
      label: Donation Frequency
      hint: Is this a recurring donation
      type: select_one
      options:
      - One-Time Donation
      - Monthly Recurring
      - Quarterly Recurring
      - Annual Recurring
      - Custom Schedule
      required: true
    - id: 14
      name: recurring_duration
      label: Recurring Donation Duration
      hint: How long for recurring donations
      type: select_one
      options:
      - 6 Months
      - 12 Months
      - 24 Months
      - Indefinite Until Cancelled
      required: false
    - id: 15
      name: specific_project
      label: Specific Project or Initiative
      hint: Select a project if applicable
      type: text
      options: []
      required: false
    - id: 16
      name: in_memory_tribute
      label: In Memory or Honor of Someone
      hint: Is this a memorial donation
      type: select_one
      options:
      - No - Personal Donation
      - Yes - In Memory Of
      - Yes - In Honor Of
      required: false
    - id: 17
      name: honoree_name
      label: Honoree Name
      hint: Name of person if in memory/honor
      type: text
      options: []
      required: false
    - id: 18
      name: gift_notification
      label: Send Gift Notification
      hint: Should we notify the honoree
      type: select_one
      options:
      - Yes - Send Notification
      - No - Do Not Notify
      - Yes - Email Notification
      required: false
    - id: 19
      name: notification_email
      label: Notification Email Address
      hint: Email to send notification to
      type: email
      options: []
      required: false
    - id: 20
      name: donor_recognition
      label: Recognition Preference
      hint: How should you be recognized
      type: select_one
      options:
      - Public Recognition
      - Private - Anonymous Donation
      - Name Only - No Amount
      - List with Full Details
      required: true
    - id: 21
      name: donor_type
      label: Donor Type
      hint: Are you donating as individual or organization
      type: select_one
      options:
      - Individual
      - Organization/Corporation
      - Workplace Giving Program
      - Family Foundation
      required: false
    - id: 22
      name: organization_name
      label: Organization Name
      hint: If donating as organization
      type: text
      options: []
      required: false
    - id: 23
      name: tax_deductible
      label: Tax Deductible Donation
      hint: This donation is tax deductible
      type: select_one
      options:
      - Yes - Tax Deductible
      - No - Not Tax Deductible
      required: true
    - id: 24
      name: receipt_requested
      label: Donation Receipt Requested
      hint: Do you need a receipt
      type: select_one
      options:
      - Yes - Email Receipt
      - Yes - Mail Receipt
      - Yes - Both
      - No - Not Needed
      required: true
    - id: 25
      name: donor_consent
      label: Consent to Donation Terms
      hint: You agree to donation terms
      type: select_one
      options:
      - I Agree and Authorize Payment
      - I Do Not Agree
      required: true
