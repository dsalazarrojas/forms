inputSchema:
  type: object
  properties:
    title: Church Donation Form
    pages:
    - id: 1
      name: header_donor_info
      label: -- Donor Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: donor_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: donor_email
      label: Email Address
      hint: For gift confirmation and digital receipt
      type: email
      options: []
      required: true
    - id: 4
      name: donor_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: donor_address
      label: Mailing Address
      hint: For official year-end tax statements
      type: text
      options: []
      required: true
    - id: 6
      name: header_donation_details
      label: -- Donation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: donation_amount
      label: Donation Amount ($)
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: donation_frequency
      label: Donation Frequency
      hint: null
      type: select_one
      options:
      - One-time Gift
      - Weekly
      - Monthly
      - Quarterly
      - Annually
      required: true
    - id: 9
      name: fund_designation
      label: Fund Designation
      hint: Where would you like your gift to go?
      type: select_one
      options:
      - General Fund (Operating)
      - Tithes and Offerings
      - Building Fund
      - Missions and Outreach
      - Youth Ministry
      - benevolence/Community Support
      required: true
    - id: 10
      name: anonymous_giving
      label: Would you like to remain anonymous?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: memorial_gift
      label: Is this gift in memory or honor of someone?
      hint: null
      type: select_one
      options:
      - false
      - In Memory Of
      - In Honor Of
      required: true
    - id: 12
      name: honoree_name
      label: Name of Honoree
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 13
      name: payment_method_preference
      label: Preferred Payment Method
      hint: Instructions will follow upon submission
      type: select_one
      options:
      - Credit/Debit Card
      - Electronic Check (ACH)
      - Mailing a Physical Check
      required: true
    - id: 14
      name: additional_comments
      label: Additional Comments or Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: donation_date
      label: Date of Donation
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: tax_ack_confirmed
      label: I understand this is a tax-deductible contribution
      hint: null
      type: select_one
      options:
      - I Understand
      - Other
      required: true
