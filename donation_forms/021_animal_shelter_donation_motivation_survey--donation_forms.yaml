inputSchema:
  type: object
  properties:
    title: Animal Shelter Donation Motivation Survey
    pages:
    - id: 1
      name: donor_name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: donor_email
      label: Email Address
      hint: For follow-up if needed
      type: email
      options: []
      required: false
    - id: 3
      name: donor_type
      label: Donor Type
      hint: null
      type: select_one
      options:
      - Individual Donor
      - Family Donor
      - Corporate Donor
      - Foundation
      - Anonymous
      required: true
    - id: 4
      name: donation_history
      label: How Long Have You Been Donating to Our Shelter
      hint: null
      type: select_one
      options:
      - First Time Donor
      - Less than 1 Year
      - 1-3 Years
      - 3-5 Years
      - 5-10 Years
      - Over 10 Years
      required: true
    - id: 5
      name: donation_frequency
      label: How Often Do You Donate
      hint: null
      type: select_one
      options:
      - One-Time Only
      - Occasionally
      - Monthly
      - Quarterly
      - Annually
      required: true
    - id: 6
      name: primary_motivation
      label: What Primarily Motivates Your Donations
      hint: Select your main reason
      type: select_one
      options:
      - Love of Animals
      - Personal Experience with Shelter
      - Community Support
      - Tax Benefits
      - Matching Gift Opportunity
      - Emotional Appeal
      - Friend or Family Recommendation
      - Other
      required: true
    - id: 7
      name: emotional_connection
      label: Do You Have a Personal Connection to Our Shelter
      hint: null
      type: select_one
      options:
      - Yes - Adopted From Us
      - Yes - Volunteered
      - Yes - Worked Here
      - Yes - Friend or Family Adopted
      - No Personal Connection
      required: true
    - id: 8
      name: influence_factors
      label: What Influences Your Decision to Donate
      hint: Select all that apply
      type: select_multiple
      options:
      - Success Stories
      - Photos of Animals
      - Statistics and Impact Reports
      - Emergency Appeals
      - Matching Gift Campaigns
      - Social Media Posts
      - Email Newsletters
      - Direct Mail
      - Events
      - Word of Mouth
      required: true
    - id: 9
      name: preferred_cause
      label: Which Causes Matter Most to You
      hint: Select all that apply
      type: select_multiple
      options:
      - Medical Care for Animals
      - Daily Operations
      - Emergency Rescues
      - Spay and Neuter Programs
      - Behavioral Training
      - Senior Animal Care
      - Puppy and Kitten Programs
      - Facility Improvements
      - Community Outreach
      - Where Needed Most
      required: true
    - id: 10
      name: donation_amount_factor
      label: What Determines Your Donation Amount
      hint: null
      type: select_one
      options:
      - Personal Budget
      - Specific Need or Campaign
      - Matching Gift Opportunity
      - Suggested Amounts
      - Emotional Response
      - Regular Fixed Amount
      required: true
    - id: 11
      name: communication_preference
      label: How Do You Prefer to Hear About Donation Opportunities
      hint: Select all that apply
      type: select_multiple
      options:
      - Email
      - Direct Mail
      - Social Media
      - Phone Call
      - Text Message
      - Website
      - Events
      - Prefer Not to Be Contacted
      required: true
    - id: 12
      name: message_resonance
      label: What Types of Messages Resonate Most
      hint: null
      type: select_one
      options:
      - Individual Animal Stories
      - Shelter-Wide Impact Statistics
      - Urgent Emergency Appeals
      - Success and Happy Endings
      - Educational Content
      - Behind-the-Scenes Updates
      required: true
    - id: 13
      name: trust_factors
      label: What Builds Your Trust in a Charity
      hint: Select all that apply
      type: select_multiple
      options:
      - Financial Transparency
      - Impact Reports
      - Third-Party Ratings
      - Personal Experience
      - Recommendations
      - Low Overhead Costs
      - Clear Mission
      - Regular Communication
      required: true
    - id: 14
      name: barrier_to_giving
      label: What Might Prevent You from Donating More
      hint: Select all that apply
      type: select_multiple
      options:
      - Financial Constraints
      - Lack of Information
      - Too Many Requests
      - Concerns About Fund Usage
      - Prefer Other Charities
      - Nothing - I Give Generously
      - Other
      required: false
    - id: 15
      name: recognition_preference
      label: How Do You Prefer to Be Recognized
      hint: null
      type: select_one
      options:
      - Public Recognition
      - Private Thank You
      - Newsletter Mention
      - No Recognition Needed
      - Anonymous Preferred
      required: true
    - id: 16
      name: event_participation
      label: Have You Ever Attended Our Fundraising Events
      hint: null
      type: select_one
      options:
      - Yes - Multiple Events
      - Yes - One Event
      - No But Interested
      - No - Not Interested
      required: true
    - id: 17
      name: volunteer_interest
      label: Have You Considered Volunteering in Addition to Donating
      hint: null
      type: select_one
      options:
      - Yes - Currently Volunteer
      - Yes - Planning To
      - Considering It
      - No - Prefer to Only Donate
      required: true
    - id: 18
      name: legacy_giving
      label: Have You Considered Including Us in Your Estate Plans
      hint: null
      type: select_one
      options:
      - Yes - Already Done
      - Yes - Considering
      - No - Not at This Time
      - No - Not Interested
      required: false
    - id: 19
      name: satisfaction_level
      label: How Satisfied Are You with How We Use Donations
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 20
      name: likelihood_continue
      label: How Likely Are You to Continue Donating
      hint: null
      type: select_one
      options:
      - Very Likely
      - Likely
      - Neutral
      - Unlikely
      - Very Unlikely
      required: true
    - id: 21
      name: likelihood_increase
      label: What Would Make You More Likely to Increase Your Donation
      hint: Select all that apply
      type: select_multiple
      options:
      - More Impact Reports
      - Specific Project Funding
      - Matching Gift Opportunities
      - Recognition Programs
      - More Communication
      - Less Communication
      - Nothing - I Give What I Can
      - Other
      required: false
    - id: 22
      name: additional_feedback
      label: Any Additional Feedback or Suggestions
      hint: We value your input
      type: text
      options: []
      required: false
