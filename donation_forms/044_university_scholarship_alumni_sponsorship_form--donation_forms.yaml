inputSchema:
  type: object
  properties:
    title: University Scholarship Alumni Sponsorship Form
    pages:
    - id: 1
      name: form_header
      label: University Scholarship Alumni Sponsorship Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: donor_info
      label: Donor Information
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: donor_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: donor_email
      label: Email
      hint: Donor Email
      type: email
      options: []
      required: false
    - id: 5
      name: donor_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: sponsorship_level
      label: Sponsorship Level
      hint: null
      type: select_one
      options:
      - 'Level 1: $100-$499'
      - 'Level 2: $500-$999'
      - 'Level 3: $1,000 or more'
      required: false
    - id: 7
      name: donation_date
      label: Donation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: donation_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: donor_interests
      label: Interests
      hint: null
      type: select_multiple
      options:
      - Arts
      - Science
      - Language and Literature
      - Business
      - Health and Medicine
      - History and Culture
      - Technology
      - Engineering
      - Social Sciences and Humanities
      - Other
      required: false
