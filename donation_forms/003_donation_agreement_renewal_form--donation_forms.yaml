inputSchema:
  type: object
  properties:
    title: Donation Agreement Renewal Form
    pages:
    - id: 1
      name: donor_name
      label: Donor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: donor_address
      label: Donor Address
      hint: null
      type: text
      options: []
