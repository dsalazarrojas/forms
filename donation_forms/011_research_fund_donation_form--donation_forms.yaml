inputSchema:
  type: object
  properties:
    title: Research Fund Donation Form
    pages:
    - id: 1
      name: donor_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: gift_amount
      label: Gift Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: currency
      label: Currency
      hint: null
      type: select_one
      options:
      - USD
      - EUR
      - GBP
      - CNY
      required: false
    - id: 6
      name: donation_date
      label: Donation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: recurring_donation
      label: Recurring Donation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - PayPal
      - Credit Card
      - Bank Transfer
      required: false
    - id: 10
      name: payment_terms
      label: Payment Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - Approved
      - Pending
      - Declined
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
