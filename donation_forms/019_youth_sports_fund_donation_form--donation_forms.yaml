inputSchema:
  type: object
  properties:
    title: youth_sports_fund_donation_form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: donation_frequency
      label: Donation Frequency
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annually
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 5
      name: special_instructions
      label: Special Instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: youth_sports_programs
      label: Youth Sports Programs
      hint: null
      type: select_multiple
      options:
      - Baseball
      - Basketball
      - Football
      - Soccer
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
