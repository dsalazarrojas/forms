inputSchema:
  type: object
  properties:
    title: Blood Donation Registration Form
    pages:
    - id: 1
      name: registration_intro
      label: -- Blood Donation Registration --
      hint: Join our community of lifesaving blood donors
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: true
    - id: 6
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: address
      label: Residential Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State/Province
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: postal_code
      label: ZIP/Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: blood_type
      label: Blood Type
      hint: If known
      type: select_one
      options:
      - O+
      - O-
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - Unknown
      required: false
    - id: 13
      name: height
      label: Height (cm)
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: weight
      label: Weight (kg)
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: previous_donation
      label: Previous donation experience?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not sure
      required: true
    - id: 16
      name: preferred_donation_center
      label: Preferred Donation Center
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: contact_preferences
      label: Contact preferences
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - SMS
      required: true
    - id: 18
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
