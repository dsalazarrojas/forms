inputSchema:
  type: object
  properties:
    title: Bluepay Alumni Donation Form
    pages:
    - id: 1
      name: alumni_info_header
      label: -- Alumni Donation Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: donor_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: donor_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: donor_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: graduation_year
      label: Year of Graduation
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: major_field
      label: Major / Field of Study
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: donation_details_header
      label: -- Donation Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: donation_amount_selection
      label: Donation Amount
      hint: null
      type: select_one
      options:
      - $25
      - $50
      - $100
      - $250
      - $500
      - Other
      required: true
    - id: 9
      name: custom_donation_amount
      label: If Other - Please enter amount
      hint: Currency amount without symbol
      type: number
      options: []
      required: false
    - id: 10
      name: fund_designation
      label: Where would you like your donation to go?
      hint: null
      type: select_one
      options:
      - General Scholarship Fund
      - Department Specific
      - Athletics
      - Campus Improvements
      - Research Grants
      required: true
    - id: 11
      name: payment_header
      label: -- Payment Information - Bluepay --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: cc_name
      label: Name on Card
      hint: As it appears on your credit card
      type: text
      options: []
      required: true
    - id: 13
      name: donation_frequency
      label: Donation Frequency
      hint: null
      type: select_one
      options:
      - One-time
      - Monthly
      - Quarterly
      - Annually
      required: true
    - id: 14
      name: thank_you_note
      label: Thank you for your generous support!
      hint: null
      type: note
      options: []
      required: false
