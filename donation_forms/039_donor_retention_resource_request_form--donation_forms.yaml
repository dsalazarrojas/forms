      type: select_multiple
      options:
      - Now
      - Soon
      - Flexible
      - Flexible (To be determined)
      required: false
    - id: 13
      name: resource_request_comments
      label: resource_request_comments
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: follow_up
      label: follow_up
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 15
      name: communication
      label: communication
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Text/SMS
      - In-app
      - None
      required: false
