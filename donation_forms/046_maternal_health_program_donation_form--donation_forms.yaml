inputSchema:
  type: object
  properties:
    title: Maternal Health Program Donation Form
    pages:
    - id: 1
      name: donation_amount
      label: Donations Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: donation_frequency
      label: Frequency of Donations
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Yearly
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit/Debit Card
      - Bank Transfer
      required: false
    - id: 4
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
