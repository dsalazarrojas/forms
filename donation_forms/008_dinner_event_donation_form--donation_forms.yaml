inputSchema:
  type: object
  properties:
    title: Dinner Event Donation Form
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: donor_name
      label: Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: donation_items
      label: Donation Items
      hint: null
      type: select_multiple
      options:
      - Apple
      - Banana
      - Carrot
      required: false
    - id: 6
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: event_details_2
      label: Event Details 2
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: confirm_donation
      label: Confirm Donations
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
