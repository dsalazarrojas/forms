      name: other_notes
      label: Other Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: other_donation_source
      label: Other Donations Source
      hint: null
      type: select_one
      options:
      - Donated
      - Pledged
      - Funded
      - Refunded
      required: false
    - id: 17
      name: notes_frequency
      label: Notes (other) Frequency
      hint: null
      type: select_one
      options:
      - One-time
      - Regular
      - Irregular
      required: false
    - id: 18
      name: other_notes_source
      label: Other Notes Source
      hint: null
      type: select_one
      options:
      - Donated
      - Pledged
      - Funded
      - Refunded
      required: false
