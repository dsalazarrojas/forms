inputSchema:
  type: object
  properties:
    title: Donation Distribution Report Form
    pages:
    - id: 1
      name: distribution_date
      label: Distribution Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: donor_name
      label: Donor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: donation_type
      label: Donation Type
      hint: null
      type: select_one
      options:
      - Monetary
      - In-Kind
      - Goods
      required: false
    - id: 5
      name: distribution_status
      label: Distribution Status
      hint: null
      type: select_multiple
      options:
      - Shipped
      - In Transit
      - Not Yet Shipped
      - Cancelled
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: donor_email
      label: Donor Email
      hint: null
      type: email
      options: []
      required: false
