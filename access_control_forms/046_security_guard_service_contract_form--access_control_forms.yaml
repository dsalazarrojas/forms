      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: property_manager
      label: Property Manager
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: venue
      label: Venue
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submission_notes
      label: Submission Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: confirm_guard_coverage
      label: Confirm Guard Coverage
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: confirm_service_provider
      label: Confirm Service Provider
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
