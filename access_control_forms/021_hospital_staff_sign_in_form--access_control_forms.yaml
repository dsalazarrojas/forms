inputSchema:
  type: object
  properties:
    title: Hospital Staff Sign In Form
    pages:
    - id: 1
      name: shift_start_time
      label: Shift Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 2
      name: shift_end_time
      label: Shift End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - Hospital Administration
      - ICU
      - Emergency Department
      - Operating Department
      - Laboratory
      - Pharmacy
      required: true
    - id: 5
      name: role
      label: Role
      hint: null
      type: select_multiple
      options:
      - Doctor
      - Nurse
      - Technician
      - Other
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
