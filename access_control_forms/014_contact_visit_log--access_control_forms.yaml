inputSchema:
  type: object
  properties:
    title: Contact Visit Log
    pages:
    - id: 1
      name: section_visitor_info
      label: -- Visitor Information --
      hint: Please complete this log upon arrival and departure.
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_name
      label: Visitor Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: visitor_company
      label: Visitor Company (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: visitor_phone
      label: Visitor Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: visitor_email
      label: Visitor Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: section_visit_details
      label: -- Visit Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: entry_date
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: entry_time
      label: Time of Entry
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: exit_time
      label: Time of Exit
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: visit_purpose
      label: Purpose of Visit
      hint: null
      type: select_one
      options:
      - Meeting
      - Interview
      - Delivery
      - Maintenance
      - Other
      required: true
    - id: 11
      name: host_name
      label: Person Visiting (Host Name)
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: section_security
      label: -- Security Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: badge_issued
      label: Visitor Badge Issued?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: badge_number
      label: Visitor Badge Number
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: nondisclosure_agreement
      label: I have signed the Non-Disclosure Agreement (NDA)
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: privacy_consent
      label: I agree to my data being recorded for security purposes
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
