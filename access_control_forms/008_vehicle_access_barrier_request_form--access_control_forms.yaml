inputSchema:
  type: object
  properties:
    title: Vehicle Access Barrier Request Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_vehicle
      label: User Vehicle
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: gate_type
      label: Gate Type
      hint: null
      type: select_one
      options:
      - Gate
      - Boom Gate
      - Gatehouse
      required: false
    - id: 5
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: vehicle_type
      label: Vehicle Type
      hint: null
      type: select_multiple
      options:
      - Car
      - Truck
      - Van
      - Ute
      - Trailer
      required: false
    - id: 7
      name: vehicle_plate
      label: Vehicle Plate Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact
      label: Contact Information
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      required: false
    - id: 9
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: gate_access
      label: Gate Access
      hint: null
      type: select_multiple
      options:
      - Grant Access
      - Deny
      required: false
