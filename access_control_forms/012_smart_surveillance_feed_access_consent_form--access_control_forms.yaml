inputSchema:
  type: object
  properties:
    title: Smart Surveillance Feed Access Consent Form
    pages:
    - id: 1
      name: form_title
      label: Form Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_birth
      label: Time of Birth
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: consent_to_share
      label: I consent to sharing my information with
      hint: null
      type: select_one
      options:
      - Surveillance Feed
      - Camera Feed
      - Other
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: form_completion_status
      label: Form Completion Status
      hint: null
      type: select_one
      options:
      - Saved
      - Submitted
      - In Progress
      required: false
