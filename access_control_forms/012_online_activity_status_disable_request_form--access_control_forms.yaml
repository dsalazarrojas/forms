inputSchema:
  type: object
  properties:
    title: Online Activity Status Disable Request Form
    pages:
    - id: 1
      name: online_activities
      label: Online Activities
      hint: List the activities you would like to disable
      type: text
      options: []
      required: true
    - id: 2
      name: impact
      label: Impact on Experience
      hint: Explain how disabling these activities will affect you
      type: note
      options: []
      required: false
    - id: 3
      name: reason
      label: Reason
      hint: Briefly explain why you want to disable these activities
      type: note
      options: []
      required: true
    - id: 4
      name: online_status
      label: Online Status Preference
      hint: Choose your current online status
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 5
      name: more_activities
      label: More Activities
      hint: List any other activities you would like to disable
      type: text
      options: []
      required: false
    - id: 6
      name: detailed_request
      label: Detailed Request Note
      hint: Provide a detailed note about your request
      type: text
      options: []
      required: false
    - id: 7
      name: specific_times
      label: Specific Times
      hint: Are there specific times you'd like to disable your activities?
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 8
      name: other_requests
      label: Other Requests
      hint: Are there any other requests like this?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: current_status
      label: Current Status
      hint: Are you currently active or inactive online?
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 10
      name: submit_request
      label: Submit Request
      hint: Click submit to send your request
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
