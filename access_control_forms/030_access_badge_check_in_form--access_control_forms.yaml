inputSchema:
  type: object
  properties:
    title: Access Badge Check In Form
    pages:
    - id: 1
      name: section_visitor_arrival
      label: -- Visitor Arrival --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_name
      label: Full Name of Visitor
      hint: As it appears on your photo ID
      type: text
      options: []
      required: true
    - id: 3
      name: organization_representing
      label: Organization Represented
      hint: Company or institution name
      type: text
      options: []
      required: true
    - id: 4
      name: visitor_email
      label: Visitor Email Address
      hint: For check-in confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: visitor_phone
      label: Visitor Phone Number
      hint: Primary mobile number
      type: text
      options: []
      required: true
    - id: 6
      name: section_visit_details
      label: -- Visit Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: person_to_visit
      label: Person to Visit or Host Name
      hint: Who are you here to see?
      type: text
      options: []
      required: true
    - id: 8
      name: purpose_of_visit
      label: Purpose of Visit
      hint: Select primary reason
      type: select_one
      options:
      - Meeting or Conference
      - Maintenance or Service
      - Delivery
      - Personal Visit
      - Job Interview
      required: true
    - id: 9
      name: check_in_time
      label: Check-in Time
      hint: Time of arrival
      type: time
      options: []
      required: true
    - id: 10
      name: check_in_date
      label: Check-in Date
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 11
      name: section_security
      label: -- Security Procedures --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: id_verified
      label: Has a valid government-issued ID been verified?
      hint: Security check
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: badge_number_assigned
      label: Access Badge Number Assigned
      hint: Enter the ID on the badge
      type: text
      options: []
      required: true
    - id: 14
      name: security_policy_briefing
      label: Has the visitor been briefed on building security policies?
      hint: safety orientation
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: section_safety
      label: -- Health and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: hazard_awareness
      label: I acknowledge the safety procedures and emergency exits for this facility
      hint: Safety acknowledgement
      type: select_one
      options:
      - I Acknowledge
      - Other
      required: true
    - id: 17
      name: section_sig
      label: -- Signature --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: visitor_signature
      label: Visitor Digital Signature
      hint: Type full name to sign
      type: text
      options: []
      required: true
