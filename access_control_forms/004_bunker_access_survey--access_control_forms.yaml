inputSchema:
  type: object
  properties:
    title: Bunker Access Survey
    pages:
      - id: 1
        name: respondent_info
        label: Respondent Information
        hint: Your details
        type: note
        options: []
        required: false
      - id: 2
        name: full_name
        label: Full Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 3
        name: employee_id
        label: Employee ID
        hint: Your employee identification number
        type: text
        options: []
        required: true
      - id: 4
        name: department
        label: Department
        hint: Your department or division
        type: select_one
        options:
        - Security
        - Operations
        - Maintenance
        - Administration
        - IT
        - Management
        - Other
        required: true
      - id: 5
        name: access_frequency
        label: Access Frequency
        hint: How often do you access the bunker
        type: note
        options: []
        required: false
      - id: 6
        name: visit_frequency
        label: Visit Frequency
        hint: How often do you enter the bunker
        type: select_one
        options:
        - Multiple Times Daily
        - Once Daily
        - Several Times Weekly
        - Once Weekly
        - Several Times Monthly
        - Once Monthly
        - Rarely
        required: true
      - id: 7
        name: typical_purpose
        label: Typical Purpose of Visit
        hint: Why do you usually access the bunker
        type: select_multiple
        options:
        - Equipment Monitoring
        - Maintenance Work
        - Security Checks
        - Data Collection
        - Emergency Response
        - Inspections
        - Storage Retrieval
        - Other
        required: true
      - id: 8
        name: access_method
        label: Primary Access Method
        hint: How do you typically gain access
        type: select_one
        options:
        - Key Card
        - Biometric Scanner
        - PIN Code
        - Physical Key
        - Security Escort
        - Remote Access
        required: true
      - id: 9
        name: safety_assessment
        label: Safety Assessment
        hint: Your perception of bunker safety
        type: note
        options: []
        required: false
      - id: 10
        name: safety_rating
        label: Overall Safety Rating
        hint: How safe do you feel in the bunker
        type: select_one
        options:
        - Very Safe
        - Safe
        - Neutral
        - Unsafe
        - Very Unsafe
        required: true
      - id: 11
        name: ventilation_quality
        label: Ventilation Quality
        hint: Rate the air quality and ventilation
        type: select_one
        options:
        - Excellent
        - Good
        - Acceptable
        - Poor
        - Very Poor
        required: true
      - id: 12
        name: lighting_adequacy
        label: Lighting Adequacy
        hint: Is the lighting sufficient
        type: select_one
        options:
        - Excellent
        - Good
        - Acceptable
        - Poor
        - Very Poor
        required: true
      - id: 13
        name: emergency_exits
        label: Emergency Exit Accessibility
        hint: Are emergency exits clearly marked and accessible
        type: select_one
        options:
        - Yes - Very Clear
        - Yes - Adequate
        - Somewhat
        - No - Needs Improvement
        - No - Major Issues
        required: true
      - id: 14
        name: concerns
        label: Safety Concerns
        hint: Any safety concerns you have noticed
        type: text
        options: []
        required: false
      - id: 15
        name: access_issues
        label: Access Issues
        hint: Have you experienced any access problems
        type: select_one
        options:
        - Never
        - Rarely
        - Sometimes
        - Often
        - Always
        required: true
      - id: 16
        name: common_access_problems
        label: Common Access Problems
        hint: Select any issues you have encountered
        type: select_multiple
        options:
        - Card Reader Malfunction
        - System Downtime
        - Authorization Delays
        - Equipment Failure
        - Communication Issues
        - None
        required: false
      - id: 17
        name: improvement_suggestions
        label: Improvement Suggestions
        hint: How can bunker access be improved
        type: text
        options: []
        required: false
      - id: 18
        name: additional_training_needed
        label: Additional Training Needed
        hint: Do you need more training for bunker access
        type: select_one
        options:
        - No - Fully Trained
        - Minor Refresher
        - Yes - Safety Procedures
        - Yes - Equipment Operation
        - Yes - Emergency Protocols
        required: true
      - id: 19
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: How satisfied are you with current bunker access
        type: select_one
        options:
        - Very Satisfied
        - Satisfied
        - Neutral
        - Dissatisfied
        - Very Dissatisfied
        required: true
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
