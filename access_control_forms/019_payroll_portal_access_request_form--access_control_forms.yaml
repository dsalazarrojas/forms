inputSchema:
  type: object
  properties:
    title: Payroll Portal Access Request Form
    pages:
    - id: 1
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: team_members
      label: Team Members
      hint: null
      type: select_multiple
      options:
      - HR
      - IT
      required: true
    - id: 4
      name: access_level
      label: Access Level
      hint: null
      type: select_one
      options:
      - Basic
      - Advanced
      required: true
    - id: 5
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: approval_status
      label: Approval Status
      hint: null
      type: select_one
      options:
      - Approved
      - Rejected
      - Pending
      required: true
    - id: 8
      name: approved_by
      label: Approved by
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
