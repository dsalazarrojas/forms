inputSchema:
  type: object
  properties:
    title: Browsing Restrictions Configuration Form
    pages:
      - id: 1
        name: requester_name
        label: Requester name
        hint: Name of person requesting restriction changes
        type: text
        options: []
        required: true
      - id: 2
        name: requester_email
        label: Requester email
        hint: Email for notifications
        type: email
        options: []
        required: true
      - id: 3
        name: target_user_or_group
        label: Target user or group
        hint: Username or group name to apply restrictions
        type: text
        options: []
        required: true
      - id: 4
        name: restriction_type
        label: Restriction type
        hint: Type of browsing restriction requested
        type: select_one
        options:
          - Block categories
          - Allow list only
          - Time of day restrictions
          - Bandwidth limits
        required: true
      - id: 5
        name: affected_sites_or_categories
        label: Affected sites or categories
        hint: Specific domains or categories to block or allow
        type: text
        options: []
        required: false
      - id: 6
        name: effective_date
        label: Effective date
        hint: When the change should take effect
        type: date
        options: []
        required: false
      - id: 7
        name: approval_status
        label: Approval status
        hint: IT approval status for configuration change
        type: select_one
        options:
          - Approved
          - Pending
          - Denied
        required: true
      - id: 8
        name: change_notes
        label: Change notes
        hint: Implementation notes for IT staff
        type: text
        options: []
        required: false
