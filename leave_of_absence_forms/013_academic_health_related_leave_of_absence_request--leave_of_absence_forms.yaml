inputSchema:
  type: object
  properties:
    title: Academic Health Related Leave Of Absence Request
    pages:
    - id: 1
      name: header
      label: -- Health Related Leave Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student full name
      hint: Legal name as on record
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student id
      hint: Institutional identifier
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Contact email
      hint: For notifications and follow up
      type: email
      options: []
      required: true
    - id: 5
      name: health_issue_summary
      label: Summary of health issue
      hint: Brief description of condition and impact on studies
      type: text
      options: []
      required: true
    - id: 6
      name: supporting_documentation
      label: Supporting documentation
      hint: Indicate medical certificates or notes
      type: text
      options: []
      required: false
    - id: 7
      name: requested_duration
      label: Requested duration of leave
      hint: Dates or number of weeks
      type: text
      options: []
      required: true
    - id: 8
      name: accommodation_requests
      label: Accommodation requests upon return
      hint: Any support needed to resume studies
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Provide next of kin or emergency contact
      type: text
      options: []
      required: false
    - id: 10
      name: consent_and_signature
      label: Consent confirmation
      hint: I certify the above information is accurate
      type: select_one
      options:
      - I agree
      - Other
      required: true
