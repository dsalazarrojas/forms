inputSchema:
  type: object
  properties:
    title: Staff Leave Application Form
    pages:
    - id: 1
      name: leave_type
      label: Type of Leave
      hint: Choose the type of leave
      type: select_one
      options:
      - annual
      - casual
      - sick
      required: true
    - id: 2
      name: start_date
      label: Start Date
      hint: Enter the start date of the leave
      type: date
      options: []
      required: true
    - id: 3
      name: end_date
      label: End Date
      hint: Enter the end date of the leave
      type: date
      options: []
      required: true
    - id: 4
      name: leave_days
      label: Leave Days
      hint: Enter the number of leave days
      type: number
      options: []
      required: true
    - id: 5
      name: reason
      label: Reason for Leave
      hint: Please describe the reason for the leave
      type: text
      options: []
      required: true
    - id: 6
      name: comment
      label: Additional Comments
      hint: Any other details or comments
      type: text
      options: []
      required: false
    - id: 7
      name: submitted_date
      label: Submitted Date
      hint: Date and time the leave was submitted
      type: date
      options: []
      required: true
    - id: 8
      name: manager_status
      label: Manager Status
      hint: Select the status of the leave
      type: select_one
      options:
      - approved
      - rejected
      - pending
      required: true
    - id: 9
      name: manager_note
      label: Manager Note
      hint: Any notes for the manager
      type: text
      options: []
      required: false
    - id: 10
      name: submitted_by
      label: Submitted By
      hint: Name of the submitter
      type: text
      options: []
      required: true
    - id: 11
      name: manager
      label: Manager
      hint: Name of the manager responsible
      type: text
      options: []
      required: true
    - id: 12
      name: submitter
      label: Submitter
      hint: Name of the submitter
      type: text
      options: []
      required: true
    - id: 13
      name: submitter_note
      label: Submitter's Note
      hint: Any notes from the submitter
      type: text
      options: []
      required: false
