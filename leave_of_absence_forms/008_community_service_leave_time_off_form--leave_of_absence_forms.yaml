inputSchema:
  type: object
  properties:
    title: Community Service Leave Time Off Form
    pages:
    - id: 1
      name: section_employee
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department_name
      label: Department Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: employee_email
      label: Employee Email
      hint: Work email address.
      type: email
      options: []
      required: true
    - id: 6
      name: section_request
      label: -- Request Details --
      hint: Tell us about your service activity.
      type: note
      options: []
      required: false
    - id: 7
      name: organization_benefiting
      label: Organization where you will volunteer
      hint: The non-profit or community group.
      type: text
      options: []
      required: true
    - id: 8
      name: leave_start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: leave_end_date
      label: Leave End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: total_hours_requested
      label: Total Hours Requested
      hint: e.g. 8, 16.
      type: number
      options: []
      required: true
    - id: 11
      name: description_of_service
      label: Description of Service Activity
      hint: Briefly explain what you will be doing.
      type: text
      options: []
      required: true
    - id: 12
      name: section_category
      label: -- Leave Category --
      hint: Check your company handbook for policies.
      type: note
      options: []
      required: false
    - id: 13
      name: leave_type
      label: Is this leave paid or unpaid?
      hint: null
      type: select_one
      options:
      - Paid Volunteer Leave
      - Unpaid Volunteer Leave
      - Other
      required: true
    - id: 14
      name: recurring_leave
      label: Is this a recurring commitment?
      hint: null
      type: select_one
      options:
      - Yes - Weekly
      - Yes - Monthly
      - No - One-time event
      required: true
    - id: 15
      name: section_manager
      label: -- Manager Approval --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: manager_name
      label: Manager Name
      hint: Name of your direct supervisor.
      type: text
      options: []
      required: true
    - id: 17
      name: business_impact_assessed
      label: Have you discussed the work impact with your team?
      hint: Ensure your duties are covered during your absence.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: manager_approval_status
      label: Approval Status
      hint: For HR and Management use only.
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: false
    - id: 19
      name: disapproval_reason
      label: Reason for denial
      hint: If applicable.
      type: text
      options: []
      required: false
