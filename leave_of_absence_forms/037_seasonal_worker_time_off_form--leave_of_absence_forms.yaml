inputSchema:
  type: object
  properties:
    title: seasonal_worker_time_off_form
    pages:
    - id: 1
      name: employee_request
      label: Employee request
      hint: null
      type: select_one
      options:
      - Request a vacation
      - Request a leave
      - Request a time-off
      - Request a medical leave
      required: false
    - id: 2
      name: employee_name
      label: employee_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: employee_id
      label: employee_id
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: start_date
      label: Start date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: end_date
      label: End date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: reason_for_leave
      label: reason_for_leave
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: leave_type
      label: Leave type
      hint: null
      type: select_multiple
      options:
      - Vacation
      - Medical
      - Other
      required: false
    - id: 8
      name: manager_approval
      label: Manager approval
      hint: null
      type: select_one
      options:
      - Approve
      - Decline
      - Request more information
      required: false
    - id: 9
      name: business_impact
      label: Business impact
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: employee_signature
      label: Employee signature
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: manager_signature
      label: Manager signature
      hint: null
      type: text
      options: []
      required: false
