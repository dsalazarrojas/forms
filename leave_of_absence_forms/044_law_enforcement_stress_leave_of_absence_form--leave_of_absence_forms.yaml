inputSchema:
  type: object
  properties:
    title: Law Enforcement Stress Leave Of Absence Form
    pages:
    - id: 1
      name: employee_name
      label: Employee's Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: department_name
      label: Department
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: start_date
      label: Start Date of Leave
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: end_date
      label: End Date of Leave
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: reason
      label: Reason for Leave
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: attachments
      label: Attachments
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: reviewers
      label: Reviewers
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
