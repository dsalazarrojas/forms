inputSchema:
  type: object
  properties:
    title: Accrued Leave Absence Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_email
      label: Employee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: leave_type
      label: Leave Type
      hint: Select the category of leave
      type: select_one
      options:
      - Vacation
      - Sick Leave
      - Personal Leave
      - Bereavement
      - Other
      required: true
    - id: 5
      name: accrued_balance_available
      label: Accrued Balance Available
      hint: Hours or days currently in your bank
      type: number
      options: []
      required: true
    - id: 6
      name: leave_start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: leave_end_date
      label: Leave End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: total_days_requested
      label: Total Days Requested
      hint: Calculated based on dates above
      type: number
      options: []
      required: true
    - id: 9
      name: reason_for_absence
      label: Reason for Absence
      hint: Brief explanation
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_info
      label: Emergency Contact Info
      hint: Name and Phone
      type: text
      options: []
      required: true
    - id: 11
      name: approval_header
      label: -- Approval Routing --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: supervisor_name
      label: Supervisor Name
      hint: Person who must approve this request
      type: text
      options: []
      required: true
    - id: 13
      name: approval_decision
      label: Approval Decision
      hint: For HR / Manager use only
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: false
