inputSchema:
  type: object
  properties:
    title: Banking Personal Leave of Absence Form
    pages:
    - id: 1
      name: employee_full_name
      label: Employee Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Employee number
      type: text
      options: []
      required: true
    - id: 3
      name: employee_email
      label: Email Address
      hint: Work email
      type: email
      options: []
      required: true
    - id: 4
      name: employee_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: employee_address
      label: Mailing Address
      hint: Street, city, state, ZIP
      type: text
      options: []
      required: true
    - id: 6
      name: department
      label: Department
      hint: Your department
      type: select_one
      options:
      - Operations
      - Customer Service
      - Teller
      - Lending
      - IT
      - Human Resources
      - Finance
      - Management
      - Other
      required: true
    - id: 7
      name: position_title
      label: Position Title
      hint: Your job title
      type: text
      options: []
      required: true
    - id: 8
      name: hire_date
      label: Hire Date
      hint: When were you hired
      type: date
      options: []
      required: true
    - id: 9
      name: leave_type
      label: Type of Leave
      hint: Reason for leave
      type: select_one
      options:
      - Personal Reasons
      - Medical Leave
      - Family Leave
      - Bereavement
      - Educational Leave
      - Sabbatical
      - Military Leave
      - Other
      required: true
    - id: 10
      name: leave_start_date
      label: Leave Start Date
      hint: First day of leave
      type: date
      options: []
      required: true
    - id: 11
      name: leave_end_date
      label: Expected Return Date
      hint: When will you return
      type: date
      options: []
      required: true
    - id: 12
      name: total_days_requested
      label: Total Days Requested
      hint: Number of days
      type: number
      options: []
      required: true
    - id: 13
      name: leave_duration
      label: Leave Duration
      hint: Length of leave
      type: select_one
      options:
      - Less than 1 week
      - 1-2 weeks
      - 2-4 weeks
      - 1-3 months
      - 3-6 months
      - Over 6 months
      required: true
    - id: 14
      name: is_intermittent
      label: Is Leave Intermittent
      hint: Will you take leave in blocks
      type: select_one
      options:
      - No, continuous leave
      - Yes, intermittent schedule
      required: true
    - id: 15
      name: intermittent_schedule
      label: Intermittent Schedule
      hint: Describe the schedule
      type: text
      options: []
      required: false
    - id: 16
      name: paid_leave_requested
      label: Paid Leave Requested
      hint: Will you use paid time off
      type: select_one
      options:
      - Yes, use PTO
      - Yes, use sick leave
      - Yes, use vacation
      - No, unpaid leave
      required: true
    - id: 17
      name: accrued_pto_balance
      label: Accrued PTO Balance
      hint: Current balance
      type: number
      options: []
      required: false
    - id: 18
      name: reason_for_leave
      label: Reason for Leave
      hint: Please explain
      type: text
      options: []
      required: true
    - id: 19
      name: work_handover
      label: Work Handover Plan
      hint: How will your work be covered
      type: text
      options: []
      required: true
    - id: 20
      name: emergency_contact_during_leave
      label: Emergency Contact During Leave
      hint: How can we reach you
      type: text
      options: []
      required: true
    - id: 21
      name: benefits_continuation
      label: Benefits Continuation
      hint: Do you want benefits continued
      type: select_one
      options:
      - Yes, continue all benefits
      - Yes, continue health only
      - No, suspend benefits
      required: true
    - id: 22
      name: manager_name
      label: Manager Name
      hint: Your supervisor
      type: text
      options: []
      required: true
    - id: 23
      name: manager_approval
      label: Manager Approval
      hint: Has manager approved
      type: select_one
      options:
      - Approved
      - Pending
      - Not Yet Submitted
      required: true
    - id: 24
      name: hr_approval
      label: HR Approval
      hint: HR review status
      type: select_one
      options:
      - Approved
      - Pending
      - Not Yet Reviewed
      required: false
    - id: 25
      name: employee_signature_date
      label: Signature Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
