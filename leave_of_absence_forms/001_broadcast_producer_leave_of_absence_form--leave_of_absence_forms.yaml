inputSchema:
  type: object
  properties:
    title: Broadcast Producer Leave Of Absence Form
    pages:
      - id: 1
        name: employee_name
        label: Employee Name
        hint: Full legal name of the producer
        type: text
        options: []
        required: true
      - id: 2
        name: employee_id
        label: Employee ID
        hint: Unique identifier assigned by HR
        type: text
        options: []
        required: true
      - id: 3
        name: department
        label: Department
        hint: Department where the producer works
        type: select_one
        options: [Broadcast Production,Newsroom,Technical Operations,Administration]
        required: true
      - id: 4
        name: leave_type
        label: Type of Leave
        hint: Choose the appropriate leave category
        type: select_one
        options: [Annual Vacation,Medical Leave,Parental Leave,Personal Leave,Other]
        required: true
      - id: 5
        name: start_date
        label: Leave Start Date
        hint: Date when leave begins
        type: date
        options: []
        required: true
      - id: 6
        name: end_date
        label: Leave End Date
        hint: Date when leave ends
        type: date
        options: []
        required: true
      - id: 7
        name: reason
        label: Reason for Leave
        hint: Brief explanation of the leave purpose
        type: text
        options: []
        required: false
      - id: 8
        name: supervisor_name
        label: Supervisor Name
        hint: Direct manager approving the leave
        type: text
        options: []
        required: true
      - id: 9
        name: supervisor_email
        label: Supervisor Email
        hint: Email address for notification
        type: email
        options: []
        required: true
      - id: 10
        name: additional_notes
        label: Additional Notes
        hint: Any extra information for HR
        type: note
        options: []
        required: false
