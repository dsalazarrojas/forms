inputSchema:
  type: object
  properties:
    title: Creative Leave Of Absence Request
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: leave_type
      label: Leave Type
      hint: null
      type: select_one
      options:
      - '{''value'': ''Annual''}'
      - '{''value'': ''Sick''}'
      - '{''value'': ''Emergency''}'
      - '{''value'': ''Parental''}'
      required: true
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: reason_for_leave
      label: Reason For Leave
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: leave_duration
      label: Leave Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: supervisor_approval
      label: Supervisor Approval
      hint: null
      type: select_one
      options:
