    - id: 10
      name: employee_acknowledgement
      label: Employee Acknowledgement
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Acknowledged''}'
      - '{''value'': ''Not Acknowledged''}'
      - '{''value'': ''Declined''}'
      - '{''value'': ''No Response''}'
      required: true
    - id: 11
      name: manager_acknowledgement
      label: Manager Acknowledgement
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Acknowledged''}'
      - '{''value'': ''Not Acknowledged''}'
      - '{''value'': ''Declined''}'
      - '{''value'': ''No Response''}'
