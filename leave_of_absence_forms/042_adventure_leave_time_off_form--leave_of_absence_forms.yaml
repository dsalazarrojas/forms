inputSchema:
  type: object
  properties:
    title: Adventure Leave Time Off Form
    pages:
    - id: 1
      name: request_header
      label: -- Leave Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Team or unit
      type: text
      options: []
      required: true
    - id: 4
      name: leave_start_date
      label: Leave start date
      hint: First day off
      type: date
      options: []
      required: true
    - id: 5
      name: leave_end_date
      label: Leave end date
      hint: Last day off
      type: date
      options: []
      required: true
    - id: 6
      name: leave_type
      label: Leave type
      hint: Select applicable leave reason
      type: select_one
      options:
      - Vacation
      - Personal
      - Medical
      - Unpaid
      required: true
    - id: 7
      name: reason_for_leave
      label: Reason for leave
      hint: Brief explanation
      type: text
      options: []
      required: false
    - id: 8
      name: contact_during_leave
      label: Contact method during leave
      hint: Optional phone or email
      type: text
      options: []
      required: false
    - id: 9
      name: manager_approval
      label: Manager approval status
      hint: For manager use
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: false
    - id: 10
      name: submission_date
      label: Submission date
      hint: Date of request
      type: date
      options: []
      required: true
