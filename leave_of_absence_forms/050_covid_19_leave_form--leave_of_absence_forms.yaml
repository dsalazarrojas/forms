inputSchema:
  type: object
  properties:
    title: COVID 19 Leave Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: position
      label: Position or Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_header_2
      label: -- Leave Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: request_date
      label: Date of Request
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: leave_type
      label: Type of COVID-19 Related Leave
      hint: null
      type: select_one
      options:
      - Personal illness - COVID-19
      - Family member illness - COVID-19
      - Quarantine order
      - Childcare - school closure
      - Vulnerable household member care
      - Vaccination recovery
      - Bereavement - COVID-19
      - Other
      required: true
    - id: 10
      name: leave_start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: leave_end_date
      label: Leave End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: total_days
      label: Total Days Requested
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: section_header_3
      label: -- Reason for Leave --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: leave_reason
      label: Detailed Reason for Leave
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: covid_status
      label: COVID-19 Status
      hint: null
      type: select_one
      options:
      - Positive diagnosis
      - Suspected COVID-19
      - Close contact - quarantine
      - Vaccination appointment
      - Caregiver for affected family
      - Other
      required: true
    - id: 16
      name: section_header_4
      label: -- Supporting Documentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: documentation_provided
      label: Supporting Documentation
      hint: Select all that apply
      type: select_multiple
      options:
      - Positive test result
      - Doctor note
      - Quarantine order
      - School closure notice
      - Vaccination appointment confirmation
      - No documentation available
      required: true
    - id: 18
      name: section_header_5
      label: -- Approval and Compensation --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: paid_leave
      label: Requesting Paid Leave
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: leave_compensation_type
      label: Type of Compensation
      hint: null
      type: select_one
      options:
      - Paid time off
      - Unpaid leave
      - Emergency paid sick leave
      - Other
      required: true
    - id: 21
      name: section_header_6
      label: -- Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: policy_understanding
      label: I understand the COVID-19 leave policy
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 23
      name: information_accuracy
      label: Information provided is accurate and complete
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: submission_date
      label: Form Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 25
      name: employee_signature_acknowledgment
      label: Employee Acknowledgment
      hint: I confirm the information above is true
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
