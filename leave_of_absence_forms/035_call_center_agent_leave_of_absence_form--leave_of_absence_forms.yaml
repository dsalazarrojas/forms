inputSchema:
  type: object
  properties:
    title: Call Center Agent Leave Of Absence Form
    pages:
    - id: 1
      name: employee_header
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: team_lead
      label: Team Lead Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: leave_header
      label: -- Leave Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: leave_type
      label: Type of Leave
      hint: null
      type: select_one
      options:
      - Medical leave
      - Personal leave
      - Family leave
      - Unpaid leave
      - Extended medical
      - Other
      required: true
    - id: 10
      name: start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: end_date
      label: Leave End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: duration_days
      label: Total Duration (days)
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: reason_header
      label: -- Reason for Leave --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: reason
      label: Reason for Leave of Absence
      hint: null
      type: select_one
      options:
      - Illness or medical condition
      - Family emergency
      - Maternity/paternity
      - Personal circumstances
      - Accident or injury
      - Other
      required: true
    - id: 15
      name: reason_details
      label: Additional Details
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: documentation_header
      label: -- Medical Documentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: medical_cert_required
      label: Medical Certificate Attached?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Will provide later
      required: true
    - id: 18
      name: doctor_contact
      label: Doctor/Hospital Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: communication_header
      label: -- Communication During Leave --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: contact_during_leave
      label: Contact Person During Leave
      hint: Name of colleague covering responsibilities
      type: text
      options: []
      required: true
    - id: 21
      name: handover_completed
      label: Have You Completed Handover of Duties?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - In progress
      required: true
    - id: 22
      name: return_header
      label: -- Return to Work --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: return_ready_date
      label: Expected Ready to Return Date
      hint: null
      type: date
      options: []
      required: true
    - id: 24
      name: approval_header
      label: -- Approval --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: submission_date
      label: Request Submission Date
      hint: null
      type: date
      options: []
      required: true
