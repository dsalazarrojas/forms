inputSchema:
  type: object
  properties:
    title: Arbitration Attendance Time Off Form
    pages:
    - id: 1
      name: section_employee_info
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: supervisor_name
      label: Supervisor Name
      hint: Direct supervisor or manager
      type: text
      options: []
      required: true
    - id: 6
      name: section_leave_details
      label: -- Leave Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: leave_start_date
      label: Leave Start Date
      hint: Date when time off begins
      type: date
      options: []
      required: true
    - id: 8
      name: leave_end_date
      label: Leave End Date
      hint: Date when employee returns to work
      type: date
      options: []
      required: true
    - id: 9
      name: total_days_requested
      label: Total Days Requested
      hint: Number of business days
      type: number
      options: []
      required: true
    - id: 10
      name: leave_type
      label: Type of Leave
      hint: null
      type: select_one
      options:
      - Arbitration attendance
      - Legal proceedings
      - Mandatory court appearance
      - Witness testimony
      required: true
    - id: 11
      name: section_arbitration_info
      label: -- Arbitration Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: arbitration_case_number
      label: Case Number or Reference
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: arbitration_date
      label: Arbitration Session Date
      hint: Scheduled date of session
      type: date
      options: []
      required: true
    - id: 14
      name: arbitration_location
      label: Arbitration Location
      hint: City or venue name
      type: text
      options: []
      required: false
    - id: 15
      name: documentation_provided
      label: Supporting documentation provided
      hint: Copy of arbitration notice, subpoena, etc
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: paid_unpaid
      label: Leave Should Be
      hint: null
      type: select_one
      options:
      - Paid
      - Unpaid
      - Partially Paid
      required: true
    - id: 17
      name: additional_notes
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
