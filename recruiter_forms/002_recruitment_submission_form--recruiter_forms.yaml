inputSchema:
  type: object
  properties:
    title: Recruitment Submission Form
    pages:
    - id: 1
      name: submit_form
      label: Submit form
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: resume_upload
      label: Upload resume
      hint: Upload your resume in PDF format
      type: text
      options: []
      required: true
    - id: 3
      name: contact_info
      label: Contact info
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: job_title
      label: Job Title
      hint: null
      type: select_one
      options:
      - Software Engineer
      - Marketing Manager
      - Data Scientist
      required: true
    - id: 5
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: job_type
      label: Job Type
      hint: null
      type: select_multiple
      options:
      - Full time
      - Part time
      - Freelance
      required: true
    - id: 7
      name: job_description
      label: Job Description
      hint: Write a brief description of the job
      type: text
      options: []
      required: false
    - id: 8
      name: job_requirements
      label: Job Requirements
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submitter_info
      label: Submitter info
      hint: Your name and contact number
      type: text
      options: []
      required: true
    - id: 10
      name: submitter_email
      label: Submitter Email
      hint: null
      type: email
      options: []
      required: true
