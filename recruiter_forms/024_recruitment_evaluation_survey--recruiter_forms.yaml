inputSchema:
  type: object
  properties:
    title: Recruitment Evaluation Survey
    pages:
    - id: 1
      name: introduction
      label: Welcome to the survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: candidate_experience
      label: What was your experience like?
      hint: Be as specific as possible
      type: text
      options: []
      required: false
    - id: 3
      name: communication
      label: How would you rate our communication?
      hint: Rate from 1 to 10
      type: number
      options: []
      required: false
    - id: 4
      name: interview_process
      label: How would you rate the interview process?
      hint: Rate from 1 to 10
      type: number
      options: []
      required: false
    - id: 5
      name: feedback
      label: Do you have any additional feedback?
      hint: null
      type: text
      options: []
      required: false
