        label: -- Candidate Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 4
        name: full_name
        label: Full Name
        hint: Your name
        type: text
        options: []
        required: true
      - id: 5
        name: email_address
        label: Email Address
        hint: Your email
        type: email
        options: []
        required: true
      - id: 6
        name: position_title
        label: Position Interviewed For
        hint: Job title
        type: text
        options: []
        required: true
      - id: 7
        name: interview_date
        label: Interview Date
        hint: When the interview occurred
        type: date
        options: []
        required: true
