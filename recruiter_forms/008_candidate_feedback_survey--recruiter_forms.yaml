        name: interview_duration
        label: Interview Duration
        hint: Approximately how long
        type: select_one
        options:
          - Less than 15 minutes
          - 15-30 minutes
          - 30-45 minutes
          - 45 minutes - 1 hour
          - 1-2 hours
          - More than 2 hours
        required: false
