        label: Did the interviewer demonstrate knowledge about the company?
        hint: Select one
        type: select_one
        options:
          - Excellent Knowledge
          - Good Knowledge
          - Basic Knowledge
          - Limited Knowledge
          - No Knowledge
        required: true
      - id: 23
        name: job_expectations
        label: Did the interviewer clearly explain job expectations?
        hint: Select one
        type: select_one
        options:
          - Very Clear
          - Clear
          - Somewhat Clear
          - Unclear
          - No Information Provided
        required: true
      - id: 24
        name: overall_experience_header
        label: -- Overall Assessment --
        hint: null
        type: note
        options: []
        required: false
