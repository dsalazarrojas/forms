        hint: Select one
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Unsure
          - Probably not
          - Definitely not
        required: true
      - id: 27
        name: improvement_suggestions
        label: What could be improved about the interview process?
        hint: Please share suggestions
        type: text
        options: []
        required: false
      - id: 28
        name: additional_comments
        label: Any other comments or feedback?
        hint: Optional
        type: text
        options: []
        required: false
