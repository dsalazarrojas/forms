inputSchema:
  type: object
  properties:
    title: College Basketball Recruiting Form
    pages:
    - id: 1
      name: player_first_name
      label: Player First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: player_last_name
      label: Player Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: height
      label: Height - inches
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: weight
      label: Weight - lbs
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: primary_position
      label: Primary Position
      hint: null
      type: select_one
      options:
      - Point Guard
      - Shooting Guard
      - Small Forward
      - Power Forward
      - Center
      required: true
    - id: 7
      name: secondary_position
      label: Secondary Position
      hint: If applicable
      type: select_one
      options:
      - Point Guard
      - Shooting Guard
      - Small Forward
      - Power Forward
      - Center
      - None
      required: false
