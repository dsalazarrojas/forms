      hint: On 4.0 scale
      type: number
      options: []
      required: true
    - id: 13
      name: standardized_test_score
      label: Standardized Test Score (SAT or ACT)
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: points_per_game
      label: Scoring Average - points per game
      hint: null
      type: number
      options: []
      required: true
