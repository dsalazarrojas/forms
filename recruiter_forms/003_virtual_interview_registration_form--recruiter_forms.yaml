inputSchema:
  type: object
  properties:
    title: Virtual Interview Registration Form
    pages:
    - id: 1
      name: first_name
      label: first name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: last name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: job title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: resume
      label: resume upload
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: message
      label: message
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: job_type
      label: job type
      hint: null
      type: select_multiple
      options:
      - software development
      - data science
      - web development
      - artificial intelligence
      - machine learning
      - cybersecurity
      - data analysis
      required: true
    - id: 9
      name: job_level
      label: job level
      hint: null
      type: select_one
      options:
      - junior
      - senior
      - lead
      - manager
      required: true
    - id: 10
      name: job_category
      label: job category
      hint: null
      type: select_one
      options:
      - frontend
      - backend
      - fullstack
      - devops
      required: true
