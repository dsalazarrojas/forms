inputSchema:
  type: object
  properties:
    title: Employee Appraisal Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Satisfactory
      - Needs Improvement
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: date_of_next_review
      label: Date of next review
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: recommended_training
      label: Recommended Training
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
    - id: 7
      name: employee_progress
      label: Employee Progress
      hint: null
      type: select_one
      options:
      - Increased
      - Decreased
      - No Change
      required: true
    - id: 8
      name: areas_for_improvement
      label: Areas for Improvement
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: employee_signature
      label: Employee Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: reviewer_signature
      label: Reviewer Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: date_of_signature
      label: Date of Signature
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: employee_progress_2
      label: Employee Progress 2
      hint: null
      type: select_one
      options:
      - Increased
      - Decreased
      - No Change
      required: true
    - id: 13
      name: areas_for_improvement_2
      label: Areas For Improvement 2
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: recommended_training_2
      label: Recommended Training 2
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
