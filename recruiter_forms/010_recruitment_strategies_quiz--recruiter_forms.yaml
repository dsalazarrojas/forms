inputSchema:
  type: object
  properties:
    title: Recruitment Strategies Quiz
    pages:
    - id: 1
      name: intro
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: assessment
      label: What type of assessment is not a good fit for a new hire?
      hint: null
      type: select_one
      options:
      - New Hire
      - Skills Assessment
      - Behavioral Assessment
      - Other
      required: false
    - id: 3
      name: skills
      label: What skills are essential for this role?
      hint: null
      type: select_multiple
      options:
      - Leadership
      - Communication
      - Time Management
      - Problem Solving
      - Adaptability
      - Teamwork
      required: false
    - id: 4
      name: training
      label: What type of training do you usually provide to new hires?
      hint: null
      type: select_one
      options:
      - Onboarding
      - Job-specific
      - Soft skills
      - Compliance
      - Other
      required: false
    - id: 5
      name: response
      label: How do you usually respond to new hire questions or concerns?
      hint: null
      type: select_multiple
      options:
      - Promptly
      - Within 24 Hours
      - After 24 Hours
      - Email
      - Phone Call
      - Text Message
      - In Person
      required: false
    - id: 6
      name: follow_up
      label: What is your follow-up process for new hires?
      hint: null
      type: select_one
      options:
      - One-Week
      - Two-Weeks
      - Three-Weeks
      - Four-Weeks
      - Never
      required: false
    - id: 7
      name: tracking
      label: What tools do you usually use for tracking new hire progress?
      hint: null
      type: select_multiple
      options:
      - Excel Spreadsheet
      - Trello
      - Asana
      - Google Sheets
      - Other
      required: false
    - id: 8
      name: feedback
      label: What type of feedback do new hires usually receive?
      hint: null
      type: select_one
      options:
      - Regular Check-ins
      - Quarterly Check-ins
      - Semi-Annual Check-ins
      - Never
      required: false
    - id: 9
      name: insights
      label: What insights do you gain from tracking new hire progress?
      hint: null
      type: select_multiple
      options:
      - Training Effectiveness
      - Time-to-Hire Metrics
      - Retention Rates
      - Onboarding Success
      - Other
      required: false
    - id: 10
      name: challenges
      label: What common challenges do you face when tracking new hire progress?
      hint: null
      type: select_multiple
      options:
      - Lack of Data
      - Limited Resources
      - Time Constraints
      - Inaccurate Data
      - Other
      required: false
    - id: 11
      name: comments
      label: Do you usually collect new hire comments?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: notes
      label: Do you usually collect notes for new hires?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
