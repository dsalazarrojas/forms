inputSchema:
  type: object
  properties:
    title: Workshop Participant Expectation Check In Form
    pages:
    - id: 1
      name: participant_expectation
      label: Participant Expectation
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: readiness
      label: Readiness
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: topics_interests
      label: Topics And Interests
      hint: null
      type: select_multiple
      options:
      - Very High
      - High
      - Medium
      - Low
      - Very Low
      required: true
    - id: 4
      name: follow_up_questions
      label: Follow Up Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: participant_notes
      label: Participant Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: session_topics
      label: Session Topics
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: participant_expectation_rate
      label: Participant Expectation Rate
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: readiness_rate
      label: Readiness Rate
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: session_topics_interested
      label: Session Topics Interested
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: follow_up_questions_ask
      label: Follow Up Questions Asked
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: participant_notes_comments
      label: Participant Notes/Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: participant_engagement
      label: Participant Engagement
      hint: null
      type: number
      options: []
      required: false
