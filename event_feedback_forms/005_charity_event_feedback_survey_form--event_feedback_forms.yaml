inputSchema:
  type: object
  properties:
    title: Charity Event Feedback Survey Form
    pages:
      - id: 1
        name: section_respondent_info
        label: -- Your Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Your Name
        hint: First and last name
        type: text
        options: []
        required: true
      - id: 3
        name: respondent_email
        label: Your Email
        hint: For contact purposes
        type: email
        options: []
        required: true
      - id: 4
        name: event_attended
        label: Which Event Did You Attend
        hint: Name of the charity event
        type: text
        options: []
        required: true
      - id: 5
        name: attendance_date
        label: Date You Attended
        hint: When was the event
        type: date
        options: []
        required: true
      - id: 6
        name: section_ratings
        label: -- Event Ratings --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: event_planning
        label: Event Planning and Coordination
        hint: Rate the planning and organization
        type: select_one
        options: ["Excellent", "Very Good", "Good", "Average", "Poor"]
        required: true
      - id: 8
        name: staff_volunteers
        label: Staff and Volunteer Professionalism
        hint: How professional was the team
        type: select_one
        options: ["Excellent", "Very Good", "Good", "Average", "Poor"]
        required: true
      - id: 9
        name: event_activities
        label: Quality of Event Activities and Programs
        hint: Rate the activities offered
        type: select_one
        options: ["Excellent", "Very Good", "Good", "Average", "Poor"]
        required: true
      - id: 10
        name: attendee_engagement
        label: Attendee Engagement and Atmosphere
        hint: How engaging was the event
        type: select_one
        options: ["Excellent", "Very Good", "Good", "Average", "Poor"]
        required: true
      - id: 11
        name: section_impact
        label: -- Impact and Outcomes --
        hint: null
        type: note
        options: []
        required: false
      - id: 12
        name: mission_clarity
        label: Clarity of Charity Mission and Goals
        hint: Did you understand what they do
        type: select_one
        options: ["Very Clear", "Clear", "Somewhat Clear", "Unclear"]
        required: true
      - id: 13
        name: impact_explanation
        label: How Funds Will Be Used
        hint: Was this explained adequately
        type: select_one
        options: ["Very Clear", "Clear", "Somewhat Clear", "Not Explained"]
        required: true
      - id: 14
        name: donation_intent
        label: Did This Event Inspire You to Donate
        hint: Will you contribute
        type: select_one
        options: ["Yes, Definitely", "Probably", "Maybe", "No"]
        required: true
      - id: 15
        name: section_experience
        label: -- Personal Experience --
        hint: null
