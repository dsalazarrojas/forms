        name: networking_value
        label: Value of Networking Opportunities
        hint: How good were the connections
        type: select_one
        options: ["Very Valuable", "Valuable", "Somewhat Valuable", "Not Valuable"]
        required: false
      - id: 17
        name: overall_experience
        label: Overall Experience at This Event
        hint: Rate your experience
        type: select_one
        options: ["Excellent", "Very Good", "Good", "Average", "Poor"]
        required: true
      - id: 18
        name: what_improved
        label: What Could Be Improved
        hint: Your suggestions for improvement
        type: text
        options: []
        required: false
      - id: 19
        name: recommend_event
        label: Would You Recommend This Event to Others
        hint: Will you suggest it to friends
        type: select_one
        options: ["Definitely Yes", "Probably Yes", "Not Sure", "Probably No", "Definitely No"]
        required: true
      - id: 20
        name: additional_feedback
        label: Additional Feedback or Comments
        hint: Any other thoughts or suggestions
        type: text
        options: []
        required: false
