inputSchema:
  type: object
  properties:
    title: Presentation Feedback Survey
    pages:
    - id: 1
      name: presentation_feedback_survey_1
      label: What was your overall experience?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: rating
      label: How would you rate this presentation?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: feedback
      label: Do you have any feedback about this presentation?
      hint: Please provide more details about your feedback
      type: note
      options: []
      required: false
    - id: 4
      name: name
      label: What is your name?
      hint: Your name will be displayed next to your feedback
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: What is your email?
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Do you have a phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: presentation_title
      label: What is the title of the presentation?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: presentation_date
      label: When was the presentation held?
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: event_name
      label: What is the name of the event?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: event_date
      label: When was the event held?
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: session
      label: Which session was the presentation in?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: presentation_file
      label: Do you have a presentation file you can share?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: feedback_survey_completed
      label: Was this feedback survey completed on your own device or at a public
        computer?
      hint: null
      type: select_one
      options:
      - Public Computer
      - Your Own Device
      required: true
    - id: 14
      name: additional_comments
      label: Do you have any additional comments about this presentation?
      hint: Additional comments will not be displayed
      type: text
      options: []
      required: false
    - id: 15
      name: event_location
      label: What is the location of the event?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: session_time
      label: When was your session held?
      hint: null
      type: time
      options: []
      required: true
    - id: 17
      name: session_date
      label: Was the session on this date?
      hint: null
      type: date
      options: []
      required: false
    - id: 18
      name: presentation_length
      label: How long was the presentation?
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: session_length
      label: How long was your session?
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: additional_feedback
      label: Do you have any additional feedback about the event?
      hint: Please provide more details
      type: note
      options: []
      required: false
    - id: 21
      name: speaker
      label: How would you rate the speaker?
      hint: null
      type: number
      options: []
      required: false
    - id: 22
      name: presentation_content
      label: How would you rate the presentation content?
      hint: null
      type: number
      options: []
      required: false
    - id: 23
      name: event_facilities
      label: How would you rate the event facilities?
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: overall_rating
      label: Overall rating
      hint: null
      type: number
      options: []
      required: false
    - id: 25
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
