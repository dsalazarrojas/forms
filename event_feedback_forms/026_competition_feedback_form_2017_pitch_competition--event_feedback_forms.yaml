          - Judge
          - Audience Member
          - Mentor
          - Sponsor
          - Organizer
          - Media or Press
          - Other
        required: true
      - id: 7
        name: pitch_category
        label: Pitch Category
        hint: Which category did you participate in
        type: select_one
        options:
