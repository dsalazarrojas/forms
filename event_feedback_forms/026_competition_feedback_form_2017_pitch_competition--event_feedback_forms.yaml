      - id: 25
        name: suggestions
        label: Suggestions for Future Events
        hint: Your ideas for improvement
        type: text
        options: []
        required: false
      - id: 26
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
