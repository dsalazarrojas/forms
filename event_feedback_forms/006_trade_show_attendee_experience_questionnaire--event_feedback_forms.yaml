      options:
      - Not Interested
      - Somewhat Interested
      - Interested
      - Very Interested
      - Extremely Interested
      required: true
    - id: 5
      name: session_interest
      label: Session Interest
      hint: null
      type: select_multiple
      options:
      - Not Interested
      - Somewhat Interested
      - Interested
      - Very Interested
      - Extremely Interested
      required: true
    - id: 6
      name: likely_to_attend_next
      label: Likely to Attend Next
      hint: null
      type: select_one
      options:
      - Not Likely
      - Somewhat Likely
      - Likely
      - Very Likely
      - Extremely Likely
      required: true
    - id: 7
      name: likely_to_recommend_venue
      label: Likely to Recommend Venue
      hint: null
      type: select_one
      options:
      - Not Likely
      - Somewhat Likely
      - Likely
      - Very Likely
      - Extremely Likely
      required: true
    - id: 8
      name: feedback
      label: Feedback
      hint: Please provide any additional comments or suggestions for future events
      type: note
      options: []
      required: true
