inputSchema:
  type: object
  properties:
    title: Skydiving Event Feedback Survey
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: event_date_time
      label: Event Date and Time
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: overall_rating
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: enjoyed
      label: Enjoyed The Event
      hint: null
      type: select_one
      options:
      - Enjoyed
      - Didn't Enjoy
      required: true
    - id: 9
      name: would_recommend
      label: Would Recommend
      hint: null
      type: select_multiple
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      required: true
    - id: 10
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
