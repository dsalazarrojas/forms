inputSchema:
  type: object
  properties:
    title: Charity Event Volunteer Offboarding Form
    pages:
    - id: 1
      name: volunteer_name
      label: Volunteer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: volunteer_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: event_name
      label: Event Name
      hint: Which event
      type: text
      options: []
      required: true
    - id: 4
      name: event_date
      label: Event Date
      hint: When held
      type: date
      options: []
      required: true
    - id: 5
      name: role_performed
      label: Role Performed
      hint: Your position
      type: text
      options: []
      required: true
    - id: 6
      name: hours_contributed
      label: Total Hours Contributed
      hint: Time volunteered
      type: number
      options: []
      required: true
    - id: 7
      name: overall_experience
      label: Overall Experience
      hint: Rate your experience
      type: select_one
      options:
      - Excellent
      - Very good
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: training_adequacy
      label: Was Training Adequate
      hint: Preparation quality
      type: select_one
      options:
      - Very adequate
      - Adequate
      - Somewhat adequate
      - Inadequate
      - Very inadequate
      required: true
    - id: 9
      name: support_received
      label: Support from Coordinators
      hint: Staff support
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 10
      name: role_clarity
      label: Role Clarity
      hint: Understanding of duties
      type: select_one
      options:
      - Very clear
      - Clear
      - Somewhat clear
      - Unclear
      - Very unclear
      required: true
    - id: 11
      name: highlight_experience
      label: Highlight of Your Experience
      hint: Best moment
      type: text
      options: []
      required: false
    - id: 12
      name: challenge_faced
      label: Challenge You Faced
      hint: Difficulties encountered
      type: text
      options: []
      required: false
    - id: 13
      name: suggestion_improvement
      label: Suggestions for Improvement
      hint: Your ideas
      type: text
      options: []
      required: false
    - id: 14
      name: volunteer_again
      label: Would You Volunteer Again
      hint: Future interest
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Not sure
      - Probably no
      - Definitely no
      required: true
    - id: 15
      name: recommend_to_others
      label: Would You Recommend Volunteering
      hint: To friends or family
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Not sure
      - Probably no
      - Definitely no
      required: true
    - id: 16
      name: skills_gained
      label: Skills Gained
      hint: What you learned
      type: select_multiple
      options:
      - Communication
      - Teamwork
      - Problem solving
      - Leadership
      - Time management
      - Customer service
      - Event planning
      - None
      required: false
    - id: 17
      name: materials_returned
      label: Have You Returned All Materials
      hint: Uniform badge etc
      type: select_one
      options:
      - Yes all returned
      - Yes some remaining
      - No materials issued
      required: true
    - id: 18
      name: stay_connected
      label: Stay Connected for Future Events
      hint: Mailing list
      type: select_one
      options:
      - Yes please
      - No thank you
      required: true
    - id: 19
      name: additional_feedback
      label: Additional Feedback
      hint: Any other comments
      type: text
      options: []
      required: false
