inputSchema:
  type: object
  properties:
    title: Community Club Feedback Information Collection Form
    pages:
      - id: 1
        name: member_first_name
        label: First Name
        hint: Your legal first name
        type: text
        options: []
        required: true
      - id: 2
        name: member_last_name
        label: Last Name
        hint: Your legal last name
        type: text
        options: []
        required: true
      - id: 3
        name: member_email
        label: Email Address
        hint: For follow-up communications
        type: email
        options: []
        required: true
      - id: 4
        name: membership_type
        label: Membership Type
        hint: What type of membership do you have?
        type: select_one
        options:
          - Full Member
          - Associate Member
          - Student Member
          - Senior Member
          - New Member
          - Guest
        required: true
      - id: 5
        name: membership_duration
        label: How Long Have You Been a Member
        hint: Duration of your membership
        type: select_one
        options:
          - Less than 6 months
          - 6 months to 1 year
          - 1 to 3 years
          - 3 to 5 years
          - More than 5 years
        required: true
      - id: 6
        name: events_attended
        label: Events Attended in Past Year
        hint: Approximate number of events
        type: select_one
        options:
          - 0
          - 1-3
          - 4-6
          - 7-10
          - More than 10
        required: true
      - id: 7
        name: favorite_activities
        label: Favorite Club Activities
        hint: Select your preferred activities
        type: select_multiple
        options:
          - Social Gatherings
          - Educational Workshops
          - Networking Events
          - Community Service
          - Sports Activities
          - Cultural Events
          - Guest Speakers
          - Special Interest Groups
        required: true
      - id: 8
        name: activity_satisfaction
        label: Overall Satisfaction with Activities
        hint: How satisfied are you with club offerings?
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 9
        name: communication_rating
        label: Communication Rating
        hint: How well does the club communicate with you?
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: preferred_communication
        label: Preferred Communication Method
        hint: How would you like to receive updates?
        type: select_multiple
        options:
          - Email
          - Text Message
          - Phone Call
          - Social Media
          - Mail
          - Club Website
        required: true
      - id: 11
        name: value_for_money
        label: Value for Membership Cost
        hint: Do you feel you get good value?
        type: select_one
        options:
          - Excellent Value
          - Good Value
          - Fair Value
          - Poor Value
          - Not Applicable
        required: true
      - id: 12
        name: facility_rating
        label: Club Facility Rating
        hint: Rate the quality of club facilities
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Applicable
        required: true
      - id: 13
        name: new_activities_interest
        label: New Activities You Would Like to See
        hint: Suggestions for new offerings
        type: text
        options: []
        required: false
      - id: 14
        name: volunteer_interest
        label: Would You Like to Volunteer
        hint: Are you interested in helping organize events?
        type: select_one
        options:
          - Yes, Definitely
          - Maybe
          - No, Not at This Time
        required: true
      - id: 15
        name: volunteer_areas
        label: Volunteer Areas of Interest
        hint: Select areas where you could help
        type: select_multiple
        options:
          - Event Planning
          - Communications
          - Membership Outreach
          - Fundraising
          - Mentoring
          - Facilities
          - Other
        required: false
      - id: 16
        name: recommend_to_others
        label: Would You Recommend This Club
        hint: How likely are you to recommend to others?
        type: select_one
        options:
          - Very Likely
          - Likely
          - Neutral
          - Unlikely
          - Very Unlikely
        required: true
      - id: 17
        name: club_improvements
        label: What Could the Club Improve
        hint: Your suggestions for improvement
        type: text
        options: []
        required: false
      - id: 18
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback you would like to share
        type: text
        options: []
        required: false
