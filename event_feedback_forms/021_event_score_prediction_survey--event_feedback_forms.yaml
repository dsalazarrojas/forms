inputSchema:
  type: object
  properties:
    title: Event Score Prediction Survey
    pages:
    - id: 1
      name: participant_expectations
      label: What are participants expecting from the prophets?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: score_prediction
      label: Score prediction
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: participant_preferences
      label: What do participants prefer?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: event_planning
      label: How can we improve the event?
      hint: What do you think we can do better?
      type: text
      options: []
      required: false
    - id: 5
      name: event_planning_1
      label: Event planning
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: event_planning_2
      label: Event prophets
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: participant_satisfaction
      label: How satisfied are you with your experience?
      hint: Rate your satisfaction with the event
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      - Option 6
      - Option 7
      - Option 8
      required: false
    - id: 8
      name: participant_satisfaction_1
      label: prophets_score
      hint: How would you rate the quality of our prophets?
      type: number
      options: []
      required: false
    - id: 9
      name: participant_prophets_formation
      label: Prophets formation
      hint: What do you think we can do better?
      type: text
      options: []
      required: false
    - id: 10
      name: participant_prophets_score
      label: Score of the Prophets
      hint: How would you rate the score of the Prophets?
      type: number
      options: []
      required: false
