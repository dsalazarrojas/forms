inputSchema:
  type: object
  properties:
    title: Art Exhibition Feedback Questionnaire
    pages:
      - id: 1
        name: visitor_name
        label: Visitor name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: visit_date
        label: Visit date
        hint: Date of your visit
        type: date
        options: []
        required: true
      - id: 3
        name: exhibition_rating
        label: Exhibition rating
        hint: Rate the exhibition overall
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 4
        name: favorite_piece
        label: Favorite piece or exhibit
        hint: Name or description
        type: text
        options: []
        required: false
      - id: 5
        name: signage_clarity
        label: Signage clarity
        hint: Were exhibit labels clear
        type: select_one
        options: [Yes, No]
        required: true
      - id: 6
        name: staff_helpfulness
        label: Staff helpfulness
        hint: Rate the staff interaction
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 7
        name: facilities_cleanliness
        label: Facilities cleanliness
        hint: Restrooms lobby and gallery areas
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 8
        name: accessibility
        label: Accessibility experience
        hint: Any barriers encountered
        type: text
        options: []
        required: false
      - id: 9
        name: suggestions
        label: Suggestions for improvement
        hint: How can we improve the visitor experience
        type: text
        options: []
        required: false
      - id: 10
        name: contact_for_follow_up
        label: Contact for follow up
        hint: Provide email if you want a response
        type: email
        options: []
        required: false
