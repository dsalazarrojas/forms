inputSchema:
  type: object
  properties:
    title: Training Feedback Form
    pages:
    - id: 1
      name: session_details
      label: Session Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_details
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rating
      label: Rate Session
      hint: Rate on a scale of 1 to 5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
