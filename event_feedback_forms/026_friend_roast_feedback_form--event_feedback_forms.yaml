inputSchema:
  type: object
  properties:
    title: Friend Roast Feedback Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Roast
      - Dinner
      - Comedy
      - Other
      required: true
    - id: 3
      name: participant_feedback
      label: Participant Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: humor_level
      label: Humor Level
      hint: null
      type: select_multiple
      options:
      - Not funny at all
      - Somewhat funny
      - Very funny
      required: true
    - id: 6
      name: constructive_feedback
      label: Constructive Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
