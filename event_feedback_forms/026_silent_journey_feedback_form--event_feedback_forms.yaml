inputSchema:
  type: object
  properties:
    title: Silent Journey Feedback Form
    pages:
    - id: 1
      name: introduction
      label: What did you think of the silent journey?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: silence
      label: How did you feel about the level of silence during the journey?
      hint: null
      type: select_one
      options:
      - Extremely satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Extremely dissatisfied
      - Not sure
      required: false
    - id: 3
      name: connection
      label: What connections did you make with your fellow participants?
      hint: null
      type: select_multiple
      options:
      - Stronger sense of community
      - New friendships
      - Improved relationships
      - No connections made
      required: false
    - id: 4
      name: learning
      label: What did you learn about yourself during the journey?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: growth
      label: What did you learn about personal growth during the journey?
      hint: null
      type: select_one
      options:
      - A lot
      - A little
      - Not much
      required: false
    - id: 6
      name: recommendations
      label: Do you have any recommendations for future silent journeys?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: Your email address
      type: email
      options: []
      required: false
