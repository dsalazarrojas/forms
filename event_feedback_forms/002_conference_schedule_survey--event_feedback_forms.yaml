inputSchema:
  type: object
  properties:
    title: Conference Schedule Survey
    pages:
    - id: 1
      name: session_feedback_header
      label: -- Session Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: Attendee name
      hint: Optional - helps us follow up on responses
      type: text
      options: []
      required: false
    - id: 3
      name: attendee_email
      label: Attendee email
      hint: Optional contact for follow up
      type: email
      options: []
      required: false
    - id: 4
      name: session_attended
      label: Session attended
      hint: Select the session you are reviewing
      type: select_one
      options:
      - Opening keynote
      - Workshop A - Leadership
      - Panel - Innovation
      - Breakout - Track A
      - Breakout - Track B
      - Other
      required: true
    - id: 5
      name: session_rating
      label: Session rating
      hint: Rate the session on a scale of 1 to 5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 6
      name: session_comments
      label: Session comments
      hint: What worked well and what could be improved
      type: text
      options: []
      required: false
    - id: 7
      name: scheduling_preference
      label: Scheduling preference
      hint: Choose which schedule change would improve your experience
      type: select_one
      options:
      - More sessions on same day
      - Longer breaks between sessions
      - Fewer concurrent tracks
      - More virtual recordings available
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall conference satisfaction
      hint: Rate overall experience from 1 to 5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 9
      name: would_recommend
      label: Would recommend to a colleague
      hint: Simple yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: suggestions
      label: Suggestions for future schedules
      hint: Any topics or formats you want added
      type: text
      options: []
      required: false
