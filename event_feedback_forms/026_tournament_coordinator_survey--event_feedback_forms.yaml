inputSchema:
  type: object
  properties:
    title: Tournament Coordinator Survey
    pages:
    - id: 1
      name: tournament_name
      label: Tournament Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: staff_name
      label: Staff Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: feedback_important_improvement
      label: What important things should we change about the tournament?
      hint: What do you think we should improve about the tournament?
      type: text
      options: []
      required: false
    - id: 4
      name: feedback_minor_improvement
      label: What minor things should we change about the tournament?
      hint: What minor things do you think we should improve about the tournament?
      type: text
      options: []
      required: false
    - id: 5
      name: communication
      label: How would you rate our communication during the tournament?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Bad
      - Terrible
      required: false
    - id: 6
      name: feedback_general_comments
      label: Any other comments about the tournament?
      hint: null
      type: text
      options: []
      required: false
