inputSchema:
  type: object
  properties:
    title: Art And Poetry Satisfaction Survey
    pages:
    - id: 1
      name: section_respondent
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: event_date
      label: Event Date Attended
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: section_event
      label: -- Event Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: event_overall_satisfaction
      label: Overall Satisfaction with the Event
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 7
      name: event_organization
      label: Event Organization and Planning
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: venue_quality
      label: Venue Quality and Atmosphere
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: section_art
      label: -- Art Presentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: art_presentation_quality
      label: Quality of Art Presentations
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: art_variety
      label: Variety of Artwork Displayed
      hint: null
      type: select_one
      options:
      - Excellent variety
      - Good variety
      - Limited variety
      - Poor variety
      required: true
    - id: 12
      name: art_interest
      label: Interest in Art Presented
      hint: null
      type: select_one
      options:
      - Very interested
      - Interested
      - Somewhat interested
      - Not interested
      required: true
    - id: 13
      name: section_poetry
      label: -- Poetry Presentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: poetry_quality
      label: Quality of Poetry Readings
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: poetry_performers
      label: Quality of Poetry Performers
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: poetry_variety
      label: Variety of Poetry Styles or Themes
      hint: null
      type: select_one
      options:
      - Excellent variety
      - Good variety
      - Limited variety
      - Poor variety
      required: true
    - id: 17
      name: poetry_engagement
      label: How engaged were you by the poetry
      hint: null
      type: select_one
      options:
      - Very engaged
      - Engaged
      - Somewhat engaged
      - Not engaged
      required: true
    - id: 18
      name: section_coordination
      label: -- Coordination Between Art and Poetry --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: theme_coherence
      label: How well did art and poetry complement each other
      hint: null
      type: select_one
      options:
      - Excellently coordinated
      - Well coordinated
      - Somewhat coordinated
      - Poorly coordinated
      required: true
    - id: 20
      name: section_value
      label: -- Value and Worth --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: worth_cost
      label: Was the event worth the cost
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - 'True'
      - Neutral
      - 'False'
      - No, definitely not
      required: true
    - id: 22
      name: recommend
      label: Would you recommend this event to others
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - 'True'
      - Maybe
      - 'False'
      - No, definitely not
      required: true
    - id: 23
      name: section_feedback
      label: -- Suggestions and Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: improvement_suggestions
      label: Suggestions for Future Events
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
