inputSchema:
  type: object
  properties:
    title: Program Survey
    pages:
    - id: 1
      name: program_survey_form_title
      label: Program Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: program_survey_form_category
      label: Event Category
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: program_survey_form_description
      label: Program Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: program_survey_form_rating
      label: Rating (1-5)
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 5
      name: program_survey_form_comment
      label: Comment
      hint: null
      type: text
      options: []
      required: false
