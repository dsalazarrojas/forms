inputSchema:
  type: object
  properties:
    title: Event Crowd Management Feedback Form
    pages:
    - id: 1
      name: intro_page
      label: intro
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: crowd_management
      label: Crowd Management
      hint: How would you rate the crowd management during this event?
      type: select_one
      options:
      - Very poor
      - Poor
      - Average
      - Good
      - Excellent
      required: false
    - id: 4
      name: attendee_satisfaction
      label: Attendee Satisfaction
      hint: How satisfied are you with the overall attendee experience?
      type: select_one
      options:
      - Very dissatisfied
      - Dissatisfied
      - Neutral
      - Satisfied
      - Very satisfied
      required: false
    - id: 5
      name: event_feedback
      label: Event Feedback
      hint: Provide any additional feedback about your experience
      type: text
      options: []
      required: false
    - id: 6
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
