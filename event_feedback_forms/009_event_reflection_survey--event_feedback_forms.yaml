inputSchema:
  type: object
  properties:
    title: Event Reflection Survey
    pages:
    - id: 1
      name: event_reflection_survey_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: event_reflection_survey_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: event_reflection_survey_date_of_event
      label: Date of Event
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: event_reflection_survey_rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Highly Satisfied
      - Neutral
      - Somewhat Satisfied
      - Not Satisfied
      - Not At All Satisfied
      required: true
    - id: 5
      name: event_reflection_survey_comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: event_reflection_survey_recommend
      label: Recommend
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: event_reflection_survey_follow_up
      label: Follow-up
      hint: null
      type: select_multiple
      options:
      - Yes, I'm interested
      - No, thanks
      required: false
