inputSchema:
  type: object
  properties:
    title: Event Memory Test Feedback Form
    pages:
    - id: 1
      name: event_memory_test_difficulty
      label: How was the difficulty level of the event?
      hint: null
      type: select_one
      options:
      - too high
      - not high enough
      - just right
      required: true
    - id: 2
      name: event_memory_test_feedback
      label: How do you think the event helped with your memory?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: event_memory_test_date
      label: Date of the Event
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: event_memory_test_suggestions
      label: Suggestions for improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: assigned_to
      label: Assigned to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - other
      required: false
    - id: 7
      name: event_category
      label: Category
      hint: null
      type: select_one
      options:
      - Event Feedback Forms
      - Other
      required: false
    - id: 8
      name: event_memory_test_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - other
      required: false
