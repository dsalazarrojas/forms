inputSchema:
  type: object
  properties:
    title: Color Ensemble Feedback Form
    pages:
    - id: 1
      name: header
      label: -- Event Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: Attendee name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: event_date
      label: Event date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 4
      name: overall_satisfaction
      label: Overall satisfaction
      hint: 1 low to 5 high
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 5
      name: favorite_aspect
      label: Favorite aspect of event
      hint: What stood out most
      type: text
      options: []
      required: false
    - id: 6
      name: improvement_suggestions
      label: Suggestions for improvement
      hint: Practical feedback
      type: text
      options: []
      required: false
    - id: 7
      name: speaker_quality
      label: Speaker quality rating
      hint: 1 low to 5 high
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 8
      name: venue_rating
      label: Venue rating
      hint: 1 low to 5 high
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 9
      name: would_recommend
      label: Would recommend to others
      hint: Yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: additional_comments
      label: Additional comments
      hint: Free text
      type: text
      options: []
      required: false
