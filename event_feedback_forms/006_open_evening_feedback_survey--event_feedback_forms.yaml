inputSchema:
  type: object
  properties:
    title: Open Evening Feedback Survey
    pages:
    - id: 1
      name: purpose
      label: What was the purpose of this event?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: relevance_rating
      label: How would you rate the relevance of the event topic to your interests?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: most_interesting_aspect
      label: What was the most interesting aspect of the event?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: satisfied_with_event_organization
      label: Were you satisfied with the event organization?
      hint: null
      type: select_one
      options:
      - Very good
      - Good
      - Neutral
      - Bad
      - Very Bad
      required: true
    - id: 5
      name: attend_another_event
      label: Would you attend another event like this?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: suggestions
      label: Do you have any suggestions for future events?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: venue_comments
      label: What did you think of the venue?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: recommendation_confidence
      label: How likely are you to recommend this event to a friend?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: event_duration
      label: How long did you stay at the event?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: other_comments
      label: Do you have any other comments or suggestions?
      hint: null
      type: text
      options: []
      required: false
