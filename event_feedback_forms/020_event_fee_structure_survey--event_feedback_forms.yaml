inputSchema:
  type: object
  properties:
    title: Event Fee Structure Survey
    pages:
    - id: 1
      name: event_fee_structure_survey_page_1
      label: Event Details
      hint: null
      type: select_one
      options:
      - base price
      - price per attendee
      - price per item
      - other
      required: false
    - id: 2
      name: event_fee_structure_survey_page_2
      label: Pricing and Revenue
      hint: null
      type: select_one
      options:
      - revenue per event
      - total revenue
      - other
      required: false
    - id: 3
      name: event_fee_structure_survey_page_3
      label: Event Type
      hint: null
      type: select_one
      options:
      - concert
      - festival
      - conference
      - other
      required: false
    - id: 4
      name: event_fee_structure_survey_page_4
      label: Additional Fees
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 5
      name: event_fee_structure_survey_page_5
      label: Additional Fees for
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: event_fee_structure_survey_page_6
      label: Clarity of Fee Structure
      hint: null
      type: select_one
      options:
      - very clear
      - somewhat clear
      - not clear
      required: false
    - id: 7
      name: event_fee_structure_survey_page_7
      label: Recommend to Others
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: event_fee_structure_survey_page_8
      label: Fair and Transparent
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: event_fee_structure_survey_page_9
      label: Time Frame for Ticket Sales and Event Preparation
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: event_fee_structure_survey_page_10
      label: Comparison with Other Events
      hint: null
      type: select_multiple
      options:
      - fair
      - unfair
      - neutral
      required: false
    - id: 11
      name: event_fee_structure_survey_page_11
      label: Unexpected Fees
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 12
      name: event_fee_structure_survey_page_12
      label: Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
