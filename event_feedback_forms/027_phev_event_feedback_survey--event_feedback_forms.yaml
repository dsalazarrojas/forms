inputSchema:
  type: object
  properties:
    title: PHEV Event Feedback Survey
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Conference
      - Workshop
      - Meeting
      required: true
    - id: 6
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
