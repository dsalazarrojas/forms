inputSchema:
  type: object
  properties:
    title: B2B Launch Event Feedback Form
    pages:
      - id: 1
        name: attendee_name
        label: Full Name
        hint: Your first and last name
        type: text
        options: []
        required: true
      - id: 2
        name: company_name
        label: Company Name
        hint: Organization you represent
        type: text
        options: []
        required: true
      - id: 3
        name: job_title
        label: Job Title
        hint: Your position or role
        type: text
        options: []
        required: true
      - id: 4
        name: email
        label: Email Address
        hint: Business email for follow-up
        type: email
        options: []
        required: true
      - id: 5
        name: event_date
        label: Event Date Attended
        hint: Which session did you attend
        type: date
        options: []
        required: true
      - id: 6
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall experience
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 7
        name: venue_rating
        label: Venue Rating
        hint: Rate the event venue
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 8
        name: content_quality
        label: Content Quality
        hint: Rate the presentation content
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 9
        name: speaker_rating
        label: Speaker Performance
        hint: Rate the speakers and presentations
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 10
        name: networking_opportunities
        label: Networking Opportunities
        hint: Rate networking chances at event
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 11
        name: event_organization
        label: Event Organization
        hint: Rate the event coordination and logistics
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 12
        name: most_valuable_session
        label: Most Valuable Session
        hint: Which session provided most value
        type: text
        options: []
        required: false
      - id: 13
        name: areas_for_improvement
        label: Areas for Improvement
        hint: What could we improve for future events
        type: text
        options: []
        required: false
      - id: 14
        name: likelihood_recommend
        label: Likelihood to Recommend
        hint: How likely are you to recommend this event to colleagues
        type: select_one
        options:
          - Very Likely
          - Likely
          - Neutral
          - Unlikely
          - Very Unlikely
        required: true
      - id: 15
        name: future_event_interest
        label: Interest in Future Events
        hint: Would you attend future events from us
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Maybe
          - Probably No
          - Definitely No
        required: true
      - id: 16
        name: topics_of_interest
        label: Topics of Interest for Future Events
        hint: What topics would you like to see
        type: select_multiple
        options:
          - Product demonstrations
          - Industry trends
          - Case studies
          - Networking sessions
          - Expert panels
          - Workshops
          - Q and A sessions
        required: false
      - id: 17
        name: additional_feedback
        label: Additional Comments
        hint: Any other feedback you would like to share
        type: text
        options: []
        required: false
