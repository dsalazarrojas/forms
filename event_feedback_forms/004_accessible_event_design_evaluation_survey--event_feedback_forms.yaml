inputSchema:
  type: object
  properties:
    title: Accessible Event Design Evaluation Survey
    pages:
    - id: 1
      name: section_attendee_info
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name (Optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: For follow-up regarding your feedback
      type: email
      options: []
      required: false
    - id: 4
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Date of Event
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: attendee_type
      label: Attendee Type
      hint: null
      type: select_one
      options:
        - General attendee
        - Speaker or presenter
        - Volunteer
        - Staff or organizer
        - Vendor or exhibitor
      required: true
    - id: 7
      name: disability_or_access_need
      label: Do You Identify as Having a Disability or Access Need
      hint: null
      type: select_one
      options:
        - Yes
        - No
        - Prefer not to say
      required: false
    - id: 8
      name: section_venue_accessibility
      label: -- Venue Accessibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: venue_physical_access
      label: Rate the Physical Accessibility of the Venue (entrances, pathways, seating)
      hint: null
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Very Poor
      required: true
    - id: 10
      name: restroom_accessibility
      label: Rate the Accessibility of Restrooms
      hint: null
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Very Poor
        - Did not use
      required: true
    - id: 11
      name: signage_wayfinding
      label: Rate the Signage and Wayfinding
      hint: Were signs clear, visible, and helpful for navigation
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Very Poor
      required: true
    - id: 12
      name: section_event_content
      label: -- Event Content and Communication --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: materials_accessibility
      label: Were Event Materials Provided in Accessible Formats
      hint: e.g., large print, braille, digital, audio
      type: select_one
      options:
        - Yes, fully accessible
        - Partially accessible
        - Not accessible
        - Not applicable
      required: true
    - id: 14
      name: captioning_available
      label: Was Live Captioning or Sign Language Interpretation Available
      hint: null
      type: select_one
      options:
        - Yes, and it was effective
        - Yes, but quality was poor
        - No, but it was needed
        - No, and it was not needed
      required: true
    - id: 15
      name: assistive_technology_support
      label: Were Assistive Technology or Listening Devices Available
      hint: null
      type: select_one
      options:
        - Yes
        - No
        - Not sure
        - Not needed
      required: false
    - id: 16
      name: section_overall
      label: -- Overall Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: overall_accessibility_rating
      label: Overall Rating of Event Accessibility
      hint: null
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Very Poor
      required: true
    - id: 18
      name: accommodations_requested
      label: Did You Request Any Accommodations in Advance
      hint: null
      type: select_one
      options:
        - Yes, and they were fully met
        - Yes, but they were only partially met
        - Yes, but they were not met
        - No, I did not request any
      required: true
    - id: 19
      name: barriers_encountered
      label: Describe Any Accessibility Barriers You Encountered
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: improvement_suggestions
      label: What Improvements Would Make Future Events More Accessible
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: would_attend_again
      label: Would You Attend a Future Event by This Organizer
      hint: null
      type: select_one
      options:
        - Definitely yes
        - Probably yes
        - Not sure
        - Probably not
        - Definitely not
      required: true
