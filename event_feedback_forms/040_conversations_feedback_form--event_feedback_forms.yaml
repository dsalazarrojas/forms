inputSchema:
  type: object
  properties:
    title: Conversations Feedback Form
    pages:
    - id: 1
      name: respondent_name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email Address
      hint: For follow-up
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone Number
      hint: Optional contact number
      type: text
      options: []
      required: false
    - id: 4
      name: section_conversation_info
      label: -- Conversation Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: conversation_type
      label: Type of Conversation
      hint: What was this about
      type: select_one
      options:
      - Customer Support
      - Sales Inquiry
      - Technical Support
      - General Inquiry
      - Complaint
      - Feedback
      - Other
      required: true
    - id: 6
      name: conversation_channel
      label: Channel Used
      hint: How did you communicate
      type: select_one
      options:
      - Phone Call
      - Email
      - Live Chat
      - Video Call
      - In Person
      - Social Media
      - SMS
      - Other
      required: true
    - id: 7
      name: conversation_date
      label: Date of Conversation
      hint: When did this occur
      type: date
      options: []
      required: true
    - id: 8
      name: conversation_time
      label: Time of Conversation
      hint: Approximate time
      type: time
      options: []
      required: false
    - id: 9
      name: representative_name
      label: Representative Name
      hint: Who did you speak with
      type: text
      options: []
      required: false
    - id: 10
      name: section_responsiveness
      label: -- Responsiveness --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: wait_time
      label: How long did you wait
      hint: null
      type: select_one
      options:
      - No Wait
      - Less than 1 minute
      - 1-5 minutes
      - 5-10 minutes
      - Over 10 minutes
      required: true
    - id: 12
      name: wait_time_satisfaction
      label: Satisfaction with wait time
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 13
      name: response_speed
      label: Speed of responses during conversation
      hint: null
      type: select_one
      options:
      - Very Fast
      - Fast
      - Average
      - Slow
      - Very Slow
      required: true
    - id: 14
      name: section_professionalism
      label: -- Professionalism --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: representative_knowledge
      label: Knowledge of the representative
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 16
      name: representative_courtesy
      label: Courtesy and politeness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 17
      name: representative_friendliness
      label: Friendliness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 18
      name: communication_clarity
      label: Clarity of communication
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 19
      name: section_problem_resolution
      label: -- Problem Resolution --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: issue_resolved
      label: Was your issue resolved
      hint: null
      type: select_one
      options:
      - Yes - Completely
      - Yes - Partially
      - false
      - Not Applicable
      required: true
    - id: 21
      name: resolution_satisfaction
      label: Satisfaction with the resolution
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 22
      name: first_contact_resolution
      label: Was this resolved in first contact
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not Applicable
      required: false
    - id: 23
      name: section_overall
      label: -- Overall --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: overall_satisfaction
      label: Overall satisfaction with the conversation
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 25
      name: expectations_met
      label: Were your expectations met
      hint: null
      type: select_one
      options:
      - Exceeded
      - Met
      - Partially Met
      - Not Met
      required: true
    - id: 26
      name: would_contact_again
      label: Would you contact again for future needs
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 27
      name: would_recommend
      label: Would you recommend our service
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 28
      name: section_feedback
      label: -- Additional Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: what_went_well
      label: What went well
      hint: null
      type: text
      options: []
      required: false
    - id: 30
      name: what_needs_improvement
      label: What could be improved
      hint: null
      type: text
      options: []
      required: false
    - id: 31
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 32
      name: permission_to_follow_up
      label: May we follow up on your feedback
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
