inputSchema:
  type: object
  properties:
    title: Zoom Event Feedback Survey
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - '{''label'': ''Highly Satisfied'', ''value'': 5}'
      - '{''label'': ''Somewhat Satisfied'', ''value'': 3}'
      - '{''label'': ''Somewhat Dissatisfied'', ''value'': 2}'
      - '{''label'': ''Not Satisfied'', ''value'': 1}'
      required: true
    - id: 3
      name: event_title
      label: Event Title
      hint: Enter the title of the event
      type: text
      options: []
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: zoom_meeting_id
      label: Zoom Meeting ID
      hint: Provide the Zoom Meeting ID
      type: text
      options: []
      required: false
    - id: 14
      name: participant_count
      label: Participant Count
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: attendees
      label: Attendees
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Less than 10'', ''value'': 10}'
      - '{''label'': ''10-20'', ''value'': 20}'
      - '{''label'': ''20-50'', ''value'': 50}'
      - '{''label'': ''50 or more'', ''value'': 50}'
      required: true
    - id: 16
      name: language
      label: Language
      hint: null
      type: select_one
      options:
      - '{''label'': ''English'', ''value'': ''English''}'
      - '{''label'': ''Spanish'', ''value'': ''Spanish''}'
      - '{''label'': ''French'', ''value'': ''French''}'
      - '{''label'': ''Other'', ''value'': ''Other''}'
      required: true
    - id: 17
      name: timezone
      label: Timezone
      hint: null
      type: select_one
      options:
      - '{''label'': ''UTC+0'', ''value'': ''UTC+0''}'
      - '{''label'': ''UTC-8'', ''value'': ''UTC-8''}'
      - '{''label'': ''UTC+8'', ''value'': ''UTC+8''}'
      - '{''label'': ''Other'', ''value'': ''Other''}'
      required: true
