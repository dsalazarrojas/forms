inputSchema:
  type: object
  properties:
    title: Zoom Event Feedback Survey
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Highly Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Not Satisfied
      required: true
    - id: 3
      name: event_title
      label: Event Title
      hint: Enter the title of the event
      type: text
      options: []
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: zoom_meeting_id
      label: Zoom Meeting ID
      hint: Provide the Zoom Meeting ID
      type: text
      options: []
      required: false
    - id: 14
      name: participant_count
      label: Participant Count
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: attendees
      label: Attendees
      hint: null
      type: select_multiple
      options:
      - Less than 10
      - 10-20
      - 20-50
      - 50 or more
      required: true
    - id: 16
      name: language
      label: Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Other
      required: true
    - id: 17
      name: timezone
      label: Timezone
      hint: null
      type: select_one
      options:
      - UTC+0
      - UTC-8
      - UTC+8
      - Other
      required: true
