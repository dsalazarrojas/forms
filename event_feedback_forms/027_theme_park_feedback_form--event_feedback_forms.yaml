inputSchema:
  type: object
  properties:
    title: theme_park_feedback_form
    pages:
    - id: 1
      name: theme_park_visit
      label: Theme Park Visit
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: ride_experience
      label: Rides and Attractions
      hint: null
      type: select_multiple
      options:
      - Ride 1
      - Ride 2
      - Ride 3
      required: true
    - id: 3
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: feedback_text
      label: Feedback Text
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: feedback_date
      label: Feedback Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: feedback_time
      label: Feedback Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: would_visit_again
      label: Would you visit again?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: visit_details
      label: Visit Details
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: stay_in_park
      label: How long did you stay in the park?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: assigned_user
      label: Assigned User
      hint: null
      type: text
      options: []
      required: false
