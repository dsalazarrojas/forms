inputSchema:
  type: object
  properties:
    title: Drama Workshop Feedback Survey
    pages:
    - id: 1
      name: session_name
      label: Session Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: workshop_participants
      label: Workshop Participants
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: feedback_on_materials
      label: Feedback on Materials
      hint: null
      type: select_one
      options:
      - Workshop materials were provided.
      - Workbooks or printed materials were not provided.
      - None of the above.
      required: false
    - id: 4
      name: feedback_on_facilitators
      label: Feedback on Facilitators
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: overall_experience
      label: Overall Experience
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: recommendations
      label: Recommendations
      hint: Please provide any additional comments or recommendations.
      type: text
      options: []
      required: false
