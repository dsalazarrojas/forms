      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: session_name
      label: Session Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: session_rating
      label: Session Rating
