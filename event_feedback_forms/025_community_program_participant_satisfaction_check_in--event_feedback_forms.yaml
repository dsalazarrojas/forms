inputSchema:
  type: object
  properties:
    title: Community Program Participant Satisfaction Check In
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Optional
      type: email
      options: []
      required: false
    - id: 5
      name: participant_id
      label: Participant ID
      hint: If you have one
      type: text
      options: []
      required: false
    - id: 6
      name: program_info
      label: Program Information
      hint: About your participation
      type: note
      options: []
      required: false
    - id: 7
      name: program_name
      label: Program Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: sessions_attended
      label: Total Sessions Attended
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: satisfaction_ratings
      label: Satisfaction Ratings
      hint: Rate your experience
      type: note
      options: []
      required: false
    - id: 11
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 12
      name: content_quality
      label: Quality of Program Content
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: facilitator_rating
      label: Facilitator Effectiveness
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: venue_rating
      label: Venue Quality
      hint: If applicable
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: true
    - id: 15
      name: materials_rating
      label: Quality of Materials Provided
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Not Provided
      required: true
    - id: 16
      name: pacing
      label: Program Pacing
      hint: null
      type: select_one
      options:
      - Too Fast
      - Just Right
      - Too Slow
      required: true
    - id: 17
      name: difficulty
      label: Difficulty Level
      hint: null
      type: select_one
      options:
      - Too Easy
      - Just Right
      - Too Difficult
      required: true
    - id: 18
      name: engagement
      label: How Engaged Did You Feel
      hint: null
      type: select_one
      options:
      - Very Engaged
      - Engaged
      - Somewhat Engaged
      - Not Very Engaged
      - Not Engaged
      required: true
    - id: 19
      name: learning_outcomes
      label: Learning Outcomes
      hint: What did you gain
      type: note
      options: []
      required: false
    - id: 20
      name: objectives_met
      label: Were Learning Objectives Met
      hint: null
      type: select_one
      options:
      - Completely
      - Mostly
      - Somewhat
      - Not Really
      - Not At All
      required: true
    - id: 21
      name: key_learnings
      label: What Did You Learn
      hint: Key takeaways
      type: text
      options: []
      required: false
    - id: 22
      name: skills_improved
      label: Skills Improved
      hint: Select all that apply
      type: select_multiple
      options:
      - Communication
      - Leadership
      - Problem Solving
      - Teamwork
      - Technical Skills
      - Critical Thinking
      - Time Management
      - Confidence
      - Other
      required: false
    - id: 23
      name: application
      label: How Will You Apply What You Learned
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: recommendations
      label: Recommendations
      hint: Your suggestions
      type: note
      options: []
      required: false
    - id: 25
      name: improvements
      label: What Could Be Improved
      hint: Be specific
      type: text
      options: []
      required: false
    - id: 26
      name: topics_future
      label: Topics for Future Sessions
      hint: What would you like to learn
      type: text
      options: []
      required: false
    - id: 27
      name: recommend_program
      label: Would You Recommend This Program
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 28
      name: continue_participation
      label: Will You Continue in This Program
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 29
      name: additional_support
      label: Do You Need Additional Support
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not Sure
      required: false
    - id: 30
      name: support_needed
      label: What Support Do You Need
      hint: Describe
      type: text
      options: []
      required: false
    - id: 31
      name: additional_comments
      label: Additional Comments
      hint: Anything else to share
      type: text
      options: []
      required: false
