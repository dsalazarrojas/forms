      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: session_length
      label: Session Length
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: event_level
      label: Event Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 5
      name: session_length_value
      label: Session Length Value
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: event_organizer
      label: Event Organizer
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
