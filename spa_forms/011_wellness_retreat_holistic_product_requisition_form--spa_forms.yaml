inputSchema:
  type: object
  properties:
    title: Wellness Retreat Holistic Product Requisition Form
    pages:
    - id: 1
      name: product_request
      label: Select a Product
      hint: null
      type: select_one
      options:
      - Massage
      - Yoga
      - Meditation
      - Other
      required: true
    - id: 2
      name: date_time
      label: Preferred Date and Time
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: allergies
      label: Medical Conditions or Allergies
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: additional_questions
      label: Additional Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Cash
      - PayPal
      - Other
      required: true
    - id: 9
      name: special_instructions
      label: Special Instructions
      hint: null
      type: text
      options: []
      required: false
