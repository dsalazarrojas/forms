inputSchema:
  type: object
  properties:
    title: Beard Cleanse Mask Application Consent Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Client first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Client last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Client DOB
      type: date
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 6
      name: treatment_date
      label: Treatment Date
      hint: Scheduled date
      type: date
      options: []
      required: true
    - id: 7
      name: esthetician_name
      label: Esthetician Name
      hint: Service provider
      type: text
      options: []
      required: true
    - id: 8
      name: skin_type
      label: Skin Type
      hint: Your skin type
      type: select_one
      options:
      - Normal
      - Oily
      - Dry
      - Combination
      - Sensitive
      required: true
    - id: 9
      name: skin_conditions
      label: Current Skin Conditions
      hint: Any conditions
      type: select_multiple
      options:
      - Acne
      - Rosacea
      - Eczema
      - Psoriasis
      - Dermatitis
      - None
      required: true
    - id: 10
      name: allergies
      label: Known Allergies
      hint: List any allergies
      type: text
      options: []
      required: true
    - id: 11
      name: medications
      label: Current Medications
      hint: Especially skin medications
      type: text
      options: []
      required: true
    - id: 12
      name: previous_treatments
      label: Previous Beard or Facial Treatments
      hint: Recent treatments
      type: text
      options: []
      required: false
    - id: 13
      name: treatment_understood
      label: I Understand the Treatment
      hint: Do you understand
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: risks_explained
      label: Risks Have Been Explained
      hint: Were risks explained
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: questions_answered
      label: All Questions Answered
      hint: Were your questions answered
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: consent_given
      label: I Consent to the Treatment
      hint: Do you consent
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: medical_clearance
      label: Medical Clearance Needed
      hint: Do you need clearance
      type: select_one
      options:
      - Yes - Will Provide
      - No - Not Needed
      required: true
    - id: 18
      name: photo_consent
      label: Consent for Before and After Photos
      hint: For records
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: client_signature
      label: Client Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 20
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
