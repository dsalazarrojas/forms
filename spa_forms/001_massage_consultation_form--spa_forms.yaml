inputSchema:
  type: object
  properties:
    title: Massage Consultation Form
    pages:
    - id: 1
      name: massage_consultation_form
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: massage_consultation_form_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: massage_consultation_form_age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: massage_consultation_form_benefits_of_massage_therapy
      label: What benefits of massage therapy have you experienced?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: massage_consultation_form_medical_condition
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: massage_consultation_form_contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: massage_consultation_form_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: massage_consultation_form_preferred_time
      label: Preferred Time
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 9
      name: massage_consultation_form_preferred_day
      label: Preferred Day
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 10
      name: massage_consultation_form_massage_therapist
      label: Interested in receiving a message from a massage therapist?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 11
      name: massage_consultation_form_massage_type
      label: Type of Massage
      hint: null
      type: select_one
      options:
      - Swedish
      - Deep Tissue
      - Sports
      required: true
    - id: 12
      name: massage_consultation_form_massage_area
      label: Area of Focus
      hint: null
      type: select_multiple
      options:
      - Back
      - Neck
      - Shoulders
      - Arms
      - Legs
      required: true
