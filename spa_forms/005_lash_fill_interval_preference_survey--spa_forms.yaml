inputSchema:
  type: object
  properties:
    title: Lash Fill Interval Preference Survey
    pages:
    - id: 1
      name: frequency_label
      label: What frequency is most appealing to you?
      hint: null
      type: select_one
      options:
      - Less than 2 weeks
      - 2-4 weeks
      - 4-6 weeks
      - Every 6 weeks
      required: true
    - id: 2
      name: satisfaction_label
      label: How satisfied are you with our current lash fill intervals?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 3
      name: influencing_factor
      label: Which of the following influenced your current fill interval?
      hint: null
      type: select_multiple
      options:
      - Convenience
      - Cost
      - Personal preference
      - Recommended by others
      - None of the above
      required: true
    - id: 4
      name: service_label
      label: Would you prefer a more personalized service approach?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: frequency_input
      label: What would you like your fill interval to be?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: satisfaction_input
      label: On a scale of 1-10, how satisfied are you with your current fill intervals?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: service_note
      label: Is there anything else you'd like to add or comment about your current
        fill intervals?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email_label
      label: How often would you like to receive emails from us?
      hint: null
      type: select_one
      options:
      - Every 2 weeks
      - Every 4 weeks
      - Never
      required: true
    - id: 9
      name: phone_label
      label: How often would you like to receive phone calls from us?
      hint: null
      type: select_one
      options:
      - Every 2 weeks
      - Every 4 weeks
      - Never
      required: false
    - id: 10
      name: notes
      label: Do you have any other comments or suggestions?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: email_input
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone_input
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
