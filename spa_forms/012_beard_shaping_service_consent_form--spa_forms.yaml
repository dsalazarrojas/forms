inputSchema:
  type: object
  properties:
    title: Beard Shaping Service Consent Form
    pages:
    - id: 1
      name: client_header
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: beard_info_header
      label: -- Beard Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: beard_length
      label: Current Beard Length
      hint: null
      type: select_one
      options:
      - Less than 1 inch
      - 1-3 inches
      - 3-6 inches
      - 6+ inches
      required: true
    - id: 9
      name: beard_density
      label: Beard Density
      hint: null
      type: select_one
      options:
      - Light
      - Medium
      - Dense
      - Very Dense
      required: true
    - id: 10
      name: face_shape
      label: Face Shape
      hint: null
      type: select_one
      options:
      - Oval
      - Round
      - Square
      - Rectangular
      - Heart
      - Diamond
      required: true
    - id: 11
      name: previous_shaping
      label: Previously Shaped Beard
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: health_header
      label: -- Health Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: skin_conditions
      label: Current Skin Conditions
      hint: Sensitive areas, psoriasis, eczema, etc.
      type: text
      options: []
      required: false
    - id: 14
      name: ingrown_hairs
      label: History of Ingrown Hairs
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: allergies_to_products
      label: Product Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: recent_cuts
      label: Recent Cuts or Abrasions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: consent_header
      label: -- Service Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: understand_procedure
      label: I understand the beard shaping procedure
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 19
      name: consent_to_service
      label: I consent to this beard shaping service
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: acknowledge_risks
      label: I acknowledge potential risks
      hint: Nicks, irritation, or temporary redness
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 21
      name: follow_aftercare
      label: I will follow aftercare instructions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: client_signature
      label: Client Signature
      hint: By typing here you consent to treatment
      type: text
      options: []
      required: true
