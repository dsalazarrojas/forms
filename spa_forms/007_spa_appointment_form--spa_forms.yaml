inputSchema:
  type: object
  properties:
    title: Spa Appointment Form
    pages:
    - id: 1
      name: client_info
      label: Client Info
      hint: Enter client name
      type: text
      options: []
      required: true
    - id: 2
      name: date
      label: Date
      hint: Select appointment date
      type: date
      options: []
      required: true
    - id: 3
      name: time
      label: Time
      hint: Select appointment time
      type: time
      options: []
      required: true
    - id: 4
      name: service
      label: Service
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: duration
      label: Duration
      hint: Enter service duration
      type: number
      options: []
      required: true
