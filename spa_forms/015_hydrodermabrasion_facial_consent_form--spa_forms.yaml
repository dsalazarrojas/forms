inputSchema:
  type: object
  properties:
    title: Hydrodermabrasion Facial Consent Form
    pages:
    - id: 1
      name: client_history
      label: Client History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: treatment_awareness
      label: Treatment Awareness
      hint: null
      type: select_multiple
      options:
      - Hydrodermabrasion
      - Chemical Exfoliation
      - Microdermabrasion
      required: true
    - id: 3
      name: signature_consent
      label: Signature and Consent
      hint: null
      type: note
      options: []
      required: true
    - id: 4
      name: contact_details
      label: Contact Details
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - In Person
      required: true
    - id: 5
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
