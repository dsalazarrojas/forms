inputSchema:
  type: object
  properties:
    title: Spa Consultation Form
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: preferred_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: services
      label: Services
      hint: null
      type: select_multiple
      options:
      - Massage
      - Facial
      - Manicure
      - Pedicure
      - Other
      required: false
    - id: 7
      name: massage_type
      label: Massage Type
      hint: null
