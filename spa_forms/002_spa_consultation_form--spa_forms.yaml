      options:
      - Deep Tissue
      - Swedish
      - Hot Stone
      - Aromatherapy
      - Other
      required: false
    - id: 8
      name: massage_duration
      label: Massage Duration
      hint: null
      type: select_one
      options:
      - '15'
      - '30'
      - '60'
      - '90'
      required: false
    - id: 9
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
