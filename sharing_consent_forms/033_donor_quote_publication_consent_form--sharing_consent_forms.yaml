inputSchema:
  type: object
  properties:
    title: Donor Quote Publication Consent Form
    pages:
    - id: 1
      name: donor_quote_publication_consent_form
      label: Donor Quote Publication Consent Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: donor_consent
      label: Donor Consent
      hint: null
      type: select_one
      options:
      - I grant permission for Jotform to share and publish my quote in any form or
        medium.
      - I do not grant permission for Jotform to share and publish my quote in any
        form or medium.
      required: false
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: signature_date
      label: Signature Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: publication_permission
      label: Publication Permission
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: publication_medium
      label: Publication Medium
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Website
      - Email
      - Print
      - Video
      required: false
