inputSchema:
  type: object
  properties:
    title: Animation Workshop Publicity Consent Form
    pages:
    - id: 1
      name: participant_header
      label: -- Participant Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant full name
      hint: Full name for the consent record
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For publicity confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: age_group
      label: Age group
      hint: Select your age group
      type: select_one
      options:
      - Under 18
      - 18 to 25
      - 26 to 40
      - 41 to 65
      - 66 and above
      required: false
    - id: 5
      name: consent_photos
      label: Consent to use photos and video
      hint: Permission to use images from the workshop
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: consent_testimonials
      label: Consent to use testimonials
      hint: Permission to quote testimonials for marketing
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: signature_name
      label: Typed name for consent
      hint: Type name to confirm consent
      type: text
      options: []
      required: true
    - id: 8
      name: date_signed
      label: Date signed
      hint: Date consent was provided
      type: date
      options: []
      required: true
    - id: 9
      name: guardian_contact
      label: Guardian contact if under 18
      hint: Provide guardian name and phone
      type: text
      options: []
      required: false
    - id: 10
      name: additional_restrictions
      label: Additional restrictions
      hint: Note any restrictions on publicity use
      type: text
      options: []
      required: false
