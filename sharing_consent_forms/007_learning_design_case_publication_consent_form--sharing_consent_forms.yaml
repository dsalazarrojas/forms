inputSchema:
  type: object
  properties:
    title: Learning Design Case Publication Consent Form
    pages:
    - id: 1
      name: title
      label: Title of the Case Study
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: category
      label: Category of the Case Study
      hint: null
      type: select_one
      options:
      - Category 1
      - Category 2
      - Category 3
      required: true
    - id: 3
      name: description
      label: Description of the Case Study
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: output_file
      label: Output File (optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 6
      name: sharing_consent
      label: Category of the Sharing Consent Form
      hint: null
      type: text
      options: []
      required: true
