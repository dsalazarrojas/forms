inputSchema:
  type: object
  properties:
    title: Project Documentation Consent Form
    pages:
    - id: 1
      name: participant_information
      label: Participant Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - '{''label'': ''Email''}'
      - '{''label'': ''Phone''}'
      - '{''label'': ''Mail''}'
      required: true
    - id: 4
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: participant_notes
      label: Participant Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: project_leader_name
      label: Project Leader Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: project_materials
      label: Project Materials
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: participant_signature
      label: Participant Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: project_leader_signature
      label: Project Leader Signature
      hint: null
      type: text
      options: []
      required: false
