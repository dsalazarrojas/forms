inputSchema:
  type: object
  properties:
    title: Educational Webinar Clip Distribution Consent Form
    pages:
    - id: 1
      name: participant_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_role
      label: What is your role (Student, Teacher, Parent, etc.)?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: share_consent
      label: Do you consent to share educational webinar clips?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: contact_method
      label: How would you like to be contacted for future webinars?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Other
      required: true
    - id: 5
      name: share_method
      label: How will you be sharing the clips?
      hint: null
      type: select_one
      options:
      - Publicly
      - Privately
      required: true
    - id: 6
      name: email_address
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: use_purpose
      label: How will you be using the clips?
      hint: null
      type: select_one
      options:
      - For personal use
      - For teaching
      - For research
      required: true
    - id: 8
      name: share_institutions
      label: Do you consent to share educational webinar clips with other institutions?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: comments
      label: Would you like to provide any additional comments about the clips?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: previous_participation
      label: Have you ever participated in a similar activity before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: other_questions
      label: Do you have any other questions or concerns about the consent form?
      hint: null
      type: text
      options: []
      required: false
