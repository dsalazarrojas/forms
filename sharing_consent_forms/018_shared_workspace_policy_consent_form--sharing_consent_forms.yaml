inputSchema:
  type: object
  properties:
    title: Shared Workspace Policy Consent Form
    pages:
    - id: 1
      name: form_1
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: form_2
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: form_3
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: form_4
      label: Would you like to share your workspace?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 5
      name: form_5
      label: What date would you like to start sharing your workspace from?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: form_6
      label: What time would you like to share your workspace during?
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: form_7
      label: Do you have any additional comments or notes?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: form_8
      label: What is the start date of your availability?
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: form_9
      label: What is the end date of your availability?
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: form_10
      label: Would you like to be notified via email or phone when someone tries to
        share your workspace?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 11
      name: form_11
      label: What time do you like to be notified at?
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: form_12
      label: Would you like to share your workspace with others on a specific date
        and time?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
