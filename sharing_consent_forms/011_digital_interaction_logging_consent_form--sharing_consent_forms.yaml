inputSchema:
  type: object
  properties:
    title: Digital Interaction Logging Consent Form
    pages:
    - id: 1
      name: user_consent
      label: User Consent
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: monitoring_frequency
      label: Monitoring Frequency
      hint: null
      type: select_one
      options:
      - daily
      - weekly
      - monthly
      required: false
    - id: 3
      name: monitoring_method
      label: Monitoring Method
      hint: null
      type: select_multiple
      options:
      - Browser
      - Mobile App
      - Desktop Application
      required: false
    - id: 4
      name: recording_frequency
      label: Recording Frequency
      hint: null
      type: select_one
      options:
      - always
      - sometimes
      - never
      required: false
    - id: 5
      name: data_retention
      label: Data Retention
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: monitoring_location
      label: Monitoring Location
      hint: null
      type: select_one
      options:
      - office
      - home
      - both
      required: false
    - id: 7
      name: monitoring_period
      label: Monitoring Period
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: monitoring_method_detail
      label: Monitoring Method Detail
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: interaction_type
      label: Interaction Type
      hint: null
      type: select_one
      options:
      - email
      - chat
      - voice
      required: false
    - id: 10
      name: interaction_details
      label: Interaction Details
      hint: null
      type: text
      options: []
      required: false
