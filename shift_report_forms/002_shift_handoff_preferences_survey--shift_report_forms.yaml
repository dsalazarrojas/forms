inputSchema:
  type: object
  properties:
    title: Shift Handoff Preferences Survey
    pages:
    - id: 1
      name: shift_id
      label: Shift
      hint: null
      type: select_one
      options:
      - None
      - Primary
      - Secondary
      - Other
      required: false
    - id: 2
      name: handoff_method
      label: Handoff Method
      hint: null
      type: select_one
      options:
      - Voice
      - Video
      - Text
      - Email
      required: false
    - id: 3
      name: shift_length
      label: Shift Length
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: communication_frequency
      label: How Often
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      required: false
    - id: 6
      name: improvement_priorities
      label: Improvement Priorities
      hint: null
      type: select_multiple
      options:
      - Prophets
      - Shift Leader
      - Team Manager
      - Team Lead
      - Other
      required: false
    - id: 7
      name: feedback_frequency
      label: Feedback Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      required: false
    - id: 8
      name: feedback_type
      label: Feedback Type
      hint: null
      type: select_one
      options:
      - Verbal
      - Written
      - Email
      - Other
      required: false
    - id: 9
      name: communication_type
      label: Communication Type
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      required: false
    - id: 10
      name: improvement_areas
      label: Improvement Areas
      hint: null
      type: select_multiple
      options:
      - Prophets
      - Shift Leader
      - Team Manager
      - Team Lead
      - Other
      required: false
    - id: 11
      name: submission_status
      label: Submission Status
      hint: null
      type: select_one
      options:
      - Approved
      - In Review
      - Rejected
      - In Progress
      required: false
