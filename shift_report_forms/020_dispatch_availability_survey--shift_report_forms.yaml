inputSchema:
  type: object
  properties:
    title: Dispatch Availability Survey
    pages:
    - id: 1
      name: availability_1
      label: Availability
      hint: null
      type: select_one
      options:
      - Available
      - Not Available
      required: true
    - id: 2
      name: availability_2
      label: Preferred Work Time
      hint: null
      type: select_multiple
      options:
      - 06:00
      - 07:00
      - 08:00
      - 09:00
      - '600'
      - '660'
      - '720'
      - '780'
      - '840'
      - '900'
      - '960'
      - '1020'
      - '1080'
      - '1140'
      - '1200'
      - '1260'
      - '1320'
      - '1380'
      required: true
    - id: 3
      name: scheduling_constraints_1
      label: Scheduling Constraints
      hint: null
      type: checkbox
      options:
      - Early Morning (06:00-08:00)
      - Late Morning (08:00-12:00)
      - Afternoon (12:00-17:00)
      - Late Afternoon (17:00-19:00)
      - Early Evening (19:00-22:00)
      - Late Evening (22:00-00:00)
      required: true
    - id: 4
      name: dispatchers_1
      label: Dispatchers I Report To
      hint: null
      type: select_one
      options:
      - First
      - Second
      - Both
      - None
      required: true
    - id: 5
      name: breaks_1
      label: Breaks
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: availability_3
      label: Available Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 7
      name: available_times_1
      label: Available Times
      hint: null
      type: select_multiple
      options:
      - 06:00
      - 07:00
      - 08:00
      - 09:00
      - '600'
      - '660'
      - '720'
      - '780'
      - '840'
      - '900'
      - '960'
      - '1020'
      - '1080'
      - '1140'
      - '1200'
      - '1260'
      - '1320'
      required: true
    - id: 8
      name: comments_1
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: available_1
      label: Available
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: notes_1
      label: Notes
      hint: null
      type: text
      options: []
      required: false
