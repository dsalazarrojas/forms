inputSchema:
  type: object
  properties:
    title: Community Shift Report
    pages:
    - id: 1
      name: reporter_info
      label: Reporter Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: employee_id
      label: Employee ID
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: position
      label: Position or Role
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: shift_info
      label: Shift Information
      hint: Details about your shift
      type: note
      options: []
      required: false
    - id: 9
      name: shift_date
      label: Shift Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: shift_type
      label: Shift Type
      hint: null
      type: select_one
      options:
      - Morning (6am-2pm)
      - Afternoon (2pm-10pm)
      - Night (10pm-6am)
      - Custom
      required: true
    - id: 11
      name: start_time
      label: Shift Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: end_time
      label: Shift End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 13
      name: location
      label: Shift Location
      hint: Where did you work
      type: text
      options: []
      required: true
    - id: 14
      name: activities_section
      label: Shift Activities
      hint: What happened during your shift
      type: note
      options: []
      required: false
    - id: 15
      name: tasks_completed
      label: Tasks Completed
      hint: List main accomplishments
      type: text
      options: []
      required: true
    - id: 16
      name: activities_log
      label: Activities Log
      hint: Chronological summary
      type: text
      options: []
      required: true
    - id: 17
      name: incidents
      label: Were There Any Incidents
      hint: Accidents, issues, concerns
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: incidents_description
      label: Describe the Incidents
      hint: Include actions taken
      type: text
      options: []
      required: false
    - id: 19
      name: issues
      label: Were There Any Issues
      hint: Problems or challenges
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: issues_description
      label: Describe the Issues
      hint: And how they were addressed
      type: text
      options: []
      required: false
    - id: 21
      name: handover_section
      label: Handover Notes
      hint: For the next shift
      type: note
      options: []
      required: false
    - id: 22
      name: pending_tasks
      label: Pending Tasks for Next Shift
      hint: What needs to be done
      type: text
      options: []
      required: false
    - id: 23
      name: important_info
      label: Important Information to Pass On
      hint: Key updates
      type: text
      options: []
      required: false
    - id: 24
      name: equipment_status
      label: Equipment Status
      hint: Any issues to report
      type: text
      options: []
      required: false
    - id: 25
      name: supplies
      label: Supply Status
      hint: What needs restocking
      type: text
      options: []
      required: false
    - id: 26
      name: staffing
      label: Staffing Notes
      hint: Attendance, absences
      type: text
      options: []
      required: false
    - id: 27
      name: visitors
      label: Notable Visitors or Calls
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 28
      name: metrics_section
      label: Shift Metrics
      hint: Quantitative data
      type: note
      options: []
      required: false
    - id: 29
      name: people_served
      label: Number of People Served
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 30
      name: calls_handled
      label: Number of Calls Handled
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 31
      name: requests_completed
      label: Number of Requests Completed
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 32
      name: recommendations
      label: Recommendations for Improvement
      hint: Your suggestions
      type: text
      options: []
      required: false
    - id: 33
      name: additional_comments
      label: Additional Comments
      hint: Anything else to note
      type: text
      options: []
      required: false
    - id: 34
      name: report_submitted
      label: Report Submission
      hint: null
      type: select_one
      options:
      - Yes - Submit Report
      - Other
      required: true
