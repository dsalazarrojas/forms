      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: incidents
      label: Incidents
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: supervisor_signature
      label: Supervisor signature
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: supervisor_name
      label: Supervisor name
      hint: null
      type: text
      options: []
      required: true
