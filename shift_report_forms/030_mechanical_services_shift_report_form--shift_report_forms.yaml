      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 13
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Joe
      required: false
    - id: 14
      name: task_complete_status
      label: Task Complete Status
      hint: null
