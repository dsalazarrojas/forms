inputSchema:
  type: object
  properties:
    title: Membership Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Basic
      - Premium
      - Gold
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Credit Card
      - Debit Card
      - PayPal
      required: true
    - id: 8
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: city_state_zip
      label: City, State ZIP
      hint: Please enter your city, state, and ZIP.
      type: text
      options: []
      required: false
    - id: 10
      name: country
      label: Country
      hint: null
      type: select_one
      options:
      - USA
      - Canada
      - Mexico
      required: true
    - id: 11
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: terms_of_service
      label: Terms of Service
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
