inputSchema:
  type: object
  properties:
    title: Art Collective Member Onboarding Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: section_artistic_background
      label: -- Artistic Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: art_discipline
      label: Primary Art Discipline
      hint: null
      type: select_one
      options:
      - Painting
      - Sculpture
      - Photography
      - Digital art
      - Installation
      - Performance
      - Mixed media
      - Other
      required: true
    - id: 8
      name: experience_years
      label: Years of Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: artistic_statement
      label: Brief Artistic Statement or Philosophy
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: portfolio_url
      label: Portfolio Website or Link
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: section_social_media
      label: -- Social Media and Online Presence --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: instagram
      label: Instagram Handle
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: website
      label: Personal Website URL
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: other_social
      label: Other Social Media Platforms
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: section_collective_involvement
      label: -- Collective Involvement --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: membership_type
      label: Desired Membership Type
      hint: null
      type: select_one
      options:
      - Full member
      - Associate member
      - Affiliate member
      - Collaborative member
      required: true
    - id: 17
      name: participation_interest
      label: Areas of Participation Interest
      hint: null
      type: select_multiple
      options:
      - Group exhibitions
      - Community events
      - Workshops and talks
      - Collaborative projects
      - Administrative roles
      - Social media and promotion
      required: true
    - id: 18
      name: availability
      label: Availability for Meetings and Events
      hint: null
      type: select_one
      options:
      - High - very available
      - Medium - regularly available
      - Low - limited availability
      required: true
    - id: 19
      name: section_agreement
      label: -- Agreement and Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: conflict_interest
      label: Any Conflicts of Interest with Collective
      hint: null
      type: select_one
      options:
      - None
      - Yes - describe below
      required: true
    - id: 21
      name: conflict_details
      label: Describe Conflicts if Any
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: member_agreement
      label: I agree to abide by collective bylaws and code of conduct
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 23
      name: additional_info
      label: Additional Information or Questions
      hint: null
      type: text
      options: []
      required: false
