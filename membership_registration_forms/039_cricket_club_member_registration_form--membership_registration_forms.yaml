inputSchema:
  type: object
  properties:
    title: Cricket Club Member Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Cricket Club Member
      - Associate Member
      - Sponsor
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: date_of_registration
      label: Date of Registration
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: membership_start_date
      label: Membership Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: membership_status
      label: Membership Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: payment_method
      label: Payment Method
      hint: null
      type: text
      options: []
      required: false
