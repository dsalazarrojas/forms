inputSchema:
  type: object
  properties:
    title: Booster Club Membership Form
    pages:
    - id: 1
      name: member_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: member_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: member_email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 4
      name: member_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: student_name
      label: Student Name
      hint: Name of student in school
      type: text
      options: []
      required: true
    - id: 6
      name: student_grade
      label: Student Grade
      hint: Current grade level
      type: select_one
      options:
      - 9th grade
      - 10th grade
      - 11th grade
      - 12th grade
      - Not applicable
      required: false
    - id: 7
      name: relationship_to_student
      label: Relationship to Student
      hint: Your relationship
      type: select_one
      options:
      - Parent
      - Guardian
      - Grandparent
      - Relative
      - Friend
      - Interested community member
      required: true
    - id: 8
      name: membership_level
      label: Membership Level
      hint: Select membership type
      type: select_one
      options:
      - Standard member
      - Premium member
      - Sponsor
      - Corporate partner
      - Lifetime member
      required: true
    - id: 9
      name: annual_fee
      label: Annual Membership Fee
      hint: Fee amount if applicable
      type: number
      options: []
      required: false
    - id: 10
      name: committee_interest
      label: Committee or Role Interest
      hint: What would you like to do
      type: select_multiple
      options:
      - Event planning
      - Fundraising
      - Finance
      - Marketing
      - Volunteering
      - Chairing
      - No preference
      required: false
    - id: 11
      name: volunteer_availability
      label: Volunteer Availability
      hint: When can you volunteer
      type: select_multiple
      options:
      - Weekday mornings
      - Weekday evenings
      - Weekends
      - Summer only
      - Throughout school year
      required: false
    - id: 12
      name: skills_experience
      label: Skills or Experience
      hint: What can you contribute
      type: text
      options: []
      required: false
    - id: 13
      name: address
      label: Home Address
      hint: Your address
      type: text
      options: []
      required: true
    - id: 14
      name: waiver_acknowledgement
      label: I Acknowledge the Club Rules
      hint: Accept booster club guidelines
      type: select_one
      options:
      - I accept
      - I need to review
      - I do not accept
      required: true
    - id: 15
      name: membership_date
      label: Membership Start Date
      hint: Date of this application
      type: date
      options: []
      required: true
