      name: new_member_application
      label: New Member Application
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: platform_details
      label: Platform Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: membership_level
      label: Membership Level
      hint: null
