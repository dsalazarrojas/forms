inputSchema:
  type: object
  properties:
    title: Membership Dues Renewal
    pages:
    - id: 1
      name: membership_type
      label: What type of membership do you have?
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Annually
      required: true
    - id: 2
      name: membership_status
      label: What is your current membership status?
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      - Renewing
      required: true
    - id: 3
      name: membership_terms
      label: What are your membership terms?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: true
    - id: 4
      name: membership_dues
      label: What are your current membership dues?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: membership_expiration_date
      label: What is your membership expiration date?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: membership_fee
      label: What is your membership fee?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: membership_renewal_status
      label: What is your membership renewal status?
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Renewing
      required: true
    - id: 8
      name: membership_dues_amount
      label: What is the amount of your membership dues?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: membership_duration
      label: How long have you been a member?
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: membership_fee_2
      label: Membership Fee 2
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: membership_status_2
      label: What is your membership status?
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Renewing
      required: true
    - id: 12
      name: membership_terms_2
      label: Membership Terms 2
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: true
    - id: 13
      name: membership_review
      label: Is this information accurate?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
