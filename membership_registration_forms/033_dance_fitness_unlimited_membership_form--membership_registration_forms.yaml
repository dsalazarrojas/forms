inputSchema:
  type: object
  properties:
    title: Dance Fitness Unlimited Membership Form
    pages:
    - id: 1
      name: plan_selection
      label: Plan Selection
      hint: null
      type: select_one
      options:
      - Dance
      - Fitness
      - Membership
      required: false
    - id: 2
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: membership_plan
      label: Membership Plan
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Stripe
      - Offline
      required: false
    - id: 7
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: e_signature
      label: E-Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: agreement
      label: Agreement
      hint: Check if you agree to terms
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: note
      options: []
      required: false
