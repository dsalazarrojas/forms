      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: user_input_password
      label: Password
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: user_input_password_confirm
      label: Confirm Password
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: user_input_agreement
      label: Agreement
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''I Agree''}'
      - '{''id'': 2, ''label'': ''I Do Not Agree''}'
      required: false
