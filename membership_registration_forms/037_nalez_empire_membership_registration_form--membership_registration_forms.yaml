      - '{''id'': 1, ''label'': ''Monthly''}'
      - '{''id'': 2, ''label'': ''Quarterly''}'
      - '{''id'': 3, ''label'': ''Annually''}'
      required: false
    - id: 5
      name: user_input_date
      label: Membership Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: user_input_time
      label: Membership End Time
      hint: null
