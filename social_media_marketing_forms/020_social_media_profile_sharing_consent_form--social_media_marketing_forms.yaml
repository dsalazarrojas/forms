      name: social_media_profiles
      label: Social media profiles
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: marketing_campaigns
      label: Marketing campaigns
      hint: null
      type: select_one
      options:
      - Facebook
      - Instagram
      - Twitter
      - Other
      required: false
    - id: 3
      name: sharing_consent
      label: Sharing consent
      hint: null
