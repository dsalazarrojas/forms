      name: sharing_details
      label: Sharing details
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: sharing_preferences
      label: Sharing preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned tool
      hint: null
      type: select_one
      options:
      - Chatjimmy
      - Other
      required: false
    - id: 9
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
