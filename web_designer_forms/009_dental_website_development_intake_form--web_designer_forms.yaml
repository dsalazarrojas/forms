inputSchema:
  type: object
  properties:
    title: Dental Website Development Intake Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: project_description
      label: Project Description
      hint: A few details about the project
      type: text
      options: []
      required: false
    - id: 5
      name: budget
      label: Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: deadline
      label: Deadline
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 8
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Chat
      required: true
