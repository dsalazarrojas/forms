inputSchema:
  type: object
  properties:
    title: Cable Hauling Safety Assessment
    pages:
    - id: 1
      name: assessor_name
      label: Assessor name
      hint: Person completing assessment
      type: text
      options: []
      required: true
    - id: 2
      name: assessment_date
      label: Assessment date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 3
      name: site_location
      label: Site location
      hint: Worksite address
      type: text
      options: []
      required: true
    - id: 4
      name: equipment_condition
      label: Equipment condition
      hint: Winches slings and supports
      type: select_one
      options:
      - Satisfactory
      - Requires maintenance
      - Unsatisfactory
      required: true
    - id: 5
      name: environmental_hazards
      label: Environmental hazards present
      hint: Weather terrain or wildlife
      type: text
      options: []
      required: false
    - id: 6
      name: personnel_training_compliance
      label: Personnel training compliance
      hint: All personnel certified for task
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: corrective_measures
      label: Corrective measures required
      hint: Actions to mitigate risks
      type: text
      options: []
      required: false
    - id: 8
      name: follow_up_date
      label: Follow up inspection date
      hint: Schedule for reinspection
      type: date
      options: []
      required: false
