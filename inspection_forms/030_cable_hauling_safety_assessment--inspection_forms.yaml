      - id: 6
        name: personnel_training_compliance
        label: Personnel training compliance
        hint: All personnel certified for task
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 7
        name: corrective_measures
        label: Corrective measures required
        hint: Actions to mitigate risks
        type: text
        options: []
        required: false
      - id: 8
