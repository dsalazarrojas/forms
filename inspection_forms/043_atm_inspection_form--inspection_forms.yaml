inputSchema:
  type: object
  properties:
    title: ATM Inspection Form
    pages:
    - id: 1
      name: inspection_header
      label: ATM Inspection Form
      hint: Complete this form for each ATM inspection
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_name
      label: Inspector Name
      hint: Enter the name of the person conducting the inspection
      type: text
      options: []
      required: true
    - id: 3
      name: inspection_date
      label: Inspection Date
      hint: Enter the date of the inspection
      type: date
      options: []
      required: true
    - id: 4
      name: inspection_time
      label: Inspection Time
      hint: Enter the time the inspection began
      type: time
      options: []
      required: true
    - id: 5
      name: atm_location
      label: ATM Location
      hint: Enter the complete address of the ATM location
      type: text
      options: []
      required: true
    - id: 6
      name: atm_serial_number
      label: ATM Serial Number
      hint: Enter the serial number of the ATM unit
      type: text
      options: []
      required: true
    - id: 7
      name: atm_model
      label: ATM Model
      hint: Enter the model number of the ATM
      type: text
      options: []
      required: true
    - id: 8
      name: atm_condition_exterior
      label: Exterior Condition Assessment
      hint: Rate the overall condition of the ATM exterior
      type: select_one
      options: [Excellent, Good, Fair, Poor, Needs immediate attention]
      required: true
    - id: 9
      name: security_camera_functionality
      label: Security Camera Functionality
      hint: Is the security camera operational
      type: select_one
      options: [Yes, No, Not applicable]
      required: true
    - id: 10
      name: card_reader_condition
      label: Card Reader Condition
      hint: Assess the condition of the card reader slot
      type: select_one
      options: [Good, Damaged, Tampered, Blocked]
      required: true
    - id: 11
      name: keypad_condition
      label: Keypad Condition
      hint: Assess the condition of the keypad
      type: select_one
      options: [Good, Worn, Damaged, Covered device present]
      required: true
    - id: 12
      name: receipt_printer_functionality
      label: Receipt Printer Functionality
      hint: Is the receipt printer working properly
      type: select_one
      options: [Yes, No, Out of paper, Paper jam]
      required: true
    - id: 13
      name: cash_dispenser_condition
      label: Cash Dispenser Condition
      hint: Assess the condition of the cash dispenser
      type: select_one
      options: [Good, Jammed, Damaged, Blocked]
      required: true
    - id: 14
      name: screen_display_condition
      label: Screen Display Condition
      hint: Assess the condition of the screen display
      type: select_one
      options: [Clear and readable, Faded, Damaged, Non-functional]
      required: true
    - id: 15
      name: lighting_adequacy
      label: Adequacy of Lighting Around ATM
      hint: Assess the lighting conditions around the ATM
      type: select_one
      options: [Adequate, Insufficient, Needs improvement, Good]
      required: true
    - id: 16
      name: signage_condition
      label: Condition of Signage
      hint: Assess the condition of any posted signs
      type: select_one
      options: [Good, Missing, Damaged, Needs updating]
      required: true
    - id: 17
      name: surround_area_cleanliness
      label: Cleanliness of Surrounding Area
      hint: Assess the cleanliness of the area around the ATM
      type: select_one
      options: [Clean, Litter present, Graffiti present, Needs cleaning]
      required: true
    - id: 18
      name: suspicious_devices_present
      label: Are There Any Suspicious Devices Attached
      hint: Check for any unauthorized devices attached to the ATM
      type: select_one
      options: [Yes, No, Uncertain]
      required: true
    - id: 19
      name: maintenance_required
      label: Maintenance Required
      hint: Indicate what type of maintenance is needed
      type: select_multiple
      options: [Cleaning, Part replacement, Software update, Security upgrade, Cash refill, No maintenance needed]
      required: true
    - id: 20
      name: inspection_notes
      label: Additional Inspection Notes
      hint: Record any additional observations or concerns
      type: text
      options: []
      required: false
    - id: 21
      name: next_scheduled_inspection
      label: Next Scheduled Inspection Date
      hint: Enter the date for the next scheduled inspection
      type: date
      options: []
      required: false
    - id: 22
      name: supervisor_signature
      label: Supervisor Signature
      hint: Digital signature of the supervising personnel
      type: text
      options: []
      required: true
