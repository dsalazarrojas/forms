inputSchema:
  type: object
  properties:
    title: Product Display Checklist
    pages:
    - id: 1
      name: product_display_checklist
      label: Product Display Checklist
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: merchandiser_location
      label: Merchandiser Location
      hint: null
      type: select_one
      options:
      - Location 1
      - Location 2
      required: false
    - id: 3
      name: product_condition
      label: Product Condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Bad
      - Missing
      required: false
    - id: 4
      name: follow_up
      label: Follow Up
      hint: Follow up required if issues are detected
      type: select_one
      options:
      - 1 day
      - 2 days
      - 3 days
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_completed
      label: Time Completed
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: employee_name
      label: Employee Name
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: location_name
      label: Location Name
      hint: null
      type: text
      options: []
      required: false
