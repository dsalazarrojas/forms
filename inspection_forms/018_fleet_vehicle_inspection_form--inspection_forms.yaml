inputSchema:
  type: object
  properties:
    title: Fleet Vehicle Inspection Form
    pages:
    - id: 1
      name: vehicle_details
      label: Vehicle Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: vehicle_status
      label: Vehicle Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 3
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: inspection_time
      label: Inspection Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: driver_details
      label: Driver Details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: vehicle_condition
      label: Vehicle Condition
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: safety_regulations
      label: Safety Regulations
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: inspection_notes
      label: Inspection Notes
      hint: null
      type: note
      options: []
      required: false
