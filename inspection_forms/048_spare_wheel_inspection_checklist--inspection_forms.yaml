inputSchema:
  type: object
  properties:
    title: Spare Wheel Inspection Checklist
    pages:
    - id: 1
      name: wheel_type
      label: What type of spare wheel is this?
      hint: Please select the type of spare wheel.
      type: select_one
      options:
      - Pneumatic
      - Semi Pneumatic
      - Non Pneumatic
      required: true
    - id: 2
      name: wheel_condition
      label: What is the condition of this wheel?
      hint: Please select the condition.
      type: select_multiple
      options:
      - New
      - Used
      - Worn
      required: true
    - id: 3
      name: wheel_pressure
      label: What is the wheel pressure?
      hint: Please enter the pressure in PSI.
      type: number
      options: []
      required: true
    - id: 4
      name: tire_tread_depth
      label: What is the tire tread depth?
      hint: Please enter the depth in mm.
      type: number
      options: []
      required: true
    - id: 5
      name: vehicle_model_year
      label: What is the vehicle model year?
      hint: Please enter the year.
      type: number
      options: []
      required: true
    - id: 6
      name: vehicle_registration_number
      label: What is the vehicle registration number?
      hint: Please enter the registration number.
      type: text
      options: []
      required: false
    - id: 7
      name: vehicle_color
      label: What is the vehicle color?
      hint: Please select the color.
      type: select_one
      options:
      - Red
      - Blue
      - Green
      required: false
    - id: 8
      name: tire_type
      label: What type of tire is this?
      hint: Please select the type.
      type: select_multiple
      options:
      - Pneumatic
      - Semi Pneumatic
      - Non Pneumatic
      required: true
    - id: 9
      name: spare_wheel_type
      label: Spare Wheel Type
      hint: Please select the type.
      type: select_one
      options:
      - Pneumatic
      - Semi Pneumatic
      - Non Pneumatic
      required: true
    - id: 10
      name: spare_wheel_condition
      label: What is the condition of this spare wheel?
      hint: Please select the condition.
      type: select_multiple
      options:
      - New
      - Used
      - Worn
      required: true
    - id: 11
      name: inspection_date
      label: What is the inspection date?
      hint: Please enter the inspection date.
      type: date
      options: []
      required: true
    - id: 12
      name: inspector_name
      label: What is the inspector's name?
      hint: Please enter the name.
      type: text
      options: []
      required: true
    - id: 13
      name: inspector_signature
      label: Inspector's signature?
      hint: Please sign.
      type: text
      options: []
      required: true
    - id: 14
      name: notes
      label: Additional notes?
      hint: Please enter any additional notes.
      type: note
      options: []
      required: false
    - id: 15
      name: vehicle_model
      label: What is the vehicle model?
      hint: Please enter the model.
      type: text
      options: []
      required: false
    - id: 16
      name: vehicle_year
      label: What is the vehicle year?
      hint: Please enter the year.
      type: number
      options: []
      required: false
    - id: 17
      name: spare_wheel_rim_condition
      label: What is the condition of this spare wheel's rim?
      hint: Please select the condition.
      type: select_multiple
      options:
      - New
      - Used
      - Worn
      required: false
    - id: 18
      name: vehicle_status
      label: What is the vehicle status?
      hint: Please select the status.
      type: select_one
      options:
      - New
      - Used
      - Worn
      required: false
