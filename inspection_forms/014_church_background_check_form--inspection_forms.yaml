inputSchema:
  type: object
  properties:
    title: Church Background Check Form
    pages:
    - id: 1
      name: section_header_applicant_info
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: middle_name
      label: Middle Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_header_address
      label: -- Current and Previous Addresses --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: current_address
      label: Current Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: current_city
      label: Current City
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: current_state
      label: Current State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: current_zip
      label: Current ZIP or Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: years_at_current_address
      label: Years at Current Address
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: previous_address
      label: Previous Address (if lived there for 7+ years)
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: section_header_employment
      label: -- Employment History --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: position_title
      label: Position Title for Which You Are Applying
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: direct_contact_with_children
      label: Will You Have Direct Unsupervised Contact with Children
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: employment_history
      label: List Last Three Employers
      hint: Company name, position, dates, reason for leaving
      type: text
      options: []
      required: true
    - id: 19
      name: gaps_in_employment
      label: Explain Any Employment Gaps
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: section_header_criminal_history
      label: -- Criminal History --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: criminal_conviction
      label: Have You Ever Been Convicted of a Crime
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: conviction_details
      label: Details of Any Criminal Convictions
      hint: Date, nature of offense, jurisdiction, penalty
      type: text
      options: []
      required: false
    - id: 23
      name: section_header_references
      label: -- Professional References --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: reference_1_name
      label: Reference 1 Name
      hint: null
      type: text
      options: []
      required: true
    - id: 25
      name: reference_1_phone
      label: Reference 1 Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 26
      name: reference_1_relationship
      label: Reference 1 Relationship
      hint: Former supervisor, colleague, etc
      type: text
      options: []
      required: false
    - id: 27
      name: reference_2_name
      label: Reference 2 Name
      hint: null
      type: text
      options: []
      required: true
    - id: 28
      name: reference_2_phone
      label: Reference 2 Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 29
      name: section_header_consent
      label: -- Consent and Authorization --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: background_check_consent
      label: I authorize the church to conduct a background check
      hint: Background checks may include criminal records, credit check, reference
        verification
      type: select_one
      options:
      - Yes, I authorize
      - No, I do not authorize
      required: true
    - id: 31
      name: truth_acknowledgment
      label: I certify that all information provided is true and accurate
      hint: null
      type: select_one
      options:
      - Yes, I certify
      - 'No'
      required: true
