inputSchema:
  type: object
  properties:
    title: Aircraft Inspection Checklist
    pages:
    - id: 1
      name: inspector_name
      label: Inspector Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: inspector_id
      label: Inspector ID
      hint: Certificate or badge number
      type: text
      options: []
      required: true
    - id: 3
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 4
      name: inspection_type
      label: Inspection Type
      hint: Type of inspection
      type: select_one
      options:
      - Pre-flight
      - Post-flight
      - Annual
      - 100-hour
      - Progressive
      - Special
      required: true
    - id: 5
      name: aircraft_registration
      label: Aircraft Registration
      hint: Tail number
      type: text
      options: []
      required: true
    - id: 6
      name: aircraft_make
      label: Aircraft Make
      hint: Manufacturer
      type: text
      options: []
      required: true
    - id: 7
      name: aircraft_model
      label: Aircraft Model
      hint: Model
      type: text
      options: []
      required: true
    - id: 8
      name: serial_number
      label: Serial Number
      hint: Aircraft serial
      type: text
      options: []
      required: true
    - id: 9
      name: total_time
      label: Total Time Airframe
      hint: Hours in service
      type: number
      options: []
      required: true
    - id: 10
      name: exterior_condition
      label: Exterior Condition
      hint: Overall exterior assessment
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: fuselage_check
      label: Fuselage Inspection
      hint: Check for damage or corrosion
      type: select_one
      options:
      - Satisfactory
      - Minor issues
      - Major issues
      - Unsatisfactory
      required: true
    - id: 12
      name: wings_check
      label: Wings Inspection
      hint: Check structure and surfaces
      type: select_one
      options:
      - Satisfactory
      - Minor issues
      - Major issues
      - Unsatisfactory
      required: true
    - id: 13
      name: empennage_check
      label: Empennage Inspection
      hint: Check tail surfaces
      type: select_one
      options:
      - Satisfactory
      - Minor issues
      - Major issues
      - Unsatisfactory
      required: true
    - id: 14
      name: landing_gear_check
      label: Landing Gear Inspection
      hint: Check gear and brakes
      type: select_one
      options:
      - Satisfactory
      - Minor issues
      - Major issues
      - Unsatisfactory
      required: true
    - id: 15
      name: tires_condition
      label: Tires Condition
      hint: Tire wear and pressure
      type: select_one
      options:
      - Good
      - Fair
      - Needs replacement
      - Unsatisfactory
      required: true
    - id: 16
      name: brakes_condition
      label: Brakes Condition
      hint: Brake wear and function
      type: select_one
      options:
      - Good
      - Fair
      - Needs adjustment
      - Unsatisfactory
      required: true
    - id: 17
      name: engine_exterior
      label: Engine Exterior
      hint: Check for leaks and damage
      type: select_one
      options:
      - Satisfactory
      - Minor issues
      - Major issues
      - Unsatisfactory
      required: true
    - id: 18
      name: propeller_check
      label: Propeller Inspection
      hint: Check blades and hub
      type: select_one
      options:
      - Satisfactory
      - Minor issues
      - Major issues
      - Unsatisfactory
      - Not applicable
      required: true
    - id: 19
      name: flight_controls_check
      label: Flight Controls Check
      hint: Check all control surfaces
      type: select_one
      options:
      - All functional
      - Minor issues
      - Major issues
      - Unsatisfactory
      required: true
    - id: 20
      name: lights_check
      label: Lights Check
      hint: All lights operational
      type: select_one
      options:
      - All functional
      - Some out
      - Multiple failures
      - Unsatisfactory
      required: true
    - id: 21
      name: pitot_static
      label: Pitot-Static System
      hint: Check ports and covers
      type: select_one
      options:
      - Clear and uncovered
      - Covered, removed
      - Blocked
      - Damaged
      required: true
    - id: 22
      name: fluid_levels
      label: Fluid Levels
      hint: Oil, hydraulic fluid
      type: select_one
      options:
      - All adequate
      - Some low
      - Needs service
      - Unsatisfactory
      required: true
    - id: 23
      name: cockpit_check
      label: Cockpit Inspection
      hint: Instruments and controls
      type: select_one
      options:
      - Satisfactory
      - Minor issues
      - Major issues
      - Unsatisfactory
      required: true
    - id: 24
      name: avionics_check
      label: Avionics Check
      hint: Equipment function
      type: select_one
      options:
      - All functional
      - Some issues
      - Multiple failures
      - Unsatisfactory
      required: true
    - id: 25
      name: emergency_equipment_check
      label: Emergency Equipment
      hint: All equipment present
      type: select_one
      options:
      - All present
      - Some missing
      - Multiple missing
      - Unsatisfactory
      required: true
    - id: 26
      name: documents_check
      label: Required Documents
      hint: ARROW documents on board
      type: select_one
      options:
      - All present
      - Some missing
      - Expired
      - Unsatisfactory
      required: true
    - id: 27
      name: discrepancies
      label: Discrepancies Found
      hint: List all issues
      type: text
      options: []
      required: true
    - id: 28
      name: corrective_action
      label: Corrective Action
      hint: Actions taken or needed
      type: text
      options: []
      required: false
    - id: 29
      name: airworthiness_status
      label: Airworthiness Determination
      hint: Final status
      type: select_one
      options:
      - Airworthy
      - Airworthy with limitations
      - Not airworthy
      required: true
    - id: 30
      name: inspector_signature
      label: Inspector Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 31
      name: approval_status
      label: Inspection Approved
      hint: Is inspection approved
      type: select_one
      options:
      - Approved
      - Pending review
      - Not approved
      required: true
