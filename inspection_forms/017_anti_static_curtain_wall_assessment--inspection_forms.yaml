inputSchema:
  type: object
  properties:
    title: Anti Static Curtain Wall Assessment
    pages:
    - id: 1
      name: inspector_name
      label: Inspector Name
      hint: Name of person conducting assessment
      type: text
      options: []
      required: true
    - id: 2
      name: inspector_certification
      label: Inspector Certification
      hint: Certification or license number
      type: text
      options: []
      required: true
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 4
      name: facility_name
      label: Facility Name
      hint: Name of building or facility
      type: text
      options: []
      required: true
    - id: 5
      name: facility_address
      label: Facility Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: curtain_wall_location
      label: Curtain Wall Location
      hint: Specific area or section
      type: text
      options: []
      required: true
    - id: 7
      name: building_type
      label: Building Type
      hint: Type of structure
      type: select_one
      options:
        - Office building
        - Industrial facility
        - Healthcare facility
        - Laboratory
        - Manufacturing plant
        - Data center
        - Other
      required: true
    - id: 8
      name: curtain_wall_age
      label: Curtain Wall Age
      hint: How old is the installation
      type: select_one
      options:
        - Less than 1 year
        - 1 to 5 years
        - 5 to 10 years
        - 10 to 20 years
        - More than 20 years
      required: true
    - id: 9
      name: manufacturer
      label: Manufacturer
      hint: Brand or manufacturer name
      type: text
      options: []
      required: false
    - id: 10
      name: installation_date
      label: Installation Date
      hint: When was it installed
      type: date
      options: []
      required: false
    - id: 11
      name: visual_inspection_section
      label: -- Visual Inspection --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: surface_condition
      label: Surface Condition
      hint: Overall surface state
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Critical
      required: true
    - id: 13
      name: visible_damage
      label: Visible Damage
      hint: Any observable damage
      type: select_one
      options:
        - None
        - Minor scratches
        - Cracks or chips
        - Significant damage
        - Severe deterioration
      required: true
    - id: 14
      name: sealant_condition
      label: Sealant Condition
      hint: State of seals and gaskets
      type: select_one
      options:
        - Excellent
        - Good
        - Fair - Some wear
        - Poor - Needs replacement
        - Failed
      required: true
    - id: 15
      name: contamination_present
      label: Contamination Present
      hint: Signs of contamination
      type: select_multiple
      options:
        - None
        - Dust accumulation
        - Oil or grease
        - Chemical residue
        - Mold or mildew
        - Corrosion
        - Other
      required: true
    - id: 16
      name: structural_integrity_section
      label: -- Structural Integrity --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: frame_condition
      label: Frame Condition
      hint: Structural frame state
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Compromised
      required: true
    - id: 18
      name: mounting_security
      label: Mounting Security
      hint: How secure is the mounting
      type: select_one
      options:
        - Very secure
        - Secure
        - Slightly loose
        - Loose
        - Unstable
      required: true
    - id: 19
      name: grounding_connection
      label: Grounding Connection
      hint: Is grounding intact
      type: select_one
      options:
        - Properly grounded
        - Grounded but worn
        - Questionable grounding
        - Not grounded
        - Unable to assess
      required: true
    - id: 20
      name: electrical_testing_section
      label: -- Electrical Testing --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: surface_resistance
      label: Surface Resistance Test
      hint: Measured resistance in ohms
      type: text
      options: []
      required: true
    - id: 22
      name: resistance_standard
      label: Meets Resistance Standards
      hint: Within acceptable range
      type: select_one
      options:
        - Yes, within range
        - Borderline
        - No, out of range
        - Not tested
      required: true
    - id: 23
      name: static_decay
      label: Static Decay Test
      hint: Decay time measurement
      type: text
      options: []
      required: false
    - id: 24
      name: environmental_factors_section
      label: -- Environmental Factors --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: temperature
      label: Ambient Temperature
      hint: Temperature during assessment
      type: text
      options: []
      required: false
    - id: 26
      name: humidity
      label: Relative Humidity
      hint: Humidity level
      type: text
      options: []
      required: false
    - id: 27
      name: cleaning_schedule
      label: Cleaning Schedule
      hint: How often is it cleaned
      type: select_one
      options:
        - Daily
        - Weekly
        - Monthly
        - Quarterly
        - Rarely or never
      required: true
    - id: 28
      name: maintenance_history
      label: Maintenance History Available
      hint: Are records maintained
      type: select_one
      options:
        - Yes, complete records
        - Partial records
        - No records
      required: true
    - id: 29
      name: recommendations_section
      label: -- Recommendations --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: overall_rating
      label: Overall Assessment Rating
      hint: Final evaluation
      type: select_one
      options:
        - Pass - No action needed
        - Pass with minor maintenance
        - Conditional pass - Repair needed
        - Fail - Replacement recommended
        - Fail - Immediate action required
      required: true
    - id: 31
      name: corrective_actions
      label: Recommended Corrective Actions
      hint: What needs to be done
      type: text
      options: []
      required: true
    - id: 32
      name: priority_level
      label: Priority Level
      hint: Urgency of repairs
      type: select_one
      options:
        - Low - Routine maintenance
        - Medium - Schedule within 30 days
        - High - Schedule within 7 days
        - Critical - Immediate action
      required: true
    - id: 33
      name: reinspection_date
      label: Recommended Re-inspection Date
      hint: When to reassess
      type: date
      options: []
      required: false
    - id: 34
      name: inspector_signature
      label: Inspector Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 35
      name: facility_representative
      label: Facility Representative
      hint: Name of facility contact
      type: text
      options: []
      required: false
