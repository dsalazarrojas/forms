      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
