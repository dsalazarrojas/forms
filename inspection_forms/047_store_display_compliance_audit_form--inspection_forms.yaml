inputSchema:
  type: object
  properties:
    title: store_display_compliance_audit_form
    pages:
    - id: 1
      name: store_display_compliance_audit
      label: store display compliance audit
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 2
      name: non_compliant_items
      label: non compliant items
      hint: null
      type: select_multiple
      options:
      - Overstocking
      - Underselling
      - Shelf placement incorrect
      - Merchandising not meeting standards
      - Product not displayed correctly
      - Shelf not meeting safety and security standards
      required: false
    - id: 3
      name: merchandising_standards
      label: merchandising standards
      hint: null
      type: select_multiple
      options:
