inputSchema:
  type: object
  properties:
    title: Brake System Inspection Report Form
    pages:
    - id: 1
      name: section_header_report
      label: -- Report Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: report_date
      label: Report Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 3
      name: report_number
      label: Report Number
      hint: Unique report identifier
      type: text
      options: []
      required: false
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: Person conducting inspection
      type: text
      options: []
      required: true
    - id: 5
      name: section_header_vehicle
      label: -- Vehicle Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: vehicle_year
      label: Vehicle Year
      hint: Model year
      type: number
      options: []
      required: true
    - id: 7
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer
      type: text
      options: []
      required: true
    - id: 8
      name: vehicle_model
      label: Vehicle Model
      hint: Model name
      type: text
      options: []
      required: true
    - id: 9
      name: vin
      label: VIN Number
      hint: Vehicle identification
      type: text
      options: []
      required: false
    - id: 10
      name: section_header_findings
      label: -- Inspection Findings --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: brake_type
      label: Brake System Type
      hint: Type of brakes
      type: select_one
      options:
      - Disc brakes all wheels
      - Disc and drum mix
      - Air brakes
      - Hydraulic brakes
      - ABS equipped
      - Other
      required: true
    - id: 12
      name: fluid_condition
      label: Brake Fluid Condition
      hint: Assessment
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      - Contaminated
      - Requires flushing
      required: true
    - id: 13
      name: pad_condition
      label: Brake Pad Condition
      hint: Assessment
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Worn
      - Critical
      required: true
    - id: 14
      name: rotor_condition
      label: Rotor Condition
      hint: Assessment
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Warped
      - Damaged
      required: true
    - id: 15
      name: section_header_issues
      label: -- Issues Identified --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: issues_found
      label: Issues Found
      hint: Describe all problems
      type: text
      options: []
      required: false
    - id: 17
      name: section_header_recommendations
      label: -- Recommendations --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: required_repairs
      label: Required Repairs
      hint: What must be fixed
      type: text
      options: []
      required: false
    - id: 19
      name: recommended_maintenance
      label: Recommended Maintenance
      hint: Suggested preventative care
      type: text
      options: []
      required: false
    - id: 20
      name: section_header_status
      label: -- Inspection Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: inspection_status
      label: Inspection Status
      hint: Final outcome
      type: select_one
      options:
      - Pass
      - Pass with advisories
      - Fail
      - Conditional pass
      - Re-inspection required
      required: true
