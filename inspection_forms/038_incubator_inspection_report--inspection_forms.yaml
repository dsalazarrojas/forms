inputSchema:
  type: object
  properties:
    title: Incubator Inspection Report
    pages:
    - id: 1
      name: incubator_id
      label: incubator_id
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_inspected
      label: date_inspected
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: facility_name
      label: facility_name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: inspector_name
      label: inspector_name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: issues_encountered
      label: issues_encountered
      hint: List issues you have discovered.
      type: select_multiple
      options:
      - No issues encountered during inspection
      - Issue 1 encountered during inspection
      - Issue 2 encountered during inspection
      required: false
    - id: 6
      name: issue_comments
      label: issue_comments
      hint: Please describe the issue(s) you have discovered.
      type: text
      options: []
      required: false
    - id: 7
      name: corrective_actions_taken
      label: corrective_actions_taken
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
