inputSchema:
  type: object
  properties:
    title: Power Line Safety Inspection Form
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: utility_name
      label: utility_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: inspection_location
      label: inspection_location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: inspection_type
      label: inspection_type
      hint: null
      type: select_one
      options:
      - Line Inspection
      - Tower Inspection
      required: false
    - id: 5
      name: safety_hazards
      label: safety_hazards
      hint: List any safety hazards found during the inspection
      type: text
      options: []
      required: false
    - id: 6
      name: compliance_issues
      label: compliance_issues
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: inspection_status
      label: inspection_status
      hint: null
      type: select_one
      options:
      - Complete
      - Not Started
      - Deferred
      required: false
    - id: 9
      name: assigned_to
      label: assigned_to
      hint: null
      type: text
      options: []
      required: false
