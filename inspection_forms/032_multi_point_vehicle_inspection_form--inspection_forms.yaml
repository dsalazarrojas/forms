inputSchema:
  type: object
  properties:
    title: Multi Point Vehicle Inspection Form
    pages:
    - id: 1
      name: vehicle_info
      label: Vehicle Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: exterior_condition
      label: Exterior Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Fair
      - Poor
      - Not Present
      required: false
    - id: 3
      name: interior_condition
      label: Interior Condition
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: engine_condition
      label: Engine Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Fair
      - Poor
      - Not Present
      required: false
    - id: 5
      name: safety_features
      label: Safety Features
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Fair
      - Poor
      - Not Present
      required: false
    - id: 6
      name: vehicle_history
      label: Vehicle History
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: inspector_signature
      label: Inspector Signature
      hint: null
      type: text
      options: []
      required: false
