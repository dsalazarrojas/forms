inputSchema:
  type: object
  properties:
    title: Chimney Verification Form
    pages:
      - id: 1
        name: verifier_name
        label: Verifier Name
        hint: Name of inspector verifying chimney
        type: text
        options: []
        required: true
      - id: 2
        name: verification_date
        label: Verification Date
        hint: Date verification occurred
        type: date
        options: []
        required: true
      - id: 3
        name: site_address
        label: Site Address
        hint: Address of property
        type: text
        options: []
        required: true
      - id: 4
        name: verification_purpose
        label: Purpose of Verification
        hint: e.g., Sale inspection, safety check
        type: text
        options: []
        required: true
      - id: 5
        name: flue_condition
        label: Flue Condition
        hint: Observations about flue condition
        type: select_one
        options:
          - Good
          - Marginal
          - Poor
        required: true
      - id: 6
        name: cap_and_chase
        label: Chimney Cap and Chase Condition
        hint: Note presence and condition
        type: text
        options: []
        required: false
      - id: 7
        name: verification_result
        label: Verification Result
        hint: Final verification outcome
        type: select_one
        options:
          - Verified safe
          - Repairs required
          - Not safe
        required: true
      - id: 8
        name: notes
        label: Notes
        hint: Any additional verification comments
        type: text
        options: []
        required: false
