    - id: 6
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: contact_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: report_details
      label: Report Details
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: report_date
      label: Report Date
      hint: null
      type: date
      options: []
      required: true
