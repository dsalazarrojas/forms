inputSchema:
  type: object
  properties:
    title: Fire Safety Equipment Test Request Form
    pages:
    - id: 1
      name: test_request_id
      label: Test Request ID
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: test_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
