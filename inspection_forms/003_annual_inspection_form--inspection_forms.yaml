inputSchema:
  type: object
  properties:
    title: Annual Inspection Form
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date the inspection was conducted
      type: date
      options: []
      required: true
    - id: 2
      name: property_address
      label: Property Address
      hint: Complete address of the property being inspected
      type: text
      options: []
      required: true
    - id: 3
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - Residential - Single Family
      - Residential - Multi-Family
      - Commercial
      - Industrial
      - Public Building
      - Other
      required: true
    - id: 4
      name: owner_name
      label: Property Owner Name
      hint: Full name of the property owner
      type: text
      options: []
      required: true
    - id: 5
      name: owner_contact
      label: Owner Contact Information
      hint: Phone number or email address
      type: text
      options: []
      required: false
    - id: 6
      name: inspector_name
      label: Inspector Name
      hint: Full name of the building inspector
      type: text
      options: []
      required: true
    - id: 7
      name: inspector_license
      label: Inspector License or Certification Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: building_age
      label: Estimated Building Age
      hint: Years since construction or last major renovation
      type: number
      options: []
      required: false
    - id: 9
      name: square_footage
      label: Building Square Footage
      hint: Total usable square feet
      type: number
      options: []
      required: false
    - id: 10
      name: roof_condition
      label: Roof Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs immediate repair
      required: true
    - id: 11
      name: exterior_walls
      label: Exterior Walls Assessment
      hint: Condition of siding, brick, or cladding
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Deteriorating
      required: true
    - id: 12
      name: foundation_cracks
      label: Foundation Cracks or Issues
      hint: null
      type: select_one
      options:
      - None detected
      - Minor cracks
      - Moderate cracks
      - Significant structural issues
      required: true
    - id: 13
      name: window_door_condition
      label: Windows and Doors Condition
      hint: Functionality and seal integrity
      type: select_one
      options:
      - All in good condition
      - Minor wear
      - Some repairs needed
      - Multiple issues
      required: true
    - id: 14
      name: plumbing_system
      label: Plumbing System Assessment
      hint: Check for leaks and proper function
      type: select_one
      options:
      - Adequate and functional
      - Minor issues noted
      - Repairs needed
      - System failing
      required: true
    - id: 15
      name: electrical_system
      label: Electrical System Inspection
      hint: Wiring, panel, and safety compliance
      type: select_one
      options:
      - Meets current code
      - Acceptable with minor upgrades
      - Upgrades recommended
      - Safety concerns present
      required: true
    - id: 16
      name: hvac_condition
      label: HVAC and Ventilation System
      hint: Heating, cooling, and air quality
      type: select_one
      options:
      - Excellent condition
      - Good working order
      - Repairs recommended
      - Replacement needed
      required: true
    - id: 17
      name: fire_safety
      label: Fire Safety Features Present
      hint: null
      type: select_multiple
      options:
      - Fire extinguishers
      - Emergency exits clearly marked
      - Smoke detectors
      - Sprinkler system
      - Fire suppression system
      - None present
      required: true
    - id: 18
      name: safety_violations
      label: Safety Code Violations Identified
      hint: List any violations found during inspection
      type: text
      options: []
      required: false
    - id: 19
      name: accessibility_compliance
      label: ADA Accessibility Compliance
      hint: null
      type: select_one
      options:
      - Compliant
      - Mostly compliant with minor issues
      - Non-compliant - upgrades required
      - Not applicable
      required: false
    - id: 20
      name: overall_condition_rating
      label: Overall Property Condition Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Critical - Immediate attention required
      required: true
    - id: 21
      name: follow_up_actions
      label: Required Follow-Up Actions
      hint: Specific items that need attention
      type: text
      options: []
      required: false
    - id: 22
      name: next_inspection_date
      label: Date of Next Scheduled Inspection
      hint: When should the property be inspected again
      type: date
      options: []
      required: true
