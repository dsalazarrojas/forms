inputSchema:
  type: object
  properties:
    title: Sprinkler System Inspection Form
    pages:
    - id: 1
      name: inspection_form
      label: Inspection Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: system_condition
      label: system_condition
      hint: null
      type: select_one
      options:
      - '{''Water Pressure'': ''High''}'
      - '{''Water Pressure'': ''Medium''}'
      - '{''Water Pressure'': ''Low''}'
      - '{''Water Pressure'': ''None''}'
      - '{''Water Leaks'': True}'
      - '{''Water Leaks'': False}'
      - '{''System Leaks'': True}'
      - '{''System Leaks'': False}'
      required: false
    - id: 3
      name: safety_standard_compliance
      label: safety_standard_compliance
      hint: null
      type: select_one
      options:
      - '{''Safety Standard 1'': True}'
      - '{''Safety Standard 1'': False}'
      - '{''Safety Standard 2'': True}'
      - '{''Safety Standard 2'': False}'
      required: false
    - id: 4
      name: system_component_status
      label: system_component_status
      hint: null
      type: select_multiple
      options:
      - '{''Valve 1'': True}'
      - '{''Valve 1'': False}'
      - '{''Valve 2'': True}'
      - '{''Valve 2'': False}'
      - '{''Pump 1'': True}'
      - '{''Pump 1'': False}'
      - '{''Pump 2'': True}'
      - '{''Pump 2'': False}'
      required: false
    - id: 5
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: assigned_inspector
      label: assigned_inspector
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: assigned_inspector_phone
      label: assigned_inspector_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_inspector_email
      label: assigned_inspector_email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: inspection_date
      label: inspection_date
      hint: null
      type: date
      options: []
      required: false
