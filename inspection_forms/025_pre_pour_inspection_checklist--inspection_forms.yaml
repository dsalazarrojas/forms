inputSchema:
  type: object
  properties:
    title: Pre Pour Inspection Checklist
    pages:
    - id: 1
      name: foundation_quality
      label: Foundation Quality
      hint: null
      type: select_one
      options:
      - very satisfactory
      - satisfactory
      - not satisfactory
      - not acceptable
      required: true
    - id: 2
      name: concrete_compatibility
      label: Concrete Compatibility
      hint: null
      type: select_one
      options:
      - suitable
      - not suitable
      - unknown
      required: true
    - id: 3
      name: concrete_finish
      label: Concrete Finish
      hint: null
      type: select_one
      options:
      - smooth
      - rough
      - not applicable
      required: true
    - id: 4
      name: surface_quality
      label: Surface Quality
      hint: null
      type: select_one
      options:
      - free from defects
      - not free from defects
      - not applicable
      required: true
    - id: 5
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: inspection_time
      label: Inspection Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: pour_depth
      label: Pour Depth
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assignee
      label: Assignee
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: category
      label: Category
      hint: null
      type: text
      options: []
      required: true
