inputSchema:
  type: object
  properties:
    title: SWPPP Inspection
    pages:
    - id: 1
      name: site_location
      label: Site Location
      hint: A brief description of the site location.
      type: text
      options: []
      required: true
    - id: 2
      name: swppp_runoff_source
      label: Stormwater Runoff Source
      hint: Is stormwater runoff an issue at this site?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: swppp_compliance_frequency
      label: Compliance Frequency
      hint: How often is the SWPPP inspected?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Semi-Annually
      - Annually
      required: true
    - id: 4
      name: swppp_responsible_party
      label: Responsible Party
      hint: Who is responsible for SWPPP at this site?
      type: select_one
      options:
      - Owner
      - Operator
      - Other
      required: true
    - id: 5
      name: comments
      label: Comments
      hint: Additional comments or notes.
      type: text
      options: []
      required: false
    - id: 6
      name: swppp_inspection_date
      label: Inspection Date
      hint: Date of last inspection.
      type: date
      options: []
      required: true
    - id: 7
      name: swppp_inspection_status
      label: Inspection Status
      hint: Is the inspection active or inactive?
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: true
    - id: 8
      name: swppp_inspection_last_updated
      label: Last Updated
      hint: Date of last update.
      type: date
      options: []
      required: true
    - id: 9
      name: swppp_inspection_next_due_date
      label: Next Due Date
      hint: Date of next due inspection.
      type: date
      options: []
      required: true
    - id: 10
      name: swppp_inspection_last_inspection_date
      label: Last Inspection Date
      hint: Date of last inspection.
      type: date
      options: []
      required: true
    - id: 11
      name: swppp_inspection_last_inspector
      label: Last Inspector
      hint: Name of last inspector.
      type: text
      options: []
      required: true
    - id: 12
      name: swppp_inspection_last_inspector_signature
      label: Last Inspector Signature
      hint: Last inspector's signature.
      type: text
      options: []
      required: true
    - id: 13
      name: swppp_inspection_last_inspection_cost
      label: Last Inspection Cost
      hint: Cost of last inspection.
      type: number
      options: []
      required: true
    - id: 14
      name: swppp_inspection_last_inspection_cost_currency
      label: Last Inspection Cost Currency
      hint: Currency of last inspection cost.
      type: select_one
      options:
      - USD
      - EUR
      - Other
      required: true
    - id: 15
      name: swppp_inspection_last_inspection_cost_amount
      label: Last Inspection Cost Amount
      hint: Amount of last inspection cost.
      type: number
      options: []
      required: true
    - id: 16
      name: swppp_inspection_last_inspector_notes
      label: Last Inspector Notes
      hint: Notes from last inspector.
      type: text
      options: []
      required: true
    - id: 17
      name: swppp_inspection_last_inspector_signature_2
      label: Swppp Inspection Last Inspector Signature 2
      hint: Last inspector's signature.
      type: text
      options: []
      required: true
    - id: 18
      name: swppp_inspection_last_inspector_signature_2_2
      label: Swppp Inspection Last Inspector Signature 2 2
      hint: Last inspector's signature.
      type: text
      options: []
      required: false
