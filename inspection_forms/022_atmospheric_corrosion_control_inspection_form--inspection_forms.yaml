inputSchema:
  type: object
  properties:
    title: Atmospheric Corrosion Control Inspection Form
    pages:
    - id: 1
      name: inspection_details
      label: -- Inspection Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Inspection Time
      hint: Time inspection was conducted
      type: time
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: Name of person conducting inspection
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_id
      label: Inspector ID
      hint: Employee or certification ID
      type: text
      options: []
      required: false
    - id: 6
      name: equipment_location
      label: -- Equipment Location --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: facility_name
      label: Facility Name
      hint: Name of facility where equipment is located
      type: text
      options: []
      required: true
    - id: 8
      name: facility_address
      label: Facility Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: building_area
      label: Building/Area
      hint: Specific building or area within facility
      type: text
      options: []
      required: true
    - id: 10
      name: equipment_identification
      label: -- Equipment Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: equipment_type
      label: Equipment Type
      hint: Type of equipment being inspected
      type: select_one
      options:
      - Metal Structures
      - Machinery
      - Pipelines
      - Electrical Equipment
      - Storage Tanks
      - HVAC Systems
      - Other
      required: true
    - id: 12
      name: equipment_id_number
      label: Equipment ID/Serial Number
      hint: Unique identifier for equipment
      type: text
      options: []
      required: true
    - id: 13
      name: equipment_age
      label: Equipment Age/Installation Date
      hint: When was equipment installed?
      type: date
      options: []
      required: false
    - id: 14
      name: environment_conditions
      label: -- Environmental Conditions --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: temperature
      label: Temperature
      hint: Current temperature in Fahrenheit or Celsius
      type: number
      options: []
      required: false
    - id: 16
      name: humidity_level
      label: Humidity Level
      hint: Percentage relative humidity
      type: number
      options: []
      required: false
    - id: 17
      name: atmospheric_conditions
      label: Atmospheric Conditions
      hint: Current weather or environmental state
      type: select_one
      options:
      - Dry
      - Moist
      - Wet
      - Salt Spray
      - Industrial Pollution
      - Other
      required: true
    - id: 18
      name: corrosion_assessment
      label: -- Corrosion Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: visible_corrosion
      label: Visible Corrosion Present?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: corrosion_severity
      label: Corrosion Severity Level
      hint: If yes, rate the severity
      type: select_one
      options:
      - None
      - Minor
      - Moderate
      - Severe
      - Critical
      required: true
    - id: 21
      name: corrosion_location
      label: Corrosion Location
      hint: Where on equipment is corrosion observed?
      type: text
      options: []
      required: false
    - id: 22
      name: coating_condition
      label: Protective Coating Condition
      hint: Condition of protective coatings
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Deteriorated
      required: true
    - id: 23
      name: maintenance_recommendations
      label: -- Maintenance Recommendations --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: immediate_action_required
      label: Immediate Action Required?
      hint: Is urgent maintenance needed?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: maintenance_recommendations_text
      label: Recommended Maintenance Actions
      hint: Describe recommended maintenance or repairs
      type: text
      options: []
      required: false
