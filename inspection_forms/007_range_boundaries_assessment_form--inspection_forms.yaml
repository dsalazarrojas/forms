      label: latitude
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: longitude
      label: longitude
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: elevation
      label: elevation
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: user_id
      label: User Id
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
