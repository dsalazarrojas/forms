inputSchema:
  type: object
  properties:
    title: Construction Service Inspection Report Form
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date of service inspection
      type: date
      options: []
      required: true
    - id: 2
      name: inspection_time
      label: Inspection Time
      hint: Time inspection started
      type: time
      options: []
      required: true
    - id: 3
      name: inspector_name
      label: Inspector Name
      hint: Name of inspector
      type: text
      options: []
      required: true
    - id: 4
      name: inspector_company
      label: Inspector Company
      hint: Inspection company or department
      type: text
      options: []
      required: true
    - id: 5
      name: project_name
      label: Project Name
      hint: Name of construction project
      type: text
      options: []
      required: true
    - id: 6
      name: project_address
      label: Project Address
      hint: Site location
      type: text
      options: []
      required: true
    - id: 7
      name: service_type
      label: Service Type Being Inspected
      hint: Type of construction service
      type: select_one
      options:
      - Electrical Installation
      - Plumbing Installation
      - HVAC Installation
      - Fire Suppression System
      - Elevator Installation
      - Structural Work
      - Foundation Work
      - Roofing
      - Waterproofing
      - Insulation
      - Other
      required: true
    - id: 8
      name: contractor_name
      label: Contractor Name
      hint: Company performing the service
      type: text
      options: []
      required: true
    - id: 9
      name: permit_number
      label: Permit Number
      hint: Associated permit
      type: text
      options: []
      required: false
    - id: 10
      name: installation_complete
      label: Installation Complete
      hint: Is the service installation finished
      type: select_one
      options:
      - Yes, 100 Percent
      - Yes, Substantially
      - Partially
      - No, Just Started
      required: true
    - id: 11
      name: work_quality
      label: Work Quality
      hint: Rate the quality of work
      type: select_one
      options:
      - Excellent
      - Good
      - Acceptable
      - Below Standard
      - Poor
      required: true
    - id: 12
      name: code_compliance
      label: Code Compliance
      hint: Does work meet applicable codes
      type: select_one
      options:
      - Fully Compliant
      - Compliant with Minor Issues
      - Partially Compliant
      - Non-Compliant
      required: true
    - id: 13
      name: manufacturer_specifications
      label: Manufacturer Specifications Followed
      hint: Was equipment installed per specs
      type: select_one
      options:
      - Yes, Completely
      - Yes, Mostly
      - Partially
      - 'False'
      required: true
    - id: 14
      name: materials_used
      label: Materials Used
      hint: Were approved materials used
      type: select_one
      options:
      - Yes, All Approved
      - Yes, Most Approved
      - Some Unapproved
      - 'False'
      required: true
    - id: 15
      name: testing_performed
      label: Testing Performed
      hint: Was required testing done
      type: select_one
      options:
      - Yes, All Tests Passed
      - Yes, Some Tests Pending
      - Testing In Progress
      - No Testing Yet
      required: true
    - id: 16
      name: test_results
      label: Test Results
      hint: Describe test outcomes
      type: text
      options: []
      required: false
    - id: 17
      name: deficiencies_found
      label: Deficiencies Found
      hint: Number of issues identified
      type: number
      options: []
      required: true
    - id: 18
      name: deficiency_description
      label: Deficiency Description
      hint: Describe each deficiency
      type: text
      options: []
      required: false
    - id: 19
      name: safety_violations
      label: Safety Violations
      hint: Any safety issues observed
      type: text
      options: []
      required: false
    - id: 20
      name: corrective_actions
      label: Corrective Actions Required
      hint: What must be corrected
      type: text
      options: []
      required: true
    - id: 21
      name: reinspection_required
      label: Reinspection Required
      hint: Is follow-up needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: reinspection_date
      label: Reinspection Date
      hint: Scheduled date if applicable
      type: date
      options: []
      required: false
    - id: 23
      name: inspection_result
      label: Inspection Result
      hint: Final determination
      type: select_one
      options:
      - Approved
      - Approved with Conditions
      - Conditional Approval
      - Failed
      - Incomplete
      required: true
    - id: 24
      name: photos_documentation
      label: Photos Taken
      hint: Were photos documented
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 25
      name: inspector_comments
      label: Inspector Comments
      hint: Additional notes
      type: text
      options: []
      required: false
    - id: 26
      name: inspector_signature
      label: Inspector Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 27
      name: contractor_signature
      label: Contractor Signature
      hint: Type full name as signature
      type: text
      options: []
      required: false
