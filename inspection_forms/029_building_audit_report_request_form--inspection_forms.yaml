inputSchema:
  type: object
  properties:
    title: Building Audit Report Request Form
    pages:
    - id: 1
      name: requestor_name
      label: Requestor Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Company or organization
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: Date of request
      type: date
      options: []
      required: true
    - id: 7
      name: building_name
      label: Building Name
      hint: Name of building
      type: text
      options: []
      required: true
    - id: 8
      name: building_address
      label: Building Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 9
      name: building_type
      label: Building Type
      hint: Classification
      type: select_one
      options:
      - Office Building
      - Residential Complex
      - Retail Center
      - Industrial Facility
      - Healthcare Facility
      - Educational Institution
      - Government Building
      - Mixed Use
      required: true
    - id: 10
      name: year_built
      label: Year Built
      hint: Construction year
      type: number
      options: []
      required: false
    - id: 11
      name: total_square_footage
      label: Total Square Footage
      hint: Building size
      type: number
      options: []
      required: true
    - id: 12
      name: number_of_floors
      label: Number of Floors
      hint: Total floors
      type: number
      options: []
      required: true
    - id: 13
      name: audit_type
      label: Audit Type
      hint: Type of audit needed
      type: select_one
      options:
      - Energy Audit
      - Structural Audit
      - Safety Audit
      - Compliance Audit
      - Comprehensive Audit
      - Pre-Purchase Audit
      - Post-Event Audit
      - Routine Inspection
      required: true
    - id: 14
      name: audit_scope
      label: Audit Scope
      hint: Areas to be audited
      type: select_multiple
      options:
      - Building Envelope
      - HVAC Systems
      - Electrical Systems
      - Plumbing Systems
      - Fire Safety Systems
      - Structural Components
      - Accessibility Features
      - Interior Spaces
      - Exterior Grounds
      - All Areas
      required: true
    - id: 15
      name: reason_for_audit
      label: Reason for Audit
      hint: Why is this needed
      type: select_one
      options:
      - Regulatory Requirement
      - Property Transaction
      - Insurance Requirement
      - Performance Issues
      - Age of Building
      - Tenant Complaints
      - Preventive Maintenance
      - Other
      required: true
    - id: 16
      name: specific_concerns
      label: Specific Concerns
      hint: Any particular issues
      type: text
      options: []
      required: false
    - id: 17
      name: preferred_date
      label: Preferred Audit Date
      hint: When to schedule
      type: date
      options: []
      required: false
    - id: 18
      name: access_availability
      label: Access Availability
      hint: When is building accessible
      type: text
      options: []
      required: true
    - id: 19
      name: key_contact_onsite
      label: On-site Key Contact
      hint: Who will be available
      type: text
      options: []
      required: true
    - id: 20
      name: key_contact_phone
      label: Key Contact Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 21
      name: previous_audits
      label: Previous Audits
      hint: Have you had audits before
      type: select_one
      options:
      - Yes - Within 1 Year
      - Yes - 1-3 Years Ago
      - Yes - Over 3 Years Ago
      - No - Never
      required: true
    - id: 22
      name: documentation_available
      label: Documentation Available
      hint: What documents are available
      type: select_multiple
      options:
      - Building Plans
      - Maintenance Records
      - Previous Audit Reports
      - Energy Bills
      - Equipment Manuals
      - Warranty Documents
      - None Available
      required: true
    - id: 23
      name: report_format
      label: Report Format
      hint: Preferred format
      type: select_one
      options:
      - Digital PDF
      - Printed Report
      - Both Digital and Printed
      - Executive Summary Only
      - Detailed Technical Report
      required: true
    - id: 24
      name: turnaround_time
      label: Turnaround Time
      hint: When do you need the report
      type: select_one
      options:
      - Standard - 2 Weeks
      - Expedited - 1 Week
      - Rush - 3 Days
      - Flexible
      required: true
    - id: 25
      name: budget_range
      label: Budget Range
      hint: Estimated budget
      type: select_one
      options:
      - Under $2,000
      - $2,000 - $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - Over $25,000
      required: false
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
