inputSchema:
  type: object
  properties:
    title: Fire Alarm Inspection Checklist Form
    pages:
    - id: 1
      name: fire_alarm_inspection_status
      label: Check Fire Alarm Connection Status
      hint: Check if the fire alarm connection is working or not working
      type: select_one
      options:
      - Working
      - Not Working
      required: true
    - id: 2
      name: fire_alarm_sensors_status
      label: Check Fire Alarm Sensors Status
      hint: Inspect the status of fire alarm sensors
      type: select_multiple
      options:
      - Working
      - Not Working
      - Unknown
      required: true
    - id: 3
      name: fire_alarm_controllers_status
      label: Check Fire Alarm Controllers Status
      hint: Inspect the status of fire alarm controllers
      type: select_one
      options:
      - Working
      - Not Working
      - Unknown
      required: true
    - id: 4
      name: fire_alarm_panels_status
      label: Check Fire Alarm Panels Status
      hint: Inspect the status of fire alarm panels
      type: select_one
      options:
      - Working
      - Not Working
      - Unknown
      required: true
    - id: 5
      name: fire_alarm_controllers_panel_connection_status
      label: Check Fire Alarm Controllers and Panels Connection Status
      hint: Inspect the connection status of fire alarm controllers and panels
      type: select_one
      options:
      - Working
      - Not Working
      - Unknown
      required: true
    - id: 6
      name: fire_alarm_wiring_status
      label: Check Fire Alarm Wiring Status
      hint: Inspect the status of fire alarm wiring
      type: select_multiple
      options:
      - Working
      - Not Working
      - Unknown
      required: true
    - id: 7
      name: fire_alarm_maintenance_status
      label: Check Fire Alarm Maintenance Status
      hint: Check the fire alarm maintenance status
      type: select_one
      options:
      - Working
      - Not Working
      - Unknown
      required: true
    - id: 8
      name: fire_alarm_testing_status
      label: Check Fire Alarm Testing Status
      hint: Check the fire alarm testing status
      type: select_one
      options:
      - Completed
      - In Progress
      - Not Tested
      required: true
    - id: 9
      name: fire_alarm_standards_compliance_status
      label: Check Fire Alarm Standards Compliance Status
      hint: Check the fire alarm standards compliance status
      type: select_one
      options:
      - Complete
      - Partial
      - Not Compliant
      required: true
    - id: 10
      name: fire_alarm_inspection_frequency
      label: Check Fire Alarm Inspection Frequency
      hint: Check the fire alarm system inspection frequency
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Semi-Annually
      required: true
    - id: 11
      name: fire_alarm_system_inspection_last_date
      label: Check Fire Alarm System Last Inspection Date
      hint: Check the last fire alarm system inspection date
      type: date
      options: []
      required: true
    - id: 12
      name: fire_alarm_system_inspection_next_date
      label: Check Fire Alarm System Next Inspection Date
      hint: Check the next fire alarm system inspection date
      type: date
      options: []
      required: true
    - id: 13
      name: fire_alarm_system_inspection_duration
      label: Check Fire Alarm System Inspection Duration
      hint: Check the fire alarm system inspection duration
      type: time
      options: []
      required: true
    - id: 14
      name: fire_alarm_system_inspection_remark
      label: Fire Alarm System Inspection Remark
      hint: Enter any remark about the inspection
      type: text
      options: []
      required: true
    - id: 15
      name: fire_alarm_system_inspection_signature
      label: Fire Alarm System Inspection Signature
      hint: Enter your name as the inspector
      type: text
      options: []
      required: true
    - id: 16
      name: fire_alarm_system_inspection_signature_date
      label: Fire Alarm System Inspection Signature Date
      hint: Enter the signature date
      type: date
      options: []
      required: true
    - id: 17
      name: fire_alarm_system_inspection_signature_time
      label: Fire Alarm System Inspection Signature Time
      hint: Enter the signature time
      type: time
      options: []
      required: true
