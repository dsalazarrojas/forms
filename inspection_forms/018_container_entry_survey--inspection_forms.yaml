inputSchema:
  type: object
  properties:
    title: Container Entry Survey
    pages:
    - id: 1
      name: section_inspector_info
      label: -- Inspector Details --
      hint: Please provide your information below.
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_name
      label: Inspector Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: inspector_id
      label: Inspector Identification Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: inspection_time
      label: Inspection Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: section_container_info
      label: -- Container Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: container_id
      label: Container Identification Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: container_type
      label: Container Type
      hint: null
      type: select_one
      options:
      - Standard (20ft)
      - Standard (40ft)
      - High Cube (40ft)
      - Refrigerator (40ft)
      - Open Top
      - Other
      required: true
    - id: 9
      name: section_inspection_results
      label: -- Inspection Results --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: container_condition
      label: Overall Container Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Damaged
      required: true
    - id: 11
      name: seal_integrity
      label: Seal Integrity?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: damage_details
      label: Damage Details (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: cleanliness_rating
      label: Cleanliness Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Dirty
      required: true
    - id: 14
      name: section_confirmation
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: inspection_completed
      label: Inspection Completed?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: additional_comments
      label: Any additional details or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: signature_confirmation
      label: I confirm that the information provided is accurate
      hint: null
      type: select_one
      options:
      - I Agree
      - I Disagree
      required: true
