      - id: 12
        name: damage_details
        label: Damage Details (if applicable)
        hint: null
        type: text
        options: []
        required: false
      - id: 13
        name: cleanliness_rating
        label: Cleanliness Rating
        hint: null
        type: select_one
        options: [Excellent, Good, Fair, Poor, Dirty]
        required: true
      - id: 14
        name: section_confirmation
        label: -- Confirmation --
        hint: null
        type: note
        options: []
        required: false
      - id: 15
        name: inspection_completed
        label: Inspection Completed?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 16
