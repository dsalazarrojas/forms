inputSchema:
  type: object
  properties:
    title: Container Entry Survey
    pages:
      - id: 1
        name: section_inspector_info
        label: -- Inspector Details --
        hint: Please provide your information below.
        type: note
        options: []
        required: false
      - id: 2
        name: inspector_name
        label: Inspector Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: inspector_id
        label: Inspector Identification Number
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: inspection_date
        label: Inspection Date
        hint: null
        type: date
        options: []
        required: true
      - id: 5
        name: inspection_time
        label: Inspection Time
        hint: null
        type: time
        options: []
        required: true
      - id: 6
        name: section_container_info
        label: -- Container Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: container_id
        label: Container Identification Number
        hint: null
        type: text
        options: []
        required: true
      - id: 8
        name: container_type
        label: Container Type
        hint: null
        type: select_one
        options: [Standard (20ft), Standard (40ft), High Cube (40ft), Refrigerator (40ft), Open Top, Other]
        required: true
      - id: 9
        name: section_inspection_results
        label: -- Inspection Results --
        hint: null
        type: note
        options: []
        required: false
