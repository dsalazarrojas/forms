inputSchema:
  type: object
  properties:
    title: Energy Leak Assessment Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: leak_location
      label: leak_location
      hint: Where is the leak located?
      type: text
      options: []
      required: false
    - id: 3
      name: leak_description
      label: leak_description
      hint: Provide a detailed description of the leak.
      type: text
      options: []
      required: false
    - id: 4
      name: leak_photo
      label: leak_photo
      hint: Upload a photo of the leak.
      type: text
      options: []
      required: false
    - id: 5
      name: leak_category
      label: leak_category
      hint: What type of leak is it?
      type: select_one
      options:
      - Insulation
      - Electrical
      - HVAC
      - Plumbing
      - Other
      required: false
    - id: 6
      name: leak_severity
      label: leak_severity
      hint: How severe is the leak?
      type: select_one
      options:
      - Low
      - Moderate
      - Severe
      required: false
    - id: 7
      name: leak_recommendation
      label: leak_recommendation
      hint: What is your recommendation for this leak?
      type: text
      options: []
      required: false
    - id: 8
      name: inspector_comments
      label: inspector_comments
      hint: Any other comments for the inspector?
      type: note
      options: []
      required: false
