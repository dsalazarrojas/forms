      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 2
      name: property_features
      label: Property Features
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: property_damage
      label: Property Damage
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: inspection_time
      label: Inspection Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: inspection_status
      label: Inspection Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
