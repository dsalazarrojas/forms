inputSchema:
  type: object
  properties:
    title: Playground Equipment Inspection Form
    pages:
    - id: 1
      name: equipment_condition
      label: Equipment Condition
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: inspected_by
      label: Inspected By
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: equipment_type
      label: Equipment Type
      hint: null
      type: select_one
      options:
      - Playground Equipment
      - Playhouse
      - Swing Set
      - See-Saw
      required: true
    - id: 8
      name: equipment_count
      label: Equipment Count
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: inspection_frequency
      label: Inspection Frequency
      hint: null
      type: select_one
      options:
      - Every 30 days
      - Every 60 days
      - Every 90 days
      required: true
    - id: 10
      name: inspection_status
      label: Inspection Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Unknown
      required: true
    - id: 11
      name: safety_hazards_found
      label: Safety Hazards Found
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: comments_2
      label: Comments
      hint: null
      type: text
      options: []
      required: false
