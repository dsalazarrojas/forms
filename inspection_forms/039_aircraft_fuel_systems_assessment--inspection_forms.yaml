inputSchema:
  type: object
  properties:
    title: Aircraft Fuel Systems Assessment
    pages:
    - id: 1
      name: inspector_name
      label: Inspector Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: inspector_certificate
      label: Inspector Certificate
      hint: A&P or relevant certification
      type: text
      options: []
      required: true
    - id: 3
      name: assessment_date
      label: Assessment Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 4
      name: aircraft_registration
      label: Aircraft Registration
      hint: Tail number
      type: text
      options: []
      required: true
    - id: 5
      name: aircraft_make
      label: Aircraft Make
      hint: Manufacturer
      type: text
      options: []
      required: true
    - id: 6
      name: aircraft_model
      label: Aircraft Model
      hint: Model
      type: text
      options: []
      required: true
    - id: 7
      name: total_airframe_hours
      label: Total Airframe Hours
      hint: Total time
      type: number
      options: []
      required: true
    - id: 8
      name: fuel_tank_type
      label: Fuel Tank Type
      hint: Tank configuration
      type: select_one
      options:
      - Integral wing tanks
      - Bladder tanks
      - Rigid removable tanks
      - Multiple types
      required: true
    - id: 9
      name: tank_capacity
      label: Total Fuel Capacity (gallons)
      hint: Total usable capacity
      type: number
      options: []
      required: true
    - id: 10
      name: number_of_tanks
      label: Number of Fuel Tanks
      hint: Total tanks
      type: number
      options: []
      required: true
    - id: 11
      name: left_tank_condition
      label: Left Tank Condition
      hint: Visual inspection result
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Requires repair
      required: true
    - id: 12
      name: right_tank_condition
      label: Right Tank Condition
      hint: Visual inspection result
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Requires repair
      required: true
    - id: 13
      name: center_tank_condition
      label: Center Tank Condition
      hint: Visual inspection result
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not applicable
      - Requires repair
      required: false
    - id: 14
      name: fuel_contamination
      label: Fuel Contamination Check
      hint: Water or debris present
      type: select_one
      options:
      - No contamination
      - Minor water
      - Debris present
      - Significant contamination
      required: true
    - id: 15
      name: fuel_sample_locations
      label: Fuel Sample Locations
      hint: Where samples taken
      type: select_multiple
      options:
      - Left main tank
      - Right main tank
      - Center tank
      - Left strainer
      - Right strainer
      - Fuel selector
      - Engine inlet
      required: true
    - id: 16
      name: fuel_cap_condition
      label: Fuel Cap Condition
      hint: Caps and seals
      type: select_one
      options:
      - All good
      - Some wear
      - Seals need replacement
      - Caps damaged
      required: true
    - id: 17
      name: fuel_vents
      label: Fuel Vents
      hint: Vent condition
      type: select_one
      options:
      - Clear and functional
      - Partially blocked
      - Blocked
      - Damaged
      required: true
    - id: 18
      name: fuel_lines
      label: Fuel Lines
      hint: Line condition
      type: select_one
      options:
      - All good
      - Minor wear
      - Cracking observed
      - Leaks detected
      required: true
    - id: 19
      name: fuel_selector_valve
      label: Fuel Selector Valve
      hint: Operation check
      type: select_one
      options:
      - Smooth operation
      - Stiff operation
      - Leaks observed
      - Requires repair
      required: true
    - id: 20
      name: fuel_strainer
      label: Fuel Strainer
      hint: Condition and cleanliness
      type: select_one
      options:
      - Clean and functional
      - Minor debris
      - Needs cleaning
      - Damaged
      required: true
    - id: 21
      name: fuel_pump_operation
      label: Fuel Pump Operation
      hint: Electric and engine-driven
      type: select_one
      options:
      - All pumps functional
      - Some issues
      - Pump failure
      - Not applicable
      required: true
    - id: 22
      name: fuel_pressure
      label: Fuel Pressure (PSI)
      hint: Operating pressure
      type: number
      options: []
      required: true
    - id: 23
      name: fuel_flow_rate
      label: Fuel Flow Rate (GPH)
      hint: Flow at cruise
      type: number
      options: []
      required: false
    - id: 24
      name: fuel_gauge_accuracy
      label: Fuel Gauge Accuracy
      hint: Gauge calibration
      type: select_one
      options:
      - Accurate
      - Slight variance
      - Significant error
      - Not functional
      required: true
    - id: 25
      name: fuel_quantity_indication
      label: Fuel Quantity Indication
      hint: Reading vs actual
      type: text
      options: []
      required: false
    - id: 26
      name: leak_check
      label: Leak Check
      hint: Any leaks found
      type: select_one
      options:
      - No leaks
      - Minor seepage
      - Active leaks
      - Major leaks
      required: true
    - id: 27
      name: leak_locations
      label: Leak Locations
      hint: Where leaks found
      type: text
      options: []
      required: false
    - id: 28
      name: vent_system
      label: Vent System
      hint: Breather tube condition
      type: select_one
      options:
      - Clear
      - Partially blocked
      - Blocked
      - Damaged
      required: true
    - id: 29
      name: fuel_heater
      label: Fuel Heater
      hint: If equipped
      type: select_one
      options:
      - Functional
      - Not functional
      - Not equipped
      required: true
    - id: 30
      name: crossfeed_system
      label: Crossfeed System
      hint: If equipped
      type: select_one
      options:
      - Functional
      - Not functional
      - Not equipped
      required: true
    - id: 31
      name: discrepancies_found
      label: Discrepancies Found
      hint: List all issues
      type: text
      options: []
      required: true
    - id: 32
      name: corrective_action
      label: Corrective Action Required
      hint: Required repairs
      type: text
      options: []
      required: true
    - id: 33
      name: airworthiness_status
      label: Airworthiness Status
      hint: System status
      type: select_one
      options:
      - Airworthy
      - Airworthy with limitations
      - Not airworthy
      required: true
    - id: 34
      name: inspector_signature
      label: Inspector Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 35
      name: next_inspection_due
      label: Next Inspection Due
      hint: Date or hours
      type: text
      options: []
      required: true
