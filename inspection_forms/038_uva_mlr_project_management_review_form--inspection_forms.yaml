inputSchema:
  type: object
  properties:
    title: UVA MLR Project Management Review Form
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_description
      label: project description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: current_status
      label: Current Status
      hint: null
      type: select_one
      options:
      - Active
      - On Hold
      - Completed
      required: false
    - id: 4
      name: next_steps
      label: Next Steps
      hint: null
      type: select_multiple
      options:
      - Continue project as is
      - Change project scope
      - Put on hold
      - Terminate project
      required: false
    - id: 5
      name: issues
      label: Issues
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: plans
      label: Plans
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: follow_up
      label: Follow-up
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: follow_up_by
      label: Follow-up By
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: follow_up_location
      label: Follow-up Location
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: follow_up_notes
      label: Follow-up Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: project_manager
      label: Project Manager
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: project_lead
      label: Project Lead
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: team_members
      label: Team Members
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Joe
      required: false
    - id: 14
      name: team_members_roles
      label: Team Members Roles
      hint: null
      type: select_multiple
      options:
      - Project Manager
      - Team Lead
      - Team Member
      - Other
      required: false
    - id: 15
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: false
