inputSchema:
  type: object
  properties:
    title: Dot Inspectoin Form
    pages:
    - id: 1
      name: dot_inspectoin_form_1
      label: Inspectoin Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: dot_inspectoin_details_1
      label: Select the vehicle make
      hint: null
      type: select_one
      options:
      - Ford
      - Toyota
      - Honda
      required: false
    - id: 3
      name: dot_inspectoin_details_2
      label: Select the vehicle model
      hint: null
      type: select_one
      options:
      - Ford F-150
      - Toyota Corolla
      - Honda Civic
      required: false
    - id: 4
      name: dot_inspectoin_details_3
      label: Select the vehicle year
      hint: null
      type: select_one
      options:
      - '2010'
      - '2015'
      - '2020'
      required: false
    - id: 5
      name: dot_inspectoin_details_4
      label: Select the vehicle color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      required: false
    - id: 6
      name: dot_inspectoin_details_5
      label: Select the vehicle type
      hint: null
      type: select_one
      options:
      - Car
      - Motorcycle
      - Bicycle
      required: false
    - id: 7
      name: dot_inspectoin_details_6
      label: Select the inspection type
      hint: null
      type: select_one
      options:
      - Safety
      - Emissions
      - Maintenance
      required: false
    - id: 8
      name: dot_inspectoin_details_7
      label: Select the date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: dot_inspectoin_details_8
      label: Select the time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: dot_inspectoin_details_9
      label: Inspectoin notes
      hint: null
      type: note
      options: []
      required: false
