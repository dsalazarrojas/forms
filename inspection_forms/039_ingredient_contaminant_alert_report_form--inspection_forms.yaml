inputSchema:
  type: object
  properties:
    title: Ingredient Contaminant Alert Report Form
    pages:
    - id: 1
      name: ingredient
      label: Ingredient
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contaminant_type
      label: Contaminant Type
      hint: null
      type: select_one
      options:
      - Type A
      - Type B
      - Type C
      required: false
    - id: 3
      name: severity
      label: Severity
      hint: null
      type: select_multiple
      options:
      - Low
      - Moderate
      - High
      required: false
    - id: 4
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - Room A
      - Room B
      - Room C
      required: false
    - id: 5
      name: photos
      label: Photos
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
