inputSchema:
  type: object
  properties:
    title: Calibration And Weight Check Form
    pages:
    - id: 1
      name: equipment_info_header
      label: -- Equipment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: equipment_id
      label: Equipment ID or Serial Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: equipment_type
      label: Equipment Type
      hint: null
      type: select_one
      options:
      - Balance Scale
      - Digital Scale
      - Weight Scale
      - Precision Scale
      - Laboratory Scale
      - Other
      required: true
    - id: 4
      name: equipment_location
      label: Equipment Location
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: equipment_department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: inspection_header
      label: -- Inspection Date and Inspector --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: inspection_time
      label: Inspection Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: inspector_credentials
      label: Inspector Credentials
      hint: null
      type: text
      options: []
      required: false
