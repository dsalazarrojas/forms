      name: calibration_header
      label: -- Calibration Check --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: last_calibration_date
      label: Last Calibration Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: calibration_due_date
      label: Next Calibration Due Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: calibration_standard
      label: Calibration Standard Used
      hint: null
      type: select_one
      options:
      - NIST
      - ISO 9001
      - Company standard
      - Other
      required: true
    - id: 15
      name: test_weight_header
      label: -- Test Weight Measurements --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: test_weight_1
      label: Test Weight 1 (kg or lbs)
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: measured_weight_1
      label: Measured Result 1
      hint: null
      type: number
      options: []
      required: true
    - id: 18
      name: test_weight_2
      label: Test Weight 2 (kg or lbs)
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: measured_weight_2
      label: Measured Result 2
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: test_weight_3
      label: Test Weight 3 (kg or lbs)
      hint: null
      type: number
      options: []
      required: false
    - id: 21
      name: measured_weight_3
      label: Measured Result 3
      hint: null
      type: number
      options: []
      required: false
    - id: 22
      name: accuracy_tolerance
      label: Accuracy Tolerance (%)
      hint: null
      type: number
      options: []
      required: true
    - id: 23
      name: results_header
      label: -- Results and Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: calibration_status
      label: Calibration Status
      hint: null
      type: select_one
      options:
      - Within tolerance - Pass
      - Outside tolerance - Fail
      - Needs recalibration
      required: true
    - id: 25
      name: corrective_action
      label: Corrective Action if Needed
      hint: null
      type: text
      options: []
      required: false
