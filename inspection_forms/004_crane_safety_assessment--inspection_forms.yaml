inputSchema:
  type: object
  properties:
    title: crane_safety_assessment
    pages:
    - id: 1
      name: crane_type
      label: Crane type
      hint: null
      type: select_one
      options:
      - Tower crane
      - Hooklift crane
      - Other
      required: true
    - id: 2
      name: crane_location
      label: Crane location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_inspection
      label: Date of inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: hazards_encountered
      label: Hazards encountered
      hint: null
      type: select_multiple
      options:
      - None
      - Loose chains
      - Broken parts
      - Loose bolts
      - Other
      required: true
    - id: 5
      name: corrective_actions
      label: Corrective actions taken
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Partially completed
      required: true
    - id: 6
      name: next_due_date
