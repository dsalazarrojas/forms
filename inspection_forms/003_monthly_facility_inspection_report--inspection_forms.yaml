inputSchema:
  type: object
  properties:
    title: Monthly Facility Inspection Report
    pages:
    - id: 1
      name: facility_name
      label: Facility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: maintenance_issues
      label: Maintenance Issues
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: maintenance_status
      label: Maintenance Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 5
      name: assigned_technician
      label: Assigned Technician
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: facility_location
      label: Facility Location
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: maintenance_completed
      label: Maintenance Completed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: photos_taken
      label: Photos Taken
      hint: null
      type: text
      options: []
      required: false
