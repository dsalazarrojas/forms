inputSchema:
  type: object
  properties:
    title: Aquarium Tank Inspection Form
    pages:
    - id: 1
      name: inspection_info
      label: Inspection Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Inspection Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: tank_id
      label: Tank ID or Location
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: tank_info
      label: Tank Information
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: tank_volume
      label: Tank Volume (gallons)
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: water_temperature
      label: Water Temperature (Fahrenheit)
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: water_clarity
      label: Water Clarity Assessment
      hint: null
      type: select_one
      options:
      - Crystal Clear
      - Clear
      - Slightly Cloudy
      - Very Cloudy
      required: true
    - id: 10
      name: filtration_status
      label: Filtration System Status
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Functioning
      required: true
    - id: 11
      name: equipment_check
      label: Equipment Condition Check
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: heater_status
      label: Heater Status
      hint: null
      type: select_one
      options:
      - Working
      - Not Working
      - Needs Service
      required: false
    - id: 13
      name: pump_status
      label: Pump Status
      hint: null
      type: select_one
      options:
      - Working
      - Not Working
      - Needs Service
      required: false
    - id: 14
      name: aquatic_life
      label: Aquatic Life Observations
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: concerns
      label: Any Concerns or Issues
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: recommended_maintenance
      label: Recommended Maintenance
      hint: null
      type: text
      options: []
      required: false
