inputSchema:
  type: object
  properties:
    title: Care Facility Evaluation Form
    pages:
    - id: 1
      name: evaluation_header
      label: -- Evaluation Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: facility_name
      label: Facility name
      hint: Name of the facility being evaluated
      type: text
      options: []
      required: true
    - id: 3
      name: evaluator_name
      label: Evaluator name
      hint: Person conducting the assessment
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_inspection
      label: Date of inspection
      hint: Date of facility visit
      type: date
      options: []
      required: true
    - id: 5
      name: cleanliness_rating
      label: Cleanliness rating
      hint: Overall cleanliness assessment
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: staff_professionalism
      label: Staff professionalism
      hint: Interaction quality and responsiveness
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: safety_and_security
      label: Safety and security
      hint: Observe safety measures and protocols
      type: select_one
      options:
      - Meets standards
      - Needs improvement
      - Does not meet standards
      required: true
    - id: 8
      name: resident_comfort
      label: Resident comfort and dignity
      hint: Evaluate living conditions and privacy
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: recommendations
      label: Recommendations
      hint: Required follow up or improvements
      type: text
      options: []
      required: false
    - id: 10
      name: follow_up_required
      label: Follow up required
      hint: Flag for follow up inspection
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
