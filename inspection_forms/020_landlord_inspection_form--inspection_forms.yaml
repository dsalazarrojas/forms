    - id: 4
      name: date_of_inspection
      label: date_of_inspection
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time_of_inspection
      label: time_of_inspection
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
