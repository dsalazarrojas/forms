inputSchema:
  type: object
  properties:
    title: tree_health_inspection_form
    pages:
    - id: 1
      name: tree_health_status
      label: What is the health status of the tree?
      hint: Please select the health status of the tree.
      type: select_multiple
      options:
      - Healthy
      - Diseased
      - Dead
      - Unknown
      required: true
    - id: 2
      name: last_inspection_date
      label: Date of last inspection
      hint: Please enter the date of the last inspection.
      type: date
      options: []
      required: true
    - id: 3
      name: is_tree_healthy
      label: Was this tree healthy?
      hint: Please select if this tree is healthy or not.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: inspection_time
      label: Time of inspection
      hint: Please enter the time of the inspection.
      type: time
      options: []
      required: true
    - id: 5
      name: reported_problem
      label: Reported problem on the tree
      hint: Please describe any problem found on the tree.
      type: note
      options: []
      required: true
    - id: 6
      name: problem_description
      label: Description of the problem
      hint: Please provide a detailed description of the problem.
      type: text
      options: []
      required: true
