inputSchema:
  type: object
  properties:
    title: Smoke Detector Inspection Form
    pages:
    - id: 1
      name: smoke_detector_inspection_form
      label: Smoke Detector Inspection Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: building_id
      label: building_id
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: floor_level
      label: Floor Level
      hint: null
      type: select_one
      options:
      - ground floor
      - first floor
      - second floor
      required: false
    - id: 4
      name: fire_alarm_system
      label: Fire Alarm System
      hint: null
      type: select_multiple
      options:
      - installed
      - not installed
      - not applicable
      required: false
    - id: 5
      name: smoke_detector_location
      label: Smoke Detector Location
      hint: null
      type: select_multiple
      options:
      - near stairwell
      - near window
      - near door
      required: false
    - id: 6
      name: smoke_detector_status
      label: Smoke Detector Status
      hint: null
      type: select_one
      options:
      - functional
      - non functional
      required: false
    - id: 7
      name: fire_extinguisher_type
      label: Fire Extinguisher Type
      hint: null
      type: select_one
      options:
      - water chemical
      - dry chemical
      - clean agent
      required: false
    - id: 8
      name: fire_extinguisher_location
      label: Fire Extinguisher Location
      hint: null
      type: select_multiple
      options:
      - near entrance
      - near fire alarm panel
      - near stairwell
      required: false
    - id: 9
      name: fire_extinguisher_status
      label: Fire Extinguisher Status
      hint: null
      type: select_one
      options:
      - functional
      - non functional
      required: false
    - id: 10
      name: fire_alarm_panel
      label: fire_alarm_panel
      hint: null
      type: select_one
      options:
      - present
      - absent
      - non applicable
      required: false
    - id: 11
      name: fire_extinguisher_tag
      label: Fire Extinguisher Tag
      hint: null
      type: text
      options: []
      required: false
