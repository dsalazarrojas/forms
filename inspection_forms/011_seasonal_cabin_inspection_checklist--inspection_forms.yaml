inputSchema:
  type: object
  properties:
    title: Seasonal Cabin Inspection Checklist
    pages:
    - id: 1
      name: cabin_address
      label: Cabin Address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: maintenance_manager
      label: Maintenance Manager
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: cabin_type
      label: Cabin Type
      hint: null
      type: select_one
      options:
      - Cabin
      - Lodge
      - Chalet
      - Cabinette
      required: true
    - id: 6
      name: season
      label: Season
      hint: null
      type: select_one
      options:
      - Winter
      - Spring
      - Summer
      - Fall
      required: true
    - id: 7
      name: maintenance_status
      label: Maintenance Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: follow_up
      label: Follow-up
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
