inputSchema:
  type: object
  properties:
    title: Pool Chemicals Check Form
    pages:
    - id: 1
      name: chemical_check_form
      label: Chemical Check Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pool_water_level
      label: What is the pool water level?
      hint: null
      type: select_one
      options:
      - Low
      - Normal
      - High
      required: true
    - id: 3
      name: chemical_feed_type
      label: Chemical Feed Type
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: chemicals_check_results
      label: Chemical Check Results
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: check_date
      label: Check Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: check_time
      label: Check Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: chemical_check_frequency
      label: What is the chemical check frequency?
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-weekly
      - Daily
      required: false
    - id: 11
      name: pool_size
      label: What is the pool size?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: pool_type
      label: What is the pool type?
      hint: null
      type: select_one
      options:
      - Saltwater
      - Freshwater
      required: false
