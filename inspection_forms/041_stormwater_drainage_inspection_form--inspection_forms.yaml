inputSchema:
  type: object
  properties:
    title: Stormwater Drainage Inspection Form
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: system_info
      label: System Info
      hint: null
      type: select_one
      options:
      - Drainage System ID
      - Drainage System Name
      - Other (Specify)
      required: true
    - id: 3
      name: inspector_info
      label: Inspector Info
      hint: Enter the name of the person inspecting the form
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_inspection
      label: Date of Inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: time_of_inspection
      label: Time of Inspection
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: photos
      label: Photos
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: signatures
      label: Signatures
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: attachments
      label: Attachments
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: system_condition
      label: System Condition
      hint: Describe the condition of the stormwater drainage system
      type: text
      options: []
      required: true
