inputSchema:
  type: object
  properties:
    title: BBS Behavioral Based Safety Checklist
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: inspector_name
      label: Inspector Name
      hint: Person conducting the safety observation
      type: text
      options: []
      required: true
    - id: 3
      name: inspector_id
      label: Inspector ID or Badge Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department or Area Inspected
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: employee_name
      label: Employee Name
      hint: Person being observed
      type: text
      options: []
      required: false
    - id: 6
      name: observation_time
      label: Time of Observation
      hint: What time was the observation conducted?
      type: time
      options: []
      required: false
    - id: 7
      name: observation_duration
      label: Duration of Observation (in minutes)
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: activity_observed
      label: Activity Being Performed
      hint: Describe what the employee was doing
      type: text
      options: []
      required: true
    - id: 9
      name: ppe_compliance
      label: Proper PPE Being Worn?
      hint: Personal Protective Equipment
      type: select_one
      options:
      - Compliant
      - Non-compliant
      - Not Applicable
      required: true
    - id: 10
      name: ppe_details
      label: PPE Details
      hint: Specify what PPE is/should be worn
      type: text
      options: []
      required: false
    - id: 11
      name: equipment_use
      label: Equipment Used Safely?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
    - id: 12
      name: housekeeping_status
      label: Housekeeping and Order
      hint: Is the work area clean and organized?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: hazards_identified
      label: Any hazards identified?
      hint: null
      type: select_one
      options:
      - No hazards
      - Minor hazards
      - Significant hazards
      - Critical hazards
      required: true
    - id: 14
      name: hazard_description
      label: Hazard Description
      hint: If hazards identified, describe them
      type: text
      options: []
      required: false
    - id: 15
      name: corrective_action
      label: Corrective Action Required
      hint: What action should be taken?
      type: text
      options: []
      required: false
    - id: 16
      name: action_deadline
      label: Action Deadline
      hint: When should the correction be completed?
      type: date
      options: []
      required: false
    - id: 17
      name: positive_behaviors
      label: Positive Safety Behaviors Observed
      hint: What was done correctly?
      type: text
      options: []
      required: false
    - id: 18
      name: additional_comments
      label: Additional Comments
      hint: Any other observations?
      type: text
      options: []
      required: false
