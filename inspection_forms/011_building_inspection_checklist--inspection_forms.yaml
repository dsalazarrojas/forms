      options: []
      required: false
    - id: 21
      name: overall_assessment
      label: Overall Assessment
      hint: General condition of property
      type: select_one
      options:
        - Excellent Condition
        - Good Condition
        - Fair Condition
        - Poor Condition
        - Significant Issues
      required: true
    - id: 22
      name: photos_attached
      label: Photos or Documentation Attached
      hint: Evidence of findings
      type: select_one
      options:
        - Yes
        - No
      required: false
