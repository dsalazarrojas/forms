        - Missing Shingles
        - Leaks Visible
        - Sagging
        - Moss or Algae
        - Needs Replacement
      required: true
    - id: 10
      name: foundation_check
      label: Foundation Check
      hint: Foundation condition
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Requires Repair
      required: true
    - id: 11
      name: foundation_issues
      label: Foundation Issues Found
      hint: Any cracks or settling
      type: text
      options: []
      required: false
    - id: 12
      name: windows_doors
      label: Windows and Doors
      hint: Assessment of windows and doors
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
      required: true
    - id: 13
      name: electrical_panel
      label: Electrical Panel Inspection
      hint: Main electrical panel
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Requires Update
      required: true
    - id: 14
      name: plumbing_check
      label: Plumbing System Check
      hint: Overall plumbing condition
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Requires Repair
      required: true
    - id: 15
      name: hvac_system
      label: HVAC System Condition
      hint: Heating and cooling systems
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Needs Replacement
      required: true
    - id: 16
      name: moisture_presence
      label: Moisture or Water Damage
      hint: Signs of water damage
      type: select_one
      options:
        - None Visible
        - Minor
        - Moderate
        - Extensive
      required: true
    - id: 17
      name: pest_evidence
      label: Evidence of Pests
      hint: Insects, rodents, etc
      type: select_one
      options:
        - None
        - Minor
        - Moderate
        - Severe
      required: true
    - id: 18
      name: mold_presence
      label: Signs of Mold
      hint: Mold or mildew
      type: select_one
      options:
        - None
        - Minimal
        - Moderate
        - Extensive
