inputSchema:
  type: object
  properties:
    title: Building Inspection Checklist
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date of building inspection
      type: date
      options: []
      required: true
    - id: 2
      name: property_address
      label: Property Address
      hint: Complete building address
      type: text
      options: []
      required: true
    - id: 3
      name: property_type
      label: Property Type
      hint: What type of building
      type: select_one
      options:
        - Residential
        - Commercial
        - Industrial
        - Mixed Use
        - Other
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: Full name of inspector
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_license
      label: Inspector License Number
      hint: Professional credentials
      type: text
      options: []
      required: false
    - id: 6
      name: property_owner
      label: Property Owner Name
      hint: Owner of the building
      type: text
      options: []
      required: false
    - id: 7
      name: owner_contact
      label: Owner Contact Number
      hint: Phone or email
      type: text
      options: []
      required: false
    - id: 8
      name: exterior_condition
      label: Exterior Condition
      hint: Overall exterior assessment
      type: select_one
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Critical
      required: true
    - id: 9
      name: roof_inspection
      label: Roof Inspection
      hint: Roof condition check
      type: select_multiple
      options:
