inputSchema:
  type: object
  properties:
    title: Swimming Pool Inspection Form
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: owner_information
      label: Owner Information
      hint: Provide owner information for the pool.
      type: text
      options: []
      required: false
    - id: 3
      name: inspection_dates
      label: Inspection Dates
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: pool_contents
      label: Pool Contents
      hint: null
      type: select_multiple
      options:
      - Pool Floor
      - Pool Walls
      - Pool Surrounds
      - Pool Deck
      - Pool Equipment
      required: true
    - id: 5
      name: pool_safety
      label: Pool Safety
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: pool_maintenance
      label: Pool Maintenance
      hint: null
      type: select_multiple
      options:
      - Weekly
      - Bi-weekly
      - Monthly
      - Quarterly
      - Semi-annually
      - Annually
      required: true
    - id: 7
      name: pool_status
      label: Pool Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 8
      name: pool_notes
      label: Pool Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: inspector_notes
      label: Inspector Notes
      hint: null
      type: note
      options: []
      required: true
