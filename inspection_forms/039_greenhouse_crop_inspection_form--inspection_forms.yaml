inputSchema:
  type: object
  properties:
    title: Greenhouse Crop Inspection Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_inspected
      label: Date Inspected
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_inspected
      label: Time Inspected
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: crop_condition
      label: Crop Condition
      hint: null
      type: select_one
      options:
      - Good
      - Bad
      - Unknown
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: contact
      label: Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: follow_up_action
      label: Follow Up Action
      hint: null
      type: select_multiple
      options:
      - None
      - Send Reminder
      - Follow Up Call
      - Follow Up Email
      - Follow Up Visit
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
