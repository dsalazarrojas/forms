inputSchema:
  type: object
  properties:
    title: Agricultural Unit Assessment Form
    pages:
    - id: 1
      name: assessor_name
      label: Assessor Name
      hint: Name of the person conducting assessment
      type: text
      options: []
      required: true
    - id: 2
      name: assessment_date
      label: Assessment Date
      hint: Date of assessment
      type: date
      options: []
      required: true
    - id: 3
      name: farm_name
      label: Farm Name
      hint: Name of the farm or agricultural unit
      type: text
      options: []
      required: true
    - id: 4
      name: unit_identifier
      label: Unit Identifier
      hint: Specific unit or field ID
      type: text
      options: []
      required: true
    - id: 5
      name: unit_size
      label: Unit Size (acres)
      hint: Size of the agricultural unit
      type: number
      options: []
      required: true
    - id: 6
      name: land_use
      label: Current Land Use
      hint: Primary use of the unit
      type: select_one
      options:
      - Crop production
      - Pasture
      - Fallow
      - Orchard
      - Vineyard
      - Greenhouse
      - Storage
      required: true
    - id: 7
      name: infrastructure_condition
      label: Infrastructure Condition
      hint: Overall condition of buildings and structures
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 8
      name: fencing_status
      label: Fencing Status
      hint: Condition of perimeter fencing
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - No fencing
      required: true
    - id: 9
      name: water_access
      label: Water Access
      hint: Availability of water sources
      type: select_one
      options:
      - Adequate year-round
      - Seasonal only
      - Limited
      - None on site
      required: true
    - id: 10
      name: water_sources
      label: Water Sources
      hint: Select all available sources
      type: select_multiple
      options:
      - Well
      - Pond
      - Stream or river
      - Municipal supply
      - Irrigation district
      - Rainwater collection
      required: false
    - id: 11
      name: soil_quality
      label: Soil Quality Assessment
      hint: Overall soil quality rating
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Degraded
      required: true
    - id: 12
      name: drainage
      label: Drainage Condition
      hint: How well does the unit drain
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Problematic
      required: true
    - id: 13
      name: erosion_present
      label: Erosion Present
      hint: Is there evidence of soil erosion
      type: select_one
      options:
      - None
      - Minimal
      - Moderate
      - Severe
      required: true
    - id: 14
      name: vegetation_cover
      label: Vegetation Cover Percentage
      hint: Estimated percentage of ground covered
      type: select_one
      options:
      - 0-25%
      - 26-50%
      - 51-75%
      - 76-100%
      required: true
    - id: 15
      name: pest_pressure
      label: Pest Pressure Level
      hint: Current pest pressure observed
      type: select_one
      options:
      - None
      - Low
      - Moderate
      - High
      - Severe
      required: true
    - id: 16
      name: weed_infestation
      label: Weed Infestation Level
      hint: Level of weed problems
      type: select_one
      options:
      - None
      - Low
      - Moderate
      - High
      - Severe
      required: true
    - id: 17
      name: equipment_access
      label: Equipment Access
      hint: Can farm equipment access the unit
      type: select_one
      options:
      - Excellent access
      - Good access
      - Limited access
      - Poor access
      - No access
      required: true
    - id: 18
      name: road_condition
      label: Road Condition
      hint: Condition of access roads
      type: select_one
      options:
      - Paved
      - Gravel - good
      - Gravel - fair
      - Dirt
      - No road
      required: true
    - id: 19
      name: environmental_concerns
      label: Environmental Concerns
      hint: Select any environmental issues
      type: select_multiple
      options:
      - None
      - Soil erosion
      - Water contamination risk
      - Habitat destruction
      - Invasive species
      - Chemical runoff risk
      required: true
    - id: 20
      name: productivity_rating
      label: Productivity Rating
      hint: Overall productivity potential
      type: select_one
      options:
      - Very high
      - High
      - Moderate
      - Low
      - Very low
      required: true
    - id: 21
      name: recommended_improvements
      label: Recommended Improvements
      hint: Suggested improvements for the unit
      type: text
      options: []
      required: true
    - id: 22
      name: estimated_investment
      label: Estimated Investment Needed (USD)
      hint: Approximate cost for improvements
      type: number
      options: []
      required: false
    - id: 23
      name: assessor_signature
      label: Assessor Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 24
      name: follow_up_required
      label: Follow-up Assessment Required
      hint: Is a follow-up needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
