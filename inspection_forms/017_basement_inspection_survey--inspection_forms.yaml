inputSchema:
  type: object
  properties:
    title: Basement Inspection Survey
    pages:
    - id: 1
      name: section_header_1
      label: -- Property Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: property_address
      label: Property address
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: property_owner
      label: Property owner name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: property_phone
      label: Property owner phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: inspection_date
      label: Inspection date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: inspector_name
      label: Inspector name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_header_2
      label: -- Foundation and Structure --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: foundation_type
      label: Foundation type
      hint: null
      type: select_one
      options:
      - Concrete Slab
      - Pier and Beam
      - Full Basement
      - Crawlspace
      - Other
      required: true
    - id: 9
      name: foundation_condition
      label: Foundation condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Severely Damaged
      required: true
    - id: 10
      name: cracks_visible
      label: Are any cracks visible?
      hint: null
      type: select_one
      options:
      - None
      - Minor
      - Moderate
      - Severe
      required: true
    - id: 11
      name: section_header_3
      label: -- Moisture and Drainage --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: moisture_issues
      label: Any signs of moisture or water damage?
      hint: null
      type: select_one
      options:
      - None
      - Minor Staining
      - Moderate Damage
      - Severe Flooding History
      required: true
    - id: 13
      name: drainage_system
      label: Drainage system condition
      hint: null
      type: select_one
      options:
      - Good
      - Adequate
      - Poor
      - None Visible
      required: true
    - id: 14
      name: section_header_4
      label: -- Structural Components --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: floors_condition
      label: Floor condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: walls_condition
      label: Wall condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: ceiling_condition
      label: Ceiling condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 18
      name: section_header_5
      label: -- Systems and Utilities --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: hvac_present
      label: HVAC equipment present in basement?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 20
      name: hvac_condition
      label: HVAC condition (if applicable)
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: false
    - id: 21
      name: electrical_present
      label: Electrical panel present?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: electrical_condition
      label: Electrical panel condition
      hint: null
      type: select_one
      options:
      - Safe
      - Issues Present
      - Not Applicable
      required: false
    - id: 23
      name: plumbing_present
      label: Plumbing present in basement?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 24
      name: section_header_6
      label: -- Safety and Code Issues --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: safety_hazards
      label: Any safety hazards identified?
      hint: null
      type: text
      options: []
      required: false
    - id: 26
      name: code_violations
      label: Code violations or concerns?
      hint: null
      type: text
      options: []
      required: false
    - id: 27
      name: overall_assessment
      label: Overall basement assessment
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Requires Repairs
      required: true
