      name: storage_area_clutter
      label: Storage Area Clutter
      hint: Is the storage area cluttered?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: delivery_schedules
      label: Delivery Schedules
      hint: Are delivery schedules up to date?
      type: select_multiple
      options:
      - On Time
      - Behind Schedule
      required: false
    - id: 5
      name: warehouse_layout
