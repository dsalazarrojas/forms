inputSchema:
  type: object
  properties:
    title: Logistics Audit Checklist
    pages:
    - id: 1
      name: facility_performance
      label: Facility Performance
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: equipment_condition
      label: Equipment Condition
      hint: Check the condition of equipment
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
