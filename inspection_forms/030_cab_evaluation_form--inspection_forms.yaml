inputSchema:
  type: object
  properties:
    title: Cab Evaluation Form
    pages:
    - id: 1
      name: header_vehicle_id
      label: -- Vehicle Identification --
      hint: Taxi/Cab Inspection and Service Record
      type: note
      options: []
      required: false
    - id: 2
      name: vehicle_number
      label: Cab Number or Unit ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: license_plate
      label: License Plate Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: vehicle_model
      label: Vehicle Make and Model
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: current_mileage
      label: Current Odometer Reading
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: header_exterior_interior
      label: -- Physical Condition Evaluation --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: exterior_body
      label: Exterior Body Condition
      hint: check for dents, scratches, or rust
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Damaged
      required: true
    - id: 8
      name: interior_cleanliness
      label: Interior Cleanliness
      hint: seats, floors, and windows
      type: select_one
      options:
      - Clean
      - Acceptable
      - Needs Cleaning
      - Dirty
      required: true
    - id: 9
      name: upholstery_condition
      label: Upholstery and Seat Condition
      hint: check for tears or stains
      type: select_one
      options:
      - Like New
      - Worn
      - Torn
      - Needs Replacement
      required: true
    - id: 10
      name: lighting_check
      label: Lights and Signals Functioning
      hint: headlamps, indicators, brake lights
      type: select_one
      options:
      - Pass
      - Fail
      required: true
    - id: 11
      name: header_mechanical
      label: -- Mechanical and Safety Check --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: tire_tread_status
      label: Tire Condition and Tread Depth
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Needs Replacement
      required: true
    - id: 13
      name: brake_performance
      label: Brake Performance Rating
      hint: null
      type: select_one
      options:
      - Responsive
      - Soft
      - Noisy
      - Needs Immediate Service
      required: true
    - id: 14
      name: fluid_levels
      label: Engine Oil and Fluid Levels Checked
      hint: null
      type: select_one
      options:
      - Full
      - Low
      - Needs Service
      required: true
    - id: 15
      name: taxi_meter_check
      label: Taxi Meter and Terminal Working Correct
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: header_summary
      label: -- Inspection Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: inspection_result
      label: Overall Inspection Result
      hint: null
      type: select_one
      options:
      - Roadworthy
      - Minor Repairs Needed
      - Unsafe for Service
      required: true
    - id: 18
      name: inspector_name
      label: Evaluated By
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: evaluation_date
      label: Date of Evaluation
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: service_notes
      label: Maintenance or Problem Report
      hint: describe any issues in detail
      type: text
      options: []
      required: false
