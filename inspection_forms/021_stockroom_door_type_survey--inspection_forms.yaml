      name: maintenance_priority
      label: How quickly does maintenance need to be done?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: maintenance_status_id
      label: Maintenance Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 11
      name: maintenance_status
      label: Is the door currently maintained?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: stockroom_door_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: assigned_to_id
      label: Assigned To
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: assigned_to
      label: Who is assigned to it?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 15
      name: stockroom_door_type_survey_form_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
