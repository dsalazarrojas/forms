inputSchema:
  type: object
  properties:
    title: Stockroom Door Type Survey
    pages:
    - id: 1
      name: stockroom_door_type_id
      label: Stockroom Door Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: stockroom_door_type
      label: What type of stockroom door is it?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: stockroom_door_description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: door_condition_id
      label: Door Condition
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: door_condition
      label: What condition is the door in?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: stockroom_door_size_id
      label: Stockroom Door Size
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: stockroom_door_size
      label: What size is the stockroom door?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: maintenance_priority_id
      label: Maintenance Priority
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
