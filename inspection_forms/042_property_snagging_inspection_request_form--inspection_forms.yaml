inputSchema:
  type: object
  properties:
    title: Property Snagging Inspection Request Form
    pages:
    - id: 1
      name: property_id
      label: Property ID
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - Residential
      - Commercial
      - Other
      required: true
    - id: 3
      name: inspection_type
      label: Inspection Type
      hint: null
      type: select_multiple
      options:
      - Snagging
      - Walk Through
      - Other
      required: true
    - id: 4
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: inspection_time
      label: Inspection Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: inspection_requester
      label: Inspection Requester
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: request_details
      label: Request Details
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: inspection_schedule
      label: Inspection Schedule
      hint: null
      type: select_one
      options:
      - Immediate
      - Within 24 hours
      - Within 48 hours
      - Custom
      required: true
    - id: 10
      name: follow_up_inspection
      label: Follow-up Inspection
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
