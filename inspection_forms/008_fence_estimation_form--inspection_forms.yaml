inputSchema:
  type: object
  properties:
    title: Fence Estimation Form
    pages:
    - id: 1
      name: customer_name
      label: customer_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: email
      hint: null
      type: email
      options: []
      required: false
