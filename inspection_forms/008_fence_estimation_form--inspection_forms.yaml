    - id: 10
      name: labor_cost
      label: labor_cost
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: labor_hours
      label: labor_hours
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: labor_rate
      label: labor_rate
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: total_cost
      label: total_cost
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
