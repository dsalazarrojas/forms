inputSchema:
  type: object
  properties:
    title: Transmission Line Inspection Form
    pages:
    - id: 1
      name: transmission_line_id
      label: transmission line id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: transmission_line_type
      label: transmission line type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: inspection_date
      label: inspection date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: inspection_time
      label: inspection time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: inspection_result
      label: inspection result
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: assigned_to
      label: assigned to
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: assigned_by
      label: assigned by
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
