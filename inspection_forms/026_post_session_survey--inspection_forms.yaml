inputSchema:
  type: object
  properties:
    title: Post-session survey
    pages:
    - id: 1
      name: overall_opinion
      label: What do you think of the seminar?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: most_interesting
      label: What was the most interesting part of the seminar?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: recommend
      label: How likely are you to recommend this seminar?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: dislike
      label: What did you not like about the seminar?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: next_seminar
      label: Do you plan on taking another seminar from this speaker?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: session_length
      label: How long should the seminar be?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: memorable_moments
      label: What were the most memorable moments from this seminar?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: comments
      label: Do you have any comments or feedback about this seminar?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: registration_process
      label: How easy was the registration process?
      hint: null
      type: select_one
      options:
      - Very easy
      - Somewhat easy
      - Somewhat difficult
      - Very difficult
      required: false
    - id: 10
      name: communication
      label: How clear was the communication from the speaker or organizers?
      hint: null
      type: select_one
      options:
      - Very clear
      - Somewhat clear
      - Not very clear
      - Not clear at all
      required: false
    - id: 11
      name: speaker_engagement
      label: How engaging was the speaker?
      hint: null
      type: select_one
      options:
      - Very engaging
      - Somewhat engaging
      - Somewhat not engaging
      - Not engaging at all
      required: false
    - id: 12
      name: expectations_met
      label: How well did the seminar meet your expectations?
      hint: null
      type: select_one
      options:
      - Completely met expectations
      - Mostly met expectations
      - Somewhat met expectations
      - Not met expectations
      required: false
