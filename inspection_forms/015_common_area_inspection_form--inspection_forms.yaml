inputSchema:
  type: object
  properties:
    title: Common Area Inspection Form
    pages:
      - id: 1
        name: inspection_information
        label: Inspection Information
        hint: Details about the common area inspection
        type: note
        options: []
        required: false
      - id: 2
        name: inspection_date
        label: Inspection Date
        hint: Date of the inspection
        type: date
        options: []
        required: true
      - id: 3
        name: inspection_time
        label: Inspection Time
        hint: Time of the inspection
        type: time
        options: []
        required: true
      - id: 4
        name: inspector_name
        label: Inspector Name
        hint: Full name of the inspector
        type: text
        options: []
        required: true
      - id: 5
        name: inspector_title
        label: Inspector Title
        hint: Job title or position
        type: text
        options: []
        required: true
      - id: 6
        name: property_information
        label: Property Information
        hint: Details about the property being inspected
        type: note
        options: []
        required: false
      - id: 7
        name: property_name
        label: Property Name
        hint: Name of the property or building
        type: text
        options: []
        required: true
      - id: 8
        name: property_address
        label: Property Address
        hint: Full address of the property
        type: text
        options: []
        required: true
      - id: 9
        name: building_type
        label: Building Type
        hint: Type of building or facility
        type: select_one
        options:
          - Office Building
          - Apartment Complex
          - Shopping Center
          - Mixed-Use
          - Industrial
          - Medical Facility
          - Educational
        required: true
      - id: 10
        name: areas_inspected
        label: Areas Inspected
        hint: Which common areas were inspected
        type: select_multiple
        options:
          - Lobby
          - Hallways
          - Elevators
          - Stairwells
          - Restrooms
          - Break Rooms
          - Conference Rooms
          - Fitness Center
          - Parking Areas
          - Outdoor Spaces
        required: true
      - id: 11
        name: cleanliness_assessment
        label: Cleanliness Assessment
        hint: Overall cleanliness evaluation
        type: note
        options: []
        required: false
      - id: 12
        name: overall_cleanliness
        label: Overall Cleanliness
        hint: Rate overall cleanliness
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Unacceptable
        required: true
      - id: 13
        name: floor_condition
        label: Floor Condition
        hint: Condition of flooring in common areas
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Needs Repair
        required: true
      - id: 14
        name: wall_condition
        label: Wall Condition
        hint: Condition of walls and paint
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Needs Repair
        required: true
      - id: 15
        name: lighting_condition
        label: Lighting Condition
        hint: Condition and functionality of lighting
        type: select_one
        options:
          - All Working
          - Minor Issues
          - Multiple Issues
          - Major Problems
        required: true
      - id: 16
        name: restroom_cleanliness
        label: Restroom Cleanliness
        hint: Cleanliness of restroom facilities
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Unacceptable
          - Not Applicable
        required: true
      - id: 17
        name: trash_management
        label: Trash Management
        hint: Condition of trash and recycling areas
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Unacceptable
        required: true
      - id: 18
        name: safety_assessment
        label: Safety Assessment
        hint: Safety-related observations
        type: note
        options: []
        required: false
      - id: 19
        name: safety_hazards
        label: Safety Hazards
        hint: Are there any safety hazards present
        type: select_one
        options:
          - None Found
          - Minor Hazards
          - Moderate Hazards
          - Serious Hazards
        required: true
      - id: 20
        name: hazard_details
        label: Hazard Details
        hint: Describe any hazards found
        type: text
        options: []
        required: false
      - id: 21
        name: accessibility_compliance
        label: Accessibility Compliance
        hint: Is the area accessible and compliant
        type: select_one
        options:
          - Fully Compliant
          - Minor Issues
          - Major Issues
          - Non-Compliant
        required: true
      - id: 22
        name: maintenance_needed
        label: Maintenance Needed
        hint: What maintenance is required
        type: select_multiple
        options:
          - None
          - Cleaning
          - Painting
          - Lighting Repair
          - Floor Repair
          - Plumbing
          - HVAC
          - Landscaping
        required: true
      - id: 23
        name: priority_level
        label: Priority Level
        hint: Priority of required maintenance
        type: select_one
        options:
          - Low
          - Medium
          - High
          - Urgent
        required: true
      - id: 24
        name: follow_up_required
        label: Follow-Up Required
        hint: Is follow-up inspection needed
        type: select_one
        options:
          - "Yes"
          - "No"
        required: true
      - id: 25
        name: follow_up_date
        label: Follow-Up Date
        hint: Scheduled follow-up date
        type: date
        options: []
        required: false
      - id: 26
        name: additional_notes
        label: Additional Notes
        hint: Any additional observations or comments
        type: text
        options: []
        required: false
      - id: 27
        name: photos_attached
        label: Photos Attached
        hint: Were photos taken during inspection
        type: select_one
        options:
          - "Yes"
          - "No"
        required: false
