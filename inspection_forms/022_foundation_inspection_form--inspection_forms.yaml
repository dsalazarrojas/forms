      options: []
      required: true
    - id: 6
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: date_of_inspection
      label: Date Of Inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time_of_inspection
