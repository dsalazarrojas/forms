inputSchema:
  type: object
  properties:
    title: Independent Learning Program Registration
    pages:
    - id: 1
      name: program_type
      label: Program Type
      hint: null
      type: select_one
      options:
      - Online
      - On-campus
      required: false
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: program_details
      label: Program Details
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: program_location
      label: Program Location
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: contact_email
      label: Contact Email
      hint: example@example.com
      type: email
      options: []
      required: false
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: course_enrolment_status
      label: Enrollment Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
