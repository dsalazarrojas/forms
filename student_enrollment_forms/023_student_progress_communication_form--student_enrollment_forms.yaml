inputSchema:
  type: object
  properties:
    title: Student Progress Communication Form
    pages:
    - id: 1
      name: student_progress
      label: Student Progress
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_of_visit
      label: Time of Visit
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: educator_comments
      label: Educator Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: parent_phone
      label: Parent Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: student_performance_rating
      label: Student Performance Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 9
      name: parent_comments
      label: Parent Comments
      hint: null
      type: note
      options: []
      required: false
