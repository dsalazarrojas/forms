inputSchema:
  type: object
  properties:
    title: Community Tutoring Registration Form
    pages:
      - id: 1
        name: student_name
        label: Student full name
        hint: First and last name
        type: text
        options: []
        required: true
      - id: 2
        name: guardian_name
        label: Guardian full name
        hint: Parent or guardian if student is minor
        type: text
        options: []
        required: false
      - id: 3
        name: contact_email
        label: Contact email
        hint: For schedules and updates
        type: email
        options: []
        required: true
      - id: 4
        name: grade_level
        label: Grade level
        hint: Current grade or year in school
        type: select_one
        options: [K-2, 3-5, 6-8, 9-12, Adult]
        required: true
      - id: 5
        name: subjects_needed
        label: Subjects needing support
        hint: Select all that apply
        type: select_multiple
        options: [Math, Reading, Science, Writing, Test preparation]
        required: true
      - id: 6
        name: preferred_schedule
        label: Preferred tutoring schedule
        hint: Days and times available
        type: text
        options: []
        required: false
      - id: 7
        name: learning_goals
        label: Learning goals
        hint: Brief description of goals for tutoring
        type: text
        options: []
        required: false
      - id: 8
        name: accommodations_needed
        label: Accommodations needed
        hint: Describe any special learning needs
        type: text
        options: []
        required: false
