inputSchema:
  type: object
  properties:
    title: COVID Student Intake Agreement
    pages:
    - id: 1
      name: student_name
      label: Student Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - Kindergarten
      - Elementary
      - Middle School
      - High School
      - College
      - Other
      required: true
    - id: 5
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: parent_email
      label: Parent Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: parent_phone
      label: Parent Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: vaccination_status
      label: COVID-19 Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Unvaccinated
      - Unknown
      required: true
    - id: 11
      name: last_vaccination_date
      label: Date of Last Vaccination
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: prior_covid
      label: Prior COVID-19 Infection
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: false
    - id: 13
      name: prior_covid_date
      label: Date of Prior COVID-19 Infection
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: daily_health_screening
      label: Agreeing to Daily Health Screening
      hint: Temperature checks and symptom screening
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 15
      name: symptom_reporting
      label: Agree to Report Any Symptoms Immediately
      hint: Fever, cough, or other COVID symptoms
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 16
      name: isolation_agreement
      label: Agree to Isolate If Sick
      hint: If student develops symptoms
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 17
      name: contact_tracing
      label: Agree to Participate in Contact Tracing
      hint: If exposed to COVID-19
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: false
    - id: 18
      name: mask_policy
      label: Understand Mask Policy
      hint: null
      type: select_one
      options:
      - Yes, I understand
      - No, I do not understand
      required: true
    - id: 19
      name: parent_signature
      label: Parent Signature
      hint: Type full name as electronic signature
      type: text
      options: []
      required: true
    - id: 20
      name: agreement_date
      label: Date of Agreement
      hint: null
      type: date
      options: []
      required: true
