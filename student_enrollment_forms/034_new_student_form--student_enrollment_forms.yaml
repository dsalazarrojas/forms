inputSchema:
  type: object
  properties:
    title: New Student Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: course_selection
      label: Select a Course
      hint: Choose one or more of the available courses
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: false
