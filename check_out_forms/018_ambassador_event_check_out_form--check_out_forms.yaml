inputSchema:
  type: object
  properties:
    title: Ambassador Event Check Out Form
    pages:
    - id: 1
      name: section_event_info
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: event_location
      label: Event Location
      hint: Venue or location name
      type: text
      options: []
      required: true
    - id: 5
      name: section_ambassador_info
      label: -- Ambassador Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: ambassador_first_name
      label: Ambassador First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: ambassador_last_name
      label: Ambassador Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: ambassador_id
      label: Ambassador ID Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: section_check_out_time
      label: -- Check-Out Time --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: check_out_date
      label: Check-Out Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: check_out_time
      label: Check-Out Time
      hint: null
      type: time
      options: []
      required: true
    - id: 14
      name: section_equipment_return
      label: -- Equipment Return --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: equipment_issued
      label: Equipment Issued
      hint: Select all items that were issued
      type: select_multiple
      options:
      - Branded apparel
      - Promotional materials
      - Display stands
      - Tablets/devices
      - Signage
      - Product samples
      - Marketing collateral
      - Name badge
      - Lanyard
      - Other
      required: true
    - id: 16
      name: equipment_returned
      label: Equipment Returned
      hint: Select all items being returned
      type: select_multiple
      options:
      - Branded apparel
      - Promotional materials
      - Display stands
      - Tablets/devices
      - Signage
      - Product samples
      - Marketing collateral
      - Name badge
      - Lanyard
      - Other
      - None - Consumables used
      required: true
    - id: 17
      name: equipment_condition
      label: Condition of Returned Equipment
      hint: null
      type: select_one
      options:
      - Excellent - Like new
      - Good - Minor wear
      - Fair - Some damage
      - Poor - Significant damage
      - Not applicable
      required: false
    - id: 18
      name: missing_items
      label: Missing or Damaged Items
      hint: List any items not returned or damaged
      type: text
      options: []
      required: false
    - id: 19
      name: missing_items_reason
      label: Reason for Missing/Damaged Items
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 20
      name: section_event_performance
      label: -- Event Performance --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: attendees_engaged
      label: Approximate Number of Attendees Engaged
      hint: null
      type: number
      options: []
      required: false
    - id: 22
      name: leads_generated
      label: Number of Leads Generated
      hint: Potential customers contacted
      type: number
      options: []
      required: false
    - id: 23
      name: samples_distributed
      label: Number of Samples Distributed
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 24
      name: materials_distributed
      label: Number of Marketing Materials Distributed
      hint: Brochures, flyers, etc.
      type: number
      options: []
      required: false
    - id: 25
      name: section_feedback
      label: -- Event Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: event_success_rating
      label: How successful was this event
      hint: 1 being not successful and 5 being very successful
      type: select_one
      options:
      - 1 - Not Successful
      - 2 - Below Average
      - 3 - Average
      - 4 - Successful
      - 5 - Very Successful
      required: true
    - id: 27
      name: goal_achievement
      label: Were event goals achieved
      hint: null
      type: select_one
      options:
      - Yes - Exceeded goals
      - Yes - Met goals
      - Partially - Some goals met
      - No - Goals not met
      required: true
    - id: 28
      name: audience_engagement
      label: How would you rate audience engagement
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 29
      name: event_organization
      label: How well organized was the event
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very poor
      required: true
    - id: 30
      name: what_worked_well
      label: What Worked Well
      hint: Successes and highlights
      type: text
      options: []
      required: false
    - id: 31
      name: challenges_faced
      label: Challenges Faced
      hint: Any difficulties encountered
      type: text
      options: []
      required: false
    - id: 32
      name: improvements_suggested
      label: Suggested Improvements
      hint: For future events
      type: text
      options: []
      required: false
    - id: 33
      name: section_support
      label: -- Support and Resources --
      hint: null
      type: note
      options: []
      required: false
    - id: 34
      name: support_rating
      label: How satisfied are you with event support
      hint: From event coordinators
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 35
      name: resources_adequacy
      label: Were provided resources adequate
      hint: null
      type: select_one
      options:
      - Yes - More than enough
      - Yes - Adequate
      - No - Insufficient
      required: false
    - id: 36
      name: additional_support_needed
      label: Additional Support Needed
      hint: What would have helped
      type: text
      options: []
      required: false
    - id: 37
      name: section_future_events
      label: -- Future Events --
      hint: null
      type: note
      options: []
      required: false
    - id: 38
      name: interest_future_events
      label: Interest in Future Events
      hint: null
      type: select_one
      options:
      - Very interested
      - Interested
      - Neutral
      - Not very interested
      - Not interested
      required: true
    - id: 39
      name: preferred_event_types
      label: Preferred Event Types
      hint: Select all that apply
      type: select_multiple
      options:
      - Trade shows
      - Conferences
      - Community events
      - Product launches
      - Pop-up shops
      - Corporate events
      - Festivals
      - Other
      required: false
    - id: 40
      name: availability
      label: General Availability
      hint: When are you typically available
      type: select_one
      options:
      - Weekdays
      - Weekends
      - Both
      - Flexible
      required: false
    - id: 41
      name: section_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 42
      name: photos_submitted
      label: Did you submit event photos
      hint: null
      type: select_one
      options:
      - Yes - Submitted
      - Yes - Will submit later
      - No - Not applicable
      required: false
    - id: 43
      name: expense_report
      label: Expense Report Status
      hint: null
      type: select_one
      options:
      - Submitted
      - Will submit
      - No expenses
      required: false
    - id: 44
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 45
      name: supervisor_name
      label: Supervisor/Coordinator Name
      hint: null
      type: text
      options: []
      required: false
    - id: 46
      name: checkout_verified_by
      label: Check-Out Verified By
      hint: Supervisor signature
      type: text
      options: []
      required: false
