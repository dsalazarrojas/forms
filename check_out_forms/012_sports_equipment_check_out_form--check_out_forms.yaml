inputSchema:
  type: object
  properties:
    title: Sports Equipment Check Out Form
    pages:
    - id: 1
      name: check_out_equipment
      label: Check Out Equipment
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_id
      label: student_id
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: equipment_type
      label: Equipment Type
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: equipment_description
      label: Equipment Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: equipment_status
      label: Equipment Status
      hint: null
      type: select_one
      options:
      - Available
      - Checked Out
      - Reserved
      - Broken
      required: false
    - id: 7
      name: check_out_date
      label: Check Out Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
