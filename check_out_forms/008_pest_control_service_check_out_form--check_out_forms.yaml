inputSchema:
  type: object
  properties:
    title: Pest Control Service Check Out Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Ant Control
      - Bee Control
      - Pest Control
      required: true
    - id: 3
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - PayPal
      required: true
    - id: 5
      name: customer_email
      label: Customer E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: true
