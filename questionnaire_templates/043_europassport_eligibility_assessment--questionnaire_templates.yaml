inputSchema:
  type: object
  properties:
    title: EuroPassport Eligibility Assessment
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: citizenship_details
      label: Citizenship Details
      hint: null
      type: select_one
      options:
      - Irish Citizenship
      - British Citizenship
      - Spanish Citizenship
      required: true
    - id: 3
      name: residency_requirement
      label: Residency Requirement
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: work_experience
      label: Work Experience
      hint: null
      type: select_multiple
      options:
      - 6 months
      - 1 year
      - 2 years
      - 3 years
      - 4 years
      required: true
    - id: 5
      name: language_skills
      label: Language Skills
      hint: null
      type: select_multiple
      options:
      - Basic
      - Intermediate
      - Advanced
      - Proficient
      - Excellent
      required: true
    - id: 6
      name: education
      label: Education
      hint: null
      type: select_multiple
      options:
      - High school
      - Bachelor
      - Master
      - PhD
      - Doctoral
      - Diploma
      required: false
    - id: 7
      name: family_ties
      label: Family Ties
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: financial_means
      label: Financial Means
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: employment_status
      label: Employment Status
      hint: null
      type: select_multiple
      options:
      - Full-time
      - Part-time
      - Self-employed
      - Unemployed
      - Student
      required: false
    - id: 10
      name: income_source
      label: Income Source
      hint: null
      type: select_multiple
      options:
      - Employment Income
      - Self-employment Income
      - Social Security Benefits
      - Government Grant
      - Investment Income
      - Other
      required: false
    - id: 11
      name: financial_investments
      label: Financial Investments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: criminal_record
      label: Criminal Record
      hint: null
      type: select_multiple
      options:
      - 'False'
      - 'True'
      - Undisclosed
      required: false
    - id: 13
      name: health_insurance
      label: Health Insurance
      hint: null
      type: select_one
      options:
      - Private
      - Public
      - Both
      required: true
    - id: 14
      name: travel_documentation
      label: Travel Documentation
      hint: null
      type: select_multiple
      options:
      - Passport
      - ID Card
      - Both
      - Other
      required: true
    - id: 15
      name: travel_history
      label: Travel History
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: current_residency
      label: Current Residency
      hint: null
      type: select_multiple
      options:
      - Within the EU
      - Outside the EU
      - Undetermined
      - Other
      required: true
    - id: 17
      name: address
      label: Address
      hint: null
      type: note
      options: []
      required: true
    - id: 18
      name: passport_type
      label: Passport Type
      hint: null
      type: select_multiple
      options:
      - Machine Readable
      - Non-Machine Readable
      - Both
      - Other
      required: true
    - id: 19
      name: passport_number
      label: Passport Number
      hint: null
      type: number
      options: []
      required: true
    - id: 20
      name: passport_expiration_date
      label: Passport Expiration Date
      hint: null
      type: date
      options: []
      required: true
    - id: 21
      name: next_destination
      label: Next Destination
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: flight_details
      label: Flight Details
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: arrival_details
      label: Arrival Details
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: departure_details
      label: Departure Details
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
