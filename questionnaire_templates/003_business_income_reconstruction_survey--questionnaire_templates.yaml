inputSchema:
  type: object
  properties:
    title: Business Income Reconstruction Survey
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Legal name of the business
      type: text
      options: []
      required: true
    - id: 2
      name: business_type
      label: Business Type
      hint: Select your business structure
      type: select_one
      options:
      - Sole proprietorship
      - Partnership
      - Limited Liability Company
      - Corporation
      - S Corporation
      - Non-profit
      required: true
    - id: 3
      name: tax_id_number
      label: Tax ID Number
      hint: Employer Identification Number or SSN
      type: text
      options: []
      required: true
    - id: 4
      name: business_address
      label: Business Address
      hint: Full physical address of business location
      type: text
      options: []
      required: true
    - id: 5
      name: industry_classification
      label: Industry Classification
      hint: Primary industry category
      type: select_one
      options:
      - Retail trade
      - Food service
      - Professional services
      - Healthcare
      - Construction
      - Manufacturing
      - Technology
      - Real estate
      - Other
      required: true
    - id: 6
      name: reconstruction_period_start
      label: Reconstruction Period Start Date
      hint: Start date for income reconstruction period
      type: date
      options: []
      required: true
    - id: 7
      name: reconstruction_period_end
      label: Reconstruction Period End Date
      hint: End date for income reconstruction period
      type: date
      options: []
      required: true
    - id: 8
      name: pre_disruption_monthly_income
      label: Pre-Disruption Average Monthly Income
      hint: Average monthly income before disruption occurred
      type: number
      options: []
      required: true
    - id: 9
      name: income_sources
      label: Income Sources
      hint: Select all sources of business income
      type: select_multiple
      options:
      - Product sales
      - Service fees
      - Subscription revenue
      - Licensing fees
      - Rental income
      - Commission
      - Other
      required: true
    - id: 10
      name: seasonal_variation
      label: Seasonal Income Variation
      hint: Does your business experience seasonal income fluctuations
      type: select_one
      options:
      - Yes - significant variation
      - Yes - moderate variation
      - Yes - minor variation
      - No - consistent year-round
      required: true
    - id: 11
      name: peak_season_months
      label: Peak Season Months
      hint: Select your peak business months if applicable
      type: select_multiple
      options:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
      required: false
    - id: 12
      name: historical_financial_records
      label: Historical Financial Records Available
      hint: Select all available financial documentation
      type: select_multiple
      options:
      - Tax returns
      - Profit and loss statements
      - Balance sheets
      - Bank statements
      - Sales records
      - Invoices
      - Accounting software reports
      - None available
      required: true
    - id: 13
      name: comparable_business_data
      label: Comparable Business Data Available
      hint: Do you have access to industry comparable data
      type: select_one
      options:
      - Yes - industry reports
      - Yes - competitor analysis
      - Yes - trade association data
      - 'False'
      required: false
    - id: 14
      name: disruption_cause
      label: Cause of Income Disruption
      hint: What caused the income disruption
      type: select_one
      options:
      - Natural disaster
      - Pandemic or health crisis
      - Economic downturn
      - Equipment failure
      - Supply chain disruption
      - Regulatory changes
      - Other
      required: true
    - id: 15
      name: disruption_impact_description
      label: Disruption Impact Description
      hint: Describe how the disruption affected your business operations
      type: text
      options: []
      required: true
    - id: 16
      name: recovery_measures_taken
      label: Recovery Measures Taken
      hint: Select all measures taken to recover income
      type: select_multiple
      options:
      - Cost reduction
      - Staff reduction
      - Product line changes
      - Marketing increase
      - Price adjustments
      - New revenue streams
      - Loan acquisition
      - None
      required: true
    - id: 17
      name: current_monthly_income
      label: Current Monthly Income
      hint: Current average monthly income at time of survey
      type: number
      options: []
      required: true
    - id: 18
      name: projected_recovery_date
      label: Projected Recovery Date
      hint: When do you expect to return to pre-disruption income levels
      type: date
      options: []
      required: false
    - id: 19
      name: ongoing_expenses
      label: Monthly Fixed Expenses
      hint: Total monthly fixed operating expenses
      type: number
      options: []
      required: true
    - id: 20
      name: variable_expenses_percentage
      label: Variable Expenses as Percentage of Revenue
      hint: Approximate percentage of revenue spent on variable expenses
      type: number
      options: []
      required: false
    - id: 21
      name: insurance_claims_filed
      label: Insurance Claims Filed
      hint: Have you filed any insurance claims related to income loss
      type: select_one
      options:
      - Yes - approved
      - Yes - pending
      - Yes - denied
      - No - not applicable
      - No - planning to file
      required: true
    - id: 22
      name: additional_documentation
      label: Additional Documentation Notes
      hint: List any additional documentation available to support reconstruction
      type: text
      options: []
      required: false
