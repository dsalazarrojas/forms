inputSchema:
  type: object
  properties:
    title: Laptop Purchase Questionnaire
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: purchase_date
      label: Purchase Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: purchase_amount
      label: Purchase Amount
      hint: Enter the purchase amount
      type: number
      options: []
      required: false
    - id: 4
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: laptop_model
      label: Laptop Model
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: laptop_type
      label: Laptop Type
      hint: null
      type: select_multiple
      options:
      - Lenovo
      - Apple
      - HP
      - Asus
      - Dell
      - Acer
      required: false
    - id: 7
      name: laptop_condition
      label: Laptop Condition
      hint: null
      type: select_one
      options:
      - New
      - Refurbished
      - Used
      required: false
    - id: 8
      name: laptop_warranty
      label: Laptop Warranty
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: laptop_price_range
      label: Laptop Price Range
      hint: null
      type: select_one
      options:
      - $0-100
      - $100-200
      - $200-500
      required: false
    - id: 10
      name: recommended_by
      label: Recommended By
      hint: null
      type: text
      options: []
      required: false
