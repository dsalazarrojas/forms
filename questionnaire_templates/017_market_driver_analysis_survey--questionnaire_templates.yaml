inputSchema:
  type: object
  properties:
    title: market_driver_analysis_survey
    pages:
    - id: 1
      name: driver_goals
      label: What are the goals of the driver?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 2
      name: priority
      label: What is the priority of the driver's impact on the customer's purchasing
        decision?
      hint: null
      type: select_one
      options:
      - Very High
      - High
      - Medium
      - Low
      required: true
    - id: 3
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: email
      label: What is the customer's email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: What is the customer's phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: driver_characteristics
      label: What are the characteristics of the driver?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: market_drivers
      label: What are the drivers of the market?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: driver_impact
      label: What is the driver's impact on the customer's purchasing decision?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: notes_1
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: notes_2
      label: More Notes
      hint: null
      type: note
      options: []
      required: false
