inputSchema:
  type: object
  properties:
    title: CPAP Intolerance Assessment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: patient_id
      label: Patient ID or Medical Record Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: assessment_date
      label: Date of Assessment
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: cpap_start_date
      label: Date CPAP Therapy Started
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: cpap_duration
      label: How Long Have You Been Using CPAP
      hint: null
      type: select_one
      options:
      - Less than 1 week
      - 1-2 weeks
      - 2-4 weeks
      - 1-3 months
      - 3-6 months
      - More than 6 months
      required: true
    - id: 9
      name: therapy_tolerance
      label: Overall Tolerance of CPAP Therapy
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Cannot tolerate
      required: true
    - id: 10
      name: mask_issue
      label: Difficulty with Mask Fit or Comfort
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: mask_problem_type
      label: Type of Mask Problem
      hint: Select all that apply
      type: select_multiple
      options:
      - Mask too tight
      - Mask too loose
      - Skin irritation
      - Pressure sores
      - Uncomfortable strap
      - Leaks around mask
      - Other
      required: false
    - id: 12
      name: claustrophobia
      label: Claustrophobia or Anxiety with Mask
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: nasal_congestion
      label: Nasal Congestion or Irritation
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: dry_mouth_throat
      label: Dry Mouth or Throat
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: eye_discomfort
      label: Eye Discomfort or Dryness
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: noise_disturbance
      label: Noise Disturbance from Machine
      hint: null
      type: select_one
      options:
      - Yes, very noisy
      - Somewhat noisy
      - Not noisy
      required: false
    - id: 17
      name: adjustment_difficulty
      label: Difficulty with Pressure Adjustments
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: nightly_usage
      label: Nights Per Week Using CPAP
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: physician_contact
      label: Have You Contacted Physician About Issues
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments or Concerns
      hint: Provide details about your experience
      type: text
      options: []
      required: false
