inputSchema:
  type: object
  properties:
    title: Refresher Pre Test Assessment
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: This is a series of questions to help us understand your current level
        of knowledge and confidence in the organization.
      type: note
      options: []
      required: false
    - id: 2
      name: section1
      label: Section 1
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: question1
      label: What is your role in the organization?
      hint: Please be specific about your job title and responsibilities.
      type: select_one
      options:
      - CEO
      - Manager
      - Team Leader
      - Other (please specify)
      required: true
    - id: 4
      name: question1_answer
      label: How long have you been in the role?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: question2
      label: What type of training have you received?
      hint: Please select all relevant options
      type: select_multiple
      options:
      - Technical Training
      - Soft Skills Training
      - Leadership Training
      - Other (please specify)
      required: true
    - id: 6
      name: section2
      label: Section 2
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: question4
      label: How do you feel about your current level of knowledge?
      hint: Please select one of the options
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 8
      name: question4_answer
      label: How do you feel about your current level of confidence?
      hint: Please describe your confidence level
      type: text
      options: []
      required: true
    - id: 9
      name: section3
      label: Section 3
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: question5
      label: Do you feel like you need additional training?
      hint: Please select one of the options
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: question5_answer
      label: What type of training do you need?
      hint: Please specify the type of training
      type: text
      options: []
      required: true
    - id: 12
      name: question6
      label: Would you like to receive more information about upcoming training events?
      hint: Please select one of the options
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: question6_answer
      label: Do you need help with any other specific topic?
      hint: Please specify the topic
      type: text
      options: []
      required: true
    - id: 14
      name: question7
      label: Do you have any other comments or suggestions?
      hint: Please provide your feedback
      type: text
      options: []
      required: true
    - id: 15
      name: signature
      label: Signature
      hint: Please add your name and date
      type: text
      options: []
      required: false
    - id: 16
      name: question8
      label: Question8
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 17
      name: question8_answer
      label: Question8 Answer
      hint: Please specify the topic
      type: text
      options: []
      required: false
    - id: 18
      name: question9
      label: Question9
      hint: null
      type: text
      options: []
      required: false
