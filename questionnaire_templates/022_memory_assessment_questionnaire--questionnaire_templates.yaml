inputSchema:
  type: object
  properties:
    title: Memory Assessment Questionnaire
    pages:
    - id: 1
      name: user_name
      label: user_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_last_visit
      label: date_of_last_visit
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: memory_score
      label: memory_score
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: rating_of_focal_points
      label: rating_of_focal_points
      hint: null
      type: select_one
      options:
      - 0-5
      - 6-10
      - 11-15
      - 16-20
      - 21-25
      required: true
    - id: 5
      name: rating_of_distractions
      label: rating_of_distractions
      hint: null
      type: select_multiple
      options:
      - No distractions
      - Moderate distractions
      - Severe distractions
      required: true
    - id: 6
      name: rating_of_focus
      label: rating_of_focus
      hint: null
      type: select_one
      options:
      - Very focused
      - Moderately focused
      - Not very focused
      required: true
    - id: 7
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
