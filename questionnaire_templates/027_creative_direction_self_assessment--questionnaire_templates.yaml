inputSchema:
  type: object
  properties:
    title: Creative Direction Self Assessment
    pages:
    - id: 1
      name: intro_page
      label: Intro
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: job_role
      label: Job role
      hint: null
      type: select_one
      options:
      - Creative Director
      - Art Director
      - Senior Art Director
      - Junior Art Director
      - Art Assistant Director
      required: true
    - id: 4
      name: years_experience
      label: Years of experience
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: work_approach
      label: Work approach
      hint: null
      type: select_one
      options:
      - Creativity
      - Efficiency
      - Quality
      - Effectiveness
      - Time Management
      required: true
    - id: 6
      name: main_goals
      label: Main goals
      hint: null
      type: select_multiple
      options:
      - Innovation
      - Originality
      - Quality
      - Timeliness
      - Creativity
      required: true
    - id: 7
      name: values
      label: Values
      hint: null
      type: select_multiple
      options:
      - Innovation
      - Originality
      - Quality
      - Timeliness
      - Time Management
      required: true
    - id: 8
      name: time_management
      label: Time management skills
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: feedback
      label: Feedback
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: communication
      label: Communication skills
      hint: null
      type: select_multiple
      options:
      - Verbal
      - Non-Verbal
      - Written
      - Verbal and Non-Verbal
      - Verbal and Written
      required: true
    - id: 11
      name: adaptability
      label: Adaptability
      hint: null
      type: select_one
      options:
      - Organization
      - Teamwork
      - Communication
      - Leadership
      - Adaptability
      required: true
    - id: 12
      name: final_page
      label: Final
      hint: null
      type: note
      options: []
      required: false
