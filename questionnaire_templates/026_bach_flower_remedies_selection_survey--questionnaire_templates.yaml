inputSchema:
  type: object
  properties:
    title: Bach Flower Remedies Selection Survey
    pages:
    - id: 1
      name: client_name
      label: Full Name
      hint: Your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: For sending remedy recommendations
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Contact number for consultation
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 5
      name: primary_concern
      label: Primary Emotional Concern
      hint: What brings you to seek flower remedies
      type: text
      options: []
      required: true
    - id: 6
      name: current_mood
      label: Current Overall Mood
      hint: How would you describe your mood lately
      type: select_one
      options:
      - Very positive
      - Somewhat positive
      - Neutral
      - Somewhat negative
      - Very negative
      required: true
    - id: 7
      name: fear_symptoms
      label: Fear or Anxiety Symptoms
      hint: Select any that apply
      type: select_multiple
      options:
      - Fear of specific things
      - Fear of unknown
      - Panic or terror
      - Anxiety about health
      - Anxiety about others
      - Nightmares
      - None
      required: true
    - id: 8
      name: uncertainty_symptoms
      label: Uncertainty or Indecision
      hint: Select any that apply
      type: select_multiple
      options:
      - Difficulty making decisions
      - Feeling lost
      - Lack of direction
      - Doubting yourself
      - Following others lead
      - None
      required: true
    - id: 9
      name: present_mood_symptoms
      label: Present Mood Issues
      hint: Select any that apply
      type: select_multiple
      options:
      - Despair or hopelessness
      - Depression
      - Guilt
      - Shame
      - Grief
      - Anger
      - Jealousy
      - None
      required: true
    - id: 10
      name: overconcern_symptoms
      label: Overconcern for Others
      hint: Select any that apply
      type: select_multiple
      options:
      - Excessive worry about loved ones
      - Overprotective
      - Fear something will happen
      - Controlling behavior
      - Cannot let go
      - None
      required: true
    - id: 11
      name: sensitivity_symptoms
      label: Sensitivity to Influence
      hint: Select any that apply
      type: select_multiple
      options:
      - Easily influenced by others
      - Mood swings
      - Absorb others emotions
      - Need solitude often
      - Feel misunderstood
      - None
      required: true
    - id: 12
      name: despondency_symptoms
      label: Despondency or Despair
      hint: Select any that apply
      type: select_multiple
      options:
      - Feel unworthy
      - Self-critical
      - Feel like a burden
      - Perfectionist tendencies
      - Feel inferior
      - None
      required: true
    - id: 13
      name: overwork_symptoms
      label: Overwork or Exhaustion
      hint: Select any that apply
      type: select_multiple
      options:
      - Physical exhaustion
      - Mental fatigue
      - Burned out
      - Cannot rest
      - Workaholic tendencies
      - None
      required: true
    - id: 14
      name: sleep_patterns
      label: Sleep Patterns
      hint: How is your sleep quality
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 15
      name: energy_level
      label: Daily Energy Level
      hint: Rate your typical energy
      type: select_one
      options:
      - Very high
      - High
      - Moderate
      - Low
      - Very low
      required: true
    - id: 16
      name: stress_level
      label: Current Stress Level
      hint: Rate your stress 1 to 10
      type: number
      options: []
      required: true
    - id: 17
      name: previous_remedies
      label: Previous Flower Remedy Experience
      hint: Have you used Bach remedies before
      type: select_one
      options:
      - Yes, regularly
      - Yes, occasionally
      - No, first time
      required: true
    - id: 18
      name: other_treatments
      label: Other Treatments Currently Using
      hint: List any therapies or medications
      type: text
      options: []
      required: false
    - id: 19
      name: wellness_goals
      label: Wellness Goals
      hint: What do you hope to achieve
      type: text
      options: []
      required: true
    - id: 20
      name: consultation_preference
      label: Consultation Preference
      hint: How would you like to proceed
      type: select_one
      options:
      - Phone consultation
      - Video call
      - Email recommendations
      - In-person visit
      required: true
    - id: 21
      name: additional_notes
      label: Additional Notes
      hint: Any other information to share
      type: text
      options: []
      required: false
