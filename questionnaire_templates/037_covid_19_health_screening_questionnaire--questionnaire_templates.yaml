inputSchema:
  type: object
  properties:
    title: COVID 19 Health Screening Questionnaire
    pages:
    - id: 1
      name: respondent_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: respondent_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: screening_date
      label: Screening Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: section_header_1
      label: -- Symptom Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: fever_past_14_days
      label: Fever in Past 14 Days
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: cough
      label: Persistent Cough
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: difficulty_breathing
      label: Difficulty Breathing or Shortness of Breath
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: sore_throat
      label: Sore Throat
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: loss_taste_smell
      label: Loss of Taste or Smell
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: muscle_aches
      label: Muscle or Body Aches
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: section_header_2
      label: -- Exposure Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: close_contact_confirmed
      label: Close Contact with Confirmed COVID-19 Case
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 14
      name: contact_timeframe
      label: If yes, when was the contact
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: travel_to_affected_area
      label: Travel to COVID-19 Affected Area
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 16
      name: travel_location
      label: Location of Travel
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: section_header_3
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: chronic_conditions
      label: Chronic Health Conditions
      hint: Select all that apply
      type: select_multiple
      options:
      - Diabetes
      - Hypertension
      - Heart disease
      - Lung disease
      - Kidney disease
      - Immunocompromised
      - None
      required: true
    - id: 19
      name: current_medications
      label: Currently Taking Medications
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: section_header_4
      label: -- Vaccination Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated with booster
      - Fully vaccinated without booster
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to disclose
      required: true
    - id: 22
      name: section_header_5
      label: -- Screening Result --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: screening_result
      label: Screening Result
      hint: null
      type: select_one
      options:
      - Low risk - cleared for entry
      - Moderate risk - further assessment needed
      - High risk - refer to healthcare provider
      required: true
    - id: 24
      name: additional_notes
      label: Additional Notes or Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: staff_signature
      label: Screening Staff Name
      hint: null
      type: text
      options: []
      required: false
