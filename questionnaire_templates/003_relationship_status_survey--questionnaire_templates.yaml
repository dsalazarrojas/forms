inputSchema:
  type: object
  properties:
    title: Relationship Status Survey
    pages:
    - id: 1
      name: relationship_status
      label: Single
      hint: null
      type: select_one
      options:
      - Single
      - Married
      - In a relationship
      - Other, specify
      required: false
    - id: 2
      name: relationship_duration
      label: Relationship Duration
      hint: null
      type: select_one
      options:
      - 1-2 months
      - 2-6 months
      - 6 months - 1 year
      - Over 1 year
      required: false
    - id: 3
      name: relationship_type
      label: Relationship Type
      hint: null
      type: select_one
      options:
      - Romantic
      - Family
      - Friend
      - Other, specify
      required: false
    - id: 4
      name: relationship_status_change
      label: Relationship Status Change
      hint: null
      type: select_one
      options:
      - Started dating
      - Broke up
      - Got married
      - Moved in together
      - Moved apart
      required: false
    - id: 5
      name: relationship_satisfaction
      label: Relationship Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: relationship_satisfaction_scale
      label: Relationship Satisfaction Scale
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
