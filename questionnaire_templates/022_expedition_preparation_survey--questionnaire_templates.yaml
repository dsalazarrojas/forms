inputSchema:
  type: object
  properties:
    title: Expedition Preparation Survey
    pages:
    - id: 1
      name: participant_experience
      label: What kind of adventure are you going on?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: emergency_contacts
      label: Who should we contact in case of an emergency?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 3
      name: health_details
      label: Do you have any health issues we should know about?
      hint: null
      type: note
      options: []
      required: true
    - id: 4
      name: medical_history
      label: Medical history
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: allergies
      label: Do you have any allergies?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 6
      name: medications
      label: Are you taking any medications?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 7
      name: trip_itinerary
      label: Trip itinerary
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_contact_relationship
      label: What is the relationship between you and your emergency contact?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_contact_name
      label: Emergency contact name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_phone
      label: Emergency contact phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_contact_email
      label: Emergency contact email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: emergency_contact_relationship
      label: How do you know this person?
      hint: null
      type: text
      options: []
      required: true
