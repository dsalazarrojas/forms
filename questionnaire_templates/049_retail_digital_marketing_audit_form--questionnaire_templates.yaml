inputSchema:
  type: object
  properties:
    title: Retail Digital Marketing Audit Form
    pages:
    - id: 1
      name: retail_channels
      label: What are your company's main retail channels?
      hint: null
      type: select_multiple
      options:
      - Online Store
      - Social Media
      - Email
      required: true
    - id: 2
      name: channels_performance
      label: How would you rate the performance of your retail channels?
      hint: null
      type: select_multiple
      options:
      - Sales
      - Engagement
      - Conversion Rate
      required: true
    - id: 3
      name: performance_metrics
      label: Which KPIs do you use to measure performance?
      hint: null
      type: select_multiple
      options:
      - Sales
      - Engagement
      - Conversion Rate
      required: true
    - id: 4
      name: sales_volume
      label: What is your current sales volume?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: conversion_rate
      label: What is your conversion rate?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: sales_channel
      label: Which sales channel has the highest conversion rate?
      hint: null
      type: select_one
      options:
      - Online Store
      - Social Media
      - Email
      required: true
    - id: 7
      name: target_audience
      label: What is your target audience segment?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: target_audience_characteristics
      label: What are the key characteristics of your target audience?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: sales_goal
      label: What is your primary goal for sales performance?
      hint: null
      type: select_one
      options:
      - Increase sales
      - Improve engagement
      - Increase brand awareness
      required: true
    - id: 10
      name: sales_volume_rate
      label: How would you rate the current sales volume?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: conversion_goal
      label: What is your primary goal for conversion rate?
      hint: null
      type: select_one
      options:
      - Increase conversion rate
      - Improve engagement
      - Increase brand awareness
      required: true
