inputSchema:
  type: object
  properties:
    title: Military Intelligence Quiz
    pages:
    - id: 1
      name: user_name
      label: Enter your name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: military_id
      label: Military ID
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: rank
      label: Rank
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: department
      label: Department
      hint: null
      type: select_one
      options:
