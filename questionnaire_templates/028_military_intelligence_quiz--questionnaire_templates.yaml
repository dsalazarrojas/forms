      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 9
      name: military_branch
      label: Military Branch
      hint: null
      type: select_one
      options:
      - Army
      - Navy
      - Air Force
      required: true
    - id: 10
      name: military_position
      label: Military Position
      hint: null
      type: select_one
      options:
      - Officer
      - NCO
      - Enlisted
      required: true
    - id: 11
      name: training_programs
      label: Training Programs
      hint: null
      type: select_multiple
      options:
      - Basic Training
      - Advanced Training
      - Specialized Training
      required: false
    - id: 12
      name: submitted_on
      label: Submitted On
      hint: null
      type: date
      options: []
      required: true
