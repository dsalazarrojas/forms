inputSchema:
  type: object
  properties:
    title: Application Interface User Feedback Questionnaire
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: user_id
      label: User ID or Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: usage_duration
      label: How long have you been using this application?
      hint: null
      type: select_one
      options:
      - Less than 1 week
      - 1-4 weeks
      - 1-3 months
      - 3-6 months
      - More than 6 months
      required: true
    - id: 4
      name: user_type
      label: User Type
      hint: null
      type: select_one
      options:
      - Free tier
      - Premium subscriber
      - Enterprise user
      - Trial user
      required: false
    - id: 5
      name: interface_experience
      label: -- Interface Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: ease_of_navigation
      label: How easy is it to navigate the interface?
      hint: null
      type: select_one
      options:
      - Very easy
      - Easy
      - Neutral
      - Difficult
      - Very difficult
      required: true
    - id: 7
      name: design_clarity
      label: How clear and understandable is the design?
      hint: null
      type: select_one
      options:
      - Very clear
      - Clear
      - Average
      - Unclear
      - Very unclear
      required: true
    - id: 8
      name: button_label_clarity
      label: Are button labels and icons clear?
      hint: null
      type: select_one
      options:
      - Very clear
      - Clear
      - Somewhat clear
      - Not clear
      - Confusing
      required: false
    - id: 9
      name: menu_accessibility
      label: How accessible are the menus and options?
      hint: null
      type: select_one
      options:
      - Highly accessible
      - Accessible
      - Neutral
      - Difficult to access
      - Very difficult
      required: false
    - id: 10
      name: visual_appeal
      label: How visually appealing is the interface?
      hint: null
      type: select_one
      options:
      - Very appealing
      - Appealing
      - Average
      - Not appealing
      - Unattractive
      required: false
    - id: 11
      name: feature_satisfaction
      label: -- Feature Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: feature_usefulness
      label: Which features do you find most useful?
      hint: Select all that apply
      type: select_multiple
      options:
      - Search functionality
      - Reporting tools
      - Dashboard widgets
      - Customization options
      - Integration features
      - Mobile app functionality
      required: false
    - id: 13
      name: missing_features
      label: What features would you like to see added?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: performance_rating
      label: -- Performance Rating --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: loading_speed
      label: How would you rate the loading speed?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Slow
      - Very slow
      required: true
    - id: 16
      name: responsiveness
      label: How responsive is the interface to your actions?
      hint: null
      type: select_one
      options:
      - Very responsive
      - Responsive
      - Average
      - Sluggish
      - Very sluggish
      required: true
    - id: 17
      name: overall_satisfaction
      label: Overall, how satisfied are you with the interface?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 18
      name: improvement_suggestions
      label: Suggestions for improvement
      hint: null
      type: text
      options: []
      required: false
