      name: participant_information_section
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Name
      hint: Your name (optional)
      type: text
      options: []
      required: false
    - id: 3
      name: educational_background
      label: Educational Background
      hint: What is your highest level of education in biology/genetics
      type: select_one
      options: ["High School", "Undergraduate Degree", "Graduate Degree", "PhD or Equivalent", "Professional Certification", "Self-taught", "Other"]
      required: true
    - id: 4
      name: professional_role
      label: Professional Role
      hint: What is your role in the field of biology/genetics
      type: select_one
      options: ["Student", "Researcher", "Educator", "Healthcare Professional", "Industry Professional", "Policy Maker", "Other"]
      required: true
    - id: 5
