      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: primary_area_of_interest
      label: Primary Area of Interest
      hint: Which area of genetics interests you most
      type: select_one
      options: ["Medical genetics", "Evolutionary genetics", "Population genetics", "Molecular genetics", "Behavioral genetics", "Agricultural genetics", "Synthetic biology"]
