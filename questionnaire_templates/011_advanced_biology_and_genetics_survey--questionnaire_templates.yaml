      label: -- Genetics Knowledge Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: gene_expression_understanding
      label: Gene Expression Understanding
      hint: How well do you understand gene expression mechanisms
      type: select_one
      options: ["Expert level", "Advanced", "Intermediate", "Basic", "Little to no knowledge"]
      required: true
    - id: 7
      name: crisper_cas9_knowledge
      label: CRISPR-Cas9 Knowledge
      hint: Are you familiar with CRISPR-Cas9 gene editing technology
      type: select_one
      options: ["Very familiar", "Somewhat familiar", "Heard of it", "Not familiar"]
