inputSchema:
  type: object
  properties:
    title: Identify Your Core Emotional Pain
    pages:
    - id: 1
      name: core_emotional_pain
      label: Your Core Emotional Pain
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: core_emotional_pain_description
      label: Describe your current emotional pain
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: emotional_pain_frequency
      label: How often does it occur?
      hint: null
      type: select_one
      options:
      - Always
      - Frequently
      - Rarely
      - Never
      required: false
    - id: 4
      name: emotional_pain_intensity
      label: What is the intensity of your emotional pain?
      hint: null
      type: select_one
      options:
      - Mild
      - Moderate
      - Severe
      required: false
    - id: 5
      name: pain_areas
      label: Which areas of pain are you experiencing?
      hint: null
      type: select_multiple
      options:
      - Physical
      - Emotional
      - Mental
      - Spiritual
      - Financial
      - Relationship
      - Work
      - Other (please specify)
      required: false
    - id: 6
      name: pain_reason
      label: Why are you experiencing this emotional pain?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: self_reflection
      label: How do you plan to address it?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: pain_reduction
      label: How has it affected your life?
      hint: null
      type: select_one
      options:
      - Significantly
      - Moderately
      - Mildly
      - Not at all
      required: false
    - id: 9
      name: life_areas
      label: Which areas of life have been affected?
      hint: null
      type: select_multiple
      options:
      - Work
      - Relationships
      - Finances
      - Health
      - Hobbies
      - Leisure
      - Travel
      - Education
      - Career
      - Personal growth
      - Other (please specify)
      required: false
    - id: 10
      name: pain_assessment
      label: How do you think the pain will affect you in the next 6 months?
      hint: null
      type: select_one
      options:
      - Much worse
      - A bit worse
      - The same
      - A bit better
      - Much better
      required: false
    - id: 11
      name: emotional_pain_impact
      label: What impact does your emotional pain have on your relationships?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: emotional_pain_support
      label: Do you have support from others?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: emotional_pain_plan
      label: What plan do you have to address it?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: pain_reduction_goal
      label: What would you like to achieve?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: core_emotional_pain_score
      label: On a scale of 1-10, how bad does it feel?
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: self_reflection_frequency
      label: How often do you reflect on it?
      hint: null
      type: select_one
      options:
      - Often
      - Rarely
      - Never
      required: false
