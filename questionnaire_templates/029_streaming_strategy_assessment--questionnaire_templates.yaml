inputSchema:
  type: object
  properties:
    title: Streaming Strategy Assessment
    pages:
    - id: 1
      name: intro
      label: Streaming Strategy Assessment form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: streaming_goals
      label: What are your goals as a streamer?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: streaming_frequency
      label: Frequency of streaming
      hint: How often do you stream?
      type: select_one
      options:
      - Every day
      - Every other day
      - 2-3 times a week
      required: false
    - id: 4
      name: target_audience
      label: Target audience
      hint: null
      type: select_one
      options:
      - Mainstream creators
      - Niche audience
      - Small community
      required: false
    - id: 5
      name: stream_type
      label: Type of streams
      hint: null
      type: select_multiple
      options:
      - Gaming
      - Art
      - Music
      - Talk shows
      - Cooking
      - Sports
      required: false
