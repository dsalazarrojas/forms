        hint: How well do you understand analogous color schemes
        type: select_one
        options:
          - Very Well
          - Somewhat Well
          - Neutral
          - Not Very Well
          - Not At All
        required: true
      - id: 9
        name: color_temperature
        label: Understanding of Color Temperature
        hint: Warm vs cool colors knowledge
        type: select_one
        options:
          - Very Well
          - Somewhat Well
          - Neutral
          - Not Very Well
          - Not At All
        required: true
