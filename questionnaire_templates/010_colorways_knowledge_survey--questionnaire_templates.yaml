inputSchema:
  type: object
  properties:
    title: Colorways Knowledge Survey
    pages:
      - id: 1
        name: respondent_name
        label: Respondent Name
        hint: Your name - optional
        type: text
        options: []
        required: false
      - id: 2
        name: respondent_email
        label: Email Address
        hint: For survey results if desired
        type: email
        options: []
        required: false
      - id: 3
        name: role
        label: Your Role
        hint: What best describes your profession
        type: select_one
        options:
          - Designer
          - Developer
          - Educator
          - Student
          - Creative Professional
          - Hobbyist
          - Other
        required: true
      - id: 4
        name: experience_level
        label: Experience Level
        hint: Years of experience with color theory
        type: select_one
        options:
          - Beginner (0-1 years)
          - Intermediate (2-5 years)
          - Advanced (6-10 years)
          - Expert (10+ years)
        required: true
      - id: 5
        name: section_header_color_theory
        label: -- Color Theory Knowledge --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: color_wheel_understanding
        label: Color Wheel Understanding
        hint: Rate your understanding of the color wheel
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - No Knowledge
        required: true
      - id: 7
        name: complementary_colors
        label: Understanding of Complementary Colors
        hint: How well do you understand complementary colors
        type: select_one
        options:
          - Very Well
          - Somewhat Well
          - Neutral
          - Not Very Well
          - Not At All
        required: true
      - id: 8
