inputSchema:
  type: object
  properties:
    title: Contact Center Operations Assessment Survey
    pages:
      - id: 1
        name: section_introduction
        label: -- Assessment Introduction --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: assessor_name
        label: Assessor name
        hint: Your name
        type: text
        options: []
        required: true
      - id: 3
        name: assessment_date
        label: Assessment date
        hint: Date of this assessment
        type: date
        options: []
        required: true
      - id: 4
        name: center_location
        label: Center location
        hint: City or site name
        type: text
        options: []
        required: false
      - id: 5
        name: average_handle_time_satisfaction
        label: Satisfaction with average handle time
        hint: Rate how satisfied you are with handling times
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 6
        name: training_quality
        label: Training quality for agents
        hint: Rate current training effectiveness
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 7
        name: communication_tools_effectiveness
        label: Communication tools effectiveness
        hint: How effective are the current tools for agent communication
        type: select_one
        options:
          - Very effective
          - Effective
          - Somewhat effective
          - Not effective
        required: true
      - id: 8
        name: common_operational_issues
        label: Common operational issues
        hint: List recurring issues or obstacles
        type: text
        options: []
        required: false
      - id: 9
        name: staffing_adequacy
        label: Staffing adequacy
        hint: Current staffing levels meet demand
        type: select_one
        options:
          - Always
          - Most of the time
          - Sometimes
          - Rarely
        required: true
      - id: 10
        name: top_improvement_priorities
        label: Top improvement priorities
        hint: Select up to three priorities for improvement
        type: select_multiple
        options:
          - Training and coaching
          - Process simplification
          - Technology upgrades
          - Workforce planning
          - Quality assurance
        required: true
      - id: 11
        name: recommended_next_steps
        label: Recommended next steps
        hint: Suggested actions to address assessment findings
        type: text
        options: []
        required: false
      - id: 12
        name: follow_up_contact
        label: Follow up contact email
        hint: Email for receiving assessment report
        type: email
        options: []
        required: false
