inputSchema:
  type: object
  properties:
    title: Beginning Of The Year Student Questionnaire
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: student_age
      label: Age
      hint: How old are you
      type: number
      options: []
      required: true
    - id: 3
      name: grade_level
      label: Grade Level
      hint: What grade are you in
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 4
      name: teacher_name
      label: Teacher Name
      hint: What is your teacher name
      type: text
      options: []
      required: true
    - id: 5
      name: favorite_subject
      label: Favorite Subject
      hint: What is your favorite subject in school
      type: select_one
      options:
      - Math
      - Reading or Language Arts
      - Science
      - Social Studies or History
      - Art
      - Music
      - Physical Education
      - Computer or Technology
      - Foreign Language
      - Other
      required: true
    - id: 6
      name: favorite_subject_reason
      label: Why Is This Your Favorite
      hint: Explain why you like this subject
      type: text
      options: []
      required: false
    - id: 7
      name: challenging_subject
      label: Most Challenging Subject
      hint: What subject do you find most difficult
      type: select_one
      options:
      - Math
      - Reading or Language Arts
      - Science
      - Social Studies or History
      - Art
      - Music
      - Physical Education
      - Computer or Technology
      - Foreign Language
      - None
      required: true
    - id: 8
      name: learning_style
      label: How Do You Learn Best
      hint: Select all that apply
      type: select_multiple
      options:
      - Reading books
      - Listening to teacher
      - Watching videos
      - Doing hands-on activities
      - Working in groups
      - Working alone
      - Practicing repeatedly
      - Using technology
      required: true
    - id: 9
      name: homework_habits
      label: Homework Habits
      hint: How do you approach homework
      type: select_one
      options:
      - I do it right away
      - I do it after some break time
      - I need reminders
      - I often forget
      - I need help from family
      required: true
    - id: 10
      name: reading_enjoyment
      label: Do You Enjoy Reading
      hint: How do you feel about reading
      type: select_one
      options:
      - I love reading
      - I like reading sometimes
      - It is okay
      - I do not like reading much
      - I dislike reading
      required: true
    - id: 11
      name: favorite_books
      label: Favorite Books or Series
      hint: What do you like to read
      type: text
      options: []
      required: false
    - id: 12
      name: math_confidence
      label: Math Confidence
      hint: How confident are you in math
      type: select_one
      options:
      - Very confident
      - Somewhat confident
      - Neutral
      - Not very confident
      - Not confident at all
      required: true
    - id: 13
      name: hobbies
      label: Hobbies and Interests
      hint: What do you like to do for fun
      type: select_multiple
      options:
      - Sports
      - Reading
      - Video Games
      - Drawing or Art
      - Music
      - Dancing
      - Building or LEGO
      - Science Experiments
      - Writing Stories
      - Spending Time with Friends
      - Watching TV or Movies
      - Outdoor Activities
      - Other
      required: true
    - id: 14
      name: extracurricular
      label: Extracurricular Activities
      hint: What activities are you involved in
      type: text
      options: []
      required: false
    - id: 15
      name: best_friend
      label: Best Friend in Class
      hint: Who is your best friend in class
      type: text
      options: []
      required: false
    - id: 16
      name: classroom_preference
      label: Classroom Preference
      hint: Where do you like to sit
      type: select_one
      options:
      - Front of class
      - Middle of class
      - Back of class
      - Near friends
      - Near teacher
      - Quiet area
      - No preference
      required: true
    - id: 17
      name: group_work
      label: Group Work Preference
      hint: How do you feel about group projects
      type: select_one
      options:
      - I love working in groups
      - I like it sometimes
      - It is okay
      - I prefer working alone
      - I dislike group work
      required: true
    - id: 18
      name: goals_this_year
      label: Goals for This Year
      hint: What do you want to accomplish
      type: text
      options: []
      required: false
    - id: 19
      name: worried_about
      label: Worries About This Year
      hint: Is there anything you are worried about
      type: text
      options: []
      required: false
    - id: 20
      name: excited_about
      label: Excited About This Year
      hint: What are you most excited about
      type: text
      options: []
      required: false
    - id: 21
      name: how_teacher_can_help
      label: How Can Your Teacher Help You
      hint: What would help you learn better
      type: text
      options: []
      required: false
    - id: 22
      name: something_special
      label: Something Special About You
      hint: What makes you unique
      type: text
      options: []
      required: false
    - id: 23
      name: favorite_memory
      label: Favorite School Memory
      hint: Share a happy school memory
      type: text
      options: []
      required: false
    - id: 24
      name: summer_activity
      label: Best Thing About Your Summer
      hint: What was the best part of your summer
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Anything Else to Share
      hint: Is there anything else you want your teacher to know
      type: text
      options: []
      required: false
