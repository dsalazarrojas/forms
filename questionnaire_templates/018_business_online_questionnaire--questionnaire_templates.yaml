inputSchema:
  type: object
  properties:
    title: Business Online Questionnaire
    pages:
    - id: 1
      name: client_name
      label: Your Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your business name
      type: text
      options: []
      required: true
    - id: 5
      name: business_established
      label: Year Business Established
      hint: When did you start?
      type: number
      options: []
      required: false
    - id: 6
      name: current_annual_revenue
      label: Current Annual Revenue
      hint: Approximate revenue
      type: select_one
      options:
      - Under $50,000
      - $50,000 - $100,000
      - $100,000 - $500,000
      - $500,000 - $1,000,000
      - Over $1,000,000
      required: true
    - id: 7
      name: revenue_growth_rate
      label: Year-over-Year Revenue Growth
      hint: Your growth rate (%)
      type: number
      options: []
      required: false
    - id: 8
      name: primary_challenge
      label: Primary Business Challenge
      hint: What is your biggest challenge?
      type: text
      options: []
      required: true
    - id: 9
      name: growth_opportunity
      label: Greatest Growth Opportunity
      hint: Where is the most potential?
      type: text
      options: []
      required: true
    - id: 10
      name: customer_acquisition_method
      label: Primary Customer Acquisition Method
      hint: How do you get customers?
      type: select_one
      options:
      - Direct Sales
      - Marketing/Advertising
      - Referrals
      - Digital/Online
      - Partnerships
      - Other
      required: true
    - id: 11
      name: current_marketing_spend
      label: Current Monthly Marketing Spend
      hint: Approximate marketing budget
      type: select_one
      options:
      - Under $500
      - $500 - $2,000
      - $2,000 - $5,000
      - $5,000 - $10,000
      - Over $10,000
      required: false
    - id: 12
      name: digital_presence
      label: How Strong is Your Digital Presence?
      hint: Rate digital presence (1-5)
      type: number
      options: []
      required: true
    - id: 13
      name: team_size
      label: Number of Team Members
      hint: Current employee count
      type: number
      options: []
      required: true
    - id: 14
      name: hiring_plans
      label: Are You Planning to Hire?
      hint: Plans for growth
      type: select_one
      options:
      - Yes, Next 3 Months
      - Yes, Next 6 Months
      - Maybe Later
      - No Plans
      required: false
    - id: 15
      name: technology_infrastructure
      label: Technology Infrastructure Adequacy
      hint: Is your tech adequate? (1-5)
      type: number
      options: []
      required: true
    - id: 16
      name: strategic_direction
      label: 5-Year Strategic Direction
      hint: Where do you want to be?
      type: text
      options: []
      required: true
    - id: 17
      name: competitive_advantage
      label: Your Competitive Advantage
      hint: What sets you apart?
      type: text
      options: []
      required: true
    - id: 18
      name: business_goals_next_year
      label: Business Goals for Next Year
      hint: Specific objectives
      type: text
      options: []
      required: false
    - id: 19
      name: support_areas
      label: Areas Where You Need Support
      hint: What help do you need?
      type: select_multiple
      options:
      - Marketing Strategy
      - Sales Training
      - Financial Management
      - Operations
      - Technology
      - Leadership Coaching
      - Networking
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Anything else?
      type: text
      options: []
      required: false
