inputSchema:
  type: object
  properties:
    title: Employee Motivation Research Application Form
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_position
      label: Employee Position
      hint: null
      type: select_one
      options:
      - Manager
      - Director
      - Supervisor
      - Team Member
      required: false
    - id: 3
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: motivation_factors
      label: Motivation Factors
      hint: null
      type: select_multiple
      options:
      - Motivation
      - Engagement
      - Feedback
      required: false
    - id: 5
      name: engagement_factors
      label: Engagement Factors
      hint: null
      type: select_multiple
      options:
      - Engagement
      - Motivation
      - Feedback
      required: false
    - id: 6
      name: feedback_frequency
      label: Feedback Frequency
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: feedback_source
      label: Feedback Source
      hint: null
      type: select_one
      options:
      - Colleagues
      - Manager
      - Supervisor
      - Self
      required: false
    - id: 8
      name: feedback_channel
      label: Feedback Channel
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - In-Person
      required: false
    - id: 9
      name: job_satisfaction
      label: Job Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
