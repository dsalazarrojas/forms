      type: select_one
      options:
      - '{''label'': ''Excellent''}'
      - '{''label'': ''Good''}'
      - '{''label'': ''Fair''}'
      required: true
    - id: 3
      name: itsm_platform_skills_assessment_3
      label: itsm-platform-proficiency-training
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''hiring''}'
      - '{''label'': ''internal-benchmarking''}'
      - '{''label'': ''training''}'
      required: true
    - id: 4
      name: itsm_platform_skills_assessment_4
      label: itsm-platform-skill
      hint: null
      type: text
      options: []
      required: true
