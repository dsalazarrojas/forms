inputSchema:
  type: object
  properties:
    title: Math Alarm Setup Form
    pages:
    - id: 1
      name: math_type
      label: Math Type
      hint: Select the type of math problem or challenge
      type: select_one
      options:
      - Addition
      - Subtraction
      - Mixed
      required: false
    - id: 2
      name: math_level
      label: Math Level
      hint: Choose the level of math difficulty
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 3
      name: alarm_type
      label: Alarm Type
      hint: Select the type of alarm to receive
      type: select_one
      options:
      - Math Problem
      - Math Challenge
      - Math Game
      required: false
    - id: 4
      name: time_interval
      label: Time Interval
      hint: Choose the time interval for alarms
      type: select_one
      options:
      - 30 minutes
      - 60 minutes
      - 90 minutes
      required: false
    - id: 5
      name: notification_time
      label: Notification Time
      hint: Select the time of day for notifications
      type: select_one
      options:
      - 08:00
      - '720'
      - '960'
      required: false
    - id: 6
      name: language
      label: Language
      hint: Choose the language for the math application
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Chinese
      required: false
    - id: 7
      name: timezone
      label: Time Zone
      hint: Select the timezone for the math application
      type: select_one
      options:
      - Eastern
      - Central
      - Mountain
      - Pacific
      required: false
    - id: 8
      name: challenge_type
      label: Challenge Type
      hint: Select the type of math challenge
      type: select_one
      options:
      - Math Problem Challenge
      - Math Game Challenge
      required: false
    - id: 9
      name: challenge_interval
      label: Challenge Interval
      hint: Choose the interval for math challenges
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      required: false
    - id: 10
      name: challenge_duration
      label: Challenge Duration
      hint: Select the duration for math challenges
      type: select_one
      options:
      - 30 minutes
      - 60 minutes
      - 90 minutes
      required: false
    - id: 11
      name: notification_method
      label: Notification Method
      hint: Select the method for receiving notifications
      type: select_one
      options:
      - Email
      - Coach/Manager
      required: false
    - id: 12
      name: save_changes
      label: Save Changes
      hint: Save the settings to apply them to the math application
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
