      - Some Resources
      - Not Aware
      required: true
    - id: 23
      name: access_barriers
      label: Barriers to accessing resources
      hint: Select all that apply
      type: select_multiple
      options:
      - Language Barrier
      - Technology Access
      - Transportation
      - Eligibility Concerns
      - Trust Issues
