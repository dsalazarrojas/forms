inputSchema:
  type: object
  properties:
    title: public_policy_initiative_feedback_questionnaire
    pages:
    - id: 1
      name: user_info
      label: 1. User Information
      hint: Please provide your name and email address
      type: text
      options: []
      required: false
    - id: 2
      name: feedback_rating
      label: 2. Feedback Rating (1-5)
      hint: Rate your feedback on the policy initiative
      type: number
      options: []
      required: true
    - id: 3
      name: feedback_comment
      label: 3. Feedback Comment
      hint: Please provide a brief comment on the policy initiative
      type: text
      options: []
      required: true
    - id: 4
      name: policy_areas
      label: 4. Policy Areas of Interest
      hint: Select all areas that apply
      type: select_multiple
      options:
      - Policy Area 1
      - Policy Area 2
      - Policy Area 3
      - Policy Area 4
      - Policy Area 5
      required: true
    - id: 5
      name: feedback_email
      label: 5. Feedback Email
      hint: Provide your email address for feedback
      type: email
      options: []
      required: true
    - id: 6
      name: feedback_phone
      label: 6. Feedback Phone
      hint: Provide your phone number for feedback
      type: text
      options: []
      required: true
    - id: 7
      name: submission_date
      label: 7. Submission Date
      hint: Select the submission date
      type: date
      options: []
      required: true
    - id: 8
      name: submission_time
      label: 8. Submission Time
      hint: Select the submission time
      type: time
      options: []
      required: true
    - id: 9
      name: submission_date_time
      label: 9. Submission Date and Time
      hint: Select the submission date and time
      type: date
      options: []
      required: true
    - id: 10
      name: submit
      label: 10. Submit
      hint: Please submit your feedback
      type: text
      options: []
      required: true
    - id: 11
      name: policy_area_1
      label: 11. Policy Area 1
      hint: Select the policy area
      type: select_one
      options:
      - Policy Area 1
      - Policy Area 2
      - Policy Area 3
      - Policy Area 4
      - Policy Area 5
      required: false
    - id: 12
      name: policy_area_2
      label: 12. Policy Area 2
      hint: Select the policy area
      type: select_one
      options:
      - Policy Area 1
      - Policy Area 2
      - Policy Area 3
      - Policy Area 4
      - Policy Area 5
      required: false
