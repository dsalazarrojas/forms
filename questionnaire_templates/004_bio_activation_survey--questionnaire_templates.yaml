inputSchema:
  type: object
  properties:
    title: Bio Activation Survey
    pages:
      - id: 1
        name: survey_header
        label: -- Survey Summary --
        hint: Help us improve future programs by sharing your feedback
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 3
        name: organization
        label: Organization
        hint: Affiliated institution or company
        type: text
        options: []
        required: false
      - id: 4
        name: role_or_title
        label: Role or title
        hint: Your position or role in the organization
        type: text
        options: []
        required: false
      - id: 5
        name: participation_date
        label: Program participation date
        hint: Date you attended or used the activation methods
        type: date
        options: []
        required: false
      - id: 6
        name: methods_tried
        label: Methods tried
        hint: Select the methods you used during activation
        type: select_multiple
        options:
          - Workshop or training
          - Hands on lab protocol
          - Remote consultation
          - Online resources
          - Pilot project
        required: false
      - id: 7
        name: perceived_benefit
        label: Perceived benefit level
        hint: How beneficial were the methods overall
        type: select_one
        options:
          - Very high
          - High
          - Moderate
          - Low
          - None
        required: true
      - id: 8
        name: challenges_encountered
        label: Challenges encountered
        hint: Describe any technical or logistical challenges
        type: text
        options: []
        required: false
      - id: 9
        name: interest_in_future_programs
        label: Interest in future programs
        hint: Would you like to participate in future activities
        type: select_one
        options:
          - Yes
          - Maybe
          - No
        required: true
      - id: 10
        name: additional_feedback
        label: Additional feedback
        hint: Any other suggestions or comments
        type: text
        options: []
        required: false
      - id: 11
        name: consent_note
        label: Consent and data use note
        hint: Responses may be used for program improvements
        type: note
        options: []
        required: true
