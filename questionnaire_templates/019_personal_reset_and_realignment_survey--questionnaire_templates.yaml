inputSchema:
  type: object
  properties:
    title: Personal Reset And Realignment Survey
    pages:
    - id: 1
      name: page_1
      label: What is your current level of motivation?
      hint: null
      type: select_one
      options:
      - High
      - Low
      - Medium
      required: true
    - id: 2
      name: page_1_2
      label: How many hours do you usually spend on social media?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: page_1_3
      label: Have you experienced any recent stress or anxiety?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 4
      name: page_2
      label: Do you have any health concerns or medical conditions that impact your
        daily life?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: page_2_2
      label: What is your current sleep schedule like?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: page_2_3
