inputSchema:
  type: object
  properties:
    title: SEO Strategy Satisfaction Questionnaire
    pages:
    - id: 1
      name: seo_strategy_satisfaction
      label: How satisfied are you with our SEO strategy?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 2
      name: seo_service_quality
      label: What is the overall service quality provided by our team?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - No Answer
      required: false
    - id: 3
      name: seo_service_communication
      label: How would you rate the level of communication with your account manager?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: seo_performance_meeting_expectations
      label: How well do you think we meet your expectations for SEO performance?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: seo_budget_effectiveness
      label: How does our SEO budget compare to your expectations?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: seo_service_value
      label: How would you rate the overall value provided by our SEO service?
      hint: null
      type: select_one
      options:
      - Very High
      - Somewhat High
      - Neutral
      - Somewhat Low
      - Very Low
      required: false
    - id: 7
      name: client_seo_relationship
      label: How would you rate the level of communication with your account manager
        for SEO?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: overall_seo_experience
      label: What is your overall experience with our SEO service?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: seo_additional_comments
      label: Any additional comments or feedback about our SEO service?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
