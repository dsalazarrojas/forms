inputSchema:
  type: object
  properties:
    title: Language School Curriculum Inquiry Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: language_school
      label: What Language School
      hint: null
      type: select_one
      options:
      - Spanish
      - English
      - French
      - German
      - Chinese
      required: false
    - id: 3
      name: curriculum_level
      label: Curriculum Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 4
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - Call
      - Email
      - Text
      required: false
    - id: 5
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
