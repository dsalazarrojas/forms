      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: boundaries
      label: Boundaries
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: emotional_intimacy
      label: Emotional Intimacy
