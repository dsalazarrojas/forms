inputSchema:
  type: object
  properties:
    title: Stool Consistency Assessment Questionnaire
    pages:
    - id: 1
      name: intake_page
      label: Intake Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: bowel_habits
      label: Bowel Habits
      hint: null
      type: select_multiple
      options:
      - Very loose
      - Loose
      - Normal
      - Very firm
      - Firm
      required: false
    - id: 3
      name: stool_consistency
      label: Stool Consistency
      hint: null
      type: select_one
      options:
      - Type 1
      - Type 2
      - Type 3
      - Type 4
      required: false
    - id: 4
      name: additional_comments
      label: Additional Comments
      hint: Enter any additional comments or concerns
      type: note
      options: []
      required: false
    - id: 5
      name: follow_up_questions
      label: Follow-up Questions
      hint: null
      type: select_multiple
      options:
      - How often do you have bowel movements?
      - How long do you spend in the bathroom?
      - Are you satisfied with your bowel movements?
      required: false
    - id: 6
      name: research_questions
      label: Research Questions
      hint: null
      type: select_multiple
      options:
      - How often do you experience abdominal pain?
      - How often do you experience bloating?
      - How often do you experience bowel irregularity?
      required: false
