      - Intermediate
      - Advanced
      - Expert
      required: false
    - id: 4
      name: pre_session_preparations
      label: Are you prepared for class
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_contact
      label: Emergency contact information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact_relationship
