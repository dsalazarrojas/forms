      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: parking_facilities_feedback_questionnaire_page_3
      label: Parking facilities
      hint: null
      type: select_multiple
      options:
      - Parking signs and signage
      - Parking lot size and layout
      - Parking lot accessibility
      - Parking lot cleanliness
      - Parking lot condition
      - Accessible parking options
      - Parking signage clearness
      - Parking availability
      - Overall condition
      required: false
    - id: 4
      name: parking_facilities_feedback_questionnaire_page_4
      label: Contact information
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: parking_facilities_feedback_questionnaire_page_5
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
