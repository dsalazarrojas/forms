inputSchema:
  type: object
  properties:
    title: Group Trip Planning Survey
    pages:
    - id: 1
      name: trip_type
      label: What type of vacation are you looking for?
      hint: null
      type: select_multiple
      options:
      - Beach
      - City
      - Mountains
      required: false
    - id: 2
      name: trip_duration
      label: How long would you like to stay?
      hint: null
      type: select_multiple
      options:
      - 3 days
      - 5 days
      - 7 days
      required: false
    - id: 3
      name: trip_budget
      label: What is your budget for the trip?
      hint: null
      type: select_multiple
      options:
      - Less than $500
      - $500-$1000
      - More than $1000
      required: false
    - id: 4
      name: trip_priority
      label: What is your priority for this trip?
      hint: null
      type: select_one
      options:
      - Destination
      - Budget
      - Duration
      required: false
    - id: 5
      name: trip_destinations
      label: Which destinations are you interested in visiting?
      hint: null
      type: select_multiple
      options:
      - Beach
      - City
      - Mountains
      required: false
    - id: 6
      name: trip_durations
      label: What is your expected trip duration?
      hint: null
      type: select_multiple
      options:
      - 3 days
      - 5 days
      - 7 days
      required: false
    - id: 7
      name: trip_budgets
      label: What is your expected travel budget?
      hint: null
      type: select_multiple
      options:
      - Less than $500
      - $500-$1000
      - More than $1000
      required: false
    - id: 8
      name: trip_priority_2
      label: How important is it for you to have a priority on this trip?
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not at all important
      required: false
    - id: 9
      name: group_size
      label: How many people will you be traveling with?
      hint: null
      type: select_multiple
      options:
      - 1-3 people
      - 4-6 people
      - More than 6 people
      required: false
    - id: 10
      name: travel_frequency
      label: How often do you plan to travel?
      hint: null
      type: select_one
      options:
      - Rarely
      - Occasionally
      - Often
      required: false
    - id: 11
      name: travel_mode
      label: Are you planning a solo trip or with a group?
      hint: null
      type: radio
      options:
      - Solo
      - Group
      required: false
    - id: 12
      name: travel_language
      label: How many languages do you speak fluently?
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: travel_insurance
      label: Are you planning to book travel insurance?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 14
      name: daily_budget
      label: What is your expected daily budget per person?
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: pool_importance
      label: How important is it for you to have a hotel with a pool?
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not at all important
      required: false
