      options:
      - Good
      - Fair
      required: false
    - id: 7
      name: next_steps_page
      label: Next Steps
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: review_page
      label: Final Review
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: additional_notes_page
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_info_page
      label: Contact Information
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: review_page
      label: Review and Next Steps
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
