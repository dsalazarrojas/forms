inputSchema:
  type: object
  properties:
    title: SEO Strategy Assessment Form
    pages:
    - id: 1
      name: intro_page
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: keyword_page
      label: What Keywords
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: search_page
      label: Current Search Engine Visibility
      hint: null
