inputSchema:
  type: object
  properties:
    title: 401(k) Rollover Decision Questionnaire
    pages:
    - id: 1
      name: section_header_participant_info
      label: '--- Participant Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter your legal name as it appears on account records
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: Preferred email for follow-up
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Mobile or best contact number (include country code if outside US)
      type: phone
      options: []
      required: false
    - id: 5
      name: submission_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: employer_name
      label: Current employer name
      hint: Employer sponsoring the 401(k) plan
      type: text
      options: []
      required: true
    - id: 7
      name: current_plan_type
      label: Type of current 401(k) plan
      hint: Select the option that best matches your primary plan
      type: select_one
      options:
      - Traditional 401(k)
      - Roth 401(k)
      - Safe Harbor 401(k)
      - Legacy/Other employer plan
      - Unsure
      required: true
    - id: 8
      name: estimated_plan_balance
      label: Estimated current plan balance (USD)
      hint: Enter approximate total balance in dollars (no commas)
      type: decimal
      options: []
      required: true
    - id: 9
      name: desired_rollover_option
      label: Preferred rollover option
      hint: If undecided, select "Undecided"
      type: select_one
      options:
      - Leave funds in current employer plan
      - Roll into new employer's 401(k)
      - Roll into Traditional IRA
      - Roll into Roth IRA
      - Partial rollover / Split funds
      - Undecided
      required: true
    - id: 10
      name: decision_factors
      label: Primary factors influencing your decision (select all that apply)
      hint: Pick up to 6 factors that matter most
      type: select_multiple
      options:
      - Investment options
      - Account and advisory fees
      - Tax consequences
      - Employer match availability
      - Access to financial advice
      - Ease of administration / online tools
      - Required minimum distributions (RMD) considerations
      required: false
    - id: 11
      name: anticipated_timeline
      label: Anticipated timeline for completing rollover
      hint: Choose the timeframe you expect to act within
      type: select_one
      options:
      - Within 30 days
      - 1-3 months
      - 3-6 months
      - More than 6 months
      - No plans yet / undecided
      required: true
    - id: 12
      name: tax_concern
      label: Concerned about tax implications of a rollover?
      hint: Select the option that best reflects your tax concern level
      type: select_one
      options:
      - Yes, significant concern
      - Somewhat concerned
      - No, not concerned
      - Unsure / want advisor guidance
      required: true
    - id: 13
      name: years_to_retirement
      label: Years until expected retirement
      hint: Enter whole years (0 if already retired)
      type: integer
      options: []
      required: true
    - id: 14
      name: current_contribution_rate
      label: Current contribution rate (% of salary)
      hint: Enter a whole number (e.g., 5 for 5%)
      type: integer
      options: []
      required: false
    - id: 15
      name: service_preferences
      label: Desired features in the destination account (select all that apply)
      hint: Choose features you value most
      type: select_multiple
      options:
      - Low-cost index funds
      - Active managed portfolios
      - Target-date funds
      - Personalized financial advice
      - Robust online/mobile tools
      - Consolidation of accounts
      required: false
    - id: 16
      name: advisor_consultation
      label: Have you consulted a financial advisor about this rollover?
      hint: null
      type: select_one
      options:
      - Yes, already consulted
      - Planning to consult
      - No, prefer to handle myself
      - Would like a referral
      required: true
    - id: 17
      name: additional_comments
      label: Additional comments, questions, or concerns
      hint: Include any special circumstances (loan outstanding, employer restrictions,
        etc.)
      type: text
      options: []
      required: false
