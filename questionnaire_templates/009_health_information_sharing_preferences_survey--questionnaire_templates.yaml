inputSchema:
  type: object
  properties:
    title: health_information_sharing_preferences_survey
    pages:
    - id: 1
      name: patient_preferences
      label: Patient Preferences
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: healthcare_provider_preferences
      label: Health Care Provider
      hint: Who should have access to your data?
      type: select_one
      options:
      - Family Member
      - Authorized Representative
      - Other
      required: false
    - id: 3
      name: data_sharing_preferences
      label: Data Sharing Preferences
      hint: Choose which organizations you want to share your data with.
      type: select_multiple
      options:
      - Share with health care providers
      - Share with insurance companies
      - Share with government agencies
      - Share with research institutions
      - Share with family members
      - Share with friends and family
      - Share with other
      - Do not share
      required: false
    - id: 4
      name: data_sharing_purposes
      label: Data Sharing Purposes
      hint: Choose which purposes you want to share your data for.
      type: select_multiple
      options:
      - Treatment and Care
      - Research and Study
      - Billing and Insurance
      - Government and Administrative
      - Other
      - Do not share
      required: false
    - id: 5
      name: data_sharing_restrictions
      label: Data Sharing Restrictions
      hint: Choose what types of data you do not want to share.
      type: select_multiple
      options:
      - Time-sensitive data
      - Sensitive data
      - Location data
      - Other
      - Do not share
      required: false
