inputSchema:
  type: object
  properties:
    title: Developmental Theories Assessment
    pages:
    - id: 1
      name: developmental_theories_assessment_1
      label: Developmental Theories Assessment
      hint: 'null'
      type: select_one
      options:
      - Theory 1
      - Theory 2
      - Other (please specify) - 1
      required: true
    - id: 2
      name: developmental_theories_assessment_2
      label: Educator or Trainer
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: developmental_theories_assessment_3
      label: Developmental Theories Assessment 3
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: developmental_theories_assessment_4
      label: How often do you use Developmental Theories in your teaching/training
        practice?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Never
      required: true
    - id: 5
      name: developmental_theories_assessment_5
      label: What would make you choose not to use Developmental Theories in your
        work?
      hint: Select all that apply, if any
      type: select_multiple
      options:
      - Time constraint
      - Lack of resources
      - Not familiar with the subject
      - Not familiar with the theory
      - Other (please specify) - 1
      required: true
    - id: 6
      name: developmental_theories_assessment_6
      label: What do you think is the main barrier to using Developmental Theories
