inputSchema:
  type: object
  properties:
    title: Dramatic Structure Survey
    pages:
    - id: 1
      name: storyteller_understands_dramatic_structure
      label: How do you think a good storyteller understands dramatic structure?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: applies_dramatic_structure_when_telling_stories
      label: Do you apply dramatic structure when telling stories?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: apply_dramatic_structure_to_all_work
      label: Do you apply dramatic structure to all your work?
      hint: null
      type: select_multiple
      options:
      - Writing
      - Teaching
      - Both
      - Other
      required: false
    - id: 4
      name: story_structure_type
      label: What type of structure do you think is most effective for storytelling?
      hint: null
      type: select_multiple
      options:
      - Linear
      - Non-linear
      - Flexible
      - Other (please specify)
      required: false
