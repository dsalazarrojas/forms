  properties:
    title: Evolutionary Process Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: evolution_facts
      label: evolution facts
      hint: null
      type: select_multiple
      options:
      - 1. Evolution is the scientifically proven fact that all living things have
        changed over time through genetic variation and mutation.
      - 2. Evolutionary change can occur in a single generation or over many generations.
      - 3. Evolutionary change is driven by mutation, genetic drift, gene flow, and
        other mechanisms.
      - 4. Evolutionary change is the only way to account for the origin of species.
      - 5. Evolutionary change can occur at any speed.
      - 6. All species have changed over time.
      required: false
    - id: 3
