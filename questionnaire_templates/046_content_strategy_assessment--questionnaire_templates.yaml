          - Healthcare
          - Finance
          - Retail
          - Education
          - Manufacturing
          - Professional Services
          - Nonprofit
          - Other
        required: true
      - id: 6
        name: company_size
        label: Company Size
        hint: Number of employees
        type: select_one
        options:
          - 1-10 employees
          - 11-50 employees
          - 51-200 employees
          - 201-500 employees
          - 500+ employees
        required: true
      - id: 7
        name: current_content_team_size
        label: Current Content Team Size
        hint: How many people create content?
        type: select_one
        options:
          - 1 person
          - 2-5 people
          - 6-10 people
          - 11-20 people
          - 20+ people
        required: true
      - id: 8
        name: content_goals
        label: Primary Content Goals
        hint: What are your main content objectives?
        type: select_multiple
        options:
