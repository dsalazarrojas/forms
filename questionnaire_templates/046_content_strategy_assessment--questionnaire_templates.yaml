          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 20
        name: content_consistency_rating
        label: Content Consistency Rating
        hint: How consistent is your publishing?
        type: select_one
        options:
          - Very Consistent
          - Consistent
          - Somewhat Consistent
          - Inconsistent
          - Very Inconsistent
        required: true
      - id: 21
        name: audience_understanding
        label: Audience Understanding
        hint: How well do you know your audience?
        type: select_one
        options:
          - Very Well - Detailed personas
          - Well - Basic personas
          - Somewhat - General idea
          - Not Well - Limited knowledge
          - Not at All
        required: true
      - id: 22
        name: content_gaps
        label: Content Gaps
        hint: Where do you see gaps in your content?
        type: text
        options: []
        required: true
      - id: 23
        name: improvement_priorities
        label: Improvement Priorities
        hint: What do you most want to improve?
        type: text
        options: []
        required: true
      - id: 24
        name: additional_comments
        label: Additional Comments
        hint: Any other information about your content strategy
        type: text
        options: []
        required: false
