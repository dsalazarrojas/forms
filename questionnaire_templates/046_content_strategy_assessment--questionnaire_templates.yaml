    pages:
      - id: 1
        name: company_name
        label: Company Name
        hint: Name of your organization
        type: text
        options: []
        required: true
      - id: 2
        name: respondent_name
        label: Respondent Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 3
