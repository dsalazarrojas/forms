          - Engagement Rates
          - Lead Generation
          - Conversion Rates
          - Social Shares
          - SEO Rankings
          - Email Open Rates
          - Revenue Attribution
        required: false
      - id: 18
        name: biggest_challenges
        label: Biggest Challenges
        hint: What are your main content challenges?
        type: select_multiple
        options:
          - Limited Budget
          - Limited Staff
          - Lack of Strategy
          - Inconsistent Publishing
          - Poor Quality Content
          - Low Engagement
          - Measuring ROI
          - Content Distribution
