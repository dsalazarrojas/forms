        name: content_planning_process
        label: Content Planning Process
        hint: How do you plan content?
        type: select_one
        options:
          - Formal documented process
          - Informal but consistent
          - Ad-hoc, no formal process
          - No planning done
        required: true
      - id: 10
        name: content_calendar_used
        label: Content Calendar Used
        hint: Do you use a content calendar?
        type: select_one
        options:
