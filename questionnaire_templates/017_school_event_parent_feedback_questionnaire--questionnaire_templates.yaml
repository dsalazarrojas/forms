inputSchema:
  type: object
  properties:
    title: School Event Parent Feedback Questionnaire
    pages:
    - id: 1
      name: school_event_parent_feedback_questionnaire
      label: School Event Parent Feedback Questionnaire
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: school_event_parent_feedback_questionnaire_page_2
      label: parent_feedback
      hint: null
      type: select_multiple
      options:
      - Parent's Name
      - Teacher's Name
      - Event Date
      - Event Time
      - Comments
      required: false
    - id: 3
      name: school_event_parent_feedback_questionnaire_page_3
