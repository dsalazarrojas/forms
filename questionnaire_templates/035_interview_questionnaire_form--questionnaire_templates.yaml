inputSchema:
  type: object
  properties:
    title: Interview Questionnaire Form
    pages:
    - id: 1
      name: page_one
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: page_two
      label: Contact Information
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Both
      required: true
    - id: 3
      name: page_three
      label: Work Experience
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 4
      name: page_four
      label: Educational Background
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: page_five
      label: Language Skills
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      - Both
      required: true
