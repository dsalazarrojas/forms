inputSchema:
  type: object
  properties:
    title: Prophecy And Authority Survey
    pages:
    - id: 1
      name: survey_questions
      label: Survey Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: questions_and_answers
      label: Questions And Answers
      hint: null
      type: select_one
      options:
      - How do you understand the concept of spiritual authority?
      - What is your understanding of the relationship between prophecies and spiritual
        authority?
      - Have you ever experienced any prophecies in your life?
      - Do you believe the Bible is the ultimate authority in all matters of faith
        and practice?
      required: false
