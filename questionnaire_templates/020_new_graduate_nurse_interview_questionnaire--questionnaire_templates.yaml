inputSchema:
  type: object
  properties:
    title: New Graduate Nurse Interview Questionnaire
    pages:
    - id: 1
      name: job_posting_details
      label: Job Posting Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: candidate_contact_info
      label: Candidate Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: education_background
      label: Education Background
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: experience_confidence_level
      label: Experience Confidence Level
      hint: How confident are you with the below experience?
      type: number
      options: []
      required: false
    - id: 5
      name: clinical_experience
      label: Clinical Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: education_level
      label: Education Level
      hint: What is your highest level of education?
      type: select_one
      options:
      - High School
      - Diploma
      - Associate's
      - Bachelor's
      - Master's
      - Doctorate
      required: false
    - id: 7
      name: years_of_education
      label: Years of Education
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: nursing_license
      label: Nursing License
      hint: null
      type: select_one
      options:
      - Active and Current
      - Active and Expired
      - Inactive
      required: false
    - id: 9
      name: certification
      label: Certification
      hint: null
      type: select_multiple
      options:
      - BLS (Basic Life Support)
      - ACLS (Advanced Life Support)
      - PALS (Pediatric Advanced Life Support)
      - None
      required: false
    - id: 10
      name: confidence_level
      label: Confidence Level
      hint: How confident are you with the below areas?
      type: select_multiple
      options:
      - Leadership
      - Communication
      - Time Management
      - None
      required: false
    - id: 11
      name: skills_confidence_level
      label: Skills Confidence Level
      hint: How confident are you with the below skills?
      type: select_multiple
      options:
      - Basic Life Support
      - IV Therapy
      - Medication Management
      - None
      required: false
    - id: 12
      name: interview_topics
      label: Interview Topics
      hint: Which of the following topics would you like to be discussed during the
        interview?
      type: select_multiple
      options:
      - Communication
      - Time Management
      - Leadership
      - Problem Solving
      - None
      required: false
