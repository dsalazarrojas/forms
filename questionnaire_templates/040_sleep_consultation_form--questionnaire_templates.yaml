inputSchema:
  type: object
  properties:
    title: sleep_consultation_form
    pages:
    - id: 1
      name: sleep_quality
      label: Sleep Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: sleep_duration
      label: Sleep Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: sleep_schedule
      label: Sleep Schedule
      hint: null
      type: select_one
      options:
      - 6-7 hours
      - 7-8 hours
      - 8-9 hours
      - 10 hours or more
      required: false
    - id: 4
      name: sleep_latency
      label: Sleep Latency
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: sleep_wake_up_time
      label: Sleep Wake-Up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: sleep_onset_insomnia
      label: Sleep Onset Insomnia
      hint: null
      type: select_multiple
      options:
      - None
      - Rarely
      - Occasionally
      - Often
      - Almost Every Night
      required: false
    - id: 7
      name: snoring
      label: Snoring
      hint: null
      type: select_one
      options:
      - None
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: sleep_disorder
      label: Sleep Disorder
      hint: null
      type: select_one
      options:
      - None
      - Sleep Apnea
      - Insomnia
      - Narcolepsy
      - Other
      required: false
    - id: 9
      name: sleep_treatment
      label: Sleep Treatment
      hint: null
      type: select_one
      options:
      - Medication
      - Lifestyle Changes
      - Combination
      required: false
    - id: 10
      name: sleep_recommendation
      label: Sleep Recommendation
      hint: null
      type: select_one
      options:
      - None
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: sleep_consultation_form_comments
      label: Sleep Consultation Form Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: sleep_consultation_form_recommendation
      label: Sleep Consultation Form Recommendation
      hint: null
      type: note
      options: []
      required: false
