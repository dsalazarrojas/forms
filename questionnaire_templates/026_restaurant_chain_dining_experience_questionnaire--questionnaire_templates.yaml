inputSchema:
  type: object
  properties:
    title: Restaurant Chain Dining Experience Questionnaire
    pages:
    - id: 1
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: time_of_visit
      label: Time of Visit
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: staff_friendlyness
      label: Staff Friendliness
      hint: How friendly was the staff?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: cleanliness
      label: Cleanliness
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: food_quality
      label: Food Quality
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 7
      name: food_speed
      label: Food Speed
      hint: How quickly was your food served?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: value_for_money
      label: Value for Money
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: will_return
      label: Will You Return?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: overall_experience
      label: Overall Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
