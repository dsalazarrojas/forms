inputSchema:
  type: object
  properties:
    title: Social Media Ads Consumer Behavior Questionnaire
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: ad_trust
      label: What level of trust do you have in the ads shown on social media?
      hint: null
      type: select_one
      options:
      - Very low
      - Low
      - Neutral
      - High
      required: false
    - id: 3
      name: ad_engagement
      label: How often do you engage with the ads shown on social media?
      hint: null
      type: select_one
      options:
      - Never
      - Rarely
      - Occasionally
      - Frequently
      required: false
    - id: 4
      name: purchase_intent
      label: How likely are you to purchase a product or service based on the ad shown
        on social media?
      hint: null
      type: select_one
      options:
      - Not at all
      - Somewhat
      - Somewhat likely
      - Very likely
      required: false
    - id: 5
      name: demographic_gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 6
      name: demographic_age_range
      label: Age
      hint: null
      type: select_multiple
      options:
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65 or older
      required: false
    - id: 7
      name: demographic_income_range
      label: Income
      hint: null
      type: select_multiple
      options:
      - Less than $25,000
      - $25,000-$49,999
      - $50,000-$74,999
      - $75,000 or more
      required: false
    - id: 8
      name: demographic_education_level
      label: Education Level
      hint: null
      type: select_one
      options:
      - Some High School
      - High School Diploma
      - Some College
      - Bachelor's Degree
      - Master's Degree
      - Doctoral Degree
      required: false
    - id: 9
      name: demographic_marital_status
      label: Marital Status
      hint: null
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      required: false
    - id: 10
      name: demographic_location
      label: Location
      hint: null
      type: select_one
      options:
      - Urban
      - Suburban
      - Rural
      required: false
    - id: 11
      name: demographic_language
      label: Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - Other Language
      required: false
