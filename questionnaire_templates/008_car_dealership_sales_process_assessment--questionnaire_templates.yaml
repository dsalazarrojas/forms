inputSchema:
  type: object
  properties:
    title: Car Dealership Sales Process Assessment
    pages:
    - id: 1
      name: assessment_header
      label: -- Sales Process Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: salesperson_name
      label: Salesperson Name
      hint: Name of the employee being assessed
      type: text
      options: []
      required: true
    - id: 3
      name: dealership_location
      label: Dealership Location
      hint: Branch name or address
      type: text
      options: []
      required: true
    - id: 4
      name: customer_interaction_date
      label: Date of Interaction
      hint: When did the interaction occur?
      type: date
      options: []
      required: true
    - id: 5
      name: greeting_process
      label: Greeting and Initial Contact
      hint: Was the customer greeted promptly and professionally?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 6
      name: needs_discovery
      label: Needs Discovery and Qualification
      hint: Did the salesperson ask relevant questions?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: vehicle_presentation
      label: Vehicle Presentation and Features
      hint: Was the vehicle presented in a compelling way?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: test_drive_process
      label: Test Drive Experience
      hint: Was the test drive handled professionally?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - N/A
      required: true
    - id: 9
      name: objection_handling
      label: Objection Handling and Negotiation
      hint: How well did the salesperson address concerns?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: closing_process
      label: Closing and Agreement
      hint: Was the closing process smooth and transparent?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: follow_up_process
      label: Follow-Up and Relationship Management
      hint: Is there a clear follow-up plan in place?
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: true
    - id: 12
      name: sales_metrics_header
      label: -- Performance Metrics --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: interaction_duration
      label: Duration of Interaction (minutes)
      hint: Approximately how long did the interaction last?
      type: number
      options: []
      required: true
    - id: 14
      name: conversion_result
      label: Outcome of the Interaction
      hint: Did the interaction result in a sale?
      type: select_one
      options:
      - Sold
      - Quoted
      - Demo Only
      - Lost/No Interest
      required: true
    - id: 15
      name: salesperson_strengths
      label: Key Strengths Observed
      hint: What did the salesperson do well?
      type: text
      options: []
      required: false
    - id: 16
      name: areas_for_improvement
      label: Areas for Improvement
      hint: What could be improved for better performance?
      type: text
      options: []
      required: false
    - id: 17
      name: assessor_name
      label: Assessor Name
      hint: Name of the person conducting the assessment
      type: text
      options: []
      required: true
    - id: 18
      name: assessor_signature_confirmation
      label: Type your name for assessment confirmation
      hint: null
      type: text
      options: []
      required: true
