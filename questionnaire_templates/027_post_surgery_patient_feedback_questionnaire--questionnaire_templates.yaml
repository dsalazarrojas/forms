inputSchema:
  type: object
  properties:
    title: Post Surgery Patient Feedback Questionnaire
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: surgery_date
      label: Surgery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: surgery_type
      label: Type of Surgery
      hint: null
      type: select_one
      options:
      - Cardiac Surgery
      - Neurosurgery
      - Orthopedic Surgery
      - Plastic Surgery
      required: false
    - id: 4
      name: pain_level
      label: Pain Level
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 6
      name: communication_with_doctor
      label: Communication with Doctor
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Poor
      - Very Poor
      required: false
    - id: 7
      name: doctor_attentiveness
      label: Doctor's Attentiveness
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: nurse_care
      label: Nurse Care
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Poor
      - Very Poor
      required: false
    - id: 9
      name: follow_up_care
      label: Follow-Up Care
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Poor
      - Very Poor
      required: false
    - id: 10
      name: recommendation
      label: Would you Recommend
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: contact_info
      label: Contact Info
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Mail
      required: false
