inputSchema:
  type: object
  properties:
    title: Community Manager Election Form
    pages:
    - id: 1
      name: voter_name
      label: Voter Full Legal Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: unit_member_id
      label: Membership or Unit ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: eligibility_verification
      label: I certify I am a voting member in good standing
      hint: Eligibility as per bylaws
      type: select_one
      options:
      - I Certify Eligibility
      - Other
      required: true
    - id: 4
      name: choice_1
      label: Rank Your Candidates - 1st Choice (Primary Vote)
      hint: Your top pick for Community Manager
      type: select_one
      options:
      - Candidate A (Current Manager)
      - Candidate B
      - Candidate C (Independent)
      required: true
    - id: 5
      name: choice_2
      label: Rank Your Candidates - 2nd Choice
      hint: null
      type: select_one
      options:
      - Candidate A
      - Candidate B
      - Candidate C
      required: true
    - id: 6
      name: choice_3
      label: Rank Your Candidates - 3rd Choice
      hint: null
      type: select_one
      options:
      - Candidate A
      - Candidate B
      - Candidate C
      required: true
    - id: 7
      name: top_quality_preference
      label: Top quality you look for in a Community Manager
      hint: Which is most important to you?
      type: select_one
      options:
      - Effective Communication and Transparency
      - Strong Financial and Budget Oversight
      - Professional Conflict Resolution Skills
      - Technical Skill with Management Software
      - Availability and Responsiveness
      required: true
    - id: 8
      name: election_comments
      label: General Comments on the Election or Candidates
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: voter_electronic_signature
      label: Voter Electronic Signature
      hint: Type name to sign
      type: text
      options: []
      required: true
    - id: 10
      name: ballot_date
      label: Date of Ballot Submission
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: anonymity_understanding
      label: I understand my individual vote remains confidential
      hint: Only aggregate results are published
      type: select_one
      options:
      - I Understand
      - Other
      required: true
