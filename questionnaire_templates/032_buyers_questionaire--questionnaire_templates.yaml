inputSchema:
  type: object
  properties:
    title: Buyers Questionnaire
    pages:
    - id: 1
      name: buyer_name
      label: Buyer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: buyer_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 3
      name: buyer_email
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 4
      name: married_status
      label: Marital Status
      hint: Select your status
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      - Domestic Partnership
      required: false
    - id: 5
      name: household_size
      label: Household Size
      hint: Number of people in household
      type: number
      options: []
      required: true
    - id: 6
      name: children
      label: Do You Have Children
      hint: Select yes or no
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 7
      name: buy_timeline
      label: Purchase Timeline
      hint: When are you planning to buy
      type: select_one
      options:
      - Immediately
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - Over 1 year
      - Undecided
      required: true
    - id: 8
      name: budget
      label: Budget for Purchase
      hint: Your price range
      type: select_one
      options:
      - Under 200000
      - 200000 - 400000
      - 400000 - 600000
      - 600000 - 800000
      - Over 800000
      required: true
    - id: 9
      name: preapproved
      label: Mortgage Pre-approved
      hint: Have you been approved for financing
      type: select_one
      options:
      - true
      - false
      - In Process
      required: true
    - id: 10
      name: current_property
      label: Current Property Status
      hint: Do you own a home currently
      type: select_one
      options:
      - Own outright
      - Have mortgage
      - Rent
      - Living with family
      - Other
      required: true
    - id: 11
      name: selling_current
      label: Selling Current Property
      hint: Will you sell your current home
      type: select_one
      options:
      - true
      - false
      - Unsure
      required: true
    - id: 12
      name: home_type_wanted
      label: Type of Home Wanted
      hint: What type of property
      type: select_multiple
      options:
      - Single Family
      - Condo
      - Townhouse
      - Multi-family
      - Land
      - Mobile Home
      required: true
    - id: 13
      name: desired_location
      label: Desired Location
      hint: Preferred area or neighborhood
      type: text
      options: []
      required: true
    - id: 14
      name: bedrooms_wanted
      label: Bedrooms Wanted
      hint: Number of bedrooms needed
      type: number
      options: []
      required: true
    - id: 15
      name: bathrooms_wanted
      label: Bathrooms Wanted
      hint: Number of bathrooms needed
      type: number
      options: []
      required: true
    - id: 16
      name: square_feet
      label: Square Footage Preference
      hint: Approximate size needed
      type: text
      options: []
      required: false
    - id: 17
      name: must_haves
      label: Must Have Features
      hint: Essential features you need
      type: select_multiple
      options:
      - Garage
      - Yard
      - Pool
      - Updated Kitchen
      - Fireplace
      - Basement
      - Multiple Stories
      required: false
    - id: 18
      name: agents_contacted
      label: Have You Contacted Real Estate Agents
      hint: Current agent relationship
      type: select_one
      options:
      - Yes, currently working with agent
      - Yes, contacted but not working with
      - false
      required: true
