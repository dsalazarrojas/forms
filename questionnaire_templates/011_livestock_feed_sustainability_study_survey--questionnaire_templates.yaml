inputSchema:
  type: object
  properties:
    title: Livestock Feed Sustainability Study Survey
    pages:
    - id: 1
      name: farm_details
      label: Farm Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: feed_practices
      label: What are your current feed practices?
      hint: null
      type: select_one
      options:
      - Grains
      - Forages
      - Other (please specify)
      required: false
    - id: 3
      name: feed_sources
      label: Where do you source your feeds?
      hint: null
      type: select_multiple
      options:
      - Local feed mills
      - National feed mills
      - Other (please specify)
      required: false
    - id: 4
      name: sustainability_measures
      label: What sustainability measures do you currently have in place?
      hint: null
      type: select_multiple
      options:
      - Organic farming
      - Regenerative agriculture
      - Other (please specify)
      required: false
    - id: 5
      name: challenges
      label: What are your challenges related to feed sustainability?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_comments
      label: Do you have any additional comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: contact_info
      label: How would you like to be contacted?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Other (please specify)
      required: false
