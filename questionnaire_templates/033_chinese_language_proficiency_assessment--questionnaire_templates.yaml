inputSchema:
  type: object
  properties:
    title: Chinese Language Proficiency Assessment
    pages:
      - id: 1
        name: candidate_name
        label: Candidate Name
        hint: Full name of examinee
        type: text
        options: []
        required: true
      - id: 2
        name: date_of_birth
        label: Date of Birth
        hint: Optional for placement records
        type: date
        options: []
        required: false
      - id: 3
        name: contact_email
        label: Contact Email
        hint: Email for results delivery
        type: email
        options: []
        required: false
      - id: 4
        name: proficiency_goal
        label: Proficiency Goal
        hint: e.g., Conversational, Academic, Professional
        type: select_one
        options:
          - Conversational
          - Academic
          - Professional
          - Examination Preparation
        required: true
      - id: 5
        name: listening_sample
        label: Listening Sample Provided
        hint: Note if audio sample was provided
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 6
        name: reading_level_assessment
        label: Reading Level Assessment
        hint: Short reading comprehension task result
        type: text
        options: []
        required: false
      - id: 7
        name: speaking_rating
        label: Speaking Rating
        hint: Examiner rating for spoken proficiency
        type: select_one
        options:
          - Beginner
          - Intermediate
          - Upper Intermediate
          - Advanced
        required: true
      - id: 8
        name: writing_sample
        label: Writing Sample Notes
        hint: Brief evaluation of writing sample
        type: text
        options: []
        required: false
      - id: 9
        name: recommended_level
        label: Recommended Placement Level
        hint: Suggested course or level placement
        type: text
        options: []
        required: true
