inputSchema:
  type: object
  properties:
    title: Kitchen Style Assessment
    pages:
    - id: 1
      name: kitchen_style_assessment
      label: What is your current kitchen style?
      hint: null
      type: select_one
      options:
      - Modern
      - Traditional
      - Rustic
      - Transitional
      required: false
    - id: 2
      name: budget_constraint
      label: How much are you willing to spend?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: kitchen_style_assessment_2
      label: What is the primary material of your current kitchen?
      hint: null
      type: select_multiple
      options:
      - Solid Surface
      - Laminate
      - Engineered Stone
      - Granite
      required: false
    - id: 4
      name: renovation_goals
      label: What are your current renovation goals for your kitchen?
      hint: null
      type: select_one
      options:
      - Increase Storage Space
      - Improve Aesthetics
      - Update to Modernize
      - Other
      required: false
    - id: 5
      name: current_kitchen_size
      label: How many people typically use the kitchen?
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: kitchen_style_assessment_3
      label: What type of lighting do you currently have in your kitchen?
      hint: null
      type: select_one
      options:
      - LED
      - Recessed
      - Under-Cabinet
      - Pendant
      required: false
    - id: 7
      name: renovation_scope
      label: What scope of the renovation do you plan to tackle?
      hint: null
      type: select_multiple
      options:
      - Full Kitchen
      - Partial Kitchen
      - Other
      required: false
    - id: 8
      name: kitchen_layout
      label: What type of kitchen layout do you prefer?
      hint: null
      type: select_multiple
      options:
      - U-Shaped
      - L-Shaped
      - Linear
      - Galley
      required: false
    - id: 9
      name: design_style
      label: What design style do you lean towards?
      hint: null
      type: select_multiple
      options:
      - Modern
      - Traditional
      - Rustic
      - Transitional
      required: false
    - id: 10
      name: cabinet_style
      label: What cabinet style do you prefer?
      hint: null
      type: select_multiple
      options:
      - Stock
      - Semi-Custom
      - Custom
      required: false
    - id: 11
      name: appliance_type
      label: What type of appliances do you currently have in your kitchen?
      hint: null
      type: select_multiple
      options:
      - Built-in Appliances
      - Major Appliances
      - Minor Appliances
      - Other
      required: false
    - id: 12
      name: cabinet_height
      label: What height do you prefer for your cabinets?
      hint: null
      type: select_multiple
      options:
      - Above 72 inches
      - 48-72 inches
      - 36-48 inches
      - Below 36 inches
      required: false
    - id: 13
      name: cabinet_width
      label: What width do you prefer for your cabinets?
      hint: null
      type: select_multiple
      options:
      - 12-15 inches
      - 18-21 inches
      - 24-27 inches
      - 30-33 inches
      required: false
    - id: 14
      name: counter_material
      label: What type of counter material do you prefer?
      hint: null
      type: select_multiple
      options:
      - Laminate
      - Solid Surface
      - Granite
      - Marble
      required: false
    - id: 15
      name: sink_type
      label: What type of sink do you currently have in your kitchen?
      hint: null
      type: select_multiple
      options:
      - Drop-in
      - Under-Mount
      - Top-Mount
      - Other
      required: false
    - id: 16
      name: faucet_style
      label: What style of faucet do you prefer?
      hint: null
      type: select_multiple
      options:
      - Single-Handle
      - Double-Handle
      - Wall-Mount
      - Wall-Bridge
      required: false
    - id: 17
      name: faucet_material
      label: What material do you prefer for your faucet?
      hint: null
      type: select_multiple
      options:
      - Stainless Steel
      - Bronze
      - Brass
      - Other
      required: false
    - id: 18
      name: countertop_material
      label: What type of countertop material do you prefer?
      hint: null
      type: select_multiple
      options:
      - Granite
      - Marble
      - Quartz
      - Other
      required: false
    - id: 19
      name: flooring_type
      label: What type of flooring do you currently have in your kitchen?
      hint: null
      type: select_multiple
      options:
      - Hardwood
      - Laminate
      - Ceramic
      - Vinyl
      required: false
    - id: 20
      name: electrical_outlets
      label: Are you willing to move electrical outlets?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 21
      name: plumbing_fixtures
