inputSchema:
  type: object
  properties:
    title: Children's Health Questionnaire
    pages:
    - id: 1
      name: child_information
      label: -- Child Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: child_name
      label: Child Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: age
      label: Age
      hint: Current age in years
      type: number
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 6
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: parent_email
      label: Parent Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: parent_phone
      label: Parent Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: medical_history
      label: -- Medical History --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: chronic_conditions
      label: Does the child have any chronic conditions
      hint: Select all that apply
      type: select_multiple
      options:
      - Asthma
      - Allergies
      - Eczema
      - Diabetes
      - Heart condition
      - Seizure disorder
      - Other
      - None
      required: true
    - id: 11
      name: medications
      label: Current medications
      hint: List all medications the child takes
      type: text
      options: []
      required: false
    - id: 12
      name: allergies
      label: Known allergies
      hint: List food, medicine, and environmental allergies
      type: text
      options: []
      required: false
    - id: 13
      name: recent_illnesses
      label: Recent illnesses or infections
      hint: In the last 3 months
      type: text
      options: []
      required: false
    - id: 14
      name: vaccinations_section
      label: -- Vaccinations --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: up_to_date
      label: Vaccinations are up to date
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 16
      name: missing_vaccines
      label: Any missing or delayed vaccinations
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: physical_health
      label: -- Physical Health --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: height
      label: Height (inches)
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: weight
      label: Weight (pounds)
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: eating_habits
      label: Eating habits
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 21
      name: exercise_level
      label: Average daily exercise or physical activity
      hint: In hours
      type: number
      options: []
      required: false
    - id: 22
      name: sleep_hours
      label: Average hours of sleep per night
      hint: null
      type: number
      options: []
      required: true
    - id: 23
      name: mental_health
      label: -- Mental and Emotional Health --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: mental_concerns
      label: Any mental health concerns
      hint: Select all that apply
      type: select_multiple
      options:
      - Anxiety
      - Depression
      - ADHD
      - Behavioral issues
      - Learning difficulties
      - Bullying
      - None
      required: true
    - id: 25
      name: additional_notes
      label: Additional health notes or concerns
      hint: null
      type: text
      options: []
      required: false
