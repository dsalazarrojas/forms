inputSchema:
  type: object
  properties:
    title: Pre Exercise Health Questionnaire
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: health_status
      label: Health Status
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Bad
      required: false
    - id: 3
      name: exercise_frequency
      label: Exercise Frequency
      hint: null
      type: select_multiple
      options:
      - Rarely
      - Occasionally
      - Frequently
      - Often
      required: false
    - id: 4
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: select_multiple
      options:
      - Heart Conditions
      - Diabetes
      - Other
      required: false
    - id: 5
      name: medications
      label: Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      required: false
    - id: 7
      name: medical_procedures
      label: Medical Procedures
      hint: null
      type: select_multiple
      options:
      - None
      - Heart Surgery
      - Other
      required: false
    - id: 8
      name: last_medical_check
      label: Last Medical Check
      hint: null
      type: select_one
      options:
      - More than 6 months ago
      - Less than 6 months ago
      - 1-2 months ago
      - Less than 1 month ago
      required: false
    - id: 9
      name: exercise_risk_factors
      label: Exercise Risk Factors
      hint: null
      type: select_multiple
      options:
      - Heart Conditions
      - High Blood Pressure
      - Other
      required: false
    - id: 10
      name: exercise_contraindications
      label: Exercise Contradictions
      hint: null
      type: select_multiple
      options:
      - None
      - Knee Problems
      - Back Problems
      required: false
    - id: 11
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_phone
      label: Emergency Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: emergency_address
      label: Emergency Address
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: emergency_relationship
      label: Relationship
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 16
      name: medical_procedure_details
      label: Medical Procedure Details
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: emergency_notes
      label: Emergency Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: medical_history_details
      label: Medical History Details
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: medical_certificate
      label: Medical Certificate
      hint: null
      type: text
      options: []
      required: false
