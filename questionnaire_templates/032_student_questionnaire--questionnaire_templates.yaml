inputSchema:
  type: object
  properties:
    title: Student Questionnaire
    pages:
    - id: 1
      name: school_rating
      label: School Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: teacher_rating
      label: Teacher Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: classroom_rating
      label: Classroom Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: school_facilities
      label: School Facilities
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: school_services
      label: School Services
      hint: null
      type: select_multiple
      options:
      - Always
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 6
      name: teacher_availability
      label: Teacher Availability
      hint: null
      type: select_multiple
      options:
      - Very Responsive
      - Somewhat Responsive
      - Not Very Responsive
      required: false
    - id: 7
      name: overall_experience
      label: Overall Experience
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: school_culture
      label: School Culture
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
