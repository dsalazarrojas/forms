inputSchema:
  type: object
  properties:
    title: Online Training Consultation Questionnaire
    pages:
    - id: 1
      name: goals
      label: What are your goals
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: current_progress
      label: current_progress
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: health_details
      label: Health details e g weight height etc
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: training_frequency
      label: How often do you train per week
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: nutrition_plan
      label: nutrition_plan
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: motivation
      label: motivation
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: exercise_routine
      label: Exercise routine e g cardio strength endurance etc
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_conditions
      label: Do you have any medical conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: doctor_relevant
      label: Is this relevant to your doctor
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      required: false
