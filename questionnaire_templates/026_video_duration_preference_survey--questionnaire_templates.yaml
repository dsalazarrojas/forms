inputSchema:
  type: object
  properties:
    title: Video Duration Preference Survey
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: video_info
      label: video_length
      hint: null
      type: select_one
      options:
      - less than 1 minute
      - 1-2 minutes
      - 2-5 minutes
      - more than 5 minutes
      required: false
    - id: 3
      name: preferred_platform
      label: Preferred Platform
      hint: null
      type: select_multiple
      options:
      - YouTube
      - Facebook
      - Instagram
      - TikTok
      - Twitter
      - Twitch
      - LinkedIn
      - Vimeo
      required: false
    - id: 4
      name: viewing_habits
      label: Viewing Habits
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: time_of_day
      label: Time of Day
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: general_note
      label: General Note
      hint: null
      type: note
      options: []
      required: false
