inputSchema:
  type: object
  properties:
    title: Video Duration Preference Survey
    pages:
    - id: 1
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: video_info
      label: video_length
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''value'': ''less than 1 minute''}'
      - '{''id'': 2, ''value'': ''1-2 minutes''}'
      - '{''id'': 3, ''value'': ''2-5 minutes''}'
      - '{''id'': 4, ''value'': ''more than 5 minutes''}'
      required: false
    - id: 3
      name: preferred_platform
      label: Preferred Platform
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''value'': ''YouTube''}'
      - '{''id'': 2, ''value'': ''Facebook''}'
      - '{''id'': 3, ''value'': ''Instagram''}'
      - '{''id'': 4, ''value'': ''TikTok''}'
      - '{''id'': 5, ''value'': ''Twitter''}'
      - '{''id'': 6, ''value'': ''Twitch''}'
      - '{''id'': 7, ''value'': ''LinkedIn''}'
      - '{''id'': 8, ''value'': ''Vimeo''}'
      required: false
    - id: 4
      name: viewing_habits
      label: Viewing Habits
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: time_of_day
      label: Time of Day
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''value'': ''Morning''}'
      - '{''id'': 2, ''value'': ''Afternoon''}'
      - '{''id'': 3, ''value'': ''Evening''}'
      required: false
    - id: 6
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: general_note
      label: General Note
      hint: null
      type: note
      options: []
      required: false
