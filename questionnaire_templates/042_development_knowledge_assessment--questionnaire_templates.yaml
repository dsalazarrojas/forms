inputSchema:
  type: object
  properties:
    title: Development Knowledge Assessment
    pages:
    - id: 1
      name: intro_page
      label: Development Knowledge Assessment
      hint: This is a questionnaire to assess your development knowledge and experience.
      type: note
      options: []
      required: false
    - id: 2
      name: question_2
      label: Your Development Background
      hint: Please provide a brief description of your development background.
      type: text
      options: []
      required: false
    - id: 3
      name: question_3
      label: Programming Languages
      hint: Please select all programming languages you are familiar with.
      type: select_multiple
      options:
      - C
      - Java
      - Python
      - JavaScript
      - Ruby
      - PHP
      - C++
      - C#
      - Swift
      - Kotlin
      - Go
      - R
      - Lua
      - Scala
      - Rust
      - Haskell
      required: false
    - id: 4
      name: question_4
      label: Development Environment
      hint: Please select all development environments you are familiar with.
      type: select_multiple
      options:
      - Visual Studio Code
      - IntelliJ IDEA
      - Eclipse
      - Visual Studio
      - NetBeans
      - Android Studio
      - Xcode
      - WebStorm
      - PyCharm
      - Visual Paradigm
      - Rider
      required: false
    - id: 5
      name: question_5
      label: Development Process
      hint: Please select all development processes you are familiar with.
      type: select_multiple
      options:
      - Agile
      - Waterfall
      - Scrum
      - Kanban
      required: false
    - id: 6
      name: question_6
      label: Code Review
      hint: Please indicate how often you perform code review.
      type: select_multiple
      options:
      - Always
      - Frequently
      - Occasionally
      - Never
      required: false
    - id: 7
      name: question_7
      label: Testing Approach
      hint: Please select all testing approaches you are familiar with.
      type: select_multiple
      options:
      - Unit Testing
      - Integration Testing
      - System Testing
      - Automated Testing
      - Manual Testing
      required: false
    - id: 8
      name: question_8
      label: Code Quality
      hint: Please rate your code quality based on industry standards.
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      required: false
    - id: 9
      name: question_9
      label: Time Management
      hint: Please indicate how you manage your time in development projects.
      type: select_multiple
      options:
      - Agile
      - Scrum
      - Kanban
      - Gantt
      - Waterfall
      required: false
    - id: 10
