inputSchema:
  type: object
  properties:
    title: Static Question Survey
    pages:
    - id: 1
      name: intro_section
      label: What is your current role or position in the company/organization?
      hint: Please describe your role or position.
      type: text
      options: []
      required: false
    - id: 2
      name: feature_usage
      label: How often do you use the feature?
      hint: Select a frequency of use.
      type: select_one
      options:
      - Daily
      - Weekly
      - Rarely
      - Never
      required: false
    - id: 3
      name: date_last_used
      label: On what date did you last use the feature?
      hint: Please use YYYY-MM-DD format.
      type: date
      options: []
      required: false
    - id: 4
      name: time_last_used
      label: At what time did you last use the feature?
      hint: Please use 24-hour format.
      type: time
      options: []
      required: false
    - id: 5
      name: how_often_used
      label: How Often Used
      hint: Select a frequency of use.
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Never
      required: false
    - id: 6
      name: how_much_time_used
      label: How much time do you spend using the feature?
      hint: Select a time duration.
      type: select_one
      options:
      - 1-5 minutes
      - 5-30 minutes
      - 30-60 minutes
      - 1-2 hours
      required: false
    - id: 7
      name: how_much_time_last_used
      label: How much time did you spend using the feature last time?
      hint: Select a time duration.
      type: select_one
      options:
      - 1-5 minutes
      - 5-30 minutes
      - 30-60 minutes
      - 1-2 hours
      required: false
    - id: 8
      name: how_satisfying_is_the_feature
      label: How satisfactory do you find the feature?
      hint: Select a level of satisfaction.
      type: select_one
      options:
      - Satisfied
      - Neutral
      - Dissatisfied
      required: false
    - id: 9
      name: feedback
      label: Do you have any other comments or feedback about the feature?
      hint: Please provide additional comments.
      type: text
      options: []
      required: false
    - id: 10
      name: contact_name
      label: What is your name?
      hint: Please provide your name.
      type: text
      options: []
      required: false
    - id: 11
      name: contact_email
      label: What is your email address?
      hint: Please provide your email address.
      type: email
      options: []
      required: false
    - id: 12
      name: contact_phone
      label: What is your phone number?
      hint: Please provide your phone number.
      type: text
      options: []
      required: false
    - id: 13
      name: would_you_recommend
      label: Would you recommend the feature to others?
      hint: Select a level of recommendation.
      type: select_multiple
      options:
      - Highly
      - Somewhat
      - Not at all
      required: false
    - id: 14
      name: suggestion
      label: Do you have any suggestions for improvement or new features?
      hint: Please provide your suggestions.
      type: text
      options: []
      required: false
