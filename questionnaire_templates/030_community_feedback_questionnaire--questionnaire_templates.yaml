inputSchema:
  type: object
  properties:
    title: Community Feedback Questionnaire
    pages:
      - id: 1
        name: respondent_name
        label: Name (Optional)
        hint: Your name if you wish to share
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: For follow-up
        type: email
        options: []
        required: false
      - id: 3
        name: zip_code
        label: ZIP Code
        hint: Your ZIP code
        type: text
        options: []
        required: true
      - id: 4
        name: resident_status
        label: Residency Status
        hint: Do you live in the community?
        type: select_one
        options:
          - Resident
          - Business Owner
          - Employee
          - Visitor
        required: true
      - id: 5
        name: service_usage
        label: Community Services Used
        hint: Select services you have used
        type: select_multiple
        options:
          - Parks and Recreation
          - Library Services
          - Public Transportation
          - Waste Collection
          - Street Maintenance
          - Public Safety
          - Community Centers
          - None
        required: true
      - id: 6
        name: parks_rating
        label: Parks and Recreation Rating
        hint: Rate these services
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Used
        required: true
      - id: 7
        name: library_rating
        label: Library Services Rating
        hint: Rate library services
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Used
        required: true
      - id: 8
        name: transportation_rating
        label: Public Transportation Rating
        hint: Rate transit services
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Not Used
        required: true
      - id: 9
        name: safety_rating
        label: Public Safety Rating
        hint: Rate police and fire services
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: cleanliness_rating
        label: Community Cleanliness Rating
        hint: Rate overall cleanliness
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 11
        name: communication_rating
        label: Community Communication Rating
        hint: Rate how well informed you feel
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 12
        name: best_services
        label: Best Community Services
        hint: What works well?
        type: text
        options: []
        required: false
      - id: 13
        name: needs_improvement
        label: Services Needing Improvement
        hint: What needs work?
        type: text
        options: []
        required: false
      - id: 14
        name: priority_issues
        label: Priority Issues to Address
        hint: What should be addressed first?
        type: text
        options: []
        required: false
      - id: 15
        name: community_events
        label: Community Events Satisfaction
        hint: Rate local events
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 16
        name: future_suggestions
        label: Suggestions for Future
        hint: Your ideas for improvement
        type: text
        options: []
        required: false
