      name: game_level_designer
      label: Game Level Designer
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 4
      name: team_lead
      label: Team Lead
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
