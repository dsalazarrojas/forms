inputSchema:
  type: object
  properties:
    title: Plant Preference Quiz
    pages:
    - id: 1
      name: plant_preferred
      label: What is your favorite houseplant?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: plant_type
      label: Plant Type
      hint: null
      type: select_one
      options:
      - Fiddle Leaf
      - Fern
      - Succulent
      required: false
    - id: 3
      name: plant_size
      label: Plant Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 4
      name: plant_location
      label: Where do you live?
      hint: null
      type: select_one
      options:
      - Urban
      - Rural
      required: false
    - id: 5
      name: plant_sens
      label: Sensitivity
      hint: null
      type: select_multiple
      options:
      - Light
      - Medium
      - Dark
      required: false
    - id: 6
      name: plant_color
      label: Plant Color
      hint: null
      type: select_one
      options:
      - Green
      - Blue
      - Red
      required: false
    - id: 7
      name: plant_ownership
      label: Plant Ownership
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: plant_purpose
      label: Plant Purpose
      hint: null
      type: select_multiple
      options:
      - Decoration
      - Health
      - Aesthetic
      required: false
    - id: 9
      name: plant_situation
      label: Plant Situation
      hint: null
      type: select_multiple
      options:
      - Outdoor
      - Indoor
      required: false
    - id: 10
      name: plant_dedication
      label: Plant Dedication
      hint: null
      type: text
      options: []
      required: false
