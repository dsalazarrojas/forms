      - monthly
      - quarterly
      - annually
      required: false
    - id: 3
      name: contribution_amount
      label: contribution_amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: expected_retirement_date
      label: expected_retirement_date
      hint: null
      type: date
      options: []
      required: false
