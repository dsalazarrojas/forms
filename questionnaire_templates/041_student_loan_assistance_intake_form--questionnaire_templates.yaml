      name: loan_status
      label: Loan Status
      hint: null
      type: select_one
      options:
      - Delinquent
      - Deferment
      - Deferment Forgiveness
      - Default
      required: false
    - id: 6
      name: current_employment_status
      label: Current Employment Status
      hint: null
      type: select_multiple
      options:
      - Employed
      - Not Employed
      required: false
    - id: 7
      name: income_level
      label: Income Level
      hint: null
      type: select_multiple
      options:
      - Less than 20,000
