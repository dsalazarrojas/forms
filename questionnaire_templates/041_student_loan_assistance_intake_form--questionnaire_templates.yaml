inputSchema:
  type: object
  properties:
    title: Student Loan Assistance Intake Form
    pages:
    - id: 1
      name: main_page
      label: Student Loan Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_loan_borrower
      label: Student Loan Borrower
      hint: Enter Student Loan Borrower Name
      type: text
      options: []
      required: false
    - id: 3
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: school_address
      label: School Address
      hint: null
      type: text
      options: []
      required: false
