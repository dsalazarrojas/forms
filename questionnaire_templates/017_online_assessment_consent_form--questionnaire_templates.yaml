inputSchema:
  type: object
  properties:
    title: Online Assessment Consent Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: agreement
      label: Agreement
      hint: null
      type: select_multiple
      options:
      - I have read and understand the above information
      - I have read and understand the above information, and I consent to participate.
      - I do not have time to finish reading, and I do not consent to participate.
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: additional_consent
      label: Additional Consent
      hint: null
      type: text
      options: []
      required: false
