inputSchema:
  type: object
  properties:
    title: AFC Demographic Questionnaire
    pages:
    - id: 1
      name: section_header_personal
      label: '--- Personal Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Please enter your legal name as it appears on official documents
      type: text
      options: []
      required: true
    - id: 3
      name: preferred_name
      label: Preferred name
      hint: If different from your legal name, enter the name you prefer to be called
      type: text
      options: []
      required: false
    - id: 4
      name: email_address
      label: Email address
      hint: This will be used for all official communications
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone number
      hint: Include area code
      type: phone
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: gender_identity
      label: Gender identity
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 8
      name: race_ethnicity
      label: Race/Ethnicity (select all that apply)
      hint: null
      type: select_multiple
      options:
      - White
      - Black or African American
      - Hispanic or Latino
      - Asian
      - Native American or Alaska Native
      - Native Hawaiian or Pacific Islander
      - Two or more races
      - Other
      - Prefer not to say
      required: false
    - id: 9
      name: section_header_employment
      label: '--- Employment Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: employee_id
      label: Employee ID
      hint: Found on your employee badge or pay stub
      type: text
      options: []
      required: true
    - id: 11
      name: job_title
      label: Current job title
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Administration
      - Operations
      - Finance
      - Human Resources
      - Marketing
      - Information Technology
      - Customer Service
      - Other
      required: true
    - id: 13
      name: employment_start_date
      label: Employment start date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: employment_type
      label: Employment type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Temporary
      required: true
    - id: 15
      name: annual_salary_range
      label: Annual salary range
      hint: null
      type: select_one
      options:
      - Under $30,000
      - $30,000-$49,999
      - $50,000-$69,999
      - $70,000-$89,999
      - $90,000-$109,999
      - $110,000 or more
      required: false
    - id: 16
      name: education_level
      label: Highest level of education completed
      hint: null
      type: select_one
      options:
      - High school diploma or equivalent
      - Associate degree
      - Bachelor's degree
      - Master's degree
      - Doctoral degree
      - Professional degree
      required: false
    - id: 17
      name: section_header_diversity
      label: '--- Diversity & Inclusion ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: veteran_status
      label: Veteran status
      hint: null
      type: select_one
      options:
      - Veteran
      - Active duty
      - Spouse of veteran
      - Not a veteran
      - Prefer not to say
      required: false
    - id: 19
      name: disability_status
      label: Do you have a disability that affects your work?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Prefer not to say
      required: false
    - id: 20
      name: primary_language
      label: Primary language spoken at home
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: section_header_satisfaction
      label: '--- Satisfaction & Feedback ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: satisfaction_with_benefits
      label: How satisfied are you with AFC's benefits package?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 23
      name: workplace_inclusion_rating
      label: Rate your sense of inclusion at AFC (1-10)
      hint: 1 = strongly disagree, 10 = strongly agree
      type: integer
      options: []
      required: false
    - id: 24
      name: suggestions_for_improvement
      label: What could AFC do to better support diversity and inclusion?
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional comments or notes
      hint: null
      type: text
      options: []
      required: false
