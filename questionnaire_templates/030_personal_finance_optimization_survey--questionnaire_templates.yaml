inputSchema:
  type: object
  properties:
    title: Personal Finance Optimization Survey
    pages:
    - id: 1
      name: money_habits
      label: Money Habits
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: financial_goals
      label: Financial Goals
      hint: null
      type: select_one
      options:
      - I have short-term financial goals
      - I have long-term financial goals
      - I do not have financial goals
      required: false
    - id: 3
      name: income_frequency
      label: Income Frequency
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Annually
      - Irregular
      required: false
    - id: 4
      name: spending_frequency
      label: Spending Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Bi-Weekly
      - Monthly
      required: false
    - id: 5
      name: money_savings
      label: Money Savings
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: emergency_funds
      label: Emergency Funds
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: bill_payment
      label: Bill Payment
      hint: null
      type: select_multiple
      options:
      - On time
      - Late
      - Unpaid
      required: false
    - id: 8
      name: savings_amount
      label: Savings Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: income
      label: Income
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: expense_tracking
      label: Expense Tracking
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: financial_planning
      label: Financial Planning
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: financial_advice
      label: Financial Advice
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
