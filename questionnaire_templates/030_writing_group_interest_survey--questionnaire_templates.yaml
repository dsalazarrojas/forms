inputSchema:
  type: object
  properties:
    title: Writing Group Interest Survey
    pages:
    - id: 1
      name: intro
      label: Introduction
      hint: Welcome to this Writing Group Interest Survey.
      type: note
      options: []
      required: false
    - id: 2
      name: about_you_1
      label: What is your primary role in the group?
      hint: Please select one of the options below.
      type: select_one
      options:
      - I am a writer/author
      - I am an editor/publisher
      - I am a reader/fan
      - Other (please specify)
      required: false
    - id: 3
      name: about_you_2
      label: What brings you here?
      hint: Please provide a brief explanation.
      type: text
      options: []
      required: false
    - id: 4
      name: writing_group
      label: What type of writing group are you interested in?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Creative Writing Group
      - Non-Fiction Writing Group
      - Poetry Group
      - Playwriting Group
      required: false
    - id: 5
      name: writing_group_preferences
      label: What type of writing group settings would you like?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Online
      - In-person
      - Hybrid
      - Flexible/remote
      required: false
    - id: 6
      name: writing_group_schedules
      label: What schedule would you like for your writing group?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Weekly
      - Bi-weekly
      - Monthly
      - Flexible
      required: false
    - id: 7
      name: about_me
      label: About You
      hint: Please provide a brief description.
      type: text
      options: []
      required: false
    - id: 8
      name: what_we_can_do
      label: What would you like to achieve or gain in the group?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Feedback
      - Networking
      - Community
      - Professional growth
      required: false
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: Please provide any other comments or thoughts.
      type: text
      options: []
      required: false
    - id: 10
      name: thank_you
      label: Thank You
      hint: We value your time and participation.
      type: text
      options: []
      required: false
