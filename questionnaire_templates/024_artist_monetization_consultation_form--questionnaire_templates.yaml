inputSchema:
  type: object
  properties:
    title: Artist Monetization Consultation Form
    pages:
    - id: 1
      name: artist_name
      label: Artist or Creator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: artist_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: artist_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: art_medium
      label: Primary Art Medium or Genre
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: years_active
      label: Years Active as Artist
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: current_income
      label: Current Annual Income from Art
      hint: Approximate range
      type: select_one
      options:
      - Under 10000
      - 10000-25000
      - 25000-50000
      - 50000-100000
      - 100000+
      required: false
    - id: 7
      name: income_sources
      label: Current Income Sources
      hint: null
      type: select_multiple
      options:
      - Sales
      - Commissions
      - Teaching
      - Grants
      - Crowdfunding
      - Patronage
      - Social Media
      - Other
      required: true
    - id: 8
      name: monthly_engagement
      label: Monthly Online Engagement or Followers
      hint: Approximate total across platforms
      type: number
      options: []
      required: false
    - id: 9
      name: social_platforms
      label: Active Social Media Platforms
      hint: null
      type: select_multiple
      options:
      - Instagram
      - TikTok
      - YouTube
      - Twitter
      - Facebook
      - LinkedIn
      - Other
      required: false
    - id: 10
      name: website_active
      label: Active Website or E-Commerce
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - In Development
      required: false
    - id: 11
      name: consultation_goals
      label: Consultation Goals
      hint: What do you want to achieve
      type: text
      options: []
      required: true
    - id: 12
      name: revenue_challenges
      label: Main Revenue Challenges
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: growth_areas
      label: Areas for Growth or Expansion
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: business_experience
      label: Business or Marketing Experience
      hint: null
      type: select_one
      options:
      - Extensive
      - Some
      - Limited
      - None
      required: false
    - id: 15
      name: consultation_type
      label: Type of Consultation Preferred
      hint: null
      type: select_one
      options:
      - One-Time Session
      - Ongoing Coaching
      - Strategy Intensive
      required: true
    - id: 16
      name: timeline
      label: Desired Timeline for Results
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: budget
      label: Budget for Consultation
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: additional_notes
      label: Additional Information or Questions
      hint: null
      type: text
      options: []
      required: false
