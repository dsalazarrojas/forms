inputSchema:
  type: object
  properties:
    title: Country Entry Health and Travel Questionnaire
    pages:
    - id: 1
      name: pre_arrival_travel
      label: Pre Arrival Travel
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: health_screening
      label: Health Screening
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: travel_history
      label: Travel History
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: travel_frequency
      label: Travel Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      required: false
    - id: 5
      name: flight_info
      label: Flight Info
      hint: null
      type: text
      options: []
      required: false
