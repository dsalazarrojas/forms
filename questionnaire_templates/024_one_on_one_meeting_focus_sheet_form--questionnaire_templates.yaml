inputSchema:
  type: object
  properties:
    title: one_on_one_meeting_focus_sheet_form
    pages:
    - id: 1
      name: meeting_topic
      label: Meeting Topic
      hint: Please describe the meeting topic
      type: text
      options: []
      required: true
    - id: 2
      name: meeting_date
      label: Meeting Date
      hint: Please select the meeting date
      type: date
      options: []
      required: true
    - id: 3
      name: meeting_time
      label: Meeting Time
      hint: Please select the meeting time
      type: time
      options: []
      required: false
    - id: 4
      name: meeting_outcomes
      label: Meeting Outcomes
      hint: Please describe the meeting outcomes
      type: text
      options: []
      required: true
    - id: 5
      name: next_steps
      label: Next Steps
      hint: Please describe the next steps
      type: text
      options: []
      required: true
    - id: 6
      name: next_meeting
      label: Next Meeting
      hint: Please select the next meeting date
      type: date
      options: []
      required: false
    - id: 7
      name: minimalism
      label: Importance of Minimalism
      hint: Please select how important is minimalism in this meeting
      type: select_multiple
      options:
      - Very important
      - Somewhat important
      - Not at all important
      required: false
    - id: 8
      name: meeting_notes
      label: Meeting Notes
      hint: Please describe the meeting notes
      type: note
      options: []
      required: false
    - id: 9
      name: minimalism2
      label: Minimalism Relevant
      hint: Do you think minimalism is relevant in this meeting
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: minimalism3
      label: Minimalism Importance
      hint: Please select the importance of minimalism in this meeting
      type: number
      options: []
      required: false
    - id: 11
      name: next_meeting2
      label: Next Meeting2
      hint: Please select the next meeting date
      type: date
      options: []
      required: false
    - id: 12
      name: minimalism4
      label: Minimalism Follow-up
      hint: Please describe the minimalism follow-up
      type: text
      options: []
      required: false
