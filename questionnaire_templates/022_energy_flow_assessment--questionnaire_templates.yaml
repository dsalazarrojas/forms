inputSchema:
  type: object
  properties:
    title: Energy Flow Assessment
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: site_info
      label: Site Information
      hint: null
      type: select_multiple
      options:
      - Site Name
      - Site ID
      - Site Location
      - Site Capacity
      required: false
    - id: 3
      name: energy_flow
      label: Energy Flow
      hint: null
      type: select_one
      options:
      - Site Inflow
      - Process Inflow
      - Transmission Inflow
      - Distribution Inflow
      - Site Outflow
      - Process Outflow
      - Transmission Outflow
      - Distribution Outflow
      required: false
    - id: 4
      name: loss_areas
      label: Loss Areas
      hint: null
      type: select_multiple
      options:
      - Site Equipment Loss
      - Pipe Leakage
      - Heat Gain Loss
      - Transmission Loss
      - Distribution Loss
      required: false
    - id: 5
      name: efficiency_planning
      label: Efficiency Planning
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: site_data
      label: Site Data
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: site_comments
      label: Site Comments
      hint: null
      type: text
      options: []
      required: false
