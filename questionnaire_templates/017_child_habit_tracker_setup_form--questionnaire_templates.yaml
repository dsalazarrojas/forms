inputSchema:
  type: object
  properties:
    title: Child Habit Tracker Setup Form
    pages:
    - id: 1
      name: section_family_details
      label: -- Family Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent Full Name
      hint: Primary account holder
      type: text
      options: []
      required: true
    - id: 3
      name: child_name
      label: Child Full Name
      hint: Student or athlete
      type: text
      options: []
      required: true
    - id: 4
      name: section_habit_selection
      label: -- Habit Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: habits_to_track
      label: Habits to Track
      hint: Select all that apply
      type: select_multiple
      options:
      - Brushing Teeth Twice Daily
      - Tidying Room and Toys
      - Reading for 20 Minutes
      - Completing Homework on Time
      - Eating All Vegetables
      required: true
    - id: 6
      name: section_tracking_plan
      label: -- Tracking Plan --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: tracking_frequency
      label: Tracking Frequency
      hint: When will progress be recorded?
      type: select_one
      options:
      - Daily Basis
      - Weekdays only
      - Weekends only
      required: true
    - id: 8
      name: reward_system
      label: Reward System Type
      hint: Positive reinforcement method
      type: select_one
      options:
      - Sticker Chart
      - Extra Screen Time
      - Small Toy or Prize
      - Special Family Outing
      required: true
    - id: 9
      name: monthly_goal
      label: Specific Goal for this Month
      hint: e.g., 20 days of reading
      type: text
      options: []
      required: true
    - id: 10
      name: section_start_details
      label: -- Start Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: start_date
      label: Proposed Start Date
      hint: When should tracking begin?
      type: date
      options: []
      required: true
    - id: 12
      name: send_reminders
      label: Send weekly progress reminders?
      hint: Delivered via email
      type: select_one
      options:
      - Yes - Email reminders
      - No - I will track manually
      required: true
