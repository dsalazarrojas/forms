inputSchema:
  type: object
  properties:
    title: Child Habit Tracker Setup Form
    pages:
      - id: 1
        name: section_family_details
        label: -- Family Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: parent_name
        label: Parent Full Name
        hint: Primary account holder
        type: text
        options: []
        required: true
      - id: 3
        name: child_name
        label: Child Full Name
        hint: Student or athlete
        type: text
        options: []
        required: true
      - id: 4
        name: section_habit_selection
        label: -- Habit Selection --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: habits_to_track
        label: Habits to Track
        hint: Select all that apply
        type: select_multiple
        options:
          - label: Brushing Teeth Twice Daily
            value: teeth
          - label: Tidying Room and Toys
            value: tidy
          - label: Reading for 20 Minutes
            value: reading
          - label: Completing Homework on Time
            value: homework
          - label: Eating All Vegetables
            value: veggies
        required: true
      - id: 6
        name: section_tracking_plan
        label: -- Tracking Plan --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: tracking_frequency
        label: Tracking Frequency
        hint: When will progress be recorded?
        type: select_one
        options:
          - label: Daily Basis
            value: daily
          - label: Weekdays only
            value: weekdays
          - label: Weekends only
            value: weekends
        required: true
      - id: 8
        name: reward_system
        label: Reward System Type
        hint: Positive reinforcement method
        type: select_one
        options:
          - label: Sticker Chart
            value: stickers
          - label: Extra Screen Time
            value: screen
          - label: Small Toy or Prize
            value: toy
          - label: Special Family Outing
            value: outing
        required: true
      - id: 9
        name: monthly_goal
        label: Specific Goal for this Month
        hint: e.g., 20 days of reading
        type: text
        options: []
        required: true
      - id: 10
        name: section_start_details
        label: -- Start Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: start_date
        label: Proposed Start Date
        hint: When should tracking begin?
        type: date
        options: []
        required: true
      - id: 12
        name: send_reminders
        label: Send weekly progress reminders?
        hint: Delivered via email
        type: select_one
        options:
          - label: Yes - Email reminders
            value: yes
          - label: No - I will track manually
            value: no
        required: true
