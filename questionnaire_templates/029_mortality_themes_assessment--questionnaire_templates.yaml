inputSchema:
  type: object
  properties:
    title: Mortality Themes Assessment
    pages:
    - id: 1
      name: participant_perspective
      label: Participant Perspectives
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: mortality_themes
      label: Mortality Themes
      hint: null
      type: select_multiple
      options:
      - Threat
      - Loss
      - Transcendence
      - Immortality
      - Legacy
      - Self-Discovery
      - Acceptance
      - Acceptance/Rejection
      - Existential
      - Fear of Death
      required: false
    - id: 3
      name: mortality_fears
      label: Mortality Fears
      hint: null
      type: select_multiple
      options:
      - Fear of the Unknown
      - Fear of Pain
      - Fear of Loss
      - Fear of Isolation
      - Fear of Abandonment
      required: false
