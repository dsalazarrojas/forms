inputSchema:
  type: object
  properties:
    title: Social Security Consumer Questionnaire
    pages:
    - id: 1
      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: awareness
      label: Awareness
      hint: null
      type: select_one
      options:
      - Very Likely
      - Not Very Likely
      - Not At All Likely
      required: false
    - id: 3
      name: usage
      label: Usage
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: concerns
      label: Concerns
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neither Satisfied Nor Unsatisfied
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
