inputSchema:
  type: object
  properties:
    title: workforce_capability_index_survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: workforces
      label: Workforces
      hint: null
      type: select_multiple
      options:
      - Accounting and Finance
      - Engineering
      - IT
      - Management
      - Research
      required: false
    - id: 3
      name: categories
      label: Categories
      hint: null
      type: select_multiple
      options:
      - Analytical
      - Communication
      - Leadership
      - Problem Solving
      - Technical
      - Time Management
      - Workforce Development
      required: true
    - id: 4
      name: categories_score
      label: Category Score (0-4)
      hint: Enter score for each category
      type: number
      options: []
      required: false
    - id: 5
      name: scores
      label: Scores
      hint: null
      type: select_one
      options:
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      required: false
    - id: 6
      name: overall_score
      label: Overall Score
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: Please enter any other feedback or comments
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
