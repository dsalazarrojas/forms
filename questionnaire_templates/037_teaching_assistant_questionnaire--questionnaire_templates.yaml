inputSchema:
  type: object
  properties:
    title: teaching_assistant_questionnaire
    pages:
    - id: 1
      name: teaching_assistant_questionnaire
      label: teaching_assistant_questionnaire
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: role_of_teaching_assistant
      label: Role of teaching assistant
      hint: null
      type: select_one
      options:
      - primary tutor
      - secondary tutor
      - teaching tutor
      required: false
    - id: 3
      name: teaching_assistant_questionnaire_response
      label: How often would you like to receive updates from teaching assistants?
      hint: null
      type: select_multiple
      options:
      - once a week
      - once a month
      - never
      required: false
    - id: 4
      name: teaching_assistant_questionnaire_description
      label: Description of the teaching assistant's role
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: teaching_assistant_questionnaire_response_2
      label: How would you like to contact the teaching assistant?
      hint: null
      type: select_multiple
      options:
      - email
      - text
      - phone
      required: false
    - id: 6
      name: teaching_assistant_questionnaire_response_3
      label: Are you satisfied with the teaching assistant?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: teaching_assistant_questionnaire_response_4
      label: Comments on the teaching assistant
      hint: null
      type: text
      options: []
      required: false
