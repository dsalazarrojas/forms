inputSchema:
  type: object
  properties:
    title: AMS Questionnaire
    pages:
    - id: 1
      name: patient_full_name
      label: Patient Full Name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 2
      name: patient_dob
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: true
    - id: 3
      name: patient_phone
      label: Phone Number
      hint: Contact number for appointment scheduling
      type: text
      options: []
      required: true
    - id: 4
      name: patient_email
      label: Email Address
      hint: Email for appointment reminders and results
      type: email
      options: []
      required: false
    - id: 5
      name: current_age
      label: Current Age
      hint: Your current age in years
      type: number
      options: []
      required: true
    - id: 6
      name: height
      label: Height
      hint: Your height in centimeters
      type: number
      options: []
      required: true
    - id: 7
      name: weight
      label: Weight
      hint: Your current weight in kilograms
      type: number
      options: []
      required: true
    - id: 8
      name: physical_activity_level
      label: Physical Activity Level
      hint: How physically active are you?
      type: select_one
      options:
      - Sedentary
      - Lightly Active
      - Moderately Active
      - Very Active
      - Extremely Active
      required: true
    - id: 9
      name: smoking_status
      label: Smoking Status
      hint: Do you smoke cigarettes?
      type: select_one
      options:
      - Never Smoked
      - Former Smoker
      - Current Smoker
      required: true
    - id: 10
      name: alcohol_consumption
      label: Alcohol Consumption
      hint: How often do you consume alcohol?
      type: select_one
      options:
      - Never
      - Occasionally
      - Moderately
      - Frequently
      required: true
    - id: 11
      name: general_health_rating
      label: General Health Rating
      hint: How would you rate your overall health?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: sleep_quality
      label: Sleep Quality
      hint: How would you rate your sleep quality?
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 13
      name: fatigue_level
      label: Fatigue Level
      hint: How often do you feel tired or fatigued?
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      - Always
      required: true
    - id: 14
      name: physical_strength_decline
      label: Decline in Physical Strength
      hint: Have you noticed a decline in your physical strength?
      type: select_one
      options:
      - No Decline
      - Slight Decline
      - Moderate Decline
      - Significant Decline
      required: true
    - id: 15
      name: mood_changes
      label: Mood Changes
      hint: Have you experienced mood changes or irritability?
      type: select_one
      options:
      - No Changes
      - Occasional
      - Frequent
      - Constant
      required: true
    - id: 16
      name: sexual_desire
      label: Sexual Desire
      hint: How would you rate your current sexual desire?
      type: select_one
      options:
      - Very High
      - High
      - Normal
      - Low
      - Very Low
      required: true
    - id: 17
      name: erectile_function
      label: Erectile Function
      hint: How would you rate your erectile function?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Very Poor
      required: true
    - id: 18
      name: hot_flushes
      label: Hot Flushes
      hint: Do you experience hot flushes or night sweats?
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      - Always
      required: true
    - id: 19
      name: concentration_difficulty
      label: Concentration Difficulty
      hint: Do you have difficulty concentrating or remembering things?
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      - Always
      required: true
    - id: 20
      name: depression_symptoms
      label: Depression Symptoms
      hint: Have you experienced symptoms of depression?
      type: select_one
      options:
      - Never
      - Rarely
      - Sometimes
      - Often
      - Always
      required: true
