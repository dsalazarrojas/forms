inputSchema:
  type: object
  properties:
    title: Post Interview Questionnaire
    pages:
    - id: 1
      name: first_name
      label: What is your first name?
      hint: Enter your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: What is your last name?
      hint: Enter your last name
      type: text
      options: []
      required: true
    - id: 3
      name: address_line_1
      label: What is your address line 1?
      hint: Enter your address line 1
      type: text
      options: []
      required: true
    - id: 4
      name: address_line_2
      label: What is your address line 2?
      hint: Enter your address line 2
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: What is your email?
      hint: Enter your email
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: What is your phone number?
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 7
      name: cv_file
      label: Please upload your CV file
      hint: Upload your CV file
      type: text
      options: []
      required: true
    - id: 8
      name: motivation
      label: Why are you interested in this opportunity?
      hint: Enter your motivation
      type: note
      options: []
      required: true
    - id: 9
      name: hobby
      label: What are your hobbies?
      hint: Enter your hobbies
      type: select_multiple
      options:
      - Hiking
      - Reading
      - Sports
      - Music
      required: true
    - id: 10
      name: education
      label: What is your highest level of education completed?
      hint: Enter your education level
      type: select_one
      options:
      - High School
      - Bachelor's degree
      - Master's degree
      required: true
    - id: 11
      name: experience
      label: What is your previous work experience in this field?
      hint: Enter your experience
      type: text
      options: []
      required: false
