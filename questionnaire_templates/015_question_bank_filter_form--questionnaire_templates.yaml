inputSchema:
  type: object
  properties:
    title: Question Bank Filter Form
    pages:
    - id: 1
      name: question_bank_id
      label: Question Bank Id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: subject_area
      label: Subject
      hint: null
      type: select_multiple
      options:
      - Math
      - Science
      - English
      - Social Studies
      required: false
    - id: 3
      name: grade_level
      label: Grade
      hint: null
      type: select_one
      options:
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      - High School
      required: false
    - id: 4
      name: instructional_need
      label: Instructional Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: subject_subtopics
      label: Subject Subtopics
      hint: null
      type: text
      options: []
      required: false
