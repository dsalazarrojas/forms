inputSchema:
  type: object
  properties:
    title: Voice Guidance Preferences Survey
    pages:
    - id: 1
      name: voice_guidance_usage
      label: How often do you use voice guidance?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: satisfaction_level
      label: How satisfied are you with voice guidance?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      - Not at All Satisfied
      required: false
    - id: 3
      name: accessibility_preferences
      label: Which accessibility preferences do you have?
      hint: null
      type: select_multiple
      options:
      - Accessibility Preference 1
      - Accessibility Preference 2
      - Accessibility Preference 3
      - Accessibility Preference 4
      - Accessibility Preference 5
      required: false
    - id: 4
      name: feature_priorities
      label: Which feature priorities do you have?
      hint: null
      type: select_multiple
      options:
      - Feature Priority 1
      - Feature Priority 2
      - Feature Priority 3
      - Feature Priority 4
      - Feature Priority 5
      required: false
    - id: 5
      name: note
      label: Additional notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
