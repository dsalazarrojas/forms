inputSchema:
  type: object
  properties:
    title: Christian Dating Perspectives Survey
    pages:
    - id: 1
      name: section_personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Please provide first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: For follow up or study results
      type: email
      options: []
      required: true
    - id: 4
      name: age_group
      label: Age group
      hint: Select the range that applies to you
      type: select_one
      options:
      - Under 18
      - 18-24
      - 25-34
      - 35-44
      - 45 and above
      required: true
    - id: 5
      name: relationship_status
      label: Relationship status
      hint: Current dating or marital status
      type: select_one
      options:
      - Single
      - Dating
      - Married
      - Separated or Divorced
      required: true
    - id: 6
      name: church_attendance_frequency
      label: Church attendance frequency
      hint: How often do you attend church services
      type: select_one
      options:
      - Weekly
      - Monthly
      - Occasionally
      - Rarely or Never
      required: true
    - id: 7
      name: importance_of_shared_faith
      label: Importance of shared faith in a partner
      hint: Rate from 1 low to 5 high
      type: number
      options: []
      required: true
    - id: 8
      name: communication_preferences
      label: Preferred communication methods
      hint: Select all that apply
      type: select_multiple
      options:
      - In person
      - Phone call
      - Text message
      - Social media
      - Video call
      required: false
    - id: 9
      name: dating_concerns
      label: Main concerns when dating
      hint: Briefly describe any concerns or priorities
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional comments or suggestions
      hint: Optional feedback for community leaders
      type: text
      options: []
      required: false
