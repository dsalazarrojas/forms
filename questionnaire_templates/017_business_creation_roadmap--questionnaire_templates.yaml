      name: business_structure
      label: -- Business Structure --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: business_type
      label: Business Structure
      hint: Select your structure
      type: select_one
      options:
      - Sole Proprietor
      - Partnership
      - Corporation
      - LLC
      - S-Corp
      - Non-Profit
      - Cooperative
      required: true
