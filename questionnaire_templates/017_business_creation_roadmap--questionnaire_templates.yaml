      type: number
      options: []
      required: false
    - id: 6
      name: business_idea
      label: -- Business Idea --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: business_name
      label: Business Name
      hint: What will you call it?
      type: text
      options: []
      required: true
    - id: 8
      name: business_description
      label: Business Description
      hint: What does your business do?
      type: text
      options: []
      required: true
    - id: 9
      name: industry_type
