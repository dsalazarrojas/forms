inputSchema:
  type: object
  properties:
    title: Hospital Waste Reduction Practices Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: waste_streams
      label: Waste Streams
      hint: null
      type: select_one
      options:
      - Food Waste
      - Liquid Waste
      - Solids (non-food)
      - Other
      required: false
    - id: 3
      name: waste_reduction_targets
      label: Waste Reduction Targets
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: reduction_strategies
      label: Waste Reduction Strategies
      hint: Select one or multiple from the list
      type: select_multiple
      options:
      - Reduce
      - Reuse
      - Recycle
      - Other
      required: false
    - id: 5
      name: barriers
      label: Barriers
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: staff_suggestions
      label: Staff Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: responses
      label: Responses
      hint: null
      type: text
      options: []
      required: false
