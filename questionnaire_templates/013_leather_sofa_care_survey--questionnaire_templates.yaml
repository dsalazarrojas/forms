inputSchema:
  type: object
  properties:
    title: Leather Sofa Care Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_information
      label: customer_information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: maintenance_frequency
      label: maintenance_frequency
      hint: How often do you clean your leather sofa?
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      - Never
      required: false
    - id: 4
      name: cleaning_products
      label: cleaning_products
      hint: What cleaning products do you use for your leather sofa?
      type: text
      options: []
      required: false
    - id: 5
      name: care_recommendations
      label: care_recommendations
      hint: What do you think we could improve about our care guidance?
      type: text
      options: []
      required: false
    - id: 6
      name: product_recommendations
      label: product_recommendations
      hint: What products would you recommend for our leather sofa care line?
      type: select_multiple
      options:
      - Leather soap
      - Leather conditioner
      - Fabric protector
      - Microfiber cloth
      - Other
      required: false
    - id: 7
      name: customer_experience
      label: customer_experience
      hint: How would you rate your overall experience with our care guidance?
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Fair
      - Poor
      required: false
    - id: 8
      name: additional_comments
      label: additional_comments
      hint: Is there anything else you would like to share with us?
      type: note
      options: []
      required: false
