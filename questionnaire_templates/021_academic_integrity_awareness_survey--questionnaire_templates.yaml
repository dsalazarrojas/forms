inputSchema:
  type: object
  properties:
    title: Academic Integrity Awareness Survey
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: role
      label: Role
      hint: Your role at the institution
      type: select_one
      options:
      - Student
      - Faculty
      - Staff
      required: true
    - id: 3
      name: awareness_of_policies
      label: Awareness of integrity policies
      hint: How familiar are you with policies
      type: select_one
      options:
      - Very familiar
      - Somewhat familiar
      - Not familiar
      required: true
    - id: 4
      name: observed_misconduct_frequency
      label: Frequency of observed misconduct
      hint: How often have you observed academic misconduct
      type: select_one
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 5
      name: confidence_in_reporting
      label: Confidence in reporting mechanisms
      hint: Rate your confidence in institutional reporting
      type: select_one
      options:
      - Very confident
      - Confident
      - Neutral
      - Not confident
      required: true
    - id: 6
      name: training_received
      label: Have you received integrity training
      hint: Indicate any formal training received
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: suggestions_for_improvement
      label: Suggestions for improving awareness
      hint: Practical steps or resources suggested
      type: text
      options: []
      required: false
    - id: 8
      name: willingness_to_participate
      label: Willingness to join awareness programs
      hint: Indicate interest in participating
      type: select_one
      options:
      - 'True'
      - Maybe
      - 'False'
      required: true
    - id: 9
      name: contact_email
      label: Contact email for follow up
      hint: Optional email if you agree to be contacted
      type: email
      options: []
      required: false
