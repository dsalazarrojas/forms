inputSchema:
  type: object
  properties:
    title: Cryptic Text Analysis Survey
    pages:
    - id: 1
      name: intro_question
      label: What is your interpretation of the ambiguous passage?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: sentiment_question
      label: What is your sentiment towards this passage?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: puzzle_type
      label: What type of puzzle is this?
      hint: null
      type: select_one
      options:
      - Logic
      - Riddle
      - Maze
      - Labyrinth
      required: false
    - id: 4
      name: passage_type
      label: What type of passage is this?
      hint: null
      type: select_one
      options:
      - Story
      - Riddle
      - Joke
      - Puzzle
      required: false
    - id: 5
      name: solution_type
      label: What type of solution is required?
      hint: null
      type: select_one
