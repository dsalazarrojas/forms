inputSchema:
  type: object
  properties:
    title: COVID 19 Daily Screening Questions For Vaccinated Clients
    pages:
      - id: 1
        name: screening_date
        label: Screening Date
        hint: Date of health check-in
        type: date
        options: []
        required: true
      - id: 2
        name: client_name
        label: Client Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 3
        name: client_email
        label: Email Address
        hint: null
        type: email
        options: []
        required: false
      - id: 4
        name: vaccination_confirmation
        label: I confirm that I am fully vaccinated against COVID-19
        hint: Completed primary vaccine series
        type: select_one
        options:
          - "Yes, fully vaccinated"
          - "Partially vaccinated"
          - "Not vaccinated"
          - "Unsure"
        required: true
      - id: 5
        name: booster_status
        label: Have you received a COVID-19 booster dose?
        hint: null
        type: select_one
        options:
          - "Yes - one booster"
          - "Yes - multiple boosters"
          - "No"
          - "Unsure"
        required: false
      - id: 6
        name: last_booster_date
        label: Date of Last Booster Dose
        hint: If applicable
        type: date
        options: []
        required: false
      - id: 7
        name: fever_present
        label: Do you currently have a fever?
        hint: 100.4 degrees F or higher
        type: select_one
        options:
          - "No"
          - "Yes"
          - "Not sure"
        required: true
      - id: 8
        name: cough
        label: Do you have a persistent cough?
        hint: null
        type: select_one
        options:
          - "No"
          - "Yes - mild"
          - "Yes - moderate"
          - "Yes - severe"
        required: true
      - id: 9
        name: shortness_of_breath
        label: Are you experiencing shortness of breath?
        hint: null
        type: select_one
        options:
          - "No"
          - "Yes - mild"
          - "Yes - moderate"
          - "Yes - severe"
        required: true
      - id: 10
        name: loss_taste_smell
        label: Have you experienced loss of taste or smell?
        hint: null
        type: select_one
        options:
          - "No"
          - "Partial loss"
          - "Complete loss"
          - "Not applicable"
        required: true
      - id: 11
        name: fatigue
        label: Are you experiencing unusual fatigue?
        hint: null
        type: select_one
        options:
          - "No"
          - "Mild"
          - "Moderate"
          - "Severe"
        required: false
      - id: 12
        name: sore_throat
        label: Do you have a sore throat?
        hint: null
        type: select_one
        options:
          - "No"
          - "Mild"
          - "Moderate"
          - "Severe"
        required: false
      - id: 13
        name: body_aches
        label: Do you have body aches or muscle pain?
        hint: null
        type: select_one
        options:
          - "No"
          - "Yes"
          - "Severe"
        required: false
      - id: 14
        name: headache
        label: Do you have a headache?
        hint: null
        type: select_one
        options:
          - "No"
          - "Mild"
          - "Moderate"
          - "Severe"
        required: false
      - id: 15
        name: nausea_vomiting
        label: Do you have nausea or vomiting?
        hint: null
        type: select_one
        options:
          - "No"
          - "Yes"
          - "Severe"
        required: false
      - id: 16
        name: diarrhea
        label: Do you have diarrhea?
        hint: null
        type: select_one
        options:
          - "No"
          - "Yes"
          - "Severe"
        required: false
      - id: 17
        name: known_covid_exposure
        label: Have you been exposed to someone with COVID-19?
        hint: In the past 14 days
        type: select_one
        options:
          - "No exposure"
          - "Possible exposure"
          - "Confirmed exposure"
          - "Not sure"
        required: true
      - id: 18
        name: tested_positive_recently
        label: Have you tested positive for COVID-19 recently?
        hint: In the past 30 days
        type: select_one
        options:
          - "No"
          - "Yes"
          - "Prefer not to answer"
        required: true
      - id: 19
        name: recovery_progress
        label: If you had COVID, how is your recovery progressing?
        hint: null
        type: select_one
        options:
          - "Not applicable"
          - "Fully recovered"
          - "Mostly recovered"
          - "Slowly recovering"
          - "Still experiencing symptoms"
        required: false
      - id: 20
        name: breakthrough_infection
        label: Have you had a breakthrough infection despite vaccination?
        hint: null
        type: select_one
        options:
          - "No"
          - "Yes"
          - "Unsure"
        required: false
      - id: 21
        name: overall_health
        label: Overall, how are you feeling today?
        hint: Rate your general health
        type: select_one
        options:
          - "Excellent"
          - "Good"
          - "Fair"
          - "Poor"
        required: true
      - id: 22
        name: additional_concerns
        label: Any other health concerns you want to report?
        hint: Additional symptoms or information
        type: text
        options: []
        required: false
      - id: 23
        name: follow_up_needed
        label: Do you need to follow up with your healthcare provider?
        hint: null
        type: select_one
        options:
          - "No"
          - "Yes"
          - "Unsure"
        required: false
