inputSchema:
  type: object
  properties:
    title: Photo Editing Questionnaire
    pages:
    - id: 1
      name: photo_editing_questionnaire
      label: What is your favorite photo type
      hint: null
      type: select_multiple
      options:
      - Landscape
      - Portrait
      - Panorama
      required: false
    - id: 2
      name: photo_type_2
      label: How important is image resolution
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not Important
      required: false
    - id: 3
      name: preferred_format
      label: Preferred image format
      hint: null
      type: select_multiple
      options:
      - JPEG
      - PNG
      - TIFF
      required: false
    - id: 4
      name: color_depth
      label: What is your preferred color depth
      hint: null
      type: select_one
      options:
      - 8-bit
      - 16-bit
      - 32-bit
      required: false
    - id: 5
      name: photo_editing_questionnaire_5
      label: Do you prefer color or B&W?
      hint: null
      type: select_one
      options:
      - Color
      - B&W
      required: false
    - id: 6
      name: color_mode
      label: What is your preferred color mode?
      hint: null
      type: select_one
      options:
      - CMYK
      - RGB
      - GRAY
      required: false
    - id: 7
      name: image_editing_software
      label: Which image editing software do you use?
      hint: null
      type: select_multiple
      options:
      - Adobe Photoshop
      - GIMP
      - Lightroom
      required: false
    - id: 8
      name: photo_editing_tools
      label: Which photo editing tools do you use?
      hint: null
      type: select_multiple
      options:
      - Camera
      - Lens
      - Tripod
      required: false
    - id: 9
      name: favorite_photo_editing_feature
      label: What is your favorite photo editing feature?
      hint: null
      type: select_multiple
      options:
      - Sharpening
      - Highlighting
      - Blurring
      required: false
    - id: 10
      name: photo_editing_feature_10
      label: Do you like photo touch up?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: photo_editing_questionnaire_11
      label: How often do you use photo touch up?
      hint: null
      type: select_one
      options:
      - Always
      - Often
      - Rarely
      required: false
    - id: 12
      name: photo_editing_questionnaire_12
      label: How important do you think is color correction in photo touch up?
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not Important
      required: false
