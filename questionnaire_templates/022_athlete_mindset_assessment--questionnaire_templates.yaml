inputSchema:
  type: object
  properties:
    title: Athlete Mindset Assessment
    pages:
      - id: 1
        name: profile_header
        label: -- Athlete Profile Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: athlete_name
        label: Athlete Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: sport_position
        label: Sport and Primary Position
        hint: null
        type: text
        options: []
        required: true
      - id: 4
        name: competition_level
        label: Current Level of Competition
        hint: null
        type: select_one
        options:
          - Professional
          - Collegiate
          - Semi-Professional / Amateur
          - High School / Academy
          - Youth / Developmental
        required: true
      - id: 5
        name: motivation_header
        label: -- Motivation and Goal Setting --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: primary_motivation
        label: What is your primary motivation for competing?
        hint: Select the one that fits best
        type: select_one
        options:
