        name: confidence_header
        label: -- Confidence and Self-Belief --
        hint: null
        type: note
        options: []
        required: false
      - id: 10
        name: pressure_confidence
        label: Confidence in Performing Under Pressure
        hint: 1 is Low Confidence, 10 is High Confidence
        type: select_one
        options:
          - 1
