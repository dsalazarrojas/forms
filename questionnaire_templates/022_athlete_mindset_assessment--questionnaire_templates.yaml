          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          - 9
          - 10
        required: true
      - id: 11
        name: mistake_response
        label: How do you typically respond to a major mistake or loss?
        hint: Describe your internal process
        type: text
        options: []
        required: true
      - id: 12
        name: self_talk_frequency
