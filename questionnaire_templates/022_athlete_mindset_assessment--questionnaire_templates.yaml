      - id: 20
        name: overall_mindset_rating
        label: Overall Mental Strength Self-Rating
        hint: 1 is Weak, 10 is Elite
        type: select_one
        options:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          - 9
