inputSchema:
  type: object
  properties:
    title: COVID 19 Resource Support Questionnaire
    pages:
      - id: 1
        name: participant_name_full
        label: Participant Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 2
        name: youth_program_name
        label: Youth Program Name
        hint: e.g. After School Club, Summer Camp
        type: text
        options: []
        required: true
      - id: 3
        name: support_level_cat
        label: Current Level of Community Support
        hint: How supported do you feel currently?
        type: select_one
        options: [Fully supported, Somewhat supported, Neutral, Lacking support, Critical need]
        required: true
      - id: 4
        name: resources_needed_list
        label: Which resources are needed most by your household?
        hint: select all that apply
        type: select_multiple
        options: [Educational materials, Food/Groceries, Hygiene products, Mask/Sanitizer, Emotional support, Childcare info]
        required: true
      - id: 5
        name: tech_access_cat
        label: Technology Access for Youth
        hint: Does the youth have a dedicated device for schoolwork?
        type: select_one
        options: [Yes - Dedicated device, Yes - Shared device, No device, No internet access]
        required: true
      - id: 6
        name: tutoring_interest_yn
        label: Are you interested in remote tutoring for your youth?
        hint: null
        type: select_one
        options: [Very interested, Interested, Not at this time]
        required: true
      - id: 7
        name: food_assistance_interest
        label: Are you interested in local food distribution programs?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 8
        name: mental_health_interest
        label: Would you like information on youth mental health resources?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 9
        name: pickup_time_pref
        label: Best time for resource pickup or delivery
        hint: null
        type: select_one
        options: [Weekday Mornings, Weekday Afternoons, Saturday Mornings]
        required: true
      - id: 10
        name: community_suggestion_text
        label: Suggestions for how we can better support our community
        hint: null
        type: text
        options: []
        required: false
      - id: 11
        name: zip_code_val
        label: Your Zip Code
        hint: To help us map resource needs
        type: text
        options: []
        required: true
      - id: 12
        name: info_sharing_consent
        label: I consent to this data being shared with local partner organizations to provide support
        hint: null
        type: select_one
        options: [Yes, I consent]
        required: true
