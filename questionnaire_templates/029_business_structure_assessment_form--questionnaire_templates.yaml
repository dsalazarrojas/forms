    - id: 15
      name: structure_alignment
      label: Structure Alignment with Strategy
      hint: Does structure support strategy
      type: select_one
      options:
      - Excellent Alignment
      - Good Alignment
      - Adequate Alignment
      - Poor Alignment
      - Misaligned
      required: true
