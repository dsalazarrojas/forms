      hint: How effective is decision making
      type: select_one
      options:
      - Very Efficient
      - Efficient
      - Adequate
      - Slow
      - Very Slow
      required: true
    - id: 10
      name: organizational_agility
      label: Organizational Agility
      hint: Can the organization adapt quickly
      type: select_one
      options:
      - Highly Agile
      - Agile
      - Moderately Agile
      - Rigid
      - Very Rigid
      required: true
    - id: 11
      name: cross_functional_collaboration
      label: Cross-functional Collaboration
      hint: How well do departments work together
      type: select_one
      options:
      - Excellent
      - Good
      - Adequate
      - Fair
      - Poor
