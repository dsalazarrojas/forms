inputSchema:
  type: object
  properties:
    title: Business Structure Assessment Form
    pages:
    - id: 1
      name: respondent_name
      label: Respondent Name
      hint: Full name of person responding
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_role
      label: Your Role in Organization
      hint: Your position or title
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company Name
      hint: Organization being assessed
      type: text
      options: []
      required: true
    - id: 4
      name: assessment_date
      label: Assessment Date
      hint: Date of this assessment
      type: date
      options: []
      required: true
    - id: 5
      name: organizational_clarity
      label: Organizational Structure Clarity
      hint: Is the structure clear
      type: select_one
      options:
      - Extremely Clear
      - Clear
      - Somewhat Clear
      - Unclear
      - Very Unclear
      required: true
    - id: 6
      name: role_definition
      label: Role Definition Clarity
      hint: Are roles well-defined
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 7
      name: reporting_structure
      label: Reporting Structure Effectiveness
      hint: How effective is reporting structure
      type: select_one
      options:
      - Very Effective
      - Effective
      - Adequate
      - Ineffective
      - Very Ineffective
      required: true
    - id: 8
      name: communication_flow
      label: Communication Flow
      hint: How well does information flow
      type: select_one
      options:
      - Excellent
      - Good
      - Adequate
      - Poor
      - Very Poor
