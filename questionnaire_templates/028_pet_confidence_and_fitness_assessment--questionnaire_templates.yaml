inputSchema:
  type: object
  properties:
    title: Pet Confidence And Fitness Assessment
    pages:
    - id: 1
      name: pet_confidence
      label: pet_confidence
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: pet_fitness
      label: pet_fitness
      hint: null
      type: select_one
      options:
      - Pet is not active at all
      - Pet is a little active
      - Pet is moderately active
      - Pet is very active
      required: false
    - id: 3
      name: trainer_experience
      label: trainer_experience
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: vet_experience
      label: vet_experience
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: pet_health
      label: pet_health
      hint: null
      type: select_multiple
      options:
      - Healthy
      - Unhealthy
      - Seriously unhealthy
      required: false
    - id: 6
      name: training_level
      label: training_level
      hint: null
      type: select_one
      options:
      - None
      - Basic
      - Intermediate
      - Advanced
      required: false
    - id: 7
      name: training_level_hint
      label: training_level_hint
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: training_frequency
      label: training_frequency
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: training_time
      label: training_time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
