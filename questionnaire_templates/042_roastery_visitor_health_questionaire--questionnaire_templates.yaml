inputSchema:
  type: object
  properties:
    title: Roastery Visitor Health Questionnaire
    pages:
    - id: 1
      name: symptoms
      label: Have you had any symptoms or illness in the past 2 weeks?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: temperature
      label: Do you have a fever?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: travel_history
      label: What is your recent travel history?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: close_contact
      label: Have you had close contact with anyone who has a confirmed case of [disease]
        in the past 2 weeks?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: contact_description
      label: Contact Description
      hint: null
      type: text
      options: []
      required: false
