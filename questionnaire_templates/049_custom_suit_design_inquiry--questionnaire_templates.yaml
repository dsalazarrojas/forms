inputSchema:
  type: object
  properties:
    title: Custom Suit Design Inquiry
    pages:
    - id: 1
      name: custom_suit_design_inquiry_form
      label: Custom Suit Design Inquiry Form
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: design_preferences
      label: Custom Suit Design Preferences
      hint: null
      type: select_one
      options:
      - '{''id'': 10, ''name'': ''color'', ''label'': ''What color would you prefer?'',
        ''value'': ''Black''}'
      - '{''id'': 20, ''name'': ''color'', ''label'': ''White''}'
      - '{''id'': 30, ''name'': ''color'', ''label'': ''Red''}'
      required: true
    - id: 3
      name: measurement_details
      label: Measurement Details
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: body_type
      label: What is your body type?
      hint: null
      type: select_one
      options:
      - '{''id'': 40, ''name'': ''slim_fit'', ''label'': ''Slim Fit''}'
      - '{''id'': 50, ''name'': ''regular_fit'', ''label'': ''Regular Fit''}'
      - '{''id'': 60, ''name'': ''athletic_fit'', ''label'': ''Athletic Fit''}'
      required: true
    - id: 5
      name: jacket_length
      label: What is your preferred jacket length?
      hint: null
      type: select_one
      options:
      - '{''id'': 100, ''name'': ''short_jacket'', ''label'': ''Short''}'
      - '{''id'': 110, ''name'': ''long_jacket'', ''label'': ''Long''}'
      - '{''id'': 120, ''name'': ''three_quarter_length'', ''label'': ''Three-quarter
        length''}'
      required: true
    - id: 6
      name: sleeves_length
      label: What is your preferred sleeve length?
      hint: null
      type: select_one
      options:
      - '{''id'': 140, ''name'': ''short_sleeves'', ''label'': ''Short''}'
      - '{''id'': 150, ''name'': ''long_sleeves'', ''label'': ''Long''}'
      - '{''id'': 160, ''name'': ''three_quarter_sleeves'', ''label'': ''Three-quarter
        sleeves''}'
      required: false
    - id: 7
      name: pants_length
      label: What is your preferred pant length?
      hint: null
      type: select_one
      options:
      - '{''id'': 180, ''name'': ''short_pants'', ''label'': ''Short''}'
      - '{''id'': 190, ''name'': ''long_pants'', ''label'': ''Long''}'
