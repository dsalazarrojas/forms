      name: pants_style
      label: What style of pants would you prefer?
      hint: null
      type: select_one
      options:
      - '{''id'': 220, ''name'': ''formal_pants'', ''label'': ''Formal''}'
      - '{''id'': 230, ''name'': ''casual_pants'', ''label'': ''Casual''}'
      - '{''id'': 240, ''name'': ''athletic_pants'', ''label'': ''Athletic''}'
      required: false
    - id: 9
      name: fabric_type
      label: What fabric type would you prefer?
      hint: null
      type: select_multiple
      options:
      - '{''id'': 260, ''name'': ''cotton'', ''label'': ''Cotton''}'
      - '{''id'': 270, ''name'': ''wool'', ''label'': ''Wool''}'
      - '{''id'': 280, ''name'': ''linen'', ''label'': ''Linen''}'
      required: false
    - id: 10
      name: pants_color
      label: What color of pants would you prefer?
      hint: null
      type: select_multiple
      options:
      - '{''id'': 300, ''name'': ''black'', ''label'': ''Black''}'
      - '{''id'': 310, ''name'': ''gray'', ''label'': ''Gray''}'
      - '{''id'': 320, ''name'': ''beige'', ''label'': ''Beige''}'
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: custom_suit_message
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: shirt_size
      label: What is your shirt size?
      hint: null
      type: number
      options: []
      required: true
