inputSchema:
  type: object
  properties:
    title: Custom Suit Design Inquiry
    pages:
    - id: 1
      name: custom_suit_design_inquiry_form
      label: Custom Suit Design Inquiry Form
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: design_preferences
      label: Custom Suit Design Preferences
      hint: null
      type: select_one
      options:
      - What color would you prefer?
      - White
      - Red
      required: true
    - id: 3
      name: measurement_details
      label: Measurement Details
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: body_type
      label: What is your body type?
      hint: null
      type: select_one
      options:
      - Slim Fit
      - Regular Fit
      - Athletic Fit
      required: true
    - id: 5
      name: jacket_length
      label: What is your preferred jacket length?
      hint: null
      type: select_one
      options:
      - Short
      - Long
      - Three-quarter length
      required: true
    - id: 6
      name: sleeves_length
      label: What is your preferred sleeve length?
      hint: null
      type: select_one
      options:
      - Short
      - Long
      - Three-quarter sleeves
      required: false
    - id: 7
      name: pants_length
      label: What is your preferred pant length?
      hint: null
      type: select_one
      options:
      - Short
      - Long
      - Three-quarter pants
      required: false
    - id: 8
      name: pants_style
      label: What style of pants would you prefer?
      hint: null
      type: select_one
      options:
      - Formal
      - Casual
      - Athletic
      required: false
    - id: 9
      name: fabric_type
      label: What fabric type would you prefer?
      hint: null
      type: select_multiple
      options:
      - Cotton
      - Wool
      - Linen
      required: false
    - id: 10
      name: pants_color
      label: What color of pants would you prefer?
      hint: null
      type: select_multiple
      options:
      - Black
      - Gray
      - Beige
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: custom_suit_message
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: shirt_size
      label: What is your shirt size?
      hint: null
      type: number
      options: []
      required: true
