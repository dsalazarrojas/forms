inputSchema:
  type: object
  properties:
    title: 1 On 1 Physical Activity Readiness Questionnaire (PAR-Q)
    pages:
    - id: 1
      name: section_header_participant_info
      label: '--- Participant Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: As it appears on your identification
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Used for communication and booking confirmations
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Primary contact number
      type: phone
      options: []
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: For demographic purposes and tailored program design
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      required: false
    - id: 7
      name: section_header_health_history
      label: '--- Health & Medical History ---'
      hint: Please answer truthfully to ensure your safety
      type: note
      options: []
      required: false
    - id: 8
      name: heart_condition
      label: Has a doctor ever said you have a heart condition or heart disease?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 9
      name: chest_pain_activity
      label: Do you feel pain in your chest when you do physical activity?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: dizziness_fainting
      label: Do you ever lose your balance because of dizziness or do you ever lose
        consciousness?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: bone_joint_problem
      label: Do you have a bone or joint problem that could be made worse by a change
        in your physical activity?
      hint: E.g., back, knee, hip problem
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: blood_pressure_meds
      label: Are you currently taking any prescription medication for blood pressure
        or a heart condition?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: medical_conditions_others
      label: Do you have any other medical conditions or health concerns not listed
        above?
      hint: Include recent surgeries (within the last 12 months), chronic illnesses,
        or disabilities.
      type: text
      options: []
      required: false
    - id: 14
      name: section_header_activity_goals
      label: '--- Activity & Goals ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: current_fitness_level
      label: What is your current physical activity level?
      hint: How active are you normally?
      type: select_one
      options:
      - Sedentary (little to no exercise)
      - Lightly Active (light exercise 1-3 days/week)
      - Moderately Active (moderate exercise 3-5 days/week)
      - Very Active (intense exercise 6-7 days/week)
      required: true
    - id: 16
      name: fitness_goals
      label: What are your primary fitness goals? (Select all that apply)
      hint: null
      type: select_multiple
      options:
      - Weight loss / Body composition change
      - Muscle gain / Strength building
      - Cardiovascular endurance
      - Flexibility / Mobility improvement
      - Stress reduction / Mental well-being
      - Sports performance / Competition prep
      - Injury prevention / Rehabilitation
      required: true
    - id: 17
      name: weekly_sessions_target
      label: How many 1-on-1 workout sessions per week are you aiming for?
      hint: null
      type: integer
      options: []
      required: true
    - id: 18
      name: previous_exercise_experience
      label: Briefly describe your previous exercise experience or preferred activities.
      hint: Include any sports, gym experience, or classes you've enjoyed.
      type: text
      options: []
      required: false
    - id: 19
      name: current_injuries_pain
      label: Do you have any current injuries, chronic pain, or physical limitations?
      hint: Please specify location and severity (e.g., "Left knee pain, mild").
      type: text
      options: []
      required: false
    - id: 20
      name: section_header_preferences
      label: '--- Preferences & Agreement ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: preferred_workout_time
      label: What is your preferred time of day for workouts?
      hint: null
      type: time
      options: []
      required: false
    - id: 22
      name: availability_days
      label: On which days of the week are you generally available for sessions? (Select
        all)
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 23
      name: consent_agreement
      label: I confirm that I have read and understood the questions above, and I
        have answered them truthfully.
      hint: Answering 'Yes' to any health question may require medical clearance before
        starting a new exercise program.
      type: select_one
      options:
      - Yes, I agree
      - No, I need to review
      required: true
    - id: 24
      name: additional_notes
      label: Any additional comments or specific requests?
      hint: E.g., "focus on core strength," "avoid jumping," "prefer morning sessions."
      type: text
      options: []
      required: false
