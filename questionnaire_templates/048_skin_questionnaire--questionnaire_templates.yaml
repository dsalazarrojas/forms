inputSchema:
  type: object
  properties:
    title: Skin Questionnaire
    pages:
    - id: 1
      name: skin_condition
      label: What is your skin condition?
      hint: Please describe your skin condition
      type: text
      options: []
      required: true
    - id: 2
      name: skin_type
      label: What is your skin type?
      hint: null
      type: select_one
      options:
      - Sensitive
      - Dry
      - Oily
      - Combination
      required: true
    - id: 3
      name: skin_color
      label: What is your skin color?
      hint: null
      type: select_one
      options:
      - Fair
      - Medium
      - Dark
      - Tanned
      required: true
    - id: 4
      name: skin_protein
      label: Do you have any skin proteins?
      hint: null
      type: checkbox
      options:
      - Sebum
      - Dandruff
      - Acne
      required: true
    - id: 5
      name: skin_pigmentation
      label: What is your skin pigmentation?
      hint: Enter your skin pigmentation level
      type: number
      options: []
      required: true
    - id: 6
      name: skin_sensitivity
      label: How sensitive is your skin?
      hint: Enter your skin sensitivity level
      type: number
      options: []
      required: true
    - id: 7
      name: skin_pore_size
      label: What is your skin pore size?
      hint: Enter your skin pore size
      type: number
      options: []
      required: true
    - id: 8
      name: skin_venilation
      label: Do you have any skin venilation?
      hint: null
      type: checkbox
      options:
      - Redness
      - Puffiness
      - Dullness
      - Discoloration
      required: true
    - id: 9
      name: submit
      label: Submit
      hint: Please click submit to submit your questionnaire
      type: text
      options: []
      required: true
