inputSchema:
  type: object
  properties:
    title: Compliance Program Assessment Form
    pages:
      - id: 1
        name: section_overview
        label: -- Program Overview --
        hint: Provide general program details
        type: note
        options: []
        required: false
      - id: 2
        name: assessor_name
        label: Assessor name
        hint: Person completing the assessment
        type: text
        options: []
        required: true
      - id: 3
        name: program_name
        label: Program name
        hint: Name of the compliance program
        type: text
        options: []
        required: true
      - id: 4
        name: scope_and_objectives
        label: Scope and objectives
        hint: Brief description of program scope
        type: text
        options: []
        required: false
      - id: 5
        name: governance_and_ownership
        label: Governance and ownership
        hint: Rate clarity of governance structures
        type: select_one
        options: [Clear, Moderate, Unclear]
        required: true
      - id: 6
        name: risk_assessment_practices
        label: Risk assessment practices
        hint: Evaluate risk identification and mitigation
        type: select_one
        options: [Effective, Partially effective, Ineffective]
        required: true
      - id: 7
        name: monitoring_and_reporting
        label: Monitoring and reporting
        hint: Frequency and quality of monitoring
        type: select_one
        options: [Regular, Sporadic, None]
        required: true
      - id: 8
        name: training_and_communication
        label: Training and communication
        hint: Adequacy of staff training efforts
        type: select_one
        options: [Sufficient, Needs improvement, Insufficient]
        required: true
      - id: 9
        name: improvement_actions
        label: Improvement actions recommended
        hint: Outline suggested corrective actions
        type: text
        options: []
        required: false
      - id: 10
        name: overall_assessment_score
        label: Overall assessment score
        hint: Summary rating for the program
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
