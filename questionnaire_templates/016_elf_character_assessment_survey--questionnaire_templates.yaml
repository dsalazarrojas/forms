      options:
      - Elf
      - Human
      - Dwarf
      - Orc
      - Other (please specify)
      required: false
    - id: 20
      name: elf_occupation
      label: What is the elf's occupation?
      hint: null
      type: select_multiple
      options:
      - Hunter
      - Warrior
      - Healer
      - Bard
      - Other (please specify)
      required: false
    - id: 21
      name: elf_income
      label: What is the elf's income?
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: elf_family
      label: What is the elf's family status?
      hint: null
      type: select_multiple
      options:
      - Single
      - Partnered
      - Married
      required: false
    - id: 23
      name: elf_abilities
      label: What are the elf's abilities?
      hint: null
      type: select_multiple
      options:
      - Flight
      - Telekinesis
      - Telepathy
      - Shape shifting
      required: false
    - id: 24
      name: elf_disabilities
      label: What are the elf's disabilities?
