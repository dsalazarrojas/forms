inputSchema:
  type: object
  properties:
    title: Physical Fitness Questionnaire
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: This questionnaire is designed to assess your physical fitness.
      type: note
      options: []
      required: false
    - id: 2
      name: general_questions
      label: General Questions
      hint: Please answer these questions to the best of your ability.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: medical_history
      label: Medical History
      hint: Have you ever had a major medical condition or illness?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: exercise_questions
      label: Exercise Questions
      hint: How often do you engage in physical exercise?
      type: select_multiple
      options:
      - Daily
      - Several times a week
      - Rarely
      required: false
    - id: 5
      name: physical_activity_level
      label: Physical Activity Level
      hint: How physically active are you?
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 6
      name: height_weight
      label: Height and Weight
      hint: Please provide your height and weight.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: body_mass_index
      label: Body Mass Index
      hint: What is your body mass index?
      type: select_one
      options:
      - Underweight
      - Normal
      - Overweight
      required: false
    - id: 8
      name: resting_heart_rate
      label: Resting Heart Rate
      hint: What is your resting heart rate?
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 9
      name: blood_pressure
      label: Blood Pressure
      hint: Have you had high blood pressure issues?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: exercise_frequency
      label: Exercise Frequency
      hint: How frequent do you exercise?
      type: select_multiple
      options:
      - Daily
      - Several times a week
      - Rarely
      required: false
    - id: 11
      name: height_weight_2
      label: Height Weight 2
      hint: Please provide your height and weight.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
