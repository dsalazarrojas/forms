inputSchema:
  type: object
  properties:
    title: promotional-email-authorization-form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Please enter your email address
      type: email
      options: []
      required: true
    - id: 3
      name: company
      label: Company
      hint: Please enter your company (if applicable)
      type: text
      options: []
      required: false
    - id: 4
      name: email_frequency
      label: Preferred Email Frequency
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 5
      name: consent_given
      label: Consent for Email Marketing
      hint: null
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 6
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: description
      label: Description of Form Purpose
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: category
      label: Category
      hint: Select a category
      type: select_one
      options:
      - Email Marketing Forms
      - Other
      required: true
    - id: 9
      name: form_id
      label: Form ID
      hint: Please enter a Form ID
      type: number
      options: []
      required: true
    - id: 10
      name: output_file
      label: Output File
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: output_file_name
      label: Output File Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: output_file_path
      label: Output File Path
      hint: null
      type: text
      options: []
      required: false
