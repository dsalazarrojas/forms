inputSchema:
  type: object
  properties:
    title: Email Campaign Permission Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: permission
      label: Permission
      hint: null
      type: select_one
      options:
      - Receive occasional updates on industry news
      - Receive promotional offers
      - Receive marketing information
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
