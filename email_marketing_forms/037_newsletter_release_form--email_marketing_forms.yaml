inputSchema:
  type: object
  properties:
    title: Newsletter Release Form
    pages:
    - id: 1
      name: title
      label: Newsletters Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: issue_details
      label: Issue Details
      hint: Choose one of the following options
      type: select_one
      options:
      - Date
      - Time
      - Frequency
      required: false
    - id: 3
      name: publishing_details
      label: Publishing Details
      hint: Select all applicable channels
      type: select_multiple
      options:
      - Email
      - Social Media
      - Website
      - Blog
      required: false
    - id: 4
      name: approval
      label: Approvals
      hint: Select all applicable approvers
      type: select_multiple
      options:
      - Marketing Manager
      - Communications Officer
      - Creative Director
      - Editor
      - Publisher
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: release_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: release_time
      label: Release Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: published
      label: Published
      hint: Has the newsletter been published?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: notes_2
      label: Notes 2
      hint: null
      type: text
      options: []
      required: true
