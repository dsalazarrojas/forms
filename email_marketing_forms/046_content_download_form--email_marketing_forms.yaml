inputSchema:
  type: object
  properties:
    title: Content Download Form
    pages:
      - id: 1
        name: section_user_info
        label: -- Lead Details --
        hint: Please provide your information below to receive your free content.
        type: note
        options: []
        required: false
      - id: 2
        name: user_name
        label: Your Full Name
        hint: null
        type: text
        options: []
        required: true
      - id: 3
        name: user_email
        label: Your Email Address
        hint: null
        type: email
        options: []
        required: true
      - id: 4
        name: section_content_request
        label: -- Content Request --
        hint: Please select the free content you'd like to receive.
        type: note
        options: []
        required: false
      - id: 5
        name: content_requested
        label: Free Content Requested
        hint: null
        type: select_one
        options: [eBook, Whitepaper, Guide, Checklist, Webinar, Other]
        required: true
      - id: 6
        name: industry_type
        label: Your Industry
        hint: null
        type: select_one
        options: [Marketing, Technology, Healthcare, Education, Finance, Other]
        required: true
      - id: 7
        name: company_size_range
        label: Your Company Size
        hint: null
        type: select_one
        options: [1-10, 11-50, 51-200, 201-500, 501-1000, 1001+]
        required: true
      - id: 8
        name: section_marketing_opt_in
        label: -- Marketing and Newsletter Opt-in --
        hint: null
        type: note
        options: []
        required: false
      - id: 9
        name: marketing_opt_in
        label: Sign up for our marketing updates?
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 10
        name: privacy_agreement
        label: I have read and agree to the privacy policy regarding my data
        hint: null
        type: select_one
        options: [Yes, No]
        required: true
      - id: 11
        name: download_request_date
        label: Date of Download Request
        hint: null
        type: date
        options: []
        required: true
