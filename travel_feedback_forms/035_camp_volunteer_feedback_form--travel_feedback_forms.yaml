inputSchema:
  type: object
  properties:
    title: Camp Volunteer Feedback Form
    pages:
      - id: 1
        name: volunteer_name
        label: Volunteer Name
        hint: Optional for anonymous submissions
        type: text
        options: []
        required: false
      - id: 2
        name: event_date
        label: Event Date
        hint: Date of volunteer engagement
        type: date
        options: []
        required: true
      - id: 3
        name: role_performed
        label: Role Performed
        hint: Brief description of duties
        type: text
        options: []
        required: true
      - id: 4
        name: experience_rating
        label: Overall Experience Rating
        hint: Rate the volunteer experience
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
      - id: 5
        name: support_from_staff
        label: Support from Staff
        hint: How well-supported did you feel
        type: select_one
        options: [Very Supported, Supported, Neutral, Unsupported]
        required: false
      - id: 6
        name: suggestions
        label: Suggestions to Improve Volunteer Experience
        hint: Practical recommendations for organizers
        type: text
        options: []
        required: false
      - id: 7
        name: would_return
        label: Would You Volunteer Again
        hint: Interest in future volunteering
        type: select_one
        options: [Yes, Maybe, No]
        required: true
      - id: 8
        name: training_needed
        label: Additional Training Needed
        hint: Training topics that would help volunteers
        type: text
        options: []
        required: false
      - id: 9
        name: travel_experience
        label: Travel Experience Feedback
        hint: If transport was provided, rate the experience
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: false
      - id: 10
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
