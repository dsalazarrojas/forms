inputSchema:
  type: object
  properties:
    title: Hotel Feedback Form
    pages:
    - id: 1
      name: hotel_name
      label: Hotel Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: room_number
      label: Room Number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: check_in_date
      label: Check-in Date
      hint: Please enter date in YYYY-MM-DD format.
      type: date
      options: []
      required: true
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: rating
      label: Rating (1-5)
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: contact_email
      label: Contact Email
      hint: Please enter a valid email address.
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
