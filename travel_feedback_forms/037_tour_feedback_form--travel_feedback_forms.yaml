inputSchema:
  type: object
  properties:
    title: Tour Feedback Form
    pages:
    - id: 1
      name: tour_feedback
      label: What do you think of our service?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tour_rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: tour_comment
      label: How can we improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: would_recommend
      label: would_recommended
      hint: null
      type: select_one
      options:
      - Highly Likely
      - Somewhat Likely
      - Not Very Likely
      - Not at All
      required: true
    - id: 5
      name: travel_date
      label: Travel Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: travel_time
      label: Travel Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: travel_location
      label: Travel Location
      hint: Please mention the city where you visited
      type: text
      options: []
      required: false
    - id: 8
      name: tour_agent
      label: Tour Agent
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      - Bob Smith
      required: true
    - id: 9
      name: email
      label: Contact E-mail
      hint: Please provide email for further communication
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: note
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
