inputSchema:
  type: object
  properties:
    title: Airline Lounge Experience Feedback Survey
    pages:
    - id: 1
      name: section_visit_details
      label: -- Visit Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: guest_name
      label: Guest name
      hint: Optional name for follow up
      type: text
      options: []
      required: false
    - id: 3
      name: membership_status
      label: Membership status
      hint: Select if you have a membership
      type: select_one
      options: [Member, Guest, None]
      required: true
    - id: 4
      name: visit_date
      label: Visit date
      hint: Date of lounge visit
      type: date
      options: []
      required: true
    - id: 5
      name: lounge_location
      label: Lounge location
      hint: Airport and terminal or lounge name
      type: text
      options: []
      required: true
    - id: 6
      name: check_in_experience_rating
      label: Check in experience rating
      hint: Rate the check in process
      type: select_one
      options: [1, 2, 3, 4, 5]
      required: true
    - id: 7
      name: seating_comfort_rating
      label: Seating comfort rating
      hint: Rate comfort of seating
      type: select_one
      options: [1, 2, 3, 4, 5]
      required: true
    - id: 8
      name: food_quality_rating
      label: Food quality rating
      hint: Rate the food and beverage offerings
      type: select_one
      options: [1, 2, 3, 4, 5]
      required: false
    - id: 9
      name: staff_service_rating
      label: Staff service rating
      hint: Rate lounge staff professionalism
      type: select_one
      options: [1, 2, 3, 4, 5]
      required: true
    - id: 10
      name: amenities_used
      label: Amenities used
      hint: Select any amenities you used during your visit
      type: select_multiple
      options: [WiFi, Showers, Workspaces, Charging stations, Entertainment]
      required: false
    - id: 11
      name: overall_satisfaction
      label: Overall satisfaction
      hint: Select your overall satisfaction level
      type: select_one
      options: [Very dissatisfied, Dissatisfied, Neutral, Satisfied, Very satisfied]
      required: true
    - id: 12
      name: suggestions_for_improvement
      label: Suggestions for improvement
      hint: Any suggestions to improve the lounge experience
      type: text
      options: []
      required: false
