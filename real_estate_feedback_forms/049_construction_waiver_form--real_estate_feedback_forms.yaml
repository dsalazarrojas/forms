inputSchema:
  type: object
  properties:
    title: Construction Waiver Form
    pages:
    - id: 1
      name: waiver_date
      label: Waiver Date
      hint: Date of this waiver
      type: date
      options: []
      required: true
    - id: 2
      name: project_name
      label: Project Name
      hint: Name of construction project
      type: text
      options: []
      required: true
    - id: 3
      name: project_address
      label: Project Address
      hint: Property location
      type: text
      options: []
      required: true
    - id: 4
      name: property_owner
      label: Property Owner Name
      hint: Legal owner name
      type: text
      options: []
      required: true
    - id: 5
      name: contractor_name
      label: Contractor Name
      hint: Company or individual
      type: text
      options: []
      required: true
    - id: 6
      name: contractor_address
      label: Contractor Address
      hint: Business address
      type: text
      options: []
      required: true
    - id: 7
      name: contractor_phone
      label: Contractor Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 8
      name: contractor_email
      label: Contractor Email
      hint: Email address
      type: email
      options: []
      required: true
    - id: 9
      name: waiver_type
      label: Waiver Type
      hint: Type of lien waiver
      type: select_one
      options:
      - Conditional Waiver and Release on Progress Payment
      - Unconditional Waiver and Release on Progress Payment
      - Conditional Waiver and Release on Final Payment
      - Unconditional Waiver and Release on Final Payment
      required: true
    - id: 10
      name: claimant_name
      label: Claimant Name
      hint: Party waiving rights
      type: text
      options: []
      required: true
    - id: 11
      name: claimant_role
      label: Claimant Role
      hint: Position on project
      type: select_one
      options:
      - General Contractor
      - Subcontractor
      - Material Supplier
      - Equipment Lessors
      - Laborer
      - Other
      required: true
    - id: 12
      name: payment_amount
      label: Payment Amount
      hint: Amount being paid
      type: number
      options: []
      required: true
    - id: 13
      name: payment_through_date
      label: Payment Through Date
      hint: Work covered by this payment
      type: date
      options: []
      required: true
    - id: 14
      name: check_number
      label: Check Number
      hint: Payment reference
      type: text
      options: []
      required: false
    - id: 15
      name: property_legal_description
      label: Property Legal Description
      hint: From deed or title
      type: text
      options: []
      required: true
    - id: 16
      name: work_description
      label: Description of Work
      hint: What work was performed
      type: text
      options: []
      required: true
    - id: 17
      name: exceptions
      label: Exceptions
      hint: Any retainage or disputes
      type: text
      options: []
      required: false
    - id: 18
      name: rights_waived
      label: Rights Being Waived
      hint: Description of lien rights
      type: text
      options: []
      required: true
    - id: 19
      name: verification_statement
      label: Verification Statement
      hint: Statement of truth
      type: select_one
      options:
      - I Verify This Information Is True and Correct
      - Other
      required: true
    - id: 20
      name: claimant_signature
      label: Claimant Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 21
      name: claimant_title
      label: Claimant Title
      hint: Position or role
      type: text
      options: []
      required: true
    - id: 22
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
    - id: 23
      name: witness_name
      label: Witness Name
      hint: Witness to signature
      type: text
      options: []
      required: false
    - id: 24
      name: witness_signature
      label: Witness Signature
      hint: Type full name as signature
      type: text
      options: []
      required: false
    - id: 25
      name: notary_required
      label: Notary Required
      hint: Is notarization needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 26
      name: notary_name
      label: Notary Name
      hint: Name of notary
      type: text
      options: []
      required: false
    - id: 27
      name: notary_commission
      label: Notary Commission Number
      hint: Commission ID
      type: text
      options: []
      required: false
    - id: 28
      name: notary_expiration
      label: Notary Commission Expiration
      hint: When does commission expire
      type: date
      options: []
      required: false
    - id: 29
      name: notary_signature
      label: Notary Signature
      hint: Type full name as signature
      type: text
      options: []
      required: false
    - id: 30
      name: notary_seal_date
      label: Notary Seal Date
      hint: Date of notarization
      type: date
      options: []
      required: false
