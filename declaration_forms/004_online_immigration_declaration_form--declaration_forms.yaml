inputSchema:
  type: object
  properties:
    title: Online Immigration Declaration Form
    pages:
    - id: 1
      name: travel_team
      label: Travel Team
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: travel_date
      label: travel_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: border_entry_coordinator
      label: Border Entry Coordinator
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: travel_type
      label: Travel Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: passport_number
      label: Passport Number
      hint: null
      type: text
      options: []
      required: false
