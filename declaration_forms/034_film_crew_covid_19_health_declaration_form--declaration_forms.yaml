inputSchema:
  type: object
  properties:
    title: Film Crew COVID 19 Health Declaration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: have_symptoms
      label: Have you been exposed to COVID-19?
      hint: null
      type: select_one
      options:
      - 'No'
      - Yes - Mild
      - Yes - Severe
      required: false
    - id: 7
      name: travel_history
      label: Travel History
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: exposure_history
      label: Exposure History
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_multiple
      options:
      - None
      - Respiratory issues
      - Heart issues
      - Diabetes
      - Other
      required: false
    - id: 10
      name: have_medical_certificate
      label: Do you have a medical certificate?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      required: false
    - id: 11
      name: upload_medical_certificate
      label: Upload Medical Certificate
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: upload_certificate_file
      label: Upload Certificate File
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
