      type: text
      options: []
      required: true
    - id: 5
      name: business_address
      label: Business Address
      hint: Principal place of business
      type: text
      options: []
      required: true
    - id: 6
      name: declaration_date
      label: Declaration Date
      hint: Date of this declaration
      type: date
      options: []
      required: true
    - id: 7
      name: declaring_officer
