inputSchema:
  type: object
  properties:
    title: Lab Equipment Use Declaration Form
    pages:
    - id: 1
      name: user_input_page
      label: user_input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: equipment_list
      label: equipment_list
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: date_of_use
      label: date_of_use
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: user_declaration
      label: user_declaration
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: laboratory_supervision
      label: laboratory_supervision
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: equipment_condition
      label: equipment_condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Slightly damaged
      - Damaged
      - Not working
      required: false
    - id: 7
      name: safety_precautions
      label: safety_precautions
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: declaration_signature
      label: declaration_signature
      hint: Please sign here to indicate that you have read, understand, and agreed
        to this declaration
      type: note
      options: []
      required: false
    - id: 9
      name: equipment_return
      label: equipment_return
      hint: null
      type: text
      options: []
      required: false
