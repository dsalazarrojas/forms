inputSchema:
  type: object
  properties:
    title: Content Creator Job Application Form
    pages:
    - id: 1
      name: applicant_full_name
      label: Applicant Full Name
      hint: Legal first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Professional email address
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: mailing_address
      label: Mailing Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 5
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: zip_code
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: position_applied_for
      label: Position Applied For
      hint: Which content creator role are you applying for?
      type: select_one
      options:
      - Social Media Content Creator
      - Video Content Creator
      - Written Content Creator
      - Visual Content Creator
      - Multimedia Content Creator
      - Senior Content Creator
      - Junior Content Creator
      required: true
    - id: 9
      name: available_start_date
      label: Available Start Date
      hint: When can you start working?
      type: date
      options: []
      required: true
    - id: 10
      name: employment_type_preference
      label: Employment Type Preference
      hint: What type of employment are you seeking?
      type: select_one
      options:
      - Full-Time
      - Part-Time
      - Contract
      - Freelance
      - Internship
      required: true
    - id: 11
      name: salary_expectations
      label: Salary Expectations
      hint: Expected annual salary or hourly rate
      type: text
      options: []
      required: true
    - id: 12
      name: years_of_experience
      label: Years of Experience
      hint: How many years of content creation experience?
      type: select_one
      options:
      - Entry Level (0-1 years)
      - Junior (1-3 years)
      - Mid-Level (3-5 years)
      - Senior (5-8 years)
      - Expert (8+ years)
      required: true
    - id: 13
      name: portfolio_url
      label: Portfolio URL
      hint: Link to your portfolio or work samples
      type: text
      options: []
      required: true
    - id: 14
      name: social_media_profiles
      label: Social Media Profiles
      hint: Links to your social media accounts
      type: text
      options: []
      required: true
    - id: 15
      name: relevant_skills
      label: Relevant Skills
      hint: List your content creation skills
      type: text
      options: []
      required: true
    - id: 16
      name: software_proficiency
      label: Software Proficiency
      hint: What content creation software do you know?
      type: select_multiple
      options:
      - Adobe Creative Suite
      - Final Cut Pro
      - Premiere Pro
      - After Effects
      - Photoshop
      - Illustrator
      - Canva
      - Microsoft Office
      - Google Workspace
      required: true
    - id: 17
      name: education_level
      label: Education Level
      hint: Highest level of education completed
      type: select_one
      options:
      - High School
      - Some College
      - Associate Degree
      - Bachelor's Degree
      - Master's Degree
      - Doctorate
      required: true
    - id: 18
      name: field_of_study
      label: Field of Study
      hint: What did you study?
      type: text
      options: []
      required: false
    - id: 19
      name: university_name
      label: University Name
      hint: Name of institution attended
      type: text
      options: []
      required: false
    - id: 20
      name: previous_employer
      label: Most Recent Employer
      hint: Name of your last employer
      type: text
      options: []
      required: false
    - id: 21
      name: previous_role
      label: Previous Role
      hint: Your job title at previous employer
      type: text
      options: []
      required: false
    - id: 22
      name: reason_for_leaving
      label: Reason for Leaving
      hint: Why did you leave your previous position?
      type: text
      options: []
      required: false
    - id: 23
      name: notable_achievements
      label: Notable Achievements
      hint: Describe your proudest content creation achievements
      type: text
      options: []
      required: true
    - id: 24
      name: references_available
      label: References Available
      hint: Can you provide professional references?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 25
      name: cover_letter
      label: Cover Letter
      hint: Tell us why you are the best candidate
      type: text
      options: []
      required: true
    - id: 26
      name: how_did_you_hear
      label: How Did You Hear About This Position?
      hint: Where did you find this job posting?
      type: select_one
      options:
      - Company Website
      - Job Board
      - Social Media
      - Referral
      - Recruitment Agency
      - Other
      required: true
    - id: 27
      name: application_date
      label: Application Date
      hint: Date of application
      type: date
      options: []
      required: true
