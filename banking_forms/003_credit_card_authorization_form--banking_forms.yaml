inputSchema:
  type: object
  properties:
    title: Credit Card Authorization Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: last_name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: zip_code
      label: Zip code
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: card_type
      label: Card Type
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - American Express
      - Discover
      - Diners Club
      - JCB
      - Electron
      - Elo
      - Maestro
      - Solo
      - Switch
      - Laser
      - UAH
      - UCB
      - other
      required: true
    - id: 6
      name: authorization_date
      label: Authorization Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: cvv
      label: Cvv
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: exp_date
      label: Expire date
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: customer_id
      label: Customer ID
      hint: null
      type: note
      options: []
