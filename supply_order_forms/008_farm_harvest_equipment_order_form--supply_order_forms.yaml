inputSchema:
  type: object
  properties:
    title: Farm Harvest Equipment Order Form
    pages:
    - id: 1
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: equipment_details
      label: Equipment Details
      hint: Please fill in all fields below
      type: text
      options: []
      required: false
    - id: 3
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: equipment_list
      label: Select Equipment
      hint: null
      type: select_one
      options:
      - Combine Harvester
      - Tractor
      - Fertiliser
      - Harvester
      - Irrigation system
      - Harvester Attachment
      - Tractor attachment
      - Sprayer
      - Manure spreader
      - Other
      required: false
    - id: 6
      name: order_schedule
      label: Order Schedule
      hint: Select a schedule
      type: date
      options: []
      required: false
    - id: 7
      name: order_delivery
      label: Delivery
      hint: Select a delivery method
      type: select_one
      options:
      - Next 2-3 business days
      - Next 3-5 business days
      - Next 5-7 business days
      - Other
      required: false
    - id: 8
      name: customer_details
      label: Customer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: order_status
      label: Order Status
      hint: Select order status
      type: select_one
      options:
      - New
      - In progress
      - Completed
      - Cancelled
      required: false
    - id: 10
      name: customer_email
      label: Email
      hint: Customer email
      type: email
      options: []
      required: true
    - id: 11
      name: customer_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: customer_notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: delivery_location
      label: Delivery Location
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: true
    - id: 16
      name: customer_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: customer_address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: customer_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: customer_state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: customer_postal_code
      label: Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 21
      name: delivery_method
      label: Delivery Method
      hint: null
      type: select_one
      options:
      - In-person
      - Delivery
      - Pickup
      required: true
    - id: 22
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: true
    - id: 23
      name: customer_company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: customer_job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
