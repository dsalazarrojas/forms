inputSchema:
  type: object
  properties:
    title: Clone Of Nail Wishlist Southern Beil Nails
    pages:
    - id: 1
      name: header
      label: -- Wishlist Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Full name of customer or stylist
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: Email used for notifications
      type: email
      options: []
      required: true
    - id: 4
      name: product_name
      label: Product name or code
      hint: Name of the nail product
      type: text
      options: []
      required: true
    - id: 5
      name: desired_color
      label: Desired color or design
      hint: Provide color name or description
      type: text
      options: []
      required: false
    - id: 6
      name: quantity
      label: Quantity desired
      hint: Number of units
      type: number
      options: []
      required: true
    - id: 7
      name: preferred_delivery
      label: Preferred delivery method
      hint: Choose a shipping option
      type: select_one
      options:
      - Standard
      - Express
      - Pickup
      required: false
    - id: 8
      name: budget_per_unit
      label: Budget per unit
      hint: Optional price limit per item
      type: number
      options: []
      required: false
    - id: 9
      name: note_for_stylist
      label: Note for stylist
      hint: Any special requests
      type: text
      options: []
      required: false
    - id: 10
      name: subscribe_updates
      label: Subscribe for product updates
      hint: Receive updates when back in stock
      type: select_one
      options:
      - true
      - false
      required: false
