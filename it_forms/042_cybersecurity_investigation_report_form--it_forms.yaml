inputSchema:
  type: object
  properties:
    title: Cybersecurity Investigation Report Form
    pages:
    - id: 1
      name: security_investigation_report_form
      label: Investigation Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_id
      label: Incident ID
      hint: Please enter the unique ID for this incident.
      type: number
      options: []
      required: true
    - id: 3
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: incident_date_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: incident_location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: threat_level
      label: Threat Level
      hint: Low, Medium, or High
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 8
      name: incident_type
      label: Incident Type
      hint: e.g., Malware, Ransomware, etc.
      type: text
      options: []
      required: false
    - id: 9
      name: description
      label: Description
      hint: Describe the nature of the incident in detail.
      type: text
      options: []
      required: true
    - id: 10
      name: remediation_plan
      label: Remediation Plan
      hint: Describe how you plan to resolve the incident.
      type: text
      options: []
      required: false
    - id: 11
      name: incident_status
      label: Status
      hint: null
      type: select_multiple
      options:
      - Open
      - Closed
      - In Progress
      required: true
