inputSchema:
  type: object
  properties:
    title: Cybersecurity Breach Intake Form
    pages:
    - id: 1
      name: incident_summary
      label: Incident Summary
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: incident_description
      label: Incident Description
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: incident_impact
      label: Incident Impact
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 6
      name: incident_severity
      label: Incident Severity
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 7
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Phishing
      - Malware
      - Ransomware
      required: false
    - id: 8
      name: incident_reporter
      label: Incident Reporter
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: false
