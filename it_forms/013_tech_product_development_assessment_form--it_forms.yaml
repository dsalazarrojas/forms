      type: text
      options: []
      required: true
    - id: 8
      name: project_initiatives
      label: project_initiatives
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: submission_date
      label: submission_date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: submission_time
      label: submission_time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: email_address
      label: email_address
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: additional_comments
      label: additional_comments
      hint: null
      type: note
      options: []
      required: false
