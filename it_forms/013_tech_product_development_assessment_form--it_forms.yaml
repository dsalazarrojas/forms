inputSchema:
  type: object
  properties:
    title: Tech Product Development Assessment Form
    pages:
    - id: 1
      name: project_name
      label: project_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_members
      label: team_members
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: project_manager
      label: project_manager
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: initiative_status
      label: initiative_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 5
      name: project_readiness
      label: project_readiness
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: project_roadmap
      label: project_roadmap
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: team_communications
