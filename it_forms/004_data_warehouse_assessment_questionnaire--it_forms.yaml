inputSchema:
  type: object
  properties:
    title: Data Warehouse Assessment Questionnaire
    pages:
    - id: 1
      name: intro
      label: What is this data warehouse platform?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: performance_1
      label: Is this data warehouse platform meeting your performance expectations?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: refresh_frequency_1
      label: Is the data refresh frequency meeting your expectations?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: improvement_priorities_1
      label: What are your improvement priorities for the data warehouse platform?
      hint: null
      type: select_multiple
      options:
      - Performance
      - Data Quality
      - Other
      required: false
    - id: 5
      name: performance_2
      label: What are some key performance issues with this platform?
      hint: null
      type: select_multiple
      options:
      - Data refresh times are too long
      - Data is not up-to-date
      - Other
      required: false
    - id: 6
      name: data_quality_1
      label: Is the data quality of this data warehouse platform meeting your expectations?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: data_governance_1
      label: Is the current data governance of your data warehouse platform meeting
        your expectations?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: size
      label: Is this data warehouse platform the largest for your business?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: multiple_environments_1
      label: Is this data warehouse platform used in multiple environments?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: refresh_frequency_2
      label: What refresh frequencies would be ideal for your data warehouse platform?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 11
      name: additional_comments_1
      label: Do you have any additional comments about this data warehouse platform?
      hint: null
      type: text
      options: []
      required: false
