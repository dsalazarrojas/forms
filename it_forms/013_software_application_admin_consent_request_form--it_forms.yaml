inputSchema:
  type: object
  properties:
    title: Software Application Admin Consent Request Form
    pages:
    - id: 1
      name: page_1
      label: Software Tool Request
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: page_2
      label: Software Application Details
      hint: Please provide details about the software application you are requesting
        access to.
      type: text
      options: []
      required: false
    - id: 3
      name: software_application_admin_consent_request_form_2
      label: Administrative Access Request
      hint: Describe the specific permissions you need to access the software tool.
      type: text
      options: []
      required: false
    - id: 4
      name: software_application_admin_consent_request_form_3
      label: Consent Date
      hint: Select the date for which you are requesting consent.
      type: date
      options: []
      required: false
    - id: 5
      name: software_application_admin_consent_request_form_4
      label: Consent Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: software_application_admin_consent_request_form_5
      label: Consent
      hint: null
      type: select_one
      options:
      - Admin
      - User
      required: false
    - id: 7
      name: software_application_admin_consent_request_form_6
      label: Software Tool
      hint: Name of the software tool you are requesting access to.
      type: text
      options: []
      required: false
    - id: 8
      name: software_application_admin_consent_request_form_7
      label: Reason for Request
      hint: Please provide the reason for your request.
      type: text
      options: []
      required: false
    - id: 9
      name: software_application_admin_consent_request_form_8
      label: Review and Acknowledge
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: software_application_admin_consent_request_form_9
      label: Software Application Admin Consent Request
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: software_application_admin_consent_request_form_10
      label: IT Department
      hint: Department responsible for software tool access.
      type: text
      options: []
      required: false
    - id: 12
      name: software_application_admin_consent_request_form_11
      label: Requester
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: software_application_admin_consent_request_form_12
      label: Software Application Admin Consent Request Form Comments
      hint: Additional comments regarding the software tool request.
      type: text
      options: []
      required: false
    - id: 14
      name: software_application_admin_consent_request_form_13
      label: Software Application Admin Consent Request Form Review Comments
      hint: IT Department Review Comments about the request.
      type: text
      options: []
      required: false
    - id: 15
      name: software_application_admin_consent_request_form_14
      label: Software Application Admin Consent Request Form
      hint: null
      type: note
      options: []
      required: false
