inputSchema:
  type: object
  properties:
    title: Net User Feedback Survey
    pages:
    - id: 1
      name: survey_intro
      label: Welcome to the Net User Feedback Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: rating_satisfaction
      label: How satisfied are you with the service?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 3
      name: rating_issues
      label: Have you experienced any issues while using our service?
      hint: null
      type: select_multiple
      options:
      - Option 4
      - Option 5
      - Option 6
      required: true
    - id: 4
      name: comments
      label: Do you have any comments or suggestions?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: What's your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: What's your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
