inputSchema:
  type: object
  properties:
    title: Anonymous Technology Feedback Survey
    pages:
    - id: 1
      name: technology_type
      label: Technology Type
      hint: What type of technology are you providing feedback on
      type: select_one
      options:
      - Software Application
      - Hardware Device
      - Network Service
      - Cloud Platform
      - Mobile App
      - Website
      - Other
      required: true
    - id: 2
      name: technology_name
      label: Technology Name
      hint: Name of the specific tool or system
      type: text
      options: []
      required: true
    - id: 3
      name: usage_frequency
      label: How often do you use this technology
      hint: Your usage pattern
      type: select_one
      options:
      - Multiple times daily
      - Once daily
      - Several times weekly
      - Once weekly
      - Rarely
      required: true
    - id: 4
      name: usage_duration
      label: How long have you been using this technology
      hint: Duration of use
      type: select_one
      options:
      - Less than 1 month
      - 1 to 6 months
      - 6 months to 1 year
      - 1 to 2 years
      - More than 2 years
      required: true
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall experience
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 6
      name: ease_of_use
      label: Ease of Use Rating
      hint: How easy is the technology to use
      type: select_one
      options:
      - Very easy
      - Easy
      - Neutral
      - Difficult
      - Very difficult
      required: true
    - id: 7
      name: reliability_rating
      label: Reliability Rating
      hint: How reliable is the technology
      type: select_one
      options:
      - Always works
      - Usually works
      - Sometimes has issues
      - Often has problems
      - Constantly fails
      required: true
    - id: 8
      name: performance_rating
      label: Performance Rating
      hint: How would you rate the speed and performance
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 9
      name: features_used
      label: Features You Use Most
      hint: Select all that apply
      type: select_multiple
      options:
      - Core functionality
      - Reporting features
      - Integration capabilities
      - Mobile access
      - Collaboration tools
      - Automation features
      - Analytics dashboard
      - Other
      required: true
    - id: 10
      name: missing_features
      label: What features are missing
      hint: What would you like to see added
      type: text
      options: []
      required: false
    - id: 11
      name: issues_encountered
      label: Common Issues Encountered
      hint: Describe any recurring problems
      type: text
      options: []
      required: false
    - id: 12
      name: support_experience
      label: Technical Support Experience
      hint: If you have contacted support, how was it
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Have not contacted support
      required: false
    - id: 13
      name: recommendation_likelihood
      label: How likely are you to recommend this technology
      hint: On a scale of 0 to 10
      type: number
      options: []
      required: true
    - id: 14
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: What changes would improve your experience
      type: text
      options: []
      required: false
    - id: 15
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback you would like to share
      type: text
      options: []
      required: false
    - id: 16
      name: would_continue_using
      label: Do you plan to continue using this technology
      hint: Your future usage intentions
      type: select_one
      options:
      - Yes, definitely
      - Probably yes
      - Undecided
      - Probably no
      - No, planning to switch
      required: true
