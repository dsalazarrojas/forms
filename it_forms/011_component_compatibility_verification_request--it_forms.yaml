inputSchema:
  type: object
  properties:
    title: Component Compatibility Verification Request
    pages:
      - id: 1
        name: section_request_details
        label: -- Request Details --
        hint: Provide component specifics for compatibility review
        type: note
        options: []
        required: false
      - id: 2
        name: requester_name
        label: Requester name
        hint: Full name for contact
        type: text
        options: []
        required: true
      - id: 3
        name: contact_email
        label: Contact email
        hint: Email for technical follow up
        type: email
        options: []
        required: true
      - id: 4
        name: component_model
        label: Component model
        hint: Model number or name
        type: text
        options: []
        required: true
      - id: 5
        name: existing_system_specifications
        label: Existing system specifications
        hint: Provide key specs such as CPU, RAM, OS
        type: text
        options: []
        required: true
      - id: 6
        name: compatibility_concern
        label: Compatibility concern
        hint: Describe the compatibility question or issue
        type: text
        options: []
        required: true
      - id: 7
        name: attached_documents
        label: Attached documents
        hint: Links or file references of datasheets
        type: text
        options: []
        required: false
      - id: 8
        name: urgency
        label: Urgency
        hint: Select urgency level
        type: select_one
        options: [Low, Medium, High]
        required: true
      - id: 9
        name: preferred_contact_method
        label: Preferred contact method
        hint: Best way to reach you
        type: select_one
        options: [Email, Phone]
        required: true
