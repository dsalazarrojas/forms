inputSchema:
  type: object
  properties:
    title: mobile_app_user_inquiry_form
    pages:
    - id: 1
      name: app_name
      label: App Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: bug_report
      label: Bug Report
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: issue_description
      label: Issue Description
      hint: Describe the issue you are experiencing with the app
      type: text
      options: []
      required: true
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: issue_type
      label: Issue Type
      hint: null
      type: select_one
      options:
      - App Bug
      - Bug Report
      - Feedback
      required: true
    - id: 8
      name: screen_capture
      label: Screen Capture
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: app_version
      label: App Version
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 10
      name: operating_system
      label: Operating System
      hint: null
      type: select_one
      options:
      - Android
      - iOS
      required: true
    - id: 11
      name: device_model
      label: Device Model
      hint: null
      type: text
      options: []
      required: false
