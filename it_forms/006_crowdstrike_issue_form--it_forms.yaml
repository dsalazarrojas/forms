inputSchema:
  type: object
  properties:
    title: Crowdstrike Issue Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: Customer E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: issue_description
      label: Issue Description
      hint: Brief description of the issue
      type: text
      options: []
      required: false
    - id: 4
      name: issue_category
      label: Issue Category
      hint: null
      type: select_multiple
      options:
      - Category 1
      - Category 2
      - Category 3
      required: false
    - id: 5
      name: issue_priority
      label: Issue Priority
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 6
      name: issue_date
      label: Issue Date
      hint: null
      type: date
      options: []
      required: false
