inputSchema:
  type: object
  properties:
    title: Quality Incident Treatment Feedback Form
    pages:
    - id: 1
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: treatment_effectiveness
      label: Treatment Effectiveness
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: satisfaction_level
      label: Satisfaction Level
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: recommended_next_steps
      label: Recommended Next Steps
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: select_one
      options:
      - very positive
      - positive
      - neutral
      - negative
      - very negative
      required: false
    - id: 8
      name: date_submitted
      label: Date Submitted
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time_submitted
      label: Time Submitted
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
