inputSchema:
  type: object
  properties:
    title: Wi Fi Settings Survey
    pages:
    - id: 1
      name: network_status
      label: What is your current network status
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: connection_type
      label: What type of connection do you have
      hint: null
      type: select_one
      options:
      - Home
      - Public
      - Mobile
      required: true
    - id: 3
      name: network_speed
      label: What is your current network speed
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: wi_fi_device
      label: What Wi-Fi device are you using
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: wi_fi_signal
      label: What is your Wi-Fi signal strength
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: access_point
      label: How often do you access the Wi-Fi network
      hint: null
      type: select_multiple
      options:
      - Frequently
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 7
      name: network_performance
      label: How would you rate the performance of your Wi-Fi network
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: wi_fi_support
      label: Do you have any problems with your Wi-Fi network
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: network_issues
      label: What are some issues you have with your Wi-Fi network
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Do you have any additional comments
      hint: null
      type: text
      options: []
      required: false
