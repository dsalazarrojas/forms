inputSchema:
  type: object
  properties:
    title: Microsoft 365 Readiness Assessment Questionnaire
    pages:
    - id: 1
      name: company_size
      label: Company size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - Enterprise
      required: false
    - id: 2
      name: number_of_users
      label: Number of users
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: user_type
      label: User type
      hint: null
      type: select_one
      options:
      - IT Department
      - Marketing Department
      - Sales Department
      - HR Department
      - Other
      required: false
    - id: 4
      name: ms_365_license_status
      label: Microsoft 365 license status
      hint: null
      type: select_one
      options:
      - Not Started
      - Pilot
      - Production
      required: false
    - id: 5
      name: onedrive_usage
      label: OneDrive usage
      hint: null
      type: select_multiple
      options:
      - File Sharing
      - File Storage
      - File Collaboration
      - File Sync
      - Other
      required: false
    - id: 6
      name: sharepoint_usage
      label: SharePoint usage
      hint: null
      type: select_multiple
      options:
      - Team Collaboration
      - Document Management
      - Content Management
      - Compliance and Risk Management
      - Other
      required: false
