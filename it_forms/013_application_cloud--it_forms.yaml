        hint: Repro steps for engineering
        type: text
        options: []
        required: false
      - id: 7
        name: expected_behavior
        label: Expected behavior
        hint: What should happen ideally
        type: text
        options: []
        required: false
      - id: 8
        name: actual_behavior
