inputSchema:
  type: object
  properties:
    title: Cloud Access Security Broker (CASB) Evaluation Questionnaire
    pages:
    - id: 1
      name: section_respondent
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: IT, Security, Infrastructure, etc
      type: text
      options: []
      required: true
    - id: 5
      name: organization
      label: Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: section_casb_overview
      label: -- CASB Requirements Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: casb_priority
      label: How important is CASB implementation for your organization?
      hint: null
      type: select_one
      options:
      - Critical
      - Very important
      - Important
      - Somewhat important
      - Not a priority
      required: true
    - id: 9
      name: cloud_services
      label: How many cloud applications is your organization using?
      hint: Estimate if unsure
      type: number
      options: []
      required: true
    - id: 10
      name: main_concerns
      label: Primary security concerns for cloud usage
      hint: null
      type: select_multiple
      options:
      - Data loss prevention
      - Unauthorized access
      - Malware detection
      - Compliance
      - User behavior monitoring
      - Incident response
      - Other
      required: true
    - id: 11
      name: section_capabilities
      label: -- Required Capabilities --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: visibility_need
      label: Need for cloud application visibility
      hint: null
      type: select_one
      options:
      - Essential
      - High
      - Moderate
      - Low
      - Not needed
      required: true
    - id: 13
      name: user_monitoring
      label: User activity monitoring requirement
      hint: null
      type: select_one
      options:
      - Essential
      - High
      - Moderate
      - Low
      - Not needed
      required: true
    - id: 14
      name: dlp_requirement
      label: Data Loss Prevention DLP capability needed
      hint: null
      type: select_one
      options:
      - Yes, critical
      - Yes, important
      - Maybe
      - 'No'
      required: true
    - id: 15
      name: compliance_frameworks
      label: Applicable compliance frameworks
      hint: null
      type: select_multiple
      options:
      - GDPR
      - HIPAA
      - PCI-DSS
      - SOC 2
      - ISO 27001
      - NIST
      - None
      required: false
    - id: 16
      name: section_integration
      label: -- Integration and Deployment --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: current_security_tools
      label: Current security infrastructure in place
      hint: SIEM, firewalls, endpoints, etc
      type: text
      options: []
      required: false
    - id: 18
      name: integration_preference
      label: Preferred CASB deployment model
      hint: null
      type: select_one
      options:
      - Cloud-native SaaS
      - Hybrid
      - On-premises
      - No preference
      required: true
    - id: 19
      name: api_integration
      label: Ability to integrate with your cloud platforms
      hint: null
      type: select_one
      options:
      - Essential
      - Important
      - Nice to have
      - Not important
      required: false
    - id: 20
      name: section_challenges
      label: -- Implementation Considerations --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: implementation_timeline
      label: Desired CASB implementation timeline
      hint: null
      type: select_one
      options:
      - Immediate - within 1 month
      - Soon - 1-3 months
      - Medium-term - 3-6 months
      - Long-term - 6+ months
      required: true
    - id: 22
      name: budget_allocated
      label: Budget allocated for CASB solution
      hint: Approximate yearly spend
      type: select_one
      options:
      - Under 50k
      - 50k-100k
      - 100k-250k
      - 250k+
      - TBD
      required: true
    - id: 23
      name: key_challenges
      label: Key challenges or concerns for implementation
      hint: null
      type: text
      options: []
      required: false
