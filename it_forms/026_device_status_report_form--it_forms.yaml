inputSchema:
  type: object
  properties:
    title: Device Status Report Form
    pages:
    - id: 1
      name: device_status_report_form
      label: device_status_report_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: device_type
      label: device_type
      hint: null
      type: select_one
      options:
      - Type A
      - Type B
      - Type C
      required: true
    - id: 3
      name: condition
      label: condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Bad
      required: true
    - id: 4
      name: maintenance_needed
      label: maintenance_needed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: priority
      label: priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: technician_comments
      label: technician_comments
      hint: null
      type: note
      options: []
      required: false
