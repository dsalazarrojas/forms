inputSchema:
  type: object
  properties:
    title: Superuser Access Request Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: Enter your name
      type: text
      options: []
      required: false
    - id: 2
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - Superuser
      - Developer
      - IT Admin
      required: false
    - id: 3
      name: access_request
      label: Access Request
      hint: Please specify why you are requesting elevated access
      type: note
      options: []
      required: false
    - id: 4
      name: approved_by
      label: Approved By
      hint: null
      type: select_multiple
      options:
      - IT Admin
      - Director
      - Manager
      required: false
    - id: 5
      name: date_submitted
      label: Date Submitted
      hint: null
      type: date
      options: []
      required: false
