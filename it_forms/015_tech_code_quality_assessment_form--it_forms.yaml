inputSchema:
  type: object
  properties:
    title: Tech Code Quality Assessment Form
    pages:
    - id: 1
      name: tech_code_quality_assessment_form
      label: Code Quality
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 2
      name: code_reviewer
      label: Reviewer
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: tech_code_quality_level
      label: Code Quality Level
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 4
      name: code_completeness
      label: Code Completeness
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: code_readability
      label: Code Readability
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
