inputSchema:
  type: object
  properties:
    title: voice_channel_activation_form
    pages:
    - id: 1
      name: new_voice_channel
      label: new_voice_channel
      hint: null
      type: select_one
      options:
      - voice channel
      - server channel
      required: false
    - id: 2
      name: purpose
      label: purpose
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: access_needs
      label: access_needs
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: activation_timing
      label: activation_timing
      hint: null
      type: select_one
      options:
      - immediate
      - scheduled
      - pending
      required: false
    - id: 5
      name: server_admins
      label: server_admins
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_to
      label: assigned_to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - it admin
      - other
      required: false
