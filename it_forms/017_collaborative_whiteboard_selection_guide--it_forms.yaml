inputSchema:
  type: object
  properties:
    title: Collaborative Whiteboard Selection Guide
    pages:
      - id: 1
        name: requester_name
        label: Requester Full Name
        hint: Your name
        type: text
        options: []
        required: true
      - id: 2
        name: requester_email
        label: Email Address
        hint: Work email
        type: email
        options: []
        required: true
      - id: 3
        name: department
        label: Department
        hint: Your department
        type: text
        options: []
        required: true
      - id: 4
        name: team_size
        label: Team Size
        hint: Number of users
        type: select_one
        options:
          - 1-5 users
          - 6-10 users
          - 11-25 users
          - 26-50 users
          - 51-100 users
          - Over 100 users
        required: true
      - id: 5
        name: primary_use_case
        label: Primary Use Case
        hint: Main purpose
        type: select_one
        options:
          - Brainstorming Sessions
          - Project Planning
          - Remote Collaboration
          - Teaching and Training
          - Design Workshops
          - Agile Standups
          - Client Meetings
          - General Collaboration
        required: true
      - id: 6
        name: use_case_details
        label: Use Case Details
        hint: Describe your needs
        type: text
        options: []
        required: true
      - id: 7
        name: collaboration_features
        label: Required Collaboration Features
        hint: Select all that apply
        type: select_multiple
        options:
          - Real-Time Multi-User Editing
          - Video Conferencing Integration
          - Chat Functionality
          - Commenting and Annotations
          - Version History
          - Template Library
          - Breakout Rooms
          - Presentation Mode
        required: true
      - id: 8
        name: drawing_tools_needed
        label: Drawing Tools Needed
        hint: Select all that apply
        type: select_multiple
        options:
