          - Under $5 per user per month
          - $5-10 per user per month
          - $10-20 per user per month
          - $20-50 per user per month
          - Over $50 per user per month
        required: true
      - id: 17
        name: licensing_preference
        label: Licensing Preference
        hint: How to license
        type: select_one
        options:
