        hint: Support requirements
        type: select_one
        options:
          - Self-Service Only
          - Email Support
          - Chat Support
          - Phone Support
          - Dedicated Account Manager
          - 24/7 Support
        required: true
      - id: 20
        name: training_requirements
        label: Training Requirements
        hint: What training is needed
        type: select_multiple
        options:
          - Video Tutorials
          - Documentation
          - Live Webinars
          - On-Site Training
          - Train the Trainer
          - No Training Needed
        required: true
      - id: 21
        name: accessibility_requirements
        label: Accessibility Requirements
        hint: Select all that apply
        type: select_multiple
        options:
          - Screen Reader Compatible
          - Keyboard Navigation
          - High Contrast Mode
          - WCAG 2.1 Compliant
          - Closed Captioning
          - None Required
        required: true
      - id: 22
        name: mobile_functionality
        label: Mobile Functionality Importance
        hint: How important is mobile
        type: select_one
        options:
          - Critical
          - Very Important
          - Somewhat Important
          - Not Important
        required: true
      - id: 23
        name: offline_access
        label: Offline Access Needed
        hint: Work without internet
        type: select_one
        options:
          - Yes Required
          - Nice to Have
          - Not Needed
        required: true
      - id: 24
        name: decision_timeline
        label: Decision Timeline
        hint: When do you need to decide
        type: select_one
        options:
          - Within 1 Week
          - Within 2 Weeks
          - Within 1 Month
          - Within 3 Months
          - No Rush
        required: true
      - id: 25
        name: decision_makers
        label: Number of Decision Makers
        hint: Who needs to approve
        type: select_one
        options:
          - Just Me
          - 2-3 People
          - 4-6 People
          - Committee Approval
          - Executive Approval
        required: true
      - id: 26
        name: additional_requirements
        label: Additional Requirements
        hint: Any other needs
        type: text
        options: []
        required: false
