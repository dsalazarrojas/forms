          - Shapes and Lines
          - Sticky Notes
          - Text Boxes
          - Connectors and Arrows
          - Mind Mapping
          - Flowcharts
          - Diagrams
        required: true
      - id: 9
        name: integration_requirements
        label: Required Integrations
        hint: Select all that apply
        type: select_multiple
        options:
          - Microsoft Teams
          - Slack
          - Zoom
          - Google Meet
          - Google Drive
          - Microsoft OneDrive
          - Dropbox
          - Notion
          - Jira
          - Trello
          - Asana
          - None Required
        required: true
      - id: 10
        name: platform_preference
        label: Platform Preference
        hint: Where will you use it
        type: select_multiple
        options:
          - Web Browser
          - Windows Desktop
          - Mac Desktop
          - iOS Mobile
          - Android Mobile
          - Tablet Optimized
        required: true
      - id: 11
        name: security_requirements
        label: Security Requirements
        hint: Select all that apply
        type: select_multiple
        options:
          - SSO Single Sign-On
          - Two-Factor Authentication
          - Data Encryption
          - GDPR Compliant
          - HIPAA Compliant
          - SOC 2 Certified
          - Admin Controls
          - Access Permissions
        required: true
      - id: 12
        name: storage_needs
        label: Storage Needs
        hint: How much storage
        type: select_one
        options:
          - Minimal Under 10GB
          - Moderate 10-50GB
          - Standard 50-100GB
          - Large 100GB-1TB
          - Unlimited
        required: true
      - id: 13
        name: board_size_preference
        label: Board Size Preference
        hint: Canvas size needs
        type: select_one
        options:
          - Standard Fixed Size
          - Large Fixed Size
          - Infinite Canvas
          - Variable Sizes
        required: true
