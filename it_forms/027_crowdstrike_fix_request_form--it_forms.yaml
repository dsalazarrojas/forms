inputSchema:
  type: object
  properties:
    title: CrowdStrike Fix Request Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: issue_details
      label: Issue Description
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: fix_info
      label: Fix Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: issue_attachment
      label: Issue Attachment
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: fix_status
      label: Fix Status
      hint: null
      type: select_one
      options:
      - Pending
      - In Progress
      - Fixed
      required: false
    - id: 7
      name: comments_2
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: attachment
      label: Attachment
      hint: null
      type: text
      options: []
      required: false
