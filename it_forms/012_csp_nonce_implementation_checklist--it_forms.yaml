inputSchema:
  type: object
  properties:
    title: CSP Nonce Implementation Checklist
    pages:
    - id: 1
      name: project_name
      label: Project name
      hint: Repository or application name
      type: text
      options: []
      required: true
    - id: 2
      name: owner
      label: Owner or responsible engineer
      hint: Primary contact
      type: text
      options: []
      required: true
    - id: 3
      name: nonce_generation_method
      label: Nonce generation method
      hint: Describe how nonces are created
      type: text
      options: []
      required: true
    - id: 4
      name: templating_integrations
      label: Templating systems requiring nonce support
      hint: e g server side templates
      type: text
      options: []
      required: false
    - id: 5
      name: headers_set_correctly
      label: Content security policy header set correctly
      hint: Verify header is present on responses
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partial
      required: true
    - id: 6
      name: review_status
      label: Security review status
      hint: Final review state
      type: select_one
      options:
      - Passed
      - Action required
      - Not reviewed
      required: true
    - id: 7
      name: remediation_tasks
      label: Remediation tasks
      hint: Tasks and owners for fixes
      type: text
      options: []
      required: false
    - id: 8
      name: completion_date
      label: Expected completion date
      hint: Target date for implementation
      type: date
      options: []
      required: false
