inputSchema:
  type: object
  properties:
    title: Software Request Form
    pages:
    - id: 1
      name: software_request_1
      label: What is the software you are requesting?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: software_category_1
      label: Software Category
      hint: null
      type: select_one
      options:
      - General
      - IT
      - Security
      - Network
      - Database
      - Operating System
      - Other (please specify)
      required: true
    - id: 3
      name: software_sub_category_1
      label: Software Sub Category
      hint: null
      type: select_multiple
      options:
      - Category A
      - Category B
      - Category C
      - Other (please specify)
      required: true
    - id: 4
      name: software_description_1
      label: Brief Description
      hint: Please provide a brief description of the software you are requesting
      type: text
      options: []
      required: true
    - id: 5
      name: software_version_1
      label: Software Version
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_information_1
      label: Contact Information
      hint: Please provide your name and contact phone number and email so we can
        reach you
      type: text
      options: []
      required: true
    - id: 7
      name: department_1
      label: Department
      hint: null
      type: select_one
      options:
      - IT
      - Security
      - Finance
      - Marketing
      - Other (please specify)
      required: true
    - id: 8
      name: is_urgent_1
      label: Is this software request an urgent matter?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: software_timeline_1
      label: Expected Timeline
      hint: Please provide a rough timeline for when you would like the software to
        be implemented
      type: date
      options: []
      required: true
    - id: 10
      name: primary_user_1
      label: Primary User
      hint: null
      type: select_one
      options:
      - Me
      - Another User
      - Team
      required: true
    - id: 11
      name: software_note_1
      label: Additional Information (if needed)
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: notification_1
      label: Would you like to be notified when the software is ready to use?
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
