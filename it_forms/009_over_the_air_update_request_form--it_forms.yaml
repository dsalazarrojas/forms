inputSchema:
  type: object
  properties:
    title: Over The Air Update Request Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: scheduled_date
      label: Scheduled Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: scheduled_time
      label: Scheduled Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: note
      label: Additional Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Device Updates
      - Software Updates
      - Configuration
      required: true
    - id: 9
      name: subcategory
      label: Sub Category
      hint: null
      type: select_multiple
      options:
      - Device Drivers
      - Firmware
      - Security Patches
      required: false
    - id: 10
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Scheduled
      - In Progress
      - Complete
      required: true
    - id: 12
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - chatjimmy
      - John
      - Jane
      required: true
