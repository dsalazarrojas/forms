inputSchema:
  type: object
  properties:
    title: Software Satisfaction Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: Please take a few minutes to complete this survey to help us understand
        your experience with our software.
      type: note
      options: []
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - not at all satisfied
      - extremely unhappy
      - very unhappy
      required: true
    - id: 3
      name: ease_of_use
      label: Ease of Use
      hint: null
      type: number
      options: []
      required: true
