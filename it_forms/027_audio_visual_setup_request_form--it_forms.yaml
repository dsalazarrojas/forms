inputSchema:
  type: object
  properties:
    title: Audio Visual Setup Request Form
    pages:
    - id: 1
      name: requester_full_name
      label: Requester Full Name
      hint: Name of person requesting setup
      type: text
      options: []
      required: true
    - id: 2
      name: requester_email
      label: Email Address
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 3
      name: requester_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Your department or team
      type: select_one
      options:
      - IT Department
      - Marketing
      - Human Resources
      - Sales
      - Executive
      - Operations
      - Other
      required: true
    - id: 5
      name: request_date
      label: Request Date
      hint: Date of this setup request
      type: date
      options: []
      required: true
    - id: 6
      name: setup_date
      label: Setup Date
      hint: When is setup needed?
      type: date
      options: []
      required: true
    - id: 7
      name: setup_time
      label: Setup Time
      hint: What time should setup begin?
      type: time
      options: []
      required: true
    - id: 8
      name: location_building
      label: Building
      hint: Building name or number
      type: text
      options: []
      required: true
    - id: 9
      name: location_room
      label: Room Number
      hint: Room or conference room number
      type: text
      options: []
      required: true
    - id: 10
      name: location_floor
      label: Floor
      hint: Floor number
      type: text
      options: []
      required: false
    - id: 11
      name: meeting_type
      label: Meeting Type
      hint: What type of meeting is this?
      type: select_one
      options:
      - Internal Meeting
      - Client Presentation
      - Training Session
      - Video Conference
      - Board Meeting
      - All Hands
      - Other
      required: true
    - id: 12
      name: expected_attendees
      label: Expected Attendees
      hint: Number of people attending
      type: number
      options: []
      required: true
    - id: 13
      name: remote_participants
      label: Remote Participants
      hint: Will there be remote participants?
      type: select_one
      options:
      - Yes, video conferencing needed
      - Yes, audio only
      - No, all in-person
      required: true
    - id: 14
      name: display_requirements
      label: Display Requirements
      hint: What display equipment is needed?
      type: select_multiple
      options:
      - Primary projector
      - Secondary projector
      - Large monitor
      - Multiple monitors
      - Video wall
      - Whiteboard
      - Flip chart
      required: true
    - id: 15
      name: computer_source
      label: Computer Source
      hint: What computer will be used?
      type: select_one
      options:
      - Personal laptop
      - Company laptop
      - Room PC
      - No computer needed
      required: true
    - id: 16
      name: connectivity_needs
      label: Connectivity Needs
      hint: What connectivity is required?
      type: select_multiple
      options:
      - HDMI cable
      - VGA adapter
      - USB-C adapter
      - Wireless casting
      - Ethernet connection
      - WiFi access
      required: true
    - id: 17
      name: audio_requirements
      label: Audio Requirements
      hint: What audio equipment is needed?
      type: select_multiple
      options:
      - Room microphone
      - Wireless microphone
      - Conference phone
      - Speakers
      - Audio recording
      required: true
    - id: 18
      name: video_conferencing_platform
      label: Video Conferencing Platform
      hint: Which platform will be used?
      type: select_one
      options:
      - Zoom
      - Microsoft Teams
      - Google Meet
      - Webex
      - Skype
      - Other
      - Not applicable
      required: false
    - id: 19
      name: special_instructions
      label: Special Instructions
      hint: Any special setup instructions
      type: text
      options: []
      required: false
    - id: 20
      name: it_contact_approval
      label: IT Contact Approval
      hint: Has your IT contact approved this request?
      type: select_one
      options:
      - Yes, approved
      - Pending approval
      - Not required
      required: true
    - id: 21
      name: teardown_time
      label: Teardown Time
      hint: When can equipment be removed?
      type: time
      options: []
      required: false
