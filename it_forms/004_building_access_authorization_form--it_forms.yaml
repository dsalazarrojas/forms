inputSchema:
  type: object
  properties:
    title: Building Access Authorization Form
    pages:
    - id: 1
      name: applicant_name
      label: Full Name
      hint: Complete legal name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: employee_id
      label: Employee ID
      hint: Or contractor number if applicable
      type: text
      options: []
      required: false
    - id: 5
      name: department
      label: Department
      hint: Which department do you work for
      type: text
      options: []
      required: true
    - id: 6
      name: access_type
      label: Type of Access Required
      hint: What access do you need
      type: select_multiple
      options:
      - Building Entry
      - Parking
      - Server Room
      - Executive Floor
      - After-Hours Access
      - Visitor Escort
      required: true
    - id: 7
      name: buildings_list
      label: Buildings to Access
      hint: Select applicable buildings
      type: select_multiple
      options:
      - Main Office
      - Warehouse
      - Data Center
      - Research Lab
      - Administrative Building
      required: true
    - id: 8
      name: access_start_date
      label: Access Start Date
      hint: When do you need access
      type: date
      options: []
      required: true
    - id: 9
      name: access_end_date
      label: Access End Date
      hint: When does access expire
      type: date
      options: []
      required: false
    - id: 10
      name: access_duration
      label: Access Duration
      hint: Is this permanent or temporary
      type: select_one
      options:
      - Permanent
      - Temporary
      - Contract Duration
      required: true
    - id: 11
      name: justification
      label: Business Justification
      hint: Why do you need this access
      type: text
      options: []
      required: true
    - id: 12
      name: manager_name
      label: Direct Manager Name
      hint: Your supervisor
      type: text
      options: []
      required: true
    - id: 13
      name: manager_email
      label: Manager Email
      hint: For approval
      type: email
      options: []
      required: true
    - id: 14
      name: security_clearance
      label: Security Clearance Status
      hint: Do you have clearance
      type: select_one
      options:
      - Yes, Current
      - Yes, Expired
      - No Clearance
      - Pending
      required: true
    - id: 15
      name: contractor_status
      label: Are You a Contractor or Employee
      hint: Employment classification
      type: select_one
      options:
      - Employee
      - Contractor
      - Visitor
      - Vendor
      required: true
    - id: 16
      name: background_check
      label: Background Check Completed
      hint: Required for all access
      type: select_one
      options:
      - true
      - false
      - In Progress
      required: true
