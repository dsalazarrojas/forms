inputSchema:
  type: object
  properties:
    title: Cyber Security Quiz For Employees
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: role
      label: role
      hint: null
      type: select_one
      options:
      - IT
      - Management
      - Support
      required: false
    - id: 3
      name: quiz_completed
      label: Have you completed the security quiz in the last 6 months?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: password_manager
      label: Password Manager
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: password_manager_tool
      label: What password manager do you use?
      hint: null
      type: select_multiple
      options:
      - LastPass
      - 1Password
      - KeePass
      - Dashlane
      required: false
    - id: 6
      name: last_2fa
      label: Do you use Last 2FA?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: password_rotation
      label: Do you rotate your passwords?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: password_rotation_frequency
      label: How often do you rotate your passwords?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Never
      required: false
    - id: 9
      name: password_length
      label: What is the average length of your password?
      hint: null
      type: number
      options: []
      required: false
