      - 'False'
      required: false
    - id: 23
      name: password_manager_password
      label: Password manager password
      hint: null
      type: select_multiple
      options:
      - LastPass
      - 1Password
      - KeePass
      - Dashlane
      required: false
    - id: 24
      name: two_factor_authentication
      label: Two Factor Authentication?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 25
      name: security_questions
      label: How many security questions do you have?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
