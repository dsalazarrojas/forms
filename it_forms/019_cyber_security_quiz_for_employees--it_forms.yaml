      name: phishing_training
      label: Have you received phishing training?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: phishing_attacks
      label: Have you ever fallen victim to phishing attacks?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: security_training
      label: Have you received security training?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: security_conference
      label: Have you attended a security conference?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
