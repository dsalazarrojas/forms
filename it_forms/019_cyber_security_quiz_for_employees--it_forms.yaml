      name: last_password_update
      label: When was last your password updated?
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: password_strength
      label: How strong is your password?
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: password_expiration
      label: How often is your password expire?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: password_expiration_frequency
      label: How often is your password expire?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Never
      required: false
