      label: Lead Supervisor
      hint: Name of the lead supervisor conducting the tailboard
      type: text
      options: []
      required: true
    - id: 4
      name: team_members_present
      label: Team Members Present
      hint: Names of all team members attending the tailboard
      type: text
      options: []
      required: true
    - id: 5
      name: work_area_location
      label: Work Area Location
      hint: Specific location of the infrastructure work
      type: text
      options: []
      required: true
    - id: 6
      name: work_description
      label: Work Description
      hint: Brief description of the infrastructure work to be performed
      type: text
      options: []
      required: true
    - id: 7
      name: equipment_used
      label: Equipment to be Used
      hint: List of equipment that will be used during the work
      type: text
      options: []
      required: true
    - id: 8
      name: safety_hazards_identified
      label: Safety Hazards Identified
      hint: What safety hazards have been identified for this work?
      type: text
      options: []
      required: true
