inputSchema:
  type: object
  properties:
    title: it_service_ticket_form
    pages:
    - id: 1
      name: requestor_email
      label: Requestor's Email
      hint: null
      type: email
      options: []
      required: true
    - id: 2
      name: ticket_status
      label: Ticket Status
      hint: null
      type: select_one
      options:
      - Open
      - In Progress
      - Closed
      - Waiting On
      required: true
    - id: 3
      name: ticket_priority
      label: Ticket Priority
      hint: null
      type: select_one
      options:
      - High
      - Low
      - Medium
      required: true
    - id: 4
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: created_at
      label: Creation Date
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: updated_at
      label: Update Date
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: tool_type
      label: Tool Type
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: tool
      label: Tool
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: tool_name
      label: Tool Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: due_time
      label: Due Time
      hint: null
      type: time
      options: []
      required: true
