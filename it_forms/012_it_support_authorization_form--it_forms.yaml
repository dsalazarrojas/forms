inputSchema:
  type: object
  properties:
    title: it_support_authorization_form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - IT
      - Finance
      - HR
      - Admin
      required: true
    - id: 4
      name: access_level
      label: Access Level
      hint: null
      type: select_multiple
      options:
      - Limited
      - Full
      - Custom
      required: true
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: device_access
      label: Device Access
      hint: null
      type: select_multiple
      options:
      - Laptop
      - Mobile Phone
      - Printer
      - Network Switch
      required: true
    - id: 9
      name: system_access
      label: System Access
      hint: null
      type: select_multiple
      options:
      - Windows
      - Linux
      - Mac
      - Other
      required: true
    - id: 10
      name: supervisor_approval
      label: Supervisor Approval
      hint: null
      type: select_one
      options:
      - Approve
      - Deny
      required: true
