inputSchema:
  type: object
  properties:
    title: Digital Trace Data Exchange Application Form
    pages:
    - id: 1
      name: application_form
      label: Application
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_details
      label: Contact Details
      hint: Provide detailed contact information for the PI or their contact
      type: text
      options: []
      required: false
    - id: 4
      name: data_request
      label: Data Request
      hint: What trace data would you like to request? Describe what data you are
        requesting and why you are requesting it
      type: text
      options: []
      required: false
    - id: 5
      name: intended_use
      label: Intended Use
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: consent
      label: Consent to Data Usage Policy
      hint: null
      type: select_one
      options:
      - Agree
      - Disagree
      required: false
    - id: 7
      name: contact_info_confirmation
      label: Confirm Contact
      hint: Confirm that the above contact details are correct
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: data_request_confirmation
      label: Confirm
      hint: null
      type: select_multiple
      options:
      - Agree
      - Disagree
      required: false
    - id: 9
      name: contact_info_verification
      label: Verification
      hint: null
      type: select_one
      options:
      - Agree
      - Disagree
      required: false
    - id: 10
      name: terms_of_service
      label: Terms of Service
      hint: I understand and agree to the terms of service
      type: select_one
      options:
      - Agree
      - Disagree
      required: false
