inputSchema:
  type: object
  properties:
    title: tech_data_protection_referral_form
    pages:
    - id: 1
      name: tech_data_protection_referral_form_page_1
      label: Referral Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: it_team_contact
      label: it_team
      hint: null
      type: select_one
      options:
      - IT Team 1
      - Security Team
      - Privacy Team
      - Other
      required: true
    - id: 3
      name: incident_details
      label: incident_details
      hint: Provide a brief description
      type: text
      options: []
      required: true
    - id: 4
      name: priority
      label: priority
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 5
      name: data_types
      label: data_types
      hint: Check all that apply
      type: select_multiple
      options:
      - Personal Data
      - Technical Data
      - Business Data
      - Special Category Data
      required: true
    - id: 6
      name: data_classification
      label: data_classification
      hint: Check all that apply
      type: select_multiple
      options:
      - Confidential
      - Public
      - Restricted
      - Private
      required: true
    - id: 7
      name: incident_description
      label: incident_description
      hint: Provide a detailed description of the incident
      type: text
      options: []
      required: true
    - id: 8
      name: resolution
      label: resolution
      hint: How was the referral resolved?
      type: select_one
      options:
      - Resolved
      - Not Resolved
      required: true
