inputSchema:
  type: object
  properties:
    title: Secure Web Access Error Report Form
    pages:
    - id: 1
      name: user_id
      label: User ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: error_details
      label: Error Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: issue_date
      label: Issue Date
      hint: null
      type: date
      options: []
      required: false
