      - firefox
      - safari
      required: false
    - id: 9
      name: os
      label: OS
      hint: null
      type: select_one
      options:
      - windows
      - mac
      - linux
      required: false
    - id: 10
      name: ip_address
      label: IP Address
      hint: null
      type: text
      options: []
