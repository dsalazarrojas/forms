inputSchema:
  type: object
  properties:
    title: Network Security Quiz
    pages:
    - id: 1
      name: network_security_quiz
      label: Network Security Basics
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: network_security_threats
      label: Types of Network Threats
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: network_security_risk_factors
      label: Network Security Risk Factors
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: network_security_quiz_question_1
      label: What is the difference between a firewall and an intrusion detection
        system?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: network_security_quiz_answer_1
      label: None
      hint: null
      type: select_one
      options:
      - A firewall is a physical barrier.
      - A firewall is a software barrier.
      - A firewall is a network-based security system.
      - A firewall is a hardware-based security system.
      required: false
    - id: 6
      name: network_security_quiz_question_2
      label: What is the purpose of an intrusion detection system?
      hint: null
      type: select_one
      options:
      - A firewall is installed to identify and prevent unauthorized access.
      - A router is installed to identify and prevent unauthorized access.
      - A network switch is installed to identify and prevent unauthorized access.
      - An intrusion detection system is installed to identify and prevent unauthorized
        access.
      required: false
    - id: 7
      name: network_security_quiz_question_3
      label: Which of the following network devices can identify and prevent unauthorized
        access?
      hint: null
      type: select_multiple
      options:
      - Firewall
      - Network switch
      - Router
      - Intrusion detection system
      required: false
    - id: 8
      name: network_security_quiz_question_4
      label: What is the purpose of an intrusion prevention system?
      hint: null
      type: select_one
      options:
      - Identifying and alerting the network administrator.
      - Identifying and preventing unauthorized access.
      - Identifying, alerting, and preventing unauthorized access.
      - Identifying, alerting, and blocking malicious traffic.
      required: false
    - id: 9
      name: network_security_quiz_question_5
      label: Which type of attack is the most common type of network threat?
      hint: null
      type: select_one
      options:
      - Phishing
      - SQL Injection
      - Cross-Site Scripting
      - Ransomware
      required: false
    - id: 10
      name: network_security_quiz_question_6
      label: What is the primary difference between a network switch and a network
        router?
      hint: null
      type: select_one
      options:
      - A network switch is a networked device.
      - A network router is a networked device.
      - A network switch is a hardware-based device.
      - A network router is a software-based device.
      required: false
    - id: 11
      name: network_security_quiz_question_7
      label: What is the main purpose of a network segmentation?
      hint: null
      type: select_one
      options:
      - To reduce network latency.
      - To increase network bandwidth.
      - To reduce network complexity.
      - To separate sensitive data.
      required: false
    - id: 12
      name: network_security_quiz_question_8
      label: What is the primary goal of a network security awareness program?
      hint: null
      type: select_one
      options:
      - To prevent network threats.
      - To identify and respond to network threats.
      - To educate users on network security.
      - To reduce network downtime.
