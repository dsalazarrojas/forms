inputSchema:
  type: object
  properties:
    title: Cloud Commerce Infrastructure Application Form
    pages:
    - id: 1
      name: section_organization
      label: -- Organization Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: organization_type
      label: Organization Type
      hint: null
      type: select_one
      options:
      - E-commerce company
      - Retail chain
      - Marketplace
      - B2B seller
      - SaaS platform
      - Other
      required: true
    - id: 4
      name: annual_revenue
      label: Annual Revenue - USD
      hint: Approximate if not exact
      type: select_one
      options:
      - Under 1M
      - 1M-10M
      - 10M-100M
      - 100M-1B
      - 1B+
      required: true
    - id: 5
      name: section_contact
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contact_name
      label: Full Name
      hint: Authorized representative
      type: text
      options: []
      required: true
    - id: 7
      name: contact_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: section_requirements
      label: -- Infrastructure Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: current_infrastructure
      label: Current infrastructure setup
      hint: On-premises, cloud, hybrid, etc
      type: text
      options: []
      required: true
    - id: 12
      name: expected_traffic
      label: Expected monthly traffic - Transactions
      hint: Estimate of commerce transactions
      type: number
      options: []
      required: true
    - id: 13
      name: peak_load
      label: Peak load capacity needed - TPS
      hint: Transactions per second
      type: number
      options: []
      required: true
    - id: 14
      name: data_storage
      label: Estimated data storage - GB
      hint: Product data, customer data, transactions
      type: number
      options: []
      required: true
    - id: 15
      name: section_capabilities
      label: -- Required Capabilities --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: required_features
      label: Required cloud commerce features
      hint: null
      type: select_multiple
      options:
      - Payment processing
      - Inventory management
      - Multi-channel sales
      - Customer analytics
      - Mobile support
      - API access
      - Security compliance
      - Scalability
      required: true
    - id: 17
      name: integration_needs
      label: Integration with existing systems
      hint: CRM, ERP, accounting, etc
      type: text
      options: []
      required: false
    - id: 18
      name: compliance_requirements
      label: Compliance and regulations needed
      hint: PCI-DSS, GDPR, HIPAA, etc
      type: text
      options: []
      required: false
    - id: 19
      name: section_evaluation
      label: -- Evaluation Criteria --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: budget_range
      label: Estimated annual budget - USD
      hint: null
      type: select_one
      options:
      - Under 50k
      - 50k-100k
      - 100k-250k
      - 250k-500k
      - 500k+
      required: true
    - id: 21
      name: implementation_timeline
      label: Implementation timeline
      hint: null
      type: select_one
      options:
      - Immediate - 1 month
      - Quick - 1-3 months
      - Standard - 3-6 months
      - Long-term - 6+ months
      required: true
    - id: 22
      name: key_priorities
      label: Key priorities for this project
      hint: Cost, performance, scalability, security, etc
      type: text
      options: []
      required: true
    - id: 23
      name: section_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: additional_notes
      label: Additional notes or context
      hint: null
      type: text
      options: []
      required: false
