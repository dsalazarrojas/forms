inputSchema:
  type: object
  properties:
    title: Agent Submission Form
    pages:
    - id: 1
      name: submitter_info
      label: -- Submitter Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Name of the submitter
      type: text
      options: []
      required: true
    - id: 3
      name: title
      label: Title
      hint: Job title of submitter
      type: text
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone number
      hint: Contact phone for follow up
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: company_address
      label: Company address
      hint: Broker office or mailing address
      type: text
      options: []
      required: false
    - id: 7
      name: submission_type
      label: Submission type
      hint: Nature of the submission
      type: select_one
      options:
      - New agent
      - Update details
      - Remove agent
      required: true
    - id: 8
      name: additional_information
      label: Additional information
      hint: Any extra details to include
      type: text
      options: []
      required: false
    - id: 9
      name: date_submitted
      label: Date submitted
      hint: Date of this submission
      type: date
      options: []
      required: true
    - id: 10
      name: reference_number
      label: Reference number
      hint: Internal reference or ticket number
      type: text
      options: []
      required: false
