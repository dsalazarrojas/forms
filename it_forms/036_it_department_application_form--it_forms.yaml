inputSchema:
  type: object
  properties:
    title: IT Department Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: example@example.com
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: select_multiple
      options:
      - Software Engineer
      - System Administrator
      - Database Manager
      required: false
    - id: 6
      name: years_of_experience
      label: Years of Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: job_level
      label: Job Level
      hint: null
      type: select_one
      options:
      - Junior
      - Mid-level
      - Senior
      required: true
    - id: 8
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - IT
      - Sales
      - Marketing
      required: true
    - id: 9
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
