inputSchema:
  type: object
  properties:
    title: Laptop Research Survey Template
    pages:
    - id: 1
      name: laptop_usage_frequency
      label: how often do you use your laptop
      hint: Please answer in terms of the number of days per week
      type: number
      options: []
      required: false
    - id: 2
      name: laptop_usage_purpose
      label: what is your primary use of laptops
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''work''}'
      - '{''id'': 2, ''name'': ''personal''}'
      - '{''id'': 3, ''name'': ''school''}'
      - '{''id'': 4, ''name'': ''other''}'
      - '{''id'': 5, ''name'': ''dont know''}'
      required: true
    - id: 3
      name: laptop_preference
      label: what is your preference for screen size
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''11-12 inches''}'
      - '{''id'': 2, ''name'': ''13-14 inches''}'
      - '{''id'': 3, ''name'': ''15-16 inches''}'
      - '{''id'': 4, ''name'': ''17-18 inches''}'
      - '{''id'': 5, ''name'': ''dont know''}'
      required: true
    - id: 4
      name: laptop_purchase_frequency
      label: how often do you buy new laptops
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''rarely''}'
      - '{''id'': 2, ''name'': ''occasionally''}'
      - '{''id'': 3, ''name'': ''frequently''}'
      - '{''id'': 4, ''name'': ''all the time''}'
      - '{''id'': 5, ''name'': ''never''}'
      required: true
    - id: 5
      name: laptop_purchase_reason
      label: what drives your laptop purchase decisions
      hint: Please answer with as much detail as possible
      type: text
      options: []
      required: false
    - id: 6
      name: laptop_purchase_cost
      label: how much do you typically spend on laptops
      hint: Please answer in dollars
      type: number
      options: []
      required: false
    - id: 7
      name: laptop_purchase_warranty
      label: do you usually purchase warranty for laptops
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': True}'
      - '{''id'': 2, ''name'': False}'
      - '{''id'': 3, ''name'': ''dont know''}'
      required: true
    - id: 8
      name: laptop_usage_duration
      label: how many years have you used laptops
      hint: Please answer in years
      type: number
      options: []
      required: false
    - id: 9
      name: laptop_recommended
      label: what would you recommend to a friend
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''apple''}'
      - '{''id'': 2, ''name'': ''dell''}'
      - '{''id'': 3, ''name'': ''hp''}'
      - '{''id'': 4, ''name'': ''lenovo''}'
      - '{''id'': 5, ''name'': ''other''}'
      - '{''id'': 6, ''name'': ''not recommended''}'
      required: false
    - id: 10
      name: laptop_satisfaction
      label: how satisfied are you with your laptop
      hint: Please answer on a scale of 1-5
      type: number
      options: []
      required: false
    - id: 11
      name: laptop_satisfaction_reason
      label: reason for satisfaction or dissatisfaction
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: laptop_recommender
      label: who would you recommend to buy your current laptop
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''friend''}'
      - '{''id'': 2, ''name'': ''family member''}'
      - '{''id'': 3, ''name'': ''colleague''}'
      - '{''id'': 4, ''name'': ''not applicable''}'
      required: false
    - id: 13
      name: laptop_recommender_relation
      label: relationship to the person you would recommend
      hint: Please answer with as much detail as possible
      type: text
      options: []
      required: false
    - id: 14
      name: laptop_satisfaction_reason
      label: reason for satisfaction or dissatisfaction
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: laptop_purchaser
      label: who purchases your laptop
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''self''}'
      - '{''id'': 2, ''name'': ''family member''}'
      - '{''id'': 3, ''name'': ''colleague''}'
      - '{''id'': 4, ''name'': ''friend''}'
      required: true
    - id: 16
      name: laptop_purchaser_relation
      label: relationship to the person purchasing the laptop
      hint: Please answer with as much detail as possible
      type: text
      options: []
      required: false
    - id: 17
      name: laptop_warranty_purchased
      label: do you purchase warranty for your current laptop
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': True}'
      - '{''id'': 2, ''name'': False}'
      - '{''id'': 3, ''name'': ''dont know''}'
      required: true
    - id: 18
      name: laptop_satisfaction_purchaser
      label: satisfaction of person purchasing the laptop
      hint: Please answer on a scale of 1-5
      type: number
      options: []
      required: false
    - id: 19
      name: laptop_satisfaction_purchaser_reason
      label: reason for satisfaction or dissatisfaction of purchaser
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: laptop_warranty_purchaser
      label: what is the relationship of the purchaser to you
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: laptop_warranty_purchaser_reason
      label: reason for satisfaction or dissatisfaction of warranty purchaser
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: laptop_satisfaction_self
      label: how satisfied are you with your current laptop
      hint: Please answer on a scale of 1-5
      type: number
      options: []
      required: false
    - id: 23
      name: laptop_satisfaction_self_reason
      label: reason for satisfaction or dissatisfaction with laptop
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: laptop_recommendation
      label: would you recommend a laptop to someone else
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': True}'
      - '{''id'': 2, ''name'': False}'
      - '{''id'': 3, ''name'': ''maybe''}'
      required: true
    - id: 25
      name: laptop_recommendation_reason
      label: reason for recommendation or non-recommendation
      hint: null
      type: text
      options: []
      required: false
