inputSchema:
  type: object
  properties:
    title: Severity 1 Incident Report Form
    pages:
    - id: 1
      name: severity_level
      label: What is the severity level
      hint: null
      type: select_one
      options:
      - critical
      - high
      - medium
      - low
      required: false
    - id: 2
      name: incident_type
      label: Incident type
      hint: null
      type: select_one
      options:
      - hardware
      - software
      - other
      required: false
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: incident_date
      label: Incident date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 5
      name: incident_time
      label: Incident time
      hint: "HH:MM am/pm"
      type: time
      options: []
      required: false
    - id: 6
      name: incident_location
      label: Incident location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: incident_details
      label: Incident details
      hint: Provide as much detail as possible
      type: note
      options: []
      required: false
    - id: 8
      name: incident_resolution
      label: Resolution outcome
      hint: null
      type: select_one
      options:
      - resolved
      - unresolved
      required: false
    - id: 9
      name: incident_status
      label: Incident status
      hint: null
      type: select_one
      options:
      - active
      - closed
      required: false
    - id: 10
      name: incident_team
      label: Incident team
      hint: null
      type: select_one
      options:
      - IT
      - Operations
      - Other
      required: false
    - id: 11
      name: incident_priority
      label: Incident priority
      hint: null
      type: select_one
      options:
      - high
      - medium
      - low
      required: false
