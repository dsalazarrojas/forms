      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: role
      label: role
      hint: null
      type: select_one
      options:
      - Manager
      - Team
      - Unknown
      required: false
    - id: 3
      name: department
      label: department
      hint: null
      type: select_multiple
      options:
      - Finance
      - Marketing
      - Unknown
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: declaration
      label: Declaration
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: route
      label: Route
      hint: null
      type: select_multiple
      options:
      - IT
      - Team-leader
      - Department-leader
      required: true
