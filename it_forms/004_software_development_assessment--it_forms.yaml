inputSchema:
  type: object
  properties:
    title: Software Development Assessment
    pages:
    - id: 1
      name: overview
      label: Software Development Overview
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: experience
      label: Experience
      hint: null
      type: select_one
      options:
      - Junior
      - Mid-Level
      - Senior
      required: true
    - id: 3
      name: languages
      label: Programming Languages
      hint: null
      type: select_multiple
      options:
      - Java
      - Python
      - C++
      - C#
      - JavaScript
      - SQL
      required: true
    - id: 4
      name: agile
      label: Agile Experience
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: tools
      label: Development Tools
      hint: null
      type: select_multiple
      options:
      - Eclipse
      - Visual Studio
      - IntelliJ
      - Sublime Text
      - Atom
      required: false
    - id: 6
      name: frameworks
      label: Frameworks and Libraries
      hint: null
      type: select_multiple
      options:
      - Spring
      - Django
      - React
      - Angular
      - Vue
      - Express
      required: false
    - id: 7
      name: devops
      label: DevOps and CI/CD
      hint: null
      type: select_multiple
      options:
      - Jenkins
      - Git
      - Docker
      - Kubernetes
      - Nagios
      - CircleCI
