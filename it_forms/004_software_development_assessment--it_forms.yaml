      hint: null
      type: select_one
      options:
      - AWS
      - Azure
      - Google Cloud
      - On-premises
      required: false
    - id: 10
      name: operating_systems
      label: Operating Systems
      hint: null
      type: select_multiple
      options:
      - Windows
      - Linux
      - macOS
      - Unix
      - Solaris
      required: false
    - id: 11
      name: sdlc
      label: Software Development Life Cycle (SDLC)
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
