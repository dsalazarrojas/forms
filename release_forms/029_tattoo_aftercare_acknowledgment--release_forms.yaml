inputSchema:
  type: object
  properties:
    title: Tattoo Aftercare Acknowledgment
    pages:
    - id: 1
      name: tattoo_aftercare_acknowledgment
      label: Tattoo Aftercare Acknowledgment Form
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: studio_signature
      label: Studio Signature
      hint: null
      type: select_one
      options:
      - Studio
      - Artist
      required: true
    - id: 3
      name: client_signature
      label: Client Signature
      hint: null
      type: select_one
      options:
      - I have read and understood the aftercare instructions.
      - I have not read or understood the aftercare instructions.
      required: true
