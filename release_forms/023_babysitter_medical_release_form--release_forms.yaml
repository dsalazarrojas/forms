inputSchema:
  type: object
  properties:
    title: Babysitter Medical Release Form
    pages:
    - id: 1
      name: parent_guardian_name
      label: Parent or Guardian Full Name
      hint: Legal name of parent or guardian
      type: text
      options: []
      required: true
    - id: 2
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 3
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 4
      name: child_name
      label: Child Full Name
      hint: Legal name of child
      type: text
      options: []
      required: true
    - id: 5
      name: child_date_of_birth
      label: Child Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 6
      name: babysitter_name
      label: Babysitter Name
      hint: Name of authorized caregiver
      type: text
      options: []
      required: true
    - id: 7
      name: care_dates
      label: Dates of Care
      hint: When will babysitter be caring for child
      type: text
      options: []
      required: true
    - id: 8
      name: medical_provider
      label: Primary Care Physician
      hint: Doctor name and practice
      type: text
      options: []
      required: true
    - id: 9
      name: doctor_phone
      label: Doctor Phone Number
      hint: Pediatrician contact
      type: text
      options: []
      required: true
    - id: 10
      name: preferred_hospital
      label: Preferred Hospital
      hint: Nearest preferred medical facility
      type: text
      options: []
      required: true
    - id: 11
      name: hospital_address
      label: Hospital Address
      hint: Full address of hospital
      type: text
      options: []
      required: true
    - id: 12
      name: health_insurance_provider
      label: Health Insurance Provider
      hint: Insurance company name
      type: text
      options: []
      required: true
    - id: 13
      name: policy_number
      label: Policy Number
      hint: Insurance policy or member ID
      type: text
      options: []
      required: true
    - id: 14
      name: group_number
      label: Group Number
      hint: Insurance group number if applicable
      type: text
      options: []
      required: false
    - id: 15
      name: medical_conditions
      label: Known Medical Conditions
      hint: List any chronic conditions
      type: text
      options: []
      required: true
    - id: 16
      name: allergies
      label: Known Allergies
      hint: Include food, medication, and environmental
      type: text
      options: []
      required: true
    - id: 17
      name: current_medications
      label: Current Medications
      hint: List all medications with dosages
      type: text
      options: []
      required: true
    - id: 18
      name: authorization_statement
      label: Medical Treatment Authorization
      hint: I authorize babysitter to seek emergency medical treatment
      type: select_one
      options:
      - Yes, I authorize
      - No, I do not authorize
      required: true
    - id: 19
      name: treatment_scope
      label: Scope of Authorized Treatment
      hint: What treatments are authorized
      type: select_multiple
      options:
      - Emergency care
      - Routine medical care
      - Prescription pickup
      - Dental emergency
      - Urgent care visits
      required: true
    - id: 20
      name: alternate_contact
      label: Alternate Emergency Contact
      hint: Name and phone if parent unavailable
      type: text
      options: []
      required: true
    - id: 21
      name: parent_signature_date
      label: Date Signed
      hint: Date of this authorization
      type: date
      options: []
      required: true
    - id: 22
      name: expiration_date
      label: Authorization Expiration Date
      hint: When does this release expire
      type: date
      options: []
      required: false
