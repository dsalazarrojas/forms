    - id: 4
      name: model_agreement
      label: Model Agreement
      hint: null
      type: select_one
      options:
      - I am clear of all rights and responsibilities
      - I am aware that all rights and responsibilities will be transferred to the
        event host
      required: false
    - id: 5
