inputSchema:
  type: object
  properties:
    title: Podcast Guest Release Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: release_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: release_time
      label: Release Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: content_permission
      label: Content Permission
      hint: Select all that apply
      type: select_multiple
      options:
      - All Content
      - Audio
      - Video
      - Written Content
      - Social Media Posts
      - Other (Specify below)
      required: false
    - id: 7
      name: content_other
      label: Other (Specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: agreement_signed
      label: Release Form Signed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - other
      required: false
    - id: 12
      name: form_id
      label: Form ID
      hint: null
      type: text
      options: []
      required: false
