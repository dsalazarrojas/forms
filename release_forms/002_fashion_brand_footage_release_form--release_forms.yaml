    - id: 6
      name: usage_exposure
      label: Usage Exposure
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: model_name
      label: Model's Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: model_agreement
      label: Model's Agreement
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
