inputSchema:
  type: object
  properties:
    title: Contactless Entry Program Consent Form
    pages:
    - id: 1
      name: header
      label: -- Contactless Entry Consent --
      hint: Consent form for participation in a contactless entry program
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name of the participant
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Company or building name if applicable
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email address
      hint: Contact email for program updates
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: Optional contact number for notifications
      type: text
      options: []
      required: false
    - id: 6
      name: consent_choice
      label: Consent choice
      hint: Indicate whether you consent to participate
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
    - id: 7
      name: data_collection_scope
      label: Data collection scope
      hint: Describe what data will be collected for access control
      type: text
      options: []
      required: true
    - id: 8
      name: retention_period
      label: Data retention period
      hint: How long data will be retained
      type: text
      options: []
      required: true
    - id: 9
      name: opt_out_instructions
      label: Opt out instructions
      hint: How participants can withdraw from the program
      type: note
      options: []
      required: false
    - id: 10
      name: emergency_contact
      label: Emergency contact name
      hint: Optional emergency contact for program administrators
      type: text
      options: []
      required: false
    - id: 11
      name: additional_comments
      label: Additional comments
      hint: Any other notes about the consent or participation
      type: text
      options: []
      required: false
