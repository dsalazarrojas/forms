inputSchema:
  type: object
  properties:
    title: Senior Citizen Interview Publication Consent Form
    pages:
    - id: 1
      name: interviewee_details
      label: Interviewee Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: consent_to_publish
      label: Do you consent to publish your interview?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: signature
      label: Please sign below
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: interviewer_name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_number
      label: What is your contact number?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: interview_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: interview_time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: additional_comments
      label: Do you have any additional comments or concerns about this interview?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: signature_date
      label: Signature Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: confirm_interview_details
      label: Confirm Interview Details
      hint: null
      type: text
      options: []
      required: false
