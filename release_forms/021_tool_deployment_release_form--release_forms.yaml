inputSchema:
  type: object
  properties:
    title: Tool Deployment Release Form
    pages:
    - id: 1
      name: release_request
      label: Release Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: release_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: release_type
      label: Release Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: environment
      label: Environment
      hint: Select the environment where the release will be deployed.
      type: select_one
      options:
      - Dev
      - QA
      - Prod
      required: true
    - id: 5
      name: risk_notes
      label: Risk Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: release_notes
      label: Release Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: reviewers
      label: Reviewers
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: reviewer_emails
      label: Reviewer Emails
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: release_status
      label: Release Status
      hint: null
      type: select_one
      options:
      - Approved
      - Rejected
      - In Progress
      required: false
    - id: 10
      name: release_manager
      label: Release Manager
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: approval_date
      label: Approval Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: reviewed_by
      label: Reviewed By
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: release_notes_comments
      label: Release Notes Comments
      hint: null
      type: text
      options: []
      required: false
