    - id: 4
      name: authorization_level
      label: authorization_level
      hint: null
      type: select_multiple
      options:
      - High
      - Low
      required: false
    - id: 5
      name: authorized_individuals
      label: authorized_individuals
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: academic_records_release
      label: academic_records_release
      hint: null
      type: note
      options: []
      required: false
