inputSchema:
  type: object
  properties:
    title: Documentary Consent Form
    pages:
    - id: 1
      name: participant_name
      label: participant name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_email
      label: participant email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: participant_phone
      label: participant phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: project_title
      label: project title
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: project_description
      label: project description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: participant_role
      label: participant role
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: image_audio_video_consent
      label: image, audio, or video consent
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: location_data_consent
      label: location data consent
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': True, ''label'': True}'
      - '{''id'': 2, ''name'': False, ''label'': False}'
      required: false
    - id: 9
      name: consent_given
      label: consent given
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': True, ''label'': True}'
      - '{''id'': 2, ''name'': False, ''label'': False}'
      required: false
