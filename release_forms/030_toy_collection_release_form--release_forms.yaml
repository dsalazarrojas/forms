      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: donor_email
      label: Donor Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: collector_phone
      label: Collector Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submitter
      label: Submitter
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: collector_group
      label: Collector Group
      hint: null
