inputSchema:
  type: object
  properties:
    title: Animation Test Footage Release Consent Form
    pages:
    - id: 1
      name: participant_info
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contributor_name
      label: Contributor full name
      hint: Full legal name for release record
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: Email for release confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: role
      label: Role in footage
      hint: e g animator, voice talent, actor
      type: text
      options: []
      required: false
    - id: 5
      name: consent_video
      label: Consent to use video and audio
      hint: Permission to use footage in portfolio and marketing
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: compensation_terms
      label: Compensation terms
      hint: Note any agreed compensation or enter none
      type: text
      options: []
      required: false
    - id: 7
      name: date_of_recording
      label: Date of recording
      hint: Enter date footage was created
      type: date
      options: []
      required: false
    - id: 8
      name: signature_name
      label: Typed name for signature
      hint: Type your full name to indicate agreement
      type: text
      options: []
      required: true
    - id: 9
      name: date_signed
      label: Date signed
      hint: Date you agreed to the release
      type: date
      options: []
      required: true
    - id: 10
      name: notes
      label: Additional notes
      hint: Any restrictions on use
      type: text
      options: []
      required: false
