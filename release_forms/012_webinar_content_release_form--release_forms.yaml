inputSchema:
  type: object
  properties:
    title: Webinar Content Release Form
    pages:
    - id: 1
      name: release_form_title
      label: Release Form Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: release_form_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: release_form_description
      label: Release Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: release_form_contributors
      label: Contributors
      hint: List of contributors (comma separated)
      type: text
      options: []
      required: false
    - id: 5
      name: release_form_permission
      label: Permission
      hint: Check to agree to the release form
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 6
      name: release_form_agreement
      label: Agreement
      hint: Check if you have read and agree to the release form
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: false
    - id: 7
      name: release_form_nda
      label: Non Disclosure Agreement
      hint: Attach your NDA to share
      type: text
      options: []
      required: false
