inputSchema:
  type: object
  properties:
    title: Live Event Broadcast Release Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: broadcast_permission
      label: Do you grant permission for your participant to be broadcasted
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: broadcast_channels
      label: Which channel(s) do you want to grant broadcast permission on
      hint: null
      type: select_multiple
      options:
      - TV
      - Radio
      - Internet
      required: false
    - id: 4
      name: release_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
