inputSchema:
  type: object
  properties:
    title: Appliance Product Release Form
    pages:
    - id: 1
      name: product_info_header
      label: -- Product Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: appliance_name
      label: Appliance Name
      hint: e.g., Smart Fridge X100
      type: text
      options: []
      required: true
    - id: 3
      name: model_number
      label: Model Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: serial_number
      label: Serial Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: production_batch_id
      label: Production Batch ID
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: release_details_header
      label: -- Release and Quality Sign-off --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: quality_check_status
      label: Quality Inspection Status
      hint: Has the appliance passed all quality checks?
      type: select_one
      options:
      - Passed
      - Passed with Minor Issues
      - Failed
      required: true
    - id: 8
      name: safety_certification_verified
      label: Safety Certification Verified
      hint: UL, CE, etc.
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
    - id: 9
      name: firmware_version
      label: Installed Firmware Version
      hint: For smart appliances
      type: text
      options: []
      required: false
    - id: 10
      name: physical_condition_check
      label: Physical Condition Assessment
      hint: Check for dents, scratches, or cosmetic defects
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 11
      name: release_approver_name
      label: Release Approver Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: release_date
      label: Release Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: handoff_header
      label: -- Warehouse Handoff --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: warehouse_location
      label: Warehouse Storage Location
      hint: e.g., Aisle 4, Shelf B
      type: text
      options: []
      required: true
    - id: 15
      name: destination_distributor
      label: Destination Distributor or Retailer
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: shipment_tracking_number
      label: Shipment Tracking Number
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: additional_notes
      label: Additional Release Notes
      hint: null
      type: text
      options: []
      required: false
