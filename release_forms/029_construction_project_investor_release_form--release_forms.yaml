inputSchema:
  type: object
  properties:
    title: Construction Project Investor Release Form
    pages:
    - id: 1
      name: section_investor_ident
      label: -- Investor and Project Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: investor_full_name
      label: Investor Full Name or Legal Entity Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: investor_type_ident
      label: Investor Type
      hint: null
      type: select_one
      options:
      - Individual Investor
      - Private Equity Firm
      - Institutional Investor
      - Joint Venture Partner
      - Lendor/Financial Institution
      - Other
      required: true
    - id: 4
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: project_address
      label: Project Site Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_release_details
      label: -- Release and Settlement Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: investment_amount_original
      label: Original Investment Amount ($)
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: final_settlement_amount
      label: Final Settlement or Release Amount ($)
      hint: Total amount being released to investor
      type: number
      options: []
      required: true
    - id: 9
      name: release_category
      label: Primary Release Reason
      hint: null
      type: select_one
      options:
      - Project Completion and Exit
      - Partial Exit/Divestiture
      - Investor Buyout
      - Re-capitalization/Refinancing
      - Loan Maturity/Payoff
      - Early Termination/Release
      required: true
    - id: 10
      name: section_legal_ack
      label: -- Legal Acknowledgment and Release --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: liability_release_agreement
      label: Release of Liability and Future Claims
      hint: I hereby release the developer/project team from all further claims related
        to this investment
      type: select_one
      options:
      - I Agree and Release
      - I Disagree
      required: true
    - id: 12
      name: confidentiality_obligation_stmt
      label: Acknowledgment of Continuing Confidentiality Obligations
      hint: null
      type: select_one
      options:
      - I Acknowledge and Agree
      - I Disagree
      required: true
    - id: 13
      name: tax_liability_ack
      label: Acknowledgment of Tax Responsibility for Release
      hint: The investor is responsible for all tax filings related to this release
      type: select_one
      options:
      - I Understand and Accept
      - I Disagree
      required: true
    - id: 14
      name: section_payment_logistics
      label: -- Payment and Distribution Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: distribution_method_pref
      label: Preferred Distribution Method
      hint: null
      type: select_one
      options:
      - Wire Transfer (Preferred)
      - Physical Check via Courier
      - Internal Account Transfer
      required: true
    - id: 16
      name: wire_instructions_ready
      label: Wire/Payment Instructions Provided
      hint: null
      type: select_one
      options:
      - Yes - Previously provided
      - Yes - Attached to this release
      - No - Will provide separately
      required: true
    - id: 17
      name: section_final_submission
      label: -- Final Submission and Date --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: investor_rep_title
      label: Title of Person Signing for Investor
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: submission_date
      label: Date of Release Authorization
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments or Instructions
      hint: null
      type: text
      options: []
      required: false
