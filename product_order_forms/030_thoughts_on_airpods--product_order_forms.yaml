      label: What is your first name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: airpods_like
      label: How do you like Airpods?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: last_name
      label: What is your last name?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: favorite_feature
      label: What is your favorite feature of Airpods?
      hint: null
      type: select_one
      options:
      - Wireless
      - BatteryLife
      - Design
      - Color
      required: true
    - id: 7
