      hint: null
      type: select_one
      options:
      - VerySatisfied
      - SomewhatSatisfied
      - NotSatisfied
      required: true
    - id: 11
      name: comments
      label: Do you have any comments about Airpods?
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: favorite_color
      label: What is your favorite Airpods color?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: design_pleasing
      label: Do you like the design of Airpods?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 14
      name: durability
      label: How long do you think Airpods will last?
