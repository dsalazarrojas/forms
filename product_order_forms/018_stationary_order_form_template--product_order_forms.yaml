inputSchema:
  type: object
  properties:
    title: Stationary Order Form Template
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_type
      label: Product Type
      hint: null
      type: select_one
      options:
      - A4
      - Letter
      - Legal
      - Card
      required: false
    - id: 3
      name: product_color
      label: Product Color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Black
      - White
      required: false
    - id: 4
      name: product_quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - Amex
      - Discover
      required: false
    - id: 6
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: order_comment
      label: Order Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: customer_company
      label: Customer Company
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: customer_address
      label: Customer Address
      hint: null
      type: text
      options: []
      required: false
