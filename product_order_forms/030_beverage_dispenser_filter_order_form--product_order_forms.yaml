inputSchema:
  type: object
  properties:
    title: Beverage Dispenser Filter Order Form
    pages:
    - id: 1
      name: customer_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: We will send order confirmation here
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: For order updates if needed
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Business or organization name
      type: text
      options: []
      required: false
    - id: 5
      name: shipping_address
      label: Shipping Address
      hint: Full address for filter delivery
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: City for delivery
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: State for delivery
      type: text
      options: []
      required: true
    - id: 8
      name: postal_code
      label: ZIP Code
      hint: Postal code for delivery
      type: text
      options: []
      required: true
    - id: 9
      name: dispenser_brand
      label: Dispenser Brand
      hint: What brand is your beverage dispenser
      type: select_one
      options:
      - Bunn
      - Grindmaster
      - Cornelius
      - Lancer
      - Perlick
      - Micro Matic
      - Other
      - Not Sure
      required: true
    - id: 10
      name: dispenser_model
      label: Dispenser Model
      hint: Model number if known
      type: text
      options: []
      required: false
    - id: 11
      name: filter_type
      label: Filter Type Needed
      hint: What type of filter do you need
      type: select_one
      options:
      - Carbon Filter
      - Sediment Filter
      - Carbon Block Filter
      - Reverse Osmosis Filter
      - Scale Inhibitor Filter
      - Multi-Stage Filter
      - Not Sure - Need Help
      required: true
    - id: 12
      name: filter_part_number
      label: Filter Part Number
      hint: Part number from old filter if available
      type: text
      options: []
      required: false
    - id: 13
      name: quantity
      label: Quantity
      hint: How many filters do you need
      type: number
      options: []
      required: true
    - id: 14
      name: replacement_frequency
      label: How Often Do You Replace Filters
      hint: Your current replacement schedule
      type: select_one
      options:
      - Monthly
      - Every 2-3 Months
      - Every 6 Months
      - Annually
      - As Needed
      required: false
    - id: 15
      name: shipping_method
      label: Shipping Method
      hint: How would you like your order shipped
      type: select_one
      options:
      - Standard Shipping
      - Express Shipping
      - Overnight Shipping
      - Will Call Pickup
      required: true
    - id: 16
      name: payment_method
      label: Payment Method
      hint: How would you like to pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Purchase Order
      - Invoice Account
      - PayPal
      required: true
    - id: 17
      name: purchase_order_number
      label: Purchase Order Number
      hint: PO number if applicable
      type: text
      options: []
      required: false
    - id: 18
      name: installation_service
      label: Do You Need Installation Service
      hint: Would you like professional installation
      type: select_one
      options:
      - Yes, Please Install
      - No, I Will Install Myself
      - Maybe, Contact Me
      required: true
    - id: 19
      name: special_requests
      label: Special Requests
      hint: Any special requirements for your order
      type: text
      options: []
      required: false
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other information about your order
      type: text
      options: []
      required: false
