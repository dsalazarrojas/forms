inputSchema:
  type: object
  properties:
    title: Trail Camera Battery Recommendation Form
    pages:
    - id: 1
      name: usage_pattern
      label: Usage Pattern
      hint: null
      type: select_one
      options:
      - Hunting
      - Wildlife Observation
      - Security
      - Surveillance
      - Wildlife Study
      - Other
      required: false
    - id: 2
      name: environment
      label: Environment
      hint: null
      type: select_one
      options:
      - Forest
      - Mountain
      - Desert
      - Urban
      - Coastal
      - Rural
      - Other
      required: false
    - id: 3
      name: battery_type
      label: Battery Type
      hint: null
      type: select_multiple
      options:
      - Rechargeable
      - Lithium
      - Alkaline
      - Nickel-Cadmium
      required: false
    - id: 4
      name: battery_size
      label: Battery Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      - Extra Large
      required: false
    - id: 5
      name: budget
      label: Budget
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 6
      name: expected_use
      label: Expected Use
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 7
      name: camera_brand
      label: Camera Brand
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: camera_model
      label: Camera Model
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: recommended_battery
      label: Recommended Battery
      hint: null
      type: text
      options: []
      required: false
