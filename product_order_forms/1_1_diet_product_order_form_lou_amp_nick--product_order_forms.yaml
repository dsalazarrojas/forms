      name: quantity
      label: Quantity
      hint: Enter the number of units
      type: integer
      options: []
      required: true
    - id: 11
      name: unit_price
      label: Unit price (USD)
      hint: Price per unit, numbers only
      type: decimal
      options: []
      required: true
    - id: 12
      name: total_price
      label: Total price (USD)
      hint: Unit price × quantity — enter total or leave for staff to calculate
      type: decimal
      options: []
      required: false
    - id: 13
      name: include_gift_wrap
      label: Include gift wrap
      hint: Small additional fee may apply
      type: select_one
      options:
      - false
      - true
