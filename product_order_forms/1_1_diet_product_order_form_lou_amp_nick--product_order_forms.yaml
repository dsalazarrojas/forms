inputSchema:
  type: object
  properties:
    title: 1:1 Diet Product Order Form Lou & Nick
    pages:
    - id: 1
      name: section_header_customer_info
      label: '--- Customer Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: Receipt and order updates will be sent here
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Optional, include country code (e.g., +1...)
      type: phone
      options: []
      required: false
    - id: 5
      name: preferred_contact_method
      label: Preferred contact method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      required: false
    - id: 6
      name: section_header_order_details
      label: '--- Order Details ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: order_date
      label: Order date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: product_sku
      label: Product SKU or code
      hint: Provide SKU if available
      type: text
      options: []
      required: false
    - id: 9
      name: item_name
      label: Item or product name
      hint: "Exact product name (e.g., 1:1 Diet - 28 Day Pack)"
      type: text
      options: []
