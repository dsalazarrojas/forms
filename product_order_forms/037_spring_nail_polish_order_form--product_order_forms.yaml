      name: customer_info
      label: customer-info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: nail_polish
      label: nail-polish
      hint: null
      type: select_multiple
      options:
      - Red
      - Pink
      - Blue
      - Yellow
      - Green
      - Purple
      - Orange
      - Brown
      required: false
    - id: 3
      name: nail_size
      label: nail-size
