inputSchema:
  type: object
  properties:
    title: Shoes Order Form
    pages:
    - id: 1
      name: shoe_design
      label: Choose a shoe design
      hint: null
      type: select_one
      options:
      - red
      - blue
      - green
      - black
      - white
      required: true
    - id: 2
      name: shoe_size
      label: Choose a shoe size
      hint: null
      type: select_one
      options:
      - '8'
      - '9'
      - '10'
      - '11'
      - '12'
      required: true
    - id: 3
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: color_request
      label: Further requests
      hint: Enter your color request here
      type: text
      options: []
      required: false
    - id: 5
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - PayPal
      required: true
    - id: 10
      name: payment_token
      label: Payment Token
      hint: null
      type: text
      options: []
      required: false
