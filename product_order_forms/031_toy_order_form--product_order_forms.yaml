inputSchema:
  type: object
  properties:
    title: Toy Order Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: order_type
      label: Order Type
      hint: null
      type: select_multiple
      options:
      - Book
      - Soft Toy
      - Board Game
      required: true
    - id: 6
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: product_quantity
      label: Product Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 12
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
