inputSchema:
  type: object
  properties:
    title: Add A New Product
    pages:
    - id: 1
      name: --product_details
      label: -- Product Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: product_name
      label: Product name
      hint: Official product title
      type: text
      options: []
      required: true
    - id: 3
      name: sku
      label: SKU
      hint: Stock keeping unit if available
      type: text
      options: []
      required: false
    - id: 4
      name: category
      label: Category
      hint: Product category or department
      type: text
      options: []
      required: true
    - id: 5
      name: price_usd
      label: Price USD
      hint: Retail price in USD
      type: number
      options: []
      required: true
    - id: 6
      name: cost
      label: Cost
      hint: Unit cost for inventory valuation
      type: number
      options: []
      required: false
    - id: 7
      name: description
      label: Product description
      hint: Short marketing description
      type: text
      options: []
      required: true
    - id: 8
      name: stock_quantity
      label: Stock quantity
      hint: Initial inventory quantity
      type: number
      options: []
      required: true
    - id: 9
      name: weight_kg
      label: Weight kg
      hint: Used for shipping estimates
      type: number
      options: []
      required: false
    - id: 10
      name: dimensions
      label: Dimensions
      hint: Length width height in cm
      type: text
      options: []
      required: false
    - id: 11
      name: supplier_contact
      label: Supplier contact
      hint: Vendor name and contact details
      type: text
      options: []
      required: false
