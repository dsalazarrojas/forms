inputSchema:
  type: object
  properties:
    title: Watch Band Order Form
    pages:
    - id: 1
      name: customer_info
      label: What is your customer name?
      hint: Enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: What is your email address?
      hint: Enter your email
      type: email
      options: []
      required: true
    - id: 3
      name: order_info
      label: Are you placing an order?
      hint: Yes/No
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: order_product
      label: Which product do you want to order?
      hint: Select a product
      type: select_one
      options:
      - Product A
      - Product B
      - Product C
      required: true
    - id: 5
      name: order_size
      label: What is your order size?
      hint: Enter your size
      type: number
      options: []
      required: true
    - id: 6
      name: shipping_address
      label: Please enter your shipping address
      hint: Enter your address
      type: text
      options: []
      required: true
    - id: 7
      name: payment_method
      label: What is your payment method?
      hint: Select a method
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Other
      required: true
    - id: 8
      name: confirm_order
      label: Do you want to confirm your order?
      hint: Yes/No
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
