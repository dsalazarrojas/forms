inputSchema:
  type: object
  properties:
    title: Single Product Order Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: my_products
      label: My Products
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: payment_info
      label: Payment Info
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - PayPal
      required: false
    - id: 4
      name: general_info
      label: General Information
      hint: null
      type: text
      options: []
      required: false
