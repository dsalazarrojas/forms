inputSchema:
  type: object
  properties:
    title: Camping Tent Pre Order Form
    pages:
    - id: 1
      name: section_customer_info
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: customer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: customer_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: customer_company
      label: Company Name (optional)
      hint: Retail or reseller info
      type: text
      options: []
      required: false
    - id: 7
      name: section_delivery_address
      label: -- Delivery Address --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: delivery_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: delivery_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: delivery_state
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: delivery_zip
      label: Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: delivery_country
      label: Country
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: section_tent_selection
      label: -- Tent Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: tent_model
      label: Tent Model
      hint: null
      type: select_one
      options:
      - Ultra-Lite 2 Person
      - Dome 4 Person
      - Bell Tent 6 Person
      - Family 8 Person
      - Base Camp 10 Person
      required: true
    - id: 15
      name: tent_color
      label: Tent Color
      hint: null
      type: select_one
      options:
      - Forest Green
      - Earth Brown
      - Sky Blue
      - Desert Tan
      - Charcoal Gray
      required: true
    - id: 16
      name: tent_quantity
      label: Number of Tents
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: section_options
      label: -- Optional Add-ons --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: groundsheet_needed
      label: Include Ground Sheet
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: footprint_needed
      label: Include Tent Footprint
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: repair_kit_needed
      label: Include Repair Kit
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: carrying_bag_upgrade
      label: Premium Carrying Bag Upgrade
      hint: null
      type: select_one
      options:
      - Standard Bag
      - Premium Bag
      - No Bag
      required: true
    - id: 22
      name: section_delivery
      label: -- Delivery Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: expected_delivery_date
      label: Expected Delivery Date
      hint: Estimated based on pre-order
      type: date
      options: []
      required: true
    - id: 24
      name: shipping_method
      label: Shipping Method
      hint: null
      type: select_one
      options:
      - Standard Shipping
      - Express Shipping
      - Overnight Shipping
      required: true
    - id: 25
      name: notification_preference
      label: Shipping Notification Preference
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      - Email and Phone
      required: true
