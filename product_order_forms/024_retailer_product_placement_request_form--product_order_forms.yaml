inputSchema:
  type: object
  properties:
    title: Retailer Product Placement Request Form
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_description
      label: Product Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: product_image_url
      label: Product Image URL
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: preferred_placement_area
      label: Preferred Placement Area
      hint: null
      type: select_multiple
      options:
      - front face outlets
      - side glass front
      - end caps
      - other
      required: false
    - id: 5
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
