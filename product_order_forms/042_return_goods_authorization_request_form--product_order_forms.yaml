      name: return_goods_authorization_request_form
      label: Return Goods Authorization
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: return_reason
      label: Reason for Return
      hint: null
      type: select_one
      options:
      - Faulty products
      - Incorrect orders
      - Other
      required: false
    - id: 3
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: return_amount
      label: Return Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: return_status
      label: Return Status
      hint: null
      type: select_multiple
      options:
      - Authorized
      - Pending
      - Rejected
      required: false
    - id: 6
      name: reason_other
      label: Other Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
