inputSchema:
  type: object
  properties:
    title: Student Peer Evaluation Form
    pages:
    - id: 1
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: peer_id
      label: Peer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: overall_rating
      label: Overall Rating
      hint: On a scale of 1-5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 5
      name: feedback_on_content
      label: Feedback on Content
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: feedback_on_technical_skills
      label: Feedback on Technical Skills
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: peer_reliability
      label: Peer Reliability
      hint: On a scale of 1-5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
