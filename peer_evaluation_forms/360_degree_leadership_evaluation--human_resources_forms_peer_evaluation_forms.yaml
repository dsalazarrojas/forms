      hint: Suggest specific training or experiences
      type: text
      options: []
      required: false
    - id: 22
      name: leadership_examples
      label: Specific examples of leadership in action
      hint: Provide concrete examples of their leadership behaviors
      type: text
      options: []
      required: false
    - id: 23
      name: overall_performance_rating
      label: Overall leadership performance rating
      hint: Rate from 1 (unsatisfactory) to 10 (outstanding)
      type: integer
      options: []
      required: true
