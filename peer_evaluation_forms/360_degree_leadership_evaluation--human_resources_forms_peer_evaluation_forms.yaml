inputSchema:
  type: object
  properties:
    title: 360 Degree Leadership Evaluation
    pages:
    - id: 1
      name: section_header_info
      label: '--- Employee Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: evaluator_full_name
      label: Full name of evaluator
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 3
      name: evaluator_email
      label: Email address
      hint: Enter your work email
      type: email
      options: []
      required: true
    - id: 4
