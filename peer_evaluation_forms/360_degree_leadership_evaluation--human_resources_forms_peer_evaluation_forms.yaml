      label: Department
      hint: Enter your department
      type: text
      options: []
      required: true
    - id: 5
      name: evaluator_job_title
      label: Job title
      hint: Enter your current job title
      type: text
      options: []
      required: true
    - id: 6
      name: evaluator_relationship
      label: Relationship to evaluated employee
      hint: Select your relationship to the person being evaluated
      type: select_one
      options:
      - Direct Report
      - Peer
      - Supervisor
      - External Stakeholder
      required: true
    - id: 7
      name: evaluation_period
      label: Evaluation period
      hint: Select the time frame being evaluated
      type: select_one
      options:
      - Last Quarter
      - Last Half-Year
      - Last Year
      - Project Duration
