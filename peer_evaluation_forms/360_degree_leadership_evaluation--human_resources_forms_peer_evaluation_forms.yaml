      - Exceeds Expectations
      - Meets Expectations
      - Below Expectations
      - Significantly Below Expectations
      required: true
    - id: 12
      name: strategic_thinking
      label: Strategic thinking and vision
      hint: How well do they align team goals with organizational objectives?
