inputSchema:
  type: object
  properties:
    title: Weekly Body Measurements Tracking Form
    pages:
    - id: 1
      name: week_start
      label: Week Start
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: body_measurements
      label: Body Measurements
      hint: null
      type: select_one
      options:
      - Chest
      - Hips
      - Waist
      - Shoulders
      - Hips Circumference
      - Waist Circumference
      - Neck
      - Hip Circumference
      - Thigh
      - Shoulder Circumference
      - Arm
      - Calf
      - Thigh Circumference
      - Forearm
      - Calf Circumference
      - Forearm Circumference
      required: true
    - id: 3
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: user_comments
      label: User Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: user_comments_2
      label: User Comments 2
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: weight
      label: Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: height
      label: Height
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 10
      name: next_action
      label: Next Action
      hint: null
      type: select_one
      options:
      - Send Report
      - No Action
      required: true
