inputSchema:
  type: object
  properties:
    title: Covid 19 Acknowledgement
    pages:
    - id: 1
      name: acknowledgement_form
      label: acknowledgement_form
      hint: null
      type: select_one
      options:
      - I acknowledge that I have been offered information about the vaccine and its
        potential risks and benefits
      - I understand the risks and benefits of the vaccine
      - I have been provided with the vaccine information sheet and patient consent
        form
      required: false
    - id: 2
      name: consent
      label: consent
      hint: null
      type: select_multiple
      options:
      - I acknowledge that I have consented to receive the vaccine
      - I understand that I am able to ask questions about the vaccine
      - I am able to contact my healthcare provider regarding any concerns
      required: false
    - id: 3
      name: vaccine_administration
      label: vaccine_administration
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: vaccine_side_effects
      label: vaccine_side_effects
      hint: null
      type: select_multiple
      options:
      - I understand that some people may experience side effects after receiving
        the vaccine
      - I am able to report any side effects to my healthcare provider
      - I understand that side effects are a normal part of the vaccine administration
        process
      required: false
