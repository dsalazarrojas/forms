inputSchema:
  type: object
  properties:
    title: Heart Rate Tracking Form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: heart_rate
      label: Heart Rate
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: exercise_type
      label: Exercise Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: exercise_duration
      label: Exercise Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: user_phone
      label: User Phone
      hint: null
      type: text
      options: []
      required: false
