      name: session_frequency
      label: Session Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Other (please specify)
      required: false
    - id: 11
      name: consistency
      label: Consistency
      hint: How consistent are you with this meditation practice?
      type: select_one
      options:
      - Very consistent
      - Moderately consistent
      - Somewhat inconsistent
      - Not at all consistent
      required: true
    - id: 12
      name: progress
      label: Progress
      hint: null
      type: select_one
      options:
      - Made progress
      - Didn't make progress
      - Neutral
      required: true
    - id: 13
      name: obstacles
      label: Obstacles
      hint: null
      type: select_one
      options:
