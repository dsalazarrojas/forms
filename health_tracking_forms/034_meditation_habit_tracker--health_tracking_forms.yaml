inputSchema:
  type: object
  properties:
    title: Meditation Habit Tracker
    pages:
    - id: 1
      name: daily_sessions
      label: Daily Sessions
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: session_duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: mindfulness_focus
      label: Mindfulness Focus
      hint: null
      type: select_one
      options:
      - Focusing on breath
      - Not focusing on breath
      - Mindful movement
      - Other (please specify)
      required: true
    - id: 4
      name: meditation_date
      label: Date
      hint: The date of the meditation session
      type: date
      options: []
      required: false
    - id: 5
      name: meditation_time
      label: Time
      hint: The time of the meditation session
      type: time
      options: []
      required: false
    - id: 6
      name: location
      label: Location
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: meditation_type
      label: Type of Meditation
      hint: null
      type: select_one
      options:
      - Mindfulness meditation
      - Loving-Kindness meditation
      - Movement meditation
      - Guided meditation
      - Other (please specify)
      required: true
    - id: 9
      name: session_goal
      label: Session Goal
      hint: null
      type: select_one
      options:
      - Reduce stress
      - Increase focus
      - Improve mood
      - Other (please specify)
      required: false
