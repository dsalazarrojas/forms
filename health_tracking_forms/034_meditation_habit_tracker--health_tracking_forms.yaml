      - Distractions
      - Other (please specify)
      required: false
    - id: 14
      name: benefits
      label: Benefits
      hint: null
      type: select_multiple
      options:
      - Reduced stress
      - Improved focus
      - Improved mood
      - Improved sleep
      - Other (please specify)
      required: false
