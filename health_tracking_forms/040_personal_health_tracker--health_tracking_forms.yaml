inputSchema:
  type: object
  properties:
    title: personal_health_tracker_form
    pages:
    - id: 1
      name: daily_metrics
      label: Daily Metrics
      hint: null
      type: select_multiple
      options:
      - weight
      - body_temperature
      - heart_rate
      - blood_pressure
      - blood_oxygen_saturation
      - glucose
      - blood_glucose
      required: false
    - id: 2
      name: sleep
      label: Sleep
      hint: null
      type: select_multiple
      options:
      - duration_hours
      - quality
      - medication
      - sleep_disruptions
      required: false
    - id: 3
      name: activity
      label: Activity
      hint: null
      type: select_multiple
      options:
      - exercise
      - mobility
      - medication
      - other_activities
      required: false
    - id: 4
      name: mood
      label: Mood
      hint: null
      type: select_multiple
      options:
      - anxious
      - sad
      - frustrated
      - other_mood
      - none
      required: true
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
