inputSchema:
  type: object
  properties:
    title: Anal Training Progress Tracker
    pages:
    - id: 1
      name: section_training_session
      label: -- Training Session Log --
      hint: Record your session details
      type: note
      options: []
      required: false
    - id: 2
      name: session_date
      label: Date of Session
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: session_duration_minutes
      label: Duration in Minutes
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: section_equipment_intensity
      label: -- Equipment and Intensity --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: equipment_used
      label: Equipment or Tools Used
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: intensity_level
      label: Intensity Level
      hint: Rate from 1 to 5
      type: select_one
      options:
      - 1 - Very Low
      - 2 - Low
      - 3 - Moderate
      - 4 - High
      - 5 - Very High
      required: true
    - id: 8
      name: section_progress_metrics
      label: -- Progress Metrics --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: goal_for_this_session
      label: Primary Goal for This Session
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: goal_achieved
      label: Was the goal achieved?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partially
      required: true
    - id: 11
      name: comfort_level_1_to_10
      label: Comfort Level (1 to 10)
      hint: 10 being most comfortable
      type: number
      options: []
      required: true
    - id: 12
      name: notes_on_technique
      label: Notes on Technique or Observations
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: section_physical_response
      label: -- Physical Response --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: symptoms_experienced
      label: Physical Symptoms Experienced
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Minor Discomfort
      - Fatigue
      - Muscle Soreness
      - Other
      required: false
    - id: 15
      name: additional_observations
      label: Additional Observations for Future Sessions
      hint: null
      type: text
      options: []
      required: false
