inputSchema:
  type: object
  properties:
    title: pre_op_anesthetic_assessment_form
    pages:
    - id: 1
      name: patient_history
      label: Patient History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: allergy_information
      label: Allergy Information
      hint: null
      type: select_one
      options:
      - Anesthesia
      - Analgesia
      - Other
      required: false
    - id: 3
      name: medication_history
      label: Medication History
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: anesthesia_medication_allergies
      label: Anesthesia/medication allergies
      hint: List all anesthesia and medication allergies
      type: note
      options: []
      required: false
    - id: 5
      name: surgical_history
      label: Surgical History
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: medical_conditions
      label: Medical Conditions
      hint: List any medical condition that may affect anesthesia
      type: select_multiple
      options:
      - Diabetes
      - Hypertension
      - Other
      required: false
    - id: 7
      name: anesthesia_history
      label: Anesthesia History
      hint: List any previous anesthetic events
      type: select_multiple
      options:
      - General Anesthesia
      - Regional Anesthesia
      - Local Anesthesia
      - Other
      required: false
    - id: 8
      name: anesthetic_agents
      label: Anesthetic Agents
      hint: null
      type: text
      options: []
      required: false
