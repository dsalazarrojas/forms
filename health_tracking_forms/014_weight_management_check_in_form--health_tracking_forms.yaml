inputSchema:
  type: object
  properties:
    title: Weight Management Check In Form
    pages:
    - id: 1
      name: week_progress
      label: Weekly Progress
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: weight
      label: Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: exercise_frequency
      label: Exercise Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 4
      name: exercise_level
      label: Exercise Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 5
      name: sleep
      label: Sleep
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: water_intake
      label: Water Intake
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: medication
      label: Medications
      hint: null
      type: select_multiple
      options:
      - None
      - 'True'
      required: false
    - id: 8
      name: supplements
      label: Supplements
      hint: null
      type: select_multiple
      options:
      - None
      - 'True'
      required: false
    - id: 9
      name: food_diet
      label: Food/Diet
      hint: null
      type: select_multiple
      options:
      - None
      - 'True'
      required: false
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
