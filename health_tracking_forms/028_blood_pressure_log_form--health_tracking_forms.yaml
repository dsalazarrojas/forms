inputSchema:
  type: object
  properties:
    title: Blood Pressure Log Form
    pages:
    - id: 1
      name: log_intro
      label: -- Daily Blood Pressure Log --
      hint: Track your blood pressure readings
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: patient_id
      label: Patient ID
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: log_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
