      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: afternoon_systolic
      label: Afternoon Systolic (mmHg)
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: afternoon_diastolic
      label: Afternoon Diastolic (mmHg)
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: afternoon_pulse
      label: Afternoon Pulse (bpm)
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: evening_systolic
      label: Evening Systolic (mmHg)
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: evening_diastolic
      label: Evening Diastolic (mmHg)
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: evening_pulse
      label: Evening Pulse (bpm)
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: medication_taken
