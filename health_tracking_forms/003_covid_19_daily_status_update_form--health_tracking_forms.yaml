inputSchema:
  type: object
  properties:
    title: Covid 19 Daily Status Update Form
    pages:
    - id: 1
      name: medical_team
      label: Medical Team
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: patient
      label: Patient
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 4
      name: vaccination_date
      label: Vaccination Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: symptoms
      label: Symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: test_results
      label: Test Results
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_history
      label: Contact History
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: hospitalization
      label: Hospitalization
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
