inputSchema:
  type: object
  properties:
    title: Internship Applicant Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: 'null'
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: resume
      label: Resume
      hint: 'null'
      type: text
      options: []
      required: true
    - id: 6
      name: date_available
      label: Date Available
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: skills
      label: Skills
      hint: null
      type: select_multiple
      options:
      - Programming
      - Coding
      - Data Analysis
      - Communication
      - Teamwork
      required: true
    - id: 8
      name: internship_length
      label: Internship Length
      hint: null
      type: select_one
      options:
      - 1 month
      - 2 months
      - 3 months
      - 4 months
      - 5 months
      - 6 months
      - 7 months
      - 8 months
      required: true
    - id: 9
      name: preferred_workload
      label: Preferred Workload
      hint: null
      type: select_one
      options:
      - Flexible
      - 20 hours/week
      - 25 hours/week
      - 30 hours/week
      - 35 hours/week
      required: true
    - id: 10
      name: work_experience
      label: Work Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: education_background
      label: Education Background
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: language_proficiency
      label: Language Proficiency
      hint: null
      type: select_multiple
      options:
      - English
      - French
      - Spanish
      - German
      - Chinese
      required: true
    - id: 13
      name: career_goals
      label: Career Goals
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: personal_interests
      label: Personal Interests
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: references
      label: References
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
