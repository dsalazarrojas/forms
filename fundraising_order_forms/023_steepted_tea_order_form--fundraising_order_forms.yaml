inputSchema:
  type: object
  properties:
    title: Steepted Tea Order Form
    pages:
    - id: 1
      name: customer_preferences
      label: What type of tea do you prefer?
      hint: null
      type: select_one
      options:
      - Black
      - Green
      - Herbal
      - White
      required: false
    - id: 2
      name: date_of_birth
      label: What is your date of birth?
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: food_allergies
      label: Do you have any food allergies?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 4
      name: tea_drinking_frequency
      label: How often do you drink tea?
      hint: null
      type: select_one
      options:
      - Rarely
      - Occasionally
      - Frequently
      required: false
    - id: 5
      name: email_address
      label: What is your contact email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: special_requests
      label: Do you have any special requests?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: tea_bags_needed
      label: How many tea bags do you need?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: payment_method
      label: What is your preferred method of payment?
      hint: null
      type: select_one
      options:
      - Credit Card
      - Cash
      - PayPal
      required: false
    - id: 9
      name: newsletter_subscription
      label: Do you want to join our newsletter?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 10
      name: order_date
      label: What is your order date?
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: phone_number
      label: What is your contact phone number?
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: loyalty_membership
      label: Are you a member of our loyalty program?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
