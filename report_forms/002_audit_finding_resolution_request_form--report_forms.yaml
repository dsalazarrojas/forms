inputSchema:
  type: object
  properties:
    title: Audit Finding Resolution Request Form
    pages:
      - id: 1
        name: header_section
        label: -- Finding Resolution Request --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: finding_id
        label: finding id
        hint: Internal audit finding identifier
        type: text
        options: []
        required: true
      - id: 3
        name: reported_by
        label: reported by
        hint: Name of the auditor or reporter
        type: text
        options: []
        required: true
      - id: 4
        name: department_responsible
        label: department responsible
        hint: Department assigned to resolve the finding
        type: select_one
        options:
          - Finance
          - Operations
          - IT
          - Legal
          - HR
        required: true
      - id: 5
        name: description_of_finding
        label: description of finding
        hint: Summary of the audit finding and evidence
        type: text
        options: []
        required: true
      - id: 6
        name: corrective_action
        label: corrective action
        hint: Recommended corrective action to resolve the finding
        type: text
        options: []
        required: true
      - id: 7
        name: proposed_resolution_date
        label: proposed resolution date
        hint: Target date to complete corrective action
        type: date
        options: []
        required: true
      - id: 8
        name: status
        label: resolution status
        hint: Current status of the resolution request
        type: select_one
        options:
          - Open
          - In progress
          - Closed
          - Deferred
        required: true
