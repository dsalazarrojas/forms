inputSchema:
  type: object
  properties:
    title: Fire Safety Daily Work Report
    pages:
    - id: 1
      name: general_info
      label: Fire Safety Daily Work Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: facility_id
      label: Facility ID
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: fire_hazards
      label: Fire Hazards
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: fire_hazards_description
      label: Fire Hazards Description
      hint: Provide a detailed description of the fire hazards
      type: text
      options: []
      required: true
    - id: 5
      name: fire_precautions
      label: Fire Precautions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: date_and_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: inspector_signature
      label: Inspector Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: supervisor_signature
      label: Supervisor Signature
      hint: null
      type: note
      options: []
      required: false
