inputSchema:
  type: object
  properties:
    title: Digital Audit Trail Report Form
    pages:
    - id: 1
      name: activity_details
      label: Activity Details
      hint: Briefly describe the activity that occurred.
      type: text
      options: []
      required: true
    - id: 2
      name: report_details
      label: Report Details
      hint: Select all relevant report details.
      type: select_multiple
      options:
      - Report Type 1
      - Report Type 2
      - Report Type 3
      required: false
    - id: 3
      name: user_details
      label: User Details
      hint: Enter user information.
      type: text
      options: []
      required: true
    - id: 4
      name: additional_info
      label: Additional Information
      hint: Enter any additional relevant information.
      type: note
      options: []
      required: false
    - id: 5
      name: date_and_time
      label: Date and Time
      hint: Enter the date and time of the activity.
      type: date
      options: []
      required: true
    - id: 6
      name: user_id
      label: User ID
      hint: Enter user ID.
      type: number
      options: []
      required: true
    - id: 7
      name: ip_address
      label: IP Address
      hint: Enter IP address.
      type: text
      options: []
      required: true
    - id: 8
      name: device_type
      label: Device Type
      hint: Select device type.
      type: select_one
      options:
      - Desktop
      - Mobile
      - Tablet
      - Console
      required: false
    - id: 9
      name: device_os
      label: Device OS
      hint: Select device OS.
      type: select_one
      options:
      - Windows
      - MacOS
      - Linux
      - Android
      required: false
    - id: 10
      name: browser_type
      label: Browser Type
      hint: Select browser type.
      type: select_one
      options:
      - Chrome
      - Firefox
      - Safari
      - IE
      required: false
    - id: 11
      name: location
      label: Location
      hint: Enter location.
      type: text
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: Add any notes about the activity.
      type: text
      options: []
      required: false
    - id: 13
      name: date_and_time_activity
      label: Date and Time Activity
      hint: Select date and time of activity.
      type: select_one
      options:
      - Yesterday
      - Today
      - Tomorrow
      - This week
      required: false
    - id: 14
      name: activity_type
      label: Activity Type
      hint: Select activity type.
      type: select_one
      options:
      - Activity 1
      - Activity 2
      - Activity 3
      required: false
    - id: 15
      name: status
      label: Status
      hint: Select status.
      type: select_one
      options:
      - Complete
      - Incomplete
      - In Progress
      required: false
    - id: 16
      name: comments
      label: Comments
      hint: Enter comments.
      type: text
      options: []
      required: false
    - id: 17
      name: date
      label: Date
      hint: Enter date.
      type: date
      options: []
      required: true
    - id: 18
      name: time
      label: Time
      hint: Enter time.
      type: time
      options: []
      required: true
