inputSchema:
  type: object
  properties:
    title: Customer Complaint Form Template
    pages:
    - id: 1
      name: report_form
      label: Report Form
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: complaint_description
      label: Description Of Complaint
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: customer_contact_info
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: date_of_complaint
      label: Date Of Complaint
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: time_of_complaint
      label: Time Of Complaint
      hint: null
      type: time
      options: []
      required: true
