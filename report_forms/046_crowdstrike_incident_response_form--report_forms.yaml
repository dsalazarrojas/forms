inputSchema:
  type: object
  properties:
    title: CrowdStrike Incident Response Form
    pages:
    - id: 1
      name: incident_details
      label: Incident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_type
      label: incident_type
      hint: null
      type: select_one
      options:
      - Phishing Attack
      - Malware Attack
      - Denial of Service
      - Ransomware
      required: true
    - id: 3
      name: incident_location
      label: Incident Location
      hint: null
      type: select_one
      options:
      - Remote
      - Local
      required: true
    - id: 4
      name: incident_date
      label: Incident Date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 5
      name: incident_time
      label: Incident Time
      hint: HH:MM:SS
      type: time
      options: []
      required: false
    - id: 6
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: incident_severity
      label: Incident Severity
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 8
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Resolved
      - In Progress
      - Pending
      required: true
    - id: 9
      name: incident_response
      label: Incident Response
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: incident_comments
      label: Incident Comments
      hint: null
      type: text
      options: []
      required: false
