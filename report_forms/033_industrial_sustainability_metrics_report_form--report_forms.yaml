inputSchema:
  type: object
  properties:
    title: Industrial Sustainability Metrics Report Form
    pages:
    - id: 1
      name: esg_kpis
      label: ESG KPIs
      hint: Please select all applicable ESG KPIs
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 2
      name: sustainability_report_date
      label: Date
      hint: Please select the date of the sustainability report
      type: date
      options: []
      required: true
    - id: 3
      name: sustainability_report_time
      label: Time
      hint: Please select the time of the sustainability report
      type: time
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: Please enter your email address
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: Please enter your phone number
      type: text
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: Please add any additional notes
      type: note
      options: []
      required: false
    - id: 7
      name: category
      label: Category
      hint: Please select the category of the sustainability report
      type: select_one
      options:
      - Energy
      - Water
      - Waste
      - Land use
      - Carbon footprint
      required: false
    - id: 8
      name: metric_achievement
      label: Metric Achievement
      hint: Please select the level of metric achievement
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: target_date
      label: Target Date
      hint: Please select the target date for metric achievement
      type: date
      options: []
      required: false
    - id: 10
      name: current_date
      label: Current Date
      hint: Please select the current date of the report
      type: date
      options: []
      required: false
    - id: 11
      name: metric_type
      label: Metric Type
      hint: Please select the type of metric
      type: select_multiple
      options:
      - Quantity
      - Rate
      required: false
    - id: 12
      name: metric_level
      label: Metric Level
      hint: Please select the level of metric achievement
      type: select_multiple
      options:
      - High
      - Low
      required: false
