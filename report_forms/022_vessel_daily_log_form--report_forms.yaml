inputSchema:
  type: object
  properties:
    title: Vessel Daily Log Form
    pages:
    - id: 1
      name: vessel_id
      label: Vessel ID
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: vessel_name
      label: Vessel Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: departure_time
      label: Departure Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: crew
      label: Crew
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: remarks
      label: Remarks
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: latitude
      label: Latitude
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: longitude
      label: Longitude
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
