inputSchema:
  type: object
  properties:
    title: Customer Incident Form
    pages:
    - id: 1
      name: customer_incident_details
      label: customer incident details
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 2
      name: customer_details
      label: Customer details
      hint: null
      type: select_one
      options:
      - Customer name
      - Contact person
      - Phone number
      - Email
      required: true
    - id: 3
      name: vehicle_details
      label: vehicle details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: incident_description
      label: incident description
      hint: Please enter details about the incident
      type: text
      options: []
      required: true
    - id: 5
      name: attachment
      label: attachment
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: customer_signature
      label: customer signature
      hint: null
      type: select_one
      options:
      - Signed
      - Unsigned
      required: true
    - id: 7
      name: employee_signature
      label: Employee signature
      hint: null
      type: select_one
      options:
      - Signed
      - Unsigned
      required: false
    - id: 8
      name: employee_name
      label: Employee name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: employee_email
      label: Employee email
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: employee_phone
      label: Employee phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: attachment_description
      label: attachment description
      hint: Please enter a short description of the attachment
      type: text
      options: []
      required: false
    - id: 12
      name: attachment_data
      label: attachment data
      hint: null
      type: note
      options: []
      required: false
