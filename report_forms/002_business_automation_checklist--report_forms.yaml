inputSchema:
  type: object
  properties:
    title: Business Automation Checklist
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 2
      name: department
      label: Department or Division
      hint: Which department are you representing?
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_name
      label: Your Name
      hint: Full name of person completing form
      type: text
      options: []
      required: true
    - id: 4
      name: respondent_email
      label: Your Email
      hint: Business email address
      type: email
      options: []
      required: true
    - id: 5
      name: automation_readiness
      label: Current Automation Readiness Level
      hint: How prepared is your business?
      type: select_one
      options:
      - Just Getting Started
      - Exploring Options
      - In Planning Phase
      - Currently Implementing
      - Partially Automated
      - Highly Automated
      required: true
    - id: 6
      name: current_automated_processes
      label: Which processes are currently automated?
      hint: Select all that apply
      type: select_multiple
      options:
      - Finance and Accounting
      - Human Resources
      - Sales Management
      - Customer Service
      - Inventory Management
      - Marketing
      - Data Entry
      - Reporting
      required: false
    - id: 7
      name: automation_priority_areas
      label: Priority Areas for Automation
      hint: Where do you want to automate first?
      type: select_multiple
      options:
      - Reduce Manual Work
      - Improve Efficiency
      - Reduce Costs
      - Improve Quality
      - Enhance Customer Experience
      required: true
    - id: 8
      name: biggest_challenges
      label: Biggest Automation Challenges
      hint: What obstacles do you face?
      type: select_multiple
      options:
      - Limited Budget
      - Lack of Technical Knowledge
      - Change Resistance
      - Legacy Systems
      - Data Integration Issues
      - Time Constraints
      required: false
    - id: 9
      name: budget_allocated
      label: Estimated Budget for Automation
      hint: Annual budget in currency
      type: number
      options: []
      required: false
    - id: 10
      name: timeline
      label: Expected Implementation Timeline
      hint: When do you want automation in place?
      type: select_one
      options:
      - Immediate (0-3 months)
      - Short-term (3-6 months)
      - Medium-term (6-12 months)
      - Long-term (12+ months)
      required: true
    - id: 11
      name: existing_tools
      label: Currently Used Business Tools
      hint: What software do you use?
      type: text
      options: []
      required: false
    - id: 12
      name: roi_expectations
      label: Expected ROI Timeframe
      hint: How long for payback?
      type: select_one
      options:
      - Less than 6 months
      - 6-12 months
      - 1-2 years
      - 2+ years
      - Unsure
      required: false
    - id: 13
      name: staff_training
      label: Staff Training Willingness
      hint: How receptive is your team?
      type: select_one
      options:
      - Very Willing
      - Willing
      - Neutral
      - Reluctant
      - Very Reluctant
      required: true
    - id: 14
      name: additional_comments
      label: Additional Comments or Specific Needs
      hint: Share any other relevant information
      type: text
      options: []
      required: false
