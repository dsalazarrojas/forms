inputSchema:
  type: object
  properties:
    title: Nursing Home Incident Report Form
    pages:
    - id: 1
      name: resident_name
      label: resident-name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: resident_dob
      label: resident-dob
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: resident_phone
      label: resident-phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: incident_date
      label: incident-date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: incident_time
      label: incident-time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: incident_description
      label: incident-description
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: cause_of_incident
      label: cause-of-incident
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: action_taken
      label: action-taken
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: incident_outcome
      label: Incident Outcome
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submitted_by
      label: submitted-by
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
