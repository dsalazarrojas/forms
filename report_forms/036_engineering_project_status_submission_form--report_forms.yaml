inputSchema:
  type: object
  properties:
    title: Engineering Project Status Submission Form
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_status
      label: Project Status
      hint: null
      type: select_one
      options:
      - Active
      - Completed
      - Cancelled
      required: false
    - id: 3
      name: risk_description
      label: Risk Description
      hint: Provide any known risks or issues affecting the project
      type: text
      options: []
      required: false
    - id: 4
      name: risk_level
      label: Risk Level
      hint: High, Medium, or Low
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: next_status_update
      label: Next Status Update
      hint: Date of next status update (if applicable)
      type: date
      options: []
      required: false
    - id: 6
      name: status_update
      label: Status Update
      hint: Briefly describe the project status
      type: text
      options: []
      required: false
    - id: 7
      name: team_lead
      label: Team Lead
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: team_members
      label: Team Members
      hint: List team members working on the project
      type: text
      options: []
      required: false
