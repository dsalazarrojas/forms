inputSchema:
  type: object
  properties:
    title: Service Record Form
    pages:
    - id: 1
      name: service_record_form
      label: Service Record
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: vehicle_id
      label: Vehicle ID
      hint: Enter a unique vehicle identifier.
      type: number
      options: []
      required: false
    - id: 3
      name: vin
      label: VIN
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: vehicle_usage_dates
      label: Vehicle Usage Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: service_history_dates
      label: Service History Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: maintenance_dates
      label: Maintenance Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: mileage
      label: Mileage
      hint: Enter mileage in miles.
      type: number
      options: []
      required: false
    - id: 8
      name: service_frequency
      label: Service Frequency
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: service_frequency_frequency
      label: Frequency
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Semi-annual
      - Yearly
      required: false
    - id: 10
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Oil Service
      - Tire Service
      - Maintenance Service
      - Inspection Service
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: Enter service notes, e.g. oil change, tire replacement, etc.
      type: note
      options: []
      required: false
