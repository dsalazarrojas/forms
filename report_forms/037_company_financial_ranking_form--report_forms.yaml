      name: company_name
      label: Company Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: company_id
      label: Company ID/Registration Number
      hint: Official registration
      type: text
      options: []
      required: true
    - id: 3
      name: industry_sector
      label: Industry Sector
      hint: Primary industry
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Manufacturing
      - Retail
      - Energy
      - Telecommunications
      - Consumer Goods
      - Industrial
      - Real Estate
      - Other
      required: true
    - id: 4
      name: sub_industry
      label: Sub-Industry/Specialization
      hint: More specific category
      type: text
      options: []
