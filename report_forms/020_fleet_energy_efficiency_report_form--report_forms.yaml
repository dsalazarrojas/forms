inputSchema:
  type: object
  properties:
    title: Fleet Energy Efficiency Report Form
    pages:
    - id: 1
      name: general_info
      label: general info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: vehicle_type
      label: vehicle type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: vehicle_id
      label: vehicle id
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: start_date
      label: start date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: start_time
      label: start time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: end_date
      label: end date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: distance_traveled
      label: distance traveled
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: fuel_used
      label: fuel used
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: efficiency_rating
      label: efficiency rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: false
    - id: 10
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: vehicle_type
      label: vehicle type
      hint: null
      type: select_multiple
      options:
      - Car
      - Truck
      required: false
    - id: 12
      name: fuel_type
      label: fuel type
      hint: null
      type: select_one
      options:
      - Gasoline
      - Diesel
      - Electric
      required: false
