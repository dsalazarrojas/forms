inputSchema:
  type: object
  properties:
    title: Bug Tracker
    pages:
    - id: 1
      name: submitter_name
      label: Submitter Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: submission_date
      label: Submission Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 4
      name: product
      label: Product
      hint: Product name
      type: text
      options: []
      required: true
    - id: 5
      name: version
      label: Version
      hint: Software version
      type: text
      options: []
      required: true
    - id: 6
      name: issue_type
      label: Issue Type
      hint: Type of issue
      type: select_one
      options:
      - Bug
      - Feature Request
      - Enhancement
      - Documentation Issue
      - Performance Issue
      - Security Vulnerability
      required: true
    - id: 7
      name: severity
      label: Severity
      hint: Impact severity
      type: select_one
      options:
      - Critical
      - High
      - Medium
      - Low
      - Trivial
      required: true
    - id: 8
      name: priority
      label: Priority
      hint: Fix priority
      type: select_one
      options:
      - Immediate
      - High
      - Normal
      - Low
      - Deferred
      required: true
    - id: 9
      name: browser_info
      label: Browser Information
      hint: Browser details
      type: text
      options: []
      required: false
    - id: 10
      name: os_info
      label: Operating System
      hint: OS details
      type: text
      options: []
      required: false
    - id: 11
      name: user_agent
      label: User Agent String
      hint: Auto-detected or paste here
      type: text
      options: []
      required: false
    - id: 12
      name: title
      label: Issue Title
      hint: Short summary
      type: text
      options: []
      required: true
    - id: 13
      name: description
      label: Issue Description
      hint: Detailed description
      type: text
      options: []
      required: true
    - id: 14
      name: steps
      label: Steps to Reproduce
      hint: Numbered steps
      type: text
      options: []
      required: true
    - id: 15
      name: expected
      label: Expected Behavior
      hint: What you expected
      type: text
      options: []
      required: true
    - id: 16
      name: actual
      label: Actual Behavior
      hint: What occurred
      type: text
      options: []
      required: true
    - id: 17
      name: reproducibility
      label: Reproducibility
      hint: How often it occurs
      type: select_one
      options:
      - Always
      - Most of the Time
      - Sometimes
      - Rarely
      - Unable to Reproduce
      required: true
    - id: 18
      name: additional_info
      label: Additional Information
      hint: Any other details
      type: text
      options: []
      required: false
    - id: 19
      name: has_screenshots
      label: Screenshots Available
      hint: Do you have screenshots
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
