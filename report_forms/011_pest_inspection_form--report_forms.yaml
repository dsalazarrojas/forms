inputSchema:
  type: object
  properties:
    title: Pest Inspection Form
    pages:
    - id: 1
      name: treatment_date
      label: Treatment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: customer_name
      label: customer_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: customer_email
      label: customer_email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: customer_phone
      label: customer_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: inspection_location
      label: inspection_location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: pest_type
      label: pest_type
      hint: null
      type: select_one
      options:
      - Ants
      - Bees
      - Rats
      - Roaches
      - Termites
      required: true
    - id: 7
      name: pest_description
      label: pest_description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: treatment
      label: Treatment
      hint: null
      type: select_multiple
      options:
      - Baiting
      - Sealing
      - Trapping
      required: true
    - id: 9
      name: next_steps
      label: next_steps
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: followup_date
      label: followup_date
      hint: null
      type: date
      options: []
      required: false
