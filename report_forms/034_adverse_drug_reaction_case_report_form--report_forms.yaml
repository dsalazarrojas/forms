      type: text
      options: []
      required: true
    - id: 17
      name: reaction_severity
      label: Reaction Severity
      hint: How severe was the reaction
      type: select_one
      options: ["Mild", "Moderate", "Severe", "Life-threatening", "Fatal"]
      required: true
    - id: 18
      name: onset_date
      label: Onset Date
      hint: Date when the reaction started
      type: date
      options: []
      required: true
    - id: 19
      name: outcome
      label: Outcome
      hint: What was the outcome of the reaction
      type: select_one
      options: ["Recovered", "Recovering", "Not recovered", "Sequelae", "Fatal", "Unknown"]
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any additional information about the case
      type: text
      options: []
      required: false
