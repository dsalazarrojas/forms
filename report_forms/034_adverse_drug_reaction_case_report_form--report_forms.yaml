inputSchema:
  type: object
  properties:
    title: Adverse Drug Reaction Case Report Form
    pages:
    - id: 1
      name: patient_information_section
      label: -- Patient Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_full_name
      label: Patient Full Name
      hint: Legal full name of the patient
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Patient's date of birth
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: Patient's gender
      type: select_one
      options: ["Male", "Female", "Other", "Prefer not to say"]
      required: true
    - id: 5
      name: patient_id
      label: Patient ID
      hint: Unique patient identification number
      type: text
      options: []
      required: true
    - id: 6
      name: reporting_healthcare_professional_section
      label: -- Reporting Healthcare Professional --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: reporter_name
      label: Reporter Name
      hint: Name of the healthcare professional reporting
      type: text
      options: []
      required: true
    - id: 8
      name: reporter_title
      label: Reporter Title
      hint: Professional title of the reporter
      type: text
      options: []
      required: true
    - id: 9
      name: reporter_contact
      label: Reporter Contact
      hint: Contact information for the reporter
      type: text
      options: []
      required: true
    - id: 10
      name: drug_information_section
      label: -- Drug Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: drug_name
      label: Drug Name
      hint: Name of the drug that caused the reaction
      type: text
      options: []
      required: true
    - id: 12
      name: drug_dosage
      label: Drug Dosage
      hint: Dosage of the drug taken
      type: text
      options: []
      required: true
    - id: 13
      name: route_of_administration
      label: Route of Administration
      hint: How was the drug administered
      type: select_one
      options: ["Oral", "Intravenous", "Intramuscular", "Subcutaneous", "Topical", "Inhalation", "Other"]
      required: true
    - id: 14
      name: duration_of_treatment
      label: Duration of Treatment
      hint: How long was the patient on this drug before reaction
      type: text
      options: []
      required: true
