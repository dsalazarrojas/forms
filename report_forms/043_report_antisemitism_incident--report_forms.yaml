inputSchema:
  type: object
  properties:
    title: Report Antisemitism Incident
    pages:
    - id: 1
      name: incident_report
      label: Incident Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reporter_info
      label: Reporter Information
      hint: null
      type: select_one
      options:
      - Mr
      - Ms
      - other
      required: false
    - id: 3
      name: incident_details
      label: Incident Details
      hint: null
      type: select_multiple
      options:
      - Bullying
      - Harassment
      - Intimidation
      - Other
      required: false
    - id: 4
      name: incident_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: follow_up
      label: Follow-up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: follow_up_info
      label: Follow-up Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: incident_reported_to
      label: Report
      hint: null
      type: select_one
      options:
      - School
      - Workplace
      - Organization
      - Other
      required: false
    - id: 8
      name: incident_description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: incident_status
      label: Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Completed
      required: false
