inputSchema:
  type: object
  properties:
    title: Comprehensive Assessment Report
    pages:
      - id: 1
        name: section_assessment_header
        label: -- Assessment Header --
        hint: Capture assessment metadata and summary
        type: note
        options: []
        required: false
      - id: 2
        name: assessor_name
        label: Assessor name
        hint: Name of evaluator
        type: text
        options: []
        required: true
      - id: 3
        name: assessment_date
        label: Assessment date
        hint: Date of assessment
        type: date
        options: []
        required: true
      - id: 4
        name: subject_of_assessment
        label: Subject of assessment
        hint: Program, individual, or project being assessed
        type: text
        options: []
        required: true
      - id: 5
        name: summary_findings
        label: Summary findings
        hint: High level summary of results
        type: text
        options: []
        required: true
      - id: 6
        name: strengths
        label: Strengths
        hint: Key strengths identified
        type: text
        options: []
        required: false
      - id: 7
        name: areas_for_improvement
        label: Areas for improvement
        hint: Opportunities and recommendations
        type: text
        options: []
        required: true
      - id: 8
        name: action_plan
        label: Action plan
        hint: Steps, owners, and timelines for improvement
        type: text
        options: []
        required: true
      - id: 9
        name: final_rating
        label: Final rating
        hint: Overall assessment rating
        type: select_one
        options: [Excellent, Good, Fair, Poor]
        required: true
