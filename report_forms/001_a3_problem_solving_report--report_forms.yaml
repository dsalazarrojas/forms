inputSchema:
  type: object
  properties:
    title: A3 Problem Solving Report
    pages:
    - id: 1
      name: report_header
      label: -- Problem Solving Report --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: reporter_name
      label: Reporter name
      hint: Full name of the person completing this report
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department or team
      hint: Department responsible for the issue
      type: text
      options: []
      required: true
    - id: 4
      name: problem_statement
      label: Problem statement
      hint: Concise description of the problem or deviation from standard
      type: text
      options: []
      required: true
    - id: 5
      name: background
      label: Background summary
      hint: Context that led to the issue and relevant history
      type: note
      options: []
      required: false
    - id: 6
      name: current_condition
      label: Current condition description
      hint: Describe how the problem is observed today
      type: text
      options: []
      required: true
    - id: 7
      name: root_cause_analysis
      label: Root cause analysis
      hint: Primary factors identified as root causes
      type: select_multiple
      options:
      - Process gap
      - Equipment failure
      - Human error
      - Supplier issue
      - Data or measurement error
      required: true
    - id: 8
      name: countermeasures
      label: Proposed countermeasures
      hint: Describe corrective actions to address root causes
      type: text
      options: []
      required: true
    - id: 9
      name: action_owner
      label: Action owner
      hint: Person responsible for implementing countermeasures
      type: text
      options: []
      required: true
    - id: 10
      name: target_completion_date
      label: Target completion date
      hint: Expected date for implementation of actions
      type: date
      options: []
      required: false
    - id: 11
      name: status
      label: Current status
      hint: Select current progress status
      type: select_one
      options:
      - Proposed
      - In progress
      - Completed
      - Deferred
      required: true
    - id: 12
      name: follow_up_notes
      label: Follow up notes
      hint: Notes on verification, sustainment, or additional steps
      type: text
      options: []
      required: false
