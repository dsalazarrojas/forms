inputSchema:
  type: object
  properties:
    title: Quality Dashboard Summary Report Form
    pages:
    - id: 1
      name: team_performance
      label: Team Performance
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 2
      name: team_participation
      label: Team Participation
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: issues_reported
      label: Number of Issues Reported
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: issues_resolved
      label: Number of Issues Resolved
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: total_score
      label: Total Score
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: report_date
      label: Report Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: report_time
      label: Report Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: team_email
      label: Team Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: team_phone
      label: Team Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: team_note
      label: Additional Note for Team
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: quality_kpis
      label: Quality KPIs
      hint: null
      type: select_multiple
      options:
      - Good
      - Poor
      required: false
