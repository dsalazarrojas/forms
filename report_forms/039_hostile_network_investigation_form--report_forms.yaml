      name: incident_reporter_notes
      label: Incident Reporter Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: security_team
      label: Security Team
      hint: null
      type: select_multiple
      options:
      - John
      - Mary
      - Dave
      required: false
    - id: 12
      name: investigation_status
      label: Investigation Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      required: false
    - id: 13
      name: resolution
      label: Resolution
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: resolution_date
      label: Resolution Date
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: resolution_time
      label: Resolution Time
      hint: null
      type: time
      options: []
      required: false
