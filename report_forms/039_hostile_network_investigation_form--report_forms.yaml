      options:
      - Open
      - Closed
      required: false
    - id: 17
      name: investigation_notes
      label: Investigation Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: report_form_attachment
      label: Attach File
      hint: null
      type: text
      options: []
      required: false
