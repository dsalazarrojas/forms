      name: roof_rating
      label: Roof condition rating
      hint: null
      type: select_one
      options:
      - Excellent - New or recently maintained
      - Good - Well-maintained
      - Fair - Some wear and tear
      - Poor - Visible deterioration
      - Critical - Safety concern
      required: true
    - id: 13
      name: foundation_observations
      label: Foundation and structure observations
      hint: null
      type: text
      options: []
      required: false
