      name: floor_conditions
      label: Floor conditions observations
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: floor_rating
      label: Floor condition rating
      hint: null
      type: select_one
      options:
      - Excellent - Well-maintained
      - Good - Minor wear
      - Fair - Moderate wear
      - Poor - Significant damage
      - Critical - Safety hazard
      required: true
