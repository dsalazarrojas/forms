      name: plumbing_rating
      label: Plumbing system condition
      hint: null
      type: select_one
      options:
      - Excellent - No issues
      - Good - Functioning well
      - Fair - Minor issues
      - Poor - Multiple problems
      - Critical - Major issues
      required: true
    - id: 29
      name: hvac_observations
      label: HVAC system observations
      hint: null
      type: text
      options: []
      required: false
    - id: 30
      name: hvac_rating
      label: HVAC condition and effectiveness
      hint: null
      type: select_one
      options:
      - Excellent - Well-maintained
      - Good - Functional
      - Fair - Some efficiency loss
      - Poor - Significant issues
      - Critical - Not functional
      required: true
    - id: 31
      name: safety_observations
