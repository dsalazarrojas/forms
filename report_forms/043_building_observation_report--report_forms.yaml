      name: fire_safety_observations
      label: Fire safety equipment observations
      hint: null
      type: text
      options: []
      required: false
    - id: 33
      name: fire_safety_rating
      label: Fire safety compliance
      hint: null
      type: select_one
      options:
      - Compliant - All measures present
      - Mostly compliant
      - Partially compliant
      - Non-compliant
      - Unknown
      required: true
    - id: 34
      name: hazards_observed
      label: Hazards or safety concerns observed
      hint: null
      type: text
      options: []
      required: true
