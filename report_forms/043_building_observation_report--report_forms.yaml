inputSchema:
  type: object
  properties:
    title: Building Observation Report
    pages:
    - id: 1
      name: report_header
      label: -- Building Observation Report --
      hint: Document building conditions and observations
      type: note
      options: []
      required: false
    - id: 2
      name: report_date
      label: Report date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: observer_name
      label: Observer name
      hint: Inspector or facility manager
      type: text
      options: []
      required: true
    - id: 4
      name: observer_credentials
      label: Credentials or certification
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: building_info
      label: -- Building Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: building_name
      label: Building name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: building_address
      label: Building address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: building_age
      label: Building age
      hint: Years since construction
      type: number
      options: []
      required: false
    - id: 9
      name: observation_type
      label: Type of observation or inspection
      hint: null
      type: select_one
      options:
      - Routine inspection
      - Safety inspection
      - Damage assessment
      - Pre-lease inspection
      - Insurance inspection
      - Annual review
      - Specialty inspection
      - Other
      required: true
