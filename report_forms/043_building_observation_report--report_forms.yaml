      - Critical - Urgent repairs
      - Emergency - Immediate action
      required: true
    - id: 39
      name: estimated_costs
      label: Estimated cost for recommended repairs
      hint: null
      type: number
      options: []
      required: false
    - id: 40
      name: overall_assessment
      label: -- Overall Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 41
      name: overall_condition
      label: Overall building condition
      hint: null
      type: select_one
      options:
      - Excellent - Well-maintained
      - Good - Minor issues only
      - Fair - Some repairs needed
      - Poor - Significant issues
      - Critical - Major repairs needed
      required: true
    - id: 42
      name: occupancy_safe
      label: Safe for occupancy
      hint: null
      type: select_one
      options:
      - Yes - Fully safe
      - Yes - With minor improvements
      - Conditional - Repairs needed
      - No - Safety concerns
      - No - Unsafe
      required: true
    - id: 43
      name: recommendations
      label: Recommendations and next steps
      hint: null
      type: text
      options: []
