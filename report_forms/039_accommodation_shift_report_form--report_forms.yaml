inputSchema:
  type: object
  properties:
    title: Accommodation Shift Report Form
    pages:
    - id: 1
      name: shift_date
      label: Shift Date
      hint: Date of the shift
      type: date
      options: []
      required: true
    - id: 2
      name: shift_start_time
      label: Shift Start Time
      hint: Time when the shift started
      type: time
      options: []
      required: true
    - id: 3
      name: shift_end_time
      label: Shift End Time
      hint: Time when the shift ended
      type: time
      options: []
      required: true
    - id: 4
      name: employee_name
      label: Employee Name
      hint: Full name of the employee on duty
      type: text
      options: []
      required: true
    - id: 5
      name: employee_id
      label: Employee ID
      hint: Employee identification number
      type: text
      options: []
      required: true
    - id: 6
      name: position_title
      label: Position Title
      hint: Job title of the employee
      type: text
      options: []
      required: true
    - id: 7
      name: accommodation_property
      label: Accommodation Property
      hint: Name of the hotel, inn, or accommodation property
      type: text
      options: []
      required: true
    - id: 8
      name: shift_type
      label: Shift Type
      hint: Type of shift worked
      type: select_one
      options:
      - Opening
      - Day
      - Evening
      - Closing
      - Overnight
      - Split Shift
      required: true
    - id: 9
      name: rooms_assigned
      label: Rooms Assigned
      hint: Number of rooms assigned to the employee for the shift
      type: number
      options: []
      required: true
    - id: 10
      name: rooms_cleaned
      label: Rooms Cleaned
      hint: Number of rooms cleaned during the shift
      type: number
      options: []
      required: true
    - id: 11
      name: check_ins_assisted
      label: Check Ins Assisted
      hint: Number of check-ins assisted during the shift
      type: number
      options: []
      required: true
    - id: 12
      name: check_outs_assisted
      label: Check Outs Assisted
      hint: Number of check-outs assisted during the shift
      type: number
      options: []
      required: true
    - id: 13
      name: maintenance_issues_reported
      label: Maintenance Issues Reported
      hint: Number of maintenance issues reported during the shift
      type: number
      options: []
      required: true
    - id: 14
      name: maintenance_issues_description
      label: Maintenance Issues Description
      hint: Description of any maintenance issues reported
      type: text
      options: []
      required: false
    - id: 15
      name: guest_complaints
      label: Guest Complaints
      hint: Number of guest complaints received during the shift
      type: number
      options: []
      required: true
    - id: 16
      name: guest_complaints_description
      label: Guest Complaints Description
      hint: Description of any guest complaints received
      type: text
      options: []
      required: false
    - id: 17
      name: incidents_reported
      label: Incidents Reported
      hint: Number of incidents reported during the shift
      type: number
      options: []
      required: true
    - id: 18
      name: incidents_description
      label: Incidents Description
      hint: Description of any incidents reported during the shift
      type: text
      options: []
      required: false
    - id: 19
      name: supervisor_notes
      label: Supervisor Notes
      hint: Any notes from the supervisor about the shift
      type: text
      options: []
      required: false
    - id: 20
      name: employee_signature
      label: Employee Signature
      hint: Electronic signature of the employee
      type: text
      options: []
      required: true
