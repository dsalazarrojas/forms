inputSchema:
  type: object
  properties:
    title: Expense Reimbursement Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: expense_date
      label: Expense Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: expense_type
      label: Expense Type
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Other
      required: false
    - id: 4
      name: expense_amount
      label: Expense Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: expense_details
      label: Expense Details
      hint: Briefly describe the expense
      type: note
      options: []
      required: false
    - id: 6
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
