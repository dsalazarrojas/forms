      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Bi-Quarterly
      - Annually
      required: false
    - id: 11
      name: reporting_status
      label: Reporting Status
      hint: null
      type: select_one
      options:
      - Pending
      - Released
      - Delayed
      - Cancelled
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
