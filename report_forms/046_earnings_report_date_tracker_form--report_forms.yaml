      type: date
      options: []
      required: false
    - id: 2
      name: expected_earnings_announcement_date
      label: Expected Earnings Announcement Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: actual_earnings_announcement_date
      label: Actual Earnings Announcement Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: expected_filing_date
      label: Expected Filing Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: actual_filing_date
      label: Actual Filing Date
      hint: null
      type: date
      options: []
