inputSchema:
  type: object
  properties:
    title: Police Patrol Log Form
    pages:
    - id: 1
      name: officer_name
      label: Officer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: incident_details
      label: Incident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: officer_shift
      label: Officer Shift
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Officer in distress
      - Equipment failure
      - Suspicious person
      - Vehicle accident
      - Other
      required: false
    - id: 7
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Active
      - Resolved
      - In Progress
      - Closed
      - On Hold
      required: false
    - id: 8
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
