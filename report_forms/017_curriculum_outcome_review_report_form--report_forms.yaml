inputSchema:
  type: object
  properties:
    title: Curriculum Outcome Review Report Form
    pages:
    - id: 1
      name: report_form
      label: Report Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: school_department
      label: School Department
      hint: null
      type: select_one
      options:
      - Academic Affairs
      - Admissions
      - Arts
      - Athletics
      - Business
      - Engineering
      - Other
      required: false
    - id: 3
      name: term
      label: Term
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 4
      name: outcome_achievement
      label: Outcome Achievement
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
