inputSchema:
  type: object
  properties:
    title: Car Oil Change Record Form
    pages:
    - id: 1
      name: vehicle_identification_header_oil
      label: -- Vehicle Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: vehicle_make_model_oil
      label: Car Make and Model
      hint: Identify the vehicle being recorded
      type: text
      options: []
      required: true
    - id: 3
      name: vehicle_year_oil
      label: Vehicle Year
      hint: Year of manufacture
      type: number
      options: []
      required: true
    - id: 4
      name: vehicle_vin_oil
      label: Vehicle Identification Number (VIN)
      hint: 17-character VIN code
      type: text
      options: []
      required: false
    - id: 5
      name: oil_change_record_header
      label: -- Oil Change Record --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: oil_change_date
      label: Date of Oil Change
      hint: When was the oil change performed?
      type: date
      options: []
      required: true
    - id: 7
      name: oil_change_mileage
      label: Mileage at Oil Change
      hint: Odometer reading during oil change
      type: number
      options: []
      required: true
    - id: 8
      name: oil_brand
      label: Brand of Oil Used
      hint: e.g., Mobil 1, Castrol, Pennzoil
      type: text
      options: []
      required: true
    - id: 9
      name: oil_viscosity
      label: Oil Viscosity (Weight)
      hint: e.g., 5W-30, 0W-20
      type: select_one
      options:
      - 0W-20
      - 5W-20
      - 5W-30
      - 10W-30
      - 15W-40
      - Other
      required: true
    - id: 10
      name: oil_type_record
      label: Type of Oil Used
      hint: Select the type of oil
      type: select_one
      options:
      - Full Synthetic
      - Synthetic Blend
      - Conventional (Mineral)
      - High Mileage
      required: true
    - id: 11
      name: oil_filter_replaced
      label: Was the oil filter replaced?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: oil_filter_brand_model
      label: Oil Filter Brand and Model
      hint: (If known)
      type: text
      options: []
      required: false
    - id: 13
      name: oil_change_cost
      label: Total Cost of Oil Change ($)
      hint: Amount paid for oil and labor
      type: number
      options: []
      required: false
    - id: 14
      name: service_provider_name_oil
      label: Service Provider / Shop Name
      hint: Where was the work done?
      type: text
      options: []
      required: true
    - id: 15
      name: next_oil_change_due_date
      label: Next Oil Change Due Date
      hint: Recommended date for the next oil change
      type: date
      options: []
      required: false
    - id: 16
      name: next_oil_change_due_mileage
      label: Next Oil Change Due Mileage
      hint: Recommended mileage for the next oil change
      type: number
      options: []
      required: false
    - id: 17
      name: oil_change_verification_header
      label: -- Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: oil_change_record_acknowledgement
      label: I acknowledge the oil change record entry
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 19
      name: signature_confirmation_oil
      label: Type your name for oil change record confirmation
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: additional_oil_comments
      label: Any additional comments or requests?
      hint: Provide more details for the oil change record
      type: text
      options: []
      required: false
