inputSchema:
  type: object
  properties:
    title: software_incident_report_form
    pages:
    - id: 1
      name: software_incident_details
      label: Software Incident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Security Vulnerability
      - Malware
      - Other
      required: false
    - id: 3
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: incident_affected
      label: Incident Affected
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: incident_reopened
      label: Incident Reopened
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: incident_closed
      label: Incident Closed
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: incident_closed_date
      label: Incident Closed Date
      hint: null
      type: date
      options: []
      required: false
