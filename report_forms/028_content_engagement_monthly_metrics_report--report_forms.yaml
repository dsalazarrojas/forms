      hint: Total likes, shares, comments
      type: number
      options: []
      required: true
    - id: 16
      name: facebook_likes
      label: Facebook Likes
      hint: Number of likes
      type: number
      options: []
      required: true
    - id: 17
      name: facebook_shares
      label: Facebook Shares
      hint: Number of shares
      type: number
      options: []
      required: true
    - id: 18
      name: instagram_likes
      label: Instagram Likes
      hint: Number of likes
      type: number
      options: []
      required: true
    - id: 19
      name: instagram_comments
      label: Instagram Comments
      hint: Number of comments
      type: number
      options: []
      required: true
    - id: 20
      name: twitter_engagements
      label: Twitter Engagements
      hint: Total retweets and likes
      type: number
      options: []
      required: true
    - id: 21
      name: linkedin_engagements
      label: LinkedIn Engagements
      hint: Total reactions and comments
      type: number
      options: []
      required: true
    - id: 22
      name: email_opens
