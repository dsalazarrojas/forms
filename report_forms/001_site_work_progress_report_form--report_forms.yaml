inputSchema:
  type: object
  properties:
    title: Site Work Progress Report Form
    pages:
    - id: 1
      name: project_status
      label: Project Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 2
      name: work_completed
      label: Work Completed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: labor_summary
      label: Labor Summary
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: equipment_summary
      label: Equipment Summary
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: Additional notes about progress
      type: text
      options: []
      required: false
    - id: 6
      name: labor_costs
      label: Labor Costs
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: equipment_costs
      label: Equipment Costs
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: total_costs
      label: Total Costs
      hint: null
      type: number
      options: []
      required: false
