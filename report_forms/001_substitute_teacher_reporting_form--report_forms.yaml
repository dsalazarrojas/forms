inputSchema:
  type: object
  properties:
    title: Substitute Teacher Reporting Form
    pages:
    - id: 1
      name: lesson_notes
      label: Lesson Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_notes
      label: Student Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_names
      label: Student Names
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - Bob Smith
      required: true
    - id: 4
      name: student_ages
      label: Student Ages
      hint: null
      type: select_one
      options:
      - '10'
      - '11'
      - '12'
      required: true
    - id: 5
      name: lesson_plans
      label: Lesson Plans
      hint: null
      type: select_one
      options:
      - Reading
      - Writing
      - Mathematics
      required: false
    - id: 6
      name: student_subjects
      label: Student Subjects
      hint: null
      type: select_multiple
      options:
      - Math
      - Reading
      - Writing
      required: true
    - id: 7
      name: lesson_objectives
      label: Lesson Objectives
      hint: null
      type: text
      options: []
      required: false
