inputSchema:
  type: object
  properties:
    title: CSI Form
    pages:
    - id: 1
      name: incident_summary_header
      label: -- Incident Summary --
      hint: Crime Scene Investigation Report
      type: note
      options: []
      required: false
    - id: 2
      name: case_number
      label: Case Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: investigating_officer
      label: Primary Investigating Officer
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: report_date
      label: Date of Report
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: report_time
      label: Time of Report
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: incident_location
      label: Location of Scene
      hint: street address or specific description
      type: text
      options: []
      required: true
    - id: 7
      name: crime_scene_header
      label: -- Scene Observations --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: offense_type
      label: Type of Offense
      hint: null
      type: select_one
      options:
      - Homicide
      - Burglary
      - Assault
      - Vandalism
      - Arson
      - Theft
      - Other
      required: true
    - id: 9
      name: scene_condition
      label: Condition of Scene upon Arrival
      hint: e.g. secure, disturbed, contaminated
      type: text
      options: []
      required: true
    - id: 10
      name: weather_conditions
      label: Weather and Lighting Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: evidence_header
      label: -- Evidence Collection --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: evidence_item_count
      label: Total Number of Evidence Items Collected
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: forensic_tests_requested
      label: Forensic Tests Requested
      hint: check all that apply
      type: select_multiple
      options:
      - DNA Analysis
      - Fingerprinting
      - Ballistics
      - Toxicology
      - Digital Forensics
      - Trace Evidence
      required: false
    - id: 14
      name: evidence_log_summary
      label: Brief Evidence Log Summary
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: chain_of_custody_transfer
      label: Person Receiving Evidence
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: transfer_date_time
      label: Date and Time of Transfer
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: security_check
      label: Scene Securely Locked and Tape Applied
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
