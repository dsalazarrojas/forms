inputSchema:
  type: object
  properties:
    title: Child Abuse Report Form
    pages:
    - id: 1
      name: report_intro
      label: -- Child Abuse Report Form --
      hint: Mandatory reporting of suspected child abuse
      type: note
      options: []
      required: false
    - id: 2
      name: report_date
      label: Report date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: report_time
      label: Report time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: reporter_type
      label: Reporter type
      hint: null
      type: select_one
      options:
      - Mandatory reporter
      - Voluntary reporter
      - Anonymous
      required: true
    - id: 5
      name: reporter_name
      label: Reporter name (if not anonymous)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: reporter_phone
      label: Contact phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: reporter_email
      label: Contact email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: reporter_occupation
      label: Occupation or professional role
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: child_full_name
      label: Child's full name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: child_age
      label: Child's age or date of birth
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: child_address
      label: Child's address or location
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: suspected_abuse_type
      label: Type of suspected abuse
      hint: Select all that apply
      type: select_multiple
      options:
      - Physical abuse
      - Emotional abuse
      - Sexual abuse
      - Neglect
      - Abandonment
      - Exposure to domestic violence
      - Substance abuse
      - Other
      required: true
    - id: 13
      name: abuse_description
      label: Detailed description of suspected abuse
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: incident_date
      label: Date of incident (if known)
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: incident_location
      label: Location of incident
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: visible_injuries
      label: Visible injuries or marks
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: true
    - id: 17
      name: injury_description
      label: Description of injuries
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: perpetrator_information
      label: Information about suspected perpetrator
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: perpetrator_relationship
      label: Relationship to child (if known)
      hint: null
      type: select_one
      options:
      - Parent
      - Caregiver
      - Family member
      - Authority figure
      - Peer
      - Unknown
      required: false
    - id: 20
      name: household_situation
      label: Information about household situation
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: child_statement
      label: What the child has said or communicated
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: previous_reports
      label: Any previous reports or concerns
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unknown
      required: true
    - id: 23
      name: immediate_protection
      label: Does child need immediate protection?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Unclear
      required: true
    - id: 24
      name: witness_information
      label: Witness information (if any)
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: additional_details
      label: Additional details or observations
      hint: null
      type: text
      options: []
      required: false
    - id: 26
      name: reporter_signature
      label: I declare that this report is made in good faith
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
