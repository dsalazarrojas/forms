inputSchema:
  type: object
  properties:
    title: Performance Test Results Form
    pages:
    - id: 1
      name: test_results
      label: test_results
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_run
      label: date_run
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: test_duration
      label: test_duration
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: test_outcome
      label: test_outcome
      hint: null
