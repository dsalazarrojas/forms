      options:
      - Pass
      - Fail
      - Not Applicable
      required: true
    - id: 5
      name: test_results_details
      label: test_results_details
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: test_results_notes
      label: test_results_notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: user_name
      label: user_name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: user_email
      label: user_email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: test_duration_unit
      label: test_duration_unit
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: test_results_comments
      label: test_results_comments
      hint: null
      type: note
      options: []
      required: false
