inputSchema:
  type: object
  properties:
    title: Occupational Therapy Progress Note Template
    pages:
    - id: 1
      name: patient_progress
      label: patient_progress
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: diagnosis
      label: diagnosis
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: treatment_plan
      label: treatment_plan
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: evaluation
      label: evaluation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: treatment_goals
      label: treatment_goals
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: patient_outcome
      label: patient_outcome
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: provider_notes
      label: provider_notes
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: next_steps
      label: next_steps
      hint: null
      type: time
      options: []
      required: false
