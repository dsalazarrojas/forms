inputSchema:
  type: object
  properties:
    title: CRM Support Ticket Form
    pages:
      - id: 1
        name: reporter_name
        label: Reporter name
        hint: Person filing the ticket
        type: text
        options: []
        required: true
      - id: 2
        name: reporter_email
        label: Reporter email
        hint: For follow up
        type: email
        options: []
        required: true
      - id: 3
        name: issue_category
        label: Issue category
        hint: Choose the area affected
        type: select_one
        options:
          - Data issue
          - Access problem
          - Integration failure
          - UI bug
        required: true
      - id: 4
        name: priority
        label: Priority
        hint: Impact on operations
        type: select_one
        options:
          - Low
          - Medium
          - High
          - Critical
        required: true
      - id: 5
        name: description
        label: Issue description
        hint: Provide steps to reproduce if applicable
        type: text
        options: []
        required: true
      - id: 6
        name: attachment_reference
        label: Attachment reference or link
        hint: Optional screenshot or log link
        type: text
        options: []
        required: false
      - id: 7
        name: expected_resolution_date
        label: Expected resolution date
        hint: If known provide target date
        type: date
        options: []
        required: false
      - id: 8
        name: follow_up_notes
        label: Follow up notes
        hint: Internal use
        type: text
        options: []
        required: false
