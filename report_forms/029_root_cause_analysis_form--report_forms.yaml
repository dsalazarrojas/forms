inputSchema:
  type: object
  properties:
    title: Root Cause Analysis Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: issue_description
      label: issue_description
      hint: Describe the issue you are experiencing.
      type: text
      options: []
      required: false
    - id: 3
      name: cause_of_issue
      label: cause_of_issue
      hint: Isolate the root cause of the issue.
      type: text
      options: []
      required: false
    - id: 4
      name: recommended_solution
      label: recommended_solution
      hint: Recommend a solution to fix the issue.
      type: text
      options: []
      required: false
    - id: 5
      name: next_steps
      label: next_steps
      hint: Outline the next steps to take.
      type: text
      options: []
      required: false
    - id: 6
      name: root_cause_analysis
      label: root_cause_analysis
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 7
      name: issue_priority
      label: issue_priority
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: issue_status
      label: issue_status
      hint: null
      type: select_one
      options:
      - Active
      - Resolved
      - Pending
      required: false
    - id: 9
      name: assigned_to
      label: assigned_to
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Joe
      required: true
    - id: 10
      name: due_date
      label: due_date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: start_date
      label: start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: end_date
      label: end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: time_zone
      label: time_zone
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 15
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
