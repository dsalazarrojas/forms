inputSchema:
  type: object
  properties:
    title: Livestock Sanitation Support Request Form
    pages:
    - id: 1
      name: farm_info
      label: Farm information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: animal_count
      label: Animal Count
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: animal_type
      label: Animal Type
      hint: null
      type: select_one
      options:
      - Beef Cattle
      - Pigs
      - Sheep
      - Horses
      - Goats
      - Chickens
      - Ducks
      - Turkeys
      - Other
      required: false
    - id: 4
      name: issue_description
      label: Issue Description
      hint: Describe the issue in detail
      type: text
      options: []
      required: false
    - id: 5
      name: photos
      label: Photos
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: photos_additional_info
      label: Additional Photos Information
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: urgency
      label: Urgency
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 8
      name: contact_person
      label: Contact Person
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - Jim Brown
      required: false
    - id: 9
      name: farm_location
      label: Farm Location
      hint: null
      type: select_one
      options:
      - Local farm
      - Regional
      - National
      required: false
    - id: 10
      name: support_request
      label: Support Request
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: support_request_additional_info
      label: Additional Support Request Information
      hint: null
      type: text
      options: []
      required: false
