inputSchema:
  type: object
  properties:
    title: Monthly Treasurer Report Form
    pages:
    - id: 1
      name: monthly_report
      label: Monthly Report
      hint: Enter a brief summary of the month's activities
      type: text
      options: []
      required: false
    - id: 2
      name: income
      label: Income
      hint: Enter income amounts
      type: number
      options: []
      required: false
    - id: 3
      name: income_type
      label: Income Type
      hint: null
      type: select_one
      options:
      - Salary
      - Investments
      - Business Income
      required: true
    - id: 4
      name: expense
      label: Expense
      hint: Enter expense amounts
      type: number
      options: []
      required: false
    - id: 5
      name: expense_type
      label: Expense Type
      hint: null
      type: select_one
      options:
      - Rent
      - Food
      - Transportation
      required: true
    - id: 6
      name: balance
      label: Balance
      hint: Total income and expenses balance
      type: number
      options: []
      required: true
    - id: 7
      name: submission_date
      label: Submission Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 8
      name: submission_time
      label: Submission Time
      hint: Time of submission
      type: time
      options: []
      required: true
    - id: 9
      name: contact
      label: Contact Info
      hint: Phone number
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: category
      label: Category
      hint: Select a category
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: category_repeat
      label: Repeat category selection
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
