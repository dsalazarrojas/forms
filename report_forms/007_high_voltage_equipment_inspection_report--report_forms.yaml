      name: high_voltage_equipment_inspection_report
      label: High Voltage Equipment Inspection Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: equipment_id
      label: Equipment ID
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: voltage_level
      label: Voltage Level
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 5
      name: inspection_location
      label: Inspection Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: inspection_result
      label: Inspection Result
      hint: null
      type: select_multiple
      options:
      - Pass
      - Fail
      - N/A
      required: true
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: assigned_inspector
      label: Assigned Inspector
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
