inputSchema:
  type: object
  properties:
    title: eod
    pages:
    - id: 1
      name: report_date
      label: Report Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - Incident
      - Near Miss
      - Other
      required: true
    - id: 3
      name: incident_description
      label: Incident Description
      hint: Briefly describe the incident, including any relevant details.
      type: text
      options: []
      required: false
    - id: 4
      name: incident_location
      label: Incident Location
      hint: Enter the location where the incident occurred.
      type: text
      options: []
      required: false
    - id: 5
      name: incident_time
      label: Incident Time
      hint: Enter the time the incident occurred in 24 hour format.
      type: time
      options: []
      required: false
    - id: 6
      name: report_author
      label: Report Author
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: report_date_completed
      label: Report Date Completed
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      - In Progress
      required: true
    - id: 9
      name: incident_category
      label: Incident Category
      hint: Category of the incident (e.g., Safety, Security).
      type: select_multiple
      options:
      - Safety
      - Security
      - Other
      required: true
    - id: 10
      name: incident_details
      label: Incident Details
      hint: Enter any additional details or comments regarding the incident.
      type: text
      options: []
      required: false
