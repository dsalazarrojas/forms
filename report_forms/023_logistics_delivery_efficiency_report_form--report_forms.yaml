      name: delivery_date
      label: delivery_date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: document_delay
      label: document_delay
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: on_time_performance
      label: on_time_performance
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: fleet_status
      label: fleet_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 5
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: route_id
      label: route_id
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: driver_id
      label: driver_id
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
