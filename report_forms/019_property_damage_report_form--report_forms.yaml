      type: text
      options: []
      required: false
    - id: 7
      name: property_damage_report_form_contact_info
      label: Contact Info
      hint: Provide contact information.
      type: text
      options: []
      required: false
    - id: 8
      name: property_damage_report_form_insurance_company
