inputSchema:
  type: object
  properties:
    title: Agenda Item Details Form
    pages:
    - id: 1
      name: header
      label: -- Agenda Item Reporting Form --
      hint: record the outcomes and timing of specific agenda items
      type: note
      options: []
      required: false
    - id: 2
      name: rapporteur_name
      label: Meeting Rapporteur Name
      hint: person recording the details
      type: text
      options: []
      required: true
    - id: 3
      name: report_date
      label: Date of Report
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: performance_header
      label: -- Topic Performance --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: item_title
      label: Agenda Item Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: presenter_name
      label: Presenter Name
      hint: person who led the discussion
      type: text
      options: []
      required: true
    - id: 7
      name: start_time
      label: Start Time
      hint: actual time discussion began
      type: time
      options: []
      required: true
    - id: 8
      name: end_time
      label: End Time
      hint: actual time discussion concluded
      type: time
      options: []
      required: true
    - id: 9
      name: completion_status
      label: Was the item completed?
      hint: null
      type: select_one
      options:
      - Fully Completed
      - Partially Completed (Carried Forward)
      - Postponed
      - Withdrawn
      required: true
    - id: 10
      name: discussion_summary
      label: Summary of discussion
      hint: key points raised by participants
      type: text
      options: []
      required: true
    - id: 11
      name: decisions_reached
      label: Key decisions reached
      hint: formal outcomes or votes
      type: text
      options: []
      required: false
    - id: 12
      name: follow_up_actions
      label: Follow-up actions required
      hint: tasks generated from this item
      type: select_multiple
      options:
      - Draft a proposal
      - Conduct further research
      - Email participants
      - Update project plan
      - Schedule next meeting
      required: false
    - id: 13
      name: responsible_parties
      label: Responsible parties for follow-up
      hint: who will handle the actions
      type: text
      options: []
      required: false
