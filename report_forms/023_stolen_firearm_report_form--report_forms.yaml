    - id: 4
      name: firearm_type
      label: Firearm Type
      hint: null
      type: select_one
      options:
      - 9mm pistol
      - 10mm pistol
      - 11mm pistol
      - 40mm pistol
      - 380 pistol
      - 45mm pistol
      - 9mm rifle
      - 10mm rifle
      - 11mm rifle
      - 40mm rifle
      - 380 rifle
      - 45mm rifle
      - 9mm
      - 10mm
      - 11mm
      - 40mm
      - '380'
      - 45mm
      required: false
