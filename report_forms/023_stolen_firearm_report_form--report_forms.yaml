inputSchema:
  type: object
  properties:
    title: <string>
    pages:
    - id: 1
      name: firearm_report_form
      label: Report
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
