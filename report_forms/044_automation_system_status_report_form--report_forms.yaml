inputSchema:
  type: object
  properties:
    title: Automation System Status Report Form
    pages:
    - id: 1
      name: introduction
      label: Automation System Status Report
      hint: Report on automation system health
      type: note
      options: []
      required: false
    - id: 2
      name: report_info
      label: Report Information
      hint: Basic report details
      type: note
      options: []
      required: false
    - id: 3
      name: report_date
      label: Report Date
      hint: Date of report
      type: date
      options: []
      required: true
    - id: 4
      name: report_time
      label: Report Time
      hint: Time of report
      type: time
      options: []
      required: false
    - id: 5
      name: report_type
      label: Report Type
      hint: What type
      type: select_one
      options:
      - Daily Status
      - Weekly Summary
      - Monthly Report
      - Incident Report
      - Maintenance Report
      - Performance Report
      - Other
      required: true
    - id: 6
      name: reporting_period
      label: Reporting Period
      hint: Time covered
      type: select_one
      options:
      - Last 24 Hours
      - Last 7 Days
      - Last 30 Days
      - Custom Range
      required: false
    - id: 7
      name: period_start
      label: Period Start
      hint: Start date
      type: date
      options: []
      required: false
    - id: 8
      name: period_end
      label: Period End
      hint: End date
      type: date
      options: []
      required: false
