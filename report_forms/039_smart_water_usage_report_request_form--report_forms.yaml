      - February 1 to February 28
      - March 1 to March 31
      - April 1 to April 31
      required: false
    - id: 4
      name: property_manager_email
      label: Property Manager Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: report_requester_name
      label: Report Requester Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: report_requester_phone
      label: Report Requester Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: report_requester_note
      label: Report Requester Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: report_requester_company
      label: Report Requester Company
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: report_requester_designation
      label: Report Requester Designation
      hint: null
      type: select_multiple
      options:
      - Homeowner
      - Landlord
      - Utility Representative
      required: false
    - id: 10
      name: report_requester_phone
      label: Report Requester Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: report_requester_email
      label: Report Requester Email
      hint: null
      type: email
      options: []
      required: false
