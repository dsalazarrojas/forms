inputSchema:
  type: object
  properties:
    title: Smart Water Usage Report Request Form
    pages:
    - id: 1
      name: report_form
      label: Report Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: property_address
      label: Property Address
      hint: Address of the property for which the report is requested
      type: text
      options: []
      required: false
    - id: 3
      name: report_period
      label: Report Period
      hint: Select a date range for the report
      type: select_one
      options:
