inputSchema:
  type: object
  properties:
    title: Agriculture Financial Statement Form
    pages:
    - id: 1
      name: business_info_header
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: business_name
      label: Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: fiscal_year
      label: Fiscal Year
      hint: e.g. 2024
      type: text
      options: []
      required: true
    - id: 4
      name: reporting_period
      label: Reporting Period
      hint: Quarter or Annual
      type: select_one
      options:
      - Q1 (Jan-Mar)
      - Q2 (Apr-Jun)
      - Q3 (Jul-Sep)
      - Q4 (Oct-Dec)
      - Annual
      required: true
    - id: 5
      name: income_header
      label: -- Operating Income --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: crop_sales
      label: Crop Sales
      hint: Total revenue from crops
      type: number
      options: []
      required: true
    - id: 7
      name: livestock_sales
      label: Livestock Sales
      hint: Total revenue from animals
      type: number
      options: []
      required: true
    - id: 8
      name: gov_payments
      label: Government Payments
      hint: Subsidies, disaster relief
      type: number
      options: []
      required: false
    - id: 9
      name: insurance_proceeds
      label: Insurance Proceeds
      hint: Crop insurance payouts
      type: number
      options: []
      required: false
    - id: 10
      name: expenses_header
      label: -- Operating Expenses --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: seed_plants
      label: Seeds and Plants
      hint: Cost of inputs
      type: number
      options: []
      required: true
    - id: 12
      name: fertilizer_chemicals
      label: Fertilizer and Chemicals
      hint: Soil amendments and protection
      type: number
      options: []
      required: true
    - id: 13
      name: labor_hired
      label: Labor Hired
      hint: Wages and benefits
      type: number
      options: []
      required: true
    - id: 14
      name: fuel_oil
      label: Fuel and Oil
      hint: Diesel, gas, lubricants
      type: number
      options: []
      required: true
    - id: 15
      name: repairs_maintenance
      label: Repairs and Maintenance
      hint: Machinery and buildings
      type: number
      options: []
      required: true
    - id: 16
      name: assets_header
      label: -- Assets and Liabilities --
      hint: Snapshop of value
      type: note
      options: []
      required: false
    - id: 17
      name: land_value
      label: Total Land Value
      hint: Current market value
      type: number
      options: []
      required: true
    - id: 18
      name: machinery_value
      label: Total Machinery Value
      hint: Depreciated value
      type: number
      options: []
      required: true
    - id: 19
      name: loan_liabilities
      label: Total Loan Liabilities
      hint: Outstanding debt
      type: number
      options: []
      required: true
    - id: 20
      name: net_income
      label: Net Cash Income
      hint: Calculated manually
      type: number
      options: []
      required: true
    - id: 21
      name: certification
      label: Certification
      hint: I certify these numbers are accurate
      type: select_one
      options:
      - Yes, I Certify
      - Other
      required: true
