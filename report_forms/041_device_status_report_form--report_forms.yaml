inputSchema:
  type: object
  properties:
    title: Device Status Report Form
    pages:
    - id: 1
      name: user
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: device_status
      label: Device Status
      hint: null
      type: select_one
      options:
      - Offline
      - Online
      required: false
    - id: 3
      name: condition
      label: Condition
      hint: null
      type: select_multiple
      options:
      - Critical
      - Good
      - Needs Maintenance
      required: false
    - id: 4
      name: maintenance_needs
      label: Maintenance Needs
      hint: null
      type: select_multiple
      options:
      - Critical
      - High
      - Medium
      - Low
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
      required: false
