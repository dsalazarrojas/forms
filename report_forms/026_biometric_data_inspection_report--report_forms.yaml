inputSchema:
  type: object
  properties:
    title: Biometric Data Inspection Report
    pages:
    - id: 1
      name: inspection_information
      label: Inspection Information
      hint: Enter inspection details
      type: note
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Inspection Time
      hint: Time of inspection
      type: time
      options: []
      required: true
    - id: 4
      name: inspection_id
      label: Inspection ID
      hint: Unique inspection reference number
      type: text
      options: []
      required: true
    - id: 5
      name: inspector_name
      label: Inspector Name
      hint: Name of person conducting inspection
      type: text
      options: []
      required: true
    - id: 6
      name: inspector_id
      label: Inspector ID
      hint: Inspector identification number
      type: text
      options: []
      required: true
    - id: 7
      name: system_information
      label: System Information
      hint: Enter biometric system details
      type: note
      options: []
      required: false
    - id: 8
      name: system_name
      label: System Name
      hint: Name of biometric system
      type: text
      options: []
      required: true
    - id: 9
      name: system_location
      label: System Location
      hint: Physical location of system
      type: text
      options: []
      required: true
    - id: 10
      name: system_type
      label: System Type
      hint: Type of biometric system
      type: select_one
      options:
      - Fingerprint Scanner
      - Facial Recognition
      - Iris Scanner
      - Palm Vein Scanner
      - Voice Recognition
      - Hand Geometry
      - Multi-Modal System
      required: true
    - id: 11
      name: system_vendor
      label: System Vendor
      hint: Manufacturer or vendor name
      type: text
      options: []
      required: true
    - id: 12
      name: system_serial_number
      label: Serial Number
      hint: System serial number
      type: text
      options: []
      required: true
    - id: 13
      name: system_installation_date
      label: Installation Date
      hint: When was system installed
      type: date
      options: []
      required: false
    - id: 14
      name: data_inspection
      label: Data Inspection
      hint: Inspect biometric data quality
      type: note
      options: []
      required: false
    - id: 15
      name: data_storage_type
      label: Data Storage Type
      hint: How is biometric data stored
      type: select_one
      options:
      - Local Database
      - Cloud Storage
      - Encrypted Server
      - Hybrid Storage
      required: true
    - id: 16
      name: data_encryption_status
      label: Data Encryption Status
      hint: Is data encrypted
      type: select_one
      options:
      - Fully Encrypted
      - Partially Encrypted
      - Not Encrypted
      - Unknown
      required: true
    - id: 17
      name: data_quality_score
      label: Data Quality Score
      hint: Overall quality rating
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Critical Issues
      required: true
    - id: 18
      name: false_acceptance_rate
      label: False Acceptance Rate
      hint: FAR percentage if available
      type: number
      options: []
      required: false
    - id: 19
      name: false_rejection_rate
      label: False Rejection Rate
      hint: FRR percentage if available
      type: number
      options: []
      required: false
    - id: 20
      name: system_performance
      label: System Performance
      hint: Evaluate system performance
      type: note
      options: []
      required: false
    - id: 21
      name: recognition_speed
      label: Recognition Speed
      hint: How fast is recognition
      type: select_one
      options:
      - Very Fast (Under 1 second)
      - Fast (1-2 seconds)
      - Average (2-5 seconds)
      - Slow (5+ seconds)
      required: true
    - id: 22
      name: system_uptime
      label: System Uptime
      hint: Percentage of operational time
      type: select_one
      options:
      - 99-100%
      - 95-98%
      - 90-94%
      - Below 90%
      required: true
    - id: 23
      name: hardware_condition
      label: Hardware Condition
      hint: Physical condition of hardware
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs Replacement
      required: true
    - id: 24
      name: software_version
      label: Software Version
      hint: Current software version
      type: text
      options: []
      required: true
    - id: 25
      name: security_compliance
      label: Security Compliance
      hint: Compliance status
      type: note
      options: []
      required: false
    - id: 26
      name: gdpr_compliance
      label: GDPR Compliance
      hint: Is system GDPR compliant
      type: select_one
      options:
      - Fully Compliant
      - Partially Compliant
      - Not Compliant
      - Not Applicable
      required: true
    - id: 27
      name: data_retention_policy
      label: Data Retention Policy
      hint: Is there a retention policy
      type: select_one
      options:
      - Yes - Documented and Followed
      - Yes - Not Fully Followed
      - No Policy in Place
      - Unknown
      required: true
    - id: 28
      name: access_controls
      label: Access Controls
      hint: Are access controls adequate
      type: select_one
      options:
      - Excellent Controls
      - Adequate Controls
      - Weak Controls
      - No Controls
      required: true
    - id: 29
      name: issues_identified
      label: Issues Identified
      hint: List any problems found
      type: select_multiple
      options:
      - No Issues Found
      - Hardware Malfunction
      - Software Bugs
      - Data Quality Issues
      - Security Vulnerabilities
      - Performance Degradation
      - User Complaints
      - Compliance Gaps
      required: true
    - id: 30
      name: issue_description
      label: Issue Description
      hint: Describe identified issues
      type: text
      options: []
      required: false
    - id: 31
      name: recommendations
      label: Recommendations
      hint: Suggested actions
      type: text
      options: []
      required: true
    - id: 32
      name: follow_up_required
      label: Follow-up Required
      hint: Is follow-up needed
      type: select_one
      options:
      - No Follow-up Needed
      - Routine Follow-up
      - Urgent Follow-up
      - Immediate Action Required
      required: true
    - id: 33
      name: next_inspection_date
      label: Next Inspection Date
      hint: Scheduled next inspection
      type: date
      options: []
      required: false
    - id: 34
      name: inspector_signature
      label: Inspector Signature
      hint: Inspector confirms report accuracy
      type: select_one
      options:
      - I certify this inspection report is accurate
      - I have reviewed all findings
      required: true
    - id: 35
      name: supervisor_review
      label: Supervisor Review
      hint: Supervisor acknowledgment
      type: select_one
      options:
      - Reviewed and Approved
      - Reviewed with Comments
      - Pending Review
      required: false
