inputSchema:
  type: object
  properties:
    title: Artist Project Report Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Artist Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: artist_name
      label: Artist Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: artist_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: organization_affiliation
      label: Organization or Institution
      hint: School, gallery, studio, or agency
      type: text
      options: []
      required: false
    - id: 5
      name: report_date
      label: Date of Report
      hint: When are you submitting this report?
      type: date
      options: []
      required: true
    - id: 6
      name: section_header_2
      label: -- Project Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: project_title
      label: Project Title
      hint: Name of the artistic project
      type: text
      options: []
      required: true
    - id: 8
      name: project_description
      label: Project Description
      hint: Detailed overview of the project
      type: text
      options: []
      required: true
    - id: 9
      name: project_type
      label: Type of Project
      hint: What category is this project?
      type: select_one
      options:
      - Solo Exhibition
      - Group Exhibition
      - Performance
      - Installation
      - Public Art
      - Collaborative Work
      - Research Project
      - Teaching Project
      - Commercial Work
      - Personal Project
      - Other
      required: true
    - id: 10
      name: project_goal
      label: Project Goals and Objectives
      hint: What did you aim to achieve?
      type: text
      options: []
      required: true
    - id: 11
      name: section_header_3
      label: -- Project Timeline --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: start_date
      label: Project Start Date
      hint: When did the project begin?
      type: date
      options: []
      required: true
    - id: 13
      name: end_date
      label: Project End Date or Completion Date
      hint: When was it completed?
      type: date
      options: []
      required: true
    - id: 14
      name: total_hours
      label: Total Hours Spent on Project
      hint: Approximate time investment
      type: number
      options: []
      required: false
    - id: 15
      name: section_header_4
      label: -- Outcomes and Results --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: outcomes_achieved
      label: Outcomes and Results Achieved
      hint: What were the measurable results?
      type: text
      options: []
      required: true
    - id: 17
      name: attendance_impact
      label: Attendance, Reach, or Impact Metrics
      hint: Number of viewers, attendees, followers gained, etc.
      type: text
      options: []
      required: false
    - id: 18
      name: critical_reception
      label: Critical Reception or Feedback
      hint: Reviews, audience feedback, or response
      type: text
      options: []
      required: false
    - id: 19
      name: section_header_5
      label: -- Resources and Budget --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: materials_used
      label: Materials or Resources Used
      hint: What materials or resources were needed?
      type: text
      options: []
      required: false
    - id: 21
      name: budget_amount
      label: Project Budget
      hint: Total funding or costs
      type: number
      options: []
      required: false
    - id: 22
      name: funding_sources
      label: Funding Sources
      hint: Grants, personal funds, sponsorship, etc.
      type: text
      options: []
      required: false
    - id: 23
      name: section_header_6
      label: -- Reflection and Future --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: lessons_learned
      label: Lessons Learned or Challenges
      hint: What did you learn or struggle with?
      type: text
      options: []
      required: false
    - id: 25
      name: future_development
      label: Future Development or Next Steps
      hint: How will this project evolve?
      type: text
      options: []
      required: false
