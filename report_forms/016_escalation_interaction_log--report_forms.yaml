inputSchema:
  type: object
  properties:
    title: Escalation Interaction Log
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: escalation_type
      label: Escalation Type
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - None
      - Chat
      - Other
      required: false
    - id: 3
      name: interaction_time
      label: Interaction Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: escalation_details
      label: Escalation Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: resolution_status
      label: Resolution Status
      hint: null
      type: select_one
      options:
      - Resolved
      - Pending
      - Closed
      - Not Applicable
      required: false
    - id: 6
      name: action_taken
      label: Action Taken
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: action_details
      label: Action Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: outcome_details
      label: Outcome Details
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
