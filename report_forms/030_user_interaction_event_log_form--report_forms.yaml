inputSchema:
  type: object
  properties:
    title: User Interaction Event Log Form
    pages:
    - id: 1
      name: user_interaction_page_1
      label: Product Issues
      hint: null
      type: select_multiple
      options:
      - issue 1
      - issue 2
      required: true
    - id: 2
      name: user_interaction_page_2
      label: User Interaction Log
      hint: null
      type: select_one
      options:
      - issue
      - product
      - user
      required: true
    - id: 3
      name: interaction_page
      label: Interaction
      hint: null
      type: radio
      options:
      - I agree
      - I do not agree
      required: true
    - id: 4
      name: issued_to_page
      label: Issued To
      hint: null
      type: select_one
      options:
      - user a
      - user b
      required: true
    - id: 5
      name: interaction_type_page
      label: Interaction Type
      hint: null
      type: select_one
      options:
      - issue
      - product
      - user
      required: true
    - id: 6
      name: product_page
      label: Product
      hint: null
      type: select_multiple
      options:
      - Apple
      - Samsung
      required: true
    - id: 7
      name: notes_page
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: consent_page
      label: Consent
      hint: null
      type: radio
      options:
      - I agree
      - I do not agree
      required: true
