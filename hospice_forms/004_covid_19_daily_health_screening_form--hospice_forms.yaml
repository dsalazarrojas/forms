inputSchema:
  type: object
  properties:
    title: COVID 19 Daily Health Screening Form
    pages:
    - id: 1
      name: section_respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_id
      label: Student/Employee ID (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: screening_date
      label: Today's Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: respondent_role
      label: Your Role
      hint: null
      type: select_one
      options:
      - Student
      - Employee
      - Client/Patient
      - Visitor
      - Other
      required: true
    - id: 6
      name: section_symptoms
      label: -- Symptom Screening --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: fever
      label: Do you have a fever or temperature above 100.4 F?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 8
      name: cough
      label: Do you have a new or worsening cough?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 9
      name: shortness_of_breath
      label: Do you have shortness of breath or difficulty breathing?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 10
      name: body_aches
      label: Do you have body aches or chills?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 11
      name: sore_throat
      label: Do you have a sore throat?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 12
      name: headache
      label: Do you have a headache?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 13
      name: loss_of_taste_smell
      label: Do you have a loss of taste or smell?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 14
      name: section_exposure
      label: -- Exposure Risk --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: covid_contact
      label: Have you been in close contact with a confirmed COVID-19 case in the
        last 14 days?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      - Unsure
      required: true
    - id: 16
      name: covid_diagnosis
      label: Have you been diagnosed with COVID-19 in the last 14 days?
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      - Uncertain
      required: true
    - id: 17
      name: section_clearance
      label: -- Health Clearance --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: screening_result
      label: Based on this screening, are you cleared to proceed?
      hint: null
      type: select_one
      options:
      - Cleared - no symptoms
      - Cleared - with precautions
      - Not cleared - requires evaluation
      required: true
    - id: 19
      name: screener_name
      label: Screener Name (if applicable)
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: screener_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
