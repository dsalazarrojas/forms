inputSchema:
  type: object
  properties:
    title: Smoke Alarm Authorization Form
    pages:
    - id: 1
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - '{''value'': ''Residential''}'
      - '{''value'': ''Commercial''}'
      - '{''value'': ''Other''}'
      required: false
    - id: 2
      name: property_owner
      label: Property Owner
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Owner''}'
      - '{''value'': ''Tenant''}'
      required: false
    - id: 3
      name: owner_name
      label: Owner Name
      hint: Please provide the property owner's name
      type: text
      options: []
      required: false
    - id: 4
      name: owner_phone
      label: Owner Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: owner_email
      label: Owner Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: property_address
      label: Property Address
      hint: Please provide the property address
      type: text
      options: []
      required: false
    - id: 7
      name: installation_date
      label: Installation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - '{''value'': ''chatjimmy''}'
      - Other
      required: false
    - id: 10
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
