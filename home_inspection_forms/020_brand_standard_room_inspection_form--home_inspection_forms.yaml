inputSchema:
  type: object
  properties:
    title: Brand Standard Room Inspection Form
    pages:
      - id: 1
        name: inspector_name
        label: Inspector Name
        hint: Full name of inspector
        type: text
        options: []
        required: true
      - id: 2
        name: inspector_id
        label: Inspector ID
        hint: Employee or contractor ID
        type: text
        options: []
        required: true
      - id: 3
        name: inspection_date
        label: Inspection Date
        hint: Date of inspection
        type: date
        options: []
        required: true
      - id: 4
        name: inspection_time
        label: Inspection Time
        hint: Time of inspection
        type: time
        options: []
        required: true
      - id: 5
        name: property_name
        label: Property Name
        hint: Name of hotel or property
        type: text
        options: []
        required: true
      - id: 6
        name: property_address
        label: Property Address
        hint: Full address
        type: text
        options: []
        required: true
      - id: 7
        name: room_number
        label: Room Number
        hint: Room being inspected
        type: text
        options: []
        required: true
      - id: 8
        name: room_type
        label: Room Type
