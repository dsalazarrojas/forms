        type: select_one
        options:
          - Excellent
          - Good
          - Needs Attention
          - Poor
        required: true
      - id: 12
        name: ceiling_condition
        label: Ceiling Condition
        hint: Condition of ceiling
        type: select_one
        options:
          - Excellent
          - Good
          - Needs Attention
          - Poor
        required: true
      - id: 13
        name: furniture_condition
        label: Furniture Condition
        hint: Condition of all furniture
        type: select_one
        options:
          - Excellent
          - Good
          - Needs Attention
