inputSchema:
  type: object
  properties:
    title: Brand Packaging Prototype Order Form
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Legal name of your company
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Person Name
      hint: Primary contact for this order
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Email for order communications
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Phone number for order questions
      type: text
      options: []
      required: true
    - id: 5
      name: product_type
      label: Product Type
      hint: What product needs packaging
      type: select_one
      options:
      - Food or Beverage
      - Cosmetics or Beauty
      - Electronics
      - Clothing or Apparel
      - Home Goods
      - Health Supplements
      - Toys or Games
      - Other
      required: true
    - id: 6
      name: packaging_type
      label: Packaging Type
      hint: What type of packaging do you need
      type: select_one
      options:
      - Box
      - Bottle or Jar
      - Pouch or Bag
      - Tube
      - Blister Pack
      - Can or Tin
      - Custom Shape
      required: true
    - id: 7
      name: prototype_quantity
      label: Prototype Quantity
      hint: How many prototypes do you need
      type: select_one
      options:
      - 1-5 units
      - 6-10 units
      - 11-25 units
      - 26-50 units
      - 51-100 units
      required: true
    - id: 8
      name: material_preference
      label: Material Preference
      hint: Preferred packaging material
      type: select_one
      options:
      - Cardboard
      - Plastic
      - Glass
      - Metal
      - Biodegradable
      - Recycled Materials
      - No Preference
      required: true
    - id: 9
      name: dimensions_length
      label: Package Length
      hint: Length in inches or cm
      type: number
      options: []
      required: true
    - id: 10
      name: dimensions_width
      label: Package Width
      hint: Width in inches or cm
      type: number
      options: []
      required: true
    - id: 11
      name: dimensions_height
      label: Package Height
      hint: Height in inches or cm
      type: number
      options: []
      required: true
    - id: 12
      name: color_requirements
      label: Color Requirements
      hint: Specific colors or finishes needed
      type: text
      options: []
      required: false
    - id: 13
      name: printing_requirements
      label: Printing Requirements
      hint: What needs to be printed on packaging
      type: select_multiple
      options:
      - Logo Only
      - Full Color Design
      - Text Only
      - Barcode
      - Ingredients List
      - Warning Labels
      - None
      required: true
    - id: 14
      name: special_features
      label: Special Features
      hint: Any special packaging features
      type: select_multiple
      options:
      - Window Cutout
      - Embossing
      - Foil Stamping
      - Spot UV
      - Magnetic Closure
      - Tear Strip
      - Child-Resistant
      - Tamper-Evident
      required: false
    - id: 15
      name: design_files_ready
      label: Are Design Files Ready
      hint: Do you have artwork prepared
      type: select_one
      options:
      - Yes, Files Ready
      - Working on Designs
      - Need Design Help
      required: true
    - id: 16
      name: deadline_date
      label: Required Delivery Date
      hint: When do you need prototypes
      type: date
      options: []
      required: true
    - id: 17
      name: shipping_address
      label: Shipping Address
      hint: Full delivery address
      type: text
      options: []
      required: true
    - id: 18
      name: budget_estimate
      label: Budget Estimate
      hint: Expected budget range
      type: select_one
      options:
      - Under $500
      - $500 to $1,000
      - $1,000 to $2,500
      - $2,500 to $5,000
      - $5,000+
      required: true
    - id: 19
      name: additional_specifications
      label: Additional Specifications
      hint: Any other requirements or notes
      type: text
      options: []
      required: false
