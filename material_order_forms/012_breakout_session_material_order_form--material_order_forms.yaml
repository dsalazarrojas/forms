inputSchema:
  type: object
  properties:
    title: Breakout Session Material Order Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: Name of the conference or meeting
      type: text
      options: []
      required: true
    - id: 2
      name: session_title
      label: Breakout Session Title
      hint: Title of your breakout session
      type: text
      options: []
      required: true
    - id: 3
      name: session_date
      label: Session Date and Time
      hint: When is your session scheduled
      type: date
      options: []
      required: true
    - id: 4
      name: facilitator_name
      label: Facilitator or Organizer Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 5
      name: facilitator_email
      label: Facilitator Email
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 6
      name: facilitator_phone
      label: Facilitator Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: false
    - id: 7
      name: expected_attendance
      label: Expected Number of Participants
      hint: How many people will attend
      type: number
      options: []
      required: true
    - id: 8
      name: session_location
      label: Session Location/Room
      hint: Where will the session be held
      type: text
      options: []
      required: true
    - id: 9
      name: session_format
      label: Session Format
      hint: Type of session
      type: select_one
      options:
      - Workshop
      - Panel discussion
      - Presentation with Q&A
      - Hands-on training
      - Group discussion
      - Problem-solving activity
      - Other
      required: true
    - id: 10
      name: material_categories
      label: Material Categories Needed
      hint: Select all material types you need
      type: select_multiple
      options:
      - Printed handouts
      - Workbooks or notebooks
      - Markers and pens
      - Flipcharts and easels
      - Whiteboards
      - Projector supplies
      - Name badges
      - Table placards
      - Technical equipment
      required: true
    - id: 11
      name: handout_description
      label: Handout Materials Description
      hint: Describe printed materials needed
      type: text
      options: []
      required: false
    - id: 12
      name: handout_quantity
      label: Number of Handout Sets
      hint: How many copies needed
      type: number
      options: []
      required: false
    - id: 13
      name: interactive_materials
      label: Interactive Materials Needed
      hint: What materials for participant engagement
      type: text
      options: []
      required: false
    - id: 14
      name: av_equipment
      label: Audio Visual Equipment Needed
      hint: Select AV equipment requirements
      type: select_multiple
      options:
      - Projector
      - Screen or whiteboard
      - Microphone
      - Speakers
      - Video player
      - Internet connection
      - Video conferencing
      - None
      required: false
    - id: 15
      name: technology_setup
      label: Technology Setup Requirements
      hint: Any special technology needs
      type: text
      options: []
      required: false
    - id: 16
      name: supplies_list
      label: Additional Supplies List
      hint: Other materials you need
      type: text
      options: []
      required: false
    - id: 17
      name: budget_available
      label: Budget Available
      hint: Your material budget
      type: select_one
      options:
      - Under 100
      - 100 - 250
      - 250 - 500
      - 500 - 1000
      - 1000+
      required: false
    - id: 18
      name: delivery_date
      label: Required Delivery Date
      hint: When do you need materials
      type: date
      options: []
      required: true
    - id: 19
      name: special_requests
      label: Special Requests or Instructions
      hint: Any additional notes
      type: text
      options: []
      required: false
