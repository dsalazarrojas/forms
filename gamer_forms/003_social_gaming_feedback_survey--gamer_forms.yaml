inputSchema:
  type: object
  properties:
    title: Social Gaming Feedback Survey
    pages:
    - id: 1
      name: game_platforms
      label: Game platforms
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: gaming_frequency
      label: How often do you play games?
      hint: Please select all that apply
      type: select_one
      options:
      - Facebook Gaming
      - Xbox
      - PlayStation
      - Nintendo
      - Steam
      - Google Stadia
      - Mobile Devices
      - Other
      required: false
    - id: 3
      name: gaming_satisfaction
      label: How satisfied are you with your gaming experience?
      hint: On a scale of 1-5
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 4
      name: game_features
      label: What features would you like to see added to games?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: gaming_habits
      label: How often do you play games with friends or family?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: game_impressions
      label: How likely are you to recommend games to others?
      hint: On a scale of 1-5
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Not Likely
      - Not at all Likely
      required: false
