inputSchema:
  type: object
  properties:
    title: Game Save Load Form
    pages:
    - id: 1
      name: game_save_load_form
      label: Game Save/Load
      hint: null
      type: select_one
      options:
      - Save
      - Load
      required: false
    - id: 2
      name: game_id
      label: Game ID
      hint: Enter Game ID
      type: text
      options: []
      required: false
    - id: 3
      name: platform
      label: Platform
      hint: null
      type: select_multiple
      options:
      - PC
      - Console
      - Mobile
      required: false
    - id: 4
      name: game_status
      label: Status
      hint: null
      type: select_one
      options:
      - Saved
      - Loaded
      - Error
      required: false
    - id: 5
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
