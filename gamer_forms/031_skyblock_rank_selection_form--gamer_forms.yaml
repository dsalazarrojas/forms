      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
