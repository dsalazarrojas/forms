      - I do not accept to feature my gameplay on the platform.
      required: true
    - id: 5
      name: consent
      label: Consent
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: agreement
      label: Agreement
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: gamer_consent
      label: Gamer Consent
      hint: null
      type: number
      options: []
      required: true
