inputSchema:
  type: object
  properties:
    title: Safety Training Discharge Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: trainer_name
      label: Trainer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: training_hours
      label: Training Hours
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: training_session_topics
      label: Training Session Topics
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: training_session_notes
      label: Training Session Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: training_completed
      label: Training Completed
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: training_comments
      label: Training Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature
      hint: null
      type: text
      options: []
      required: false
