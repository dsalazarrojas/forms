    - id: 5
      name: dog_weight
      label: Dog Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: trainer_notes
      label: Trainer Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: owner_notes
