inputSchema:
  type: object
  properties:
    title: Sports Medicine Discharge Form
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: return_to_activity_instruction
      label: Return to Activity
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: physical_status
      label: Physical Status
      hint: null
      type: select_one
      options:
      - Active
      - Active with restriction
      - Non-Active
      - Non-Active with restriction
      - Unable to perform
      required: true
    - id: 4
      name: treatment_plan
      label: Treatment Plan
      hint: null
      type: select_one
      options:
      - None
      - Rest and Ice
      - Stretching and Mobilization
      - Activity modification
      - Activity cessation
      - Other
      required: true
    - id: 5
      name: medication
      label: Medication
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: discharge_instructions
      label: Discharge Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: follow_up_appointments
      label: Follow-up Appointments
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - Not scheduled
      required: true
    - id: 8
      name: patient_information
      label: Patient Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: medical_notes
      label: Medical Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: athletic_injury_report
      label: Athletic Injury Report
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: other_injury_report
      label: Other Injury Report
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: concussion_protocol
      label: Concussion Protocol
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not required
      required: true
    - id: 14
      name: injury_type
      label: Injury Type
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: symptoms
      label: Symptoms
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: treatment_location
      label: Treatment Location
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: provider_signature
      label: Provider Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: staff_signature
      label: Staff Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: patient_signature
      label: Patient Signature
      hint: null
      type: text
      options: []
      required: true
