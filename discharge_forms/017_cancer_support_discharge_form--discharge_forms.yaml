inputSchema:
  type: object
  properties:
    title: Cancer Support Discharge Form
    pages:
    - id: 1
      name: patient_discharge_section
      label: -- Patient Discharge Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Full Name
      hint: As registered in the support program
      type: text
      options: []
      required: true
    - id: 3
      name: dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: mrn
      label: Medical Record Number
      hint: To link this to the medical history
      type: text
      options: []
      required: true
    - id: 5
      name: discharge_date
      label: Discharge Date
      hint: Effective date of leaving the program
      type: date
      options: []
      required: true
    - id: 6
      name: discharge_reason
      label: Reason for Discharge
      hint: Why is the patient leaving the program now
      type: select_one
      options:
      - Program Completion
      - Patient Choice
      - Relocation
      - Medical Condition
      - Other
      required: true
    - id: 7
      name: program_summary_section
      label: -- Program Summary --
      hint: Highlights of the patient's journey
      type: note
      options: []
      required: false
    - id: 8
      name: services_provided
      label: Primary Support Services Provided
      hint: Select all that were utilized
      type: select_multiple
      options:
      - Counseling
      - Nutritional Support
      - Physical Therapy
      - Support Group
      - Financial Assistance
      - Other
      required: true
    - id: 9
      name: progress_summary
      label: Summary of Progress
      hint: Briefly describe the patient's outcomes and goals met
      type: text
      options: []
      required: true
    - id: 10
      name: follow_up_section
      label: -- Follow-up Guidance --
      hint: What comes next for the patient
      type: note
      options: []
      required: false
    - id: 11
      name: recommended_steps
      label: Recommended Next Steps
      hint: Choose appropriate ongoing care
      type: select_multiple
      options:
      - Community Support
      - Private Therapy
      - Oncology Follow-up
      - Wellness Program
      - None Required
      required: true
    - id: 12
      name: follow_up_date
      label: Follow-up Appointment Date
      hint: If already scheduled
      type: date
      options: []
      required: false
    - id: 13
      name: follow_up_clinician
      label: Clinician for Follow-up
      hint: The name of the next primary provider
      type: text
      options: []
      required: false
    - id: 14
      name: home_routine_instructions
      label: Prescribed Home Exercises or Routine
      hint: Specific tasks for the patient at home
      type: text
      options: []
      required: false
    - id: 15
      name: confirmation_section
      label: -- Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: clinician_name
      label: Discharging Clinician Name
      hint: Your name for the official record
      type: text
      options: []
      required: true
    - id: 17
      name: clinician_sign_date
      label: Clinician Signature Date
      hint: null
      type: date
      options: []
      required: true
    - id: 18
      name: patient_ack
      label: Patient or Guardian Acknowledgment
      hint: Confirm the patient has received all documentation
      type: select_one
      options:
      - I have received the discharge instructions
      - I have questions before discharge
      required: true
    - id: 19
      name: program_feedback
      label: Patient Feedback on Program
      hint: What did the patient think of the support received
      type: text
      options: []
      required: false
    - id: 20
      name: overall_program_satisfaction
      label: Overall satisfaction rating
      hint: 1 to 5 stars
      type: number
      options: []
      required: true
