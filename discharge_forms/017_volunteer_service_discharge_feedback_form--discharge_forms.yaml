inputSchema:
  type: object
  properties:
    title: Volunteer Service Discharge Feedback Form
    pages:
    - id: 1
      name: volunteer_service_discharge_form
      label: Volunteer Feedback
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: discharge_date
      label: Discharge Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: service_name
      label: Service Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: reasons_for_discharge
      label: Reasons for Discharge
      hint: Please select multiple reasons
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: assigned_to
      label: Assigned to
      hint: Name of staff member assigned to handle this feedback
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: contact_email
      label: Contact Email
      hint: Contact email for the assigned staff member
      type: email
      options: []
      required: true
    - id: 9
      name: contact_phone
      label: Contact Phone
      hint: Contact phone number for the assigned staff member
      type: text
      options: []
      required: true
    - id: 10
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
