inputSchema:
  type: object
  properties:
    title: Library Materials Discharge Form
    pages:
    - id: 1
      name: item_number
      label: Item Number
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: item_type
      label: Item Type
      hint: null
      type: select_one
      options:
      - book
      - DVD
      - Other
      required: false
    - id: 3
      name: item_status
      label: Item Status
      hint: null
      type: select_multiple
      options:
      - Available
      - Checked Out
      - Damaged
      - Lost
      - Restricted
      required: false
    - id: 4
      name: reason_for_discharge
      label: Reason for Discharge
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_removal
      label: Date of Removal
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: removal_by
      label: Removed by
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: remarks
      label: Remarks
      hint: null
      type: text
      options: []
      required: false
