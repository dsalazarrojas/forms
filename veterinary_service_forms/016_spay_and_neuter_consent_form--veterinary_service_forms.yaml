inputSchema:
  type: object
  properties:
    title: Spay And Neuter Consent Form
    pages:
    - id: 1
      name: owner_consent
      label: owner_consent
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: owner_phone
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: owner_email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: signature
      label: owner_signature
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: signature_date
      label: date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: signature_notary
      label: signed_by
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: veterinarian_signature
      label: vet_signature
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: veterinarian_name
      label: vet_name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: clinic_name
      label: clinic_name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: spay_neuter_date
      label: spay_neuter_date
      hint: null
      type: date
      options: []
      required: false
