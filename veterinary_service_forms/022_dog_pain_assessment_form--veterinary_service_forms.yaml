      options: []
      required: false
    - id: 6
      name: pain_type
      label: pain_type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: pain_description
      label: pain_description
      hint: null
      type: text
      options: []
      required: false
