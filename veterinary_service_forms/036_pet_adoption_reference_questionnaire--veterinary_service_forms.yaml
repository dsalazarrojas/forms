inputSchema:
  type: object
  properties:
    title: Pet Adoption Reference Questionnaire
    pages:
    - id: 1
      name: pet_type
      label: Pet Type
      hint: null
      type: select_one
      options:
      - Pet
      - Service Animal
      - Other
      required: false
    - id: 2
      name: adoption_reason
      label: Adoption Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: pet_type_other
      label: Other Pet Type
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: pet_type_service_animal
      label: Service Animal
      hint: null
      type: select_multiple
      options:
      - Service Animal 1
      - Service Animal 2
      - Service Animal 3
      required: false
    - id: 8
      name: pet
      label: Pet
      hint: null
      type: text
      options: []
      required: false
