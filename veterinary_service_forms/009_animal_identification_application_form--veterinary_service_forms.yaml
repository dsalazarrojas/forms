inputSchema:
  type: object
  properties:
    title: Animal Identification Application Form
    pages:
    - id: 1
      name: section_owner_info
      label: -- Owner Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: owner_full_name
      label: Owner Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: mailing_address
      label: Mailing Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: primary_phone
      label: Primary Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: owner_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: section_animal_id
      label: -- Animal Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: identification_type
      label: Identification Type
      hint: null
      type: select_one
      options:
      - Microchip
      - Ear Tag
      - Tattoo
      - Radio Collar
      - Leg Band
      required: true
    - id: 8
      name: id_number
      label: Identification ID Number
      hint: Enter the full numeric or alphanumeric ID
      type: text
      options: []
      required: true
    - id: 9
      name: animal_sex
      label: Animal Sex
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Neutered Male
      - Spayed Female
      required: true
    - id: 10
      name: primary_breed
      label: Primary Breed
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: animal_age_dob
      label: Date of Birth or Approximate Age
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: distinctive_markings
      label: Distinctive Markings
      hint: Scars, spots, color patterns
      type: text
      options: []
      required: false
    - id: 13
      name: photo_upload_agreement
      label: I agree to provide a current photo if requested
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
