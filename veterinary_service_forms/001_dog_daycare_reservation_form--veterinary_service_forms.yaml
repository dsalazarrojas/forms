inputSchema:
  type: object
  properties:
    title: Dog Daycare Reservation Form
    pages:
    - id: 1
      name: reservation_date
      label: Reservation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: pet_name
      label: Pet Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: pet_type
      label: Pet Type
      hint: null
      type: select_one
      options:
      - Cat
      - Dog
      - Other
      required: false
    - id: 5
      name: reservation_time
      label: Reservation Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: services
      label: Services
      hint: null
      type: select_multiple
      options:
      - Daycare
      - Boarding
      - Grooming
      required: false
    - id: 9
      name: special_instructions
      label: Special Instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: reservation_status
      label: Reservation Status
      hint: null
      type: select_one
      options:
      - Pending
      - Confirmed
      - Cancelled
      required: false
