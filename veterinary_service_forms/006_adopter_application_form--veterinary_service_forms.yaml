inputSchema:
  type: object
  properties:
    title: Adopter Application Form
    pages:
    - id: 1
      name: section_applicant_details
      label: -- Applicant Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 3
      name: primary_phone
      label: Primary Phone
      hint: Best number to reach you during business hours
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: household_income_range
      label: Household Income Range
      hint: This helps us ensure the pet will receive proper care
      type: text
      options: []
      required: false
    - id: 6
      name: section_pet_compatibility
      label: -- Pet Compatibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: species_interested_in
      label: Species Interested In
      hint: Select the type of animal you wish to adopt
      type: select_one
      options:
      - Canine
      - Feline
      - Equine
      - Other
      required: true
    - id: 8
      name: activity_level_preference
      label: Activity Level Preference
      hint: What kind of energy level are you looking for?
      type: select_multiple
      options:
      - High energy
      - Moderate energy
      - Low energy -- Senior
      required: true
    - id: 9
      name: outdoor_access
      label: Outdoor Access
      hint: What kind of outdoor space will the pet have?
      type: select_one
      options:
      - Secure yard
      - Balcony only
      - Public parks
      - None
      required: true
    - id: 10
      name: section_veterinary_info
      label: -- Veterinary Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: current_veterinarian_name
      label: Current Veterinarian Name
      hint: If you currently have pets
      type: text
      options: []
      required: false
    - id: 12
      name: vet_phone_number
      label: Vet Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: permission_to_contact_vet
      label: Permission to Contact Vet
      hint: Do we have permission to verify your pet care history?
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 14
      name: are_current_pets_vaccinated
      label: Are Current Pets Vaccinated
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: false
    - id: 15
      name: reason_for_rehoming_previous_pets_if_any
      label: Reason for Rehoming Previous Pets if Any
      hint: If you have ever given up a pet, please explain why
      type: text
      options: []
      required: false
