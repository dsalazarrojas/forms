inputSchema:
  type: object
  properties:
    title: Veterinary Product Sample Request Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: jimmy@example.com
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: product_category
      label: Product Category
      hint: null
      type: select_one
      options:
      - Pet Food
      - Veterinary Equipment
      - Pharmaceuticals
      required: false
    - id: 5
      name: sample_type
      label: Sample Type
      hint: null
      type: select_multiple
      options:
      - Sample 1
      - Sample 2
      - Sample 3
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: agreement
      label: Agreement
      hint: null
      type: text
      options: []
      required: false
