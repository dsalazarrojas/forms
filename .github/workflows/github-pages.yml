name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: |
          npm install -g pagefind

      - name: Install Python deps
        run: pip install pyyaml

      - name: Build forms index
        run: |
          echo "Generating forms-index.json..."
          python3 << 'PYTHON_SCRIPT'
import json
import os
import yaml
from pathlib import Path
from datetime import datetime

SKIP_DIRS = {'docs', 'audit', 'other', '.git', '.github', 'tools', 'node_modules'}
forms = []
skipped = 0

for category_path in sorted(Path('.').iterdir()):
    if not category_path.is_dir():
        continue
    category = category_path.name
    if category in SKIP_DIRS or category.startswith('.'):
        continue
    for yaml_file in sorted(category_path.glob('*.yaml')):
        try:
            with open(yaml_file, 'r', encoding='utf-8') as f:
                data = yaml.safe_load(f)
            if not data or 'inputSchema' not in data:
                skipped += 1
                continue
            props = data['inputSchema'].get('properties', {})
            title_raw = props.get('title', yaml_file.stem)
            pages = props.get('pages', [])
            lang = data.get('language', 'en')
            question_types = list(set(p.get('type', 'text') for p in pages if p.get('type') != 'note'))
            has_xlsx = (category_path / (yaml_file.stem + '.xlsx')).exists()
            forms.append({
                'id': yaml_file.stem,
                'title': str(title_raw),
                'category': category,
                'filePath': f'{category}/{yaml_file.name}',
                'xlsxPath': f'{category}/{yaml_file.stem}.xlsx',
                'questionCount': len(pages),
                'language': lang,
                'questionTypes': question_types,
                'hasXlsForm': has_xlsx
            })
        except Exception:
            skipped += 1
os.makedirs('docs', exist_ok=True)
index = {'generatedAt': datetime.now().isoformat(), 'totalForms': len(forms), 'forms': forms}
with open('docs/forms-index.json', 'w', encoding='utf-8') as f:
    json.dump(index, f, separators=(',', ':'))
print(f"Generated {len(forms)} forms, skipped {skipped}")
PYTHON_SCRIPT

      - name: Run Pagefind
        run: |
          npx pagefind --site docs --output-subdir pagefind

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
