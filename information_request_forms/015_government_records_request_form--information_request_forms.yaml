inputSchema:
  type: object
  properties:
    title: Government Records Request Form
    pages:
    - id: 1
      name: request_details
      label: What is the nature of this request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: records_type
      label: Type of Records
      hint: null
      type: select_one
      options:
      - Public
      - Confidential
      - Restricted
      required: false
    - id: 8
      name: records_location
      label: Records Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: requestor_message
      label: Additional Message
      hint: null
      type: text
      options: []
      required: false
