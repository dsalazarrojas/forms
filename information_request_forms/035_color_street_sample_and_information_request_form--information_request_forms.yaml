inputSchema:
  type: object
  properties:
    title: Color Street Sample And Information Request Form
    pages:
      - id: 1
        name: header
        label: -- Sample Request --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: requester_name
        label: Requester name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 3
        name: contact_email
