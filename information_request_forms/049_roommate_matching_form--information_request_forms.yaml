      - Condo
      - Townhouse
      - Other
      required: false
    - id: 12
      name: preferred_location
      label: Preferred Location
      hint: null
      type: select_one
      options:
      - City
      - Suburbs
      - Rural
      required: false
    - id: 13
      name: smoking
      label: Smokes
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: pets
      label: Pets
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
