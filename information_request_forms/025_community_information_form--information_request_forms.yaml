inputSchema:
  type: object
  properties:
    title: Community Information Form
    pages:
    - id: 1
      name: info_request_header
      label: -- Information Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Full name of person requesting information
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: If requesting on behalf of a group
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact email
      hint: For sending requested information
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: Optional contact number
      type: text
      options: []
      required: false
    - id: 6
      name: information_requested
      label: Information requested
      hint: Describe the information you need
      type: text
      options: []
      required: true
    - id: 7
      name: preferred_format
      label: Preferred format for response
      hint: How you would like to receive the information
      type: select_one
      options:
      - Email document
      - Printed copy
      - Phone call
      - In person meeting
      required: true
    - id: 8
      name: urgency_level
      label: Urgency level
      hint: Indicate how soon you need the information
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 9
      name: additional_details
      label: Additional details
      hint: Any context to help locate the information
      type: text
      options: []
      required: false
    - id: 10
      name: consent_to_store
      label: Consent to store request details
      hint: Consent to retain contact and request information
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
