inputSchema:
  type: object
  properties:
    title: Extend Warranty Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_id
      label: Product ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: product_type
      label: Product Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: product_type_other
      label: Product Type (Other)
      hint: Enter your product type
      type: text
      options: []
      required: false
    - id: 5
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: customer_company
      label: Customer Company
      hint: null
      type: text
      options: []
      required: false
