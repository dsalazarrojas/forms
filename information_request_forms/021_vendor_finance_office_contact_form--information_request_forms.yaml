inputSchema:
  type: object
  properties:
    title: Vendor Finance Office Contact Form
    pages:
    - id: 1
      name: vendor_name
      label: Vendor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: finance_team_member
      label: Finance Team Member
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Jimmy''}'
      - '{''id'': 2, ''name'': ''Jane''}'
      - '{''id'': 3, ''name'': ''John''}'
      required: true
    - id: 5
      name: finance_department
      label: Finance Department
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''Accounting''}'
      - '{''id'': 2, ''name'': ''Accounts Payable''}'
      - '{''id'': 3, ''name'': ''Budgeting''}'
      required: false
    - id: 6
      name: inquiry_type
      label: Inquiry Type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Request for Payment''}'
      - '{''id'': 2, ''name'': ''Credit Inquiry''}'
      - '{''id'': 3, ''name'': ''Other''}'
      required: true
    - id: 7
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
