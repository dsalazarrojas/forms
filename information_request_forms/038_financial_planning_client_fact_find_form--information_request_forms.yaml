inputSchema:
  type: object
  properties:
    title: Financial Planning Client Fact Find Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: birth_date
      label: Birth date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: employment_status
      label: Employment status
      hint: null
      type: select_one
      options:
      - Married
      - Single
      - Separated
      - Divorced
      - Widowed
      required: false
    - id: 7
      name: employment_type
      label: Employment type
      hint: null
      type: select_one
      options:
      - Full time
      - Part time
      - Contract
      - Retiree
      - Student
      - Unemployed
      required: false
    - id: 8
      name: household_occupation
      label: Household occupation
      hint: null
      type: select_multiple
      options:
      - Business Owner
      - Employee
      - Student
      - Homemaker
      - Military
      - Unemployed
      required: false
    - id: 9
      name: dependents
      label: Dependents
      hint: null
      type: number
      options: []
      required: false
