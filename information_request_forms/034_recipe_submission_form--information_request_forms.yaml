inputSchema:
  type: object
  properties:
    title: Recipe Submission Form
    pages:
    - id: 1
      name: recipe_name
      label: What is the recipe name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: description
      label: How would you describe your recipe?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: cooking_time
      label: How long does it take to cook this recipe?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: cooking_temp
      label: What is the cooking temperature?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: ingredients
      label: List all the ingredients used in this recipe.
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: method
      label: Describe the cooking method.
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: tags
      label: What are the tags for this recipe?
      hint: null
      type: select_one
      options:
      - Tag 1
      - Tag 2
      required: true
    - id: 8
      name: submitters_details
      label: What is your name and contact information?
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: file
      label: What file (e.g., image, video) do you want to attach to this recipe?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: notes
      label: Do you have any notes about this recipe?
      hint: null
      type: text
      options: []
      required: false
