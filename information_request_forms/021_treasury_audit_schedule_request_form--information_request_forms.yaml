inputSchema:
  type: object
  properties:
    title: Treasury Audit Schedule Request Form
    pages:
    - id: 1
      name: preferred_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: date_range
      label: Date Range
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: supporting_documents
      label: Supporting Documents
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: audit_details
      label: Audit Details
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: audit_type
      label: Audit Type
      hint: null
      type: select_one
      options:
      - Financial
      - Compliance
      required: true
    - id: 8
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: audit_location
      label: Audit Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: preferred_contact
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Mail
      required: false
    - id: 11
      name: audit_attachment
      label: Audit Attachment
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 12
      name: attachment_documents
      label: Attachment Documents
      hint: null
      type: text
      options: []
      required: false
