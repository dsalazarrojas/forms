inputSchema:
  type: object
  properties:
    title: Information Gathering Questionnaire
    pages:
    - id: 1
      name: page1
      label: First Section
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_details
      label: Contact Details
      hint: null
      type: select_multiple
      options:
      - email
      - phone
      - postal
      required: false
    - id: 3
      name: satisfaction_feedback
      label: Satisfaction Feedback
      hint: null
      type: select_one
      options:
      - highly satisfied
      - moderately satisfied
      - not satisfied
      required: false
