inputSchema:
  type: object
  properties:
    title: Education Content Distribution Request Form
    pages:
    - id: 1
      name: education_content_distribution_request_form
      label: School Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: education_content_type
      label: Content Type
      hint: null
      type: select_one
      options:
      - Video
      - Audio
      - Document
      required: true
    - id: 3
      name: training_needs_assessment
      label: Training Needs Assessment
      hint: null
      type: select_multiple
      options:
      - Needs Assessment
      - Needs Analysis
      - Needs Analysis and Assessment
      required: true
    - id: 4
      name: content_requests
      label: Content Requests
      hint: null
      type: select_multiple
      options:
      - Request 1
      - Request 2
      - Request 3
      required: true
    - id: 5
      name: content_distribution_request
      label: Content Distribution Request
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_information
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Phone and Email
      required: true
    - id: 7
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: form_completed_by
      label: Form Completed By
      hint: null
      type: select_one
      options:
      - Form Completed By
      - Not Given
      required: false
    - id: 9
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: form_submitted_at
      label: Form Submitted At
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
