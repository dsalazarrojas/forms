inputSchema:
  type: object
  properties:
    title: Adult Personal Analysis Questionnaire
    pages:
    - id: 1
      name: introduction
      label: -- Personal Analysis --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: preferred_contact
      label: Preferred contact method
      hint: Email or phone
      type: select_one
      options:
      - Email
      - Phone
      - None
      required: false
    - id: 4
      name: personality_traits
      label: Dominant personality traits
      hint: Select all that apply
      type: select_multiple
      options:
      - Introvert
      - Extrovert
      - Analytical
      - Creative
      - Practical
      required: false
    - id: 5
      name: strengths
      label: Key strengths
      hint: Describe top 3 strengths
      type: text
      options: []
      required: false
    - id: 6
      name: development_areas
      label: Areas for development
      hint: Describe personal growth goals
      type: text
      options: []
      required: false
    - id: 7
      name: career_interest
      label: Career interests
      hint: Field or industry of interest
      type: text
      options: []
      required: false
    - id: 8
      name: assessment_date
      label: Assessment date
      hint: Date of completion
      type: date
      options: []
      required: true
    - id: 9
      name: follow_up
      label: Interested in follow up assessment
      hint: Select yes to request follow up
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
