inputSchema:
  type: object
  properties:
    title: Book Estimate Request Form
    pages:
    - id: 1
      name: client_full_name
      label: Full Name
      hint: Your complete name
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Email Address
      hint: We will send the estimate to this email
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Phone Number
      hint: Your contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Name of your business (if applicable)
      type: text
      options: []
      required: false
    - id: 5
      name: project_description
      label: Describe the Work Needed
      hint: Please provide details about the services or work you need
      type: text
      options: []
      required: true
    - id: 6
      name: project_scope
      label: Project Scope
      hint: What is the size and complexity of your project
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - Complex
      required: true
    - id: 7
      name: desired_timeline
      label: Desired Timeline
      hint: When do you need this work completed
      type: select_one
      options:
      - Urgent (1-2 weeks)
      - Standard (1-2 months)
      - Flexible
      - No specific deadline
      required: true
    - id: 8
      name: budget_range
      label: Budget Range
      hint: Your approximate budget for this project
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000+
      - Not determined
      required: false
    - id: 9
      name: attachment_files
      label: Attach Reference Materials
      hint: Upload any files relevant to your estimate request
      type: text
      options: []
      required: false
    - id: 10
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How would you prefer we contact you
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      required: true
