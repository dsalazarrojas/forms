      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: user_address
      label: User Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: upload_proof
      label: Proof
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: upload_evidence
      label: Evidence
      hint: null
      type: text
      options: []
      required: true
