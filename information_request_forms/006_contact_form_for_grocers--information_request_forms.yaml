inputSchema:
  type: object
  properties:
    title: Contact Form For Grocers
    pages:
    - id: 1
      name: section_header
      label: -- Customer or Vendor Inquiry --
      hint: Indicate whether you are a customer or vendor
      type: note
      options: []
      required: false
    - id: 2
      name: contact_type
      label: Contact type
      hint: Select which best describes you
      type: select_one
      options:
      - Customer
      - Vendor
      - Partner
      - Other
      required: true
    - id: 3
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 4
      name: business_name
      label: Business or store name
      hint: For vendor or partner inquiries
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email address
      hint: Best email for follow up
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone number
      hint: Optional contact number
      type: text
      options: []
      required: false
    - id: 7
      name: products_interested_in
      label: Products interested in
      hint: For vendor inquiries list product categories
      type: text
      options: []
      required: false
    - id: 8
      name: preferred_contact_method
      label: Preferred contact method
      hint: How should we reach you
      type: select_one
      options:
      - Email
      - Phone
      - In-person meeting
      required: false
    - id: 9
      name: order_or_issue_reference
      label: Order or issue reference
      hint: Provide order number or describe issue
      type: text
      options: []
      required: false
    - id: 10
      name: attachment_note
      label: Attach supporting documents via email
      hint: For product specs or invoices use email
      type: note
      options: []
      required: false
    - id: 11
      name: inquiry_details
      label: Inquiry details
      hint: Provide as much detail as possible
      type: text
      options: []
      required: true
    - id: 12
      name: store_location
      label: Store location
      hint: City or branch if applicable
      type: text
      options: []
      required: false
    - id: 13
      name: follow_up_needed
      label: Follow up needed
      hint: Do you want someone to contact you
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
