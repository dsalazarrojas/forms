inputSchema:
  type: object
  properties:
    title: Dispatch Instruction Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: item_info
      label: Item Information
      hint: null
      type: text
      options: []
      required: false
