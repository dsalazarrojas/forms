      hint: The date the customer is expecting the items to arrive.
      type: date
      options: []
      required: false
    - id: 4
      name: delivery_time
      label: Delivery Time
      hint: The time of day the customer is expecting the items to arrive.
      type: time
      options: []
      required: false
    - id: 5
      name: delivery_address
      label: Delivery Address
      hint: The address to deliver the items to.
      type: text
      options: []
      required: false
    - id: 6
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
