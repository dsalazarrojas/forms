      name: business_signature
      label: Business Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: delivery_instructions
      label: Delivery Instructions
      hint: Specific instructions to be included in the delivery.
      type: text
      options: []
      required: false
    - id: 14
      name: customer_confirmation
      label: Customer Confirmation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 15
      name: business_confirmation
      label: Business Confirmation
      hint: null
      type: select_one
