inputSchema:
  type: object
  properties:
    title: Contact Information Update Form
    pages:
    - id: 1
      name: form_title
      label: Contact Information Update Form
      hint: Update your contact details
      type: note
      options: []
      required: false
    - id: 2
      name: student_first_name
      label: Student First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 3
      name: student_last_name
      label: Student Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 4
      name: student_id
      label: Student ID Number
      hint: Student identification number
      type: text
      options: []
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - Kindergarten
      - Grade 1
      - Grade 2
      - Grade 3
      - Grade 4
      - Grade 5
      - Grade 6
      - Grade 7
      - Grade 8
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      required: true
    - id: 6
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 7
      name: relationship
      label: Relationship to Student
      hint: Your relationship
      type: select_one
      options:
      - Mother
      - Father
      - Guardian
      - Grandparent
      - Other
      required: true
    - id: 8
      name: home_phone
      label: Home Phone Number
      hint: Home contact
      type: text
      options: []
      required: false
    - id: 9
      name: mobile_phone
      label: Mobile Phone Number
      hint: Cell phone
      type: text
      options: []
      required: true
    - id: 10
      name: work_phone
      label: Work Phone Number
      hint: Work contact
      type: text
      options: []
      required: false
    - id: 11
      name: email_address
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 12
      name: secondary_email
      label: Secondary Email Address
      hint: Backup email
      type: email
      options: []
      required: false
    - id: 13
      name: home_address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 14
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 15
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 16
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 17
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Emergency contact
      type: text
      options: []
      required: true
    - id: 18
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency number
      type: text
      options: []
      required: true
    - id: 19
      name: update_type
      label: Type of Update
      hint: What are you updating
      type: select_multiple
      options:
      - Phone Numbers
      - Email Addresses
      - Home Address
      - Emergency Contact
      - All of the Above
      required: true
    - id: 20
      name: additional_notes
      label: Additional Notes
      hint: Any other updates
      type: text
      options: []
      required: false
