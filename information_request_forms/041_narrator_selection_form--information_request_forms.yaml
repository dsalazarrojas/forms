inputSchema:
  type: object
  properties:
    title: Narrator Selection Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: select_narrator
      label: Select a Narrator
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      - Jim Smith
      required: false
    - id: 6
      name: select_narrators
      label: Select Multiple Narrators
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - Jim Smith
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: confirm_narrator
      label: Confirm Narrator
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
