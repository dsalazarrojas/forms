inputSchema:
  type: object
  properties:
    title: Institutional Collaboration Framework Request Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: partner_institution
      label: Partner Institution
      hint: Select multiple institutions
      type: select_multiple
      options:
      - University of California, Berkeley
      - Stanford University
      - University of Michigan
      required: true
    - id: 3
      name: objectives
      label: Objectives
      hint: Describe your collaboration objectives
      type: text
      options: []
      required: false
    - id: 4
      name: scope
      label: Scope
      hint: Describe the scope of your collaboration
      type: text
      options: []
      required: false
    - id: 5
      name: timeline
      label: Timeline
      hint: Provide a rough timeline for your collaboration
      type: time
      options: []
      required: false
    - id: 6
      name: budget
      label: Budget
      hint: What is your budget for this collaboration?
      type: number
      options: []
      required: false
    - id: 7
      name: partner_contacts
      label: Partner Contacts
      hint: Select multiple partner contacts
      type: select_multiple
      options:
      - John Doe (123-456-7890)
      - Jane Doe (098-765-4321)
      required: true
    - id: 8
      name: submission
      label: Submission
      hint: How do you plan to submit your proposal?
      type: select_one
      options:
      - Form submission
      - Email submission
      - Both
      required: true
    - id: 9
      name: additional_info
      label: Additional information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: review
      label: Review
      hint: Will you like to review your submission again?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: agreement
      label: Agreement
      hint: Please agree to our terms of service and user agreement.
      type: select_one
      options:
      - I have read and agreed
      - I have not read and not agreed
      required: true
    - id: 12
      name: file_uploads
      label: File Uploads
      hint: Select multiple file uploads
      type: select_multiple
      options:
      - file1
      - file2
      - file3
      required: true
    - id: 13
      name: signature
      label: Signature
      hint: null
      type: select_one
      options:
      - I have read and signed
      - I have not read and not signed
      required: true
    - id: 14
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: false
    - id: 15
      name: confirm
      label: Confirmation
      hint: Confirm your submission
      type: select_one
      options:
      - I confirm
      - I do not confirm
      required: false
    - id: 16
      name: signature_date
      label: Signature Date
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: signature_time
      label: Signature Time
      hint: null
      type: time
      options: []
      required: false
    - id: 18
      name: signature_location
      label: Signature Location
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: signature_ip
      label: Signature IP
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: signature_browser
      label: Browser
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: signature_os
      label: Operating System
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: signature_device
      label: Device
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: signature_notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: form_id
      label: Form ID
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
