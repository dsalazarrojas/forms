      - General
      - Express
      - Local
      - Intermodal
      required: false
    - id: 5
      name: pickup_date
      label: pickup_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: load_weight
      label: load_weight
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: load_size
      label: load_size
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: load_description
      label: load_description
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: load_details
      label: load_details
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_info
      label: additional_info
      hint: null
      type: text
      options: []
      required: false
