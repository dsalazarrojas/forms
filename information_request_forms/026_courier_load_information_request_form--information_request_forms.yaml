inputSchema:
  type: object
  properties:
    title: Courier Load Information Request Form
    pages:
    - id: 1
      name: load_information_request
      label: Load Information Request
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: pickup_location
      label: pickup_location
      hint: null
      type: select_one
      options:
      - New York
      - Chicago
      - Los Angeles
      - San Francisco
      required: false
    - id: 3
      name: dropoff_city
      label: dropoff_city
      hint: null
      type: select_multiple
