inputSchema:
  type: object
  properties:
    title: Bank Statement Access Request Form
    pages:
    - id: 1
      name: account_holder_name
      label: Account Holder Full Name
      hint: Legal name on account
      type: text
      options: []
      required: true
    - id: 2
      name: account_holder_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: account_holder_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: account_holder_address
      label: Mailing Address
      hint: Street, city, state, ZIP
      type: text
      options: []
      required: true
    - id: 5
      name: account_number
      label: Account Number
      hint: Full account number
      type: text
      options: []
      required: true
    - id: 6
      name: account_type
      label: Account Type
      hint: Type of account
      type: select_one
      options:
      - Personal Checking
      - Personal Savings
      - Business Checking
      - Business Savings
      - Money Market
      - Investment Account
      - Multiple Accounts
      required: true
    - id: 7
      name: statement_period_start
      label: Statement Period Start Date
      hint: From date
      type: date
      options: []
      required: true
    - id: 8
      name: statement_period_end
      label: Statement Period End Date
      hint: To date
      type: date
      options: []
      required: true
    - id: 9
      name: statement_format
      label: Statement Format
      hint: How do you want statements
      type: select_one
      options:
      - Electronic PDF
      - Printed Paper Copies
      - Both Electronic and Paper
      required: true
    - id: 10
      name: delivery_method
      label: Delivery Method
      hint: How should we send statements
      type: select_one
      options:
      - Secure Email
      - Online Banking Download
      - Regular Mail
      - Certified Mail
      - Pickup at Branch
      required: true
    - id: 11
      name: reason_for_request
      label: Reason for Request
      hint: Why do you need these statements
      type: select_one
      options:
      - Tax Preparation
      - Loan Application
      - Mortgage Application
      - Rental Application
      - Personal Records
      - Audit Documentation
      - Legal Proceedings
      - Visa Application
      - Other
      required: true
    - id: 12
      name: detailed_reason
      label: Detailed Reason
      hint: Please explain
      type: text
      options: []
      required: false
    - id: 13
      name: urgency
      label: Urgency
      hint: How soon do you need them
      type: select_one
      options:
      - Standard Processing
      - Expedited Processing
      - Rush Processing
      required: true
    - id: 14
      name: number_of_copies
      label: Number of Copies
      hint: How many copies needed
      type: number
      options: []
      required: true
    - id: 15
      name: certified_copies
      label: Certified Copies Required
      hint: Do you need certified copies
      type: select_one
      options:
      - Yes, certified
      - No, standard copies
      required: true
    - id: 16
      name: notarization_required
      label: Notarization Required
      hint: Do you need notarization
      type: select_one
      options:
      - Yes, notarized
      - No, not needed
      required: false
    - id: 17
      name: third_party_authorization
      label: Third Party Authorization
      hint: Should statements go to someone else
      type: select_one
      options:
      - Yes, send to third party
      - No, send to me only
      required: true
    - id: 18
      name: third_party_name
      label: Third Party Name
      hint: Recipient name
      type: text
      options: []
      required: false
    - id: 19
      name: third_party_email
      label: Third Party Email
      hint: Recipient email
      type: email
      options: []
      required: false
    - id: 20
      name: fee_acknowledgment
      label: Fee Acknowledgment
      hint: Are you aware of any fees
      type: select_one
      options:
      - Yes, I understand
      - No, please inform me
      required: true
    - id: 21
      name: authorization_signature
      label: Authorization
      hint: Do you authorize this request
      type: select_one
      options:
      - Yes, I authorize
      - false
      required: true
    - id: 22
      name: request_date
      label: Request Date
      hint: Date of this request
      type: date
      options: []
      required: true
    - id: 23
      name: additional_instructions
      label: Additional Instructions
      hint: Any special requirements
      type: text
      options: []
      required: false
