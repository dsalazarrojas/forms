inputSchema:
  type: object
  properties:
    title: Babysitter Information Form
    pages:
    - id: 1
      name: applicant_name
      label: Full Name
      hint: Legal name of babysitter applicant
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: home_address
      label: Home Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 6
      name: years_experience
      label: Years of Babysitting Experience
      hint: How long have you been babysitting
      type: select_one
      options:
      - Less than 1 year
      - 1 to 2 years
      - 2 to 4 years
      - 4 to 6 years
      - Over 6 years
      required: true
    - id: 7
      name: age_groups_experience
      label: Age Groups You Can Care For
      hint: Select all that apply
      type: select_multiple
      options:
      - Infants, 0 to 12 months
      - Toddlers, 1 to 3 years
      - Preschool, 3 to 5 years
      - School age, 6 to 12 years
      - Teenagers, 13 plus years
      required: true
    - id: 8
      name: max_children
      label: Maximum Number of Children
      hint: How many children can you care for at once
      type: number
      options: []
      required: true
    - id: 9
      name: certifications
      label: Certifications Held
      hint: Select your certifications
      type: select_multiple
      options:
      - CPR Certified
      - First Aid Certified
      - Babysitting Course
      - Child Development
      - Lifeguard
      - None
      required: true
    - id: 10
      name: certification_expiry
      label: Certification Expiry Dates
      hint: List expiry dates for certifications
      type: text
      options: []
      required: false
    - id: 11
      name: special_skills
      label: Special Skills or Abilities
      hint: Tutoring, cooking, driving, etc.
      type: text
      options: []
      required: false
    - id: 12
      name: availability_weekdays
      label: Weekday Availability
      hint: Select available days
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: true
    - id: 13
      name: availability_weekends
      label: Weekend Availability
      hint: Select available days
      type: select_multiple
      options:
      - Saturday
      - Sunday
      required: true
    - id: 14
      name: availability_times
      label: Available Hours
      hint: What times can you work
      type: select_one
      options:
      - Mornings only
      - Afternoons only
      - Evenings only
      - Overnight
      - Flexible
      required: true
    - id: 15
      name: hourly_rate
      label: Expected Hourly Rate
      hint: Your rate in dollars per hour
      type: number
      options: []
      required: true
    - id: 16
      name: transportation
      label: Transportation Method
      hint: How will you get to jobs
      type: select_one
      options:
      - Personal vehicle
      - Public transportation
      - Walk or bike
      - Need rides
      required: true
    - id: 17
      name: drivers_license
      label: Do You Have a Drivers License
      hint: Valid license status
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: references_count
      label: Number of References
      hint: How many references can you provide
      type: number
      options: []
      required: true
    - id: 19
      name: reference_names
      label: Reference Names and Contact Info
      hint: List names, phones, and emails
      type: text
      options: []
      required: true
    - id: 20
      name: background_check
      label: Willing to Undergo Background Check
      hint: Are you open to background verification
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 21
      name: why_babysit
      label: Why Do You Want to Babysit
      hint: Share your motivation
      type: text
      options: []
      required: false
    - id: 22
      name: additional_info
      label: Additional Information
      hint: Anything else parents should know
      type: text
      options: []
      required: false
