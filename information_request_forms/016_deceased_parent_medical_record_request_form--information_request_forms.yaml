inputSchema:
  type: object
  properties:
    title: Deceased Parent Medical Record Request Form
    pages:
    - id: 1
      name: deceased_parent_name
      label: deceased_parent_name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: deceased_dob
      label: deceased_dob
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: deceased_dob_day
      label: Day
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: deceased_dob_month
      label: Month
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: deceased_dob_year
      label: Year
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: relationship_to_requester
      label: Relationship to Requester
      hint: null
      type: select_one
      options:
      - Requester is the deceased parent
      - Requester is a child of the deceased
      - Requester is the grandchild of the deceased
      - Requester is a relative
      - Requester is a friend
      - Requester is the executor of the estate
      - Other (please specify)
      required: false
    - id: 7
      name: request_reason
      label: Request Reason
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: medical_record_requestor_info
      label: Medical Record Requestor Info
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: medical_record_requestor_agreement
      label: Medical Record Requestor Agreement
      hint: null
      type: select_multiple
      options:
      - I understand that this information will not be used for any other purpose
        other than to process my request
      - I understand that the medical records will be kept confidential
      - I understand that I will be contacted if there are any issues with my request
      required: true
    - id: 12
      name: requestor_signature
      label: Requestor Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: medical_record_requestor_date
      label: Medical Record Requestor Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: medical_record_requestor_time
      label: Medical Record Requestor Time
      hint: null
      type: time
      options: []
      required: true
    - id: 15
      name: medical_record_requestor_phone
      label: Medical Record Requestor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: medical_record_requestor_email
      label: Medical Record Requestor Email
      hint: null
      type: email
      options: []
      required: false
    - id: 17
      name: medical_record_requestor_address
      label: Medical Record Requestor Address
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: medical_record_requestor_city
      label: Medical Record Requestor City
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: medical_record_requestor_state
      label: Medical Record Requestor State
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: medical_record_requestor_postal_code
      label: Medical Record Requestor Postal Code
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: medical_record_requestor_country
      label: Medical Record Requestor Country
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: medical_record_requestor_notes
      label: Medical Record Requestor Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: medical_record_requestor_agreement_read
      label: Medical Record Requestor Agreement
      hint: null
      type: select_one
      options:
      - I agree to the terms of use
      - I do not agree to the terms of use
      required: true
    - id: 24
      name: medical_record_requestor_agreement_signed
      label: Medical Record Requestor Agreement Signed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
