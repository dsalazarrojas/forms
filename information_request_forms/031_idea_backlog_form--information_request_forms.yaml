inputSchema:
  type: object
  properties:
    title: Idea Backlog Form
    pages:
    - id: 1
      name: idea_title
      label: Enter Idea Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: description
      label: Idea Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: type
      label: Type
      hint: null
      type: select_one
      options:
      - bugs
      - features
      - enhancements
      required: false
    - id: 4
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Low
      - Medium
      required: false
    - id: 5
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: due_time
      label: Due Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_multiple
      options:
      - John
      - Jane
      - Jim
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: tags
      label: Tags
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
