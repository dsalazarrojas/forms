inputSchema:
  type: object
  properties:
    title: Student Information Request Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_email
      label: student_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: student_phone
      label: student_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: student_date_of_birth
      label: date_of_birth
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: student_grade_level
      label: grade_level
      hint: null
      type: select_one
      options:
      - High School
      - Elementary School
      - Middle School
      - College
      - University
      required: false
    - id: 6
      name: student_request_reason
      label: request_reason
      hint: null
      type: text
      options: []
      required: false
