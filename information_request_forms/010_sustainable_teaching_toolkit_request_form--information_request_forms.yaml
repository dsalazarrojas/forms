inputSchema:
  type: object
  properties:
    title: Sustainable Teaching Toolkit Request Form
    pages:
    - id: 1
      name: form_1
      label: Primary Topic of Request
      hint: null
      type: select_one
      options:
      - Math
      - Science
      - English
      - History
      - Other
      required: true
    - id: 2
      name: form_2
      label: Do you need resources for this topic?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: form_3
      label: Email Format Preference
      hint: null
      type: select_multiple
      options:
      - HTML
      - Plain
      - Both
      required: true
    - id: 4
      name: form_4
      label: Type of Resource Needed
      hint: null
      type: select_one
      options:
      - Lesson Plans
      - Videos
      - Books
      - Weblinks
      - Other
      required: true
    - id: 5
      name: form_5
      label: Resource Format Preference
      hint: null
      type: select_one
      options:
      - PDF
      - PPT
      - DOCX
      - HTML
      required: true
    - id: 6
      name: form_6
      label: Deadline or Specific Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: form_7
      label: Request Description
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: form_8
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: form_9
      label: Institutional Affiliation
      hint: null
      type: select_one
      options:
      - High School
      - College/University
      - Community College
      - Other
      required: true
    - id: 10
      name: form_10
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text
      required: true
    - id: 11
      name: form_11
      label: Follow-up Request
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: form_12
      label: Contact Method 2
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Text
      required: false
    - id: 13
      name: form_13
      label: Best Time of Day
      hint: null
      type: time
      options: []
      required: true
    - id: 14
      name: form_14
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
