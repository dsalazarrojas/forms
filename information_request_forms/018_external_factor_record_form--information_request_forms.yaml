inputSchema:
  type: object
  properties:
    title: External Factor Record Form
    pages:
    - id: 1
      name: political_factor_1
      label: Is the external factor political in nature?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: economic_value
      label: What is the economic value of the external factor?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: social_impact
      label: What is the social impact of the external factor?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: technological_factor_1
      label: Is the external factor technological in nature?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: environmental_factor_1
      label: Is the external factor environmental in nature?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: threat_level
      label: What is the risk level of the external factor?
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: true
    - id: 7
      name: description
      label: Please provide a brief description of the external factor.
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: impact
      label: Does the external factor have an impact on our organization?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: likelihood
      label: How likely is the external factor to occur?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: mitigation_1
      label: What are the potential mitigation strategies for the external factor?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: likelihood_2
      label: Likelihood (1-6)
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: mitigation_2
      label: Potential Mitigation Strategies
      hint: null
      type: text
      options: []
      required: true
