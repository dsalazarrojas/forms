inputSchema:
  type: object
  properties:
    title: College Announcement Request Form
    pages:
    - id: 1
      name: requester_name
      label: Requester Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 2
      name: requester_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: requester_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: false
    - id: 4
      name: department
      label: Department or Organization
      hint: Your group
      type: text
      options: []
      required: true
    - id: 5
      name: role
      label: Your Role
      hint: Position in organization
      type: text
      options: []
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 7
      name: event_title
      label: Event Title
      hint: Name of event
      type: text
      options: []
      required: true
    - id: 8
      name: event_type
      label: Event Type
      hint: Category of event
      type: select_one
      options:
      - Academic Lecture
      - Workshop
      - Conference
      - Social Event
      - Sports Event
      - Cultural Event
      - Fundraiser
      - Club Meeting
      - Career Fair
      - Information Session
      - Other
      required: true
    - id: 9
      name: event_description
      label: Event Description
      hint: Describe the event
      type: text
      options: []
      required: true
    - id: 10
      name: event_date
      label: Event Date
      hint: When is it
      type: date
      options: []
      required: true
    - id: 11
      name: event_start_time
      label: Event Start Time
      hint: Beginning time
      type: time
      options: []
      required: true
    - id: 12
      name: event_end_time
      label: Event End Time
      hint: Ending time
      type: time
      options: []
      required: true
    - id: 13
      name: event_location
      label: Event Location
      hint: Where is it held
      type: text
      options: []
      required: true
    - id: 14
      name: building_room
      label: Building and Room Number
      hint: Specific location
      type: text
      options: []
      required: false
    - id: 15
      name: target_audience
      label: Target Audience
      hint: Who should attend
      type: select_multiple
      options:
      - All Students
      - Undergraduate Students
      - Graduate Students
      - Faculty
      - Staff
      - Alumni
      - General Public
      - Specific Department
      - Specific Club
      required: true
    - id: 16
      name: expected_attendance
      label: Expected Attendance
      hint: How many people
      type: select_one
      options:
      - 1-10
      - 11-25
      - 26-50
      - 51-100
      - 101-250
      - 251-500
      - Over 500
      required: true
    - id: 17
      name: announcement_channels
      label: Where Should Announcement Be Posted
      hint: Select all that apply
      type: select_multiple
      options:
      - College Website
      - Student Portal
      - Email Newsletter
      - Social Media
      - Campus Digital Signage
      - Department Newsletter
      - Student Newspaper
      - Radio Station
      - Other
      required: true
    - id: 18
      name: announcement_text
      label: Proposed Announcement Text
      hint: What should it say
      type: text
      options: []
      required: true
    - id: 19
      name: flyer_attached
      label: Do You Have a Flyer
      hint: Event flyer
      type: select_one
      options:
      - Yes Will Upload
      - Yes Attached
      - 'False'
      - In Progress
      required: true
    - id: 20
      name: flyer_upload
      label: Upload Flyer
      hint: Attach file
      type: text
      options: []
      required: false
    - id: 21
      name: social_media_graphics
      label: Do You Have Social Media Graphics
      hint: Images for posting
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: registration_required
      label: Is Registration Required
      hint: Do attendees need to register
      type: select_one
      options:
      - Yes Required
      - Yes Recommended
      - 'False'
      required: true
    - id: 23
      name: registration_link
      label: Registration Link
      hint: URL for signup
      type: text
      options: []
      required: false
    - id: 24
      name: cost
      label: Event Cost
      hint: Admission fee
      type: text
      options: []
      required: true
    - id: 25
      name: contact_person
      label: Event Contact Person
      hint: Who to contact for info
      type: text
      options: []
      required: true
    - id: 26
      name: contact_email
      label: Event Contact Email
      hint: Email for inquiries
      type: email
      options: []
      required: true
    - id: 27
      name: accessibility_needs
      label: Accessibility Accommodations
      hint: What accommodations provided
      type: text
      options: []
      required: false
    - id: 28
      name: refreshments_provided
      label: Will Refreshments Be Provided
      hint: Food and drinks
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 29
      name: sponsorship_info
      label: Sponsorship Information
      hint: Any sponsors
      type: text
      options: []
      required: false
    - id: 30
      name: first_request_date
      label: When Should Announcement First Appear
      hint: Start date
      type: date
      options: []
      required: true
    - id: 31
      name: last_request_date
      label: When Should Announcement Stop Appearing
      hint: End date
      type: date
      options: []
      required: true
    - id: 32
      name: frequency
      label: How Often Should It Be Posted
      hint: Posting frequency
      type: select_one
      options:
      - Once
      - Daily
      - Weekly
      - Multiple Times Per Week
      - Until Event Date
      required: true
    - id: 33
      name: previous_announcements
      label: Has This Event Been Announced Before
      hint: Previous posts
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 34
      name: approval_needed
      label: Does This Need Special Approval
      hint: Any approvals required
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: true
    - id: 35
      name: additional_notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
