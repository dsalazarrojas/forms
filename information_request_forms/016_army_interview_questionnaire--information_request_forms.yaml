inputSchema:
  type: object
  properties:
    title: Army Interview Questionnaire
    pages:
    - id: 1
      name: section_candidate_info
      label: -- Candidate Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: candidate_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: candidate_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: candidate_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: candidate_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_background
      label: -- Background Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: education_level
      label: Highest level of education
      hint: null
      type: select_one
      options:
      - High school diploma
      - GED
      - Some college
      - Associate degree
      - Bachelor degree
      - Graduate degree
      required: true
    - id: 8
      name: work_experience
      label: Years of professional work experience
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: previous_military
      label: Previous military experience
      hint: null
      type: select_one
      options:
      - None
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - More than 5 years
      required: true
    - id: 10
      name: section_motivation
      label: -- Career Interest and Motivation --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: desired_career_field
      label: Desired Army career field
      hint: null
      type: select_one
      options:
      - Infantry
      - Medical
      - Technical - IT
      - Engineering
      - Logistics
      - Administration
      - Other
      required: true
    - id: 12
      name: motivation_reason
      label: Why do you want to join the Army
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: career_goals
      label: Your long-term career goals
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: section_qualities
      label: -- Personal Qualities and Skills --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: key_strengths
      label: Your key personal strengths
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: leadership_experience
      label: Leadership or team experience
      hint: null
      type: select_one
      options:
      - None
      - Limited experience
      - Moderate experience
      - Extensive experience
      required: true
    - id: 17
      name: problem_solving
      label: Problem-solving approach
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: section_fitness
      label: -- Physical Fitness and Health --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: fitness_level
      label: Current physical fitness level
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below average
      required: true
    - id: 20
      name: medical_conditions
      label: Any medical conditions or concerns
      hint: null
      type: select_one
      options:
      - None
      - Minor
      - Moderate
      - Serious
      required: true
    - id: 21
      name: condition_details
      label: If yes, please describe
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: section_questions
      label: -- Additional Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: availability
      label: When are you available to start
      hint: null
      type: select_one
      options:
      - Immediately
      - Within 1 month
      - Within 3 months
      - Within 6 months
      - Other
      required: true
    - id: 24
      name: commitment_willingness
      label: Willing to relocate or deploy
      hint: null
      type: select_one
      options:
      - true
      - Willing to discuss
      - false
      required: true
    - id: 25
      name: additional_info
      label: Additional information or questions
      hint: null
      type: text
      options: []
      required: false
