inputSchema:
  type: object
  properties:
    title: Client Stories Form
    pages:
    - id: 1
      name: contributor_section
      label: -- Contributor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contributor_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: company_name
      label: Company/Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: job_title
      label: Your Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: story_section
      label: -- Your Story --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: story_title
      label: Story Title
      hint: Give your story a compelling title
      type: text
      options: []
      required: true
    - id: 9
      name: story_overview
      label: Overview of your experience
      hint: 2-3 sentences summarizing your story
      type: text
      options: []
      required: true
    - id: 10
      name: challenge_section
      label: -- The Challenge --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: original_challenge
      label: What was the original challenge?
      hint: Describe the problem you faced
      type: text
      options: []
      required: true
    - id: 12
      name: impact_before
      label: How did this challenge impact your business?
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: solution_section
      label: -- The Solution --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: solution_approach
      label: How did you solve the challenge?
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: results_section
      label: -- The Results --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: results_achieved
      label: What results did you achieve?
      hint: Be specific about improvements or metrics
      type: text
      options: []
      required: true
    - id: 17
      name: timeline
      label: How long did it take to see results?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: lessons_learned
      label: Key lessons learned
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: media_section
      label: -- Media (Optional) --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: media_permission
      label: May we use your story for testimonials or case studies?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 21
      name: image_permission
      label: Can we use a photo of you with your story?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
