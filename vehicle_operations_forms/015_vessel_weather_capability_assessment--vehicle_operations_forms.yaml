inputSchema:
  type: object
  properties:
    title: Vessel Weather Capability Assessment
    pages:
    - id: 1
      name: vessel_type
      label: Vessel Type
      hint: null
      type: select_one
      options:
      - Commercial Vessel
      - Private Vessel
      - Military Vessel
      - Other
      required: false
    - id: 2
      name: weather_conditions
      label: Weather Conditions
      hint: null
      type: select_multiple
      options:
      - Wind
      - Wave
      - Sea State
      - Other
      required: false
    - id: 3
      name: operating_area
      label: Operating Area
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: crew_size
      label: Crew Size
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: weather_rating
      label: Weather Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: weather_notes
      label: Weather Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: vessel_condition
      label: Vessel Condition
      hint: null
      type: select_one
      options:
      - Satisfactory
      - Unsatisfactory
      - Not Applicable
      required: false
    - id: 8
      name: crew_condition
      label: Crew Condition
      hint: null
      type: select_multiple
      options:
      - Satisfactory
      - Unsatisfactory
      - Not Applicable
      required: false
    - id: 9
      name: operating_area_note
      label: Operating Area Note
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
