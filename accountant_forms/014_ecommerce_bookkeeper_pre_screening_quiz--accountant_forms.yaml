inputSchema:
  type: object
  properties:
    title: Ecommerce Bookkeeper Pre Screening Quiz
    pages:
    - id: 1
      name: candidate_info
      label: candidate_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: years_experience
      label: years experience
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: accounting_software
      label: accounting software
      hint: null
      type: select_multiple
      options:
      - QuickBooks
      - Xero
      - Sage
      - SAP
      - Exact
      - Zoho
      required: false
    - id: 4
      name: bookkeeper_qualification
      label: bookkeeper qualification
      hint: null
      type: select_one
      options:
      - Certified Bookkeeper
      - Certified Public Accountant
      - Certified Financial Analyst
      - Certified Management Accountant
      required: false
    - id: 5
      name: language_skills
      label: language skills
      hint: null
      type: select_multiple
      options:
      - English
      - French
      - Spanish
      - Mandarin
      - Arabic
      required: false
    - id: 6
      name: bookkeeper_certification
      label: bookkeeper certification
      hint: null
      type: select_multiple
      options:
      - CPA
      - CPA (Australia)
      - CPA (Canada)
      - CPA (UK)
      - CPA (US)
      - CIMA
      required: false
    - id: 7
      name: availability
      label: availability
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Remote
      required: false
    - id: 8
      name: work_type
      label: work type
      hint: null
      type: select_multiple
      options:
      - Full-time
      - Part-time
      - Freelance
      required: false
