      - 'No'
      required: false
    - id: 2
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: trip_details
      label: Trip Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: expense_amount
      label: Expense Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: expense_description
      label: Expense Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: expense_category
      label: Expense Category
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 8
      name: total_expenses
      label: Total Expenses
      hint: null
      type: number
      options: []
      required: false
