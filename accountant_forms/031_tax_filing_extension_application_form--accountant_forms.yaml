inputSchema:
  type: object
  properties:
    title: Tax Filing Extension Application Form
    pages:
    - id: 1
      name: tax_filing_application_form
      label: Tax Filing Application
      hint: null
      type: select_multiple
      options:
      - Tax Filing Extension
      - Other
      required: false
    - id: 2
      name: tax_year
      label: Tax Year
      hint: Tax Year
      type: number
      options: []
      required: true
    - id: 3
      name: reasons_for_extension
      label: Reasons For Extension
      hint: null
      type: select_one
      options:
      - Less Than 6 Months
      - More Than 6 Months
      - Less Than 12 Months
      - More Than 12 Months
      required: true
    - id: 4
      name: taxpayer_details
      label: Taxpayer Details
      hint: Taxpayer Details
      type: text
      options: []
      required: false
    - id: 5
      name: tax_filing_status
      label: Tax Filing Status
      hint: null
      type: select_multiple
      options:
      - Married
      - Single
      - Joint
      required: true
    - id: 6
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: date_of_birth
      label: Date Of Birth
      hint: YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 8
      name: taxpayer_signature
      label: Taxpayer Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: tax_professional_signature
      label: Tax Professional Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: tax_professional_name
      label: Tax Professional Name
      hint: Tax Professional Name
      type: text
      options: []
      required: true
    - id: 11
      name: tax_professional_designation
      label: Tax Professional Designation
      hint: null
      type: select_one
      options:
      - Certified Public Accountant
      - Chartered Accountant
      - Certified Financial Accountant
      required: true
    - id: 12
      name: tax_professional_license
      label: Tax Professional License
      hint: Tax Professional License
      type: text
      options: []
      required: false
