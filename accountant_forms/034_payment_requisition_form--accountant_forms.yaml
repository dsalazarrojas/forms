inputSchema:
  type: object
  properties:
    title: Payment Requisition Form
    pages:
    - id: 1
      name: payment_request
      label: Payment Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - Check
      - Wire Transfer
      required: false
    - id: 4
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: paid_to
      label: Paid To
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
