inputSchema:
  type: object
  properties:
    title: Payment Request Form
    pages:
    - id: 1
      name: outstanding_debt_amount
      label: Outstanding Debt Amount
      hint: Please enter the amount of debt
      type: number
      options: []
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - MasterCard
      - American Express
      required: false
    - id: 3
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: payment_term
      label: Payment Term
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: description
      label: Description
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: Please enter your email address
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: upload_file
      label: Upload File
      hint: null
      type: text
      options: []
      required: false
