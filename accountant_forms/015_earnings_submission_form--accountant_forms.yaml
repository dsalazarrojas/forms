inputSchema:
  type: object
  properties:
    title: Earnings Submission Form
    pages:
    - id: 1
      name: main_page
      label: Main Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_info
      label: Payment Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - PayPal
      - Bank Transfer
      - Check
      required: true
    - id: 4
      name: payment_amount
      label: Payment Amount
      hint: null
      type: select_one
      options:
      - Less than $1000
      - $1000-$5000
      - $5000-$10000
      - $10000-$20000
      - $20000-$50000
      - More than $50000
      required: true
    - id: 5
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: payment_time
      label: Payment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: payment_amount_integer
      label: Payment Amount Integer
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: payment_amount_decimal
      label: Payment Amount Decimal
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: payment_amount_text
      label: Payment Amount Text
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: payment_date_time
      label: Payment Date and Time
      hint: null
      type: date
      options: []
      required: false
