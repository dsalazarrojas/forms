inputSchema:
  type: object
  properties:
    title: Client Tax Document Upload Form
    pages:
    - id: 1
      name: client_section
      label: -- Client Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
