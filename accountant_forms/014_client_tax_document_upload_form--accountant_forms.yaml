      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: tax_year
      label: Tax Year
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: filing_status
      label: Filing Status
      hint: null
      type: select_one
      options:
      - Single
      - Married Filing Jointly
      - Married Filing Separately
      - Head of Household
      - Qualifying Widow/Widower
      required: true
