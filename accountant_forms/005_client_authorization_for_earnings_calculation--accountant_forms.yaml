inputSchema:
  type: object
  properties:
    title: Client Authorization For Earnings Calculation
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: client_address
      label: Mailing Address
      hint: Complete street address
      type: text
      options: []
      required: true
    - id: 6
      name: client_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: client_state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: client_zip
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: social_security_number
      label: Social Security Number
      hint: For tax identification purposes
      type: text
      options: []
      required: true
    - id: 10
      name: calculation_period_start
      label: Calculation Period Start Date
      hint: Beginning of earnings period
      type: date
      options: []
      required: true
    - id: 11
      name: calculation_period_end
      label: Calculation Period End Date
      hint: End of earnings period
      type: date
      options: []
      required: true
    - id: 12
      name: purpose_of_calculation
      label: Purpose of Earnings Calculation
      hint: Why do you need this calculation?
      type: select_one
      options:
      - Tax Preparation
      - Loan Application
      - Financial Planning
      - Divorce Proceedings
      - Insurance Claim
      - Business Valuation
      - Other Legal Matter
      - Other
      required: true
    - id: 13
      name: income_sources
      label: Income Sources to Include
      hint: Select all that apply
      type: select_multiple
      options:
      - W-2 Employment Income
      - Self-Employment Income
      - Investment Income
      - Rental Income
      - Retirement Distributions
      - Social Security Benefits
      - Alimony or Child Support
      - Other
      required: true
    - id: 14
      name: employer_name
      label: Current Employer Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 15
      name: employer_address
      label: Employer Address
      hint: Business address of employer
      type: text
      options: []
      required: false
    - id: 16
      name: pay_frequency
      label: Pay Frequency
      hint: How often are you paid?
      type: select_one
      options:
      - Weekly
      - Bi-Weekly
      - Semi-Monthly
      - Monthly
      - Quarterly
      - Annually
      - Irregular
      required: false
    - id: 17
      name: authorization_statement
      label: I Authorize the Calculation of My Earnings for the Specified Period
      hint: Confirm your authorization
      type: select_one
      options:
      - I Authorize
      - I Do Not Authorize
      required: true
    - id: 18
      name: third_party_release
      label: May We Contact Your Employer for Verification?
      hint: If needed for accuracy
      type: select_one
      options:
      - Yes, I Authorize
      - No, Do Not Contact
      required: true
    - id: 19
      name: confidentiality_agreement
      label: I Understand This Information Will Be Kept Confidential
      hint: Privacy protection acknowledgment
      type: select_one
      options:
      - I Understand
      - I Do Not Understand
      required: true
    - id: 20
      name: authorization_date
      label: Authorization Date
      hint: Date of signing
      type: date
      options: []
      required: true
    - id: 21
      name: electronic_signature
      label: Electronic Signature
      hint: Type your full name as signature
      type: text
      options: []
      required: true
    - id: 22
      name: witness_name
      label: Witness Name (Optional)
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 23
      name: accountant_name
      label: Assigned Accountant Name
      hint: For internal use
      type: text
      options: []
      required: false
