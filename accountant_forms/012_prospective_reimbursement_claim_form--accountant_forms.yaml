      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: expense_date
      label: Expense Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: expense_description
      label: Expense Description
      hint: Description of expense claim
      type: text
      options: []
      required: false
    - id: 4
      name: receipt_upload
      label: Receipt Upload
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: expense_claim_amount
      label: Expense Claim Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: claimant_name
      label: Claimant Name
      hint: Name of person claiming expense
      type: text
      options: []
      required: false
    - id: 7
      name: organization_id
      label: Organization ID
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: submit_form
      label: Submit Form
      hint: null
