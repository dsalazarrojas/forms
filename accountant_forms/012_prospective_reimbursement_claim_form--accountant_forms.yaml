      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: expense_category
      label: Expense Category
      hint: null
      type: select_multiple
      options:
      - Category 1
      - Category 2
      - Category 3
      required: false
