inputSchema:
  type: object
  properties:
    title: Expense Reimbursement Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: expense_type
      label: Expense Type
      hint: null
      type: select_multiple
      options:
      - Cash
      - Credit Card
      - Other
      required: true
    - id: 3
      name: expense_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: expense_amount
      label: Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: expense_description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: expense_category
      label: Category
      hint: null
      type: select_one
      options:
      - Food
      - Transportation
      - Accomodation
      required: true
    - id: 7
      name: expense_attachment
      label: Attachment
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submit_button
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Other
      required: false
