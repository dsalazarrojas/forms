      name: total_allocations
      label: total_allocations
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: grant_allocation_audit_notes
      label: grant_allocation_audit_notes
      hint: Enter any audit notes about the grant fund allocations
      type: text
      options: []
      required: false
    - id: 12
      name: form_submit_button
      label: form_submit_button
      hint: null
      type: select_one
      options:
      - Submit
      - Reset
      required: false
