inputSchema:
  type: object
  properties:
    title: Ministry Volunteer Recruitment Form
    pages:
    - id: 1
      name: volunteer_type
      label: volunteer_type
      hint: null
      type: select_one
      options:
      - Ministry Volunteer
      - Ministry Staff
      - Other
      required: false
    - id: 2
      name: first_name
      label: first_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: last_name
      label: last_name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: message
      label: message
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: volunteer_group
      label: volunteer_group
      hint: null
      type: select_multiple
      options:
      - Faith Missionary Group
      - Youth Group
      - Other Group
      required: false
    - id: 8
      name: volunteer_group_other
      label: volunteer_group_other
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: assigned_tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - other
      required: false
    - id: 10
      name: assigned_tool_other
      label: assigned_tool_other
      hint: null
      type: text
      options: []
      required: false
