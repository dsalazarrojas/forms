inputSchema:
  type: object
  properties:
    title: Humanitarian Expeditions Application Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: expedition_date
      label: Expedition Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: expedition_time
      label: Expedition Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: purpose_of_participation
      label: Purpose of Participation
      hint: What do you hope to achieve on this expedition?
      type: text
      options: []
      required: true
    - id: 5
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - '{''label'': ''chatjimmy''}'
      - '{''label'': ''other''}'
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''John''}'
      - '{''label'': ''Jane''}'
      required: false
    - id: 10
      name: submitted_at
      label: Submitted At
      hint: The date and time this form was submitted
      type: date
      options: []
      required: false
