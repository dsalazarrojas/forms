inputSchema:
  type: object
  properties:
    title: Confined Space Safety Inspection Form
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date of the safety inspection
      type: date
      options: []
      required: true
    - id: 2
      name: inspection_time
      label: Inspection Time
      hint: Time when inspectionT
      type: time
      options: []
      required: true
    - id: 3
      name: inspector_name
      label: Inspector Name
      hint: Name of the safety inspector
      type: text
      options: []
      required: true
    - id: 4
      name: inspector_id
      label: Inspector ID Number
      hint: Employee or certification ID
      type: text
      options: []
      required: true
    - id: 5
      name: site_location
      label: Site Location
      hint: Full address or location of the worksite
      type: text
      options: []
      required: true
    - id: 6
      name: confined_space_name
      label: Confined Space Name or ID
      hint: Identifier for the specific confined space
      type: text
      options: []
      required: true
    - id: 7
      name: inspection_type
      label: Type of Inspection
      hint: What type of inspection is being conducted
      type: select_one
      options:
      - Pre-Entry Inspection
      - Routine Periodic Inspection
      - Post-Incident Inspection
      - Equipment Inspection
      - Compliance Audit
      required: true
    - id: 8
      name: permit_displayed
      label: Entry Permit Displayed
      hint: Is the permit posted at the entry point
      type: select_one
      options:
      - true
      - false
      - Not Applicable
      required: true
    - id: 9
      name: warning_signs_posted
      label: Warning Signs Posted
      hint: Are danger signs visible at all entry points
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: barriers_in_place
      label: Barriers and Guardrails
      hint: Are physical barriers protecting the opening
      type: select_one
      options:
      - Yes - Adequate
      - Yes - Needs Improvement
      - false
      required: true
    - id: 11
      name: atmospheric_monitor
      label: Atmospheric Monitor Available
      hint: Is a calibrated gas monitor on site
      type: select_one
      options:
      - Yes - Calibrated
      - Yes - Needs Calibration
      - false
      required: true
    - id: 12
      name: monitor_calibration_date
      label: Monitor Calibration Date
      hint: Last date the monitor was calibrated
      type: date
      options: []
      required: false
    - id: 13
      name: ventilation_system
      label: Ventilation System Status
      hint: Condition and operation of ventilation equipment
      type: select_one
      options:
      - Operating Properly
      - Operating - Needs Maintenance
      - Not Operating
      - Not Required
      required: true
    - id: 14
      name: communication_equipment
      label: Communication Equipment
      hint: Is reliable communication established
      type: select_one
      options:
      - Yes - Radio
      - Yes - Visual
      - Yes - Voice
      - Yes - Other
      - false
      required: true
    - id: 15
      name: rescue_equipment
      label: Rescue Equipment Inspection
      hint: Condition of retrieval and rescue equipment
      type: select_one
      options:
      - All Equipment Present and Functional
      - Equipment Present - Some Issues
      - Equipment Missing
      required: true
    - id: 16
      name: tripod_condition
      label: Tripod or Retrieval System
      hint: Condition of the tripod or anchor system
      type: select_one
      options:
      - Good Condition
      - Fair Condition
      - Poor Condition
      - Not Available
      required: true
    - id: 17
      name: harness_inspection
      label: Full Body Harness
      hint: Condition of harnesses and lanyards
      type: select_one
      options:
      - Good Condition
      - Fair Condition - Monitor
      - Poor Condition - Replace
      - Not Available
      required: true
    - id: 18
      name: lighting_inspection
      label: Lighting System
      hint: Adequacy of lighting in the space
      type: select_one
      options:
      - Adequate
      - Marginal
      - Inadequate
      required: true
    - id: 19
      name: ppe_available
      label: Personal Protective Equipment
      hint: Is required PPE available and in good condition
      type: select_one
      options:
      - Yes - All Required PPE Available
      - Partially Available
      - No - PPE Missing
      required: true
    - id: 20
      name: ppe_items
      label: PPE Items Available
      hint: Select all PPE that is available
      type: select_multiple
      options:
      - Hard Hats
      - Safety Glasses
      - Respirators
      - Harnesses
      - Gloves
      - Steel Toe Boots
      - Hearing Protection
      - Face Shields
      - Chemical Suits
      required: false
    - id: 21
      name: attendant_present
      label: Trained Attendant Present
      hint: Is a trained attendant stationed outside
      type: select_one
      options:
      - true
      - false
      - Entry Not In Progress
      required: true
    - id: 22
      name: entrant_count
      label: Number of Entrants
      hint: How many workers are in the space
      type: number
      options: []
      required: false
    - id: 23
      name: deficiencies_found
      label: Deficiencies or Violations
      hint: Describe any safety deficiencies found
      type: text
      options: []
      required: false
    - id: 24
      name: corrective_actions
      label: Corrective Actions Required
      hint: What actions must be taken to correct issues
      type: text
      options: []
      required: false
    - id: 25
      name: compliance_status
      label: Overall Compliance Status
      hint: Does this space meet safety requirements
      type: select_one
      options:
      - Compliant - No Issues
      - Minor Issues - Correctable
      - Non-Compliant - Action Required
      - Critical - Entry Must Stop
      required: true
    - id: 26
      name: inspector_signature
      label: Inspector Signature
      hint: Name of the safety inspector
      type: text
      options: []
      required: true
    - id: 27
      name: follow_up_required
      label: Follow-Up Inspection Required
      hint: Is a follow-up inspection needed
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 28
      name: follow_up_date
      label: Follow-Up Date
      hint: When should the follow-up occur
      type: date
      options: []
      required: false
