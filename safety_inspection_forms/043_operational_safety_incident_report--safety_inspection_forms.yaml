inputSchema:
  type: object
  properties:
    title: operational_safety_incident_report
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - Confined Space
      - Near Confined Space
      required: true
    - id: 4
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: root_cause
      label: Root Cause
      hint: null
      type: select_multiple
      options:
      - Environmental Factor
      - Equipment Factor
      - Human Factor
      required: true
    - id: 6
      name: corrective_action
      label: Corrective Action
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: preventive_action
      label: Preventive Action
      hint: null
      type: select_multiple
      options:
      - Regular Review
      - Training
      required: true
    - id: 8
      name: incident_type
      label: Incident Type
      hint: null
      type: select_multiple
      options:
      - Lost Time
      - Injury
      - Damage
      required: true
    - id: 9
      name: personnel_involved
      label: Personnel Involved
      hint: null
      type: select_multiple
      options:
      - Supervisor
      - Employee
      - Contractor
      required: true
    - id: 10
      name: witnesses
      label: Witnesses
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: incident_location
      label: Incident Location
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 13
      name: incident_reporter
      label: Incident Reporter
      hint: null
      type: text
      options: []
      required: true
