inputSchema:
  type: object
  properties:
    title: Ladder Safety Quiz
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question_1
      label: How often should you inspect a ladder
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 3
      name: question_2
      label: What is the minimum height that requires fall protection
      hint: null
      type: select_one
      options:
      - 4 feet
      - 5 feet
      - 6 feet
      required: false
    - id: 4
      name: question_3
      label: What should you do if a ladder is damaged
      hint: null
      type: select_one
      options:
      - Do not use
      - Inspect and repair
      - Replace
      required: false
    - id: 5
      name: question_4
      label: What is the proper way to ascend a ladder
      hint: null
      type: select_one
      options:
      - Foot on the rung side
      - Foot on the side of the rung
      - Foot on the center of the rung
      required: false
    - id: 6
      name: question_5
      label: How often should you clean your tools and equipment
      hint: null
      type: select_one
      options:
      - Never
      - Daily
      - Weekly
      required: false
    - id: 7
      name: question_6
      label: Is it safe to carry tools on the rungs
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 8
      name: question_7
      label: What should you not do when ascending or descending a ladder
      hint: null
      type: select_one
      options:
      - Look down
      - Look up
      - Never look at the top
      required: false
    - id: 9
      name: question_8
      label: What is the correct way to hold the ladder
      hint: null
      type: select_one
      options:
      - Both hands on the side
      - Right hand on the side and left hand on the top
      - Left hand on the side and right hand on top
      required: false
    - id: 10
      name: question_9
      label: What is the correct way to place the ladder
      hint: null
      type: select_one
      options:
      - Foot over foot
      - Side over side
      required: false
    - id: 11
      name: question_10
      label: What is the correct way to maintain the ladder
      hint: null
      type: select_one
      options:
      - Never
      - Daily
      - Weekly
      required: false
    - id: 12
      name: question_11
      label: What is the correct way to use ladder safety equipment
      hint: null
      type: select_one
      options:
      - Always
      - When necessary
      required: false
    - id: 13
      name: question_12
      label: Is ladder safety training required
      hint: null
      type: select_one
      options:
      - Never
      - Before using
      required: false
    - id: 14
      name: question_13
      label: How long does ladder safety training last
      hint: null
      type: select_one
      options:
      - 1 year
      - 2 years
      - 3 years
      required: false
    - id: 15
      name: question_14
      label: Can you use a ladder in the rain or snow
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 16
      name: question_15
      label: What is the maximum weight capacity of a standard ladder
      hint: null
      type: select_one
      options:
      - 200 lbs
      - 300 lbs
      - 400 lbs
      required: false
    - id: 17
      name: question_16
      label: What is the maximum angle of inclination of a ladder
      hint: null
      type: select_one
      options:
      - 75 degrees
      - 90 degrees
      - 120 degrees
      required: false
    - id: 18
      name: question_17
      label: How often should you check your ladder for damage
      hint: null
      type: select_one
      options:
      - Never
      - Daily
      - Weekly
      required: false
    - id: 19
      name: question_18
      label: Can you use a ladder in windy conditions
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 20
      name: question_19
      label: Can you use a ladder near a water source
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 21
      name: question_20
      label: Can you use a ladder near an open flame
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 22
      name: question_21
      label: What is the correct way to inspect a ladder
      hint: null
      type: select_one
      options:
      - Visually
      - By weight
      required: false
    - id: 23
      name: question_22
      label: What is the correct way to secure a ladder
      hint: null
      type: select_one
      options:
      - Always
      - When necessary
      required: false
    - id: 24
      name: question_23
      label: How often should you inspect tools and equipment
      hint: null
      type: select_one
      options:
      - Never
      - Daily
      - Weekly
      required: false
    - id: 25
      name: question_25
      label: What is the best way to dispose of a damaged ladder
      hint: null
      type: select_one
      options:
      - Replace
      - Repurpose
      - Retire
      required: false
    - id: 26
      name: question_26
      label: What is the correct way to handle a damaged ladder
      hint: null
      type: select_multiple
      options:
      - Remove it from service
      - Repair it
      - Return it to service
      required: false
