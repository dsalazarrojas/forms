inputSchema:
  type: object
  properties:
    title: Anesthesia Equipment Checklist
    pages:
    - id: 1
      name: section_checklist
      label: -- Equipment Checklist --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: checked_by
      label: Checked by
      hint: Staff member name
      type: text
      options: []
      required: true
    - id: 3
      name: date_checked
      label: Date checked
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 4
      name: oxygen_supply
      label: Oxygen supply status
      hint: Available and functioning
      type: select_one
      options: [OK, Needs maintenance, N A]
      required: true
    - id: 5
      name: suction
      label: Suction status
      hint: Functional status
      type: select_one
      options: [OK, Needs maintenance, N A]
      required: true
    - id: 6
      name: monitors
      label: Monitors functional
      hint: ECG, BP, SpO2
      type: select_one
      options: [OK, Needs maintenance, N A]
      required: true
    - id: 7
      name: notes
      label: Notes on equipment
      hint: Any issues identified
      type: text
      options: []
      required: false
    - id: 8
      name: sign_off
      label: Sign off complete
      hint: Confirm checklist completion
      type: select_one
      options: [Yes, No]
      required: true
