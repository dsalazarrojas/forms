inputSchema:
  type: object
  properties:
    title: Safety Recall Information Request
    pages:
    - id: 1
      name: recall_inquiries
      label: What is the reason for this recall request
      hint: Please provide the reason for this recall request
      type: text
      options: []
      required: false
    - id: 2
      name: product_identification
      label: Product Identification
      hint: Provide product identification details (Model, Serial Number, etc.)
      type: text
      options: []
      required: false
    - id: 3
      name: customer_contact
      label: Customer Contact Information
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: customer_name
      label: Customer Name
      hint: Enter the customer name
      type: text
      options: []
      required: false
    - id: 5
      name: customer_email
      label: Customer E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: customer_phone
      label: Customer Phone
      hint: Enter customer phone number
      type: text
      options: []
      required: false
    - id: 7
      name: customer_message
      label: Customer Message
      hint: Enter a message for the customer
      type: text
      options: []
      required: false
    - id: 8
      name: customer_note
      label: Additional Customer Notes
      hint: Enter any additional notes
      type: note
      options: []
      required: false
    - id: 9
      name: customer_agreement
      label: Customer Agreement
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
