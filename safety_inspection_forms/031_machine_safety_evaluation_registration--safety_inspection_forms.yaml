inputSchema:
  type: object
  properties:
    title: Machine Safety Evaluation Registration
    pages:
    - id: 1
      name: machine_safety_evaluation_form
      label: Is the machine safe to operate?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: facility_location
      label: Where is the facility located?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: facility_name
      label: Facility name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: machine_type
      label: Type of the machine?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: hazard_location
      label: Where is the hazard?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: hazard_description
      label: Description of the hazard?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: corrective_action
      label: Corrective action taken?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: corrective_action_date
      label: Effective date of corrective action?
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: compliance_status
      label: Compliance status?
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 10
      name: safety_rating
      label: Safety rating?
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: risk_level
      label: Risk level?
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 12
      name: review_date
      label: Next review date?
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: completed
      label: Is the task completed?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: reviewer_comments
      label: Reviewer comments?
      hint: null
      type: note
      options: []
      required: false
