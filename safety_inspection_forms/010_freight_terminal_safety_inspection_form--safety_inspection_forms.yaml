inputSchema:
  type: object
  properties:
    title: Freight Terminal Safety Inspection Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: general_safety
      label: General Safety
      hint: null
      type: select_one
      options:
      - Very Safe
      - Safe
      - Not Safe
      required: true
    - id: 5
      name: specific_safety
      label: Specific Safety
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 6
      name: equipment_condition
      label: Equipment Condition
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 7
      name: facility_condition
      label: Facility Condition
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
    - id: 9
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
      required: true
