      type: text
      options: []
      required: false
    - id: 5
      name: manufacturer
      label: manufacturer
      hint: null
      type: select_multiple
      options:
      - 3M
      - Alpha PPE
      - 3M PPE
      - Others
      required: false
    - id: 6
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: signature
      label: signature
      hint: null
      type: text
      options: []
      required: false
