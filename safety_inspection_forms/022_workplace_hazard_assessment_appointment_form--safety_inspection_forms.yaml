inputSchema:
  type: object
  properties:
    title: Workplace Hazard Assessment Appointment Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: 'This is the Workplace Hazard Assessment Appointment Form for your safety
        inspection.

        Please fill out the details below to schedule your inspection.'
      type: note
      options: []
      required: false
    - id: 2
      name: user_input
      label: User Information
      hint: Please enter your contact information below -
      type: text
      options: []
      required: false
    - id: 3
      name: appointment_date
      label: Appointment Date
      hint: Select a date for your safety inspection -
      type: date
      options: []
      required: false
    - id: 4
      name: appointment_time
      label: Appointment Time
      hint: Select a time for your safety inspection -
      type: time
      options: []
      required: false
    - id: 5
      name: contact_email
      label: Contact Email
      hint: Enter your contact email address -
      type: email
      options: []
      required: false
    - id: 6
      name: contact_phone
      label: Contact Phone
      hint: Enter your contact phone number -
      type: text
      options: []
      required: false
    - id: 7
      name: assessment_type
      label: Assessment Type
      hint: Select the type of assessment you need -
      type: select_one
      options:
      - General Hazard Assessment
      - Ergonomic Assessment
      - Confined Space Assessment
      required: false
    - id: 8
      name: assessment_location
      label: Assessment Location
      hint: Select the office location(s) for the assessment -
      type: select_multiple
      options:
      - Office Location 1
      - Office Location 2
      - Office Location 3
      required: false
    - id: 9
      name: assessment_notes
      label: Assessment Notes
      hint: Enter any additional comments or notes for the assessment -
      type: note
      options: []
      required: false
    - id: 10
      name: submit_button
      label: Submit
      hint: Please review your submission and confirm your appointment -
      type: text
      options: []
      required: false
    - id: 11
      name: confirm_button
      label: Confirm
      hint: Confirm your submission to schedule your appointment -
      type: text
      options: []
      required: false
    - id: 12
      name: cancel_button
      label: Cancel
      hint: Cancel your submission and start over -
      type: text
      options: []
      required: false
