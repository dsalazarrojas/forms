inputSchema:
  type: object
  properties:
    title: Electrical Safety Test Report Form
    pages:
    - id: 1
      name: test_date
      label: Test Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: system_name
      label: System Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: system_type
      label: System Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: circuit_rating
      label: Circuit Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: electrical_inspection_results
      label: Electrical Inspection Results
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: corrective_action_taken
      label: Corrective Action Taken
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: inspector_signature
      label: Inspector Signature
      hint: null
      type: note
      options: []
      required: false
