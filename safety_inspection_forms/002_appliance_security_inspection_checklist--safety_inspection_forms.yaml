inputSchema:
  type: object
  properties:
    title: Appliance Security Inspection Checklist
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: Date when the security inspection is conducted
      type: date
      options: []
      required: true
    - id: 2
      name: inspection_time
      label: Inspection Time
      hint: Time when inspection began
      type: time
      options: []
      required: true
    - id: 3
      name: inspector_name
      label: Inspector Name
      hint: Full name of the security inspector
      type: text
      options: []
      required: true
    - id: 4
      name: inspector_id
      label: Inspector ID
      hint: Employee or badge identification number
      type: text
      options: []
      required: true
    - id: 5
      name: location_name
      label: Location Name
      hint: Name of the facility or location being inspected
      type: text
      options: []
      required: true
    - id: 6
      name: location_address
      label: Location Address
      hint: Full address of the inspection site
      type: text
      options: []
      required: true
    - id: 7
      name: appliance_category
      label: Appliance Category
      hint: Type of appliances at this location
      type: select_one
      options:
      - Kitchen Appliances
      - Laundry Appliances
      - HVAC Systems
      - Security Equipment
      - Mixed Categories
      required: true
    - id: 8
      name: electrical_safety_check
      label: Electrical Safety Check
      hint: Status of electrical connections and wiring
      type: select_one
      options:
      - Pass
      - Fail
      - Not Applicable
      required: true
    - id: 9
      name: electrical_safety_notes
      label: Electrical Safety Notes
      hint: Additional notes about electrical inspection
      type: text
      options: []
      required: false
    - id: 10
      name: physical_security_check
      label: Physical Security Check
      hint: Status of physical security measures
      type: select_one
      options:
      - Pass
      - Fail
      - Needs Improvement
      required: true
    - id: 11
      name: access_control_verification
      label: Access Control Verification
      hint: Verification of access control systems
      type: select_one
      options:
      - Verified
      - Not Verified
      - System Offline
      required: true
    - id: 12
      name: surveillance_equipment_status
      label: Surveillance Equipment Status
      hint: Current status of surveillance cameras and monitors
      type: select_one
      options:
      - Fully Operational
      - Partially Operational
      - Non-Operational
      - Not Installed
      required: true
    - id: 13
      name: fire_safety_equipment
      label: Fire Safety Equipment
      hint: Status of fire extinguishers and alarms
      type: select_one
      options:
      - Inspected and Current
      - Needs Inspection
      - Expired
      - Not Present
      required: true
    - id: 14
      name: emergency_exits_clear
      label: Emergency Exits Clear
      hint: Are all emergency exits unobstructed
      type: select_one
      options:
      - Yes - All Clear
      - No - Obstructions Found
      - Not Applicable
      required: true
    - id: 15
      name: hazard_identification
      label: Hazard Identification
      hint: Select any hazards identified during inspection
      type: select_multiple
      options:
      - Exposed Wiring
      - Blocked Exits
      - Leaking Appliances
      - Damaged Cords
      - Overloaded Circuits
      - None Identified
      required: true
    - id: 16
      name: hazard_details
      label: Hazard Details
      hint: Detailed description of identified hazards
      type: text
      options: []
      required: false
    - id: 17
      name: corrective_actions_needed
      label: Corrective Actions Needed
      hint: List actions required to address issues
      type: text
      options: []
      required: false
    - id: 18
      name: priority_level
      label: Priority Level
      hint: Urgency level for corrective actions
      type: select_one
      options:
      - Critical - Immediate Action Required
      - High - Action Within 24 Hours
      - Medium - Action Within 7 Days
      - Low - Schedule for Maintenance
      required: true
    - id: 19
      name: follow_up_required
      label: Follow-up Required
      hint: Is a follow-up inspection needed
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: follow_up_date
      label: Follow-up Date
      hint: Scheduled date for follow-up inspection
      type: date
      options: []
      required: false
    - id: 21
      name: inspector_signature
      label: Inspector Signature
      hint: Digital signature or typed name of inspector
      type: text
      options: []
      required: true
    - id: 22
      name: inspection_complete
      label: Inspection Complete
      hint: Confirmation that inspection is finished
      type: select_one
      options:
      - Yes - Inspection Complete
      - No - Inspection Incomplete
      required: true
