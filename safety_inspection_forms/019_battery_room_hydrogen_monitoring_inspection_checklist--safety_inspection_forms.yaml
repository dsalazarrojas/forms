inputSchema:
  type: object
  properties:
    title: Battery Room Hydrogen Monitoring Inspection Checklist
    pages:
    - id: 1
      name: inspection_id
      label: Inspection ID
      hint: Unique identifier
      type: text
      options: []
      required: true
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Inspection Time
      hint: Time of inspection
      type: time
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: Who performed inspection
      type: text
      options: []
      required: true
    - id: 5
      name: facility_name
      label: Facility Name
      hint: Location name
      type: text
      options: []
      required: true
    - id: 6
      name: battery_room_id
      label: Battery Room ID
      hint: Room identifier
      type: text
      options: []
      required: true
    - id: 7
      name: ventilation_system
      label: Ventilation System Status
      hint: Is it working
      type: select_one
      options:
      - Operating Normally
      - Operating with Issues
      - Not Operating
      - Not Applicable
      required: true
    - id: 8
      name: hydrogen_detector_status
      label: Hydrogen Detector Status
      hint: Is detector working
      type: select_one
      options:
      - Operational
      - Needs Calibration
      - Malfunctioning
      - Not Present
      required: true
    - id: 9
      name: hydrogen_level_reading
      label: Hydrogen Level Reading
      hint: Current ppm reading
      type: number
      options: []
      required: true
    - id: 10
      name: alarm_threshold
      label: Alarm Threshold
      hint: Set threshold
      type: number
      options: []
      required: true
    - id: 11
      name: alarm_tested
      label: Alarm Tested
      hint: Was alarm tested
      type: select_one
      options:
      - Yes - Working
      - Yes - Failed
      - 'False'
      required: true
    - id: 12
      name: emergency_lighting
      label: Emergency Lighting
      hint: Is it working
      type: select_one
      options:
      - Working
      - Not Working
      - Not Present
      required: true
    - id: 13
      name: fire_extinguisher
      label: Fire Extinguisher Present
      hint: Is it available
      type: select_one
      options:
      - Yes - In Date
      - Yes - Expired
      - 'False'
      required: true
    - id: 14
      name: eyewash_station
      label: Eyewash Station
      hint: Is it accessible
      type: select_one
      options:
      - Accessible and Working
      - Not Accessible
      - Not Present
      required: true
    - id: 15
      name: warning_signs
      label: Warning Signs Posted
      hint: Are signs visible
      type: select_one
      options:
      - Yes - All Present
      - Some Missing
      - No Signs
      required: true
    - id: 16
      name: floor_condition
      label: Floor Condition
      hint: State of floor
      type: select_one
      options:
      - Clean and Dry
      - Clean but Wet
      - Dirty
      - Damaged
      required: true
    - id: 17
      name: battery_condition
      label: Battery Condition
      hint: Visual inspection
      type: select_one
      options:
      - Good - No Issues
      - Minor Issues Noted
      - Major Issues Found
      required: true
    - id: 18
      name: leaks_detected
      label: Leaks Detected
      hint: Any electrolyte leaks
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 19
      name: temperature_reading
      label: Room Temperature
      hint: In Celsius
      type: number
      options: []
      required: true
    - id: 20
      name: overall_safety_rating
      label: Overall Safety Rating
      hint: Rate the room
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Unsafe
      required: true
    - id: 21
      name: corrective_actions
      label: Corrective Actions Needed
      hint: What needs to be done
      type: text
      options: []
      required: false
    - id: 22
      name: next_inspection_date
      label: Next Inspection Date
      hint: When is next due
      type: date
      options: []
      required: true
