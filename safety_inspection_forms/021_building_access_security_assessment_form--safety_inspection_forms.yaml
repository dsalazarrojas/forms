inputSchema:
  type: object
  properties:
    title: Building Access Security Assessment Form
    pages:
    - id: 1
      name: assessor_name
      label: Assessor Name
      hint: Full name of assessor
      type: text
      options: []
      required: true
    - id: 2
      name: assessor_title
      label: Assessor Title
      hint: Job title or position
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Security or facilities
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: assessment_date
      label: Assessment Date
      hint: Date of assessment
      type: date
      options: []
      required: true
    - id: 7
      name: building_name
      label: Building Name
      hint: Name of building
      type: text
      options: []
      required: true
    - id: 8
      name: building_address
      label: Building Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 9
      name: building_type
      label: Building Type
      hint: Type of facility
      type: select_one
      options:
      - Office Building
      - Residential Complex
      - Mixed Use
      - Industrial Facility
      - Retail Center
      - Government Building
      - Educational Institution
      - Healthcare Facility
      required: true
    - id: 10
      name: total_floors
      label: Total Floors
      hint: Number of floors
      type: number
      options: []
      required: true
    - id: 11
      name: total_entry_points
      label: Total Entry Points
      hint: Number of access points
      type: number
      options: []
      required: true
    - id: 12
      name: access_control_system
      label: Access Control System
      hint: Type of system in place
      type: select_one
      options:
      - Card Access System
      - Biometric System
      - Keypad Entry
      - Security Guard Staffed
      - Key Only
      - No Access Control
      - Hybrid System
      required: true
    - id: 13
      name: system_condition
      label: System Condition
      hint: Current condition
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Critical
      required: true
    - id: 14
      name: surveillance_system
      label: Surveillance System
      hint: CCTV coverage
      type: select_one
      options:
      - Full Coverage
      - Partial Coverage
      - Limited Coverage
      - No Coverage
      required: true
    - id: 15
      name: camera_count
      label: Number of Cameras
      hint: Approximate count
      type: number
      options: []
      required: false
    - id: 16
      name: alarm_system
      label: Alarm System
      hint: Intrusion detection
      type: select_one
      options:
      - Fully Operational
      - Partially Operational
      - Not Operational
      - Not Installed
      required: true
    - id: 17
      name: security_personnel
      label: Security Personnel
      hint: Staffing level
      type: select_one
      options:
      - 24/7 Staffed
      - Business Hours Only
      - Part Time
      - On Call Only
      - No Security Staff
      required: true
    - id: 18
      name: visitor_management
      label: Visitor Management
      hint: How are visitors handled
      type: select_one
      options:
      - Formal Check-in Required
      - Sign-in Log Only
      - Escort Required
      - No Formal Process
      required: true
    - id: 19
      name: perimeter_security
      label: Perimeter Security
      hint: External security measures
      type: select_multiple
      options:
      - Fencing
      - Gates
      - Bollards
      - Security Lighting
      - Barriers
      - Landscaping Controls
      - None
      required: true
    - id: 20
      name: vulnerabilities_found
      label: Vulnerabilities Identified
      hint: Select all that apply
      type: select_multiple
      options:
      - None Identified
      - Weak Access Points
      - Poor Lighting
      - Malfunctioning Equipment
      - Inadequate Coverage
      - Outdated Systems
      - Procedural Gaps
      - Training Deficiencies
      required: true
    - id: 21
      name: risk_level
      label: Overall Risk Level
      hint: Assessment of risk
      type: select_one
      options:
      - Low Risk
      - Moderate Risk
      - Elevated Risk
      - High Risk
      - Critical Risk
      required: true
    - id: 22
      name: recommendations
      label: Security Recommendations
      hint: Key recommendations
      type: text
      options: []
      required: true
    - id: 23
      name: priority_actions
      label: Priority Actions
      hint: Immediate actions needed
      type: text
      options: []
      required: false
    - id: 24
      name: follow_up_required
      label: Follow-up Required
      hint: Is re-assessment needed
      type: select_one
      options:
      - Yes - Within 30 Days
      - Yes - Within 90 Days
      - Yes - Within 6 Months
      - No - Next Annual Review
      required: true
    - id: 25
      name: assessor_certification
      label: Assessor Certification
      hint: I certify this assessment is accurate
      type: select_one
      options:
      - Yes - I Certify
      - 'False'
      required: true
