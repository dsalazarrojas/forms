inputSchema:
  type: object
  properties:
    title: Aviation Safety Incident Form
    pages:
    - id: 1
      name: section_reporter_info
      label: -- Person Reporting Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: reporter_name
      label: Reporter Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: reporter_email
      label: Reporter Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: reporter_phone
      label: Reporter Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: section_incident_logistics
      label: -- Incident Time and Location --
      hint: Provide the exact details of the event
      type: note
      options: []
      required: false
    - id: 6
      name: incident_date
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: incident_time
      label: Time of Incident
      hint: UTC or Local Time
      type: time
      options: []
      required: true
    - id: 8
      name: incident_location
      label: Location of Incident
      hint: Airport, Navaid, or Lat/Long
      type: text
      options: []
      required: true
    - id: 9
      name: section_aircraft_info
      label: -- Aircraft Details --
      hint: Information about the plane involved
      type: note
      options: []
      required: false
    - id: 10
      name: tail_number
      label: Aircraft Tail Number
      hint: e.g. N12345
      type: text
      options: []
      required: true
    - id: 11
      name: aircraft_type
      label: Aircraft Type
      hint: e.g. Boeing 777, Cessna 172
      type: text
      options: []
      required: true
    - id: 12
      name: incident_severity
      label: Incident Severity Rating
      hint: Scale of potential impact
      type: select_one
      options:
      - Minor - No damage or injury
      - Moderate - Minor damage or delays
      - Major - Significant damage or injury
      - Critical - Hull loss or fatalities
      required: true
    - id: 13
      name: incident_type
      label: Type of Incident
      hint: Select all that apply
      type: select_multiple
      options:
      - Engine or Powerplant Issue
      - Avionics or System Failure
      - Landing Gear or Brake Problem
      - Bird or Wildlife Strike
      - Mid-air or Ground Near Miss
      - Weather or Turbulence Related
      - Fuel Related Issue
      required: true
    - id: 14
      name: incident_description
      label: Detailed Description of Incident
      hint: Please provide a full account of the event
      type: text
      options: []
      required: true
    - id: 15
      name: contributing_factors
      label: Potential Contributing Factors
      hint: Select all that apply
      type: select_multiple
      options:
      - Human Factors (Fatigue, Stress)
      - Mechanical Failure
      - Environmental/Weather Conditions
      - Communication Breakdown
      - Operational Pressure
      required: true
    - id: 16
      name: immediate_actions
      label: Immediate Actions Taken
      hint: What did you do to resolve the situation?
      type: text
      options: []
      required: true
    - id: 17
      name: incident_outcome
      label: Final Incident Outcome
      hint: Select the result of the event
      type: select_one
      options:
      - Normal Landing/Resumption
      - Emergency Landing/Diversion
      - Aircraft Damage (Minor)
      - Aircraft Damage (Major)
      - Personnel Injuries
      required: true
    - id: 18
      name: prevention_recommendations
      label: Recommendations for Prevention
      hint: How can we prevent this in the future?
      type: text
      options: []
      required: false
