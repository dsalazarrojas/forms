inputSchema:
  type: object
  properties:
    title: Equipment Inspection Form
    pages:
    - id: 1
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: equipment_name
      label: equipment_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: equipment_description
      label: equipment_description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: inspection_frequency
      label: inspection_frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: false
    - id: 5
      name: condition_status
      label: condition_status
      hint: null
      type: select_multiple
      options:
      - Safe
      - Not Safe
      - Not Applicable
      required: false
    - id: 6
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
