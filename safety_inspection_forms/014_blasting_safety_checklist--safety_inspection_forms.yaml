inputSchema:
  type: object
  properties:
    title: Blasting Safety Checklist
    pages:
    - id: 1
      name: checklist_header
      label: -- Pre Blast Safety Checklist --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_name
      label: Inspector name
      hint: Person completing checklist
      type: text
      options: []
      required: true
    - id: 3
      name: date
      label: Date
      hint: Date of inspection
      type: date
      options: []
      required: true
    - id: 4
      name: time
      label: Time
      hint: Time of inspection
      type: time
      options: []
      required: true
    - id: 5
      name: blast_area_secured
      label: Blast area secured
      hint: Confirm exclusion zones established
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: communication_confirmed
      label: Communication confirmed
      hint: All teams briefed on schedule
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: equipment_checked
      label: Equipment checked
      hint: Monitoring and detonation gear verified
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: weather_conditions
      label: Weather conditions
      hint: Note wind rain or other factors
      type: text
      options: []
      required: false
    - id: 9
      name: additional_actions_required
      label: Additional actions required
      hint: Any outstanding actions before blast
      type: text
      options: []
      required: false
