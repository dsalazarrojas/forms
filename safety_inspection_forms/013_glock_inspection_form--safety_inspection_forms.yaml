inputSchema:
  type: object
  properties:
    title: glock-inspection-form
    pages:
    - id: 1
      name: g_prophets
      label: glock inspection form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: weapon_condition
      label: weapon condition
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: safety_checklist
      label: safety checklist
      hint: null
      type: select_multiple
      options:
      - Trigger is safe to use
      - Safety is engaged properly
      - Trigger is locked and safe
      - Trigger is not locked and safe
      - Magazine release is functional
      - Ejector is functional
      - Magazine is properly seated
      - Chamber is clear
      - Barrel is free from obstructions
      required: false
    - id: 4
      name: maintenance_record
      label: maintenance record
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: glock_model
      label: glock model
      hint: null
      type: select_one
      options:
      - Glock 19
      - Glock 20
      - Glock 21
      - label:ประก Glock 22
      - Glock 23
      - Glock 24
      - Glock 25
      - Glock 26
      - Glock 27
      - Glock 28
      - Glock 29
      - Glock 30
      - Glock 31
      required: false
    - id: 6
      name: inspection_date
      label: inspection date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: glock_condition
      label: glock condition
      hint: null
      type: select_multiple
      options:
      - Operational
      - Damaged
      - Functional
      - Non-Operational
      - Requires Maintenance
      required: false
    - id: 8
      name: inspection_status
      label: inspection status
      hint: null
      type: select_one
      options:
      - Incomplete
      - Complete
      - Not Inspected
      required: false
    - id: 9
      name: glock_maintenance_record
      label: glock maintenance record
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: glock_inspection_signature
      label: glock inspection signature
      hint: null
      type: text
      options: []
      required: false
