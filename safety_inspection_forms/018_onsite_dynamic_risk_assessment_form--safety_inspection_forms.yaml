      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: risk_summary
      label: Risk Summary
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: true
