inputSchema:
  type: object
  properties:
    title: PPE Safety Checklist - Safety Inspection Forms
    pages:
    - id: 1
      name: ppe_equipment_type
      label: What type of PPE equipment used?
      hint: null
      type: select_multiple
      options:
      - Hard Hat
      - Safety Glasses
      - Face Shield
      - Safety Gloves
      required: false
    - id: 2
      name: ppe_equipment_condition
      label: Is the PPE equipment in good condition?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 3
      name: ppe_equipment_worn
      label: Is the PPE equipment properly worn?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 4
      name: ppe_equipment_label
      label: What is the PPE equipment label?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: ppe_equipment_storage
      label: Is the PPE equipment properly stored?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 6
      name: ppe_equipment_cleaning
      label: Is the PPE equipment cleaned and sanitized regularly?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
