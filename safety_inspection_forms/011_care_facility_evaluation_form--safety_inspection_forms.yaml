inputSchema:
  type: object
  properties:
    title: Care Facility Evaluation Form
    pages:
    - id: 1
      name: facility_name
      label: Facility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: facility_address
      label: Facility Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 3
      name: facility_type
      label: Facility Type
      hint: null
      type: select_one
      options:
      - Assisted Living Facility
      - Nursing Home
      - Skilled Nursing Facility
      - Memory Care Facility
      - Independent Living Community
      - Continuing Care Retirement Community
      - Residential Care Home
      required: true
    - id: 4
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: evaluator_name
      label: Evaluator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: evaluator_role
      label: Evaluator Role
      hint: null
      type: select_one
      options:
      - State Inspector
      - Accreditation Surveyor
      - Family Member
      - Resident
      - Healthcare Consultant
      - Other
      required: true
    - id: 7
      name: facility_capacity
      label: Facility Capacity
      hint: Number of residents
      type: number
      options: []
      required: true
    - id: 8
      name: current_occupancy
      label: Current Occupancy
      hint: Number of current residents
      type: number
      options: []
      required: true
    - id: 9
      name: cleanliness_rating
      label: Overall Cleanliness Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 10
      name: safety_features
      label: Safety Features Present
      hint: Select all that apply
      type: select_multiple
      options:
      - Handrails in hallways
      - Emergency call systems
      - Fire sprinkler system
      - Smoke detectors
      - Emergency exits clearly marked
      - Non-slip flooring
      - Adequate lighting
      - Security system
      - Secured entrances
      - Wheelchair accessibility
      required: true
    - id: 11
      name: staff_responsiveness
      label: Staff Responsiveness
      hint: null
      type: select_one
      options:
      - Excellent - immediate response
      - Very Good - prompt response
      - Good - reasonable response time
      - Fair - slow response
      - Poor - inadequate response
      required: true
    - id: 12
      name: staff_to_resident_ratio
      label: Staff to Resident Ratio
      hint: Approximate
      type: select_one
      options:
      - Excellent (1:3 or better)
      - Good (1:4 to 1:6)
      - Adequate (1:7 to 1:10)
      - Below adequate (1:11 or worse)
      - Unable to determine
      required: true
    - id: 13
      name: medication_management
      label: Medication Management
      hint: null
      type: select_one
      options:
      - Excellent - well organized and monitored
      - Good - adequate systems in place
      - Fair - some concerns
      - Poor - significant concerns
      - Not observed
      required: true
    - id: 14
      name: dining_services
      label: Dining Services Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: dietary_accommodations
      label: Dietary Accommodations Available
      hint: Select all that apply
      type: select_multiple
      options:
      - Low sodium options
      - Diabetic-friendly meals
      - Pureed textures
      - Religious dietary requirements
      - Vegetarian options
      - Gluten-free options
      - Cultural food preferences
      - Limited accommodations
      required: true
    - id: 16
      name: activity_programs
      label: Activity Programs
      hint: null
      type: select_one
      options:
      - Excellent - diverse daily activities
      - Very Good - regular activities
      - Good - some activities offered
      - Fair - limited activities
      - Poor - minimal activities
      required: true
    - id: 17
      name: social_engagement
      label: Social Engagement Opportunities
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 18
      name: room_conditions
      label: Resident Room Conditions
      hint: null
      type: select_one
      options:
      - Excellent - clean and well maintained
      - Very Good - good condition
      - Good - acceptable condition
      - Fair - needs improvement
      - Poor - significant issues
      required: true
    - id: 19
      name: bathroom_accessibility
      label: Bathroom Accessibility
      hint: null
      type: select_one
      options:
      - Excellent - fully accessible
      - Very Good - mostly accessible
      - Good - adequately accessible
      - Fair - limited accessibility
      - Poor - not accessible
      required: true
    - id: 20
      name: outdoor_spaces
      label: Outdoor Spaces
      hint: Gardens, patios, walking areas
      type: select_one
      options:
      - Excellent - well maintained and accessible
      - Very Good - good outdoor areas
      - Good - adequate outdoor space
      - Fair - limited outdoor access
      - Poor - no outdoor access
      required: true
    - id: 21
      name: infection_control
      label: Infection Control Measures
      hint: null
      type: select_one
      options:
      - Excellent - comprehensive protocols
      - Very Good - strong protocols
      - Good - adequate protocols
      - Fair - basic protocols
      - Poor - inadequate protocols
      required: true
    - id: 22
      name: complaint_resolution
      label: Complaint Resolution Process
      hint: null
      type: select_one
      options:
      - Excellent - clear and responsive
      - Very Good - well defined process
      - Good - adequate process
      - Fair - unclear process
      - Poor - no clear process
      required: true
    - id: 23
      name: family_involvement
      label: Family Involvement Opportunities
      hint: null
      type: select_one
      options:
      - Excellent - very welcoming
      - Very Good - good communication
      - Good - adequate involvement
      - Fair - limited involvement
      - Poor - minimal family engagement
      required: true
    - id: 24
      name: overall_rating
      label: Overall Facility Rating
      hint: null
      type: select_one
      options:
      - 5 stars - Excellent
      - 4 stars - Very Good
      - 3 stars - Good
      - 2 stars - Fair
      - 1 star - Poor
      required: true
    - id: 25
      name: deficiencies_noted
      label: Deficiencies Noted
      hint: List any concerns
      type: text
      options: []
      required: false
    - id: 26
      name: recommendations
      label: Recommendations for Improvement
      hint: Optional
      type: text
      options: []
      required: false
    - id: 27
      name: follow_up_required
      label: Follow-up Inspection Required
      hint: null
      type: select_one
      options:
      - Yes - within 30 days
      - Yes - within 90 days
      - Yes - within 1 year
      - No - routine follow-up only
      - No follow-up needed
      required: true
