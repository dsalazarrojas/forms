      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: equipment_id
      label: Equipment ID
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: sling_capacity
      label: Sling Capacity
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: safety_factor
      label: Safety Factor
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: inspection_status
