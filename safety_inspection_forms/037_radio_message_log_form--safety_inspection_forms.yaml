inputSchema:
  type: object
  properties:
    title: radio_message_log_form
    pages:
    - id: 1
      name: message_type
      label: Message Type
      hint: null
      type: select_one
      options:
      - Voice
      - Text
      - Image
      required: true
    - id: 2
      name: message_date
      label: Prophet's Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: message_time
      label: Message Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: sender
      label: Sender
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: recipient
      label: Recipient
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: attachments
      label: Attachments
      hint: null
      type: select_multiple
      options:
      - 3G
      - 4G
      - 5G
      - Other
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
