inputSchema:
  type: object
  properties:
    title: Trailer Towing Safety Checklist
    pages:
    - id: 1
      name: trailer_towing_safety_checklist_form
      label: Safety Pre-Inspection Checklist
      hint: null
      type: text
      options: []
      required: false
