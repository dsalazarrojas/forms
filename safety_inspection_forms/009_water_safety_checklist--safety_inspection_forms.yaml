inputSchema:
  type: object
  properties:
    title: Water Safety Checklist
    pages:
    - id: 1
      name: facility_name
      label: Facility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: water_quality_issues
      label: Water Quality Issues
      hint: null
      type: select_multiple
      options:
      - Algae or slime growth in pipes
      - Coliforms or E. coli
      - Dissolved oxygen levels low
      - Other
      required: true
    - id: 4
      name: safety_equipment
      label: Safety Equipment
      hint: null
      type: select_one
      options:
      - Fire extinguisher
      - First aid kit
      - Life jacket
      - Other
      required: true
