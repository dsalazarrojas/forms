      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: safety_inspection_date
      label: Safety Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: safety_inspection_time
      label: Safety Inspection Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: employee_signature
      label: Employee Signature
      hint: null
      type: select_one
      options:
