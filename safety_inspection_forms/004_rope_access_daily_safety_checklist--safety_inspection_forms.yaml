inputSchema:
  type: object
  properties:
    title: Rope Access Daily Safety Checklist
    pages:
    - id: 1
      name: work_at_height
      label: Work at Height
      hint: null
      type: select_one
      options:
      - Rope access only
      - Ropeless access
      required: false
    - id: 2
      name: harness_system
      label: Harness System
      hint: null
      type: select_one
      options:
      - Self-retrievable descent device
      - Rope grab line
      - Rope anchor
      - No harness system
      required: false
    - id: 3
      name: fall_zone
      label: Fall Zone
      hint: null
      type: select_one
      options:
      - Fall zone 1
      - Fall zone 2
      - No fall zone
      required: false
    - id: 4
      name: weather_conditions
      label: Weather Conditions
      hint: null
      type: select_multiple
      options:
      - Clear
      - Cloudy
      - Rain
      - Snow
      - Wind
      required: false
    - id: 5
      name: personal_equipment
      label: Personal Equipment
      hint: null
      type: select_multiple
      options:
      - Hard hat
      - Safety harness
      - Safety glasses
      - Safety harness inspection checklist
      required: false
    - id: 6
      name: safety_procedures
      label: Safety Procedures
      hint: null
      type: select_multiple
      options:
      - Proper inspection
      - Correct usage
      - Emergency procedures
      required: false
    - id: 7
      name: team_leadership
      label: Team Leadership
      hint: null
      type: select_multiple
      options:
      - Lead person
      - Assistant lead
      - Team member
      required: false
    - id: 8
      name: emergency_contacts
      label: Emergency Contacts
      hint: null
      type: select_multiple
      options:
      - First aid kit
      - Emergency phone number
      - Emergency contact name
      required: false
    - id: 9
      name: rescue_equipment
      label: Rescue Equipment
      hint: null
      type: select_multiple
      options:
      - Rope grab line
      - Rescue line
      - Rescue device
      required: false
    - id: 10
      name: communication
      label: Communication
      hint: null
      type: select_multiple
      options:
      - Two-way radio
      - Cell phone
      - Radio phone
      required: false
