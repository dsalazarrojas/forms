inputSchema:
  type: object
  properties:
    title: Safety Compliance Checklist Access Form
    pages:
    - id: 1
      name: form_title
      label: Form Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: purpose
      label: Purpose of the Safety Compliance Checklist
      hint: Please describe the purpose of the Safety Compliance Checklist
      type: text
      options: []
      required: true
    - id: 3
      name: responsible_officer
      label: Responsible Officer
      hint: Name and designation of the officer responsible for the checklist
      type: text
      options: []
      required: true
    - id: 4
      name: inspection_areas
      label: Inspection Areas
      hint: null
      type: select_multiple
      options:
      - Fire Safety
      - Electrical Safety
      - Chemical Safety
      - Emergency Equipment
      - Personal Protective Equipment
      required: true
    - id: 5
      name: inspection_schedule
      label: Inspection Schedule
      hint: Date of the last inspection
      type: date
      options: []
      required: true
    - id: 6
      name: incident_reporting
      label: Incident Reporting
      hint: Procedures for reporting and documenting safety incidents
      type: text
      options: []
      required: true
    - id: 7
      name: safety_training
      label: Safety Training
      hint: null
      type: select_one
      options:
      - On-the-job
      - Class Room
      - Online Course
      - Others
      required: true
    - id: 8
      name: safety_records
      label: Safety Records Maintenance
      hint: null
      type: select_multiple
      options:
      - Maintenance Records
      - Incident Records
      - Training Records
      - Certification Records
      required: true
    - id: 9
      name: non_compliance_consequences
      label: Non-Compliance Consequences
      hint: Consequences of non-compliance with safety standards
      type: text
      options: []
      required: true
    - id: 10
      name: incident_reporting_process
      label: Incident Reporting Process
      hint: null
      type: select_multiple
      options:
      - Immediate Reporting
      - Investigation
      - Reporting to Authorities
      - Others
      required: true
    - id: 11
      name: safety_officer_role
      label: Role of Safety Officer
      hint: null
      type: select_multiple
      options:
      - Conducting Training
      - Conducting Inspections
      - Maintaining Records
      - Coordinating with Authorities
      required: true
    - id: 12
      name: safety_compliance_monitoring
      label: Safety Compliance Monitoring
      hint: null
      type: select_one
      options:
      - Regular Inspections
      - Audits
      - Certification
      - Others
      required: true
