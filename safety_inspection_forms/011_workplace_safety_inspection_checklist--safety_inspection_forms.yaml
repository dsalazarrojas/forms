      hint: null
      type: select_multiple
      options:
      - Emergency Exit Signs
      - Emergency Light
      required: false
    - id: 17
      name: emergency_exit_signs
      label: Emergency Exit Sign
      hint: null
      type: select_multiple
      options:
      - Exit Signs
      - Emergency Exit Signs
      - Directional Signs
      required: false
