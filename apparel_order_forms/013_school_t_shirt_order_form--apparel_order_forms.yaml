inputSchema:
  type: object
  properties:
    title: School T Shirt Order Form
    pages:
    - id: 1
      name: order_details
      label: order_details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_info
      label: customer_info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: shipping_details
      label: shipping_details
      hint: null
      type: text
      options: []
