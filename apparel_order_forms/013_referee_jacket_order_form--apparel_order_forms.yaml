inputSchema:
  type: object
  properties:
    title: Referee Jacket Order Form
    pages:
    - id: 1
      name: order_form
      label: Order Form
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - Discover
      - American Express
      required: false
    - id: 3
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_type
      label: Order Type
      hint: null
      type: select_one
      options:
      - Men's
      - Women's
      - Kids'
      required: false
    - id: 7
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
