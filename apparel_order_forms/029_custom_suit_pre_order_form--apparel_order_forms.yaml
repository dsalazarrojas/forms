inputSchema:
  type: object
  properties:
    title: custom_suit_pre_order_form
    pages:
    - id: 1
      name: customer_name
      label: name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: customer_phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: garment_type
      label: garment type
      hint: null
      type: select_one
      options:
      - suit
      - jacket
      - pants
      - skirt
      required: true
    - id: 5
      name: order_type
      label: order type
      hint: null
      type: select_one
      options:
      - made to measure
      - custom made
      required: true
    - id: 6
      name: fabric
      label: fabric
      hint: null
      type: select_multiple
      options:
      - wool
      - cotton
      - polyester
      - silk
      required: true
    - id: 7
      name: size
      label: size
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: color
      label: color
      hint: null
      type: select_one
      options:
      - black
      - blue
      - gray
      - green
      - red
      required: true
    - id: 9
      name: price
      label: price
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: payment_method
      label: payment method
      hint: null
      type: select_one
      options:
      - credit card
      - paypal
      - bank transfer
      - invoice
      required: true
    - id: 11
      name: order_status
      label: order status
      hint: null
      type: select_one
      options:
      - pending
      - in_progress
      - completed
      required: true
    - id: 12
      name: payment_status
      label: payment status
      hint: null
      type: select_one
      options:
      - paid
      - partially_paid
      - not_paid
      required: true
