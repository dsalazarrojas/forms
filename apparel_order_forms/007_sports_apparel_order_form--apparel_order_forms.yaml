inputSchema:
  type: object
  properties:
    title: Sports Apparel Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: order_items
      label: Order Items
      hint: null
      type: select_multiple
      options:
      - Baseball Jersey,Baseball Jersey
      - Basketball Shorts,Basketball Shorts
      - Football Cleats,Football Cleats
      - Soccer Ball,Soccer Ball
      required: true
    - id: 3
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: customer_notes
      label: Customer Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: shipping_address
      label: Shipping Address
      hint: null
      type: select_one
      options:
      - Home,Home
      - Office,Office
      required: true
    - id: 7
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
