      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: select_product
      label: Select Product
      hint: null
      type: select_one
      options:
      - Product 1
      - Product 2
      - Product 3
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
