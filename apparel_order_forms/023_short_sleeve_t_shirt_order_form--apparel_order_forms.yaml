      - Payment 2
      - Payment 3
      required: false
    - id: 4
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: Enter your email
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: total_amount
      label: Total Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
