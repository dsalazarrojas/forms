inputSchema:
  type: object
  properties:
    title: Soccer Team T Shirt Order Form
    pages:
    - id: 1
      name: team_name
      label: Team name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_size
      label: Team size
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: team_color
      label: Team color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      - Yellow
      required: false
    - id: 4
      name: shirt_size
      label: Shirt size
      hint: null
      type: select_one
      options:
      - Large
      - X-Large
      - Small
      - Medium
      required: false
    - id: 5
      name: color_choice
      label: Color choice
      hint: null
      type: select_one
      options:
      - Black
      - White
      - Gray
      - Colorful
      required: false
    - id: 6
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: shipping
      label: Shipping
      hint: null
      type: select_one
      options:
      - Ground
      - Air
      - Express
      required: false
    - id: 8
      name: payment_method
      label: Payment method
      hint: null
      type: select_multiple
      options:
      - Bank transfer
      - PayPal
      - Credit card
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
