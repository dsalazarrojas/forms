inputSchema:
  type: object
  properties:
    title: Apparel Order Form
    pages:
    - id: 1
      name: customer_info
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: customer_phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: state_province
      label: State/Province
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: ZIP/Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: product_selection
      label: -- Product Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: product_type
      label: Product Category
      hint: null
      type: select_one
      options:
      - T-Shirts
      - Hoodies
      - Polos
      - Jackets
      - Hats
      - Accessories
      required: true
    - id: 11
      name: product_color
      label: Color
      hint: null
      type: select_one
      options:
      - Black
      - White
      - Navy
      - Red
      - Blue
      - Gray
      - Green
      required: true
    - id: 12
      name: product_size
      label: Size
      hint: null
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      - XXXL
      required: true
    - id: 13
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: add_another_product
      label: Need another product?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 15
      name: payment_method
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: payment_option
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Bank Transfer
      - Check
      required: true
    - id: 17
      name: special_instructions
      label: Any special requests or instructions?
      hint: null
      type: text
      options: []
      required: false
