inputSchema:
  type: object
  properties:
    title: Dancewear Order Form Template
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: Please enter customer information
      type: text
      options: []
      required: true
    - id: 2
      name: order_products
      label: Order Products
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - American Express
      - Discover
      - Mastercard
      - Visa
      required: false
    - id: 4
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: special_instructions
      label: Special Instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: customer_notes
      label: Customer Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: billing_info
      label: Billing Info
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: customer_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
