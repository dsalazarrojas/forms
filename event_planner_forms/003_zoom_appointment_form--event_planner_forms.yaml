inputSchema:
  type: object
  properties:
    title: Zoom Appointment Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
