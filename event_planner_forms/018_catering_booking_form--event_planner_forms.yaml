inputSchema:
  type: object
  properties:
    title: Catering Booking Form
    pages:
    - id: 1
      name: client_name
      label: Client Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company or Organization
      hint: Your organization name
      type: text
      options: []
      required: false
    - id: 5
      name: event_name
      label: Event Name
      hint: Name or title of your event
      type: text
      options: []
      required: true
    - id: 6
      name: event_type
      label: Event Type
      hint: What type of event
      type: select_one
      options:
      - Wedding
      - Corporate Event
      - Birthday Party
      - Anniversary
      - Graduation
      - Conference
      - Private Party
      - Holiday Party
      - Other
      required: true
    - id: 7
      name: event_date
      label: Event Date
      hint: Date of your event
      type: date
      options: []
      required: true
    - id: 8
      name: event_start_time
      label: Event Start Time
      hint: When does the event start
      type: time
      options: []
      required: true
    - id: 9
      name: event_end_time
      label: Event End Time
      hint: When does the event end
      type: time
      options: []
      required: true
    - id: 10
      name: venue_name
      label: Venue Name
      hint: Name of the venue
      type: text
      options: []
      required: true
    - id: 11
      name: venue_address
      label: Venue Address
      hint: Complete address
      type: text
      options: []
      required: true
    - id: 12
      name: guest_count
      label: Number of Guests
      hint: Expected guest count
      type: number
      options: []
      required: true
    - id: 13
      name: menu_selection
      label: Menu Selection
      hint: Your chosen menu package
      type: select_one
      options:
      - Breakfast Package
      - Lunch Package
      - Dinner Package
      - Cocktail Reception
      - Buffet Style
      - Plated Service
      - Custom Menu
      required: true
    - id: 14
      name: beverage_package
      label: Beverage Package
      hint: Beverage service selection
      type: select_one
      options:
      - Non-Alcoholic Only
      - Beer and Wine
      - Full Bar
      - Coffee and Tea Service
      - No Beverage Service
      required: true
    - id: 15
      name: dietary_requirements
      label: Dietary Requirements
      hint: List all dietary restrictions
      type: text
      options: []
      required: true
    - id: 16
      name: vegetarian_count
      label: Vegetarian Meals Needed
      hint: Number of vegetarian meals
      type: number
      options: []
      required: false
    - id: 17
      name: vegan_count
      label: Vegan Meals Needed
      hint: Number of vegan meals
      type: number
      options: []
      required: false
    - id: 18
      name: gluten_free_count
      label: Gluten-Free Meals Needed
      hint: Number of gluten-free meals
      type: number
      options: []
      required: false
    - id: 19
      name: additional_services
      label: Additional Services
      hint: Extra services needed
      type: select_multiple
      options:
      - Tables and Chairs
      - Linens
      - China and Silverware
      - Glassware
      - Serving Staff
      - Bartenders
      - Setup and Cleanup
      - Decorations
      required: false
    - id: 20
      name: special_requests
      label: Special Requests
      hint: Any special requirements
      type: text
      options: []
      required: false
    - id: 21
      name: deposit_paid
      label: Deposit Paid
      hint: Have you paid the deposit
      type: select_one
      options:
      - true
      - false
      - Pending
      required: true
    - id: 22
      name: contract_signed
      label: Contract Signed
      hint: Have you signed the contract
      type: select_one
      options:
      - true
      - false
      - Pending
      required: true
    - id: 23
      name: booking_date
      label: Booking Date
      hint: Date of this booking
      type: date
      options: []
      required: true
    - id: 24
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
