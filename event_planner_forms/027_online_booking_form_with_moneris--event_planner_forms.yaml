inputSchema:
  type: object
  properties:
    title: Online Booking Form With Moneris
    pages:
    - id: 1
      name: category
      label: Event Planner Forms
      hint: Select a category for this form
      type: select_one
      options:
      - Event Planner Forms
      - Other
      required: true
    - id: 2
      name: description
      label: Description
      hint: Describe this form's purpose and functionality
      type: text
      options: []
      required: false
    - id: 3
      name: form_id
      label: Form ID
      hint: Enter your unique 4-digit form ID
      type: number
      options: []
      required: true
    - id: 4
      name: output_file
      label: Output File
      hint: Name for saved output files
      type: text
      options: []
      required: false
    - id: 5
      name: assigned_tool
      label: Assigned Tool
      hint: Select a tool or platform this form is integrated with
      type: select_one
      options:
      - chatjimmy
      - Google Calendar
      - Other
      required: false
    - id: 6
      name: categories
      label: Categories
      hint: Select multiple categories for this form
      type: select_multiple
      options:
      - Event Planner Forms
      - Event Forms
      - Forms
      required: false
    - id: 7
      name: description_2
      label: Form Description
      hint: Describe how this form will help users manage events
      type: text
      options: []
      required: false
    - id: 8
      name: integration_description
      label: Integration Description
      hint: Explain how this form integrates with calendars, CRMs, and spreadsheets
      type: text
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: Add any additional notes about this form
      type: text
      options: []
      required: false
