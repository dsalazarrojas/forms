inputSchema:
  type: object
  properties:
    title: Participant Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_email
      label: participant_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: participant_phone
      label: participant_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participant_email_verification
      label: Verify Participant Email
      hint: Check if this email address matches with participant_name
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''participant_email_verification_1'', ''label'': True}'
      - '{''id'': 2, ''name'': ''participant_email_verification_2'', ''label'': False}'
      required: false
    - id: 5
      name: participant_program
      label: Participant Program
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''participant_program_1'', ''label'': ''Program 1''}'
      - '{''id'': 2, ''name'': ''participant_program_2'', ''label'': ''Program 2''}'
      - '{''id'': 3, ''name'': ''participant_program_3'', ''label'': ''Program 3''}'
      required: false
    - id: 6
      name: participant_start_date
      label: Participant Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: participant_end_date
      label: Participant End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: participant_notes
      label: participant_notes
      hint: null
      type: note
      options: []
      required: false
