inputSchema:
  type: object
  properties:
    title: Catering Contact Form Template
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: Your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Your company or organization
      type: text
      options: []
      required: false
    - id: 5
      name: subject
      label: Subject
      hint: What is this regarding
      type: select_one
      options:
      - General Inquiry
      - Event Booking
      - Menu Questions
      - Pricing Information
      - Tasting Request
      - Other
      required: true
    - id: 6
      name: event_type
      label: Event Type
      hint: What type of event
      type: select_one
      options:
      - Wedding
      - Corporate Event
      - Birthday Party
      - Anniversary
      - Graduation
      - Conference
      - Private Party
      - Holiday Party
      - Other
      - Not Sure Yet
      required: false
    - id: 7
      name: event_date
      label: Event Date
      hint: Date of your event
      type: date
      options: []
      required: false
    - id: 8
      name: guest_count
      label: Estimated Guest Count
      hint: Number of guests expected
      type: number
      options: []
      required: false
    - id: 9
      name: venue_location
      label: Venue Location
      hint: City or area of event
      type: text
      options: []
      required: false
    - id: 10
      name: message
      label: Message
      hint: Your inquiry or questions
      type: text
      options: []
      required: true
    - id: 11
      name: preferred_contact
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Any Method
      required: true
    - id: 12
      name: best_time_to_contact
      label: Best Time to Contact
      hint: When are you available
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Anytime
      required: false
    - id: 13
      name: how_heard
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Website
      - Social Media
      - Referral
      - Advertisement
      - Previous Customer
      - Other
      required: false
    - id: 14
      name: newsletter_signup
      label: Subscribe to Newsletter
      hint: Receive updates and promotions
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 15
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
