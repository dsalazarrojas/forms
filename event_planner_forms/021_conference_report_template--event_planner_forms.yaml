inputSchema:
  type: object
  properties:
    title: Conference Report Template
    pages:
    - id: 1
      name: report_title
      label: Report Title
      hint: Name of this report
      type: text
      options: []
      required: true
    - id: 2
      name: conference_name
      label: Conference Name
      hint: Event being reported
      type: text
      options: []
      required: true
    - id: 3
      name: conference_date
      label: Conference Date
      hint: When was the conference
      type: date
      options: []
      required: true
    - id: 4
      name: conference_location
      label: Conference Location
      hint: Venue and city
      type: text
      options: []
      required: true
    - id: 5
      name: report_author
      label: Report Author
      hint: Who is preparing this report
      type: text
      options: []
      required: true
    - id: 6
      name: author_role
      label: Author Role
      hint: Your position
      type: select_one
      options:
      - Event Organizer
      - Committee Member
      - Session Chair
      - Volunteer
      - Attendee
      - Other
      required: true
    - id: 7
      name: report_date
      label: Report Date
      hint: Date of report
      type: date
      options: []
      required: true
    - id: 8
      name: executive_summary
      label: Executive Summary
      hint: Brief overview of the conference
      type: text
      options: []
      required: true
    - id: 9
      name: total_attendees
      label: Total Number of Attendees
      hint: Registration count
      type: number
      options: []
      required: true
    - id: 10
      name: total_speakers
      label: Total Number of Speakers
      hint: Presenter count
      type: number
      options: []
      required: true
    - id: 11
      name: total_sessions
      label: Total Number of Sessions
      hint: Session count
      type: number
      options: []
      required: true
    - id: 12
      name: sessions_rating
      label: Overall Sessions Quality Rating
      hint: Rate the sessions
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: venue_rating
      label: Venue Rating
      hint: Rate the venue
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: catering_rating
      label: Catering Rating
      hint: Rate food and beverage
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: organization_rating
      label: Organization Rating
      hint: Rate event organization
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: highlights
      label: Conference Highlights
      hint: What went well
      type: text
      options: []
      required: true
    - id: 17
      name: challenges
      label: Challenges Encountered
      hint: Issues faced
      type: text
      options: []
      required: true
    - id: 18
      name: budget_summary
      label: Budget Summary
      hint: Financial overview
      type: text
      options: []
      required: false
    - id: 19
      name: sponsor_feedback
      label: Sponsor Feedback
      hint: Sponsor comments
      type: text
      options: []
      required: false
    - id: 20
      name: attendee_feedback_summary
      label: Attendee Feedback Summary
      hint: Key feedback points
      type: text
      options: []
      required: true
    - id: 21
      name: areas_for_improvement
      label: Areas for Improvement
      hint: What can be better
      type: text
      options: []
      required: true
    - id: 22
      name: recommendations
      label: Recommendations for Future Events
      hint: Suggestions
      type: text
      options: []
      required: true
    - id: 23
      name: success_metrics
      label: Success Metrics Achieved
      hint: KPIs met
      type: text
      options: []
      required: false
    - id: 24
      name: photos_attached
      label: Photos Attached
      hint: Are photos included
      type: select_one
      options:
      - Yes Photos Attached
      - No Photos Available
      - Photos to Follow
      required: false
    - id: 25
      name: appendices
      label: Appendices
      hint: Additional documents
      type: text
      options: []
      required: false
    - id: 26
      name: overall_assessment
      label: Overall Conference Assessment
      hint: Final evaluation
      type: select_one
      options:
      - Highly Successful
      - Successful
      - Moderately Successful
      - Below Expectations
      - Unsuccessful
      required: true
    - id: 27
      name: would_recommend
      label: Would You Recommend This Conference
      hint: For future attendees
      type: select_one
      options:
      - Yes Definitely
      - Yes With Reservations
      - false
      required: true
    - id: 28
      name: additional_comments
      label: Additional Comments
      hint: Any other notes
      type: text
      options: []
      required: false
