inputSchema:
  type: object
  properties:
    title: Christmas Party Room Registration Form
    pages:
    - id: 1
      name: organizer_name
      label: Organizer name
      hint: Name of person booking the room
      type: text
      options: []
      required: true
    - id: 2
      name: organization
      label: Organization or group name
      hint: If booking on behalf of a group
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email address
      hint: Confirmation will be sent here
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Contact for day of event
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Event date
      hint: Date requested for the party
      type: date
      options: []
      required: true
    - id: 6
      name: start_time
      label: Start time
      hint: Preferred start time
      type: time
      options: []
      required: true
    - id: 7
      name: end_time
      label: End time
      hint: Preferred end time
      type: time
      options: []
      required: true
    - id: 8
      name: expected_guests
      label: Expected number of guests
      hint: Estimate for capacity planning
      type: number
      options: []
      required: true
    - id: 9
      name: room_setup
      label: Room setup preferred
      hint: Describe seating or layout preferences
      type: text
      options: []
      required: false
    - id: 10
      name: special_requests
      label: Special requests
      hint: Any additional needs such as AV or catering or null
      type: text
      options: []
      required: false
