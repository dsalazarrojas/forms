inputSchema:
  type: object
  properties:
    title: Thanksgiving Party Signup Form
    pages:
    - id: 1
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: attending_friends
      label: Friends
      hint: List friends attending
      type: select_multiple
      options:
      - Friend 1
      - Friend 2
      - Friend 3
      required: false
    - id: 9
      name: attending_family
      label: Family
      hint: List family members attending
      type: select_multiple
      options:
      - Family Member 1
      - Family Member 2
      - Family Member 3
      required: false
    - id: 10
      name: attending_fiends
      label: Fiends
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
