inputSchema:
  type: object
  properties:
    title: Camp Liability Waiver Form
    pages:
    - id: 1
      name: section_parent_info
      label: -- Parent or Guardian Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: parent_relationship
      label: Relationship to Camper
      hint: null
      type: select_one
      options:
      - Parent
      - Guardian
      - Grandparent
      - Other
      required: true
    - id: 4
      name: parent_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: parent_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: section_camper_info
      label: -- Camper Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: camper_name
      label: Camper Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: camper_date_of_birth
      label: Camper Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: section_acknowledgment
      label: -- Acknowledgment and Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: acknowledge_risks
      label: I acknowledge that camp activities involve inherent risks
      hint: Including but not limited to physical exertion, outdoor activities, and
        team sports
      type: select_one
      options:
      - Yes, I acknowledge
      - 'False'
      required: true
    - id: 11
      name: understand_camp_waiver
      label: I understand the camp is not liable for injuries or property damage
      hint: null
      type: select_one
      options:
      - Yes, I understand
      - 'False'
      required: true
    - id: 12
      name: assume_all_risks
      label: I assume all risks of participation
      hint: null
      type: select_one
      options:
      - Yes, I assume all risks
      - 'False'
      required: true
    - id: 13
      name: authorize_medical_care
      label: I authorize emergency medical care if needed
      hint: null
      type: select_one
      options:
      - Yes, I authorize
      - 'False'
      required: true
    - id: 14
      name: section_medical_info
      label: -- Emergency Medical Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: medical_conditions
      label: Known Medical Conditions or Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: current_medications
      label: Current Medications
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: physician_name
      label: Family Physician Name and Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: insurance_provider
      label: Health Insurance Provider and Policy Number
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: section_conduct_agreement
      label: -- Camper Conduct Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: follow_camp_rules
      label: Camper agrees to follow all camp rules and instructions
      hint: null
      type: select_one
      options:
      - Yes, agrees
      - 'False'
      required: true
    - id: 21
      name: responsible_conduct
      label: Camper agrees to conduct themselves respectfully
      hint: null
      type: select_one
      options:
      - Yes, agrees
      - 'False'
      required: true
    - id: 22
      name: parent_supervision_agreement
      label: I give permission for my child to participate in all camp activities
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 23
      name: release_and_waiver
      label: I release and waive any claims against camp organizers
      hint: null
      type: select_one
      options:
      - Yes, I release and waive
      - 'False'
      required: true
    - id: 24
      name: signature_date
      label: Date of Signature
      hint: null
      type: date
      options: []
      required: true
    - id: 25
      name: agreement_confirmation
      label: I have read and understand this liability waiver
      hint: null
      type: select_one
      options:
      - Yes, I confirm
      - 'False'
      required: true
