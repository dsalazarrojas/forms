inputSchema:
  type: object
  properties:
    title: Secret Santa Survey
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: gift_preferences
      label: Gift Preferences
      hint: null
      type: select_multiple
      options:
      - Gift Ideas
      - Gift Budget
      - Personalized
      required: true
    - id: 3
      name: gift_budget
      label: Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: gift_ideas
      label: Gift Ideas
      hint: null
      type: select_multiple
      options:
      - Gift Ideas
      - Unique Experiences
      - Fun And Games
      - Personalized
      - Practical Items
      - Gift Cards
      required: false
    - id: 5
      name: gift_card_budget
      label: Gift Card Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: favorite_hobbies
      label: Favorite Hobbies
      hint: null
      type: select_multiple
      options:
      - Hobbies
      - Interests
      - Hinterests
      required: false
    - id: 7
      name: favorite_hobbies_interests
      label: Interests
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: gift_interests
      label: Gift Interests
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: user_notes
      label: User Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit_form
      label: Submit Form
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: false
