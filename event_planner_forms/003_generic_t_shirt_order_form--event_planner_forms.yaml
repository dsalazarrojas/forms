inputSchema:
  type: object
  properties:
    title: Generic T Shirt Order Form
    pages:
    - id: 1
      name: shirt_size
      label: Shirt size
      hint: null
      type: select_one
      options:
      - Large
      - Medium
      - Small
      required: false
    - id: 2
      name: color
      label: T-Shirt color
      hint: null
      type: select_one
      options:
      - red
      - blue
      - green
      required: false
    - id: 3
      name: t_shirt_type
      label: T-Shirt type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: description
      label: Description
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: order_date
      label: Order date
      hint: null
      type: date
      options: []
      required: false
