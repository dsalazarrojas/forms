inputSchema:
  type: object
  properties:
    title: Venue Booking Form
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: venue_name
      label: Venue Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Music Concert
      - Wedding
      - Conference
      - Other
      required: false
    - id: 5
      name: attendees
      label: Attendees
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: event_notes
      label: Event Notes
      hint: null
      type: note
      options: []
      required: false
