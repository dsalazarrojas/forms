inputSchema:
  type: object
  properties:
    title: City Year Event Proposal Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: Provide a descriptive name for your proposed event
      type: text
      options: []
      required: true
    - id: 2
      name: event_type
      label: Event Type
      hint: Select the category that best describes your event
      type: select_one
      options:
      - Community Service
      - Fundraising
      - Educational Workshop
      - Awareness Campaign
      - Volunteer Recruitment
      - Partnership Event
      - Other
      required: true
    - id: 3
      name: proposed_date
      label: Proposed Event Date
      hint: Select your preferred date for the event
      type: date
      options: []
      required: true
    - id: 4
      name: proposed_time
      label: Proposed Start Time
      hint: What time will the event begin
      type: time
      options: []
      required: true
    - id: 5
      name: event_duration
      label: Expected Duration
      hint: How long will the event last
      type: select_one
      options:
      - 1-2 hours
      - 2-4 hours
      - 4-6 hours
      - Full day (6+ hours)
      - Multi-day event
      required: true
    - id: 6
      name: expected_attendees
      label: Expected Number of Attendees
      hint: Estimate how many people will attend
      type: number
      options: []
      required: true
    - id: 7
      name: event_location
      label: Proposed Location
      hint: Where will the event take place
      type: text
      options: []
      required: true
    - id: 8
      name: target_audience
      label: Target Audience
      hint: Who is this event designed for
      type: select_multiple
      options:
      - K-12 Students
      - College Students
      - Young Professionals
      - Community Members
      - Families
      - Seniors
      - Corporate Partners
      required: true
    - id: 9
      name: event_objectives
      label: Event Objectives
      hint: What are the main goals of this event
      type: text
      options: []
      required: true
    - id: 10
      name: budget_estimate
      label: Estimated Budget
      hint: Provide estimated cost in dollars
      type: number
      options: []
      required: true
    - id: 11
      name: funding_sources
      label: Proposed Funding Sources
      hint: Where will the funding come from
      type: select_multiple
      options:
      - City Year Grant
      - Corporate Sponsorship
      - Community Donations
      - Ticket Sales
      - Partner Organization
      - Self-funded
      - Other
      required: false
    - id: 12
      name: volunteer_needs
      label: Number of Volunteers Needed
      hint: How many volunteers will you need
      type: number
      options: []
      required: true
    - id: 13
      name: equipment_requirements
      label: Equipment and Resources Needed
      hint: List any special equipment or resources required
      type: text
      options: []
      required: false
    - id: 14
      name: risk_assessment
      label: Potential Risks or Challenges
      hint: Identify any risks and how you plan to mitigate them
      type: text
      options: []
      required: true
    - id: 15
      name: success_metrics
      label: Success Metrics
      hint: How will you measure the success of this event
      type: text
      options: []
      required: true
    - id: 16
      name: organizer_name
      label: Organizer Full Name
      hint: Enter your full name
      type: text
      options: []
      required: true
    - id: 17
      name: organizer_email
      label: Organizer Email Address
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 18
      name: organizer_phone
      label: Organizer Phone Number
      hint: Enter your contact phone number
      type: text
      options: []
      required: true
    - id: 19
      name: additional_comments
      label: Additional Comments or Notes
      hint: Any other information you would like to share
      type: text
      options: []
      required: false
