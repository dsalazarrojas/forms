inputSchema:
  type: object
  properties:
    title: Virtual Prayer Room Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: prayer_group
      label: Prayer Group
      hint: null
      type: select_one
      options:
      - Prayer Group 1
      - Prayer Group 2
      required: true
    - id: 8
      name: meeting_topic
      label: Meeting Topic
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
