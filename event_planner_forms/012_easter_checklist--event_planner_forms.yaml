inputSchema:
  type: object
  properties:
    title: easter_checklist
    pages:
    - id: 1
      name: easter_date
      label: Easter Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: easter_time
      label: Easter Time
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: easter_message
      label: Easter Message
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: easter_menu
      label: Easter Menu
      hint: null
      type: select_multiple
      options:
      - ham
      - fish
      - lamb
      - egg
      required: true
    - id: 5
      name: easter_activities
      label: Easter Activities
      hint: null
      type: select_one
      options:
      - Easter Egg Hunt
      - Easter Egg Decorating
      - Easter Egg Roll
      - Easter Egg Hunt with Family
      required: true
    - id: 6
      name: easter_guests
      label: Easter Guests
      hint: null
      type: select_multiple
      options:
      - Family Members
      - Close Friends
      - Distant Relatives
      - Other Guests
      required: true
    - id: 7
      name: easter_email
      label: Easter Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: easter_phone
      label: Easter Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: easter_comments
      label: Easter Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: easter_checklist_complete
      label: Are you sure the Easter Checklist is Complete?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
