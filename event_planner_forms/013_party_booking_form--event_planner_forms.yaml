inputSchema:
  type: object
  properties:
    title: Party Booking Form
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_message
      label: Event Message/Note
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: guest_status
      label: Guest Status
      hint: null
      type: select_one
      options:
      - Confirmed
      - Not Confirmed
      - Cancel
      required: true
    - id: 7
      name: event_planner
      label: Event Planner
      hint: null
      type: select_one
      options:
      - Event Planners Inc.
      - Jimmy's Event Planners
      required: true
    - id: 8
      name: event_type
      label: Event Type
      hint: null
      type: select_multiple
      options:
      - Wedding
      - Birthday
      - Graduation
      required: true
    - id: 9
      name: phone_number
      label: Event Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
