      - Name 2
      - Name 3
      - Name 4
      - Name 5
      - Name 6
      - Name 7
      required: true
    - id: 3
      name: vote
      label: Your Vote
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: vote_count
      label: Vote Count
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: vote_count
      label: Vote Count
      hint: null
