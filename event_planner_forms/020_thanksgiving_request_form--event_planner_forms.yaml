inputSchema:
  type: object
  properties:
    title: Thanksgiving Request Form
    pages:
    - id: 1
      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_time
      label: Date And Time
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: request_type
      label: Request Type
      hint: Select an option
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 9
      name: event_category
      label: Event Category
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: note
      options: []
      required: false
