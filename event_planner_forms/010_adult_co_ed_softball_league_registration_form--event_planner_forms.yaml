      name: team_information
      label: -- Team Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: player_name
      label: Player full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: For age verification
      type: date
      options: []
