      hint: Enter team or write Free Agent
      type: text
      options: []
      required: true
    - id: 5
      name: position_preference
      label: Position preference
      hint: Select primary playing position
      type: select_one
      options:
      - Pitcher
      - Catcher
      - Infield
      - Outfield
      - Any
