inputSchema:
  type: object
  properties:
    title: T Shirt Order Form
    pages:
    - id: 1
      name: shirt_size
      label: Select a size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - XL
      - XXL
      required: false
    - id: 2
      name: shirt_color
      label: Choose a color
      hint: null
      type: select_multiple
      options:
      - Red
      - Blue
      - Green
      - Yellow
      required: false
    - id: 3
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: quantity
      label: quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: price
      label: price
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: payment_gateway
      label: Payment gateway
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Bank Transfer
      required: false
    - id: 7
      name: order_notes
      label: Order notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: confirm
      label: Confirm order
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
