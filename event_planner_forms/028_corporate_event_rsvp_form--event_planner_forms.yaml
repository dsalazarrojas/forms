inputSchema:
  type: object
  properties:
    title: Corporate Event RSVP Form
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rsvp_status
      label: RSVP Status
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Attending''}'
      - '{''id'': 2, ''name'': ''Declining''}'
      - '{''id'': 3, ''name'': ''Unable to Attend''}'
      required: false
    - id: 3
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: attendees
      label: Attendees
      hint: null
      type: number
      options: []
      required: false
