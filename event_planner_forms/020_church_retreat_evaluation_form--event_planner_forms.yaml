        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: activities_rating
        label: Activities Rating
        hint: Planned activities and programs
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 11
        name: spiritual_growth
        label: Did This Retreat Help Your Spiritual Growth
        hint: null
        type: select_one
        options:
          - Significantly
          - Moderately
