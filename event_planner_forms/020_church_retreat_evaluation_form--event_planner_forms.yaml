inputSchema:
  type: object
  properties:
    title: Church Retreat Evaluation Form
    pages:
      - id: 1
        name: attendee_name
        label: Your Name
        hint: Optional - can remain anonymous
        type: text
        options: []
        required: false
      - id: 2
        name: email
        label: Email Address
        hint: For follow-up
        type: email
        options: []
        required: false
      - id: 3
        name: retreat_name
        label: Which Retreat Did You Attend
        hint: null
        type: select_one
        options:
          - Spring Retreat
          - Summer Retreat
          - Fall Retreat
          - Winter Retreat
          - Youth Retreat
          - Family Retreat
          - Leadership Retreat
          - Other
        required: true
      - id: 4
        name: retreat_date
        label: Retreat Date
        hint: null
        type: date
        options: []
        required: true
      - id: 5
        name: overall_rating
        label: Overall Retreat Rating
        hint: How would you rate the retreat
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 6
        name: venue_rating
        label: Venue/Facility Rating
