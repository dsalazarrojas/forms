inputSchema:
  type: object
  properties:
    title: Car Show Registration Form
    pages:
    - id: 1
      name: registrant_information
      label: -- REGISTRANT INFORMATION --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: street_address
      label: Street address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: Zip code
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_name
      label: Emergency contact name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: emergency_contact_phone
      label: Emergency contact phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: vehicle_information
      label: -- VEHICLE INFORMATION --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: vehicle_year
      label: Vehicle year
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: vehicle_make
      label: Vehicle make
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: vehicle_model
      label: Vehicle model
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: vehicle_color
      label: Vehicle color
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: vehicle_license_plate
      label: License plate number
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: show_participation
      label: -- SHOW PARTICIPATION --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: show_date
      label: Which car show are you attending?
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: participation_type
      label: Type of participation
      hint: null
      type: select_one
      options:
      - Exhibitor
      - Spectator
      - Vendor
      - Sponsor
      - Judge
      - Volunteer
      - Media
      required: true
    - id: 21
      name: show_category
      label: Show category (if exhibitor)
      hint: null
      type: select_one
      options:
      - Classic Cars
      - Muscle Cars
      - Hot Rods
      - Imports
      - Motorcycles
      - Trucks
      - Low Riders
      - Stock
      - Custom
      - All Makes
      required: false
    - id: 22
      name: first_time_attendee
      label: Is this your first time attending?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 23
      name: additional_attendees
      label: Number of additional attendees
      hint: null
      type: number
      options: []
      required: false
    - id: 24
      name: activities_interest
      label: Interested in (select all that apply)
      hint: null
      type: select_multiple
      options:
      - Judging
      - Test Drives
      - Raffles
      - Food and Beverages
      - Merchandise
      - Live Music
      - Networking
      - Awards Ceremony
      required: false
    - id: 25
      name: dietary_restrictions
      label: Any dietary restrictions?
      hint: null
      type: text
      options: []
      required: false
