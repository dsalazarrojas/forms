inputSchema:
  type: object
  properties:
    title: Rail Ticket Booking Form
    pages:
    - id: 1
      name: passenger_name
      label: Passenger Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: departure_station
      label: departure_station
      hint: null
      type: select_one
      options:
      - '{''value'': ''London Paddington''}'
      - '{''value'': ''Bristol Temple Mead''}'
      - '{''value'': ''Bristol Temple Mead''}'
      required: false
    - id: 3
      name: arrival_station
