inputSchema:
  type: object
  properties:
    title: DJ Request Form
    pages:
    - id: 1
      name: request_title
      label: Event Title
      hint: Enter the title of the event
      type: text
      options: []
      required: true
    - id: 2
      name: event_name
      label: Event Name
      hint: Enter the name of the event
      type: text
      options: []
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: Enter the date of the event
      type: date
      options: []
      required: true
    - id: 4
      name: start_time
      label: Start Time
      hint: Enter the start time of the event
      type: time
      options: []
      required: true
    - id: 5
      name: end_time
      label: End Time
      hint: Enter the end time of the event
      type: time
      options: []
      required: true
    - id: 6
      name: song_request
      label: Song Request
      hint: Enter the songs you would like to hear
      type: text
      options: []
      required: true
    - id: 7
      name: artist_request
      label: Artist Request
      hint: Enter the artist you would like to request
      type: text
      options: []
      required: false
    - id: 8
      name: genre_request
      label: Genre Request
      hint: Enter the genre of music you would like to hear
      type: text
      options: []
      required: false
    - id: 9
      name: event_type
      label: Event Type
      hint: Select the type of event
      type: select_one
      options:
      - Dance
      - Party
      - Wedding
      - Other
      required: true
    - id: 10
      name: email
      label: Email
      hint: Enter your email
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 12
      name: message
      label: Message
      hint: Add a comment or message
      type: text
      options: []
      required: false
    - id: 13
      name: assigned_tool
      label: Assigned Tool
      hint: Enter the assigned tool
      type: text
      options: []
      required: true
    - id: 14
      name: form_comments
      label: Form Comments
      hint: Add any comments for the DJ
      type: text
      options: []
      required: false
