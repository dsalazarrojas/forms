inputSchema:
  type: object
  properties:
    title: Contact Details Form
    pages:
    - id: 1
      name: personal_information
      label: Personal Information
      hint: Your basic contact details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Primary email address
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Primary phone number
      type: text
      options: []
      required: true
    - id: 6
      name: mobile_number
      label: Mobile Number
      hint: Optional mobile number
      type: text
      options: []
      required: false
    - id: 7
      name: address_information
      label: Address Information
      hint: Your location details
      type: note
      options: []
      required: false
    - id: 8
      name: street_address
      label: Street Address
      hint: Street address line 1
      type: text
      options: []
      required: true
    - id: 9
      name: address_line_2
      label: Address Line 2
      hint: Apartment suite unit etc
      type: text
      options: []
      required: false
    - id: 10
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 11
      name: state_province
      label: State or Province
      hint: Your state or province
      type: text
      options: []
      required: true
    - id: 12
      name: postal_code
      label: Postal or ZIP Code
      hint: Your postal code
      type: text
      options: []
      required: true
    - id: 13
      name: country
      label: Country
      hint: Your country
      type: select_one
      options:
      - United States
      - Canada
      - United Kingdom
      - Australia
      - Germany
      - France
      - Other
      required: true
    - id: 14
      name: additional_details
      label: Additional Details
      hint: Optional information
      type: note
      options: []
      required: false
    - id: 15
      name: company_name
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: false
    - id: 16
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: false
    - id: 17
      name: website
      label: Website URL
      hint: Your website or LinkedIn
      type: text
      options: []
      required: false
    - id: 18
      name: preferred_contact
      label: Preferred Contact Method
      hint: How should we contact you
      type: select_one
      options:
      - Email
      - Phone
      - Mobile
      - Mail
      required: true
    - id: 19
      name: contact_purpose
      label: Purpose of Contact
      hint: Why are you providing your details
      type: select_one
      options:
      - Event Registration
      - Newsletter Signup
      - Service Inquiry
      - General Information
      - Other
      required: true
    - id: 20
      name: additional_notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
