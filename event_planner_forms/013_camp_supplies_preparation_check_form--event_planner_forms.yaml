      label: Number of Underwear Packed
      hint: Recommended 7+ pairs
      type: number
      options: []
      required: true
    - id: 12
      name: pajamas_packed
      label: Pajamas
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: jacket_packed
      label: Light Jacket or Hoodie
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: rain_gear_packed
      label: Rain Jacket or Poncho
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: swimsuit_packed
      label: Swimsuit
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
