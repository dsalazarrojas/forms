inputSchema:
  type: object
  properties:
    title: Camp Supplies Preparation Check Form
    pages:
    - id: 1
      name: section_camper_info
      label: -- Camper Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: camper_name
      label: Camper Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: camper_age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: cabin_assignment
      label: Cabin Assignment
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: parent_phone
      label: Parent Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: section_clothing
      label: -- Clothing Items --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: shorts_count
      label: Number of Shorts Packed
      hint: Recommended 4-5
      type: number
      options: []
      required: true
