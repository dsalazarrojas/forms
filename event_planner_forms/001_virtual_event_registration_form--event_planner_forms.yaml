inputSchema:
  type: object
  properties:
    title: Virtual Event Registration Form
    pages:
    - id: 1
      name: registration_name
      label: Registration Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: registration_type
      label: Registration Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: purchase_order
      label: Purchase Order
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: registration_status
      label: Registration Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 8
      name: additional_info
      label: Additional Information
      hint: null
      type: note
      options: []
      required: false
