inputSchema:
  type: object
  properties:
    title: Funeral Place Guest Book Request Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: relationship_to_deceased
      label: Relationship to Deceased
      hint: How are you related to the deceased?
      type: select_one
      options:
      - Deceased Spouse
      - Deceased Child
      - Deceased Parent
      - Deceased Grandparent
      - Deceased Sibling
      - Deceased Grandparent-in-law
      - Other (please specify)
      - Deceased Grandchild
      required: true
    - id: 3
      name: attended_funeral_service
      label: Attended Funeral Service
      hint: Please indicate if you attended the funeral service
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: attended_viewing
      label: Attended Viewing
      hint: Please indicate if you attended the viewing
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: contact_information
      label: Contact Information
      hint: Please provide your contact information
      type: text
      options: []
      required: true
    - id: 6
      name: message_for_family
      label: Special Message or Memory of Deceased
      hint: Please share a special message or memory of the deceased
      type: text
      options: []
      required: false
    - id: 7
      name: attended_other_events
      label: Attended Other Events
      hint: Please indicate if you attended other events
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: other_events_attended
      label: Other Events Attended
      hint: Please specify which other events you attended
      type: text
      options: []
      required: false
    - id: 9
      name: how_did_you_hear
      label: How did you hear about the funeral?
      hint: Please specify how you heard about the funeral
      type: text
      options: []
      required: true
    - id: 10
      name: receive_updates
      label: Would you like to receive updates from the family?
      hint: Please indicate if you would like to receive updates
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
