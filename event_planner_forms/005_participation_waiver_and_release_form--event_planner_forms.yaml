inputSchema:
  type: object
  properties:
    title: Participation Waiver And Release Form
    pages:
    - id: 1
      name: event_participation
      label: Participation
      hint: null
      type: select_one
      options:
      - Event Waiver and Release
      - General Waiver and Release
      required: false
    - id: 2
      name: waiver_type
      label: Waiver Type
      hint: null
      type: select_multiple
      options:
      - Event Waiver and Release
      - General Waiver and Release
      required: false
    - id: 3
      name: participant_details
      label: Participant Details
      hint: null
      type: select_one
      options:
      - Participant Waiver and Release
      - Participation Waiver and Release
      required: false
    - id: 4
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: participant_contact_number
      label: Participant Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: participant_address
      label: Participant Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: waiver_text
      label: Waiver Text
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: waiver_date
      label: Waiver Date
      hint: null
      type: date
      options: []
      required: false
