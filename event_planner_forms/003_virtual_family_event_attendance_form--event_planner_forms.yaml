inputSchema:
  type: object
  properties:
    title: Virtual Family Event Attendance Form
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: attendee_name
      label: Attendee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: attendee_email
      label: Attendee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: attendee_phone
      label: Attendee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
