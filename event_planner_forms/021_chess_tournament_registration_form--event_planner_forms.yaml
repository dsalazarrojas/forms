inputSchema:
  type: object
  properties:
    title: Chess Tournament Registration Form
    pages:
    - id: 1
      name: registration_intro
      label: -- Chess Tournament Registration Form --
      hint: Register for the upcoming chess tournament
      type: note
      options: []
      required: false
    - id: 2
      name: tournament_name
      label: Tournament name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: tournament_date
      label: Tournament date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: participant_first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: participant_last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: age_group
      label: Age group
      hint: null
      type: select_one
      options:
      - Under 8
      - 8-10
      - 11-14
      - 15-18
      - 19-40
      - 41-60
      - Over 60
      required: true
    - id: 8
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to answer
      required: false
    - id: 9
      name: elo_rating
      label: Current Elo rating
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: rating_category
      label: Playing category
      hint: null
      type: select_one
      options:
      - Beginner (under 1000)
      - Intermediate (1000-1600)
      - Advanced (1600-2000)
      - Expert (2000-2200)
      - Master (over 2200)
      required: true
    - id: 11
      name: chess_federation
      label: Chess federation affiliation
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: player_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 13
      name: player_phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: tournament_section
      label: Preferred tournament section
      hint: null
      type: select_one
      options:
      - Open section
      - Junior section
      - Intermediate section
      - Beginner section
      - Women's section
      - Senior section
      required: true
    - id: 15
      name: time_control_preference
      label: Preferred time control
      hint: null
      type: select_one
      options:
      - Blitz
      - Rapid
      - Classical
      - All formats
      - No preference
      required: true
    - id: 16
      name: special_accommodations
      label: Special accommodations needed
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: registration_fee
      label: Registration fee
      hint: null
      type: number
      options: []
      required: true
    - id: 18
      name: payment_method
      label: Payment method
      hint: null
      type: select_one
      options:
      - Credit card
      - Bank transfer
      - Cash
      - Check
      - PayPal
      - Other
      required: true
    - id: 19
      name: emergency_contact_name
      label: Emergency contact name
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: emergency_contact_phone
      label: Emergency contact phone
      hint: null
      type: text
      options: []
      required: true
    - id: 21
      name: previous_tournaments
      label: Have you participated in tournaments before?
      hint: null
      type: select_one
      options:
      - true
      - false
      - First time
      required: true
    - id: 22
      name: tournament_rules_acceptance
      label: I agree to abide by tournament rules and ethical standards
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 23
      name: privacy_consent
      label: I consent to my information being used for tournament purposes
      hint: null
      type: select_one
      options:
      - I consent
      - I do not consent
      required: true
