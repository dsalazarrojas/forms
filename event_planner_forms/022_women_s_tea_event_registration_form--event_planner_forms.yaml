inputSchema:
  type: object
  properties:
    title: Women's Tea Event Registration Form
    pages:
    - id: 1
      name: attendee_info
      label: attendee_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_preference
      label: contact_preference
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - In Person
      required: true
    - id: 3
      name: date_of_event
      label: date_of_event
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: time_of_event
      label: time_of_event
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: event_details
      label: event_details
      hint: Brief description of the event
      type: note
      options: []
      required: false
    - id: 6
      name: dietary_restrictions
      label: dietary_restrictions
      hint: null
      type: select_multiple
      options:
      - Gluten-Free
      - Vegan
      - Vegetarian
      - None
      required: false
    - id: 7
      name: special_requests
      label: special_requests
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: attendee_comments
      label: attendee_comments
      hint: null
      type: note
      options: []
      required: false
