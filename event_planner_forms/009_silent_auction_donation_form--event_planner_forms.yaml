inputSchema:
  type: object
  properties:
    title: Silent Auction Donation Form
    pages:
    - id: 1
      name: user_name
      label: Full name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: donor_type
      label: Donor type
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Individual''}'
      - '{''id'': 2, ''name'': ''Business''}'
      - '{''id'': 3, ''name'': ''Organization''}'
      required: false
    - id: 6
      name: donation_type
      label: Donation type
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''name'': ''Prize''}'
      - '{''id'': 2, ''name'': ''Gift''}'
      - '{''id'': 3, ''name'': ''Grant''}'
      required: false
    - id: 7
      name: contact_email
      label: Contact email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact phone
      hint: null
      type: text
      options: []
      required: false
