inputSchema:
  type: object
  properties:
    title: Bus Request Form
    pages:
    - id: 1
      name: requester_information
      label: -- Requester Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Full name of student
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID Number
      hint: School identification number
      type: text
      options: []
      required: true
    - id: 4
      name: grade_level
      label: Grade Level
      hint: Current grade in school
      type: select_one
      options:
      - Elementary
      - Middle School
      - High School
      required: true
    - id: 5
      name: home_address
      label: Home Address
      hint: Residential address
      type: text
      options: []
      required: true
    - id: 6
      name: parent_name
      label: Parent/Guardian Name
      hint: Name of parent or guardian
      type: text
      options: []
      required: true
    - id: 7
      name: parent_phone
      label: Parent Phone Number
      hint: Contact number for parent
      type: text
      options: []
      required: true
    - id: 8
      name: parent_email
      label: Parent Email
      hint: Email address for contact
      type: email
      options: []
      required: true
    - id: 9
      name: request_details
      label: -- Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: request_type
      label: Type of Request
      hint: Purpose of bus transportation
      type: select_one
      options:
      - Regular School Transportation
      - Field Trip
      - Special Event
      - Sports Activity
      - After School Program
      required: true
    - id: 11
      name: trip_date
      label: Trip Date
      hint: Date transportation is needed
      type: date
      options: []
      required: true
    - id: 12
      name: pickup_location
      label: Pickup Location
      hint: Where student will board
      type: text
      options: []
      required: true
    - id: 13
      name: dropoff_location
      label: Drop-off Location
      hint: Where student needs to go
      type: text
      options: []
      required: true
    - id: 14
      name: pickup_time
      label: Pickup Time
      hint: Requested pickup time
      type: time
      options: []
      required: true
    - id: 15
      name: return_time
      label: Return Time
      hint: Expected return time
      type: time
      options: []
      required: true
    - id: 16
      name: passengers
      label: Number of Passengers
      hint: How many people need transportation
      type: number
      options: []
      required: true
    - id: 17
      name: companion_info
      label: Companion Information
      hint: Names of other students if applicable
      type: text
      options: []
      required: false
    - id: 18
      name: trip_purpose
      label: Trip Purpose
      hint: Detailed description of trip purpose
      type: text
      options: []
      required: true
    - id: 19
      name: special_needs
      label: Special Accommodations Needed
      hint: Any accessibility or special needs
      type: text
      options: []
      required: false
    - id: 20
      name: approval_status
      label: -- Approval Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: supervisor_approval
      label: Supervisor Approval Required
      hint: Does this require supervisor sign-off
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: supervisor_name
      label: Supervising Teacher/Staff
      hint: Name of person supervising trip
      type: text
      options: []
      required: false
    - id: 23
      name: estimated_cost
      label: Estimated Cost
      hint: Cost per student or total cost
      type: number
      options: []
      required: false
