inputSchema:
  type: object
  properties:
    title: Virtual Summer Camp Registration Form
    pages:
    - id: 1
      name: parent_info
      label: Parent Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: child_info
      label: Child Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: summer_camp_choice
      label: Summer Camp Choice
      hint: null
      type: select_multiple
      options:
      - Camp A
      - Camp B
      - Camp C
      required: true
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: camp_duration
      label: Camp Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - PayPal
      - Bank Transfer
      required: true
    - id: 9
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: camp_type
      label: Camp Type
      hint: null
      type: select_one
      options:
      - Day Camp
      - Overnight Camp
      - Day/Night Camp
      required: false
    - id: 12
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
