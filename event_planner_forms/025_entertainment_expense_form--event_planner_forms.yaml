inputSchema:
  type: object
  properties:
    title: Entertainment Expense Form
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: expense_date
      label: Expense Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: expense_amount
      label: Expense Amount
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: expense_type
      label: Expense Type
      hint: Select one or more expense types
      type: select_multiple
      options:
      - Food and Beverage
      - Travel
      - Accommodation
      - Miscellaneous
      required: false
    - id: 7
      name: expense_description
      label: Expense Description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - ChatJ
      - Jimmy
      - John
      - Jane
      required: false
    - id: 9
      name: approved_by
      label: Approved By
      hint: null
      type: select_one
      options:
      - Approved
      - Not Approved
      required: false
    - id: 10
      name: reason_for_rejection
      label: Reason for Rejection
      hint: null
      type: text
      options: []
      required: false
