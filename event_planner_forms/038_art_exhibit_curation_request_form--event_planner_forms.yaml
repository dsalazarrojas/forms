      name: proposed_start_date
      label: Proposed Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: proposed_end_date
      label: Proposed End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: duration_weeks
      label: Duration in Weeks
      hint: null
      type: number
      options: []
      required: false
