inputSchema:
  type: object
  properties:
    title: Art Exhibit Curation Request Form
    pages:
    - id: 1
      name: section_proposer
      label: -- Proposer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: proposer_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: proposer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: proposer_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: organization
      label: Organization or Institution
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: proposal_date
      label: Proposal Date
      hint: null
      type: date
      options: []
      required: true
