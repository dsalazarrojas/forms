inputSchema:
  type: object
  properties:
    title: seminar_evaluation_form_template
    pages:
    - id: 1
      name: seminar_content
      label: how_well_was_the_seminar_content_delivered
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: instructor
      label: what_were_the_instructor_s_qualifications
      hint: null
      type: select_one
      options:
      - Highly Relevant
      - Somewhat Relevant
      - Not Relevant
      required: true
    - id: 3
      name: overall_seminar_effectiveness
      label: overall_effectiveness_of_the_seminar
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: seminar_organization
      label: the_seminar_organization_was_effective
      hint: Please use the format 2018-02-01 to 2018-02-28
      type: date
      options: []
      required: true
    - id: 5
      name: seminar_presentation
      label: the_seminar_presentation_was_effective
      hint: Use 24-hour format
      type: time
      options: []
      required: true
    - id: 6
      name: participant_comments
      label: participant_comments
      hint: Please be as specific as possible in your feedback.
      type: text
      options: []
      required: false
    - id: 7
      name: additional_feedback
      label: additional_feedback
      hint: Is there anything else you would like to share about the seminar?
      type: note
      options: []
      required: false
    - id: 8
      name: seminar_rating
      label: seminar_rating
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: participant_attendance
      label: participant_attendance
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: participant_name
      label: participant_name
      hint: Please enter your name
      type: text
      options: []
      required: false
    - id: 11
      name: participant_email
      label: participant_email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: participant_phone
      label: participant_phone
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: participant_department
      label: participant_department
      hint: null
      type: select_one
      options:
      - Finance
      - Marketing
      - HR
      required: true
    - id: 14
      name: participant_title
      label: participant_title
      hint: null
      type: select_one
      options:
      - Director
      - Manager
      - Assistant Manager
      - Team Member
      required: true
    - id: 15
      name: participant_job_function
      label: participant_job_function
      hint: null
      type: select_multiple
      options:
      - Sales
      - Operations
      - IT
      required: true
    - id: 16
      name: participant_location
      label: participant_location
      hint: Where do you work?
      type: text
      options: []
      required: false
