inputSchema:
  type: object
  properties:
    title: Simple Guest List Form
    pages:
    - id: 1
      name: guest_list
      label: Guest List
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_contact
      label: Event Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: guest_email
      label: Guest Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: guest_phone
      label: Guest Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: additional_contacts
      label: Additional Contacts
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: attendee_type
      label: Attendee Type
      hint: null
      type: select_one
      options:
      - Client
      - Colleague
      - Colleague's Guest
      required: false
    - id: 9
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
