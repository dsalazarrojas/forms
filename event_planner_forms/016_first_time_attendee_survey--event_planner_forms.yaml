inputSchema:
  type: object
  properties:
    title: First Time Attendee Survey
    pages:
    - id: 1
      name: first_time_attending
      label: First Time Attending
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: how_d
      label: How did you hear about this event
      hint: null
      type: select_multiple
      options:
      - Event Planner
      - Social Media
      - Word of Mouth
      - '{''Other prophets'': []}'
      required: false
    - id: 3
      name: what_brought_you
      label: What brought you to this event?
      hint: null
      type: select_one
      options:
      - I wanted to see a specific presenter
      - I wanted to meet specific people
      - I wanted to attend a specific session
      - Other
      required: true
    - id: 4
      name: what_will_happen_next
      label: What will happen next?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: what_will_prophets
      label: What will happen next?
      hint: null
      type: select_one
      options:
      - Nothing
      - Maybe a follow-up session
      - I'll attend_goals
      - Other
      required: false
    - id: 6
      name: what_would_improve
      label: What would improve this event?
      hint: null
      type: select_multiple
      options:
      - Better location
      - Better food
      - More variety of sessions
      - Other
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
