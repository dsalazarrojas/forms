inputSchema:
  type: object
  properties:
    title: Christmas Audition Sign Up Form
    pages:
    - id: 1
      name: section_event_details
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For audition schedule and updates
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Include country code if outside local area
      type: text
      options: []
      required: false
    - id: 5
      name: audition_role
      label: Audition role or part
      hint: Example choir solo, actor, dancer
      type: text
      options: []
      required: true
    - id: 6
      name: age_category
      label: Age category
      hint: Select the appropriate age group
      type: select_one
      options:
      - Child under 12
      - Teen 13-17
      - Adult 18-35
      - Adult 36 and above
      required: true
    - id: 7
      name: experience_level
      label: Experience level
      hint: Check the option that best describes you
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 8
      name: preferred_time_slot
      label: Preferred audition time slot
      hint: Indicate availability if possible
      type: time
      options: []
      required: false
    - id: 9
      name: accompanist_needed
      label: Accompanist needed
      hint: Indicate if you require accompaniment
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 10
      name: special_requirements
      label: Special requirements or notes
      hint: Accessibility or technical needs
      type: text
      options: []
      required: false
