inputSchema:
  type: object
  properties:
    title: new_year_s_eve_post_event_survey
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_attended
      label: Date Attended
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: time_arrived
      label: Time Arrived
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: event_score
      label: Event Score
      hint: On a scale of 1-5, how would you rate the event overall?
      type: number
      options: []
      required: true
    - id: 5
      name: favorite_part
      label: Favorite Part
      hint: null
      type: select_multiple
      options:
      - Food and Drink
      - Music
      - Decorations
      required: true
    - id: 6
      name: least_favorite_part
      label: Least Favorite Part
      hint: null
      type: select_multiple
      options:
      - Food and Drink
      - Music
      - Decorations
      required: true
    - id: 7
      name: suggestions
      label: Suggestions
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_info
      label: Contact Info
      hint: Please provide your email address or phone number so we can follow up
        with you.
      type: email
      options: []
      required: true
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: Any other comments or suggestions you'd like to add.
      type: text
      options: []
      required: false
