inputSchema:
  type: object
  properties:
    title: Friends Trivia
    pages:
    - id: 1
      name: page_1
      label: What is the main theme of the Friends TV show?
      hint: null
      type: select_one
      options:
      - Friends
      - Love
      - Life
      - Death
      - Other
      required: true
    - id: 2
      name: page_2
      label: Which of the following friends are part of the show's main cast?
      hint: null
      type: select_multiple
      options:
      - Rachel
      - Monica
      - Ross
      - Joey
      - Chandler
      - Phoebe
      required: true
    - id: 3
      name: page_3
      label: Where does the show primarily take place?
      hint: null
      type: select_one
      options:
      - New York City
      - Other
      required: true
    - id: 4
      name: page_4
      label: What is the year the show premiered?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 5
      name: page_5
      label: What is your favorite catchphrase from the show?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: page_6
      label: What is the main theme of the show?
      hint: null
      type: select_multiple
      options:
      - Friends
      - Love
      - Life
      - Death
      - Other
      required: true
    - id: 7
      name: page_7
      label: How do you want to share your results?
      hint: null
      type: select_one
      options:
      - Facebook
      - Twitter
      - Email
      required: true
    - id: 8
      name: page_8
      label: What is your score?
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: page_9
      label: What is your final answer?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: page_10
      label: End Screen
      hint: null
      type: note
      options: []
      required: false
