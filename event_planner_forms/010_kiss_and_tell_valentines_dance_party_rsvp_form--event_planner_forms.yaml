inputSchema:
  type: object
  properties:
    title: Kiss And Tell Valentines Dance Party RSVP Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: attending_with
      label: Attending with
      hint: null
      type: select_multiple
      options:
      - Spouse
      - Friend
      - Colleague
      required: true
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: rsvp
      label: RSVP
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: form_id
      label: Form
      hint: null
      type: number
      options: []
      required: false
