inputSchema:
  type: object
  properties:
    title: Balloon Inquiry Form
    pages:
    - id: 1
      name: customer_full_name
      label: Customer Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: For our response
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company or Organization Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 5
      name: inquiry_type
      label: Type of Inquiry
      hint: What are you interested in
      type: select_one
      options:
      - Birthday Party Balloons
      - Wedding Decorations
      - Corporate Event
      - Baby Shower
      - Graduation Party
      - Anniversary Celebration
      - Grand Opening
      - Holiday Event
      - Other
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: When is your event
      type: date
      options: []
      required: true
    - id: 7
      name: event_time
      label: Event Time
      hint: What time does your event start
      type: time
      options: []
      required: false
    - id: 8
      name: event_location
      label: Event Location
      hint: Venue name and address
      type: text
      options: []
      required: true
    - id: 9
      name: balloon_type
      label: Balloon Type Preference
      hint: What kind of balloons interest you
      type: select_multiple
      options:
      - Helium Balloons
      - Hot Air Balloon Ride
      - Balloon Arch
      - Balloon Bouquets
      - Custom Printed Balloons
      - Balloon Drop
      - Balloon Centerpieces
      - Giant Number Balloons
      required: true
    - id: 10
      name: color_scheme
      label: Color Scheme
      hint: Preferred colors for your event
      type: text
      options: []
      required: false
    - id: 11
      name: theme
      label: Event Theme
      hint: Any specific theme
      type: text
      options: []
      required: false
    - id: 12
      name: estimated_guests
      label: Estimated Number of Guests
      hint: How many people will attend
      type: number
      options: []
      required: false
    - id: 13
      name: budget_range
      label: Budget Range
      hint: Estimated budget for balloons
      type: select_one
      options:
      - Under $100
      - $100 - $250
      - $250 - $500
      - $500 - $1000
      - $1000 - $2500
      - Over $2500
      required: false
    - id: 14
      name: delivery_needed
      label: Delivery Required
      hint: Do you need delivery service
      type: select_one
      options:
      - Yes, deliver to venue
      - Yes, deliver to home
      - No, I will pick up
      required: true
    - id: 15
      name: setup_service
      label: Setup Service
      hint: Do you need professional setup
      type: select_one
      options:
      - Yes, full setup service
      - Partial setup assistance
      - No, I will set up myself
      required: false
    - id: 16
      name: previous_customer
      label: Have You Used Our Services Before
      hint: Previous customer status
      type: select_one
      options:
      - Yes, returning customer
      - No, first time
      - Referred by someone
      required: true
    - id: 17
      name: referral_source
      label: How Did You Hear About Us
      hint: Marketing source
      type: select_one
      options:
      - Google Search
      - Social Media
      - Friend or Family
      - Wedding Planner
      - Event Coordinator
      - Previous Event
      - Advertisement
      required: false
    - id: 18
      name: additional_services
      label: Additional Services Interest
      hint: Other services you might need
      type: select_multiple
      options:
      - Event Planning
      - Photography
      - Catering Coordination
      - Entertainment Booking
      - Venue Decoration
      - None
      required: false
    - id: 19
      name: special_requests
      label: Special Requests or Questions
      hint: Any specific requirements or inquiries
      type: text
      options: []
      required: false
    - id: 20
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we reach you
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Any Method
      required: true
    - id: 21
      name: best_time_to_contact
      label: Best Time to Contact
      hint: When are you available
      type: select_one
      options:
      - Morning (8 AM - 12 PM)
      - Afternoon (12 PM - 5 PM)
      - Evening (5 PM - 8 PM)
      - Anytime
      required: false
