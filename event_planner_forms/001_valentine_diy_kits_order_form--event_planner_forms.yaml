      type: number
      options: []
      required: false
    - id: 4
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Cash
      - Credit/Debit
      - Pay Pal
      required: false
