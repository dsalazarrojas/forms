inputSchema:
  type: object
  properties:
    title: Venue Reservation Request Form
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: event_venue
      label: Event Venue
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: venue_type
      label: Venue Type
      hint: null
      type: select_one
      options:
      - Office
      - Theater
      - Restaurant
      - Hotel
      required: false
    - id: 10
      name: submit_request
      label: Submit Request
      hint: null
      type: select_multiple
      options:
      - 5:00-6:00 PM
      - 6:00-7:00 PM
      - 7:00-8:00 PM
      - 8:00-9:00 PM
      required: true
