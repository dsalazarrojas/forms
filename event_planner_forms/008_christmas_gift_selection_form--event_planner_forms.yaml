inputSchema:
  type: object
  properties:
    title: Christmas Gift Selection Form
    pages:
      - id: 1
        name: employee_name
        label: Full Name
        hint: Enter your first and last name
        type: text
        options: []
        required: true
      - id: 2
        name: employee_id
        label: Employee ID
        hint: Your company identification number
        type: text
        options: []
        required: true
      - id: 3
        name: email_address
        label: Email Address
        hint: Company email address
        type: email
        options: []
        required: true
      - id: 4
        name: department
        label: Department
        hint: Your work department
        type: select_one
        options:
          - Executive
          - Human Resources
          - Finance and Accounting
          - Marketing
          - Sales
          - Information Technology
          - Operations
          - Customer Support
          - Research and Development
          - Other
        required: true
      - id: 5
        name: section_employee_details
        label: -- Employee Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 6
        name: gift_tier
        label: Gift Tier Selection
        hint: Choose your gift category
        type: select_one
        options:
          - Standard Tier
          - Premium Tier
          - Executive Tier
          - Special Recognition Tier
        required: true
      - id: 7
        name: gift_option_a
        label: Gift Option A
        hint: Electronics and Tech
        type: select_one
        options:
          - Wireless Earbuds
          - Portable Charger
          - Smart Watch
          - Bluetooth Speaker
          - Tablet Stand
          - Not Interested
        required: true
      - id: 8
        name: gift_option_b
        label: Gift Option B
        hint: Home and Lifestyle
        type: select_one
        options:
          - Coffee Maker
          - Insulated Tumbler
          - Desk Plant
          - Throw Blanket
          - Aromatherapy Set
          - Not Interested
        required: true
      - id: 9
        name: gift_option_c
        label: Gift Option C
        hint: Food and Beverages
        type: select_one
        options:
          - Gourmet Chocolate Box
          - Coffee Sampler
          - Tea Collection
          - Snack Basket
          - Wine or Champagne
          - Not Interested
        required: true
      - id: 10
        name: section_gift_choices
        label: -- Gift Choices --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: final_selection
        label: Final Gift Selection
        hint: Your primary choice from above
        type: select_one
        options:
          - Electronics Option
          - Home and Lifestyle Option
          - Food and Beverage Option
          - Surprise Me
        required: true
      - id: 12
        name: color_choice
        label: Color Choice
        hint: If applicable to your gift
        type: select_one
        options:
          - No Preference
          - Black
          - White
          - Silver
          - Blue
          - Red
          - Rose Gold
        required: false
      - id: 13
        name: personalization
        label: Add Personalization
        hint: Engraving or custom message
        type: select_one
        options:
          - No personalization needed
          - Yes add my name
          - Yes add custom message
        required: true
      - id: 14
        name: personalization_text
        label: Personalization Text
        hint: What should be engraved or printed
        type: text
        options: []
        required: false
      - id: 15
        name: section_personalization
        label: -- Personalization --
        hint: null
        type: note
        options: []
        required: false
      - id: 16
        name: delivery_method
        label: Delivery Method
        hint: How should we deliver
        type: select_one
        options:
          - Office Desk Delivery
          - Mail to Home
          - Pickup at HR
          - Ship to Alternate Address
        required: true
      - id: 17
        name: home_address
        label: Home Mailing Address
        hint: If shipping to home
        type: text
        options: []
        required: false
      - id: 18
        name: city
        label: City
        hint: null
        type: text
        options: []
        required: false
      - id: 19
        name: postal_code
        label: Postal Code
        hint: null
        type: text
        options: []
        required: false
      - id: 20
        name: delivery_date_preference
        label: Preferred Delivery Date
        hint: When would you like to receive
        type: date
        options: []
        required: true
      - id: 21
        name: section_delivery
        label: -- Delivery Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 22
        name: gift_message_to_family
        label: Message to Family
        hint: Optional card message if gift goes home
        type: text
        options: []
        required: false
      - id: 23
        name: feedback
        label: Feedback on Gift Program
        hint: Suggestions for next year
        type: text
        options: []
        required: false
      - id: 24
        name: years_with_company
        label: Years with Company
        hint: How long have you worked here
        type: select_one
        options:
          - Less than 1 year
          - 1-3 years
          - 4-6 years
          - 7-10 years
          - Over 10 years
        required: false
