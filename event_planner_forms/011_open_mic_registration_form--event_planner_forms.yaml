inputSchema:
  type: object
  properties:
    title: Open Mic Registration Form
    pages:
    - id: 1
      name: performer_name
      label: performer_name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: event_date
      label: event_date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: start_time
      label: start_time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: end_time
      label: end_time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: duration
      label: duration
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: availability
      label: availability
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 7
      name: contact_email
      label: contact_email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: contact_phone
      label: contact_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_address
      label: contact_address
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: performer_experience
      label: performer_experience
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: bio
      label: bio
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: note
      label: note
      hint: null
      type: text
      options: []
      required: false
