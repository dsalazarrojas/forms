inputSchema:
  type: object
  properties:
    title: Easter Meal Order Form
    pages:
    - id: 1
      name: easter_meal_order_form_page1
      label: What's your easter meal order preference?
      hint: null
      type: select_one
      options:
      - Ham
      - Lamb
      - None
      - Other (please specify)
      required: true
    - id: 2
      name: main_course_page
      label: Which main course would you like?
      hint: null
      type: select_one
      options:
      - Roasted chicken
      - Grilled salmon
      - Vegetarian option
      - None
      required: true
    - id: 3
      name: side_dish_page
      label: Which side dish would you like?
      hint: null
