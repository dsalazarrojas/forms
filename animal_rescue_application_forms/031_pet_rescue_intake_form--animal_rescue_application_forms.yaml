inputSchema:
  type: object
  properties:
    title: Pet Rescue Intake Form
    pages:
    - id: 1
      name: pet_name
      label: Pet Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: pet_type
      label: Pet Type
      hint: null
      type: select_one
      options:
      - cat
      - dog
      - other
      required: true
    - id: 3
      name: shelter_name
      label: Shelter Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: pet_description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: pet_condition
      label: Pet Condition
      hint: null
      type: select_one
      options:
      - healthy
      - sick
      - injured
      - deceased
      required: true
    - id: 6
      name: rescue_date
      label: Rescue Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: note
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
