inputSchema:
  type: object
  properties:
    title: Adopted Pet Discharge Form
    pages:
    - id: 1
      name: adoption_date
      label: Adoption Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: pet_information_header
      label: Pet Information
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: pet_name
      label: Pet Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: pet_type
      label: Type of Pet
      hint: null
      type: select_one
      options:
      - Dog
      - Cat
      - Rabbit
      - Hamster
      - Bird
      - Reptile
      - Other
      required: true
    - id: 5
      name: breed
      label: Breed
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: age
      label: Age
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: color_markings
      label: Color and Markings
      hint: Description of coloring and distinctive features
      type: text
      options: []
      required: true
    - id: 8
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      required: true
    - id: 9
      name: weight
      label: Weight
      hint: Include units
      type: text
      options: []
      required: false
    - id: 10
      name: microchip_number
      label: Microchip Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: adopter_information_header
      label: Adopter Information
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: adopter_name
      label: Adopter Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: adopter_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: adopter_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 15
      name: adopter_address
      label: Home Address
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: medical_history_header
      label: Medical History and Care Instructions
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: vaccinations_administered
      label: Vaccinations Administered
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: microchip_registered
      label: Microchip Registered
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 19
      name: medical_conditions
      label: Known Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: medication
      label: Current Medications or Treatments
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: feeding_instructions
      label: Feeding Instructions and Diet
      hint: Include type of food and feeding schedule
      type: text
      options: []
      required: false
    - id: 22
      name: behavioral_notes
      label: Behavioral Notes and Temperament
      hint: Personality traits and behavior recommendations
      type: text
      options: []
      required: false
    - id: 23
      name: special_care
      label: Special Care Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: follow_up_contact
      label: Follow-up contact in 2 weeks
      hint: null
      type: select_one
      options:
      - Yes, please contact me
      - No, please do not contact
      required: true
