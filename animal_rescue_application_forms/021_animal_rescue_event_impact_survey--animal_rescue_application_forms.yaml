inputSchema:
  type: object
  properties:
    title: Animal Rescue Event Impact Survey
    pages:
    - id: 1
      name: event_name_title
      label: Event Name or Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_role
      label: Your Role at the Event
      hint: null
      type: select_one
      options:
      - Attendee or Visitor
      - Event Volunteer
      - Organization Staff
      - Partner or Sponsor
      required: true
    - id: 3
      name: overall_satisfaction
      label: Overall Event Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 4
      name: animals_adopted_count
      label: Number of Animals Adopted - if known
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: funds_raised_estimate
      label: Estimated Funds Raised - if known
      hint: Enter amount in USD
      type: number
      options: []
      required: false
    - id: 6
      name: impactful_moment
      label: What was the most impactful part of the event?
      hint: A story or specific interaction
      type: text
      options: []
      required: true
    - id: 7
      name: organization_rating
      label: Quality of Event Organization
      hint: Flow, timing, and facilities
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: promotion_effectiveness
      label: Effectiveness of Event Promotion
      hint: How did people hear about us?
      type: select_one
      options:
      - Very Effective
      - Effective
      - Somewhat Effective
      - Not Effective
      required: true
    - id: 9
      name: future_suggestions
      label: Suggestions for Future Events
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: success_story_testimonial
      label: Success Stories or Testimonials
      hint: Share any positive outcomes you observed
      type: text
      options: []
      required: false
