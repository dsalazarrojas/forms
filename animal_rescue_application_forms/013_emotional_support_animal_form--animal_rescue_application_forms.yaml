inputSchema:
  type: object
  properties:
    title: Emotional Support Animal Form
    pages:
    - id: 1
      name: form_submitter_name
      label: Submitter Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_email
      label: Submitter Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: form_phone
      label: Submitter Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: form_species
      label: Species of Animal
      hint: Dog, Cat, etc.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: form_reason_for_purpose
      label: Reason for Emotional Support
      hint: Why do you need a ESA?
      type: text
      options: []
      required: true
    - id: 6
      name: form_medication_list
      label: Medication List
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: form_emotional_disability
      label: Emotional Disability
      hint: Do you have a diagnosed mental disability?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: form_medical_providers
      label: Medical Providers
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: form_signature
      label: Submitter Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: form_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
