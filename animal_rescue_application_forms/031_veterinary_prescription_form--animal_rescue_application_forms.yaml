inputSchema:
  type: object
  properties:
    title: Veterinary Prescription Form
    pages:
    - id: 1
      name: pet_info
      label: pet info
      hint: null
      type: select_one
      options:
      - dog
      - cat
      - other
      required: false
    - id: 2
      name: owner_info
      label: owner info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: vet_info
      label: vet info
      hint: null
      type: select_one
      options:
      - Dr. Smith
      - Dr. Johnson
      required: false
    - id: 4
      name: treatment_info
      label: treatment info
      hint: null
      type: select_multiple
      options:
      - vaccination
      - medication
      - lab test
      required: false
    - id: 5
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: owner_signature
      label: owner signature
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: vet_signature
      label: vet signature
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: false
