inputSchema:
  type: object
  properties:
    title: Bayside Animal Shelter Volunteer Application
    pages:
    - id: 1
      name: volunteer_info_header
      label: -- Volunteer Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: volunteer_full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: volunteer_age
      label: Your Age
      hint: Must be 16 or older to volunteer independently
      type: number
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: volunteer_interests_header
      label: -- Experience and Interests --
      hint: How would you like to help our furred friends?
      type: note
      options: []
      required: false
    - id: 7
      name: animal_experience
      label: Do you have previous experience working with animals?
      hint: Please describe
      type: text
      options: []
      required: true
    - id: 8
      name: preferred_volunteer_roles
      label: Which roles are you interested in?
      hint: Select all that apply
      type: select_multiple
      options:
      - Dog Walking and Socialization
      - Cat Care and Socialization
      - Cleaning and Maintenance
      - Adoption Event Assistant
      - Administrative/Office Support
      - Photography/Social Media
      required: true
    - id: 9
      name: availability_header
      label: -- Availability --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: days_available
      label: Which days of the week are you available?
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 11
      name: time_preference
      label: Preferred Shift Time
      hint: null
      type: select_one
      options:
      - Morning (8 AM - 12 PM)
      - Afternoon (12 PM - 4 PM)
      - Evening (4 PM - 7 PM)
      required: true
    - id: 12
      name: medical_safety_header
      label: -- Safety and Health --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: animal_allergies
      label: Do you have any allergies to animals or cleaning supplies?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: emergency_contact_details
      label: Emergency Contact Name and Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: liability_release_ack
      label: I agree to the volunteer liability release and shelter rules
      hint: null
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 16
      name: application_date
      label: Date of Application
      hint: null
      type: date
      options: []
      required: true
