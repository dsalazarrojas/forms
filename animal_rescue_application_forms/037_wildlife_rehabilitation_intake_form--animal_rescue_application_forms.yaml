      type: text
      options: []
      required: false
    - id: 20
      name: address
      label: address
      hint: Enter your address
      type: text
      options: []
      required: false
    - id: 21
      name: city
      label: city
      hint: Enter your city
      type: text
      options: []
      required: false
    - id: 22
      name: state
      label: state
