inputSchema:
  type: object
  properties:
    title: Wildlife Rehabilitation Intake Form
    pages:
    - id: 1
      name: species
      label: Animal Species
      hint: null
      type: select_multiple
      options:
      - Mammal
      - Reptile
      - Bird
      - Amphibian
      - Fish
      required: true
    - id: 2
      name: animal_status
      label: Animal Status
      hint: null
      type: select_one
      options:
      - Injured
      - Orphaned
      - Dead on arrival
      - Other
      required: true
    - id: 3
      name: rescue_date
      label: Date of the Rescue Event
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: species_count
      label: Number of Species
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: description
      label: Description of the Event
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: treatment_plans
      label: Treatment Plans
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: rehabilitation_facility
      label: Rehabilitation Facility
      hint: null
      type: select_one
      options:
      - Wildlife Rescue and Rehabilitation Center
      - Another facility
      required: true
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submitter
      label: Submitter Information
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: zip
      label: Zip
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: fax_number
      label: Fax Number
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: website
      label: Website
      hint: null
      type: text
      options: []
