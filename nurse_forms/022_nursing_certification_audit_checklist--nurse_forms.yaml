inputSchema:
  type: object
  properties:
    title: Nursing Certification Audit Checklist
    pages:
    - id: 1
      name: patient_info
      label: Patient info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: cert_type
      label: Certification type
      hint: null
      type: select_one
      options:
      - RN
      - LPN
      - NP
      - Other
      required: false
    - id: 3
      name: cert_name
      label: Certification name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: cert_date_earned
      label: Date earned
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: expiration_date
      label: Expiration date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: cert_status
      label: Certification status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 7
      name: cert_status_hint
      label: Certification status details
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: followup_status
      label: Follow-up status
      hint: null
      type: select_one
      options:
      - No follow-up needed
      - Follow-up needed
      required: false
    - id: 9
      name: followup_status_hint
      label: Follow-up status details
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: followup_next_action
      label: Follow-up next action
      hint: null
      type: text
      options: []
      required: false
