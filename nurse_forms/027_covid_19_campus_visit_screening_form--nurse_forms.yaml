inputSchema:
  type: object
  properties:
    title: COVID 19 Campus Visit Screening Form
    pages:
    - id: 1
      name: visit_date
      label: Visit Date
      hint: Date of campus visit
      type: date
      options: []
      required: true
    - id: 2
      name: visit_time
      label: Visit Time
      hint: What time are you arriving?
      type: time
      options: []
      required: false
    - id: 3
      name: visitor_name
      label: Visitor Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 4
      name: visitor_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: visitor_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: visit_purpose
      label: Purpose of Visit
      hint: Why are you visiting campus?
      type: select_one
      options:
      - Student
      - Employee
      - Contractor
      - Visitor
      - Delivery
      - Other
      required: true
    - id: 7
      name: employee_sponsor
      label: Sponsoring Employee or Department
      hint: Who are you visiting or working with?
      type: text
      options: []
      required: false
    - id: 8
      name: building_access
      label: Building(s) You Will Access
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: temperature_check
      label: Temperature Reading
      hint: Fahrenheit - Do you have a fever?
      type: number
      options: []
      required: false
    - id: 10
      name: fever_present
      label: Do you have a fever over 100.4 degrees F?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Did not check
      required: true
    - id: 11
      name: cough
      label: Do you have a new or worsening cough?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 12
      name: shortness_of_breath
      label: Do you have shortness of breath?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 13
      name: loss_taste_smell
      label: Have you lost sense of taste or smell?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: true
    - id: 14
      name: fatigue
      label: Are you experiencing unusual fatigue?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 15
      name: sore_throat
      label: Do you have a sore throat?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 16
      name: body_aches
      label: Do you have body aches?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 17
      name: headache
      label: Do you have a headache?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 18
      name: nausea_vomiting
      label: Do you have nausea or vomiting?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 19
      name: diarrhea
      label: Do you have diarrhea?
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not sure
      required: false
    - id: 20
      name: covid_exposure
      label: Have you been exposed to someone with COVID-19?
      hint: In the past 14 days
      type: select_one
      options:
      - No exposure
      - Exposed
      - Not sure
      - Prefer not to say
      required: true
    - id: 21
      name: covid_diagnosis
      label: Have you tested positive for COVID-19?
      hint: In the past 10 days
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Prefer not to say
      required: true
    - id: 22
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to say
      required: false
    - id: 23
      name: mask_requirement
      label: Will you wear a mask during your visit?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not sure
      required: false
    - id: 24
      name: screening_result
      label: Screening Result
      hint: null
      type: select_one
      options:
      - Cleared to enter
      - Screening needed with nurse
      - Denied access
      - Pending
      required: true
    - id: 25
      name: nurse_notes
      label: Nurse Notes or Comments
      hint: Any additional observations or concerns
      type: text
      options: []
      required: false
    - id: 26
      name: screener_name
      label: Screener Name
      hint: Person conducting the screening
      type: text
      options: []
      required: true
