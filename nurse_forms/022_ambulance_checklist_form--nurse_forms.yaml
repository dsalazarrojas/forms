inputSchema:
  type: object
  properties:
    title: Ambulance Checklist Form
    pages:
    - id: 1
      name: section_general_info
      label: -- General Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: checklist_date
      label: Checklist Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: checklist_time
      label: Checklist Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: ambulance_unit_number
      label: Ambulance Unit Number
      hint: Vehicle identification
      type: text
      options: []
      required: true
    - id: 5
      name: shift
      label: Shift
      hint: null
      type: select_one
      options:
      - Day Shift
      - Evening Shift
      - Night Shift
      - 24-Hour Shift
      required: true
    - id: 6
      name: section_personnel
      label: -- Personnel --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: driver_name
      label: Driver/Operator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: partner_name
      label: Partner Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: section_exterior_check
      label: -- Exterior Vehicle Check --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: exterior_condition
      label: Exterior Condition
      hint: Overall vehicle exterior
      type: select_one
      options:
      - Good - No damage
      - Fair - Minor damage
      - Poor - Needs repair
      required: true
    - id: 12
      name: lights_siren
      label: Lights and Siren
      hint: All emergency lights and siren functional
      type: select_one
      options:
      - Functional
      - Not functional
      - Partially functional
      required: true
    - id: 13
      name: tires_condition
      label: Tire Condition
      hint: Check all tires including spare
      type: select_one
      options:
      - Good
      - Fair
      - Needs replacement
      required: true
    - id: 14
      name: tires_pressure
      label: Tire Pressure
      hint: All tires properly inflated
      type: select_one
      options:
      - Adequate
      - Low - Needs air
      - Unknown
      required: true
    - id: 15
      name: fluid_leaks
      label: Fluid Leaks
      hint: Check under vehicle
      type: select_one
      options:
      - No leaks observed
      - Minor leak observed
      - Significant leak observed
      required: true
    - id: 16
      name: mirrors_windows
      label: Mirrors and Windows
      hint: Clean and intact
      type: select_one
      options:
      - Clean and intact
      - Needs cleaning
      - Damaged
      required: true
    - id: 17
      name: section_engine_compartment
      label: -- Engine Compartment --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: engine_oil_level
      label: Engine Oil Level
      hint: null
      type: select_one
      options:
      - Adequate
      - Low - Needs topping
      - Not checked
      required: true
    - id: 19
      name: coolant_level
      label: Coolant Level
      hint: null
      type: select_one
      options:
      - Adequate
      - Low
      - Not checked
      required: true
    - id: 20
      name: brake_fluid_level
      label: Brake Fluid Level
      hint: null
      type: select_one
      options:
      - Adequate
      - Low
      - Not checked
      required: true
    - id: 21
      name: battery_condition
      label: Battery Condition
      hint: Terminals clean and secure
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      - Not checked
      required: true
    - id: 22
      name: belts_hoses
      label: Belts and Hoses
      hint: No cracks or wear visible
      type: select_one
      options:
      - Good condition
      - Shows wear
      - Needs replacement
      - Not checked
      required: true
    - id: 23
      name: section_interior_check
      label: -- Interior Vehicle Check --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: interior_cleanliness
      label: Interior Cleanliness
      hint: Cab area
      type: select_one
      options:
      - Clean
      - Acceptable
      - Needs cleaning
      required: true
    - id: 25
      name: dashboard_gauges
      label: Dashboard Gauges
      hint: All functional
      type: select_one
      options:
      - All functional
      - Some not functional
      - Not checked
      required: true
    - id: 26
      name: seatbelts
      label: Seatbelts
      hint: All seatbelts functional
      type: select_one
      options:
      - All functional
      - Some not functional
      - Not checked
      required: true
    - id: 27
      name: climate_control
      label: Climate Control
      hint: Heating and AC
      type: select_one
      options:
      - Functional
      - Partially functional
      - Not functional
      required: false
    - id: 28
      name: section_patient_compartment
      label: -- Patient Compartment --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: compartment_cleanliness
      label: Patient Compartment Cleanliness
      hint: Sanitized and clean
      type: select_one
      options:
      - Clean and sanitized
      - Acceptable
      - Needs cleaning
      required: true
    - id: 30
      name: stretcher_condition
      label: Stretcher Condition
      hint: Functional and secure
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Needs repair
      required: true
    - id: 31
      name: stretcher_straps
      label: Stretcher Straps
      hint: All present and functional
      type: select_one
      options:
      - All present and functional
      - Some missing/damaged
      required: true
    - id: 32
      name: oxygen_system
      label: Oxygen System
      hint: Tanks secured and functional
      type: select_one
      options:
      - Full and functional
      - Partially full
      - Needs refill
      - Not functional
      required: true
    - id: 33
      name: suction_unit
      label: Suction Unit
      hint: Functional with supplies
      type: select_one
      options:
      - Functional
      - Needs supplies
      - Not functional
      required: true
    - id: 34
      name: monitoring_equipment
      label: Cardiac Monitor/Defibrillator
      hint: Charged and functional
      type: select_one
      options:
      - Charged and functional
      - Needs charging
      - Not functional
      - Not available
      required: true
    - id: 35
      name: section_medical_supplies
      label: -- Medical Supplies --
      hint: null
      type: note
      options: []
      required: false
    - id: 36
      name: bandages_dressings
      label: Bandages and Dressings
      hint: Adequate supply
      type: select_one
      options:
      - Adequate
      - Low
      - Depleted
      required: true
    - id: 37
      name: iv_supplies
      label: IV Supplies
      hint: Catheters, fluids, tubing
      type: select_one
      options:
      - Adequate
      - Low
      - Depleted
      required: true
    - id: 38
      name: medications_inventory
      label: Medications Inventory
      hint: Check expiration dates
      type: select_one
      options:
      - Complete and current
      - Some expired
      - Incomplete
      required: true
    - id: 39
      name: airway_equipment
      label: Airway Equipment
      hint: Bag-valve masks, airways
      type: select_one
      options:
      - Complete
      - Incomplete
      - Missing items
      required: true
    - id: 40
      name: ppe_supplies
      label: PPE Supplies
      hint: Gloves, masks, gowns
      type: select_one
      options:
      - Adequate
      - Low
      - Depleted
      required: true
    - id: 41
      name: section_safety_equipment
      label: -- Safety Equipment --
      hint: null
      type: note
      options: []
      required: false
    - id: 42
      name: fire_extinguisher
      label: Fire Extinguisher
      hint: Charged and accessible
      type: select_one
      options:
      - Present and charged
      - Needs service
      - Missing
      required: true
    - id: 43
      name: first_aid_kit
      label: First Aid Kit
      hint: Complete and accessible
      type: select_one
      options:
      - Complete
      - Incomplete
      - Missing
      required: true
    - id: 44
      name: extrication_equipment
      label: Extrication Equipment
      hint: If equipped
      type: select_one
      options:
      - Present and functional
      - Incomplete
      - Not applicable
      required: false
    - id: 45
      name: section_communication
      label: -- Communication Equipment --
      hint: null
      type: note
      options: []
      required: false
    - id: 46
      name: radio_equipment
      label: Radio Equipment
      hint: Functional and tested
      type: select_one
      options:
      - Functional
      - Partially functional
      - Not functional
      required: true
    - id: 47
      name: mobile_data_terminal
      label: Mobile Data Terminal/GPS
      hint: If equipped
      type: select_one
      options:
      - Functional
      - Not functional
      - Not equipped
      required: false
    - id: 48
      name: section_fuel_mileage
      label: -- Fuel and Mileage --
      hint: null
      type: note
      options: []
      required: false
    - id: 49
      name: fuel_level
      label: Fuel Level
      hint: null
      type: select_one
      options:
      - Full
      - 3/4
      - 1/2
      - 1/4
      - Needs fuel
      required: true
    - id: 50
      name: odometer_reading
      label: Odometer Reading
      hint: Current mileage
      type: number
      options: []
      required: true
    - id: 51
      name: section_issues
      label: -- Issues and Notes --
      hint: null
      type: note
      options: []
      required: false
    - id: 52
      name: issues_found
      label: Were Any Issues Found
      hint: null
      type: select_one
      options:
      - No - All clear
      - Yes - Minor issues
      - Yes - Major issues
      required: true
    - id: 53
      name: issues_description
      label: Describe Issues Found
      hint: List all issues and concerns
      type: text
      options: []
      required: false
    - id: 54
      name: corrective_action
      label: Corrective Action Taken
      hint: What was done to address issues
      type: text
      options: []
      required: false
    - id: 55
      name: additional_notes
      label: Additional Notes
      hint: Any other observations
      type: text
      options: []
      required: false
    - id: 56
      name: checklist_completed_by
      label: Checklist Completed By
      hint: Signature
      type: text
      options: []
      required: true
    - id: 57
      name: supervisor_review
      label: Supervisor Review
      hint: Supervisor signature
      type: text
      options: []
      required: false
