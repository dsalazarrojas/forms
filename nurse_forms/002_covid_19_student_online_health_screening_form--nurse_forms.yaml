inputSchema:
  type: object
  properties:
    title: COVID 19 Student Online Health Screening Form
    pages:
    - id: 1
      name: student_name
      label: Student Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: grade_level
      label: Grade Level
      hint: null
      type: select_one
      options:
      - Elementary
      - Middle School
      - High School
      - College
      required: true
    - id: 4
      name: screening_date
      label: Screening Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: health_section
      label: -- Health Screening Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: fever_symptoms
      label: Do you have a fever or high temperature
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: temperature_reading
      label: Temperature Reading if Applicable
      hint: Fahrenheit
      type: number
      options: []
      required: false
    - id: 8
      name: cough_symptoms
      label: Do you have a persistent cough
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: breathing_difficulty
      label: Do you have difficulty breathing
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: loss_taste_smell
      label: Have you experienced loss of taste or smell
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: fatigue
      label: Are you experiencing unusual fatigue or weakness
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: headache_body_ache
      label: Do you have headache or body aches
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: nausea_vomiting
      label: Do you have nausea, vomiting, or diarrhea
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: covid_exposure
      label: Have you been exposed to someone with COVID-19
      hint: In the last 14 days
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: true
    - id: 15
      name: covid_diagnosis
      label: Have you tested positive for COVID-19
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Currently awaiting results
      required: true
    - id: 16
      name: diagnosis_date
      label: If yes, when was the positive test
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: vaccinated_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Unknown
      required: true
    - id: 18
      name: additional_notes
      label: Additional Health Notes or Symptoms
      hint: Please describe any other concerns
      type: text
      options: []
      required: false
    - id: 19
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: parent_email
      label: Parent or Guardian Email
      hint: null
      type: email
      options: []
      required: true
    - id: 21
      name: parent_phone
      label: Parent or Guardian Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 22
      name: clearance_status
      label: Student Clearance Status
      hint: To be completed by nurse
      type: select_one
      options:
      - Cleared to attend
      - Requires further evaluation
      - Must stay home
      - See school nurse
      required: false
