inputSchema:
  type: object
  properties:
    title: LPN Assignment Registration Form
    pages:
    - id: 1
      name: first_page
      label: First Page
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: placement_preferences
      label: Placement Preferences
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: availability
      label: Availability
      hint: Select the dates you are available
      type: date
      options: []
      required: false
    - id: 5
      name: start_time
      label: Start Time
      hint: Select the start time for your shift
      type: time
      options: []
      required: false
    - id: 6
      name: end_time
      label: End Time
      hint: Select the end time for your shift
      type: time
      options: []
      required: false
    - id: 7
      name: first_shift
