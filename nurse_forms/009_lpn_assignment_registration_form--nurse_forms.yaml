      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: fourth_shift
      label: Fourth Shift
      hint: Select your fourth shift preference
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: Additional comments or questions
      type: note
      options: []
      required: false
    - id: 12
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 13
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: confirm
      label: Confirm
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
