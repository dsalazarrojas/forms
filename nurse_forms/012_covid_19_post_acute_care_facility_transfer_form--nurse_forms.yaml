inputSchema:
  type: object
  properties:
    title: COVID 19 Post Acute Care Facility Transfer Form
    pages:
    - id: 1
      name: section_facility_info
      label: -- Facility Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: transferring_facility
      label: Transferring Facility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: receiving_facility
      label: Receiving Facility Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: section_patient_info
      label: -- Patient Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: patient_dob
      label: Patient Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: covid_status
      label: COVID-19 Status
      hint: null
      type: select_one
      options:
      - Confirmed Positive
      - Suspected/Symptomatic
      - Negative
      - Recovered
      required: true
    - id: 8
      name: last_test_date
      label: Date of Most Recent COVID-19 Test
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: last_test_result
      label: Most Recent Test Result
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Pending
      required: false
    - id: 10
      name: isolation_precautions
      label: Current Isolation Precautions
      hint: null
      type: select_multiple
      options:
      - Contact
      - Droplet
      - Airborne
      - Standard
      required: true
    - id: 11
      name: respiratory_support
      label: Respiratory Support Required
      hint: null
      type: select_one
      options:
      - None
      - Room Air
      - Nasal Cannula
      - Mask
      - CPAP/BIPAP
      - Ventilator
      required: true
    - id: 12
      name: section_vitals
      label: -- Current Vital Signs --
      hint: Last recorded vitals before transfer
      type: note
      options: []
      required: false
    - id: 13
      name: current_temp
      label: Current Temperature (F)
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: oxygen_sat
      label: Oxygen Saturation (%)
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: nurse_name
      label: Transferring Nurse Name
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: nurse_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
