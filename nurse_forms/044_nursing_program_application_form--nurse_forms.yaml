inputSchema:
  type: object
  properties:
    title: Nursing Program Application Form
    pages:
    - id: 1
      name: personal_details
      label: Personal Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: education_history
      label: Education History
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: professional_certifications
      label: Professional Certifications
      hint: null
      type: select_one
      options:
      - Certified LPN
      - Certified RN
      - Certified RN to BSN
      required: false
    - id: 5
      name: personal_statement
      label: Personal Statement
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: references
      label: References
      hint: null
      type: select_multiple
      options:
      - Reference 1
      - Reference 2
      - Reference 3
      required: false
