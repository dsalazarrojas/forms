inputSchema:
  type: object
  properties:
    title: Covid 19 Daily Status Update Form
    pages:
    - id: 1
      name: patient_status
      label: patient_status
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Unknown
      required: false
    - id: 2
      name: vaccine_status
      label: vaccine_status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partially Vaccinated
      - Not Vaccinated
      required: false
    - id: 3
      name: symptoms
      label: symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: temperature
      label: temperature
      hint: null
      type: select_one
      options:
      - Above 37.5
      - Normal (37.5C)
      - Below 37.5
      required: false
