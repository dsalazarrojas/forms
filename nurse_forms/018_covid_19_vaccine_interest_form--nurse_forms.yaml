inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine Interest Form
    pages:
    - id: 1
      name: interest_patient_header
      label: -- Personal Information --
      hint: Please provide your details
      type: note
      options: []
      required: false
    - id: 2
      name: interest_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: interest_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: interest_dob
      label: Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 5
      name: interest_email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 6
      name: interest_phone
      label: Phone Number
      hint: Your contact phone number
      type: phone
      options: []
      required: true
    - id: 7
      name: interest_address
      label: Street Address
      hint: Your current address
      type: text
      options: []
      required: false
    - id: 8
      name: vaccine_interest_header
      label: -- Vaccine Interest --
      hint: Tell us about your interest in vaccination
      type: note
      options: []
      required: false
    - id: 9
      name: interested_in_vaccine
      label: Are You Interested in Getting the COVID-19 Vaccine
      hint: Your interest level
      type: select_one
      options:
      - Yes, very interested
      - Somewhat interested
      - Undecided
      - Not very interested
      - Definitely not interested
      required: true
    - id: 10
      name: preferred_vaccine_timing
      label: If Interested, When Would You Like to Get Vaccinated
      hint: Your preferred timeline
      type: select_one
      options:
      - As soon as possible
      - Within 2 weeks
      - Within 1 month
      - 1-3 months from now
      - Later, when more information available
      - Not planning to get vaccinated
      required: false
    - id: 11
      name: vaccine_type_interest
      label: Do You Have a Vaccine Type Preference
      hint: Any preference among available vaccines
      type: select_one
      options:
      - Pfizer-BioNTech
      - Moderna
      - Johnson & Johnson
      - No specific preference
      required: false
    - id: 12
      name: reasons_interested_header
      label: -- Reasons for Interest --
      hint: Why are you interested in vaccination
      type: note
      options: []
      required: false
    - id: 13
      name: reasons_for_interest
      label: Reasons for Your Interest - Select All That Apply
      hint: Check all reasons that apply to you
      type: select_multiple
      options:
      - Protect myself from COVID-19
      - Protect family members
      - Return to normal activities
      - Work requirements
      - Travel requirements
      - Healthcare provider recommendation
      - Trust in vaccine safety
      - Protect vulnerable populations
      required: false
    - id: 14
      name: concerns_header
      label: -- Concerns or Questions --
      hint: What concerns do you have
      type: note
      options: []
      required: false
    - id: 15
      name: vaccine_concerns
      label: Do You Have Concerns About the COVID-19 Vaccine
      hint: Any concerns about vaccination
      type: select_one
      options:
      - No concerns
      - Minor concerns
      - Moderate concerns
      - Significant concerns
      required: true
    - id: 16
      name: specific_concerns
      label: If You Have Concerns, Please Describe Them
      hint: Describe your specific concerns
      type: text
      options: []
      required: false
    - id: 17
      name: information_needed_interest
      label: What Information Would Help You Decide
      hint: What would be helpful
      type: text
      options: []
      required: false
    - id: 18
      name: health_status_interest_header
      label: -- Health Status --
      hint: Brief health information
      type: note
      options: []
      required: false
    - id: 19
      name: current_health_status
      label: Current Health Status
      hint: How is your current health
      type: select_one
      options:
      - Excellent health
      - Good health
      - Fair health
      - Poor health
      required: true
    - id: 20
      name: chronic_conditions_interest
      label: Do You Have Any Chronic Health Conditions
      hint: Any ongoing health issues
      type: select_one
      options:
      - 'True'
      - 'False'
      - Prefer Not to Say
      required: false
    - id: 21
      name: allergies_interest
      Label: Do You Have Allergies to Vaccine Components
      hint: Any known vaccine allergies
      type: select_one
      options:
      - No allergies
      - Have allergies
      - Unsure
      required: true
    - id: 22
      name: preference_header
      label: -- Preferred Contact and Location --
      hint: How would you like us to contact you
      type: note
      options: []
      required: false
    - id: 23
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we reach you
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Mail
      required: true
    - id: 24
      name: preferred_location
      Label: Preferred Vaccination Location
      hint: Where would you prefer to get vaccinated
      type: select_one
      options:
      - Local pharmacy
      - Clinic
      - Hospital
      - Community center
      - Mobile clinic
      - No preference
      required: false
    - id: 25
      name: follow_up_consent
      label: May We Contact You About Vaccination Availability
      hint: Permission to follow up with you
      type: select_one
      options:
      - Yes, contact me
      - No, do not contact me
      required: true
