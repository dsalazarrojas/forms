inputSchema:
  type: object
  properties:
    title: Hospital Job Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: select_multiple
      options:
      - Nurse
      - Doctor
      - Other
      required: false
    - id: 6
      name: work_experience
      label: Work Experience
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - More than 2 years
      required: false
    - id: 7
      name: available_to_work
      label: Available to Work
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: available_to_work_time
      label: Available to Work Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: medical_school
      label: Medical School
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: medical_license
      label: Medical License
      hint: null
      type: select_one
      options:
      - Active
      - Expired
      - Not applicable
      required: false
