      type: email
      options: []
      required: false
    - id: 7
      name: customer_phone
      label: customer phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: shipping_address
      label: shipping address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: order_comments
      label: order comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: customer_note
      label: customer note
      hint: null
      type: text
      options: []
      required: false
