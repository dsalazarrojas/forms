inputSchema:
  type: object
  properties:
    title: Christmas Tree Order Form
    pages:
    - id: 1
      name: customer_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: For order confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: For delivery coordination
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: If business order
      type: text
      options: []
      required: false
    - id: 5
      name: section_customer_info
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: tree_species
      label: Tree Species
      hint: What type of tree do you want
      type: select_one
      options:
      - Fraser Fir
      - Balsam Fir
      - Douglas Fir
      - Noble Fir
      - Scotch Pine
      - White Pine
      - Blue Spruce
      - Colorado Spruce
      - No preference
      required: true
    - id: 7
      name: tree_height
      label: Tree Height
      hint: Desired height in feet
      type: select_one
      options:
      - 4-5 feet
      - 5-6 feet
      - 6-7 feet
      - 7-8 feet
      - 8-9 feet
      - 9-10 feet
      - Over 10 feet
      required: true
    - id: 8
      name: tree_grade
      label: Tree Grade
      hint: Quality grade selection
      type: select_one
      options:
      - Premium Grade A
      - Standard Grade B
      - Economy Grade C
      - No preference
      required: true
    - id: 9
      name: quantity
      label: Quantity
      hint: How many trees do you need
      type: number
      options: []
      required: true
    - id: 10
      name: section_tree_selection
      label: -- Tree Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: tree_stand_needed
      label: Tree Stand Needed
      hint: Do you need a stand
      type: select_one
      options:
      - No I have a stand
      - Yes basic stand
      - Yes deluxe spinning stand
      - Yes heavy duty stand
      required: true
    - id: 12
      name: stand_size
      label: Stand Size
      hint: Match to tree trunk size
      type: select_one
      options:
      - Standard fits most
      - Large for thick trunks
      - Extra large for premium trees
      required: false
    - id: 13
      name: additional_products
      label: Additional Products
      hint: What else would you like
      type: select_multiple
      options:
      - None
      - Tree netting
      - Tree bag for storage
      - Fresh garland
      - Wreath
      - Tree preservative
      - Ornament set
      - Light set
      required: false
    - id: 14
      name: section_accessories
      label: -- Accessories --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: delivery_method
      label: Delivery Method
      hint: How should you receive your tree
      type: select_one
      options:
      - Pickup at farm
      - Local delivery
      - Curbside delivery
      - White glove setup
      - Ship to address
      required: true
    - id: 16
      name: pickup_date
      label: Preferred Pickup Date
      hint: When will you pick up
      type: date
      options: []
      required: false
    - id: 17
      name: delivery_date
      label: Preferred Delivery Date
      hint: When should we deliver
      type: date
      options: []
      required: false
    - id: 18
      name: delivery_address
      label: Delivery Address
      hint: Full delivery address
      type: text
      options: []
      required: false
    - id: 19
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: postal_code
      label: Postal Code
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: section_delivery
      label: -- Delivery Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: delivery_instructions
      label: Delivery Instructions
      hint: Gate codes, special directions
      type: text
      options: []
      required: false
    - id: 23
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Cash at Pickup
      - Check
      - PayPal
      required: true
    - id: 24
      name: deposit_paid
      label: Deposit Payment
      hint: Deposit required for orders
      type: select_one
      options:
      - Yes I understand
      - No need information
      required: true
    - id: 25
      name: gift_message
      label: Gift Message
      hint: Is this a gift
      type: text
      options: []
      required: false
    - id: 26
      name: special_requests
      label: Special Requests
      hint: Any specific requirements
      type: text
      options: []
      required: false
    - id: 27
      name: how_heard
      label: How Did You Hear About Us
      hint: null
      type: select_one
      options:
      - Website
      - Social Media
      - Friend Referral
      - Drive-by Sign
      - Previous Customer
      - Online Search
      - Advertisement
      - Other
      required: false
