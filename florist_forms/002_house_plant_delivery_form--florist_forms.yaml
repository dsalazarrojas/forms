inputSchema:
  type: object
  properties:
    title: House Plant Delivery Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: order_payment
      label: Order Payment
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: delivery_details
      label: Delivery Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: order_notes
      label: Order Notes
      hint: Additional notes about the order.
      type: text
      options: []
      required: false
    - id: 6
      name: customer_phone
      label: Customer Phone
      hint: E.164 formatted phone number (e.g., +1-555-1234567)
      type: text
      options: []
      required: false
    - id: 7
      name: customer_email
      label: Customer Email
      hint: Your customer's email address
      type: text
      options: []
      required: false
    - id: 8
      name: delivery_location
      label: Delivery Location
      hint: Address for delivery
      type: text
      options: []
      required: false
    - id: 9
      name: plant_choice
      label: Plant Choice
      hint: null
      type: select_multiple
      options:
      - Rose
      - Lily
      - Carnation
      - Begonia
      - Fern
      - Succulent
      - Orchid
      - Violet
      - Basil
      - Chamomile
      - Daisy
      required: false
    - id: 10
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: delivery_notes
      label: Delivery Notes
      hint: Additional delivery instructions
      type: text
      options: []
      required: false
    - id: 13
      name: order_total
      label: Order Total
      hint: The final amount for the order
      type: number
      options: []
      required: false
    - id: 14
      name: payment_gateway
      label: Payment Gateway
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Braintree
      - Square
      required: false
