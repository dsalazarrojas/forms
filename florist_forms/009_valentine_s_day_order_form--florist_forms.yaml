inputSchema:
  type: object
  properties:
    title: valentines_day_order_form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Enter the customer's name
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Customer Email
      hint: Enter the customer's email address
      type: email
      options: []
      required: true
    - id: 3
      name: delivery_date
      label: Delivery Date
      hint: Select a date for delivery
      type: date
      options: []
      required: true
    - id: 4
      name: delivery_method
      label: Delivery Method
      hint: Select a delivery method
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 5
      name: order_type
      label: Order Type
      hint: Select a type of flower or gift
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 6
      name: delivery_time
      label: Delivery Time
      hint: Select a time for delivery
      type: time
      options: []
      required: true
    - id: 7
      name: order_notes
      label: Order Notes
      hint: Enter any special instructions for the delivery
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: Select the tool assigned to this order
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 9
      name: order_id
      label: Order ID
      hint: Enter the order ID
      type: text
      options: []
      required: true
    - id: 10
      name: form_id
      label: Form ID
      hint: Enter the form ID
      type: text
      options: []
      required: true
    - id: 11
      name: category
      label: Category
      hint: Select the category for this order
      type: text
      options: []
      required: true
    - id: 12
      name: output_file
      label: Output File
      hint: Enter the output file name
      type: text
      options: []
      required: true
