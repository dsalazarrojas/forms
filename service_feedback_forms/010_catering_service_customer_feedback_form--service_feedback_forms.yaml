inputSchema:
  type: object
  properties:
    title: Catering Service Customer Feedback Form
    pages:
    - id: 1
      name: section_event_info
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: customer_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: customer_email
      label: Your Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: customer_phone
      label: Your Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: event_type
      label: Type of Event
      hint: null
      type: select_one
      options:
      - Wedding
      - Corporate Event
      - Birthday Party
      - Anniversary
      - Graduation
      - Funeral Reception
      - Conference
      - Other
      required: true
    - id: 7
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: section_food_quality
      label: -- Food Quality Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: food_quality_rating
      label: Overall Food Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 10
      name: food_taste
      label: How would you rate the taste of the food?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 11
      name: food_temperature
      label: Was the food served at appropriate temperature?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Some items were incorrect
      required: true
    - id: 12
      name: food_freshness
      label: Food Freshness and Presentation
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 13
      name: section_service_quality
      label: -- Service Quality Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: staff_professionalism
      label: Staff Professionalism and Courtesy
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 15
      name: service_efficiency
      label: Service Efficiency and Responsiveness
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 16
      name: staff_attentiveness
      label: Staff Attentiveness to Guests
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 17
      name: section_facilities
      label: -- Facilities & Setup --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: setup_quality
      label: Table Setup and Presentation
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 19
      name: cleanliness
      label: Cleanliness of Facilities and Equipment
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Poor
      - Very Poor
      required: true
    - id: 20
      name: section_value_and_overall
      label: -- Value & Overall Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: value_for_money
      label: Value for Money
      hint: null
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Not Worth the Cost
      required: true
    - id: 22
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 23
      name: would_recommend
      label: Would you recommend this catering service?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Probably yes
      - Unsure
      - Probably not
      - No, definitely not
      required: true
    - id: 24
      name: comments_suggestions
      label: Comments and Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: future_business
      label: Would you use this catering service again?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Maybe
      required: true
