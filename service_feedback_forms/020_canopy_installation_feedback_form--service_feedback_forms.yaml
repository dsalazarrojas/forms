inputSchema:
  type: object
  properties:
    title: Canopy Installation Feedback Form
    pages:
    - id: 1
      name: intro_header
      label: -- Canopy Installation Feedback Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_text
      label: Thank you for choosing us for your canopy installation. Please rate your
        experience to help us improve our service.
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: customer_info_header
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: name
      label: Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: Your email
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 7
      name: service_info_header
      label: -- Service Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: installation_date
      label: Installation Date
      hint: Date of installation
      type: date
      options: []
      required: true
    - id: 9
      name: canopy_type
      label: Type of Canopy Installed
      hint: Select one
      type: select_one
      options:
      - Fixed Roof Canopy
      - Retractable Canopy
      - Portable/Tent Canopy
      - Shade Sail
      - Custom Design
      - Other
      required: true
    - id: 10
      name: installation_location
      label: Installation Location
      hint: Backyard, deck, commercial, etc.
      type: text
      options: []
      required: false
    - id: 11
      name: crew_professionalism_header
      label: -- Installation Crew Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: crew_professionalism
      label: Professionalism of Installation Crew
      hint: Rate the crew
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: crew_punctuality
      label: Punctuality and Schedule Adherence
      hint: Rate adherence
      type: select_one
      options:
      - Excellent - On time, as scheduled
      - Very Good - Mostly on time
      - Good - Generally reliable
      - Fair - Some delays
      - Poor - Significant delays
      required: true
    - id: 14
      name: crew_cleanliness
      label: Crew Cleanliness and Site Management
      hint: Rate site management
      type: select_one
      options:
      - Excellent - Very clean, professional
      - Very Good - Clean and organized
      - Good - Acceptable
      - Fair - Some mess left behind
      - Poor - Very messy
      required: true
    - id: 15
      name: installation_quality_header
      label: -- Installation Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: installation_quality
      label: Overall Quality of Installation
      hint: Rate quality
      type: select_one
      options:
      - Excellent - Exceeds expectations
      - Very Good - High quality work
      - Good - Satisfactory
      - Fair - Some issues
      - Poor - Significant problems
      required: true
    - id: 17
      name: structural_integrity
      label: Structural Integrity and Safety
      hint: Rate condition
      type: select_one
      options:
      - Excellent - Feels very secure
      - Very Good - Sturdy and safe
      - Good - Adequate
      - Fair - Some concerns
      - Poor - Significant safety concerns
      required: true
    - id: 18
      name: finish_quality
      label: Finish and Appearance Quality
      hint: Rate appearance
      type: select_one
      options:
      - Excellent - Perfect finish
      - Very Good - High quality appearance
      - Good - Acceptable appearance
      - Fair - Minor issues
      - Poor - Significant appearance problems
      required: true
    - id: 19
      name: communication_header
      label: -- Communication and Service --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: pre_installation_communication
      label: Pre-Installation Communication and Planning
      hint: Rate communication
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 21
      name: during_installation_communication
      label: Communication During Installation
      hint: Rate communication
      type: select_one
      options:
      - Excellent - Frequent updates
      - Very Good - Regular communication
      - Good - Adequate communication
      - Fair - Minimal communication
      - Poor - No communication
      required: true
    - id: 22
      name: explanation_clarity
      label: Clarity of Instructions and Warranties
      hint: Rate clarity
      type: select_one
      options:
      - Very Clear
      - Clear
      - Somewhat Clear
      - Unclear
      - Very Unclear
      required: true
    - id: 23
      name: pricing_header
      label: -- Pricing and Value --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: pricing_accuracy
      label: Were costs what was quoted?
      hint: Select one
      type: select_one
      options:
      - Yes, exact match
      - Yes, very close
      - Somewhat accurate
      - No, significantly higher
      required: true
    - id: 25
      name: value_for_money
      label: Value for Money
      hint: Rate value
      type: select_one
      options:
      - Excellent - Great value
      - Very Good - Good value
      - Good - Acceptable value
      - Fair - Somewhat overpriced
      - Poor - Poor value
      required: true
    - id: 26
      name: issues_header
      label: -- Issues and Concerns --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: issues_encountered
      label: Were there any issues during installation?
      hint: Select one
      type: select_one
      options:
      - No issues
      - Minor issues - quickly resolved
      - Some issues - mostly resolved
      - Significant issues - not fully resolved
      required: true
    - id: 28
      name: issue_resolution
      label: If issues occurred, how well were they handled?
      hint: Rate handling
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: false
    - id: 29
      name: recommendations_header
      label: -- Recommendations and Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate satisfaction
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 31
      name: would_recommend
      label: Would you recommend us to others?
      hint: Select one
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Unsure
      - Probably not
      - Definitely not
      required: true
    - id: 32
      name: improvement_suggestions
      label: What could we improve?
      hint: Optional suggestions
      type: text
      options: []
      required: false
