inputSchema:
  type: object
  properties:
    title: Air Care Service Feedback Survey
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: service_date
      label: Date of Service
      hint: When was service performed
      type: date
      options: []
      required: true
    - id: 3
      name: service_type
      label: Type of Service
      hint: What service was provided
      type: select_one
      options:
      - AC installation
      - AC repair
      - AC maintenance
      - Duct cleaning
      - Air quality testing
      - Thermostat installation
      - Emergency service
      - Other
      required: true
    - id: 4
      name: technician_name
      label: Technician Name
      hint: Name of service technician
      type: text
      options: []
      required: false
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied were you with our service
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 6
      name: technician_professionalism
      label: Technician Professionalism
      hint: Rate the technician professionalism
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 7
      name: technician_knowledge
      label: Technician Knowledge
      hint: Rate the technician knowledge
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 8
      name: punctuality
      label: Punctuality
      hint: Did the technician arrive on time
      type: select_one
      options:
      - Early
      - On time
      - Slightly late
      - Very late
      - No show
      required: true
    - id: 9
      name: work_quality
      label: Quality of Work
      hint: Rate the quality of work performed
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 10
      name: cleanliness
      label: Cleanliness
      hint: Did technician clean up after work
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 11
      name: value_for_money
      label: Value for Money
      hint: Rate the value for the price paid
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very poor
      required: true
    - id: 12
      name: problem_resolved
      label: Was Your Problem Resolved
      hint: Did we fix your issue
      type: select_one
      options:
      - Yes, completely
      - Partially
      - 'False'
      - Issue recurring
      required: true
    - id: 13
      name: explanation_clarity
      label: Explanation Clarity
      hint: Did technician explain the work clearly
      type: select_one
      options:
      - Very clear
      - Clear
      - Somewhat clear
      - Unclear
      - No explanation given
      required: true
    - id: 14
      name: pricing_satisfaction
      label: Pricing Satisfaction
      hint: How satisfied with the pricing
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 15
      name: scheduling_ease
      label: Scheduling Ease
      hint: How easy was it to schedule
      type: select_one
      options:
      - Very easy
      - Easy
      - Neutral
      - Difficult
      - Very difficult
      required: true
    - id: 16
      name: recommendation_likelihood
      label: Recommendation Likelihood
      hint: How likely to recommend us
      type: select_one
      options:
      - Very likely
      - Likely
      - Neutral
      - Unlikely
      - Very unlikely
      required: true
    - id: 17
      name: service_areas
      label: Areas for Improvement
      hint: What could we improve
      type: select_multiple
      options:
      - Response time
      - Pricing
      - Communication
      - Technician training
      - Scheduling flexibility
      - Follow-up service
      - Nothing
      required: true
    - id: 18
      name: additional_services
      label: Additional Services Needed
      hint: Do you need other services from us
      type: select_multiple
      options:
      - Heating repair
      - Duct sealing
      - Air purification
      - Humidifier installation
      - Maintenance plan
      - None at this time
      required: true
    - id: 19
      name: comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 20
      name: follow_up_permission
      label: May We Follow Up
      hint: Can we contact you about your feedback
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: survey_date
      label: Survey Date
      hint: Date of survey completion
      type: date
      options: []
      required: true
