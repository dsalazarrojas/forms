inputSchema:
  type: object
  properties:
    title: Babysitting Service Feedback
    pages:
    - id: 1
      name: parent_name
      label: Parent or Guardian Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: parent_email
      label: Email Address
      hint: For follow-up
      type: email
      options: []
      required: true
    - id: 3
      name: parent_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 4
      name: babysitter_name
      label: Babysitter Name
      hint: Name of caregiver being reviewed
      type: text
      options: []
      required: true
    - id: 5
      name: service_date
      label: Date of Service
      hint: When was care provided
      type: date
      options: []
      required: true
    - id: 6
      name: service_duration
      label: Duration of Care
      hint: How long was the service
      type: select_one
      options:
      - Less than 2 hours
      - 2 to 4 hours
      - 4 to 6 hours
      - 6 to 8 hours
      - Over 8 hours
      - Overnight
      required: true
    - id: 7
      name: number_of_children
      label: Number of Children
      hint: How many children were cared for
      type: number
      options: []
      required: true
    - id: 8
      name: children_ages
      label: Ages of Children
      hint: List ages of all children
      type: text
      options: []
      required: true
    - id: 9
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 10
      name: punctuality_rating
      label: Punctuality
      hint: Rate babysitter timeliness
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 11
      name: professionalism_rating
      label: Professionalism
      hint: Rate professionalism and conduct
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 12
      name: interaction_with_children
      label: Interaction with Children
      hint: Rate how they engaged with kids
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 13
      name: safety_rating
      label: Safety and Supervision
      hint: Rate safety measures taken
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 14
      name: communication_rating
      label: Communication
      hint: Rate communication with parents
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 15
      name: followed_instructions
      label: Followed Parent Instructions
      hint: Did babysitter follow your guidelines
      type: select_one
      options:
      - Yes, completely
      - Mostly
      - Somewhat
      - No, did not follow
      required: true
    - id: 16
      name: would_rehire
      label: Would You Hire Again
      hint: Would you use this babysitter again
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 17
      name: would_recommend
      label: Would You Recommend
      hint: Would you recommend to others
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 18
      name: best_qualities
      label: Best Qualities
      hint: What did you appreciate most
      type: text
      options: []
      required: false
    - id: 19
      name: areas_for_improvement
      label: Areas for Improvement
      hint: What could be better
      type: text
      options: []
      required: false
    - id: 20
      name: incident_report
      label: Were There Any Incidents
      hint: Any issues or concerns during care
      type: text
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback to share
      type: text
      options: []
      required: false
    - id: 22
      name: feedback_date
      label: Date of Feedback
      hint: Today date
      type: date
      options: []
      required: true
