inputSchema:
  type: object
  properties:
    title: Employee Peer Review Template
    pages:
    - id: 1
      name: peer_review
      label: Peer Review
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: performance_areas
      label: Performance Areas
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: feedback
      label: Feedback
      hint: What are some areas that this employee has excelled in?
      type: text
      options: []
      required: false
    - id: 4
      name: goals
      label: Goals
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: performance_issues
      label: Performance Issues
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: action_plans
      label: Action Plans
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: overall_rating
      label: Overall Rating
      hint: Select a rating from 1-5
      type: select_one
      options:
      - '{''value'': 1, ''label'': ''1/5''}'
      - '{''value'': 2, ''label'': ''2/5''}'
      - '{''value'': 3, ''label'': ''3/5''}'
      - '{''value'': 4, ''label'': ''4/5''}'
      - '{''value'': 5, ''label'': ''5/5''}'
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: employee_signature
      label: Employee Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: reviewer_signature
      label: Reviewer Signature
      hint: null
      type: text
      options: []
      required: false
