inputSchema:
  type: object
  properties:
    title: Background Check Service Feedback Survey
    pages:
    - id: 1
      name: respondent_name
      label: Full Name
      hint: Your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 4
      name: company_name
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: true
    - id: 5
      name: service_date
      label: Date of Service
      hint: When did you use the service
      type: date
      options: []
      required: true
    - id: 6
      name: service_type
      label: Type of Background Check
      hint: Select service used
      type: select_one
      options:
      - Criminal history check
      - Employment verification
      - Education verification
      - Credit check
      - Motor vehicle record
      - Drug screening
      - Comprehensive package
      required: true
    - id: 7
      name: number_of_checks
      label: Number of Checks Ordered
      hint: Approximate quantity
      type: number
      options: []
      required: true
    - id: 8
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Rate your experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 9
      name: ease_of_ordering
      label: Ease of Ordering
      hint: Rate the ordering process
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 10
      name: turnaround_time
      label: Turnaround Time
      hint: Rate speed of results
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 11
      name: accuracy_of_reports
      label: Accuracy of Reports
      hint: Rate report accuracy
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 12
      name: customer_service
      label: Customer Service
      hint: Rate support received
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 13
      name: value_for_money
      label: Value for Money
      hint: Rate pricing value
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 14
      name: report_clarity
      label: Report Clarity
      hint: How clear were the results
      type: select_one
      options:
      - Very Clear
      - Clear
      - Neutral
      - Unclear
      - Very Unclear
      required: true
    - id: 15
      name: compliance_support
      label: FCRA Compliance Support
      hint: Rate compliance guidance
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      - Not Applicable
      required: true
    - id: 16
      name: technology_platform
      label: Technology Platform
      hint: Rate online system
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Below Average
      - Poor
      required: true
    - id: 17
      name: would_use_again
      label: Would Use Service Again
      hint: Will you use again
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 18
      name: would_recommend
      label: Would Recommend to Others
      hint: Will you recommend
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 19
      name: best_features
      label: Best Features of Service
      hint: What did you like most
      type: text
      options: []
      required: false
    - id: 20
      name: areas_for_improvement
      label: Areas for Improvement
      hint: What could be better
      type: text
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 22
      name: survey_date
      label: Survey Date
      hint: Today date
      type: date
      options: []
      required: true
