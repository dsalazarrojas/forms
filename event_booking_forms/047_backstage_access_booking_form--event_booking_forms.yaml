inputSchema:
  type: object
  properties:
    title: Backstage Access Booking Form
    pages:
    - id: 1
      name: requester_name
      label: Full Name
      hint: Your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: For booking confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: company_organization
      label: Company or Organization
      hint: Media outlet or organization
      type: text
      options: []
      required: true
    - id: 5
      name: role_title
      label: Role or Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 6
      name: event_name
      label: Event Name
      hint: Name of event
      type: text
      options: []
      required: true
    - id: 7
      name: event_date
      label: Event Date
      hint: Date of event
      type: date
      options: []
      required: true
    - id: 8
      name: venue_name
      label: Venue Name
      hint: Location of event
      type: text
      options: []
      required: true
    - id: 9
      name: access_type
      label: Type of Access Requested
      hint: Select access level
      type: select_one
      options:
      - Full backstage access
      - Meet and greet only
      - Photo pit access
      - Side stage access
      - VIP area access
      - Press room access
      required: true
    - id: 10
      name: access_duration
      label: Access Duration
      hint: How long do you need access
      type: select_one
      options:
      - Pre-show only
      - Post-show only
      - Full event
      - Specific time window
      required: true
    - id: 11
      name: access_time
      label: Specific Time Window
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 12
      name: number_of_people
      label: Number of People
      hint: Total needing access
      type: number
      options: []
      required: true
    - id: 13
      name: attendee_names
      label: Names of All Attendees
      hint: List full names
      type: text
      options: []
      required: true
    - id: 14
      name: purpose_of_visit
      label: Purpose of Backstage Visit
      hint: Why do you need access
      type: select_one
      options:
      - Media interview
      - Photography
      - Artist meet and greet
      - Performance preparation
      - VIP experience
      - Work duties
      - Other
      required: true
    - id: 15
      name: media_outlet
      label: Media Outlet or Publication
      hint: Where will content appear
      type: text
      options: []
      required: false
    - id: 16
      name: interview_request
      label: Interview Request
      hint: Are you requesting an interview
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 17
      name: photography_allowed
      label: Photography Allowed
      hint: Do you plan to take photos
      type: select_one
      options:
      - Yes, professional
      - Yes, personal
      - false
      required: true
    - id: 18
      name: equipment_list
      label: Equipment You Will Bring
      hint: List cameras, recording devices, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: special_requests
      label: Special Requests
      hint: Any specific needs
      type: text
      options: []
      required: false
    - id: 20
      name: dietary_requirements
      label: Dietary Requirements
      hint: If hospitality is provided
      type: text
      options: []
      required: false
    - id: 21
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: In case of emergency
      type: text
      options: []
      required: true
    - id: 22
      name: terms_agreement
      label: Terms and Conditions Agreement
      hint: I agree to all backstage rules and policies
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 23
      name: liability_waiver
      label: Liability Waiver
      hint: I release event organizers from liability
      type: select_one
      options:
      - Yes, I waive liability
      - No, I do not waive
      required: true
    - id: 24
      name: booking_date
      label: Booking Date
      hint: Date of this request
      type: date
      options: []
      required: true
