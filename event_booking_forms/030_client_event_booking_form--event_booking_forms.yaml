inputSchema:
  type: object
  properties:
    title: Client Event Booking Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Your business name
      type: text
      options: []
      required: false
    - id: 6
      name: company_address
      label: Company Address
      hint: Complete business address
      type: text
      options: []
      required: false
    - id: 7
      name: event_type
      label: Event Type
      hint: What type of event?
      type: select_one
      options:
      - Corporate Meeting
      - Conference
      - Trade Show
      - Product Launch
      - Company Party
      - Holiday Celebration
      - Team Building
      - Training Session
      - Seminar or Workshop
      - Gala or Awards Ceremony
      - Wedding
      - Private Party
      - Other
      required: true
    - id: 8
      name: event_name
      label: Event Name
      hint: Official name of your event
      type: text
      options: []
      required: true
    - id: 9
      name: event_date
      label: Preferred Event Date
      hint: First choice date
      type: date
      options: []
      required: true
    - id: 10
      name: alternative_dates
      label: Alternative Dates
      hint: Other dates you are considering
      type: text
      options: []
      required: false
    - id: 11
      name: event_start_time
      label: Event Start Time
      hint: When does it begin?
      type: time
      options: []
      required: true
    - id: 12
      name: event_end_time
      label: Event End Time
      hint: When does it end?
      type: time
      options: []
      required: true
    - id: 13
      name: setup_time_needed
      label: Setup Time Needed
      hint: Before event starts
      type: select_one
      options:
      - 1 Hour
      - 2 Hours
      - 3-4 Hours
      - Full Day Before
      - Not Sure
      required: true
    - id: 14
      name: expected_guests
      label: Expected Number of Guests
      hint: Approximate count
      type: number
      options: []
      required: true
    - id: 15
      name: guest_count_range
      label: Guest Count Range
      hint: Estimated range
      type: select_one
      options:
      - 1-25 guests
      - 26-50 guests
      - 51-100 guests
      - 101-200 guests
      - 201-500 guests
      - Over 500 guests
      required: true
    - id: 16
      name: venue_preference
      label: Venue Preference
      hint: Location type
      type: select_one
      options:
      - Indoor Only
      - Outdoor Only
      - Indoor and Outdoor
      - Virtual or Hybrid
      - No Preference
      required: true
    - id: 17
      name: room_setup
      label: Preferred Room Setup
      hint: Seating arrangement
      type: select_one
      options:
      - Theater Style
      - Classroom Style
      - Banquet Rounds
      - U-Shape
      - Boardroom
      - Cocktail Style
      - Custom Setup
      - Not Sure
      required: false
    - id: 18
      name: catering_needed
      label: Is Catering Needed?
      hint: Food and beverage service
      type: select_one
      options:
      - Yes, Full Catering
      - Yes, Light Refreshments
      - Yes, Beverages Only
      - No, External Caterer
      - No Catering Needed
      required: true
    - id: 19
      name: catering_type
      label: Type of Catering
      hint: If applicable
      type: select_one
      options:
      - Breakfast
      - Lunch
      - Dinner
      - Cocktail Reception
      - Buffet
      - Plated Service
      - Food Stations
      - Not Sure
      required: false
    - id: 20
      name: dietary_restrictions
      label: Dietary Restrictions to Accommodate
      hint: Select all that apply
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Dairy-Free
      - Nut Allergies
      - Kosher
      - Halal
      - Other
      required: false
    - id: 21
      name: av_equipment
      label: Audio Visual Equipment Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Projector
      - Screen
      - Microphones
      - Speakers
      - Podium
      - Video Conferencing
      - Recording Equipment
      - Lighting
      - Stage
      - None
      required: true
    - id: 22
      name: special_requests
      label: Special Requests
      hint: Any specific requirements
      type: text
      options: []
      required: false
    - id: 23
      name: decor_theme
      label: Decor or Theme Preferences
      hint: Color scheme, theme, etc.
      type: text
      options: []
      required: false
    - id: 24
      name: budget_range
      label: Budget Range
      hint: Estimated budget
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - $25,000 - $50,000
      - Over $50,000
      required: true
    - id: 25
      name: how_did_you_hear
      label: How Did You Hear About Us?
      hint: Referral source
      type: select_one
      options:
      - Website
      - Social Media
      - Referral
      - Advertisement
      - Previous Event
      - Other
      required: false
    - id: 26
      name: booking_status
      label: Booking Status
      hint: Current status
      type: select_one
      options:
      - Ready to Book
      - Considering Options
      - Requesting Quote
      - Just Browsing
      required: true
    - id: 27
      name: deposit_understanding
      label: I Understand a Deposit Is Required to Secure Booking
      hint: Deposit acknowledgment
      type: select_one
      options:
      - I Understand
      - I Do Not Understand
      required: true
    - id: 28
      name: terms_agreement
      label: I Agree to the Terms and Conditions
      hint: Full agreement
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 29
      name: booking_date
      label: Booking Request Date
      hint: null
      type: date
      options: []
      required: true
