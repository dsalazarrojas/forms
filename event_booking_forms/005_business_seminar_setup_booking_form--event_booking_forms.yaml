inputSchema:
  type: object
  properties:
    title: Business Seminar Setup Booking Form
    pages:
    - id: 1
      name: organizer_name
      label: Organizer Name
      hint: Name of the person arranging the seminar
      type: text
      options: []
      required: true
    - id: 2
      name: organizer_email
      label: Organizer Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: organizer_phone
      label: Organizer Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company or Organization Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: seminar_title
      label: Seminar Title
      hint: Topic or subject of the seminar
      type: text
      options: []
      required: true
    - id: 6
      name: seminar_date
      label: Seminar Date
      hint: Preferred date for the seminar
      type: date
      options: []
      required: true
    - id: 7
      name: start_time
      label: Start Time
      hint: What time should the seminar begin?
      type: time
      options: []
      required: true
    - id: 8
      name: end_time
      label: End Time
      hint: What time should the seminar end?
      type: time
      options: []
      required: true
    - id: 9
      name: expected_attendance
      label: Expected Number of Attendees
      hint: Estimated participant count
      type: number
      options: []
      required: true
    - id: 10
      name: venue_type
      label: Venue Type
      hint: Where will the seminar be held?
      type: select_one
      options:
      - Hotel or Conference Center
      - Corporate Office
      - University or Education Center
      - Community Center
      - Outdoor Location
      - Virtual - Online only
      - Hybrid - Both in-person and virtual
      required: true
    - id: 11
      name: venue_address
      label: Venue Address
      hint: If in-person, provide venue location
      type: text
      options: []
      required: false
    - id: 12
      name: room_setup_preference
      label: Preferred Room Setup
      hint: null
      type: select_one
      options:
      - Theater style
      - Classroom style
      - Banquet style
      - U-shape
      - Hollow square
      - Cocktail reception
      required: true
    - id: 13
      name: equipment_needed
      label: What equipment do you need?
      hint: Select all that apply
      type: select_multiple
      options:
      - Projector and screen
      - Audio system and microphone
      - Podium
      - Tables and chairs
      - WiFi access
      - Video conferencing equipment
      - Lighting
      - Registration table
      required: true
    - id: 14
      name: audiovisual_requirements
      label: Do you have specific AV requirements?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: catering_needed
      label: Will you need catering services?
      hint: null
      type: select_one
      options:
      - Yes, full meal service
      - Yes, refreshments and snacks
      - Yes, beverages only
      - No catering needed
      required: true
    - id: 16
      name: special_requests
      label: Do you have special requests or requirements?
      hint: Accessibility needs, dietary restrictions, etc.
      type: text
      options: []
      required: false
    - id: 17
      name: parking_available
      label: Will parking be provided?
      hint: null
      type: select_one
      options:
      - Yes, complimentary
      - Yes, paid parking
      - Limited parking
      - No parking available
      required: true
    - id: 18
      name: registration_link_needed
      label: Do you need a registration/ticketing link?
      hint: null
      type: select_one
      options:
      - Yes, send me the link
      - No, we have our own system
      - Unsure
      required: true
    - id: 19
      name: follow_up_contact
      label: Preferred method of follow-up communication
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text Message
      - Video call
      required: true
    - id: 20
      name: additional_notes
      label: Additional Notes or Comments
      hint: null
      type: text
      options: []
      required: false
