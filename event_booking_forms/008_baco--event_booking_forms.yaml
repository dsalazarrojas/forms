        options: []
        required: false
      - id: 6
        name: accessibility_needs
        label: Accessibility needs
        hint: Mobility hearing visual requirements
        type: text
        options: []
        required: false
      - id: 7
        name: sessions_interested
        label: Sessions of interest
        hint: Indicate preferred tracks
