inputSchema:
  type: object
  properties:
    title: Backstage Label Printing Booking Form
    pages:
    - id: 1
      name: requester_name
      label: Full Name
      hint: Your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: For order confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: company_organization
      label: Company or Organization
      hint: Your business or group
      type: text
      options: []
      required: true
    - id: 5
      name: event_name
      label: Event Name
      hint: Name of event
      type: text
      options: []
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: Date of event
      type: date
      options: []
      required: true
    - id: 7
      name: venue_name
      label: Venue Name
      hint: Event location
      type: text
      options: []
      required: true
    - id: 8
      name: label_type
      label: Type of Labels Needed
      hint: Select label type
      type: select_one
      options:
      - Name badges
      - Access passes
      - Equipment labels
      - Cable labels
      - Case labels
      - Custom labels
      required: true
    - id: 9
      name: label_size
      label: Label Size
      hint: Select size
      type: select_one
      options:
      - Small, 2x1 inches
      - Medium, 3x2 inches
      - Large, 4x3 inches
      - Badge size, 4x6 inches
      - Custom size
      required: true
    - id: 10
      name: quantity_needed
      label: Quantity Needed
      hint: How many labels
      type: number
      options: []
      required: true
    - id: 11
      name: color_preference
      label: Color Preference
      hint: Select color scheme
      type: select_one
      options:
      - White with black text
      - Color printed
      - Specific color required
      - No preference
      required: true
    - id: 12
      name: specific_colors
      label: Specific Colors Required
      hint: List color requirements
      type: text
      options: []
      required: false
    - id: 13
      name: label_content
      label: Label Content
      hint: What text or graphics should be included
      type: text
      options: []
      required: true
    - id: 14
      name: logo_included
      label: Will Logo Be Included
      hint: Do you have a logo to add
      type: select_one
      options:
      - Yes, will upload
      - Yes, will email
      - No logo
      required: true
    - id: 15
      name: barcode_needed
      label: Barcode or QR Code Needed
      hint: Do you need scannable codes
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: laminate_needed
      label: Lamination Needed
      hint: Do labels need protective coating
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: adhesive_type
      label: Adhesive Type
      hint: Select adhesive
      type: select_one
      options:
      - Standard permanent
      - Removable
      - Heavy duty
      - Lanyard clip
      - Pin back
      required: true
    - id: 18
      name: rush_order
      label: Is This a Rush Order
      hint: Do you need expedited service
      type: select_one
      options:
      - Yes, rush
      - No, standard
      required: true
    - id: 19
      name: delivery_method
      label: Delivery Method
      hint: How will you receive labels
      type: select_one
      options:
      - Pickup at venue
      - Ship to address
      - Will call
      required: true
    - id: 20
      name: delivery_address
      label: Delivery Address
      hint: Full address if shipping
      type: text
      options: []
      required: false
    - id: 21
      name: setup_service
      label: Setup Service Needed
      hint: Do you need labels applied or distributed
      type: select_one
      options:
      - Yes, full setup
      - Yes, partial help
      - No, we will handle
      required: true
    - id: 22
      name: special_instructions
      label: Special Instructions
      hint: Any additional requirements
      type: text
      options: []
      required: false
    - id: 23
      name: budget_range
      label: Budget Range
      hint: Select budget category
      type: select_one
      options:
      - Under 100
      - 100 to 250
      - 250 to 500
      - 500 to 1000
      - Over 1000
      required: false
    - id: 24
      name: order_date
      label: Order Date
      hint: Date of this request
      type: date
      options: []
      required: true
