inputSchema:
  type: object
  properties:
    title: Cocktail Menu Selection
    pages:
    - id: 1
      name: section_guest_info
      label: -- Guest Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: guest_name
      label: Guest Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: event_name
      label: Event Name
      hint: Name of the event
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: section_drink_selection
      label: -- Drink Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: primary_choice
      label: Primary Cocktail Choice
      hint: Your first preference
      type: select_one
      options:
      - Margarita
      - Mojito
      - Old Fashioned
      - Cosmopolitan
      - Martini
      - Daiquiri
      - Sangria
      - Other
      required: true
    - id: 8
      name: secondary_choice
      label: Secondary Cocktail Choice
      hint: Your second preference
      type: select_one
      options:
      - Margarita
      - Mojito
      - Old Fashioned
      - Cosmopolitan
      - Martini
      - Daiquiri
      - Sangria
      - Other
      required: false
    - id: 9
      name: spirit_preference
      label: Preferred Spirit Type
      hint: Base spirit preference
      type: select_one
      options:
      - Vodka
      - Gin
      - Rum
      - Tequila
      - Whiskey
      - Brandy
      - No preference
      required: false
    - id: 10
      name: section_preferences
      label: -- Flavor Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: flavor_profile
      label: Preferred Flavor Profile
      hint: Select all that apply
      type: select_multiple
      options:
      - Fruity
      - Sweet
      - Sour
      - Herbal
      - Spicy
      - Smoky
      - Tropical
      required: true
    - id: 12
      name: sweetness_level
      label: Sweetness Level Preference
      hint: null
      type: select_one
      options:
      - Very sweet
      - Sweet
      - Balanced
      - Dry
      - Very dry
      required: false
    - id: 13
      name: strength_preference
      label: Alcohol Strength Preference
      hint: null
      type: select_one
      options:
      - Light
      - Moderate
      - Strong
      - No preference
      required: false
    - id: 14
      name: section_nonalcoholic
      label: -- Non-Alcoholic Options --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: nonalcoholic_option
      label: Non-Alcoholic Drink Selection
      hint: If preferred
      type: select_one
      options:
      - Mocktail version of choice
      - Sparkling water
      - Juice blend
      - Soda
      - Coffee drink
      - Tea
      - Other
      required: false
    - id: 16
      name: section_dietary
      label: -- Dietary Considerations --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Select all that apply
      type: select_multiple
      options:
      - Gluten-free
      - Vegan
      - Dairy-free
      - Nut-free
      - Sugar-free
      - Alcohol-free
      - None
      required: true
    - id: 18
      name: allergies
      label: Allergies
      hint: Any ingredient allergies
      type: text
      options: []
      required: false
    - id: 19
      name: section_quantities
      label: -- Quantities --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: number_servings
      label: Number of Servings
      hint: How many drinks of your choice
      type: number
      options: []
      required: true
    - id: 21
      name: section_comments
      label: -- Additional Comments --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: special_requests
      label: Special Requests
      hint: Any customizations or notes
      type: text
      options: []
      required: false
