inputSchema:
  type: object
  properties:
    title: Cultural Event Vendor Booth Booking Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: booth_type
      label: Booth Type
      hint: null
      type: select_multiple
      options:
      - Booth
      - Food
      - Beverage
      - Other
      required: true
    - id: 5
      name: booth_size
      label: Booth Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 6
      name: requirements
      label: Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submission
      label: Submission
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
