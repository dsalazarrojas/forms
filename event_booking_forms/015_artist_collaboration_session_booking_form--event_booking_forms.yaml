inputSchema:
  type: object
  properties:
    title: Artist Collaboration Session Booking Form
    pages:
    - id: 1
      name: primary_artist_name
      label: Primary Artist Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: collaborating_artist
      label: Collaborating Artist Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: artist_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: artist_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: session_type
      label: Session Type
      hint: null
      type: select_one
      options:
      - Recording Session
      - Writing Session
      - Rehearsal
      - Mentoring
      - Brainstorming
      - Performance
      required: true
    - id: 6
      name: preferred_date
      label: Preferred Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: preferred_time
      label: Preferred Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: session_duration
      label: Estimated Session Duration - Hours
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: session_location
      label: Session Location or Venue
      hint: Studio, online, in-person venue
      type: text
      options: []
      required: true
    - id: 10
      name: online_platform
      label: Online Platform (if applicable)
      hint: Zoom, Google Meet, etc.
      type: text
      options: []
      required: false
    - id: 11
      name: collaboration_goals
      label: Collaboration Goals and Objectives
      hint: What do you hope to achieve
      type: text
      options: []
      required: true
    - id: 12
      name: required_equipment
      label: Required Equipment or Resources
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: music_genre
      label: Music Genre or Art Style
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: experience_level
      label: Experience Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Professional
      required: false
    - id: 15
      name: session_compensation
      label: Session Compensation or Fees
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: intellectual_property
      label: Intellectual Property Agreement
      hint: null
      type: select_one
      options:
      - Equal Rights
      - Lead Artist Rights
      - To Be Determined
      required: false
    - id: 17
      name: references
      label: References or Previous Collaborations
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: additional_information
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
