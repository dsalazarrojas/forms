inputSchema:
  type: object
  properties:
    title: Conference Reservation Form
    pages:
    - id: 1
      name: section_guest_info
      label: -- Guest Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: guest_full_name
      label: Full Name
      hint: Enter your full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: check_in_date
      label: Check-in Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: check_out_date
      label: Check-out Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: room_type
      label: Room Type Preference
      hint: null
      type: select_one
      options:
      - Single Room
      - Double Room
      - Suite
      - Executive Suite
      required: true
    - id: 7
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: section_conference_details
      label: -- Conference Center Utilization --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: meeting_room_size
      label: Meeting Room Size Requirement
      hint: null
      type: select_one
      options:
      - Small (up to 10 people)
      - Medium (11-50 people)
      - Large (51-200 people)
      - Ballroom (200+ people)
      required: true
    - id: 10
      name: av_equipment_needed
      label: Audio-Visual Equipment Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Projector and Screen
      - Wireless Microphones
      - Sound System
      - Flip Charts and Markers
      - Video Conferencing Setup
      required: false
    - id: 11
      name: section_food_lodging
      label: -- Lodging and Food --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: meal_plan
      label: Meal Plan Selection
      hint: null
      type: select_one
      options:
      - Breakfast Only
      - Half Board (Breakfast and Dinner)
      - Full Board (All Meals)
      - All Inclusive
      required: true
    - id: 13
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: Please list any specific requirements
      type: text
      options: []
      required: false
    - id: 14
      name: special_requests
      label: Special Requests or Additional Information
      hint: null
      type: text
      options: []
      required: false
