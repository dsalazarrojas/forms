inputSchema:
  type: object
  properties:
    title: Luxury Glamping Tent Booking Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact Email
      hint: Enter a valid email address
      type: email
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: checkin_date
      label: Checkin
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: checkout_date
      label: Checkout
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: glamping_site_name
      label: Glamping Site
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: glamping_site_type
      label: Glamping Site Type
      hint: null
      type: select_multiple
      options:
      - Tent
      - RV
      - Cabin
      - House
      - Yurt
      required: true
    - id: 8
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: payment_method
      label: Payment Method
      hint: We accept all major credit cards and PayPal
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: true
    - id: 10
      name: special_requests
      label: Special Requests
      hint: Any special requests?
      type: text
      options: []
      required: false
