    - id: 5
      name: stage_technical_requirements
      label: Stage Technical Requirements
      hint: null
      type: select_multiple
      options:
      - '{''Label'': ''Power''}'
      - '{''Label'': ''Water''}'
      - '{''Label'': ''Internet''}'
      - '{''Label'': ''Other''}'
      required: false
    - id: 6
      name: submission
      label: Submission
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: performer_contact
      label: Performer Contact
      hint: null
