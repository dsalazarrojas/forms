inputSchema:
  type: object
  properties:
    title: Music Event Stage Setup Registration Form
    pages:
    - id: 1
      name: main_page
      label: Main
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: performer_technical_details
      label: Performer Technical Details
      hint: null
      type: text
      options: []
