      - '{''Label'': ''Stage Depth (m)''}'
      - '{''Label'': ''Backline Height (m)''}'
      - '{''Label'': ''Backline Length (m)''}'
      - '{''Label'': ''Backline Width (m)''}'
      - '{''Label'': ''Height (m)''}'
      - '{''Label'': ''Stage Angle''}'
      - '{''Label'': ''Stage Orientation''}'
      - '{''Label'': ''Other Requirements''}'
