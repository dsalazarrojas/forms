      type: text
      options: []
      required: false
    - id: 4
      name: is_achieving_business_goals
      label: Is Achieving Business Goals
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: is_measuring_progress
      label: Is Measuring Progress
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: is_customizable
      label: Is Customizable
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
