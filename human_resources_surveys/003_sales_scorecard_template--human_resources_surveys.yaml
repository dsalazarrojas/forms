      name: sales_scorecard_template
      label: Sales Scorecard Template
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: category_name
      label: Category
      hint: null
      type: select_one
      options:
      - Human Resources Surveys
      - Other
      required: false
    - id: 3
