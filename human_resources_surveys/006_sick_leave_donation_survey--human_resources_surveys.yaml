inputSchema:
  type: object
  properties:
    title: Sick Leave Donation Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: overall_support
      label: overall_support
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: sentiment
      label: sentiment
      hint: null
      type: select_multiple
      options:
      - strongly support
      - somewhat support
      - neutral
      - somewhat opposed
      - strongly opposed
      required: true
    - id: 4
      name: concerns
      label: concerns
      hint: null
      type: select_multiple
      options:
      - lack of transparency
      - unclear policies
      - unequal access
      - other
      required: true
    - id: 5
      name: suggestion
      label: suggestion
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_comments
      label: additional_comments
      hint: null
      type: note
      options: []
      required: false
