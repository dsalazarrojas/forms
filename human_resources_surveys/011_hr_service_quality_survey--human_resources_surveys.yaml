inputSchema:
  type: object
  properties:
    title: HR Service Quality Survey
    pages:
    - id: 1
      name: employee_survey
      label: Do you feel that the HR department has provided good quality services?
      hint: Please select all that apply
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: employee_survey_department
      label: Which department did you interact with recently?
      hint: Select only one
      type: select_one
      options:
      - HR
      - Finance
      - Marketing
      required: true
    - id: 3
      name: comments_and_suggestions
      label: Comments and suggestions for improvement?
      hint: Please provide any comments or suggestions
      type: text
      options: []
      required: false
    - id: 4
      name: overall_satisfaction
      label: How would you rate your overall satisfaction with the HR service?
      hint: Rate from 1 to 5
      type: number
      options: []
      required: true
    - id: 5
      name: rating_comments
      label: Do you have any comments about your rating?
      hint: Please provide any comments about your rating
      type: text
      options: []
      required: false
    - id: 6
      name: satisfaction_across_departments
      label: Are you satisfied with the services provided by the HR department across
        all departments?
      hint: Select all that apply
      type: select_multiple
      options:
      - Satisfied
      - Dissatisfied
      required: true
    - id: 7
      name: next_steps
      label: What are the next steps for the HR department to improve services?
      hint: Please provide any suggestions
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Have you had any contact with the HR department recently?
      hint: If yes, please provide email address
      type: email
      options: []
      required: false
    - id: 9
      name: phone_number
      label: What is your phone number?
      hint: Optional
      type: text
      options: []
      required: false
    - id: 10
      name: name
      label: What is your name?
      hint: Please provide your name
      type: text
      options: []
      required: true
    - id: 11
      name: job_title
      label: What is your job title?
      hint: Please provide your job title
      type: text
      options: []
      required: true
    - id: 12
      name: department
      label: Which department do you work in?
      hint: Select only one
      type: select_one
      options:
      - HR
      - Finance
      - Marketing
      required: true
    - id: 13
      name: time
      label: What date and time did you interact with the HR department?
      hint: Optional
      type: time
      options: []
      required: false
    - id: 14
      name: date
      label: What date did you interact with the HR department?
      hint: Optional
      type: date
      options: []
      required: false
    - id: 15
      name: time_taken
      label: How long did you take to respond?
      hint: Optional
      type: number
      options: []
      required: false
    - id: 16
      name: comments
      label: Do you have any comments or feedback?
      hint: Please provide any comments or feedback
      type: text
      options: []
      required: false
