inputSchema:
  type: object
  properties:
    title: Employee Retention Benchmark Survey
    pages:
    - id: 1
      name: current_job_title
      label: Current Job Title
      hint: null
      type: select_one
      options:
      - General Manager
      - Director
      - CEO
      - Operations Manager
      required: true
    - id: 2
      name: job_satisfaction
      label: How Satisfied Are You with Your Current Job?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      required: true
    - id: 3
      name: turnover_rate
      label: Estimated Turnover Rate
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Very High
      required: true
    - id: 4
      name: job_satisfaction_level
      label: Job Satisfaction Level
      hint: null
      type: select_one
      options:
      - Highly Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      required: true
    - id: 5
      name: turnover_reasons
      label: Main Reasons for Potential Turnover
      hint: null
      type: select_multiple
      options:
      - Career Growth Opportunities
      - Salary or Benefits
      - Job Security
      - Other
      required: true
    - id: 6
      name: employee_engagement
      label: Employee Engagement Level
      hint: null
      type: select_one
      options:
      - Highly Engaged
      - Somewhat Engaged
      - Neutral
      - Somewhat Disengaged
      required: true
    - id: 7
      name: retention_programs
      label: Retention Programs
      hint: null
      type: select_one
      options:
      - Very Effective
      - Somewhat Effective
      - Not Very Effective
      - Not at All Effective
      required: true
    - id: 8
      name: next_steps
      label: Next Steps for Improving Retention
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - Operations
      - Management
      - Human Resources
      required: true
    - id: 13
      name: years_of_service
      label: Years of Service
      hint: null
      type: number
      options: []
      required: true
