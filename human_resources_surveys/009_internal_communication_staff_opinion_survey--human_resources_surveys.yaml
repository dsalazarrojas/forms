inputSchema:
  type: object
  properties:
    title: Internal Communication Staff Opinion Survey
    pages:
    - id: 1
      name: staff_opinion_survey
      label: What do you think about our internal communication?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: communication_channels
      label: Which internal communication channels do you use most?
      hint: null
      type: select_multiple
      options:
      - Email
      - Team meetings
      - Intranet
      - Social media
      - Instant messaging
      required: false
    - id: 3
      name: staff_communication_frequency
      label: How often do you receive internal communication?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 4
      name: communication_effectiveness
      label: What is the effectiveness of internal communication?
      hint: null
      type: select_one
      options:
      - Highly effective
      - Somewhat effective
      - Not effective
      required: false
    - id: 5
      name: staff_suggestions
      label: What internal communication improvements would you suggest?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: feedback_channels
      label: Which communication channels do you prefer for sending feedback?
      hint: null
      type: select_multiple
      options:
      - Email
      - Instant messaging
      - In-person
      - Phone
      required: false
    - id: 7
      name: communication_preferences
      label: What is your preferred method for receiving internal communication?
      hint: null
      type: select_one
      options:
