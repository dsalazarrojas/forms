inputSchema:
  type: object
  properties:
    title: Employee Satisfaction Drivers Survey
    pages:
    - id: 1
      name: employee_satisfaction_drivers
      label: Employee Satisfaction Drivers
      hint: null
      type: select_multiple
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 2
      name: employee_satisfaction_drivers_survey_question_1
      label: How would you rate your overall satisfaction with your work
      hint: Please rate on a scale from 1 to 10
      type: number
      options: []
      required: false
    - id: 3
      name: employee_satisfaction_drivers_survey_question_2
      label: How do you rate your manager's support for personal development?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: employee_satisfaction_drivers_survey_question_3
      label: How would you rate your overall engagement with your work
      hint: null
      type: select_multiple
      options:
      - Highly engaged
      - Somewhat engaged
      - Not engaged
      - Not at all engaged
      required: false
    - id: 5
      name: email_address
      label: Email Address
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
