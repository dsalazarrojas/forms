inputSchema:
  type: object
  properties:
    title: DEI Training Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: training_effectiveness
      label: How effective was the training session?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: session_satisfaction
      label: On a scale of 1 to 5, how satisfied are you with this training session?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: feedback_comments
      label: Do you have any comments or suggestions?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: future_sessions
      label: Would you like to attend another session?
      hint: null
      type: select_multiple
      options:
      - Yes, I would like to attend another session.
      - No, I am not interested.
      required: false
    - id: 6
      name: contact_info
      label: Is this your contact information correct?
      hint: null
      type: select_multiple
      options:
      - 'False'
      - 'True'
      required: false
    - id: 7
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: job_title
      label: Job title
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
