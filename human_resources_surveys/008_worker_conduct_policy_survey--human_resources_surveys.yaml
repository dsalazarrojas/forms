      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: awareness
      label: Awareness
      hint: What is your level of awareness on the Worker Conduct Policy?
      type: select_multiple
      options:
      - Very High
