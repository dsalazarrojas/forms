inputSchema:
  type: object
  properties:
    title: Role Rotation Feedback Survey
    pages:
    - id: 1
      name: rotation_experience
      label: What was your overall experience with the rotation?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: rotation_value
      label: How valuable was the experience to you?
      hint: null
      type: select_multiple
      options:
      - Very Valuable
      - Somewhat Valuable
      - Not Very Valuable
      - Not Valuable
      required: false
    - id: 3
      name: role_satisfaction
      label: How satisfied are you with your role?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Very Satisfied
      - Not Satisfied
      required: false
    - id: 4
      name: rotation_recommend
      label: Would you recommend this rotation to others?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: rotation_improve
      label: How can we improve the rotation process?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: comments
      label: Any comments or suggestions?
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: rotation_date
      label: When did you start the rotation?
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: rotation_end_date
      label: When did the rotation end?
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: rotation_length
      label: How long was the rotation?
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: role_rotation_rating
      label: Overall rating of rotation experience
      hint: null
      type: number
      options: []
      required: false
