inputSchema:
  type: object
  properties:
    title: Diversity Survey
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: ethnicity
      label: Ethnicity
      hint: null
      type: select_one
      options:
      - Asian
      - Black or African American
      - Hispanic or Latino
      - White
      - Other
      required: false
    - id: 5
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Female
      - Male
      - Other (please specify)
      required: false
    - id: 6
      name: job_category
      label: Job Category
      hint: null
      type: select_one
      options:
      - Management
      - Non-Management
      required: false
    - id: 7
      name: years_of_service
      label: Years of Service
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: company_diversity_commitment
      label: Diversity Commitment
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
