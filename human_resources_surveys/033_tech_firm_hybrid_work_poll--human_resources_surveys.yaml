inputSchema:
  type: object
  properties:
    title: Tech Firm Hybrid Work Poll
    pages:
    - id: 1
      name: poll_preferences
      label: Poll Preferences
      hint: null
      type: select_multiple
      options:
      - Hybrid Model
      - Hybrid Model with remote days
      - Hybrid Model with flexible hours
      - Full Remote
      - Full Office
      - Other (please specify)
      required: false
    - id: 2
      name: poll_challenges
      label: Poll Challenges
      hint: null
      type: select_one
      options:
      - Time zone differences
      - Communication barriers
      - Lack of equipment or resources
      - Difficulty adapting to new technology
      - Other (please specify)
      required: false
    - id: 3
      name: poll_comments
