inputSchema:
  type: object
  properties:
    title: Employee Listening Effectiveness Survey
    pages:
    - id: 1
      name: company_name
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: manager_name
      label: Manager
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: communication_effectiveness
      label: How would you rate the effectiveness of your manager's communication
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: employee_engagement
      label: How engaged do you feel in your job
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: team_satisfaction
      label: Team satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      - Very satisfied
      - Not satisfied
      - Not very satisfied
      required: false
    - id: 6
      name: department_satisfaction
      label: Department satisfaction
      hint: null
      type: select_multiple
      options:
      - Satisfied
      - Dissatisfied
      - Very satisfied
      - Not satisfied
      - Not very satisfied
      required: false
    - id: 7
      name: communication_channels
      label: Which of the following channels do you currently use for communication?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - In-app messaging
      - Video conference call
      - In-person meeting
      - Other
      required: false
    - id: 8
      name: communication_frequency
      label: How often do you use these channels?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Annually
      - Never
      required: false
    - id: 9
      name: manager_openness
      label: How open is your manager in communication?
      hint: null
      type: select_one
      options:
      - Highly open
      - Somewhat open
      - Neutral
      - Somewhat closed
      - Highly closed
      required: false
    - id: 10
      name: employee_suggestions
      label: How often are employee suggestions taken into consideration?
      hint: null
      type: select_one
      options:
      - Always
      - Almost always
      - Sometimes
      - Rarely
      - Never
      required: false
    - id: 11
      name: communication_skills
      label: Which of the following communication skills do you find most effective?
      hint: null
      type: select_multiple
      options:
      - Active listening
      - Empathy
      - Nonverbal communication
      - Conflict resolution
      - Other
      required: false
    - id: 12
      name: manager_suggestion
      label: What would you suggest to improve communication?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: open_door
      label: Do you feel like you have a way to talk to your manager about your work
        and well-being?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: feedback_mechanism
      label: What do you think would be a good feedback mechanism for communication?
      hint: null
      type: select_multiple
      options:
      - Email
      - In-app messaging
      - One-on-one meeting
      - Team meeting
      - Other
      required: false
