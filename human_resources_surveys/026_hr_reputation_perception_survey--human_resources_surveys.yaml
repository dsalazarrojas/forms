inputSchema:
  type: object
  properties:
    title: HR Reputation Perception Survey
    pages:
    - id: 1
      name: introduction_page
      label: HR Reputation Perception Survey
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: question_1
      label: How would you rate HR's responsiveness to your queries?
      hint: null
      type: select_one
      options:
      - Excellent
      - Average
      - Fair
      - Poor
      required: false
    - id: 3
      name: question_2
      label: HR is approachable
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: question_3
      label: How likely are you to recommend HR to a colleague?
      hint: null
      type: select_one
      options:
      - Definitely
      - Somewhat likely
      - Not very likely
      - Not at all likely
      required: false
    - id: 5
      name: question_4
      label: What would you like to suggest that HR could improve?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: question_5
      label: Is there anything else you'd like to tell us?
      hint: null
      type: note
      options: []
      required: false
