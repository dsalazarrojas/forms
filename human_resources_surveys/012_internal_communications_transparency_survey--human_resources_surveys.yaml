      name: feedback_mechanisms
      label: Are there mechanisms in place to facilitate open feedback?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: feedback_channel
      label: Which of the following channels do you use to provide feedback?
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Online platform
      - In-person
      - Other
      required: false
    - id: 10
      name: preferred_feedback_channel
      label: What is your preferred channel for providing feedback?
      hint: null
