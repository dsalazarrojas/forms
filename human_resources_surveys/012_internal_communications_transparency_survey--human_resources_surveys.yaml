inputSchema:
  type: object
  properties:
    title: Internal Communications Transparency Survey
    pages:
    - id: 1
      name: employee_feedback
      label: Employee feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: communication_channels
      label: Communication channels
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: feedback_frequency
      label: How often do you receive internal communications?
      hint: null
      type: select_one
      options:
      - Every day
      - A few times a week
      - A few times a month
      - Less than once a month
      - Never
      required: false
    - id: 4
      name: communication_effectiveness
      label: How effective are internal communications?
      hint: null
      type: select_one
      options:
      - Very effective
      - Somewhat effective
      - Not very effective
      - Not at all effective
      required: false
    - id: 5
      name: trust_within_team
      label: How much trust do you have within your team?
      hint: null
      type: select_one
      options:
      - A lot of trust
      - Some trust
      - A little trust
      - No trust
      required: false
    - id: 6
      name: trust_within_organization
      label: How much trust do you have within your organization?
      hint: null
      type: select_one
      options:
      - A lot of trust
      - Some trust
      - A little trust
      - No trust
      required: false
    - id: 7
      name: open_communications
      label: How open are internal communications within your workplace?
      hint: null
      type: select_one
      options:
      - Very open
      - Somewhat open
      - Not very open
      - Not at all open
      required: false
