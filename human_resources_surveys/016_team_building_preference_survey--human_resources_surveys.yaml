inputSchema:
  type: object
  properties:
    title: Team Building Preference Survey
    pages:
    - id: 1
      name: employee_preferences
      label: Employee Preferences
      hint: null
      type: select_multiple
      options:
      - Often
      - Sometimes
      - Rarely
      required: true
    - id: 2
      name: available_time
      label: Available Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: employee_feedback
      label: Employee Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: feedback
      label: Feedback
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      required: true
    - id: 6
      name: team_activities
      label: Team Activities
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: team_leadership
      label: Team Leadership
      hint: null
      type: select_multiple
      options:
      - Approachable
      - Supportive
      - Experienced
      - Knowledgeable
      - Available
      required: true
    - id: 8
      name: preferred_leadership
      label: Preferred Leadership
      hint: null
      type: select_one
      options:
      - Approachable
      - Supportive
      - Experienced
      - Knowledgeable
      - Available
      required: true
    - id: 9
      name: team_activities_2
      label: Team Activities 2
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: team_leadership_2
      label: Team Leadership 2
      hint: null
      type: select_multiple
      options:
      - Supportive
      - Experienced
      - Knowledgeable
      - Available
      required: true
    - id: 11
      name: preferred_leadership_2
      label: Preferred Leadership 2
      hint: null
      type: select_multiple
      options:
      - Approachable
      - Supportive
      - Experienced
      - Knowledgeable
      - Available
      required: true
