inputSchema:
  type: object
  properties:
    title: Racism Survey
    pages:
    - id: 1
      name: survey_first_name
      label: What is your first name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: survey_last_name
      label: What is your last name?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: survey_race
      label: What race do you identify with?
      hint: null
      type: select_multiple
      options:
      - Asian
      - Black
      - White
      - Hispanic
      - Other
      required: true
    - id: 4
      name: survey_age
      label: What is your age?
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: survey_email
      label: Do you have an email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: survey_phone
      label: Do you have a phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: survey_racism_experienced
      label: Have you ever experienced racism?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: survey_racism_work
      label: Have you experienced racism at work?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: survey_racism_times
      label: How many times have you experienced racism?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: survey_racism_rating
      label: How would you rate your experience with racism?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Bad
      required: true
    - id: 11
      name: survey_racism_self_rating
      label: How do you rate your experience with racism?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Bad
      required: true
    - id: 12
      name: survey_racism_response
      label: What would you do if you experienced racism?
      hint: null
      type: note
      options: []
      required: false
