inputSchema:
  type: object
  properties:
    title: Orientation Completion Checklist
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Accounting
      - HR
      - IT
      - Marketing
      - Operations
      - Sales
      required: true
    - id: 5
      name: orientation_status
      label: Orientation Status
      hint: null
      type: select_one
      options:
      - New Hire
      - Orientation Complete
      - Not Complete
      required: true
    - id: 6
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: completion_status
      label: Completion Status
      hint: null
      type: select_one
      options:
      - Complete
      - Incomplete
      required: true
    - id: 8
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: true
