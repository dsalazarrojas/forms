      name: supervisor_phone
      label: Supervisor Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: supervisor_email
      label: Supervisor Email
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: employee_signature
      label: Employee Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: supervisor_signature
      label: Supervisor Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: date_submitted
      label: Date Submitted
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: true
