inputSchema:
  type: object
  properties:
    title: HR Communication Tone Survey
    pages:
    - id: 1
      name: employee_satisfaction
      label: Employee Satisfaction
      hint: null
      type: select_multiple
      options:
      - Very High
      - High
      - Medium
      - Low
      - Very Low
      required: false
    - id: 2
      name: tone_perceived
      label: Tone Perceived
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: suggested_areas
