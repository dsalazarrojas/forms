inputSchema:
  type: object
  properties:
    title: Car Club Registration Form
    pages:
    - id: 1
      name: section_personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: Preferred contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Mobile or landline
      type: text
      options: []
      required: false
    - id: 5
      name: address
      label: Postal address
      hint: Street address, city, state
      type: text
      options: []
      required: false
    - id: 6
      name: car_year
      label: Vehicle year
      hint: Four digit year of manufacture
      type: number
      options: []
      required: true
    - id: 7
      name: car_make
      label: Vehicle make
      hint: Example Toyota, Ford, BMW
      type: text
      options: []
      required: true
    - id: 8
      name: car_model
      label: Vehicle model
      hint: Example Corolla, F-150
      type: text
      options: []
      required: true
    - id: 9
      name: modifications
      label: Notable modifications
      hint: List major aftermarket changes
      type: text
      options: []
      required: false
    - id: 10
      name: membership_type
      label: Membership type
      hint: Choose applicable membership
      type: select_one
      options:
      - Regular
      - Family
      - Lifetime
      - Student
      required: true
    - id: 11
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Provide a contact in case of emergency
      type: text
      options: []
      required: false
