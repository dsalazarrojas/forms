inputSchema:
  type: object
  properties:
    title: Auto Credit Application Form
    pages:
    - id: 1
      name: applicant_info
      label: Applicant Information
      hint: Please provide your personal details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY
      type: date
      options: []
      required: true
    - id: 5
      name: ssn
      label: Social Security Number
      hint: XXX-XX-XXXX
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email Address
      hint: A valid email address
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 8
      name: address
      label: Street Address
      hint: Your current residence address
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: State of residence
      type: select_one
      options:
      - Alabama
      - Alaska
      - Arizona
      - Arkansas
      - California
      - Colorado
      - Connecticut
      - Delaware
      - Florida
      - Georgia
      - Other
      required: true
    - id: 11
      name: zip_code
      label: ZIP Code
      hint: 5-digit ZIP code
      type: text
      options: []
      required: true
    - id: 12
      name: residence_type
      label: Residence Type
      hint: Your current housing situation
      type: select_one
      options:
      - Own
      - Rent
      - Live with family
      - Other
      required: true
    - id: 13
      name: monthly_payment
      label: Monthly Housing Payment
      hint: Monthly rent or mortgage amount
      type: number
      options: []
      required: true
    - id: 14
      name: employment_info
      label: Employment Information
      hint: Tell us about your employment
      type: note
      options: []
      required: false
    - id: 15
      name: employer_name
      label: Employer Name
      hint: Current employer
      type: text
      options: []
      required: true
    - id: 16
      name: job_title
      label: Job Title
      hint: Your current position
      type: text
      options: []
      required: true
    - id: 17
      name: employment_length
      label: Length of Employment
      hint: How long have you worked there
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 18
      name: annual_income
      label: Annual Income
      hint: Gross annual income before taxes
      type: number
      options: []
      required: true
    - id: 19
      name: vehicle_info
      label: Vehicle Information
      hint: Details about the vehicle you want to purchase
      type: note
      options: []
      required: false
    - id: 20
      name: vehicle_year
      label: Vehicle Year
      hint: Year of the vehicle
      type: number
      options: []
      required: true
    - id: 21
      name: vehicle_make
      label: Vehicle Make
      hint: Manufacturer of the vehicle
      type: text
      options: []
      required: true
    - id: 22
      name: vehicle_model
      label: Vehicle Model
      hint: Model of the vehicle
      type: text
      options: []
      required: true
    - id: 23
      name: vehicle_price
      label: Vehicle Price
      hint: Purchase price of the vehicle
      type: number
      options: []
      required: true
    - id: 24
      name: down_payment
      label: Down Payment Amount
      hint: Amount you plan to put down
      type: number
      options: []
      required: true
    - id: 25
      name: trade_in
      label: Do You Have a Trade-In
      hint: Are you trading in a vehicle
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 26
      name: credit_references
      label: Credit References
      hint: Provide a personal reference
      type: text
      options: []
      required: false
    - id: 27
      name: authorization
      label: Authorization Agreement
      hint: I authorize the verification of information provided
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
