inputSchema:
  type: object
  properties:
    title: Credit Card Update Form
    pages:
    - id: 1
      name: card_number
      label: Card Number
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name_on_card
      label: Name On Card
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: expiry_date
      label: Expiry Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: cvv
      label: CVV
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: card_type
      label: Card Type
      hint: null
      type: select_one
      options:
      - Visa
      - Mastercard
      - Amex
      - Discover
      - Diners
      - JCB
      - Other
      required: false
    - id: 6
      name: billing_address
      label: Billing Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: update_reason
      label: Update Reason
      hint: Please provide the reason for the update
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: submit
      label: Submit
      hint: Click to submit
      type: text
      options: []
      required: false
