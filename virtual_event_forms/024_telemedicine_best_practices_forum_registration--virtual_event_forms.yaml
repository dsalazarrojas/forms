inputSchema:
  type: object
  properties:
    title: Telemedicine Best Practices Forum Registration
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: topic_interests
      label: Topic Interests
      hint: null
      type: select_multiple
      options:
      - Cardiovascular
      - Neurology
      - Palliative Care
      - Psychiatry
      - Surgery
      required: false
    - id: 6
      name: consent
      label: Consent
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: agreement
      label: Agreement
      hint: You must agree to our terms of service and policies.
      type: select_one
      options:
      - I have read and agree to the terms and conditions.
      - I have not read and do not agree to the terms and conditions.
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
