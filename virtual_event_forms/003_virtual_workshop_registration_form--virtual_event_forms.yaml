inputSchema:
  type: object
  properties:
    title: Virtual Workshop Registration Form
    pages:
    - id: 1
      name: workshop_name
      label: Workshop Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: participant_phone_number
      label: Participant Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: workshop_participants
      label: How many participants do you plan to attend?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: participant_details
      label: Participant Details
      hint: null
      type: note
      options: []
      required: false
