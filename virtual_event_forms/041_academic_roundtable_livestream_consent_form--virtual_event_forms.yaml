inputSchema:
  type: object
  properties:
    title: Academic Roundtable Livestream Consent Form
    pages:
    - id: 1
      name: livestream_consent_intro
      label: Academic Roundtable Livestream Consent
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Full name of the person giving consent
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email Address
      hint: Contact email for the participant
      type: email
      options: []
      required: true
    - id: 4
      name: participant_institution
      label: Institution
      hint: University or organization affiliation
      type: text
      options: []
      required: true
    - id: 5
      name: roundtable_title
      label: Roundtable Title
      hint: Title of the academic roundtable event
      type: text
      options: []
      required: true
    - id: 6
      name: roundtable_date
      label: Roundtable Date
      hint: Date when the roundtable will take place
      type: date
      options: []
      required: true
    - id: 7
      name: roundtable_time
      label: Roundtable Time
      hint: Start and end time of the roundtable
      type: text
      options: []
      required: true
    - id: 8
      name: consent_to_participation
      label: Consent to Participation
      hint: Do you consent to participate in the academic roundtable livestream?
      type: select_one
      options: ["Yes, I consent", "Yes, with conditions", "No, I do not consent"]
      required: true
    - id: 9
      name: consent_to_video_recording
      label: Consent to Video Recording
      hint: Do you consent to being video recorded during the roundtable?
      type: select_one
      options: ["Yes, I consent", "Yes, with restrictions", "No, I do not consent"]
      required: true
    - id: 10
      name: consent_to_audio_recording
      label: Consent to Audio Recording
      hint: Do you consent to having your voice recorded during the roundtable?
      type: select_one
      options: ["Yes, I consent", "Yes, with restrictions", "No, I do not consent"]
      required: true
    - id: 11
      name: consent_to_livestreaming
      label: Consent to Livestreaming
      hint: Do you consent to your participation being livestreamed to remote audiences?
      type: select_one
      options: ["Yes, I consent", "Yes, with restrictions", "No, I do not consent"]
      required: true
    - id: 12
      name: consent_to_distribution
      label: Consent to Distribution
      hint: Do you consent to recordings being distributed after the event?
      type: select_one
      options: ["Yes, for educational purposes", "Yes, with restrictions", "No, only for event participants", "No, I do not consent"]
      required: true
    - id: 13
      name: consent_to_publication
      label: Consent to Publication
      hint: Do you consent to your participation being published online?
      type: select_one
      options: ["Yes, I consent", "Yes, with editorial review", "No, not for publication", "Conditional on anonymity"]
      required: true
    - id: 14
      name: recording_purpose
      label: Purpose of Recording
      hint: What is the intended purpose of the recording?
      type: text
      options: []
      required: true
    - id: 15
      name: access_restriction_preferences
      label: Access Restriction Preferences
      hint: How should access to recordings be restricted?
      type: select_one
      options: ["Open to public", "Restricted to institution", "Limited to course participants", "Private to session attendees", "Other restrictions"]
      required: true
    - id: 16
      name: special_requests_conditions
      label: Special Requests or Conditions
      hint: Do you have any special requests or conditions for your participation?
      type: text
      options: []
      required: false
    - id: 17
      name: withdrawal_rights_acknowledged
      label: Withdrawal Rights Acknowledged
      hint: Do you understand you can withdraw consent at any time?
      type: select_one
      options: ["Yes, I understand", "No, need clarification"]
      required: true
