inputSchema:
  type: object
  properties:
    title: Town Hall Attendance Check Form
    pages:
    - id: 1
      name: introduction
      label: Are you sure to attend
      hint: Please let us know if you are able to attend.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 2
      name: name
      label: Name
      hint: Please provide your name.
      type: text
      options: []
      required: true
    - id: 3
      name: contact
      label: Contact Information
      hint: Please provide your email address or phone number.
      type: text
      options: []
      required: true
    - id: 4
      name: availability
      label: What date are you available to attend?
      hint: Please choose a date you are available to attend.
      type: date
      options: []
      required: true
    - id: 5
      name: time_preference
      label: What time of day would you prefer to attend?
      hint: Please choose a time of day you prefer to attend.
      type: time
      options: []
      required: true
    - id: 6
      name: special_requests
      label: Special Requests
      hint: Do you have any special requests or requirements?
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 7
      name: commitment_level
      label: Commitment Level
      hint: On a scale of 1-10, how committed are you to attending the event?
      type: number
      options: []
      required: true
    - id: 8
      name: additional_details
      label: Additional Details
      hint: Do you have any other comments or information you'd like to share about
        your attendance?
      type: text
      options: []
      required: false
    - id: 9
      name: confirmation
      label: Are you sure this is correct information?
      hint: Please double-check your information.
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
