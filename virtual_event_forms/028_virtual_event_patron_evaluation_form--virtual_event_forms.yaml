inputSchema:
  type: object
  properties:
    title: Virtual Event Patron Evaluation Form
    pages:
    - id: 1
      name: event_date
      label: event_date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: event_time
      label: event_time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: questions_list
      label: questions
      hint: Enter any questions or comments about this event
      type: text
      options: []
      required: false
    - id: 5
      name: rating_comment
      label: rating_comment
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: overall_satisfaction
      label: overall_satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: true
    - id: 7
      name: recommend_program
      label: recommend_program
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
