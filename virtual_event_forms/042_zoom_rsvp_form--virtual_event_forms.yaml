inputSchema:
  type: object
  properties:
    title: Zoom RSVP Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: time_zone
      label: Time Zone
      hint: null
      type: select_one
      options:
      - Pacific Time Zone
      - Central Time Zone
      - Eastern Time Zone
      required: true
