      - Shortness of Breath
      - Loss of Taste or Smell
      - Muscle Pains
      - Nausea
      - Diarrhea
      - Sore Throat
      - Runny Nose or Congestion
      - Dizziness
      - Loss of Appetite
      - Body Aches
      required: true
