      name: customer_agreement
      label: Customer Agreement
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_agreement
      label: Acknowledge that you understand the risk of COVID-19
      hint: null
      type: select_multiple
      options:
      - I acknowledge that I am aware of the risks associated with COVID-19
      - I am willing to acknowledge that I am aware of the risk of COVID-19
      - I understand that COVID-19 is contagious
      required: true
