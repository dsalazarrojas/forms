inputSchema:
  type: object
  properties:
    title: Bariatric Surgery Discharge Form
    pages:
    - id: 1
      name: patient_id_header
      label: -- Patient Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: discharge_date
      label: Discharge Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: surgical_details_header
      label: -- Surgical Summary --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: procedure_type
      label: Procedure Performed
      hint: null
      type: select_one
      options:
      - Gastric Bypass (Roux-en-Y)
      - Vertical Sleeve Gastrectomy
      - Gastric Banding
      - Biliopancreatic Diversion (BPD/DS)
      - Revision Surgery
      required: true
    - id: 7
      name: surgeon_name
      label: Attending Surgeon
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: post_op_diet_header
      label: -- Post-Operative Dietary Instructions --
      hint: Immediate dietary restrictions
      type: note
      options: []
      required: false
    - id: 9
      name: current_diet_stage
      label: Current Dietary Stage
      hint: null
      type: select_one
      options:
      - Stage 1 - Clear Liquids Only
      - Stage 2 - Full Liquids (Protein Shakes)
      - Stage 3 - Pureed Foods
      - Stage 4 - Soft Foods
      required: true
    - id: 10
      name: hydration_goal
      label: Minimum Daily Hydration Goal (Ounces)
      hint: Sip slowly throughout the day
      type: number
      options: []
      required: true
    - id: 11
      name: protein_goal
      label: Minimum Daily Protein Goal (Grams)
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: medication_header
      label: -- Medications and Pain Management --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: pain_medication_plan
      label: Prescribed Pain Management
      hint: e.g., Liquid Tylenol, specialized prescriptions
      type: text
      options: []
      required: true
    - id: 14
      name: vitamin_regimen
      label: Vitamin and Mineral Supplementation
      hint: Specify types and frequency
      type: text
      options: []
      required: true
    - id: 15
      name: warning_signs_header
      label: -- Warning Signs - Contact Your Surgeon Immediately --
      hint: Check to acknowledge you understand these risks
      type: select_multiple
      options:
      - Fever over 101.5 F
      - Severe abdominal pain or swelling
      - Persistent nausea or vomiting
      - Redness, warmth, or drainage at incision sites
      - Shortness of breath or chest pain
      - Calf pain or swelling
      required: true
    - id: 16
      name: follow_up_header
      label: -- Follow-up Appointments --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: first_follow_up
      label: First Post-Op Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 18
      name: first_follow_up_time
      label: First Post-Op Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 19
      name: discharge_nurse_name
      label: Discharge Nurse Name
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: patient_acknowledgment
      label: Patient Acknowledgment of Instructions
      hint: I have received and understand my discharge instructions and medications
      type: select_one
      options:
      - I Agree and Understand
      - Other
      required: true
