inputSchema:
  type: object
  properties:
    title: Progress Monitoring Form
    pages:
    - id: 1
      name: project_info
      label: Project info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_description
      label: Project description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: current_status
      label: Current status
      hint: null
      type: select_one
      options:
      - Not started
      - In progress
      - Done
      required: false
    - id: 4
      name: progress_percent
      label: Progress percent
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: due_date
      label: Due date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: last_update
      label: Last update
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_to
      label: Assigned to
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      - Jim Johnson
      required: false
    - id: 11
      name: project_start_date
      label: Project start date
      hint: null
      type: date
      options: []
      required: false
