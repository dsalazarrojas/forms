      name: medical_history
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: medical_attention
      label: Medical Attention
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: date_reported
      label: Date Reported
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: reported_by
      label: Reported By
      hint: null
      type: text
      options: []
      required: false
