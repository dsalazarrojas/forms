      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: returned_to_work_status
      label: Returned To Work Status
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 14
      name: sickness_severity
      label: Sickness Severity
      hint: null
      type: select_multiple
      options:
      - Mild
      - Moderate
      - Severe
      required: false
