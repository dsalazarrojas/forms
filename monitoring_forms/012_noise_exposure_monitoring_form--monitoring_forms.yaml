inputSchema:
  type: object
  properties:
    title: Noise Exposure Monitoring Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_exposure
      label: Date of Exposure
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: noise_exposure_level
      label: Noise Exposure Level
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: noise_duration
      label: Noise Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: noise_frequency
      label: Noise Frequency
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: observer_name
      label: Observer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: observer_organization
      label: Observer Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: observation_point
      label: Observation Point
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: noise_levels
      label: Noise Levels
      hint: Noise levels in decibels (LPA, LEP, LET)
      type: select_multiple
      options:
      - High
      - Low
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
