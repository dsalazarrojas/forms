inputSchema:
  type: object
  properties:
    title: Psychotropic Medication Monitoring Form
    pages:
    - id: 1
      name: medication_name
      label: Medication Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: medication_dose
      label: Medication Dose
      hint: Please enter the dosage information for the medication.
      type: text
      options: []
      required: true
    - id: 3
      name: administration_frequency
      label: Administration Frequency
      hint: null
      type: select_one
      options:
      - DAILY
      - WEEKLY
      - MONTHLY
      required: true
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: stop_date
      label: Stop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: reason_for_stopping
      label: Reason for Stopping
      hint: Provide a reason for stopping the medication.
      type: text
      options: []
      required: false
    - id: 7
      name: monitoring_status
      label: Monitoring Status
      hint: null
      type: select_one
      options:
      - ACTIVE
      - INACTIVE
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
