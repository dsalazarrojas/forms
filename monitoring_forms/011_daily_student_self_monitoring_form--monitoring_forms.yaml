inputSchema:
  type: object
  properties:
    title: Daily Student Self Monitoring Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: subject
      label: Subject
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: progress
      label: Progress
      hint: null
      type: select_multiple
      options:
      - on track
      - off track
      - unknown
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: true
