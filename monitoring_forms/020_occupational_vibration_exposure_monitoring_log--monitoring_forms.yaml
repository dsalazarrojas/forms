inputSchema:
  type: object
  properties:
    title: Occupational Vibration Exposure Monitoring Log
    pages:
    - id: 1
      name: job_details
      label: Job Details
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: job_number
      label: Job Number
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: job_start_date
      label: Job Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: job_end_date
      label: Job End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: job_duration
      label: Job Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: vibration_level
      label: Vibration Level
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 8
      name: monitoring_location
      label: Monitoring Location
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: monitoring_frequency
      label: Monitoring Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Biannually
      - Annually
      required: false
    - id: 10
      name: job_site_id
      label: Job Site ID
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: job_notes
      label: Job Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: employee_notes
      label: Employee Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: safety_officer_comments
      label: Safety Officer Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: internal_review_notes
      label: Internal Review Notes
      hint: null
      type: text
      options: []
      required: false
