inputSchema:
  type: object
  properties:
    title: Weekly Clinic Activity Report Form
    pages:
    - id: 1
      name: clinic_activity
      label: Clinic Activity
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: week_start_date
      label: Week Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: staff_present
      label: Staff Present
      hint: null
      type: select_multiple
      options:
      - Manager
      - Doctor
      - Nurse
      required: true
    - id: 4
      name: patients_seen
      label: Patients Seen
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: consultations_conducted
      label: Consultations Conducted
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: clinic_start_time
      label: Clinic Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: clinic_end_time
      label: Clinic End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email_for_manager
      label: Email for Manager
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: staff_comments
      label: Staff Comments
      hint: null
      type: text
      options: []
      required: false
