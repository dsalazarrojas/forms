inputSchema:
  type: object
  properties:
    title: At Home Health Monitoring Log
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: patient_id
      label: Patient ID Number
      hint: Medical record number
      type: text
      options: []
      required: true
    - id: 3
      name: monitoring_date
      label: Date of Monitoring
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 4
      name: monitoring_time
      label: Time of Monitoring
      hint: What time measurement taken?
      type: time
      options: []
      required: true
    - id: 5
      name: healthcare_provider
      label: Healthcare Provider Name
      hint: Doctor or clinic name
      type: text
      options: []
      required: true
    - id: 6
      name: monitoring_conditions
      label: Health Conditions Being Monitored
      hint: What conditions are tracked?
      type: select_multiple
      options:
      - Hypertension (High Blood Pressure)
      - Diabetes
      - Heart Disease
      - Respiratory Condition
      - Chronic Pain
      - Mental Health
      - Recovery from Surgery
      - Other
      required: true
    - id: 7
      name: blood_pressure_systolic
      label: Blood Pressure - Systolic (upper number)
      hint: Systolic reading
      type: number
      options: []
      required: false
    - id: 8
      name: blood_pressure_diastolic
      label: Blood Pressure - Diastolic (lower number)
      hint: Diastolic reading
      type: number
      options: []
      required: false
    - id: 9
      name: heart_rate
      label: Heart Rate (beats per minute)
      hint: Pulse reading
      type: number
      options: []
      required: false
    - id: 10
      name: blood_glucose
      label: Blood Glucose Level (mg/dL)
      hint: For diabetes monitoring
      type: number
      options: []
      required: false
    - id: 11
      name: blood_glucose_timing
      label: Blood Glucose Reading Timing
      hint: When taken in relation to meals?
      type: select_one
      options:
      - Fasting
      - Before Meal
      - After Meal
      - Bedtime
      - Random
      required: false
    - id: 12
      name: temperature
      label: Body Temperature (Fahrenheit)
      hint: Temperature reading
      type: number
      options: []
      required: false
    - id: 13
      name: weight
      label: Weight (pounds)
      hint: Current weight
      type: number
      options: []
      required: false
    - id: 14
      name: oxygen_saturation
      label: Oxygen Saturation (SpO2 percentage)
      hint: Oxygen level reading
      type: number
      options: []
      required: false
    - id: 15
      name: pain_level
      label: Pain Level (0-10 scale)
      hint: Rate pain if applicable
      type: number
      options: []
      required: false
    - id: 16
      name: symptoms
      label: Current Symptoms
      hint: Any symptoms present?
      type: text
      options: []
      required: false
    - id: 17
      name: medication_taken
      label: Medications Taken Today
      hint: List medications and times
      type: text
      options: []
      required: false
    - id: 18
      name: medication_adherence
      label: Medication Adherence
      hint: Did you take all prescribed medications?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Partial
      required: true
    - id: 19
      name: diet_intake
      label: Diet and Nutrition
      hint: Note on daily food intake
      type: text
      options: []
      required: false
    - id: 20
      name: water_intake
      label: Water Intake (cups)
      hint: Glasses of water consumed
      type: number
      options: []
      required: false
    - id: 21
      name: physical_activity
      label: Physical Activity
      hint: Exercise or activity level today
      type: text
      options: []
      required: false
    - id: 22
      name: sleep_quality
      label: Sleep Quality Last Night
      hint: How well did you sleep?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 23
      name: sleep_hours
      label: Hours of Sleep
      hint: How many hours slept?
      type: number
      options: []
      required: false
    - id: 24
      name: mood_level
      label: Mood and Emotional Well-being
      hint: How are you feeling emotionally?
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Worried
      - Depressed
      required: true
    - id: 25
      name: additional_notes
      label: Additional Notes or Observations
      hint: Any other relevant information
      type: text
      options: []
      required: false
