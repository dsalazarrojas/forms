inputSchema:
  type: object
  properties:
    title: Fit For Work Assessment Form
    pages:
    - id: 1
      name: initial_assessment
      label: How are you feeling today?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: medical_report
      label: Please describe your medical condition
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: readiness
      label: Do you feel ready to return to work?
      hint: null
      type: radio
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: recommendations
      label: What are your recommendations?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: next_steps
      label: What are your next steps?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 6
      name: contact_information
      label: Please provide your contact information
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: date_of_return
      label: When do you plan to return to work?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: time_of_return
      label: At what time do you plan to return to work?
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: additional_information
      label: Is there anything else you would like to add?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: support
      label: Do you need any support?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 11
      name: frequency_of_work
      label: How frequently do you plan to work?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 12
      name: availability
      label: What are your availability?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 13
      name: time_of_day
      label: At what time do you prefer to work?
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: duration
      label: How long do you plan to work?
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: additional_comments
      label: Is there anything else you'd like to add?
      hint: null
      type: note
      options: []
      required: false
