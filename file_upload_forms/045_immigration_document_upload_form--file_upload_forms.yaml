inputSchema:
  type: object
  properties:
    title: Immigration Document Upload Form
    pages:
    - id: 1
      name: document_upload_page
      label: Document Upload
      hint: null
      type: select_multiple
      options:
      - Passport
      - Visa
      - ID
      - Other
      required: false
    - id: 2
      name: applicant_info_page
      label: Applicant Information
      hint: null
      type: select_one
      options:
      - Individual
      - Organization
      required: false
    - id: 3
      name: document_info_page
      label: Document Info
      hint: Please provide document details in the field below.
      type: text
      options: []
      required: false
    - id: 4
      name: file_upload_page
      label: File Upload
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: upload_document_page
      label: Upload Document
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: confirm_upload_page
      label: Confirm Upload
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: confirm_upload_confirmation_page
      label: Confirm Upload Confirmation
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: upload_complete_page
      label: Upload Complete
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: document_type
      label: Type
      hint: Select document type.
      type: select_one
      options:
      - Passport
      - Visa
      - ID
      - Other
      required: false
    - id: 10
      name: upload_status
      label: Upload Status
      hint: null
      type: select_one
      options:
      - Pending
      - Uploaded
      required: false
    - id: 11
      name: reason_for_uploading
      label: Reason for Upload
      hint: Please describe the reason for upload.
      type: text
      options: []
      required: false
    - id: 12
      name: upload_by
      label: Upload By
      hint: Please enter your name.
      type: text
      options: []
      required: false
    - id: 13
      name: upload_date
      label: Upload Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: upload_time
      label: Upload Time
      hint: null
      type: time
      options: []
      required: false
    - id: 15
      name: upload_user
      label: Upload User
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: upload_note
      label: Upload Note
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: document_status
      label: Document Status
      hint: Select document status.
      type: select_one
      options:
      - New
      - Updated
      - Deleted
      required: false
    - id: 18
      name: document_type_id
      label: Document Type ID
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 19
      name: uploaded_by
      label: Uploaded By
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: uploaded_date
      label: Uploaded Date
      hint: null
      type: date
      options: []
      required: false
    - id: 21
      name: uploaded_time
      label: Uploaded Time
      hint: null
      type: time
      options: []
      required: false
    - id: 22
      name: uploaded_user
      label: Uploaded User
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: uploaded_note
      label: Uploaded Note
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: document_name
      label: Document Name
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: document_path
      label: Document Path
      hint: null
      type: select_multiple
      options:
      - Root Dir
      - Parent Dir
      required: false
