inputSchema:
  type: object
  properties:
    title: dropbox photovideo upload form
    pages:
    - id: 1
      name: title
      label: Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: file_upload
      label: File Upload
      hint: null
      type: select_one
      options:
      - Image
      - Video
      required: false
    - id: 4
      name: upload_file
      label: Upload File
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: confirm_upload
