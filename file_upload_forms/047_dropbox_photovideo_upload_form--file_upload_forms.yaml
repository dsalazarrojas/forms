      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: file_uploaded
      label: File Uploaded
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: file_failed
      label: File Failed
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: error_message
      label: Error Message
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: upload_again
      label: Upload Again
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: confirm_delete
      label: Confirm Delete
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
