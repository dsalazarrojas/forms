inputSchema:
  type: object
  properties:
    title: Electronic File Submission Form
    pages:
    - id: 1
      name: file_name
      label: File Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: file_description
      label: File Description
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: file_attachment
      label: Is it Attached?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: attachment_type
      label: Attachment Type
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: file_size
      label: File Size
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: file_tags
      label: File Tags
      hint: null
      type: text
      options: []
      required: false
