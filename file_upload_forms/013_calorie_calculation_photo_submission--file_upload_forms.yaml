inputSchema:
  type: object
  properties:
    title: Calorie Calculation Photo Submission
    pages:
    - id: 1
      name: user_info_header
      label: -- Meal Photo Submission --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: user_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: current_date
      label: Today - Date of Entry
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: meal_type
      label: Which meal are you submitting?
      hint: null
      type: select_one
      options:
      - Breakfast
      - Lunch
      - Dinner
      - Snack
      - Post-Workout
      required: true
    - id: 5
      name: meal_time
      label: Time Consumed
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: food_description
      label: Description of Food Items
      hint: List all components (e.g., 2 eggs, 1 slice toast, butter)
      type: text
      options: []
      required: true
    - id: 7
      name: beverages_consumed
      label: Beverages Consumed
      hint: Include sodas, juices, coffee (with cream/sugar)
      type: text
      options: []
      required: false
    - id: 8
      name: photo_placeholder
      label: -- Photo Submission Instructions --
      hint: Please ensure the photo is clear and taken from a top-down angle for portion
        estimation.
      type: note
      options: []
      required: false
    - id: 9
      name: photo_link_or_ref
      label: Image File Name or Reference
      hint: If uploading separately, provide the filename here
      type: text
      options: []
      required: true
    - id: 10
      name: portion_size_subjective
      label: Perceived Portion Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - Extra Large
      required: true
    - id: 11
      name: hunger_rating_pre
      label: Hunger Level Before Meal
      hint: 1 (Not hungry) to 5 (Starving)
      type: number
      options: []
      required: true
    - id: 12
      name: fullness_rating_post
      label: Fullness Level After Meal
      hint: 1 (Still hungry) to 5 (Overstuffed)
      type: number
      options: []
      required: true
    - id: 13
      name: locations_of_consumption
      label: Where did you eat this meal?
      hint: e.g., Home, Restaurant, Desk at work
      type: text
      options: []
      required: false
    - id: 14
      name: additional_meal_context
      label: Additional Context
      hint: e.g., Eating while distracted, social dining
      type: text
      options: []
      required: false
