inputSchema:
  type: object
  properties:
    title: Bid Submission And Team Choice Form
    pages:
    - id: 1
      name: section_header_submitter
      label: -- Submitter Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: submitter_name
      label: Submitter Name
      hint: Person submitting the bid
      type: text
      options: []
      required: true
    - id: 3
      name: organization_name
      label: Organization or Company Name
      hint: Entity submitting the bid
      type: text
      options: []
      required: true
    - id: 4
      name: submitter_email
      label: Email Address
      hint: For submission confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: submitter_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_opportunity
      label: -- Bid Opportunity Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: bid_title
      label: Bid or Project Title
      hint: Name of the opportunity
      type: text
      options: []
      required: true
    - id: 8
      name: bid_id
      label: Bid ID or Reference Number
      hint: RFP or tender number
      type: text
      options: []
      required: true
    - id: 9
      name: bid_amount
      label: Bid Amount
      hint: Total value of your bid
      type: number
      options: []
      required: true
    - id: 10
      name: currency
      label: Currency
      hint: null
      type: select_one
      options:
      - USD
      - CAD
      - EUR
      - GBP
      - Other
      required: true
    - id: 11
      name: submission_date
      label: Submission Date
      hint: When are you submitting?
      type: date
      options: []
      required: true
    - id: 12
      name: section_header_proposal
      label: -- Proposal and Documentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: executive_summary
      label: Executive Summary
      hint: Brief overview of your proposal
      type: text
      options: []
      required: true
    - id: 14
      name: proposed_solution
      label: Proposed Solution or Approach
      hint: Describe your solution
      type: text
      options: []
      required: true
    - id: 15
      name: value_proposition
      label: Key Value Proposition
      hint: Why should they choose you?
      type: text
      options: []
      required: true
    - id: 16
      name: timeline
      label: Proposed Timeline or Delivery Schedule
      hint: When will work be completed?
      type: text
      options: []
      required: true
    - id: 17
      name: section_header_team
      label: -- Team Composition --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: team_members
      label: Number of Team Members
      hint: How many people on your team?
      type: number
      options: []
      required: true
    - id: 19
      name: team_lead_name
      label: Team Lead or Project Manager Name
      hint: Primary point of contact
      type: text
      options: []
      required: true
    - id: 20
      name: team_lead_experience
      label: Team Lead Experience
      hint: Years of relevant experience
      type: number
      options: []
      required: false
    - id: 21
      name: key_resources
      label: Key Team Resources or Roles
      hint: List primary team members
      type: text
      options: []
      required: true
    - id: 22
      name: team_expertise
      label: Team's Key Expertise Areas
      hint: What are your strengths?
      type: text
      options: []
      required: true
    - id: 23
      name: section_header_files
      label: -- Document Uploads --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: proposal_document
      label: Detailed Proposal Document
      hint: Upload your full proposal
      type: text
      options: []
      required: true
    - id: 25
      name: pricing_schedule
      label: Pricing or Cost Schedule
      hint: Detailed cost breakdown
      type: text
      options: []
      required: true
    - id: 26
      name: supporting_documents
      label: Supporting Documents
      hint: References, case studies, etc.
      type: text
      options: []
      required: false
    - id: 27
      name: certifications_qualifications
      label: Certifications and Qualifications
      hint: Proof of credentials
      type: text
      options: []
      required: false
    - id: 28
      name: references
      label: Client References
      hint: Previous project references
      type: text
      options: []
      required: false
    - id: 29
      name: section_header_compliance
      label: -- Compliance and Acceptance --
      hint: null
      type: note
      options: []
      required: false
    - id: 30
      name: terms_acceptance
      label: I Accept the Tender/RFP Terms
      hint: null
      type: select_one
      options:
      - I accept all terms
      - I accept with exceptions
      - I do not accept
      required: true
    - id: 31
      name: insurance_coverage
      label: Required Insurance Coverage Confirmation
      hint: Do you have required insurance?
      type: select_one
      options:
      - Yes, fully compliant
      - Yes, with conditions
      - No, need to arrange
      - Not applicable
      required: true
    - id: 32
      name: license_confirmation
      label: Confirm All Required Licenses and Permits
      hint: Do you meet all requirements?
      type: select_one
      options:
      - Yes, all requirements met
      - Yes, pending approval
      - No, some missing
      - Not applicable
      required: true
    - id: 33
      name: additional_information
      label: Additional Information
      hint: Any other relevant details?
      type: text
      options: []
      required: false
