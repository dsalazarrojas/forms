inputSchema:
  type: object
  properties:
    title: Artist Video Submission Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Artist Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: artist_name
      label: Artist or Performer Name
      hint: Your professional name
      type: text
      options: []
      required: true
    - id: 3
      name: artist_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: artist_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: artist_website
      label: Website or Portfolio URL
      hint: Link to your work
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_2
      label: -- Artist Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: primary_genre
      label: Primary Genre or Style
      hint: Main artistic discipline
      type: text
      options: []
      required: true
    - id: 8
      name: artist_bio
      label: Artist Biography
      hint: Professional bio (100-150 words)
      type: text
      options: []
      required: true
    - id: 9
      name: years_active
      label: Years of Experience
      hint: How long have you been performing?
      type: number
      options: []
      required: false
    - id: 10
      name: social_media
      label: Social Media or Streaming Links
      hint: Instagram, YouTube, Spotify, etc.
      type: text
      options: []
      required: false
    - id: 11
      name: section_header_3
      label: -- Video Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: video_title
      label: Video Title
      hint: Name or title of your video
      type: text
      options: []
      required: true
    - id: 13
      name: video_description
      label: Video Description
      hint: What is this video about?
      type: text
      options: []
      required: true
    - id: 14
      name: video_type
      label: Type of Video
      hint: What kind of content?
      type: select_one
      options:
      - Music Performance
      - Music Video
      - Demo Reel
      - Cover Song
      - Original Composition
      - Live Recording
      - Dance or Choreography
      - Spoken Word
      - Other Performance
      - Educational Content
      required: true
    - id: 15
      name: video_duration
      label: Video Duration
      hint: Length in minutes
      type: number
      options: []
      required: true
    - id: 16
      name: section_header_4
      label: -- Video Upload --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: video_file_upload
      label: Upload Your Video File
      hint: MP4, MOV, AVI, or other video format
      type: text
      options: []
      required: true
    - id: 18
      name: youtube_link
      label: Or Provide YouTube Link
      hint: Link to video on YouTube
      type: text
      options: []
      required: false
    - id: 19
      name: vimeo_link
      label: Or Provide Vimeo Link
      hint: Link to video on Vimeo
      type: text
      options: []
      required: false
    - id: 20
      name: section_header_5
      label: -- Video Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: filming_date
      label: Date Video Was Filmed
      hint: When was this recorded?
      type: date
      options: []
      required: false
    - id: 22
      name: video_quality
      label: Video Quality
      hint: Resolution and quality of the video
      type: select_one
      options:
      - HD (1080p or higher)
      - HD (720p)
      - Standard (480p)
      - Lower Quality
      required: false
    - id: 23
      name: section_header_6
      label: -- Rights and Submission --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: copyright_confirmation
      label: I Confirm I Hold Copyright to This Video
      hint: You own the rights to this content
      type: select_one
      options:
      - Yes, I own the rights
      - No, I do not own the rights
      - Licensed rights holder
      required: true
    - id: 25
      name: submission_agreement
      label: I Agree to the Video Submission Terms
      hint: Accept submission guidelines and terms
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
