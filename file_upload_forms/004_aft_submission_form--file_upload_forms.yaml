inputSchema:
  type: object
  properties:
    title: AFT Submission Form
    pages:
    - id: 1
      name: intake_header
      label: -- Submission Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Contact person for this request
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Requester email
      hint: For confirmation and follow up
      type: email
      options: []
      required: true
    - id: 4
      name: request_type
      label: Request type
      hint: Choose the nature of the AFT request
      type: select_one
      options: [New submission,Update to existing,Inquiry]
      required: true
    - id: 5
      name: description
      label: Brief description of submission
      hint: Provide context and purpose
      type: text
      options: []
      required: true
    - id: 6
      name: supporting_documents
      label: Supporting documents
      hint: Upload any files required for review
      type: note
      options: []
      required: false
    - id: 7
      name: desired_completion_date
      label: Desired completion date
      hint: If applicable provide target date
      type: date
      options: []
      required: false
    - id: 8
      name: priority_level
      label: Priority level
      hint: How urgent is this request
      type: select_one
      options: [Low,Medium,High,Critical]
      required: true
    - id: 9
      name: additional_notes
      label: Additional notes
      hint: Any extra information to help reviewers
      type: text
      options: []
      required: false
