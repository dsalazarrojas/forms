inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccination Card Upload Form
    pages:
    - id: 1
      name: submission_date
      label: Submission Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 2
      name: patient_first_name
      label: First Name
      hint: Legal first name
      type: text
      options: []
      required: true
    - id: 3
      name: patient_last_name
      label: Last Name
      hint: Legal last name
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 8
      name: address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: State
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 12
      name: purpose_of_submission
      label: Why are you submitting your vaccination card
      hint: Submission reason
      type: select_one
      options:
      - Employment requirement
      - School requirement
      - Travel documentation
      - Event attendance
      - Personal records
      - Healthcare provider request
      - Government requirement
      - Other
      required: true
    - id: 13
      name: organization_name
      label: Organization Requesting Documentation
      hint: Company or school
      type: text
      options: []
      required: false
    - id: 14
      name: vaccination_card_front
      label: Upload Front of Vaccination Card
      hint: Clear photo of front
      type: text
      options: []
      required: true
    - id: 15
      name: vaccination_card_back
      label: Upload Back of Vaccination Card
      hint: Clear photo of back
      type: text
      options: []
      required: false
    - id: 16
      name: vaccine_manufacturer
      label: Vaccine Manufacturer
      hint: Brand name
      type: select_one
      options:
      - Pfizer-BioNTech
      - Moderna
      - Johnson & Johnson
      - Novavax
      - AstraZeneca
      - Other
      - Not sure
      required: true
    - id: 17
      name: dose_number
      label: Which dose is documented
      hint: Dose number
      type: select_one
      options:
      - First dose
      - Second dose
      - Third dose
      - Booster dose
      - Bivalent booster
      - Updated booster
      - Multiple doses
      required: true
    - id: 18
      name: vaccination_dates
      label: Vaccination Date or Dates
      hint: All dose dates
      type: text
      options: []
      required: true
    - id: 19
      name: vaccination_location
      label: Where were you vaccinated
      hint: Vaccination site
      type: text
      options: []
      required: true
    - id: 20
      name: vaccination_site_address
      label: Vaccination Site Address
      hint: Street address
      type: text
      options: []
      required: false
    - id: 21
      name: healthcare_provider_name
      label: Healthcare Provider Name
      hint: Who administered
      type: text
      options: []
      required: false
    - id: 22
      name: lot_number
      label: Vaccine Lot Number
      hint: If visible on card
      type: text
      options: []
      required: false
    - id: 23
      name: card_legibility
      label: Is your vaccination card clearly legible
      hint: Photo quality
      type: select_one
      options:
      - Yes all information is clear
      - Mostly clear some blur
      - Difficult to read
      required: true
    - id: 24
      name: card_authenticity
      label: I certify this is an authentic CDC vaccination card or official equivalent
      hint: Authenticity statement
      type: select_one
      options:
      - Yes this is authentic
      - No this is a copy
      required: true
    - id: 25
      name: additional_documentation
      label: Upload Additional Documentation
      hint: Other records
      type: text
      options: []
      required: false
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Other information
      type: text
      options: []
      required: false
    - id: 27
      name: information_accuracy
      label: I certify that the information provided is true and accurate
      hint: Truthfulness statement
      type: select_one
      options:
      - Yes I certify
      - No I cannot certify
      required: true
    - id: 28
      name: patient_signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
