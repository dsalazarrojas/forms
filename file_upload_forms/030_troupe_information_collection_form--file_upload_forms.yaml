      name: troupe_info
      label: Troupe Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: files_upload
      label: Files Upload
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: performer_details
      label: Performer Details
      hint: null
      type: select_multiple
      options:
      - Name
      - Age
      - Contact Info
      required: false
    - id: 4
      name: promotional_materials
      label: Promotional Materials
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: permissions
      label: Permissions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
      name: permissions_other
      label: Other (if not above)
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: permissions_other_text
      label: Other
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: troupe_info_additional
      label: Troupe Additional Info
      hint: null
      type: text
      options: []
      required: false
