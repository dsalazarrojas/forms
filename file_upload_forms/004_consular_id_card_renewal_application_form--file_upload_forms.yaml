inputSchema:
  type: object
  properties:
    title: Consular ID Card Renewal Application Form
    pages:
    - id: 1
      name: applicant_full_name
      label: Applicant Full Name
      hint: Legal name as it appears on current ID
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: DD/MM/YYYY format
      type: date
      options: []
      required: true
    - id: 3
      name: place_of_birth
      label: Place of Birth
      hint: City and country of birth
      type: text
      options: []
      required: true
    - id: 4
      name: nationality
      label: Nationality
      hint: Country of citizenship
      type: text
      options: []
      required: true
    - id: 5
      name: current_id_number
      label: Current Consular ID Number
      hint: ID number from expiring card
      type: text
      options: []
      required: true
    - id: 6
      name: id_expiration_date
      label: Current ID Expiration Date
      hint: When does your current ID expire
      type: date
      options: []
      required: true
    - id: 7
      name: current_address
      label: Current Address
      hint: Full residential address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 9
      name: state_province
      label: State or Province
      hint: State, province, or region
      type: text
      options: []
      required: true
    - id: 10
      name: postal_code
      label: Postal Code
      hint: ZIP or postal code
      type: text
      options: []
      required: true
    - id: 11
      name: country_of_residence
      label: Country of Residence
      hint: Country where you currently live
      type: text
      options: []
      required: true
    - id: 12
      name: email_address
      label: Email Address
      hint: Primary email for contact
      type: email
      options: []
      required: true
    - id: 13
      name: phone_number
      label: Phone Number
      hint: Primary contact phone number
      type: text
      options: []
      required: true
    - id: 14
      name: marital_status
      label: Marital Status
      hint: Select your current marital status
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      - Separated
      - Civil Partnership
      required: true
    - id: 15
      name: occupation
      label: Occupation
      hint: Current profession or job title
      type: text
      options: []
      required: true
    - id: 16
      name: employer_name
      label: Employer Name
      hint: Name of current employer or company
      type: text
      options: []
      required: false
    - id: 17
      name: reason_for_renewal
      label: Reason for Renewal
      hint: Why are you renewing your ID
      type: select_one
      options:
      - Expiration Approaching
      - ID Expired
      - Lost or Stolen
      - Damaged ID
      - Change of Information
      - Other
      required: true
    - id: 18
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of emergency contact
      type: text
      options: []
      required: false
    - id: 19
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number of emergency contact
      type: text
      options: []
      required: false
    - id: 20
      name: document_upload_photo
      label: Upload Passport Photo
      hint: Recent passport-style photograph
      type: text
      options: []
      required: true
    - id: 21
      name: document_upload_current_id
      label: Upload Current ID Copy
      hint: Front and back copy of current ID
      type: text
      options: []
      required: true
    - id: 22
      name: document_upload_proof_address
      label: Upload Proof of Address
      hint: Utility bill or bank statement
      type: text
      options: []
      required: true
    - id: 23
      name: document_upload_birth_certificate
      label: Upload Birth Certificate
      hint: Certified copy of birth certificate
      type: text
      options: []
      required: false
    - id: 24
      name: previous_renewals
      label: Have You Previously Renewled This ID
      hint: Select if you have renewed before
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 25
      name: special_requests
      label: Special Requests or Accommodations
      hint: Any special requirements or notes
      type: text
      options: []
      required: false
    - id: 26
      name: declaration
      label: Declaration
      hint: I declare that all information provided is true and accurate
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 27
      name: signature_date
      label: Date of Signature
      hint: Date you are submitting this application
      type: date
      options: []
      required: true
