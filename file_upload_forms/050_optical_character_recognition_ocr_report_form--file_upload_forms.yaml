inputSchema:
  type: object
  properties:
    title: Optical Character Recognition (OCR) Report Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: file_upload
      label: File Upload
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_received
      label: Date Received
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: time_received
      label: Time Received
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: file_type
      label: File Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: file_name
      label: File Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: file_size
      label: File Size
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: user_comments
      label: User Comments
      hint: null
      type: text
      options: []
      required: false
