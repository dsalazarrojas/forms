inputSchema:
  type: object
  properties:
    title: Sea Access Request Form
    pages:
    - id: 1
      name: requestor_name
      label: Requestor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: requestor_email
      label: Requestor Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: vessel_type
      label: Vessel Type
      hint: null
      type: select_one
      options:
      - Boat
      - Yacht
      - Ship
      required: true
    - id: 4
      name: vessel_length
      label: Vessel Length
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: request_time
      label: Request Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: request_status
      label: Request Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: true
    - id: 8
      name: request_comment
      label: Request Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: file_upload
      label: File Upload
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_to
      label: Assigned To
      hint: null
      type: text
      options: []
      required: false
