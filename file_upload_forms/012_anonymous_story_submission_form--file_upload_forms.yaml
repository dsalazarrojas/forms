inputSchema:
  type: object
  properties:
    title: Anonymous Story Submission Form
    pages:
    - id: 1
      name: story_title
      label: Title of Your Story
      hint: Give your narrative a brief name
      type: text
      options: []
      required: true
    - id: 2
      name: story_text
      label: Narrative
      hint: Share your experience or story here
      type: text
      options: []
      required: true
    - id: 3
      name: story_theme
      label: Primary Theme
      hint: null
      type: select_one
      options:
      - Personal Growth
      - Workplace Experience
      - Community Event
      - Travel
      - Health Journey
      - Other
      required: true
    - id: 4
      name: audience
      label: Intended Audience
      hint: Who do you want to read this?
      type: text
      options: []
      required: false
    - id: 5
      name: sensitive_content
      label: Does this story contain sensitive or triggering content?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: submission_date
      label: Date of Experience (Approximate)
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: submission_category
      label: Submission Category
      hint: null
      type: select_one
      options:
      - Fiction
      - Non-Fiction
      - Poetry
      - Essay
      required: true
    - id: 8
      name: publication_consent
      label: Do you consent to this being published anonymously?
      hint: null
      type: select_one
      options:
      - I consent to anonymous publication
      - Do not publish, for review only
      required: true
    - id: 9
      name: motivation
      label: Why are you sharing this story today?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: follow_up_permission
      label: May we use this story for educational purposes?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
