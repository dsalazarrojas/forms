inputSchema:
  type: object
  properties:
    title: CNC Project Registration Form
    pages:
    - id: 1
      name: project_name
      label: Project Name
      hint: Give your CNC project a descriptive name
      type: text
      options: []
      required: true
    - id: 2
      name: requester_name
      label: Requester Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: requester_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: organization_name
      label: Organization or Company
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: project_description
      label: Project Description
      hint: Brief overview of what you need machined
      type: text
      options: []
      required: true
    - id: 7
      name: material_type
      label: Material Type
      hint: What material will be used?
      type: select_one
      options:
      - Aluminum
      - Steel
      - Stainless Steel
      - Titanium
      - Plastic
      - Composite
      - Wood
      - Other
      required: true
    - id: 8
      name: material_dimensions
      label: Material Dimensions
      hint: Length x Width x Height or provide detailed specs
      type: text
      options: []
      required: false
    - id: 9
      name: desired_quantities
      label: Quantity Needed
      hint: How many parts do you need?
      type: number
      options: []
      required: true
    - id: 10
      name: design_file
      label: Design File Upload
      hint: Upload CAD file - CAD, DWG, STL, STEP, IGES, etc.
      type: text
      options: []
      required: true
    - id: 11
      name: tolerances
      label: Tolerance Requirements
      hint: Specify any tight tolerances or precision needs
      type: text
      options: []
      required: false
    - id: 12
      name: surface_finish
      label: Surface Finish Required
      hint: Specify finish requirements
      type: select_one
      options:
      - As-Machined
      - Ground
      - Polished
      - Anodized
      - Painted
      - Other
      required: false
    - id: 13
      name: machine_type
      label: Preferred Machine Type
      hint: What type of CNC machine is preferred?
      type: select_one
      options:
      - CNC Mill
      - CNC Lathe
      - Multi-Axis Machine
      - Waterjet
      - Plasma Cutter
      - Laser Cutter
      - No Preference
      required: false
    - id: 14
      name: deadline
      label: Project Deadline
      hint: When do you need this project completed?
      type: date
      options: []
      required: true
    - id: 15
      name: timeline_flexibility
      label: Timeline Flexibility
      hint: How flexible is your deadline?
      type: select_one
      options:
      - Very flexible - 2+ weeks
      - Flexible - 1-2 weeks
      - Tight - 3-7 days
      - Very tight - ASAP
      required: false
    - id: 16
      name: special_requirements
      label: Special Requirements or Notes
      hint: Any special handling, markings, testing, etc.
      type: text
      options: []
      required: false
    - id: 17
      name: budget_range
      label: Budget Range
      hint: null
      type: select_one
      options:
      - Under $500
      - $500 - $2,000
      - $2,000 - $5,000
      - $5,000 - $10,000
      - Over $10,000
      - To be quoted
      required: false
    - id: 18
      name: reference_project
      label: Reference Project or Similar Work
      hint: Any previous projects we can reference?
      type: text
      options: []
      required: false
    - id: 19
      name: delivery_method
      label: Preferred Delivery Method
      hint: How should completed parts be delivered?
      type: select_one
      options:
      - Pickup
      - Shipping
      - Either
      required: false
    - id: 20
      name: registration_date
      label: Registration Date
      hint: Date this form was submitted
      type: date
      options: []
      required: true
