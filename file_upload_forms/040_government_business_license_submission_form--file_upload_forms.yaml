inputSchema:
  type: object
  properties:
    title: Government Business License Submission Form
    pages:
    - id: 1
      name: business_license_application
      label: Submit Business License Application
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: business_type
      label: Business Type
      hint: What kind of business is this?
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - Corporation
      - Limited Liability Company (LLC)
      required: false
    - id: 3
      name: business_location
      label: Business Location
      hint: What is the location of your business?
      type: text
      options: []
      required: false
    - id: 4
      name: business_address
      label: Address
      hint: What is the address of your business?
      type: text
      options: []
      required: false
    - id: 5
      name: business_contact
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: business_license_type
      label: License Type
      hint: What type of license do you need?
      type: select_multiple
      options:
      - General Business License
      - Specialized Business License
      - Both
      required: false
    - id: 7
      name: document_upload
      label: Document Upload
      hint: Upload required documents
      type: text
      options: []
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
