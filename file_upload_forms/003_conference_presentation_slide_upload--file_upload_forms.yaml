inputSchema:
  type: object
  properties:
    title: Conference Presentation Slide Upload
    pages:
      - id: 1
        name: instructions
        label: -- Slide Submission Instructions --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: speaker_name
        label: Speaker full name
        hint: Include presenting author
        type: text
        options: []
        required: true
      - id: 3
        name: speaker_email
        label: Speaker email
        hint: Email used for confirmation and corrections
        type: email
        options: []
        required: true
      - id: 4
        name: presentation_title
        label: Presentation title
        hint: Exact title to be used in the program
        type: text
        options: []
        required: true
      - id: 5
        name: presentation_session
        label: Session name or number
        hint: If known, provide the scheduled session
        type: text
        options: []
        required: false
      - id: 6
        name: slide_file_format
        label: Preferred file format
        hint: PDF preferred to preserve formatting
        type: select_one
        options:
          - PDF
          - PowerPoint
          - Keynote
          - Other
        required: true
      - id: 7
        name: file_upload_link
        label: File upload link or instruction
        hint: Provide secure upload link or note if sending by email
        type: text
        options: []
        required: true
      - id: 8
        name: special_instructions
        label: Special presentation instructions
        hint: AV needs, video playback, or animations
        type: text
        options: []
        required: false
      - id: 9
        name: consent_recording
        label: Consent to record presentation
        hint: Recording may be published post event
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 10
        name: submitter_relationship
        label: Submitter relationship to speaker
        hint: For example presenter, assistant, organizer
        type: select_one
        options:
          - Presenter
          - Co presenter
          - Assistant
          - Organizer
        required: false
