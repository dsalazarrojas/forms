inputSchema:
  type: object
  properties:
    title: Accounting Document Upload Form
    pages:
    - id: 1
      name: client_id_or_name
      label: Client ID or Name
      hint: For internal tracking purposes
      type: text
      options: []
      required: true
    - id: 2
      name: document_category
      label: Document Category
      hint: Categorize the uploaded paperwork
      type: select_one
      options:
      - Receipts
      - Invoices
      - Bank Statements
      - Payroll Records
      - Tax Documents
      - Legal Contracts
      required: true
    - id: 3
      name: document_date
      label: Document Date
      hint: Date shown on the document
      type: date
      options: []
      required: true
    - id: 4
      name: total_amount_if_applicable
      label: Total Amount
      hint: Currency value if an invoice or receipt
      type: number
      options: []
      required: false
    - id: 5
      name: fiscal_year
      label: Fiscal Year
      hint: Which year does this document pertain to?
      type: select_one
      options:
      - 2023
      - 2024
      - 2025
      - 2026
      required: true
    - id: 6
      name: document_description
      label: Document Description
      hint: Brief summary of the content
      type: text
      options: []
      required: false
    - id: 7
      name: urgency_level
      label: Urgency Level
      hint: null
      type: select_one
      options:
      - Standard
      - High
      required: true
    - id: 8
      name: upload_instructions_header
      label: -- Upload Instructions --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: upload_instruction_text
      label: Please ensure all uploaded files are clear, legible, and include both
        sides if necessary. Use the internal portal for large batch uploads.
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: contact_for_clarification
      label: Contact for Clarification
      hint: Email of the person who can answer questions about this document
      type: email
      options: []
      required: true
    - id: 11
      name: phone_for_clarification
      label: Phone for Clarification
      hint: null
      type: text
      options: []
      required: false
