      - id: 12
        name: website_url
        label: Official Website
        hint: null
        type: text
        options: []
        required: false
      - id: 13
        name: spotify_link
        label: Spotify Artist Profile Link
        hint: null
        type: text
        options: []
        required: false
      - id: 14
        name: instagram_handle
        label: Instagram Handle
