inputSchema:
  type: object
  properties:
    title: Buyout Payment Request Form
    pages:
    - id: 1
      name: requestor_information
      label: -- Requestor Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Full Name of Requestor
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Finance
      - Operations
      - Human Resources
      - Sales
      - Engineering
      - Other
      required: true
    - id: 5
      name: payout_details_section
      label: -- Payout Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contract_reference
      label: Contract or Project Reference Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: buyout_type
      label: Type of Buyout
      hint: null
      type: select_one
      options:
      - Contract Early Termination
      - Vacation Buyback
      - Equity Vesting
      - Performance Bonus Buyout
      required: true
    - id: 8
      name: requested_amount
      label: Total Requested Buyout Amount
      hint: Gross amount before taxes
      type: number
      options: []
      required: true
    - id: 9
      name: effective_date
      label: Desired Payout Date
      hint: Subject to payroll cycles
      type: date
      options: []
      required: true
    - id: 10
      name: documentation_check
      label: Have all supporting documents been uploaded?
      hint: Refer to the company buyout policy
      type: select_one
      options:
      - Yes, all attached
      - No, pending submission
      required: true
    - id: 11
      name: upload_notice
      label: Documentation Upload Notice
      hint: Please ensure your file upload includes the signed agreement and calculation
        worksheet.
      type: note
      options: []
      required: false
    - id: 12
      name: manager_approval_name
      label: Approving Manager Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: additional_notes
      label: Additional Notes for Finance Team
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: submission_confirmation
      label: I certify that the information provided is accurate
      hint: null
      type: select_one
      options:
      - I Agree
      - Other
      required: true
