inputSchema:
  type: object
  properties:
    title: software_user_issue_inquiry_form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: issue_type
      label: Issue Type
      hint: null
      type: select_one
      options:
      - Software Bug
      - Software Issue
      - Other
      required: false
    - id: 4
      name: issue_description
      label: Issue Description
      hint: Briefly describe the issue here.
      type: text
      options: []
      required: false
    - id: 5
      name: issue_image
      label: Screenshot of Issue
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: issue_attachment
      label: Attachment
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: issue_reported_at
      label: Issue Reported At
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: issue_triaged_at
      label: Issue Triage
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: issue_priority
      label: Issue Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 10
      name: issue_status
      label: Issue Status
      hint: null
      type: select_one
      options:
      - Open
      - Resolved
      - Closed
      required: false
