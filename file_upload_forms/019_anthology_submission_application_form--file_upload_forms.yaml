inputSchema:
  type: object
  properties:
    title: Anthology Submission Application Form
    pages:
    - id: 1
      name: author_details_header
      label: -- Author Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: author_full_name
      label: Legal Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: pen_name
      label: Pen Name (if different)
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: author_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: author_bio
      label: Author Biography
      hint: Max 150 words
      type: text
      options: []
      required: true
    - id: 6
      name: submission_details_header
      label: -- Submission Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: work_title
      label: Title of Work
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: primary_genre
      label: Primary Genre
      hint: null
      type: select_one
      options:
      - Science Fiction
      - Fantasy
      - Mystery
      - Horror
      - Literary Fiction
      - Non-Fiction
      required: true
    - id: 9
      name: word_count
      label: Approximate Word Count
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: work_summary
      label: Brief Summary/Abstract
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: file_format
      label: Original File Format
      hint: null
      type: select_one
      options:
      - .doc / .docx
      - .pdf
      - .rtf
      - .txt
      required: true
    - id: 12
      name: previously_published
      label: Has this work been previously published?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: publication_history
      label: If yes - where was it published?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: terms_agreement
      label: I agree to the anthology submission terms
      hint: null
      type: select_multiple
      options:
      - I agree
      - Other
      required: true
