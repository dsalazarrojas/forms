      name: project_update_document_upload_form_page_3
      label: File Upload
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: project_update_document_upload_form_page_4
      label: Category
      hint: Select a category for your file
      type: select_one
      options:
      - File Upload Forms
      - Business Report Forms
      required: false
