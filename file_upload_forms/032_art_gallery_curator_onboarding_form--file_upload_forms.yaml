inputSchema:
  type: object
  properties:
    title: Art Gallery Curator Onboarding Form
    pages:
    - id: 1
      name: curator_profile_header
      label: -- Curator Profile --
      hint: Welcome to the gallery team!
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: professional_title
      label: Professional Title
      hint: e.g., Chief Curator, Guest Curator, Assistant Curator
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Primary Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: specialization_area
      label: Area of Specialization
      hint: e.g., Modern Sculpture, Southeast Asian Art
      type: text
      options: []
      required: true
    - id: 7
      name: onboarding_files_header
      label: -- Required Documents --
      hint: Note - Please ensure all files are in PDF format.
      type: note
      options: []
      required: false
    - id: 8
      name: portfolio_link
      label: Digital Portfolio Link (URL)
      hint: Link to your past work and curated exhibitions
      type: text
      options: []
      required: true
    - id: 9
      name: cv_upload_note
      label: Curriculum Vitae (CV) - Reminder to email or upload separately
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: availability_header
      label: -- Availability and Engagement --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: employment_start_date
      label: Desired Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: contract_type
      label: Contract Type
      hint: null
      type: select_one
      options:
      - Permanent Full-time
      - Permanent Part-time
      - Project-based (Guest Curator)
      - Annual Retainer
      required: true
    - id: 13
      name: weekly_hours_expected
      label: Expected Weekly Hours (For part-time or project-based)
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: administrative_details_header
      label: -- Administrative Setup --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: office_space_required
      label: Will you require dedicated office space in the gallery?
      hint: null
      type: select_one
      options:
      - true
      - No - Working Remotely
      required: true
    - id: 16
      name: business_card_info
      label: Information for Business Cards (If applicable)
      hint: Preferred name and title as it should appear
      type: text
      options: []
      required: false
    - id: 17
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: submission_timestamp
      label: Date of Submission
      hint: null
      type: date
      options: []
      required: true
