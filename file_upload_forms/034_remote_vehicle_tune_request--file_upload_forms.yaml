inputSchema:
  type: object
  properties:
    title: Remote Vehicle Tune Request
    pages:
    - id: 1
      name: vehicle_id
      label: Vehicle ID
      hint: Please enter the vehicle's ID
      type: number
      options: []
      required: true
    - id: 2
      name: vehicle_make
      label: Vehicle Make
      hint: Please select the vehicle's make
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: vehicle_model
      label: Vehicle Model
      hint: Please select the vehicle's model
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: customer_goals
      label: Customer Goals
      hint: Please enter your customer goals
      type: text
      options: []
      required: true
    - id: 5
      name: vehicle_year
      label: Vehicle Year
      hint: Please enter the vehicle's year
      type: date
      options: []
      required: true
    - id: 6
      name: file_details
      label: File Details
      hint: Please upload a file with vehicle details
      type: text
      options: []
      required: true
    - id: 7
      name: vehicle_details
      label: Vehicle Details
      hint: Please enter vehicle details
      type: text
      options: []
      required: true
    - id: 8
      name: file_type
      label: File Type
      hint: Please select the file type
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: file_url
      label: File URL
      hint: Please enter the file URL
      type: text
      options: []
      required: true
    - id: 10
      name: customer_goals_list
      label: Customer Goals List
      hint: Please select customer goals
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: customer_goals_list_value
      label: Customer Goals List Value
      hint: Please select customer goals list value
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: notes
      label: Notes
      hint: Please enter notes
      type: text
      options: []
      required: true
    - id: 13
      name: submit
      label: Submit
      hint: Please submit your request
      type: text
      options: []
      required: true
