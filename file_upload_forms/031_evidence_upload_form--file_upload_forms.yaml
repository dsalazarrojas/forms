inputSchema:
  type: object
  properties:
    title: Evidence Upload Form
    pages:
    - id: 1
      name: upload_evidence
      label: Upload Evidence
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: description
      label: description
      hint: A short description of the evidence
      type: text
      options: []
      required: false
    - id: 3
      name: date_taken
      label: Date Taken
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time_taken
      label: Time Taken
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: case_number
      label: Case Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: case_type
      label: Case Type
      hint: Select the type of case
      type: select_one
      options:
      - Legal
      - Compliance
      - Investigative
      required: true
    - id: 8
      name: assignee
      label: Assignee
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: evidence_status
      label: Evidence Status
      hint: Select the status of the evidence
      type: select_multiple
      options:
      - Pending
      - Verified
      - Rejected
      - Archived
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
