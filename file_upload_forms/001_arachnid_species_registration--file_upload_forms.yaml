inputSchema:
  type: object
  properties:
    title: Arachnid Species Registration
    pages:
    - id: 1
      name: section_researcher_info
      label: -- Researcher Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: researcher_name
      label: Researcher Full Name
      hint: Your complete name
      type: text
      options: []
      required: true
    - id: 3
      name: researcher_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: institution_affiliation
      label: Institution or Organization
      hint: Museum, university, or research center
      type: text
      options: []
      required: false
    - id: 5
      name: section_discovery_details
      label: -- Discovery Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: species_name
      label: Arachnid Species Name
      hint: Scientific or common name
      type: text
      options: []
      required: true
    - id: 7
      name: discovery_date
      label: Date of Discovery
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: discovery_location
      label: Discovery Location
      hint: Latitude, longitude, or address
      type: text
      options: []
      required: true
    - id: 9
      name: habitat_type
      label: Habitat Type
      hint: Select the primary habitat
      type: select_one
      options:
      - Forest
      - Grassland
      - Desert
      - Urban
      - Aquatic
      - Other
      required: true
    - id: 10
      name: specimen_condition
      label: Specimen Condition
      hint: null
      type: select_one
      options:
      - Alive
      - Preserved
      - Photograph only
      - Not applicable
      required: true
    - id: 11
      name: section_documentation
      label: -- Specimen Documentation --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: specimen_photos
      label: Upload Specimen Photos
      hint: Upload clear photos of the specimen
      type: text
      options: []
      required: true
    - id: 13
      name: habitat_photo
      label: Habitat Photo
      hint: Optional photo of the discovery location
      type: text
      options: []
      required: false
    - id: 14
      name: specimen_size_mm
      label: Specimen Size - mm
      hint: Body length in millimeters
      type: number
      options: []
      required: false
    - id: 15
      name: distinctive_features
      label: Distinctive Features
      hint: Notable characteristics or markings
      type: text
      options: []
      required: false
    - id: 16
      name: specimen_behavior
      label: Observed Behavior
      hint: Hunting, web-building, or other behaviors
      type: text
      options: []
      required: false
    - id: 17
      name: section_research_details
      label: -- Research Classification --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: research_priority
      label: Research Priority Level
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Critical
      required: false
    - id: 19
      name: data_sharing_consent
      label: May we share this data with other researchers
      hint: null
      type: select_one
      options:
      - true
      - false
      - Ask me first
      required: true
    - id: 20
      name: additional_notes
      label: Additional Notes or Observations
      hint: Any other relevant information
      type: text
      options: []
      required: false
