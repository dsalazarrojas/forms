inputSchema:
  type: object
  properties:
    title: Manuscript Delivery Form
    pages:
    - id: 1
      name: author_name
      label: Author Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: manuscript_title
      label: Manuscript Title
      hint: Enter manuscript title here
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone
      hint: Enter a valid 10-digit number
      type: text
      options: []
      required: false
    - id: 5
      name: manuscript_file
      label: Manuscript File
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: file_type
      label: File Type
      hint: null
      type: select_one
      options:
      - Doc
      - PDF
      - Image
      - Audio
      - Video
      required: true
    - id: 7
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: manuscript_status
      label: Manuscript Status
      hint: null
      type: select_multiple
      options:
      - In progress
      - Complete
      - Pending
      - Rejected
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Bob
      - Alice
      required: true
