      name: file_upload_1
      label: upload_file
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: issue_description_1
      label: describe_issue
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: suspected_malware_type_1
      label: suspected_malware_type
