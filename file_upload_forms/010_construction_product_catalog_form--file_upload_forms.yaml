inputSchema:
  type: object
  properties:
    title: Construction Product Catalog Form
    pages:
    - id: 1
      name: section_product_details
      label: -- Product Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: product_name
      label: Product name
      hint: Name used in catalog listings
      type: text
      options: []
      required: true
    - id: 3
      name: sku_or_model
      label: SKU or model number
      hint: Manufacturer model or SKU
      type: text
      options: []
      required: false
    - id: 4
      name: product_category
      label: Product category
      hint: e.g., Fasteners, Concrete, Tools
      type: text
      options: []
      required: true
    - id: 5
      name: unit_price
      label: Unit price
      hint: Price per unit in local currency
      type: number
      options: []
      required: true
    - id: 6
      name: stock_quantity
      label: Stock quantity
      hint: Number of units available
      type: number
      options: []
      required: false
    - id: 7
      name: product_description
      label: Product description
      hint: Short description for catalog use
      type: text
      options: []
      required: false
    - id: 8
      name: technical_specifications
      label: Technical specifications
      hint: Key technical details or dimensions
      type: text
      options: []
      required: false
    - id: 9
      name: product_image_note
      label: Product image note
      hint: Indicate if product images will be supplied separately
      type: select_one
      options:
      - Will upload images
      - No images available
      required: false
