inputSchema:
  type: object
  properties:
    title: Kilograms To Pounds Conversion Form
    pages:
    - id: 1
      name: user_input_1
      label: enter_kilograms
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_input_2
      label: convert
      hint: null
      type: select_one
      options:
      - to pounds
      - to ounces
      required: true
    - id: 3
      name: result
      label: result
      hint: null
      type: note
      options: []
      required: false
