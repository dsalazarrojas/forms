      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: calculation_type
      label: Calculation Type
      hint: null
