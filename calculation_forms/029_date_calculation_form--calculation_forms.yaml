      options:
      - Between
      - Subtract
      - Add
      required: false
    - id: 4
      name: days_between
      label: Days Between
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: result
      label: Result
      hint: null
      type: text
      options: []
      required: false
