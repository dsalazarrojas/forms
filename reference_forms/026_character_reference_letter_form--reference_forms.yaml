inputSchema:
  type: object
  properties:
    title: Character Reference Letter Form
    pages:
    - id: 1
      name: header
      label: -- Reference Letter Request --
      hint: Collect structured information for writing a character reference letter
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: requester name
      hint: person requesting the letter
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: requester email
      hint: contact for delivery
      type: email
      options: []
      required: true
    - id: 4
      name: subject_name
      label: subject name
      hint: person the letter is about
      type: text
      options: []
      required: true
    - id: 5
      name: purpose_of_letter
      label: purpose of letter
      hint: e g employment, tenancy, academic
      type: text
      options: []
      required: true
    - id: 6
      name: key_points_to_include
      label: key points to include
      hint: qualities and examples to highlight
      type: text
      options: []
      required: false
    - id: 7
      name: relationship_length
      label: relationship length
      hint: how long the writer has known the subject
      type: text
      options: []
      required: false
    - id: 8
      name: confidentiality
      label: confidentiality
      hint: indicate if letter should be confidential
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: delivery_method
      label: delivery method
      hint: how the letter should be delivered
      type: select_one
      options:
      - Email
      - Hard copy
      - Upload to portal
      required: true
    - id: 10
      name: submission_deadline
      label: submission deadline
      hint: date by which letter is needed
      type: date
      options: []
      required: false
