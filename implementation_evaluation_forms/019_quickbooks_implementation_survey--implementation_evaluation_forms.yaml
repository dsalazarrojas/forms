inputSchema:
  type: object
  properties:
    title: QuickBooks Implementation Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: implementation_status
      label: What Is The Current Implementation Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 3
      name: benefits_achieved
      label: What Benefits Have You Achieved
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: challenges_faced
      label: What Challenges Have You Faced
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: time_spent
      label: How Much Time Spent In Implementation
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: implementation_date
      label: Date Implemented
      hint: null
      type: date
      options: []
      required: true
