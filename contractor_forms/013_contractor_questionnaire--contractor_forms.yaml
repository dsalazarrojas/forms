inputSchema:
  type: object
  properties:
    title: Contractor Questionnaire
    pages:
    - id: 1
      name: applicant_name
      label: Full Name
      hint: Legal name of applicant
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Primary email for communication
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: address
      label: Business Address
      hint: Full address of your business
      type: text
      options: []
      required: true
    - id: 5
      name: section_business_details
      label: -- Business Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: business_name
      label: Business Name
      hint: Legal name of your business
      type: text
      options: []
      required: true
    - id: 7
      name: business_type
      label: Business Type
      hint: Type of business entity
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - Corporation
      - S-Corporation
      - Non-Profit
      required: true
    - id: 8
      name: years_in_business
      label: Years in Business
      hint: How long have you been operating
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 9
      name: number_of_employees
      label: Number of Employees
      hint: Total employees in your company
      type: number
      options: []
      required: false
    - id: 10
      name: section_credentials
      label: -- Credentials and Qualifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: license_number
      label: Contractor License Number
      hint: Your professional license number
      type: text
      options: []
      required: true
    - id: 12
      name: license_state
      label: License State
      hint: State where license is issued
      type: text
      options: []
      required: true
    - id: 13
      name: license_expiration
      label: License Expiration Date
      hint: When does your license expire
      type: date
      options: []
      required: true
    - id: 14
      name: insurance_carrier
      label: Insurance Carrier
      hint: Name of your insurance provider
      type: text
      options: []
      required: true
    - id: 15
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Your policy number
      type: text
      options: []
      required: true
    - id: 16
      name: liability_coverage
      label: Liability Coverage Amount
      hint: Total liability coverage
      type: text
      options: []
      required: true
    - id: 17
      name: workers_compensation
      label: Workers Compensation Insurance
      hint: Do you have workers comp insurance
      type: select_one
      options:
      - true
      - false
      - Not Applicable
      required: true
    - id: 18
      name: bonded
      label: Are you bonded
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: section_experience
      label: -- Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: primary_specialty
      label: Primary Specialty
      hint: Your main area of expertise
      type: select_one
      options:
      - General Contracting
      - Electrical
      - Plumbing
      - HVAC
      - Carpentry
      - Masonry
      - Painting
      - Roofing
      - Landscaping
      - Other
      required: true
    - id: 21
      name: secondary_specialties
      label: Secondary Specialties
      hint: Other areas of expertise
      type: select_multiple
      options:
      - Electrical
      - Plumbing
      - HVAC
      - Carpentry
      - Masonry
      - Painting
      - Roofing
      - Landscaping
      - Remodeling
      - New Construction
      required: false
    - id: 22
      name: project_types
      label: Types of Projects Completed
      hint: Select all that apply
      type: select_multiple
      options:
      - Residential
      - Commercial
      - Industrial
      - Government
      - Institutional
      required: true
    - id: 23
      name: largest_project_value
      label: Largest Project Value Completed
      hint: Highest value project you have handled
      type: select_one
      options:
      - Under $50,000
      - $50,000-$100,000
      - $100,000-$500,000
      - $500,000-$1,000,000
      - Over $1,000,000
      required: false
    - id: 24
      name: section_references
      label: -- References --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: reference_1_company
      label: Reference 1 Company
      hint: Company name
      type: text
      options: []
      required: false
    - id: 26
      name: reference_1_contact
      label: Reference 1 Contact Name
      hint: Contact person name
      type: text
      options: []
      required: false
    - id: 27
      name: reference_1_phone
      label: Reference 1 Phone
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 28
      name: reference_2_company
      label: Reference 2 Company
      hint: Company name
      type: text
      options: []
      required: false
    - id: 29
      name: reference_2_contact
      label: Reference 2 Contact Name
      hint: Contact person name
      type: text
      options: []
      required: false
    - id: 30
      name: reference_2_phone
      label: Reference 2 Phone
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 31
      name: section_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 32
      name: availability
      label: Current Availability
      hint: When can you start new projects
      type: select_one
      options:
      - Immediately
      - Within 2 weeks
      - Within 1 month
      - Within 3 months
      - Not available
      required: true
    - id: 33
      name: service_area
      label: Service Area
      hint: Geographic areas you serve
      type: text
      options: []
      required: true
    - id: 34
      name: certifications
      label: Additional Certifications
      hint: List any relevant certifications
      type: text
      options: []
      required: false
    - id: 35
      name: additional_comments
      label: Additional Comments
      hint: Anything else you would like us to know
      type: text
      options: []
      required: false
