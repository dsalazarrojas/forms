inputSchema:
  type: object
  properties:
    title: Solar Assessment Form
    pages:
    - id: 1
      name: property_address
      label: property_address
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: site_details
      label: site_details
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: property_size
      label: property_size
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: property_age
      label: property_age
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: roof_type
      label: roof_type
      hint: null
      type: select_one
      options:
      - Asphalt
      - Metal
      - Clay tile
      - Composite
      - Wood
      - Tile
      - Slate
      - Other
      required: false
    - id: 6
      name: roof_angle
      label: roof_angle
      hint: null
      type: select_multiple
      options:
      - Less than 30 degrees
      - 30-45 degrees
      - 45-60 degrees
      - 60-90 degrees
      - More than 90 degrees
      required: false
    - id: 7
      name: roof_height
      label: roof_height
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: roof_orientation
      label: roof_orientation
      hint: null
      type: select_one
      options:
      - South
      - East
      - West
      - North
      required: false
    - id: 9
      name: energy_assessment
      label: energy_assessment
      hint: null
      type: select_one
      options:
      - Very high
      - High
      - Medium
      - Low
      required: false
    - id: 10
      name: site_inspection
      label: site_inspection
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: solar_panels
      label: solar_panels
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: solar_installation
      label: solar_installation
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: site_notes
      label: site_notes
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: customer_notes
      label: customer_notes
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
