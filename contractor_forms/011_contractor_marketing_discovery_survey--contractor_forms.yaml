inputSchema:
  type: object
  properties:
    title: Contractor Marketing Discovery Survey
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Name of your contracting business
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Person Name
      hint: Full name of primary contact
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: Primary email for communication
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: section_business_info
      label: -- Business Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: years_in_business
      label: Years in Business
      hint: How long has your company been operating
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 7
      name: business_size
      label: Number of Employees
      hint: Size of your team
      type: select_one
      options:
      - Just me
      - 2-5 employees
      - 6-10 employees
      - 11-25 employees
      - 26-50 employees
      - Over 50 employees
      required: true
    - id: 8
      name: service_area
      label: Service Area
      hint: Geographic area you serve
      type: select_one
      options:
      - Local
      - Regional
      - Statewide
      - National
      - International
      required: true
    - id: 9
      name: primary_services
      label: Primary Services Offered
      hint: Select all that apply
      type: select_multiple
      options:
      - General Contracting
      - Electrical Work
      - Plumbing
      - HVAC
      - Roofing
      - Landscaping
      - Remodeling
      - New Construction
      - Maintenance
      required: true
    - id: 10
      name: section_marketing_current
      label: -- Current Marketing --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: current_marketing_methods
      label: Current Marketing Methods
      hint: How do you currently market your business
      type: select_multiple
      options:
      - Word of Mouth
      - Website
      - Social Media
      - Print Advertising
      - Online Ads
      - Direct Mail
      - Networking
      - Referrals
      - Not Currently Marketing
      required: true
    - id: 12
      name: marketing_budget
      label: Monthly Marketing Budget
      hint: How much do you spend on marketing monthly
      type: select_one
      options:
      - Under $500
      - $500-$1,000
      - $1,000-$2,500
      - $2,500-$5,000
      - Over $5,000
      - No Set Budget
      required: true
    - id: 13
      name: website_status
      label: Do you have a business website
      hint: null
      type: select_one
      options:
      - Yes - Professional
      - Yes - Basic
      - Working on It
      - false
      required: true
    - id: 14
      name: social_media_presence
      label: Social Media Presence
      hint: Which platforms do you use
      type: select_multiple
      options:
      - Facebook
      - Instagram
      - LinkedIn
      - Twitter
      - YouTube
      - TikTok
      - None
      required: false
    - id: 15
      name: section_challenges
      label: -- Challenges and Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: biggest_challenge
      label: Biggest Marketing Challenge
      hint: What is your primary struggle
      type: select_one
      options:
      - Generating Leads
      - Brand Awareness
      - Online Visibility
      - Customer Retention
      - Competition
      - Budget Constraints
      - Time Constraints
      required: true
    - id: 17
      name: lead_source_current
      label: Where do most leads come from now
      hint: Your primary lead source
      type: select_one
      options:
      - Referrals
      - Website
      - Social Media
      - Advertising
      - Networking
      - Repeat Customers
      - Other
      required: true
    - id: 18
      name: marketing_goals
      label: Primary Marketing Goals
      hint: What do you want to achieve
      type: select_multiple
      options:
      - More Leads
      - Better Brand Recognition
      - Increased Website Traffic
      - Higher Quality Clients
      - Expand Service Area
      - Launch New Services
      - Improve Online Reviews
      required: true
    - id: 19
      name: section_preferences
      label: -- Marketing Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: interested_services
      label: Marketing Services Interested In
      hint: What would you like help with
      type: select_multiple
      options:
      - Website Design
      - SEO
      - Social Media Management
      - Content Marketing
      - Paid Advertising
      - Email Marketing
      - Branding
      - Video Marketing
      - Reputation Management
      required: true
    - id: 21
      name: timeline
      label: When do you want to start
      hint: Your ideal timeline
      type: select_one
      options:
      - Immediately
      - Within 1 month
      - Within 3 months
      - Just researching
      required: true
    - id: 22
      name: decision_maker
      label: Are you the decision maker
      hint: null
      type: select_one
      options:
      - true
      - No - Need to consult partner
      - No - Corporate approval needed
      required: true
    - id: 23
      name: previous_marketing_experience
      label: Previous Marketing Agency Experience
      hint: Have you worked with marketing agencies before
      type: select_one
      options:
      - Yes - Good experience
      - Yes - Bad experience
      - No - First time
      required: false
    - id: 24
      name: additional_comments
      label: Additional Comments or Questions
      hint: Anything else you would like to share
      type: text
      options: []
      required: false
