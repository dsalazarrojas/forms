inputSchema:
  type: object
  properties:
    title: Pest Control Quote Form
    pages:
    - id: 1
      name: quote_form
      label: Quote Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: pest_type
      label: Pest Type
      hint: null
      type: select_one
      options:
      - Ants
      - Beetles
      - Cockroaches
      - Fleas
      - Flies
      - Moths
      - Rats
      - Spiders
      - Termites
      - Ticks
      - Wasps
      - Worms
      - Other
      required: false
    - id: 4
      name: service_needed
      label: Service Needed
      hint: null
      type: select_multiple
      options:
      - Inspection
      - Extermination
      - Prevention
      required: false
    - id: 5
      name: service_area
      label: Service Area
      hint: null
      type: select_multiple
      options:
      - House
      - Yard
      - Pool
      - Attic
      - Basement
      required: false
    - id: 6
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: customer_email
      label: Customer E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
