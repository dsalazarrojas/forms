inputSchema:
  type: object
  properties:
    title: Restroom Rental Agreement Form
    pages:
    - id: 1
      name: contract_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Event Type 1
      - Event Type 2
      - Event Type 3
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: Date of the event
      type: date
      options: []
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: Start time of the event
      type: time
      options: []
      required: false
    - id: 4
      name: prophets
      label: Number of Prostitutes
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: location
      label: Location
      hint: Address of the event
      type: text
      options: []
      required: false
    - id: 6
      name: contact_name
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: approve_signature
      label: Approve Signature
      hint: null
      type: select_multiple
      options:
      - Approve Signature 1
      - Approve Signature 2
      - Approve Signature 3
      required: false
