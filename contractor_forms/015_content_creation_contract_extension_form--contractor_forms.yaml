inputSchema:
  type: object
  properties:
    title: Content Creation Contract Extension Form
    pages:
    - id: 1
      name: contractor_name
      label: Contractor Name
      hint: Full name of the content contractor
      type: text
      options: []
      required: true
    - id: 2
      name: contractor_email
      label: Contractor Email
      hint: Email address of contractor
      type: email
      options: []
      required: true
    - id: 3
      name: client_name
      label: Client Name
      hint: Full name of the client
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Client Email
      hint: Email address of client
      type: email
      options: []
      required: true
    - id: 5
      name: original_contract_date
      label: Original Contract Date
      hint: Date of the original contract
      type: date
      options: []
      required: true
    - id: 6
      name: original_contract_id
      label: Original Contract ID
      hint: Reference number of original contract
      type: text
      options: []
      required: true
    - id: 7
      name: extension_request_date
      label: Extension Request Date
      hint: Date of this extension request
      type: date
      options: []
      required: true
    - id: 8
      name: extension_type
      label: Extension Type
      hint: What type of extension is this?
      type: select_one
      options:
      - Time Extension Only
      - Scope Extension Only
      - Time and Scope Extension
      - Budget Extension Only
      - Full Contract Extension
      required: true
    - id: 9
      name: original_end_date
      label: Original Contract End Date
      hint: When does the current contract end?
      type: date
      options: []
      required: true
    - id: 10
      name: requested_new_end_date
      label: Requested New End Date
      hint: What is the proposed new end date?
      type: date
      options: []
      required: true
    - id: 11
      name: extension_duration
      label: Extension Duration
      hint: How long is the extension period?
      type: select_one
      options:
      - 1 week
      - 2 weeks
      - 1 month
      - 2 months
      - 3 months
      - 6 months
      - Other
      required: true
    - id: 12
      name: reason_for_extension
      label: Reason for Extension
      hint: Why is the extension needed?
      type: select_one
      options:
      - Additional Content Requested
      - Project Complexity Increased
      - Client-Requested Changes
      - Resource Constraints
      - Timeline Adjustment
      - Other
      required: true
    - id: 13
      name: extension_details
      label: Extension Details
      hint: Provide detailed explanation for the extension
      type: text
      options: []
      required: true
    - id: 14
      name: additional_deliverables
      label: Additional Deliverables
      hint: What additional content will be created?
      type: text
      options: []
      required: false
    - id: 15
      name: original_contract_value
      label: Original Contract Value
      hint: Value of the original contract
      type: number
      options: []
      required: true
    - id: 16
      name: additional_cost
      label: Additional Cost
      hint: Additional cost for the extension
      type: number
      options: []
      required: true
    - id: 17
      name: new_total_value
      label: New Total Contract Value
      hint: Total value including extension
      type: number
      options: []
      required: true
    - id: 18
      name: payment_terms
      label: Payment Terms for Extension
      hint: How will extension payments be handled?
      type: select_one
      options:
      - Upfront Payment
      - Milestone Payments
      - Upon Completion
      - Same as Original Contract
      - Other
      required: true
    - id: 19
      name: contractor_approval
      label: Contractor Approval
      hint: Does the contractor approve this extension?
      type: select_one
      options:
      - Yes, I Approve
      - No, I Do Not Approve
      - Pending Review
      required: true
    - id: 20
      name: client_approval
      label: Client Approval
      hint: Does the client approve this extension?
      type: select_one
      options:
      - Yes, I Approve
      - No, I Do Not Approve
      - Pending Review
      required: true
    - id: 21
      name: terms_modified
      label: Are Contract Terms Modified?
      hint: Will any terms and conditions change?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 22
      name: modified_terms_details
      label: Modified Terms Details
      hint: Describe any changes to terms and conditions
      type: text
      options: []
      required: false
    - id: 23
      name: effective_date
      label: Extension Effective Date
      hint: When does this extension take effect?
      type: date
      options: []
      required: true
    - id: 24
      name: additional_notes
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
