      options: []
      required: true
    - id: 12
      name: phone
      label: What is the phone number of the contractor?
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: drag_and_drop
      label: Drag and Drop
      hint: null
      type: note
      options: []
      required: false
