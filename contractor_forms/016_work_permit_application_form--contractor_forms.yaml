inputSchema:
  type: object
  properties:
    title: Work Permit Application Form
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: permit_type
      label: Permit Type
      hint: null
      type: select_one
      options:
      - Permit Type
      - Non-Resident Alien
      - Non-Resident Non-Citizen
      - Resident Alien
      required: true
    - id: 5
      name: work_location
      label: Work Location
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: work_hours
      label: Work Hours
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - Manager
      - Assistant Manager
      - HR Manager
      required: true
    - id: 9
      name: submitted_to
      label: Submitted To
      hint: null
      type: select_multiple
      options:
      - CEO
      - Manager
      - Assistant Manager
      required: true
