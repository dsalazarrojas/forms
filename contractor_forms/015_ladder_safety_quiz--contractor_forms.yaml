    - id: 2
      name: general_knowledge
      label: Ladder Safety Quiz General Knowledge
      hint: null
      type: select_multiple
      options:
      - Correctly using a ladder requires proper training and practice.
      - Always inspect your ladder before each use.
      - Never lean over the side of a ladder for support.
      - Never use a ladder on a slope or uneven surface.
      - Never use a ladder near an overhead power line.
      - Never use a ladder near an open flame.
      - Never use a ladder in windy or stormy weather.
      - Never use a ladder on an uneven or slippery surface.
      - Always maintain three points of contact.
      - Never use a ladder with damaged or defective parts.
      - Never leave a ladder unattended.
      - Never use a ladder that is too short or too long.
      required: true
