    - id: 4
      name: budget
      label: Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: deadline
      label: Deadline
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
