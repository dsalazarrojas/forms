inputSchema:
  type: object
  properties:
    title: Supplier Evaluation Form
    pages:
    - id: 1
      name: supplier_name
      label: Supplier Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: comment
      label: Comment
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: supplier_category
      label: Supplier Category
      hint: null
      type: select_multiple
      options:
      - Electronics
      - Software
      - Hardware
      - Service
      required: false
    - id: 7
      name: supplier_address
      label: Supplier Address
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: supplier_contact_person
      label: Supplier Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: supplier_rating_date
      label: Supplier Rating Date
      hint: null
      type: date
      options: []
      required: false
