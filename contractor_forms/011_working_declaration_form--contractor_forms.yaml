inputSchema:
  type: object
  properties:
    title: Working Declaration Form
    pages:
    - id: 1
      name: country
      label: country
      hint: null
      type: select_one
      options:
      - Australia
      - Canada
      - France
      - Germany
      - New Zealand
      - Poland
      - Switzerland
      - United Kingdom
      required: false
    - id: 2
      name: date_of_entry
      label: date_of_entry
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: work_type
      label: work_type
      hint: null
      type: select_multiple
      options:
      - type_a
      - type_b
      - type_c
      required: false
    - id: 7
      name: declaration_date
      label: declaration_date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time_of_arrival
      label: time_of_arrival
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: work_hours
      label: work_hours
      hint: null
      type: number
      options: []
      required: false
