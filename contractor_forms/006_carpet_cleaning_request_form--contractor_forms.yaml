inputSchema:
  type: object
  properties:
    title: Carpet Cleaning Request Form
    pages:
    - id: 1
      name: customer_contact_info
      label: -- Customer Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: property_address
      label: Property Address
      hint: Full street address where cleaning is needed
      type: text
      options: []
      required: true
    - id: 6
      name: property_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: property_zip
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: service_details_section
      label: -- Service Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: service_type
      label: Type of Carpet Cleaning Service
      hint: null
      type: select_one
      options:
      - Standard Carpet Cleaning
      - Deep Cleaning
      - Stain Removal
      - Pet Odor Treatment
      - Upholstery Cleaning
      - Tile and Grout Cleaning
      - Multiple Services
      required: true
    - id: 10
      name: area_to_clean
      label: Area to be Cleaned
      hint: null
      type: select_multiple
      options:
      - Living Room
      - Bedrooms
      - Hallways
      - Stairs
      - Bathrooms
      - Kitchen
      - Entire Home
      - Commercial Space
      required: true
    - id: 11
      name: square_footage
      label: Approximate Square Footage
      hint: Total area to be cleaned
      type: text
      options: []
      required: false
    - id: 12
      name: carpet_condition
      label: Current Carpet Condition
      hint: null
      type: select_one
      options:
      - Good - Light dirt
      - Fair - Moderate soiling
      - Poor - Heavy dirt or stains
      - Unknown
      required: true
    - id: 13
      name: special_issues
      label: Any Special Issues or Concerns?
      hint: Describe stains, odors, or damage
      type: text
      options: []
      required: false
    - id: 14
      name: pets_in_home
      label: Do you have pets?
      hint: null
      type: select_one
      options:
      - Yes, dogs
      - Yes, cats
      - Yes, other
      - No pets
      required: true
    - id: 15
      name: scheduling_section
      label: -- Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: preferred_service_date
      label: Preferred Service Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 17
      name: time_preference
      label: Preferred Time Window
      hint: null
      type: select_one
      options:
      - Morning (8am - 12pm)
      - Afternoon (12pm - 4pm)
      - Evening (4pm - 8pm)
      - Any time is fine
      required: true
    - id: 18
      name: access_instructions
      label: Special Access Instructions
      hint: Gate codes, key locations, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: service_requirements
      label: -- Service Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: moving_furniture
      label: Do you want furniture moved during cleaning?
      hint: null
      type: select_one
      options:
      - Yes, move all furniture
      - Yes, move some furniture
      - No, do not move furniture
      required: true
    - id: 21
      name: eco_friendly_products
      label: Would you prefer eco-friendly cleaning products?
      hint: null
      type: select_one
      options:
      - Yes, preferred
      - Yes, required
      - No preference
      - No, use standard products
      required: true
    - id: 22
      name: additional_services
      label: Additional Services Needed?
      hint: null
      type: select_multiple
      options:
      - Carpet protection treatment
      - Deodorizing
      - Scotchgard application
      - Tile sealing
      - None
      required: false
    - id: 23
      name: payment_section
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: budget_estimate
      label: Do you have a budget in mind?
      hint: null
      type: select_one
      options:
      - Under $100
      - $100 - $250
      - $250 - $500
      - $500 - $1000
      - Over $1000
      - Open to quotes
      required: false
    - id: 25
      name: additional_notes
      label: Additional Notes or Questions
      hint: null
      type: text
      options: []
      required: false
