      - Weekly
      - Bi-Weekly
      - Monthly
      required: false
    - id: 12
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
