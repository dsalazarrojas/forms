inputSchema:
  type: object
  properties:
    title: Christmas Gifts Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer name
      hint: Full name as it should appear on the order
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email address
      hint: Provide a valid email for order confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone number
      hint: Optional contact number for delivery questions
      type: text
      options: []
      required: false
    - id: 4
      name: shipping_address
      label: Shipping address
      hint: Street address, city, state, postal code
      type: text
      options: []
      required: true
    - id: 5
      name: gift_selection
      label: Gift selection
      hint: Choose the gift package you want to order
      type: select_one
      options:
      - Classic gift box
      - Deluxe gift basket
      - Children gift set
      - Handcrafted ornaments
      required: true
    - id: 6
      name: quantity
      label: Quantity
      hint: Number of identical gift items
      type: number
      options: []
      required: true
    - id: 7
      name: gift_message
      label: Gift message
      hint: Short personalized message to include with the gift or null
      type: text
      options: []
      required: false
    - id: 8
      name: delivery_date
      label: Preferred delivery date
      hint: Choose desired delivery date or leave blank for standard shipping
      type: date
      options: []
      required: false
    - id: 9
      name: payment_method
      label: Payment method
      hint: Select your payment option
      type: select_one
      options:
      - Credit card
      - PayPal
      - Bank transfer
      required: true
    - id: 10
      name: special_instructions
      label: Special instructions
      hint: Any delivery or packaging requests or null
      type: text
      options: []
      required: false
