inputSchema:
  type: object
  properties:
    title: Christmas Assistance Application Form
    pages:
    - id: 1
      name: applicant_information
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: application_date
      label: Application Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: household_info
      label: -- Household Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: household_size
      label: Household Size (number of people)
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: children_count
      label: Number of Children in Household
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: ages_of_children
      label: Ages of Children
      hint: Comma-separated list (e.g., 4, 7, 12)
      type: text
      options: []
      required: false
    - id: 11
      name: income_info
      label: -- Financial Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: annual_household_income
      label: Annual Household Income
      hint: null
      type: select_one
      options:
      - Under $10,000
      - $10,000 - $20,000
      - $20,000 - $30,000
      - $30,000 - $50,000
      - Over $50,000
      required: true
    - id: 13
      name: housing_status
      label: Housing Status
      hint: null
      type: select_one
      options:
      - Own home
      - Renting
      - Living with family
      - Homeless/Transitional
      - Other
      required: true
    - id: 14
      name: financial_hardships
      label: Current Financial Hardships
      hint: Select all that apply
      type: select_multiple
      options:
      - Job loss or reduced income
      - Medical emergency
      - Housing insecurity
      - Food insecurity
      - Unexpected expenses
      - Other
      required: true
    - id: 15
      name: assistance_needed
      label: -- Assistance Needed --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: assistance_types
      label: What type of assistance does your family need this Christmas?
      hint: Select all that apply
      type: select_multiple
      options:
      - Holiday gifts for children
      - Food/groceries
      - Utility assistance
      - Clothing
      - Household items
      - Other
      required: true
    - id: 17
      name: priority_needs
      label: What are your most urgent needs?
      hint: Help us prioritize assistance
      type: text
      options: []
      required: true
    - id: 18
      name: additional_information
      label: Is there any other information we should know?
      hint: Optional
      type: text
      options: []
      required: false
