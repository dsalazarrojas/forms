inputSchema:
  type: object
  properties:
    title: Christmas Market Stallholder Application Form
    pages:
    - id: 1
      name: business_name
      label: Business or Trading Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_person
      label: Primary Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: business_address
      label: Business Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: product_category
      label: Product Category
      hint: null
      type: select_multiple
      options:
      - Handmade Crafts
      - Food and Drink
      - Jewelry
      - Clothing
      - Art and Photography
      - Christmas Decorations
      required: true
    - id: 7
      name: product_description
      label: Detailed Description of Products
      hint: Please list the main items you intend to sell
      type: text
      options: []
      required: true
    - id: 8
      name: stall_type
      label: Required Stall Type
      hint: null
      type: select_one
      options:
      - Indoor Trestle Table
      - Outdoor Gazebo - 3m x 3m
      - Outdoor Gazebo - 6m x 3m
      - Food Truck Space
      required: true
    - id: 9
      name: power_requirement
      label: Do you require electricity?
      hint: Additional fees may apply
      type: select_one
      options:
      - No Power Required
      - Single 10amp Socket
      - Double 10amp Socket
      - 15amp Socket
      required: true
    - id: 10
      name: health_safety_certs
      label: Public Liability Insurance and Health Certificates
      hint: Do you have valid documentation?
      type: select_one
      options:
      - Yes - All documents ready
      - No - Will provide before event
      required: true
    - id: 11
      name: social_media_links
      label: Website or Social Media Links
      hint: To help us promote your stall
      type: text
      options: []
      required: false
    - id: 12
      name: dietary_info
      label: If selling food - specify dietary options
      hint: e.g., Vegan, Gluten Free, Nut Free
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten Free
      - Dairy Free
      - Nut Free
      required: false
    - id: 13
      name: previous_markets
      label: List any previous markets you have attended
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: special_requests
      label: Special Requests or Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: agreement_terms
      label: I agree to the Christmas Market Terms and Conditions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
