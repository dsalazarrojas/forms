inputSchema:
  type: object
  properties:
    title: Christmas Cheer Appointment Survey
    pages:
    - id: 1
      name: respondent_info
      label: -- Your Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: appointment_details
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: appointment_type
      label: Type of Appointment
      hint: null
      type: select_one
      options:
      - Holiday photo session
      - Holiday gift consultation
      - Party planning meeting
      - Decoration consultation
      - Event coordination
      - Other
      required: true
    - id: 10
      name: location
      label: Appointment Location
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: feedback_section
      label: -- Feedback & Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: overall_satisfaction
      label: How satisfied were you with your appointment?
      hint: null
      type: select_one
      options:
      - Extremely satisfied
      - Very satisfied
      - Satisfied
      - Somewhat satisfied
      - Not satisfied
      required: true
    - id: 13
      name: staff_professionalism
      label: How would you rate the staff professionalism?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: expectations_met
      label: Were your expectations met?
      hint: null
      type: select_one
      options:
      - Exceeded expectations
      - Met expectations
      - Somewhat met expectations
      - Did not meet expectations
      required: true
    - id: 15
      name: would_return
      label: Would you schedule another appointment?
      hint: null
      type: select_one
      options:
      - Definitely yes
      - Probably yes
      - Maybe
      - Probably no
      - Definitely no
      required: true
    - id: 16
      name: services_section
      label: -- Services Provided --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: services_received
      label: Which services did you receive? (Select all that apply)
      hint: null
      type: select_multiple
      options:
      - Consultation
      - Planning assistance
      - Design recommendations
      - Sourcing materials
      - On-site coordination
      - Follow-up support
      required: false
    - id: 18
      name: improvement_areas
      label: What could be improved?
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments or Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: future_services
      label: Would you be interested in future holiday services?
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Yes, maybe
      - No, thank you
      required: false
