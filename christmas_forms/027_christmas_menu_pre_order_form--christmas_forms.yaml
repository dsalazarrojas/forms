inputSchema:
  type: object
  properties:
    title: Christmas Menu Pre Order Form
    pages:
    - id: 1
      name: customer_info
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: party_info
      label: -- Party Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: party_size
      label: Party Size (number of people)
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: dining_type
      label: Type of Service
      hint: null
      type: select_one
      options:
      - Dine-in
      - Takeout
      - Catering
      - Delivery
      required: true
    - id: 11
      name: menu_selection
      label: -- Menu Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: menu_type
      label: Menu Package
      hint: null
      type: select_one
      options:
      - Traditional Christmas
      - Premium Holiday
      - Gourmet Selection
      - Vegetarian Special
      - Mixed Menu
      - Custom
      required: true
    - id: 13
      name: main_course
      label: Main Course Selection
      hint: null
      type: select_one
      options:
      - Turkey
      - Ham
      - Prime rib
      - Chicken
      - Fish
      - Mixed selections
      - Vegetarian option
      required: true
    - id: 14
      name: side_dishes
      label: Side Dishes (Select all that apply)
      hint: null
      type: select_multiple
      options:
      - Stuffing
      - Mashed potatoes
      - Cranberry sauce
      - Vegetables
      - Rolls or bread
      - Gravy
      - Sweet potatoes
      required: false
    - id: 15
      name: appetizers
      label: Appetizers
      hint: null
      type: select_multiple
      options:
      - Shrimp cocktail
      - Cheese platter
      - Vegetable tray
      - Fruit platter
      - Bruschetta
      - None
      required: false
    - id: 16
      name: desserts
      label: Dessert Selection
      hint: null
      type: select_one
      options:
      - Pie assortment
      - Cake
      - Pudding
      - Cookie platter
      - Mixed desserts
      - None
      required: false
    - id: 17
      name: beverages
      label: Beverages
      hint: null
      type: select_multiple
      options:
      - Soft drinks
      - Wine
      - Champagne
      - Coffee and tea
      - Eggnog
      - Beer
      - None
      required: false
    - id: 18
      name: dietary_needs
      label: -- Dietary Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Select all that apply
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-free
      - Nut allergies
      - Shellfish allergies
      - Dairy-free
      required: false
    - id: 20
      name: allergy_details
      label: Allergy or Dietary Details
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: special_requests
      label: Special Requests or Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: delivery_section
      label: -- Delivery Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: setup_service
      label: Setup Service Needed
      hint: null
      type: select_one
      options:
      - Yes, full setup
      - Yes, partial setup
      - No setup needed
      required: false
