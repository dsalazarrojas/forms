inputSchema:
  type: object
  properties:
    title: Christmas Musical Application Form
    pages:
    - id: 1
      name: header_personal_info
      label: -- Applicant Contact Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - Child (under 12)
      - Teen (13-17)
      - Adult (18-64)
      - Senior (65+)
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: For rehearsal schedules and updates
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Primary Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: header_audition_info
      label: -- Audition and Role Interests --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: roles_of_interest
      label: Roles of Interest
      hint: Select all that apply
      type: select_multiple
      options:
      - Main Cast (Singing/Acting)
      - Ensemble
      - Dancer
      - Backstage Crew
      - Musician (Orchestra)
      required: true
    - id: 8
      name: vocal_range
      label: Vocal Range (if singing)
      hint: null
      type: select_one
      options:
      - Soprano
      - Alto
      - Tenor
      - Bass
      - Baritone
      - Mezzo-Soprano
      required: false
    - id: 9
      name: previous_experience
      label: Summary of Previous Performance Experience
      hint: Include any school or community theater roles
      type: text
      options: []
      required: false
    - id: 10
      name: musical_instruments
      label: Do you play any instruments?
      hint: If yes, please specify instruments and skill level
      type: text
      options: []
      required: false
    - id: 11
      name: header_availability
      label: -- Availability and Commitment --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: rehearsal_availability
      label: Available for Weekly Rehearsals (Tues/Thurs 6-8pm)
      hint: null
      type: select_one
      options:
      - true
      - false
      - Partially (provide details below)
      required: true
    - id: 13
      name: availability_notes
      label: Specific Date Conflicts
      hint: List any dates you cannot attend
      type: text
      options: []
      required: false
    - id: 14
      name: t_shirt_size
      label: Cast T-Shirt Size
      hint: null
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      required: true
    - id: 15
      name: medical_emergency_info
      label: Any Medical Conditions or Allergies
      hint: For emergency use during rehearsals and performances
      type: text
      options: []
      required: false
    - id: 16
      name: photo_release
      label: I consent to photography for promotional purposes
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
