      name: dietary_restrictions_count
      label: Guests with Dietary Restrictions
      hint: null
      type: number
      options: []
      required: false
    - id: 18
      name: dietary_types
      label: Types of Dietary Restrictions
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-free
      - Nut allergies
      - Shellfish allergies
      - Other
      required: false
    - id: 19
      name: decorations_section
