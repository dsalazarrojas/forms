inputSchema:
  type: object
  properties:
    title: Christmas Dinner Planner Form
    pages:
    - id: 1
      name: event_info
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: host_name
      label: Host Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: dinner_date
      label: Dinner Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: dinner_time
      label: Dinner Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: guest_planning
      label: -- Guest Planning --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: expected_guests
      label: Expected Number of Guests
      hint: null
      type: number
      options: []
      required: true
