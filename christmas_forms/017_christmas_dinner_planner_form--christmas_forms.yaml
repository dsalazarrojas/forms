    - id: 24
      name: music
      label: Music or Background Audio
      hint: null
      type: select_one
      options:
      - Live music
      - Playlist
      - Carolers
      - None
      required: false
    - id: 25
      name: special_notes
      label: Special Notes or Additional Details
      hint: null
      type: text
      options: []
      required: false
