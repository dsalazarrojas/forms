      name: dining_style
      label: Dining Style
      hint: null
      type: select_one
      options:
      - Formal sit-down dinner
      - Casual dining
      - Buffet style
      - Family style
      - Potluck
      required: true
    - id: 12
      name: menu_planning
      label: -- Menu Planning --
      hint: null
      type: note
      options: []
      required: false
