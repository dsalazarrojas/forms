inputSchema:
  type: object
  properties:
    title: Book Order Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Full name of the buyer
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: We will send the order confirmation here
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: Contact number for order updates
      type: text
      options: []
      required: false
    - id: 4
      name: book_title
      label: Book Title
      hint: Title of the book you wish to order
      type: text
      options: []
      required: true
    - id: 5
      name: book_author
      label: Author Name
      hint: Author of the book
      type: text
      options: []
      required: true
    - id: 6
      name: isbn_number
      label: ISBN Number
      hint: ISBN to ensure correct edition
      type: text
      options: []
      required: false
    - id: 7
      name: edition_type
      label: Edition Type
      hint: Which edition do you prefer
      type: select_one
      options:
      - Hardcover
      - Paperback
      - E-book
      - Audiobook
      required: true
    - id: 8
      name: quantity
      label: Quantity to Order
      hint: How many copies
      type: number
      options: []
      required: true
    - id: 9
      name: unit_price
      label: Unit Price
      hint: Price per copy
      type: number
      options: []
      required: true
    - id: 10
      name: shipping_address
      label: Shipping Address
      hint: Full delivery address
      type: text
      options: []
      required: true
    - id: 11
      name: shipping_method
      label: Shipping Method
      hint: How would you like the books shipped
      type: select_one
      options:
      - Standard Shipping
      - Express Shipping
      - Overnight Delivery
      - Local Pickup
      required: true
    - id: 12
      name: payment_method
      label: Payment Method
      hint: How will you pay for this order
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - PayPal
      - Bank Transfer
      - Check
      required: true
    - id: 13
      name: special_instructions
      label: Special Instructions
      hint: Any special requests or notes about your order
      type: text
      options: []
      required: false
