      - Credit Card
      - PayPal
      required: false
    - id: 4
      name: donor_name
      label: Donor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: donor_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: donor_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: donation_date
      label: donation_date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: merchant_name
      label: Merchant
      hint: null
      type: text
      options: []
      required: false
