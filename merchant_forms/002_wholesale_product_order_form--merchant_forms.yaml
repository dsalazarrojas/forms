inputSchema:
  type: object
  properties:
    title: Wholesale Product Order Form
    pages:
    - id: 1
      name: order_form
      label: Order Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_details
      label: Product Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: order_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: order_total
      label: Total
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - PayPal
      - Credit Card
      required: false
    - id: 8
      name: merchant_notes
      label: Merchant Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: order_status
      label: Status
      hint: null
      type: select_multiple
      options:
      - pending
      - pending payment
      - pending ship
      - on hold
      - shipped
      - cancelled
      required: false
    - id: 12
      name: customer_order_number
      label: Customer Order Number
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: order_form_submitted
      label: Order Form Submitted
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
