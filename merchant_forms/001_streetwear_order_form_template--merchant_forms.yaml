      - Hoodie
      - Hat
      required: false
    - id: 6
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: merchant_notes
      label: Merchant Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - PayPal
      required: false
    - id: 11
      name: total_amount
      label: Total Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - chatjimmy
      - johndoe
      required: false
