      label: Customer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: address
      label: Customer Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
