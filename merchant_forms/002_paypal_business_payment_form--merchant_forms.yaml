inputSchema:
  type: object
  properties:
    title: paypal_business_payment_form
    pages:
    - id: 1
      name: merchant_email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 2
      name: product_name
      label: product name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: product_price
      label: product price
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: product_quantity
      label: product quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: shipping_price
      label: shipping price
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: shipping_address
      label: shipping address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: payment_method
      label: payment method
      hint: null
      type: select_one
      options:
      - paypal
      - stripe
      - square
      required: true
    - id: 8
      name: order_details
      label: order details
      hint: null
      type: text
      options: []
