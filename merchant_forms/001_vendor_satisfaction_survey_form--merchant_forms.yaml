inputSchema:
  type: object
  properties:
    title: vendor_satisfaction_survey_form
    pages:
    - id: 1
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: questions
      label: Questions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: comments
      label: Comments
      hint: Please provide your thoughts on the vendor's performance.
      type: text
      options: []
      required: true
    - id: 4
      name: rating_vendor
      label: Rating for Vendor
      hint: Rate your experience with this vendor from 1-5
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 5
      name: rating_quality
      label: Rating for Quality of Service
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 6
      name: rating_response_time
      label: Rating for Response Time
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 7
      name: rating_price
      label: Rating for Price
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: Provide any additional comments or suggestions for the vendor.
      type: note
      options: []
      required: false
