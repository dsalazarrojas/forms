inputSchema:
  type: object
  properties:
    title: Clothing Order Form Template WorldPay UK
    pages:
    - id: 1
      name: customer_name
      label: Customer Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: Order confirmation will be sent here
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: delivery_address
      label: Delivery Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 5
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: postcode
      label: Postcode
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: item_selection
      label: Select Items
      hint: Choose clothing items to purchase
      type: select_multiple
      options:
      - Mens T-Shirts
      - Womens T-Shirts
      - Mens Jeans
      - Womens Jeans
      - Hoodies
      - Jackets
      - Dresses
      required: true
    - id: 8
      name: shirt_size
      label: Shirt Size
      hint: null
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      required: false
    - id: 9
      name: shirt_color
      label: Shirt Color Preference
      hint: null
      type: select_one
      options:
      - Black
      - White
      - Navy
      - Grey
      - Red
      - Other
      required: false
    - id: 10
      name: quantity_shirts
      label: Quantity of Shirts
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: pants_size
      label: Pants Size
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: quantity_pants
      label: Quantity of Pants
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: subtotal
      label: Order Subtotal
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: delivery_method
      label: Delivery Method
      hint: Select shipping option
      type: select_one
      options:
      - Standard Delivery
      - Express Delivery
      - Next Day Delivery
      required: true
    - id: 15
      name: payment_confirmation
      label: Accept Terms and Conditions
      hint: I agree to the terms and conditions
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 16
      name: special_requests
      label: Special Requests or Instructions
      hint: Any special delivery or product requests
      type: text
      options: []
      required: false
