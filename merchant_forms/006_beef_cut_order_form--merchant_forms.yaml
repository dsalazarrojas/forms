inputSchema:
  type: object
  properties:
    title: Beef Cut Order Form
    pages:
    - id: 1
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Customer Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: delivery_address
      label: Delivery Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: desired_delivery_date
      label: Desired Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: beef_grade
      label: Beef Grade
      hint: Select quality grade
      type: select_one
      options:
      - Prime
      - Choice
      - Select
      - Standard
      required: true
    - id: 8
      name: cut_type_1
      label: First Cut Type
      hint: null
      type: select_one
      options:
      - Ribeye Steak
      - New York Strip
      - Filet Mignon
      - T-Bone Steak
      - Sirloin Steak
      - Chuck Roast
      - Brisket
      - Ground Beef
      - Short Ribs
      - Other
      required: true
    - id: 9
      name: quantity_1
      label: Quantity of First Cut
      hint: In pounds
      type: number
      options: []
      required: true
    - id: 10
      name: cut_type_2
      label: Second Cut Type
      hint: null
      type: select_one
      options:
      - Ribeye Steak
      - New York Strip
      - Filet Mignon
      - T-Bone Steak
      - Sirloin Steak
      - Chuck Roast
      - Brisket
      - Ground Beef
      - Short Ribs
      - Other
      required: false
    - id: 11
      name: quantity_2
      label: Quantity of Second Cut
      hint: In pounds
      type: number
      options: []
      required: false
    - id: 12
      name: cut_type_3
      label: Third Cut Type
      hint: null
      type: select_one
      options:
      - Ribeye Steak
      - New York Strip
      - Filet Mignon
      - T-Bone Steak
      - Sirloin Steak
      - Chuck Roast
      - Brisket
      - Ground Beef
      - Short Ribs
      - Other
      required: false
    - id: 13
      name: quantity_3
      label: Quantity of Third Cut
      hint: In pounds
      type: number
      options: []
      required: false
    - id: 14
      name: special_requests
      label: Special Requests or Instructions
      hint: Custom cuts, thickness preferences, etc.
      type: text
      options: []
      required: false
    - id: 15
      name: packaging_preference
      label: Packaging Preference
      hint: null
      type: select_one
      options:
      - Vacuum Sealed
      - Paper Wrapped
      - Individual Steaks
      - Bulk Package
      required: true
    - id: 16
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Credit Card
      - Debit Card
      - Check
      - Bank Transfer
      required: true
    - id: 17
      name: total_estimated_cost
      label: Estimated Total Cost
      hint: Dollar amount
      type: number
      options: []
      required: false
