inputSchema:
  type: object
  properties:
    title: Team T Shirt Order Form
    pages:
    - id: 1
      name: order_info
      label: team_t_shirt_order_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_tshirt_details
      label: t_shirt_details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: order_total
      label: order_total
      hint: T-shirt price will be shown here.
      type: number
      options: []
      required: false
    - id: 4
      name: t_shirt_quantity
      label: t_shirt_quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: t_shirt_size
      label: t_shirt_size
