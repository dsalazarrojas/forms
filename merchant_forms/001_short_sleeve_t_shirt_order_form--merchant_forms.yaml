inputSchema:
  type: object
  properties:
    title: short_sleeve_t_shirt_order_form
    pages:
    - id: 1
      name: name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: payment_gateway
      label: Payment Gateway
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Bank Transfer
      required: true
    - id: 6
      name: t_shirt_size
      label: T Shirt Size
      hint: null
      type: select_multiple
      options:
      - small
      - medium
      - large
      required: true
    - id: 7
      name: product
      label: Product
      hint: null
      type: select_multiple
      options:
      - -.reporter - designer - t shirt
      - Other
      required: true
    - id: 8
      name: order_quantity
      label: Order Quantity
      hint: null
      type: number
      options: []
      required: true
