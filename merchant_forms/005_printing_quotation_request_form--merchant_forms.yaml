inputSchema:
  type: object
  properties:
    title: Printing Quotation Request Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: paper_size
      label: Paper Size
      hint: null
      type: select_multiple
      options:
      - A4
      - Letter
      - Legal
      - Tabloid
      required: false
    - id: 6
      name: paper_orientation
      label: Paper Orientation
      hint: null
      type: select_multiple
      options:
      - Portrait
      - Landscape
      required: false
    - id: 7
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: color
      label: Color
      hint: null
      type: select_multiple
      options:
      - Black
      - White
      - Color
      required: false
    - id: 9
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
