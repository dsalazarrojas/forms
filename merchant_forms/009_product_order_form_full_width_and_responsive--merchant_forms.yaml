inputSchema:
  type: object
  properties:
    title: Product Order Form Full Width And Responsive
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: special_requests
      label: Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: delivery_method
      label: Delivery Method
      hint: null
      type: select_one
      options:
      - In-store pickup
      - Delivery
      - Pickup
      required: true
    - id: 10
      name: select_multiple_options
      label: Select Multiple Options
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 11
      name: confirm_select_multiple
      label: Confirm Select Multiple Options
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
