inputSchema:
  type: object
  properties:
    title: Custom T Shirt Order Form Template
    pages:
    - id: 1
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: tshirt_info
      label: T-Shirt Info
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Payment Method
      - Other
      required: false
    - id: 5
      name: tshirt_design
      label: T-Shirt Design
      hint: null
      type: select_multiple
      options:
      - Red T-Shirt
      - Blue T-Shirt
      - Green T-Shirt
      required: false
    - id: 6
      name: tshirt_size
      label: T-Shirt Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 7
      name: tshirt_color
      label: T-Shirt Color
      hint: null
      type: select_one
      options:
      - Red
      - Blue
      - White
      required: false
    - id: 8
      name: tshirt_style
      label: T-Shirt Style
      hint: null
      type: select_one
      options:
      - Classic
      - Crew
      - Hoodie
      required: false
    - id: 9
      name: tshirt_material
      label: T-Shirt Material
      hint: null
      type: select_one
      options:
      - Cotton
      - Polyester
      - Blend
      required: false
    - id: 10
      name: customer_notes
      label: Customer Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: order_notes
      label: Order Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: tshirt_price
      label: T-Shirt Price
      hint: null
      type: number
      options: []
      required: false
