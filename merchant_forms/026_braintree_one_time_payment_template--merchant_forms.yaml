inputSchema:
  type: object
  properties:
    title: Braintree One Time Payment Template
    pages:
    - id: 1
      name: section_header_customer
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Customer first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Customer last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: For receipt and communication
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Contact information
      type: text
      options: []
      required: false
    - id: 6
      name: section_header_payment
      label: -- Payment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: payment_amount
      label: Payment Amount
      hint: Total amount in dollars
      type: number
      options: []
      required: true
    - id: 8
      name: payment_description
      label: Payment Description
      hint: What is being paid for
      type: text
      options: []
      required: false
    - id: 9
      name: invoice_number
      label: Invoice Number
      hint: Reference number
      type: text
      options: []
      required: false
    - id: 10
      name: section_header_items
      label: -- Order Items --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: item_description
