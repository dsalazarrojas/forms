      hint: What you are purchasing
      type: text
      options: []
      required: true
    - id: 12
      name: quantity
      label: Quantity
      hint: How many units
      type: number
      options: []
      required: true
    - id: 13
      name: unit_price
      label: Unit Price
      hint: Price per unit
      type: number
      options: []
      required: true
    - id: 14
      name: section_header_billing
      label: -- Billing Address --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: street_address
      label: Street Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 16
      name: city
      label: City
      hint: City name
      type: text
      options: []
      required: true
    - id: 17
      name: state_province
      label: State or Province
      hint: State or province code
      type: text
      options: []
      required: true
    - id: 18
      name: zip_code
      label: ZIP or Postal Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 19
      name: country
      label: Country
      hint: Country of residence
      type: text
      options: []
      required: true
    - id: 20
      name: section_header_confirmation
      label: -- Payment Confirmation --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: payment_confirmation
      label: I authorize this payment
      hint: Check to proceed with payment
      type: select_one
      options:
      - I authorize payment
      - Cancel payment
      required: true
