inputSchema:
  type: object
  properties:
    title: Insurance Binder Request Form
    pages:
    - id: 1
      name: insurance_binder_request_form
      label: Request Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: request_type
      label: type_of_request
      hint: null
      type: select_one
      options:
      - New Business
      - New Renewal
      - Other
      required: false
    - id: 3
      name: insurance_company
      label: insurance_company
      hint: Please provide the name of the insurance company.
      type: select_multiple
      options:
      - Company A
      - Company B
      - Company C
      required: false
    - id: 4
      name: policy_number
      label: policy_number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: policy_effective_date
      label: policy_effective_date
      hint: null
