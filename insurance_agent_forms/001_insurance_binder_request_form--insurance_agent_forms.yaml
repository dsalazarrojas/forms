      options: []
      required: false
    - id: 6
      name: policy_expiration_date
      label: policy_expiration_date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: policy_term
      label: policy_term
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Biannually
      - Annually
      required: false
    - id: 8
      name: policy_anniversary
      label: policy_anniversary
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: policy_premium
      label: policy_premium
      hint: null
      type: number
      options: []
      required: false
