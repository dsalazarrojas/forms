      name: policy_commission
      label: policy_commission
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: agent_name
      label: agent_name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: agent_address
      label: agent_address
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: agent_phone
      label: agent_phone
      hint: null
      type: text
      options: []
      required: false
