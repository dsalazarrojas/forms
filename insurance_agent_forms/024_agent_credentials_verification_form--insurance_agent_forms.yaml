inputSchema:
  type: object
  properties:
    title: Agent Credentials Verification Form
    pages:
    - id: 1
      name: agent_full_name
      label: Agent Full Name
      hint: Enter the full legal name of the insurance agent
      type: text
      options: []
      required: true
    - id: 2
      name: agent_id_number
      label: Agent ID Number
      hint: Enter the unique identifier assigned to the agent
      type: text
      options: []
      required: true
    - id: 3
      name: agent_email
      label: Agent Email
      hint: Enter the agent's official email address
      type: email
      options: []
      required: true
    - id: 4
      name: agent_phone
      label: Agent Phone
      hint: Enter the agent's phone number
      type: text
      options: []
      required: true
    - id: 5
      name: agent_address
      label: Agent Address
      hint: Enter the agent's business address
      type: text
      options: []
      required: true
    - id: 6
      name: license_information_header
      label: -- License Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: insurance_license_number
      label: Insurance License Number
      hint: Enter the agent's insurance license number
      type: text
      options: []
      required: true
    - id: 8
      name: license_issue_date
      label: License Issue Date
      hint: Enter the date when the license was issued
      type: date
      options: []
      required: true
    - id: 9
      name: license_expiry_date
      label: License Expiry Date
      hint: Enter the date when the license expires
      type: date
      options: []
      required: true
    - id: 10
      name: licensing_state_jurisdiction
      label: Licensing State/Jurisdiction
      hint: Enter the state or jurisdiction that issued the license
      type: text
      options: []
      required: true
    - id: 11
      name: education_qualifications_header
      label: -- Education and Qualifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: highest_education_level
      label: Highest Education Level
      hint: Select the agent's highest level of education
      type: select_one
      options:
      - High School Diploma
      - Associate Degree
      - Bachelor's Degree
      - Master's Degree
      - Doctorate
      - Other
      required: true
    - id: 13
      name: degree_field
      label: Degree Field
      hint: Enter the field of study if applicable
      type: text
      options: []
      required: false
    - id: 14
      name: professional_certifications
      label: Professional Certifications
      hint: List any professional certifications held by the agent
      type: text
      options: []
      required: false
    - id: 15
      name: continuing_education_credits
      label: Continuing Education Credits
      hint: Enter the number of continuing education credits completed
      type: number
      options: []
      required: false
    - id: 16
      name: employment_history_header
      label: -- Employment History --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: current_employer
      label: Current Employer
      hint: Enter the name of the agent's current employer
      type: text
      options: []
      required: true
    - id: 18
      name: employment_start_date
      label: Employment Start Date
      hint: Enter the date when the agent started with the current employer
      type: date
      options: []
      required: true
    - id: 19
      name: previous_employers
      label: Previous Employers
      hint: List previous employers in the insurance industry
      type: text
      options: []
      required: false
    - id: 20
      name: credentials_verification_status
      label: Credentials Verification Status
      hint: What is the current status of credential verification?
      type: select_one
      options:
      - Verified
      - Pending Verification
      - Requires Additional Documentation
      - Verification Failed
      required: true
    - id: 21
      name: verification_officer_name
      label: Verification Officer Name
      hint: Enter the name of the officer conducting the verification
      type: text
      options: []
      required: false
    - id: 22
      name: verification_date
      label: Verification Date
      hint: Enter the date when verification was completed
      type: date
      options: []
      required: false
    - id: 23
      name: additional_notes
      label: Additional Notes
      hint: Any additional notes about the credential verification
      type: text
      options: []
      required: false
