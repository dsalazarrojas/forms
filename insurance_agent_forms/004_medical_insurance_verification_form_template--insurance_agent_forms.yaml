inputSchema:
  type: object
  properties:
    title: Medical Insurance Verification Form Template
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: insurance_plan
      label: Insurance Plan
      hint: null
      type: select_one
      options:
      - Plan A
      - Plan B
      - Plan C
      required: true
    - id: 3
      name: policy_number
      label: Policy Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: group_number
      label: Group Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: coverage_start_date
      label: Coverage Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: coverage_end_date
      label: Coverage End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: policy_type
      label: Policy Type
      hint: null
      type: select_one
      options:
      - Individual
      - Group
      - Family
      required: true
    - id: 8
      name: policy_status
      label: Policy Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: true
    - id: 9
      name: coverage_details
      label: Coverage Details
      hint: null
      type: note
      options: []
      required: true
