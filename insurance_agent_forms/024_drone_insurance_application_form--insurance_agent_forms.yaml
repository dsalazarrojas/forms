inputSchema:
  type: object
  properties:
    title: Drone Insurance Application Form
    pages:
    - id: 1
      name: user_info
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: license_number
      label: License Number
      hint: Driver License Number
      type: text
      options: []
      required: false
    - id: 7
      name: insurance_type
      label: Insurance Type
      hint: Select Insurance Type
      type: select_one
      options:
      - Aerial
      - Ground
      - Both
      required: false
