      name: coverage_amount
      label: Coverage Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: coverage_duration
      label: Coverage Duration
      hint: null
      type: select_one
      options:
      - Daily
      - Monthly
      - Yearly
      required: false
    - id: 11
      name: coverage_start_date
      label: Coverage Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: coverage_end_date
      label: Coverage End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: insurance_company
      label: Insurance Company
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: agent_name
      label: Agent Name
      hint: null
      type: text
      options: []
      required: false
