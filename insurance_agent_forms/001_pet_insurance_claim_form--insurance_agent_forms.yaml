      type: date
      options: []
      required: false
    - id: 7
      name: claim_amount
      label: Claim Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: claim_description
      label: Claim Description
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: claim_expenses
      label: Claim Expenses
      hint: null
      type: select_multiple
