title: Employee morale survey
description: Generate a Employee morale survey survey for the "Employee engagement surveys" category. Use the template name: "Employee morale survey template".
questions:
  - text: Overall, how satisfied are you with employee morale survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Employee, Morale, Survey, Engagement]
  - text: How often do you interact with employee morale survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
