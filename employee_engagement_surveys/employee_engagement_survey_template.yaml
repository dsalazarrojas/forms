description: A confidential survey to gather feedback on your work experience and
  identify areas for enhancing employee engagement.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your role at the organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate communication from management?
  type: single
- options:
  - true
  - false
  - Somewhat
  text: Do you feel supported in your professional development?
  type: single
- options:
  - Collaboration
  - Support
  - Respect
  - Open communication
  - Innovation
  - Work-life balance
  text: What aspects of our company culture do you value most? (Select all that apply)
  type: multiple
- text: What could most improve your experience at work?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: Employee engagement survey
