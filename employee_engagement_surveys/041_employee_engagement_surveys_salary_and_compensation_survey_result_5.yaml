title: Salary and compensation survey
description: Generate a Salary and compensation survey survey for the "Employee engagement surveys" category. Use the template name: "Salary and compensation survey template".
questions:
  - text: Overall, how satisfied are you with salary and compensation survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Salary, And, Compensation, Survey]
  - text: How often do you interact with salary and compensation survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
