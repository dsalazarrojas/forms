title: Professional development survey
description: Generate a Professional development survey survey for the "Employee engagement surveys" category. Use the template name: "Professional development survey template".
questions:
  - text: Overall, how satisfied are you with professional development survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Professional, Development, Survey, Employee]
  - text: How often do you interact with professional development survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
