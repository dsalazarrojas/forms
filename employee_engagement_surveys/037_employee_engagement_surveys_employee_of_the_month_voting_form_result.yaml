title: Employee of the month voting form
description: Generate a Employee of the month voting form survey for the "Employee engagement surveys" category. Use the template name: "Employee of the month voting form template".
questions:
  - text: Overall, how satisfied are you with employee of the month voting form?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Employee, The, Month, Voting]
  - text: How often do you interact with employee of the month voting form?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
