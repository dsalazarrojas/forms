inputSchema:
  type: object
  properties:
    title: Beck Depression Inventory Questionnaire
    pages:
      - id: 1
        name: patient_name
        label: Patient Name
        hint: null
        type: text
        options: []
        required: true
      - id: 2
        name: assessment_date
        label: Assessment Date
        hint: null
        type: date
        options: []
        required: true
      - id: 3
        name: sadness
        label: Sadness - How sad have you been feeling
        hint: null
        type: select_one
        options:
          - I do not feel sad
          - I feel sad much of the time
          - I am sad all the time
          - I am so sad that I cannot bear it
        required: true
      - id: 4
        name: pessimism
        label: Pessimism - About the future
        hint: null
        type: select_one
        options:
          - I am not discouraged about my future
          - I feel more discouraged than usual
          - I do not expect things to work out
          - I expect the worst and my future is hopeless
        required: true
      - id: 5
        name: failure_sense
        label: Sense of Failure
        hint: null
        type: select_one
        options:
          - I do not feel like a failure
          - I have failed more than I should
          - I feel I am a total failure as a person
          - I feel worse about my failures than ever
        required: true
      - id: 6
        name: loss_of_pleasure
        label: Loss of Pleasure
        hint: Enjoyment in things you usually enjoy
        type: select_one
        options:
          - I get as much pleasure as ever
          - I do not enjoy things as much as I used to
          - I get very little pleasure from things
          - I get no pleasure from anything
        required: true
      - id: 7
        name: guilt_feelings
        label: Guilt Feelings
        hint: null
        type: select_one
        options:
          - I do not feel guilty
          - I feel guilty a good part of the time
          - I feel quite guilty most of the time
          - I feel guilty all the time
        required: true
      - id: 8
        name: punishment_feelings
        label: Punishment Feelings
        hint: null
        type: select_one
        options:
          - I do not feel I am being punished
          - I feel I may be punished
          - I expect to be punished
          - I feel I am being punished
        required: true
      - id: 9
        name: self_dislike
        label: Self-Dislike
        hint: null
        type: select_one
        options:
          - I feel the same about myself as ever
          - I have lost confidence in myself
          - I am disappointed with myself
          - I dislike myself
        required: true
      - id: 10
        name: self_criticism
        label: Self-Criticism
        hint: null
        type: select_one
        options:
          - I do not criticize or blame myself
          - I am more critical than usual
          - I criticize myself for all my faults
          - I blame myself for everything
        required: true
      - id: 11
        name: suicidal_thoughts
        label: Suicidal Thoughts or Wishes
        hint: null
        type: select_one
        options:
          - I do not have thoughts of harming myself
          - I have thoughts of harming myself but no intent
          - I would like to kill myself
          - I would kill myself if I had the chance
        required: true
      - id: 12
        name: crying
        label: Crying
        hint: null
        type: select_one
        options:
          - I do not cry any more than usual
          - I cry more now than I used to
          - I cry for slight reasons
          - I feel like crying all the time
        required: true
      - id: 13
        name: agitation
        label: Agitation or Restlessness
        hint: null
        type: select_one
        options:
          - I am no more restless than usual
          - I am more restless than usual
          - I am much more restless
          - I am so restless I have to move
        required: true
      - id: 14
        name: loss_of_interest
        label: Loss of Interest
        hint: In people or activities
        type: select_one
        options:
          - I have not lost interest in other people
          - I am less interested than before
          - I have lost most interest in others
          - I have lost all interest in others
        required: true
      - id: 15
        name: indecisiveness
        label: Indecisiveness
        hint: null
        type: select_one
        options:
          - I make decisions as well as ever
          - I find it more difficult to decide
          - I have much greater difficulty
          - I cannot make any decisions
        required: true
      - id: 16
        name: worthlessness
        label: Worthlessness
        hint: null
        type: select_one
        options:
          - I do not feel worthless
          - I do not consider myself as worthwhile
          - I feel worthless compared to others
          - I feel completely worthless
        required: true
      - id: 17
        name: loss_of_energy
        label: Loss of Energy
        hint: null
        type: select_one
        options:
          - I have as much energy as ever
          - I have less energy than I used to have
          - I do not have enough energy to do much
          - I do not have enough energy for anything
        required: true
      - id: 18
        name: sleep_changes
        label: Changes in Sleep Pattern
        hint: null
        type: select_one
        options:
          - I have not experienced changes in sleep
          - I sleep somewhat less or more than usual
          - I sleep much more or much less
          - I spend most of the day sleeping
        required: true
      - id: 19
        name: irritability
        label: Irritability
        hint: null
        type: select_one
        options:
          - I am no more irritable than usual
          - I am more irritable than usual
          - I am much more irritable than usual
          - I am irritable all the time
        required: true
      - id: 20
        name: appetite_changes
        label: Changes in Appetite
        hint: null
        type: select_one
        options:
          - I have not experienced changes in appetite
          - My appetite is somewhat less or greater
          - My appetite is much less or much greater
          - I have no appetite or constantly hungry
        required: true
      - id: 21
        name: concentration
        label: Difficulty Concentrating
        hint: null
        type: select_one
        options:
          - I can concentrate as well as ever
          - I cannot concentrate as well as usual
          - It is hard to keep my mind on anything
          - I find I cannot concentrate on anything
        required: true
      - id: 22
        name: fatigue
        label: Fatigue or Tiredness
        hint: null
        type: select_one
        options:
          - I am no more tired than usual
          - I get tired more easily
          - I am too tired to do much
          - I am too tired to do anything
        required: true
      - id: 23
        name: loss_of_libido
        label: Loss of Interest in Sex
        hint: null
        type: select_one
        options:
          - I have not noticed a change in interest
          - I am less interested in sex than before
          - I am much less interested in sex
          - I have lost interest in sex
        required: false
      - id: 24
        name: clinician_notes
        label: Clinician Notes
        hint: Additional observations or context
        type: text
        options: []
        required: false
