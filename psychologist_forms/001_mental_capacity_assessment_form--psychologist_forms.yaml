inputSchema:
  type: object
  properties:
    title: Mental Capacity Assessment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: assessment_date
      label: Assessment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: capacity_status
      label: Capacity Status
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: patient_condition
      label: Patient Condition
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: healthcare_provider_name
      label: Healthcare Provider Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: healthcare_provider_license
      label: Healthcare Provider License
      hint: null
      type: text
      options: []
      required: false
