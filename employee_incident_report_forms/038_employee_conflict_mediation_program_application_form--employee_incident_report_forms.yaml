inputSchema:
  type: object
  properties:
    title: Employee Conflict Mediation Program Application Form
    pages:
    - id: 1
      name: conflict_details
      label: Conflict Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_name
      label: employeeName
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: manager_name
      label: managerName
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: conflict_start_date
      label: conflictStart
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: conflict_end_date
      label: conflictEnd
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: mediation_outcome
      label: mediationOutcome
      hint: null
      type: select_one
      options:
      - Conflict Resolved
      - Conflict Ongoing
      - Other
      - Not Applicable
      required: true
    - id: 7
      name: conflict_description
      label: conflictDescription
      hint: Briefly describe the conflict
      type: text
      options: []
      required: false
    - id: 8
      name: manager_consent
