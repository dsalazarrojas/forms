inputSchema:
  type: object
  properties:
    title: Mining Operation Incident Report Form
    pages:
    - id: 1
      name: general_info
      label: General Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_incident
      label: Date of Incident
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: incident_details
      label: Incident Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: supporting_documents
      label: Supporting Documents
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: incident_type
      label: Incident Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: incident_status
      label: Incident Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
