inputSchema:
  type: object
  properties:
    title: HR Case Note Submission
    pages:
    - id: 1
      name: employee_incident_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Enter employee name
      type: text
      options: []
      required: false
    - id: 3
      name: incident_description
      label: Incident Description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: actions_taken
      label: Actions Taken
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: attachments
      label: Attachments
      hint: Attachments
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: case_manager
      label: Case Manager
      hint: null
      type: select_one
      options:
      - Manager 1
      - Manager 2
      required: false
    - id: 7
      name: case_status
      label: Case Status
      hint: null
      type: select_one
      options:
      - Open
      - Closed
      required: false
    - id: 8
      name: case_notes
      label: Case Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: case_date
      label: Case Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: case_time
      label: Case Time
      hint: null
      type: time
      options: []
      required: false
