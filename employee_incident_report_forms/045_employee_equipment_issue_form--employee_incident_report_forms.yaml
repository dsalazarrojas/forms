inputSchema:
  type: object
  properties:
    title: Employee Equipment Issue Form
    pages:
    - id: 1
      name: issue_date
      label: Issue Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: equipment_description
      label: Equipment Description
      hint: Provide detailed description of the equipment issue
      type: text
      options: []
      required: false
    - id: 4
      name: issue_reported
      label: Equipment Issue Reported By
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: issue_type
      label: Issue Type
      hint: null
      type: select_one
      options:
      - Equipment malfunction
      - Equipment damage
      - Other
      required: true
    - id: 6
      name: issue_details
      label: Issue Details
      hint: Please provide detailed information about the issue
      type: text
      options: []
      required: false
    - id: 7
      name: attachment
      label: Attachment
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: issue_status
      label: Issue Status
      hint: null
      type: select_one
      options:
      - Pending
      - Resolved
      - Closed
      required: true
    - id: 9
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: issue_resolved_by
      label: Issue Resolved By
      hint: null
      type: text
      options: []
      required: false
