inputSchema:
  type: object
  properties:
    title: Armidale YJCO Vehicle Use Form
    pages:
    - id: 1
      name: section_user_info
      label: -- User Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: user_name
      label: Driver Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: user_employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: user_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: section_trip_details
      label: -- Trip Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: trip_date
      label: Date of Trip
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: trip_purpose
      label: Purpose of Trip
      hint: null
      type: select_one
      options:
      - Client visit
      - Office meeting
      - Training or conference
      - Staff transport
      - Maintenance errand
      - Other business
      required: true
    - id: 8
      name: trip_destination
      label: Trip Destination
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: trip_start_time
      label: Trip Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: trip_end_time
      label: Trip End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: section_vehicle_info
      label: -- Vehicle Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: vehicle_registration
      label: Vehicle Registration Number
      hint: Plate or VIN
      type: text
      options: []
      required: true
    - id: 13
      name: vehicle_type
      label: Vehicle Type
      hint: null
      type: select_one
      options:
      - Car - sedan
      - SUV or 4WD
      - Van
      - Truck
      - Other
      required: true
    - id: 14
      name: vehicle_odometer_start
      label: Odometer Reading - Start
      hint: Miles or kilometers
      type: number
      options: []
      required: true
    - id: 15
      name: vehicle_odometer_end
      label: Odometer Reading - End
      hint: Miles or kilometers
      type: number
      options: []
      required: true
    - id: 16
      name: section_vehicle_inspection
      label: -- Vehicle Inspection --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: exterior_condition
      label: Exterior condition before use
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 18
      name: interior_condition
      label: Interior condition before use
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 19
      name: fuel_level_start
      label: Fuel level at start
      hint: null
      type: select_one
      options:
      - Full
      - 3/4 full
      - 1/2 full
      - 1/4 full
      - Empty
      required: true
    - id: 20
      name: fuel_level_end
      label: Fuel level at end
      hint: null
      type: select_one
      options:
      - Full
      - 3/4 full
      - 1/2 full
      - 1/4 full
      - Empty
      required: true
    - id: 21
      name: section_damage_report
      label: -- Damage or Incidents --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: damage_noted
      label: Any damage noted during trip
      hint: null
      type: select_one
      options:
      - No damage
      - Minor damage
      - Moderate damage
      - Major damage
      required: true
    - id: 23
      name: damage_description
      label: Description of damage
      hint: Location and nature of damage
      type: text
      options: []
      required: false
    - id: 24
      name: incident_occurred
      label: Any incidents occurred during trip
      hint: null
      type: select_one
      options:
      - false
      - Yes - minor
      - Yes - major
      required: true
    - id: 25
      name: incident_description
      label: Description of incident
      hint: What happened and any parties involved
      type: text
      options: []
      required: false
    - id: 26
      name: section_signature
      label: -- Submission --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: submission_date
      label: Date of Submission
      hint: null
      type: date
      options: []
      required: true
    - id: 28
      name: signature_confirmation
      label: I certify the above information is accurate
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
