inputSchema:
  type: object
  properties:
    title: Post-Surgery Physiotherapy Evaluation Form
    pages:
    - id: 1
      name: patient_info
      label: patient_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: pain_level
      label: pain_level
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: mobility_level
      label: mobility_level
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: pain_location
      label: pain_location
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: pain_location_options
      label: pain location options
      hint: null
      type: select_one
      options:
      - head
      - neck
      - back
      - arms
      - legs
      - stomach
      - hands
      - feet
      required: false
    - id: 6
      name: mobility_level_options
      label: mobility level options
      hint: null
      type: select_one
      options:
      - excellent
      - good
      - fair
      - bad
      required: false
    - id: 7
      name: medication_info
      label: medication_info
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: follow_up_appointments
      label: follow_up_appointments
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: follow_up_appointments_options
      label: follow up appointments options
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
