inputSchema:
  type: object
  properties:
    title: Patient Feedback Form
    pages:
    - id: 1
      name: patient_feedback_form
      label: What was the length of time you waited in the waiting room?
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: doctor_care_provided
      label: How would you rate the doctor's care and professionalism?
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 3
      name: clinic_service
      label: How would you rate the overall service provided?
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: clinic_environment
      label: What was the cleanliness of the clinic's environment?
      hint: null
      type: select_one
      options:
      - Very Clean
      - Somewhat Clean
      - Somewhat Unclean
      - Not Very Clean
      - Not Clean At All
      required: false
    - id: 5
      name: clinic_environment_hygiene
      label: Was the clinic's environment well-maintained?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 6
