inputSchema:
  type: object
  properties:
    title: Outpatient Care Service Assessment Form
    pages:
    - id: 1
      name: patient_feedback
      label: Patient feedback
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: service_date
      label: Service date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: service_time
      label: Service time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: care_provider
      label: Care provider
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: service_quality
      label: Service quality
      hint: null
      type: select_one
      options:
      - Good
      - Poor
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 7
      name: recommendation
      label: Would you recommend this service?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assinged tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 10
      name: category
      label: Category
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: category
      label: Category
      hint: null
      type: text
      options: []
      required: false
