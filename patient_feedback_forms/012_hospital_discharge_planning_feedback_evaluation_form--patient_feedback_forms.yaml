inputSchema:
  type: object
  properties:
    title: Hospital Discharge Planning Feedback Evaluation Form
    pages:
    - id: 1
      name: discharge_planning_form
      label: Discharge Planning Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: experience_rating
      label: Overall Experience Rating
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 3
      name: feedback_questions
      label: What did you find most useful in this discharge planning experience?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_info
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - phone
      - email
      - address
      required: false
    - id: 6
      name: communication_style
      label: How would you rate our communication style?
      hint: null
      type: select_one
      options:
      - very effective
      - somewhat effective
      - not effective
      required: false
    - id: 7
      name: time_spent
      label: Time Spent with the Healthcare Team
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: time_spent_hospital
      label: Time Spent at Hospital
      hint: null
      type: number
      options: []
      required: false
