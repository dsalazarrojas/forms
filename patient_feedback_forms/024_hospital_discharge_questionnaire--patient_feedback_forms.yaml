      hint: Doctor name
      type: text
      options: []
      required: false
    - id: 8
      name: doctor_title
      label: Doctor Title
      hint: Doctor title
      type: text
      options: []
      required: false
    - id: 9
      name: feedback
      label: Feedback
      hint: Additional feedback
      type: note
      options: []
      required: false
    - id: 10
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 11
      name: hospital_name
      label: Hospital Name
      hint: Hospital name
      type: text
      options: []
      required: false
    - id: 12
      name: discharge_date
      label: Discharge Date
      hint: Discharge date
      type: date
      options: []
      required: false
