inputSchema:
  type: object
  properties:
    title: Hospital Discharge Questionnaire
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: First name of patient
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: Last name of patient
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: Patient email address
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
