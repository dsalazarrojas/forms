inputSchema:
  type: object
  properties:
    title: Rare Disease Patient Feedback
    pages:
    - id: 1
      name: disease_name
      label: Rare Disease Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: symptom_management
      label: Symptom Management
      hint: null
      type: select_multiple
      options:
      - Pain
      - Fatigue
      - Nausea
      required: false
    - id: 3
      name: treatment_challenges
      label: Treatment Challenges
      hint: null
      type: select_one
      options:
      - Side effects
      - Cost
      - Access
      required: false
    - id: 4
      name: support_satisfaction
      label: Support Satisfaction
      hint: null
      type: select_one
      options:
      - Very good
      - Somewhat good
      - Not very good
      - Not good at all
      required: false
    - id: 5
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
