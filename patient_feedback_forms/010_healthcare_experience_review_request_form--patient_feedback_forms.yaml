inputSchema:
  type: object
  properties:
    title: Healthcare Experience Review Request Form
    pages:
    - id: 1
      name: patient_feedback
      label: Patient Feedback
      hint: null
      type: select_multiple
      options:
      - Feedback on our office
      - Feedback on our staff
      - Feedback on our services
      required: false
    - id: 2
      name: visit_date
      label: Visit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: staff_name
      label: Staff Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: false
