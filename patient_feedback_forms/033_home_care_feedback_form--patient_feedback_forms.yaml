inputSchema:
  type: object
  properties:
    title: Home Care Feedback Form
    pages:
    - id: 1
      name: home_care_feedback
      label: Home Care Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: experience_level
      label: Experience Level
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: communication_level
      label: Communication Level
      hint: null
      type: select_one
      options:
      - Very Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: response_time
      label: Response Time
      hint: null
