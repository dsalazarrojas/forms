inputSchema:
  type: object
  properties:
    title: Health Story Sharing Authorization Form
    pages:
    - id: 1
      name: health_story_sharing_1
      label: Give Your Consent
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: health_story_sharing_2
      label: Select Your Options
      hint: Choose how you would like to share your health story
      type: select_multiple
      options:
      - share with organizations
      - how do you want to share
      - share with family friends
      - when do you want to share
      - what is your relationship
      - share with healthcare
      - contact information
      - email
      - phone
      - note
      required: false
    - id: 3
      name: health_story_sharing_13
      label: confirm
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: health_story_sharing_14
      label: submit
      hint: null
      type: text
      options: []
      required: true
