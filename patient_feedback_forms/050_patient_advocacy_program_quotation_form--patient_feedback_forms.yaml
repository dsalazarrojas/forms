inputSchema:
  type: object
  properties:
    title: patient_advocacy_program_quotation_form
    pages:
    - id: 1
      name: program_quotation
      label: Program Quotation
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: patient_info
      label: Patient Information
      hint: null
      type: select_multiple
      options:
      - Patient Name
      - Date of Birth
      - Contact Information
      required: true
    - id: 3
      name: provider_info
      label: Provider Information
      hint: null
      type: select_one
      options:
      - Primary Care Physician
      - Specialty Care Physician
      - Other
      required: true
    - id: 4
      name: services_provided
      label: Services Provided
      hint: null
      type: select_multiple
      options:
      - Service 1
      - Service 2
      - Service 3
      required: true
    - id: 5
      name: service_quote
      label: Service Quote
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: additional_info
      label: Additional Information
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: patient_signature
      label: Patient Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: provider_signature
      label: Provider Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 12
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
