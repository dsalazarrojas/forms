inputSchema:
  type: object
  properties:
    title: Session Assignment And Feedback Form (SAFF)
    pages:
    - id: 1
      name: session_details
      label: Session Details
      hint: Please provide the session details below.
      type: text
      options: []
      required: false
    - id: 2
      name: patient_feedback
      label: Patient Feedback
      hint: Describe the patient's feedback on the session.
      type: text
      options: []
      required: true
    - id: 3
      name: assigned_therapist
      label: Assigned Therapist
      hint: Select the assigned therapist for the session.
      type: select_one
      options:
      - chatjimmy
      - john doe
      required: true
    - id: 4
      name: session_date
      label: Session Date
      hint: Select the session date in MM/DD/YYYY format.
      type: date
      options: []
      required: true
    - id: 5
      name: session_time
      label: Session Time
      hint: Select the session time in 24-hour format.
      type: time
      options: []
      required: true
    - id: 6
      name: session_notes
      label: Session Notes
      hint: Provide any notes or comments on the session.
      type: text
      options: []
      required: true
    - id: 7
      name: confirm_submit
      label: Confirm Submit
      hint: Confirm that the form is complete and accurate.
      type: text
      options: []
      required: true
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: Select the assigned tool for the session.
      type: select_one
      options:
      - chatjimmy
      - john doe
      required: true
    - id: 9
      name: patient_id
      label: Patient ID
      hint: Select the patient's ID for the session.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: submit
      label: Submit
      hint: Confirm your submission.
      type: text
      options: []
      required: true
    - id: 11
      name: confirm_submit_2
      label: Confirm Submit 2
      hint: Confirm your submission.
      type: text
      options: []
      required: true
