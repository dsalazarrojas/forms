inputSchema:
  type: object
  properties:
    title: Eco Documentary Interview Consent Form
    pages:
    - id: 1
      name: recording_consent_forms
      label: Recording Consent Forms
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: sharing_consent_forms
      label: Sharing Consent Forms
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: project_description
      label: Project Description
      hint: A brief description of the project
      type: text
      options: []
      required: false
    - id: 4
      name: project_location
      label: Project Location
      hint: Where the project will be conducted
      type: text
      options: []
      required: false
    - id: 5
      name: project_duration
      label: Project Duration
      hint: Length of the project
      type: number
      options: []
      required: false
    - id: 6
      name: recording_consent
      label: Recording Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: sharing_consent
      label: Sharing Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: project_name
      label: Project Name
      hint: Title of the project
      type: text
      options: []
      required: false
