inputSchema:
  type: object
  properties:
    title: Faith Based Video Sermon Appearance Consent Form
    pages:
    - id: 1
      name: name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: recording_consent
      label: Do you consent to being recorded and livestreamed during the service?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: recording_concerns
      label: Do you have any concerns about being recorded and livestreamed?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: available_dates_times
      label: What are your available dates and times for recording and livestreaming?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: recording_restrictions
      label: Do you have any restrictions or limitations on recording and livestreaming
        your appearance?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: recording_services
      label: Do you consent to being recorded and livestreamed for the following services?
      hint: null
      type: select_multiple
      options:
      - Sunday Service
      - Sunday School
      - Special Event
      required: true
    - id: 10
      name: additional_info
      label: Do you have any additional information about your availability or recording
        requirements?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: recording_type
      label: Is this a one-time recording or a regular series of recordings?
      hint: null
      type: select_one
      options:
      - One-time
      - Regular Series
      required: true
    - id: 12
      name: recording_settings
      label: Do you have any specific requirements or restrictions for the recording
        and livestreaming settings?
      hint: null
      type: text
      options: []
      required: false
