inputSchema:
  type: object
  properties:
    title: Talent Demo Reel Usage Consent Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: agreement_date
      label: Date of Agreement
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: agreement_date_time
      label: Date of Agreement Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: consent_agreement
      label: Consent Agreement
      hint: This is a sample consent agreement.
      type: select_one
      options:
      - I acknowledge that I have read and understand the terms of the usage of my
        demo reel
      - I do not acknowledge that I have read and understand the terms of the usage
        of my demo reel
      required: true
    - id: 9
      name: consent
      label: Consent
      hint: null
      type: text
      options: []
      required: true
