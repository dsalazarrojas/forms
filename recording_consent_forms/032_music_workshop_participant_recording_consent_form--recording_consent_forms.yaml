inputSchema:
  type: object
  properties:
    title: Music Workshop Participant Recording Consent Form
    pages:
    - id: 1
      name: workshop_title
      label: Workshop Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: recording_consent
      label: Recording Consent
      hint: Please select one of the options below
      type: select_one
      options:
      - Recordings may be taken during the workshop
      - No recordings may be taken during the workshop
      required: true
    - id: 7
      name: signature
      label: Participant Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: participant_signature_date
      label: Date
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: workshop_title_label
      label: Workshop Title
      hint: null
      type: text
      options: []
      required: false
