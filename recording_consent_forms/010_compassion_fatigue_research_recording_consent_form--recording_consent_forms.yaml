inputSchema:
  type: object
  properties:
    title: Compassion Fatigue Research Recording Consent Form
    pages:
    - id: 1
      name: research_info_header
      label: -- Research Study Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: study_title
      label: Title of the Research Study
      hint: e.g., Impacts of Compassion Fatigue on Healthcare Workers
      type: text
      options: []
      required: true
    - id: 3
      name: principal_investigator
      label: Principal Investigator
      hint: Lead researcher for this project
      type: text
      options: []
      required: true
    - id: 4
      name: participant_name
      label: Participant Full Name
      hint: Enter your full legal name
      type: text
      options: []
      required: true
    - id: 5
      name: recording_consent_details
      label: -- Recording Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: recording_method_consent
      label: Method of Recording
      hint: Which formats are you willing to be recorded in?
      type: select_multiple
      options:
      - Audio Recording Only
      - Video Recording Only
      - Written Transcription
      - Photography
      required: true
    - id: 7
      name: intended_use_of_recordings
      label: Intended Use of Recordings
      hint: How the data will be used in the research
      type: select_one
      options:
      - Data analysis only (internal use)
      - Presentation at academic conferences
      - Publication in peer-reviewed journals
      - Educational purposes
      required: true
    - id: 8
      name: anonymity_preference
      label: Anonymity and Confidentiality
      hint: How should your identity be managed in the recordings?
      type: select_one
      options:
      - Use my real name
      - Use a pseudonym (fake name)
      - Fully anonymized (voice/face distorted)
      required: true
    - id: 9
      name: right_to_stop_recording
      label: Right to Pause or Stop
      hint: I understand that I can ask to stop the recording at any time during the
        interview without penalty.
      type: select_one
      options:
      - I understand and agree
      - Other
      required: true
    - id: 10
      name: data_storage_duration
      label: Data Retention Period
      hint: How long the recordings will be kept before deletion
      type: select_one
      options:
      - 1 Year
      - 3 Years
      - 5 Years
      - Indefinitely for future research
      required: true
    - id: 11
      name: contact_for_questions
      label: Contact Email for Participant
      hint: Where we can send follow-up information
      type: email
      options: []
      required: true
    - id: 12
      name: consent_signature_date
      label: Date of Consent
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 13
      name: digital_signature_acknowledgment
      label: Digital Signature Acknowledgment
      hint: By submitting this form, I am providing my legal consent to be recorded
        for this research.
      type: note
      options: []
      required: false
