inputSchema:
  type: object
  properties:
    title: Performance Archive Preservation Consent Form
    pages:
    - id: 1
      name: performance_archive_presentation
      label: Performance Archive Presentation
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: performance_archive_consent
      label: Performance Archive Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: performance_archive_stored
      label: Where will you store the recording?
      hint: Please specify the location(s) where the recording will be stored.
      type: select_multiple
      options:
      - Google
      - YouTube
      - Other
      - Dropbox
      required: false
    - id: 4
      name: performance_archive_access
      label: How will you access the recording?
      hint: Please specify how you will access the recording.
      type: select_multiple
      options:
      - Public
      - Private
      required: false
    - id: 5
