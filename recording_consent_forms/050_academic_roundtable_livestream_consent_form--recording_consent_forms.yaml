inputSchema:
  type: object
  properties:
    title: Academic Roundtable Livestream Consent Form
    pages:
    - id: 1
      name: consent_header
      label: -- Livestream Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact email
      hint: For confirmation and recording notices
      type: email
      options: []
      required: true
    - id: 4
      name: role_at_event
      label: Role at event
      hint: Speaker panellist moderator or attendee
      type: select_one
      options:
        - Speaker
        - Panellist
        - Moderator
        - Attendee
      required: true
    - id: 5
      name: consent_to_livestream
      label: Consent to livestream
      hint: Permission for streaming to public channels
      type: select_one
      options:
        - Yes
        - No
      required: true
    - id: 6
      name: consent_to_record
      label: Consent to record session
      hint: Permission to retain recording for archive
      type: select_one
      options:
        - Yes
        - No
      required: true
    - id: 7
      name: restrictions_on_use
      label: Restrictions on use of recording
      hint: Any limitations on distribution or editing
      type: text
      options: []
      required: false
    - id: 8
      name: publicity_preferences
      label: Publicity preferences for speaker bios
      hint: How you wish to be credited or described
      type: text
      options: []
      required: false
    - id: 9
      name: signature
      label: Signature confirmation
      hint: Type full name to confirm consent
      type: text
      options: []
      required: true
    - id: 10
      name: date
      label: Date of consent
      hint: Date when consent was given
      type: date
      options: []
      required: true
