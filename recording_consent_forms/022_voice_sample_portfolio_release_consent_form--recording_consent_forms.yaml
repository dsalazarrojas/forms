inputSchema:
  type: object
  properties:
    title: Voice Sample Portfolio Release Consent Form
    pages:
    - id: 1
      name: page_1
      label: Submission Agreement
      hint: Please confirm your agreement to release the voice sample portfolio
      type: checkbox
      options:
      - I agree
      - I do not agree
      required: true
    - id: 2
      name: page_2
      label: Release Type
      hint: Select one of the options below
      type: select_one
      options:
      - General Release
      - Specialized Release
      required: true
    - id: 3
      name: page_3
      label: Release Details
      hint: Please provide any additional conditions or notes
      type: note
      options: []
      required: true
    - id: 4
      name: page_4
      label: Release Date
      hint: The date when the release will start
      type: date
      options: []
      required: true
    - id: 5
      name: page_5
      label: Recording Release
      hint: How will the recording be released?
      type: note
      options: []
      required: true
    - id: 6
      name: page_6
      label: Submitter's Name
      hint: Please provide your name
      type: text
      options: []
      required: true
    - id: 7
      name: page_7
      label: Submitter's Email
      hint: Please provide your email address
      type: email
      options: []
      required: true
    - id: 8
      name: page_8
      label: Submitter's Phone
      hint: Please provide your phone number
      type: text
      options: []
      required: true
    - id: 9
      name: page_9
      label: Confirmation Notes
      hint: Any additional notes about this release
      type: note
      options: []
      required: true
    - id: 10
      name: page_10
      label: Submission Complete
      hint: null
      type: text
      options: []
      required: true
