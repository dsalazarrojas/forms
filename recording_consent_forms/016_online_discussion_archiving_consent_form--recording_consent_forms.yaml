inputSchema:
  type: object
  properties:
    title: Online Discussion Archiving Consent Form
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: discussion_details
      label: Discussion Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: consent
      label: Signed Consent
      hint: null
      type: select_one
      options:
      - Signed
      - Not Signed
      required: false
