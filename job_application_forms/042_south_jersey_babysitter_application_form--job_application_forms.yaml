inputSchema:
  type: object
  properties:
    title: South Jersey Babysitter Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Name
      hint: Please enter your full name.
      type: text
      options: []
      required: true
    - id: 2
      name: availability
      label: Availability
      hint: Please indicate your days available to work.
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 3
      name: experience
      label: Experience
      hint: Describe your previous work experience.
      type: text
      options: []
      required: true
    - id: 4
      name: education
      label: Education
      hint: List your degrees earned.
      type: text
      options: []
      required: false
    - id: 5
      name: special_skills
      label: Special Skills
      hint: Check all that apply.
      type: select_multiple
      options:
      - CPR Certification
      - First Aid Certification
      - Swimming Lessons
      - Other (Please specify)
      required: true
    - id: 6
      name: certifications
      label: Certifications
      hint: List your certifications.
      type: text
      options: []
      required: false
    - id: 7
      name: earliest_start_date
      label: Earliest Start Date
      hint: Please enter the earliest date you are available to start.
      type: date
      options: []
      required: true
    - id: 8
      name: latest_end_date
      label: Latest End Date
      hint: Please enter the latest date you are available to work.
      type: date
      options: []
      required: true
    - id: 9
      name: emergency_contact
      label: Emergency Contact
      hint: Please enter emergency contact information.
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Describe your relationship to emergency contact.
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Please enter emergency contact phone number.
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_contact_email
      label: Emergency Contact Email
      hint: Please enter emergency contact email.
      type: email
      options: []
      required: false
    - id: 13
      name: emergency_contact_relationship_other
      label: Emergency Contact Relationship Other
      hint: Describe your relationship to emergency contact.
      type: text
      options: []
      required: false
    - id: 14
      name: emergency_contact_relationship_other_phone
      label: Emergency Contact Relationship Other Phone
      hint: Please enter emergency contact phone number.
      type: text
      options: []
      required: false
    - id: 15
      name: emergency_contact_relationship_other_email
      label: Emergency Contact Relationship Other Email
      hint: Please enter emergency contact email.
      type: email
      options: []
      required: false
