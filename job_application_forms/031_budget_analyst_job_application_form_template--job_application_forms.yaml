inputSchema:
  type: object
  properties:
    title: Budget Analyst Job Application Form Template
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: current_location
      label: Current Location
      hint: City and state
      type: text
      options: []
      required: true
    - id: 5
      name: willing_to_relocate
      label: Willing to Relocate
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Open to Discussion
      required: true
    - id: 6
      name: employment_type
      label: Desired Employment Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Temporary
      required: true
    - id: 7
      name: years_experience
      label: Years of Budget Analysis Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: education_level
      label: Highest Education Level
      hint: null
      type: select_one
      options:
      - High School Diploma
      - Associate Degree
      - Bachelor Degree
      - Master Degree
      - PhD
      required: true
    - id: 9
      name: field_of_study
      label: Field of Study or Major
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: certifications
      label: Relevant Certifications
      hint: CPA, CIA, etc
      type: text
      options: []
      required: false
    - id: 11
      name: financial_software
      label: Financial Software and Tools Experience
      hint: Select all that apply
      type: select_multiple
      options:
      - SAP
      - Oracle
      - NetSuite
      - QuickBooks
      - Excel
      - Tableau
      - Power BI
      - Other
      required: true
    - id: 12
      name: professional_summary
      label: Professional Summary
      hint: Brief overview of qualifications
      type: text
      options: []
      required: true
    - id: 13
      name: key_skills
      label: Key Skills
      hint: Financial analysis, forecasting, etc
      type: text
      options: []
      required: true
    - id: 14
      name: previous_employers
      label: Previous Employers and Positions
      hint: Job titles and companies
      type: text
      options: []
      required: true
    - id: 15
      name: salary_expectations
      label: Salary Expectations
      hint: Annual range
      type: text
      options: []
      required: false
    - id: 16
      name: availability
      label: Availability Start Date
      hint: When can you begin
      type: date
      options: []
      required: true
    - id: 17
      name: references
      label: References Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: resume_attached
      label: Resume or CV Attached
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
