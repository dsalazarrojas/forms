inputSchema:
  type: object
  properties:
    title: Advice Worker Job Application Form
    pages:
    - id: 1
      name: personal_details_header
      label: -- Personal Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: position_header
      label: -- Position Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: position_applied_for
      label: Position Applied For
      hint: null
      type: select_one
      options:
      - Junior Advice Worker
      - Senior Advice Worker
      - Case Manager
      - Volunteer Advisor
      required: true
    - id: 8
      name: availability
      label: Date Available to Start
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: experience_header
      label: -- Experience & Qualifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: qualifications
      label: Relevant Qualifications
      hint: List degrees or certifications (e.g., Law, Social Work).
      type: text
      options: []
      required: true
    - id: 11
      name: years_experience
      label: Years of Relevant Experience
      hint: null
      type: select_one
      options:
      - None
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5+ years
      required: true
    - id: 12
      name: areas_of_expertise
      label: Areas of Expertise
      hint: Select areas where you can provide advice.
      type: select_multiple
      options:
      - Housing
      - Debt & Money Management
      - Employment Rights
      - Immigration
      - Family Law
      - Welfare Benefits
      required: true
    - id: 13
      name: previous_employment
      label: Most Recent Employer
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: reference_contact
      label: Reference Contact Info
      hint: Name and email of a professional reference.
      type: text
      options: []
      required: true
    - id: 15
      name: cover_letter
      label: Cover Letter / Personal Statement
      hint: Why are you a good fit for this role?
      type: text
      options: []
      required: false
    - id: 16
      name: resume_upload_link
      label: Link to Resume / CV
      hint: Please provide a URL to your resume (e.g., LinkedIn, Drive).
      type: text
      options: []
      required: true
