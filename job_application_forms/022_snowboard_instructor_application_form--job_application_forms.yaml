inputSchema:
  type: object
  properties:
    title: Snowboard Instructor Application Form
    pages:
    - id: 1
      name: contact
      label: contact_information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: address
      label: home_address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: contact_email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: experience
      label: snowboard_experience
      hint: null
      type: select_one
      options:
      - Snowboard 3+ years
      - Snowboard 2-5 years
      - Snowboard < 2 years
      required: true
    - id: 6
      name: instructor_credential
      label: instructor_credential
      hint: null
      type: select_multiple
      options:
      - First Aid Certification
      - Ski Cert
      - Instructor Cert
      - Option 4
      required: false
    - id: 7
      name: available_days
      label: available_days
      hint: Monday to Friday
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 8
      name: available_hours
      label: available_hours
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: bio
      label: bio
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: upload_resume
      label: resume
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: upload_photo
      label: profile_picture
      hint: null
      type: text
      options: []
      required: false
