inputSchema:
  type: object
  properties:
    title: Administrative Assistant Job Application Form
    pages:
    - id: 1
      name: applicant_information
      label: Applicant information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Legal name for application
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For job communications
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Best contact number
      type: text
      options: []
      required: false
    - id: 5
      name: position_applied_for
      label: Position applied for
      hint: Job title
      type: text
      options: []
      required: true
    - id: 6
      name: employment_history
      label: Employment history summary
      hint: Relevant past roles and dates
      type: text
      options: []
      required: true
    - id: 7
      name: education
      label: Education
      hint: Degrees certifications institutions
      type: text
      options: []
      required: true
    - id: 8
      name: references
      label: References
      hint: Names and contact details for two references
      type: text
      options: []
      required: true
    - id: 9
      name: resume_attached
      label: Resume attached
      hint: Confirm resume included with application
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: cover_letter
      label: Cover letter summary
      hint: Brief statement of interest
      type: text
      options: []
      required: false
