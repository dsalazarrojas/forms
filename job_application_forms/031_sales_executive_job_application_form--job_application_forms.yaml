inputSchema:
  type: object
  properties:
    title: Sales Executive Job Application Form
    pages:
    - id: 1
      name: job_application_form
      label: Job Application Form
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: job_category
      label: Job Category
      hint: null
      type: select_one
      options:
      - Sales
      - Marketing
      - Management
      - Operations
      required: true
    - id: 5
      name: job_type
      label: Job Type
      hint: null
      type: select_multiple
      options:
      - Full Time
      - Part Time
      - Freelance
      - Intern
      required: true
    - id: 6
      name: location
      label: Location
      hint: null
      type: select_multiple
      options:
      - Remote
      - New York
      - Chicago
      - Los Angeles
      required: false
    - id: 7
      name: experience
      label: Experience
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: true
    - id: 8
      name: skills
      label: Skills
      hint: null
      type: select_multiple
      options:
      - Sales
      - Communication
      - Leadership
      - Team Management
      required: false
    - id: 9
      name: resume
      label: Resume
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: cover_letter
      label: Cover Letter
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: job_references
      label: Job References
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: notice_period
      label: Notice Period
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 14
      name: salary
      label: Salary
      hint: null
      type: number
      options: []
      required: true
