inputSchema:
  type: object
  properties:
    title: Chauffeur Job Application Form
    pages:
    - id: 1
      name: section_applicant_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 7
      name: address
      label: Current Address
      hint: Your home address
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State or Province
      hint: State code
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: Zip Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 11
      name: section_license
      label: -- Driver License Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: license_number
      label: Driver License Number
      hint: Your license number
      type: text
      options: []
      required: true
    - id: 13
      name: license_state
      label: License State or Province
      hint: Where license was issued
      type: text
      options: []
      required: true
    - id: 14
      name: license_expiration
      label: License Expiration Date
      hint: When does license expire
      type: date
      options: []
      required: true
    - id: 15
      name: violations
      label: Traffic Violations in Last 5 Years
      hint: Any moving violations
      type: select_one
      options:
      - None
      - 1-2 Violations
      - 3-5 Violations
      - More than 5
      required: true
    - id: 16
      name: section_experience
      label: -- Professional Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: years_driving
      label: Years of Professional Driving Experience
      hint: Total years as professional driver
      type: number
      options: []
      required: true
    - id: 18
      name: years_chauffeur
      label: Years of Chauffeur Experience
      hint: Specific chauffeur experience
      type: number
      options: []
      required: true
    - id: 19
      name: previous_employers
      label: Previous Chauffeur Employers
      hint: Companies you have worked for
      type: text
      options: []
      required: false
    - id: 20
      name: vehicle_experience
      label: Experience Driving
      hint: Types of vehicles you can drive
      type: select_multiple
      options:
      - Sedan
      - SUV
      - Limousine
      - Van
      - Truck
      - Luxury Vehicles
      required: true
    - id: 21
      name: section_skills
      label: -- Skills and Certifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: certifications
      label: Professional Certifications or Licenses
      hint: CPR, first aid, chauffeur license, etc
      type: text
      options: []
      required: false
    - id: 23
      name: language_skills
      label: Languages Spoken
      hint: Languages you are fluent in
      type: text
      options: []
      required: false
    - id: 24
      name: security_clearance
      label: Willing to Undergo Background Check
      hint: Security clearance required
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: application_date
      label: Application Date
      hint: Today's date
      type: date
      options: []
      required: true
