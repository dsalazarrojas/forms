inputSchema:
  type: object
  properties:
    title: Casino Host Job Application Form
    pages:
    - id: 1
      name: application_header_section
      label: -- Application Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: application_date
      label: Application Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 3
      name: position_applied
      label: Position Applied For
      hint: null
      type: select_one
      options:
      - Casino Host
      - VIP Host
      - Premium Host
      - Hosts Supervisor
      - Other
      required: true
    - id: 4
      name: personal_information_section
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: current_address
      label: Current Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 10
      name: city_state_zip
      label: City, State, Zip
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: professional_section
      label: -- Professional Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: years_experience
      label: Years of Customer Service Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: casino_experience
      label: Prior Casino or Gaming Industry Experience
      hint: null
      type: select_one
      options:
      - Extensive
      - Moderate
      - Limited
      - None
      required: true
    - id: 14
      name: previous_roles
      label: Previously Held Positions
      hint: List relevant prior roles
      type: text
      options: []
      required: false
    - id: 15
      name: hospitality_experience
      label: Hospitality or Hotel Industry Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: skills_section
      label: -- Skills and Competencies --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: customer_service_skills
      label: Customer Service and Relationship Building
      hint: Self-assess your proficiency
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Limited
      required: true
    - id: 18
      name: communication_skills
      label: Communication and Interpersonal Skills
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Limited
      required: true
    - id: 19
      name: sales_ability
      label: Sales and Persuasion Ability
      hint: null
      type: select_one
      options:
      - Strong
      - Moderate
      - Developing
      - Limited
      required: true
    - id: 20
      name: problem_solving
      label: Problem-solving and Conflict Resolution
      hint: null
      type: select_one
      options:
      - Strong
      - Good
      - Fair
      - Limited
      required: true
    - id: 21
      name: availability_section
      label: -- Availability and Flexibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: start_date
      label: Available Start Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 23
      name: shift_preference
      label: Preferred Shift
      hint: null
      type: select_multiple
      options:
      - Day Shift
      - Evening Shift
      - Night Shift
      - Flexible
      - Weekends
      required: true
    - id: 24
      name: background_check_consent
      label: I consent to background check and reference verification
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 25
      name: additional_information
      label: Additional Information or Comments
      hint: Anything else we should know?
      type: text
      options: []
      required: false
