inputSchema:
  type: object
  properties:
    title: Application Form For Tech Website
    pages:
      - id: 1
        name: applicant_name
        label: Applicant name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 2
        name: email
        label: Email address
        hint: Contact email
        type: email
        options: []
        required: true
      - id: 3
        name: position_interest
        label: Position interest
        hint: Role applicant is interested in
        type: select_one
        options: [Writer, Developer, Designer, Moderator, Other]
        required: true
      - id: 4
        name: skills_summary
        label: Skills summary
        hint: Key skills relevant to the role
        type: text
        options: []
        required: true
      - id: 5
        name: sample_submission
        label: Sample submission link
        hint: URL to sample article video or code
        type: text
        options: []
        required: false
      - id: 6
        name: availability
        label: Availability
        hint: Weekly hours available
        type: text
        options: []
        required: false
      - id: 7
        name: github_or_portfolio
        label: GitHub or portfolio link
        hint: Provide link if applicable
        type: text
        options: []
        required: false
      - id: 8
        name: motivation
        label: Motivation statement
        hint: Why do you want to contribute
        type: text
        options: []
        required: true
      - id: 9
        name: references
        label: References
        hint: Optional references
        type: text
        options: []
        required: false
      - id: 10
        name: consent
        label: Consent to terms
        hint: Confirm agreement to contributor terms
        type: select_one
        options: [I agree, I do not agree]
        required: true
