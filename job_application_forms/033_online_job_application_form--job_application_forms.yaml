inputSchema:
  type: object
  properties:
    title: Online Job Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: experience_years
      label: Experience Years
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - '{''value'': ''Full Time''}'
      - '{''value'': ''Part Time''}'
      - '{''value'': ''Remote''}'
      required: false
    - id: 8
      name: resume
      label: Resume
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: job_location
      label: Job Location
      hint: null
      type: text
      options: []
      required: false
