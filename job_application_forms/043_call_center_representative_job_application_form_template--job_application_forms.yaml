    - id: 12
      name: position_applied
      label: Position Applied For
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: employment_type
      label: Employment Type Preferred
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Flexible
      required: true
    - id: 14
      name: availability_start
      label: When Can You Start?
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: shift_preference
      label: Shift Preference
      hint: null
      type: select_one
      options:
      - Day shift
      - Evening shift
      - Night shift
      - Flexible
      required: true
