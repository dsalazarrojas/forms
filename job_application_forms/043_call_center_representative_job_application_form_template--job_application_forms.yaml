      name: key_skills
      label: Key Skills
      hint: null
      type: select_multiple
      options:
      - Customer communication
      - Problem solving
      - Computer proficiency
      - Multitasking
      - Attention to detail
      - Time management
      - Sales skills
      required: true
    - id: 22
      name: languages
      label: Languages Spoken
      hint: Select all that apply
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      - Mandarin
      - Other
      required: false
    - id: 23
      name: education_header
      label: -- Education --
      hint: null
      type: note
      options: []
