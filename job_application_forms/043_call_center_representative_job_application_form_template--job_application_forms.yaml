      name: highest_education
      label: Highest Education Level
      hint: null
      type: select_one
      options:
      - High School
      - Associate Degree
      - Bachelor Degree
      - Master Degree
      - Other
      required: true
    - id: 25
      name: availability_header
      label: -- Availability and Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: background_check
      label: Can You Pass a Background Check?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unsure
      required: true
    - id: 27
      name: transportation
      label: Do You Have Reliable Transportation?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 28
      name: motivation
      label: Why Do You Want to Work as a Call Center Representative?
      hint: null
      type: text
      options: []
      required: true
