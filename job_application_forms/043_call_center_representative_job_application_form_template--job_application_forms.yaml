      hint: null
      type: select_one
      options:
      - No experience
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: true
    - id: 18
      name: customer_service_experience
      label: Customer Service Experience
      hint: null
      type: select_one
      options:
      - No experience
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: true
    - id: 19
      name: previous_employment
      label: Describe Your Most Recent Employment
      hint: null
      type: text
      options: []
      required: false
