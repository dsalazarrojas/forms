inputSchema:
  type: object
  properties:
    title: Dental Assistant Job Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: Current or previous job title
      type: text
      options: []
      required: true
    - id: 6
      name: resume
      label: Resume
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: job_application
      label: Job Application
      hint: Are you interested in this job?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: experience
      label: Job Experience
      hint: How many years do you have?
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: true
    - id: 9
      name: available_start
      label: Available Start
      hint: Start date
      type: date
      options: []
      required: true
    - id: 10
      name: available_end
      label: Available End
      hint: End time
      type: time
      options: []
      required: true
    - id: 11
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
