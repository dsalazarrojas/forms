inputSchema:
  type: object
  properties:
    title: Cloud Architect Job Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Full Name
      hint: Legal name as it appears on resume
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: section_basic
      label: -- Personal Information --
      hint: Basic applicant details
      type: note
      options: []
      required: false
    - id: 5
      name: linkedin_profile
      label: LinkedIn Profile URL
      hint: Link to your professional profile
      type: text
      options: []
      required: false
    - id: 6
      name: github_profile
      label: GitHub Profile URL
      hint: If applicable - link to GitHub profile
      type: text
      options: []
      required: false
    - id: 7
      name: portfolio_website
      label: Portfolio or Personal Website
      hint: Link to your professional portfolio
      type: text
      options: []
      required: false
    - id: 8
      name: section_experience
      label: -- Professional Experience --
      hint: Your work history and expertise
      type: note
      options: []
      required: false
    - id: 9
      name: years_experience
      label: Years of Cloud Architecture Experience
      hint: Total years in cloud roles
      type: number
      options: []
      required: true
    - id: 10
      name: total_it_experience
      label: Total Years of IT Experience
      hint: Overall IT career length
      type: number
      options: []
      required: true
    - id: 11
      name: current_role
      label: Current Job Title
      hint: Your current position
      type: text
      options: []
      required: true
    - id: 12
      name: section_cloud
      label: -- Cloud Platforms and Skills --
      hint: Your cloud platform expertise
      type: note
      options: []
      required: false
    - id: 13
      name: cloud_platforms
      label: Cloud Platforms Experience
      hint: null
      type: select_multiple
      options:
      - Amazon Web Services (AWS)
      - Microsoft Azure
      - Google Cloud Platform (GCP)
      - IBM Cloud
      - Oracle Cloud
      - Alibaba Cloud
      - Other
      required: true
    - id: 14
      name: aws_certifications
      label: AWS Certifications
      hint: null
      type: select_multiple
      options:
      - AWS Certified Solutions Architect
      - AWS Certified DevOps Engineer
      - AWS Certified Security Specialist
      - AWS Certified Database Specialist
      - AWS Certified Advanced Networking
      - Other AWS certification
      - None
      required: false
    - id: 15
      name: azure_certifications
      label: Azure Certifications
      hint: null
      type: select_multiple
      options:
      - Azure Administrator
      - Azure Solutions Architect
      - Azure DevOps Engineer
      - Azure Security Engineer
      - Azure Data Engineer
      - Other Azure certification
      - None
      required: false
    - id: 16
      name: gcp_certifications
      label: Google Cloud Certifications
      hint: null
      type: select_multiple
      options:
      - GCP Associate Cloud Engineer
      - GCP Professional Cloud Architect
      - GCP Professional Cloud Security Engineer
      - Other GCP certification
      - None
      required: false
    - id: 17
      name: section_technologies
      label: -- Technical Skills --
      hint: Your technical expertise
      type: note
      options: []
      required: false
    - id: 18
      name: programming_languages
      label: Programming Languages
      hint: null
      type: select_multiple
      options:
      - Python
      - Java
      - Go
      - C++
      - JavaScript
      - PowerShell
      - Bash
      - Other
      required: false
    - id: 19
      name: infrastructure_tools
      label: Infrastructure and DevOps Tools
      hint: null
      type: select_multiple
      options:
      - Terraform
      - CloudFormation
      - Kubernetes
      - Docker
      - Ansible
      - Jenkins
      - GitLab CI
      - Helm
      required: false
    - id: 20
      name: section_expertise
      label: -- Areas of Expertise --
      hint: Your specialized knowledge areas
      type: note
      options: []
      required: false
    - id: 21
      name: expertise_areas
      label: Areas of Specialization
      hint: null
      type: select_multiple
      options:
      - Cloud security
      - Infrastructure design
      - Database architecture
      - Microservices
      - Containerization
      - CI/CD pipelines
      - Data analytics
      - Machine learning
      - Disaster recovery
      - Cost optimization
      required: true
    - id: 22
      name: section_education
      label: -- Education --
      hint: Academic qualifications
      type: note
      options: []
      required: false
    - id: 23
      name: highest_degree
      label: Highest Degree Earned
      hint: null
      type: select_one
      options:
      - High school diploma
      - Bachelor degree
      - Master degree
      - PhD
      - Certification programs
      - Other
      required: true
    - id: 24
      name: education_field
      label: Field of Study
      hint: Degree major or area
      type: text
      options: []
      required: false
    - id: 25
      name: additional_information
      label: Additional Information or Comments
      hint: Anything else you would like us to know
      type: text
      options: []
      required: false
