inputSchema:
  type: object
  properties:
    title: Apply For A Temp Position Form
    pages:
    - id: 1
      name: applicant_information
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: current_address
      label: Current Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: availability
      label: Available to start immediately?
      hint: null
      type: select_one
      options:
      - 'True'
      - No - specify date
      required: true
    - id: 7
      name: start_date
      label: Preferred Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: position_information
      label: -- Position Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: position_type
      label: Position Type Applying For
      hint: null
      type: select_one
      options:
      - Administrative
      - Sales
      - Customer Service
      - Warehouse
      - Production
      - Other
      required: true
    - id: 10
      name: work_location
      label: Work Location Preference
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: duration_preference
      label: Preferred Temporary Duration
      hint: null
      type: select_one
      options:
      - 1-3 weeks
      - 1 month
      - 2-3 months
      - 3-6 months
      - Open to discussion
      required: false
    - id: 12
      name: work_experience
      label: -- Work Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: years_of_experience
      label: Years of Work Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: previous_employment
      label: Previous Employer
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: job_title
      label: Previous Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: employment_end_date
      label: When did you leave your previous position?
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: skills_and_qualifications
      label: -- Skills and Qualifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: relevant_skills
      label: Relevant skills for this position
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: computer_skills
      label: Computer skills
      hint: null
      type: select_multiple
      options:
      - Microsoft Word
      - Microsoft Excel
      - Outlook
      - Data entry
      - Other
      required: false
    - id: 20
      name: languages_spoken
      label: Languages spoken
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: certifications_and_licenses
      label: Relevant Certifications or Licenses
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: references
      label: -- References --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: reference_name
      label: Reference Name
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: reference_phone
      label: Reference Phone Number
      hint: null
      type: text
      options: []
      required: false
