inputSchema:
  type: object
  properties:
    title: Fancy Job Application
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: false
    - id: 3
      name: resume
      label: Resume
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: position
      label: Position
      hint: null
      type: select_one
      options:
      - Intern
      - Full time
      - Part time
      required: false
    - id: 7
      name: salary
      label: Salary
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: skills
      label: Skills
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: experience
      label: Experience
      hint: null
      type: select_multiple
      options:
      - 1-2 years
      - 3-5 years
      - 6-10 years
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Preview
      required: false
