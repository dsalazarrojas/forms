inputSchema:
  type: object
  properties:
    title: Cashier Job Application Form
    pages:
    - id: 1
      name: personal_information_section
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: current_address
      label: Current Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 7
      name: city_state_zip
      label: City, State, Zip
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: position_information_section
      label: -- Position Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: position_applied
      label: Position Applied For
      hint: null
      type: select_one
      options:
      - Cashier
      - Head Cashier
      - Lead Cashier
      - Shift Supervisor
      - Other
      required: true
    - id: 10
      name: preferred_hours
      label: Preferred Hours
      hint: Select availability
      type: select_multiple
      options:
      - Full-time
      - Part-time
      - Morning Shift
      - Afternoon Shift
      - Evening Shift
      - Weekends
      - Flexible
      required: true
    - id: 11
      name: available_start_date
      label: Available Start Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 12
      name: employment_history_section
      label: -- Employment History --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: cashier_experience
      label: Do you have cashier experience?
      hint: null
      type: select_one
      options:
      - Yes, extensive
      - Yes, some
      - No experience
      required: true
    - id: 14
      name: years_experience
      label: Years of Cashier or Retail Experience
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: previous_employers
      label: List Previous Employers
      hint: Last 3 employers
      type: text
      options: []
      required: false
    - id: 16
      name: reason_for_leaving
      label: Reason for Leaving Previous Jobs
      hint: Briefly explain
      type: text
      options: []
      required: false
    - id: 17
      name: skills_section
      label: -- Skills and Qualifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: cash_handling_skills
      label: Cash handling and accuracy
      hint: Self-assess your proficiency
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Limited
      - No Experience
      required: true
    - id: 19
      name: computer_skills
      label: Computer and POS system skills
      hint: null
      type: select_one
      options:
      - Advanced
      - Intermediate
      - Basic
      - No Experience
      required: true
    - id: 20
      name: customer_service_skills
      label: Customer service experience
      hint: null
      type: select_one
      options:
      - Extensive
      - Moderate
      - Limited
      - No Experience
      required: true
    - id: 21
      name: communication_skills
      label: Communication and interpersonal skills
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Limited
      required: true
    - id: 22
      name: availability_questions_section
      label: -- Availability Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: transportation
      label: Do you have reliable transportation?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: background_check_consent
      label: I consent to a background check
      hint: null
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 25
      name: additional_information
      label: Additional Information or Comments
      hint: Anything else we should know?
      type: text
      options: []
      required: false
