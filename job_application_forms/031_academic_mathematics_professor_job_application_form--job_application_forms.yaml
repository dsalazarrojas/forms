inputSchema:
  type: object
  properties:
    title: Academic Mathematics Professor Job Application Form
    pages:
    - id: 1
      name: applicant_information
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Legal name as on record
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact email
      hint: Institutional or primary email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Contact phone number
      hint: Include country code
      type: text
      options: []
      required: false
    - id: 5
      name: current_affiliation
      label: Current institution or employer
      hint: Department and institution
      type: text
      options: []
      required: true
    - id: 6
      name: area_of_expertise
      label: Area of expertise
      hint: Primary research and teaching interests
      type: select_multiple
      options:
      - Algebra
      - Analysis
      - Geometry
      - Applied mathematics
      - Statistics
      required: true
    - id: 7
      name: teaching_experience_years
      label: Years of teaching experience
      hint: Whole number of years
      type: number
      options: []
      required: true
    - id: 8
      name: research_summary
      label: Brief research summary
      hint: Key contributions in 200 words or less
      type: text
      options: []
      required: false
    - id: 9
      name: cv_or_resume_link
      label: CV or resume link
      hint: URL to a hosted CV or upload reference
      type: text
      options: []
      required: true
    - id: 10
      name: references
      label: References and contact details
      hint: Provide two academic references
      type: text
      options: []
      required: true
