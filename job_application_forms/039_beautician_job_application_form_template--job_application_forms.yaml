inputSchema:
  type: object
  properties:
    title: Beautician Job Application Form Template
    pages:
    - id: 1
      name: applicant_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: address
      label: Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: State
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 9
      name: position_applying
      label: Position Applying For
      hint: Job title
      type: select_one
      options:
      - Hairstylist
      - Colorist
      - Esthetician
      - Nail Technician
      - Makeup Artist
      - Barber
      - Salon Manager
      - Other
      required: true
    - id: 10
      name: availability
      label: Availability
      hint: When can you work
      type: select_one
      options:
      - Full-Time
      - Part-Time
      - Weekends Only
      - Flexible
      required: true
    - id: 11
      name: cosmetology_license
      label: Do You Have a Cosmetology License
      hint: License status
      type: select_one
      options:
      - Yes - Active
      - Yes - Expired
      - In Training
      - false
      required: true
    - id: 12
      name: license_number
      label: License Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 13
      name: license_state
      label: License State
      hint: Where licensed
      type: text
      options: []
      required: false
    - id: 14
      name: years_experience
      label: Years of Experience
      hint: In the industry
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-7 years
      - 8-15 years
      - Over 15 years
      required: true
    - id: 15
      name: previous_salon
      label: Previous Salon or Employer
      hint: Most recent
      type: text
      options: []
      required: true
    - id: 16
      name: specialties
      label: Your Specialties
      hint: Select all that apply
      type: select_multiple
      options:
      - Hair Cutting
      - Hair Coloring
      - Highlights
      - Extensions
      - Styling
      - Chemical Treatments
      - Bridal
      - Makeup
      - Skincare
      - Nails
      required: true
    - id: 17
      name: portfolio_available
      label: Do You Have a Portfolio
      hint: Can you show work
      type: select_one
      options:
      - Yes - Will Bring
      - Yes - Online
      - false
      required: true
    - id: 18
      name: portfolio_link
      label: Portfolio Link
      hint: URL if available
      type: text
      options: []
      required: false
    - id: 19
      name: why_this_salon
      label: Why Do You Want to Work Here
      hint: Your reason
      type: text
      options: []
      required: true
    - id: 20
      name: start_date
      label: Available Start Date
      hint: When can you start
      type: date
      options: []
      required: true
    - id: 21
      name: references_available
      label: References Available
      hint: Can you provide references
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 22
      name: resume_attached
      label: Resume Attached
      hint: Did you attach resume
      type: select_one
      options:
      - true
      - false
      required: true
