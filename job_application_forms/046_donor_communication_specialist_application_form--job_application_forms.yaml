inputSchema:
  type: object
  properties:
    title: Donor Communication Specialist Application Form
    pages:
    - id: 1
      name: job_application_form_1
      label: What is your current job title?
      hint: null
      type: select_one
      options:
      - Current Job Title
      - Previous Job Title
      - Other Job Title
      required: true
    - id: 2
      name: job_application_form_2
      label: Please enter your name.
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: job_application_form_3
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: job_application_form_4
      label: Do you have a resume or portfolio that showcases your experience and
        skills?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_application_form_5
      label: What is your availability for the position (select multiple days of the
        week)?
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 6
      name: job_application_form_6
      label: Do you have any specific job preferences (e.g., flexible work hours,
        remote work)?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: job_application_form_7
      label: What is your expected start date and end date of availability for the
        position?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: job_application_form_8
      label: What is your name as it appears on official documents?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: job_application_form_9
      label: Do you have any specific job title preferences?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: job_application_form_10
      label: What is your availability for a specific time period?
      hint: null
      type: date
      options: []
      required: false
