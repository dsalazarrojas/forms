inputSchema:
  type: object
  properties:
    title: Ambassador Application Form
    pages:
    - id: 1
      name: section_applicant_information
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For communication
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Contact phone
      type: text
      options: []
      required: false
    - id: 5
      name: why_apply
      label: Why are you applying to be an ambassador
      hint: Brief statement of interest
      type: text
      options: []
      required: true
    - id: 6
      name: experience
      label: Relevant experience
      hint: Past roles or activities
      type: text
      options: []
      required: false
    - id: 7
      name: availability
      label: Availability
      hint: Days and times available
      type: text
      options: []
      required: true
    - id: 8
      name: references
      label: References
      hint: Provide names and contact info
      type: text
      options: []
      required: false
    - id: 9
      name: consent
      label: I consent to background checks if required
      hint: Select yes to consent
      type: select_one
      options:
      - true
      - false
      required: true
