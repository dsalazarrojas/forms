inputSchema:
  type: object
  properties:
    title: Retail Sales Assistant Interview Form
    pages:
    - id: 1
      name: candidate_name
      label: Candidate Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: job_title
      label: job_title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: availability
      label: Available Shifts
      hint: Select all shifts you are available for
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 5
      name: experience
      label: Work Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: notice_period
      label: Notice Period
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: job_status
      label: Job Status
      hint: null
      type: select_one
      options:
      - Available
      - Unavailable
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
