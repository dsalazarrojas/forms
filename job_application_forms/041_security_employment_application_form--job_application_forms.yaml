    - id: 9
      name: employment_status
      label: employment_status
      hint: null
      type: select_one
      options:
      - '{''id'': 17, ''name'': ''Unemployed'', ''label'': ''Unemployed''}'
      - '{''id'': 18, ''name'': ''Employed'', ''label'': ''Employed''}'
      - '{''id'': 19, ''name'': ''Retired'', ''label'': ''Retired''}'
      - '{''id'': 20, ''name'': ''Other'', ''label'': ''Other''}'
