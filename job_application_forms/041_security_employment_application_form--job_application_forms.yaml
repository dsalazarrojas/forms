inputSchema:
  type: object
  properties:
    title: Security Employment Application Form
    pages:
    - id: 1
      name: applicant_name
      label: applicant_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: contact_phone
      label: contact_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: job_title
      label: job_title
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_description
      label: job_description
      hint: Briefly describe the job and its responsibilities
      type: text
      options: []
      required: false
    - id: 6
      name: experience
      label: experience
      hint: null
      type: select_multiple
      options:
      - Less than 1 year
      - 1-5 years
      - 5+ years
      required: false
    - id: 7
      name: education
      label: education
      hint: null
      type: select_one
      options:
      - High School Diploma
      - Bachelor's Degree
      - Master's Degree
      - Other
      required: false
    - id: 8
      name: work_experience
      label: work_experience
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: employment_status
      label: employment_status
      hint: null
      type: select_one
      options:
      - Unemployed
      - Employed
      - Retired
      - Other
      required: false
