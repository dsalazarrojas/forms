inputSchema:
  type: object
  properties:
    title: Career History Form
    pages:
    - id: 1
      name: personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter legal name as on official documents
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: Enter a valid contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Include country code if applicable
      type: text
      options: []
      required: false
    - id: 5
      name: current_position
      label: Current or most recent position
      hint: Job title and employer
      type: text
      options: []
      required: true
    - id: 6
      name: employment_start_date
      label: Employment start date
      hint: Approximate month and year if exact date unknown
      type: date
      options: []
      required: false
    - id: 7
      name: employment_end_date
      label: Employment end date
      hint: Leave blank if currently employed
      type: date
      options: []
      required: false
    - id: 8
      name: previous_employers
      label: Previous employers summary
      hint: List most recent three employers with roles
      type: text
      options: []
      required: false
    - id: 9
      name: key_responsibilities
      label: Key responsibilities in recent roles
      hint: Brief bullet points are fine
      type: text
      options: []
      required: false
    - id: 10
      name: reason_for_leaving
      label: Reason for leaving most recent role
      hint: Provide concise explanation
      type: text
      options: []
      required: false
    - id: 11
      name: professional_references
      label: Professional references
      hint: Name, relationship, and contact details for up to two references
      type: text
      options: []
      required: false
