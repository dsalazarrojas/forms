      - 'No'
      required: true
    - id: 2
      name: start_date
      label: start_date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 3
      name: agreement_to_stage_management_position
      label: agree_to_stage_management_position
      hint: null
      type: select_one
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 4
      name: agreement_to_stage_management_position_agreement_terms
      label: agree_to_stage_management_position_agreement_terms
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: role_expectations
      label: role_expectations
      hint: null
      type: text
      options: []
      required: true
