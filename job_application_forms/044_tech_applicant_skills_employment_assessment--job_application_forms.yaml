      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Internship
      - Other
      required: false
    - id: 11
      name: available_for
      label: Available For
      hint: null
      type: select_one
      options:
      - Immediate
      - In 1-3 months
      - In 6-12 months
      required: false
    - id: 12
      name: education
      label: Education
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: job_location
      label: Job Location
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: job_industry
      label: Job Industry
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: job_function
      label: Job Function
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: work_schedule
      label: Work Schedule
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Weekends
      - Flexible
      - Variable
      required: false
