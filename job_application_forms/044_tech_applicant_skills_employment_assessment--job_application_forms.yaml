inputSchema:
  type: object
  properties:
    title: Tech Applicant Skills Employment Assessment
    pages:
    - id: 1
      name: applicant_name
      label: Enter Applicant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: skills_test
      label: Skills Test
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Employed
      - Unemployed
      - Part-time
      - Freelance
      required: false
    - id: 8
      name: employment_type
      label: Employment Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Contract
      - Temporary
      required: false
    - id: 9
      name: work_experience
      label: Work Experience
      hint: null
      type: text
      options: []
      required: false
