inputSchema:
  type: object
  properties:
    title: Air Traffic Controller Job Application Form
    pages:
    - id: 1
      name: applicant_info_header
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: citizenship
      label: Citizenship
      hint: Often required for clearance
      type: select_one
      options:
      - U.S. Citizen
      - Permanent Resident
      - Non-Citizen
      required: true
    - id: 6
      name: professional_info_header
      label: -- Professional Qualifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: atc_experience
      label: Years of ATC Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: facility_type
      label: Previous Facility Type
      hint: Where have you worked?
      type: select_multiple
      options:
      - Control Tower
      - TRACON (Approach/Departure)
      - ARTCC (En Route Center)
      - Flight Service Station
      - Military ATC
      required: true
    - id: 9
      name: license_number
      label: CTO / ATC Certificate Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: medical_clearance
      label: Medical Clearance Class
      hint: Current FAA Medical
      type: select_one
      options:
      - Class 1
      - Class 2
      - Class 3
      - None / Expired
      required: true
    - id: 11
      name: education
      label: Education Level
      hint: Highest degree
      type: select_one
      options:
      - High School
      - Associate's (CTI Graduate)
      - Bachelor's
      - Master's
      required: true
    - id: 12
      name: documents_header
      label: -- Documents and Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: resume_note
      label: Resume Upload
      hint: Please email resume to hr@aviation.gov
      type: note
      options: []
      required: false
    - id: 14
      name: relocation
      label: Willing to Relocate?
      hint: Open to new facilities
      type: select_one
      options:
      - 'True'
      - 'False'
      - Negotiable
      required: true
    - id: 15
      name: shift_work
      label: Shift Work Availability
      hint: 24/7 operations
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: references
      label: References
      hint: Name and Contact Info
      type: text
      options: []
      required: false
