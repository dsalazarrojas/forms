inputSchema:
  type: object
  properties:
    title: Simple Employee Application
    pages:
    - id: 1
      name: employee_first_name
      label: First Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 2
      name: employee_last_name
      label: Last Name
      hint: Please enter your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: example@domain.com
      type: email
      options: []
      required: true
    - id: 4
      name: job_title
      label: Job Title
      hint: Please enter your job title
      type: text
      options: []
      required: true
    - id: 5
      name: job_description
      label: Job Description
      hint: Please enter a brief description of your job
      type: text
      options: []
      required: true
    - id: 6
      name: contact_address
      label: Contact Address
      hint: Please enter your contact address
      type: text
      options: []
      required: true
    - id: 7
      name: date_of_birth
      label: Date of Birth
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 8
      name: job_application_date
      label: Job Application Date
      hint: mm/dd/yyyy
      type: date
      options: []
      required: true
    - id: 9
      name: work_phone
      label: Work Phone
      hint: Please enter your work phone number
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Please enter your emergency contact name
      type: text
      options: []
      required: false
    - id: 11
      name: emergency_contact_number
      label: Emergency Contact Number
      hint: Please enter your emergency contact number
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Parent, Spouse, Child
      type: select_one
      options:
      - Parent
      - Spouse
      - Child
      required: false
    - id: 13
      name: employment_status
      label: Employment Status
      hint: Full-time, Part-time, Contract
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      required: false
    - id: 14
      name: education
      label: Education
      hint: Please enter your education details
      type: text
      options: []
      required: false
    - id: 15
      name: job_reference
      label: Job Reference
      hint: Please enter a reference
      type: text
      options: []
      required: false
    - id: 16
      name: job_location
      label: Job Location
      hint: Please enter job location
      type: text
      options: []
      required: false
    - id: 17
      name: job_type
      label: Job Type
      hint: Full-time, Part-time, Contract
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      required: false
    - id: 18
      name: job_level
      label: Job Level
      hint: Entry, Mid-Level, Senior
      type: select_multiple
      options:
      - Entry
      - Mid-Level
      - Senior
      required: false
    - id: 19
      name: job_category
      label: Job Category
      hint: Software Development, Data Science, Marketing
      type: select_multiple
      options:
      - Software Development
      - Data Science
      - Marketing
      required: false
    - id: 20
      name: job_salary_range
      label: Job Salary Range
      hint: 50-100, 100-200, 200-500
      type: select_multiple
      options:
      - 50-100
      - 100-200
      - 200-500
      required: false
    - id: 21
      name: job_salary
      label: Job Salary
      hint: Please enter your job salary
      type: number
      options: []
      required: true
    - id: 22
      name: job_hours
      label: Job Hours
      hint: 24/7, 32/5, 32/6
      type: select_multiple
      options:
      - 24/7
      - 32/5
      - 32/6
      required: false
