inputSchema:
  type: object
  properties:
    title: PayPal Email Subscription Form
    pages:
    - id: 1
      name: subscribe_to_newsletter
      label: Subscribe to Newsletter
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: confirm_email
      label: Confirm Email Address
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: subscribe_to_updates
      label: Subscribe to Updates
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
