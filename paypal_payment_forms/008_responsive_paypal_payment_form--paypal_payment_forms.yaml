inputSchema:
  type: object
  properties:
    title: Responsive Paypal Payment Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_info
      label: Product Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_info
      label: Payment Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - PayPal
      - Credit Card
      - Bank Transfer
      required: false
    - id: 5
      name: paypal_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: paypal_number
      label: Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: paypal_amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: product_price
      label: Product Price
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: false
