inputSchema:
  type: object
  properties:
    title: University Complaint Form
    pages:
    - id: 1
      name: introduction
      label: Welcome to the University Complaint Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_info
      label: Student Information
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: issue_description
      label: Describe your issue
      hint: Describe the issue you are experiencing
      type: note
      options: []
      required: false
    - id: 4
      name: submit_complaint
      label: Submit your complaint
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 5
      name: upload_evidence
      label: Upload Evidence
      hint: Upload a photo or video to support your complaint
      type: text
      options: []
      required: false
    - id: 6
      name: contact_info
      label: Contact Information
      hint: Please enter your contact information
      type: email
      options: []
      required: false
    - id: 7
      name: upload_attachments
      label: Attachments
      hint: null
      type: select_multiple
      options:
      - Attach a photo
      - Attach a document
      required: false
    - id: 8
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: review_page
      label: Review and Submit
      hint: null
      type: text
      options: []
      required: false
