inputSchema:
  type: object
  properties:
    title: Airline Customer Service Report Form
    pages:
    - id: 1
      name: section_passenger_info
      label: -- Passenger Information --
      hint: Please provide your contact details for follow-up
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: booking_reference
      label: Booking Reference (PNR)
      hint: 6-character alphanumeric code
      type: text
      options: []
      required: true
    - id: 6
      name: section_flight_details
      label: -- Flight Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: flight_number
      label: Flight Number
      hint: e.g. AB123
      type: text
      options: []
      required: true
    - id: 8
      name: travel_date
      label: Date of Travel
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: departure_airport
      label: Departure Airport
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: destination_airport
      label: Destination Airport
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: section_report_details
      label: -- Report Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: report_type
      label: Type of Report
      hint: Select the primary category for your feedback
      type: select_one
      options:
      - Staff Performance
      - Baggage Issues
      - In-flight Service
      - Booking and Check-in
      - Flight Delay or Cancellation
      - Other
      required: true
    - id: 13
      name: incident_description
      label: Description of the Incident
      hint: Please provide as much detail as possible
      type: text
      options: []
      required: true
    - id: 14
      name: staff_name_involved
      label: Name of Staff Involved
      hint: If applicable and known
      type: text
      options: []
      required: false
    - id: 15
      name: desired_outcome
      label: What is your desired resolution?
      hint: null
      type: text
      options: []
      required: false
