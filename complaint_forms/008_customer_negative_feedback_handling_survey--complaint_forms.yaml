      name: feedback_frequency
      label: Feedback Frequency
      hint: null
      type: select_multiple
      options:
      - Frequently
      - Occasionally
      - Rarely
      required: false
    - id: 9
      name: follow_up_action
      label: Follow-up Action
      hint: null
      type: select_one
      options:
      - Follow up with customer
      - Send to customer support team
      - None
      required: false
    - id: 10
      name: customer_service_response
      label: Customer Service Response
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      required: false
    - id: 11
      name: issue_recurring
      label: Issue Recurring
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: customer_service_score
      label: Customer Service Score
      hint: null
      type: number
      options: []
      required: false
