inputSchema:
  type: object
  properties:
    title: Customer Negative Feedback Handling Survey
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Enter a valid email address
      type: email
      options: []
      required: false
    - id: 4
      name: feedback_description
      label: Feedback Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: feedback_reason
      label: Reason for Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: feedback_type
      label: Type of Feedback
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 7
      name: feedback_source
      label: Source of Feedback
      hint: null
      type: text
      options: []
      required: false
