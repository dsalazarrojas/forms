inputSchema:
  type: object
  properties:
    title: Community Service Complaint Form
    pages:
    - id: 1
      name: section_complainant
      label: -- Complainant Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: preferred_contact
      label: Preferred contact method
      hint: How should we reach you?
      type: select_one
      options:
      - Email
      - Phone
      - Mail
      required: true
    - id: 6
      name: section_complaint
      label: -- Complaint Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_type
      label: Which service are you complaining about?
      hint: null
      type: select_one
      options:
      - Waste Management
      - Parks and Recreation
      - Road Maintenance
      - Public Library
      - Social Services
      - Other
      required: true
    - id: 8
      name: service_other
      label: Specify other service
      hint: If other, please provide the name.
      type: text
      options: []
      required: false
    - id: 9
      name: incident_date
      label: Date of the incident
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: incident_time
      label: Time of the incident
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: incident_location
      label: Location of the incident
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: complaint_description
      label: Detailed description of the complaint
      hint: Provide as much detail as possible.
      type: text
      options: []
      required: true
    - id: 13
      name: complaint_priority
      label: What is the priority of this complaint?
      hint: Based on safety or impact.
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 14
      name: previously_reported
      label: Have you reported this issue before?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: previous_report_reference
      label: Previous report reference number
      hint: If available.
      type: text
      options: []
      required: false
    - id: 16
      name: section_resolution
      label: -- Resolution --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: desired_outcome
      label: What outcome are you seeking?
      hint: Tell us how we can make this right.
      type: text
      options: []
      required: true
    - id: 18
      name: anonymous_submission
      label: Submit anonymously?
      hint: If yes, we cannot follow up with you.
      type: select_one
      options:
      - 'Yes'
      - No - keep me informed
      required: true
