inputSchema:
  type: object
  properties:
    title: Food Pest Complaint Form
    pages:
    - id: 1
      name: customer_info
      label: Customer Information
      hint: Please provide your information to help us better assist you.
      type: text
      options: []
      required: true
    - id: 2
      name: complaint_details
      label: Complaint Details
      hint: Please provide a detailed description of the incident.
      type: text
      options: []
      required: true
    - id: 3
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: food_establishment
      label: Food Establishment
      hint: Please provide the name of the food establishment.
      type: select_one
      options:
      - McDonald's
      - Pizza Hut
      - KFC
      - Other
      required: true
    - id: 5
      name: incident_location
      label: Incident Location
      hint: Please provide the address of the incident.
      type: select_multiple
      options:
      - Inside
      - Outside
      - Near
      - Not sure
      required: true
    - id: 6
      name: incident_description
      label: Incident Description
      hint: Please describe what happened.
      type: note
      options: []
      required: true
    - id: 7
      name: customer_signature
      label: Customer Signature
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: staff_signature
      label: Staff Signature
      hint: null
      type: date
      options: []
      required: true
