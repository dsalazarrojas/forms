inputSchema:
  type: object
  properties:
    title: Software Complaint Form
    pages:
    - id: 1
      name: software_complaint_form_step_1
      label: Software Complaint
      hint: Please describe the issue in detail.
      type: text
      options: []
      required: true
    - id: 2
      name: software_version
      label: Software Version
      hint: The version of the software you are using.
      type: text
      options: []
      required: false
    - id: 3
      name: report_date
      label: Report Date
      hint: The date of the issue.
      type: date
      options: []
      required: true
    - id: 4
      name: report_time
      label: Report Time
      hint: The time of the day when you encountered the issue.
      type: time
      options: []
      required: true
    - id: 5
      name: complaint_type
      label: Complaint Type
      hint: Type of complaint (bug, feature request, or other).
      type: select_one
      options:
      - Bug
      - Feature Request
      - Other
      required: true
    - id: 6
      name: problem_area
      label: Problem Area
      hint: Select all related areas where the issue occurred.
      type: select_multiple
      options:
      - UI
      - Functionality
      - Performance
      - Data
      - Security
      - Other
      required: true
    - id: 7
      name: additional_feedback
      label: Additional Feedback
      hint: Provide more details about the issue.
      type: text
      options: []
      required: false
    - id: 8
      name: contact_name
      label: Contact Name
      hint: Please provide your name.
      type: text
      options: []
      required: true
    - id: 9
      name: contact_email
      label: Contact Email
      hint: Your email address for follow-up.
      type: email
      options: []
      required: true
    - id: 10
      name: contact_phone
      label: Contact Phone
      hint: Your phone number for immediate contact.
      type: text
      options: []
      required: false
    - id: 11
      name: submit_form
      label: Submit Form
      hint: Submit the form.
      type: note
      options: []
      required: true
