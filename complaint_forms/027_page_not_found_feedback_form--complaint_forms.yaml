inputSchema:
  type: object
  properties:
    title: Page Not Found Feedback Form
    pages:
    - id: 1
      name: user_input
      label: user_input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: broken_link
      label: Broken Link
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: impact
      label: impact
      hint: null
      type: select_multiple
      options:
      - what the visitor was trying to reach
      - how the issue impacted them
      - what to fix next
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Do not submit
      required: false
