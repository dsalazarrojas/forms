inputSchema:
  type: object
  properties:
    title: health_outreach_complaint_form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: complaint_details
      label: Complaint Details
      hint: null
      type: note
      options: []
      required: true
    - id: 4
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - In-person
      required: true
    - id: 5
      name: provider
      label: Provider
      hint: null
      type: select_multiple
      options:
      - Doctor
      - Staff
      - Nurse
      required: false
    - id: 6
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time_of_visit
      label: Time of Visit
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: follow_up_status
      label: Follow-up Status
      hint: null
      type: select_one
      options:
      - Scheduled
      - Complete
      - Not Scheduled
      required: true
    - id: 10
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - Other
      required: true
    - id: 11
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
