inputSchema:
  type: object
  properties:
    title: Complaint Management Absence Form
    pages:
    - id: 1
      name: absence_complaint_header
      label: -- Absence-Related Complaint and Dispute --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name_abs
      label: Employee Full Name
      hint: Enter your full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: department_abs
      label: Department
      hint: Your current working department
      type: text
      options: []
      required: true
    - id: 4
      name: manager_name_abs
      label: Reporting Manager
      hint: Name of your direct supervisor
      type: text
      options: []
      required: true
    - id: 5
      name: absence_dispute_details_header
      label: -- Dispute Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date_of_disputed_absence
      label: Date of Disputed Absence
      hint: The specific day the absence occurred
      type: date
      options: []
      required: true
    - id: 7
      name: reason_for_absence_complaint
      label: Nature of Absence Complaint
      hint: Select the primary reason for your dispute
      type: select_one
      options:
      - Leave Request Unfairly Denied
      - Incorrect Deduction from Leave Balance
      - Dispute over Policy Interpretation
      - Miscommunication regarding absence
      - Other
      required: true
    - id: 8
      name: detailed_absence_dispute_narrative
      label: Detailed Narrative of Dispute
      hint: Provide full details on why you are filing this complaint
      type: text
      options: []
      required: true
    - id: 9
      name: evidence_provided_status
      label: Have you provided supporting documentation (e.g., medical note)?
      hint: Verification of absence
      type: select_one
      options:
      - Yes, already submitted
      - No, but will submit
      - No, not required for this case
      required: true
    - id: 10
      name: impact_on_leave_balance_text
      label: Expected Impact on Leave Balance
      hint: e.g., Restore 8 hours of Sick Leave
      type: text
      options: []
      required: false
    - id: 11
      name: desired_hr_resolution_abs
      label: Desired Resolution from HR
      hint: How would you like this dispute resolved?
      type: text
      options: []
      required: true
    - id: 12
      name: abs_complaint_submission_date
      label: Date of Submission
      hint: Today's date
      type: date
      options: []
      required: true
    - id: 13
      name: absence_complaint_digital_sign
      label: I certify that the information provided is accurate
      hint: Digital acknowledgement
      type: select_one
      options:
      - I so certify
      - Other
      required: true
