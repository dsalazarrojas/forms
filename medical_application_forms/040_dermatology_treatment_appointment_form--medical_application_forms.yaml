inputSchema:
  type: object
  properties:
    title: Dermatology Treatment Appointment Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_number
      label: contact_number
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Mail
      required: false
    - id: 5
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: treatment_type
      label: Treatment Type
      hint: null
      type: select_one
      options:
      - Consultation
      - Skin Treatment
      - Surgery
      required: false
    - id: 8
      name: appointment_length
      label: Appointment Length
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: additional_notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
