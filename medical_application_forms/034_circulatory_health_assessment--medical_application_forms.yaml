      hint: null
      type: select_one
      options:
      - Never smoked
      - Former smoker
      - Current smoker
      required: true
    - id: 29
      name: alcohol_use
      label: Alcohol Use
      hint: null
      type: select_one
      options:
      - None
      - Occasional
      - Moderate
      - Heavy
      required: false
    - id: 30
      name: physical_activity
      label: Physical Activity Level
      hint: null
      type: select_one
      options:
      - Sedentary
      - Light activity
      - Moderate activity
      - Vigorous activity
      required: true
    - id: 31
      name: exercise_tolerance
      label: Exercise Tolerance
      hint: How much physical activity can you do before symptoms
      type: text
      options: []
      required: false
