      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: billing_provider_address
      label: Billing Provider Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: patient_phone
      label: Patient Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: patient_email
      label: Patient E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: medical_service_rendered
      label: Medical Service Rendered
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - paid
      - unpaid
      - partial
      required: true
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
