inputSchema:
  type: object
  properties:
    title: Blood Donation Form
    pages:
    - id: 1
      name: donation_intro
      label: -- Blood Donor Registration Form --
      hint: Register to become a blood donor
      type: note
      options: []
      required: false
    - id: 2
      name: donor_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: donor_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: donor_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: donor_gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      - Prefer not to say
      required: true
    - id: 6
      name: donor_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: donor_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: donor_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: donor_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: donor_state
      label: State/Province
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: donor_zip
      label: ZIP/Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: blood_type
      label: Blood Type
      hint: If known
      type: select_one
      options:
      - O+
      - O-
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - Unknown
      required: false
    - id: 13
      name: weight
      label: Weight (lbs)
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: previous_donor
      label: Have you donated blood before?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 15
      name: health_conditions
      label: Do you have any chronic health conditions?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 16
      name: current_medications
      label: Are you currently taking medications?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 17
      name: allergies
      label: Do you have any allergies?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: family_blood_disease
      label: Family history of blood disorders?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: true
    - id: 19
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
