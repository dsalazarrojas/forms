      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: signature_date
      label: Signature Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: patient_signature
      label: Patient Signature
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
