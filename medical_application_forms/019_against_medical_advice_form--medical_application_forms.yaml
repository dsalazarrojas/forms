inputSchema:
  type: object
  properties:
    title: Against Medical Advice Form
    pages:
    - id: 1
      name: header
      label: -- Patient Discharge Against Medical Advice - AMA --
      hint: Important legal and medical disclosure
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: mrn_number
      label: Medical Record Number - MRN
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: physician_name
      label: Attending Physician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: risk_header
      label: -- Acknowledgment of Risks --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: risk_disclaimer
      label: I understand that leaving the hospital against the advice of my physician may result in serious injury or death.
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: discussed_risks
      label: Specific risks discussed - Infection, Worsening Condition, Disability, Death
      hint: select all risks explained to the patient
      type: select_multiple
      options:
      - Acute Infection
      - Worsening of underlying condition
      - Permanent Disability
      - Organ Failure
      - Sudden Death
      required: true
    - id: 9
      name: departure_reason
      label: Patient's stated reason for leaving
      hint: why is the patient choosing to leave now
      type: text
      options: []
      required: true
    - id: 10
      name: liability_release
      label: I release the hospital and physicians from any liability resulting from my decision to leave.
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: witness_name
      label: Name of Witness - Staff Member
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: signing_date
      label: Date of Signing
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: departure_time
      label: Time of Departure
      hint: null
      type: time
      options: []
      required: true
