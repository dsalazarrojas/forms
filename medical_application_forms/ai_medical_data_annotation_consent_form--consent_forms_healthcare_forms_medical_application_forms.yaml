inputSchema:
  type: object
  properties:
    title: AI Medical Data Annotation Consent Form
    pages:
    - id: 1
      name: consent_header
      label: '--- AI Medical Data Annotation Consent ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Please enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: patient_dob
      label: Date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: patient_age
      label: Age
      hint: null
      type: integer
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone number
      hint: Contact number for follow-up questions
      type: phone
      options: []
      required: false
    - id: 6
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: visit_date
      label: Date of visit
      hint: Date of most recent medical consultation
      type: date
      options: []
      required: true
    - id: 8
      name: medical_record_number
      label: Medical record number
      hint: Unique identifier assigned by healthcare provider
      type: text
      options: []
      required: true
    - id: 9
      name: data_types_consent
      label: Types of medical data for AI annotation (select all that apply)
      hint: Select all data types you consent to share
      type: select_multiple
      options:
      - Lab results
      - Imaging scans
      - Pathology reports
      - Clinical notes
      - Vital signs
      - Medication records
      - Diagnostic codes
      - Treatment plans
      required: true
    - id: 10
      name: research_purpose
      label: Primary research purpose
      hint: null
      type: select_one
      options:
      - Disease detection algorithms
      - Treatment outcome prediction
      - Drug discovery research
      - Population health studies
      - Medical imaging enhancement
      required: true
    - id: 11
      name: data_sharing_consent
      label: Do you consent to sharing your data with external research partners?
      hint: null
      type: select_one
      options:
      - Yes, with de-identified data only
      - Yes, with appropriate safeguards
      - No, data should remain within institution
      - Undecided, contact me for details
      required: true
    - id: 12
      name: data_retention_period
      label: Preferred data retention period
      hint: How long you consent to keep your data in the research database
      type: select_one
      options:
      - 1 year
      - 5 years
      - 10 years
      - Indefinitely
      - Until project completion
      required: true
    - id: 13
      name: withdrawal_rights
      label: I understand I can withdraw consent at any time
      hint: null
      type: select_one
      options:
      - Yes, I understand and agree
      - No, I need more information
      required: true
    - id: 14
      name: compensation_acknowledgment
      label: Are you participating for compensation?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: true
    - id: 15
      name: signature_consent
      label: Electronic signature
      hint: Typing your full name here serves as your electronic signature
      type: text
      options: []
      required: true
    - id: 16
      name: consent_date
      label: Date of consent
      hint: null
      type: date
      options: []
      required: true
    - id: 17
      name: witness_signature
      label: Witness signature (if applicable)
      hint: Healthcare provider or staff member witnessing consent
      type: text
      options: []
      required: false
    - id: 18
      name: additional_comments
      label: Additional comments or concerns
      hint: Any other information you'd like to share regarding your consent
      type: text
      options: []
      required: false
