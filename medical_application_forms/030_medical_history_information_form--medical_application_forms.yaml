inputSchema:
  type: object
  properties:
    title: medical history information form
    pages:
    - id: 1
      name: medical_history_form_1
      label: Medical History
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: patient_name
      label: patient_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: medical_conditions
      label: medical_conditions
      hint: null
      type: select_multiple
      options:
      - diabetes
      - hypertension
      - asthma
      - epilepsy
      - cancer
      - heart disease
      - kidney disease
      - liver disease
      - neurological disease
      - mental health disease
      - sleep apnea
      - other medical condition
      required: false
    - id: 5
      name: medical_tests
      label: medical_tests
      hint: null
      type: select_multiple
      options:
      - ekg
      - blood test
      - urine test
      - ct scan
      - mri scan
      - x ray
      - ultrasound
      - ct scan 2
      - mri scan 2
      - other medical test
      required: false
    - id: 6
      name: medical_allergies
      label: medical_allergies
      hint: null
      type: select_one
      options:
      - penicillin
      - latex
      - shellfish
      - soy
      - egg
      - milk
      - tree nuts
      - other allergy
      required: false
    - id: 7
      name: medical_history
      label: medical_history
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: family_history
      label: family_history
      hint: null
      type: select_multiple
      options:
      - diabetes
      - heart disease
      - cancer
      - mental health disease
      - other family history
      required: false
    - id: 9
      name: medical_medical_procedure
      label: medical_procedure
      hint: null
      type: select_multiple
      options:
      - blood transfusion
      - surgery
      - chemotherapy
      - radiation
      - other medical procedure
      required: false
    - id: 10
      name: medical_medical_history_other
      label: medical_history_other
      hint: null
      type: text
      options: []
      required: false
