      options:
      - '{''id'': 1, ''label'': ''Private''}'
      - '{''id'': 2, ''label'': ''Medicare''}'
      - '{''id'': 3, ''label'': ''Medicaid''}'
      - '{''id'': 4, ''label'': ''Tricare''}'
      - '{''id'': 5, ''label'': ''Other''}'
      required: false
    - id: 9
      name: medical_record_notes
      label: Medical Record Notes
      hint: null
      type: note
      options: []
