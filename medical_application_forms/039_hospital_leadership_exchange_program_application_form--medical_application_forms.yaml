inputSchema:
  type: object
  properties:
    title: Hospital Leadership Exchange Program Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Applicant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: experience
      label: Work Experience
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: motivation
      label: Motivation
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_details
      label: Contact Details
      hint: null
      type: select_one
      options:
      - '{''name'': ''Phone'', ''value'': ''phone''}'
      - '{''name'': ''Email'', ''value'': ''email''}'
      required: false
    - id: 5
      name: medical_licensure
      label: Medical Licensure
      hint: null
      type: select_one
      options:
      - '{''name'': True, ''value'': True}'
      - '{''name'': False, ''value'': False}'
      required: false
