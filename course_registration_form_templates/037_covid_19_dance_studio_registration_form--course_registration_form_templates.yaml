inputSchema:
  type: object
  properties:
    title: COVID 19 Dance Studio Registration Form
    pages:
    - id: 1
      name: class_date
      label: Class Date
      hint: Date of the dance class
      type: date
      options: []
      required: true
    - id: 2
      name: class_time
      label: Class Time
      hint: What time does the class start?
      type: time
      options: []
      required: true
    - id: 3
      name: instructor_name
      label: Instructor Name
      hint: Name of the dance instructor
      type: text
      options: []
      required: true
    - id: 4
      name: dance_style
      label: Dance Style
      hint: Ballet, Hip-Hop, Jazz, Contemporary, etc.
      type: select_one
      options:
      - Ballet
      - Jazz
      - Contemporary
      - Hip-Hop
      - Tap
      - Latin
      - Ballroom
      - Other
      required: true
    - id: 5
      name: class_level
      label: Class Level
      hint: Beginner, Intermediate, Advanced
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - All Levels
      required: true
    - id: 6
      name: dancer_name
      label: Dancer Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 7
      name: dancer_age
      label: Age
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: parent_name
      label: Parent/Guardian Name
      hint: If dancer is a minor
      type: text
      options: []
      required: false
    - id: 9
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: attendance_status
      label: Attendance Status
      hint: Will you be attending this class?
      type: select_one
      options:
      - Yes - Attending
      - No - Absence
      - Late Arrival
      - Early Departure
      - Excused Absence
      required: true
    - id: 12
      name: health_screening
      label: Health Screening Completed
      hint: COVID-19 health check
      type: select_one
      options:
      - Yes - Passed
      - Yes - Did not pass
      - Not completed
      - Exempted
      required: true
    - id: 13
      name: fever_present
      label: Do you have a fever?
      hint: 100.4 degrees F or higher
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Not checked
      required: true
    - id: 14
      name: covid_symptoms
      label: COVID-19 Symptoms
      hint: Cough, shortness of breath, loss of taste/smell
      type: select_one
      options:
      - No symptoms
      - Mild symptoms
      - Moderate symptoms
      - Severe symptoms
      required: true
    - id: 15
      name: covid_exposure
      label: COVID-19 Exposure in Last 14 Days
      hint: null
      type: select_one
      options:
      - No exposure
      - Possible exposure
      - Confirmed exposure
      - Not sure
      - Prefer not to say
      required: true
    - id: 16
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Prefer not to say
      required: false
    - id: 17
      name: quarantine_status
      label: Currently Under Quarantine or Isolation
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Unsure
      required: true
    - id: 18
      name: mask_worn
      label: Will you wear a mask during class?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - As needed
      - Exempted
      required: false
    - id: 19
      name: payment_method
      label: Payment Method
      hint: How will you pay for the class?
      type: select_one
      options:
      - Class Pack
      - Monthly Membership
      - Drop-in Fee
      - Other
      required: false
    - id: 20
      name: payment_amount
      label: Amount Paid
      hint: null
      type: number
      options: []
      required: false
    - id: 21
      name: emergency_contact
      label: Emergency Contact Name
      hint: In case of medical emergency
      type: text
      options: []
      required: false
    - id: 22
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: medical_conditions
      label: Any Medical Conditions We Should Know About?
      hint: Injuries, allergies, etc.
      type: text
      options: []
      required: false
