inputSchema:
  type: object
  properties:
    title: Tennis Session Registration Form
    pages:
    - id: 1
      name: attendee_name
      label: Attendee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''name'': ''Morning''}'
      - '{''id'': 2, ''name'': ''Afternoon''}'
      - '{''id'': 3, ''name'': ''Evening''}'
      required: true
    - id: 6
      name: time_slot
      label: Time Slot
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time_of_day
      label: Time of Day
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: attendee_details
      label: Attendee Details
      hint: null
      type: text
      options: []
      required: false
