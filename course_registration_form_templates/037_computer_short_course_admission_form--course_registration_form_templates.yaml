inputSchema:
  type: object
  properties:
    title: Computer Short Course Admission Form
    pages:
      - id: 1
        name: section_applicant_info
        label: -- Applicant Information --
        hint: Short course application details and contact info
        type: note
        options: []
        required: false
      - id: 2
        name: applicant_name
        label: Applicant name
        hint: Full name for admission
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email address
        hint: For admissions communication
        type: email
        options: []
        required: true
      - id: 4
        name: prior_experience
        label: Prior experience
        hint: Brief description of prior coding experience
        type: text
        options: []
        required: false
      - id: 5
        name: preferred_start_date
        label: Preferred start date
        hint: When you would like to begin the course
        type: date
        options: []
        required: false
      - id: 6
        name: payment_method
        label: Payment method
        hint: Choose how you will pay for the course
        type: select_one
        options: [Credit card, Bank transfer, Invoice]
        required: true
      - id: 7
        name: emergency_contact
        label: Emergency contact
        hint: Name and phone for emergencies
        type: text
        options: []
        required: false
