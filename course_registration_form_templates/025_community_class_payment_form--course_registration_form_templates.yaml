inputSchema:
  type: object
  properties:
    title: Community Class Payment Form
    pages:
    - id: 1
      name: student_name
      label: Student name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: class_name
      label: Class name
      hint: Title of the course or session
      type: text
      options: []
      required: true
    - id: 3
      name: session_date
      label: Session date
      hint: Date of the session being paid for
      type: date
      options: []
      required: true
    - id: 4
      name: payment_amount
      label: Payment amount
      hint: Numeric amount in local currency
      type: number
      options: []
      required: true
    - id: 5
      name: payment_method
      label: Payment method
      hint: Select payment option
      type: select_one
      options:
      - Credit card
      - Cash
      - Bank transfer
      - Check
      required: true
    - id: 6
      name: receipt_email
      label: Receipt email address
      hint: Where to send payment receipt
      type: email
      options: []
      required: true
    - id: 7
      name: discount_code
      label: Discount code
      hint: Optional promotional code
      type: text
      options: []
      required: false
    - id: 8
      name: agreement
      label: Attendance and refund policy agreement
      hint: Confirm acceptance of policies
      type: select_one
      options:
      - I agree to the policies
      - I do not agree
      required: true
