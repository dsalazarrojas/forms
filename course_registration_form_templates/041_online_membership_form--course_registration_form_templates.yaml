inputSchema:
  type: object
  properties:
    title: Online Membership Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Please enter your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Please enter your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Please enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Please enter your phone number
      type: text
      options: []
      required: true
    - id: 5
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Please enter the emergency contact's name
      type: text
      options: []
      required: true
    - id: 6
      name: emergency_contact_relationship
      label: Relationship with Emergency Contact
      hint: Please select your relationship with the emergency contact
      type: select_one
      options:
      - Parent/Guardian
      - Friend
      - Relative
      required: true
    - id: 7
      name: student_grade
      label: Student Grade
      hint: Please select your student grade
      type: select_multiple
      options:
      - High
      - Low
      required: true
    - id: 8
      name: payment_plan
      label: Payment Plan
      hint: Please select your payment plan
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: class_level
      label: Class Level
      hint: Please select your class level
      type: select_multiple
      options:
      - High
      - Low
      required: true
    - id: 10
      name: start_date
      label: Start Date
      hint: Please select the start date
      type: date
      options: []
      required: true
    - id: 11
      name: end_date
      label: End Date
      hint: Please select the end date
      type: date
      options: []
      required: true
    - id: 12
      name: classes_per_week
      label: Classes per Week
      hint: Please enter the number of classes per week
      type: number
      options: []
      required: true
    - id: 13
      name: class_time
      label: Class Time
      hint: Please select the class time
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: student_name
      label: Student Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 15
      name: parents_name
      label: Parent's Name
      hint: Please enter your parent's name
      type: text
      options: []
      required: true
    - id: 16
      name: parents_email
      label: Parent's Email
      hint: Please enter your parent's email
      type: email
      options: []
      required: true
    - id: 17
      name: medical_condition
      label: Medical Condition
      hint: Please select your medical condition
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: allergies
      label: Allergies
      hint: Please enter your allergies
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_note
      label: Emergency Contact Note
      hint: Please enter a note about the emergency contact
      type: note
      options: []
      required: false
    - id: 20
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Please enter the emergency contact's phone number
      type: text
      options: []
      required: false
    - id: 21
      name: emergency_contact_email
      label: Emergency Contact Email
      hint: Please enter the emergency contact's email
      type: email
      options: []
      required: false
