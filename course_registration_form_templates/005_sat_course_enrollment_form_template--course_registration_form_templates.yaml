      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: course_start_time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: price
      label: course_price
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: submit_button
      label: submit
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: payment_status
      label: payment_status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: false
    - id: 10
      name: order_id
