      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: course_number
      label: What is the course number you are interested in?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: course_name
      label: What is the course name you are interested in?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: start_date
      label: When would you like to start the course?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: end_date
      label: When would you like to end the course?
      hint: null
      type: date
      options: []
      required: true
    - id: 7
