inputSchema:
  type: object
  properties:
    title: Continuing Education Enrollment Form
    pages:
    - id: 1
      name: student_full_name
      label: Student Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: Student ID
      hint: Identification number
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 6
      name: mailing_address
      label: Mailing Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: course_selection
      label: Course Selection
      hint: Choose your course
      type: select_one
      options:
      - Business Management
      - Healthcare Administration
      - Information Technology
      - Project Management
      - Human Resources
      - Accounting
      - Marketing
      - Legal Studies
      required: true
    - id: 11
      name: course_section
      label: Course Section
      hint: Preferred section
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekend
      - Online
      required: true
    - id: 12
      name: semester_term
      label: Semester or Term
      hint: Enrollment period
      type: select_one
      options:
      - Spring 2026
      - Summer 2026
      - Fall 2026
      - Winter 2026
      required: true
    - id: 13
      name: enrollment_type
      label: Enrollment Type
      hint: Full-time or part-time
      type: select_one
      options:
      - Full-time
      - Part-time
      - Audit only
      required: true
    - id: 14
      name: prior_education
      label: Prior Education
      hint: Highest level completed
      type: select_one
      options:
      - High School
      - Associate Degree
      - Bachelor's Degree
      - Master's Degree
      - Doctorate
      required: true
    - id: 15
      name: employer_sponsorship
      label: Employer Sponsorship
      hint: Is your employer paying?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: payment_method
      label: Payment Method
      hint: How will you pay?
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Bank Transfer
      - Check
      - Financial Aid
      - Employer Payment
      required: true
    - id: 17
      name: special_accommodations
      label: Special Accommodations
      hint: Do you need accommodations?
      type: text
      options: []
      required: false
    - id: 18
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 20
      name: terms_agreement
      label: Terms Agreement
      hint: I agree to the terms and conditions
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
