inputSchema:
  type: object
  properties:
    title: Class And Teacher Filter Form
    pages:
    - id: 1
      name: parent_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: student_name
      label: Student Name
      hint: Child name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: For correspondence
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Select the grade
      type: select_one
      options:
      - Kindergarten
      - Grade 1
      - Grade 2
      - Grade 3
      - Grade 4
      - Grade 5
      - Grade 6
      - Grade 7
      - Grade 8
      - Grade 9
      - Grade 10
      - Grade 11
      - Grade 12
      required: true
    - id: 6
      name: academic_year
      label: Academic Year
      hint: School year
      type: select_one
      options:
      - 2025-2026
      - 2026-2027
      - 2027-2028
      required: true
    - id: 7
      name: semester_term
      label: Semester or Term
      hint: Select term
      type: select_one
      options:
      - Fall Semester
      - Spring Semester
      - Summer Session
      - Full Year
      required: true
    - id: 8
      name: subject_area
      label: Subject Area of Interest
      hint: Select subject
      type: select_one
      options:
      - Mathematics
      - English Language Arts
      - Science
      - Social Studies
      - Foreign Language
      - Arts
      - Music
      - Physical Education
      - Technology
      - Any Subject
      required: true
    - id: 9
      name: class_level
      label: Class Level Preference
      hint: Difficulty level
      type: select_one
      options:
      - Remedial or Support
      - Standard Level
      - Advanced or Honors
      - Advanced Placement
      - No preference
      required: true
    - id: 10
      name: class_format
      label: Preferred Class Format
      hint: How classes are delivered
      type: select_one
      options:
      - In-person only
      - Online only
      - Hybrid or blended
      - No preference
      required: true
    - id: 11
      name: class_schedule
      label: Preferred Class Schedule
      hint: Time of day
      type: select_multiple
      options:
      - Morning (8AM-12PM)
      - Afternoon (12PM-4PM)
      - Evening (4PM-8PM)
      - Weekend classes
      - Flexible schedule
      required: false
    - id: 12
      name: teacher_preference
      label: Do You Have a Teacher Preference
      hint: Specific teacher request
      type: select_one
      options:
      - Yes, requesting specific teacher
      - No preference
      - Open to recommendations
      required: true
    - id: 13
      name: preferred_teacher
      label: Preferred Teacher Name
      hint: If you have a preference
      type: text
      options: []
      required: false
    - id: 14
      name: teacher_reason
      label: Reason for Teacher Preference
      hint: Why this teacher
      type: text
      options: []
      required: false
    - id: 15
      name: class_size
      label: Preferred Class Size
      hint: Number of students
      type: select_one
      options:
      - Small (under 15 students)
      - Medium (15-25 students)
      - Large (25+ students)
      - No preference
      required: true
    - id: 16
      name: learning_style
      label: Student Learning Style
      hint: How does your child learn best
      type: select_one
      options:
      - Visual learner
      - Auditory learner
      - Kinesthetic or hands-on
      - Reading and writing
      - Mixed style
      - Unsure
      required: true
    - id: 17
      name: special_needs
      label: Does Your Child Have Special Needs
      hint: Requiring accommodations
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: special_needs_details
      label: Please Describe Special Needs
      hint: If yes, provide details
      type: text
      options: []
      required: false
    - id: 19
      name: previous_experience
      label: Has Your Child Taken This Class Before
      hint: Prior experience
      type: select_one
      options:
      - Yes, at this school
      - Yes, at another school
      - No, first time
      required: true
    - id: 20
      name: enrollment_priority
      label: What Is Your Enrollment Priority
      hint: Main factor in selection
      type: select_one
      options:
      - Teacher quality and reputation
      - Class schedule convenience
      - Class level and rigor
      - Class size
      - Location
      - Cost
      required: true
    - id: 21
      name: additional_comments
      label: Additional Comments or Requests
      hint: Any other information
      type: text
      options: []
      required: false
