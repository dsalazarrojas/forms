inputSchema:
  type: object
  properties:
    title: Professional Development Waiting List
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: program
      label: Program of Interest
      hint: null
      type: select_one
      options:
      - Program A
      - Program B
      - Program C
      required: true
    - id: 5
      name: location
      label: Location
      hint: null
      type: select_multiple
      options:
      - City A
      - City B
      - City C
      required: true
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: follow_upistency
      label: Follow-up Intensity
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 9
      name: follow_up_method
      label: Follow-up Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Chat
      required: true
    - id: 10
      name: follow_up_frequency
      label: Follow-up Frequency
      hint: null
      type: select_multiple
      options:
      - Once
      - Twice
      - Weekly
      - Monthly
      required: true
    - id: 11
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
