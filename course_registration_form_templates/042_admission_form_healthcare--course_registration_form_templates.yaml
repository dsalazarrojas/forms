inputSchema:
  type: object
  properties:
    title: Admission Form Healthcare
    pages:
    - id: 1
      name: admission_header
      label: -- Healthcare Program Admission Form --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_full_name
      label: Full Name
      hint: Enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_email
      label: Email Address
      hint: Valid email for communication
      type: email
      options: []
      required: true
    - id: 4
      name: applicant_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: applicant_address
      label: Address
      hint: Current residential address
      type: text
      options: []
      required: true
    - id: 6
      name: applicant_city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 7
      name: applicant_state
      label: State/Province
      hint: State or province of residence
      type: text
      options: []
      required: true
    - id: 8
      name: applicant_zip
      label: ZIP/Postal Code
      hint: Postal code of residence
      type: text
      options: []
      required: true
    - id: 9
      name: applicant_country
      label: Country
      hint: Country of residence
      type: text
      options: []
      required: true
    - id: 10
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: true
    - id: 11
      name: program_applying_for
      label: Program Applying For
      hint: What healthcare program are you applying for?
      type: text
      options: []
      required: true
    - id: 12
      name: degree_level
      label: Degree Level
      hint: What level of degree are you pursuing?
      type: select_one
      options:
      - Certificate
      - Diploma
      - Associate
      - Bachelor's
      - Master's
      - Doctorate
      - Other
      required: true
    - id: 13
      name: start_term
      label: Start Term
      hint: Which term do you wish to start?
      type: select_one
      options:
      - Fall
      - Spring
      - Summer
      - Winter
      - Other
      required: true
    - id: 14
      name: start_year
      label: Start Year
      hint: What year do you wish to start?
      type: number
      options: []
      required: true
    - id: 15
      name: education_background
      label: Education Background
      hint: Describe your educational background
      type: text
      options: []
      required: true
    - id: 16
      name: previous_institution
      label: Previous Institution
      hint: Name of your previous educational institution
      type: text
      options: []
      required: false
    - id: 17
      name: gpa
      label: GPA
      hint: Your cumulative GPA
      type: number
      options: []
      required: false
    - id: 18
      name: standardized_test_scores
      label: Standardized Test Scores
      hint: MCAT, DAT, PCAT, OAT, or other healthcare-related test scores
      type: text
      options: []
      required: false
    - id: 19
      name: healthcare_experience
      label: Healthcare Experience
      hint: Describe any relevant healthcare experience
      type: text
      options: []
      required: false
    - id: 20
      name: work_experience
      label: Work Experience
      hint: Describe any other relevant work experience
      type: text
      options: []
      required: false
    - id: 21
      name: volunteer_experience
      label: Volunteer Experience
      hint: Describe any relevant volunteer experience
      type: text
      options: []
      required: false
    - id: 22
      name: personal_statement
      label: Personal Statement
      hint: Write a personal statement about your goals in healthcare
      type: text
      options: []
      required: false
    - id: 23
      name: references
      label: References
      hint: Provide contact information for references
      type: text
      options: []
      required: false
    - id: 24
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of your emergency contact
      type: text
      options: []
      required: true
    - id: 25
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number of your emergency contact
      type: text
      options: []
      required: true
    - id: 26
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to your emergency contact
      type: text
      options: []
      required: true
    - id: 27
      name: medical_clearances
      label: Medical Clearances
      hint: Do you have required medical clearances (immunizations, physical exam,
        etc.)?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - In Progress
      required: true
    - id: 28
      name: background_check_consent
      label: Background Check Consent
      hint: Do you consent to a background check as part of the admission process?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 29
      name: drug_screen_consent
      label: Drug Screen Consent
      hint: Do you consent to a drug screening as part of the admission process?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 30
      name: application_date
      label: Application Date
      hint: Date of submitting this application
      type: date
      options: []
      required: true
    - id: 31
      name: applicant_signature
      label: Applicant Signature
      hint: Electronic signature to confirm application
      type: text
      options: []
      required: true
