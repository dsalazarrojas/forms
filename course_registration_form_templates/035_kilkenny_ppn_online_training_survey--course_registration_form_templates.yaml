inputSchema:
  type: object
  properties:
    title: kilkenny_ppn_online_training_survey
    pages:
    - id: 1
      name: user_details
      label: User Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_selection
      label: What type of online training do you want?
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      - Option C
      required: true
    - id: 3
      name: course_type
      label: What type of course do you want?
      hint: null
      type: select_one
      options:
      - Online Course
      - Face-to-Face
      required: true
    - id: 4
      name: start_date
      label: When would you like to start?
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: end_date
      label: When would you like to end?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: training_location
      label: What location would you like to attend?
      hint: null
      type: select_multiple
      options:
      - Location 1
      - Location 2
      - Location 3
      required: true
    - id: 7
      name: preferred_time
      label: What time of day do you prefer?
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
