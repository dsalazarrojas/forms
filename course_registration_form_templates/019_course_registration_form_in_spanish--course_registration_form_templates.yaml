inputSchema:
  type: object
  properties:
    title: Course Registration Form In Spanish
    pages:
    - id: 1
      name: course_info
      label: course_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_registration
      label: Date of Registration
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: course_code
      label: Course Code
      hint: null
      type: select_one
      options:
      - '{1: ''ABC''}'
      - '{2: ''DEF''}'
      - '{3: ''GHI''}'
      required: false
    - id: 8
      name: course_level
      label: Course Level
      hint: null
      type: select_multiple
      options:
      - '{1: ''Beginner''}'
      - '{2: ''Intermediate''}'
      - '{3: ''Advanced''}'
      required: false
