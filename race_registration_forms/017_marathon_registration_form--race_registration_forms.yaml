inputSchema:
  type: object
  properties:
    title: Marathon Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: marathon_name
      label: Marathon Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: participant_gender
      label: Participant Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      required: false
    - id: 7
      name: participant_age
      label: Participant Age
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: marathon_location
      label: Marathon Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: participant_agreement
      label: Participant Agreement
      hint: null
      type: select_multiple
      options:
      - Agree with the terms and conditions
      - I agree with the participant agreement
      required: false
