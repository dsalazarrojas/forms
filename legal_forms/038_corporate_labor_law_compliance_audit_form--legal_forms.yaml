inputSchema:
  type: object
  properties:
    title: Corporate Labor Law Compliance Audit Form
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_person
      label: Contact Person
      hint: Name and Title of person to contact
      type: text
      options: []
      required: true
    - id: 3
      name: location
