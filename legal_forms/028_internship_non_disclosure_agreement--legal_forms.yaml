      - I will not disclose any confidential information I have received or obtained
        during my internship.
      - I will not make any copies of confidential information I have received or
        obtained during my internship.
      - I have not obtained any confidential information during my internship.
      - I will disclose any confidential information that is required by law.
      - I will use any confidential information for the purpose of the internship.
