inputSchema:
  type: object
  properties:
    title: Child Custody Form
    pages:
      - id: 1
        name: section_case_info
        label: -- Case Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: case_number
        label: Court Case Number
        hint: If already assigned
        type: text
        options: []
        required: false
      - id: 3
        name: section_parent_a
        label: -- Parent A Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 4
        name: parent_a_name
        label: Parent A Full Name
        hint: Petitioner or Respondent
        type: text
        options: []
        required: true
      - id: 5
        name: parent_a_residence
        label: Parent A Residence
        hint: City and State
        type: text
        options: []
        required: true
      - id: 6
        name: section_parent_b
        label: -- Parent B Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: parent_b_name
        label: Parent B Full Name
        hint: Full legal name
        type: text
        options: []
        required: true
      - id: 8
        name: parent_b_residence
        label: Parent B Residence
        hint: City and State
        type: text
        options: []
        required: true
      - id: 9
        name: section_child_info
        label: -- Children Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 10
        name: children_details
        label: Names and Ages of Children
        hint: List all children involved in this case
        type: text
        options: []
        required: true
      - id: 11
        name: section_custody_request
        label: -- Custody Request --
        hint: null
        type: note
        options: []
        required: false
      - id: 12
        name: custody_type
        label: Type of Custody Requested
        hint: Select the desired arrangement
        type: select_one
        options:
          - label: Sole Legal Custody
            value: sole_legal
          - label: Joint Legal Custody
            value: joint_legal
          - label: Sole Physical Custody
            value: sole_physical
          - label: Joint Physical Custody
            value: joint_physical
        required: true
      - id: 13
        name: visitation_schedule
        label: Proposed Visitation Schedule
        hint: Describe weekends, holidays, and weekdays
        type: text
        options: []
        required: true
      - id: 14
        name: existing_orders
        label: Are there existing court orders?
        hint: Regarding custody or support
        type: select_one
        options:
          - label: Yes - Current Order in Place
            value: yes
          - label: No - Initial Filing
            value: no
        required: true
      - id: 15
        name: filing_date
        label: Date of Filing
        hint: Today date
        type: date
        options: []
        required: true
