inputSchema:
  type: object
  properties:
    title: Green Lease Addendum Consent Form
    pages:
    - id: 1
      name: tenant_signature
      label: Tenant Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: landlord_signature
      label: Landlord Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: tenant_consent
      label: Tenant Consent
      hint: null
      type: select_one
      options:
      - Tenant accepts the green lease terms with the sustainability commitments listed.
      - Tenant declines the green lease terms with the sustainability commitments
        listed.
      - Tenant accepts and signs the green lease terms with the sustainability commitments
        listed below.
      required: false
    - id: 4
      name: sustainability_commitments
      label: Sustainability Commitments
      hint: null
      type: select_multiple
      options:
      - Tenant is committed to recycling all materials used during the term.
      - Tenant is committed to reducing energy consumption during the term.
      - Tenant is committed to using water-efficient appliances during the term.
      required: false
    - id: 5
      name: landlord_consent
      label: Landlord Consent
      hint: null
      type: select_one
      options:
      - Landlord accepts the green lease terms with the sustainability commitments
        listed.
      - Landlord declines the green lease terms with the sustainability commitments
        listed.
      - Landlord accepts and signs the green lease terms with the sustainability commitments
        listed below.
      required: false
