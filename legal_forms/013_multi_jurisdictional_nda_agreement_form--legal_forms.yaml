inputSchema:
  type: object
  properties:
    title: Multi Jurisdictional NDA Agreement Form
    pages:
    - id: 1
      name: jurisdiction_selection
      label: Jurisdiction Selection
      hint: null
      type: select_multiple
      options:
      - Jurisdiction A
      - Jurisdiction B
      - Jurisdiction C
      required: true
    - id: 2
      name: confidentiality_agreement
      label: Confidentiality and Non-Disparagement Agreement
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: signer_information
      label: Signer Information
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: signer_signature
      label: Signer Signature and Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: agreement_acceptance
      label: Agreement Acceptance
      hint: null
      type: select_one
      options:
      - Accept
      - Decline
      required: true
    - id: 6
      name: date_and_time_stamp
      label: Date and Time Stamp
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: signer_verification
      label: Signer Verification
      hint: null
      type: select_one
      options:
      - Individual
      - Organization
      required: true
    - id: 8
      name: agreement_expiration
      label: Agreement Expiration
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: termination
      label: Termination
      hint: null
      type: select_one
      options:
      - Immediate
      - 30 Days
      - 60 Days
      required: true
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: signer_note
      label: Signer Note
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: agreement_version
      label: Agreement Version
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: signer_agreement
      label: Signer Agreement
      hint: null
      type: radio
      options:
      - Agree
      - Decline
      required: true
    - id: 14
      name: termination_date
      label: Termination Date
      hint: null
      type: date
      options: []
      required: false
    - id: 15
      name: termination_time
      label: Termination Time
      hint: null
      type: time
      options: []
      required: false
    - id: 16
      name: termination_note
      label: Termination Note
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: signer_confirmation
      label: Signer Confirmation
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: agreement_revision
      label: Agreement Revision
      hint: null
      type: text
      options: []
      required: false
