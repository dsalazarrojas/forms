inputSchema:
  type: object
  properties:
    title: Business Termination Notice Letter Generator
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Your business name
      type: text
      options: []
      required: true
    - id: 2
      name: company_address
      label: Company Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 3
      name: sender_name
      label: Sender Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 4
      name: sender_title
      label: Your Title or Position
      hint: Your role in the company
      type: text
      options: []
      required: true
    - id: 5
      name: sender_email
      label: Sender Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 6
      name: sender_phone
      label: Sender Phone
      hint: Contact phone
      type: text
      options: []
      required: false
    - id: 7
      name: recipient_name
      label: Recipient Name
      hint: Name of vendor, partner, or service provider
      type: text
      options: []
      required: true
    - id: 8
      name: recipient_company
      label: Recipient Company Name
      hint: Their organization name
      type: text
      options: []
      required: true
    - id: 9
      name: recipient_address
      label: Recipient Address
      hint: Their full address
      type: text
      options: []
      required: true
    - id: 10
      name: recipient_email
      label: Recipient Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: agreement_type
      label: Type of Agreement Being Terminated
      hint: Select the agreement type
      type: select_one
      options:
      - Service Agreement
      - Vendor Contract
      - Partnership Agreement
      - Supplier Agreement
      - Consulting Contract
      - Employment Agreement
      - Other
      required: true
    - id: 12
      name: agreement_start_date
      label: Agreement Start Date
      hint: When did the agreement begin
      type: date
      options: []
      required: true
    - id: 13
      name: termination_date
      label: Requested Termination Date
      hint: When should the agreement end
      type: date
      options: []
      required: true
    - id: 14
      name: termination_reason
      label: Reason for Termination
      hint: Why are you terminating
      type: select_one
      options:
      - Performance Issues
      - Change in Business Direction
      - Cost Reduction
      - Consolidation
      - Contract Expiration
      - Mutual Agreement
      - Other
      required: true
    - id: 15
      name: termination_details
      label: Additional Termination Details
      hint: Any specific concerns or conditions
      type: text
      options: []
      required: false
    - id: 16
      name: notice_period
      label: Notice Period Provided
      hint: Days of advance notice
      type: number
      options: []
      required: true
