      name: matter_description
      label: Matter Description
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: lead_counsel
      label: Primary Legal Counsel
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: case_number
      label: Case or Matter Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: section_contact
