inputSchema:
  type: object
  properties:
    title: Community Mediation Recording Consent Form
    pages:
      - id: 1
        name: consent_intro
        label: -- Mediation Recording Consent --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: participant_name
        label: Participant name
        hint: Full legal name
        type: text
        options: []
        required: true
      - id: 3
        name: role_in_mediation
        label: Role in mediation
        hint: Mediator, participant, or observer
        type: select_one
        options:
          - Mediator
          - Participant
          - Observer
        required: true
      - id: 4
        name: consent_to_record
        label: Consent to record session
        hint: Agree to audio and video recording
        type: select_one
        options:
          - I consent
          - I do not consent
        required: true
      - id: 5
        name: permitted_uses
        label: Permitted uses of recordings
        hint: Select allowed uses
        type: select_multiple
        options:
          - Case review
          - Training
          - Confidential archive
          - Other
        required: true
      - id: 6
        name: confidentiality_agreement
        label: Confidentiality agreement acknowledgement
        hint: Confirm understanding of confidentiality
        type: select_one
        options:
          - Acknowledge
          - Do not acknowledge
        required: true
      - id: 7
        name: withdraw_rights
        label: Rights to withdraw consent
        hint: Explain how to request withdrawal
        type: text
        options: []
        required: false
      - id: 8
        name: signature_name
        label: Signature name
        hint: Type full name to sign consent
        type: text
        options: []
        required: true
      - id: 9
        name: signature_date
        label: Signature date
        hint: Date of consent
        type: date
        options: []
        required: true
      - id: 10
        name: contact_for_questions
        label: Contact email for questions
        hint: Who to contact about consent
        type: email
        options: []
        required: false
