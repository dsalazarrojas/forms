inputSchema:
  type: object
  properties:
    title: Immigration Lawyer Application Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: client_email
      label: Client Email
      hint: Enter a valid email address
      type: email
      options: []
      required: true
    - id: 3
      name: client_phone
      label: Client Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: case_type
      label: Case Type
      hint: null
      type: select_one
      options:
      - Family Immigration
      - Business Immigration
      - Student Visa
      - Work Visa
      - Other
      required: false
    - id: 5
      name: case_description
      label: Case Description
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: application_status
      label: Application Status
      hint: null
      type: select_multiple
      options:
      - Pending
      - In Progress
      - Completed
      - Cancelled
      - On Hold
      required: false
    - id: 7
      name: document_upload
      label: Document Upload
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: special_circumstances
      label: Special Circumstances
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Check
      - Credit Card
      - Bank Transfer
      - Other
      required: false
    - id: 10
      name: payment_amount
      label: Payment Amount
      hint: Enter amount in USD
      type: number
      options: []
      required: true
    - id: 11
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: notes
      label: Notes
      hint: Add any additional notes about the case
      type: note
      options: []
      required: true
