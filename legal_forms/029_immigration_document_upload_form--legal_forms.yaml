      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: upload_time
      label: Upload Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: upload_file
      label: Upload File
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: legal_attorney
      label: Legal Attorney
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
