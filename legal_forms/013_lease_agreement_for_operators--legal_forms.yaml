inputSchema:
  type: object
  properties:
    title: Leasing Agreement For Operators
    pages:
    - id: 1
      name: operator_name
      label: Operator Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: operator_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - Residential
      - Commercial
      required: true
    - id: 5
      name: lease_start_date
      label: Start Date of Lease
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: lease_end_date
      label: End Date of Lease
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: lease_amount
      label: Lease Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: payment_frequency
      label: Rent Payment Frequency
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Yearly
      required: true
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Bank Transfer
      - Check
      - Online
      required: true
    - id: 10
      name: operator_insurance
      label: Operator Insurance
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: operator_maintenance
      label: Operator Maintenance
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: property_insurance
      label: Property Insurance
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: operator_payment_details
      label: Operator Payment Details
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: lease_agreement
      label: Lease Agreement
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
