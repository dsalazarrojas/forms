inputSchema:
  type: object
  properties:
    title: Agglutination Techniques Assessment
    pages:
    - id: 1
      name: candidate_info
      label: -- Candidate Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: candidate_name
      label: Candidate name
      hint: Full name of trainee
      type: text
      options: []
      required: true
    - id: 3
      name: candidate_id
      label: Candidate ID
      hint: Training program ID
      type: text
      options: []
      required: false
    - id: 4
      name: assessment_date
      label: Assessment date
      hint: Date assessment administered
      type: date
      options: []
      required: true
    - id: 5
      name: theoretical_score
      label: Theoretical knowledge score
      hint: Score out of 100
      type: number
      options: []
      required: true
    - id: 6
      name: practical_score
      label: Practical skills score
      hint: Score out of 100
      type: number
      options: []
      required: true
    - id: 7
      name: protocol_adherence
      label: Protocol adherence
      hint: Rate adherence to standard operating procedures
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: common_errors_observed
      label: Common errors observed
      hint: Notes on mistakes made during testing
      type: text
      options: []
      required: false
    - id: 9
      name: pass_fail
      label: Pass or fail assessment
      hint: Final result of assessment
      type: select_one
      options:
      - Pass
      - Fail
      required: true
    - id: 10
      name: assessor_comments
      label: Assessor comments
      hint: Recommendations for remediation or advancement
      type: text
      options: []
      required: false
