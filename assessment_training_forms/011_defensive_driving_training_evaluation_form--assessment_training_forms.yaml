inputSchema:
  type: object
  properties:
    title: Defensive Driving Training Evaluation Form
    pages:
    - id: 1
      name: course_rating
      label: Course Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: instructor_performance
      label: Instructor Performance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: course_content
      label: Course Content
      hint: null
      type: select_multiple
      options:
      - Well structured and organized
      - Not well structured and organized
      - Not applicable
      required: false
    - id: 5
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
