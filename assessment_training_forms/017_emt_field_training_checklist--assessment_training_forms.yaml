inputSchema:
  type: object
  properties:
    title: EMT Field Training Checklist
    pages:
    - id: 1
      name: session_info
      label: Training Session Info
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: training_site
      label: Training Site
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: trainer_name
      label: Trainer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: emt_team
      label: EMT Team
      hint: null
      type: select_multiple
      options:
      - EMT 1
      - EMT 2
      required: true
    - id: 5
      name: session_duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: session_notes
      label: Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: session_status
      label: Session Status
      hint: null
      type: select_one
      options:
      - Completed
      - Not Completed
      required: true
    - id: 9
      name: confirm_session_status
      label: Confirmation
      hint: null
      type: select_one
      options:
      - Completed
      - Not Completed
      required: true
