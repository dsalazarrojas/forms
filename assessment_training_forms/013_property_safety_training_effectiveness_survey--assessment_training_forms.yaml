inputSchema:
  type: object
  properties:
    title: Property Safety Training Effectiveness Survey
    pages:
    - id: 1
      name: survey_name
      label: Property Safety Training Effectiveness Survey
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date_survey_conducted
      label: Date survey conducted
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: training_program_name
      label: Training program name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: training_program_manager
      label: Training program manager
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: training_location
      label: Training location
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: total_trainees
      label: Total trainees
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: survey_type
      label: Survey type
      hint: null
      type: select_one
      options:
      - On-site
      - Off-site
      required: true
    - id: 8
      name: survey_frequency
      label: Survey frequency
      hint: null
      type: select_multiple
      options:
      - Annually
      - Bi-annually
      - Monthly
      - Quarterly
      - Semi-annually
      required: true
    - id: 9
      name: training_quality
      label: Training quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      required: true
    - id: 10
      name: relevance
      label: Relevance
      hint: null
      type: select_multiple
      options:
      - Highly relevant
      - Somewhat relevant
      - Not relevant
      required: true
    - id: 11
      name: confidence_level
      label: Confidence level
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 12
      name: overall_confidence
      label: Overall confidence
      hint: null
      type: select_one
      options:
      - Very confident
      - Somewhat confident
      - Not confident
      required: true
