inputSchema:
  type: object
  properties:
    title: Rapid Sequence Intubation Quiz
    pages:
    - id: 1
      name: form_start
      label: Form start
      hint: null
      type: time
      options: []
      required: false
    - id: 2
      name: rsi_knowledge
      label: RSIs knowledge
      hint: null
      type: select_one
      options:
      - I've never performed RSI
      - Less than 5 attempts
      - 5-20 attempts
      - 21-50 attempts
      - More than 50 attempts
      required: false
    - id: 3
      name: rsi_sequence
      label: RSIs sequence
      hint: 'null'
      type: select_one
      options:
      - 0 - 5
      - 6 - 10
      - 11 - 15
      - 16 - 20
      required: false
    - id: 4
      name: rsi_type
      label: RSI type
      hint: null
      type: select_multiple
      options:
      - Rapid sequence intubation
      - Non-rapid sequence intubation
      required: false
    - id: 5
      name: rsi_success
      label: RSI success
      hint: null
      type: select_one
      options:
      - Failed
      - Success
      required: false
    - id: 6
      name: rsi_comments
      label: RSI comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: rsi_important_info
      label: RSI important information
      hint: 'null'
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: rsi_next_steps
      label: RSI next steps
      hint: null
      type: select_multiple
      options:
      - Complete next step 1
      - Complete next step 2
      - Complete next step 3
      - Complete next step 4
      - Do not know
      required: false
    - id: 9
      name: rsi_form_end
      label: Form end
      hint: null
      type: date
      options: []
      required: false
    - id: 10
