inputSchema:
  type: object
  properties:
    title: Organizational Training Programs Audit Form
    pages:
    - id: 1
      name: training_programs_form
      label: Training Programs
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: department_id
      label: Department
      hint: null
      type: select_one
      options:
      - Department A
      - Department B
      - Department C
      required: false
    - id: 3
      name: training_quality_form
      label: Training Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Satisfactory
      - Needs Improvement
      required: false
    - id: 4
      name: training_completions_form
      label: Training Completions
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: completion_practices_form
      label: Completion Practices
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: improvement_opportunities_form
      label: Improvement Opportunities
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: review_frequency_form
      label: Review Frequency
      hint: null
      type: select_one
      options:
      - Annually
      - Semi-Annually
      - Quarterly
      - Monthly
      required: false
    - id: 8
      name: auditor_id
      label: Auditor
      hint: null
      type: select_one
      options:
      - John Doe
      - Jane Doe
      - Jim Doe
      required: false
    - id: 9
      name: completion_certification_form
      label: Completion Certification
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: certification_date_form
      label: Certification Date
      hint: null
      type: date
      options: []
      required: false
