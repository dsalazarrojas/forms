inputSchema:
  type: object
  properties:
    title: Meal Kit Delivery Subscription Form
    pages:
    - id: 1
      name: user_input
      label: first_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: address
      label: address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: delivery_date
      label: delivery_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: order_frequency
      label: order_frequency
      hint: null
      type: select_multiple
      options:
      - daily
      - weekly
      - biweekly
      required: false
    - id: 7
      name: payment_method
      label: payment_method
      hint: null
      type: select_multiple
      options:
      - credit_card
      - paypal
      - cash
      required: false
