inputSchema:
  type: object
  properties:
    title: Thanksgiving Turkey Pre Order Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: turkey_size
      label: Turkey Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 9
      name: turkey_type
      label: Turkey Type
      hint: null
      type: select_one
      options:
      - Whole
      - Boneless
      - Organic
      - Kosher
      required: false
    - id: 10
      name: additional_info
      label: Additional Information
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: confirmation
      label: Confirmation
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
