inputSchema:
  type: object
  properties:
    title: Online Coffee Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: preferred_coffee
      label: Preferred Coffee
      hint: null
      type: select_one
      options:
      - Coffee
      - Tea
      - Juice
      required: false
    - id: 6
      name: order_notes
      label: Order Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
