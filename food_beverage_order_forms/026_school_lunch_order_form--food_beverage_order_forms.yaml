inputSchema:
  type: object
  properties:
    title: School Lunch Order Form
    pages:
    - id: 1
      name: school_lunch_order_form_page_1
      label: School Lunch Order Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: school_lunch_order_form_page_2
      label: Select Main Course
      hint: Choose main course
      type: select_one
      options:
      - Grilled Chicken Sandwich
      - Pizza
      - Salad
      required: false
    - id: 3
      name: school_lunch_order_form_page_3
      label: Select Side
      hint: Choose side
      type: select_multiple
      options:
      - Carrot Sticks
      - Chips
      - Apple
      required: false
    - id: 4
      name: school_lunch_order_form_page_4
      label: Select Juice
      hint: Choose juice
      type: select_one
      options:
      - Apple
      - Orange
      - Cranberry
      required: false
    - id: 5
      name: school_lunch_order_form_page_5
      label: Select Fruit
      hint: Choose fruit
      type: select_multiple
      options:
      - Apple
      - Banana
      - Grapes
      required: false
