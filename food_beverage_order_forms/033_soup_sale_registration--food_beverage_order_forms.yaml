inputSchema:
  type: object
  properties:
    title: Soup Sale Registration
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: soup_type
      label: Soup Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: pickup_delivery
      label: Pickup or Delivery
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: order_details
      label: Order Details
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
