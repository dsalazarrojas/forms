inputSchema:
  type: object
  properties:
    title: Care Package Order Form
    pages:
    - id: 1
      name: order_header
      label: -- Order Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Name of person placing order
      type: text
      options: []
      required: true
    - id: 3
      name: contact_phone
      label: Contact phone
      hint: For delivery coordination
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email
      hint: For order confirmation
      type: email
      options: []
      required: false
    - id: 5
      name: package_type
      label: Package type
      hint: Choose package variant
      type: select_one
      options:
      - Basic
      - Standard
      - Premium
      required: true
    - id: 6
      name: quantity
      label: Quantity
      hint: Number of packages to order
      type: number
      options: []
      required: true
    - id: 7
      name: delivery_address
      label: Delivery address
      hint: Full address for delivery
      type: text
      options: []
      required: true
    - id: 8
      name: preferred_delivery_date
      label: Preferred delivery date
      hint: Desired delivery date
      type: date
      options: []
      required: false
    - id: 9
      name: dietary_restrictions
      label: Dietary restrictions
      hint: List any allergy or dietary needs
      type: text
      options: []
      required: false
    - id: 10
      name: special_instructions
      label: Special instructions
      hint: Notes for packers or drivers
      type: text
      options: []
      required: false
