inputSchema:
  type: object
  properties:
    title: Student Catering Order Form
    pages:
    - id: 1
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: food_item
      label: Food Item
      hint: null
      type: select_one
      options:
      - Apple
      - Chicken
      - Salad
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: catering_request
      label: Catering Request
      hint: Please select all that apply
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: student_id
      label: Student ID
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: order_total
      label: Order Total
      hint: null
      type: number
      options: []
      required: false
