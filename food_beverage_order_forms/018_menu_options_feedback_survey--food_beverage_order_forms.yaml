inputSchema:
  type: object
  properties:
    title: Menu Options Feedback Survey
    pages:
    - id: 1
      name: main_page
      label: What would you like to do?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 2
      name: vegetarian_options
      label: Do you prefer vegetarian options?
      hint: null
      type: select_multiple
      options:
      - Vegetarian option 1
      - Vegetarian option 2
      - 'No'
      required: true
    - id: 3
      name: visit_frequency
      label: How many times have you visited our restaurant in the past month?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: contact_info
      label: Contact Info
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: promo_email
      label: Do you want to receive promotional emails from us?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: menu_rating
      label: How would you rate our menu?
      hint: null
      type: select_multiple
      options:
      - Rating 1
      - Rating 2
      - Poor
      - Excellent
      required: true
    - id: 7
      name: phone_number
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: allergies
      label: Do you have any food allergies?
      hint: null
      type: checkbox
      options:
      - Allergies 1
      - Allergies 2
      - Allergies 3
      required: false
    - id: 9
      name: food_taste
      label: How would you rate the taste of our food?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: additional_comments
      label: Do you have any additional comments or feedback?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
