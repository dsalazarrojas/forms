inputSchema:
  type: object
  properties:
    title: Spoiled Food Incident Report
    pages:
    - id: 1
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: food_type
      label: Food Type
      hint: null
      type: select_multiple
      options:
      - Apple
      - Banana
      - Other
      required: false
    - id: 3
      name: reason_for_spoilage
      label: Reason for Spoilage
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - Kitchen
      - Freezer
      - Warehouse
      - Other
      required: false
    - id: 5
      name: number_of_items_affected
      label: Number of Items Affected
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: employee_phone
      label: Employee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: incident_description
      label: Incident Description
      hint: null
      type: note
      options: []
      required: false
