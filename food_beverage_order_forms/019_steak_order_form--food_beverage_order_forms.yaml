inputSchema:
  type: object
  properties:
    title: Steak Order Form
    pages:
    - id: 1
      name: customer_info
      label: Customer information
      hint: null
      type: select_multiple
      options:
      - customer name
      - email
      required: true
    - id: 2
      name: steak_preference
      label: Steak preference
      hint: null
      type: select_one
      options:
      - rare
      - medium rare
      - well done
      required: false
    - id: 3
      name: payment_info
      label: Payment information
      hint: null
      type: select_multiple
      options:
      - card number
      - expiration date
      - cvv
      required: false
    - id: 4
      name: order_info
      label: Order information
      hint: null
      type: select_multiple
      options:
      - quantity
      - order date
      - delivery time
      required: false
    - id: 5
      name: customer_note
      label: Customer note
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contact_info
      label: Contact information
      hint: null
      type: select_multiple
      options:
      - phone
      - address
      required: false
    - id: 7
      name: order_total
      label: Order total
      hint: null
      type: number
      options: []
      required: false
