inputSchema:
  type: object
  properties:
    title: Milkshake Machine Feedback Survey
    pages:
    - id: 1
      name: survey_intro
      label: survey_intro
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: machine_performance
      label: how_did_the_machine_perform
      hint: null
      type: select_one
      options:
      - Poor
      - Average
      - Excellent
      required: false
    - id: 3
      name: taste
      label: how_was_the_taste
      hint: null
      type: select_multiple
      options:
      - Too Sweet
      - Too Salty
      - Just Right
      required: false
    - id: 4
      name: customer_service
      label: how_was_the_customer_service
      hint: null
      type: select_one
      options:
      - Poor
      - Average
      - Excellent
      required: false
    - id: 5
      name: issues_encountered
      label: were_there_any_issues_encountered
      hint: null
      type: select_multiple
      options:
      - Machine Failed To Dispense
      - Other
      required: false
    - id: 6
      name: product_quality
      label: how_was_the_product_quality
      hint: null
      type: select_one
      options:
      - Poor
      - Average
      - Excellent
      required: false
    - id: 7
      name: machine_condition
      label: what_is_the_condition_of_the_machine
      hint: null
      type: select_multiple
      options:
      - Dirty
      - Average
      - Clean
      required: false
    - id: 8
      name: additional_comments
      label: any_additional_comments
      hint: null
      type: note
      options: []
      required: false
