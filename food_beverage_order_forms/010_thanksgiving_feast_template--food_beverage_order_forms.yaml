      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: coordination_time
      label: Coordination Time
      hint: null
      type: time
      options: []
      required: true
    - id: 17
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: true
