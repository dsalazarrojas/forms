inputSchema:
  type: object
  properties:
    title: thanksgiving_feast_template
    pages:
    - id: 1
      name: main_course
      label: Main Course
      hint: null
      type: select_multiple
      options:
      - turkey
      - lamb
      - vegetarian
      - other
      required: true
    - id: 2
      name: side_dish
      label: Side Dish
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: drink
      label: Drink
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: guest_diet
      label: Guest Diet
      hint: null
      type: select_one
      options:
      - vegetarian
      - non_vegetarian
      - other
      required: true
    - id: 6
      name: special_diet
      label: Special Diet
      hint: Please select special diet options
      type: select_one
      options:
      - none
      - 'yes'
      - unknown
      required: false
    - id: 7
      name: host_dish
      label: Host Dish
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: host_contact
      label: Host Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: potluck_time
      label: Potluck Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: appetizer
      label: Appetizer
      hint: null
      type: select_multiple
      options:
      - green bean
      - yam
      - carrot
      required: true
    - id: 13
      name: main_course
      label: Main Course
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: dessert
      label: Dessert
      hint: null
      type: select_multiple
      options:
      - apple
      - mashed potatoes
      - pumpkin
      required: true
    - id: 15
      name: coordination_contact
