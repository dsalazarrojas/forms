inputSchema:
  type: object
  properties:
    title: Food Order Application Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_date
      label: Order Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: order_time
      label: Order Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: customer_email
      label: Customer E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: food_item
      label: Food Item
      hint: null
      type: select_multiple
      options:
      - Pizza
      - Burger
      - Salad
      required: false
    - id: 7
      name: food_quantity
      label: Food Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: special_instructions
      label: Special Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Cash
      - Card
      required: false
    - id: 11
      name: order_status
      label: Order Status
      hint: null
      type: note
      options: []
      required: false
