      name: vodka_expected
      label: Vodka Expected Count
      hint: What should inventory be per records?
      type: number
      options: []
      required: false
    - id: 18
      name: vodka_variance
      label: Vodka Variance or Notes
      hint: Discrepancies or issues?
      type: text
      options: []
      required: false
    - id: 19
      name: gin_expected
      label: Gin Expected Count
      hint: What should inventory be per records?
      type: number
      options: []
      required: false
    - id: 20
      name: gin_variance
      label: Gin Variance or Notes
      hint: Discrepancies or issues?
      type: text
      options: []
      required: false
    - id: 21
      name: whiskey_expected
      label: Whiskey Expected Count
      hint: What should inventory be per records?
      type: number
      options: []
      required: false
    - id: 22
      name: whiskey_variance
      label: Whiskey Variance or Notes
      hint: Discrepancies or issues?
      type: text
      options: []
      required: false
    - id: 23
      name: section_header_nonalcoholic
      label: -- Non-Alcoholic Beverages Count --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: soda_count
      label: Soda or Soft Drinks - Stock Level
      hint: Inventory level or quantity
      type: text
      options: []
      required: false
    - id: 25
      name: juice_count
      label: Juices - Stock Level
      hint: Inventory level or quantity
      type: text
      options: []
      required: false
    - id: 26
      name: water_count
      label: Water - Stock Level
      hint: Bottled water units
      type: number
      options: []
      required: false
    - id: 27
      name: coffee_tea_status
      label: Coffee and Tea Supplies - Status
      hint: Adequate, low, or out
      type: select_one
      options:
      - Fully stocked
      - Adequate
      - Low stock
      - Out of stock
      required: false
    - id: 28
      name: section_header_missing
      label: -- Damage and Loss Report --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: damaged_items
      label: Damaged or Broken Items
      hint: List any damaged beverages
      type: text
      options: []
      required: false
    - id: 30
      name: expired_items
      label: Expired Items Found
      hint: Any items past expiration?
      type: text
      options: []
      required: false
    - id: 31
      name: unexplained_loss
      label: Unexplained Loss or Shrinkage
      hint: Discrepancies that cannot be explained
      type: text
      options: []
      required: false
    - id: 32
      name: section_header_replenishment
      label: -- Replenishment Orders --
      hint: null
      type: note
      options: []
      required: false
    - id: 33
      name: reorder_needed
      label: Items Requiring Reorder
      hint: List products that need replenishing
      type: text
      options: []
      required: true
    - id: 34
      name: urgent_orders
      label: Items Needed Urgently
      hint: What do you need ASAP?
      type: text
      options: []
      required: false
    - id: 35
      name: supplier_contact
      label: Preferred Supplier Contact
      hint: Name or phone of usual supplier
      type: text
      options: []
      required: false
    - id: 36
      name: additional_notes
      label: Additional Notes or Comments
      hint: Any other inventory observations?
      type: text
      options: []
      required: false
