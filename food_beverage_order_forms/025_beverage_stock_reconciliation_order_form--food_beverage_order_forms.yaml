inputSchema:
  type: object
  properties:
    title: Beverage Stock Reconciliation Order Form
    pages:
    - id: 1
      name: section_header_location
      label: -- Location Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: location_name
      label: Location or Establishment Name
      hint: Bar, restaurant, or hospitality venue
      type: text
      options: []
      required: true
    - id: 3
      name: manager_name
      label: Manager or Supervisor Name
      hint: Person responsible for inventory
      type: text
      options: []
      required: true
    - id: 4
      name: manager_email
      label: Manager Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: manager_phone
      label: Manager Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: reconciliation_date
      label: Reconciliation Date
      hint: When is this count being done?
      type: date
      options: []
      required: true
    - id: 7
      name: reconciliation_time
      label: Reconciliation Time
      hint: What time is the count?
      type: time
      options: []
      required: false
    - id: 8
      name: section_header_alcoholic
      label: -- Alcoholic Beverages Count --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: vodka_count
      label: Vodka Bottles - Current Count
      hint: Number of bottles in stock
      type: number
      options: []
      required: false
    - id: 10
      name: gin_count
      label: Gin Bottles - Current Count
      hint: Number of bottles in stock
      type: number
      options: []
      required: false
    - id: 11
      name: rum_count
      label: Rum Bottles - Current Count
      hint: Number of bottles in stock
      type: number
      options: []
      required: false
    - id: 12
      name: whiskey_count
      label: Whiskey Bottles - Current Count
      hint: Number of bottles in stock
      type: number
      options: []
      required: false
    - id: 13
      name: tequila_count
      label: Tequila Bottles - Current Count
      hint: Number of bottles in stock
      type: number
      options: []
      required: false
    - id: 14
      name: wine_count
      label: Wine Bottles - Current Count
      hint: Total wine bottles
      type: number
      options: []
      required: false
    - id: 15
      name: beer_count
      label: Beer Cases or Units - Current Count
      hint: Number of beer units
      type: number
      options: []
      required: false
    - id: 16
      name: section_header_expected
      label: -- Expected vs Actual Discrepancies --
      hint: null
      type: note
      options: []
      required: false
