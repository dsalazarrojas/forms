inputSchema:
  type: object
  properties:
    title: Pizza Hut Order Form
    pages:
    - id: 1
      name: delivery_method
      label: Delivery Method
      hint: null
      type: select_one
      options:
      - Delivery
      - Carryout
      required: false
    - id: 2
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: order_details
      label: Order Details
      hint: null
      type: select_multiple
      options:
      - Small 2-topping pizza
      - Medium 2-topping
      - Large 2-topping
      required: false
    - id: 7
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: delivery_time
      label: Delivery Time
      hint: null
      type: select_one
      options:
      - 30 min
      - 60 min
      - 90 min
      required: false
    - id: 9
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Cash
      - Bank Transfer
      required: false
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
