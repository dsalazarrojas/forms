inputSchema:
  type: object
  properties:
    title: Snack Product Sensory Evaluation
    pages:
    - id: 1
      name: intro
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: taste
      label: Taste
      hint: null
      type: select_multiple
      options:
      - Sweet
      - Salty
      - Bitter
      - Sour
      - Umami
      - Fruity
      - Earthy
      - Nutty
      - Spicy
      required: false
    - id: 3
      name: texture
      label: Texture
      hint: null
      type: select_one
      options:
      - Smooth
      - Crunchy
      - Chewy
      - Soft
      - Hard
      - Rough
      - Crisp
      - Powdery
      - Grassy
      required: false
    - id: 4
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: Please describe your experience
      type: text
      options: []
      required: false
    - id: 6
      name: recommended
      label: Recommended?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: favorite_color
      label: Favorite Color
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: Your email address
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: Your phone number
      type: text
      options: []
      required: false
