inputSchema:
  type: object
  properties:
    title: Food Presentation Plate Order Form
    pages:
    - id: 1
      name: order_details
      label: Order Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: presentation_preferences
      label: Presentation Preferences
      hint: null
      type: select_one
      options:
      - Color
      - Shape
      - Size
      required: false
    - id: 3
      name: order_quantities
      label: Order Quantities
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: order_items
      label: Order Items
      hint: null
      type: select_multiple
      options:
      - Food 1
      - Food 2
      - Food 3
      required: false
