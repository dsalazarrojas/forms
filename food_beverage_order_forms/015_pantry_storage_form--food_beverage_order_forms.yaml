inputSchema:
  type: object
  properties:
    title: Pantry Storage Form
    pages:
    - id: 1
      name: storage_location
      label: Storage Location
      hint: null
      type: select_multiple
      options:
      - Warehouse 1
      - Warehouse 2
      - Warehouse 3
      required: true
    - id: 2
      name: date_of_storage
      label: Date of Storage
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: storage_type
      label: Storage Type
      hint: null
      type: select_one
      options:
      - Item
      - Non-Item
      - Service
      - Other
      required: true
    - id: 4
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: storage_notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - In-person
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: item_name
      label: Item Name
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: storage_time
      label: Storage Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: storage_location_2
      label: Storage Location 2
      hint: null
      type: select_multiple
      options:
      - Warehouse 1
      - Warehouse 2
      - Warehouse 3
      required: false
