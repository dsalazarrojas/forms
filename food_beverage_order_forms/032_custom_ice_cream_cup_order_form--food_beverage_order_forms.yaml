inputSchema:
  type: object
  properties:
    title: Custom Ice Cream Cup Order Form
    pages:
    - id: 1
      name: ice_cream_flavors
      label: Flavors
      hint: Select one or more flavors
      type: select_multiple
      options:
      - vanilla
      - strawberry
      - chocolate
      - cookiesandcream
      required: false
    - id: 2
      name: cup_size
      label: Size
      hint: None
      type: select_one
      options:
      - small
      - medium
      - large
      required: false
    - id: 3
      name: toppings
      label: Toppings
      hint: None
      type: select_multiple
      options:
      - chocolate chips
      - whipped cream
      - sprinkles
      - nuts
      required: false
    - id: 4
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
