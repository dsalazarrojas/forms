      options:
      - chicken
      - steak
      - salmon
      - tofu
      required: false
    - id: 4
      name: size
      label: select_size
      hint: null
      type: select_one
      options:
      - small
      - medium
      - large
      required: false
    - id: 5
      name: total_price
      label: total_price
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: submit_button
      label: submit
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: customer_name
      label: customer_name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: customer_phone
      label: customer_phone
      hint: null
      type: text
      options: []
      required: false
