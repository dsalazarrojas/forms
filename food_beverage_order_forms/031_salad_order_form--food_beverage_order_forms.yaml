inputSchema:
  type: object
  properties:
    title: salad_order_form
    pages:
    - id: 1
      name: order_details
      label: order_details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: salad_selection
      label: select_salad
      hint: null
      type: select_one
      options:
      - small salad
      - large salad
      - extra large salad
      required: false
    - id: 3
      name: protein_selection
      label: select_protein
      hint: null
