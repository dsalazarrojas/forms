inputSchema:
  type: object
  properties:
    title: Employee Virtual Reality Training Feedback Form
    pages:
    - id: 1
      name: training_feedback
      label: Module 1
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: module_2_name
      label: Module 2
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: technical_issues
      label: Technical Issues
      hint: Describe the issue
      type: text
      options: []
      required: false
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: future_improvement
      label: Future Improvement
      hint: How can we improve the training?
      type: text
      options: []
      required: false
    - id: 6
      name: department_feedback
      label: Department Feedback
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: employee_feedback
      label: Employee Feedback
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Bad
      required: false
    - id: 9
      name: date_of_training
      label: Date of Training
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: time_of_training
      label: Time of Training
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
