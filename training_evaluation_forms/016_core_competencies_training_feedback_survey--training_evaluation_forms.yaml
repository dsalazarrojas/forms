inputSchema:
  type: object
  properties:
    title: Core Competencies Training Feedback Survey
    pages:
    - id: 1
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you with the training session?
      type: text
      options: []
      required: true
    - id: 2
      name: feedback_from_trainee
      label: Feedback from Trainee
      hint: Please provide feedback on how I can improve.
      type: text
      options: []
      required: true
    - id: 3
      name: future_satisfaction
      label: Future Satisfaction
      hint: What do you think you will achieve from this training?
      type: text
      options: []
      required: true
    - id: 4
      name: core_competencies_topics
      label: Core Competencies Topics
      hint: Which of the following core competencies did we cover in this session?
      type: select_multiple
      options:
      - Yes, I understand
      - No, not clear
      required: true
    - id: 5
      name: session_length
      label: Session Length
      hint: How long did the session last?
      type: number
      options: []
      required: true
    - id: 6
      name: session_date
      label: Session Date
      hint: On what date did the session take place?
      type: date
      options: []
      required: true
    - id: 7
      name: session_location
      label: Session Location
      hint: Where did the training session take place?
      type: text
      options: []
      required: true
    - id: 8
      name: trainee_feedback
      label: Trainee Feedback
      hint: What did you think of the training session?
      type: text
      options: []
      required: true
    - id: 9
      name: trainee_attendance
      label: Trainee Attendance
      hint: Were you able to attend the full session?
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: feedback_from_session
      label: Feedback from Session
      hint: What were some key takeaways or feedback on the session?
      type: text
      options: []
      required: true
    - id: 11
      name: session_improvements
      label: Session Improvements
      hint: Are there any areas where you think we could improve the session?
      type: text
      options: []
      required: true
    - id: 12
      name: trainee_satisfaction
      label: Trainee Satisfaction
      hint: How satisfied are you with the training session?
      type: text
      options: []
      required: true
    - id: 13
      name: trainee_email
      label: Trainee Email
      hint: Please provide your email for future communications.
      type: email
      options: []
      required: false
    - id: 14
      name: trainee_notes
      label: Trainee Notes
      hint: Any additional notes or comments?
      type: note
      options: []
      required: false
