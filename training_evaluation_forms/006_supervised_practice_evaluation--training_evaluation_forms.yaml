inputSchema:
  type: object
  properties:
    title: Supervised Practice Evaluation
    pages:
    - id: 1
      name: trainee_name
      label: Trainee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: session_start_time
      label: Session Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: session_end_time
      label: Session End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: session_duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: session_feedback
      label: Session Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: strengths
      label: Strengths
      hint: List strengths observed during session
      type: select_multiple
      options:
      - Communication skills
      - Clinical skills
      - Problem-solving skills
      - Time management skills
      - Teamwork
      - Leadership skills
      required: false
    - id: 9
      name: improvements
      label: Improvements
      hint: List areas that need improvement
      type: select_multiple
      options:
      - Communication skills
      - Clinical skills
      - Problem-solving skills
      - Time management skills
      - Teamwork
      - Leadership skills
      required: false
    - id: 10
      name: overall_comment
      label: Overall Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: false
