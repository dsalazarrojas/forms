inputSchema:
  type: object
  properties:
    title: Cosmetic Nurse Training Survey
    pages:
    - id: 1
      name: training_provider
      label: Training Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rating_quality
      label: Rating Of Quality
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: outcome_rating
      label: Outcome Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: training_outcomes
      label: What are the main training outcomes
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 6
      name: areas_for_improvement
      label: Areas For Improvement
      hint: null
      type: select_multiple
      options:
      - Communication
      - Materials
      - Organization
      - Content
      - Equipment
      required: false
    - id: 7
      name: time_to_complete
      label: Time To Complete
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: feedback
      label: Additional Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
