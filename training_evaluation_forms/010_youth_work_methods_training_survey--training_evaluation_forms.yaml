inputSchema:
  type: object
  properties:
    title: Youth Work Methods Training Survey
    pages:
    - id: 1
      name: session_feedback
      label: Session Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 3
      name: session_topics
      label: Session Topics
      hint: null
      type: select_multiple
      options:
      - Youth Work
      - Methods
      - Training
      - Evaluation
      required: false
    - id: 4
      name: participant_demographics
      label: Participant Demographics
      hint: null
      type: select_one
      options:
      - Age Range
      - Role Participating
      - Training Level
      - Years Training
      required: false
    - id: 5
      name: suggestions
      label: Suggestions
      hint: null
      type: note
      options: []
      required: false
