      name: suggestions_improvement
      label: Suggestions for Improvement
      hint: How can we improve this training
      type: text
      options: []
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 24
      name: follow_up_contact
      label: Willing to Participate in Follow-up
      hint: Would you join a follow-up session
      type: select_one
      options:
        - Yes
        - No
      required: true
