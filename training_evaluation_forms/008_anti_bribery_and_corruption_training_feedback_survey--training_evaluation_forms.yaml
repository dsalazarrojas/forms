      name: employee_id
      label: Employee ID
      hint: Your employee identification number
      type: text
      options: []
      required: true
    - id: 2
      name: department
      label: Department
      hint: Your department or division
      type: select_one
      options:
        - Human Resources
        - Finance
        - Sales
        - Procurement
        - Legal
        - Operations
        - Executive
        - Other
      required: true
    - id: 3
      name: job_level
      label: Job Level
      hint: Your position level
      type: select_one
      options:
        - Entry level
        - Mid-level
        - Senior level
        - Management
        - Executive
      required: true
    - id: 4
      name: training_date
      label: Training Date
      hint: When did you attend the training
      type: date
      options: []
      required: true
    - id: 5
      name: training_format
      label: Training Format
      hint: How was the training delivered
      type: select_one
      options:
        - In-person workshop
        - Virtual live session
        - Self-paced online
        - Hybrid
      required: true
    - id: 6
      name: training_duration
      label: Training Duration
      hint: How long was the training
      type: select_one
      options:
