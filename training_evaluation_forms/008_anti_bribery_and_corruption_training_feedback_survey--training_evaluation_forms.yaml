        - Somewhat relevant
        - Neutral
        - Not very relevant
        - Not relevant at all
      required: true
    - id: 9
      name: trainer_effectiveness
      label: Trainer Effectiveness
      hint: Rate the trainer or instructor
      type: select_one
      options:
        - Excellent
        - Good
        - Average
        - Poor
        - Very poor
        - Not applicable
      required: true
    - id: 10
      name: learning_objectives
      label: Learning Objectives Clarity
      hint: Were the learning objectives clear
      type: select_one
      options:
