      name: training_pace
      label: Training Pace
      hint: Was the pace appropriate
      type: select_one
      options:
        - Too slow
        - Just right
        - Too fast
      required: true
    - id: 19
      name: confidence_application
      label: Confidence in Applying Knowledge
      hint: How confident are you to apply what you learned
      type: select_one
      options:
        - Very confident
        - Confident
        - Somewhat confident
        - Not very confident
        - Not confident at all
      required: true
    - id: 20
      name: would_recommend
      label: Would You Recommend This Training
      hint: To colleagues
      type: select_one
      options:
        - Definitely yes
