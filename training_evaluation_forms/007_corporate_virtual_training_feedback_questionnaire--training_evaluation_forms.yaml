inputSchema:
  type: object
  properties:
    title: Corporate Virtual Training Feedback Questionnaire
    pages:
    - id: 1
      name: session_name
      label: Session Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: department
      label: department
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
