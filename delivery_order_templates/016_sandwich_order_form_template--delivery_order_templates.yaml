inputSchema:
  type: object
  properties:
    title: Sandwich Order Form Template
    pages:
    - id: 1
      name: bread_type
      label: What type of bread would you like?
      hint: null
      type: select_one
      options:
      - whole wheat
      - whole white
      - rye
      required: false
    - id: 2
      name: dietary_restrictions
      label: Do you have any dietary restrictions?
      hint: null
      type: select_multiple
      options:
      - vegetarian
      - vegan
      - gluten free
      required: false
    - id: 3
      name: special_request
      label: Would you like to order extra?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: extra_cheese
      label: Would you like extra cheese?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 5
      name: extra_sauce
      label: Would you like extra sauce?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 6
      name: delivery_time
      label: What is your preferred delivery time?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: preparation
      label: How would you like your sandwich to be prepared?
      hint: null
      type: select_one
      options:
      - toasted
      - grilled
      - panini
      required: false
    - id: 8
      name: toppings
      label: Do you want to add any toppings?
      hint: null
      type: select_multiple
      options:
      - lettuce
      - tomato
      - avocado
      required: false
    - id: 9
      name: extra_pickles
      label: Would you like to order extra pickles?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 10
      name: extra_olives
      label: Would you like to order extra olives?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 11
      name: extra_jalapenos
      label: Would you like to order extra jalapenos?
      hint: null
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: side_dish
      label: Would you like to order a side dish?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
