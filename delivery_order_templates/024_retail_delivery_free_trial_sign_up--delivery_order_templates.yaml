inputSchema:
  type: object
  properties:
    title: Retail Delivery Free Trial Sign Up
    pages:
    - id: 1
      name: retail_delivery_free_trial_sign_up
      label: Retail Delivery Free Trial Sign Up
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: category
      label: delivery_order_templates_registration_forms
      hint: null
      type: select_one
      options:
      - delivery order templates
      - registration forms
      required: false
