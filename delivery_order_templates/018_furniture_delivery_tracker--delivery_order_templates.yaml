inputSchema:
  type: object
  properties:
    title: Furniture Delivery Tracker
    pages:
    - id: 1
      name: delivery_status
      label: Delivery Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 2
      name: delivery_confirmation
      label: Delivery Confirmation
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: delivery_team
      label: Delivery Team
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: warehouse_confirmation
      label: Warehouse Confirmation
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: retailer_confirmation
      label: Retailer Confirmation
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
