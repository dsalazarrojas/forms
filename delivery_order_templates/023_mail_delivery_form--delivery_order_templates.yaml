      - Pending
      - In Progress
      - Delivered
      required: false
    - id: 10
      name: notes
      label: Additional notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
