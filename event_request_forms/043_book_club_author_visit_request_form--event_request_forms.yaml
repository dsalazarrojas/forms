inputSchema:
  type: object
  properties:
    title: Book Club Author Visit Request Form
    pages:
    - id: 1
      name: request_header
      label: -- Author Visit Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: club_name
      label: Club name
      hint: Name of the requesting book club
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Contact person
      hint: Organizer name and contact
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact email
      hint: For scheduling author appearance
      type: email
      options: []
      required: true
    - id: 5
      name: preferred_dates
      label: Preferred dates
      hint: Provide a range of possible dates
      type: text
      options: []
      required: true
    - id: 6
      name: audience_size
      label: Audience size
      hint: Estimated number of attendees
      type: number
      options: []
      required: true
    - id: 7
      name: format_preference
      label: Format preference
      hint: In person or virtual session
      type: select_one
      options:
      - In person
      - Virtual
      - Hybrid
      required: true
    - id: 8
      name: honorarium_budget
      label: Honorarium budget
      hint: Proposed budget for the author
      type: number
      options: []
      required: false
    - id: 9
      name: additional_notes
      label: Additional notes
      hint: Any special requests or topics
      type: text
      options: []
      required: false
