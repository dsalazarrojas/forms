inputSchema:
  type: object
  properties:
    title: Primary Care Exhibit Intent Form
    pages:
    - id: 1
      name: exhibitor_contact
      label: Exhibitor Contact Information
      hint: Provide contact information for the exhibitor
      type: text
      options: []
      required: false
    - id: 2
      name: focus_areas
      label: What are your focus areas?
      hint: Select up to three focus areas
      type: select_multiple
      options:
      - Primary Care
      - Medical
      - Wellness
      required: true
    - id: 3
      name: availability
      label: What dates are you available?
      hint: Provide dates you are available
      type: date
      options: []
      required: true
    - id: 4
      name: exhibit_intent
      label: What is the purpose of your exhibit?
      hint: Briefly describe the purpose of your exhibit
      type: text
      options: []
      required: false
    - id: 5
      name: additional_notes
      label: Additional Notes
      hint: Any additional information
      type: text
      options: []
      required: false
    - id: 6
      name: primary_care_focus_areas
      label: Primary Care Focus Areas
      hint: Select up to three primary care focus areas
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 7
      name: email
      label: Email
      hint: Provide your email address
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: Phone
      hint: Provide your phone number
      type: text
      options: []
      required: true
    - id: 9
      name: availability_2
      label: Availability
      hint: Select your availability
      type: time
      options: []
      required: true
    - id: 10
      name: additional_notes_2
      label: Additional Notes 2
      hint: Any additional information
      type: text
      options: []
      required: false
