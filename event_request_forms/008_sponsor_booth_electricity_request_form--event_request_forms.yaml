inputSchema:
  type: object
  properties:
    title: Sponsor Booth Electricity Request Form
    pages:
    - id: 1
      name: sponsor_booth_electricity_request_form
      label: event_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: event_date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: booth_location
      label: booth_location
      hint: Please choose a main location for your booth.
      type: select_one
      options:
      - Main Stage
      - Food Court
      - Outdoor
      required: true
    - id: 4
      name: power_request
      label: power_request
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: installation_window
      label: installation_window
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: approval_window
      label: approval_window
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: approved_by
      label: approved_by
      hint: null
      type: select_one
      options:
      - Event Director
      - Booth Manager
      - Technical Lead
      required: true
    - id: 8
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
