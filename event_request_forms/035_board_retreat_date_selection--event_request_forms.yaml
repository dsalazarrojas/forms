inputSchema:
  type: object
  properties:
    title: Board Retreat Date Selection
    pages:
    - id: 1
      name: availability_header
      label: -- Retreat Date Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: member_name
      label: Member name
      hint: Full name for scheduling
      type: text
      options: []
      required: true
    - id: 3
      name: preferred_dates
      label: Preferred dates
      hint: Select all dates you are available
      type: select_multiple
      options:
      - June 10 11
      - June 17 18
      - July 1 2
      - July 8 9
      required: true
    - id: 4
      name: accommodation_needs
      label: Accommodation needs
      hint: Any lodging or accessibility needs
      type: text
      options: []
      required: false
    - id: 5
      name: dietary_requirements
      label: Dietary requirements
      hint: Allergies or meal preferences
      type: text
      options: []
      required: false
    - id: 6
      name: travel_assistance_required
      label: Travel assistance required
      hint: Do you need travel support
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: Any other planning notes
      type: text
      options: []
      required: false
