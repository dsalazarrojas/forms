      - 'No'
      required: false
    - id: 6
      name: nonprofit_affiliation
      label: Nonprofit Affiliation
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: team_research_focus
      label: Team Research Focus
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: research_interests_details
      label: Additional Research Interests
      hint: null
      type: text
      options: []
      required: false
