inputSchema:
  type: object
  properties:
    title: Animal Science Lab Access Application Form
    pages:
    - id: 1
      name: applicant_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Institutional email preferred
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: institution
      label: Institution or Organization
      hint: University company or research center
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: Your department or division
      type: text
      options: []
      required: true
    - id: 6
      name: position_title
      label: Position Title
      hint: Job title or academic rank
      type: text
      options: []
      required: true
    - id: 7
      name: access_type
      label: Type of Access Requested
      hint: null
      type: select_one
      options:
      - One-Time Visit
      - Short-Term Access (1-7 days)
      - Medium-Term Access (1-4 weeks)
      - Long-Term Access (1+ months)
      - Regular Collaborator
      required: true
    - id: 8
      name: requested_start_date
      label: Requested Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: requested_end_date
      label: Requested End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: purpose_of_visit
      label: Purpose of Lab Access
      hint: Describe your research or project
      type: text
      options: []
      required: true
    - id: 11
      name: research_area
      label: Research Area
      hint: Select primary area
      type: select_one
      options:
      - Animal Behavior
      - Animal Physiology
      - Veterinary Medicine
      - Animal Nutrition
      - Wildlife Biology
      - Conservation Science
      - Genetics
      - Other
      required: true
    - id: 12
      name: animal_species
      label: Animal Species You Will Work With
      hint: Select all that apply
      type: select_multiple
      options:
      - Rodents (Mice Rats)
      - Rabbits
      - Dogs
      - Cats
      - Farm Animals
      - Primates
      - Birds
      - Fish
      - Reptiles
      - None - Observation Only
      - Other
      required: true
    - id: 13
      name: lab_areas_needed
      label: Lab Areas or Equipment Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - General Lab Space
      - Surgical Suite
      - Imaging Equipment
      - Behavioral Testing Rooms
      - Housing Facilities
      - Necropsy Lab
      - Sample Analysis Lab
      - Office Space
      - Other
      required: true
    - id: 14
      name: supervisor_name
      label: Lab Supervisor or PI Name
      hint: Who will supervise your work
      type: text
      options: []
      required: true
    - id: 15
      name: supervisor_email
      label: Supervisor Email
      hint: null
      type: email
      options: []
      required: true
    - id: 16
      name: iacuc_approval
      label: Do You Have IACUC or Ethics Approval
      hint: null
      type: select_one
      options:
      - Yes - Approval Number Available
      - Yes - Pending
      - No - Not Required for This Work
      - No - Will Apply
      required: true
    - id: 17
      name: approval_number
      label: Approval Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 18
      name: biosafety_training
      label: Biosafety Training Status
      hint: null
      type: select_one
      options:
      - Current - Certificate Available
      - Expired - Will Renew
      - Not Yet Completed
      - Not Required
      required: true
    - id: 19
      name: animal_handling_certification
      label: Animal Handling Certification
      hint: null
      type: select_one
      options:
      - Certified - Current
      - Certified - Expired
      - Not Yet Certified
      - Not Required for This Work
      required: true
    - id: 20
      name: previous_lab_experience
      label: Previous Animal Research Lab Experience
      hint: Describe briefly
      type: text
      options: []
      required: false
    - id: 21
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 22
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 23
      name: safety_agreement
      label: I Agree to Follow All Lab Safety Protocols
      hint: Safety is paramount
      type: select_one
      options:
      - Yes I Agree
      - No I Do Not Agree
      required: true
    - id: 24
      name: confidentiality_agreement
      label: I Agree to Maintain Confidentiality of Lab Data
      hint: null
      type: select_one
      options:
      - Yes I Agree
      - No I Do Not Agree
      required: true
    - id: 25
      name: additional_information
      label: Additional Information
      hint: Any other relevant details
      type: text
      options: []
      required: false
