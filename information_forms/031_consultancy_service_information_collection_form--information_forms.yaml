      options: []
      required: true
    - id: 5
      name: project_scope_summary
      label: Project scope summary
      hint: Briefly describe the scope of work
      type: text
      options: []
      required: true
    - id: 6
      name: desired_outcomes
      label: Desired outcomes
      hint: What success looks like for this engagement
