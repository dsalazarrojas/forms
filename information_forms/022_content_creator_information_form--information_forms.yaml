inputSchema:
  type: object
  properties:
    title: Content Creator Information Form
    pages:
    - id: 1
      name: creator_full_name
      label: Creator Full Name
      hint: Your legal name
      type: text
      options: []
      required: true
    - id: 2
      name: stage_name
      label: Stage Name or Handle
      hint: Your professional or online name
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: Business email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: website_url
      label: Website URL
      hint: Your personal or business website
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 7
      name: country_of_residence
      label: Country of Residence
      hint: Where do you currently live?
      type: select_one
      options:
      - United States
      - Canada
      - United Kingdom
      - Australia
      - Germany
      - France
      - Other
      required: true
    - id: 8
      name: primary_platform
      label: Primary Platform
      hint: Your main content platform
      type: select_one
      options:
      - YouTube
      - Instagram
      - TikTok
      - Facebook
      - Twitter
      - LinkedIn
      - Twitch
      - Blog
      - Podcast
      required: true
    - id: 9
      name: social_media_handles
      label: Social Media Handles
      hint: List your social media usernames
      type: text
      options: []
      required: true
    - id: 10
      name: follower_count
      label: Total Follower Count
      hint: Approximate total across all platforms
      type: select_one
      options:
      - Under 1,000
      - 1,000-10,000
      - 10,000-50,000
      - 50,000-100,000
      - 100,000-500,000
      - 500,000-1,000,000
      - Over 1,000,000
      required: true
    - id: 11
      name: content_niche
      label: Content Niche
      hint: What type of content do you create?
      type: select_one
      options:
      - Lifestyle
      - Beauty and Fashion
      - Technology
      - Gaming
      - Food and Cooking
      - Travel
      - Fitness and Health
      - Education
      - Entertainment
      - Business and Finance
      required: true
    - id: 12
      name: content_types
      label: Content Types
      hint: What formats do you create?
      type: select_multiple
      options:
      - Videos
      - Photos
      - Written Posts
      - Live Streams
      - Stories
      - Reels
      - Podcasts
      - Tutorials
      required: true
    - id: 13
      name: years_of_experience
      label: Years of Experience
      hint: How long have you been creating content?
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - 5-10 years
      - 10+ years
      required: true
    - id: 14
      name: audience_demographics
      label: Audience Demographics
      hint: Describe your typical audience
      type: text
      options: []
      required: true
    - id: 15
      name: engagement_rate
      label: Average Engagement Rate
      hint: Your typical engagement percentage
      type: select_one
      options:
      - Under 1%
      - 1-3%
      - 3-5%
      - 5-10%
      - Over 10%
      required: false
    - id: 16
      name: previous_brand_collaborations
      label: Previous Brand Collaborations
      hint: Have you worked with brands before?
      type: select_one
      options:
      - Yes, multiple brands
      - Yes, a few brands
      - Yes, one brand
      - No, never
      required: true
    - id: 17
      name: collaboration_examples
      label: Collaboration Examples
      hint: List brands you have worked with
      type: text
      options: []
      required: false
    - id: 18
      name: rate_card_available
      label: Rate Card Available
      hint: Do you have a rate card or pricing sheet?
      type: select_one
      options:
      - Yes, I will provide it
      - No, but I can create one
      - 'False'
      required: true
    - id: 19
      name: content_creation_equipment
      label: Content Creation Equipment
      hint: What equipment do you use?
      type: text
      options: []
      required: false
    - id: 20
      name: availability_for_collaboration
      label: Availability for Collaboration
      hint: When are you available for projects?
      type: select_one
      options:
      - Immediately
      - Within 2 weeks
      - Within 1 month
      - Within 3 months
      - Flexible
      required: true
    - id: 21
      name: why_work_with_us
      label: Why Do You Want to Work With Us?
      hint: Tell us why you are interested
      type: text
      options: []
      required: true
    - id: 22
      name: additional_information
      label: Additional Information
      hint: Anything else you would like to share
      type: text
      options: []
      required: false
