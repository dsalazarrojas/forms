inputSchema:
  type: object
  properties:
    title: Client Information Checklist Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: client_address
      label: Street Address
      hint: Complete mailing address
      type: text
      options: []
      required: true
    - id: 6
      name: client_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: client_state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: client_zip
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: service_requested
      label: Service Requested
      hint: What service do you need?
      type: select_one
      options:
      - Consulting
      - Professional Services
      - Product Purchase
      - Support Services
      - Training
      - Maintenance
      - Other
      required: true
    - id: 10
      name: service_details
      label: Service Details
      hint: Specific requirements
      type: text
      options: []
      required: true
    - id: 11
      name: identification_provided
      label: Have You Provided Valid ID?
      hint: Identity verification
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: id_type
      label: Type of ID Provided
      hint: If applicable
      type: select_one
      options:
      - Driver License
      - Passport
      - State ID
      - Military ID
      - Other
      - Not Applicable
      required: false
    - id: 13
      name: proof_of_address
      label: Have You Provided Proof of Address?
      hint: Utility bill, lease, etc.
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Required
      required: true
    - id: 14
      name: payment_method
      label: Payment Method
      hint: How will you pay?
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Cash
      - Check
      - Bank Transfer
      - Financing
      - Insurance
      - Other
      required: true
    - id: 15
      name: payment_information_complete
      label: Is Payment Information Complete?
      hint: Billing details
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: insurance_information
      label: Have You Provided Insurance Information?
      hint: If applicable
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Applicable
      required: true
    - id: 17
      name: emergency_contact_provided
      label: Have You Provided Emergency Contact?
      hint: Emergency contact info
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 18
      name: consent_forms_signed
      label: Have All Consent Forms Been Signed?
      hint: Required consents
      type: select_one
      options:
      - Yes, All Signed
      - Some Pending
      - Not Required
      required: true
    - id: 19
      name: terms_accepted
      label: Have You Accepted Terms and Conditions?
      hint: Agreement status
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: privacy_policy_accepted
      label: Have You Accepted the Privacy Policy?
      hint: Privacy agreement
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 21
      name: special_requirements
      label: Do You Have Special Requirements?
      hint: Accessibility, etc.
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: special_requirements_details
      label: Special Requirements Details
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 23
      name: preferred_appointment_time
      label: Preferred Appointment Time
      hint: When works best?
      type: select_one
      options:
      - Morning (8am-12pm)
      - Afternoon (12pm-5pm)
      - Evening (5pm-9pm)
      - Weekend
      - No Preference
      required: false
    - id: 24
      name: communication_preferences
      label: Communication Preferences
      hint: How should we contact you?
      type: select_multiple
      options:
      - Email
      - Phone Call
      - Text Message
      - Mail
      - Portal Notifications
      required: false
    - id: 25
      name: marketing_consent
      label: May We Send You Marketing Communications?
      hint: Newsletter, promotions
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 26
      name: checklist_completed
      label: I Confirm All Required Information Has Been Provided
      hint: Completeness confirmation
      type: select_one
      options:
      - I Confirm
      - I Do Not Confirm
      required: true
    - id: 27
      name: checklist_date
      label: Checklist Date
      hint: null
      type: date
      options: []
      required: true
