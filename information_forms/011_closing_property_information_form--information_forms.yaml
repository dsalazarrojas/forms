inputSchema:
  type: object
  properties:
    title: Closing Property Information Form
    pages:
    - id: 1
      name: property_address
      label: Property Address
      hint: Complete street address
      type: text
      options: []
      required: true
    - id: 2
      name: city_state_zip
      label: City, State, Zip Code
      hint: Full location details
      type: text
      options: []
      required: true
    - id: 3
      name: parcel_number
      label: Parcel or Lot Number
      hint: Property identification number
      type: text
      options: []
      required: false
    - id: 4
      name: seller_name
      label: Seller Name
      hint: Full legal name of seller
      type: text
      options: []
      required: true
    - id: 5
      name: seller_email
      label: Seller Email
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 6
      name: seller_phone
      label: Seller Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 7
      name: section_property
      label: -- Property Details --
      hint: Physical property information
      type: note
      options: []
      required: false
    - id: 8
      name: property_type
      label: Property Type
      hint: null
      type: select_one
      options:
      - Single Family Home
      - Multi-Family
      - Condo
      - Townhouse
      - Land Only
      - Commercial
      - Other
      required: true
    - id: 9
      name: year_built
      label: Year Built
      hint: Original construction year
      type: number
      options: []
      required: false
    - id: 10
      name: square_footage
      label: Total Square Footage
      hint: Building size in square feet
      type: number
      options: []
      required: false
    - id: 11
      name: number_bedrooms
      label: Number of Bedrooms
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: number_bathrooms
      label: Number of Bathrooms
      hint: Full and half baths
      type: number
      options: []
      required: false
    - id: 13
      name: lot_size
      label: Lot Size
      hint: Acreage or square footage
      type: text
      options: []
      required: false
    - id: 14
      name: section_condition
      label: -- Property Condition --
      hint: Current condition assessment
      type: note
      options: []
      required: false
    - id: 15
      name: overall_condition
      label: Overall Property Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Needs significant repairs
      required: true
    - id: 16
      name: major_repairs
      label: Any major repairs or updates completed in past 5 years
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: true
    - id: 17
      name: repairs_description
      label: Describe any major repairs or updates
      hint: Roof, plumbing, electrical, etc.
      type: text
      options: []
      required: false
    - id: 18
      name: known_issues
      label: Any known issues or defects
      hint: Damage, leaks, structural issues
      type: text
      options: []
      required: false
    - id: 19
      name: section_utilities
      label: -- Utilities and Systems --
      hint: Utility systems information
      type: note
      options: []
      required: false
    - id: 20
      name: heating_type
      label: Heating System Type
      hint: Furnace, heat pump, boiler, etc.
      type: text
      options: []
      required: false
    - id: 21
      name: air_conditioning
      label: Air Conditioning System
      hint: Type and condition
      type: text
      options: []
      required: false
    - id: 22
      name: water_heater
      label: Water Heater Type
      hint: Electric, gas, tankless, etc.
      type: text
      options: []
      required: false
    - id: 23
      name: roof_age
      label: Age of Roof
      hint: Approximate years since last replacement
      type: number
      options: []
      required: false
    - id: 24
      name: utilities_included
      label: Which utilities are included with the property
      hint: null
      type: select_multiple
      options:
      - Water
      - Sewer
      - Trash collection
      - Electricity
      - Gas
      - HOA fees
      - Other
      required: false
    - id: 25
      name: additional_notes
      label: Additional property information or notes
      hint: null
      type: text
      options: []
      required: false
