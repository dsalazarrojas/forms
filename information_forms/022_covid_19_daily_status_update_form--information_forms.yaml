inputSchema:
  type: object
  properties:
    title: Covid 19 Daily Status Update Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully Vaccinated
      - Partly Vaccinated
      - Not Vaccinated
      - Declined Vaccination
      - Unknown
      required: false
    - id: 5
      name: medical_team
      label: Medical Team
      hint: Please enter name of the medical team member
      type: text
      options: []
      required: false
    - id: 6
      name: patient_status
      label: Patient Status
      hint: null
      type: select_multiple
      options:
      - Active Case
      - Recovered
      - Deceased
      required: false
    - id: 7
      name: symptoms
      label: Symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: test_result
      label: Test Result
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Inconclusive
      required: false
    - id: 9
      name: date_of_last_contact
      label: Date of Last Contact
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: date_of_last_update
      label: Date of Last Update
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: medical_notes
      label: Medical Notes
      hint: null
      type: text
      options: []
      required: false
