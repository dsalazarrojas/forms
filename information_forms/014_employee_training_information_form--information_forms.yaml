inputSchema:
  type: object
  properties:
    title: Employee Training Information Form
    pages:
    - id: 1
      name: employer_name
      label: Employer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: training_type
      label: Training Type
      hint: null
      type: select_one
      options:
      - Basic Safety
      - Advanced Safety
      - Leadership Skills
      required: true
    - id: 4
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: training_facilitator
      label: Training Facilitator
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: training_venue
      label: Training Venue
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: training_duration
      label: Training Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: attended_previous_training
      label: Attended Previous Training
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 11
      name: previous_training_type
      label: Previous Training Type
      hint: null
      type: text
      options: []
      required: false
