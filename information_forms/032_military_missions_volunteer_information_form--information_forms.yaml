inputSchema:
  type: object
  properties:
    title: Military Missions Volunteer Information Form
    pages:
    - id: 1
      name: volunteer_information_form
      label: Volunteer Information Form
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: birthdate
      label: Birth Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: true
    - id: 8
      name: military_id
      label: Military ID
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: branch
      label: Branch
      hint: null
      type: select_one
      options:
      - Army
      - Navy
      - Air Force
      - Marine Corps
      - Coast Guard
      required: true
    - id: 10
      name: unit
      label: Unit
      hint: null
      type: select_multiple
      options:
      - 1st Special Forces
      - 2nd Special Forces
      - 3rd Special Forces
      - Other
      required: false
    - id: 11
      name: duty_location
      label: Duty Location
      hint: null
      type: select_one
      options:
      - Location 1
      - Location 2
      - Location 3
      required: true
    - id: 12
      name: deployment_date
      label: Deployment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: mission_type
      label: Mission Type
      hint: null
      type: select_one
      options:
      - Operation
      - Training
      - Deployment
      required: true
