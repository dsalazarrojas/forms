inputSchema:
  type: object
  properties:
    title: Community Center Participant Information Form
    pages:
    - id: 1
      name: participant_first_name
      label: First Name
      hint: Participant's legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_last_name
      label: Last Name
      hint: Participant's legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: participant_date_of_birth
      label: Date of Birth
      hint: Participant's date of birth
      type: date
      options: []
      required: true
    - id: 4
      name: participant_gender
      label: Gender
      hint: Participant's gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer to self-describe
      - Prefer not to say
      required: true
    - id: 5
      name: home_address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 6
      name: city_state_zip
      label: City, State, ZIP
      hint: City, state, and ZIP code
      type: text
      options: []
      required: true
    - id: 7
      name: primary_phone
      label: Primary Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 8
      name: secondary_phone
      label: Secondary Phone Number
      hint: Alternate contact number
      type: text
      options: []
      required: false
    - id: 9
      name: email_address
      label: Email Address
      hint: For communications and updates
      type: email
      options: []
      required: true
    - id: 10
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we contact you?
      type: select_one
      options:
      - Phone
      - Email
      - Text Message
      - Mail
      required: true
    - id: 11
      name: program_name
      label: Program Name
      hint: Which program are you registering for?
      type: select_one
      options:
      - After School Program
      - Senior Activities
      - Fitness Classes
      - Art Workshops
      - Dance Classes
      - Music Lessons
      - Sports Programs
      - Other
      required: true
    - id: 12
      name: program_schedule
      label: Preferred Schedule
      hint: When would you like to participate?
      type: select_one
      options:
      - Weekday Mornings
      - Weekday Afternoons
      - Weekday Evenings
      - Weekends
      - Flexible
      required: true
    - id: 13
      name: previous_participation
      label: Have You Participated Before
      hint: Have you been in our programs previously?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: previous_programs
      label: Previous Programs
      hint: List programs you participated in before
      type: text
      options: []
      required: false
    - id: 15
      name: goals_expectations
      label: Goals and Expectations
      hint: What do you hope to gain from this program?
      type: text
      options: []
      required: false
    - id: 16
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any dietary needs if snacks are provided
      type: text
      options: []
      required: false
    - id: 17
      name: transportation_needs
      label: Transportation Needs
      hint: Do you need assistance with transportation?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: referral_source
      label: How Did You Hear About This Program
      hint: Where did you learn about us?
      type: select_one
      options:
      - Website
      - Social Media
      - Friend or Family Referral
      - Community Event
      - School
      - Healthcare Provider
      - Other
      required: false
    - id: 19
      name: additional_comments
      label: Additional Comments
      hint: Any other information we should know
      type: text
      options: []
      required: false
