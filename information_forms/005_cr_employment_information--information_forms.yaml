inputSchema:
  type: object
  properties:
    title: CR Employment Information
    pages:
    - id: 1
      name: section_employee_identity
      label: -- Employee Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_full_name
      label: Full Legal Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id_number
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: social_security_number
      label: Social Security Number - Last 4 Digits
      hint: for verification purposes
      type: number
      options: []
      required: true
    - id: 5
      name: section_job_details
      label: -- Job and Position Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: current role within the company
      type: text
      options: []
      required: true
    - id: 7
      name: department_unit
      label: Department or Unit
      hint: null
      type: select_one
      options:
      - Human Resources
      - Finance
      - Engineering
      - Product Management
      - Customer Support
      - Logistics
      required: true
    - id: 8
      name: employment_status
      label: Employment Status
      hint: null
      type: select_one
      options:
      - Full-Time
      - Part-Time
      - Contract
      - Temporary
      - Intern
      required: true
    - id: 9
      name: date_of_hire
      label: Date of Hire
      hint: first day of employment
      type: date
      options: []
      required: true
    - id: 10
      name: work_location
      label: Primary Work Location
      hint: null
      type: select_one
      options:
      - Headquarters
      - Branch Office
      - Remote - Home
      - Field Office
      required: true
    - id: 11
      name: supervisor_name
      label: Direct Supervisor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: section_compensation
      label: -- Compensation and Benefits --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: pay_frequency
      label: Pay Frequency
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-Weekly
      - Semi-Monthly
      - Monthly
      required: true
    - id: 14
      name: hourly_rate_salary
      label: Base Salary or Hourly Rate
      hint: enter numerical value only
      type: number
      options: []
      required: true
    - id: 15
      name: benefit_enrollment_status
      label: Enrolled in Company Health Plan
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: true
    - id: 16
      name: additional_employment_notes
      label: Additional Employment Notes
      hint: null
      type: text
      options: []
      required: false
