inputSchema:
  type: object
  properties:
    title: CRG_Realty Buyers Information Form
    pages:
    - id: 1
      name: buyer_full_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: We will use this to contact you about properties
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Best number to reach you
      type: text
      options: []
      required: true
    - id: 4
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How would you like us to contact you
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - Either
      required: true
    - id: 5
      name: property_type_interest
      label: Property Type of Interest
      hint: What type of property are you looking for
      type: select_one
      options:
      - Single Family Home
      - Condominium
      - Townhouse
      - Multi-Family
      - Land
      - Commercial
      required: true
    - id: 6
      name: budget_range
      label: Budget Range
      hint: Your approximate price range
      type: select_one
      options:
      - Under $200,000
      - $200,000 - $350,000
      - $350,000 - $500,000
      - $500,000 - $750,000
      - $750,000 - $1,000,000
      - Over $1,000,000
      required: true
    - id: 7
      name: desired_location
      label: Desired Location
      hint: City or neighborhood preference
      type: text
      options: []
      required: true
    - id: 8
      name: number_of_bedrooms
      label: Number of Bedrooms Needed
      hint: Minimum bedrooms required
      type: select_one
      options:
      - Studio
      - 1 Bedroom
      - 2 Bedrooms
      - 3 Bedrooms
      - 4+ Bedrooms
      required: false
    - id: 9
      name: number_of_bathrooms
      label: Number of Bathrooms Needed
      hint: Minimum bathrooms required
      type: select_one
      options:
      - 1 Bathroom
      - 1.5 Bathrooms
      - 2 Bathrooms
      - 2.5+ Bathrooms
      required: false
    - id: 10
      name: timeline_to_purchase
      label: Timeline to Purchase
      hint: When do you plan to buy
      type: select_one
      options:
      - Immediately (0-30 days)
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - Just browsing
      required: true
    - id: 11
      name: currently_renting_or_owning
      label: Current Housing Situation
      hint: Are you currently renting or owning
      type: select_one
      options:
      - Renting
      - Owning
      - Living with family
      - Other
      required: false
    - id: 12
      name: financing_status
      label: Financing Status
      hint: Your current financing situation
      type: select_one
      options:
      - Pre-approved
      - Pre-qualified
      - Need lender referral
      - Cash buyer
      - Not sure yet
      required: false
    - id: 13
      name: must_have_features
      label: Must-Have Features
      hint: List any essential features you need
      type: text
      options: []
      required: false
    - id: 14
      name: additional_comments
      label: Additional Comments
      hint: Anything else you would like us to know
      type: text
      options: []
      required: false
