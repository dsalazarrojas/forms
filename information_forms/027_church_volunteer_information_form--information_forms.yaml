inputSchema:
  type: object
  properties:
    title: Church Volunteer Information Form
    pages:
    - id: 1
      name: volunteer_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: address
      label: Home Address
      hint: Street, city, state, zip
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: church_member
      label: Are You a Church Member
      hint: null
      type: select_one
      options:
      - Yes, active member
      - Yes, but not active
      - No, but interested
      - No, just helping
      required: true
    - id: 7
      name: membership_duration
      label: How Long Have You Been a Member
      hint: If applicable
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - More than 10 years
      - Not a member
      required: false
    - id: 8
      name: volunteer_interest
      label: Which Areas Are You Interested In
      hint: Select all that apply
      type: select_multiple
      options:
      - Worship/Music Team
      - Children's Ministry
      - Youth Ministry
      - Ushering/Greeting
      - Hospitality
      - Technical/Media
      - Prayer Ministry
      - Outreach/Missions
      - Facilities/Maintenance
      - Administration
      - Food Ministry
      - Visitation Ministry
      required: true
    - id: 9
      name: availability
      label: When Are You Available
      hint: Select all that apply
      type: select_multiple
      options:
      - Sunday Morning
      - Sunday Evening
      - Wednesday Evening
      - Saturday
      - Weekdays
      - Flexible schedule
      - Special events only
      required: true
    - id: 10
      name: hours_commitment
      label: How Many Hours Can You Commit
      hint: Per week
      type: select_one
      options:
      - 1-2 hours
      - 3-5 hours
      - 6-10 hours
      - More than 10 hours
      - As needed
      required: true
    - id: 11
      name: skills
      label: What Skills Do You Bring
      hint: Select all that apply
      type: select_multiple
      options:
      - Teaching
      - Music
      - Technical/AV
      - Counseling
      - Organization
      - Cooking
      - Maintenance
      - Writing
      - Leadership
      - Childcare
      - Other
      required: true
    - id: 12
      name: skills_detail
      label: Please Describe Your Skills
      hint: More details
      type: text
      options: []
      required: false
    - id: 13
      name: previous_experience
      label: Do You Have Previous Volunteer Experience
      hint: null
      type: select_one
      options:
      - Yes, at this church
      - Yes, at another church
      - Yes, secular organization
      - No, first time
      required: true
    - id: 14
      name: experience_detail
      label: Please Describe Your Experience
      hint: If yes
      type: text
      options: []
      required: false
    - id: 15
      name: background_check
      label: Are You Willing to Complete Background Check
      hint: Required for certain roles
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 16
      name: training_needed
      label: What Training Would You Need
      hint: Select all that apply
      type: select_multiple
      options:
      - Volunteer orientation
      - Child safety training
      - Technical training
      - Counseling training
      - Leadership training
      - No training needed
      required: true
    - id: 17
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: medical_conditions
      label: Any Medical Conditions We Should Know
      hint: For safety
      type: text
      options: []
      required: false
    - id: 19
      name: restrictions
      label: Any Physical Limitations or Restrictions
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: motivation
      label: Why Do You Want to Volunteer
      hint: Share your motivation
      type: text
      options: []
      required: true
    - id: 21
      name: start_date
      label: When Can You Start
      hint: null
      type: date
      options: []
      required: true
    - id: 22
      name: additional_comments
      label: Any Additional Comments
      hint: Questions or concerns
      type: text
      options: []
      required: false
