inputSchema:
  type: object
  properties:
    title: Agent Information Survey
    pages:
    - id: 1
      name: header
      label: -- Agent Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Legal name of the agent
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Preferred contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Mobile or office number
      type: text
      options: []
      required: false
    - id: 5
      name: license_number
      label: License number
      hint: Professional license or ID
      type: text
      options: []
      required: false
    - id: 6
      name: specialties
      label: Specialties
      hint: Areas of focus or expertise
      type: select_multiple
      options:
      - Residential
      - Commercial
      - Leasing
      - Property management
      - Other
      required: false
    - id: 7
      name: years_experience
      label: Years of experience
      hint: Number of years in the industry
      type: number
      options: []
      required: false
    - id: 8
      name: current_region
      label: Current operating region
      hint: Primary city or region served
      type: text
      options: []
      required: true
    - id: 9
      name: brokerage
      label: Brokerage
      hint: Current employing brokerage firm
      type: text
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any further information
      type: text
      options: []
      required: false
