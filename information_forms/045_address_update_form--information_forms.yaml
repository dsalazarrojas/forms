inputSchema:
  type: object
  properties:
    title: Address Update Form
    pages:
    - id: 1
      name: update_header
      label: -- Member / Customer Address Update --
      hint: Help us keep our records accurate by updating your contact information
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: customer_id
      label: Member / Customer ID Number
      hint: If known
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Current Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: current_phone
      label: Current Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: old_address_short
      label: Previous City and State
      hint: For identity verification purposes
      type: text
      options: []
      required: true
    - id: 7
      name: new_address_header
      label: -- New Address Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: new_street
      label: New Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: new_city
      label: New City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: new_state
      label: New State / Province
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: new_zip
      label: New Zip / Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: new_country
      label: New Country
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: update_reason
      label: Reason for Update
      hint: null
      type: select_one
      options:
      - Recent Move
      - Correcting an Error
      - Temporary Relocation
      - New Business Location
      required: true
    - id: 14
      name: preferred_mailing
      label: Use this as my primary mailing address for all communications?
      hint: null
      type: select_one
      options:
      - 'True'
      - No - Use for shipping only
      - No - Use for billing only
      required: true
    - id: 15
      name: effective_date
      label: Effective Date of Change
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: acknowledgement_text
      label: I confirm that I am authorized to update this information
      hint: null
      type: select_one
      options:
      - I Confirm
      - Other
      required: true
