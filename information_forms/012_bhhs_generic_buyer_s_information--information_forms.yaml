      name: financing_needed
      label: Will financing be needed?
      hint: null
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: true
    - id: 13
      name: price_range
      label: Preferred Price Range
      hint: Minimum to maximum price
      type: text
      options: []
