      label: Preferred Property Type
      hint: Single family, condo, townhome, etc.
      type: select_one
      options:
      - Single Family Home
      - Condo
      - Townhome
      - Multi-Family
      - Land
      - Other
      required: false
    - id: 16
      name: must_have_features
      label: Must-Have Features
      hint: Bedrooms, bathrooms, garage, etc.
      type: text
      options: []
      required: false
    - id: 17
      name: desired_location
      label: Desired Location or Area
      hint: Neighborhoods or cities of interest
      type: text
      options: []
      required: false
    - id: 18
      name: additional_notes
      label: Additional Notes or Special Requirements
      hint: null
      type: text
      options: []
      required: false
