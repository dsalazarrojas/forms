      name: section_primary_buyer
      label: -- Primary Buyer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: primary_buyer_name
      label: Primary Buyer Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: primary_buyer_phone
      label: Primary Buyer Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: primary_buyer_email
      label: Primary Buyer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: section_secondary_buyer
      label: -- Secondary Buyer Information (if applicable) --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: secondary_buyer_name
      label: Secondary Buyer Name
      hint: Full name
      type: text
      options: []
      required: false
    - id: 7
      name: secondary_buyer_phone
      label: Secondary Buyer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: secondary_buyer_email
      label: Secondary Buyer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: section_purchase_details
      label: -- Purchase Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: preapproved
      label: Are you pre-approved for a mortgage?
      hint: null
      type: select_one
      options:
      - true
      - false
      - In Process
      required: true
    - id: 11
      name: down_payment_amount
      label: Down Payment Amount Available
      hint: In dollars
      type: number
      options: []
      required: false
