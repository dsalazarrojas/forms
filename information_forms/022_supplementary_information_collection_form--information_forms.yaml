inputSchema:
  type: object
  properties:
    title: Supplementary Information Collection Form
    pages:
    - id: 1
      name: case_number
      label: Case Number
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_preference
      label: Contact Preference
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - None
      required: true
    - id: 3
      name: document_upload
      label: Document Upload
      hint: null
      type: select_multiple
      options:
      - Attachment 1
      - Attachment 2
      - Attachment 3
      required: true
    - id: 4
      name: additional_information
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: upload_document
      label: Upload Document
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: upload_document_2
      label: Upload Another Document
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: confirm_upload
      label: Confirm Uploads
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: follow_up_details
      label: Follow Up Details
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: follow_up_contact
      label: Follow Up Contact
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: follow_up_note
      label: Follow Up Note
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: contact_name
      label: Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 13
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: follow_up_status
      label: Follow Up Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Unknown
      required: true
