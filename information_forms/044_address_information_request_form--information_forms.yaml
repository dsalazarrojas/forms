inputSchema:
  type: object
  properties:
    title: Address Information Request Form
    pages:
    - id: 1
      name: request_intro
      label: -- Address Information and Verification Request --
      hint: We require updated address details for our records. Please complete all
        sections.
      type: note
      options: []
      required: false
    - id: 2
      name: recipient_name
      label: Your Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: current_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: address_details_header
      label: -- Primary Address Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: apartment_suite
      label: Apartment / Suite / Unit
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: state_region
      label: State / Region / Province
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: zip_postal_code
      label: Zip / Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: country_selection
      label: Country
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: verification_header
      label: -- Address Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: verification_doc_type
      label: Type of Verification Document Provided
      hint: A copy will be requested during the follow-up process
      type: select_one
      options:
      - Utility Bill (Last 3 months)
      - Bank Statement
      - Lease Agreement
      - Government-issued ID with Address
      - Notarized Affidavit
      required: true
    - id: 13
      name: length_of_residency
      label: Length of Residency at this Address
      hint: null
      type: select_one
      options:
      - Less than 6 months
      - 6-12 months
      - 1-3 years
      - 3-5 years
      - 5+ years
      required: true
    - id: 14
      name: secondary_address_check
      label: Do you have a secondary or mailing address?
      hint: null
      type: select_one
      options:
      - false
      - Yes (Provide in comments)
      required: true
    - id: 15
      name: additional_comments
      label: Additional Notes or Instructions
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: signature_confirmation
      label: I certify the address provided is my current legal residence
      hint: null
      type: select_one
      options:
      - I Certify
      - Other
      required: true
    - id: 17
      name: date_completed
      label: Date Completed
      hint: null
      type: date
      options: []
      required: true
