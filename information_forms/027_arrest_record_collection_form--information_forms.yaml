      name: violence_related
      label: Were any arrests violence-related
      hint: null
      type: select_one
      options:
      - false
      - true
      - Unsure
      required: true
    - id: 21
      name: drug_related
      label: Were any arrests drug-related
      hint: null
      type: select_one
      options:
      - false
      - true
      - Unsure
      required: true
    - id: 22
      name: incarceration
      label: Any periods of incarceration
      hint: null
      type: select_one
      options:
      - false
      - true
      - Currently incarcerated
      required: true
    - id: 23
      name: incarceration_details
      label: Details of Incarceration
      hint: Dates, location, duration
      type: text
      options: []
