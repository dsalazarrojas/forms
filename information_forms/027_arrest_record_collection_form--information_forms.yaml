      name: arrest_1_disposition
      label: Arrest 1 - Disposition
      hint: Convicted, acquitted, dismissed, etc.
      type: select_one
      options:
      - Convicted
      - Acquitted
      - Dismissed
      - Deferred
      - Unknown
      - Other
      required: true
    - id: 13
      name: arrest_2_date
      label: Arrest 2 - Date of Arrest
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: arrest_2_charge
      label: Arrest 2 - Charge or Offense
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: arrest_2_disposition
      label: Arrest 2 - Disposition
      hint: null
      type: select_one
      options:
      - Convicted
      - Acquitted
      - Dismissed
      - Deferred
      - Unknown
      - Other
      required: false
    - id: 16
      name: arrest_3_date
      label: Arrest 3 - Date of Arrest
      hint: null
      type: date
      options: []
      required: false
    - id: 17
      name: arrest_3_charge
      label: Arrest 3 - Charge or Offense
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: arrest_3_disposition
      label: Arrest 3 - Disposition
      hint: null
      type: select_one
      options:
      - Convicted
      - Acquitted
      - Dismissed
      - Deferred
      - Unknown
      - Other
      required: false
    - id: 19
      name: section_additional_information
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
