      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: drivers_license_number
      label: Driver License Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: identification_number
      label: ID Number or Badge Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_arrest_history
      label: -- Arrest History --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: arrests_count
      label: Number of Arrests
      hint: null
      type: number
      options: []
      required: true
