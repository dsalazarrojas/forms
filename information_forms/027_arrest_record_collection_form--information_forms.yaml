      hint: null
      type: select_one
      options:
      - false
      - Yes - probation
      - Yes - parole
      - Yes - both
      required: true
    - id: 25
      name: parole_details
      label: Parole or Probation Details
      hint: Duration, conditions, supervising officer
      type: text
      options: []
      required: false
    - id: 26
      name: section_signature
      label: -- Certification --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: certification_date
      label: Date of Certification
      hint: null
      type: date
      options: []
      required: true
    - id: 28
      name: accuracy_confirmation
      label: I certify the information above is accurate and complete
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
