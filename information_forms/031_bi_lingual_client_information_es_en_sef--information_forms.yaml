      name: apartment_unit
      label: Apartment or Unit Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 12
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: state_province
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: postal_code
      label: Postal Code or ZIP
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: country
      label: Country
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: section_header_contact
      label: -- Contact Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: best_contact_time
      label: Best Time to Contact You
      hint: When can we reach you?
      type: select_one
      options:
      - Morning (8am-12pm)
      - Afternoon (12pm-5pm)
      - Evening (5pm-9pm)
      - Anytime
      - By appointment
      required: true
    - id: 18
      name: contact_method
      label: Preferred Contact Method
      hint: How should we reach you?
      type: select_one
      options:
      - Phone call
      - Email
      - Text message
      - No preference
      required: true
