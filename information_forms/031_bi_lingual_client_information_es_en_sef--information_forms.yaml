      name: section_header_services
      label: -- Services Interest --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: services_interested
      label: Services You Are Interested In
      hint: Select all that apply
      type: select_multiple
      options:
      - Consulting
      - Professional services
      - Training or education
      - Product information
      - Support or assistance
      - Other inquiry
      required: true
    - id: 21
      name: brief_description
      label: Brief Description of Your Inquiry
      hint: What brings you here?
      type: text
      options: []
      required: true
    - id: 22
      name: section_header_background
      label: -- Background Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: how_heard
      label: How Did You Hear About Us
      hint: null
      type: select_one
      options:
      - Search engine
      - Social media
      - Referral from friend
      - Advertisement
      - Website
      - Word of mouth
      - Other
      required: true
    - id: 24
      name: previous_client
      label: Have You Been a Client Before
      hint: null
      type: select_one
      options:
      - Yes, recent client
      - Yes, past client
      - No, first time
      required: true
    - id: 25
      name: section_header_consent
      label: -- Consent and Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: communication_consent
      label: I Consent to Being Contacted
      hint: null
      type: select_one
      options:
      - Yes, contact me
      - No, do not contact
      required: true
    - id: 27
      name: email_consent
      label: I Would Like to Receive Email Updates
      hint: null
      type: select_one
      options:
      - Yes, send updates
      - No, do not send updates
      required: true
    - id: 28
      name: additional_notes
      label: Additional Information or Comments
      hint: Anything else we should know?
      type: text
      options: []
      required: false
