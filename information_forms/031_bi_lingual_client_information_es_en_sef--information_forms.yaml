      name: section_header_language
      label: -- Language Preference --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: preferred_language
      label: Preferred Language
      hint: Which language do you prefer?
      type: select_one
      options:
      - English
      - Español (Spanish)
      - Bilingual - both equally
      required: true
    - id: 3
      name: section_header_personal
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 5
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email Address
      hint: Your primary email
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: Best contact phone
      type: text
      options: []
      required: true
    - id: 8
      name: date_of_birth
      label: Date of Birth
      hint: Month - Day - Year
      type: date
      options: []
      required: false
    - id: 9
      name: section_header_address
      label: -- Address Information --
      hint: null
      type: note
      options: []
      required: false
