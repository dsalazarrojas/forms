inputSchema:
  type: object
  properties:
    title: Merit Badge Registration Form
    pages:
    - id: 1
      name: camp_details
      label: Camp Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: event_details
      label: Event
      hint: null
      type: select_one
      options:
      - Day Camp
      - Residential Camp
      - Backpack Camp
      required: false
    - id: 3
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: person_name
      label: Person
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: person_selection
      label: Select Multiple Persons
      hint: null
      type: select_multiple
      options:
      - Scout
      - Leader
      - Staff
      required: false
    - id: 7
      name: person_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: badge_selection
      label: Badge
      hint: null
      type: select_one
      options:
      - Tent
      - Backpack
      - Other
      required: false
    - id: 9
      name: badge_multi_selection
      label: Select Multiple Badges
      hint: null
      type: select_multiple
      options:
      - Tent
      - Backpack
      - Other
      required: false
    - id: 10
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: person_description
      label: Person Description
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: event_description
      label: Event Description
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
