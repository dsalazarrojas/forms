inputSchema:
  type: object
  properties:
    title: Fitness Camp Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: fitness_goals
      label: Fitness Goals
      hint: null
      type: select_one
      options:
      - Maintain current fitness level
      - Gain muscle mass
      - Lose weight
      - Improve cardiovascular health
      required: false
    - id: 5
      name: available_dates
      label: Available Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_of_day
      label: Time of Day
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: contact_method
      label: Contact Method
      hint: null
      type: select_multiple
      options:
      - phone
      - email
      - in_person
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: form_id
      label: Form ID
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: form_category
      label: Form Category
      hint: null
      type: select_one
      options:
      - Camp Registration Forms
      - Program Registration Forms
      - Test Form
      required: false
