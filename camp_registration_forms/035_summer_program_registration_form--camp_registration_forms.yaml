inputSchema:
  type: object
  properties:
    title: Summer Program Registration Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: program_picking
      label: Program Preference
      hint: null
      type: select_multiple
      options:
      - Program 1
      - Program 2
      - Program 3
      required: true
    - id: 3
      name: availability
      label: Availability
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: program_interest
      label: Program Interest
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: preferred_format
      label: Preferred Format
      hint: null
      type: select_one
      options:
      - Online
      - In-person
      - Hybrid
      required: true
    - id: 8
      name: dietary_restrictions
      label: Dietary Restriction
      hint: null
      type: select_one
      options:
      - No restriction
      - Vegetarian
      - Vegan
      - Gluten-free
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: select_one
      options:
      - No emergency contact
      - Yes, with the below information
      - Parent/Guardian
      - Family member
      required: false
    - id: 10
      name: program_commitment
      label: Program Commitment
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: preferred_schedule
      label: Preferred Schedule
      hint: null
      type: select_one
      options:
      - Weekdays
      - Weekends
      - Flexibility
      required: true
    - id: 12
      name: special_accommodations
      label: Special Accommodations
      hint: null
      type: select_one
      options:
      - No special accommodations needed
      - Hearing assistance
      - Visual assistance
      - Physical assistance
      - Other (please specify)
      required: false
