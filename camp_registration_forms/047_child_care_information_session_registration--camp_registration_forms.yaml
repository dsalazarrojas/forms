inputSchema:
  type: object
  properties:
    title: Child Care Information Session Registration
    pages:
    - id: 1
      name: registration_intro
      label: -- Information Session Registration --
      hint: Register for child care information session
      type: note
      options: []
      required: false
    - id: 2
      name: parent_first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: parent_last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: number_of_children
      label: Number of children interested in care
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: child_ages
      label: Ages of children
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: oldest_child_age
      label: Age of oldest child
      hint: null
      type: select_one
      options:
      - Infant
      - Toddler (1-3)
      - Preschool (3-5)
      - School age (6-12)
      - Teenager
      required: true
    - id: 9
      name: youngest_child_age
      label: Age of youngest child
      hint: null
      type: select_one
      options:
      - Newborn
      - Infant
      - Toddler (1-3)
      - Preschool (3-5)
      - School age
      required: true
    - id: 10
      name: session_date
      label: Which information session are you interested in?
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: session_time
      label: Preferred session time
      hint: null
      type: select_one
      options:
      - Morning (9 AM - 12 PM)
      - Afternoon (1 PM - 4 PM)
      - Evening (5 PM - 7 PM)
      - Weekend
      - Flexible
      required: true
    - id: 12
      name: session_format
      label: Preferred session format
      hint: null
      type: select_one
      options:
      - In-person tour
      - Virtual session
      - One-on-one meeting
      - Group information session
      - No preference
      required: true
    - id: 13
      name: facility_visit
      label: Would you like a facility tour?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 14
      name: care_type_interest
      label: Type of care interested in
      hint: Select all that apply
      type: select_multiple
      options:
      - Full-time care
      - Part-time care
      - Drop-in care
      - Infant care
      - Preschool
      - After-school care
      - Summer camp
      required: true
    - id: 15
      name: schedule_needs
      label: Required schedule or hours
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: current_arrangement
      label: Current child care arrangement
      hint: null
      type: select_one
      options:
      - Family care
      - Home-based provider
      - Center-based care
      - Nanny
      - No current care
      - Other
      required: false
    - id: 17
      name: enrollment_timeline
      label: Expected enrollment timeline
      hint: null
      type: select_one
      options:
      - Immediate
      - Within 1 month
      - 1-3 months
      - 3-6 months
      - 6+ months
      - Unsure
      required: true
    - id: 18
      name: key_questions
      label: Key questions or concerns about child care
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: special_needs
      label: Any special needs or accommodations needed
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: referral_source
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Website
      - Facebook
      - Word of mouth
      - Referral from friend
      - Google search
      - Advertisement
      - Other
      required: false
