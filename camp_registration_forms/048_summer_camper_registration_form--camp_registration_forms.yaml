inputSchema:
  type: object
  properties:
    title: Summer Camper Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Please provide in YYYY-MM-DD format.
      type: date
      options: []
      required: false
    - id: 4
      name: address
      label: Address
      hint: Street, City, and Zip code are not required.
      type: text
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: camper_type
      label: Camper Type
      hint: null
      type: select_one
      options:
      - Day Camper
      - Overnight Camper
      required: true
    - id: 8
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: camper_status
      label: Camper Status
      hint: null
      type: select_multiple
      options:
      - Currently registered
      - New camper
      - Re-registering
      required: false
    - id: 11
      name: emergency_contact
      label: Emergency Contact
      hint: Parent/guardian name and contact information.
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_relationship
      label: Emergency Relationship
      hint: null
      type: select_one
      options:
      - Parent
      - Guardian
      - Sibling
      required: true
    - id: 13
      name: emergency_phone
      label: Emergency Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_address
      label: Emergency Address
      hint: Not required.
      type: text
      options: []
      required: false
    - id: 15
      name: emergency_email
      label: Emergency Email
      hint: Not required.
      type: email
      options: []
      required: false
