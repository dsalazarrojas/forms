inputSchema:
  type: object
  properties:
    title: summer-day-camp-registration-form
    pages:
    - id: 1
      name: first_name
      label: first name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: last-name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: address
      label: address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: camp_type
      label: camp-type
      hint: Summer Day Camp, Overnight Camp
      type: select_one
      options:
      - summer-day-camp
      - overnight-camp
      required: true
    - id: 7
      name: camp_duration
      label: camp-duration
      hint: 1-2 weeks
      type: select_multiple
      options:
      - 1-week
      - 2-weeks
      required: true
    - id: 8
      name: start_date
      label: start-date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 9
      name: end_date
      label: end-date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 10
      name: payment_method
      label: payment-method
      hint: null
      type: select_one
      options:
      - credit-card
      - bank-transfer
      required: true
    - id: 11
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
