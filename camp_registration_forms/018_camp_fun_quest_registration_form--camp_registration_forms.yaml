inputSchema:
  type: object
  properties:
    title: Camp Fun Quest Registration Form
    pages:
    - id: 1
      name: camper_name
      label: Camper Full Name
      hint: Full name as on official records
      type: text
      options: []
      required: true
    - id: 2
      name: dob
      label: Date of Birth
      hint: Camper date of birth
      type: date
      options: []
      required: true
    - id: 3
      name: parent_guardian_contact
      label: Parent or Guardian Contact Phone
      hint: For emergency contact and updates
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Parent or Guardian Email
      hint: Used for camp communications
      type: email
      options: []
      required: true
    - id: 5
      name: session_choice
      label: Session Choice
      hint: Select preferred camp session
      type: select_one
      options:
      - Session A
      - Session B
      - Session C
      required: true
    - id: 6
      name: t_shirt_size
      label: T Shirt Size
      hint: Select camper t shirt size
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      required: false
    - id: 7
      name: medical_info
      label: Medical Information and Allergies
      hint: Note medications and allergy details
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_pickup
      label: Emergency Pickup Authorization
      hint: Names of people authorized to pick up camper
      type: text
      options: []
      required: true
    - id: 9
      name: photo_consent
      label: Photo Consent
      hint: Permission to use camper photos for camp media
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: special_requests
      label: Special Requests or Accommodations
      hint: Any accommodations needed during camp
      type: text
      options: []
      required: false
