inputSchema:
  type: object
  properties:
    title: Summer Camp Scholarship Application Form
    pages:
    - id: 1
      name: camper_info
      label: Camper Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: parent_info
      label: Parent Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: income
      label: Income Information
      hint: null
      type: select_one
      options:
      - None
      - $25,001 - $35,000
      - $35,001 - $45,000
      - $45,001+
      - Undisclosed
      required: false
    - id: 4
      name: reason_for_app
      label: Reason for Application
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: parent_phone
      label: Parent Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: camper_name
      label: Camper Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: camper_dob
      label: Camper's Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: camper_parents
      label: Camper's Parents
      hint: null
      type: select_multiple
      options:
      - Mother
      - Father
      - Both
      - Other
      required: false
    - id: 9
      name: camper_grade
      label: Camper's Grade
      hint: null
      type: select_one
      options:
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      required: false
    - id: 10
      name: camper_gender
      label: Camper's Gender
      hint: null
      type: select_one
      options:
      - Female
      - Male
      - Other
      required: false
