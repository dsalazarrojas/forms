inputSchema:
  type: object
  properties:
    title: Campground Lease Agreement
    pages:
    - id: 1
      name: lessor_info
      label: Lessor Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: lessee_info
      label: Lessee Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: lease_terms
      label: Lease Terms
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: pet_policy
      label: Pet Policy
      hint: Select policy
      type: select_one
      options:
      - Pets allowed
      - Pets allowed with deposit
      - No pets allowed
      - Service animals only
      required: true
    - id: 5
      name: rental_fee
      label: Total Rental Fee
      hint: Dollar amount
      type: number
      options: []
      required: true
    - id: 6
      name: payment_schedule
      label: Payment Schedule
      hint: Select schedule
      type: select_one
      options:
      - Full payment due at signing
      - 50 percent deposit - balance on arrival
      - Monthly payments
      - Other arrangement
      required: true
    - id: 7
      name: utilities_additional_terms
      label: Additional utilities terms
      hint: Describe any special terms
      type: text
      options: []
      required: false
    - id: 8
      name: lessor_signature
      label: Type full name
      hint: Signature of lessor
      type: text
      options: []
      required: true
    - id: 9
      name: lessee_signature
      label: Lessee Signature
      hint: Signature of lessee
      type: text
      options: []
      required: true
    - id: 10
      name: lessor_signature_date
      label: Date signed
      hint: Date of signature
      type: date
      options: []
      required: true
    - id: 11
      name: lessee_signature_date
      label: Lessee Signature Date
      hint: Date of signature
      type: date
      options: []
      required: true
    - id: 12
      name: witness_info
      label: Witness Information
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: insurance_required
      label: Is Insurance Required?
      hint: Select policy
      type: select_one
      options:
      - Yes - lessee must provide
      - No - covered by lessor
      - Recommended but not required
      required: true
