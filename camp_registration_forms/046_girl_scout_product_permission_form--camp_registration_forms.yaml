      name: delivery_time
      label: Delivery Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: notes
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: payment_term
      label: Payment Term
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''14 day'', ''value'': 1}'
      - '{''label'': ''28 day'', ''value'': 2}'
      - '{''label'': ''30 day'', ''value'': 3}'
      required: false
