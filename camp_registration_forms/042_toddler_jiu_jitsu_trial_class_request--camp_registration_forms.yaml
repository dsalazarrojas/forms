inputSchema:
  type: object
  properties:
    title: Toddler Jiu Jitsu Trial Class Request
    pages:
    - id: 1
      name: parent_name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: preferred_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: class_type
      label: Class Type
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 7
      name: trial_duration
      label: Trial Duration
      hint: null
      type: select_one
      options:
      - 30 minutes
      - 45 minutes
      - 60 minutes
      required: true
    - id: 8
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
