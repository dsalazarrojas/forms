inputSchema:
  type: object
  properties:
    title: Fire Service Recovery Leave Of Absence Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: fire_number
      label: Fire Number
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: duration
      label: Duration
      hint: null
      type: select_one
      options:
      - Less than 1 week
      - 1-2 weeks
      - 3-4 weeks
      - More than 4 weeks
      required: true
    - id: 7
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - Administration
      - Fire
      - Operations
      required: true
    - id: 8
      name: reason
      label: Reason
      hint: null
      type: select_one
      options:
      - Bereavement
      - Court
      - Doctor
      - Family
      - Jury
      - Other
      required: true
