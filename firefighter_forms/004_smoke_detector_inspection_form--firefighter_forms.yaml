inputSchema:
  type: object
  properties:
    title: smoke_detector_inspection_form
    pages:
    - id: 1
      name: fire_safety_system
      label: Fire Safety System
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: building_location
      label: Building Location
      hint: null
      type: select_multiple
      options:
      - Building Main Hall
      - Building 2
      - Building 3
      - etc.
      required: false
    - id: 3
      name: smoke_detector_type
      label: Smoke Detector Type
      hint: null
      type: select_one
      options:
      - Fire Alarm
      - Heat Detector
      - Dual
      required: true
    - id: 4
      name: installed_locations
      label: Installed Locations
      hint: null
      type: select_multiple
      options:
      - Basement
      - Upper floor
      - Lower floor
      required: true
    - id: 5
      name: smoke_detector_functional
      label: Smoke Detector Functional
      hint: null
      type: select_one
      options:
      - Functional
      - Non-Functional
      required: true
    - id: 6
      name: fire_alarm_system
      label: Fire Alarm System
      hint: null
      type: select_multiple
      options:
      - Fire Alarm System
      - None
      required: true
    - id: 7
      name: fire_safety_plan
      label: Fire Safety Plan
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
