      name: building_height
      label: Building Height
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: smoke_detector_location
      label: Smoke Detector Location
      hint: null
      type: select_one
      options:
      - Ground Floor
      - Middle Floor
      - Upper Floor
      required: true
    - id: 10
      name: fire_safety_system_cert
      label: Fire Safety System Certificate
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      - None
      required: true
    - id: 11
      name: certification_date
      label: Certification Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: certification_time
      label: Certification Time
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: inspector_phone
      label: Inspector Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: inspector_email
