    - id: 11
      name: scale_condition
      label: Scale Condition
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
