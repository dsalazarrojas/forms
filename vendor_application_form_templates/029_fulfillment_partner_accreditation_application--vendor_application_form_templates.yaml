      name: acc_reason
      label: Reason for Accreditation
      hint: Select reason for accreditation
      type: select_one
      options:
      - '{''name'': ''New Application''}'
      - '{''name'': ''Existing Application''}'
      - '{''name'': ''Re-Application''}'
      required: false
    - id: 24
      name: acc_reapply_date
      label: Reapply Date
      hint: Select reapply date
      type: date
      options: []
      required: false
    - id: 25
      name: acc_reapply_reason
      label: Reapply Reason
      hint: Select reapply reason
      type: select_one
      options:
      - '{''name'': ''New Application''}'
      - '{''name'': ''Existing Application''}'
      - '{''name'': ''Re-Application''}'
      required: false
