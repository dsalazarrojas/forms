inputSchema:
  type: object
  properties:
    title: Sports Vendor Market Application Form
    pages:
    - id: 1
      name: vendor_name
      label: Vendors Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: documents
      label: Documents Needed
      hint: null
      type: note
      options: []
      required: true
    - id: 5
      name: booth_needs
      label: Booth Needs
      hint: null
      type: select_one
      options:
      - Booth with tables and chairs
      - Table only
      - Chair only
      - Other
      required: true
    - id: 6
      name: rule_agreement
      label: Rule Agreement
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: vendor_details
      label: Vendor Details
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: terms_of_service
      label: Terms of Service
      hint: null
      type: select_one
      options:
      - Agree
      - Decline
      required: true
