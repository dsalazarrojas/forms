inputSchema:
  type: object
  properties:
    title: Beard Pact Act Form
    pages:
    - id: 1
      name: vendor_name
      label: Vendor Name
      hint: Business name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_person
      label: Contact Person
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: business_address
      label: Business Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 6
      name: business_type
      label: Business Type
      hint: Entity type
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC
      - Corporation
      - Other
      required: true
    - id: 7
      name: tax_id
      label: Tax ID or EIN
      hint: Tax identification
      type: text
      options: []
      required: true
    - id: 8
      name: product_category
      label: Product Category
      hint: What do you supply
      type: select_one
      options:
      - Beard Oils
      - Beard Balms
      - Grooming Tools
      - Packaging
      - Raw Ingredients
      - Other
      required: true
    - id: 9
      name: years_in_business
      label: Years in Business
      hint: How long operating
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-10 years
      - Over 10 years
      required: true
    - id: 10
      name: compliance_certifications
      label: Compliance Certifications
      hint: Select all that apply
      type: select_multiple
      options:
      - FDA Registered
      - GMP Certified
      - ISO Certified
      - Organic Certified
      - None
      required: true
    - id: 11
      name: product_liability_insurance
      label: Product Liability Insurance
      hint: Do you have insurance
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: insurance_coverage_amount
      label: Insurance Coverage Amount
      hint: Coverage limit
      type: text
      options: []
      required: false
    - id: 13
      name: quality_assurance
      label: Quality Assurance Process
      hint: Describe your QA
      type: text
      options: []
      required: true
    - id: 14
      name: delivery_capability
      label: Delivery Capability
      hint: Shipping options
      type: select_one
      options:
      - Local Only
      - Regional
      - National
      - International
      required: true
    - id: 15
      name: minimum_order
      label: Minimum Order Quantity
      hint: MOQ
      type: text
      options: []
      required: true
    - id: 16
      name: payment_terms
      label: Payment Terms
      hint: Your terms
      type: select_one
      options:
      - Net 30
      - Net 60
      - Due on Receipt
      - 50 Percent Deposit
      - Other
      required: true
    - id: 17
      name: references_available
      label: References Available
      hint: Can you provide references
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: pact_act_compliance
      label: PACT Act Compliance Acknowledged
      hint: Do you acknowledge
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: terms_accepted
      label: Terms and Conditions Accepted
      hint: Must accept
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: signature
      label: Authorized Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 21
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
