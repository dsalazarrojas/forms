inputSchema:
  type: object
  properties:
    title: Artist In Residence Curatorial Application Form
    pages:
    - id: 1
      name: section_header_1
      label: -- Artist Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: artist_name
      label: Artist Name
      hint: Your professional name or pseudonym
      type: text
      options: []
      required: true
    - id: 3
      name: legal_name
      label: Legal Name
      hint: Your full legal name
      type: text
      options: []
      required: true
    - id: 4
      name: artist_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 5
      name: artist_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: artist_website
      label: Website or Portfolio URL
      hint: Link to your work
      type: text
      options: []
      required: false
    - id: 7
      name: section_header_2
      label: -- Artist Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: primary_medium
      label: Primary Artistic Medium
      hint: Your main area of artistic practice
      type: select_one
      options:
      - Painting
      - Sculpture
      - Photography
      - Installation
      - Performance
      - Digital Media
      - Mixed Media
      - Curatorship
      - Other
      required: true
    - id: 9
      name: artist_statement
      label: Artist Statement
      hint: Describe your artistic vision and practice
      type: text
      options: []
      required: true
    - id: 10
      name: years_active
      label: Years Active as an Artist
      hint: How long have you been practicing?
      type: number
      options: []
      required: false
    - id: 11
      name: section_header_3
      label: -- Education and Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: education
      label: Relevant Education or Training
      hint: Degrees, certifications, or training
      type: text
      options: []
      required: false
    - id: 13
      name: exhibition_history
      label: Exhibition History
      hint: List major exhibitions and shows
      type: text
      options: []
      required: true
    - id: 14
      name: awards_recognition
      label: Awards and Recognition
      hint: Grants, fellowships, publications
      type: text
      options: []
      required: false
    - id: 15
      name: section_header_4
      label: -- Curatorial Proposal --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: residency_focus
      label: Focus of Artist-in-Residence Program
      hint: What would you like to explore?
      type: text
      options: []
      required: true
    - id: 17
      name: project_description
      label: Project or Curatorial Proposal
      hint: Detailed description of your proposal
      type: text
      options: []
      required: true
    - id: 18
      name: proposed_outcomes
      label: Proposed Outcomes or Deliverables
      hint: What will be created or exhibited?
      type: text
      options: []
      required: true
    - id: 19
      name: section_header_5
      label: -- Timeline and Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: residency_duration
      label: Proposed Residency Duration
      hint: How long should the residency be?
      type: select_one
      options:
      - 1 month
      - 2-3 months
      - 4-6 months
      - 6-12 months
      - 12+ months
      - Flexible
      required: true
    - id: 21
      name: preferred_dates
      label: Preferred Dates or Timeframe
      hint: When would you like to participate?
      type: text
      options: []
      required: false
    - id: 22
      name: technical_requirements
      label: Technical or Space Requirements
      hint: What space, equipment, or resources do you need?
      type: text
      options: []
      required: false
    - id: 23
      name: section_header_6
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: apply_confirmation
      label: I Confirm This Application is Accurate
      hint: Verify the information provided
      type: select_one
      options:
      - Yes, I Confirm
      - No, I Need to Make Changes
      required: true
    - id: 25
      name: additional_materials
      label: Additional Materials or Statement
      hint: Any other information for the selection committee
      type: text
      options: []
      required: false
