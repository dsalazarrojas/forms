inputSchema:
  type: object
  properties:
    title: training_registration
    pages:
    - id: 1
      name: report_name
      label: Report Name
      hint: Report name to appear on the registration form
      type: text
      options: []
      required: true
    - id: 2
      name: training_id
      label: Training ID
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: training_location
      label: Training Location
      hint: Training location, e.g., office
      type: text
      options: []
      required: true
    - id: 6
      name: training_provider
      label: Training Provider
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: training_status
      label: Training Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Canceled
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: training_venue
      label: Training Venue
      hint: Training venue, e.g., office
      type: text
      options: []
      required: true
    - id: 12
      name: training_start_date
      label: Training Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: training_end_date
      label: Training End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: training_duration
      label: Training Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: training_capacity
      label: Training Capacity
      hint: null
      type: number
      options: []
      required: true
