inputSchema:
  type: object
  properties:
    title: Home Inspection Form
    pages:
    - id: 1
      name: address_field
      label: address_field
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_birth
      label: date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: phone_number
      label: phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: inspection_type
      label: inspection type
      hint: null
      type: select_one
      options:
      - residential
      - commercial
      - mixed use
      - industrial
      - other (please specify)
      required: true
    - id: 6
      name: inspector_name
      label: inspector name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: inspection_results
      label: inspection results
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: inspection_date
      label: inspection date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: agent_name
      label: agent name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: inspector_license
      label: inspector license
      hint: null
      type: text
      options: []
      required: false
