inputSchema:
  type: object
  properties:
    title: Home Security Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_info
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: security_risks
      label: Security Risks
      hint: null
      type: select_multiple
      options:
      - Are there any security risks present in the home?
      - 'False'
      required: false
    - id: 5
      name: vulnerable_areas
      label: Vulnerable Areas
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: security_measures
      label: Security Measures
      hint: null
      type: select_one
      options:
      - Are there any security measures in place to prevent security risks?
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - another tool
      required: false
    - id: 9
      name: client_signature
      label: Client Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: inspector_signature
      label: Inspector Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: date_of_inspection
      label: Date of Inspection
      hint: null
      type: date
      options: []
      required: false
