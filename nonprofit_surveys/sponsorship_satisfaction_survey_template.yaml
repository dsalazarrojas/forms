description: Gather feedback from our valuable sponsors to improve their experience
  and strengthen our partnerships.
questions:
- options:
  - Very satisfied
  - Satisfied
  - Neutral
  - Dissatisfied
  - Very dissatisfied
  text: Overall, how satisfied are you with your experience as a sponsor of our organization?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate the clarity and frequency of communication from our organization?
  type: single
- options:
  - Brand exposure
  - Community impact
  - Networking opportunities
  - Employee engagement
  - Alignment with values
  text: Which of the following benefits are most important to your organization when
    sponsoring? (select all that apply)
  type: multiple
- options:
  - Strongly agree
  - Agree
  - Neutral
  - Disagree
  - Strongly disagree
  text: Do you feel your sponsorship effectively supports your organization's goals?
  type: single
- options:
  - Very likely
  - Likely
  - Neutral
  - Unlikely
  - Very unlikely
  text: How likely are you to renew your sponsorship with us in the future?
  type: single
- text: What specific improvements could enhance your sponsorship experience?
  type: text
- text: Do you have any additional comments or suggestions?
  type: text
title: Sponsorship satisfaction survey
