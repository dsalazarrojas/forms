description: Gathering feedback on our recent event to improve future nonprofit activities
  and engagement.
questions:
- options:
  - Very satisfied
  - Satisfied
  - Neutral
  - Dissatisfied
  - Very dissatisfied
  text: How satisfied were you with the overall event experience?
  type: single
- options:
  - Keynote speaker
  - Workshop sessions
  - Networking opportunities
  - Panel discussions
  - Informational booths
  - Volunteer activities
  text: Which aspects or sessions did you find most valuable? (select all that apply)
  type: multiple
- options:
  - true
  - Mostly
  - false
  text: Was the event well-organized and easy to navigate?
  type: single
- options:
  - Very likely
  - Likely
  - Neutral
  - Unlikely
  - Very unlikely
  text: How likely are you to attend a similar event organized by us in the future?
  type: single
- options:
  - Support the cause
  - Learn something new
  - Network with others
  - Socialize
  - Specific speaker/topic
  text: What was your primary motivation for attending this event?
  type: single
- text: Do you have any additional comments or suggestions for future events?
  type: text
title: Event planning survey
