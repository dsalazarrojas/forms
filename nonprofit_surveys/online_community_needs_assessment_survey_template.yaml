description: Gathering insights to improve our online community experience and support
  our members.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with our online community platform?
  type: single
- options:
  - Daily
  - Weekly
  - Monthly
  - Rarely
  - Never
  text: How often do you engage with our online community?
  type: single
- options:
  - Networking
  - Information sharing
  - Support/Advice
  - Event announcements
  - General discussion
  - Resource discovery
  text: What do you primarily use our online community for? (select all that apply)
  type: multiple
- text: What improvements would you suggest for our online community?
  type: text
- text: Is there anything else you'd like to share about our online community?
  type: text
title: Online community needs assessment survey
