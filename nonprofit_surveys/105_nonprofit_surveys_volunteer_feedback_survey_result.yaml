title: Volunteer feedback survey
description: Generate a Volunteer feedback survey survey for the "Nonprofit surveys" category. Use the template name: "Volunteer feedback survey template".
questions:
  - text: Overall, how satisfied are you with volunteer feedback survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Volunteer, Feedback, Survey, Nonprofit]
  - text: How often do you interact with volunteer feedback survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
