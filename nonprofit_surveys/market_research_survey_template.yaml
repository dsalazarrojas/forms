description: Gathering insights to understand public perception and inform strategic
  planning for our nonprofit organization.
questions:
- options:
  - Very positive
  - Positive
  - Neutral
  - Negative
  - Very negative
  text: How would you describe your overall impression of our organization's work
    in the community?
  type: single
- options:
  - Impact on community
  - Transparency
  - Communication
  - Specific programs
  - Volunteer opportunities
  - Mission alignment
  text: Which aspects of our nonprofit's work are most important to you? (select all
    that apply)
  type: multiple
- options:
  - Very likely
  - Likely
  - Neutral
  - Unlikely
  - Very unlikely
  text: How likely are you to recommend supporting our nonprofit to others?
  type: single
- text: What specific improvements or changes would you suggest for our organization's
    efforts?
  type: text
- text: Do you have any additional comments or feedback regarding our nonprofit?
  type: text
title: Market research survey
