title: Exit survey
description: Generate a Exit survey survey for the "Nonprofit surveys" category. Use the template name: "Exit survey template".
questions:
  - text: Overall, how satisfied are you with exit survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Exit, Survey, Nonprofit, Surveys]
  - text: How often do you interact with exit survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
