title: Online community needs assessment survey
description: Generate a Online community needs assessment survey survey for the "Nonprofit surveys" category. Use the template name: "Online community needs assessment survey template".
questions:
  - text: Overall, how satisfied are you with online community needs assessment survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Online, Community, Needs, Assessment]
  - text: How often do you interact with online community needs assessment survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
