inputSchema:
  type: object
  properties:
    title: homework submission form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: Please enter the student's name
      type: text
      options: []
      required: true
    - id: 2
      name: submission_date
      label: Submission Date
      hint: Select the date of submission
      type: date
      options: []
      required: true
    - id: 3
      name: grade
      label: Grade (if applicable)
      hint: Enter the grade if applicable
      type: number
      options: []
      required: false
    - id: 4
      name: assignment_name
      label: Assignment Name
      hint: Enter the assignment title
      type: text
      options: []
      required: true
    - id: 5
      name: assignment_due_date
      label: Assignment Due Date
      hint: Enter the due date of the assignment
      type: date
      options: []
      required: true
    - id: 6
      name: notes
      label: Notes (if applicable)
      hint: Enter any additional notes
      type: note
      options: []
      required: false
    - id: 7
      name: submitter_name
      label: Submitter Name
      hint: Enter your name
      type: text
      options: []
      required: false
    - id: 8
      name: assignment_type
      label: Assignment Type
      hint: Select the type of assignment
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: submission_comments
      label: Submission Comments
      hint: Enter any comments about the submission
      type: text
      options: []
      required: false
    - id: 10
      name: submitter_phone
      label: Submitter Phone
      hint: Enter your phone number
      type: text
      options: []
      required: false
    - id: 11
      name: assignment_notes
      label: Assignment Notes
      hint: Enter any additional notes about the assignment
      type: note
      options: []
      required: false
    - id: 12
      name: submitter_email
      label: Submitter Email
      hint: Enter your email
      type: email
      options: []
      required: false
