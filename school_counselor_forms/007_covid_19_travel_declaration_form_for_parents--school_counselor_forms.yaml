inputSchema:
  type: object
  properties:
    title: COVID 19 Travel Declaration Form For Parents
    pages:
    - id: 1
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: parent_email
      label: Parent Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: parent_phone
      label: Parent Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: student_section
      label: -- Student Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: student_name
      label: Student Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: student_id
      label: Student ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: grade_level
      label: Grade Level
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: travel_section
      label: -- Travel Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: travel_planned
      label: Has your family planned or completed travel
      hint: In the past 14 days or upcoming
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: travel_start_date
      label: Travel Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: travel_end_date
      label: Travel End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: travel_destination
      label: Travel Destination - Country and City
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: travel_type
      label: Type of Travel
      hint: null
      type: select_one
      options:
      - Domestic air travel
      - International air travel
      - Road trip
      - Cruise
      - Train
      - Other
      required: false
    - id: 14
      name: high_risk_area
      label: Is destination a high-risk COVID-19 area
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unknown
      required: false
    - id: 15
      name: health_section
      label: -- Health and Safety --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: vaccination_status
      label: Student Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Not vaccinated
      - Unknown
      required: true
    - id: 17
      name: family_vaccination
      label: All traveling family members fully vaccinated
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partially
      required: false
    - id: 18
      name: test_before_travel
      label: Will family get tested before travel
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Already tested
      required: false
    - id: 19
      name: test_after_travel
      label: Will family get tested after travel
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 20
      name: quarantine_understanding
      label: I understand potential quarantine requirements
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 21
      name: school_notification
      label: School will be notified of travel
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 22
      name: remote_learning
      label: Student may need to participate in remote learning upon return
      hint: null
      type: select_one
      options:
      - I understand
      - I do not understand
      required: true
    - id: 23
      name: contact_info_abroad
      label: Contact Information While Traveling
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: acknowledgment
      label: I acknowledge receipt of travel guidelines and quarantine requirements
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
