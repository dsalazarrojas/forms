inputSchema:
  type: object
  properties:
    title: School Meal Survey
    pages:
    - id: 1
      name: survey_question_1
      label: How would you rate the quality of school meals?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 2
      name: survey_question_2
      label: What do you think about the variety of foods offered?
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Non-Vegetarian
      - Meat
      - Fruit/Veggie
      required: false
    - id: 3
      name: survey_question_3
      label: How would you rate the taste of school meals?
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: survey_question_4
      label: How about the quantity of food provided?
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: survey_question_5
      label: Would you like to leave a comment?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: survey_question_6
      label: What is your school email?
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: survey_question_7
      label: What is your school phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: survey_question_8
      label: How often would you like school meals to be served?
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: survey_question_9
      label: Would you like more salad options?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Maybe
      required: false
    - id: 10
      name: survey_question_10
      label: Other Comments -
      hint: null
      type: note
      options: []
      required: false
