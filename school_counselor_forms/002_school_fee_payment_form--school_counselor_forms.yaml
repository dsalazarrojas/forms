inputSchema:
  type: object
  properties:
    title: School Fee Payment Form
    pages:
    - id: 1
      name: student_details
      label: Student
      hint: Please provide student details.
      type: text
      options: []
      required: false
    - id: 2
      name: payment_method
      label: Payment Method
      hint: How did you make the payment?
      type: select_one
      options:
      - Cash
      - Credit Card
      - Online Transfer
      required: true
    - id: 3
      name: fee_amount
      label: Fee Amount Paid
      hint: Enter the amount paid.
      type: number
      options: []
      required: true
    - id: 4
      name: payment_date
      label: Fee Paid Date
      hint: Date of payment.
      type: date
      options: []
      required: true
    - id: 5
      name: supplies_purchased
      label: Supplies
      hint: Select the supplies purchased.
      type: select_multiple
      options:
      - Pencils
      - Pens
      - Paper
      - Calculator
      required: true
    - id: 6
      name: swags_purchased
      label: Swags
      hint: Select the swags purchased.
      type: select_multiple
      options:
      - Notebooks
      - Folders
      required: true
    - id: 7
      name: book_order
      label: Book Order Form
      hint: Order your books here.
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: Any comments about the payment or swags.
      type: note
      options: []
      required: false
