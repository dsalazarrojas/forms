inputSchema:
  type: object
  properties:
    title: Cycling Program Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: class_rating
      label: What rating do you give to this class?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: instructor_rating
      label: How would you rate the instructor?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: suggestions
      label: What did you like or dislike about this class?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: class_value
      label: Which of the following best describes your experience in this class?
      hint: null
      type: select_one
      options:
      - '{''option'': 1, ''value'': ''Great''}'
      - '{''option'': 2, ''value'': ''Not what I expected''}'
      - '{''option'': 3, ''value'': ''Average''}'
      - '{''option'': 4, ''value'': ''Below average''}'
      required: false
    - id: 6
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: contact
      label: Contact number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: rating
      label: Overall rating
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: instructor_comments
      label: Instructor comments
      hint: null
      type: note
      options: []
      required: false
