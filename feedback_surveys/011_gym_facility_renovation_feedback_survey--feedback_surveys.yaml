inputSchema:
  type: object
  properties:
    title: Gym Facility Renovation Feedback Survey
    pages:
    - id: 1
      name: main_page
      label: Gym Facility Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: renovation_type
      label: Renovation Type
      hint: null
      type: select_one
      options:
      - Upgrade
      - Maintenance
      - Other
      - None
      required: false
    - id: 3
      name: feedback_on_upgrade
      label: Feedback on Upgrade
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: Scale of 1-5
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 5
      name: suggestions_for_improvement
      label: Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date_of_last_visit
      label: Date of Last Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time_of_last_visit
      label: Time of Last Visit
      hint: null
      type: time
      options: []
      required: false
