inputSchema:
  type: object
  properties:
    title: Lease Policy Understanding Survey
    pages:
    - id: 1
      name: role
      label: What is your role in the company/organization responsible for managing
        the property?
      hint: null
      type: select_one
      options:
      - Property Manager
      - Landlord
      - Owner
      - Other
      required: true
    - id: 2
      name: review_frequency
      label: How often do you review and update the lease policy?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Never
      required: true
    - id: 3
      name: primary_concern
      label: What is your primary concern when reviewing or updating the lease policy?
      hint: null
      type: select_multiple
      options:
      - Accuracy
      - Time-Consuming
      - Lack of Guidance
      - Other
      required: true
    - id: 4
      name: communication
      label: How do you currently communicate changes to the lease policy to stakeholders?
      hint: null
      type: select_multiple
      options:
      - Email
      - In-Person
      - Phone Call
      - Email/Phone Combo
      required: true
    - id: 5
      name: document_storage
      label: What method do you use to store and manage documents related to the lease
        policy?
      hint: null
      type: select_multiple
      options:
      - Google Drive
      - Dropbox
      - External Server
      - Paper Filing System
      required: true
    - id: 6
      name: lease_hours
      label: How many hours per week do you spend on lease-related tasks?
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: biggest_challenge
      label: What is your biggest challenge when it comes to understanding the lease
        policy?
      hint: null
      type: select_multiple
      options:
      - Complexity
      - Lack of Clarity
      - Time-Consuming
      - Other
      required: true
    - id: 8
      name: dedicated_team
      label: Do you have a dedicated team for lease policy management or is it handled
        individually?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: data_review
      label: How often do you review lease policy-related data and reports?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      required: true
    - id: 10
      name: recent_unclear
      label: Can you describe a recent situation where the lease policy was unclear
        or confusing?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: clarity_level
      label: How would you rate the overall clarity of the lease policy document?
      hint: null
      type: select_one
      options:
      - Very Clear
      - Somewhat Clear
      - Somewhat Unclear
      - Very Unclear
      required: true
    - id: 12
      name: suggestions
      label: What suggestions do you have for improving the lease policy document's
        clarity?
      hint: null
      type: text
      options: []
      required: true
