inputSchema:
  type: object
  properties:
    title: Event Banner Feedback Survey
    pages:
    - id: 1
      name: event_signage_questions
      label: Event Signage
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: event_signage_rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: event_signage_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: event_signage_opinion
      label: Opinion
      hint: null
      type: select_one
      options:
      - Event Team
      - Sponsors
      - Venue
      required: false
    - id: 5
      name: event_signage_suggestions
      label: Suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: event_signage_agreement
      label: Agreement
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: event_signage_dont_know
      label: dont_know
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
