inputSchema:
  type: object
  properties:
    title: Agency Collaboration Feedback
    pages:
    - id: 1
      name: project_info
      label: -- Project Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client name
      hint: Organization or person contracting the agency
      type: text
      options: []
      required: true
    - id: 3
      name: agency_name
      label: Agency name
      hint: Name of the external agency
      type: text
      options: []
      required: true
    - id: 4
      name: project_duration
      label: Project duration
      hint: Dates or timeframe of engagement
      type: text
      options: []
      required: false
    - id: 5
      name: communication_quality
      label: Communication quality
      hint: Rate clarity and responsiveness
      type: select_one
      options: [Excellent, Good, Fair, Poor]
      required: true
    - id: 6
      name: deliverables_quality
      label: Quality of deliverables
      hint: Rate overall deliverable quality
      type: select_one
      options: [Excellent, Good, Fair, Poor]
      required: true
    - id: 7
      name: adherence_to_deadlines
      label: Adherence to deadlines
      hint: Did the agency meet agreed deadlines
      type: select_one
      options: [Always, Mostly, Sometimes, Rarely]
      required: true
    - id: 8
      name: value_for_money
      label: Value for money
      hint: Rate cost effectiveness
      type: select_one
      options: [Excellent, Good, Fair, Poor]
      required: true
    - id: 9
      name: suggestions
      label: Suggestions for improvement
      hint: Practical suggestions for better collaboration
      type: text
      options: []
      required: false
    - id: 10
      name: overall_experience
      label: Overall experience rating
      hint: Final rating for the engagement
      type: select_one
      options: [Highly recommended, Recommended, Neutral, Not recommended]
      required: true
