inputSchema:
  type: object
  properties:
    title: Background Check Service Feedback Survey
    pages:
      - id: 1
        name: client_name
        label: Client name
        hint: Optional
        type: text
        options: []
        required: false
      - id: 2
        name: service_date
        label: Date of service
        hint: When service was provided
        type: date
        options: []
        required: false
      - id: 3
        name: satisfaction_rating
        label: Satisfaction rating
        hint: 1 low to 5 high
        type: select_one
        options: [1, 2, 3, 4, 5]
        required: true
      - id: 4
        name: turnaround_time
        label: Turnaround time satisfaction
        hint: Speed of report delivery
        type: select_one
        options: [Poor, Fair, Good, Excellent]
        required: false
      - id: 5
        name: accuracy_of_results
        label: Accuracy of results
        hint: Confidence in checks performed
        type: select_one
        options: [Poor, Fair, Good, Excellent]
        required: false
      - id: 6
        name: communication
        label: Communication quality
        hint: Clarity responsiveness professionalism
        type: select_one
        options: [Poor, Fair, Good, Excellent]
        required: false
      - id: 7
        name: recommend_service
        label: Would you recommend this service
        hint: Recommend to colleagues
        type: select_one
        options: [Yes, No]
        required: true
      - id: 8
        name: improvement_suggestions
        label: Suggestions for improvement
        hint: How can service be better
        type: text
        options: []
        required: false
      - id: 9
        name: follow_up_permission
        label: Permission to follow up
        hint: May we contact you about your feedback
        type: select_one
        options: [Yes, No]
        required: false
      - id: 10
        name: additional_comments
        label: Additional comments
        hint: Any other feedback
        type: text
        options: []
        required: false
