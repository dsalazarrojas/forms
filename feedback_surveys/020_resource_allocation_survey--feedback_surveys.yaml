inputSchema:
  type: object
  properties:
    title: Resource Allocation Survey
    pages:
    - id: 1
      name: resources_access
      label: How many resources do you currently have access to?
      hint: null
      type: select_one
      options:
      - 1-5
      - 6-10
      - 11-15
      - More than 15
      required: false
    - id: 2
      name: hours_available
      label: How many hours do you have available per week?
      hint: null
      type: select_one
      options:
      - Less than 10 hours
      - 10-20 hours
      - 21-30 hours
      - More than 30 hours
      required: false
    - id: 3
      name: resource_distribution
      label: Do you think resource distribution is working well?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Undecided
      required: false
    - id: 4
      name: resource_availability
      label: Can you access all necessary resources?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: additional_resources
      label: Are there any additional resources you'd like to request?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: role
      label: What is your role in the organization?
      hint: null
      type: select_one
      options:
      - Team leader
      - Team member
      - Other
      required: false
    - id: 7
      name: thoughts_on_resource_distribution
      label: What are your thoughts on resource distribution?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: available_hours_use
      label: How do you currently use your available hours?
      hint: null
      type: select_one
      options:
      - Working on core tasks
      - Collaborating with team members
      - Learning/Professional development
      - Other
      required: false
    - id: 9
      name: skills_to_perform_job
      label: Do you feel you have the necessary skills to perform your job?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: resource_accessing_challenges
      label: What are some challenges you face when accessing resources?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: improve_resource_distribution
      label: How do you think resource distribution could be improved?
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: additional_comments
      label: Are there any other comments or suggestions you'd like to share?
      hint: null
      type: note
      options: []
      required: false
