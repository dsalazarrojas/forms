inputSchema:
  type: object
  properties:
    title: Inquest Session Feedback Survey
    pages:
    - id: 1
      name: participant_feedback
      label: How do you feel about this session
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: participant_experience
      label: How would you rate your overall experience in this session
      hint: null
      type: number
      options: []
      required: true
