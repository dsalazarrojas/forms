      name: inquest_session
      label: What did you think about the inquest session
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: facilitator_performance
      label: How would you rate the facilitator
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not at all
      required: true
    - id: 5
      name: inquest_session_value
      label: What would you value about this inquest session
      hint: null
