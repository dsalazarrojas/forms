inputSchema:
  type: object
  properties:
    title: Expense Categorization Insight Survey
    pages:
    - id: 1
      name: expense_categorization
      label: How do you currently categorize expenses?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 2
      name: review_process
      label: Can you walk us through your review process?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: category_improvement
      label: What do you think is the current state of our category system?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: category_improvement_ideas
      label: What ideas do you have to improve the category system?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: expense_type
      label: What types of expenses are you currently categorizing under "Expenses"?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: expense_ideas
      label: How can we simplify the categorization of expenses?
      hint: null
      type: text
      options: []
      required: false
