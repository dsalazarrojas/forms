title: Email design questionnaire
description: Generate a Email design questionnaire survey for the "Feedback surveys" category. Use the template name: "Email design questionnaire template".
questions:
  - text: Overall, how satisfied are you with email design questionnaire?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Email, Design, Questionnaire, Feedback]
  - text: How often do you interact with email design questionnaire?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
