inputSchema:
  type: object
  properties:
    title: Divorce And Separation Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: how_long_have_you_and_your_spouse_been_married
      label: how_long_have_you_and_your_spouse_been_married
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: how_many_years_would_you_estimate_you_have_been_in_a_toxic_environment
      label: years_in_toxic_environment
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: what_type_of_toxic_environment
      label: toxic_environment_type
      hint: null
      type: select_one
      options:
      - Abusive
      - Emotionally neglective
      - Emotionally and Physically Abusive
      - Physically Abusive
      - Narcissistic
      - Gaslighting
      - Financial Abusive
      - Emotional Blackmail
      - Parental Alienation
      - Other
      required: true
    - id: 5
      name: what_was_the_most_difficult_part_of_your_marriage
      label: most_difficult_part
      hint: null
      type: text
      options: []
      required: false
