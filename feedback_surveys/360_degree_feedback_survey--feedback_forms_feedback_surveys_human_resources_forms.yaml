inputSchema:
  type: object
  properties:
    title: 360 Degree Feedback Survey
    pages:
    - id: 1
      name: section_header_employee_info
      label: '--- Employee Information ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: Used for survey summary only
      type: email
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: e.g., Marketing, Finance
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job title
      hint: e.g., Senior Analyst
      type: text
      options: []
      required: true
    - id: 6
      name: hire_date
      label: Date of hire
      hint: yyyy-mm-dd
      type: date
      options: []
      required: false
    - id: 7
      name: years_employed
      label: Years at organization
      hint: Approximate number of full years
      type: integer
      options: []
      required: false
    - id: 8
      name: survey_date
      label: Survey date
      hint: The date you complete this survey
      type: date
      options: []
      required: true
