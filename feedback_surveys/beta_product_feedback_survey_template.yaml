description: Help us improve the beta product with your valuable feedback.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with your experience using the beta product?
  type: single
- options:
  - Core functionality
  - User interface/Design
  - Performance/Speed
  - Integration with other tools
  - Help/Documentation
  - Customer support
  text: Which features or aspects of the product did you use or interact with? (select
    all that apply)
  type: multiple
- options:
  - Very likely
  - Somewhat likely
  - Neutral
  - Not very likely
  - Not at all likely
  text: How likely are you to recommend this beta product to a colleague?
  type: single
- text: What is the single most important thing you would improve or change in the
    product?
  type: text
- text: Do you have any additional comments or feedback?
  type: text
title: Beta product feedback survey
