description: Gather feedback on professional development experiences to enhance future
  programs.
questions:
- options:
  - Very satisfied
  - Satisfied
  - Neutral
  - Dissatisfied
  - Very dissatisfied
  text: How satisfied are you with the professional development opportunities provided?
  type: single
- options:
  - Regularly
  - Often
  - Occasionally
  - Rarely
  - Never
  text: How often do you participate in professional development activities?
  type: single
- options:
  - Improved skills
  - Enhanced knowledge
  - Career advancement
  - Networking
  - Increased motivation
  - No significant benefit
  text: Which of the following benefits have you gained from professional development?
    (select all that apply)
  type: multiple
- options:
  - Workshops
  - Online courses
  - Mentorship
  - Conferences
  - Self-study
  text: What formats for professional development do you prefer? (select all that
    apply)
  type: multiple
- options:
  - Lack of time
  - Cost
  - Relevance
  - Awareness
  - Management support
  text: What are the main barriers preventing your participation in professional development?
    (select all that apply)
  type: multiple
- text: What specific improvements would you suggest for future professional development
    programs?
  type: text
- text: Do you have any additional comments or suggestions regarding professional
    development?
  type: text
title: Professional development feedback survey
