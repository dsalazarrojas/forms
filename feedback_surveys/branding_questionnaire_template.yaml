description: A survey to collect feedback on our brand's perception and effectiveness.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with our current brand identity?
  type: single
- options:
  - Modern
  - Trustworthy
  - Innovative
  - Approachable
  - Professional
  - Unique
  text: Which of the following best describe your perception of our brand? (select
    all that apply)
  type: multiple
- options:
  - true
  - false
  - Unsure
  text: How likely are you to recommend our brand to others?
  type: single
- text: What aspects of our brand do you think could be improved or changed?
  type: text
- options:
  - Excitement
  - Trust
  - Innovation
  - Comfort
  - Reliability
  - Inspiration
  text: What emotions or feelings does our brand typically evoke for you? (select
    all that apply)
  type: multiple
- text: Do you have any additional comments or feedback regarding our brand?
  type: text
title: Branding questionnaire
