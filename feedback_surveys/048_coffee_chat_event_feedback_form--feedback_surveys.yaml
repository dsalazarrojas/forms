inputSchema:
  type: object
  properties:
    title: Coffee Chat Event Feedback Form
    pages:
    - id: 1
      name: section_attendee_info
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: company
      label: Company or Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: section_event_info
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: section_overall_experience
      label: -- Overall Experience --
      hint: null
      type: note
      options: []
      required: false
