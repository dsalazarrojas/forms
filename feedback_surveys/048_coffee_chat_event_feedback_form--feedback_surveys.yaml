      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      required: true
    - id: 13
      name: duration_appropriateness
      label: Event Duration Was Appropriate
      hint: null
      type: select_one
      options:
      - Too short
      - Just right
      - Too long
