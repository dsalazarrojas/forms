inputSchema:
  type: object
  properties:
    title: Disability Friendly Community Survey
    pages:
    - id: 1
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: access_needs
      label: What type of accessibility needs do you have in this city or community?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 3
      name: access_barriers
      label: Are there any barriers that prevent you from accessing community facilities
        or services?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: access_challenges
      label: What challenges have you experienced or do you expect when accessing
        community facilities or services?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: ideas_for_improvement
      label: Do you have any ideas for improving accessibility in our city or community?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: community_facilities_services
      label: Which facilities or services do you use in our city or community?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 7
      name: access_experience
      label: What is your experience with accessibility in our city or community?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: feedback
      label: Do you have any other comments or feedback for us?
      hint: null
      type: text
      options: []
      required: false
