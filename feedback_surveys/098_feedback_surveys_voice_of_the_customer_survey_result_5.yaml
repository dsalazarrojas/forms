title: Voice of the customer survey
description: Generate a Voice of the customer survey survey for the "Feedback surveys" category. Use the template name: "Voice of the customer survey template".
questions:
  - text: Overall, how satisfied are you with voice of the customer survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Voice, The, Customer, Survey]
  - text: How often do you interact with voice of the customer survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
