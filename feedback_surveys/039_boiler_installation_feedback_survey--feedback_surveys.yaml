inputSchema:
  type: object
  properties:
    title: Boiler Installation Feedback Survey
    pages:
    - id: 1
      name: customer_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: installation_date
      label: Date of Installation
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: boiler_manufacturer
      label: Boiler Manufacturer
      hint: Brand of boiler installed
      type: text
      options: []
      required: true
    - id: 6
      name: boiler_model
      label: Boiler Model
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: installation_company
      label: Installation Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: technician_name
      label: Technician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: installation_type
      label: Type of Installation
      hint: null
      type: select_one
      options:
      - New Installation
      - Replacement Installation
      - Upgrade Installation
      - Repair
      required: true
    - id: 10
      name: boiler_location
      label: Boiler Location
      hint: null
      type: select_one
      options:
      - Basement
      - Kitchen
      - Utility Room
      - Loft
      - Garage
      - Outside
      - Other
      required: true
    - id: 11
      name: on_time_arrival
      label: Technician On-Time Arrival
      hint: null
      type: select_one
      options:
      - Early
      - On Time
      - Slightly Late
      - Significantly Late
      - Very Late
      required: true
    - id: 12
      name: technician_professionalism
      label: Technician Professionalism
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 13
      name: technician_expertise
      label: Technician Expertise and Knowledge
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 14
      name: installation_neatness
      label: Neatness of Installation Work
      hint: Cleanup and organization
      type: select_one
      options:
      - Excellent - Very Clean
      - Good - Reasonably Clean
      - Fair - Some Mess
      - Poor - Very Messy
      required: true
    - id: 15
      name: installation_quality
      label: Quality of Installation
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: installation_timeline
      label: Installation Completed on Schedule
      hint: null
      type: select_one
      options:
      - Completed Early
      - Completed On Schedule
      - Slightly Behind Schedule
      - Significantly Behind Schedule
      required: true
    - id: 17
      name: instructions_clarity
      label: Clarity of Operating Instructions
      hint: null
      type: select_one
      options:
      - Very Clear
      - Clear
      - Somewhat Clear
      - Unclear
      - Not Provided
      required: true
    - id: 18
      name: warranty_explanation
      label: Warranty Explained Clearly
      hint: null
      type: select_one
      options:
      - Yes - Very Clear
      - Yes - Mostly Clear
      - Somewhat Clear
      - No - Not Clear
      - Not Explained
      required: true
    - id: 19
      name: safety_inspection
      label: Safety Inspection Completed
      hint: null
      type: select_one
      options:
      - Yes - Complete
      - Yes - Partial
      - 'False'
      - Not Sure
      required: true
    - id: 20
      name: boiler_functionality
      label: Boiler Functioning Properly
      hint: Since installation
      type: select_one
      options:
      - Yes - Excellent
      - Yes - Good
      - Yes - Acceptable
      - No - Issues Present
      - Too Soon to Tell
      required: true
    - id: 21
      name: energy_efficiency
      label: Boiler Energy Efficiency
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Cannot Assess Yet
      required: true
    - id: 22
      name: value_for_money
      label: Value for Money
      hint: Reasonable pricing
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Fair Value
      - Poor Value
      - Overpriced
      required: true
    - id: 23
      name: would_recommend
      label: Would You Recommend This Company
      hint: null
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Maybe
      - Probably No
      - Definitely No
      required: true
    - id: 24
      name: improvements_feedback
      label: Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
