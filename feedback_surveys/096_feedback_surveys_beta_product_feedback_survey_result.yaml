title: Beta product feedback survey
description: Generate a Beta product feedback survey survey for the "Feedback surveys" category. Use the template name: "Beta product feedback survey template".
questions:
  - text: Overall, how satisfied are you with beta product feedback survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Beta, Product, Feedback, Survey]
  - text: How often do you interact with beta product feedback survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
