inputSchema:
  type: object
  properties:
    title: Player Experience Feedback Survey
    pages:
    - id: 1
      name: game_experience
      label: Game Experience
      hint: null
      type: select_one
      options:
      - Very Positive
      - Positive
      - Neutral
      - Negative
      - Very Negative
      required: false
    - id: 2
      name: playtested_games
      label: Have you played our game?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 3
      name: suggestions
      label: Do you have any suggestions for our team?
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: satisfaction
      label: How satisfied are you with our game?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 5
      name: feedback
      label: What did you like or dislike about our game?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_info
      label: What is your email address or phone number?
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: favorite_features
      label: What are your favorite features of our game?
      hint: null
      type: select_multiple
      options:
      - Graphics
      - Music
      - Story
      - Gameplay
      required: false
    - id: 8
      name: improvement_suggestions
      label: What would you like to see improved in our game?
      hint: null
      type: text
      options: []
      required: false
