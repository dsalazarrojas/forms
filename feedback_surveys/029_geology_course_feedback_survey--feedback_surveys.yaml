inputSchema:
  type: object
  properties:
    title: Geology Course Feedback Survey
    pages:
    - id: 1
      name: survey_rating
      label: Survey Rating
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: instructor_evaluation
      label: Instructor Evaluation
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_suggestion
      label: Student Suggestion
      hint: Any comments or ideas for improvement?
      type: text
      options: []
      required: false
    - id: 4
      name: course_feedback
      label: Course Feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: rating_instructor
      label: Rating (1-5)
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 6
      name: rating_materials
      label: Materials
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 7
      name: rating_instructor_help
      label: Instructor Help
      hint: null
      type: select_one
      options:
      - Very Helpful
      - Somewhat Helpful
      - Not Helpful
      required: false
    - id: 8
      name: rating_clarity
      label: Clarity
      hint: null
      type: select_one
      options:
      - Very Clear
      - Somewhat Clear
      - Not Clear
      required: false
    - id: 9
      name: rating_interest
      label: Interest
      hint: null
      type: select_one
      options:
      - Very Interesting
      - Somewhat Interesting
      - Not Interesting
      required: false
    - id: 10
      name: rating_value
      label: Value
      hint: null
      type: select_one
      options:
      - Very Valuable
      - Somewhat Valuable
      - Not Valuable
      required: false
    - id: 11
      name: rating_relevance
      label: Relevance
      hint: null
      type: select_one
      options:
      - Very Relevant
      - Somewhat Relevant
      - Not Relevant
      required: false
    - id: 12
      name: rating_difficulty
      label: Difficulty
      hint: null
      type: select_one
      options:
      - Very Difficult
      - Somewhat Difficult
      - Not Difficult
      required: false
    - id: 13
      name: rating_satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: false
    - id: 14
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 15
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: name
      label: Name
      hint: Student Name
      type: text
      options: []
      required: false
    - id: 17
      name: department_name
      label: Department
      hint: Student Department (optional)
      type: text
      options: []
      required: false
