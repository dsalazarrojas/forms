inputSchema:
  type: object
  properties:
    title: Payroll Helpdesk Experience Survey
    pages:
    - id: 1
      name: response_time
      label: How long it takes for your request to be responded to?
      hint: null
      type: time
      options: []
      required: false
    - id: 2
      name: professionalism
      label: How professional were the staff you interacted with?
      hint: null
      type: select_one
      options:
      - Extremely Professional
      - Somewhat Professional
      - Not Very Professional
      - Not at All Professional
      required: false
    - id: 3
      name: issue_resolution
      label: How well was your issue resolved?
      hint: null
      type: select_one
      options:
      - Fully Resolved
      - Partially Resolved
      - Not Resolved
      - Unknown
      required: false
    - id: 4
      name: additional_comments
      label: Do you have any additional comments or suggestions?
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: assigned_to
      label: Who was assigned to support your request?
      hint: null
      type: select_one
      options:
      - HR Team Member
      - Payroll Team Member
      - Unknown
      required: false
    - id: 6
      name: feedback_email
      label: Would you like to provide a feedback email?
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: feedback_phone
      label: Would you like to provide a feedback phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: feedback_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
