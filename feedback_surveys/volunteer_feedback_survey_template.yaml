description: A survey to gather feedback on your volunteer experience with our organization.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with your overall volunteer experience?
  type: single
- options:
  - Weekly
  - Bi-weekly
  - Monthly
  - A few times a year
  - Once a year or less
  text: How often do you typically participate in volunteer activities?
  type: single
- options:
  - Rewarding
  - Well-organized
  - Impactful
  - Challenging
  - Underutilized skills
  - Good support
  text: Which of the following best describe your volunteer experience? (Select all
    that apply)
  type: multiple
- text: What improvements would you suggest for our volunteer program or specific
    activities?
  type: text
- text: Do you have any additional comments or feedback?
  type: text
title: Volunteer feedback survey
