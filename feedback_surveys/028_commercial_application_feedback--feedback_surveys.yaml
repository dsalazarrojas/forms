inputSchema:
  type: object
  properties:
    title: Commercial Application Feedback
    pages:
      - id: 1
        name: user_name
        label: Your Name
        hint: Full name - optional
        type: text
        options: []
        required: false
      - id: 2
        name: user_email
        label: Email Address
        hint: For follow-up on your feedback
        type: email
        options: []
        required: true
      - id: 3
        name: company_name
        label: Company Name
        hint: Your organization
        type: text
        options: []
        required: false
      - id: 4
        name: job_role
        label: Job Role
        hint: Your position or role
        type: select_one
        options:
          - End User
          - Manager
          - Administrator
          - IT Professional
          - Developer
          - Executive
          - Other
        required: true
      - id: 5
        name: usage_duration
        label: How Long Have You Used the Application
        hint: Duration of use
        type: select_one
        options:
          - Less than 1 month
          - 1-3 months
          - 3-6 months
          - 6-12 months
          - 1-2 years
          - 2+ years
        required: true
      - id: 6
        name: section_header_satisfaction
        label: -- Satisfaction Ratings --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall satisfaction
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 8
        name: ease_of_use
        label: Ease of Use
        hint: How easy is the application to use
        type: select_one
        options:
          - Very Easy
          - Easy
          - Neutral
          - Difficult
          - Very Difficult
        required: true
      - id: 9
        name: performance
        label: Performance
        hint: Rate the application performance
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 10
        name: reliability
        label: Reliability
        hint: How reliable is the application
        type: select_one
        options:
          - Very Reliable
          - Reliable
          - Neutral
          - Unreliable
          - Very Unreliable
        required: true
      - id: 11
        name: section_header_features
        label: -- Feature Feedback --
        hint: null
        type: note
        options: []
        required: false
      - id: 12
        name: most_used_features
