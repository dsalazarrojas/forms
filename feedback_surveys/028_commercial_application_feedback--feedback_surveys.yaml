        hint: null
        type: note
        options: []
        required: false
      - id: 21
        name: documentation_quality
        label: Documentation Quality
        hint: Rate the help documentation
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
        required: true
      - id: 22
        name: support_responsiveness
        label: Support Responsiveness
        hint: Rate customer support
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Below Average
          - Poor
          - Not Used
        required: true
      - id: 23
        name: section_header_recommendation
        label: -- Recommendation --
        hint: null
        type: note
        options: []
        required: false
