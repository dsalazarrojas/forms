description: Help us gather key insights for your success story.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with our product/service overall?
  type: single
- options:
  - Inefficiency
  - High costs
  - Limited functionality
  - Data silos
  - No specific challenge
  text: What primary challenge were you facing before using our solution?
  type: single
- options:
  - Ease of use
  - Performance
  - Customer support
  - Integration capabilities
  - Reporting & analytics
  text: Which of our features or aspects have been most impactful for you? (select
    all that apply)
  type: multiple
- text: What measurable results or improvements have you achieved?
  type: text
- options:
  - Very likely
  - Likely
  - Neutral
  - Unlikely
  - Very unlikely
  text: How likely are you to recommend our product/service to others?
  type: single
- text: Would you like to share a quote or testimonial for your success story?
  type: text
title: Customer success story questionnaire
