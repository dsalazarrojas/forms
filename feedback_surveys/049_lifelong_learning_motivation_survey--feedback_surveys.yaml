inputSchema:
  type: object
  properties:
    title: Lifelong Learning Motivation Survey
    pages:
    - id: 1
      name: page_1
      label: What motivates you to learn new things
      hint: null
      type: select_multiple
      options:
      - Always
      - Often
      - Rarely
      - Never
      required: true
    - id: 2
      name: page_2
      label: What are the top 3 things that motivate you to learn new things
      hint: null
      type: select_multiple
      options:
      - Curiosity
      - Personal growth
      - Financial gain
      - Social responsibility
      - Other
      required: false
    - id: 3
      name: page_3
      label: How important is learning new things
      hint: null
      type: select_one
      options:
      - Very important
      - Somewhat important
      - Not very important
      - Not at all important
      required: true
    - id: 4
      name: page_4
      label: What is your current level of motivation
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: page_5
      label: What holds you back from learning new things
      hint: null
      type: select_multiple
      options:
      - Lack of time
      - Fear of failure
      - Lack of resources
      - Other
      required: false
    - id: 6
      name: page_6
      label: How do you feel about learning new things
      hint: null
      type: select_multiple
      options:
      - Excited
      - Neutral
      - Anxious
      - Bored
      required: false
    - id: 7
      name: page_7
      label: What motivates you the most
      hint: null
      type: select_one
      options:
      - Curiosity
      - Personal growth
      - Financial gain
      - Social responsibility
      - Other
      required: false
    - id: 8
      name: page_8
      label: How do you feel about challenges when learning new things
      hint: null
      type: select_multiple
      options:
      - Encouraged
      - Neutral
      - Discouraged
      - Frustrated
      required: false
    - id: 9
      name: page_9
      label: Page 9
      hint: null
      type: select_one
      options:
      - Curiosity
      - Personal growth
      - Financial gain
      - Social responsibility
      - Other
      required: false
    - id: 10
      name: page_10
      label: What do you enjoy learning the most
      hint: null
      type: select_multiple
      options:
      - New skills
      - New knowledge
      - New experiences
      - Other
      required: false
    - id: 11
      name: page_11
      label: How do you feel about time constraints when learning new things
      hint: null
      type: select_multiple
      options:
      - Flexible
      - Limited
      - No constraints
      - Other
      required: false
    - id: 12
      name: page_12
      label: What is your motivation level (on a scale of 1-10)
      hint: null
      type: number
      options: []
      required: false
