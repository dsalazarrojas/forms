inputSchema:
  type: object
  properties:
    title: Civic Technology Awareness Survey
    pages:
      - id: 1
        name: respondent_name
        label: Full Name
        hint: Optional - for follow-up
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: Optional - for survey results
        type: email
        options: []
        required: false
      - id: 3
        name: age_group
        label: Age Group
        hint: Select your age range
        type: select_one
        options:
          - Under 18
          - 18-24 years
          - 25-34 years
          - 35-44 years
          - 45-54 years
          - 55-64 years
          - 65+ years
        required: true
      - id: 4
        name: education_level
        label: Highest Education Level
        hint: Select your highest completed education
        type: select_one
        options:
          - High school or less
          - Some college
          - Associates degree
          - Bachelors degree
          - Masters degree
          - Doctorate or professional
        required: true
      - id: 5
        name: tech_proficiency
        label: How would you rate your technology proficiency
        hint: Overall comfort with digital tools
        type: select_one
        options:
          - Very proficient
          - Somewhat proficient
          - Neutral
          - Not very proficient
          - Not proficient at all
        required: true
      - id: 6
        name: civic_tech_awareness
        label: How familiar are you with civic technology
        hint: Apps and platforms for civic engagement
        type: select_one
        options:
          - Very familiar
          - Somewhat familiar
          - Heard of it but unsure
          - Never heard of it
        required: true
      - id: 7
        name: civic_tech_tools_known
        label: Which civic technology tools have you used
        hint: Select all that apply
        type: select_multiple
        options:
          - SeeClickFix or similar reporting apps
          - Voter registration platforms
          - Government service portals
          - Civic engagement apps
          - Open data platforms
          - Participatory budgeting tools
          - None of these
          - Other
        required: true
      - id: 8
        name: government_app_usage
        label: How often do you use government apps or websites
        hint: For services or information
        type: select_one
        options:
          - Daily
          - Weekly
          - Monthly
          - Rarely
          - Never
        required: true
      - id: 9
        name: digital_participation
        label: Have you participated in digital civic activities
        hint: Online town halls, digital petitions, etc.
        type: select_one
        options:
          - Yes, frequently
          - Yes, occasionally
          - Once or twice
          - No, but interested
          - No, not interested
        required: true
      - id: 10
        name: trust_government_tech
        label: How much do you trust government technology platforms
        hint: With your data and privacy
        type: select_one
        options:
          - Trust completely
          - Mostly trust
          - Neutral
          - Mostly distrust
          - Completely distrust
        required: true
      - id: 11
        name: privacy_concerns
        label: How concerned are you about privacy with civic apps
        hint: Regarding your personal data
        type: select_one
        options:
          - Very concerned
          - Somewhat concerned
          - Neutral
          - Not very concerned
          - Not concerned at all
        required: true
      - id: 12
        name: accessibility_rating
        label: How accessible are current civic technology tools
        hint: For people with disabilities
        type: select_one
        options:
          - Very accessible
          - Somewhat accessible
          - Neutral
          - Not very accessible
          - Not accessible at all
          - Unsure
        required: true
      - id: 13
        name: digital_divide
        label: Do you think digital divide affects civic participation
        hint: In your community
        type: select_one
        options:
          - Yes, significantly
          - Yes, somewhat
          - Neutral
          - Probably not
          - Definitely not
        required: true
      - id: 14
        name: preferred_channels
        label: How do you prefer to engage with government
        hint: Select your preferred channels
        type: select_multiple
        options:
          - Mobile apps
          - Websites
          - Email
          - Phone calls
          - In-person visits
          - Social media
          - Mail
          - Community meetings
        required: true
      - id: 15
        name: feature_requests
        label: What features would you like in civic technology
        hint: Select all that interest you
        type: select_multiple
        options:
          - Issue reporting with photos
          - Real-time status updates
          - Voting and elections info
          - Budget transparency
          - Meeting notifications
          - Direct messaging with officials
          - Community forums
          - Multilingual support
        required: false
      - id: 16
        name: training_interest
        label: Would you benefit from civic tech training
        hint: Workshops on using digital civic tools
        type: select_one
        options:
          - Very interested
          - Somewhat interested
          - Neutral
          - Not very interested
          - Not interested
        required: true
      - id: 17
        name: recommendation_likelihood
        label: How likely are you to recommend civic tech tools
        hint: To friends or family
        type: select_one
        options:
          - Very likely
          - Somewhat likely
          - Neutral
          - Not very likely
          - Not likely at all
        required: true
      - id: 18
        name: additional_feedback
        label: Additional Feedback or Suggestions
        hint: How can civic technology be improved
        type: text
        options: []
        required: false
