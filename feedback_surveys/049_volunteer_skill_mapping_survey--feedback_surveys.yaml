inputSchema:
  type: object
  properties:
    title: Volunteer Skill Mapping Survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: volunteer_role
      label: Volunteer Role
      hint: null
      type: select_one
      options:
      - Volunteer
      - Non-Volunteer
      required: true
    - id: 5
      name: skills_list
      label: What skills do you have?
      hint: null
      type: select_multiple
      options:
      - Leadership
      - Communication
      - Team Management
      - Time Management
      - Problem Solving
      - Organization
      - Public Speaking
      - Project Management
      - Event Planning
      - Data Analysis
      - Financial Management
      - Fundraising
      - Grant Writing
      - Marketing
      - Social Media
      - Volunteering
      - Grant Research
      - Community Outreach
      - Grant Management
      - Budgeting
      - Reporting
      - Research
      - Writing
      required: true
    - id: 6
      name: availability
      label: Availability
      hint: null
      type: select_one
      options:
      - Full-Time
      - Part-Time
      - On-Demand
      required: true
    - id: 7
      name: volunteer_suggestions
      label: Do you have any suggestions or ideas for future surveys?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: consent
      label: Consent
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
