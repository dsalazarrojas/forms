inputSchema:
  type: object
  properties:
    title: Children Storytelling Survey
    pages:
    - id: 1
      name: respondent_name
      label: Respondent Name
      hint: Optional name of child or parent
      type: text
      options: []
      required: false
    - id: 2
      name: age_group
      label: Age Group
      hint: Choose age bracket
      type: select_one
      options:
      - 3 to 5
      - 6 to 8
      - 9 to 11
      required: true
    - id: 3
      name: favorite_genre
      label: Favorite Genre
      hint: Which story genre did you like most
      type: select_one
      options:
      - Fantasy
      - Adventure
      - Humor
      - Educational
      required: true
    - id: 4
      name: participation_enjoyment
      label: Did you enjoy the storytelling session
      hint: Rate your enjoyment
      type: select_one
      options:
      - Loved it
      - Liked it
      - It was okay
      - Did not like it
      required: true
    - id: 5
      name: suggestions
      label: Suggestions for Improvement
      hint: What would make future sessions better
      type: text
      options: []
      required: false
    - id: 6
      name: recommend_to_friend
      label: Would you recommend this to a friend
      hint: Select yes or no
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
