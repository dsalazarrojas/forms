      label: Rate The Appearance
      hint: On a scale of 1-5, rate the appearance of the grilled wing
      type: number
      options: []
      required: false
    - id: 5
      name: rating_service
      label: Rate The Service
      hint: On a scale of 1-5, rate the service you received
      type: number
      options: []
      required: false
    - id: 6
      name: recommendation_taste
      label: Recommend For Taste
      hint: Would you recommend this product for its taste?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 7
      name: recommendation_quality
      label: Recommend For Quality
      hint: Would you recommend this product for its quality?
      type: select_one
