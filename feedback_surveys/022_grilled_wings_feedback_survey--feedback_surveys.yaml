inputSchema:
  type: object
  properties:
    title: Grilled Wings Feedback Survey
    pages:
    - id: 1
      name: grilled_wings_feedback_1
      label: Grilled Wings Feedback Form 1
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating_taste
      label: Rate The Taste
      hint: On a scale of 1-5, rate the taste of the grilled wing
      type: number
      options: []
      required: false
    - id: 3
      name: rating_quality
      label: Rate The Quality
      hint: On a scale of 1-5, rate the quality of the grilled wing
      type: number
      options: []
      required: false
    - id: 4
