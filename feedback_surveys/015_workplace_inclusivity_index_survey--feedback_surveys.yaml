inputSchema:
  type: object
  properties:
    title: Workplace Inclusivity Index Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: workplace_culture
      label: Workplace Culture
      hint: null
      type: select_one
      options:
      - Diverse and Inclusive
      - Not Diverse and Inclusive
      required: false
    - id: 3
      name: leadership_support
      label: Leadership Support
      hint: Select all that apply
      type: select_multiple
      options:
      - Provide clear goals and objectives
      - Foster open and honest communication
      - Encourage diversity and inclusion
      - Recognize and reward diverse behaviors
      required: false
    - id: 4
      name: workplace_climate
      label: Workplace Climate
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      required: false
    - id: 5
      name: inclusivity_index
      label: Inclusivity Index
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: demographic_data
      label: Demographic Data
      hint: null
      type: select_multiple
      options:
      - Age
      - Sex/Gender
      - Ethnicity
      - Disability Status
      required: false
    - id: 7
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submit_form
      label: Submit
      hint: null
      type: text
      options: []
      required: false
