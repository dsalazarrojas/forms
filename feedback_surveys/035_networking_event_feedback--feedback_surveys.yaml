inputSchema:
  type: object
  properties:
    title: Networking Event Feedback
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: connection_outcomes
      label: What were the positive connections you made at this event?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: event_outcomes
      label: What outcome(s) do you attribute to this event?
      hint: null
      type: select_multiple
      options:
      - Connection to a potential business partner
      - Connection to an existing business contact
      - Other
      required: false
    - id: 5
      name: event_satisfaction
      label: How satisfied were you with this event?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 6
      name: suggest_improvements
      label: Any suggestions to improve this event?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: feedback
      label: Any additional feedback about your experience at this event?
      hint: null
      type: text
      options: []
      required: false
