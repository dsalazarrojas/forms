inputSchema:
  type: object
  properties:
    title: Wealth Club Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: What do you think about our service?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: satisfaction
      label: How satisfied are you with our service?
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: suggestion
      label: Do you have any suggestions to improve our service?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: referral_intent
      label: Are you likely to refer us to others?
      hint: null
      type: select_multiple
      options:
      - Very likely
      - Somewhat likely
      - Not very likely
      - Not at all likely
      required: false
    - id: 5
      name: improvement
      label: What would you like to see improved in our service?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: rating_1
      label: Rate this item 1/5
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: rating_2
      label: Rate this item 2/5
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: rating_3
      label: Rate this item 3/5
      hint: null
      type: number
      options: []
      required: false
