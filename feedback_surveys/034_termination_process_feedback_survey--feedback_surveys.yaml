      - '{''id'': 2, ''text'': ''1 week - 2 weeks''}'
      - '{''id'': 3, ''text'': ''2 - 6 weeks''}'
      - '{''id'': 4, ''text'': ''More than 6 weeks''}'
      required: false
    - id: 5
      name: notice_date
      label: Notice Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: termination_date
      label: Termination Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: notice_period_length
      label: Notice Period Length
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: reason_for_leaving_other
      label: Reason for Leaving Other
