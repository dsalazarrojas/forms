      type: text
      options: []
      required: false
    - id: 9
      name: manager_comments
      label: Manager Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: employee_comments
      label: Employee Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: termination_method
      label: Termination Method
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''text'': ''Voluntary''}'
      - '{''id'': 2, ''text'': ''Involuntary''}'
      required: false
    - id: 12
      name: prophets
      label: Prophets
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: managers
      label: Managers
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''text'': ''Manager 1''}'
