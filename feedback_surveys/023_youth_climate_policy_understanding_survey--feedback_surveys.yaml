inputSchema:
  type: object
  properties:
    title: youth_climate_policy_understanding_survey
    pages:
    - id: 1
      name: climate_change_introduction
      label: Introduction
      hint: This is the introduction to the survey
      type: note
      options: []
      required: false
    - id: 2
      name: climate_changeawareness
      label: Climate Change Awareness
      hint: How aware are you of climate change?
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 3
      name: climate_policies
      label: Climate Policies
      hint: What are your opinions on climate policies?
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      required: false
    - id: 4
      name: policy_ideas
      label: Policy Ideas
      hint: Do you have any ideas for climate policies?
      type: text
      options: []
      required: false
    - id: 5
      name: demographic_info
      label: Demographic Information
      hint: Please provide your demographic information
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 6
      name: age_range
      label: Age Range
      hint: What is your age range?
      type: number
      options: []
      required: true
    - id: 7
      name: education_level
      label: Education Level
      hint: What is your education level?
      type: number
      options: []
      required: true
    - id: 8
      name: region_range
      label: Region
      hint: Which region do you live in?
      type: text
      options: []
      required: true
    - id: 9
      name: language
      label: Language
      hint: What language do you prefer to communicate?
      type: text
      options: []
      required: true
    - id: 10
      name: contact_number
      label: Contact Number
      hint: Please provide your contact number
      type: text
      options: []
      required: true
    - id: 11
      name: submission
      label: Submission
      hint: Please submit your feedback
      type: select_one
      options:
      - Option 1
      - Option 2
      required: true
    - id: 12
      name: comments
      label: Comments
      hint: Do you have any comments or feedback?
      type: text
      options: []
      required: false
    - id: 13
      name: other_comments
      label: Other Comments
      hint: Do you have any other comments or feedback?
      type: text
      options: []
      required: false
    - id: 14
      name: email
      label: Email
      hint: Please provide your email
      type: email
      options: []
      required: true
