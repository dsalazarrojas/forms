        name: section_header_3
        label: -- Impact Assessment --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: overall_impact
        label: Overall Impact of Delegation
        hint: Rate the overall impact
        type: select_one
        options:
          - Highly Positive
          - Positive
          - Neutral
          - Negative
          - Highly Negative
        required: true
      - id: 12
        name: skills_development
        label: Skills Development Impact
        hint: How has delegation affected skills?
        type: select_one
        options:
          - Significant improvement
          - Moderate improvement
          - Slight improvement
          - No change
          - Slight decline
          - Significant decline
        required: true
      - id: 13
        name: economic_impact
        label: Economic Impact on Artisans
        hint: How has delegation affected income or economic status?
        type: select_one
        options:
          - Significant increase
          - Moderate increase
          - Slight increase
          - No change
          - Slight decrease
          - Significant decrease
        required: true
