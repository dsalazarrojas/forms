inputSchema:
  type: object
  properties:
    title: Artisan Delegation Impact Survey
    pages:
      - id: 1
        name: section_header_1
        label: -- Respondent Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Your Name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 3
        name: respondent_role
        label: Your Role
        hint: Position within the artisan organization
        type: select_one
        options:
          - Artisan Member
          - Team Leader
          - Coordinator
          - Manager
          - Administrator
          - Other
        required: true
      - id: 4
        name: organization_name
        label: Organization Name
        hint: Name of your artisan network or group
        type: text
        options: []
        required: true
      - id: 5
        name: survey_date
        label: Date of Survey
        hint: When are you completing this survey?
        type: date
        options: []
        required: true
      - id: 6
        name: section_header_2
        label: -- Delegation Program Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: delegation_name
        label: Name or Description of Delegation Project
        hint: What is this delegation initiative called?
        type: text
        options: []
        required: true
      - id: 8
        name: delegation_duration
        label: Duration of Delegation Program
        hint: How long has this delegation been active?
        type: select_one
        options:
          - Less than 3 months
          - 3-6 months
          - 6-12 months
          - 1-2 years
          - Over 2 years
        required: true
      - id: 9
        name: delegation_start_date
        label: Delegation Start Date
        hint: When did this delegation program begin?
        type: date
        options: []
        required: false
