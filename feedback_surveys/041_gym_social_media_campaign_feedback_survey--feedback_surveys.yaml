inputSchema:
  type: object
  properties:
    title: Gym Social Media Campaign Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: What do you know about our social media campaign?
      hint: Please tell us about your current understanding of our social media presence.
      type: note
      options: []
      required: false
    - id: 2
      name: impressions
      label: What are your impressions of our latest social media campaign?
      hint: Be as specific as possible in your description.
      type: text
      options: []
      required: false
    - id: 3
      name: campaign_engagement
      label: Which of the following best describes your experience with our campaign?
      hint: Select all that apply.
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: relevance
      label: How relevant do you think our social media campaign is to our brand?
      hint: Choose one that best fits.
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: liking
      label: How much do you like our social media campaign?
      hint: Choose one that best fits.
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 6
      name: campaign_impressions_2
      label: What are your impressions of our social media campaign?
      hint: Be as specific as possible in your description.
      type: text
      options: []
      required: false
    - id: 7
      name: campaign_engagement_2
      label: Campaign Engagement 2
      hint: Select all that apply.
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 8
      name: email
      label: What is your email address?
      hint: We will only use this for survey follow-ups.
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: What is your phone number?
      hint: Optional, but helpful for follow-ups.
      type: text
      options: []
      required: false
    - id: 10
      name: name
      label: What is your name?
      hint: We will use this for future reference.
      type: text
      options: []
      required: false
    - id: 11
      name: job_title
      label: What is your job title?
      hint: For our records.
      type: text
      options: []
      required: false
    - id: 12
      name: additional_comments
      label: Do you have any additional comments or suggestions?
      hint: We value your input and would love to hear more.
      type: text
      options: []
      required: false
    - id: 13
      name: feedback
      label: What would you like to see more of from our social media campaign?
      hint: Your input will help shape future campaigns.
      type: text
      options: []
      required: false
    - id: 14
      name: feedback_2
      label: Do you have any other comments or suggestions?
      hint: We appreciate your input.
      type: text
      options: []
      required: false
    - id: 15
      name: email_2
