inputSchema:
  type: object
  properties:
    title: Non Payment Information Survey
    pages:
    - id: 1
      name: non_payment_survey
      label: How often do you pay for services online?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: service_quality
      label: What is your experience with our service?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: payment_details
      label: What do you think is the main reason you do not pay?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_details
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Social Media
      required: false
    - id: 5
      name: comments
      label: Any additional comments?
      hint: null
      type: text
      options: []
      required: false
