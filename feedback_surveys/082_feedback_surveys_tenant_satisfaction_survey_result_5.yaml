title: Tenant satisfaction survey
description: Generate a Tenant satisfaction survey survey for the "Feedback surveys" category. Use the template name: "Tenant satisfaction survey template".
questions:
  - text: Overall, how satisfied are you with tenant satisfaction survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Tenant, Satisfaction, Survey, Feedback]
  - text: How often do you interact with tenant satisfaction survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
