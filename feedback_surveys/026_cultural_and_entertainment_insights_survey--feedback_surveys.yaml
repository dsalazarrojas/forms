inputSchema:
  type: object
  properties:
    title: cultural_and_entertainment_insights_survey
    pages:
    - id: 1
      name: demographic_info
      label: Demographic Information
      hint: Please provide your demographic information to help us understand our
        audience.
      type: text
      options: []
      required: true
    - id: 2
      name: event_preferences
      label: Preferred Events
      hint: Select events you're interested in attending in the next 6 months.
      type: select_multiple
      options:
      - Music Festival
      - Theater Performance
      - Art Exhibition
      - Food Festival
      required: true
    - id: 3
      name: feedback
      label: Feedback
      hint: Provide any feedback on our current arts and entertainment offerings.
      type: text
      options: []
      required: false
    - id: 4
      name: arts_venue
      label: Preferred Arts Venue
      hint: Select your preferred arts and entertainment venue.
      type: select_one
      options:
      - Theater
      - Museum
      - Gallery
      - Park
      required: true
    - id: 5
      name: contact_person
      label: Contact Person
      hint: Provide the name of the person to contact for more information.
      type: select_one
      options:
      - Event Organizer
      - Venue Manager
      - Marketing Team
      - Volunteer
      required: false
    - id: 6
      name: contact_info
      label: Contact Information
      hint: Provide your contact information so we can reach out to you.
      type: text
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: Provide any additional comments or suggestions.
      type: text
      options: []
      required: false
