inputSchema:
  type: object
  properties:
    title: Training Satisfaction Indicator Survey
    pages:
    - id: 1
      name: training_survey
      label: Training Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: training_survey_participant_rating
      label: Training Survey Participant Rating
      hint: Please rate your overall experience.
      type: select_one
      options:
      - Highly Satisfied
      - Satisfied
      - Neither Satisfied nor Dissatisfied
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 3
      name: training_survey_comments
      label: Training Survey Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: training_satisfaction_scale
      label: Training Satisfaction Scale
      hint: Select all that apply.
      type: select_multiple
      options:
      - The training session met my expectations
      - The training session exceeded my expectations
      - The training session fell short of my expectations
      - The training session was average
      - I did not attend the training session
      required: true
    - id: 5
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
