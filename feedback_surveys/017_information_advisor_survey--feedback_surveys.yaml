inputSchema:
  type: object
  properties:
    title: Information Advisor Survey
    pages:
    - id: 1
      name: advisor_interaction
      label: What was the prophets advisor interaction like
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: satisfaction
      label: How satisfied were you with your advisor
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: advisor_quality
      label: How good was the advisor quality
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: communication_skills
      label: How would you rate the advisors communication skills
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: feedback
      label: Do you have any additional feedback
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date_time
      label: date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: time
      hint: null
      type: time
      options: []
      required: false
