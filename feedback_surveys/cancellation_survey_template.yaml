description: Gathering feedback on why you're canceling your subscription or service.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied were you with the service/product before deciding to cancel?
  type: single
- options:
  - Daily
  - Weekly
  - Monthly
  - Rarely
  - Never
  text: How often did you use the service/product?
  type: single
- options:
  - Cost too high
  - Missing features
  - Poor service/support
  - Found an alternative
  - Not needed anymore
  - Technical issues
  text: Which of the following best describes your primary reason for canceling? (select
    all that apply)
  type: multiple
- text: What could we improve about the service/product?
  type: text
- text: Do you have any other comments or feedback?
  type: text
title: Cancellation Survey
