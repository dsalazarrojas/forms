- options:
  - Too high
  - Just right
  - Too low
  text: Is the current volume of leads sufficient for your needs?
  type: single
- options:
  - Highly qualified
  - Good fit
  - Engaged
  - Timely
  - Early stage
  - Not relevant
  text: Which characteristics best describe the leads you receive? (select all that
