inputSchema:
  type: object
  properties:
    title: Coupling Expansion Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question1
      label: What is your overall satisfaction with the product?
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: false
    - id: 3
      name: question2
      label: How likely are you to recommend the product?
      hint: null
      type: select_one
      options:
      - Not Likely
      - Somewhat Likely
      - Neutral
      - Very Likely
      required: false
    - id: 4
      name: question3
      label: What is your experience with the product?
      hint: null
      type: select_one
      options:
      - Very Poor
      - Somewhat Poor
      - Neutral
      - Somewhat Good
      - Very Good
      required: false
    - id: 5
      name: note
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: question4
      label: What would you like to see improved?
      hint: null
      type: text
      options: []
      required: false
