inputSchema:
  type: object
  properties:
    title: Home Staging Feedback Survey
    pages:
    - id: 1
      name: property_rating
      label: Property Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: property_rating_scale
      label: Property Rating Scale
      hint: null
      type: select_one
      options:
      - Very Unlikely
      - Neutral
      - Very Likely
      required: false
    - id: 3
      name: property_rating_score
      label: Property Rating Score
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_multiple
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: false
    - id: 5
      name: suggestions
      label: Do you have any suggestions or comments?
      hint: null
      type: note
      options: []
      required: false
