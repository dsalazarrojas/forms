inputSchema:
  type: object
  properties:
    title: Homelessness Stigma Awareness Survey
    pages:
    - id: 1
      name: role
      label: What is your role or position within an organization that interacts with
        homeless individuals or families?
      hint: null
      type: select_one
      options:
      - Service Provider
      - Community Member
      - Homeless Individual
      - Other
      required: true
    - id: 2
      name: comfort
      label: How would you rate your level of comfort in approaching someone on the
        street who is homeless?
      hint: null
      type: select_one
      options:
      - Very comfortable
      - Somewhat comfortable
      - Neutral
      - Somewhat uncomfortable
      - Very uncomfortable
      required: true
    - id: 3
      name: experienced_homelessness
      label: Have you or a family member/friend experienced homelessness in the past?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: causes_homelessness
      label: What is your understanding of what causes homelessness?
      hint: null
      type: select_one
      options:
      - Financial struggles
      - Lack of affordable housing
      - Mental health issues
      - Substance abuse
      - Lack of education/training
      - Other
      required: true
    - id: 5
      name: causes_homelessness_2
      label: Causes Homelessness
      hint: null
      type: select_one
      options:
      - Financial struggles
      - Lack of affordable housing
      - Mental health issues
      - Substance abuse
      - Lack of education/training
      - Other
      required: true
    - id: 6
      name: interaction_frequency
      label: How often do you interact with homeless individuals or families?
      hint: null
      type: select_one
      options:
      - Daily
      - Several times a week
      - Several times a month
      - Rarely
      - Never
      required: true
    - id: 7
      name: services_confidence
      label: On a scale of 1-10, how confident are you in your ability to provide
        effective services to someone experiencing homelessness?
      hint: null
      type: number
      options: []
      required: true
