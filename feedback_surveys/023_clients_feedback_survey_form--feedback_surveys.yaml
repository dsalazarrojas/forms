inputSchema:
  type: object
  properties:
    title: Clients Feedback Survey Form
    pages:
    - id: 1
      name: respondent_section
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: customer_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: relationship_section
      label: -- Relationship --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: customer_type
      label: Type of customer
      hint: null
      type: select_one
      options:
      - New customer
      - Returning customer
      - Long-term customer
      - Occasional customer
      required: true
    - id: 7
      name: relationship_length
      label: How long have you been a customer?
      hint: null
      type: select_one
      options:
      - Less than 1 month
      - 1-6 months
      - 6-12 months
      - 1-3 years
      - More than 3 years
      required: false
    - id: 8
      name: purchase_frequency
      label: Purchase frequency
      hint: null
      type: select_one
      options:
      - First purchase
      - Occasional
      - Regular
      - Frequent
      - Very frequent
      required: false
    - id: 9
      name: experience_section
      label: -- Your Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: product_quality
      label: Quality of products or services
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 11
      name: value_for_money
      label: Value for money
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 12
      name: delivery_speed
      label: Speed of delivery or service
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: false
    - id: 13
      name: customer_service
      label: Quality of customer service
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 14
      name: communication
      label: Communication and responsiveness
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 15
      name: satisfaction_section
      label: -- Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Dissatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 17
      name: expectations_met
      label: Did we meet your expectations?
      hint: null
      type: select_one
      options:
      - Below expectations
      - Met expectations
      - Exceeded expectations
      required: true
    - id: 18
      name: likelihood_recommend
      label: Likelihood to recommend us to others
      hint: Rate 0 to 10
      type: number
      options: []
      required: true
    - id: 19
      name: feedback_section
      label: -- Feedback --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: positive_feedback
      label: What did you like most about us?
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: improvement_areas
      label: What could we improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: additional_comments
      label: Additional comments or suggestions
      hint: Optional
      type: text
      options: []
      required: false
