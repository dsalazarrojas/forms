inputSchema:
  type: object
  properties:
    title: Nail Polish Durability Expectation Survey
    pages:
    - id: 1
      name: main_page
      label: Nail Polish Durability Expectation
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: polish_color
      label: Polish Color
      hint: Select a polish color
      type: select_one
      options:
      - Red
      - Pink
      - Purple
      - Other
      required: false
    - id: 3
      name: wear_time
      label: How long do you wear your nail polish?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: quality_rating
      label: Quality of the nail polish
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 5
      name: durability
      label: How durable do you feel the polish is?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: wear_quality
      label: How does the polish wear on your nails?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
