inputSchema:
  type: object
  properties:
    title: Community Information Exhibition Survey
    pages:
      - id: 1
        name: survey_header
        label: -- Exhibition Feedback --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: attendee_name
        label: Attendee name
        hint: Optional for follow up
        type: text
        options: []
        required: false
      - id: 3
        name: event_date
        label: Event date
        hint: Date of exhibition attended
        type: date
        options: []
        required: true
      - id: 4
        name: satisfaction_overall
        label: Overall satisfaction
        hint: Rate your experience
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
      - id: 5
        name: most_useful_information
        label: Most useful information obtained
        hint: Short description
        type: text
        options: []
        required: false
      - id: 6
        name: clarity_of_presentations
        label: Clarity of presentations
        hint: Rate clarity
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: false
      - id: 7
        name: suggestions
        label: Suggestions for future exhibitions
        hint: Ideas to improve events
        type: text
        options: []
        required: false
      - id: 8
        name: would_recommend
        label: Would recommend to others
        hint: Indicate yes or no
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 9
        name: contact_for_updates
        label: Contact email for updates
        hint: Optional
        type: email
        options: []
        required: false
      - id: 10
        name: consent_for_photos
        label: Consent for use of photos
        hint: Agree to allow photos for reporting
        type: select_one
        options:
          - Yes
          - No
        required: false
