inputSchema:
  type: object
  properties:
    title: Process Effectiveness Evaluation Survey
    pages:
    - id: 1
      name: overall_project_effectiveness
      label: Overall project effectiveness
      hint: How would you rate the overall effectiveness of the project?
      type: number
      options: []
      required: true
    - id: 2
      name: team_name
      label: Team name
      hint: What is the name of the team involved in the project?
      type: text
      options: []
      required: true
    - id: 3
      name: team_members
      label: Team members
      hint: Who were the team members involved in the project?
      type: text
      options: []
      required: true
    - id: 4
      name: process_effectiveness_1
      label: Overall process clarity
      hint: How clear was the project process?
      type: select_multiple
      options:
      - Clear and concise
      - Difficult to understand
      - Somewhat unclear
      - Very unclear
      required: true
    - id: 5
      name: process_effectiveness_2
      label: Overall process efficiency
      hint: How efficient was the project process?
      type: select_multiple
      options:
      - Very efficient
      - Somewhat efficient
      - Not very efficient
      - Not at all efficient
      required: true
    - id: 6
      name: process_effectiveness_3
      label: Communication among team members
      hint: How effective was communication among team members?
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      - Fair
      - Poor
      required: true
    - id: 7
      name: process_effectiveness_4
      label: Collaboration among team members
      hint: How effective was collaboration among team members?
      type: select_multiple
      options:
      - Excellent
      - Good
      - Average
      - Fair
      - Poor
      required: true
    - id: 8
      name: process_effectiveness_5
      label: Additional comments
      hint: Do you have any additional comments or suggestions about the project process?
      type: text
      options: []
      required: false
