inputSchema:
  type: object
  properties:
    title: Community Listening Session Survey
    pages:
      - id: 1
        name: header
        label: -- Listening Session Survey --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: attendee_name
        label: Attendee name
        hint: Optional for follow up
        type: text
        options: []
        required: false
      - id: 3
        name: session_date
        label: Session date
        hint: Date of session attended
        type: date
        options: []
        required: true
      - id: 4
        name: topics_discussed
        label: Topics discussed
        hint: Key topics from the session
        type: text
        options: []
        required: true
      - id: 5
        name: effectiveness_of_session
        label: Effectiveness of session
        hint: Rate how effective the session was
        type: select_one
        options:
          - Very effective
          - Effective
          - Somewhat effective
          - Not effective
        required: true
      - id: 6
        name: suggestions
        label: Suggestions for future sessions
        hint: Open ended feedback
        type: text
        options: []
        required: false
      - id: 7
        name: willingness_to_participate
        label: Willing to participate in future sessions
        hint: Indicate yes or no
        type: select_one
        options:
          - Yes
          - No
        required: false
      - id: 8
        name: additional_feedback
        label: Additional feedback
        hint: Any other comments
        type: text
        options: []
        required: false
      - id: 9
        name: contact_email
        label: Contact email for follow up
        hint: Optional
        type: email
        options: []
        required: false
      - id: 10
        name: permission_to_publish
        label: Permission to publish anonymized quotes
        hint: Agree to anonymized use of comments
        type: select_one
        options:
          - Yes
          - No
        required: false
