inputSchema:
  type: object
  properties:
    title: Community Needs Survey
    pages:
    - id: 1
      name: survey_intro
      label: -- Needs Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_location
      label: Respondent location
      hint: Neighborhood or postal code
      type: text
      options: []
      required: true
    - id: 3
      name: top_needs
      label: Top needs in your household
      hint: Select up to three
      type: select_multiple
      options:
      - Food
      - Housing
      - Healthcare
      - Employment
      - Education
      required: true
    - id: 4
      name: difficulty_accessing_services
      label: Difficulty accessing services
      hint: Rate level of difficulty
      type: select_one
      options:
      - Very difficult
      - Somewhat difficult
      - Not difficult
      required: true
    - id: 5
      name: priority_for_community
      label: Priority areas for community support
      hint: Select top priorities
      type: select_multiple
      options:
      - Food security
      - Affordable housing
      - Health services
      - Job training
      - Childcare
      required: false
    - id: 6
      name: time_availability_for_programs
      label: Availability for programs
      hint: Weekdays or weekends preferred
      type: select_one
      options:
      - Weekdays
      - Evenings
      - Weekends
      - Flexible
      required: false
    - id: 7
      name: preferred_comm_channel
      label: Preferred communication channel
      hint: How to receive information
      type: select_one
      options:
      - Email
      - Phone
      - Community bulletin
      - Social media
      required: false
    - id: 8
      name: willing_to_participate
      label: Willing to participate in programs
      hint: Provide email if willing
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: contact_email
      label: Contact email for follow up
      hint: Optional
      type: email
      options: []
      required: false
    - id: 10
      name: additional_info
      label: Additional information
      hint: Any other context or notes
      type: text
      options: []
      required: false
