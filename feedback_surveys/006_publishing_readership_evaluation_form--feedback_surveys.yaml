      - Digital
      - Both
      required: false
    - id: 6
      name: content_quality
      label: Content quality
      hint: How do you rate the quality of our content?
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: engagement
      label: Engagement
      hint: How engaged are you with our content?
