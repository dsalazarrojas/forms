      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: air_quality_score
      label: Air Quality Score
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: submitted_by
      label: Submitted By
      hint: null
      type: select_one
      options:
      - User
      - Guest
      required: false
    - id: 12
      name: submitted_at
      label: Submitted At
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: submitted
      label: Submitted
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - Urban
      - Rural
      required: false
