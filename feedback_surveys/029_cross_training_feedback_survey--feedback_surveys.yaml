inputSchema:
  type: object
  properties:
    title: Cross Training Feedback Survey
    pages:
    - id: 1
      name: page_1
      label: Training Effectiveness
      hint: null
      type: select_one
      options:
      - very effective
      - somewhat effective
      - not at all effective
      required: true
    - id: 2
      name: page_2
      label: Organization
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: page_3
      label: Recommendation
      hint: null
      type: select_one
      options:
      - very likely
      - somewhat likely
      - not at all likely
      required: true
    - id: 4
      name: page_4
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: page_5
      label: Training Duration
      hint: null
      type: select_one
      options:
      - less than 5 minutes
      - more than 5 minutes but less than 10 minutes
      - more than 10 minutes
      required: false
    - id: 6
      name: page_6
      label: Participation
      hint: null
      type: select_one
      options:
      - very likely
      - somewhat likely
      - not at all likely
      required: false
    - id: 7
      name: page_7
      label: Questions
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: page_8
      label: Quality
      hint: null
      type: select_one
      options:
