inputSchema:
  type: object
  properties:
    title: International Buyer Return Policy Survey
    pages:
    - id: 1
      name: return_clarity
      label: Is return information clearly displayed on product pages?
      hint: null
      type: select_one
      options:
      - Very clear
      - Somewhat clear
      - Not very clear
      required: false
    - id: 2
      name: return_process
      label: How easy or difficult was the return process for you?
      hint: null
      type: select_one
      options:
      - Very easy
      - Somewhat easy
      - Somewhat difficult
      - Very difficult
      required: false
    - id: 3
      name: return_satisfaction
      label: How satisfied were you with the return process?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Not very satisfied
      - Very dissatisfied
      required: false
    - id: 4
      name: return_challenges
      label: What challenges did you face during the return process?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: return_clarification
      label: Did you receive clarification about the return process from seller?
      hint: null
      type: select_one
      options:
      - Very clear
      - Somewhat clear
      - Not very clear
      required: false
    - id: 6
      name: seller_response
      label: How responsive was the seller to your return questions?
