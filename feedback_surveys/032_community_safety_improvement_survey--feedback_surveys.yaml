        - Yes - Mostly Adequate
        - No - Needs Improvement
        - No - Very Poor
        required: true
      - id: 21
        name: police_presence
        label: Is Police Presence Adequate
        hint: null
        type: select_one
        options:
        - Yes - Very Adequate
        - Yes - Mostly Adequate
        - No - Needs Improvement
        - No - Very Poor
        required: true
      - id: 22
        name: community_engagement
        label: Are You Involved in Community Safety
        hint: Neighborhood watch, etc.
        type: select_one
        options:
