        - Neutral
        - Unsafe
        - Very Unsafe
        required: true
      - id: 11
        name: safety_night
        label: How Safe Do You Feel at Night
        hint: null
        type: select_one
        options:
        - Very Safe
        - Safe
        - Neutral
        - Unsafe
        - Very Unsafe
        required: true
      - id: 12
        name: safety_trend
        label: Has Safety Improved or Declined
        hint: Over the past year
        type: select_one
        options:
