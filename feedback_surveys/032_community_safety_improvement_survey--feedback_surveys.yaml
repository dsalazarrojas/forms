        hint: Optional
        type: text
        options: []
        required: false
      - id: 4
        name: email
        label: Email Address
        hint: For follow-up
        type: email
        options: []
        required: false
      - id: 5
        name: neighborhood
        label: Your Neighborhood or Area
        hint: null
        type: text
        options: []
        required: true
      - id: 6
        name: zip_code
        label: ZIP Code
        hint: null
        type: text
        options: []
        required: true
      - id: 7
        name: resident_type
        label: How Long Have You Lived Here
        hint: null
        type: select_one
        options:
        - Less than 1 year
        - 1-3 years
        - 3-5 years
        - 5-10 years
        - 10+ years
        required: true
      - id: 8
        name: safety_perception
        label: Safety Perception
        hint: How safe do you feel
        type: note
        options: []
