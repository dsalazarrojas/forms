        - Text Messages
        - Social Media
        - Community Meetings
        - Flyers
        - Website
        - Mobile App
        required: false
      - id: 25
        name: trust_authorities
        label: How Much Do You Trust Local Authorities
        hint: null
        type: select_one
        options:
        - Very Much
        - Somewhat
        - Neutral
        - Not Much
        - Not At All
        required: true
      - id: 26
        name: additional_comments
        label: Additional Comments or Suggestions
        hint: Share your ideas
        type: text
        options: []
        required: false
