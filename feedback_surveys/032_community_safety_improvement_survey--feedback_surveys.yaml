        - Property Crime
        - Drug Activity
        - Gang Activity
        - Traffic Safety
        - Poor Lighting
        - Abandoned Buildings
        - Loitering
        - Vandalism
        - Domestic Violence
        - None
        required: true
      - id: 15
        name: concern_location
        label: Where Do You Feel Most Unsafe
        hint: Specific locations
        type: text
        options: []
        required: false
      - id: 16
        name: incident_experience
        label: Have You Been a Victim of Crime
        hint: In the past 2 years
        type: select_one
        options:
