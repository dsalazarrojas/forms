inputSchema:
  type: object
  properties:
    title: Bureaucracy Understanding Survey
    pages:
      - id: 1
        name: respondent_info
        label: Respondent Information
        hint: Your details
        type: note
        options: []
        required: false
      - id: 2
        name: full_name
        label: Full Name
        hint: Your full name - optional
        type: text
        options: []
        required: false
      - id: 3
        name: organization
        label: Organization
        hint: Name of your organization
        type: text
        options: []
        required: false
      - id: 4
        name: role
        label: Role or Position
        hint: Your job title or position
        type: text
        options: []
        required: false
      - id: 5
        name: department
        label: Department
        hint: Your department or division
        type: select_one
        options:
        - Administration
        - Operations
        - Human Resources
        - Finance
        - IT
        - Legal
        - Other
        required: false
      - id: 6
        name: experience_assessment
        label: Experience Assessment
        hint: Your experience with bureaucratic processes
        type: note
        options: []
        required: false
