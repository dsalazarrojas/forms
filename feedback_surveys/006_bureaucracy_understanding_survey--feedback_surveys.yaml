      - id: 10
        name: documentation_burden
        label: Documentation Burden
        hint: How burdensome is documentation
        type: select_one
        options:
        - Minimal Burden
        - Manageable
        - Moderate Burden
        - Heavy Burden
        - Excessive Burden
        required: true
      - id: 11
        name: communication_effectiveness
        label: Communication Effectiveness
        hint: How effective is organizational communication
        type: select_one
        options:
        - Very Effective
        - Effective
