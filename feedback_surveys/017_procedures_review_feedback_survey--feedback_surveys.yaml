inputSchema:
  type: object
  properties:
    title: procedures_review_feedback_survey
    pages:
    - id: 1
      name: staff_response
      label: Staff Response
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: feedback
      label: What do you think is the main area of improvement?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: procedures_effectiveness
      label: How effective are these procedures?
      hint: null
      type: select_one
      options:
      - Very effective
      - Somewhat effective
      - Not very effective
      - Not at all effective
      required: true
    - id: 6
      name: procedures_urgency
      label: Urgency
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: procedures_satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Somewhat dissatisfied
      - Very dissatisfied
      required: true
    - id: 8
      name: procedures_urgency_reason
      label: Urgency Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: procedures_improvement_opportunities
      label: Improvement Opportunities
      hint: null
      type: text
      options: []
      required: false
