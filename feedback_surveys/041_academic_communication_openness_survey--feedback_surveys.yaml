inputSchema:
  type: object
  properties:
    title: Academic Communication Openness Survey
    pages:
    - id: 1
      name: survey_introduction
      label: -- Academic Communication Openness Survey --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: institution_name
      label: Name of your institution
      hint: Enter the full name of your college or university
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department or faculty
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: role
      label: Your role at the institution
      hint: null
      type: select_one
      options:
      - Faculty Member
      - Administrative Staff
      - Graduate Student
      - Undergraduate Student
      - Department Chair
      - Adjunct Instructor
      required: true
    - id: 5
      name: years_at_institution
      label: How many years have you been at this institution
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-7 years
      - 8-15 years
      - More than 15 years
      required: true
    - id: 6
      name: communication_section
      label: -- Communication Culture Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: comfort_sharing_ideas
      label: How comfortable do you feel sharing new ideas with colleagues
      hint: Rate your comfort level
      type: select_one
      options:
      - Very comfortable
      - Somewhat comfortable
      - Neutral
      - Somewhat uncomfortable
      - Very uncomfortable
      required: true
    - id: 8
      name: feedback_receptiveness
      label: How receptive is your department to constructive feedback
      hint: null
      type: select_one
      options:
      - Highly receptive
      - Moderately receptive
      - Neutral
      - Somewhat resistant
      - Very resistant
      required: true
    - id: 9
      name: communication_channels
      label: Which communication channels are most used in your department
      hint: Select all that apply
      type: select_multiple
      options:
      - Email
      - In-person meetings
      - Video conferencing
      - Messaging platforms (Slack, Teams)
      - Department newsletters
      - Shared documents or portals
      required: true
    - id: 10
      name: openness_rating
      label: Rate the overall openness of communication in your department on a scale
        of 1-10
      hint: 1 being very closed, 10 being very open
      type: number
      options: []
      required: true
    - id: 11
      name: leadership_transparency
      label: How transparent is the leadership in sharing institutional decisions
      hint: null
      type: select_one
      options:
      - Very transparent
      - Somewhat transparent
      - Neutral
      - Somewhat opaque
      - Very opaque
      required: true
    - id: 12
      name: barriers_to_openness
      label: What barriers to open communication have you experienced
      hint: Select all that apply
      type: select_multiple
      options:
      - Fear of retaliation
      - Hierarchical culture
      - Lack of anonymous channels
      - Language or cultural differences
      - Time constraints
      - No clear feedback mechanisms
      required: false
    - id: 13
      name: suggestions_for_improvement
      label: What suggestions do you have for improving communication openness
      hint: Please share your ideas in a few sentences
      type: text
      options: []
      required: false
    - id: 14
      name: willingness_to_participate
      label: Would you be willing to participate in a follow-up discussion
      hint: null
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: false
    - id: 15
      name: contact_email
      label: Email address for follow-up (optional)
      hint: Only required if you selected Yes above
      type: email
      options: []
      required: false
