inputSchema:
  type: object
  properties:
    title: Treasury Forecasting Accuracy Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: forecasting_methods
      label: Forecasting Methods
      hint: null
      type: select_one
      options:
      - Automated
      - In-house
      - Manual
      required: false
    - id: 3
      name: accuracy_level
      label: Forecasting Accuracy Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: challenges
      label: Challenges
      hint: null
      type: select_multiple
      options:
      - Cash flow management
      - Inaccurate forecasting
      - Lack of visibility
      - Other (please specify)
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: finance_team_feedback
      label: Finance Team Feedback
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      required: false
    - id: 7
      name: non_finance_team_feedback
      label: Non-finance Team Feedback
      hint: null
      type: select_one
      options:
      - Strongly Agree
      - Somewhat Agree
      - Neutral
      - Somewhat Disagree
      - Strongly Disagree
      required: false
