      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: rating_8_why_didnt_you_participate_more
      label: Why didn't you participate more
      hint: null
      type: select_one
      options:
      - Not aware of the opportunity
      - Didn't know what to expect
      - Other
      required: false
    - id: 9
      name: rating_9_any_other_comments
      label: Any other comments
      hint: null
      type: text
      options: []
      required: false
