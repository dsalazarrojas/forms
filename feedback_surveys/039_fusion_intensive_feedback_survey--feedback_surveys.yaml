inputSchema:
  type: object
  properties:
    title: Fusion Intensive Feedback Survey
    pages:
    - id: 1
      name: session_rating
      label: How would you rate this session
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: rating_1_what_did_you_expect_to_gain
      label: What did you expect to gain from this session
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rating_2_what_did_you_gain
      label: What did you gain from this session
      hint: null
      type: select_multiple
      options:
      - Improved communication skills
      - New insights
      - Practical tools
      - Confidence
      - Other
      required: false
    - id: 4
      name: rating_3_what_did_you_find_most_valuable
      label: What did you find most valuable
      hint: null
      type: select_one
      options:
      - Practical tools and techniques
      - Personal growth and development
      - Networking opportunities
      - Other
      required: false
    - id: 5
      name: rating_4_how_satisfied
      label: How satisfied are you with the session
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 6
      name: rating_5_what_did_you_find_most_challenging
      label: What did you find most challenging
      hint: null
      type: select_one
      options:
      - Overwhelming data
      - Unclear expectations
      - Insufficient time
      - Other
