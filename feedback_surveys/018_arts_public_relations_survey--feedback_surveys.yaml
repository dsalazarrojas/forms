inputSchema:
  type: object
  properties:
    title: Arts Public Relations Survey
    pages:
    - id: 1
      name: discovery_method
      label: How did you first learn about our arts organization
      hint: Select the primary source
      type: select_one
      options:
      - Local Newspaper
      - Radio/TV
      - Social Media
      - Friend or Family
      - Search Engine
      - Poster or Flyer
      required: true
    - id: 2
      name: social_media_rating
      label: Rate our social media presence
      hint: 1 - poor, 5 - excellent
      type: number
      options: []
      required: true
    - id: 3
      name: press_release_clarity
      label: Rate the clarity of our recent press releases
      hint: 1 - confusing, 5 - very clear
      type: number
      options: []
      required: false
    - id: 4
      name: media_coverage_rating
      label: Rate the quality of our local media coverage
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: mission_understanding
      label: Do you feel you have a clear understanding of our mission
      hint: null
      type: select_one
      options:
      - Very Clear
      - Somewhat Clear
      - Not Clear
      required: true
    - id: 6
      name: preferred_channel
      label: Which communication channel do you prefer
      hint: null
      type: select_one
      options:
      - Email Newsletter
      - Instagram/Facebook
      - Direct Mail
      - Text Alerts
      - Website Updates
      required: true
    - id: 7
      name: engagement_frequency
      label: How often do you engage with our PR materials
      hint: null
      type: select_one
      options:
      - Weekly
      - Monthly
      - A few times a year
      - Rarely
      required: false
    - id: 8
      name: engagement_suggestions
      label: Suggestions for improving our public engagement
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: website_ease_of_use
      label: Rate the ease of finding information on our website
      hint: 1 - difficult, 5 - very easy
      type: number
      options: []
      required: true
    - id: 10
      name: respondent_role
      label: What is your relationship to our organization
      hint: null
      type: select_one
      options:
      - Regular Patron
      - Occasional Visitor
      - Artist
      - Media Professional
      - Donor/Sponsor
      required: false
