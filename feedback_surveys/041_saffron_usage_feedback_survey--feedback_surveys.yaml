inputSchema:
  type: object
  properties:
    title: Saffron Usage Feedback Survey
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: saffron_use
      label: How often do you use saffron?
      hint: null
      type: select_one
      options:
      - Slightly
      - Occasionally
      - Very frequently
      required: false
    - id: 3
      name: saffron_satisfaction
      label: How satisfied are you with saffron?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 4
      name: benefits
      label: What benefits do you get from using saffron?
      hint: null
      type: select_multiple
      options:
      - Mood improvement
      - Skin care
      - Culinary
      - Other (please specify)
      required: false
    - id: 5
      name: challenges
      label: What challenges do you face while using saffron?
      hint: null
      type: select_multiple
      options:
      - Limited availability
      - High cost
      - Difficulty preparing
      - Other (please specify)
      required: false
    - id: 6
      name: comments
      label: Any comments or suggestions
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: saffron_usage_frequency
      label: How often do you use saffron in cooking?
      hint: null
      type: select_one
      options:
      - Never
      - Less than once a week
      - 1-2 times a week
      - 3-4 times a week
      - 5-6 times a week
      - Daily
      required: false
    - id: 8
      name: saffron_purchasing_frequency
      label: How often do you purchase saffron?
      hint: null
      type: select_one
      options:
      - Never
      - Less than once a month
      - Once a month
      - 2-3 times a month
      - More often than once a week
      required: false
    - id: 9
      name: saffron_recommend
      label: Would you recommend saffron to friends and family?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: saffron_importance
      label: How important is saffron for you?
      hint: null
      type: select_one
      options:
      - Not at all
      - Somewhat
      - Very
      required: false
    - id: 11
      name: saffron_source
      label: Where do you usually get your saffron?
      hint: null
      type: select_one
      options:
      - Local store
      - Online
      - Other
      required: false
    - id: 12
      name: saffron_cost
      label: How much do you pay for 1 gram of saffron?
      hint: null
      type: number
      options: []
      required: false
    - id: 13
