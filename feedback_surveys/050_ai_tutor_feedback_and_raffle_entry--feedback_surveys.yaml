inputSchema:
  type: object
  properties:
    title: AI Tutor Feedback And Raffle Entry
    pages:
    - id: 1
      name: --feedback_submission--
      label: -- Feedback Submission --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: learner_name
      label: Learner name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: session_date
      label: Session date
      hint: Date of tutoring session
      type: date
      options: []
      required: true
    - id: 4
      name: tutor_name
      label: Tutor name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 5
      name: overall_satisfaction
      label: Overall satisfaction with tutor
      hint: Rate 1 lowest to 5 highest
      type: number
      options: []
      required: true
    - id: 6
      name: usefulness_of_feedback
      label: Usefulness of feedback provided
      hint: Rate 1 lowest to 5 highest
      type: number
      options: []
      required: true
    - id: 7
      name: learning_progress
      label: Perceived learning progress
      hint: Rate 1 lowest to 5 highest
      type: number
      options: []
      required: true
    - id: 8
      name: suggestions_for_tutor
      label: Suggestions for tutor improvement
      hint: Optional constructive feedback
      type: text
      options: []
      required: false
    - id: 9
      name: raffle_entry_consent
      label: Consent to enter raffle
      hint: Select one to enter raffle
      type: select_one
      options:
      - Yes enter me
      - No do not enter me
      required: true
    - id: 10
      name: contact_phone
      label: Contact phone for raffle winners
      hint: Provide only if consenting to raffle
      type: text
      options: []
      required: false
    - id: 11
      name: additional_comments
      label: Additional comments
      hint: Optional
      type: text
      options: []
      required: false
