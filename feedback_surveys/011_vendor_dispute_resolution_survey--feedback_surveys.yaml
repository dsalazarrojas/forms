inputSchema:
  type: object
  properties:
    title: Vendor Dispute Resolution Survey
    pages:
    - id: 1
      name: vendor_dispute_details
      label: vendor_dispute_details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: supporting_documents
      label: supporting_documents
      hint: null
      type: select_one
      options:
      - document type
      - upload document
