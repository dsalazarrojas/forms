inputSchema:
  type: object
  properties:
    title: Neurodiversity Program Feedback Survey
    pages:
    - id: 1
      name: session_evaluation
      label: Session Evaluation
      hint: null
      type: select_one
      options:
      - Session 1
      - Session 2
      - Session 3
      required: true
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: suggestion
      label: Do you have any suggestions?
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
