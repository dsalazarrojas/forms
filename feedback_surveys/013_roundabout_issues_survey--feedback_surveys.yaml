inputSchema:
  type: object
  properties:
    title: Roundabout Issues Survey
    pages:
    - id: 1
      name: roundabout_issues_survey_form_fields
      label: Roundabout Issues Survey Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: issue_type
      label: issue_type
      hint: null
      type: select_one
      options:
      - roundabout condition
      - roundabout construction
      - other
      required: false
    - id: 3
      name: issue_description
      label: issue_description
      hint: Please provide a clear and concise description of the issue.
      type: text
      options: []
      required: false
    - id: 4
      name: safety_concern
      label: safety_concern
      hint: null
      type: select_multiple
      options:
      - roundabout
      - road signs
      - pedestrian
      required: false
    - id: 5
      name: safety_concerns
      label: safety_concerns
      hint: List any other safety concerns you have.
      type: text
      options: []
      required: false
    - id: 6
      name: roundabout_characteristics
      label: roundabout_characteristics
      hint: null
      type: select_multiple
      options:
      - roundabout shape
      - roundabout size
      - roundabout orientation
      required: false
    - id: 7
      name: roundabout_characteristics_list
      label: roundabout_characteristics_list
      hint: Provide any additional characteristics of the roundabout.
      type: text
      options: []
      required: false
    - id: 8
      name: submission_comments
      label: submission_comments
      hint: Is there anything else you'd like to add about your submission?
      type: text
      options: []
      required: false
