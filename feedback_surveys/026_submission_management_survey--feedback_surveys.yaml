inputSchema:
  type: object
  properties:
    title: Submission Management Survey
    pages:
    - id: 1
      name: submission_management_survey_form
      label: Submission Management Survey
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: select_user_type
      label: Select User Type
      hint: null
      type: select_one
      options:
      - user
      - team-member
      - stakeholder
      required: false
    - id: 6
      name: satisfaction_rating
      label: Satisfaction Rating
      hint: null
      type: select_multiple
      options:
      - very-satisfied
      - somewhat-satisfied
      - neither-satisfied-nor-dissatisfied
      - somewhat-dissatisfied
      - very-dissatisfied
      required: false
    - id: 7
      name: ease_of_use
      label: Ease of Use
      hint: null
      type: select_one
      options:
      - very-easy
      - somewhat-easy
      - neither-easy-nor-hard
      - somewhat-hard
      - very-hard
      required: false
    - id: 8
      name: submission_procedure
      label: Submission Procedure
      hint: null
      type: select_multiple
      options:
      - current-procedure
      - improved-procedure
      - new-procedure
      required: false
    - id: 9
      name: improvement_ideas
      label: Improvement Ideas
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
