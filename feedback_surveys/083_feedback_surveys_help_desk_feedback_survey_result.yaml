title: Help desk feedback survey
description: Generate a Help desk feedback survey survey for the "Feedback surveys" category. Use the template name: "Help desk feedback survey template".
questions:
  - text: Overall, how satisfied are you with help desk feedback survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Help, Desk, Feedback, Survey]
  - text: How often do you interact with help desk feedback survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
