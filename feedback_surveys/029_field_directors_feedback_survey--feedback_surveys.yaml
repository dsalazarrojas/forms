      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: feedback_about_manager
      label: feedback about manager
      hint: What feedback do you have about your manager?
      type: text
      options: []
      required: false
    - id: 9
      name: select_multiple_challenges
      label: select multiple challenges
      hint: What challenges are you facing?
      type: select_multiple
      options:
      - Lack of Resources
      - Communication issues
      - Poor Leadership
      - Other (please specify)
      required: false
    - id: 10
      name: submit
      label: submit
      hint: null
      type: text
      options: []
      required: false
