inputSchema:
  type: object
  properties:
    title: geoSystemsFeedbackSurvey
    pages:
    - id: 1
      name: overall_impression
      label: What is your overall impression of geoSystems?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: rating
      label: How would you rate your experience with geoSystems?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 3
      name: mapping_platform
      label: Which mapping platform do you use most frequently?
      hint: null
      type: select_multiple
      options:
      - Google Maps
      - ArcGIS
      - OpenStreetMap
      required: true
    - id: 4
      name: time_used
      label: How long did you use geoSystems for?
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: feedback
      label: What is your feedback about geoSystems?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: mapping_platform_2
      label: Which mapping platform do you prefer for geoSystems?
      hint: null
      type: select_one
      options:
      - Google Maps
      - ArcGIS
      - OpenStreetMap
      required: true
    - id: 9
      name: time_used_2
      label: Time Used 2
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: comments
      label: Do you have any comments about geoSystems?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: rating_again
      label: How would you rate your experience with geoSystems again?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 12
      name: email_confirmation
      label: Is this email address correct?
      hint: null
      type: email
      options: []
      required: true
    - id: 13
      name: phone_confirmation
      label: Is this phone number correct?
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: feedback_again
      label: Do you have any further comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: platform_improvement
      label: Is there anything we can improve on geoSystems?
      hint: null
      type: text
      options: []
      required: false
