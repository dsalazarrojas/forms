title: Subscription box survey
description: Generate a Subscription box survey survey for the "Feedback surveys" category. Use the template name: "Subscription box survey template".
questions:
  - text: Overall, how satisfied are you with subscription box survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Subscription, Box, Survey, Feedback]
  - text: How often do you interact with subscription box survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
