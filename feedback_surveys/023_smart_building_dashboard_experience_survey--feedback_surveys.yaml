inputSchema:
  type: object
  properties:
    title: Smart Building Dashboard Experience Survey
    pages:
    - id: 1
      name: dashboard_usage
      label: How do you typically use the dashboard?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Rarely
      - Never
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: issue_satisfaction
      label: Satisfaction with Current State
      hint: null
      type: select_one
      options:
      - Very Dissatisfied
      - Somewhat Dissatisfied
      - Neutral
      - Somewhat Satisfied
      - Very Satisfied
      required: false
    - id: 4
      name: feature_requests
      label: Feature Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: issue_description
      label: Description of Issues
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: issue_urgency
      label: Urgency
      hint: null
