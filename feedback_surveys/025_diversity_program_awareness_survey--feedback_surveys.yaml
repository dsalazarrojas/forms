inputSchema:
  type: object
  properties:
    title: Diversity Program Awareness Survey
    pages:
    - id: 1
      name: diversity_program_awareness_survey_form_1
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: diversity_program_awareness_survey_form_2
      label: how_do_you_learn_about_diversity
      hint: Select all that apply
      type: select_multiple
      options:
      - through workshops and trainings
      - through diversity committee
      - through leadership
      - through newsletters
      - through other
      required: true
    - id: 3
      name: diversity_program_awareness_survey_form_3
      label: have_you_participated_in_diversity_related_activities
      hint: null
      type: select_one
      options:
      - 'yes'
      - 'no'
      required: true
    - id: 4
      name: diversity_program_awareness_survey_form_4
      label: how_do_you_feel_about_diversity_in_the_workplace
      hint: null
      type: select_multiple
      options:
      - very positive
      - somewhat positive
      - neutral
      - somewhat negative
      - very negative
      required: false
    - id: 5
      name: diversity_program_awareness_survey_form_5
      label: what_do_you_want_to_improve
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: diversity_program_awareness_survey_form_6
      label: suggestions
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: diversity_program_awareness_survey_form_7
      label: contact_information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: diversity_program_awareness_survey_form_8
      label: contact_information_repeat
      hint: null
      type: text
      options: []
      required: false
