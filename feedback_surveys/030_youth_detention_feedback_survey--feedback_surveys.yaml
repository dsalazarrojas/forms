inputSchema:
  type: object
  properties:
    title: Youth Detention Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: safety
      label: How safe do you feel when you are in the facility?
      hint: null
      type: select_one
      options:
      - Very safe
      - Somewhat safe
      - Not very safe
      - Not at all safe
      required: false
    - id: 3
      name: staff_support
      label: How would you rate the quality of the staff support you received?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: services
      label: How satisfied are you with the services provided by the facility?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neither satisfied nor dissatisfied
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 5
      name: feedback
      label: Any additional feedback or comments?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contact_info
      label: Please provide your contact information
      hint: null
      type: email
      options: []
      required: false
