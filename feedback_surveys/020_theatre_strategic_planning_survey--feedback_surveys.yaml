inputSchema:
  type: object
  properties:
    title: Theatre Strategic Planning Survey
    pages:
    - id: 1
      name: theatre_strategic_planning_survey
      label: What are the main challenges faced by your organization
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: main_challenge_1
      label: Funding
      hint: null
      type: select_one
      options:
      - funding
      - marketing
      - audience engagement
      - operations
      - programming
      - leadership
      required: false
    - id: 3
      name: main_challenge_2
      label: How do you currently prioritize your organization
      hint: null
