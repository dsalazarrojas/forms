title: Office feedback survey
description: Generate a Office feedback survey survey for the "Feedback surveys" category. Use the template name: "Office feedback survey template".
questions:
  - text: Overall, how satisfied are you with office feedback survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Office, Feedback, Survey, Surveys]
  - text: How often do you interact with office feedback survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
