inputSchema:
  type: object
  properties:
    title: Password Reset Request Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: password_input
      label: New Password
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: confirm_input
      label: Confirm New Password
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email_input
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: security_question
      label: Security Question
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 6
      name: security_answer
      label: Security Answer
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submit_button
      label: Submit
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: user_agent
      label: User Agent
      hint: null
      type: text
      options: []
      required: false
