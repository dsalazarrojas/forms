        name: variable_naming
        label: Variable Naming Quality
        hint: Rate from 1 - poor to 5 - excellent
        type: select_one
        options:
          - "1 - Poor"
          - "2 - Fair"
          - "3 - Good"
          - "4 - Very Good"
          - "5 - Excellent"
        required: true
      - id: 11
        name: function_naming
        label: Function Naming Quality
        hint: null
        type: select_one
        options:
          - "1 - Poor"
          - "2 - Fair"
          - "3 - Good"
          - "4 - Very Good"
          - "5 - Excellent"
        required: true
      - id: 12
        name: class_naming
        label: Class or Component Naming
        hint: null
        type: select_one
        options:
          - "1 - Poor"
          - "2 - Fair"
          - "3 - Good"
          - "4 - Very Good"
          - "5 - Excellent"
        required: false
