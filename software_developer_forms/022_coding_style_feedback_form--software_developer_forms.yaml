        hint: Functions are of reasonable length
        type: select_one
        options:
          - "1 - Too long"
          - "2 - Often too long"
          - "3 - Generally appropriate"
          - "4 - Well-sized"
          - "5 - Excellently proportioned"
        required: true
      - id: 22
        name: nesting_levels
