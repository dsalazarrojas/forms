inputSchema:
  type: object
  properties:
    title: Coding Style Feedback Form
    pages:
      - id: 1
        name: section_reviewer
        label: -- Reviewer Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: reviewer_name
        label: Reviewer Name
        hint: Name of code reviewer
        type: text
        options: []
        required: true
      - id: 3
        name: reviewer_email
        label: Email Address
        hint: null
        type: email
        options: []
        required: true
      - id: 4
        name: section_code_review
        label: -- Code Review Details --
        hint: null
        type: note
        options: []
        required: false
      - id: 5
        name: developer_name
        label: Developer Name
        hint: Name of developer whose code is being reviewed
        type: text
        options: []
        required: true
      - id: 6
        name: code_file
        label: File or Method Reviewed
        hint: Name of the code being reviewed
        type: text
        options: []
        required: true
      - id: 7
        name: programming_language
        label: Programming Language
        hint: null
        type: select_one
        options:
          - Python
          - JavaScript
          - Java
          - C++
          - C-sharp
          - Ruby
          - PHP
          - Go
          - Rust
          - TypeScript
          - Other
        required: true
      - id: 8
        name: review_date
        label: Review Date
        hint: null
        type: date
        options: []
        required: true
