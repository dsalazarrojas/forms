        name: doc_strings
        label: Documentation Strings or JSDoc
        hint: null
        type: select_one
        options:
          - "1 - Missing"
          - "2 - Incomplete"
          - "3 - Present but minimal"
          - "4 - Good documentation"
          - "5 - Comprehensive"
        required: true
      - id: 20
        name: section_complexity
        label: -- Code Complexity --
        hint: null
        type: note
        options: []
        required: false
