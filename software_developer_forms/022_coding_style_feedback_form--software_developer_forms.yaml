        hint: Consistent placement and formatting
        type: select_one
        options:
          - "1 - Inconsistent"
          - "2 - Mostly inconsistent"
          - "3 - Generally consistent"
          - "4 - Mostly consistent"
          - "5 - Highly consistent"
        required: true
