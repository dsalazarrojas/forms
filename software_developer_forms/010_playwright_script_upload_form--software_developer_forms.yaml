inputSchema:
  type: object
  properties:
    title: Playwright Script Upload Form
    pages:
    - id: 1
      name: script_upload
      label: Script Upload
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: context_information
      label: Context Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: upload_date
      label: Upload Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: user_uploading
      label: User Uploading
      hint: null
      type: select_one
      options:
      - '{''name'': ''User A''}'
      - '{''name'': ''User B''}'
      - '{''name'': ''User C''}'
      required: false
    - id: 5
      name: review_status
      label: Review Status
      hint: null
      type: select_multiple
      options:
      - '{''name'': ''Approved''}'
      - '{''name'': ''Rejected''}'
      - '{''name'': ''Pending''}'
      required: false
    - id: 6
      name: script_type
      label: Script Type
      hint: null
      type: select_one
      options:
      - '{''name'': ''Regression''}'
      - '{''name'': ''Sanity''}'
      - '{''name'': ''Functional''}'
      required: false
    - id: 7
      name: script_description
      label: Script Description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: script_version
      label: Script Version
      hint: null
      type: number
      options: []
      required: false
