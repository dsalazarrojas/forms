inputSchema:
  type: object
  properties:
    title: Enhancement Request Form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_details
      label: Product Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: enhancement_type
      label: Enhancement Type
      hint: null
      type: select_one
      options:
      - type1
      - type2
      - type3
      required: false
    - id: 4
      name: priority
      label: Priority
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - new
      - in progress
      - completed
      required: false
    - id: 6
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: impact_level
      label: Impact Level
      hint: null
      type: select_multiple
      options:
      - high
      - medium
      - low
      required: false
    - id: 8
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - not assigned
      required: false
    - id: 10
      name: submit_button
      label: Submit
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: email_input
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone_input
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
