inputSchema:
  type: object
  properties:
    title: Bug Report Form Template
    pages:
    - id: 1
      name: reporter_name
      label: Reporter Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: team
      label: Team or Department
      hint: Your team
      type: text
      options: []
      required: false
    - id: 4
      name: report_date
      label: Report Date
      hint: Date of report
      type: date
      options: []
      required: true
    - id: 5
      name: project_name
      label: Project Name
      hint: Related project
      type: text
      options: []
      required: true
    - id: 6
      name: module_component
      label: Module or Component
      hint: Affected component
      type: text
      options: []
      required: true
    - id: 7
      name: bug_type
      label: Bug Type
      hint: Classification of bug
      type: select_one
      options:
      - Functional
      - Performance
      - Security
      - Usability
      - Compatibility
      - Integration
      - Data
      - UI/UX
      required: true
    - id: 8
      name: severity
      label: Severity
      hint: Impact level
      type: select_one
      options:
      - Blocker
      - Critical
      - Major
      - Minor
      - Trivial
      required: true
    - id: 9
      name: priority
      label: Priority
      hint: Fix priority
      type: select_one
      options:
      - P1 - Critical
      - P2 - High
      - P3 - Medium
      - P4 - Low
      - P5 - Lowest
      required: true
    - id: 10
      name: environment
      label: Environment
      hint: Where was bug found
      type: select_one
      options:
      - Development
      - Testing
      - Staging
      - Production
      - Other
      required: true
    - id: 11
      name: browser
      label: Browser
      hint: Browser used
      type: select_one
      options:
      - Chrome
      - Firefox
      - Safari
      - Edge
      - Opera
      - Other
      - N/A
      required: false
    - id: 12
      name: os
      label: Operating System
      hint: OS used
      type: select_one
      options:
      - Windows 11
      - Windows 10
      - macOS
      - Linux
      - iOS
      - Android
      - Other
      required: false
    - id: 13
      name: summary
      label: Bug Summary
      hint: Brief description
      type: text
      options: []
      required: true
    - id: 14
      name: description
      label: Detailed Description
      hint: Full details of the bug
      type: text
      options: []
      required: true
    - id: 15
      name: reproduction_steps
      label: Steps to Reproduce
      hint: Step by step instructions
      type: text
      options: []
      required: true
    - id: 16
      name: expected_result
      label: Expected Result
      hint: What should happen
      type: text
      options: []
      required: true
    - id: 17
      name: actual_result
      label: Actual Result
      hint: What actually happened
      type: text
      options: []
      required: true
    - id: 18
      name: workaround
      label: Workaround Available
      hint: Is there a temporary fix
      type: select_one
      options:
      - Yes - Documented
      - Yes - Not Documented
      - No Workaround
      - Unknown
      required: false
    - id: 19
      name: attachments
      label: Attachments
      hint: Screenshots or logs
      type: select_one
      options:
      - Yes - Attached
      - 'False'
      required: false
    - id: 20
      name: assigned_to
      label: Assign To
      hint: Team member to assign
      type: text
      options: []
      required: false
