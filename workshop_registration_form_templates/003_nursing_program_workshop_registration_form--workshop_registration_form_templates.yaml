inputSchema:
  type: object
  properties:
    title: Nursing Program Workshop Registration Form
    pages:
    - id: 1
      name: applicant_count
      label: Applicant Count
      hint: Enter the number of applicants attending the workshop
      type: number
      options: []
      required: true
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter applicant's full name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_info
      label: Contact Information
      hint: Enter the applicant's email address and phone number
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: attendance_date
      label: Attendance Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: attendance_time
      label: Attendance Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: select_one
      label: Select One
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: select_multiple
      label: Select Multiple
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: note
      label: Notes
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: output_file
      label: Output File
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: form_id
      label: Form ID
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: category
      label: Category
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
