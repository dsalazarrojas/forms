inputSchema:
  type: object
  properties:
    title: Population Health Data Science Workshop Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_zone
      label: Time Zone
      hint: null
      type: select_one
      options:
      - America/New York
      - Pacific/Auckland
      - Australia/Brisbane
      - Asia/Tokyo
      - Europe/London
      required: false
    - id: 7
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: workshop_attendance
      label: Which workshop will you attend?
      hint: null
      type: select_multiple
      options:
      - Workshop A
      - Workshop B
      - Workshop C
      - Workshop D
      - Workshop E
      required: false
    - id: 9
      name: agreement
      label: I agree
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
