inputSchema:
  type: object
  properties:
    title: Textile Training Course Registration
    pages:
    - id: 1
      name: course_enrollment
      label: Course Enrollment
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: consent
      label: Consent
      hint: This form requires participant consent to enroll in the course.
      type: text
      options: []
      required: false
    - id: 4
      name: additional_info
      label: Additional Info
      hint: null
      type: text
      options: []
      required: false
