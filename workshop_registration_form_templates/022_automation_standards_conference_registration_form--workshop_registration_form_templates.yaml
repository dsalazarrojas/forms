      - Workflow Automation
      - AI/ML Integration
      - Cloud Solutions
      - Enterprise Integration
      - Testing
      - Standards Compliance
      required: true
    - id: 23
      name: t_shirt_size
      label: T-Shirt Size
      hint: null
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - 2XL
      required: true
    - id: 24
      name: newsletter_signup
      label: Subscribe to Future Newsletters
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: additional_comments
      label: Additional Comments or Questions
      hint: null
      type: text
      options: []
      required: false
