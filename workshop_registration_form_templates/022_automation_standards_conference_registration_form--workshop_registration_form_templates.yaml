      name: section_header_dietary
      label: -- Dietary and Accessibility --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Kosher
      - Halal
      - Shellfish Allergy
      - Nut Allergy
      - None
      required: true
    - id: 20
      name: accessibility_needs
      label: Accessibility Requirements
      hint: null
      type: text
      options: []
