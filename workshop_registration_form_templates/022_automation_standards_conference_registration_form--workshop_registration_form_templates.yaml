    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Confirmation will be sent here
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_company
      label: -- Company Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
