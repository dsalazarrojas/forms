      options:
      - Keynote - 9 AM
      - RPA Fundamentals - 10 AM
      - Advanced Automation - 10 AM
      - Integration Patterns - 11:30 AM
      - Cloud Automation - 1 PM
      - Best Practices Panel - 2:30 PM
      required: true
    - id: 17
      name: day_2_sessions
      label: Day 2 - Select Preferred Sessions
      hint: null
      type: select_multiple
      options:
