inputSchema:
  type: object
  properties:
    title: pet_grooming_masterclass_registration_form
    pages:
    - id: 1
      name: session_details
      label: Session Details
      hint: Please enter session details
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_info
      label: Attendee Info
      hint: Please enter attendee details
      type: text
      options: []
      required: true
    - id: 3
      name: pet_info
      label: Pet Info
      hint: Please enter pet details
      type: text
      options: []
      required: true
    - id: 4
      name: session_preferences
      label: Session Preferences
      hint: Please select session preferences
      type: select_multiple
      options:
      - Session A
      - Session B
      - Session C
      required: true
    - id: 5
      name: payment_info
      label: Payment Info
      hint: Please enter payment details
      type: text
      options: []
      required: true
    - id: 6
      name: additional_info
      label: Additional Info
      hint: Is there anything else you would like to share with us?
      type: note
      options: []
      required: false
