inputSchema:
  type: object
  properties:
    title: Academic Innovation Sprint Application Form
    pages:
    - id: 1
      name: applicant_info
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Applicant full name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact email
      hint: Use institutional email when available
      type: email
      options: []
      required: true
    - id: 4
      name: affiliation
      label: Department or affiliation
      hint: Unit or lab name
      type: text
      options: []
      required: false
    - id: 5
      name: project_title
      label: Project title
      hint: Working title for the innovation project
      type: text
      options: []
      required: true
    - id: 6
      name: project_summary
      label: Project summary
      hint: Summary of objectives and expected outcomes
      type: text
      options: []
      required: true
    - id: 7
      name: team_members
      label: Team members
      hint: List names and roles separated by commas
      type: text
      options: []
      required: false
    - id: 8
      name: expected_impact
      label: Expected impact
      hint: Describe academic or educational impact
      type: text
      options: []
      required: true
    - id: 9
      name: support_needed
      label: Support needed from organizers
      hint: Mentoring, funding, lab access, etc
      type: select_multiple
      options:
        - Mentoring
        - Funding
        - Technical support
        - Lab access
      required: false
    - id: 10
      name: availability
      label: Availability during sprint
      hint: Dates or days you can participate
      type: text
      options: []
      required: true
