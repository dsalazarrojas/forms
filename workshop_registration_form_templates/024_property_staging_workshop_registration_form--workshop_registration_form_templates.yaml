inputSchema:
  type: object
  properties:
    title: Property Staging Workshop Registration Form
    pages:
    - id: 1
      name: property_staging_workshop_registration
      label: Attendee Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: payment_details
      label: Payment
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Choose Payment Method
      hint: Select your preferred payment method
      type: select_one
      options:
      - Stripe
      - PayPal
      - Bank Transfer
      required: false
    - id: 4
      name: attendee_preferences
      label: Attendee Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_amount
      label: Amount
      hint: Enter amount
      type: number
      options: []
      required: false
    - id: 6
      name: payment_currency
      label: Currency
      hint: Select currency
      type: select_one
      options:
      - USD
      - EUR
      - GBP
      required: false
    - id: 7
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Pending
      - Success
      - Failed
      required: false
    - id: 8
      name: email
      label: Email
      hint: Enter your email
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: Enter your phone number
      type: number
      options: []
      required: false
