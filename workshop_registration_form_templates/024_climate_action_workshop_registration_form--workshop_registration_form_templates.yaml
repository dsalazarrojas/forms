      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 6
      name: organization
      label: Organization/Institution
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: workshop_section
      label: -- Workshop Selection --
      hint: null
      type: note
      options: []
      required: false
