inputSchema:
  type: object
  properties:
    title: Community Health Workshop Registration
    pages:
    - id: 1
      name: registration_header
      label: -- Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Legal name for certificate
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Employer or affiliation if applicable
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email address
      hint: For registration confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: Optional contact number
      type: text
      options: []
      required: false
    - id: 6
      name: session_selection
      label: Session selection
      hint: Choose preferred workshop session
      type: select_one
      options:
      - Session A morning
      - Session B afternoon
      - Session C evening
      required: true
    - id: 7
      name: role_in_healthcare
      label: Role in healthcare
      hint: Participant role or interest
      type: select_one
      options:
      - Clinician
      - Community worker
      - Student
      - General public
      required: false
    - id: 8
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Provide contact for emergencies
      type: text
      options: []
      required: false
    - id: 9
      name: consent_photo
      label: Consent to be photographed
      hint: Consent for event photos
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: special_requests
      label: Special requests or needs
      hint: Accessibility, dietary, or other requests
      type: text
      options: []
      required: false
