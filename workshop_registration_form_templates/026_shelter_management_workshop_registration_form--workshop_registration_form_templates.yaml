inputSchema:
  type: object
  properties:
    title: Shelter Management Workshop Registration Form
    pages:
    - id: 1
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_preferences
      label: Session Preferences
      hint: Select a session that best suits your schedule and preference
      type: select_multiple
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 3
      name: logistics
      label: Logistics Information
      hint: Additional details about travel and accommodation
      type: text
      options: []
      required: false
    - id: 4
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: contact_name
      label: Name
      hint: Enter your name as it appears on your ID
      type: text
      options: []
      required: false
    - id: 6
      name: contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: contact_note
      label: Note
      hint: Any additional info about yourself
      type: note
      options: []
      required: false
    - id: 9
      name: participant_type
      label: Participant Type
      hint: Select your participant type
      type: select_one
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 10
      name: session_type
      label: Session Type
      hint: Select a session type
      type: select_multiple
      options:
      - option1
      - option2
      - option3
      required: false
    - id: 11
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
