inputSchema:
  type: object
  properties:
    title: Community Training Village Booking Form
    pages:
    - id: 1
      name: organizer_full_name
      label: Full Name
      hint: Primary contact name
      type: text
      options: []
      required: true
    - id: 2
      name: organizer_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: organizer_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: organization_name
      label: Organization Name
      hint: Company, group, or organization
      type: text
      options: []
      required: false
    - id: 5
      name: organization_type
      label: Organization Type
      hint: What type of group are you?
      type: select_one
      options:
      - Business/Corporate
      - Nonprofit Organization
      - Community Group
      - Educational Institution
      - Government Agency
      - Private Individual
      - Other
      required: true
    - id: 6
      name: event_type
      label: What type of event are you planning?
      hint: Select the event category
      type: select_one
      options:
      - Training Workshop
      - Seminar
      - Conference
      - Team Building
      - Class or Course
      - Meeting
      - Presentation
      - Other
      required: true
    - id: 7
      name: event_title
      label: Event Title
      hint: Name of your event
      type: text
      options: []
      required: true
    - id: 8
      name: event_description
      label: Event Description
      hint: Brief description of the event
      type: text
      options: []
      required: true
    - id: 9
      name: preferred_date
      label: Preferred Date
      hint: First choice date
      type: date
      options: []
      required: true
    - id: 10
      name: alternative_date
      label: Alternative Date
      hint: Second choice date
      type: date
      options: []
      required: false
    - id: 11
      name: start_time
      label: Start Time
      hint: When does the event begin?
      type: time
      options: []
      required: true
    - id: 12
      name: end_time
      label: End Time
      hint: When does the event end?
      type: time
      options: []
      required: true
    - id: 13
      name: setup_time_needed
      label: How much setup time do you need?
      hint: Before the event starts
      type: select_one
      options:
      - 30 minutes
      - 1 hour
      - 2 hours
      - Half day
      - Full day
      - No setup needed
      required: true
    - id: 14
      name: expected_attendees
      label: Expected Number of Attendees
      hint: Approximate count
      type: number
      options: []
      required: true
    - id: 15
      name: room_preference
      label: Room or Space Preference
      hint: Select your preferred space
      type: select_one
      options:
      - Main Hall (capacity 100+)
      - Conference Room A (capacity 30)
      - Conference Room B (capacity 20)
      - Training Room (capacity 50)
      - Outdoor Pavilion (capacity 75)
      - No preference
      required: true
    - id: 16
      name: room_setup
      label: Preferred Room Setup
      hint: Seating arrangement
      type: select_one
      options:
      - Theater Style
      - Classroom Style
      - U-Shape
      - Boardroom Style
      - Cabaret Style
      - Open Floor
      - No preference
      required: true
    - id: 17
      name: audio_visual_needs
      label: Audio/Visual Equipment Needed
      hint: Select all that apply
      type: select_multiple
      options:
      - Projector
      - Screen
      - Microphone (wireless)
      - Microphone (wired)
      - Speakers
      - Laptop
      - Whiteboard
      - Flipchart
      - Video Conferencing
      - Recording Equipment
      - None needed
      required: true
    - id: 18
      name: catering_needed
      label: Do you need catering services?
      hint: Food and beverage options
      type: select_one
      options:
      - 'False'
      - Coffee and pastries
      - Lunch buffet
      - Snacks and beverages
      - Full catering service
      required: true
    - id: 19
      name: catering_details
      label: If yes, please specify catering needs
      hint: Dietary requirements, headcount, etc.
      type: text
      options: []
      required: false
    - id: 20
      name: parking_needed
      label: Will you need parking information?
      hint: For attendees
      type: select_one
      options:
      - 'False'
      - Yes, please send info
      required: false
    - id: 21
      name: accessibility_requirements
      label: Any accessibility requirements?
      hint: Accommodations needed
      type: text
      options: []
      required: false
    - id: 22
      name: budget_range
      label: What is your budget range?
      hint: For the venue rental
      type: select_one
      options:
      - Under $100
      - $100-$250
      - $251-$500
      - $501-$1,000
      - Over $1,000
      - Not sure
      required: false
    - id: 23
      name: previous_bookings
      label: Have you booked with us before?
      hint: Previous customer
      type: select_one
      options:
      - No, first time
      - Yes, once
      - Yes, multiple times
      required: true
    - id: 24
      name: how_heard_about
      label: How did you hear about our venue?
      hint: Referral source
      type: select_one
      options:
      - Website
      - Social Media
      - Friend or Colleague
      - Previous Event
      - Community Bulletin
      - Search Engine
      - Other
      required: false
    - id: 25
      name: special_requests
      label: Any special requests or requirements?
      hint: Additional needs
      type: text
      options: []
      required: false
    - id: 26
      name: booking_date
      label: Booking Request Date
      hint: Today's date
      type: date
      options: []
      required: true
