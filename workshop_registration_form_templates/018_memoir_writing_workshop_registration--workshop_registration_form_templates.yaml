inputSchema:
  type: object
  properties:
    title: Memoir Writing Workshop Registration
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_email
      label: participant_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: writing_level
      label: Writing Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 5
      name: session_preferences
      label: Session Preferences
      hint: null
      type: select_multiple
      options:
      - morning
      - afternoon
      - evening
      - weekend
      required: false
    - id: 6
      name: requirements
      label: Requirements
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: instructor_bio
      label: Instructor Bio
      hint: null
      type: note
      options: []
      required: false
