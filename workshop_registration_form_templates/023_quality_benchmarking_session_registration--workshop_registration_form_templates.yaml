inputSchema:
  type: object
  properties:
    title: Quality Benchmarking Session Registration
    pages:
    - id: 1
      name: participant_details
      label: Participant details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: topic_interests
      label: Topic interests
      hint: null
      type: select_multiple
      options:
      - quality improvement
      - benchmarking
      - other
      required: true
    - id: 3
      name: session_time
      label: Session time
      hint: null
      type: select_one
      options:
      - 9:00-11:00
      - 11:00-13:00
      - 13:00-15:00
      required: true
    - id: 4
      name: contact_info
      label: Contact info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
