inputSchema:
  type: object
  properties:
    title: Care Coordination Improvement Session Registration
    pages:
    - id: 1
      name: session_details
      label: -- Session Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name for registration
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Employer or affiliation
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: For session confirmation
      type: email
      options: []
      required: true
    - id: 5
      name: role
      label: Role or job title
      hint: Position related to care coordination
      type: text
      options: []
      required: false
    - id: 6
      name: session_date
      label: Session date
      hint: Select which session to attend
      type: date
      options: []
      required: true
    - id: 7
      name: dietary_restrictions
      label: Dietary restrictions
      hint: Indicate any special requirements
      type: text
      options: []
      required: false
    - id: 8
      name: accessibility_needs
      label: Accessibility needs
      hint: Request accommodations if needed
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact
      label: Emergency contact name and phone
      hint: For on site emergencies
      type: text
      options: []
      required: false
    - id: 10
      name: consent_to_share_contact
      label: Consent to share contact information with organizers
      hint: Allow sharing for coordination
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
