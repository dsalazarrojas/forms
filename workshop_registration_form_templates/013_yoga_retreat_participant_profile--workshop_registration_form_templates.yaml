inputSchema:
  type: object
  properties:
    title: Yoga Retreat Participant Profile
    pages:
    - id: 1
      name: full_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: conditions
      label: Conditions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: allergies
      label: Allergies
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: medical_devices
      label: Medical Devices
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: preferred_time
      label: Preferred Time
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: preferred_instructor
      label: Preferred Instructor
      hint: Please specify the instructor you would like to practice with
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: preferred_class_type
      label: Preferred Class Type
      hint: Please select the type of class you would like to practice with
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: yoga_style
      label: Yoga Style
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: yoga_level
      label: Yoga Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: true
    - id: 12
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
