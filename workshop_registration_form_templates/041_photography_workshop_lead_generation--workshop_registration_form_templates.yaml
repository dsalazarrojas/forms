inputSchema:
  type: object
  properties:
    title: Photography Workshop Lead Generation
    pages:
    - id: 1
      name: workshop_interest
      label: Are you interested in our workshops?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: workshop_name
      label: Workshop Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: workshop_date
      label: Workshop Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 4
      name: workshop_time
      label: Workshop Time
      hint: "HH:MM"
      type: time
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
