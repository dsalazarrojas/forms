      type: text
      options: []
      required: false
    - id: 14
      name: submission_date
      label: Submission date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: deadline
      label: Deadline
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: time
      label: Time
      hint: null
