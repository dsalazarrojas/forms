inputSchema:
  type: object
  properties:
    title: Civic Engagement Training Registration
    pages:
    - id: 1
      name: participant_name
      label: Participant name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: organization
      label: Organization
      hint: Employer or affiliation
      type: text
      options: []
      required: false
    - id: 3
      name: contact_email
      label: Contact email
      hint: For training materials and confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: training_date
      label: Training date
      hint: Choose preferred session
      type: date
      options: []
      required: true
    - id: 5
      name: role_in_community
      label: Role in community
      hint: Volunteer leader student staff etc
      type: text
      options: []
      required: false
    - id: 6
      name: accommodation_requirements
      label: Accommodation requirements
      hint: Accessibility dietary or other
      type: text
      options: []
      required: false
    - id: 7
      name: payment_status
      label: Payment status
      hint: Fee paid at registration or invoice
      type: select_one
      options:
      - Paid
      - Invoice
      - Waiver requested
      required: true
    - id: 8
      name: emergency_contact
      label: Emergency contact
      hint: Name and phone
      type: text
      options: []
      required: false
    - id: 9
      name: consent_for_photos
      label: Consent for photos during training
      hint: Allow photos to be used for materials
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: submission_date
      label: Submission date
      hint: Use current date
      type: date
      options: []
      required: true
