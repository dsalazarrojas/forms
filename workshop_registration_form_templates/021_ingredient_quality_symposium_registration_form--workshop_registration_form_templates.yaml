      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: position
      label: Position
      hint: null
      type: text
      options: []
      required: false
