      name: symposium_attendee
      label: Attendees (Symposium)
      hint: null
      type: select_multiple
      options:
      - Alice
      - Bob
      - Charlie
      - Dave
      required: false
    - id: 13
      name: other_info
      label: Other Information
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: terms_of_service
      label: Terms of Service
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
