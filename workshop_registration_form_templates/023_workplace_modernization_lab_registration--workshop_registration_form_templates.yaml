inputSchema:
  type: object
  properties:
    title: workplace_modernization_lab_registration
    pages:
    - id: 1
      name: form_title
      label: Form Title
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: interests
      label: Interests
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: preferred_session_time
      label: Preferred Session Time
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 6
      name: terms_agreement
      label: Terms Agreement
      hint: null
      type: select_one
      options:
      - I agree to the terms
      - I do not agree to the terms
      required: true
    - id: 7
      name: participant_agreement
      label: Participant Agreement
      hint: null
      type: select_one
      options:
      - I agree to the participant terms
      - I do not agree to the participant terms
      required: true
