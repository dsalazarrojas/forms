inputSchema:
  type: object
  properties:
    title: Butterfly Preservation Workshop Registration
    pages:
    - id: 1
      name: participant_first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email Address
      hint: Your email for workshop communications
      type: email
      options: []
      required: true
    - id: 4
      name: participant_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 5
      name: organization
      label: Organization Name
      hint: Your school, group, or organization
      type: text
      options: []
      required: false
    - id: 6
      name: participant_type
      label: Type of Participant
      hint: Select your participant category
      type: select_one
      options:
      - Student
      - Educator
      - Researcher
      - Community Member
      - Professional
      - Other
      required: true
    - id: 7
      name: experience_level
      label: Experience Level with Butterflies
      hint: Your knowledge level
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 8
      name: workshop_session
      label: Preferred Workshop Session
      hint: Select your preferred time slot
      type: select_one
      options:
      - Session 1 - Morning
      - Session 2 - Afternoon
      - Session 3 - Evening
      - Either Session
      required: true
    - id: 9
      name: registration_date
      label: Workshop Date
      hint: When will you attend
      type: date
      options: []
      required: true
    - id: 10
      name: special_interests
      label: Special Areas of Interest
      hint: Select topics of interest
      type: select_multiple
      options:
      - Monarch Butterflies
      - Habitat Conservation
      - Butterfly Gardening
      - Species Identification
      - Migration Patterns
      - Research Methods
      required: false
    - id: 11
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: For workshop meals
      type: text
      options: []
      required: false
    - id: 12
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any accommodations required
      type: text
      options: []
      required: false
    - id: 13
      name: group_size
      label: Group Size
      hint: How many people from your group
      type: number
      options: []
      required: true
    - id: 14
      name: group_members
      label: Names of Other Group Members
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 15
      name: transportation_needed
      label: Transportation Needed
      hint: Do you need transportation assistance
      type: select_one
      options:
      - 'False'
      - Yes, within city
      - Yes, from out of area
      required: true
    - id: 16
      name: waiver_agreement
      label: I agree to workshop waiver and policies
      hint: Must agree to participate
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
