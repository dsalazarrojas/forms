inputSchema:
  type: object
  properties:
    title: Translation Session Registration
    pages:
    - id: 1
      name: coordinator_info
      label: Coordinator Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: schedule
      label: Schedule
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: language_pair
      label: Language Pair
      hint: null
      type: select_multiple
      options:
      - ENGLISH
      - SPANISH
      - CHINESE
      - JAPANESE
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: Select your availability
      type: select_multiple
      options:
      - 09:00-10:00
      - 10:00-11:00
      - 11:00-12:00
      - 12:00-13:00
      - 13:00-14:00
      required: false
    - id: 6
      name: participant_email
      label: Participant Email
      hint: Participant Email
      type: email
      options: []
      required: false
    - id: 7
      name: participant_phone
      label: Participant Phone
      hint: Participant Phone
      type: number
      options: []
      required: false
    - id: 8
      name: note
      label: Coordinator Note
      hint: Coordinator Note
      type: note
      options: []
      required: false
