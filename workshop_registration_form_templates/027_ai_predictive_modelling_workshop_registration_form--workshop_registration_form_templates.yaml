inputSchema:
  type: object
  properties:
    title: AI Predictive Modelling Workshop Registration Form
    pages:
    - id: 1
      name: --attendee_information--
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Company or affiliation
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email address
      hint: Confirmation will be emailed
      type: email
      options: []
      required: true
    - id: 5
      name: experience_level
      label: Experience level with predictive modelling
      hint: Choose best match
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: true
    - id: 6
      name: programming_languages
      label: Programming languages familiar with
      hint: Select all that apply
      type: select_multiple
      options:
      - Python
      - R
      - SQL
      - Julia
      - None
      required: false
    - id: 7
      name: goals_for_workshop
      label: Goals for attending the workshop
      hint: Short description
      type: text
      options: []
      required: false
    - id: 8
      name: session_preference
      label: Session preference
      hint: Select one
      type: select_one
      options:
      - Morning
      - Afternoon
      - Both days
      required: true
    - id: 9
      name: dietary_restrictions
      label: Dietary restrictions
      hint: Leave blank if none
      type: text
      options: []
      required: false
    - id: 10
      name: accessibility_needs
      label: Accessibility needs
      hint: Any accommodations required
      type: text
      options: []
      required: false
