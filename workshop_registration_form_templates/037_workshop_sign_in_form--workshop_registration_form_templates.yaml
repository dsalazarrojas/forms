inputSchema:
  type: object
  properties:
    title: Workshop Sign In Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: attendee_type
      label: Attendee Type
      hint: null
      type: select_one
      options:
      - Participant
      - Presenter
      - Both
      required: false
    - id: 6
      name: workshop_id
      label: Workshop Id
      hint: null
      type: number
      options: []
      required: false
