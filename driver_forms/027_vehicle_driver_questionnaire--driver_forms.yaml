inputSchema:
  type: object
  properties:
    title: Vehicle Driver Questionnaire
    pages:
    - id: 1
      name: vehicle_make
      label: Vehicle Make
      hint: null
      type: select_multiple
      options:
      - Chevrolet
      - Ford
      - Toyota
      required: false
    - id: 2
      name: vehicle_year
      label: Vehicle Year
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: vehicle_model
      label: Vehicle Model
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: driver_license_number
      label: Driver License Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: violations
      label: Violations
      hint: null
      type: select_multiple
      options:
      - Moving violation
      - Parking violation
      - Reckless driving
      - Other
      required: false
    - id: 6
      name: incident_date
      label: Incident Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: incident_time
      label: Incident Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: driver_history
      label: Driver History
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: vehicle_color
      label: Vehicle Color
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: vehicle_year_of_production
      label: Vehicle Year Of Production
      hint: null
      type: number
      options: []
      required: false
