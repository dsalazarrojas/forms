inputSchema:
  type: object
  properties:
    title: Van Maintenance Checklist
    pages:
    - id: 1
      name: van_maintenance_checklist_1
      label: van_maintenance_checklist_1
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: oil_level
      label: check_oil_level
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: tire_tread_depth
      label: check_tire_tread_depth
      hint: null
      type: select_one
      options:
      - 1/4
      - 1/8
      - 1/16
      required: false
    - id: 4
      name: air_filter
      label: check_air_filter
      hint: null
      type: select_multiple
      options:
      - air filter 1
      - air filter 2
      - air filter 3
      required: false
    - id: 5
      name: battery_health
      label: check_battery_health
      hint: null
      type: select_one
      options:
      - good
      - fair
      - poor
      required: false
    - id: 6
      name: brake_system
      label: check_brake_system
      hint: null
      type: select_multiple
      options:
      - brake pads
      - brake rods
      - brake lines
      required: false
    - id: 7
      name: suspension_systems
      label: check_suspension_systems
      hint: null
      type: select_multiple
      options:
      - front bushings
      - front struts
      - rear shocks
      required: false
    - id: 8
      name: steering_system
      label: check_steering_system
      hint: null
      type: select_one
      options:
      - good
      - loose
      - faulty
      required: false
    - id: 9
      name: transmission_system
      label: check_transmission_system
      hint: null
      type: select_multiple
      options:
      - transmission oil
      - transmission filters
      - transmission flywheel
      required: false
    - id: 10
      name: electrical_system
      label: check_electrical_system
      hint: null
      type: select_one
      options:
      - good
      - faulty
      - not connected
      required: false
