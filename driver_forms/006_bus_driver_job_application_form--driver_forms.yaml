inputSchema:
  type: object
  properties:
    title: Bus Driver Job Application Form
    pages:
    - id: 1
      name: header
      label: -- Applicant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_full_name
      label: Applicant full name
      hint: Full legal name as shown on license
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact email
      hint: For application updates
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact phone
      hint: Best phone number to reach you
      type: text
      options: []
      required: true
    - id: 5
      name: license_number
      label: Driving license number
      hint: Include issuing state or country
      type: text
      options: []
      required: true
    - id: 6
      name: years_experience
      label: Years of driving experience
      hint: Whole number of years
      type: number
      options: []
      required: true
    - id: 7
      name: can_work_nights
      label: Able to work nights
      hint: Shift availability
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: willing_to_undergo_background_check
      label: Willing to undergo background check
      hint: Consent for checks
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Provide name and phone number
      type: text
      options: []
      required: true
    - id: 10
      name: resume_upload_instructions
      label: Resume upload instructions
      hint: Attach your resume via the employer portal after submission
      type: note
      options: []
      required: false
