inputSchema:
  type: object
  properties:
    title: Chauffeurs Survey
    pages:
    - id: 1
      name: section_driver_profile
      label: -- Driver Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: chauffeur_name
      label: Chauffeur Full Name
      hint: Optional for anonymous surveys
      type: text
      options: []
      required: false
    - id: 3
      name: years_experience
      label: Years of Chauffeur Experience
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: employment_status
      label: Current Employment Status
      hint: null
      type: select_one
      options:
      - Full-Time
      - Part-Time
      - Freelance / Contract
      required: true
    - id: 5
      name: section_satisfaction
      label: -- Job Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: overall_job_satisfaction
      label: Overall Job Satisfaction Rating
      hint: null
      type: select_one
      options:
      - 1 - Not Satisfied
      - 2 - Slightly Satisfied
      - 3 - Neutral
      - 4 - Satisfied
      - 5 - Highly Satisfied
      required: true
    - id: 7
      name: vehicle_maintenance_rating
      label: Satisfaction with Vehicle Maintenance
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 8
      name: compensation_satisfaction
      label: Do you feel your compensation is fair
      hint: Including tips and benefits
      type: select_one
      options:
      - true
      - Somewhat
      - false
      required: true
    - id: 9
      name: work_life_balance
      label: Satisfaction with Work-Life Balance
      hint: null
      type: select_one
      options:
      - 1 - Very Poor
      - 2 - Poor
      - 3 - Good
      - 4 - Very Good
      - 5 - Excellent
      required: true
    - id: 10
      name: section_work_env
      label: -- Work Environment --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: dispatch_comm_rating
      label: Quality of Communication with Dispatch
      hint: null
      type: select_one
      options:
      - Excellent
      - Above Average
      - Average
      - Below Average
      required: true
    - id: 12
      name: safety_concerns
      label: Do you have any safety concerns while on duty
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: client_behavior_summary
      label: Typical Client Professionalism Rating
      hint: null
      type: select_one
      options:
      - Very Professional
      - Professional
      - Sometimes Unprofessional
      - Often Unprofessional
      required: true
    - id: 14
      name: section_growth
      label: -- Future and Growth --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: training_needs
      label: Training or Development Desired
      hint: e.g. defensive driving, customer service
      type: text
      options: []
      required: false
    - id: 16
      name: improvement_suggestions
      label: Key Suggestions for Service Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: survey_date
      label: Date of Submission
      hint: null
      type: date
      options: []
      required: true
