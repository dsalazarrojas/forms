inputSchema:
  type: object
  properties:
    title: Personal Training Client Intake Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: height
      label: Height
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: weight
      label: Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: fitness_goals
      label: Fitness goals
      hint: null
      type: select_one
      options:
      - Weight loss
      - Muscle gain
      - Cardiovascular health
      required: false
    - id: 9
      name: exercise_preferences
      label: Exercise preferences
      hint: null
      type: select_multiple
      options:
      - Running
      - Cycling
      - Swimming
      required: false
    - id: 10
      name: medical_conditions
      label: Medical conditions
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: emergency_contact
      label: Emergency contact
      hint: null
      type: select_multiple
      options:
      - Spouse
      - Family member
      - Emergency contact
      required: false
    - id: 12
      name: emergency_contact_relationship
      label: Relationship to emergency contact
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: insurance_provider
      label: Insurance provider
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
