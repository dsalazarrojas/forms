description: A survey to gather feedback on the product onboarding experience and
  training process.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with your overall product onboarding experience?
  type: single
- options:
  - Very easy
  - Easy
  - Neutral
  - Difficult
  - Very difficult
  text: How easy was it to understand and apply the training materials provided during
    onboarding?
  type: single
- options:
  - Guided product tour
  - Documentation/guides
  - Video tutorials
  - Live training sessions
  - Support team assistance
  text: Which aspects of the onboarding were most helpful to you? (select all that
    apply)
  type: multiple
- options:
  - true
  - Mostly
  - Not really
  - false
  text: Do you feel confident using the product independently after completing the
    onboarding?
  type: single
- text: What specific improvements would you suggest for the product onboarding process?
  type: text
- text: Do you have any additional comments or feedback regarding your onboarding?
  type: text
title: Product onboarding form
