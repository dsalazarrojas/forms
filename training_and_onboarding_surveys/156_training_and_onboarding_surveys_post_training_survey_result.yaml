title: Post-training survey
description: Generate a Post-training survey survey for the "Training and onboarding surveys" category. Use the template name: "Post-training survey template".
questions:
  - text: Overall, how satisfied are you with post-training survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Post, Training, Survey, And]
  - text: How often do you interact with post-training survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
