title: Online course
description: Generate a Online course survey for the "Training and onboarding surveys" category. Use the template name: "Online course template".
questions:
  - text: Overall, how satisfied are you with online course?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Online, Course, Training, And]
  - text: How often do you interact with online course?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
