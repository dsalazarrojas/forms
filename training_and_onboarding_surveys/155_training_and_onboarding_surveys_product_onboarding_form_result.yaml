title: Product onboarding form
description: Generate a Product onboarding form survey for the "Training and onboarding surveys" category. Use the template name: "Product onboarding form template".
questions:
  - text: Overall, how satisfied are you with product onboarding form?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Product, Onboarding, Form, Training]
  - text: How often do you interact with product onboarding form?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
