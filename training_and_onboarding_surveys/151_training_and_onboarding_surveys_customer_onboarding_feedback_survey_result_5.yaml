title: Customer onboarding feedback survey
description: Generate a Customer onboarding feedback survey survey for the "Training and onboarding surveys" category. Use the template name: "Customer onboarding feedback survey template".
questions:
  - text: Overall, how satisfied are you with customer onboarding feedback survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Customer, Onboarding, Feedback, Survey]
  - text: How often do you interact with customer onboarding feedback survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
