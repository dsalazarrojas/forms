title: Employee orientation survey
description: Generate a Employee orientation survey survey for the "Training and onboarding surveys" category. Use the template name: "Employee orientation survey template".
questions:
  - text: Overall, how satisfied are you with employee orientation survey?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Employee, Orientation, Survey, Training]
  - text: How often do you interact with employee orientation survey?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
