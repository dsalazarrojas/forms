title: Staff induction form
description: Generate a Staff induction form survey for the "Training and onboarding surveys" category. Use the template name: "Staff induction form template".
questions:
  - text: Overall, how satisfied are you with staff induction form?
    type: single
    options: [Very satisfied, Somewhat satisfied, Neutral, Somewhat dissatisfied, Very dissatisfied]
  - text: Which of the following did you use? (select all that apply)
    type: multiple
    options: [Staff, Induction, Form, Training]
  - text: How often do you interact with staff induction form?
    type: single
    options: [Daily, Weekly, Monthly, Rarely, Never]
  - text: What would you improve about it?
    type: text
  - text: Any additional comments or suggestions?
    type: text
