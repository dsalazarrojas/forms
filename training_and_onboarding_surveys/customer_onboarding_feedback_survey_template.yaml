description: Gathering feedback on the customer onboarding experience to improve future
  training and support.
questions:
- options:
  - Very satisfied
  - Somewhat satisfied
  - Neutral
  - Somewhat dissatisfied
  - Very dissatisfied
  text: How satisfied are you with the overall customer onboarding process?
  type: single
- options:
  - Product demo
  - Setup guide
  - Welcome emails
  - Support contact
  - Knowledge base
  - Live training sessions
  text: Which aspects of the onboarding process did you find most valuable? (Select
    all that apply)
  type: multiple
- options:
  - true
  - Mostly
  - Neutral
  - Not really
  - false
  text: Was the onboarding process clear and easy to follow?
  type: single
- options:
  - Very confident
  - Moderately confident
  - Neutral
  - Slightly uncertain
  - Not confident at all
  text: How confident do you feel using our product after completing the onboarding?
  type: single
- text: Do you have any suggestions for improving the onboarding experience?
  type: text
- text: What information or resources do you feel were missing from the onboarding
    process?
  type: text
title: Customer onboarding feedback survey
