description: Gathering feedback on the initial employee orientation and onboarding
  experience.
questions:
- options:
  - Very satisfied
  - Satisfied
  - Neutral
  - Dissatisfied
  - Very dissatisfied
  text: How satisfied were you with the overall employee orientation program?
  type: single
- options:
  - Excellent
  - Good
  - Fair
  - Poor
  text: How would you rate the usefulness of the information provided during orientation?
  type: single
- options:
  - Company culture
  - Job responsibilities
  - Benefits & HR
  - IT setup
  - Safety procedures
  - Team introductions
  text: Which of the following topics were covered effectively during orientation?
    (select all that apply)
  type: multiple
- options:
  - true
  - Mostly
  - Somewhat
  - Not yet
  text: Do you feel adequately supported as a new employee after orientation?
  type: single
- text: What one thing could significantly improve the employee orientation experience?
  type: text
- text: Do you have any additional comments or suggestions regarding your onboarding?
  type: text
title: Employee orientation survey
