inputSchema:
  type: object
  properties:
    title: Stripe ACH Hotel Reservation Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: checkin
      label: Checkin
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: checkout
      label: Checkout
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Stripe
      - Bank Account
      required: true
    - id: 9
      name: confirm_payment
      label: Confirm Payment
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: confirm_terms
      label: Confirm Terms and Conditions
      hint: null
      type: select_one
      options:
      - Agree
      - Decline
      required: true
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
