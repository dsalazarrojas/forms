inputSchema:
  type: object
  properties:
    title: Stripe Sponsor Donation Form
    pages:
    - id: 1
      name: donation_amount
      label: Donation Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: donor_name
      label: Donor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: E-Mail
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Stripe
      - PayPal
      - Bank Transfer
      required: false
    - id: 6
      name: payment_details
      label: Payment Details
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: submit_payment
      label: Submit Payment
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
