    - id: 5
      name: shipping_address
      label: Shipping Address
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: shipping_city
      label: Shipping City
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: shipping_state
      label: Shipping State
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: shipping_zip
      label: Shipping Zip
      hint: null
      type: text
      options: []
      required: false
