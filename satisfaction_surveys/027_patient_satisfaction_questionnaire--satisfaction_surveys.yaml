inputSchema:
  type: object
  properties:
    title: patient_satisfaction_questionnaire
    pages:
    - id: 1
      name: patient_info
      label: 1. Form Intro
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: question_1
      label: 2. Patient Contact Info
      hint: null
      type: select_one
      options:
      - Patient Contact Info
      - Family Member Contact Info
      - Healthcare Provider Contact Info
      required: true
    - id: 3
      name: question_2
      label: 3. How likely are you to recommend this healthcare provider?
      hint: null
      type: select_multiple
      options:
      - Very Likely
      - Somewhat Likely
      - Not Very Likely
      - Not at All Likely
      required: false
    - id: 4
      name: question_3
      label: 4. How satisfied are you with the care you received?
      hint: null
      type: select_multiple
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
    - id: 5
      name: question_4
      label: 5. How likely are you to use this healthcare provider again?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Not Very Likely
      - Not at All Likely
      required: false
    - id: 6
      name: question_5
      label: 6. What was the primary reason for your visit?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: question_6
      label: 7. How would you rate the communication with your healthcare provider?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 8
      name: question_7
      label: 8. What time of day do you prefer for your appointment schedule?
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 9
      name: question_8
      label: 9. How would you rate the waiting time prior to your visit?
      hint: null
      type: select_multiple
      options:
      - Less than 15 minutes
      - 16-30 minutes
      - 31-60 minutes
      - More than 1 hour
      required: false
    - id: 10
      name: question_9
      label: 10. Would you like to be contacted by the healthcare provider for any
        reason?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: question_10
      label: 11. Is there anything else you would like to add?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: question_11
      label: 12. How likely are you to recommend this healthcare service to others?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Not Very Likely
      - Not at All Likely
      required: false
    - id: 13
      name: question_12
      label: 13. How would you rate the overall experience?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 14
      name: question_13
      label: 14. Thank you for taking the time to share your feedback!
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: question_14
      label: 15. Additional comments
      hint: null
      type: text
      options: []
      required: false
