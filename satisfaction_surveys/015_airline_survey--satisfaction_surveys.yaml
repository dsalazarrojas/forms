inputSchema:
  type: object
  properties:
    title: Airline Survey
    pages:
    - id: 1
      name: full_name
      label: Passenger Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 2
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: flight_number
      label: Flight Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_travel
      label: Date of Travel
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: cabin_class
      label: Cabin Class
      hint: null
      type: select_one
      options:
      - Economy
      - Premium Economy
      - Business
      - First Class
      required: true
    - id: 6
      name: section_booking
      label: -- Booking and Check-in Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: booking_ease
      label: Ease of Booking Process
      hint: 1 being Difficult, 5 being Easy
      type: number
      options: []
      required: true
    - id: 8
      name: check_in_experience
      label: Check-in and Boarding Experience
      hint: 1 being Poor, 5 being Excellent
      type: number
      options: []
      required: true
    - id: 9
      name: section_inflight
      label: -- In-flight Service Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: crew_friendliness
      label: Friendliness and Professionalism of Crew
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: inflight_meals
      label: Quality of Food and Beverages
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: seat_comfort
      label: Comfort of Seating
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: cabin_cleanliness
      label: Cleanliness of the Aircraft
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: entertainment_quality
      label: Quality of In-flight Entertainment
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: baggage_handling
      label: Efficiency of Baggage Delivery
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: overall_satisfaction
      label: Overall Satisfaction with Airline
      hint: null
      type: number
      options: []
      required: true
    - id: 17
      name: net_promoter_score
      label: How likely are you to recommend this airline?
      hint: 0 (Not at all likely) to 10 (Extremely likely)
      type: number
      options: []
      required: true
    - id: 18
      name: final_comments
      label: Do you have any additional feedback or comments?
      hint: null
      type: text
      options: []
      required: false
