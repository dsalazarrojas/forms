inputSchema:
  type: object
  properties:
    title: Volunteer Satisfaction Survey
    pages:
    - id: 1
      name: volunteer_satisfaction_survey
      label: How would you rate the overall project satisfaction?
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: project_satisfaction
      label: How satisfied are you with project communication?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 3
      name: volunteer_experience
      label: How satisfied are you with your role/position within the project?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 4
      name: project_communication_issues
      label: Have you had any issues with project communication?
      hint: null
      type: select_multiple
      options:
      - No issues
      - Difficulty understanding instructions
      - Unresponsive team members
      - Other
      required: true
    - id: 5
      name: improve_project_communication
      label: What do you think is the most valuable thing that we could do to improve
        project communication?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: volunteer_satisfaction_improvement
      label: What do you think is the most valuable thing that we could do to improve
        your role/position within the project?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: overall_satisfaction
      label: How satisfied are you with the overall project process?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: project_efficiency
      label: What do you think we could do to make the project more efficient?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: project_comments
      label: What do you like or dislike about the project?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: participation_goal
      label: What is the main reason for your participation in this project?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: involvement_alignment
      label: Do you think your involvement in this project aligns with your personal
        goals?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Undecided
      required: true
    - id: 12
      name: future_participation
      label: How likely are you to participate in future projects like this?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Undecided
      - Not Likely
      - Very Unlikely
      required: true
