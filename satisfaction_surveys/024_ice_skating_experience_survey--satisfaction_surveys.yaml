inputSchema:
  type: object
  properties:
    title: Ice Skating Experience Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: skating_experience
      label: skating experience
      hint: null
      type: select_one
      options:
      - '{''value'': ''Very dissatisfied''}'
      - '{''value'': ''Somewhat dissatisfied''}'
      - '{''value'': ''Neutral''}'
      - '{''value'': ''Somewhat satisfied''}'
      - '{''value'': ''Very satisfied''}'
      required: false
    - id: 3
      name: skating_frequency
      label: how often do you go ice skating
      hint: null
      type: select_one
      options:
      - '{''value'': ''Rarely''}'
      - '{''value'': ''Occasionaly''}'
      - '{''value'': ''Frequently''}'
      - '{''value'': ''Almost always''}'
      required: false
    - id: 4
      name: skater_type
      label: type of skater
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Recreational Skater''}'
      - '{''value'': ''Competitive Skater''}'
      - '{''value'': ''Recreational/Competitive Skater''}'
      required: true
    - id: 5
      name: skating_frequency_other
      label: other_skating_frequency
      hint: Please describe your skating frequency
      type: text
      options: []
      required: false
    - id: 6
      name: satisfaction
      label: prophets satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: what_are_your_goals_for_skating
      label: what are your goals for skating
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Improve my skills''}'
      - '{''value'': ''Get faster''}'
      - '{''value'': ''Have fun''}'
      - '{''value'': ''Meet new people''}'
      required: true
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: true
