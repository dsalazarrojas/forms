inputSchema:
  type: object
  properties:
    title: Anonymous Feedback Form
    pages:
    - id: 1
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: 1 is very dissatisfied, 5 is very satisfied
      type: number
      options: []
      required: true
    - id: 2
      name: recommend_likelihood
      label: How likely are you to recommend our services to others?
      hint: 0 to 10 scale
      type: number
      options: []
      required: true
    - id: 3
      name: service_quality
      label: Quality of Service
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Excellent
      - Superior
      required: true
    - id: 4
      name: timeliness
      label: Timeliness of Response
      hint: null
      type: select_one
      options:
      - Very Slow
      - Slow
      - Average
      - Fast
      - Instant
      required: true
    - id: 5
      name: key_strengths
      label: What are our key strengths?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: improvement_areas
      label: What areas need improvement?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: ease_of_use
      label: How easy was it to use our platform?
      hint: null
      type: select_one
      options:
      - Very Difficult
      - Difficult
      - Neutral
      - Easy
      - Very Easy
      required: true
    - id: 8
      name: specific_feedback
      label: Any other specific feedback or comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: future_features
      label: What features would you like to see in the future?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: usage_frequency
      label: How often do you use our services?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: false
