inputSchema:
  type: object
  properties:
    title: Utility Service Satisfaction Survey
    pages:
    - id: 1
      name: service_satisfaction
      label: How would you rate the service overall
      hint: 'Scale: 0-100'
      type: number
      options: []
      required: true
    - id: 2
      name: service_reliability
      label: Service reliability
      hint: How likely are you to recommend
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Not Likely
      - Not at All Likely
      required: false
    - id: 3
      name: service_quality
      label: Service quality
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
