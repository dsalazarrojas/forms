inputSchema:
  type: object
  properties:
    title: private_jet_grooming_feedback_form
    pages:
    - id: 1
      name: introduction_page
      label: Introduction
      hint: Please share your experience with our private jet grooming service.
      type: note
      options: []
      required: false
    - id: 2
      name: cleanliness_ratings
      label: Cleanliness Ratings
      hint: Rate the cleanliness of our private jet.
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 3
      name: cleanliness_score
      label: Cleanliness Score
      hint: Rate the cleanliness of our private jet on a scale of 1-10.
      type: number
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: Enter your email address for us to contact you.
      type: email
      options: []
      required: true
    - id: 5
      name: comments
      label: Comments
      hint: Share your thoughts about our service.
      type: text
      options: []
      required: false
    - id: 6
      name: name
      label: Name
      hint: Enter your name for verification purposes.
      type: text
      options: []
      required: true
    - id: 7
      name: confirm_cleanliness_ratings
      label: Confirm Cleanliness Ratings
      hint: Confirm your cleanliness ratings above.
      type: select_one
      options:
      - Good
      - Fair
      required: true
    - id: 8
      name: confirm_cleanliness_score
      label: Confirm Cleanliness Score
      hint: Confirm the cleanliness score you provided above.
      type: number
      options: []
      required: true
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: Share any additional comments or concerns.
      type: text
      options: []
      required: false
    - id: 10
      name: submit_button
      label: Submit
      hint: Complete the feedback form.
      type: text
      options: []
      required: false
    - id: 11
      name: final_comments
      label: Final Comments
      hint: Leave any final comments or suggestions.
      type: text
      options: []
      required: false
    - id: 12
      name: repeat_name_and_email
      label: Confirm Your Information
      hint: Confirm your name and email address.
      type: note
      options: []
      required: false
