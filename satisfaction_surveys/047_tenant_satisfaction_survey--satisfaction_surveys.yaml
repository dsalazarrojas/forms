      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: lease_start_date
      label: Lease start date?
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: lease_end_date
      label: Lease end date?
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: move_in_date
