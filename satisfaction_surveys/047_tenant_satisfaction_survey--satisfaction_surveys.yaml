inputSchema:
  type: object
  properties:
    title: Tenant Satisfaction Survey
    pages:
    - id: 1
      name: living_spaces
      label: What do you think about your living space?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: lease_renewal
      label: How likely are you to renew your lease?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: overall_satisfaction
      label: How satisfied are you with your living space?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: communication
      label: How would you rate the communication with the property owner?
      hint: null
      type: select_multiple
      options:
      - Good
      - Fair
      required: true
    - id: 5
      name: maintenance_issues
      label: Have you experienced any maintenance issues?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: recommendations
      label: Do you have any recommendations for the property owner?
      hint: null
      type: note
      options: []
      required: true
    - id: 7
      name: additional_comments
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: tenant_info
