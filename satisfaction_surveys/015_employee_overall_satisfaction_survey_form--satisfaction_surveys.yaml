inputSchema:
  type: object
  properties:
    title: employee_overall_satisfaction_survey_form
    pages:
    - id: 1
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: mission_understanding
      label: how_well_do_you_understand_our_mission
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: recommend_company
      label: would_you_recommend_company_to_someone
      hint: null
      type: select_multiple
      options:
      - I strongly agree
      - I somewhat agree
      - I neither agree nor disagree
      - I somewhat disagree
      - I strongly disagree
      - None
      required: true
    - id: 4
      name: additional_comments
      label: additional_comments
      hint: null
      type: note
      options: []
      required: false
