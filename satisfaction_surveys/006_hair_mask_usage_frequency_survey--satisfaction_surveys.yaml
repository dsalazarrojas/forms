inputSchema:
  type: object
  properties:
    title: Hair Mask Usage Frequency Survey
    pages:
    - id: 1
      name: hair_mask_usage_frequency
      label: How often do you use hair masks?
      hint: null
      type: select_one
      options:
      - Never
      - Less than once a week
      - Once a week
      - Several times a week
      - Every day
      required: true
    - id: 2
      name: satisfaction
      label: How satisfied are you with the hair mask?
      hint: null
      type: select_one
      options:
      - Very dissatisfied
      - Dissatisfied
      - Neutral
      - Satisfied
      - Very satisfied
      required: true
    - id: 3
      name: hair_mask_preferences
      label: What are your hair mask preferences?
      hint: null
      type: select_multiple
      options:
      - Natural ingredients
      - Moisturizing
      - Color protecting
      - Hydrating
      - Other (please specify)
      required: false
    - id: 4
      name: other_preferences
      label: Other preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: note
      label: Additional comments
      hint: null
      type: note
      options: []
      required: false
