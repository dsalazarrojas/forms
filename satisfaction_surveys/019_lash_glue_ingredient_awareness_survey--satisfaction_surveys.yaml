      options:
      - Mild
      - Moderate
      - Severe
      required: true
    - id: 4
      name: information_source
      label: information_source
      hint: null
      type: select_multiple
      options:
      - Salon
      - Brand website
      - Social media
      - Google
      - Other
      - None
      required: true
    - id: 5
      name: other
      label: other
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: true
