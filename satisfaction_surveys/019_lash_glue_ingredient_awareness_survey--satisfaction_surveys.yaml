      name: introduction
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: ingredient_knowledge
      label: ingredient_knowledge
      hint: null
      type: select_multiple
      options:
      - Acrylic
      - Cyanoacrylate
      - Cyanoacrylate-based
      - Latex
      - Lash
      - Polyurethane-based
      - Polyvinylpyrrolidone-based
      - Polyvinylpyrrolidone
