      hint: null
      type: select_one
      options:
      - Well-stocked
      - Moderately stocked
      - Poorly stocked
      required: false
    - id: 11
      name: music_and_sound_system
      label: Music and Sound System
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 12
      name: temperature_and_air
      label: Temperature and Air Quality
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 13
      name: water_and_shower
