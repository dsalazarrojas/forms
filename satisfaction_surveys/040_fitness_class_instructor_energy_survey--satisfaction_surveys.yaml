inputSchema:
  type: object
  properties:
    title: Fitness Class Instructor Energy Survey
    pages:
    - id: 1
      name: instructor_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: instructor_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: instructor_phone
      label: Phone
      hint: Your phone number (including area code)
      type: text
      options: []
      required: false
    - id: 4
      name: favorite_instructor
      label: favorite_instructor
      hint: null
      type: select_one
      options:
      - Love them
      - Like them
      - Neutral
      - Dislike them
      - Hate them
      required: false
    - id: 5
      name: instructor_attitude
      label: How would you rate the instructor's attitude?
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Unsure
      required: false
    - id: 6
      name: energy_level
      label: Energy Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: instruction_quality
      label: Instructional Quality
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: communication_effectiveness
      label: Communication Effectiveness
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      - Unsure
      required: false
    - id: 9
      name: class_environment
      label: Class Environment
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      - Unsure
      required: false
    - id: 10
      name: equipment_and_supplies
