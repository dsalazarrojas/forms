inputSchema:
  type: object
  properties:
    title: Community Recreation Participation Survey
    pages:
    - id: 1
      name: respondent_info
      label: Respondent Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: last_name
      label: Last Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email Address
      hint: For follow-up
      type: email
      options: []
      required: false
    - id: 5
      name: zip_code
      label: ZIP Code
      hint: Where you live
      type: text
      options: []
      required: true
    - id: 6
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - Under 18
      - 18-24
      - 25-34
      - 35-44
      - 45-54
      - 55-64
      - 65+
      required: true
    - id: 7
      name: household_composition
      label: Household Composition
      hint: Select all that apply
      type: select_multiple
      options:
      - Single Adult
      - Married or Partnered
      - Children Under 18
      - Teenagers
      - Senior Adults
      - Extended Family
      required: true
    - id: 8
      name: participation_info
      label: Participation Information
      hint: Your recreation activities
      type: note
      options: []
      required: false
    - id: 9
      name: current_activities
      label: Current Recreation Activities
      hint: Select all that apply
      type: select_multiple
      options:
      - Sports Leagues
      - Fitness Classes
      - Swimming
      - Walking or Running
      - Cycling
      - Team Sports
      - Individual Sports
      - Outdoor Activities
      - Arts and Crafts
      - Social Events
      - None Currently
      required: true
    - id: 10
      name: frequency
      label: How Often Do You Participate
      hint: null
      type: select_one
      options:
      - Daily
      - Several Times a Week
      - Once a Week
      - 2-3 Times a Month
      - Once a Month
      - Rarely
      - Never
      required: true
    - id: 11
      name: facilities_used
      label: Facilities You Use
      hint: Select all that apply
      type: select_multiple
      options:
      - Community Center
      - Parks
      - Sports Fields
      - Swimming Pool
      - Fitness Center
      - Tennis Courts
      - Basketball Courts
      - Walking Trails
      - Playgrounds
      - None
      required: true
    - id: 12
      name: satisfaction_ratings
      label: Satisfaction Ratings
      hint: Rate the following
      type: note
      options: []
      required: false
    - id: 13
      name: overall_satisfaction
      label: Overall Satisfaction with Recreation Options
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 14
      name: facility_quality
      label: Quality of Facilities
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: program_variety
      label: Variety of Programs
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 16
      name: accessibility
      label: Accessibility of Programs
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 17
      name: value
      label: Value for Cost
      hint: null
      type: select_one
      options:
      - Excellent
      - Very Good
      - Good
      - Fair
      - Poor
      - Not Applicable
      required: true
    - id: 18
      name: barriers
      label: Barriers to Participation
      hint: Select all that apply
      type: select_multiple
      options:
      - Cost
      - Lack of Time
      - Lack of Information
      - Transportation
      - Accessibility Issues
      - Lack of Childcare
      - Programs Not Offered
      - Schedule Conflicts
      - Health Limitations
      - None
      required: true
    - id: 19
      name: interest_activities
      label: Activities You Would Like to See
      hint: Select all that apply
      type: select_multiple
      options:
      - Yoga or Pilates
      - Strength Training
      - Dance Classes
      - Martial Arts
      - Swimming Lessons
      - Team Sports
      - Running Clubs
      - Cycling Groups
      - Senior Programs
      - Youth Programs
      - Adaptive Programs
      - Outdoor Adventures
      - Arts Programs
      - Other
      required: true
    - id: 20
      name: preferred_times
      label: Preferred Times for Activities
      hint: Select all that apply
      type: select_multiple
      options:
      - Early Morning (6am-9am)
      - Mid-Morning (9am-12pm)
      - Afternoon (12pm-5pm)
      - Evening (5pm-9pm)
      - Weekends
      required: true
    - id: 21
      name: willing_pay
      label: What Would You Pay for Quality Programs
      hint: Per session
      type: select_one
      options:
      - Free Only
      - $1-$5
      - $5-$10
      - $10-$20
      - $20+
      required: true
    - id: 22
      name: membership_interest
      label: Would You Purchase a Membership
      hint: For unlimited access
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 23
      name: volunteer_interest
      label: Would You Like to Volunteer
      hint: Help with recreation programs
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 24
      name: communication_preference
      label: How Do You Prefer to Receive Information
      hint: null
      type: select_one
      options:
      - Email
      - Social Media
      - Mail
      - Phone
      - Website
      - Mobile App
      required: true
    - id: 25
      name: additional_comments
      label: Additional Comments or Suggestions
      hint: Share your ideas
      type: text
      options: []
      required: false
