inputSchema:
  type: object
  properties:
    title: Handbag Sewing Interest Survey
    pages:
    - id: 1
      name: user_details
      label: User Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: workshop_frequency
      label: What is your workshop frequency?
      hint: null
      type: select_one
      options:
      - Once a month
      - 2-3 times a month
      - Weekly
      - Daily
      required: false
    - id: 3
      name: preferred_techniques
      label: What techniques do you want to learn?
      hint: null
      type: select_multiple
      options:
      - handbag design
      - pattern making
      - bag construction
      - embellishment
      - pattern alteration
      required: false
    - id: 4
      name: schedule_preference
      label: When do you prefer to schedule your classes?
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 5
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
