inputSchema:
  type: object
  properties:
    title: Nail Polish Drying Device Usage Survey
    pages:
    - id: 1
      name: device_type
      label: Which nail polish drying device do you use?
      hint: null
      type: select_one
      options:
      - Nail Polish Dryer
      - LED Lamp
      - Fan
      - Other
      required: true
    - id: 2
      name: usage_frequency
      label: How often do you use a nail polish drying device?
      hint: null
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Rarely
      - Never
      required: true
    - id: 3
      name: satisfaction
      label: How satisfied are you with the nail polish drying devices you use?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 4
      name: issue_type
      label: Which type of issue do you usually encounter with your nail polish drying
        device?
      hint: null
      type: select_multiple
      options:
      - Speed
      - Temperature
      - Power
      - Other
      required: true
    - id: 5
      name: issue_description
      label: Please describe the issue with your nail polish drying device
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: brand
      label: Which nail polish drying device brand do you use?
      hint: null
      type: select_one
      options:
      - Brand A
      - Brand B
      - Brand C
      - Other
      required: true
    - id: 7
      name: user_experience
      label: How would you rate your user experience with the nail polish drying device?
      hint: null
      type: select_one
      options:
      - Very Positive
      - Somewhat Positive
      - Neutral
      - Somewhat Negative
      - Very Negative
      required: true
