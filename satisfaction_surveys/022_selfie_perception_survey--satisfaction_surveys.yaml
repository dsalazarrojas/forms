inputSchema:
  type: object
  properties:
    title: Selfie Perception Survey
    pages:
    - id: 1
      name: selfie_habits
      label: Selfie Habits
      hint: null
      type: select_multiple
      options:
      - Frequent
      - Occasionally
      - Rarely
      - Never
      required: true
    - id: 2
      name: selfie_reason
      label: Why Do You Take Selfies
      hint: null
      type: select_multiple
      options:
      - To feel good
      - To share with friends
      - To document memories
      - Other, please specify
      required: true
    - id: 3
      name: selfie_device
      label: What Device Do You Use To Take Selfies
      hint: null
      type: select_one
      options:
      - Mobile
      - Camera
      - Computer
      - Other, please specify
      required: true
    - id: 4
      name: selfie_location
      label: Where Do You Take Selfies
      hint: null
      type: select_multiple
      options:
      - At home
      - At work
      - On vacation
      - Other, please specify
      required: true
    - id: 5
      name: selfie_image
      label: What Image Do You Use For Selfie
      hint: null
      type: select_multiple
      options:
      - A picture of myself
      - A picture of my friends
      - A picture of my family
      - Other, please specify
      required: true
    - id: 6
      name: selfie_share
      label: How Do You Share Selfies
      hint: null
      type: select_multiple
      options:
      - Facebook
      - Instagram
      - Twitter
      - Other, please specify
      required: true
    - id: 7
      name: selfie_view
      label: How Do You View Yourself In Selfies
      hint: null
      type: select_multiple
      options:
      - Confident
      - Self-conscious
      - Average
      - Other, please specify
      required: true
    - id: 8
      name: selfie_perception
      label: How Do You Perceive Yourself In Selfies
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      - Other, please specify
      required: true
    - id: 9
      name: selfie_frequency
      label: How Many Selfies Do You Take Per Week
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: selfie_average_time
      label: Average Time Spent On Selfies
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: selfie_frequency_of_taken_selfies
      label: Average Number Of Selfies Taken Per Week
      hint: null
      type: number
      options: []
      required: false
    - id: 12
      name: selfie_feeling
      label: How Do You Feel When You Take Selfies
      hint: null
      type: select_multiple
      options:
      - Happy
      - Bored
      - Anxious
      - Other, please specify
      required: true
    - id: 13
      name: selfie_sharing
      label: Selfie Sharing
      hint: null
      type: select_multiple
      options:
      - Facebook
      - Instagram
      - Twitter
      - Other, please specify
      required: true
    - id: 14
      name: selfie_perceiving
      label: How Do You Perceive Selfies
      hint: null
      type: select_multiple
      options:
      - Positive
      - Negative
      - Neutral
      - Other, please specify
      required: true
    - id: 15
      name: selfie_device_used
      label: Selfie Device Used
      hint: null
      type: select_one
      options:
      - Mobile
      - Camera
      - Computer
      - Other, please specify
      required: true
    - id: 16
      name: selfie_location_taken
      label: Selfie Location Taken
      hint: null
      type: select_multiple
      options:
      - At home
      - At work
      - On vacation
      - Other, please specify
      required: true
    - id: 17
      name: selfie_image_used
      label: Selfie Image Used
      hint: null
      type: select_multiple
      options:
      - A picture of myself
      - A picture of my friends
      - A picture of my family
      - Other, please specify
      required: true
    - id: 18
      name: selfie_sharing_selfies
      label: Selfie Sharing Selfies
      hint: null
      type: select_multiple
      options:
      - Facebook
      - Instagram
      - Twitter
      - Other, please specify
      required: true
