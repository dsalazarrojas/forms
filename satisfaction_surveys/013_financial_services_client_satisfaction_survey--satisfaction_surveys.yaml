inputSchema:
  type: object
  properties:
    title: Financial Services Client Satisfaction Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: true
    - id: 2
      name: client_name
      label: Client Name
      hint: Please enter your name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Client Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: branch
      label: Branch
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: question1
      label: How satisfied are you with our service?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: question2
      label: What was the main reason for your interaction with us?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: question3
      label: How likely are you to recommend us to a friend or colleague?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: suggestion
      label: Do you have any suggestions or recommendations?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: submission_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: submission_status
      label: Submission Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 12
      name: client_feedback
      label: Client Feedback
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
