inputSchema:
  type: object
  properties:
    title: Nail Strength Serum Testing Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: nail_strength_serum_use
      label: nailStrengthSerumUse
      hint: null
      type: select_one
      options:
      - Less than 1 time
      - 1-2 times
      - 3 or more times
      required: false
    - id: 3
      name: nail_strength_serum_effectiveness
      label: nailStrengthSerumEffectiveness
      hint: null
      type: select_multiple
      options:
      - Very Good
      - Good
      - Fair
      required: false
    - id: 4
      name: nail_strengthening
      label: nailStrengthening
      hint: Please rate the level of nail strengthening you felt after using the serum.
      type: select_one
      options:
      - Very Strong
      - Strong
      - Medium
      - Weak
      - None
      required: false
    - id: 5
      name: nail_clipping
      label: nailClipping
      hint: How many times have you had to clip your nails since using the serum?
      type: select_one
      options:
      - Less than 5 times
      - 5-10 times
      - 10-20 times
      - 20+ times
      required: false
    - id: 6
      name: nail_breakage
      label: nailBreakage
      hint: Please describe any breakage or lifting of the nail you experienced since
        using the serum.
      type: text
      options: []
      required: false
    - id: 7
      name: nail_strengthening_recommendation
      label: nailStrengtheningRecommendation
      hint: Do you have any nail strengthening recommendations for us?
      type: text
      options: []
      required: false
    - id: 8
      name: nail_strength_serum_recommendation
      label: nailStrengthSerumRecommendation
      hint: Do you have any recommendations for the nail strengthening serum?
      type: text
      options: []
      required: false
    - id: 9
      name: overall_satisfaction
      label: overallSatisfaction
      hint: Please rate your overall satisfaction with the serum
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - None
      required: false
    - id: 10
      name: nail_strength_serum_ugc
      label: nailStrengthSerumUGC
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: nail_clipping_difficulty
      label: nailClippingDifficulty
      hint: How difficult was it to clip your nails since using the serum?
      type: select_one
      options:
      - Much easier
      - Slightly easier
      - No difference
      - Slightly harder
      - Much harder
      required: false
    - id: 12
      name: nail_growth
      label: nailGrowth
      hint: Please rate your observed nail growth rate since using the serum.
      type: select_one
      options:
      - Much faster
      - Slightly faster
      - No difference
      - Slightly slower
      - Much slower
      required: false
    - id: 13
      name: serum_smell
      label: serumSmell
      hint: null
      type: select_one
      options:
      - Faint
      - Medium
      - Strong
      required: false
    - id: 14
      name: nail_sensitivity
      label: nailSensitivity
      hint: null
      type: select_one
      options:
      - None
      - Slightly more sensitive
      - Much more sensitive
      required: false
    - id: 15
      name: nail_strengthening_ingredient
      label: nailStrengtheningIngredient
      hint: null
      type: select_multiple
      options:
      - Vitamin E
      - Calcium
      - Biotin
      - Other
      required: false
    - id: 16
      name: nail_strengthening_concentration
      label: nailStrengtheningConcentration
      hint: null
      type: select_one
      options:
      - Too concentrated
      - Too dilute
      - Just right
      required: false
    - id: 17
      name: nail_strengthening_side_effects
      label: nailStrengtheningSideEffects
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: nail_strengthening_side_effects_frequent
      label: nailStrengtheningSideEffectsFrequent
      hint: null
      type: text
      options: []
      required: false
