inputSchema:
  type: object
  properties:
    title: Library Satisfaction Survey
    pages:
    - id: 1
      name: page1
      label: Introduction
      hint: Please take a few minutes to answer the questions below.
      type: text
      options: []
      required: false
    - id: 2
      name: page2
      label: How often do you visit the library?
      hint: null
      type: select_one
      options:
      - Very often
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 3
      name: page3
      label: What do you enjoy most about our library?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: page4
      label: Have you had any issues with our library?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 5
      name: page5
      label: Why do you visit the library?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: page6
      label: How satisfied are you with our library?
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 7
      name: page7
      label: How often do you experience problems with our library?
      hint: null
      type: select_one
      options:
      - Very often
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 8
      name: page8
      label: What can we do to improve our library?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: page9
      label: How likely are you to recommend our library to a friend or family member?
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: page10
      label: How do you use our library resources?
      hint: null
      type: select_multiple
      options:
      - Books
      - Articles
      - Media
      - Other (please specify)
      required: false
    - id: 11
      name: page11
      label: What do you value most when visiting our library?
      hint: null
      type: select_multiple
      options:
      - Quiet and relaxing atmosphere
      - Availability of resources
      - Knowledgeable staff
      - Other (please specify)
      required: false
    - id: 12
      name: page12
      label: Page12
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: page13
      label: What is your favorite library service or feature?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: page14
      label: How would you rate your overall experience with our library?
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: page15
      label: Any suggestions for library events or programs?
      hint: null
      type: text
      options: []
      required: false
