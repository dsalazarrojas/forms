inputSchema:
  type: object
  properties:
    title: Saddle Bench Feedback Survey
    pages:
    - id: 1
      name: first_page
      label: feedback_about_your_visit
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: comfort_ratings
      label: how_comfortable_is_your_saddle_bench
      hint: null
      type: select_multiple
      options:
      - very uncomfortable
      - somewhat uncomfortable
      - neutral
      - somewhat comfortable
      - very comfortable
      required: false
    - id: 3
      name: improvement_ideas
      label: do_you_have_any_improvement_ideas
      hint: null
      type: text
      options: []
      required: false
