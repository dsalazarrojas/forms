      hint: null
      type: time
      options: []
      required: false
    - id: 12
      name: service_customization
      label: How important is service customization for you?
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: service_customization_2
      label: What features would you like to see?
      hint: null
      type: select_multiple
      options:
      - Feature A
