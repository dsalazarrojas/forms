inputSchema:
  type: object
  properties:
    title: Service Customization Survey
    pages:
    - id: 1
      name: user_role
      label: What is your role in the business?
      hint: Please select all that apply
      type: select_multiple
      options:
      - Client
      - Business Owner
      - Employee
      required: true
    - id: 2
      name: service_choice
      label: What service do you want to customize?
      hint: null
      type: select_one
      options:
      - Service A
      - Service B
      - Service C
      required: true
    - id: 3
      name: service_frequency
      label: How often do you use this service?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      required: true
    - id: 4
      name: service_time
      label: What time of day do you usually use this service?
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: day_of_week
      label: What day of week do you usually use this service?
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 6
      name: satisfaction
      label: How satisfied are you with the service?
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: favorite_time
      label: What time of day do you usually enjoy?
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Night
      required: false
    - id: 8
      name: service_satisfaction
      label: Service Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: service_time_2
      label: What time do you usually use this service?
      hint: null
      type: time
      options: []
      required: false
    - id: 10
