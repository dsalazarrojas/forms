inputSchema:
  type: object
  properties:
    title: local_business_review_request
    pages:
    - id: 1
      name: business_name
      label: Business name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: Your email address
      type: email
      options: []
      required: false
    - id: 3
      name: rating
      label: Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Bad
      required: true
    - id: 4
      name: comment
      label: Comment
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: review_date
      label: Review date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: rating_why
      label: Why did you rate this business like this?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: recommendation
      label: Do you recommend this business?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
