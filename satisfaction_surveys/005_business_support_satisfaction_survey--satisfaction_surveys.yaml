inputSchema:
  type: object
  properties:
    title: Business Support Satisfaction Survey
    pages:
    - id: 1
      name: organization_name
      label: Organization Name
      hint: Your business or company name
      type: text
      options: []
      required: true
    - id: 2
      name: respondent_name
      label: Respondent Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_title
      label: Your Title or Position
      hint: Your role in the organization
      type: text
      options: []
      required: true
    - id: 4
      name: respondent_email
      label: Email Address
      hint: Your business email
      type: email
      options: []
      required: true
    - id: 5
      name: respondent_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: false
    - id: 6
      name: relationship_length
      label: How Long Has Your Organization Used Our Services
      hint: Select the appropriate duration
      type: select_one
      options:
      - Less than 3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - More than 2 years
      required: true
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction with Our Services
      hint: Rate your overall experience
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very Dissatisfied
      required: true
    - id: 8
      name: accessibility
      label: Ease of Accessing Our Support Services
      hint: How easy was it to reach support
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 9
      name: responsiveness
      label: Responsiveness of Our Support Team
      hint: How quickly did we respond
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 10
      name: solution_effectiveness
      label: Effectiveness of Solutions Provided
      hint: Did the solutions work for you
      type: select_one
      options:
      - Very Effective
      - Effective
      - Moderately Effective
      - Ineffective
      - Very Ineffective
      required: true
    - id: 11
      name: communication_clarity
      label: Clarity of Communication
      hint: How clear was our communication
      type: select_one
      options:
      - Very Clear
      - Clear
      - Neutral
      - Unclear
      - Very Unclear
      required: true
    - id: 12
      name: staff_competence
      label: Competence of Support Staff
      hint: How knowledgeable was our team
      type: select_one
      options:
      - Excellent
      - Good
      - Average
      - Poor
      - Very Poor
      required: true
    - id: 13
      name: value_for_money
      label: Value for Money
      hint: Is your investment worth the service
      type: select_one
      options:
      - Excellent Value
      - Good Value
      - Average Value
      - Poor Value
      - Very Poor Value
      required: true
    - id: 14
      name: improvement_areas
      label: Areas for Improvement
      hint: What could we do better
      type: text
      options: []
      required: false
    - id: 15
      name: recommendation_score
      label: Likelihood to Recommend Us
      hint: Would you recommend our services to colleagues
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Unsure
      - Probably No
      - Definitely No
      required: true
    - id: 16
      name: future_engagement
      label: Are You Likely to Increase Usage of Our Services
      hint: Plans for future engagement
      type: select_one
      options:
      - Very Likely
      - Likely
      - Unsure
      - Unlikely
      - Very Unlikely
      required: true
