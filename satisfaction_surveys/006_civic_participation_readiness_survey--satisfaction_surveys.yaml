inputSchema:
  type: object
  properties:
    title: Civic Participation Readiness Survey
    pages:
      - id: 1
        name: respondent_name
        label: Full Name
        hint: Enter your first and last name
        type: text
        options: []
        required: true
      - id: 2
        name: email_address
        label: Email Address
        hint: For follow-up communication
        type: email
        options: []
        required: true
      - id: 3
        name: age_group
        label: Age Group
        hint: Select your age range
        type: select_one
        options:
          - 18-24 years
          - 25-34 years
          - 35-44 years
          - 45-54 years
          - 55-64 years
          - 65+ years
        required: true
      - id: 4
        name: residence_type
        label: Type of Residence
        hint: Where do you currently live
        type: select_one
        options:
          - Urban area
          - Suburban area
          - Rural area
          - Small town
        required: true
      - id: 5
        name: civic_knowledge
        label: How would you rate your knowledge of local government
        hint: Be honest in your assessment
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
          - Very poor
        required: true
      - id: 6
        name: voting_history
        label: How often do you vote in local elections
        hint: City council, school board, etc.
        type: select_one
        options:
          - Always
          - Most of the time
          - Sometimes
          - Rarely
          - Never
        required: true
      - id: 7
        name: meeting_attendance
        label: Have you attended a public meeting in the past year
        hint: Town halls, city council, school board
        type: select_one
        options:
          - Yes, multiple times
          - Yes, once
          - No, but interested
          - No, not interested
        required: true
      - id: 8
        name: contact_officials
        label: Have you ever contacted an elected official
        hint: By phone, email, or in person
        type: select_one
        options:
          - Yes, frequently
          - Yes, occasionally
          - Once or twice
          - Never
        required: true
      - id: 9
        name: volunteer_status
        label: Do you currently volunteer in your community
        hint: Regular volunteer work
        type: select_one
        options:
          - Yes, weekly
          - Yes, monthly
          - Yes, occasionally
          - No, but interested
          - No, not interested
        required: true
      - id: 10
        name: community_organization
        label: Are you a member of any community organizations
        hint: HOA, neighborhood association, clubs
        type: select_one
        options:
          - Yes, multiple
          - Yes, one
          - No, but interested
          - No, not interested
        required: true
      - id: 11
        name: barriers_participation
        label: What barriers prevent your civic participation
        hint: Select all that apply
        type: select_multiple
        options:
          - Lack of time
          - Lack of information
          - Dont know where to start
          - Feel my voice does not matter
          - Transportation issues
          - Work schedule conflicts
          - Childcare responsibilities
          - Language barriers
          - No barriers
        required: false
      - id: 12
        name: information_sources
        label: How do you stay informed about community issues
        hint: Select all that apply
        type: select_multiple
        options:
          - Local newspaper
          - Television news
          - Social media
          - Community newsletters
          - Word of mouth
          - Government websites
          - Radio
          - Podcasts
        required: true
      - id: 13
        name: training_interest
        label: Would you be interested in civic participation training
        hint: Workshops on effective advocacy
        type: select_one
        options:
          - Very interested
          - Somewhat interested
          - Neutral
          - Not very interested
          - Not interested
        required: true
      - id: 14
        name: preferred_involvement
        label: How would you prefer to get involved
        hint: Select your preferred methods
        type: select_multiple
        options:
          - Attending public meetings
          - Serving on a board or committee
          - Volunteering for campaigns
          - Community organizing
          - Writing to officials
          - Participating in protests
          - Donating to causes
          - Running for office
        required: true
      - id: 15
        name: confidence_level
        label: How confident are you in making a difference
        hint: In your community
        type: select_one
        options:
          - Very confident
          - Somewhat confident
          - Neutral
          - Not very confident
          - Not confident at all
        required: true
      - id: 16
        name: time_availability
        label: How much time could you dedicate monthly
        hint: To civic activities
        type: select_one
        options:
          - 1-5 hours
          - 5-10 hours
          - 10-20 hours
          - 20+ hours
          - Unable to commit time
        required: true
      - id: 17
        name: skills_offering
        label: What skills could you offer to civic efforts
        hint: Select all that apply
        type: select_multiple
        options:
          - Writing or Communication
          - Data Analysis
          - Event Planning
          - Social Media Management
          - Legal Expertise
          - Financial Management
          - Teaching or Training
          - Technical Skills
          - None specified
        required: false
      - id: 18
        name: additional_comments
        label: Additional Comments
        hint: Share any other thoughts
        type: text
        options: []
        required: false
