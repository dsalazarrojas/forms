inputSchema:
  type: object
  properties:
    title: Client Satisfaction With Advisory Insight Survey
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name or Company
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Your Name
      hint: Contact person completing survey
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Phone Number
      hint: Optional
      type: text
      options: []
      required: false
    - id: 6
      name: relationship_section
      label: -- Relationship and Engagement --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: relationship_duration
      label: How long have you been working with our advisory firm?
      hint: null
      type: select_one
      options:
      - Less than 6 months
      - 6-12 months
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: true
    - id: 8
      name: engagement_level
      label: Level of engagement with our advisory services
      hint: null
      type: select_one
      options:
      - Minimal
      - Occasional
      - Regular
      - Intensive
      - Strategic Partnership
      required: true
    - id: 9
      name: advisory_services
      label: Which advisory services have you utilized?
      hint: Select all that apply
      type: select_multiple
      options:
      - Strategy Consulting
      - Operations Improvement
      - Financial Advisory
      - Technology Advisory
      - Risk Management
      - Organizational Development
      - Market Analysis
      - Other
      required: true
    - id: 10
      name: satisfaction_section
      label: -- Satisfaction with Advisory Services --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: overall_satisfaction
      label: Overall satisfaction with our advisory services
      hint: null
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 12
      name: satisfaction_rating
      label: Rate your satisfaction - 1 to 10
      hint: 1 = Very unsatisfied, 10 = Very satisfied
      type: number
      options: []
      required: true
    - id: 13
      name: advisor_quality
      label: Quality and expertise of our advisors
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 14
      name: advisory_relevance
      label: Our advisory insights are relevant to your business needs
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 15
      name: actionability
      label: Our recommendations are actionable and practical
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 16
      name: business_impact_section
      label: -- Business Impact and Results --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: impact_perception
      label: Our advisory services have positively impacted your business
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 18
      name: impact_rating
      label: Rate the measurable business impact - 1 to 10
      hint: 1 = No impact, 10 = Transformational impact
      type: number
      options: []
      required: false
    - id: 19
      name: implementation_support
      label: Quality of support in implementing recommendations
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 20
      name: risk_mitigation
      label: Have the advisory insights helped mitigate business risks?
      hint: null
      type: select_one
      options:
      - Not at all
      - Minimally
      - Somewhat
      - Significantly
      - Very Significantly
      required: false
    - id: 21
      name: engagement_section
      label: -- Engagement and Communication --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: communication_quality
      label: Quality of communication with your advisory team
      hint: null
      type: select_one
      options:
      - Poor
      - Fair
      - Good
      - Very Good
      - Excellent
      required: true
    - id: 23
      name: responsiveness
      label: Our team is responsive to your questions and concerns
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 24
      name: collaboration
      label: We work collaboratively to understand your business deeply
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 25
      name: value_and_trust
      label: -- Value and Long-term Outlook --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: value_perception
      label: You receive excellent value for your advisory investment
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 27
      name: trust_level
      label: You trust our firm as a strategic advisor
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 28
      name: continuation_likelihood
      label: Likelihood of continuing our advisory relationship - 1 to 10
      hint: 1 = Will not continue, 10 = Definitely continue
      type: number
      options: []
      required: true
    - id: 29
      name: expansion_interest
      label: Interest in expanding our advisory engagement
      hint: null
      type: select_one
      options:
      - No Interest
      - Low Interest
      - Moderate Interest
      - High Interest
      - Very High Interest
      required: false
    - id: 30
      name: feedback_section
      label: -- Feedback and Improvement --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: strengths
      label: What are our key strengths as an advisory firm?
      hint: null
      type: text
      options: []
      required: false
    - id: 32
      name: improvement_areas
      label: What could we improve in our advisory services?
      hint: null
      type: text
      options: []
      required: false
    - id: 33
      name: referral_likelihood
      label: How likely are you to refer us to other organizations?
      hint: null
      type: number
      options: []
      required: false
