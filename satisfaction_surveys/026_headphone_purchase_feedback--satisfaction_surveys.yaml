inputSchema:
  type: object
  properties:
    title: Headphone Purchase Feedback
    pages:
    - id: 1
      name: headphones_purchased
      label: How was the sound quality of the headphones?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: price_value
      label: How much did you pay for the headphones?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: purchase_location
      label: Where did you purchase the headphones?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      required: false
    - id: 5
      name: purchase_date
      label: When did you purchase the headphones?
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: purchase_time
      label: What time did you purchase the headphones?
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: purchase_suggestions
      label: Do you have any suggestions for the headphones?
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: How would you like to be contacted?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_email
      label: How would you like to be contacted?
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: contact_message
      label: What is your message?
      hint: null
      type: text
      options: []
      required: false
