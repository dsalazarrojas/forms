inputSchema:
  type: object
  properties:
    title: habilitation_program_satisfaction_survey
    pages:
    - id: 1
      name: instructor_satisfaction
      label: How do you feel about your instructor?
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 2
      name: facility_satisfaction
      label: What do you think about our facilities?
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: false
    - id: 3
      name: overall_satisfaction
      label: What is your overall satisfaction?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 4
      name: program_satisfaction
      label: How do you feel about our program?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Unsatisfied
      - Very Unsatisfied
      required: false
    - id: 5
      name: feedback
      label: Do you have any other feedback for us?
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: contact_info
      label: How would you like to be contacted?
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Both
      required: false
    - id: 7
      name: email
      label: Your Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Your Phone
      hint: null
      type: text
      options: []
      required: false
