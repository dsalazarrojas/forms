inputSchema:
  type: object
  properties:
    title: Client Satisfaction Audit
    pages:
    - id: 1
      name: audit_intro
      label: -- Product and Service Satisfaction Evaluation --
      hint: Help us improve by sharing your experience
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Your Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: customer_since
      label: Customer Since
      hint: Approximately when did you start using our products/services?
      type: date
      options: []
      required: false
    - id: 5
      name: primary_product_used
      label: Primary Product or Service Used
      hint: null
      type: select_one
      options:
      - Product A
      - Product B
      - Service A
      - Service B
      - Multiple products/services
      - Other
      required: true
    - id: 6
      name: product_quality_rating
      label: Quality of Product
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 7
      name: product_meets_needs
      label: Does Product Meet Your Needs?
      hint: null
      type: select_one
      options:
      - Exceeds expectations
      - Meets expectations
      - Partially meets expectations
      - Does not meet expectations
      required: true
    - id: 8
      name: service_quality_rating
      label: Quality of Service
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 9
      name: customer_support_rating
      label: Customer Support Quality
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Fair
      - Poor
      required: true
    - id: 10
      name: value_for_money
      label: Value for Money
      hint: null
      type: select_one
      options:
      - Excellent value
      - Good value
      - Fair value
      - Poor value
      - Very poor value
      required: true
    - id: 11
      name: delivery_timeliness
      label: Delivery or Service Timeliness
      hint: null
      type: select_one
      options:
      - Always on time
      - Usually on time
      - Sometimes delayed
      - Often delayed
      - Always delayed
      required: true
    - id: 12
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: true
    - id: 13
      name: likelihood_recommend
      label: Likelihood to Recommend
      hint: How likely are you to recommend us to others?
      type: number
      options: []
      required: true
    - id: 14
      name: product_strengths
      label: Strongest Aspects of Our Products
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: service_strengths
      label: Strongest Aspects of Our Services
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: improvement_suggestions
      label: Suggestions for Improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: additional_comments
      label: Additional Comments or Feedback
      hint: null
      type: text
      options: []
      required: false
