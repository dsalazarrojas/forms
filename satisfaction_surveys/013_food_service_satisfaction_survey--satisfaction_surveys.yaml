inputSchema:
  type: object
  properties:
    title: food_service_satisfaction_survey
    pages:
    - id: 1
      name: overall_rating
      label: Overall Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: food_service_quality
      label: Food Service Quality
      hint: null
      type: select_one
      options:
      - Poor
      - Average
      - Good
      - Excellent
      required: false
    - id: 3
      name: food_price
      label: Food Price
      hint: null
      type: select_multiple
      options:
      - Overpriced
      - Average
      - Underpriced
      - Not applicable
      required: false
    - id: 4
      name: food_portion
      label: Food Portion
      hint: null
      type: select_one
      options:
      - Too small
      - Average
      - Too large
      - Not applicable
      required: false
    - id: 5
      name: food_appearance
      label: Food Appearance
      hint: null
      type: select_multiple
      options:
      - Not attractive
      - Average
      - Attractive
      - Not applicable
      required: false
    - id: 6
      name: service_friendliness
      label: Service Friendliness
      hint: null
      type: select_multiple
      options:
      - Not friendly
      - Average
      - Friendly
      - Not applicable
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: select_one
      options:
      - Not Satisfied
      - Somewhat Satisfied
      - Satisfied
      - Very Satisfied
      - Extremely Satisfied
      required: false
    - id: 8
      name: food_service_satisfaction
      label: Food Service Satisfaction
      hint: null
      type: select_one
      options:
      - Not Satisfied
      - Somewhat Satisfied
      - Satisfied
      - Very Satisfied
      - Extremely Satisfied
      required: false
