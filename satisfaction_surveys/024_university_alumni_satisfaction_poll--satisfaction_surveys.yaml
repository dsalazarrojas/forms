inputSchema:
  type: object
  properties:
    title: University Alumni Satisfaction Poll
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: university_name
      label: University Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: academic_program
      label: Academic Program
      hint: null
      type: select_one
      options:
      - Computer Science
      - Arts
      - Humanities
      - Engineering
      - Business
      - Social Sciences
      required: false
    - id: 6
      name: graduation_year
      label: Graduation Year
      hint: null
      type: select_multiple
      options:
      - '2020'
      - '2019'
      - '2018'
      - '2017'
      - '2016'
      required: false
    - id: 7
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: On a scale of 0 to 10
      type: number
      options: []
      required: false
    - id: 8
      name: satisfaction_with_faculty
      label: Satisfaction with Faculty
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: satisfaction_with_administrative_support
      label: Satisfaction with Administrative Support
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: satisfaction_with_academic_support
      label: Satisfaction with Academic Support
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: satisfaction_with_resources
      label: Satisfaction with Resources
      hint: null
      type: number
      options: []
      required: false
