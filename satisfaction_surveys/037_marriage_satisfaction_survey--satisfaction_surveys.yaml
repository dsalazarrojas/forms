inputSchema:
  type: object
  properties:
    title: Marriage Satisfaction Survey
    pages:
    - id: 1
      name: introduction
      label: Marriage Satisfaction Survey Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: partner_satisfaction
      label: How satisfied are you with your partner
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Not satisfied
      - Not at all satisfied
      required: false
    - id: 3
      name: communication
      label: How would you rate your communication with your partner
      hint: null
      type: select_multiple
      options:
      - Strongly disagree
      - Somewhat agree
      - Neutral
      - Somewhat disagree
      required: false
    - id: 4
      name: love
      label: How satisfied are you with the love you have with your partner
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: conflicts
      label: How often do you experience conflicts with your partner
      hint: null
      type: select_one
      options:
      - Almost never
      - Less than once a week
      - 1-2 times a week
      - 3-4 times a week
      - Almost always
      required: false
    - id: 6
