inputSchema:
  type: object
  properties:
    title: Inclusive Public Space Design Survey
    pages:
    - id: 1
      name: survey_questions
      label: Survey Questions
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: building_characteristics
      label: Building Characteristics
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: public_space_characteristics
      label: Public Space Characteristics
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: accessibility_features
      label: Accessibility Features
      hint: null
      type: select_one
      options:
      - Wheelchair Accessible Entrances
      - Accessible Restrooms
      - Sign Language Interpretation
      - Assistive Technology
      required: false
    - id: 5
      name: public_space_usage
      label: Public Space Usage
      hint: null
      type: select_one
      options:
      - Wheelchairs
      - Stairs
      - Elevators
      required: false
    - id: 6
      name: personal_assistance
      label: Personal Assistance
      hint: null
      type: select_multiple
      options:
      - Wheelchair
      - Sign Language
      - Braille
      - Large Print Materials
      required: false
    - id: 7
      name: accessibility_barriers
      label: Accessibility Barriers
      hint: null
      type: select_multiple
      options:
      - Architectural
      - Physical
      required: false
    - id: 8
      name: personal_support
      label: Personal Support
      hint: null
      type: select_multiple
      options:
      - Service Animal
      - Sign Language
      - Visual Assistance
      required: false
    - id: 9
      name: communication
      label: Communication
      hint: null
      type: select_multiple
      options:
      - Braille
      - Large Print
      - Sign Language
      required: false
    - id: 10
      name: social_support
      label: Social Support
      hint: null
      type: select_multiple
      options:
      - Wheelchair
      - Service Animal
      - Visual Assistance
      required: false
    - id: 11
      name: public_space_access
      label: Public Space Access
      hint: null
      type: select_multiple
      options:
      - Wheelchairs
      - Wheelchair Accessible
      - Accessible Restrooms
      required: false
    - id: 12
      name: personal_space_access
      label: Personal Space Access
      hint: null
      type: select_multiple
      options:
      - Wheelchair
      - Service Animal
      - Service Animal Access
      required: false
