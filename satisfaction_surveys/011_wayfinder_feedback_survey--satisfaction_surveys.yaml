inputSchema:
  type: object
  properties:
    title: Wayfinder Feedback Survey
    pages:
    - id: 1
      name: navigation_experience
      label: Navigation Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: signage_clarity
      label: Signage Clarity
      hint: How clear are the signs and directions?
      type: text
      options: []
      required: false
    - id: 3
      name: wayfinding_experience
      label: Wayfinding Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: navigation_help
      label: Navigation Help
      hint: How often do you seek help from staff to navigate?
      type: select_one
      options:
      - Often
      - Seldom
      - Never
      required: false
    - id: 5
      name: overall_experience
      label: Overall Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: navigation_emotions
      label: Navigation Emotions
      hint: How do you feel when navigating?
      type: select_multiple
      options:
      - Happy
      - Neutral
      - Sad
      required: false
    - id: 7
      name: time_spent
      label: Time Spent
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: staff_helpfulness
      label: Staff Helpfulness
      hint: null
      type: select_one
      options:
      - Very Helpful
      - Not Helpful
      required: false
    - id: 9
      name: suggestions
      label: Suggestions
      hint: Do you have any suggestions for the facility?
      type: note
      options: []
      required: false
