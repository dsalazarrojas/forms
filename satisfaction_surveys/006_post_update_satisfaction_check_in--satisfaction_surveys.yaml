inputSchema:
  type: object
  properties:
    title: Post Update Satisfaction Check In
    pages:
    - id: 1
      name: post_update_satisfaction_check_in
      label: Page 1
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: player_feedback
      label: Player Feedback
      hint: Enter player feedback
      type: text
      options: []
      required: true
    - id: 3
      name: rating
      label: Rating
      hint: Scale 1-5
      type: number
      options: []
      required: true
    - id: 4
      name: satisfaction_trend
      label: Satisfaction Trend
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: true
    - id: 5
      name: fix_priority
      label: Fix Priority
      hint: High, Medium, Low
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: release_notes
      label: Release Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: player_notes
      label: Player Notes
      hint: null
      type: text
      options: []
      required: false
