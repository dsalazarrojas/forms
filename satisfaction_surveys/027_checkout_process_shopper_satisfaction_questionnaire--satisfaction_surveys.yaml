inputSchema:
  type: object
  properties:
    title: Checkout Process Shopper Satisfaction Questionnaire
    pages:
    - id: 1
      name: section_order_context
      label: -- Order Context --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: shopper_order_id
      label: Order ID
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_purchase_log
      label: Date of Purchase
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: section_checkout_rating
      label: -- Checkout Experience Rating --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: overall_checkout_ease
      label: How easy was the checkout process
      hint: null
      type: select_one
      options:
      - Very Easy
      - Easy
      - Neutral
      - Difficult
      - Very Difficult
      required: true
    - id: 6
      name: payment_options_variety
      label: Satisfaction with available payment methods
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Unsatisfied
      required: true
    - id: 7
      name: checkout_speed_rating
      label: How would you rate the speed of checkout
      hint: null
      type: select_one
      options:
      - Very Fast
      - Fast
      - Average
      - Slow
      required: true
    - id: 8
      name: mobile_experience_rating
      label: Rating of mobile checkout (if applicable)
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - N/A
      required: false
    - id: 9
      name: encountered_technical_errors
      label: Did you experience any technical errors
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: error_description_text
      label: Describe any errors or frustrations
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: section_final_thoughts
      label: -- Future Improvements --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: missing_feature_request
      label: Any features missing from our checkout
      hint: e.g. one-click checkout, specific payment type
      type: text
      options: []
      required: false
    - id: 13
      name: recommendation_likelihood_score
      label: Likelihood to recommend our shop based on checkout
      hint: 0-10 scale
      type: number
      options: []
      required: true
    - id: 14
      name: general_shopper_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: follow_up_permission
      label: May we contact you for more details
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
