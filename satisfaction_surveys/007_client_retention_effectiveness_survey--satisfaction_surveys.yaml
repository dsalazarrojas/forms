inputSchema:
  type: object
  properties:
    title: Client Retention Effectiveness Survey
    pages:
    - id: 1
      name: respondent_info
      label: -- Respondent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client Name or Company
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Your Name
      hint: Contact person completing survey
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: relationship_overview
      label: -- Relationship Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: account_tenure
      label: How long have you been a client with us?
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - 5-10 years
      - Over 10 years
      required: true
    - id: 7
      name: overall_satisfaction
      label: Overall, how satisfied are you with our services?
      hint: null
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 8
      name: retention_factors
      label: -- Factors Contributing to Retention --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: reasons_staying
      label: What are the main reasons you continue to work with us?
      hint: null
      type: select_multiple
      options:
      - Quality of Service
      - Value for Money
      - Strong Relationships
      - Reliability
      - Customer Support
      - Innovation
      - Ease of Doing Business
      - Other
      required: true
    - id: 10
      name: switching_risk
      label: How likely are you to switch to a competitor in the next year?
      hint: null
      type: select_one
      options:
      - Very Unlikely
      - Unlikely
      - Neutral
      - Likely
      - Very Likely
      required: true
    - id: 11
      name: service_quality_section
      label: -- Service Quality and Performance --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: service_quality_rating
      label: Rate the quality of our service - 1 to 10
      hint: 1 = Poor, 10 = Excellent
      type: number
      options: []
      required: true
    - id: 13
      name: consistency_of_delivery
      label: Our service quality has improved or remained consistent over time
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 14
      name: innovation_rating
      label: Does our company innovate and stay current in your industry?
      hint: null
      type: select_one
      options:
      - Not at all
      - Rarely
      - Sometimes
      - Often
      - Always
      required: true
    - id: 15
      name: relationship_section
      label: -- Relationship Strength --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: account_team_rating
      label: Rate your account team - 1 to 10
      hint: 1 = Poor, 10 = Excellent
      type: number
      options: []
      required: true
    - id: 17
      name: responsiveness
      label: How responsive and attentive is our team to your needs?
      hint: null
      type: select_one
      options:
      - Very Unresponsive
      - Unresponsive
      - Adequate
      - Responsive
      - Very Responsive
      required: true
    - id: 18
      name: strategic_partner
      label: We view our relationship as a strategic partnership
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 19
      name: value_section
      label: -- Value and ROI --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: roi_perception
      label: We achieve strong return on investment with your services
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 21
      name: roi_rating
      label: Rate the value we provide relative to cost - 1 to 10
      hint: 1 = Poor, 10 = Excellent
      type: number
      options: []
      required: false
    - id: 22
      name: feedback_section
      label: -- Feedback and Improvement --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: improvement_suggestions
      label: What could we do to increase your satisfaction and retention?
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: risk_factors
      label: Are there any factors that could lead you to reconsider our relationship?
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: expansion_opportunity
      label: Would you be interested in expanding our partnership or adding services?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Maybe
      required: false
