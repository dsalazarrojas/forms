inputSchema:
  type: object
  properties:
    title: Policyholder Satisfaction Assessment Form
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: satisfaction_with_service_quality
      label: Satisfaction with service quality
      hint: How would you rate your satisfaction with our service quality?
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 3
      name: satisfaction_with_customer_communication
      label: Satisfaction with customer communication
      hint: How would you rate your satisfaction with our customer communication?
      type: select_one
      options:
      - Very good
      - Good
      - Neutral
      - Poor
      - Very poor
      required: false
    - id: 4
      name: satisfaction_with_product_features
      label: Satisfaction with product features
      hint: null
      type: select_multiple
      options:
      - Very good
      - Good
      - Neutral
      - Poor
      - Very poor
      required: false
    - id: 5
      name: satisfaction_with_policyholder_service
      label: Satisfaction with policyholder service
      hint: How would you rate your satisfaction with our policyholder service?
      type: select_multiple
      options:
      - Very good
      - Good
      - Neutral
      - Poor
      - Very poor
      required: false
    - id: 6
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_multiple
      options:
      - Very satisfied
      - Satisfied
      - Neutral
      - Dissatisfied
      - Very dissatisfied
      required: false
    - id: 7
      name: feedback_and_comments
      label: Feedback and comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: additional_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: expected_resolution
      label: Expected resolution time
      hint: How long did you expect your issue to be resolved?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: actual_resolution
      label: Actual resolution time
      hint: How long did your issue take to be resolved?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: contact_info
      label: Contact Information
      hint: null
      type: select_multiple
      options:
      - Phone
      - Email
      - Mail
      - None
      required: false
