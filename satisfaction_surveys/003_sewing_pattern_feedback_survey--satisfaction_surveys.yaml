inputSchema:
  type: object
  properties:
    title: Sewing Pattern Feedback Survey
    pages:
    - id: 1
      name: main_page
      label: main-page-label
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: pattern_category
      label: pattern-category-label
      hint: null
      type: select_one
      options:
      - Knit
      - Print
      - Other
      required: false
    - id: 3
      name: pattern_type
      label: pattern-type-label
      hint: null
      type: select_multiple
      options:
      - A-line
      - A-line (with curves)
      - A-line with curves and pockets
      - B-line
      - B-line with curves
      - B-line with pockets
      - B-line with curves and pockets
      - C-line
      - C-line with curves
      - C-line with pockets
      required: false
    - id: 4
      name: pattern_size
      label: pattern-size-label
      hint: null
      type: select_multiple
      options:
      - XS-S
      - S
      - M
      - L
      - XL
      - XXL
      - Custom
      required: false
    - id: 5
      name: pattern_features
      label: pattern-features-label
      hint: null
      type: select_multiple
      options:
      - Knit
      - Crochet
      - Print
      required: false
    - id: 6
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
