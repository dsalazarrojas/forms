      - '{''id'': 3, ''name'': ''A-line with curves and pockets''}'
      - '{''id'': 4, ''name'': ''B-line''}'
      - '{''id'': 5, ''name'': ''B-line with curves''}'
      - '{''id'': 6, ''name'': ''B-line with pockets''}'
      - '{''id'': 7, ''name'': ''B-line with curves and pockets''}'
      - '{''id'': 8, ''name'': ''C-line''}'
