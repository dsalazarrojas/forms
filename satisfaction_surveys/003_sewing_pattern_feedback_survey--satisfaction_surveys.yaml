    - id: 7
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
