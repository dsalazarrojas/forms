inputSchema:
  type: object
  properties:
    title: Clean Completion Survey
    pages:
    - id: 1
      name: service_date
      label: Service Date
      hint: Date when cleaning service was completed
      type: date
      options: []
      required: true
    - id: 2
      name: service_time
      label: Service Time
      hint: Time when service was completed
      type: time
      options: []
      required: true
    - id: 3
      name: client_name
      label: Client Name
      hint: Name of the client or customer
      type: text
      options: []
      required: true
    - id: 4
      name: client_email
      label: Client Email
      hint: Contact email address
      type: email
      options: []
      required: true
    - id: 5
      name: client_phone
      label: Client Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 6
      name: service_location
      label: Service Location
      hint: Address where service was provided
      type: text
      options: []
      required: true
    - id: 7
      name: service_type
      label: Type of Service Provided
      hint: Select the cleaning service type
      type: select_one
      options:
      - Residential Cleaning
      - Commercial Cleaning
      - Deep Cleaning
      - Move-In or Move-Out Cleaning
      - Post-Construction Cleaning
      - Carpet Cleaning
      - Window Cleaning
      - Other
      required: true
    - id: 8
      name: cleaner_name
      label: Cleaner or Team Name
      hint: Name of the cleaner or team who performed the service
      type: text
      options: []
      required: true
    - id: 9
      name: service_duration
      label: Service Duration
      hint: How long did the service take
      type: select_one
      options:
      - Less than 1 hour
      - 1-2 hours
      - 2-3 hours
      - 3-4 hours
      - 4-6 hours
      - Over 6 hours
      required: true
    - id: 10
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: How satisfied are you with the cleaning service
      type: select_one
      options:
      - Very Satisfied - Exceeded expectations
      - Satisfied - Met expectations
      - Neutral - Neither satisfied nor dissatisfied
      - Dissatisfied - Below expectations
      - Very Dissatisfied - Did not meet expectations
      required: true
    - id: 11
      name: cleanliness_rating
      label: Cleanliness Rating
      hint: Rate the overall cleanliness after service
      type: select_one
      options:
      - Excellent - Spotless
      - Very Good - Very clean
      - Good - Clean
      - Fair - Adequately clean
      - Poor - Not clean enough
      required: true
    - id: 12
      name: attention_to_detail
      label: Attention to Detail
      hint: Rate the cleaner attention to detail
      type: select_one
      options:
      - Excellent - Very thorough
      - Very Good - Quite thorough
      - Good - Adequately thorough
      - Fair - Missed some areas
      - Poor - Many areas missed
      required: true
    - id: 13
      name: punctuality_rating
      label: Punctuality Rating
      hint: Did the cleaner arrive on time
      type: select_one
      options:
      - Early - Arrived before scheduled time
      - On Time - Arrived as scheduled
      - Slightly Late - Less than 15 minutes
      - Late - 15-30 minutes late
      - Very Late - Over 30 minutes late
      required: true
    - id: 14
      name: professionalism_rating
      label: Professionalism Rating
      hint: Rate the professionalism of the cleaning staff
      type: select_one
      options:
      - Excellent - Very professional
      - Very Good - Quite professional
      - Good - Acceptable professionalism
      - Fair - Some concerns
      - Poor - Unprofessional behavior
      required: true
    - id: 15
      name: areas_cleaned
      label: Areas Cleaned
      hint: Select all areas that were cleaned
      type: select_multiple
      options:
      - Living Room
      - Bedrooms
      - Kitchen
      - Bathrooms
      - Dining Room
      - Hallways
      - Stairs
      - Basement
      - Garage
      - Outdoor Areas
      - Office Space
      - Common Areas
      required: true
    - id: 16
      name: missed_areas
      label: Missed Areas or Concerns
      hint: Were there any areas that were not cleaned properly
      type: text
      options: []
      required: false
    - id: 17
      name: value_for_money
      label: Value for Money
      hint: Do you feel the service was worth the cost
      type: select_one
      options:
      - Excellent Value - Worth more than paid
      - Good Value - Fair price for service
      - Fair Value - Acceptable for the price
      - Poor Value - Overpriced for service received
      required: true
    - id: 18
      name: would_recommend
      label: Would You Recommend Our Services
      hint: Would you recommend us to friends or family
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 19
      name: would_use_again
      label: Would You Use Our Services Again
      hint: Will you book our services in the future
      type: select_one
      options:
      - Definitely Yes
      - Probably Yes
      - Not Sure
      - Probably No
      - Definitely No
      required: true
    - id: 20
      name: additional_feedback
      label: Additional Comments or Feedback
      hint: Any other comments about your experience
      type: text
      options: []
      required: false
    - id: 21
      name: follow_up_permission
      label: May We Contact You for Follow-Up
      hint: Can we contact you regarding your feedback
      type: select_one
      options:
      - Yes - Please contact me
      - No - No follow-up needed
      required: true
