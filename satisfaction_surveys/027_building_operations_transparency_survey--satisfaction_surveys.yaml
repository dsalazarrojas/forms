inputSchema:
  type: object
  properties:
    title: Building Operations Transparency Survey
    pages:
    - id: 1
      name: survey_date
      label: Survey Date
      hint: When completing this survey
      type: date
      options: []
      required: true
    - id: 2
      name: building_name
      label: Building Name
      hint: Which building do you occupy
      type: text
      options: []
      required: true
    - id: 3
      name: respondent_role
      label: Your Role
      hint: Tenant, owner, employee, etc
      type: select_one
      options:
        - Tenant
        - Owner
        - Employee
        - Manager
        - Other
      required: true
    - id: 4
      name: occupancy_duration
      label: How Long Have You Occupied This Building
      hint: Duration of occupancy
      type: select_one
      options:
        - Less than 6 months
        - 6 months - 1 year
        - 1-2 years
        - 2-5 years
        - Over 5 years
      required: true
    - id: 5
      name: communication_frequency
      label: Frequency of Building Communications
      hint: How often do you hear from management
      type: select_one
      options:
        - Weekly or More
        - Biweekly
        - Monthly
        - Quarterly
        - Rarely
        - Never
      required: true
    - id: 6
      name: communication_clarity
      label: Clarity of Communications From Building Management
      hint: How clear are messages
      type: select_one
      options:
        - Very Clear
        - Clear
        - Somewhat Clear
        - Unclear
        - Very Unclear
      required: true
    - id: 7
      name: information_completeness
      label: Information Provided Is Complete
      hint: Do you get all needed information
      type: select_one
      options:
        - Always Complete
        - Usually Complete
        - Sometimes Complete
        - Rarely Complete
        - Never Complete
      required: true
    - id: 8
      name: maintenance_transparency
      label: Transparency of Maintenance and Repairs
      hint: Do you know what work is being done
      type: select_one
      options:
        - Very Transparent
        - Transparent
        - Somewhat Transparent
        - Not Very Transparent
        - Not Transparent
      required: true
    - id: 9
      name: budget_transparency
      label: Transparency of Building Budget and Finances
      hint: Financial information availability
      type: select_one
      options:
        - Very Transparent
        - Transparent
        - Somewhat Transparent
        - Not Very Transparent
        - Not Transparent
      required: true
    - id: 10
      name: policy_transparency
      label: Clarity of Building Policies
      hint: Are policies clear and communicated
      type: select_one
      options:
        - Very Clear
        - Clear
        - Somewhat Clear
        - Unclear
        - Very Unclear
      required: true
    - id: 11
      name: emergency_communication
      label: Clarity of Emergency Procedures
      hint: Do you understand emergency protocols
      type: select_one
      options:
        - Very Clear
        - Clear
        - Somewhat Clear
        - Unclear
        - Very Unclear
      required: true
    - id: 12
      name: communication_channels
      label: Preferred Communication Channels
      hint: How do you prefer to receive updates
      type: select_multiple
      options:
        - Email
        - Letter or Notice
        - Phone Call
        - Building Portal
        - Text Message
        - In-Person Meeting
        - Social Media
      required: true
    - id: 13
      name: response_time
      label: Management Response Time to Concerns
      hint: How quickly do they respond
      type: select_one
      options:
        - Same Day
        - 1-2 Days
        - 3-7 Days
        - 1-2 Weeks
        - More than 2 Weeks
        - No Response
      required: true
    - id: 14
      name: concern_resolution
      label: Satisfaction With How Concerns Are Resolved
      hint: Are issues actually fixed
      type: select_one
      options:
        - Very Satisfied
        - Satisfied
        - Neutral
        - Dissatisfied
        - Very Dissatisfied
      required: true
    - id: 15
      name: suggestion_request
      label: Management Actively Seeks Your Feedback
      hint: Are you asked for input
      type: select_one
      options:
        - Always
        - Often
        - Sometimes
        - Rarely
        - Never
      required: true
    - id: 16
      name: action_on_feedback
      label: Management Acts on Resident Feedback
      hint: Do they implement suggestions
      type: select_one
      options:
        - Always
        - Often
        - Sometimes
        - Rarely
        - Never
      required: true
    - id: 17
      name: transparency_improvements
      label: Suggestions for Improving Transparency
      hint: What could be better
      type: text
      options: []
      required: false
    - id: 18
      name: overall_satisfaction
      label: Overall Satisfaction With Transparency
      hint: General assessment
      type: select_one
      options:
        - Very Satisfied
        - Satisfied
        - Neutral
        - Dissatisfied
        - Very Dissatisfied
      required: true
