inputSchema:
  type: object
  properties:
    title: Jewelry Box Protection Survey Form
    pages:
    - id: 1
      name: storage_habits
      label: Storage Habits
      hint: Describe your current storage habits
      type: text
      options: []
      required: false
    - id: 2
      name: protection_features
      label: Protection Features
      hint: What feature do you value most?
      type: select_one
      options:
      - Secure
      - Water resistant
      - Other
      required: false
    - id: 3
      name: satisfaction
      label: Customer Satisfaction
      hint: How satisfied are you?
      type: select_one
      options:
      - Satisfied
      - Not Satisfied
      - Neutral
      required: false
    - id: 4
      name: product_teams
      label: Product Teams
      hint: What do you think about the product teams?
      type: select_one
      options:
      - Agree
      - Disagree
      - Neutral
      required: false
    - id: 5
      name: storage_commissioner
      label: Storage Commissioner
      hint: Who is responsible for your jewelry box?
      type: select_multiple
      options:
      - Box
      - Closet
      - Other
      required: false
    - id: 6
      name: other_issues
      label: Other Issues
      hint: Have you noticed any other issues with the jewelry box?
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 7
      name: design
      label: Design
      hint: How would you rate the design of the jewelry box?
      type: number
      options: []
      required: false
    - id: 8
      name: value_for_money
      label: Value for Money
      hint: How would you rate the value for money of the jewelry box?
      type: number
      options: []
      required: false
