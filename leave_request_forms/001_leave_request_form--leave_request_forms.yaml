inputSchema:
  type: object
  properties:
    title: Leave Request Form
    pages:
    - id: 1
      name: employee_name
      label: employee name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: start_date
      label: start date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: end_date
      label: end date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: leave_type
      label: leave type
      hint: null
      type: select_one
      options:
      - Sick Leave
      - Vacation Leave
      - Personal Leave
      required: false
    - id: 5
      name: reason_for_leave
      label: reason for leave
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: manager_approvals
      label: manager approvals
      hint: null
      type: select_multiple
      options:
      - Approve
      - Reject
      - Pending
      required: false
    - id: 7
      name: manager_comment
      label: manager comment
      hint: null
      type: text
      options: []
      required: false
