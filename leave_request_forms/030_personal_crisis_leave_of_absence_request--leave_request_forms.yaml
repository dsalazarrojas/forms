inputSchema:
  type: object
  properties:
    title: Personal Crisis Leave Of Absence Request
    pages:
    - id: 1
      name: personal_crisis_leave_of_absence_request_form
      label: Urgent Leave Request
      hint: Please fill this form to request a leave of absence due to an urgent personal
        matter.
      type: text
      options: []
      required: false
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Family and Medical
      - Personal
      - Other
      - Unknown
      required: false
    - id: 3
      name: reason_for_crisis
      label: Reason for crisis
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: employee_name
      label: Employee's name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: manager
      label: Manager's name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: manager_email
      label: Manager's email
      hint: null
      type: email
      options: []
      required: true
    - id: 8
      name: start_date
      label: Start date
      hint: yyyy-mm-dd
      type: date
      options: []
      required: true
    - id: 9
      name: end_date
      label: End date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: manager_approval
      label: Manager approval
      hint: Select the manager's approval
      type: select_one
      options:
      - Approved
      - Not Approved
      - Pending
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: true
