inputSchema:
  type: object
  properties:
    title: COVID 19 Leave Request Form
    pages:
    - id: 1
      name: requester_header
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: manager_name
      label: Manager Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: leave_header
      label: -- Leave Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: leave_reason
      label: Reason for Leave Request
      hint: null
      type: select_one
      options:
      - Tested Positive
      - Exposed to COVID-19
      - Quarantine Order
      - Vaccination Side Effects
      - Family Member Care
      - Health Precaution
      - Other
      required: true
    - id: 9
      name: start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: end_date
      label: Leave End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: duration_days
      label: Number of Days
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: leave_type
      label: Type of Leave
      hint: null
      type: select_multiple
      options:
      - Sick Leave
      - Paid Leave
      - Unpaid Leave
      - Administrative Leave
      required: true
    - id: 13
      name: reason_details
      label: Detailed Reason
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: health_section
      label: -- Health Status --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: symptoms_present
      label: Any symptoms currently
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: symptoms_list
      label: Symptoms
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: test_results
      label: Test Results if applicable
      hint: null
      type: select_one
      options:
      - Positive
      - Negative
      - Pending
      - Not Tested
      required: true
    - id: 18
      name: test_date
      label: Test Date
      hint: null
      type: date
      options: []
      required: false
    - id: 19
      name: clearance_section
      label: -- Return to Work --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: expected_return
      label: Expected Return to Work Date
      hint: null
      type: date
      options: []
      required: true
    - id: 21
      name: medical_clearance
      label: Medical clearance obtained
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Pending
      required: true
    - id: 22
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: agreement
      label: I certify the information is accurate
      hint: null
      type: select_one
      options:
      - Yes, I Certify
      - No, I Do Not Certify
      required: true
