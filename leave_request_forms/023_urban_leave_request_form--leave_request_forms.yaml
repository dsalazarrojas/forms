inputSchema:
  type: object
  properties:
    title: Urban Leave Request Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: leave_start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: leave_end_date
      label: Leave End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: leave_type
      label: Leave Type
      hint: null
      type: select_one
      options:
      - Leave Request
      - Other
      - Vacation
      - Sick Leave
      - Parental Leave
      - Bereavement Leave
      - Family Care Leave
      - Annual Leave
      - Jury Duty
      - Other Leave
      required: false
    - id: 5
      name: reason
      label: Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: leave_request_details
      label: Leave Request Details
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: manager_approvement
      label: Manager's Approval
      hint: null
      type: select_multiple
      options:
      - Approved
      - Rejected
      - Pending
      required: false
