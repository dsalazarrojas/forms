      - '{''value'': ''March''}'
      - '{''value'': ''April''}'
      - '{''value'': ''May''}'
      - '{''value'': ''June''}'
      - '{''value'': ''July''}'
      - '{''value'': ''August''}'
      - '{''value'': ''September''}'
      - '{''value'': ''October''}'
      - '{''value'': ''November''}'
      - '{''value'': ''December''}'
      required: false
    - id: 4
      name: leave_type
      label: Leave Type
      hint: null
      type: select_one
      options:
      - '{''value'': ''Vacation''}'
      - '{''value'': ''Sick''}'
      - '{''value'': ''Other''}'
