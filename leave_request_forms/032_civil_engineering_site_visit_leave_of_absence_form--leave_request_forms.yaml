inputSchema:
  type: object
  properties:
    title: Civil Engineering Site Visit Leave Of Absence Form
    pages:
    - id: 1
      name: employee_name
      label: Employee name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Internal identifier
      type: text
      options: []
      required: true
    - id: 3
      name: site_visit_start
      label: Site visit start date
      hint: Date of departure
      type: date
      options: []
      required: true
    - id: 4
      name: site_visit_end
      label: Site visit end date
      hint: Date of return
      type: date
      options: []
      required: true
    - id: 5
      name: destination
      label: Destination of site visit
      hint: Location and site name
      type: text
      options: []
      required: true
    - id: 6
      name: reason_for_leave
      label: Reason for leave
      hint: Brief description of purpose
      type: text
      options: []
      required: true
    - id: 7
      name: supervisor_approval
      label: Supervisor approval status
      hint: To be completed by supervisor
      type: select_one
      options:
      - Approved
      - Pending
      - Denied
      required: true
    - id: 8
      name: contact_during_leave
      label: Contact during leave
      hint: Phone or email while away
      type: text
      options: []
      required: false
    - id: 9
      name: safety_briefing_completed
      label: Safety briefing completed
      hint: Confirm site specific safety briefing
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: submission_date
      label: Submission date
      hint: Use today date
      type: date
      options: []
      required: true
