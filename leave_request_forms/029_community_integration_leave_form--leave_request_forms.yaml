inputSchema:
  type: object
  properties:
    title: Community Integration Leave Form
    pages:
    - id: 1
      name: section_employee
      label: -- Employee Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department_name
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: section_request
      label: -- Leave Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: leave_type
      label: Type of Community Integration Leave
      hint: null
      type: select_one
      options:
      - Hands-on Volunteering
      - Community Board/Committee Service
      - Professional Skills Pro-bono
      - Civic Advocacy Event
      - Other Community Activity
      required: true
    - id: 7
      name: leave_start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: leave_end_date
      label: Leave End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: total_hours
      label: Total Work Hours Requested
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: organization_name
      label: Name of the Community Organization
      hint: Where will you be serving?
      type: text
      options: []
      required: true
    - id: 11
      name: activity_description
      label: Description of the Planned Community Activity
      hint: Briefly describe your role and activities
      type: text
      options: []
      required: true
    - id: 12
      name: community_benefit
      label: How does this activity benefit the local community?
      hint: Explain the positive impact
      type: text
      options: []
      required: true
    - id: 13
      name: supervisor_approval
      label: Supervisor Preliminary Approval Status
      hint: Final approval pending HR review
      type: select_one
      options:
      - Pending
      - Provisionally Approved
      - Denied
      required: true
    - id: 14
      name: employee_signature
      label: Employee Electronic Signature
      hint: Type name to sign
      type: text
      options: []
      required: true
    - id: 15
      name: submission_date
      label: Date of Request Submission
      hint: null
      type: date
      options: []
      required: true
