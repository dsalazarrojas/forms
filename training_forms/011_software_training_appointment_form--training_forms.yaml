inputSchema:
  type: object
  properties:
    title: software_training_appointment_form
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: training_dates
      label: Select Training Dates
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: training_time_slots
      label: Select Time Slots
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: trainer_info
      label: Trainer Information
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: training_location
      label: Training Location
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: appointment_confirmation
      label: Appointment Confirmation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: training_schedule
      label: Training Schedule
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: training_notes
      label: Training Notes
      hint: null
      type: note
      options: []
      required: false
