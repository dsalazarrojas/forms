      label: control_measures
      hint: Describe the control measures taken or recommended
      type: text
      options: []
      required: false
    - id: 5
      name: reporting_procedure
      label: reporting_procedure
      hint: null
      type: select_multiple
      options:
      - Reporting
      - Investigation
      - Corrective action
      required: false
    - id: 6
      name: training_materials
      label: training_materials
      hint: What training materials were used
      type: select_one
      options:
      - Video
      - Presentation
      - Manual
      required: false
    - id: 7
      name: training_location
      label: training_location
      hint: Location of the training session
      type: text
      options: []
      required: false
    - id: 8
