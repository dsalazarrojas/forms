inputSchema:
  type: object
  properties:
    title: Workplace Hazard Identification Training Form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: risk_factors
      label: risk_factors
      hint: null
      type: select_multiple
      options:
      - Risk
      - Hazard
      - Injury
      required: false
    - id: 3
      name: risk_factors_description
      label: description
      hint: Please provide a description of the identified hazard
      type: text
      options: []
      required: false
    - id: 4
