      type: number
      options: []
      required: false
    - id: 13
      name: evaluation
      label: evaluation
      hint: How would you rate the effectiveness of the training session
      type: select_one
      options:
      - Effective
      - Not effective
      - Somewhat effective
      required: false
    - id: 14
      name: evaluation_comments
