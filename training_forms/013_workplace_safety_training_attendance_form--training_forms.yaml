inputSchema:
  type: object
  properties:
    title: Workplace Safety Training Attendance Form
    pages:
    - id: 1
      name: training_session_details
      label: Training Session Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: employee_id
      label: Employee ID
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: session_attended
      label: Session Attended
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: attended_session
      label: Attended Session
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: supervisor_comments
      label: Supervisor Comments
      hint: null
      type: text
      options: []
      required: false
