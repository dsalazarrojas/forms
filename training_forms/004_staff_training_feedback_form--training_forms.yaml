    - id: 6
      name: overall_satisfaction
      label: Overall Satisfaction
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: trainer_attentiveness
      label: Trainer Attentiveness
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: additional_comments
