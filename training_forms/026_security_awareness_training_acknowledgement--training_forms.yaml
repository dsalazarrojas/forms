inputSchema:
  type: object
  properties:
    title: Security_Awareness_Training_Acknowledgement
    pages:
    - id: 1
      name: acknowledgement_form
      label: Acknowledgement
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: training_completed
      label: Has_training_been_completed
      hint: null
      type: select_one
      options:
      - Training has not yet been completed
      - 'True'
      - 'False'
      required: true
    - id: 3
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone_number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: training_program
      label: Training_program
      hint: null
      type: select_one
      options:
      - Basic
      - Advanced
      - Intermediate
      required: true
    - id: 7
      name: training_status
      label: Training_status
      hint: null
      type: select_multiple
      options:
      - Pending
      - Completed
      - Not started
      required: false
    - id: 8
      name: completion_date
      label: Completion_date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: completion_time
      label: Completion_time
      hint: null
      type: time
      options: []
      required: true
