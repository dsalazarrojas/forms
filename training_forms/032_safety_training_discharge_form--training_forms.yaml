inputSchema:
  type: object
  properties:
    title: Safety Training Discharge Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: training_program
      label: Training Program
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: training_location
      label: Training Location
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: training_instructor
      label: Training Instructor
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: supervisor_name
      label: Supervisor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: supervisor_title
      label: Supervisor Title
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: training_session_notes
      label: Training Session Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: employee_signature
      label: Employee Signature
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
