inputSchema:
  type: object
  properties:
    title: Employee Training Platform Usability Evaluation Form
    pages:
    - id: 1
      name: user_input
      label: employee_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: training_experience
      label: training_experiences
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Neutral
      - Poor
      required: false
    - id: 3
      name: training_platform
      label: training_platform
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Poor
      required: false
    - id: 4
      name: overall_satisfaction
      label: overall_satisfaction
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Neutral
      - Poor
      required: false
    - id: 5
      name: suggestions
      label: suggestions_for_improvement
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: assigned_to
      label: assigned_to
      hint: null
      type: text
      options: []
      required: false
