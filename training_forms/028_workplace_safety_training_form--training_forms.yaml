inputSchema:
  type: object
  properties:
    title: Workplace Safety Training Form
    pages:
    - id: 1
      name: training_sessions
      label: Training Sessions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: training_start_time
      label: Training Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: training_end_time
      label: Training End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: training_location
      label: Training Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: training_supervisor
      label: Training Supervisor
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: training_attendance
      label: Attendance
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: employee_email
      label: Employee E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: employee_phone
      label: Employee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: training_status
      label: Training Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
