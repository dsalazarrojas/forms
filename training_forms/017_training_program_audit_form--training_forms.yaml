inputSchema:
  type: object
  properties:
    title: Training Program Audit Form
    pages:
    - id: 1
      name: form_id
      label: Form ID
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: program_description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: program_category
      label: Category
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: program_effectiveness
      label: Effectiveness
      hint: null
      type: select_one
      options:
      - Very Effective
      - Somewhat Effective
      - Not Effective
      required: true
    - id: 5
      name: participant_satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 6
      name: participant_feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: output_file
      label: Output File
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: assigned_user
      label: User
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: category_id
      label: Category ID
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: category
      label: Category (2)
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: description
      label: Description (2)
      hint: null
      type: text
      options: []
      required: false
