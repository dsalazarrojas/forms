inputSchema:
  type: object
  properties:
    title: Behavioral Finance Biases Quiz
    pages:
      - id: 1
        name: learner_name
        label: Learner Name
        hint: null
        type: text
        options: []
        required: true
      - id: 2
        name: quiz_date
        label: Quiz Date
        hint: null
        type: date
        options: []
        required: true
      - id: 3
        name: experience_level
        label: Your Experience Level with Investing
        hint: null
        type: select_one
        options:
          - Beginner
          - Intermediate
          - Advanced
          - Professional
        required: true
      - id: 4
        name: question_1
        label: What is Confirmation Bias in Investing
        hint: Select the best answer
        type: select_one
        options:
          - Seeking information that confirms existing beliefs
          - Making hasty investment decisions
          - Following the crowd in investment choices
          - Overestimating investment returns
        required: true
      - id: 5
        name: question_2
        label: Overconfidence Bias Occurs When
        hint: null
        type: select_one
        options:
          - Investors underestimate their abilities
          - Investors overestimate their knowledge
          - Market conditions are uncertain
          - Information is limited
        required: true
      - id: 6
        name: question_3
        label: Herd Mentality in Finance Means
        hint: null
        type: select_one
        options:
          - Making individual investment decisions
          - Following expert recommendations
          - Following crowd investment trends
          - Diversifying portfolio
        required: true
      - id: 7
        name: question_4
        label: Loss Aversion Bias Refers To
        hint: null
        type: select_one
        options:
          - Fear of market volatility
          - Feeling the pain of losses more than pleasure of gains
          - Avoiding high-risk investments
          - Staying invested during downturns
        required: true
      - id: 8
        name: question_5
        label: Anchoring Bias Happens When
        hint: null
        type: select_one
        options:
          - Historical prices influence investment decisions
          - Investors focus only on recent performance
          - Traders panic sell during declines
          - Portfolios are balanced
        required: true
      - id: 9
        name: question_6
        label: What is Recency Bias
        hint: null
        type: select_one
        options:
          - Overweighting recent market events
          - Forgetting past market lessons
          - Investing in new companies
          - Following long-term trends
        required: true
      - id: 10
        name: question_7
        label: Availability Bias in Investing Means
        hint: null
        type: select_one
        options:
          - Judging investment by easily recalled information
          - Limiting investment options
          - Avoiding stocks that are hard to research
          - Focusing on available capital
        required: true
      - id: 11
        name: question_8
        label: How Can Framing Bias Affect Investments
        hint: null
        type: select_one
        options:
          - By presenting information differently
          - By limiting investment choices
          - By diversifying portfolios
          - By using fixed returns
        required: true
      - id: 12
        name: question_9
        label: Sunk Cost Fallacy in Investing Refers To
        hint: null
        type: select_one
        options:
          - Continuing to hold losing investments
          - Selling winning investments
          - Taking on excessive risk
          - Not rebalancing portfolio
        required: true
      - id: 13
        name: question_10
        label: How to Mitigate Behavioral Biases
        hint: null
        type: select_one
        options:
          - Use emotions to guide decisions
          - Follow a discipline investment plan
          - React quickly to market news
          - Concentrate in few investments
        required: true
      - id: 14
        name: quiz_score
        label: Your Quiz Score
        hint: Will be calculated automatically
        type: text
        options: []
        required: false
      - id: 15
        name: key_takeaway
        label: Key Takeaway from This Quiz
        hint: What is the most important lesson
        type: text
        options: []
        required: false
      - id: 16
        name: improve_understanding
        label: Areas Where You Would Like More Clarity
        hint: null
        type: text
        options: []
        required: false
      - id: 17
        name: apply_knowledge
        label: How Will You Apply This Knowledge
        hint: null
        type: text
        options: []
        required: false
