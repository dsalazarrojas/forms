inputSchema:
  type: object
  properties:
    title: cross-training-feedback-survey
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: feedback
      label: What did you like most about the training
      hint: Tell us about your favorite part
      type: text
      options: []
      required: false
    - id: 5
      name: what_did_you_like_least
      label: What did you like least about the training
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: rating
      label: How would you rate this training
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: select_one
      label: Which of the following topics did you find most beneficial
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: select_multiple
      label: Which of the following topics were you exposed to
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: date_of_training
      label: What is your date of training
      hint: null
      type: date
      options: []
      required: false
