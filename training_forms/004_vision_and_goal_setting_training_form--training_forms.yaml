inputSchema:
  type: object
  properties:
    title: Vision And Goal Setting Training Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: role
      label: Role
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: current_level
      label: Current Level
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: desired_level
      label: Desired Level
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: current_goal_status
      label: Current Goal Status
      hint: null
      type: select_one
      options:
      - Not Started
      - In Progress
      - Completed
      - On Hold
      required: false
    - id: 7
      name: goal_completion_date
      label: Goal Completion Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
