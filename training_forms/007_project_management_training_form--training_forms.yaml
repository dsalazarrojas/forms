inputSchema:
  type: object
  properties:
    title: Project Management Training Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: participant_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: department
      label: department
      hint: null
      type: select_one
      options:
      - Department A
      - Department B
      - Department C
      required: false
    - id: 4
      name: training_sessions
      label: training_sessions
      hint: null
      type: select_multiple
      options:
      - Session 1
      - Session 2
      - Session 3
      required: false
    - id: 5
      name: training_date
      label: training_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: training_time
      label: training_time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: participant_phone
      label: participant_phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
