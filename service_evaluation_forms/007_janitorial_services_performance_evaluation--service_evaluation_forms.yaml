inputSchema:
  type: object
  properties:
    title: janitorial_services_performance_evaluation
    pages:
    - id: 1
      name: purpose
      label: What is the purpose of this evaluation form?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: quality_of_services
      label: How would you rate the overall quality of the services provided?
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 3
      name: areas_met_expectations
      label: Which areas of the services met your expectations?
      hint: null
      type: select_multiple
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 4
      name: staff_courtesy
      label: Were the janitorial staff courteous and respectful?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: cleanliness_and_organization
      label: Did the janitorial staff meet the required standards for cleanliness
        and organization?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: recommendation
      label: Would you recommend the services to others?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: next_evaluation_date
      label: What date would you like to schedule the next evaluation?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: communication
      label: How would you rate the communication between the janitorial staff and
        you/your team?
      hint: null
      type: radio
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 9
      name: next_evaluation_time
      label: What time do you expect the next evaluation?
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: comments_feedback
      label: Do you have any comments or feedback on the services?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: timeliness
      label: How would you rate the timeliness of the services?
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Poor
      required: true
    - id: 12
      name: staff_equipment
      label: Are the janitorial staff properly equipped with the necessary cleaning
        supplies?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
