      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_type
      label: service_type
      hint: null
      type: select_one
      options:
      - Air Conditioner
      - Furnace
      - Water Heater
      required: true
    - id: 3
      name: priority_level
      label: Priority Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 4
      name: schedule_visit
      label: Schedule Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: service_notes
      label: Service Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
