inputSchema:
  type: object
  properties:
    title: Flip Sample Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: product_experience
      label: Product experience
      hint: null
      type: select_one
      options:
      - Not satisfied
      - Somewhat satisfied
      - Satisfied
      - Very satisfied
      required: false
    - id: 6
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Category 1
      - Category 2
      - Category 3
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
