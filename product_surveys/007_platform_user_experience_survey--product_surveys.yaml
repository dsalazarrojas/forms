inputSchema:
  type: object
  properties:
    title: platform_user_experience_survey
    pages:
    - id: 1
      name: introduction
      label: What is your experience with our platform?
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: user_satisfaction
      label: How satisfied are you with the platform?
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Not Satisfied
      required: true
    - id: 3
      name: product_improvement
      label: What features would you like to see added or improved?
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: issue_description
      label: Describe any issues you've encountered with the platform
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: feedback
      label: Do you have any feedback or suggestions for the platform?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: contact_info
      label: What is your email address and phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: preferred_channel
      label: Do you prefer to communicate through email, in-app, phone, or other?
      hint: null
      type: select_one
      options:
      - Email
      - In-App
      - Phone
      - Other
      required: true
    - id: 8
      name: other_info
      label: Do you have any other comments or details to share?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Is there anything else you'd like to add or comment on?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: conclusion
      label: What are your final thoughts on the platform?
      hint: null
      type: note
      options: []
      required: true
    - id: 11
      name: terms_and_conditions
      label: Have you read and understood the terms and conditions?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: date_completed
      label: What date did you complete this survey?
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: time_completed
      label: What time did you complete this survey?
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: rating
      label: How would you rate the platform overall?
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: platform_experience
      label: Describe your overall experience with the platform?
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: platform_contact
      label: What is your preferred method of contact (email, in-app, phone, etc.)?
      hint: null
      type: select_multiple
      options:
      - Email
      - In-App
      - Phone
      - Other
      required: true
    - id: 17
      name: additional_comments
      label: Do you have any additional comments or thoughts?
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: final_comments
      label: Are there any final comments or thoughts you'd like to add?
      hint: null
      type: text
      options: []
      required: false
