inputSchema:
  type: object
  properties:
    title: embossed_product_feedback_survey
    pages:
    - id: 1
      name: product_feedback
      label: What do you think about this product?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_rating
      label: Rate this product
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 3
      name: product_recommend
      label: Would you recommend this product to a friend?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: additional_feedback
      label: Additional feedback about this product
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email us at
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: product_type
      label: What type of product is this?
      hint: null
      type: select_one
      options:
      - Product A
      - Product B
      - Product C
      required: false
