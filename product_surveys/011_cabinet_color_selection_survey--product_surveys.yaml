inputSchema:
  type: object
  properties:
    title: Cabinet Color Selection Survey
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Optional - for follow-up questions
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: For survey results or follow-up
        type: email
        options: []
        required: false
      - id: 3
        name: respondent_type
        label: I Am A
        hint: What best describes you
        type: select_one
        options:
          - Homeowner
          - Interior Designer
          - Contractor
          - Cabinet Retailer
          - Architect
          - Other
        required: true
      - id: 4
        name: project_type
        label: Project Type
        hint: What type of project is this for
        type: select_one
        options:
          - New construction
          - Kitchen remodel
          - Bathroom remodel
          - Commercial space
          - Furniture piece
          - Other
        required: true
      - id: 5
        name: preferred_color_family
        label: Preferred Color Family
        hint: Which color family do you prefer
        type: select_one
        options:
          - White and off-whites
          - Gray and greige
          - Brown and wood tones
          - Blue tones
          - Green tones
          - Black and dark tones
          - Bold colors
        required: true
      - id: 6
        name: specific_white_preference
        label: White Shade Preference
        hint: If choosing white, which shade
        type: select_one
        options:
          - Pure white
          - Warm white
          - Cool white
          - Creamy white
          - Not applicable
        required: false
      - id: 7
        name: specific_gray_preference
        label: Gray Shade Preference
        hint: If choosing gray, which shade
        type: select_one
        options:
          - Light gray
          - Medium gray
          - Dark charcoal
          - Greige (gray-beige)
          - Blue-gray
          - Not applicable
        required: false
      - id: 8
        name: wood_tone_preference
        label: Wood Tone Preference
        hint: If choosing wood, which tone
        type: select_one
        options:
          - Light natural
          - Honey oak
          - Medium cherry
          - Dark walnut
          - Espresso
          - Not applicable
        required: false
      - id: 9
        name: finish_preference
        label: Finish Preference
        hint: What type of finish do you prefer
        type: select_one
        options:
          - Matte
          - Satin
          - Semi-gloss
          - High gloss
          - Distressed
          - Natural wood grain
        required: true
      - id: 10
        name: hardware_finish
        label: Hardware Finish Preference
        hint: Preferred knob and pull finish
        type: select_one
        options:
          - Brushed nickel
          - Polished chrome
          - Oil-rubbed bronze
          - Matte black
          - Brass or gold
          - Copper
          - No preference
        required: false
      - id: 11
        name: style_preference
        label: Cabinet Style Preference
        hint: What cabinet door style
        type: select_one
        options:
          - Shaker
          - Flat panel
          - Raised panel
          - Beaded inset
          - Slab
          - Glass front
        required: true
      - id: 12
        name: two_tone_interest
        label: Two-Tone Cabinet Interest
        hint: Would you consider two-tone cabinets
        type: select_one
        options:
          - Yes, love the look
          - Maybe, depends on colors
          - No, prefer single color
        required: false
      - id: 13
        name: color_confidence
        label: Color Decision Confidence
        hint: How confident are you in your color choice
        type: select_one
        options:
          - Very confident
          - Somewhat confident
          - Need more samples
          - Need professional help
        required: false
      - id: 14
        name: budget_range
        label: Budget Range for Cabinets
        hint: Approximate budget for cabinet project
        type: select_one
        options:
          - Under $5,000
          - $5,000-$10,000
          - $10,000-$20,000
          - $20,000-$35,000
          - Over $35,000
        required: false
      - id: 15
        name: timeline
        label: Project Timeline
        hint: When do you plan to purchase
        type: select_one
        options:
          - Immediately
          - Within 1 month
          - 1-3 months
          - 3-6 months
          - Just browsing
        required: false
      - id: 16
        name: additional_comments
        label: Additional Comments
        hint: Any other color preferences or questions
        type: text
        options: []
        required: false
