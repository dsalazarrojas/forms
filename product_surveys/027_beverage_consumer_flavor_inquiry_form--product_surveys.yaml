inputSchema:
  type: object
  properties:
    title: Beverage Consumer Flavor Inquiry Form
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Enter your name
        type: text
        options: []
        required: true
      - id: 2
        name: respondent_email
        label: Email Address
        hint: For follow-up surveys if needed
        type: email
        options: []
        required: true
      - id: 3
        name: age_range
        label: Age Range
        hint: Select your age group
        type: select_one
        options:
          - Under 18
          - 18 to 24
          - 25 to 34
          - 35 to 44
          - 45 to 54
          - 55 to 64
          - 65 or Older
        required: true
      - id: 4
        name: gender
        label: Gender
        hint: Select your gender
        type: select_one
        options:
          - Male
          - Female
          - Non-Binary
          - Prefer Not to Say
          - Other
        required: false
      - id: 5
        name: location
        label: Location
        hint: City and state where you live
        type: text
        options: []
        required: true
      - id: 6
        name: beverage_category
        label: Beverage Category
        hint: Which type of beverage are you interested in
        type: select_one
        options:
          - Carbonated Soft Drinks
          - Energy Drinks
          - Sports Drinks
          - Juice
          - Tea
          - Coffee
          - Water
          - Alcoholic Beverages
          - Plant-Based Milk
          - Other
        required: true
      - id: 7
        name: flavor_preferences
        label: Preferred Flavors
        hint: What flavors do you enjoy most
        type: select_multiple
        options:
          - Citrus
          - Berry
          - Tropical
          - Apple
          - Grape
          - Cherry
          - Peach
          - Mango
          - Watermelon
          - Vanilla
          - Chocolate
          - Coffee
          - Mint
          - Spiced
          - Unsweetened
        required: true
      - id: 8
        name: sweetness_level
        label: Preferred Sweetness Level
        hint: How sweet do you like your beverages
        type: select_one
        options:
          - Very Sweet
          - Moderately Sweet
          - Slightly Sweet
          - Not Sweet
          - Unsweetened
        required: true
      - id: 9
        name: carbonation_preference
        label: Carbonation Preference
        hint: Do you prefer carbonated or still beverages
        type: select_one
        options:
          - Highly Carbonated
          - Lightly Carbonated
          - Either is Fine
          - Prefer Still
          - Still Only
        required: true
      - id: 10
        name: purchase_frequency
        label: Purchase Frequency
        hint: How often do you buy flavored beverages
        type: select_one
        options:
          - Daily
          - Several times a week
          - Once a week
          - 2-3 times a month
          - Once a month
          - Rarely
        required: true
      - id: 11
        name: purchase_location
        label: Where Do You Usually Purchase
        hint: Where do you typically buy beverages
        type: select_multiple
        options:
          - Grocery Store
          - Convenience Store
          - Gas Station
          - Online
          - Vending Machine
          - Restaurant
          - Coffee Shop
          - Specialty Store
        required: true
      - id: 12
        name: price_range
        label: Typical Price Range
        hint: How much do you usually spend per beverage
        type: select_one
        options:
          - Under $1
          - $1 to $2
          - $2 to $3
          - $3 to $5
          - Over $5
        required: true
      - id: 13
        name: brand_loyalty
        label: Brand Loyalty
        hint: How loyal are you to specific brands
        type: select_one
        options:
          - Very Loyal
          - Somewhat Loyal
          - Neutral
          - Like to Try New Brands
          - Always Switch for Price
        required: true
      - id: 14
        name: health_consciousness
        label: Health Consciousness
        hint: How important are health factors in your choice
        type: select_one
        options:
          - Very Important
          - Important
          - Somewhat Important
          - Not Very Important
          - Not Important at All
        required: true
      - id: 15
        name: important_factors
        label: Important Purchase Factors
        hint: What factors influence your purchase decision
        type: select_multiple
        options:
          - Taste
          - Price
          - Brand
          - Health Benefits
          - Ingredients
          - Packaging
          - Sustainability
          - Caffeine Content
          - Sugar Content
          - Availability
        required: true
      - id: 16
        name: new_flavor_interest
        label: Interest in Trying New Flavors
        hint: Would you try new or unique flavors
        type: select_one
        options:
          - Always Willing to Try
          - Sometimes
          - Rarely
          - Prefer Familiar Flavors
          - Never
        required: true
      - id: 17
        name: flavor_suggestions
        label: Flavor Suggestions
        hint: What new flavors would you like to see
        type: text
        options: []
        required: false
      - id: 18
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback about beverage flavors
        type: text
        options: []
        required: false
