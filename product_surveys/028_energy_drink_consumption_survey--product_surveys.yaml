inputSchema:
  type: object
  properties:
    title: Energy Drink Consumption Survey
    pages:
    - id: 1
      name: energy_drink_consumption_survey
      label: Energy Drink Consumption
      hint: null
      type: select_one
      options:
      - Never Consumed
      - Less than once a month
      - 1-2 times a month
      - 3-4 times a month
      - Daily
      required: true
    - id: 2
      name: consumption_frequency_other
      label: Other
      hint: If other, please specify the frequency
      type: text
      options: []
      required: false
    - id: 3
      name: reasons_for_consumption
      label: Reasons for Consumption
      hint: null
      type: select_multiple
      options:
      - Energy and alertness
      - Taste
      - Social events
      - To relax or relieve stress
      required: true
    - id: 4
      name: reasons_for_consumption_other
      label: Reasons For Consumption Other
      hint: If other, please specify your reason
      type: text
      options: []
      required: false
    - id: 5
      name: side_effects
      label: Side Effects
      hint: null
      type: select_multiple
      options:
      - Headaches
      - Insomnia
      - Anxiety
      - High blood pressure
      required: true
    - id: 6
      name: side_effects_other
      label: Side Effects Other
      hint: If other, please specify the side effect
      type: text
      options: []
      required: false
    - id: 7
      name: consumption_amount
      label: Consumption Amount
      hint: null
      type: select_multiple
      options:
      - Less than 500ml
      - 500ml-1000ml
      - 1-2L
      - 2-4L
      - 4L or more
      required: true
    - id: 8
      name: consumption_amount_other
      label: Consumption Amount Other
      hint: If other, please specify the amount
      type: text
      options: []
      required: false
    - id: 9
      name: duration_of_consumption
      label: Duration of Consumption
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: daily_routine
      label: Daily Routine
      hint: null
      type: text
      options: []
      required: false
