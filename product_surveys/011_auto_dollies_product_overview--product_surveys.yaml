inputSchema:
  type: object
  properties:
    title: Auto Dollies Product Overview
    pages:
    - id: 1
      name: buyer_info_header
      label: -- Prospective Buyer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your complete name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: For product info and quotes
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: To discuss your requirements
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Leave blank if personal use
      type: text
      options: []
      required: false
    - id: 6
      name: product_interest_header
      label: -- Product Interest --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: interested_dollie_models
      label: Interested Dollie Models
      hint: Select the products you want to learn more about
      type: select_multiple
      options:
      - Standard Duty
      - Heavy Duty
      - Car Casters
      - Tire Skates
      - Hydraulic Dollies
      required: true
    - id: 8
      name: quantity_interested
      label: Quantity Interested
      hint: Estimated number of units
      type: number
      options: []
      required: false
    - id: 9
      name: primary_use_case
      label: Primary Use Case
      hint: How will you be using these dollies?
      type: select_one
      options:
      - Personal Garage
      - Professional Workshop
      - Showroom
      - Storage Facility
      required: true
    - id: 10
      name: sales_conversation_header
      label: -- Sales Conversation --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: timeframe_to_purchase
      label: Timeframe to Purchase
      hint: When are you looking to acquire these?
      type: select_one
      options:
      - Within 30 days
      - 1-3 months
      - 6+ months
      - Just researching
      required: true
    - id: 12
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: How should we reach out?
      type: select_one
      options:
      - Email
      - Phone
      - SMS
      required: true
    - id: 13
      name: request_a_demo
      label: Request a Demo
      hint: Would you like to see a product demonstration?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: specific_questions
      label: Specific Questions or Requirements
      hint: Note any special needs or custom requests
      type: text
      options: []
      required: false
