inputSchema:
  type: object
  properties:
    title: New Beverage Flavor Feedback Survey
    pages:
    - id: 1
      name: drink_name
      label: Drink name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: flavor_profile
      label: Flavor profile
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: overall_satisfaction
      label: Overall satisfaction
      hint: null
      type: select_one
      options:
      - Satisfied
      - Dissatisfied
      required: false
    - id: 4
      name: would_recommend
      label: Would you recommend?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: feedback
      label: What would you improve
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: drink_purchase
      label: Have you purchased this drink?
      hint: null
      type: select_one
      options:
      - '{''label'': True, ''value'': ''Yes''}'
      - '{''label'': False, ''value'': ''No''}'
      required: false
    - id: 7
      name: purchase_frequency
      label: How often do you buy this drink?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: purchase_location
      label: Where do you usually buy this drink?
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Local store'', ''value'': ''Local store''}'
      - '{''label'': ''Online'', ''value'': ''Online''}'
      - '{''label'': ''Other (please specify)'', ''value'': ''Other (please specify)''}'
      required: false
    - id: 9
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: rating
      label: Rating
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: favorite
      label: Is your favorite drink?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: price
      label: What is the price range you're willing to pay?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: price_range
      label: What is the price range you're willing to pay?
      hint: null
      type: number
      options: []
      required: true
    - id: 15
      name: comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 18
      name: time
      label: Time of day
      hint: null
      type: time
      options: []
      required: true
    - id: 19
      name: time_of_day
      label: Time of day
      hint: null
      type: time
      options: []
      required: true
    - id: 20
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 21
      name: date_of_visit
      label: Date of visit
      hint: null
      type: date
      options: []
      required: false
    - id: 22
      name: time_of_visit
      label: Time of visit
      hint: null
      type: time
      options: []
      required: false
    - id: 23
      name: purchase_location_other
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: purchase_location_other_description
      label: Describe where you usually buy this drink?
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: assigned_tool
      label: Assigned tool
      hint: null
      type: select_one
      options:
      - '{''label'': ''JotForm'', ''value'': ''JotForm''}'
      - '{''label'': ''Other'', ''value'': ''Other''}'
      - '{''label'': ''None'', ''value'': ''None''}'
      required: false
