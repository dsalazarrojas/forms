      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 18
      name: price
      label: What do you think is the most expensive part of the motorcycle?
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: reliability
      label: What is your perception of the motorcycle's reliability?
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: fun
      label: How much fun do you have riding this motorcycle?
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: comfort
      label: How comfortable is this motorcycle?
      hint: null
      type: text
      options: []
