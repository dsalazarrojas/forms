    - id: 24
      name: suspension_performance
      label: How would you rate the suspension performance of your motorcycle?
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      required: false
    - id: 25
      name: overall_satisfaction
      label: How satisfied are you with your motorcycle overall?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
