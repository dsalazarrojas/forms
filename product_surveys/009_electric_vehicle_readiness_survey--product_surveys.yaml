      - Online Events
      required: true
    - id: 10
      name: additional_comments
      label: additional_comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: contact_person
      label: contact_person
      hint: null
      type: text
      options: []
      required: false
