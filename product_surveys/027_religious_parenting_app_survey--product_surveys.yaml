inputSchema:
  type: object
  properties:
    title: Religious Parenting App Survey
    pages:
    - id: 1
      name: parent_interests
      label: parent_interests
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: app_features
      label: app_features
      hint: null
      type: select_multiple
      options:
      - Parental Control
      - Parenting Community
      - Prayer Reminders
      - Bible Studies
      required: false
    - id: 3
      name: prayer_practices
      label: prayer_practices
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: app_usage
      label: app_usage
      hint: How often do you use our app?
      type: select_multiple
      options:
      - Daily
      - Weekly
      - Monthly
      - Rarely
      required: true
    - id: 5
      name: feedback
      label: feedback
      hint: Any additional feedback?
      type: text
      options: []
      required: false
    - id: 6
      name: religious_background
      label: religious_background
      hint: null
      type: select_one
      options:
      - Christian
      - Catholic
      - Other
      required: true
    - id: 7
      name: survey_preferences
      label: survey_preferences
      hint: Would you like more survey questions like this in the future?
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: additional_comments
      label: additional_comments
      hint: null
      type: note
      options: []
