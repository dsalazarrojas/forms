inputSchema:
  type: object
  properties:
    title: Seasonal Collection Evaluation Form
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_rating
      label: Product Rating
      hint: null
      type: select_one
      options:
      - '{''value'': 1, ''label'': ''Very Good''}'
      - '{''value'': 2, ''label'': ''Average''}'
      - '{''value'': 3, ''label'': ''Poor''}'
      - '{''value'': 4, ''label'': ''Very Poor''}'
      - '{''value'': 5, ''label'': ''N/A''}'
      required: false
    - id: 3
      name: recommendation
      label: Recommendation
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: category
      label: Category
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: subcategory
      label: Subcategory
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: collection_date
      label: Collection Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: collection_status
      label: Collection Status
      hint: null
      type: select_one
      options:
      - '{''value'': ''In Progress'', ''label'': ''In Progress''}'
      - '{''value'': ''Completed'', ''label'': ''Completed''}'
      - '{''value'': ''N/A'', ''label'': ''N/A''}'
      required: false
    - id: 11
      name: team_members_involved
      label: Team Members Involved
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: ratings_and_comments
      label: Ratings and Comments
      hint: Please provide any relevant feedback or comments for the product line.
      type: text
      options: []
      required: false
