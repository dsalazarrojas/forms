inputSchema:
  type: object
  properties:
    title: Pet Safety Equipment Testing Survey
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: product_name
      label: product_name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: product_type
      label: product_type
      hint: null
