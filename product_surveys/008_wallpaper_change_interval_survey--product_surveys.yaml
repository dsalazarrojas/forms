inputSchema:
  type: object
  properties:
    title: Wallpaper Change Interval Survey
    pages:
    - id: 1
      name: user_frequent_change
      label: How Frequently Do You Change Your Wallpaper?
      hint: null
      type: select_one
      options:
      - Frequent
      - Occasionally
      - Rarely
      - Never
      required: false
    - id: 2
      name: user_reason_for_change
      label: What Influences Your Wallpaper Change Decisions?
      hint: null
      type: select_multiple
      options:
      - Boredom
      - Aesthetics
      - Functionality
      - Other
      required: false
    - id: 3
      name: user_interval
      label: What Is Your Preferred Interval for Changing Your Wallpaper?
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Semiannually
      - Annually
      required: false
    - id: 4
      name: user_email
      label: Do You Have a Contact Email Address for Wallpaper Inquiries?
      hint: Enter your contact email address
      type: email
      options: []
      required: false
    - id: 5
      name: user_phone
      label: Do You Have a Contact Phone Number?
      hint: Enter your contact phone number
      type: text
      options: []
      required: false
    - id: 6
      name: user_additional_notes
      label: Any Additional Notes or Comments?
      hint: null
      type: note
      options: []
      required: false
