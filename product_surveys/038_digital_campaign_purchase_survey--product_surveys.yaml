inputSchema:
  type: object
  properties:
    title: Digital Campaign Purchase Survey
    pages:
    - id: 1
      name: purchase_channel
      label: Purchase Channel
      hint: null
      type: select_multiple
      options:
      - Online
      - In-store
      - 'Other: (please specify)'
      required: false
    - id: 2
      name: purchase_satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - Very satisfied
      - Somewhat satisfied
      - Neutral
      - Somewhat dissatisfied
      - Very dissatisfied
      required: false
    - id: 3
      name: purchase_date
      label: Purchase Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: purchase_time
      label: Purchase Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: purchase_amount
      label: Purchase Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: purchase_spend
      label: Spend
      hint: null
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 7
      name: feedback
      label: Feedback
      hint: null
      type: select_multiple
      options:
      - Good
      - Bad
      - Neutral
      required: false
