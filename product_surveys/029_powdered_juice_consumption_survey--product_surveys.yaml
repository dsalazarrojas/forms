inputSchema:
  type: object
  properties:
    title: Powdered Juice Consumption Survey
    pages:
    - id: 1
      name: survey_header
      label: Survey Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: preferred_product
      label: Preferred Powdered Juice Product
      hint: null
      type: select_one
      options:
      - powdered juice a
      - powdered juice b
      - powdered juice c
      required: false
    - id: 5
      name: purchase_frequency
      label: Purchase Frequency
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: satisfaction
      label: Satisfaction
      hint: null
      type: select_one
      options:
      - very satisfied
      - somewhat satisfied
      - neutral
      - somewhat dissatisfied
      - very dissatisfied
      required: false
    - id: 7
      name: recommended
      label: Recommended to Friends
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: purchase_intent
      label: Purchase Intent
      hint: null
      type: select_multiple
      options:
      - purchase
      - not purchase
      required: false
    - id: 9
      name: purchase_channel
      label: Purchase Channel
      hint: null
      type: select_multiple
      options:
      - online
      - offline
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: survey_footer
      label: Survey Footer
      hint: null
      type: note
      options: []
      required: false
