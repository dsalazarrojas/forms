inputSchema:
  type: object
  properties:
    title: Nail Polish Ingredient Awareness Survey
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: ingredients
      label: What ingredients are you concerned about?
      hint: null
      type: select_multiple
      options:
      - Dibutyl Pthalate
      - Formaldehyde
      - Formaldehyde Resin
      - Parabens
      - Triclosan
      - Uv/uva
      required: false
    - id: 3
      name: ingredient_knowledge
      label: How familiar are you with the ingredients?
      hint: null
      type: select_one
      options:
      - Very Familiar
      - Somewhat Familiar
      - Not Familiar
      required: true
    - id: 4
      name: concerns
      label: What concerns do you have about these ingredients?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: contact_info
      label: How would you like to be contacted?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Not Contacted
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Any additional comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: follow_up
      label: How would you like to be contacted for follow up?
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Not Contacted
      required: true
    - id: 10
      name: confirm_follow_up
      label: Confirm Follow-Up?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: confirm_email
      label: Confirm Email
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 12
      name: confirm_phone
      label: Confirm Phone
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: confirm_follow_up_method
      label: Confirm Follow-Up Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Not Contacted
      required: true
    - id: 14
      name: confirm_follow_up_time
      label: Confirm Follow-Up Time
      hint: null
      type: select_one
      options:
      - 1 hour
      - 1 hour 2 hours
      - 2 hours
      - 3 hours
      - Never
      required: false
    - id: 15
      name: follow_up_time
      label: Follow-Up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 16
      name: comments
      label: Follow-up Comments
      hint: null
      type: text
      options: []
      required: false
