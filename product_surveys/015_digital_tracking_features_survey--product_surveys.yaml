inputSchema:
  type: object
  properties:
    title: Digital Tracking Features Survey
    pages:
    - id: 1
      name: tracking_features
      label: What features do you like about digital tracking?
      hint: null
      type: select_multiple
      options:
      - None
      - Other
      required: true
    - id: 2
      name: tracking_preferences
      label: What are your general privacy preferences regarding digital tracking?
      hint: null
      type: select_one
      options:
      - None
      - Other
      required: true
    - id: 3
      name: tracking_usage
      label: What are your acceptable use cases for digital tracking?
      hint: null
      type: select_multiple
      options:
      - None
      - Other
      required: true
    - id: 4
      name: tracking_concerns
      label: What are your concerns about digital tracking?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: tracking_concerns_other
      label: Are there any other concerns not mentioned?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: tracking_features_important
      label: What features are most important to you in a digital tracking system?
      hint: null
      type: select_multiple
      options:
      - None
      - Other
      required: true
    - id: 7
      name: tracking_privacy
      label: What do you do to protect your privacy when using digital products?
      hint: null
      type: select_multiple
      options:
      - None
      - Other
      required: true
    - id: 8
      name: tracking_why
      label: Why do you use digital products?
      hint: null
      type: select_multiple
      options:
      - None
      - Other
      required: true
