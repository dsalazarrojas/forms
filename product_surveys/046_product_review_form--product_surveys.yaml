inputSchema:
  type: object
  properties:
    title: Product Review Form
    pages:
    - id: 1
      name: product_name
      label: product name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rating
      label: Rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: review
      label: Review
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: recommendation
      label: Would recommend this product
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: review_prophet
      label: Review Prophet
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: date_review_prophets
      label: Date of Last Review
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time_review_prophets
      label: Time of Last Review
      hint: null
      type: time
      options: []
      required: false
