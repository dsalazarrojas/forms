inputSchema:
  type: object
  properties:
    title: Fly Fishing Equipment Feedback
    pages:
    - id: 1
      name: brand
      label: Brand
      hint: null
      type: select_one
      options:
      - Orvis
      - Simms
      - Other
      required: true
    - id: 2
      name: product
      label: Product
      hint: null
      type: select_one
      options:
      - Rod
      - Reel
      - Fishing Waders
      - Other
      required: true
    - id: 3
      name: gear_type
      label: Gear Type
      hint: null
      type: select_multiple
      options:
      - Rod
      - Reel
      - Fishing Waders
      required: true
    - id: 4
      name: gear_condition
      label: Gear Condition
      hint: null
      type: select_one
      options:
      - Very Good
      - Good
      - Fair
      - Bad
      - Unknown
      required: true
    - id: 5
      name: issue
      label: Issue
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Unknown
      required: true
    - id: 6
      name: comment
      label: Comment
      hint: Please provide details about your experience
      type: text
      options: []
      required: false
