inputSchema:
  type: object
  properties:
    title: Beverage Flavor Satisfaction Report Form
    pages:
      - id: 1
        name: respondent_name
        label: Your Name
        hint: Enter your name
        type: text
        options: []
        required: true
      - id: 2
        name: respondent_email
        label: Email Address
        hint: For follow-up if needed
        type: email
        options: []
        required: true
      - id: 3
        name: age_range
        label: Age Range
        hint: Select your age group
        type: select_one
        options:
          - Under 18
          - 18 to 24
          - 25 to 34
          - 35 to 44
          - 45 to 54
          - 55 to 64
          - 65 or Older
        required: true
      - id: 4
        name: beverage_tested
        label: Beverage Tested
        hint: Which beverage did you try
        type: text
        options: []
        required: true
      - id: 5
        name: flavor_name
        label: Flavor Name
        hint: What flavor was the beverage
        type: text
        options: []
        required: true
      - id: 6
        name: tasting_date
        label: Tasting Date
        hint: When did you try this beverage
        type: date
        options: []
        required: true
      - id: 7
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Rate your overall satisfaction
        type: select_one
        options:
          - Very Satisfied
          - Satisfied
          - Neutral
          - Somewhat Dissatisfied
          - Very Dissatisfied
        required: true
      - id: 8
        name: flavor_intensity
        label: Flavor Intensity
        hint: How would you rate the flavor intensity
        type: select_one
        options:
          - Too Weak
          - Slightly Weak
          - Just Right
          - Slightly Strong
          - Too Strong
        required: true
      - id: 9
        name: sweetness_level
        label: Sweetness Level
        hint: How would you rate the sweetness
        type: select_one
        options:
          - Not Sweet Enough
          - Slightly Under-Sweet
          - Just Right
          - Slightly Over-Sweet
          - Too Sweet
        required: true
      - id: 10
        name: tartness_level
        label: Tartness Level
        hint: How would you rate the tartness
        type: select_one
        options:
          - Not Tart Enough
          - Slightly Under-Tart
          - Just Right
          - Slightly Over-Tart
          - Too Tart
        required: false
      - id: 11
        name: aftertaste
        label: Aftertaste
        hint: How would you describe the aftertaste
        type: select_one
        options:
          - Pleasant
          - Neutral
          - Unpleasant
          - Lingering
          - None
        required: true
      - id: 12
        name: texture_rating
        label: Texture Rating
        hint: Rate the mouthfeel and texture
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 13
        name: appearance_rating
        label: Appearance Rating
        hint: Rate the visual appearance
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 14
        name: aroma_rating
        label: Aroma Rating
        hint: Rate the scent or aroma
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 15
        name: flavor_authenticity
        label: Flavor Authenticity
        hint: How authentic does the flavor taste
        type: select_one
        options:
          - Very Authentic
          - Somewhat Authentic
          - Neutral
          - Somewhat Artificial
          - Very Artificial
        required: true
      - id: 16
        name: would_purchase
        label: Would You Purchase This Product
        hint: Is this something you would buy
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 17
        name: would_recommend
        label: Would You Recommend to Others
        hint: Would you recommend this to friends
        type: select_one
        options:
          - Definitely Yes
          - Probably Yes
          - Not Sure
          - Probably No
          - Definitely No
        required: true
      - id: 18
        name: favorite_aspect
        label: What Did You Like Most
        hint: What was your favorite aspect of this flavor
        type: text
        options: []
        required: true
      - id: 19
        name: improvement_suggestions
        label: What Could Be Improved
        hint: What would make this flavor better
        type: text
        options: []
        required: true
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback about this flavor
        type: text
        options: []
        required: false
