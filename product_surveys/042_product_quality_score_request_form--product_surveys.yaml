inputSchema:
  type: object
  properties:
    title: Product Quality Score Request Form
    pages:
    - id: 1
      name: product_quality_score
      label: Product Quality Score
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: product_rating
      label: Product Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Bad
      required: true
    - id: 3
      name: product_comment
      label: Product Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: product_type
      label: Product Type
      hint: null
      type: select_multiple
      options:
      - Mobile
      - Laptops
      - Tablets
      - Desktop
      - Wearable
      - Gaming Console
      required: true
    - id: 9
      name: operating_system
      label: Operating System
      hint: null
      type: select_one
      options:
      - Windows
      - Mac
      - Android
      required: true
    - id: 10
      name: purchase_date
      label: Purchase Date
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: rating_frequency
      label: Rating Frequency
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: comment
      label: Comment
      hint: null
      type: text
      options: []
      required: false
