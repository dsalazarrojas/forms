inputSchema:
  type: object
  properties:
    title: Retail Skincare Product Feedback Survey
    pages:
    - id: 1
      name: introduction
      label: introduction
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: product_id
      label: product id
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: rating
      label: rating
      hint: null
      type: select_one
      options:
      - very good
      - good
      - neutral
      - bad
      - very bad
      required: true
    - id: 4
      name: product_name
      label: product name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: price
      label: price
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: sales_channel
      label: sales channel
      hint: null
      type: select_one
      options:
      - in store
      - online
      - both
      required: true
    - id: 7
      name: recommendation
      label: recommendations
      hint: null
      type: select_multiple
      options:
      - recommend
      - do not recommend
      - maybe
      required: true
    - id: 8
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: contact_email
      label: contact email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: contact_phone
      label: contact phone
      hint: null
      type: text
      options: []
      required: false
