inputSchema:
  type: object
  properties:
    title: feedblend_support_survey
    pages:
    - id: 1
      name: intro
      label: introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: issue_frequency
      label: issue_frequencies
      hint: What are the common issues you experience with the feed blend?
      type: select_one
      options:
      - Rarely
      - Sometime
      - Often
      required: false
    - id: 3
      name: issue_description
      label: issue_description
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: support_channels
      label: support_channels
      hint: What channels do you use to contact us?
      type: select_multiple
      options:
      - Email
      - Call
      - Message
      - Chat
      - Support Ticket
      required: false
    - id: 5
      name: satisfaction
      label: satisfaction
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Somewhat Satisfied
      - Neutral
      - Somewhat Dissatisfied
      - Very Dissatisfied
      required: false
