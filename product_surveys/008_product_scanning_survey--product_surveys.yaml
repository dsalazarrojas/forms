inputSchema:
  type: object
  properties:
    title: Product Scanning Survey
    pages:
    - id: 1
      name: product_scanning_survey
      label: Product Scanning
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: scanning_experience
      label: Scanning Experience
      hint: How would you rate your scanning experience?
      type: select_multiple
      options:
      - Very Good
      - Somewhat Good
      - Not Very Good
      - Not Good
      - Very Bad
      required: false
    - id: 3
      name: scanning_ease_of_use
      label: Ease Of Use
      hint: How easy or hard was it to scan?
      type: select_one
      options:
      - Very Easy
      - Somewhat Easy
      - Neutral
      - Somewhat Hard
      - Very Hard
      required: false
    - id: 4
      name: information_accuracy
      label: Information Accuracy
      hint: How accurate was the information?
      type: select_multiple
      options:
      - Very Accurate
      - Somewhat Accurate
      - Somewhat Inaccurate
      - Not Accurate
      - Very Inaccurate
      required: false
    - id: 5
      name: overall_experience
      label: Overall Experience
      hint: What did you think of your overall experience?
      type: select_one
      options:
      - Very Good
      - Somewhat Good
      - Neutral
      - Somewhat Bad
      - Very Bad
      required: false
    - id: 6
      name: additional_comments
      label: Additional Comments
      hint: Do you have any additional comments or suggestions?
      type: text
      options: []
      required: false
    - id: 7
      name: scanning_frequency
      label: How Often Do You Scan
      hint: How often do you scan?
      type: select_one
      options:
      - Daily
      - Weekly
      - Less than Weekly
      - Rarely
      - Never
      required: false
    - id: 8
      name: scanning_method
      label: How Do You Scan
      hint: What device do you use to scan?
      type: select_multiple
      options:
      - Smartphone
      - Tablet
      - Laptop
      - Desktop
      - Other
      required: false
    - id: 9
      name: scan_location
      label: Scan Location
      hint: Where do you usually scan?
      type: select_multiple
      options:
      - In Store
      - Online
      - Mobile
      - Other
      required: false
    - id: 10
      name: contact_info
      label: Contact Info
      hint: How would you like to be contacted?
      type: select_multiple
      options:
      - Phone
      - Email
      - Mail
      - Other
      required: false
    - id: 11
      name: follow_up
      label: Follow Up
      hint: Would you like to be followed up?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: feedback
      label: Have You Ever Given Feedback
      hint: Have you ever given feedback to us before?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: repeat_feedback
      label: Repeat Feedback
      hint: Would you like to repeat feedback?
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
