inputSchema:
  type: object
  properties:
    title: Sample Job Application Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: resume
      label: Resume
      hint: Upload a resume or CV
      type: text
      options: []
      required: false
    - id: 5
      name: cover_letter
      label: Cover Letter
      hint: Upload a cover letter
      type: text
      options: []
      required: false
    - id: 6
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      - Internship
      required: false
    - id: 8
      name: job_type_other
      label: Job Type Other
      hint: If not full-time, part-time, or contract, describe the length of your
        job
      type: text
      options: []
      required: false
    - id: 9
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
