inputSchema:
  type: object
  properties:
    title: supervisor_evaluation_form
    pages:
    - id: 1
      name: introduction
      label: Introduction
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: rating_section
      label: Rating
      hint: A rating from 1 to 5, where 1 is poor and 5 is exceptional.
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: feedback
      label: Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: action_items
      label: Action Items
      hint: List any specific action items you would like the employee to work on.
      type: text
      options: []
      required: false
    - id: 6
      name: development_plan
      label: Development Plan
      hint: Describe the steps the employee will take to improve performance.
      type: text
      options: []
      required: false
    - id: 7
      name: evaluation_date
      label: Evaluation Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: reviewer_notes
      label: Reviewer Notes
      hint: null
      type: text
      options: []
      required: false
