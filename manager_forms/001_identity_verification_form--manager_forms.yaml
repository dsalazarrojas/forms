inputSchema:
  type: object
  properties:
    title: Identity Verification Form
    pages:
    - id: 1
      name: new_employment
      label: New Employment
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: ssn
      label: Ssn
      hint: Enter your Social Security number
      type: number
      options: []
      required: false
    - id: 3
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: false
