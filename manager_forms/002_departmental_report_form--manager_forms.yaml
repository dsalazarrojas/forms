inputSchema:
  type: object
  properties:
    title: Departmental Report Form
    pages:
    - id: 1
      name: department_name
      label: Department Name
      hint: Please enter the department name
      type: text
      options: []
      required: true
    - id: 2
      name: department_address
      label: Department Address
      hint: Enter your department address
      type: text
      options: []
      required: true
    - id: 3
      name: manager_contact
      label: Manager Contact Information
      hint: Enter your manager's contact information
      type: text
      options: []
      required: true
    - id: 4
      name: select_one_question
      label: Do you have any internal issues?
      hint: Please select 'Yes' or 'No'
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: select_multiple_question
      label: What are some of your department's internal issues?
      hint: Select all that apply
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: date_of_last_update
      label: Date of Last Update
      hint: Enter the date of last update
      type: date
      options: []
      required: true
    - id: 7
      name: time_of_last_update
      label: Time of Last Update
      hint: Enter the time of last update
      type: time
      options: []
      required: true
    - id: 8
      name: department_email
      label: Department Email
      hint: Enter your department email
      type: email
      options: []
      required: true
    - id: 9
      name: department_phone
      label: Department Phone Number
      hint: Enter your department phone number
      type: text
      options: []
      required: true
    - id: 10
      name: document_upload
      label: Upload Document
      hint: Upload a document for reference
      type: text
      options: []
      required: false
