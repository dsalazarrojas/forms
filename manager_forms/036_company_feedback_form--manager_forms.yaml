inputSchema:
  type: object
  properties:
    title: Company Feedback Form
    pages:
    - id: 1
      name: customer_name
      label: Customer full name
      hint: Optional for follow up
      type: text
      options: []
      required: false
    - id: 2
      name: contact_email
      label: Contact email
      hint: For response if provided
      type: email
      options: []
      required: false
    - id: 3
      name: product_or_service
      label: Product or service
      hint: What are you providing feedback about
      type: text
      options: []
      required: true
    - id: 4
      name: rating
      label: Rating
      hint: Overall satisfaction rating
      type: select_one
      options:
      - 5 Excellent
      - 4 Good
      - 3 Fair
      - 2 Poor
      - 1 Very poor
      required: true
    - id: 5
      name: feedback_details
      label: Feedback details
      hint: Please describe your experience
      type: text
      options: []
      required: true
    - id: 6
      name: follow_up_requested
      label: Request follow up
      hint: Choose if you want someone to contact you
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
