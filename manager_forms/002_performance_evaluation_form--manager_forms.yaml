inputSchema:
  type: object
  properties:
    title: Performance Evaluation Form
    pages:
    - id: 1
      name: employee_name
      label: employee_name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: evaluation_date
      label: evaluation_date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: evaluation_status
      label: evaluation_status
      hint: null
      type: select_one
      options:
      - Active
      - Not Active
      - On probation
      - Terminated
      required: false
    - id: 6
      name: employee_id
      label: employee_id
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: job_title
      label: job_title
      hint: null
      type: text
      options: []
      required: false
