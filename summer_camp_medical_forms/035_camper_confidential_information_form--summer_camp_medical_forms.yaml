      hint: For overnight camps
      type: select_one
      options:
      - false
      - Yes - occasional
      - Yes - frequent
      - Prefer not to say
      required: false
    - id: 39
      name: homesickness_concerns
      label: Do You Have Concerns About Homesickness
      hint: Yes or no
      type: select_one
      options:
      - No concerns
      - Mild concerns
      - Moderate concerns
      - Significant concerns
      required: false
