inputSchema:
  type: object
  properties:
    title: Graphic Designer Referral Form
    pages:
    - id: 1
      name: referral_message
      label: Graphic Designer Referral
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: form_1_referral_message
      label: Why are you referring this designer?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: form_1_email
      label: What's the designer's email?
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: form_1_phone
      label: What's the designer's phone?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_1_company
      label: What's the designer's company?
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: form_1_designer_name
      label: What's the designer's name?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: form_1_designer_title
      label: What's the designer's job title?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: form_1_project_details
      label: What were the project details?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: form_1_referral_recommendation
      label: Is this a good designer?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 10
      name: form_1_relationship_to_designer
      label: What's your relationship to the designer?
      hint: null
      type: select_multiple
      options:
      - I'm a client
      - I'm a colleague
      - I'm a friend
      required: true
    - id: 11
      name: form_1_additional_comments
      label: Do you have any other details to share about this designer?
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: form_1_designer_work_quality
      label: How do you rate the designer's work?
      hint: null
      type: radio
      options:
      - Excellent
      - Good
      - Fair
      required: true
