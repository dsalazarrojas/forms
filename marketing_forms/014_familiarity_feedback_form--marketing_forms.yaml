inputSchema:
  type: object
  properties:
    title: Familiarity Feedback Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: how_long_have_you_been_a_customer
      label: How long have you been a customer?
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1 - 5 years
      - 5 - 10 years
      - More than 10 years
      required: false
    - id: 4
      name: how_did_you_hear
      label: How did you hear about us?
      hint: null
      type: select_multiple
      options:
      - Online Search
      - Social Media
      - Word of Mouth
      - Other
      required: false
    - id: 5
      name: how_would_you_rate_your_familiarity_with
      label: How would you rate your familiarity with our product or service?
      hint: null
      type: select_one
      options:
      - Very Low
      - Low
      - Neutral
      - Medium
      - High
      - Very High
      required: false
    - id: 6
      name: how_do_you_rate_our_product_or_service
      label: How do you rate our product or service?
      hint: null
      type: select_one
      options:
      - Very Poor
      - Fair
      - Good
      - Excellent
      - Outstanding
      required: false
    - id: 7
      name: would_you_recommend_us_to_friends_and_family
      label: Would you recommend us to friends and family?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: what_do_you_like_most_about_our_product_or_service
      label: What do you like most about our product or service?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: what_do_you_dislike_most_about_our_product_or_service
      label: What do you dislike most about our product or service?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: how_might_we_improve
      label: How might we improve?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: would_you_like_to_receive_news_and_updates
      label: Would you like to receive news and updates?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
