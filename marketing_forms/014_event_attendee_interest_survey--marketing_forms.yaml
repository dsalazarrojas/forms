      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: event_interest_level
      label: Event Interest Level
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
