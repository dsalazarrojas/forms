inputSchema:
  type: object
  properties:
    title: Banner Request Form
    pages:
    - id: 1
      name: request_date
      label: Request Date
      hint: Date of this request
      type: date
      options: []
      required: true
    - id: 2
      name: requester_name
      label: Requester Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Email Address
      hint: Contact email for updates
      type: email
      options: []
      required: true
    - id: 4
      name: requester_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: department_division
      label: Department or Division
      hint: Your department name
      type: text
      options: []
      required: true
    - id: 6
      name: banner_purpose
      label: Banner Purpose
      hint: What is the banner for?
      type: select_one
      options:
      - Event Promotion
      - Seasonal Campaign
      - Product Launch
      - Fundraiser
      - Conference
      - Sale or Discount
      - Awareness Campaign
      - Other
      required: true
    - id: 7
      name: event_name
      label: Event or Campaign Name
      hint: Name of the event or campaign
      type: text
      options: []
      required: true
    - id: 8
      name: event_date
      label: Event Date
      hint: When is the event?
      type: date
      options: []
      required: true
    - id: 9
      name: banner_placement
      label: Banner Placement Location
      hint: Where will the banner be displayed?
      type: select_one
      options:
      - Website
      - Social Media
      - Physical Location
      - Building Entrance
      - Office Space
      - Street
      - Multiple Locations
      required: true
    - id: 10
      name: banner_dimensions
      label: Banner Dimensions
      hint: Preferred size and format
      type: select_one
      options:
      - Small (2x3 feet)
      - Medium (4x6 feet)
      - Large (8x10 feet)
      - Extra Large (10x20 feet)
      - Custom Size
      - Digital/Web (300x250 pixels)
      - Digital/Web (728x90 pixels)
      required: true
    - id: 11
      name: custom_dimensions
      label: Custom Dimensions
      hint: If custom, specify exact dimensions
      type: text
      options: []
      required: false
    - id: 12
      name: banner_material
      label: Banner Material
      hint: What material should be used?
      type: select_one
      options:
      - Vinyl
      - Fabric
      - Paper
      - Mesh
      - Plastic
      - Fabric with Hardware
      required: true
    - id: 13
      name: design_provided
      label: Do You Have a Design?
      hint: Do you have artwork ready?
      type: select_one
      options:
      - Yes - Will Provide
      - Yes - Attaching
      - No - Need Design
      - Have Concept Only
      required: true
    - id: 14
      name: design_file
      label: Design File Details
      hint: Describe the design or file format
      type: text
      options: []
      required: false
    - id: 15
      name: banner_colors
      label: Preferred Colors
      hint: Primary color scheme
      type: text
      options: []
      required: false
    - id: 16
      name: key_messaging
      label: Key Message or Text
      hint: Main text to appear on banner
      type: text
      options: []
      required: true
    - id: 17
      name: logo_inclusion
      label: Include Logo?
      hint: Should the company logo appear?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Applicable
      required: false
    - id: 18
      name: budget_amount
      label: Budget Amount
      hint: Budget for this banner
      type: number
      options: []
      required: false
    - id: 19
      name: required_by_date
      label: Required By Date
      hint: When do you need the banner?
      type: date
      options: []
      required: true
    - id: 20
      name: urgency_level
      label: Urgency Level
      hint: How urgent is this request?
      type: select_one
      options:
      - Routine
      - Standard
      - Expedited
      - Rush
      required: true
    - id: 21
      name: additional_requests
      label: Additional Requests or Notes
      hint: Any special instructions?
      type: text
      options: []
      required: false
