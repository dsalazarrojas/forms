inputSchema:
  type: object
  properties:
    title: Retail Sale Event Lead Generation Form
    pages:
    - id: 1
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: event_duration
      label: Event Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: store_name
      label: Store Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: event_description
      label: prophets
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: event_category
      label: Event Category
      hint: null
      type: select_multiple
      options:
      - In-Store Event
      - Pop-up
      - Seasonal Sale
      required: false
    - id: 8
      name: interested_parties
      label: Interested Parties
      hint: null
      type: select_one
      options:
      - Customer
      - Non-Customer
      - Both
      required: false
