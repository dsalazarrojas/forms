      - '{''value'': ''High School''}'
      - '{''value'': ''Some college''}'
      - '{''value'': ''College''}'
      - '{''value'': ''Postgraduate''}'
      required: false
    - id: 6
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - '{''value'': ''Female''}'
      - '{''value'': ''Male''}'
      - '{''value'': ''Other''}'
      required: false
    - id: 7
      name: marital_status
      label: Marital Status
      hint: null
      type: select_one
      options:
      - '{''value'': ''Single''}'
      - '{''value'': ''Married''}'
      - '{''value'': ''Divorced''}'
      - '{''value'': ''Widowed''}'
      - '{''value'': ''In a domestic partnership''}'
      required: false
    - id: 8
      name: family_size
      label: Family Size
      hint: null
      type: select_one
      options:
      - '{''value'': 1}'
      - '{''value'': 2}'
      - '{''value'': 3}'
      - '{''value'': 4}'
