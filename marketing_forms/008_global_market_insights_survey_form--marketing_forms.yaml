inputSchema:
  type: object
  properties:
    title: Global Market Insights Survey Form
    pages:
    - id: 1
      name: survey_form
      label: Survey Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: demographic_questions
      label: Demographic Questions
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Age Group 18-24''}'
      - '{''value'': ''Age Group 25-34''}'
      - '{''value'': ''Age Group 35-44''}'
      - '{''value'': ''Age Group 45-54''}'
      - '{''value'': ''Age Group 55-64''}'
      - '{''value'': ''Age Group 65 or above''}'
      required: false
    - id: 3
      name: income_range
      label: Income Range
      hint: null
      type: select_one
      options:
      - '{''value'': ''Less than $25,000''}'
      - '{''value'': ''$25,000-$49,999''}'
      - '{''value'': ''$50,000-$74,999''}'
      - '{''value'': ''$75,000-$99,999''}'
      - '{''value'': ''$100,000 or more''}'
      required: false
    - id: 4
      name: occupation
      label: Occupation
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: education_level
      label: Education Level
      hint: null
      type: select_one
      options:
