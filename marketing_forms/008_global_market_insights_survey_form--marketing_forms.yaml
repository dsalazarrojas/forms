inputSchema:
  type: object
  properties:
    title: Global Market Insights Survey Form
    pages:
    - id: 1
      name: survey_form
      label: Survey Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: demographic_questions
      label: Demographic Questions
      hint: null
      type: select_multiple
      options:
      - Age Group 18-24
      - Age Group 25-34
      - Age Group 35-44
      - Age Group 45-54
      - Age Group 55-64
      - Age Group 65 or above
      required: false
    - id: 3
      name: income_range
      label: Income Range
      hint: null
      type: select_one
      options:
      - Less than $25,000
      - $25,000-$49,999
      - $50,000-$74,999
      - $75,000-$99,999
      - $100,000 or more
      required: false
    - id: 4
      name: occupation
      label: Occupation
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: education_level
      label: Education Level
      hint: null
      type: select_one
      options:
      - Less than High School
      - High School
      - Some college
      - College
      - Postgraduate
      required: false
    - id: 6
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Female
      - Male
      - Other
      required: false
    - id: 7
      name: marital_status
      label: Marital Status
      hint: null
      type: select_one
      options:
      - Single
      - Married
      - Divorced
      - Widowed
      - In a domestic partnership
      required: false
    - id: 8
      name: family_size
      label: Family Size
      hint: null
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - 5 or more
      required: false
    - id: 9
      name: children
      label: Children
      hint: null
      type: select_one
      options:
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - 5 or more
      required: false
    - id: 10
      name: country
      label: Country
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: language
      label: Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Chinese
      - Japanese
      - Arabic
      - Hindi
      required: false
    - id: 12
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: state
      label: State
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
