inputSchema:
  type: object
  properties:
    title: Online Shopping Survey
    pages:
    - id: 1
      name: store_type
      label: store_type
      hint: null
      type: select_one
      options:
      - books
      - magazine
      - clothing
      - furniture
      required: false
    - id: 2
      name: rating
      label: rating
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: rating_scale
      label: rating_scale
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: false
    - id: 4
      name: comment
      label: comment
      hint: How would you rate our service?
      type: note
      options: []
      required: false
    - id: 5
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: feedback
      label: feedback
      hint: How can we improve?
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: assigned_tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 9
      name: other
      label: other
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: other_comments
      label: other_comments
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: form_id
      label: form_id
      hint: null
      type: number
      options: []
      required: false
