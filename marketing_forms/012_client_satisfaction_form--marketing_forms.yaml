inputSchema:
  type: object
  properties:
    title: Client Satisfaction Form
    pages:
    - id: 1
      name: header_section
      label: We value your feedback - help us improve
      hint: This survey will take approximately 5 minutes
      type: note
      options: []
      required: false
    - id: 2
      name: respondent_name
      label: Your Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 3
      name: company_name
      label: Company or Organization Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Email Address
      hint: So we can follow up if needed
      type: email
      options: []
      required: false
    - id: 5
      name: purchase_date
      label: When did you last purchase from us or use our services?
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: service_section
      label: -- Service and Product Quality --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: product_quality
      label: How satisfied are you with the quality of our product or service?
      hint: null
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 8
      name: product_quality_rating
      label: Product or service quality rating - 1 to 5
      hint: 1 = Poor, 5 = Excellent
      type: number
      options: []
      required: true
    - id: 9
      name: met_expectations
      label: Our product or service met or exceeded your expectations
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 10
      name: product_feedback
      label: What did you like best about our product or service?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: improvement_area
      label: What could we improve about our product or service?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: customer_service_section
      label: -- Customer Service and Support --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: service_satisfaction
      label: How satisfied are you with our customer service?
      hint: null
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 14
      name: support_responsiveness
      label: How quickly did we respond to your inquiries or issues?
      hint: null
      type: select_one
      options:
      - Very Slow
      - Slow
      - Average
      - Fast
      - Very Fast
      required: true
    - id: 15
      name: issue_resolution
      label: Were your issues resolved satisfactorily?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Applicable
      required: false
    - id: 16
      name: team_professionalism
      label: Our team was professional and knowledgeable
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 17
      name: value_and_pricing
      label: -- Value and Pricing --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: pricing_fairness
      label: Our pricing is fair and transparent
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 19
      name: value_for_money
      label: You received good value for your money
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 20
      name: purchase_decision
      label: Would you purchase from us again?
      hint: null
      type: select_one
      options:
      - Definitely Not
      - Probably Not
      - Neutral
      - Probably Yes
      - Definitely Yes
      required: true
    - id: 21
      name: recommendation_section
      label: -- Recommendation and Loyalty --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: recommendation_likelihood
      label: How likely are you to recommend us to a friend or colleague?
      hint: null
      type: number
      options: []
      required: true
    - id: 23
      name: likelihood_scale
      label: Scale - 0 = Not at all likely, 10 = Extremely likely
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: loyalty_status
      label: You consider yourself a loyal customer
      hint: null
      type: select_one
      options:
      - Strongly Disagree
      - Disagree
      - Neutral
      - Agree
      - Strongly Agree
      required: true
    - id: 25
      name: overall_satisfaction
      label: -- Overall Satisfaction --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: general_satisfaction
      label: Overall, how satisfied are you with your experience?
      hint: null
      type: select_one
      options:
      - Very Unsatisfied
      - Unsatisfied
      - Neutral
      - Satisfied
      - Very Satisfied
      required: true
    - id: 27
      name: additional_feedback
      label: Additional comments or suggestions
      hint: Anything else we should know?
      type: text
      options: []
      required: false
