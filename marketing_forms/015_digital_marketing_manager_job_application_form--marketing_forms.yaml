inputSchema:
  type: object
  properties:
    title: Digital Marketing Manager Job Application Form
    pages:
    - id: 1
      name: job_application_form_1
      label: What is your current role and job responsibilities?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: job_application_form_2
      label: What motivates you to apply for this position?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: job_application_form_3
      label: Can you tell us about your relevant experience in digital marketing?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: job_application_form_4
      label: What skills do you have that make you a strong candidate for this role?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_application_form_5
      label: What type of employment status do you have (Full-time, Part-time, Freelance)?
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Freelance
      required: true
    - id: 6
      name: job_application_form_6
      label: What level of education have you completed?
      hint: null
      type: select_one
      options:
      - Bachelor's degree
      - Master's degree
      - Ph.D.
      required: true
    - id: 7
      name: job_application_form_7
      label: Can you provide examples of your portfolio?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: job_application_form_8
      label: Do you have any references we can contact?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 9
      name: job_application_form_9
      label: What is your expected salary range for this role?
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: job_application_form_10
      label: Can you provide your current contact information?
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: job_application_form_11
      label: What is your availability for the job?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: job_application_form_12
      label: Can you tell us about your achievements in digital marketing?
      hint: null
      type: text
      options: []
      required: true
