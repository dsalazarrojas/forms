inputSchema:
  type: object
  properties:
    title: Subscription Cancellation Survey Form
    pages:
    - id: 1
      name: customer_cancelled
      label: customer_cancelled
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: reason_for_cancellation
      label: reason_for_cancellation
      hint: null
      type: select_one
      options:
      - Monthly Subscription
      - Yearly Subscription
      - Bi-annual Subscription
      required: false
    - id: 3
      name: service_improvement_area
      label: service_improvement_area
      hint: null
      type: select_multiple
      options:
      - improvement ideas
      - customer support
      - service quality
      required: false
    - id: 4
      name: customer_recommendation
      label: customer_recommendation
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: cancellation_details
      label: cancellation_details
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: satisfaction_level
      label: satisfaction_level
      hint: null
      type: select_one
      options:
      - Very Satisfied
      - Satisfied
      - Neutral
      - Not Satisfied
      - Very Dissatisfied
      required: false
    - id: 7
      name: cancellation_date
      label: cancellation_date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: cancellation_time
      label: cancellation_time
      hint: null
      type: time
      options: []
      required: false
