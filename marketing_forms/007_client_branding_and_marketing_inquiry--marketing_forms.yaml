inputSchema:
  type: object
  properties:
    title: Client Branding And Marketing Inquiry
    pages:
    - id: 1
      name: contact_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: contact_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Legal business name
      type: text
      options: []
      required: true
    - id: 6
      name: company_website
      label: Company Website
      hint: Current website URL
      type: text
      options: []
      required: false
    - id: 7
      name: company_industry
      label: Industry
      hint: Your business sector
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Retail
      - Manufacturing
      - Education
      - Hospitality
      - Real Estate
      - Professional Services
      - Other
      required: true
    - id: 8
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - Solo Entrepreneur
      - 2-10 employees
      - 11-50 employees
      - 51-200 employees
      - 201-500 employees
      - 500+ employees
      required: true
    - id: 9
      name: project_type
      label: Project Type
      hint: What services do you need?
      type: select_multiple
      options:
      - Brand Strategy
      - Logo Design
      - Visual Identity
      - Website Design
      - Social Media Marketing
      - Content Marketing
      - Email Marketing
      - Paid Advertising
      - SEO Services
      - Marketing Consultation
      required: true
    - id: 10
      name: project_goals
      label: Primary Project Goals
      hint: What do you want to achieve?
      type: select_multiple
      options:
      - Increase Brand Awareness
      - Generate More Leads
      - Improve Brand Image
      - Launch New Product
      - Enter New Market
      - Increase Sales
      - Improve Customer Engagement
      - Rebrand Company
      - Other
      required: true
    - id: 11
      name: target_audience
      label: Target Audience
      hint: Describe your ideal customer
      type: text
      options: []
      required: true
    - id: 12
      name: target_demographics
      label: Target Demographics
      hint: Age, gender, location, etc.
      type: text
      options: []
      required: false
    - id: 13
      name: current_branding_status
      label: Current Branding Status
      hint: Do you have existing branding?
      type: select_one
      options:
      - Have Complete Brand Guidelines
      - Have Logo Only
      - Have Some Materials
      - Starting From Scratch
      - Need Rebrand
      required: true
    - id: 14
      name: competitors
      label: Main Competitors
      hint: List 2-3 main competitors
      type: text
      options: []
      required: false
    - id: 15
      name: project_timeline
      label: Project Timeline
      hint: When do you need this completed?
      type: select_one
      options:
      - Within 2 Weeks
      - Within 1 Month
      - Within 3 Months
      - Within 6 Months
      - Flexible
      required: true
    - id: 16
      name: project_budget
      label: Project Budget Range
      hint: Estimated budget for this project
      type: select_one
      options:
      - Under $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - $25,000 - $50,000
      - $50,000 - $100,000
      - Over $100,000
      required: true
    - id: 17
      name: marketing_channels
      label: Marketing Channels of Interest
      hint: Where do you want to market?
      type: select_multiple
      options:
      - Social Media
      - Search Engines
      - Email
      - Content Marketing
      - Influencer Marketing
      - Traditional Advertising
      - Events
      - Public Relations
      required: false
    - id: 18
      name: brand_personality
      label: Brand Personality Traits
      hint: How should your brand feel?
      type: select_multiple
      options:
      - Professional
      - Friendly
      - Innovative
      - Luxurious
      - Affordable
      - Playful
      - Serious
      - Modern
      - Classic
      - Bold
      required: true
    - id: 19
      name: inspiration_brands
      label: Brands You Admire
      hint: Examples of brands you like
      type: text
      options: []
      required: false
    - id: 20
      name: additional_notes
      label: Additional Notes or Requirements
      hint: Anything else we should know
      type: text
      options: []
      required: false
    - id: 21
      name: how_did_you_hear
      label: How Did You Hear About Us?
      hint: Referral source
      type: select_one
      options:
      - Search Engine
      - Social Media
      - Referral
      - Website
      - Advertisement
      - Event
      - Other
      required: false
    - id: 22
      name: inquiry_date
      label: Inquiry Date
      hint: null
      type: date
      options: []
      required: true
