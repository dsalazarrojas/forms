inputSchema:
  type: object
  properties:
    title: Analytics Data Tracking Consent Form
    pages:
    - id: 1
      name: section_consent
      label: -- Consent for Data Tracking --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: visitor_name
      label: Visitor name
      hint: Optional for named consent
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email address
      hint: For consent records
      type: email
      options: []
      required: false
    - id: 4
      name: tracking_types
      label: Types of tracking
      hint: Select all that apply
      type: select_multiple
      options: [Cookies, Analytics, Advertising, Behavior tracking]
      required: true
    - id: 5
      name: retention_period
      label: Data retention period
      hint: Choose a retention policy
      type: select_one
      options: [30 days, 1 year, Indefinite]
      required: true
    - id: 6
      name: consent_given
      label: Consent given
      hint: Confirm consent to tracking
      type: select_one
      options: [Yes, No]
      required: true
    - id: 7
      name: contact_for_questions
      label: Contact for questions
      hint: Email for privacy inquiries
      type: email
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: Optional notes
      type: text
      options: []
      required: false
