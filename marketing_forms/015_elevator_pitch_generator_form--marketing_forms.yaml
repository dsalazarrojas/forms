      name: pitch_details
      label: Pitch Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_members
      label: Team Members
      hint: List team members and their roles
      type: select_multiple
      options:
      - Member 1
      - Member 2
      - Member 3
      required: false
    - id: 3
      name: pitch_length
      label: Pitch Length
      hint: null
      type: select_one
