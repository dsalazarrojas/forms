      required: false
    - id: 4
      name: value_proposition
      label: Value Proposition
      hint: Describe your value proposition
      type: text
      options: []
      required: false
    - id: 5
      name: pitch_tone
      label: Pitch Tone
      hint: null
      type: select_one
      options:
      - Inspirational
      - Solution-oriented
      - Problem-focused
      - Neutral
      required: true
    - id: 6
      name: elevator_pitch
      label: Elevator Pitch
      hint: A quick, memorable summary of your project or pitch
      type: text
      options: []
      required: false
    - id: 7
      name: followup_steps
      label: Follow-up Steps
      hint: Describe follow-up steps after meeting
      type: text
      options: []
