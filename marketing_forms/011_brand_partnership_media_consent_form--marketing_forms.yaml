inputSchema:
  type: object
  properties:
    title: Brand Partnership Media Consent Form
    pages:
    - id: 1
      name: partner_name
      label: Partner Full Name
      hint: Legal name of partner or organization
      type: text
      options: []
      required: true
    - id: 2
      name: partner_type
      label: Partner Type
      hint: What type of partner are you
      type: select_one
      options:
      - Individual Influencer
      - Brand or Company
      - Media Organization
      - Content Creator
      - Agency
      - Other
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone
      hint: Phone number for contact
      type: text
      options: []
      required: true
    - id: 5
      name: partnership_name
      label: Partnership or Campaign Name
      hint: Name of the partnership campaign
      type: text
      options: []
      required: true
    - id: 6
      name: media_types_consent
      label: Media Types You Consent To
      hint: Select all media types you allow
      type: select_multiple
      options:
      - Social Media Posts
      - Website Features
      - Email Marketing
      - Print Advertising
      - Video Content
      - Podcast Mentions
      - Press Releases
      - Case Studies
      required: true
    - id: 7
      name: brand_usage_scope
      label: Brand Usage Scope
      hint: How can we use your brand assets
      type: select_one
      options:
      - Global Usage
      - Regional Usage Only
      - Platform Specific
      - Campaign Specific
      required: true
    - id: 8
      name: consent_duration
      label: Consent Duration
      hint: How long can we use your media
      type: select_one
      options:
      - 6 Months
      - 1 Year
      - 2 Years
      - 3 Years
      - Perpetual
      required: true
    - id: 9
      name: content_approval_required
      label: Content Approval Required
      hint: Do you need to approve content before posting
      type: select_one
      options:
      - Yes, Approval Required
      - No, Pre-Approved
      - Review Within 24 Hours
      required: true
    - id: 10
      name: brand_restrictions
      label: Brand Usage Restrictions
      hint: Any restrictions on brand usage
      type: text
      options: []
      required: false
    - id: 11
      name: logo_usage
      label: Logo Usage Permission
      hint: Can we use your logo
      type: select_one
      options:
      - Yes, Full Usage Rights
      - Limited Usage
      - No Logo Usage
      required: true
    - id: 12
      name: testimonial_consent
      label: Testimonial Consent
      hint: Can we use your testimonials or quotes
      type: select_one
      options:
      - Yes, May Use Testimonials
      - No Testimonials
      - Approval Required Per Use
      required: true
    - id: 13
      name: image_likeness_consent
      label: Image and Likeness Consent
      hint: Can we use your photo or likeness
      type: select_one
      options:
      - Yes, Full Consent
      - Limited Consent
      - No Consent
      required: true
    - id: 14
      name: social_media_handles
      label: Social Media Handles
      hint: List your social media accounts
      type: text
      options: []
      required: false
    - id: 15
      name: compensation_disclosure
      label: Compensation Disclosure
      hint: Is this a paid partnership
      type: select_one
      options:
      - Yes, Paid Partnership
      - No, Unpaid Collaboration
      - Product Exchange Only
      required: true
    - id: 16
      name: termination_clause
      label: Termination Notice
      hint: Can you withdraw consent later
      type: select_one
      options:
      - Can Withdraw with 30 Days Notice
      - Can Withdraw Anytime
      - Cannot Withdraw During Campaign
      required: true
    - id: 17
      name: authorized_signatory
      label: Authorized Signatory
      hint: Name of person signing
      type: text
      options: []
      required: true
    - id: 18
      name: signature_date
      label: Signature Date
      hint: Date of signing
      type: date
      options: []
      required: true
    - id: 19
      name: additional_terms
      label: Additional Terms
      hint: Any additional terms to include
      type: text
      options: []
      required: false
