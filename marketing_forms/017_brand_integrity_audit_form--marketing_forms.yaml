          - Good
          - Fair
          - Poor
        required: true
      - id: 5
        name: compliance_issues_found
        label: Compliance issues found
        hint: Describe any non compliant items
        type: text
        options: []
        required: false
      - id: 6
        name: recommended_actions
        label: Recommended actions
        hint: Suggested remediation steps
        type: text
        options: []
        required: false
      - id: 7
        name: priority_level
        label: Priority level
        hint: Urgency of remediation
        type: select_one
        options:
          - High
          - Medium
          - Low
        required: true
      - id: 8
        name: follow_up_date
        label: Follow up date
        hint: Date for reassessment or follow up
        type: date
        options: []
