inputSchema:
  type: object
  properties:
    title: Amanda Hendershot MK Pamper Pack Profile
    pages:
    - id: 1
      name: section_profile
      label: -- Profile --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Client name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For correspondence
      type: email
      options: []
      required: true
    - id: 4
      name: skin_type
      label: Skin type
      hint: Choose the closest match
      type: select_one
      options:
      - Dry
      - Normal
      - Oily
      - Combination
      required: false
    - id: 5
      name: preferred_scents
      label: Preferred scents
      hint: List any scent preferences
      type: text
      options: []
      required: false
    - id: 6
      name: allergies
      label: Known allergies
      hint: List product allergies
      type: text
      options: []
      required: false
    - id: 7
      name: delivery_address
      label: Delivery address
      hint: Address for sending pamper pack
      type: text
      options: []
      required: true
    - id: 8
      name: opt_in_promotions
      label: Opt in to promotions
      hint: Receive offers and updates
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: comments
      label: Additional comments
      hint: Any special requests
      type: text
      options: []
      required: false
