      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: preferences
      label: Preferences
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
