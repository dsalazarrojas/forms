    - id: 12
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 13
      name: form_ids
      label: Form Ids
      hint: null
      type: number
      options: []
      required: false
    - id: 14
      name: output_file
      label: Output File
      hint: null
      type: text
      options: []
      required: false
