inputSchema:
  type: object
  properties:
    title: Marketing Education Session Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - Participant
      - Educator
      - Business
      required: false
    - id: 7
      name: education_level
      label: Education Level
      hint: null
      type: select_multiple
      options:
      - Advanced
      - Intermediate
      - Beginner
      required: true
    - id: 8
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: session_duration
      label: Session Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: session_topic
      label: Session Topic
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: registered_date
      label: Registered Date
      hint: null
      type: date
      options: []
      required: false
