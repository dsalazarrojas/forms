inputSchema:
  type: object
  properties:
    title: seo_analysis_report_form
    pages:
    - id: 1
      name: website_performance
      label: Website Performance
      hint: null
      type: select_multiple
      options:
      - Website speed
      - Page loading time
      - Page size
      required: false
    - id: 2
      name: keyword_usage
      label: Keyword Usage
      hint: null
      type: select_one
      options:
      - Baidu
      - Bing
      - Google
      required: false
    - id: 3
      name: seo_strategy
      label: SEO Strategies
      hint: null
      type: select_one
      options:
      - Technical SEO
      - On-page SEO
      - Off-page SEO
      required: false
    - id: 4
      name: content_distribution
      label: Content Distribution
      hint: null
      type: select_one
      options:
      - Social media
      - Influencer outreach
      - Email marketing
      required: false
    - id: 5
      name: analytics_tools
      label: Analytics Tools
      hint: null
      type: select_multiple
      options:
      - Google Analytics
      - SEMrush
      - Ahrefs
      required: true
    - id: 6
      name: target_audience
      label: Target Audience
      hint: null
      type: select_one
      options:
      - B2B
      - B2C
      - B2B/B2C
      required: false
    - id: 7
      name: website_technology
      label: Website Technology
      hint: null
      type: select_one
      options:
      - HTML/CSS
      - JavaScript
      - PHP/MySQL
      required: false
