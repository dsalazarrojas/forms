inputSchema:
  type: object
  properties:
    title: Digital Marketing Campaign Success Evaluation Form
    pages:
    - id: 1
      name: campaign_name
      label: Campaign Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: campaign_objectives
      label: Objectives
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: campaign_budget
      label: Budget
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: campaign_duration
      label: Duration
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: campaign_results
      label: Results
      hint: null
      type: select_one
      options:
      - Success
      - Partial Success
      - Failed
      required: true
    - id: 6
      name: campaign_notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: marketing_channels
      label: Marketing Channels
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Email Marketing
      - Influencer Marketing
      - Content Marketing
      required: true
    - id: 8
      name: campaign_target_audience
      label: Target Audience
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: campaign_target_audience_size
      label: Target Audience Size
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: campaign_measurable_metrics
      label: Measurable Metrics
      hint: null
      type: select_multiple
      options:
      - Website Visits
      - Social Media Engagement
      - Conversion Rate
      required: false
    - id: 11
      name: campaign_unmeasurable_metrics
      label: Unmeasurable Metrics
      hint: null
      type: select_multiple
      options:
      - Website User Experience
      - Customer Satisfaction
      required: false
