inputSchema:
  type: object
  properties:
    title: Mobile Experience Waitlist Form
    pages:
    - id: 1
      name: device_type
      label: Select the type of mobile device you are interested in
      hint: null
      type: select_one
      options:
      - apple
      - google
      required: true
    - id: 2
      name: operating_system
      label: Which operating system do you currently use on your mobile device?
      hint: null
      type: select_one
      options:
      - iOS
      - android
      - windows
      required: true
    - id: 3
      name: interested_date
      label: When are you interested in experiencing mobile on your device?
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: email
      label: Provide your email address for updates and further information
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: mobile_number
      label: Provide your mobile number for further contact
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: referral
      label: Who referred you to this form?
      hint: null
      type: select_one
      options:
      - referral1
      - referral2
      - referral3
      required: true
    - id: 7
      name: additional_comments
      label: Additional comments about your mobile experience interest
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: operating_system_version
      label: Which version of your operating system are you currently using?
      hint: null
      type: select_one
      options:
      - iOS 14
      - iOS 15
      - Android 10
      - Android 11
      - Windows 10
      - Windows 11
      required: true
    - id: 9
      name: device_brand
      label: What brand of mobile device do you have?
      hint: null
      type: select_one
      options:
      - Apple
      - Google
      required: true
    - id: 10
      name: wait_time
      label: When would you like to receive your mobile experience?
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: interest_level
      label: On a scale of 0-10, how much are you interested in getting a mobile experience?
      hint: null
      type: number
      options: []
      required: true
    - id: 12
      name: follow_up_info
      label: Any other information you'd like to share with us?
      hint: null
      type: note
      options: []
      required: false
