inputSchema:
  type: object
  properties:
    title: Concept For Organizational Change
    pages:
    - id: 1
      name: section_project_overview
      label: -- Project Overview --
      hint: Summarize proposed organizational change concept
      type: note
      options: []
      required: false
    - id: 2
      name: project_name
      label: Project name
      hint: Short descriptive title
      type: text
      options: []
      required: true
    - id: 3
      name: sponsor_name
      label: Sponsor name
      hint: Executive sponsor or owner
      type: text
      options: []
      required: true
    - id: 4
      name: summary_description
      label: Summary description
      hint: Brief description of the change and objectives
      type: text
      options: []
      required: true
    - id: 5
      name: expected_benefits
      label: Expected benefits
      hint: Outcomes and value for the organization
      type: text
      options: []
      required: true
    - id: 6
      name: key_stakeholders
      label: Key stakeholders
      hint: Groups or roles impacted
      type: text
      options: []
      required: false
    - id: 7
      name: estimated_timeline
      label: Estimated timeline
      hint: High level milestones and dates
      type: text
      options: []
      required: false
    - id: 8
      name: resource_requirements
      label: Resource requirements
      hint: Budget, personnel, and technology needs
      type: text
      options: []
      required: false
    - id: 9
      name: approval_requested
      label: Approval requested
      hint: Select to request formal approval
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
