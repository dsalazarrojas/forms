      options:
      - Increase sales
      - Customer acquisition
      - Customer retention
      - Brand awareness
      required: true
    - id: 10
      name: customer_advocacy_program_application_form_10
      label: How did you hear about us
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Referral
