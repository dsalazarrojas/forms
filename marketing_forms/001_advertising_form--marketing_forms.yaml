inputSchema:
  type: object
  properties:
    title: Advertising Form
    pages:
    - id: 1
      name: contact_name
      label: Contact Name
      hint: Full name of the primary contact
      type: text
      options: []
      required: true
    - id: 2
      name: company_name
      label: Company Name
      hint: Name of the organization or business
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: Business email for correspondence
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Optional direct contact phone
      type: text
      options: []
      required: false
    - id: 5
      name: advertising_goal
      label: Advertising Goal
      hint: Primary objective for the campaign
      type: select_one
      options:
      - Brand Awareness
      - Lead Generation
      - Sales
      - Event Promotion
      required: true
    - id: 6
      name: budget_estimate
      label: Budget Estimate
      hint: Expected budget in USD
      type: number
      options: []
      required: true
    - id: 7
      name: target_audience
      label: Target Audience Description
      hint: Describe the target demographic and geography
      type: text
      options: []
      required: false
    - id: 8
      name: ad_placement_preference
      label: Ad Placement Preference
      hint: Preferred channels or platforms
      type: select_multiple
      options:
      - Social Media
      - Search Engines
      - Display Banners
      - Email Newsletter
      - Podcast
      required: false
    - id: 9
      name: campaign_start_date
      label: Campaign Start Date
      hint: Planned launch date
      type: date
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional Notes
      hint: Any other instructions or files to share
      type: text
      options: []
      required: false
