inputSchema:
  type: object
  properties:
    title: Promotion Material Request Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: type_of_material
      label: Type of Material Requested
      hint: null
      type: select_one
      options:
      - Brochures, Flyers, and Handouts
      - Posters and Banners
      - Other (please specify)
      required: true
    - id: 5
      name: purpose_of_event
      label: Event Purpose
      hint: null
      type: select_one
      options:
      - Promotional Event
      - Sales Event
      - Product Launch
      - Other (please specify)
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: example_designs
      label: Example Designs (if any)
      hint: Please attach any relevant designs
      type: text
      options: []
      required: false
    - id: 8
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: assigned_to
      label: Assigned to
      hint: Internal contact assigned to this request
      type: text
      options: []
      required: false
    - id: 10
      name: output_file
      label: Output File
      hint: Output file for this form
      type: text
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: assigned_project
      label: Assigned Project
      hint: null
      type: text
      options: []
      required: false
