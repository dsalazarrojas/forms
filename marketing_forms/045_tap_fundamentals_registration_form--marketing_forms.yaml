inputSchema:
  type: object
  properties:
    title: Tap Fundamentals Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: course_type
      label: Course Type
      hint: null
      type: select_one
      options:
      - Tap Fundamentals
      - Tap Fundamentals 2
      - Tap Fundamentals 3
      required: true
    - id: 7
      name: number_of_students
      label: Number of Students
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: number_of_sessions
      label: Number of Sessions
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: course_length
      label: Course Length
      hint: null
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      required: true
    - id: 10
      name: course_length_other
      label: Other (number of sessions)
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - chatjimmy
      - chatjoe
      - chatjim
      required: true
    - id: 14
      name: form_id
      label: Form ID
      hint: null
      type: text
      options: []
      required: false
