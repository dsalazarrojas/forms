inputSchema:
  type: object
  properties:
    title: Phone Case Survey Form
    pages:
    - id: 1
      name: are_you_using_a_phone_case
      label: Are you using a phone case
      hint: null
      type: select_multiple
      options:
      - I have one always with me
      - I have one only occasionally
      - I do not have one
      required: false
    - id: 2
      name: what_type_of_phone_case_do_you_prefer
