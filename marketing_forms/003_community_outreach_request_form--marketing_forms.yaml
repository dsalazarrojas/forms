inputSchema:
  type: object
  properties:
    title: Community Outreach Request Form
    pages:
    - id: 1
      name: request_intro
      label: -- Outreach Request Form --
      hint: Please fill out this form to request support for your community event.
      type: note
      options: []
      required: false
    - id: 2
      name: requesting_organization
      label: Name of Requesting Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_person
      label: Primary Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: event_title
      label: Event or Project Title
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: event_date
      label: Proposed Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: start_time
      label: Event Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: end_time
      label: Event End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: event_location
      label: Event Location or Address
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: outreach_purpose
      label: Purpose of Outreach Request
      hint: Briefly describe the goal of the event.
      type: text
      options: []
      required: true
    - id: 12
      name: volunteers_needed
      label: Estimated Number of Volunteers Needed
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: skills_required
      label: Specific Skills Required
      hint: Select all that apply.
      type: select_multiple
      options:
      - General Labor
      - Social Media Support
      - Event Planning
      - Marketing
      - Fundraising
      - First Aid
      - Other
      required: true
    - id: 14
      name: recurring_event
      label: Is this a recurring event or project?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: volunteer_tasks
      label: Description of Volunteer Tasks
      hint: Please be specific about what volunteers will be doing.
      type: text
      options: []
      required: true
    - id: 16
      name: special_requirements
      label: Special Requirements
      hint: e.g. Background check - age restrictions - dress code.
      type: text
      options: []
      required: false
    - id: 17
      name: verification_note
      label: -- Verification Statement --
      hint: By submitting - you certify that the information provided is accurate.
      type: note
      options: []
      required: false
