inputSchema:
  type: object
  properties:
    title: Marketing Meeting RSVP
    pages:
    - id: 1
      name: meeting_date
      label: Meeting Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: meeting_time
      label: Meeting Time
      hint: null
      type: time
      options: []
      required: false
    - id: 3
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: attendance_confirmation
      label: Attendance Confirmation
      hint: Please confirm your attendance to the meeting
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
