inputSchema:
  type: object
  properties:
    title: New Year's Marketing Campaign Evaluation Form
    pages:
    - id: 1
      name: primary_objective
      label: What was the primary objective of the marketing campaign?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: target_audience
      label: Target audience
      hint: null
      type: select_one
      options:
      - Young Adults
      - Middle Age
      - Seniors
      required: true
    - id: 3
      name: marketing_channels
      label: Which marketing channels were used during the campaign?
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Email Marketing
      - TV Advertising
      required: true
    - id: 4
      name: campaign_budget
      label: Campaign budget
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: campaign_results
      label: Campaign results
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: evaluation_criteria
      label: Evaluation criteria
      hint: null
      type: select_multiple
      options:
      - Effectiveness
      - Efficiency
      - Credibility
      required: true
    - id: 7
      name: evaluation_scale
      label: Evaluation scale
      hint: null
      type: select_one
      options:
      - 1-10
      - 1-5
      - 1-2
      required: true
    - id: 8
      name: date_start
      label: Start date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: date_end
      label: End date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: campaign_duration
      label: Campaign duration
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: evaluation_score
      label: Evaluation score
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: additional_comments
      label: Additional comments
      hint: null
      type: text
      options: []
      required: false
