inputSchema:
  type: object
  properties:
    title: Content Marketing Communication Form
    pages:
      - id: 1
        name: sender_name
        label: Sender Name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 2
        name: sender_email
        label: Sender Email
        hint: Your email address
        type: email
        options: []
        required: true
      - id: 3
        name: sender_department
        label: Sender Department
        hint: Your department
        type: select_one
        options:
          - Marketing
          - Content
          - Social Media
          - Design
          - Management
          - Sales
          - Other
        required: true
      - id: 4
        name: communication_date
        label: Communication Date
        hint: Date of this communication
        type: date
        options: []
        required: true
      - id: 5
        name: recipient_name
        label: Recipient Name
        hint: Who is this for?
        type: text
        options: []
        required: true
      - id: 6
        name: communication_type
        label: Communication Type
        hint: What type of communication is this?
        type: select_one
        options:
          - Content Request
          - Feedback Request
          - Status Update
          - Approval Request
          - Issue Report
          - Strategy Discussion
          - Meeting Request
          - Other
        required: true
      - id: 7
        name: priority_level
        label: Priority Level
        hint: How urgent is this?
        type: select_one
        options:
          - Low
          - Medium
          - High
          - Urgent
        required: true
      - id: 8
        name: project_name
