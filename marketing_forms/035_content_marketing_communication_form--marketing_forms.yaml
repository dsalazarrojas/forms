        hint: What type of content is this about?
        type: select_one
        options:
          - Blog Post
          - Social Media Post
          - Video
          - Email Campaign
          - Landing Page
          - Infographic
          - Podcast
          - Multiple Types
        required: true
      - id: 10
        name: subject
        label: Subject
        hint: Brief subject line
        type: text
        options: []
        required: true
      - id: 11
        name: message
        label: Message
        hint: Your detailed message
        type: text
        options: []
        required: true
      - id: 12
        name: action_required
        label: Action Required
        hint: What action do you need from the recipient?
        type: text
        options: []
        required: true
      - id: 13
        name: deadline
        label: Deadline
        hint: When do you need a response?
        type: date
        options: []
