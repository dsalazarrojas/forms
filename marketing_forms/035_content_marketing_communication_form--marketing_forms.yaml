        name: previous_communications
        label: Previous Communications
        hint: Reference any related previous discussions
        type: text
        options: []
        required: false
      - id: 18
        name: feedback_type
        label: Feedback Type
        hint: What kind of feedback do you need?
        type: select_one
        options:
          - Content Review
          - Design Review
          - Strategy Input
          - Technical Review
          - Brand Compliance
          - Not Applicable
