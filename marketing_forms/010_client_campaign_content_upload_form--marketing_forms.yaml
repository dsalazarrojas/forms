inputSchema:
  type: object
  properties:
    title: Client Campaign Content Upload Form
    pages:
    - id: 1
      name: client_first_name
      label: First Name
      hint: Your legal first name
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Last Name
      hint: Your legal last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Legal business name
      type: text
      options: []
      required: true
    - id: 6
      name: campaign_name
      label: Campaign Name
      hint: Official name of this campaign
      type: text
      options: []
      required: true
    - id: 7
      name: campaign_type
      label: Campaign Type
      hint: What type of campaign is this?
      type: select_one
      options:
      - Email Marketing
      - Social Media Campaign
      - Paid Advertising
      - Content Marketing
      - Product Launch
      - Seasonal Promotion
      - Brand Awareness
      - Lead Generation
      - Other
      required: true
    - id: 8
      name: campaign_channels
      label: Marketing Channels
      hint: Where will this run?
      type: select_multiple
      options:
      - Facebook
      - Instagram
      - Twitter
      - LinkedIn
      - Google Ads
      - Email
      - Website
      - Print Media
      - Radio
      - TV
      required: true
    - id: 9
      name: campaign_objective
      label: Campaign Objective
      hint: Primary goal of this campaign
      type: select_one
      options:
      - Increase Brand Awareness
      - Generate Leads
      - Drive Sales
      - Promote Event
      - Launch Product
      - Build Email List
      - Increase Engagement
      - Drive Website Traffic
      required: true
    - id: 10
      name: target_audience
      label: Target Audience
      hint: Who is this campaign for?
      type: text
      options: []
      required: true
    - id: 11
      name: campaign_start_date
      label: Campaign Start Date
      hint: When does it launch?
      type: date
      options: []
      required: true
    - id: 12
      name: campaign_end_date
      label: Campaign End Date
      hint: When does it end?
      type: date
      options: []
      required: true
    - id: 13
      name: content_type
      label: Content Type Being Uploaded
      hint: Category of campaign assets
      type: select_one
      options:
      - Ad Copy
      - Images
      - Videos
      - Graphics
      - Landing Page Content
      - Email Templates
      - Social Media Posts
      - Blog Articles
      - Other
      required: true
    - id: 14
      name: asset_count
      label: Number of Assets
      hint: Approximate file count
      type: number
      options: []
      required: true
    - id: 15
      name: campaign_budget
      label: Campaign Budget Range
      hint: Total budget for campaign
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000 - $25,000
      - $25,000 - $50,000
      - Over $50,000
      required: true
    - id: 16
      name: key_messages
      label: Key Messages
      hint: Main points to communicate
      type: text
      options: []
      required: true
    - id: 17
      name: call_to_action
      label: Call to Action
      hint: What should users do?
      type: text
      options: []
      required: true
    - id: 18
      name: brand_guidelines
      label: Brand Guidelines Followed
      hint: Are brand rules being followed?
      type: select_one
      options:
      - Yes, Strictly Followed
      - Mostly Followed
      - Some Deviations
      - No Guidelines Available
      required: true
    - id: 19
      name: approval_status
      label: Content Approval Status
      hint: Current status of assets
      type: select_one
      options:
      - Final Approved
      - Pending Review
      - Draft Version
      - Needs Revision
      required: true
    - id: 20
      name: legal_review
      label: Has Legal Reviewed Content?
      hint: Compliance check status
      type: select_one
      options:
      - Yes, Approved
      - Pending Review
      - Not Required
      - No, Needs Review
      required: true
    - id: 21
      name: special_requirements
      label: Special Requirements
      hint: Any specific needs or constraints
      type: text
      options: []
      required: false
    - id: 22
      name: success_metrics
      label: Success Metrics
      hint: How will you measure success?
      type: select_multiple
      options:
      - Click-Through Rate
      - Conversion Rate
      - Impressions
      - Engagement Rate
      - Lead Count
      - Sales Revenue
      - Brand Lift
      - Other
      required: true
    - id: 23
      name: additional_notes
      label: Additional Notes
      hint: Any other relevant information
      type: text
      options: []
      required: false
    - id: 24
      name: authorization_statement
      label: I Confirm I Have Rights to All Uploaded Content
      hint: Authorization confirmation
      type: select_one
      options:
      - I Confirm
      - I Do Not Confirm
      required: true
    - id: 25
      name: submission_date
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
