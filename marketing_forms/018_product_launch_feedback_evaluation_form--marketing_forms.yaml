      name: user_email
      label: User Email
      hint: null
      type: email
      options: []
      required: false
    - id: 2
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: feedback_rating
      label: Feedback Rating
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: false
    - id: 4
      name: feedback_comment
      label: Feedback Comment
      hint: null
      type: text
      options: []
      required: false
    - id: 5
