inputSchema:
  type: object
  properties:
    title: Communication Briefing Checklist
    pages:
    - id: 1
      name: briefing_information
      label: Briefing Information
      hint: Details about the communication briefing
      type: note
      options: []
      required: false
    - id: 2
      name: briefing_date
      label: Briefing Date
      hint: Date of the briefing
      type: date
      options: []
      required: true
    - id: 3
      name: briefing_id
      label: Briefing ID
      hint: Unique briefing reference number
      type: text
      options: []
      required: true
    - id: 4
      name: campaign_name
      label: Campaign Name
      hint: Name of the campaign or project
      type: text
      options: []
      required: true
    - id: 5
      name: project_manager
      label: Project Manager
      hint: Name of the project manager
      type: text
      options: []
      required: true
    - id: 6
      name: briefing_objectives
      label: Briefing Objectives
      hint: What are the main objectives of this briefing
      type: note
      options: []
      required: false
    - id: 7
      name: primary_objective
      label: Primary Objective
      hint: Main goal of the communication campaign
      type: text
      options: []
      required: true
    - id: 8
      name: target_audience
      label: Target Audience
      hint: Who is the intended audience
      type: select_multiple
      options:
      - General Public
      - Customers
      - Employees
      - Stakeholders
      - Media
      - Investors
      - Partners
      - Regulators
      required: true
    - id: 9
      name: audience_demographics
      label: Audience Demographics
      hint: Key demographic information
      type: text
      options: []
      required: false
    - id: 10
      name: key_messages
      label: Key Messages
      hint: What are the key messages to communicate
      type: note
      options: []
      required: false
    - id: 11
      name: primary_message
      label: Primary Message
      hint: The main message to convey
      type: text
      options: []
      required: true
    - id: 12
      name: supporting_messages
      label: Supporting Messages
      hint: Additional supporting points
      type: text
      options: []
      required: false
    - id: 13
      name: tone_and_style
      label: Tone and Style
      hint: Desired communication tone
      type: select_one
      options:
      - Professional
      - Casual
      - Formal
      - Friendly
      - Urgent
      - Inspirational
      - Informative
      - Persuasive
      required: true
    - id: 14
      name: communication_channels
      label: Communication Channels
      hint: Which channels will be used
      type: select_multiple
      options:
      - Email
      - Social Media
      - Press Release
      - Website
      - Blog
      - Video
      - Print Media
      - Events
      - Internal Newsletter
      - Direct Mail
      required: true
    - id: 15
      name: timeline
      label: Timeline
      hint: Campaign timeline details
      type: note
      options: []
      required: false
    - id: 16
      name: launch_date
      label: Launch Date
      hint: When will the campaign launch
      type: date
      options: []
      required: true
    - id: 17
      name: end_date
      label: End Date
      hint: When will the campaign end
      type: date
      options: []
      required: false
    - id: 18
      name: key_milestones
      label: Key Milestones
      hint: Important dates and milestones
      type: text
      options: []
      required: false
    - id: 19
      name: budget_information
      label: Budget Information
      hint: Campaign budget details
      type: note
      options: []
      required: false
    - id: 20
      name: total_budget
      label: Total Budget
      hint: Total campaign budget in USD
      type: number
      options: []
      required: false
    - id: 21
      name: budget_allocation
      label: Budget Allocation
      hint: How is the budget allocated
      type: text
      options: []
      required: false
    - id: 22
      name: stakeholder_alignment
      label: Stakeholder Alignment
      hint: Stakeholder approval status
      type: note
      options: []
      required: false
    - id: 23
      name: stakeholders_consulted
      label: Stakeholders Consulted
      hint: Which stakeholders have been consulted
      type: select_multiple
      options:
      - Executive Team
      - Marketing
      - Sales
      - Legal
      - Compliance
      - HR
      - Product
      - Customer Support
      required: true
    - id: 24
      name: stakeholder_approval
      label: Stakeholder Approval
      hint: Have all stakeholders approved
      type: select_one
      options:
      - Yes - All Approved
      - Pending Some Approvals
      - No - Major Concerns
      required: true
    - id: 25
      name: risk_assessment
      label: Risk Assessment
      hint: Potential risks or challenges
      type: text
      options: []
      required: false
    - id: 26
      name: success_metrics
      label: Success Metrics
      hint: How will success be measured
      type: text
      options: []
      required: true
    - id: 27
      name: checklist_items
      label: Checklist Items
      hint: Items completed for this briefing
      type: select_multiple
      options:
      - Objectives Defined
      - Audience Identified
      - Key Messages Developed
      - Channels Selected
      - Timeline Created
      - Budget Approved
      - Stakeholders Aligned
      - Legal Review Complete
      - Creative Assets Ready
      - Distribution Plan Ready
      required: true
    - id: 28
      name: additional_notes
      label: Additional Notes
      hint: Any additional information or comments
      type: text
      options: []
      required: false
