inputSchema:
  type: object
  properties:
    title: Delegation Of Duties Log
    pages:
    - id: 1
      name: task_assigner
      label: Assignment Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: assignment_date
      label: Date Assigned
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: assignee_name
      label: Assignee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: assignee_department
      label: Assignee Department
      hint: null
      type: select_one
      options:
      - Sales
      - Marketing
      - IT
      required: false
    - id: 5
      name: task_description
      label: Task Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: task_due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: assignee_role
      label: Assignee Role
      hint: null
      type: select_one
      options:
      - Team Lead
      - Manager
      - Assistant
      required: false
    - id: 8
      name: task_status
      label: Task Status
      hint: null
      type: select_one
      options:
      - Not Started
      - In Progress
      - Completed
      required: false
