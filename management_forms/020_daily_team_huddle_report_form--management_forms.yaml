inputSchema:
  type: object
  properties:
    title: Daily Team Huddle Report Form
    pages:
    - id: 1
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: date
      label: date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: team_lead
      label: team_lead
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: team_members
      label: team_members
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 5
      name: priority
      label: Highest Priority
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: true
    - id: 6
      name: action_items
      label: action_items
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: next_steps
      label: Next Steps
      hint: Next steps for team members to take after the meeting
      type: text
      options: []
      required: true
    - id: 8
      name: notes
      label: notes
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: team lead email
      type: email
      options: []
      required: true
    - id: 10
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
