inputSchema:
  type: object
  properties:
    title: Insider Risk Mitigation Assessment
    pages:
    - id: 1
      name: risk_mitigation_controls
      label: Risk Mitigation Controls
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: incident_tracking
      label: Incident Tracking
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 3
      name: improvement_ideas
      label: Improvement Ideas
      hint: Please describe any improvement ideas you have to help reduce insider
        threat
      type: text
      options: []
      required: false
    - id: 4
      name: team_review
      label: Team Review
      hint: Select team members involved
      type: select_multiple
      options:
      - Option 1
      - Option 2
      required: false
    - id: 5
      name: threat_levels
      label: Threat Levels
      hint: Select one or more threat levels (High, Medium, Low)
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 6
      name: risk_categories
      label: Risk Categories
      hint: Select one or more risk categories (Financial, Operational, IT, etc.)
      type: select_multiple
      options:
      - Financial
      - Operational
      - IT
      required: false
    - id: 7
      name: incident_description
      label: Incident Description
      hint: Describe the incident in as much detail as possible
      type: text
      options: []
      required: false
    - id: 8
      name: mitigation_plans
      label: Mitigation Plans
      hint: Describe the mitigation plans to reduce insider threat
      type: text
      options: []
      required: false
    - id: 9
      name: risk_level
      label: Risk Level
      hint: Select a risk level (High, Medium, Low)
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 10
      name: incident_impact
      label: Incident Impact
      hint: Select one or more impact levels (High, Medium, Low)
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 11
      name: action_taken
      label: Action Taken
      hint: Describe the actions taken to mitigate the insider threat
      type: text
      options: []
      required: false
    - id: 12
      name: follow_up
      label: Follow-up
      hint: Schedule follow-up activities
      type: date
      options: []
      required: false
    - id: 13
      name: incident_status
      label: Incident Status
      hint: Select the incident status (Open, Closed, In Progress)
      type: select_one
      options:
      - Open
      - Closed
      - In Progress
      required: false
    - id: 14
      name: threat_classification
      label: Threat Classification
      hint: Select one or more threat classifications (Malicious, Accidental, etc.)
      type: select_multiple
      options:
      - Malicious
      - Accidental
      required: false
    - id: 15
      name: threat_vector
      label: Threat Vector
      hint: Select one or more threat vectors (Insider, Outsider, etc.)
      type: select_multiple
      options:
      - Insider
      - Outsider
      required: false
    - id: 16
      name: threat_detection
      label: Threat Detection
      hint: Describe the method used to detect the threat
      type: text
      options: []
      required: false
    - id: 17
      name: incident_responders
      label: Responders
      hint: Select responders involved
      type: select_multiple
      options:
      - Option 1
      - Option 2
      required: false
    - id: 18
      name: incident_responders_details
      label: Responders Details
      hint: Describe responder's role in responding to the incident
      type: text
      options: []
      required: false
    - id: 19
      name: incident_closure
      label: Incident Closure
      hint: Select the incident closure status (Closed, Not Closed)
      type: select_one
      options:
      - Closed
      - Not Closed
      required: false
    - id: 20
      name: incident_cause
      label: Incident Cause
      hint: Select one or more incident causes (Human error, etc.)
      type: select_multiple
      options:
      - Human error
      - System error
      required: false
    - id: 21
      name: incident_effect
      label: Incident Effect
      hint: Describe the incident effect
      type: text
      options: []
      required: false
    - id: 22
      name: incident_effectiveness
      label: Incident Effectiveness
      hint: Select one or more incident effectiveness (High, Medium, Low)
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 23
      name: incident_frequency
      label: Incident Frequency
      hint: Select one or more incident frequencies (High, Medium, Low)
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 24
      name: incident_type
      label: Incident Type
      hint: Select one or more incident types (Phishing, etc.)
      type: select_multiple
      options:
      - Phishing
      - Vishing
      required: false
    - id: 25
      name: incident_subtype
      label: Incident Subtype
      hint: Describe the incident subtype
      type: text
      options: []
      required: false
