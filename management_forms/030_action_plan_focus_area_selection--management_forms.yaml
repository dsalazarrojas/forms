inputSchema:
  type: object
  properties:
    title: Action Plan Focus Area Selection
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: Full name of the employee completing the action plan
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Employee identification number
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Department where the employee works
      type: text
      options: []
      required: true
    - id: 4
      name: manager_name
      label: Manager Name
      hint: Name of the employee's direct manager
      type: text
      options: []
      required: true
    - id: 5
      name: focus_area_primary
      label: Primary Focus Area
      hint: Select the main area of focus for your action plan
      type: select_one
      options: ["Performance Improvement", "Skill Development", "Leadership Growth", "Process Optimization", "Team Collaboration", "Customer Relations", "Innovation", "Other"]
      required: true
    - id: 6
      name: focus_area_secondary
      label: Secondary Focus Area
      hint: Select an additional area of focus (optional)
      type: select_one
      options: ["Performance Improvement", "Skill Development", "Leadership Growth", "Process Optimization", "Team Collaboration", "Customer Relations", "Innovation", "None"]
      required: false
    - id: 7
      name: specific_objectives
      label: Specific Objectives
      hint: What specific objectives do you aim to achieve in your focus area
      type: text
      options: []
      required: true
    - id: 8
      name: current_state_assessment
      label: Current State Assessment
      hint: Describe your current situation in the focus area
      type: text
      options: []
      required: true
    - id: 9
      name: desired_state_outcome
      label: Desired State Outcome
      hint: What does success look like in this focus area
      type: text
      options: []
      required: true
    - id: 10
      name: action_steps
      label: Action Steps
      hint: What specific steps will you take to achieve your objectives
      type: text
      options: []
      required: true
    - id: 11
      name: target_completion_date
      label: Target Completion Date
      hint: When do you expect to achieve your objectives
      type: date
      options: []
      required: true
    - id: 12
      name: required_resources
      label: Required Resources
      hint: What resources do you need to accomplish your action plan
      type: text
      options: []
      required: false
    - id: 13
      name: success_metrics
      label: Success Metrics
      hint: How will you measure success in achieving your objectives
      type: text
      options: []
      required: false
