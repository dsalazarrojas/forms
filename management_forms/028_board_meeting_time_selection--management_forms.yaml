inputSchema:
  type: object
  properties:
    title: Board Meeting Time Selection
    pages:
      - id: 1
        name: availability_header
        label: -- Member Availability --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: member_name
        label: Member name
        hint: Full board member name
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email address
        hint: For scheduling confirmations
        type: email
        options: []
        required: true
      - id: 4
        name: preferred_dates
        label: Preferred dates
        hint: Select all dates you are available
        type: select_multiple
        options:
          - Monday morning
          - Monday afternoon
          - Tuesday morning
          - Tuesday afternoon
          - Wednesday morning
        required: true
      - id: 5
        name: timezone
        label: Timezone
        hint: Member timezone for remote meetings
        type: text
        options: []
        required: false
      - id: 6
        name: comments
        label: Comments
        hint: Notes about conflicts or preferences
        type: text
        options: []
        required: false
