inputSchema:
  type: object
  properties:
    title: Finance Task Assignment Form
    pages:
    - id: 1
      name: assignment_date
      label: Assignment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: assigned_by
      label: Assigned By
      hint: null
      type: select_one
      options:
      - finance manager
      - accounting team
      required: false
    - id: 3
      name: due_date
      label: Due Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: task_description
      label: Task Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: task_priority
      label: Task Priority
      hint: null
      type: select_one
      options:
      - high
      - medium
      - low
      required: true
    - id: 6
      name: task_status
      label: Task Status
      hint: null
      type: select_multiple
      options:
      - pending
      - assigned
      - completed
      required: true
    - id: 7
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: submitted_date
      label: Submitted Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: task_comments
      label: Task Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - finance manager
      - accounting team
      required: false
    - id: 11
      name: task_type
      label: Task Type
      hint: null
      type: select_multiple
      options:
      - accounting
      - reporting
      - finance
      required: true
    - id: 12
      name: task_tags
      label: Task Tags
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: reporting_date
      label: Reporting Date
      hint: null
      type: date
      options: []
      required: false
