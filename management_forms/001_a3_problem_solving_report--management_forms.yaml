inputSchema:
  type: object
  properties:
    title: A3 Problem Solving Report
    pages:
    - id: 1
      name: report_header_note
      label: '--- A3 Problem Solving Report Header ---'
      hint: Fill in the basic report details
      type: note
      options: []
      required: false
    - id: 2
      name: report_date
      label: Date of Report
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: project_owner
      label: Project Owner/Lead
      hint: Person responsible for the A3
      type: text
      options: []
      required: true
    - id: 4
      name: team_members
      label: Team Members
      hint: List all individuals involved in the problem-solving process
      type: text
      options: []
      required: false
    - id: 5
      name: background_context
      label: 1. Background
      hint: Why is this problem important? Provide context and history.
      type: text
      options: []
      required: true
    - id: 6
      name: current_condition
      label: 2. Current Condition
      hint: Describe the current state using data, charts, or maps.
      type: text
      options: []
      required: true
    - id: 7
      name: goal_statement
      label: 3. Goal Statement
      hint: 'What is the specific target? (SMART: Specific, Measurable, Achievable,
        Relevant, Time-bound)'
      type: text
      options: []
      required: true
    - id: 8
      name: root_cause_analysis
      label: 4. Root Cause Analysis
      hint: Use '5 Whys' or Fishbone to identify the underlying cause.
      type: text
      options: []
      required: true
    - id: 9
      name: primary_root_cause_category
      label: Primary Root Cause Category
      hint: Select the most relevant category
      type: select_one
      options:
      - Manpower
      - Method
      - Material
      - Machine
      - Measurement
      - Environment
      required: true
    - id: 10
      name: countermeasures
      label: 5. Countermeasures
      hint: List proposed actions to address root causes.
      type: text
      options: []
      required: true
    - id: 11
      name: implementation_plan_note
      label: '--- Implementation Plan ---'
      hint: Details on who, what, when, and where
      type: note
      options: []
      required: false
    - id: 12
      name: action_items
      label: Specific Action Items
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: implementation_start_date
      label: Implementation Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: implementation_end_date
      label: Target Completion Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: follow_up_metrics
      label: 6. Follow-up (Check Results)
      hint: How will we measure success?
      type: text
      options: []
      required: true
    - id: 16
      name: cost_impact_estimate
      label: Estimated Cost Impact
      hint: null
      type: decimal
      options: []
      required: false
    - id: 17
      name: standardization_plan
      label: 7. Standardize and Sustain
      hint: How will we ensure the problem doesn't return?
      type: text
      options: []
      required: false
    - id: 18
      name: approval_status
      label: Report Status
      hint: null
      type: select_one
      options:
      - Draft
      - Under Review
      - Approved
      - Completed
      required: true
