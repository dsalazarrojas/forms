inputSchema:
  type: object
  properties:
    title: support_leadership_continuity_form
    pages:
    - id: 1
      name: succession_status
      label: succession status
      hint: null
      type: select_one
      options:
      - successor Identified
      - No Successor Identified
      - Not Applicable
      required: false
    - id: 2
      name: potential_successors
      label: potential successors
      hint: list of individuals who could potentially be a good fit if a vacancy occurs
      type: select_multiple
      options:
      - Successors 1
      - Successors 2
      - Successors 3
      required: false
    - id: 3
      name: resource_needs
      label: resource needs
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: additional_comments
      label: additional comments
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: next_steps
      label: next steps
      hint: what are the next steps for each identified successor
      type: text
      options: []
      required: false
