inputSchema:
  type: object
  properties:
    title: Responsibility And Authority Matrix Form
    pages:
    - id: 1
      name: project_id
      label: project_id
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: team_name
      label: team_name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: responsible_party
      label: responsible_party
      hint: null
      type: text
      options: []
      required: false
