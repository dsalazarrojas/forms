      - 'No'
      required: true
    - id: 6
      name: reporting_line
      label: reporting_line
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: role
      label: role
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: handoff_date
      label: handoff_date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: handoff_status
      label: handoff_status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 10
      name: handoff_date_completed
      label: handoff_date_completed
      hint: null
      type: date
      options: []
      required: false
    - id: 11
      name: handoff_date_ongoing
      label: handoff_date_ongoing
      hint: null
      type: date
      options: []
      required: false
