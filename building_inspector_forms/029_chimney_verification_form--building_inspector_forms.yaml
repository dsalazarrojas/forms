inputSchema:
  type: object
  properties:
    title: Chimney Verification Form
    pages:
    - id: 1
      name: inspector_information
      label: -- Inspector Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: inspector_license
      label: License Number
      hint: Building inspector or chimney technician license
      type: text
      options: []
      required: true
    - id: 4
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: property_details
      label: -- Property Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: property_address
      label: Property Address
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: property_owner
      label: Property Owner Name
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: owner_phone
      label: Owner Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: owner_email
      label: Owner Email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: chimney_specifications
      label: -- Chimney Specifications --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: chimney_construction
      label: Chimney Construction Type
      hint: null
      type: select_one
      options:
      - Masonry brick
      - Stone
      - Metal frame
      - Prefabricated metal
      - Concrete block
      - Other
      required: true
    - id: 16
      name: interior_diameter
      label: Interior Diameter (inches)
      hint: null
      type: number
      options: []
      required: false
    - id: 17
      name: estimated_age
      label: Estimated Chimney Age
      hint: In years
      type: number
      options: []
      required: false
    - id: 18
      name: last_inspection_date
      label: Date of Last Inspection
      hint: null
      type: date
      options: []
      required: false
    - id: 19
      name: verification_checks
      label: -- Verification Checks --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: structural_integrity
      label: Structural Integrity
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      - Not applicable
      required: true
    - id: 21
      name: mortar_condition
      label: Mortar Condition (if applicable)
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not applicable
      required: false
    - id: 22
      name: flue_condition
      label: Flue Condition
      hint: null
      type: select_one
      options:
      - Clear
      - Partially blocked
      - Blocked
      - Deteriorated
      required: true
    - id: 23
      name: cap_condition
      label: Chimney Cap Condition
      hint: null
      type: select_one
      options:
      - Good
      - Damaged
      - Missing
      - Not applicable
      required: true
    - id: 24
      name: verification_result
      label: -- Verification Result --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: verification_status
      label: Chimney Verification Status
      hint: null
      type: select_one
      options:
      - Approved - Safe to use
      - Conditional approval - repairs needed
      - Failed - Not safe to use
      - Pending further inspection
      required: true
