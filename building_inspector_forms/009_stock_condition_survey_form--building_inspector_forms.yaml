inputSchema:
  type: object
  properties:
    title: stock_condition_survey_form
    pages:
    - id: 1
      name: general_inspections
      label: General Inspections
      hint: null
      type: select_one
      options:
      - Inspect the inventory
      - Inspect the stockroom
      - Inspect the warehouse
      required: false
    - id: 2
      name: condition_check_list
      label: Condition Check List
      hint: null
      type: select_multiple
      options:
      - Check for water damage
      - Check for fire damage
      - Check for mold growth
      - Check for pest infestation
      - Check for other
      required: false
    - id: 3
      name: damage_description
      label: Damage Description
      hint: A brief description of the damage
      type: text
      options: []
      required: false
    - id: 4
      name: damage_grade
      label: Damage Grade
      hint: null
      type: number
      options: []
      required: false
    - id: 5
