inputSchema:
  type: object
  properties:
    title: Airport Runway Surface Inspection Form
    pages:
    - id: 1
      name: inspector_name
      label: Inspector Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: inspection_date
      label: Date of Inspection
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Time of Inspection
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: runway_identifier
      label: Runway Identifier
      hint: e.g. 09L/27R
      type: text
      options: []
      required: true
    - id: 5
      name: weather_conditions
      label: Weather Conditions
      hint: null
      type: select_one
      options:
      - Dry
      - Wet
      - Damp
      - Ice/Snow
      - Standing Water
      required: true
    - id: 6
      name: section_surface_condition
      label: -- Pavement Surface Condition --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: crack_assessment
      label: Crack Presence and Severity
      hint: null
      type: select_one
      options:
      - None
      - Low (Hairline)
      - Medium (Spalling)
      - High (Structural)
      required: true
    - id: 8
      name: potholes_rutting
      label: Potholes or Rutting Observed?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: fod_check
      label: Foreign Object Debris (FOD) Presence
      hint: null
      type: select_one
      options:
      - Clear
      - Minor debris
      - Major debris (Immediate action)
      required: true
    - id: 10
      name: section_markings_lighting
      label: -- Markings and Lighting --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: paint_condition
      label: Runway Paint Marking Visibility
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair (Requires repainting soon)
      - Poor (Requires immediate repainting)
      required: true
    - id: 12
      name: lighting_functionality
      label: Runway Edge and Centerline Lighting Functionality
      hint: null
      type: select_one
      options:
      - All functional
      - Some outages (Non-critical)
      - Critical outages
      required: true
    - id: 13
      name: rubber_buildup
      label: Rubber Deposit Level (Touchdown Zone)
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - Heavy (Requires removal)
      required: true
    - id: 14
      name: additional_observations
      label: Additional Maintenance Observations
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: overall_runway_status
      label: Overall Runway Status
      hint: null
      type: select_one
      options:
      - Safe for Operations
      - Restricted Operations
      - Closed for Maintenance
      required: true
    - id: 16
      name: follow_up_required
      label: Is immediate follow-up action required?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
