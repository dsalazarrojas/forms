inputSchema:
  type: object
  properties:
    title: Green Building Certification Inspection Form
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: building_location
      label: Building Location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: building_type
      label: Building Type
      hint: null
      type: select_one
      options:
      - Single-Family
      - Multi-Family
      - Commercial
      required: false
    - id: 4
      name: building_status
      label: Building Status
      hint: null
      type: select_multiple
      options:
      - New Construction
      - Existing
      - In Progress
      required: false
    - id: 5
      name: building_characteristics
      label: Building Characteristics
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: energy_efficiency_features
      label: Energy Efficiency Features
      hint: null
      type: select_multiple
      options:
      - Insulation
      - Solar Panels
      - Rainwater Harvesting System
      required: false
    - id: 7
      name: sustainability_features
      label: Sustainability Features
      hint: null
      type: select_multiple
      options:
      - Green Roof
      - Green Wall
      - Greenhouse
      required: false
    - id: 8
      name: certification_status
      label: Certification Status
      hint: null
      type: select_one
      options:
      - Certified
      - Provisional
      - Denied
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: energy_consumption
      label: Energy Consumption
      hint: null
      type: number
      options: []
      required: false
