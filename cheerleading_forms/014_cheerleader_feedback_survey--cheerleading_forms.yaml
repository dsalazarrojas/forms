inputSchema:
  type: object
  properties:
    title: Cheerleader Feedback Survey
    pages:
      - id: 1
        name: cheerleader_name
        label: Your Name
        hint: Optional - Your full name
        type: text
        options: []
        required: false
      - id: 2
        name: team_name
        label: Team Name
        hint: Name of your cheer team
        type: text
        options: []
        required: true
      - id: 3
        name: season_year
        label: Season Year
        hint: Which season are you providing feedback for
        type: select_one
        options:
          - 2025-2026
          - 2024-2025
          - 2023-2024
          - Other
        required: true
      - id: 4
        name: years_on_team
        label: Years on Team
        hint: How long have you been on this team
        type: select_one
        options:
          - First year
          - 2 years
          - 3-4 years
          - 5+ years
        required: true
      - id: 5
        name: coach_communication
        label: Coach Communication
        hint: How would you rate coach communication
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 6
        name: practice_quality
        label: Practice Quality
        hint: How would you rate practice sessions
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 7
        name: practice_frequency
        label: Practice Frequency
        hint: Are practices frequent enough
        type: select_one
        options:
          - More than enough
          - Just right
          - Could use more
          - Not enough
        required: true
      - id: 8
        name: skill_development
        label: Skill Development
        hint: How much have your skills improved
        type: select_one
        options:
          - Significantly improved
          - Moderately improved
          - Slightly improved
          - No improvement
          - Declined
        required: true
      - id: 9
        name: team_cohesion
        label: Team Cohesion
        hint: How well does the team work together
        type: select_one
        options:
          - Excellent teamwork
          - Good teamwork
          - Average teamwork
          - Poor teamwork
          - Very poor teamwork
        required: true
      - id: 10
        name: competition_preparation
        label: Competition Preparation
        hint: How well prepared do you feel for competitions
        type: select_one
        options:
          - Very well prepared
          - Well prepared
          - Adequately prepared
          - Underprepared
          - Not prepared
        required: true
      - id: 11
        name: choreography_quality
        label: Choreography Quality
        hint: Quality of routines and choreography
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 12
        name: music_selection
        label: Music Selection
        hint: How would you rate music choices
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 13
        name: uniform_quality
        label: Uniform Quality
        hint: Quality of team uniforms
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 14
        name: facility_quality
        label: Facility Quality
        hint: Quality of practice facility
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 15
        name: safety_measures
        label: Safety Measures
        hint: How adequate are safety protocols
        type: select_one
        options:
          - Very adequate
          - Adequate
          - Somewhat adequate
          - Inadequate
          - Very inadequate
        required: true
      - id: 16
        name: parental_involvement
        label: Parental Involvement
        hint: Level of parental involvement
        type: select_one
        options:
          - Very supportive
          - Supportive
          - Neutral
          - Unsupportive
          - Very unsupportive
          - Not applicable
        required: false
      - id: 17
        name: time_commitment
        label: Time Commitment
        hint: Is the time commitment reasonable
        type: select_one
        options:
          - Very reasonable
          - Reasonable
          - Somewhat demanding
          - Too demanding
          - Excessive
        required: true
      - id: 18
        name: cost_value
        label: Cost vs Value
        hint: Is the program worth the cost
        type: select_one
        options:
          - Excellent value
          - Good value
          - Fair value
          - Poor value
          - Very poor value
        required: true
      - id: 19
        name: would_recommend
        label: Would Recommend
        hint: Would you recommend this team to others
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 20
        name: will_return
        label: Will Return Next Season
        hint: Do you plan to return next season
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 21
        name: favorite_part
