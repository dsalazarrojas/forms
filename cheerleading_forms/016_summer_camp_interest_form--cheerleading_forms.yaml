inputSchema:
  type: object
  properties:
    title: Summer Camp Interest Form
    pages:
    - id: 1
      name: summer_camp_interest_form
      label: summer_camp_interest
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 2
      name: summer_camp_activity
      label: summer_camp_activity
      hint: null
      type: select_multiple
      options:
      - Activity1
      - Activity2
      required: false
    - id: 3
      name: number_of_people
      label: number_of_people_anticipated
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: registration_status
      label: summer_camp_registration_status
      hint: null
      type: select_one
      options:
      - Status 1
      - Status 2
      required: false
