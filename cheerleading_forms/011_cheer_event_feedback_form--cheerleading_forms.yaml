inputSchema:
  type: object
  properties:
    title: Cheer Event Feedback Form
    pages:
      - id: 1
        name: attendee_name
        label: Your Name
        hint: Optional - Your full name
        type: text
        options: []
        required: false
      - id: 2
        name: email_address
        label: Email Address
        hint: Optional - For follow-up communications
        type: email
        options: []
        required: false
      - id: 3
        name: attendee_type
        label: Attendee Type
        hint: What is your role at this event
        type: select_one
        options:
          - Cheerleader
          - Coach
          - Parent or Family
          - Judge
          - Spectator
          - Event Staff
        required: true
      - id: 4
        name: event_name
        label: Event Name
        hint: Name of the cheer event
        type: text
        options: []
        required: true
      - id: 5
        name: event_date
        label: Event Date
        hint: Date of the event
        type: date
        options: []
        required: true
      - id: 6
        name: venue_rating
        label: Venue Rating
        hint: How would you rate the venue
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 7
        name: event_organization_rating
        label: Event Organization Rating
        hint: How well organized was the event
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 8
        name: schedule_rating
        label: Schedule Rating
        hint: How would you rate the event schedule
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 9
        name: staff_friendliness
        label: Staff Friendliness
        hint: How friendly and helpful was the staff
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 10
        name: facility_cleanliness
        label: Facility Cleanliness
        hint: How clean was the venue
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
        required: true
      - id: 11
        name: competition_quality
        label: Competition Quality
        hint: Quality of the competition performances
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
          - Not applicable
        required: true
      - id: 12
        name: judging_fairness
        label: Judging Fairness
        hint: How fair and consistent was the judging
        type: select_one
        options:
          - Excellent
          - Good
          - Average
          - Poor
          - Very Poor
          - Not applicable
        required: false
      - id: 13
        name: value_for_money
        label: Value for Money
        hint: Was the event worth the cost
        type: select_one
        options:
          - Excellent value
          - Good value
          - Average value
          - Poor value
          - Very poor value
        required: true
      - id: 14
        name: would_recommend
        label: Would You Recommend
        hint: Would you recommend this event to others
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 15
        name: would_attend_again
        label: Would You Attend Again
        hint: Would you attend future events
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 16
        name: best_part
        label: Best Part of the Event
        hint: What did you enjoy most
        type: text
        options: []
        required: false
      - id: 17
        name: areas_for_improvement
        label: Areas for Improvement
        hint: What could be improved
        type: text
        options: []
        required: false
      - id: 18
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback you would like to share
        type: text
        options: []
        required: false
      - id: 19
        name: overall_satisfaction
        label: Overall Satisfaction
        hint: Your overall satisfaction with the event
        type: select_one
        options:
          - Very satisfied
          - Satisfied
          - Neutral
          - Dissatisfied
          - Very dissatisfied
        required: true
