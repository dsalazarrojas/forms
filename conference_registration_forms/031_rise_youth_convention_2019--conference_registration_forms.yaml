inputSchema:
  type: object
  properties:
    title: Rise Youth Convention 2019
    pages:
    - id: 1
      name: registration_type
      label: Registration Type
      hint: null
      type: select_one
      options:
      - Full Conference
      - Saturday only
      required: true
    - id: 2
      name: registration_price_id
      label: Registration Price
      hint: null
      type: select_multiple
      options:
      - '30'
      - '60'
      required: true
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: tshirt_size
      label: T-Shirt Size
      hint: null
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 5
      name: parent_email
      label: Parent Email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: church_leader_email
      label: Church Leader Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: tshirt_order
      label: T-Shirt Order
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: parental_consent
      label: Parental Consent
      hint: null
      type: select_one
      options:
      - Yes, I grant permission
      - No, I do not grant permission
      required: true
