inputSchema:
  type: object
  properties:
    title: Conference Check In Form
    pages:
    - id: 1
      name: attendee_name
      label: Attendee name
      hint: Full name as registered
      type: text
      options: []
      required: true
    - id: 2
      name: registration_id
      label: Registration ID
      hint: Provided at registration
      type: text
      options: []
      required: true
    - id: 3
      name: check_in_time
      label: Check in time
      hint: Time of arrival
      type: time
      options: []
      required: true
    - id: 4
      name: badge_issued
      label: Badge issued confirmation
      hint: Badge printed or digital
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: meal_preference
      label: Meal preference
      hint: For events with included meals
      type: select_one
      options:
      - Regular
      - Vegetarian
      - Vegan
      - Gluten free
      required: false
    - id: 6
      name: accessibility_needs
      label: Accessibility needs
      hint: Any accommodations required
      type: text
      options: []
      required: false
    - id: 7
      name: contact_phone
      label: Contact phone
      hint: For urgent on site contact
      type: text
      options: []
      required: false
    - id: 8
      name: consent_media_release
      label: Consent to media release
      hint: Attendee consent for photos and recordings
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 9
      name: staff_verifier
      label: Staff verifier name
      hint: Staff who confirmed check in
      type: text
      options: []
      required: true
    - id: 10
      name: check_in_notes
      label: Check in notes
      hint: Any additional notes recorded at check in
      type: text
      options: []
      required: false
