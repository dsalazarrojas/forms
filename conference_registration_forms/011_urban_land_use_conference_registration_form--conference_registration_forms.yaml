inputSchema:
  type: object
  properties:
    title: Urban Land Use Conference Registration Form
    pages:
    - id: 1
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: role
      label: Which category do you belong to?
      hint: null
      type: select_one
      options:
      - Speaker
      - Delegate
      - Organizer
      - Sponsor
      required: false
    - id: 3
      name: sessions
      label: Which sessions are you interested in attending?
      hint: null
      type: select_multiple
      options:
      - Session 1
      - Session 2
      - Session 3
      required: false
    - id: 4
      name: date
      label: Date of Attendance
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time of Attendance
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: bio
      label: Brief Bio
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: note
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
