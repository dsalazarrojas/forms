      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: submission_5
      label: Is this a team or individual submission?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 13
      name: submission_6
      label: What are some challenges you faced when implementing your innovative
