      name: submitter_info
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: submitter_email
      label: What is your email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: main_category
      label: Which category does your innovative pedagogical practice belong to?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: award_title
      label: Please describe your innovative pedagogical practice.
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: submission_1
      label: What inspired you to submit this innovative pedagogical practice?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: submission_2
      label: How did you implement your innovative pedagogical practice in your teaching?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: submitter_organisation
      label: Which submitter organisation?
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: submission_3
      label: What is the name of your submission?
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: subcategory
      label: Which subcategory does your innovative pedagogical practice belong to?
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: submission_4
