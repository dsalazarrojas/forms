inputSchema:
  type: object
  properties:
    title: Accessibility In Care Design Workshop Registration
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: Your legal name
      type: text
      options: []
      required: true
    - id: 2
      name: professional_title
      label: Professional Title
      hint: Your job title or role
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Name of your company, institution, or organization
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Your professional email address
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: Your contact phone number
      type: text
      options: []
      required: true
    - id: 6
      name: professional_background
      label: Professional Background
      hint: What is your professional background?
      type: select_multiple
      options:
      - Healthcare Provider
      - Designer
      - Architect
      - Engineer
      - Policy Maker
      - Researcher
      - Caregiver
      - Advocate
      - Academic
      - Other
      required: true
    - id: 7
      name: years_experience
      label: Years of Experience
      hint: How many years of experience do you have in your field?
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 4-7 years
      - 8-15 years
      - More than 15 years
      required: true
    - id: 8
      name: workshop_session_choice
      label: Workshop Session Choice
      hint: Which session would you like to attend?
      type: select_one
      options:
      - Morning Session (9:00 AM - 12:00 PM)
      - Afternoon Session (1:00 PM - 4:00 PM)
      - Both Sessions
      - Virtual Attendance
      required: true
    - id: 9
      name: accessibility_needs
      label: Accessibility Needs
      hint: Do you have any accessibility needs for the workshop?
      type: select_multiple
      options:
      - Wheelchair Accessible Space
      - Large Print Materials
      - Sign Language Interpreter
      - Audio Loop System
      - Reserved Seating
      - Break Reminders
      - Quiet Space
      - Other
      required: false
    - id: 10
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Do you have any dietary restrictions or allergies?
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Dairy-Free
      - Nut Allergy
      - Other Allergies
      - None
      required: false
    - id: 11
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of your emergency contact
      type: text
      options: []
      required: false
    - id: 12
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number of your emergency contact
      type: text
      options: []
      required: false
    - id: 13
      name: workshop_objectives
      label: Workshop Objectives
      hint: What are your primary objectives for attending this workshop?
      type: select_multiple
      options:
      - Learn about universal design principles
      - Understand accessibility guidelines
      - Network with professionals
      - Develop practical skills
      - Explore new technologies
      - Share experiences
      - Other
      required: true
    - id: 14
      name: previous_training
      label: Previous Training
      hint: Have you attended similar workshops or training on accessibility?
      type: select_one
      options:
      - Yes, Extensive Training
      - Yes, Some Training
      - No, but Self-Taught
      - No, New to Topic
      required: true
    - id: 15
      name: specific_topics_interest
      label: Specific Topics of Interest
      hint: Which topics are you most interested in learning about?
      type: select_multiple
      options:
      - Universal Design Principles
      - Assistive Technologies
      - Environmental Modifications
      - Policy and Standards
      - Patient-Centered Care
      - Cognitive Accessibility
      - Mobility Solutions
      - Communication Aids
      required: true
    - id: 16
      name: expected_outcomes
      label: Expected Outcomes
      hint: What outcomes do you hope to achieve from this workshop?
      type: text
      options: []
      required: true
    - id: 17
      name: funding_source
      label: Funding Source
      hint: How will you fund your attendance?
      type: select_one
      options:
      - Organization Budget
      - Personal Funds
      - Grant
      - Scholarship
      - Other
      required: true
    - id: 18
      name: special_requests
      label: Special Requests
      hint: Do you have any special requests for the workshop?
      type: text
      options: []
      required: false
    - id: 19
      name: consent_to_recordings
      label: Consent to Recordings
      hint: Do you consent to being recorded if the workshop is filmed for educational
        purposes?
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      - I consent to recordings but not photos
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments
      hint: Any other information you'd like to share?
      type: text
      options: []
      required: false
