inputSchema:
  type: object
  properties:
    title: Additive Manufacturing Technology Fair Registration
    pages:
    - id: 1
      name: attendee_information
      label: Attendee information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: Attendee name
      hint: Full name for badge
      type: text
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: Company or institution
      type: text
      options: []
      required: false
    - id: 4
      name: role
      label: Role or title
      hint: Job title or role
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email address
      hint: For confirmations and updates
      type: email
      options: []
      required: true
    - id: 6
      name: attendance_days
      label: Attendance days
      hint: Select days you will attend
      type: select_multiple
      options:
      - Day 1
      - Day 2
      - Day 3
      - Workshops only
      required: true
    - id: 7
      name: workshop_selection
      label: Workshop selection
      hint: Choose up to two workshops
      type: select_multiple
      options:
      - Design for AM
      - Materials and processes
      - Post processing
      - Quality control
      required: false
    - id: 8
      name: dietary_requirements
      label: Dietary requirements
      hint: For catered events
      type: text
      options: []
      required: false
    - id: 9
      name: accommodation_needed
      label: Accommodation needed
      hint: If you require lodging assistance
      type: select_one
      options:
      - None
      - 'True'
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any other information for organizers
      type: text
      options: []
      required: false
