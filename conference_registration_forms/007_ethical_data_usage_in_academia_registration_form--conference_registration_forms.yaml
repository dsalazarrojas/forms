inputSchema:
  type: object
  properties:
    title: Ethical Data Usage In Academia Registration Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: institution
      label: Institution
      hint: null
      type: select_one
      options:
      - University of Cambridge
      - University of Oxford
      - University of Manchester
      required: true
    - id: 6
      name: role
      label: Role
      hint: null
      type: select_multiple
      options:
      - Student
      - Researcher
      - Faculty
      required: true
    - id: 7
      name: data_policies
      label: Data policies
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: ethical_guidelines
      label: Ethical guidelines
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: submission_agreement
      label: Submission agreement
      hint: null
      type: select_one
      options:
      - Agree to the terms and conditions
      - Disagree to the terms and conditions
      required: true
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
