inputSchema:
  type: object
  properties:
    title: ARFC Trade Show Exhibitor Registration Form
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Legal name of your company
      type: text
      options: []
      required: true
    - id: 2
      name: primary_contact_name
      label: Primary Contact Name
      hint: Name of the primary contact person
      type: text
      options: []
      required: true
    - id: 3
      name: primary_contact_email
      label: Primary Contact Email
      hint: Email for all trade show communications
      type: email
      options: []
      required: true
    - id: 4
      name: primary_contact_phone
      label: Primary Contact Phone
      hint: Phone number for trade show communications
      type: text
      options: []
      required: true
    - id: 5
      name: booth_type
      label: Booth Type
      hint: What type of booth are you requesting?
      type: select_one
      options:
      - Standard 10x10
      - Premium 10x20
      - Custom Booth
      - Shared Booth
      - Virtual Booth
      required: true
    - id: 6
      name: booth_location_preference
      label: Booth Location Preference
      hint: Do you have any preferences for booth location?
      type: text
      options: []
      required: false
    - id: 7
      name: company_industry
      label: Company Industry
      hint: What industry does your company operate in?
      type: text
      options: []
      required: true
    - id: 8
      name: products_services_offered
      label: Products/Services Offered
      hint: Brief description of what you offer
      type: text
      options: []
      required: true
    - id: 9
      name: number_of_staff_attending
      label: Number of Staff Attending
      hint: How many staff members will attend the trade show?
      type: number
      options: []
      required: true
    - id: 10
      name: company_website
      label: Company Website
      hint: URL of your company website
      type: text
      options: []
      required: false
    - id: 11
      name: marketing_materials_brought
      label: Marketing Materials to Bring
      hint: What marketing materials will you bring?
      type: text
      options: []
      required: true
    - id: 12
      name: special_requirements
      label: Special Requirements
      hint: Do you have any special requirements for your booth?
      type: text
      options: []
      required: false
    - id: 13
      name: shipping_delivery_info
      label: Shipping/Delivery Information
      hint: Information for shipping materials to the venue
      type: text
      options: []
      required: false
    - id: 14
      name: payment_method
      label: Payment Method
      hint: How will you pay for the booth?
      type: select_one
      options:
      - Credit Card
      - Check
      - Wire Transfer
      - Purchase Order
      required: true
    - id: 15
      name: cancellation_policy_acknowledged
      label: Cancellation Policy Acknowledged
      hint: Do you acknowledge and agree to the cancellation policy?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
