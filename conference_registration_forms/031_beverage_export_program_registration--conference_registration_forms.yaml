inputSchema:
  type: object
  properties:
    title: Beverage Export Program Registration
    pages:
    - id: 1
      name: company_name
      label: Company Name
      hint: Name of your beverage company
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Person Name
      hint: Full name of primary contact
      type: text
      options: []
      required: true
    - id: 3
      name: contact_title
      label: Contact Title
      hint: Job title of contact person
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Email Address
      hint: We will send program updates here
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Phone Number
      hint: For program communication
      type: text
      options: []
      required: true
    - id: 6
      name: company_address
      label: Company Address
      hint: Full business address
      type: text
      options: []
      required: true
    - id: 7
      name: company_country
      label: Country of Origin
      hint: Where is your company based
      type: select_one
      options:
      - United States
      - Canada
      - United Kingdom
      - Australia
      - Germany
      - France
      - Italy
      - Spain
      - Other
      required: true
    - id: 8
      name: company_website
      label: Company Website
      hint: URL of your company website
      type: text
      options: []
      required: true
    - id: 9
      name: years_in_business
      label: Years in Business
      hint: How long has your company been operating
      type: select_one
      options:
      - Less than 2 years
      - 2 to 5 years
      - 5 to 10 years
      - 10 to 20 years
      - Over 20 years
      required: true
    - id: 10
      name: beverage_categories
      label: Beverage Categories Produced
      hint: What types of beverages do you produce
      type: select_multiple
      options:
      - Carbonated Soft Drinks
      - Energy Drinks
      - Sports Drinks
      - Juice
      - Tea
      - Coffee
      - Water
      - Alcoholic Beverages
      - Plant-Based Beverages
      - Functional Beverages
      required: true
    - id: 11
      name: current_export_experience
      label: Current Export Experience
      hint: What is your current export status
      type: select_one
      options:
      - No Export Experience
      - Limited Export Experience
      - Moderate Export Experience
      - Extensive Export Experience
      required: true
    - id: 12
      name: current_export_markets
      label: Current Export Markets
      hint: Which countries do you currently export to
      type: text
      options: []
      required: false
    - id: 13
      name: target_export_markets
      label: Target Export Markets
      hint: Which markets do you want to enter
      type: select_multiple
      options:
      - North America
      - South America
      - Europe
      - Asia Pacific
      - Middle East
      - Africa
      - Australia and Oceania
      required: true
    - id: 14
      name: annual_production_capacity
      label: Annual Production Capacity
      hint: What is your production capacity
      type: select_one
      options:
      - Under 10,000 units
      - 10,000 to 50,000 units
      - 50,000 to 100,000 units
      - 100,000 to 500,000 units
      - Over 500,000 units
      required: true
    - id: 15
      name: certifications
      label: Certifications Held
      hint: What certifications does your company have
      type: select_multiple
      options:
      - ISO 9001
      - HACCP
      - FDA Registered
      - Organic Certification
      - Fair Trade
      - Kosher
      - Halal
      - BRC
      - None
      - Other
      required: true
    - id: 16
      name: program_goals
      label: Program Goals
      hint: What do you hope to achieve from this program
      type: text
      options: []
      required: true
    - id: 17
      name: export_challenges
      label: Export Challenges
      hint: What challenges do you face in exporting
      type: text
      options: []
      required: true
    - id: 18
      name: support_needed
      label: Support Needed
      hint: What type of support do you need
      type: select_multiple
      options:
      - Market Research
      - Regulatory Compliance
      - Distribution Partners
      - Marketing Support
      - Logistics Assistance
      - Trade Show Participation
      - Funding Assistance
      - Training and Education
      required: true
    - id: 19
      name: budget_range
      label: Export Budget Range
      hint: What is your export investment budget
      type: select_one
      options:
      - Under $10,000
      - $10,000 to $50,000
      - $50,000 to $100,000
      - $100,000 to $500,000
      - Over $500,000
      required: true
    - id: 20
      name: timeline
      label: Export Timeline
      hint: When do you plan to start exporting
      type: select_one
      options:
      - Immediately
      - Within 3 months
      - Within 6 months
      - Within 1 year
      - Exploring options
      required: true
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any other information about your company
      type: text
      options: []
      required: false
