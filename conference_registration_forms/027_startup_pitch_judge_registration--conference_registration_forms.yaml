inputSchema:
  type: object
  properties:
    title: Startup Pitch Judge Registration
    pages:
    - id: 1
      name: user_details
      label: User Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_expertise
      label: User Expertise
      hint: null
      type: select_multiple
      options:
      - Accelerators
      - Incubators
      - Venture Capitalists
      - Industry Experts
      required: false
    - id: 3
      name: availability
      label: Availability
      hint: null
      type: select_one
      options:
      - Yes, I am available to judge
      - 'False'
      required: false
    - id: 4
      name: contact
      label: Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
