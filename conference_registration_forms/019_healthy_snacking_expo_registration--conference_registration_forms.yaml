      options:
      - Gluten-free
      - Lactose-free
      - Nut-free
      - None
      required: false
    - id: 5
      name: session_interests
      label: Session Interests
      hint: null
      type: select_multiple
      options:
      - Nutrition
      - Wellness
      - Health
      - None
      required: false
