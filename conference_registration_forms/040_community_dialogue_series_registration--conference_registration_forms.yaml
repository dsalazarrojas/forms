inputSchema:
  type: object
  properties:
    title: Dialogue Series Registration
    pages:
      - id: 1
        name: attendee_name
        label: Attendee name
        hint: Full name
        type: text
        options: []
        required: true
      - id: 2
        name: organization
        label: Organization affiliation
        hint: Company or group name
        type: text
        options: []
        required: false
      - id: 3
        name: email
        label: Email address
        hint: For registration confirmation
        type: email
        options: []
        required: true
      - id: 4
        name: sessions_interested
        label: Sessions interested in attending
        hint: Select one or more sessions
        type: select_multiple
        options:
          - Opening plenary
          - Breakout session A
          - Breakout session B
          - Closing panel
        required: true
      - id: 5
        name: dietary_restrictions
        label: Dietary restrictions
        hint: For catering arrangements
        type: text
        options: []
        required: false
      - id: 6
        name: accessibility_needs
        label: Accessibility needs
        hint: Any accommodations required
        type: text
        options: []
        required: false
      - id: 7
        name: media_consent
        label: Consent to be recorded or photographed
        hint: For event documentation
        type: select_one
        options:
          - Yes I consent
          - No I do not consent
        required: false
