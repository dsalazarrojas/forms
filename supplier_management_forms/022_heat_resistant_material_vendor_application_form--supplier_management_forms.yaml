      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: reviewer_name
      label: Reviewer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: reviewer_company
      label: Reviewer Company
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: submission
      label: submission
      hint: null
      type: text
      options: []
      required: true
