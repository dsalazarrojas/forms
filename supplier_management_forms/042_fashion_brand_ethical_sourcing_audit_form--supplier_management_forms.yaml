inputSchema:
  type: object
  properties:
    title: Fashion Brand Ethical Sourcing Audit Form
    pages:
    - id: 1
      name: general_info
      label: General Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: supplier_info
      label: Supplier Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: sustainability
      label: Sustainability
      hint: Please provide more detailed information on your sustainability practices
      type: number
      options: []
      required: false
    - id: 4
      name: environmental_impact
      label: Environmental Impact
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: labor_practices
      label: Labor Practices
      hint: Please provide information on your labor practices
      type: select_one
      options:
      - Fair Labor Practices
      - Child Labor
      - Forced Labor
      required: false
    - id: 6
      name: product_responsible_sourcing
      label: Product Responsible Sourcing
      hint: null
      type: select_multiple
      options:
      - Organic Cotton
      - Recycled Materials
      - Fair Living Wage
      required: false
    - id: 7
      name: social_compliance
      label: Social Compliance
      hint: null
      type: select_multiple
      options:
      - Code of Conduct
      - Code of Conduct Certification
      - Supplier Certification
      required: false
    - id: 8
      name: audit_info
      label: Audit Info
      hint: Please provide detailed information on your audit results
      type: note
      options: []
      required: false
    - id: 9
      name: review_and_compliance
      label: Review and Compliance
      hint: Please review and provide evidence of your compliance with our code of
        conduct
      type: select_one
      options:
      - Compliant
      - Non-compliant
      required: false
    - id: 10
      name: supplier_feedback
      label: Supplier Feedback
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: contact_info
      label: Contact Info
      hint: null
      type: select_multiple
      options:
      - Phone Number
      - Email
      - Website
      required: false
    - id: 12
      name: review_and_compliance_2
      label: Review and Compliance 2
      hint: null
      type: select_one
      options:
      - Compliant
      - Non-compliant
      required: false
    - id: 13
      name: supplier_address
      label: Supplier Address
      hint: null
      type: select_multiple
      options:
      - Company Name
      - Address Line 1
      - Address Line 2
      - City
      - State/Province
      - Postal/Zip Code
      - Country
      required: false
    - id: 14
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 15
      name: website
      label: Website
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: certification
      label: Certification
      hint: null
      type: select_multiple
      options:
      - ISO 14001:2015
      - ISO 26000:2018
      - GOTS 2008
      required: false
    - id: 17
      name: review_and_compliance_3
      label: Review and Compliance 3
      hint: null
      type: select_one
      options:
      - Compliant
      - Non-compliant
      required: false
