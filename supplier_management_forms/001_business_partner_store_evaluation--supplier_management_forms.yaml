inputSchema:
  type: object
  properties:
    title: Business Partner Store Evaluation
    pages:
    - id: 1
      name: store_name
      label: Store Name
      hint: Enter the name of the store being evaluated
      type: text
      options: []
      required: true
    - id: 2
      name: evaluation_date
      label: Evaluation Date
      hint: Date when the evaluation was conducted
      type: date
      options: []
      required: true
    - id: 3
      name: partner_name
      label: Business Partner Name
      hint: Full name of the business partner
      type: text
      options: []
      required: true
    - id: 4
      name: evaluation_manager
      label: Evaluation Manager
      hint: Name of person conducting the evaluation
      type: text
      options: []
      required: true
    - id: 5
      name: overall_store_condition
      label: Overall Store Condition
      hint: Rate the general condition of the store
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Needs Improvement
      - Poor
      required: true
    - id: 6
      name: cleanliness_rating
      label: Cleanliness and Maintenance
      hint: Assess the cleanliness level
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Needs Improvement
      required: true
    - id: 7
      name: inventory_accuracy
      label: Inventory Accuracy
      hint: Is inventory properly organized and accurate
      type: select_one
      options:
      - Fully Accurate
      - Mostly Accurate
      - Partially Accurate
      - Needs Attention
      required: true
    - id: 8
      name: product_display
      label: Product Display and Layout
      hint: Rate the quality of product display
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Needs Improvement
      required: true
    - id: 9
      name: staff_appearance
      label: Staff Appearance and Conduct
      hint: Rate staff professionalism
      type: select_one
      options:
      - Professional
      - Acceptable
      - Needs Training
      - Unacceptable
      required: true
    - id: 10
      name: customer_service_quality
      label: Customer Service Quality
      hint: Assess the level of customer service
      type: select_one
      options:
      - Excellent
      - Good
      - Satisfactory
      - Needs Improvement
      required: true
    - id: 11
      name: compliance_status
      label: Compliance Status
      hint: Check compliance with standards
      type: select_multiple
      options:
      - Health and Safety
      - Pricing Accuracy
      - Product Quality
      - Documentation
      required: false
    - id: 12
      name: issues_identified
      label: Issues Identified
      hint: Describe any issues found during evaluation
      type: text
      options: []
      required: false
    - id: 13
      name: recommended_improvements
      label: Recommended Improvements
      hint: Suggest improvements for the store
      type: text
      options: []
      required: false
    - id: 14
      name: follow_up_date
      label: Follow-up Date
      hint: Scheduled date for follow-up visit
      type: date
      options: []
      required: false
    - id: 15
      name: evaluator_signature_date
      label: Evaluation Completion Date
      hint: Date evaluation was completed
      type: date
      options: []
      required: true
