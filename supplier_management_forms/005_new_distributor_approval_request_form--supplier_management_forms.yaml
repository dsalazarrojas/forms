inputSchema:
  type: object
  properties:
    title: New Distributor Approval Request Form
    pages:
    - id: 1
      name: distributor_request
      label: Request
      hint: Enter a brief description of your request.
      type: text
      options: []
      required: true
    - id: 2
      name: business_details
      label: Business Details
      hint: Enter your business name and address.
      type: text
      options: []
      required: true
    - id: 3
      name: contact_info
      label: Contact
      hint: Enter your contact information.
      type: text
      options: []
      required: true
    - id: 4
      name: product_info
      label: Product
      hint: Enter the product name and description.
      type: text
      options: []
      required: true
    - id: 5
      name: select_product_type
      label: Product Type
      hint: Select the type of product.
      type: select_one
      options:
      - Product A
      - Product B
      - Product C
      required: false
    - id: 6
      name: select_approval_status
      label: Approval Status
      hint: Select the approval status.
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: false
    - id: 7
      name: checkbox_request
      label: Additional Request Options
      hint: Select additional request options.
      type: checkbox
      options:
      - Option A
      - Option B
      - Option C
      required: false
    - id: 8
      name: radio_request
      label: Priority Request
      hint: Select priority request.
      type: radio
      options:
      - High Priority
      - Medium Priority
      - Low Priority
      required: false
    - id: 9
      name: note_request
      label: Additional Comments
      hint: Enter any additional comments.
      type: note
      options: []
      required: false
    - id: 10
      name: submit_button
      label: Submit
      hint: Submit your request.
      type: text
      options: []
      required: true
    - id: 11
      name: confirmation
      label: Request Confirmation
      hint: Please confirm that your request has been received.
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: submission_status
      label: Submission Status
      hint: Enter the submission status.
      type: select_one
      options:
      - Draft
      - Pending
      - Completed
      required: false
    - id: 13
      name: submission_date
      label: Submission Date
      hint: Enter the submission date.
      type: date
      options: []
      required: true
    - id: 14
      name: submission_time
      label: Submission Time
      hint: Enter the submission time.
      type: time
      options: []
      required: true
    - id: 15
      name: submitter_info
      label: Submitter Information
      hint: Enter your name and title.
      type: text
      options: []
      required: true
    - id: 16
      name: submitter_department
      label: Department
      hint: Enter your department.
      type: text
      options: []
      required: true
    - id: 17
      name: submitter_job_title
      label: Job Title
      hint: Enter your job title.
      type: text
      options: []
      required: true
    - id: 18
      name: submitter_email
      label: Email
      hint: Enter your email address.
      type: email
      options: []
      required: true
