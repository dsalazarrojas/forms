      name: supplier_info
      label: Supplier Information
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: supplier_status
      label: Supplier Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      - Pending
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: quote_date
      label: Quote Date
      hint: null
      type: date
      options: []
