inputSchema:
  type: object
  properties:
    title: Conscious Warehouse Registration
    pages:
    - id: 1
      name: registration_date
      label: Registration Date
      hint: Date of warehouse registration
      type: date
      options: []
      required: true
    - id: 2
      name: warehouse_name
      label: Warehouse Name
      hint: Official name of the warehouse
      type: text
      options: []
      required: true
    - id: 3
      name: warehouse_id
      label: Warehouse ID
      hint: Unique identifier for warehouse
      type: text
      options: []
      required: true
    - id: 4
      name: company_name
      label: Company Name
      hint: Operating company name
      type: text
      options: []
      required: true
    - id: 5
      name: contact_name
      label: Contact Person Name
      hint: Primary contact person
      type: text
      options: []
      required: true
    - id: 6
      name: contact_email
      label: Contact Email
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 7
      name: contact_phone
      label: Contact Phone
      hint: Primary contact phone number
      type: text
      options: []
      required: true
    - id: 8
      name: warehouse_address
      label: Warehouse Address
      hint: Full physical address
      type: text
      options: []
      required: true
    - id: 9
      name: warehouse_city
      label: City
      hint: City location
      type: text
      options: []
      required: true
    - id: 10
      name: warehouse_state
      label: State or Province
      hint: State or province
      type: text
      options: []
      required: true
    - id: 11
      name: warehouse_country
      label: Country
      hint: Country location
      type: text
      options: []
      required: true
    - id: 12
      name: warehouse_postal_code
      label: Postal Code
      hint: ZIP or postal code
      type: text
      options: []
      required: true
    - id: 13
      name: warehouse_size
      label: Warehouse Size
      hint: Total square footage
      type: select_one
      options:
      - Less than 10,000 sq ft
      - 10,000 to 50,000 sq ft
      - 50,000 to 100,000 sq ft
      - 100,000 to 500,000 sq ft
      - More than 500,000 sq ft
      required: true
    - id: 14
      name: storage_capacity
      label: Storage Capacity
      hint: Number of pallet positions or units
      type: text
      options: []
      required: true
    - id: 15
      name: warehouse_type
      label: Warehouse Type
      hint: Primary function of warehouse
      type: select_one
      options:
      - Distribution Center
      - Fulfillment Center
      - Cold Storage
      - Bulk Storage
      - Cross-Dock Facility
      - Manufacturing Warehouse
      - Retail Warehouse
      - Other
      required: true
    - id: 16
      name: temperature_controlled
      label: Is Warehouse Temperature Controlled
      hint: Climate control capabilities
      type: select_one
      options:
      - Yes - Fully Climate Controlled
      - Yes - Partially Climate Controlled
      - 'False'
      required: true
    - id: 17
      name: sustainability_certifications
      label: Sustainability Certifications
      hint: Select all that apply
      type: select_multiple
      options:
      - LEED Certified
      - ISO 14001
      - Energy Star
      - Green Building Certified
      - Carbon Neutral
      - None
      - Other
      required: true
    - id: 18
      name: environmental_practices
      label: Environmental Practices Implemented
      hint: Select all that apply
      type: select_multiple
      options:
      - Solar Power
      - LED Lighting
      - Recycling Program
      - Water Conservation
      - Electric Vehicles
      - Energy Management System
      - Waste Reduction Program
      - None
      required: true
    - id: 19
      name: safety_certifications
      label: Safety Certifications
      hint: Select all that apply
      type: select_multiple
      options:
      - OSHA Compliant
      - ISO 45001
      - SQF Certified
      - BRC Certified
      - HACCP Certified
      - None
      - Other
      required: true
    - id: 20
      name: labor_practices
      label: Labor Practices
      hint: Select all that apply
      type: select_multiple
      options:
      - Fair Wage Policy
      - Employee Benefits
      - Training Programs
      - Safety Training
      - Diversity and Inclusion Program
      - Union Representation
      - Employee Wellness Program
      required: true
    - id: 21
      name: technology_systems
      label: Technology Systems in Use
      hint: Select all that apply
      type: select_multiple
      options:
      - WMS - Warehouse Management System
      - RFID Tracking
      - Barcode Scanning
      - Automated Storage and Retrieval
      - Robotics
      - IoT Sensors
      - Real-time Location System
      - None
      required: true
    - id: 22
      name: operating_hours
      label: Operating Hours
      hint: When does the warehouse operate
      type: select_one
      options:
      - 24/7
      - 24/5
      - Day Shift Only
      - Extended Hours
      - Seasonal
      required: true
    - id: 23
      name: employee_count
      label: Number of Employees
      hint: Approximate number of warehouse staff
      type: select_one
      options:
      - 1 to 10
      - 11 to 50
      - 51 to 100
      - 101 to 500
      - More than 500
      required: true
    - id: 24
      name: ethical_sourcing_policy
      label: Do You Have an Ethical Sourcing Policy
      hint: Written policy on ethical practices
      type: select_one
      options:
      - Yes - Documented and Enforced
      - Yes - In Development
      - 'False'
      required: true
    - id: 25
      name: audit_history
      label: When Was Last External Audit
      hint: Date of most recent audit
      type: date
      options: []
      required: false
    - id: 26
      name: additional_information
      label: Additional Information
      hint: Any other relevant details
      type: text
      options: []
      required: false
    - id: 27
      name: registration_status
      label: Registration Status
      hint: For administrative use
      type: select_one
      options:
      - Submitted
      - Under Review
      - Approved
      - Requires Additional Information
      - Rejected
      required: true
