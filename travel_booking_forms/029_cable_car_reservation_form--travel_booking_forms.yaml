inputSchema:
  type: object
  properties:
    title: Cable Car Reservation Form
    pages:
    - id: 1
      name: reserver_name
      label: Reserver name
      hint: Full name for booking
      type: text
      options: []
      required: true
    - id: 2
      name: contact_phone
      label: Contact phone
      hint: For booking confirmation
      type: text
      options: []
      required: true
    - id: 3
      name: reservation_date
      label: Reservation date
      hint: Preferred travel date
      type: date
      options: []
      required: true
    - id: 4
      name: time_slot
      label: Time slot
      hint: Preferred departure time
      type: time
      options: []
      required: true
    - id: 5
      name: party_size
      label: Number in party
      hint: Integer count
      type: number
      options: []
      required: true
    - id: 6
      name: accessibility_requirements
      label: Accessibility requirements
      hint: Wheelchair assistance etc
      type: text
      options: []
      required: false
    - id: 7
      name: special_requests
      label: Special requests
      hint: Catering or guide requests
      type: text
      options: []
      required: false
    - id: 8
      name: payment_method
      label: Payment method
      hint: On site or prepay
      type: select_one
      options:
      - Pay on site
      - Prepay online
      required: true
