inputSchema:
  type: object
  properties:
    title: travel_payment_form
    pages:
    - id: 1
      name: travel_date
      label: Travel Date
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: group_travelers
      label: group_travelers
      hint: null
      type: select_multiple
      options:
      - Manager
      - Team
      - Customer
      required: false
    - id: 3
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Account
      required: false
    - id: 4
      name: amount
      label: amount
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: assigned_to
      label: Assigned to
      hint: null
      type: select_one
      options:
      - Manager
      - Assistant
      - Customer
      required: false
    - id: 9
      name: payment_status
      label: Payment Status
      hint: null
      type: select_one
      options:
      - Pending
      - Paid
      - Rejected
      required: false
    - id: 10
      name: payment_type
      label: Payment Type
      hint: null
      type: select_one
      options:
      - Travel Expenses
      - Other
      required: false
    - id: 11
      name: expense_item
      label: Expense Item
      hint: null
      type: select_multiple
      options:
      - Flight
      - Hotel
      - Food
      - Transportation
      required: false
