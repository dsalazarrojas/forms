inputSchema:
  type: object
  properties:
    title: Cinque Terre Hotel Recommendation Request
    pages:
    - id: 1
      name: traveler_name
      label: Your Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: For hotel recommendations
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: country
      label: Country of Residence
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: travel_dates
      label: Planned Travel Dates
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: return_date
      label: Return Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: number_guests
      label: Number of Guests
      hint: Including yourself
      type: number
      options: []
      required: true
    - id: 8
      name: number_rooms
      label: Number of Rooms Needed
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: room_type
      label: Preferred Room Type
      hint: null
      type: select_one
      options:
      - Single room
      - Double room
      - Twin room
      - Suite
      - Apartment
      - No preference
      required: true
    - id: 10
      name: budget_range
      label: Budget Range Per Night
      hint: In Euros
      type: select_one
      options:
      - Under 100 EUR
      - 100-150 EUR
      - 151-200 EUR
      - 201-300 EUR
      - Over 300 EUR
      - No budget limit
      required: true
    - id: 11
      name: village_preference
      label: Preferred Village in Cinque Terre
      hint: null
      type: select_one
      options:
      - Monterosso al Mare
      - Vernazza
      - Corniglia
      - Manarola
      - Riomaggiore
      - No preference
      required: true
    - id: 12
      name: amenities
      label: Required Amenities
      hint: Select all that apply
      type: select_multiple
      options:
      - WiFi
      - Air conditioning
      - Sea view
      - Balcony/Terrace
      - Breakfast included
      - Parking
      - Pool
      - Restaurant
      - Pet-friendly
      required: true
    - id: 13
      name: accessibility
      label: Accessibility Requirements
      hint: null
      type: select_one
      options:
      - No requirements
      - Ground floor needed
      - Elevator required
      - Wheelchair accessible
      - Other
      required: true
    - id: 14
      name: accessibility_detail
      label: Please Specify Accessibility Needs
      hint: If other
      type: text
      options: []
      required: false
    - id: 15
      name: travel_purpose
      label: Purpose of Travel
      hint: null
      type: select_one
      options:
      - Vacation
      - Honeymoon
      - Family trip
      - Business
      - Photography
      - Hiking
      - Other
      required: true
    - id: 16
      name: interests
      label: What Are Your Main Interests
      hint: Select all that apply
      type: select_multiple
      options:
      - Beach activities
      - Hiking trails
      - Wine tasting
      - Local cuisine
      - Photography
      - History and culture
      - Swimming
      - Boat tours
      required: true
    - id: 17
      name: transportation
      label: How Will You Arrive
      hint: null
      type: select_one
      options:
      - By car
      - By train
      - By plane
      - By cruise ship
      - Other
      required: true
    - id: 18
      name: parking_needed
      label: Do You Need Parking Information
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 19
      name: special_occasion
      label: Is This a Special Occasion
      hint: Anniversary, birthday, etc.
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 20
      name: special_occasion_detail
      label: Please Specify Special Occasion
      hint: If yes
      type: text
      options: []
      required: false
    - id: 21
      name: previous_visit
      label: Have You Visited Cinque Terre Before
      hint: null
      type: select_one
      options:
      - Yes, multiple times
      - Yes, once
      - No, first time
      required: true
    - id: 22
      name: additional_requests
      label: Any Additional Requests or Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: contact_preference
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Either
      required: true
