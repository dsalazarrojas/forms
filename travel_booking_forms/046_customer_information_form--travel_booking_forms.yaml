inputSchema:
  type: object
  properties:
    title: Customer Information Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Enter customer's name
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: Enter customer's last name
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Enter customer's phone number
      type: text
      options: []
      required: false
    - id: 5
      name: travel_dates
      label: Travel Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: travel_type
      label: Travel Type
      hint: null
      type: select_one
      options:
      - Air
      - Land
      - Sea
      - Train
      required: false
    - id: 8
      name: travel_agent
      label: Travel Agent
      hint: null
      type: select_multiple
      options:
      - Jimmy
      - Sarah
      - John
      required: false
