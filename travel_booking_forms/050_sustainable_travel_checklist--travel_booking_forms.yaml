inputSchema:
  type: object
  properties:
    title: Sustainable Travel Checklist
    pages:
    - id: 1
      name: user_input_1
      label: To encourage sustainable travel, we want to get to know a little about
        you.
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_input_2
      label: What is your primary mode of transportation for your next trip?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 3
      name: user_input_3
      label: How do you usually book your travel accommodations?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 4
      name: user_input_4
      label: Do you consider sustainable travel practices as important when making
        your travel decisions?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 5
      name: user_input_5
      label: Have you participated in any eco-tourism activities?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 6
      name: user_input_6
      label: Which of the following actions do you take to reduce your environmental
        impact?
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      - Option 5
      required: false
    - id: 7
      name: user_input_7
      label: How often do you offset flights?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 8
      name: user_input_8
      label: Do you prefer sustainable accommodations?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 9
      name: user_input_9
      label: How likely are you to choose accommodations with eco-friendly practices?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 10
      name: user_input_10
      label: Do you usually take public transport to get to your destinations?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 11
      name: user_input_11
      label: How often do you choose local tour operators for your activities?
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
    - id: 12
      name: user_input_12
      label: Do you use a refillable water bottle during your trip?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
