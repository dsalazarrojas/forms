inputSchema:
  type: object
  properties:
    title: Usa Visa
    pages:
    - id: 1
      name: travel_mode
      label: What travel mode would you like to book?
      hint: null
      type: select_one
      options:
      - Airline
      - Train
      - Bus
      - Taxi
      - Car Rental
      required: true
    - id: 2
      name: traveler_name
      label: What is the traveler's name?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: traveler_email
      label: What is the traveler's email?
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: traveler_phone
      label: What is the traveler's phone number?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: travel_date
      label: On what date would you like to travel?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: travel_time
      label: At what time would you like to travel?
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: travel_agency
      label: Select Travel Agency
      hint: null
      type: select_one
      options:
      - Airline
      - Train
      - Bus
      - Taxi
      - Car Rental
      required: false
