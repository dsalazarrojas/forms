inputSchema:
  type: object
  properties:
    title: Travel Expenses Fest Team Form
    pages:
    - id: 1
      name: travel_expenses_fest_team_form_page_1
      label: What is the team member's name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: travel_expenses_fest_team_form_page_2
      label: What is the travel expense amount?
      hint: null
      type: number
      options: []
      required: true
    - id: 3
      name: travel_expenses_fest_team_form_page_3
      label: What is the payment method for the expense?
      hint: null
      type: select_one
      options:
      - Cash
      - Credit card
      - Debit card
      required: false
    - id: 4
      name: travel_expenses_fest_team_form_page_4
      label: Date of arrival
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: travel_expenses_fest_team_form_page_5
      label: Date of departure
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: travel_expenses_fest_team_form_page_6
      label: What is the travel destination?
      hint: null
      type: select_one
      options:
      - New York
      - Los Angeles
      - Chicago
      - Miami
      - Austin
      - Boston
      required: false
    - id: 7
      name: travel_expenses_fest_team_form_page_7
      label: How many people are traveling?
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: travel_expenses_fest_team_form_page_8
      label: What is the travel purpose?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: travel_expenses_fest_team_form_page_9
      label: What is the travel mode of transportation?
      hint: null
      type: select_multiple
      options:
      - Car
      - Train
      - Plane
      - Bus
      - Other
      required: true
    - id: 10
      name: travel_expenses_fest_team_form_page_10
      label: Additional comments or notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: travel_expenses_fest_team_form_page_11
      label: Travel expenses details (e.g. accommodation, food, etc.)
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: travel_expenses_fest_team_form_page_12
      label: Review and submit the form
      hint: null
      type: radio
      options:
      - I agree to the terms and conditions
      - I do not agree to the terms and conditions
      required: true
