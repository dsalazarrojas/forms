inputSchema:
  type: object
  properties:
    title: Vacation Packing Checklist Form
    pages:
    - id: 1
      name: destination
      label: What's the destination of your trip?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: duration
      label: How long is your trip?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: additional_items
      label: Will you be packing any additional items?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: start_date
      label: When is your trip starting?
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: end_date
      label: When is your trip ending?
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: extra_time_slots
      label: Do you need any extra time slots?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: email
      label: What's your email address?
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: What's your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: travel_notes
      label: Do you have any travel notes?
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: additional_travel_notes
      label: Do you have any additional travel notes?
      hint: null
      type: note
      options: []
      required: false
