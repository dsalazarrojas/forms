inputSchema:
  type: object
  properties:
    title: Hotel Booking Form Template
    pages:
    - id: 1
      name: travel_details
      label: Travel Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_info
      label: Customer Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: travel_dates
      label: Travel Dates
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: room_type
      label: Room Type
      hint: null
      type: select_multiple
      options:
      - Hotel
      - Inn
      - Motel
      - Resort
      required: false
    - id: 5
      name: room_number
      label: Room Number
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: guest_info
      label: Guest Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - Bank Transfer
      - Check
      required: false
    - id: 8
      name: payment_info
      label: Payment Info
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: customer_note
      label: Customer Note
      hint: null
      type: note
      options: []
      required: false
