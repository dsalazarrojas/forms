inputSchema:
  type: object
  properties:
    title: Airline Staff Safety Gear Requisition Form
    pages:
    - id: 1
      name: section_employee_info
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Flight Crew
      - Ground Handling
      - Maintenance/Engineering
      - In-flight Services
      - Cargo Operations
      - Security
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_gear_request
      label: -- Safety Gear Requisition --
      hint: Select items needed
      type: note
      options: []
      required: false
    - id: 7
      name: gear_type
      label: Type of Gear Requested
      hint: null
      type: select_multiple
      options:
      - High-Visibility Vest
      - Safety Shoes/Boots
      - Hearing Protection (Earmuffs/Plugs)
      - Safety Glasses/Goggles
      - Protective Gloves
      - Hard Hat/Safety Helmet
      - Respiratory Protection (Masks)
      - Weatherproof Gear
      required: true
    - id: 8
      name: gear_sizes
      label: Item Sizes (if applicable)
      hint: e.g. Medium Vest, Size 10 Boots
      type: text
      options: []
      required: false
    - id: 9
      name: reason_for_request
      label: Reason for Requisition
      hint: null
      type: select_one
      options:
      - New Issue (Initial Supply)
      - Replacement (Worn Out)
      - Replacement (Damaged)
      - Lost Item
      - Size Exchange
      required: true
    - id: 10
      name: damage_report
      label: Description of Damage (if replacement requested)
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: quantity_requested
      label: Quantity for each item
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: urgency
      label: Request Urgency
      hint: null
      type: select_one
      options:
      - Urgent (Operational Safety Risk)
      - Standard
      - Planned Replacement
      required: true
    - id: 13
      name: supervisor_name
      label: Name of Approving Supervisor
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: employee_confirmation
      label: I confirm that the gear will be used for official duties only
      hint: null
      type: select_one
      options:
      - I confirm
      - Other
      required: true
