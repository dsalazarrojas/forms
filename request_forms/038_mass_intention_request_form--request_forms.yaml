inputSchema:
  type: object
  properties:
    title: Mass Intention Request Form
    pages:
    - id: 1
      name: mass_intention_date
      label: Date of the Event
      hint: null
      type: date
      options: []
      required: true
    - id: 2
      name: mass_intention_time
      label: Time of the Mass
      hint: null
      type: time
      options: []
      required: true
    - id: 3
      name: requested_by
      label: Requested By
      hint: null
      type: select_one
      options:
      - I am requesting the mass for myself
      - I am requesting the mass for someone else
      required: true
    - id: 4
      name: mass_intention_type
      label: Intention of the Mass
      hint: null
      type: select_multiple
      options:
      - Requiem
      - Rosary
      - Mass of the Sick
      - Mass of the Dead
      - Other (please specify)
      required: true
    - id: 5
      name: mass_intention_additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: mass_location
      label: Location of the Mass
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: mass_saint
      label: Saint
      hint: null
      type: select_one
      options:
      - Saint
      - Other
      required: false
    - id: 8
      name: mass_saint_name
      label: Saint's Name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: mass_for_who
      label: Mass is for
      hint: null
      type: select_multiple
      options:
      - Me
      - Someone Else (specify below)
      required: true
    - id: 10
      name: mass_for_who_else
      label: Mass is for (if not for the requestor)
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: mass_liturgy_requests
      label: Liturgical Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: mass_location_2
      label: Mass Location
      hint: null
      type: text
      options: []
      required: false
