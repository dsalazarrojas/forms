inputSchema:
  type: object
  properties:
    title: Cake Quote Form
    pages:
    - id: 1
      name: contact_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: event_details_header
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: number_of_guests
      label: Number of Guests to Serve
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: cake_details_header
      label: -- Cake Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: cake_flavor_preference
      label: Preferred Cake Flavor
      hint: null
      type: select_one
      options:
      - Chocolate
      - Vanilla
      - Strawberry
      - Red Velvet
      - Lemon
      - Carrot Cake
      - Multiple flavors
      - Custom
      required: true
    - id: 10
      name: cake_shape
      label: Cake Shape
      hint: null
      type: select_one
      options:
      - Round
      - Square
      - Rectangular
      - Heart-shaped
      - Tiered
      - Custom
      required: true
    - id: 11
      name: cake_message
      label: Message or Text for Cake
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: frosting_choice
      label: Frosting Type
      hint: null
      type: select_one
      options:
      - Buttercream
      - Cream Cheese
      - Chocolate Ganache
      - Fondant
      - Other
      required: true
    - id: 13
      name: budget_header
      label: -- Budget --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: budget_amount
      label: Budget Range
      hint: null
      type: select_one
      options:
      - Under $100
      - $100 - $250
      - $250 - $500
      - $500 - $1000
      - $1000+
      required: true
    - id: 15
      name: special_request_header
      label: -- Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: special_requirements
      label: Special Dietary or Allergy Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: custom_decorations
      label: Custom Decorations or Design
      hint: Describe your vision
      type: text
      options: []
      required: false
    - id: 18
      name: delivery_header
      label: -- Delivery Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: delivery_pickup
      label: Delivery or Pickup?
      hint: null
      type: select_one
      options:
      - Delivery
      - Pickup
      required: true
    - id: 20
      name: delivery_location
      label: Delivery Location
      hint: Address if delivery selected
      type: text
      options: []
      required: false
