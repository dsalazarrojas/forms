    - id: 4
      name: request_move_date
      label: Move date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: request_move_time
      label: Move time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: request_reason
      label: Reason for move
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: request_comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: request_assignee
      label: Assignee
      hint: null
      type: text
      options: []
      required: false
