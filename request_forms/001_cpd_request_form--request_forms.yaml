inputSchema:
  type: object
  properties:
    title: CPD Request Form
    pages:
    - id: 1
      name: section_personal_details
      label: -- Personal Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: select your current department
      type: select_one
      options:
      - HR
      - Finance
      - IT
      - Operations
      - Marketing
      - Sales
      - Legal
      required: true
    - id: 5
      name: section_training_request
      label: -- Training Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: course_title
      label: CPD Course Title
      hint: Enter the full name of the course or training
      type: text
      options: []
      required: true
    - id: 7
      name: provider_name
      label: Training Provider
      hint: Name of the organization offering the training
      type: text
      options: []
      required: true
    - id: 8
      name: start_date
      label: Proposed Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: end_date
      label: Proposed End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: total_cost
      label: Total Estimated Cost
      hint: Include any associated travel or materials
      type: number
      options: []
      required: true
    - id: 11
      name: rationale
      label: Professional Development Rationale
      hint: How will this training benefit your role and the organization
      type: text
      options: []
      required: true
    - id: 12
      name: alignment_with_goals
      label: Alignment with Annual Goals
      hint: Which specific performance goal does this address
      type: text
      options: []
      required: false
    - id: 13
      name: line_manager_approval
      label: Line Manager Name
      hint: null
      type: text
      options: []
      required: true
