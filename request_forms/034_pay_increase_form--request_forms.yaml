inputSchema:
  type: object
  properties:
    title: Pay Increase Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: increase_type
      label: Increase Type
      hint: Select from the dropdown
      type: select_one
      options:
      - Percentage
      - Dollar Amount
      - Bonus/Commutative
      - Other
      required: false
    - id: 3
      name: amount_increase
      label: Amount of Increase
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: effective_date
      label: Effective Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: justification_letter
      label: Justification Letter
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: approval_status
      label: Approval Status
      hint: null
      type: select_one
      options:
      - Approved
      - Denied
      - Pending
      required: true
    - id: 7
      name: signature_of_decision_maker
      label: Signature of Decision Maker
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: approver_name
      label: Approvers Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: approver_email
      label: Approvers Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: approver_phone
      label: Approvers Phone
      hint: null
      type: text
      options: []
      required: false
