inputSchema:
  type: object
  properties:
    title: Tool Request Form
    pages:
    - id: 1
      name: job_number
      label: Job Number
      hint: null
      type: number
      options: []
      required: false
    - id: 2
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: tool_type
      label: Tool Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: requested_by
      label: Requested By
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
