inputSchema:
  type: object
  properties:
    title: Smart Access Card Replacement Request
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: reason_for_replacement
      label: Reason for Replacement
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: confirm_replacement
      label: Has the Card Replacement Been Confirmed?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Security
      - Access
      - Other
      required: true
    - id: 6
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Finance
      - HR
      - IT
      required: true
    - id: 7
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - Office
      - Remote
      required: true
    - id: 8
      name: confirmed_by
      label: Confirmed By
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: confirmed_by_title
      label: Confirmed By Title
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: confirmed_by_phone
      label: Confirmed By Phone
      hint: null
      type: text
      options: []
      required: false
