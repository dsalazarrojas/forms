inputSchema:
  type: object
  properties:
    title: Hair Consultation Request Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: preferred_haircutting_style
      label: Preferred Haircutting Style
      hint: null
      type: select_multiple
      options:
      - Bobbed
      - Other
      required: false
    - id: 5
      name: hair_treatment_system
      label: Hair Treatment System
      hint: null
      type: select_one
      options:
      - Hair Treatment System 1
      - Hair Treatment System 2
      - Hair Treatment System 3
      required: false
    - id: 6
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: preferred_appointment_day
      label: Preferred Appointment Day
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
