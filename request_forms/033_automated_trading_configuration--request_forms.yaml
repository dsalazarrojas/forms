inputSchema:
  type: object
  properties:
    title: Automated Trading Configuration
    pages:
    - id: 1
      name: introduction
      label: Automated Trading Configuration
      hint: Configure your automated trading settings
      type: note
      options: []
      required: false
    - id: 2
      name: trader_info
      label: Trader Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 3
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 4
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email Address
      hint: Primary email
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 7
      name: account_number
      label: Trading Account Number
      hint: Your account number
      type: text
      options: []
      required: true
    - id: 8
      name: account_type
      label: Account Type
      hint: Type of account
      type: select_one
      options:
