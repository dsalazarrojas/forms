      name: take_profit_value
      label: Take Profit Value
      hint: Default value
      type: number
      options: []
      required: false
    - id: 27
      name: risk_reward_ratio
      label: Risk Reward Ratio
      hint: Minimum ratio
      type: number
      options: []
      required: false
    - id: 28
      name: position_sizing
      label: Position Sizing Method
      hint: How to size positions
      type: select_one
      options:
      - Fixed Lot
      - Percentage of Equity
      - Risk Based
      - Kelly Criterion
      - Fixed Dollar
      required: true
    - id: 29
      name: fixed_lot_size
      label: Fixed Lot Size
      hint: If using fixed
      type: number
      options: []
      required: false
    - id: 30
      name: max_positions
      label: Maximum Open Positions
      hint: Limit on positions
      type: number
      options: []
      required: true
    - id: 31
      name: investment_info
      label: Investment Information
      hint: Capital details
      type: note
      options: []
      required: false
    - id: 32
      name: initial_capital
      label: Initial Capital
      hint: Starting amount
      type: number
      options: []
      required: true
    - id: 33
      name: currency
      label: Account Currency
      hint: Base currency
      type: select_one
      options:
      - USD
      - EUR
      - GBP
      - JPY
      - CHF
      - AUD
      - CAD
      - Other
      required: true
    - id: 34
      name: leverage
      label: Leverage
      hint: Trading leverage
      type: select_one
      options:
      - '61'
      - '70'
      - '90'
      - '110'
      - 1:100
      - 1:200
      - 1:500
      required: false
    - id: 35
      name: automation_settings
      label: Automation Settings
      hint: How to automate
      type: note
      options: []
      required: false
    - id: 36
      name: automation_level
      label: Level of Automation
      hint: How automated
      type: select_one
      options:
      - Fully Automated
      - Semi-Automated
      - Signal Based
      - Manual Confirmation Required
      required: true
    - id: 37
      name: trade_execution
      label: Trade Execution
      hint: How to execute
      type: select_one
      options:
      - Market Order
      - Limit Order
      - Stop Order
      - Best Available
      required: true
    - id: 38
      name: slippage_tolerance
      label: Slippage Tolerance
      hint: Maximum slippage
      type: number
      options: []
      required: false
    - id: 39
      name: notifications
      label: Notifications
      hint: Alert settings
      type: select_multiple
      options:
      - Trade Opened
      - Trade Closed
      - Stop Loss Hit
      - Take Profit Hit
      - Daily Summary
      - Weekly Report
      - Margin Alert
      - Error Notifications
      required: false
    - id: 40
      name: notification_method
      label: Notification Method
      hint: How to notify
      type: select_one
      options:
      - Email
      - SMS
      - Push Notification
      - All of Above
      required: false
    - id: 41
      name: backtesting
      label: Backtesting
      hint: Testing preferences
      type: note
      options: []
      required: false
