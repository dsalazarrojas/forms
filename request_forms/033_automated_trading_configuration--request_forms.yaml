      - MetaTrader 5
      - TradingView
      - ThinkOrSwim
      - Interactive Brokers
      - E-Trade
      - TD Ameritrade
      - Other
      required: true
    - id: 11
      name: broker_name
      label: Broker Name
      hint: Your broker
      type: text
      options: []
      required: true
    - id: 12
      name: strategy_info
      label: Strategy Information
      hint: Trading strategy details
      type: note
      options: []
      required: false
    - id: 13
      name: strategy_type
      label: Strategy Type
      hint: What strategy
      type: select_one
      options:
      - Trend Following
      - Mean Reversion
      - Breakout
      - Scalping
      - Day Trading
      - Swing Trading
      - Position Trading
      - Arbitrage
      - Grid Trading
      - Martingale
      - Other
      required: true
