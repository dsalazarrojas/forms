      - Percentage
      - Trailing
      - ATR Based
      - Support Resistance
      - None
      required: true
    - id: 24
      name: stop_loss_value
      label: Stop Loss Value
      hint: Default value
      type: number
      options: []
      required: false
    - id: 25
      name: take_profit_type
      label: Take Profit Type
