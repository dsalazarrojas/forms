      name: terms_acceptance
      label: Terms and Conditions
      hint: I agree to terms
      type: select_one
      options:
      - I Agree
      - I Do Not Agree
      required: true
    - id: 47
      name: risk_disclosure
      label: Risk Disclosure Acknowledgment
      hint: I understand the risks
      type: select_one
      options:
      - I Acknowledge
      - I Do Not Acknowledge
      required: true
    - id: 48
      name: trader_signature
      label: Trader Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 49
      name: configuration_date
      label: Configuration Date
      hint: Today date
      type: date
      options: []
      required: true
