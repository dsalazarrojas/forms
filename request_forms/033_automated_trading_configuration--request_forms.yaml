      name: backtest_period
      label: Backtest Period
      hint: Time period
      type: select_one
      options:
      - 1 Month
      - 3 Months
      - 6 Months
      - 1 Year
      - 2 Years
      - 5 Years
      - Max Available
      required: false
    - id: 44
      name: demo_period
      label: Demo Trading Period
      hint: Test on demo first
      type: select_one
      options:
      - 1 Week
      - 2 Weeks
      - 1 Month
      - Skip Go Live
      required: false
