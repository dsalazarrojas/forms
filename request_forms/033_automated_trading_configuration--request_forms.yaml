      - Joint
      - Corporate
      - IRA
      - Trust
      - Other
      required: true
    - id: 9
      name: platform_info
      label: Platform Information
      hint: Trading platform details
      type: note
      options: []
      required: false
    - id: 10
      name: trading_platform
      label: Trading Platform
      hint: Which platform
      type: select_one
      options:
