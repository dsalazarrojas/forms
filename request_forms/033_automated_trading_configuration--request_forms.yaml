      hint: Percentage of account
      type: number
      options: []
      required: true
    - id: 21
      name: max_daily_loss
      label: Maximum Daily Loss
      hint: Percentage limit
      type: number
      options: []
      required: true
    - id: 22
      name: max_drawdown
      label: Maximum Drawdown
      hint: Percentage limit
      type: number
      options: []
      required: true
    - id: 23
      name: stop_loss_type
      label: Stop Loss Type
      hint: Type of stop loss
      type: select_one
      options:
