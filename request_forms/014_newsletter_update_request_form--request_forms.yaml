inputSchema:
  type: object
  properties:
    title: Newsletter Update Request Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: newsletter_preference
      label: Newsletter Preference
      hint: null
      type: select_one
      options:
      - Newsletters
      - Promotions
      - News & Updates
      - No Newsletters or Promotions
      required: true
    - id: 5
      name: time_zone
      label: Time Zone
      hint: null
      type: select_one
      options:
      - EST
      - EST5
      - EST10
      - EST11
      required: true
    - id: 6
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: date_format
      label: Date Format
      hint: null
      type: select_one
      options:
      - Month
      - Day of Month
      - Month Day
      - Year
      required: true
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: date_abbreviations
      label: Date Abbreviations
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: time_zone_abbreviation
      label: Time Zone Abbreviation
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: confirm
      label: Confirm
      hint: null
      type: text
      options: []
      required: true
