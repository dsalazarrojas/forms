inputSchema:
  type: object
  properties:
    title: Livestock Care Consultation Request Form
    pages:
    - id: 1
      name: farm_name
      label: Farm Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: location
      label: location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: animal_type
      label: animal_type
      hint: null
      type: select_one
      options:
      - Cat
      - Horse
      - Cow
      - Pig
      - Sheep
      - Goat
      required: false
    - id: 4
      name: consultation_date
      label: consultation_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: phone_number
      label: phone_number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: description
      label: description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: priority
      label: priority
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: schedule_follow_up
      label: schedule_follow_up
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 10
      name: additional_comments
      label: additional_comments
      hint: null
      type: text
      options: []
      required: false
