inputSchema:
  type: object
  properties:
    title: Burger Restaurant Shift Swap Request Form
    pages:
    - id: 1
      name: header
      label: -- Shift Swap Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee name
      hint: Full name of the employee requesting the swap
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee id
      hint: Internal staff identifier if applicable
      type: text
      options: []
      required: false
    - id: 4
      name: current_shift_date
      label: Current shift date
      hint: Date of the shift you want to swap
      type: date
      options: []
      required: true
    - id: 5
      name: current_shift_time
      label: Current shift time
      hint: Start and end time of your current shift
      type: time
      options: []
      required: true
    - id: 6
      name: requested_swap_with
      label: Requested swap with
      hint: Name of the employee you propose to swap with
      type: text
      options: []
      required: false
    - id: 7
      name: reason_for_swap
      label: Reason for swap
      hint: Brief explanation for the request
      type: text
      options: []
      required: true
    - id: 8
      name: manager_approval_needed
      label: Manager approval needed
      hint: Does this swap require manager approval
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: contact_phone
      label: Contact phone
      hint: Phone number for quick coordination
      type: text
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any other information for scheduling team
      type: text
      options: []
      required: false
