inputSchema:
  type: object
  properties:
    title: Audio Visual Setup Request Form
    pages:
    - id: 1
      name: section_requestor
      label: -- Requestor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department or Team
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: section_location
      label: -- Event Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: venue_room_number
      label: Venue or Room Number
      hint: e.g., Ballroom B, Conference Room 402
      type: text
      options: []
      required: true
    - id: 7
      name: event_start_time
      label: Event Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: setup_deadline
      label: Setup Completion Deadline
      hint: When should the tech be ready for testing?
      type: time
      options: []
      required: true
    - id: 9
      name: section_setup_needs
      label: -- Technical Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: setup_type
      label: Primary Type of Setup
      hint: null
      type: select_one
      options:
      - Standard Presentation (PPT/Video)
      - Panel Discussion (Multiple Mics)
      - Hybrid Meeting (Zoom/Teams setup)
      - Live Band or Performer
      - Background Music Only
      required: true
    - id: 11
      name: specialized_needs
      label: Specialized Technical Needs
      hint: Select all that apply
      type: select_multiple
      options:
      - Additional Power Strips
      - Hardwired Ethernet
      - Stage Lighting
      - Confidence Monitor
      - Recording of Session
      required: false
    - id: 12
      name: on_site_tech_needed
      label: Is an on-site technician needed during the event?
      hint: null
      type: select_one
      options:
      - Yes - Full Event
      - Yes - Setup and Launch only
      - No - I can operate it myself
      required: true
    - id: 13
      name: layout_instructions
      label: Specific Layout Instructions
      hint: Where should the speakers or podium be placed?
      type: text
      options: []
      required: false
    - id: 14
      name: furniture_needs
      label: Additional Furniture Needs
      hint: null
      type: select_multiple
      options:
      - Podium/Lectern
      - Table for AV Gear
      - Chairs for Panel (count in notes)
      - Pipe and Drape
      required: false
    - id: 15
      name: emergency_phone
      label: Emergency Contact Phone (for day-of event)
      hint: null
      type: text
      options: []
      required: true
