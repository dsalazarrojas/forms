      type: text
      options: []
      required: true
    - id: 12
      name: submitted_on
      label: Submitted On
      hint: null
      type: date
      options: []
      required: true
    - id: 13
      name: submitted_time
      label: Submitted Time
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: submitted_user
      label: Submitted User
      hint: null
