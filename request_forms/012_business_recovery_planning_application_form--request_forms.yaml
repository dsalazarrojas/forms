inputSchema:
  type: object
  properties:
    title: Business Recovery Planning Application Form
    pages:
    - id: 1
      name: business_name
      label: Business Name
      hint: Official name of your business
      type: text
      options: []
      required: true
    - id: 2
      name: business_registration_number
      label: Business Registration Number
      hint: Official registration or license number
      type: text
      options: []
      required: true
    - id: 3
      name: owner_name
      label: Owner or Principal Contact Name
      hint: Full name of business owner
      type: text
      options: []
      required: true
    - id: 4
      name: contact_email
      label: Contact Email
      hint: Primary email address
      type: email
      options: []
      required: true
    - id: 5
      name: contact_phone
      label: Contact Phone Number
      hint: Primary phone number
      type: text
      options: []
      required: true
    - id: 6
      name: business_address
      label: Business Address
      hint: Physical location of business
      type: text
      options: []
      required: true
    - id: 7
      name: business_type
      label: Type of Business
      hint: Industry or business sector
      type: text
      options: []
      required: true
    - id: 8
      name: years_in_operation
      label: Years in Operation
      hint: How long has the business operated
      type: number
      options: []
      required: true
    - id: 9
      name: employees_count
      label: Number of Employees
      hint: Total workforce size
      type: number
      options: []
      required: true
    - id: 10
      name: annual_revenue
      label: Annual Revenue
      hint: Approximate annual revenue
      type: number
      options: []
      required: false
    - id: 11
      name: disruption_impact
      label: Type of Disruption or Impact
      hint: What kind of disruption affected your business
      type: select_multiple
      options:
      - Natural Disaster
      - Economic Crisis
      - Supply Chain Disruption
      - Facility Damage
      - Loss of Key Personnel
      - Market Changes
      - Other
      required: true
    - id: 12
      name: impact_description
      label: Detailed Impact Description
      hint: Explain how your business was affected
      type: text
      options: []
      required: true
    - id: 13
      name: financial_impact
      label: Estimated Financial Impact
      hint: Estimated loss or damage in currency
      type: number
      options: []
      required: false
    - id: 14
      name: operational_impact
      label: Operational Impact
      hint: How has operations been affected
      type: text
      options: []
      required: true
    - id: 15
      name: recovery_needs
      label: Recovery Support Needs
      hint: What support do you need to recover
      type: select_multiple
      options:
      - Financial Assistance
      - Technical Support
      - Business Consulting
      - Infrastructure Help
      - Marketing Support
      - Workforce Training
      - Other
      required: true
    - id: 16
      name: recovery_timeline
      label: Desired Recovery Timeline
      hint: When do you need to be operational
      type: select_one
      options:
      - Immediate (1-2 weeks)
      - Short-term (1-3 months)
      - Medium-term (3-6 months)
      - Long-term (6-12 months)
      required: true
    - id: 17
      name: current_status
      label: Current Business Status
      hint: How is the business currently operating
      type: select_one
      options:
      - Fully Operational
      - Partially Operational
      - Suspended
      - Ceased Operations
      required: true
    - id: 18
      name: recovery_plan
      label: Existing Recovery Plan
      hint: Do you have a recovery plan in place
      type: select_one
      options:
      - Yes, Fully Developed
      - Yes, Partially Developed
      - No Plan
      - Needs Assistance
      required: true
    - id: 19
      name: insurance_coverage
      label: Insurance Coverage Status
      hint: Do you have business insurance
      type: select_one
      options:
      - Fully Covered
      - Partially Covered
      - No Coverage
      - Claim In Progress
      required: false
    - id: 20
      name: application_date
      label: Application Submission Date
      hint: Date of this application
      type: date
      options: []
      required: true
