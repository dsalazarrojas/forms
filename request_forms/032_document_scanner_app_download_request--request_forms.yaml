inputSchema:
  type: object
  properties:
    title: Document Scanner App Download Request
    pages:
    - id: 1
      name: request_form
      label: Request Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: version
      label: Version
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: operating_system
      label: Operating System
      hint: null
      type: select_one
      options:
      - Mac
      - Windows
      - Linux
      required: false
    - id: 6
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: confirm
      label: Confirm
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - IT
      - Support
      - Software Provider
      required: false
