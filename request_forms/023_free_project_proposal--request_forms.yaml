inputSchema:
  type: object
  properties:
    title: Free Project Proposal
    pages:
    - id: 1
      name: project_proposal
      label: Project Proposal
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: project_status
      label: Project Status
      hint: null
      type: select_one
      options:
      - In Progress
      - On Hold
      - Completed
      required: false
    - id: 3
      name: stakeholder_list
      label: Stakeholder List
      hint: null
      type: select_multiple
      options:
      - Stakeholder 1
      - Stakeholder 2
      - Stakeholder 3
      required: true
    - id: 4
      name: project_description
      label: Project Description
      hint: Describe the project in a few sentences
      type: text
      options: []
      required: false
    - id: 5
      name: project_start_date
      label: Project Start Date
      hint: Select start date of the project
      type: date
      options: []
      required: false
    - id: 6
      name: project_end_date
      label: Project End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: project_budget
      label: Project Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: project_lead
      label: Project Lead
      hint: null
      type: text
      options: []
      required: false
