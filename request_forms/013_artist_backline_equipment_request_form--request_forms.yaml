      - 'No'
      required: false
    - id: 10
      name: drum_details
      label: Drum Kit Specifications
      hint: Size, configuration, cymbals
      type: text
      options: []
      required: false
    - id: 11
      name: bass_amplifier
      label: Bass Amplifier Required
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 12
      name: bass_amp_details
      label: Bass Amp Specifications
      hint: Wattage, type, model
      type: text
      options: []
      required: false
    - id: 13
      name: guitar_amplifier
      label: Guitar Amplifier Required
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: guitar_amp_details
      label: Guitar Amp Specifications
      hint: Wattage, type, model
      type: text
      options: []
      required: false
    - id: 15
      name: keyboards_required
      label: Keyboard or Piano Required
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 16
      name: other_instruments
      label: Other Instruments Needed
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: stage_setup
      label: Stage Setup Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: technical_rider_attached
      label: Technical Rider Attached or Available
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 19
      name: power_requirements
      label: Special Power Requirements
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: additional_notes
      label: Additional Equipment Requests or Notes
      hint: null
      type: text
      options: []
      required: false
