inputSchema:
  type: object
  properties:
    title: Artist Backline Equipment Request Form
    pages:
    - id: 1
      name: artist_name
      label: Artist or Band Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_name
      label: Contact Person Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: performance_date
      label: Performance or Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: performance_time
      label: Performance Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: venue_name
      label: Venue Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: venue_capacity
      label: Venue Capacity or Stage Size
      hint: null
      type: text
      options: []
      required: false
