inputSchema:
  type: object
  properties:
    title: Cold Transport Validation Request Form
    pages:
    - id: 1
      name: requester_name
      label: Requester Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: requester_email
      label: Email Address
      hint: Work email
      type: email
      options: []
      required: true
    - id: 3
      name: requester_phone
      label: Phone Number
      hint: Direct contact number
      type: text
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: true
    - id: 5
      name: organization
      label: Organization Name
      hint: Company or institution
      type: text
      options: []
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: Date of submission
      type: date
      options: []
      required: true
    - id: 7
      name: shipment_type
      label: Type of Shipment
      hint: What is being transported
      type: select_one
      options:
      - Pharmaceuticals
      - Vaccines
      - Biological Samples
      - Blood Products
      - Clinical Trial Materials
      - Laboratory Reagents
      - Medical Devices
      - Fresh Food
      - Frozen Food
      - Chemicals
      - Other
      required: true
    - id: 8
      name: shipment_description
      label: Shipment Description
      hint: Detailed description of contents
      type: text
      options: []
      required: true
    - id: 9
      name: hazardous_materials
      label: Contains Hazardous Materials
      hint: Any dangerous goods
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: temperature_requirement
      label: Temperature Requirement
      hint: Required temperature range
      type: select_one
      options:
      - Frozen Below 0°F
      - Deep Freeze -10°F to 0°F
      - Frozen 0°F to 10°F
      - Refrigerated 32°F to 40°F
      - Cool 40°F to 50°F
      - Controlled 50°F to 60°F
      - Custom Range
      required: true
    - id: 11
      name: custom_temperature_range
      label: Custom Temperature Range
      hint: Specify exact range if custom
      type: text
      options: []
      required: false
    - id: 12
      name: temperature_tolerance
      label: Acceptable Temperature Tolerance
      hint: Allowable deviation in degrees
      type: text
      options: []
      required: true
    - id: 13
      name: shipment_weight
      label: Total Shipment Weight
      hint: In pounds or kilograms
      type: text
      options: []
      required: true
    - id: 14
      name: shipment_dimensions
      label: Shipment Dimensions
      hint: Length x Width x Height
      type: text
      options: []
      required: false
    - id: 15
      name: packaging_type
      label: Packaging Type
      hint: How is it packaged
      type: select_one
      options:
      - Insulated Shipper
      - Refrigerated Container
      - Cooler with Gel Packs
      - Dry Ice Container
      - Phase Change Material
      - Vacuum Insulated
      - Other
      required: true
    - id: 16
      name: origin_address
      label: Pickup Address
      hint: Complete pickup location
      type: text
      options: []
      required: true
    - id: 17
      name: origin_contact
      label: Pickup Contact Person
      hint: Name at pickup location
      type: text
      options: []
      required: true
    - id: 18
      name: origin_phone
      label: Pickup Contact Phone
      hint: Phone at pickup location
      type: text
      options: []
      required: true
    - id: 19
      name: destination_address
      label: Delivery Address
      hint: Complete delivery location
      type: text
      options: []
      required: true
    - id: 20
      name: destination_contact
      label: Delivery Contact Person
      hint: Name at delivery location
      type: text
      options: []
      required: true
    - id: 21
      name: destination_phone
      label: Delivery Contact Phone
      hint: Phone at delivery location
      type: text
      options: []
      required: true
    - id: 22
      name: requested_pickup_date
      label: Requested Pickup Date
      hint: When to collect shipment
      type: date
      options: []
      required: true
    - id: 23
      name: requested_pickup_time
      label: Requested Pickup Time
      hint: Preferred time window
      type: time
      options: []
      required: true
    - id: 24
      name: required_delivery_date
      label: Required Delivery Date
      hint: When must it arrive
      type: date
      options: []
      required: true
    - id: 25
      name: required_delivery_time
      label: Required Delivery Time
      hint: Time window for delivery
      type: time
      options: []
      required: true
    - id: 26
      name: transit_time_maximum
      label: Maximum Acceptable Transit Time
      hint: Longest acceptable duration
      type: select_one
      options:
      - Same Day
      - Overnight
      - 2 Days
      - 3 Days
      - 5 Days
      - No Limit
      required: true
    - id: 27
      name: monitoring_required
      label: Temperature Monitoring Required
      hint: During transit
      type: select_one
      options:
      - Real-Time GPS Tracking
      - Data Logger
      - Temperature Indicator
      - Not Required
      required: true
    - id: 28
      name: documentation_required
      label: Documentation Required
      hint: Select all that apply
      type: select_multiple
      options:
      - Chain of Custody Form
      - Temperature Log Report
      - Certificate of Analysis
      - Customs Documentation
      - Dangerous Goods Declaration
      - Import Permit
      - Export Permit
      - None
      required: true
    - id: 29
      name: special_handling
      label: Special Handling Instructions
      hint: Any special requirements
      type: text
      options: []
      required: false
    - id: 30
      name: insurance_value
      label: Shipment Insurance Value
      hint: Declared value for insurance
      type: text
      options: []
      required: true
    - id: 31
      name: signature_required
      label: Signature Required on Delivery
      hint: Who must sign
      type: select_one
      options:
      - Recipient Only
      - Authorized Representative
      - Any Adult
      - Not Required
      required: true
    - id: 32
      name: return_shipment
      label: Return Shipment Needed
      hint: Will items be returned
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: true
    - id: 33
      name: budget_code
      label: Budget or Cost Center Code
      hint: For billing
      type: text
      options: []
      required: false
    - id: 34
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
