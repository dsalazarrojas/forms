inputSchema:
  type: object
  properties:
    title: CNA Shift Restoration Request
    pages:
    - id: 1
      name: cna_name
      label: CNA Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: employee_id
      label: Employee ID
      hint: Staff ID number
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Work or personal email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 5
      name: facility_name
      label: Facility Name
      hint: Your workplace
      type: text
      options: []
      required: true
    - id: 6
      name: unit_department
      label: Unit or Department
      hint: Your assigned unit
      type: text
      options: []
      required: true
    - id: 7
      name: supervisor_name
      label: Supervisor Name
      hint: Your direct supervisor
      type: text
      options: []
      required: true
    - id: 8
      name: original_shift_date
      label: Original Shift Date
      hint: Date of the shift in question
      type: date
      options: []
      required: true
    - id: 9
      name: original_shift_time
      label: Original Shift Time
      hint: Scheduled shift hours
      type: text
      options: []
      required: true
    - id: 10
      name: restoration_type
      label: Type of Restoration Request
      hint: What are you requesting
      type: select_one
      options:
      - Shift Reinstatement
      - Hours Restoration
      - Pay Correction
      - Schedule Correction
      - Other
      required: true
    - id: 11
      name: reason_for_request
      label: Reason for Request
      hint: Why is restoration needed
      type: select_one
      options:
      - Scheduling Error
      - System Error
      - Emergency Coverage
      - Approved Leave Reversal
      - Administrative Error
      - Other
      required: true
    - id: 12
      name: detailed_explanation
      label: Detailed Explanation
      hint: Describe what happened
      type: text
      options: []
      required: true
    - id: 13
      name: supporting_documentation
      label: Supporting Documentation
      hint: List any attached documents
      type: text
      options: []
      required: false
    - id: 14
      name: witness_or_verifier
      label: Witness or Verifier
      hint: Who can verify your request
      type: text
      options: []
      required: false
    - id: 15
      name: previous_communication
      label: Previous Communication
      hint: Have you discussed this already
      type: select_one
      options:
      - Yes with supervisor
      - Yes with HR
      - Yes with scheduling
      - No this is first contact
      required: true
    - id: 16
      name: urgency_level
      label: Urgency Level
      hint: How urgent is this
      type: select_one
      options:
      - Critical - Payroll Affected
      - High - Schedule Impact
      - Medium - Planning Purpose
      - Low - For Records
      required: true
    - id: 17
      name: hours_in_question
      label: Number of Hours
      hint: Hours needing restoration
      type: number
      options: []
      required: true
    - id: 18
      name: pay_impact
      label: Pay Impact
      hint: Is there a pay implication
      type: select_one
      options:
      - Yes underpaid
      - Yes overpaid
      - No pay impact
      - Unsure
      required: true
    - id: 19
      name: preferred_resolution
      label: Preferred Resolution
      hint: What outcome do you want
      type: text
      options: []
      required: true
    - id: 20
      name: deadline_for_resolution
      label: Deadline for Resolution
      hint: When do you need this resolved
      type: date
      options: []
      required: false
    - id: 21
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
    - id: 22
      name: request_date
      label: Request Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 23
      name: employee_signature
      label: Employee Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
