inputSchema:
  type: object
  properties:
    title: Maintenance Philosophy Document Request Form
    pages:
    - id: 1
      name: purpose
      label: What is the purpose of the request?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Facilities
      - Operations
      - Other
      required: false
    - id: 3
      name: urgency
      label: What is the urgency of the request?
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 4
      name: format_preferred
      label: What format do you prefer?
      hint: null
      type: select_multiple
      options:
      - PDF
      - DOCX
      - CSV
      required: false
    - id: 5
      name: contact_name
      label: Contact name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: true
