inputSchema:
  type: object
  properties:
    title: Product Suggestion Request Form
    pages:
    - id: 1
      name: first_step
      label: What do you want?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_details
      label: Product Details
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: budget
      label: Budget
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: time_limit
      label: Time Limit
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: date_range
      label: Date Range
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: product_type
      label: Product Type
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: product_category
      label: Product Category
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: note
      label: Additional Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: submit
      label: Submit
      hint: null
      type: select_one
      options:
      - Submit
      - Cancel
      required: false
