inputSchema:
  type: object
  properties:
    title: Mortgage Deferral Request Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: reason_for_deferral
      label: Reason for Deferral
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: current_mortgage
      label: Current Mortgage
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 6
      name: deferral_date
      label: Deferral Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: amount_deferred
      label: Amount Deferrred
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: total_mortgage
      label: Total Mortgage
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
