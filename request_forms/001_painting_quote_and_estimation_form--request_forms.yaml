      name: customer_details
      label: Customer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_time
      label: Contact Time
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 3
      name: project_details
      label: Project Details
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: estimated_cost
      label: Estimated Cost
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - another tool
      required: true
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
