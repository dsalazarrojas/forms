inputSchema:
  type: object
  properties:
    title: Cash Advance Request Form
    pages:
    - id: 1
      name: employee_information_section
      label: -- Employee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: employee_department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: employee_position
      label: Job Position
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: manager_name
      label: Direct Manager Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: hire_date
      label: Date of Hire
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 8
      name: request_details_section
      label: -- Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: request_date
      label: Request Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 10
      name: advance_amount
      label: Amount Requested
      hint: Dollar amount
      type: number
      options: []
      required: true
    - id: 11
      name: reason_for_advance
      label: Reason for Advance Request
      hint: Explain why advance is needed
      type: text
      options: []
      required: true
    - id: 12
      name: reason_category
      label: Category of Request
      hint: null
      type: select_one
      options:
      - Emergency or Hardship
      - Medical Expense
      - Family Need
      - Travel or Relocation
      - Education or Training
      - Home Repair
      - Vehicle Repair
      - Debt Payment
      - Other
      required: true
    - id: 13
      name: advance_timeline_section
      label: -- Timeline and Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: needed_by_date
      label: Date Amount is Needed By
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 15
      name: repayment_method
      label: Proposed Repayment Method
      hint: null
      type: select_one
      options:
      - Single deduction from next paycheck
      - Deducted across multiple paychecks
      - Other arrangement
      required: true
    - id: 16
      name: repayment_duration
      label: Repayment Period (months)
      hint: How many months to repay
      type: number
      options: []
      required: true
    - id: 17
      name: current_salary_section
      label: -- Current Salary Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: current_salary
      label: Current Annual Salary
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: payroll_frequency
      label: Payroll Frequency
      hint: null
      type: select_one
      options:
      - Weekly
      - Bi-weekly
      - Monthly
      - Quarterly
      - Other
      required: true
    - id: 20
      name: previous_advances_section
      label: -- Previous Advance History --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: previous_advances
      label: Have you received previous advances?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 22
      name: previous_advance_details
      label: Details of Previous Advances
      hint: If yes, describe amounts and dates
      type: text
      options: []
      required: false
    - id: 23
      name: outstanding_balance
      label: Current Outstanding Balance on Previous Advances
      hint: If any
      type: number
      options: []
      required: false
    - id: 24
      name: authorization_section
      label: -- Authorization --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: employee_authorization
      label: I certify that the information above is accurate and true
      hint: null
      type: select_one
      options:
      - Yes, I confirm
      - No, cancel request
      required: true
