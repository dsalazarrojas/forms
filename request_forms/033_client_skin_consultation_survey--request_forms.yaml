inputSchema:
  type: object
  properties:
    title: Client Skin Consultation Survey
    pages:
    - id: 1
      name: intro_text
      label: -- Skin Consultation Intake Form --
      hint: Please complete this form so we can better understand your skin concerns
      type: note
      options: []
      required: false
    - id: 2
      name: client_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: client_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: client_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: age_range
      label: Age Range
      hint: null
      type: select_one
      options:
      - Under 20
      - 20-30
      - 30-40
      - 40-50
      - 50+
      required: true
    - id: 6
      name: skin_type
      label: Skin Type
      hint: null
      type: select_one
      options:
      - Dry
      - Oily
      - Combination
      - Normal
      - Sensitive
      - Unsure
      required: true
    - id: 7
      name: primary_concern
      label: Primary Skin Concern
      hint: What is your main skin concern?
      type: select_multiple
      options:
      - Acne
      - Wrinkles
      - Dark spots
      - Sensitivity
      - Dullness
      - Redness
      - Dryness
      - Oiliness
      - Other
      required: true
    - id: 8
      name: concern_duration
      label: How Long Have You Had This Concern?
      hint: null
      type: select_one
      options:
      - Less than 3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - 2+ years
      required: true
    - id: 9
      name: previous_treatments
      label: Previous Treatments or Products Tried
      hint: What have you already used for this concern?
      type: text
      options: []
      required: false
    - id: 10
      name: product_allergies
      label: Any Product Allergies or Sensitivities?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: current_skincare_routine
      label: Current Skincare Routine
      hint: Describe your current skincare products and steps
      type: text
      options: []
      required: false
    - id: 12
      name: sun_exposure
      label: Daily Sun Exposure Level
      hint: null
      type: select_one
      options:
      - Minimal
      - Moderate
      - High
      - Very high
      required: false
    - id: 13
      name: stress_level
      label: Current Stress Level
      hint: null
      type: select_one
      options:
      - Low
      - Moderate
      - High
      - Very high
      required: false
    - id: 14
      name: diet_habits
      label: Dietary Habits
      hint: Do you follow any specific diet?
      type: text
      options: []
      required: false
    - id: 15
      name: medications
      label: Current Medications or Supplements
      hint: Any medications that might affect your skin?
      type: text
      options: []
      required: false
    - id: 16
      name: skin_goals
      label: What Are Your Skin Goals?
      hint: What would you like to achieve with your skin?
      type: text
      options: []
      required: true
    - id: 17
      name: preferred_treatment_type
      label: Preferred Treatment Type
      hint: null
      type: select_one
      options:
      - Natural
      - Professional treatments
      - Skincare products
      - Mixed approach
      - Open to suggestions
      required: false
    - id: 18
      name: additional_info
      label: Additional Information
      hint: Anything else we should know?
      type: text
      options: []
      required: false
