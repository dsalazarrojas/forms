inputSchema:
  type: object
  properties:
    title: Animal Welfare Data Integration Request Form
    pages:
    - id: 1
      name: section_requester
      label: -- Requester Information --
      hint: Details about who is making the request
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: requester_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 4
      name: requester_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: requester_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 6
      name: section_organization
      label: -- Organization Information --
      hint: Details about requesting organization
      type: note
      options: []
      required: false
    - id: 7
      name: organization_name
      label: Organization Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 8
      name: organization_type
      label: Organization Type
      hint: What kind of organization
      type: select_one
      options:
      - Animal Shelter
      - Animal Rescue
      - Nonprofit
      - Research Institution
      - Government Agency
      - University
      - Private Company
      - Other
      required: true
    - id: 9
      name: organization_address
      label: Organization Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 10
      name: organization_website
      label: Organization Website
      hint: URL
      type: text
      options: []
      required: false
    - id: 11
      name: section_integration_needs
      label: -- Integration Needs --
      hint: What data integration you need
      type: note
      options: []
      required: false
    - id: 12
      name: integration_purpose
      label: Purpose of Integration
      hint: Why you need data integration
      type: select_one
      options:
      - Rescue Coordination
      - Data Analytics
      - Research
      - Public Health Monitoring
      - Network Building
      - Operational Efficiency
      - Other
      required: true
    - id: 13
      name: primary_goals
      label: Primary Goals
      hint: What you want to accomplish
      type: text
      options: []
      required: true
    - id: 14
      name: data_types_needed
      label: Data Types Needed
      hint: What specific data you need
      type: select_multiple
      options:
      - Animal Records
      - Medical History
      - Adoption Data
      - Transport Information
      - Population Statistics
      - Outcomes Data
      - Photo and Description
      - Contact Information
      required: true
    - id: 15
      name: data_sources
      label: Data Sources to Integrate
      hint: Where data will come from
      type: text
      options: []
      required: true
    - id: 16
      name: integration_frequency
      label: Data Integration Frequency
      hint: How often data should sync
      type: select_one
      options:
      - Real-time
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - One-time
      required: true
    - id: 17
      name: section_current_systems
      label: -- Current Systems --
      hint: Your current data systems
      type: note
      options: []
      required: false
    - id: 18
      name: current_software
      label: Current Software or Platform
      hint: What system you are using
      type: text
      options: []
      required: true
    - id: 19
      name: current_database
      label: Current Database Type
      hint: SQL, NoSQL, spreadsheet, etc
      type: select_one
      options:
      - SQL Database
      - NoSQL Database
      - Spreadsheets
      - Cloud-based System
      - Custom System
      - Other
      required: true
    - id: 20
      name: technical_capabilities
      label: Technical Capabilities
      hint: What your IT can support
      type: text
      options: []
      required: true
    - id: 21
      name: section_partners
      label: -- Integration Partners --
      hint: Who you want to integrate with
      type: note
      options: []
      required: false
    - id: 22
      name: partner_organizations
      label: Partner Organizations
      hint: Who you want to connect with
      type: text
      options: []
      required: true
    - id: 23
      name: established_partnerships
      label: Already Have Partnerships
      hint: Any existing data-sharing agreements
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 24
      name: partnership_details
      label: Partnership Details
      hint: Description of current partnerships
      type: text
      options: []
      required: false
    - id: 25
      name: section_timeline
      label: -- Timeline and Resources --
      hint: When and how to implement
      type: note
      options: []
      required: false
    - id: 26
      name: desired_start_date
      label: Desired Start Date
      hint: When you want to begin
      type: date
      options: []
      required: true
    - id: 27
      name: implementation_timeline
      label: Implementation Timeline
      hint: How long you expect it to take
      type: text
      options: []
      required: true
    - id: 28
      name: budget_available
      label: Budget Available for Integration
      hint: Resources for implementation
      type: number
      options: []
      required: false
    - id: 29
      name: technical_resources
      label: Technical Resources Available
      hint: Staff or contractors for project
      type: text
      options: []
      required: true
    - id: 30
      name: section_requirements
      label: -- Security and Compliance Requirements --
      hint: Data protection and compliance needs
      type: note
      options: []
      required: false
    - id: 31
      name: data_security_requirements
      label: Data Security Requirements
      hint: Encryption, access controls, etc
      type: text
      options: []
      required: true
    - id: 32
      name: privacy_compliance
      label: Privacy Compliance Needed
      hint: GDPR, HIPAA, CCPA, etc
      type: select_multiple
      options:
      - GDPR
      - HIPAA
      - CCPA
      - State Privacy Laws
      - Organization Privacy Policy
      - None
      required: true
    - id: 33
      name: data_ownership
      label: Data Ownership and Control
      hint: Who owns and controls the data
      type: text
      options: []
      required: true
    - id: 34
      name: access_controls
      label: Access Controls Needed
      hint: Who should access which data
      type: text
      options: []
      required: true
    - id: 35
      name: section_support
      label: -- Support and Maintenance --
      hint: Ongoing support needs
      type: note
      options: []
      required: false
    - id: 36
      name: technical_support_needed
      label: Technical Support Needed
      hint: Type of support required
      type: select_one
      options:
      - 24/7 Support
      - Business Hours Support
      - Email Support
      - Documentation Only
      - Minimal Support
      required: true
    - id: 37
      name: training_needed
      label: Staff Training Needed
      hint: Training requirements
      type: select_one
      options:
      - Yes - Full Training
      - Yes - Basic Training
      - Documentation Only
      - false
      required: true
    - id: 38
      name: maintenance_expectations
      label: Maintenance and Update Expectations
      hint: What you expect for upkeep
      type: text
      options: []
      required: false
    - id: 39
      name: additional_information
      label: Additional Information or Requirements
      hint: Anything else we should know
      type: text
      options: []
      required: false
