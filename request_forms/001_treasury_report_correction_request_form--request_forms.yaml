inputSchema:
  type: object
  properties:
    title: Treasury Report Correction Request Form
    pages:
    - id: 1
      name: issue
      label: What is the issue with the report?
      hint: Please describe the problem with the report.
      type: text
      options: []
      required: false
    - id: 2
      name: report_id
      label: Report ID
      hint: Please provide the original Report ID number.
      type: number
      options: []
      required: true
    - id: 3
      name: report_date
      label: Report Date
      hint: Please provide the original report date.
      type: date
      options: []
      required: false
    - id: 4
      name: report_time
      label: Report Time
      hint: Please provide the original report time.
      type: time
      options: []
      required: false
    - id: 5
      name: corrected_date
      label: Corrected Report Date
      hint: Please provide the corrected report date.
      type: date
      options: []
      required: false
    - id: 6
      name: corrected_time
      label: Corrected Report Time
      hint: Please provide the corrected report time.
      type: time
      options: []
      required: false
    - id: 7
      name: reason
      label: Reason for the correction
      hint: Please describe the reason for the correction.
      type: text
      options: []
      required: false
    - id: 8
      name: attachments
      label: Attachments
      hint: Attach any supporting documents.
      type: note
      options: []
      required: false
