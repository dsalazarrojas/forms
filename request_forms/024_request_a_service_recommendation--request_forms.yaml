inputSchema:
  type: object
  properties:
    title: Request A Service Recommendation
    pages:
    - id: 1
      name: user_input
      label: User Input
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Type 1
      - Type 2
      - Type 3
      required: true
    - id: 3
      name: service_name
      label: Service Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: service_priority
      label: Service Priority
      hint: null
      type: select_one
      options:
      - Low Priority
      - Medium Priority
      - High Priority
      required: true
    - id: 7
      name: service_location
      label: Service Location
      hint: null
      type: text
      options: []
      required: false
