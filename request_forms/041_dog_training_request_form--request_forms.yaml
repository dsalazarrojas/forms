inputSchema:
  type: object
  properties:
    title: Dog Training Request Form
    pages:
    - id: 1
      name: user_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: dog_breed
      label: Dog Breed
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: training_date
      label: Training Date
      hint: Select the date
      type: date
      options: []
      required: false
    - id: 4
      name: training_time
      label: Training Time
      hint: Select the time
      type: time
      options: []
      required: false
    - id: 5
      name: clinic_choice
      label: Choose Clinic
      hint: Select the clinic
      type: select_one
      options:
      - Clinic 1
      - Clinic 2
      - Clinic 3
      required: true
    - id: 6
      name: veterinarian_choice
      label: Choose Veterinarian
      hint: Select the veterinarian
      type: select_one
      options:
      - Veterinarian 1
      - Veterinarian 2
      - Veterinarian 3
      required: true
    - id: 7
      name: appointment_duration
      label: Appointment Duration
      hint: null
      type: select_multiple
      options:
      - Half an hour
      - One hour
      - Two hours
      required: true
    - id: 8
      name: dog_size
      label: Dog Size
      hint: Select the size of the dog
      type: select_one
      options:
      - Small
      - Medium
      - Large
      required: true
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
