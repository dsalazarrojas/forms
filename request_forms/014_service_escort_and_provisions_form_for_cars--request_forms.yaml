      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: escort_details
      label: Escort Details
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: provisions_details
      label: Provisions Details
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: additional_comments
