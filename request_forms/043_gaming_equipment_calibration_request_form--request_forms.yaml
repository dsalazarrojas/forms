inputSchema:
  type: object
  properties:
    title: Gaming Equipment Calibration Request Form
    pages:
    - id: 1
      name: game_id
      label: Game Id
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: equipment_type
      label: Equipment Type
      hint: null
      type: select_one
      options:
      - Equipment Type 1
      - Equipment Type 2
      - Equipment Type 3
      required: false
    - id: 4
      name: serial_number
      label: Serial Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: issue_description
      label: Issue Description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: equipment_condition
      label: Equipment Condition
      hint: null
      type: select_one
      options:
      - Good
      - Fair
      - Poor
      required: false
    - id: 9
      name: calibration_status
      label: Calibration Status
      hint: null
      type: select_multiple
      options:
      - Completed
      - In Progress
      - Not Started
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
