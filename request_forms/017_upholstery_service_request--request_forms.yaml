inputSchema:
  type: object
  properties:
    title: Upholstery Service Request
    pages:
    - id: 1
      name: form_start
      label: Start
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email
      hint: 'Format: contact-email@example.com'
      type: email
      options: []
      required: false
    - id: 4
      name: service_request
      label: Service Request
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: furniture_description
      label: Furniture Description
      hint: Provide details about the furniture and any specific requests you have
        for repair.
      type: text
      options: []
      required: false
    - id: 6
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Reupholstery Repair
      - Serging/Re-stretching
      - Cushion Replacement
      - Re-Trimming
      - Other
      required: true
    - id: 7
      name: follow_up_needed
      label: Follow-up Needed
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: service_scheduled
      label: Service Scheduled
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: service_completed
      label: Service Completed
      hint: null
      type: date
      options: []
      required: false
    - id: 13
      name: follow_up_date
      label: Follow-up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: assigned_tool
      label: Assigned To
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
    - id: 16
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Open
      - In Progress
      - Completed
      required: true
    - id: 17
      name: follow_up_status
      label: Follow-up Status
      hint: null
      type: select_one
      options:
      - None
      - Follow-up Sent
      - Follow-up Completed
      required: false
    - id: 18
      name: follow_up_message
      label: Follow-up Message
      hint: Message to send to the customer
      type: text
      options: []
      required: false
    - id: 19
      name: follow_up_date
      label: Follow-up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 20
      name: follow_up_time
      label: Follow-up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 21
      name: next_follow_up_date
      label: Next Follow-up Date
      hint: null
      type: date
      options: []
      required: false
    - id: 22
      name: next_follow_up_time
      label: Next Follow-up Time
      hint: null
      type: time
      options: []
      required: false
    - id: 23
      name: customer_address
      label: Customer Address
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: customer_notes
      label: Customer Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: form_end
      label: End
      hint: null
      type: text
      options: []
      required: false
