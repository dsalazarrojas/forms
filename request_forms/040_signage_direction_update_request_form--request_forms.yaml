inputSchema:
  type: object
  properties:
    title: Signage Direction Update Request Form
    pages:
    - id: 1
      name: request_details
      label: Request Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: signage_location
      label: Signage Location
      hint: The location of the signage to be updated.
      type: text
      options: []
      required: true
    - id: 3
      name: signage_photo
      label: Signage Photo
      hint: An optional photo of the signage to be updated.
      type: number
      options: []
      required: false
    - id: 4
      name: direction
      label: Direction
      hint: None
      type: select_multiple
      options:
      - North
      - South
      - East
      - West
      required: true
    - id: 5
      name: urgency
      label: Urgency
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 6
      name: update_details
      label: Update Details
      hint: None
      type: text
      options: []
      required: true
    - id: 7
      name: comments
      label: Comments
      hint: Additional comments.
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_user
      label: Assigned User
      hint: None
      type: select_one
      options:
      - chatjimmy
      - user2
      - user3
      required: true
