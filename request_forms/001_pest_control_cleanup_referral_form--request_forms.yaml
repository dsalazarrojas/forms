inputSchema:
  type: object
  properties:
    title: Pest Control Cleanup Referral Form
    pages:
    - id: 1
      name: pest_control_service_type
      label: What type of pest control service do you need?
      hint: Please select the type of service
      type: select_one
      options:
      - Extermination
      - Prevention
      - Inspection
      required: true
    - id: 2
      name: pest_control_services
      label: Which of the following pest control services do you need?
      hint: Select all that apply
      type: select_multiple
      options:
      - Rodent control
      - Insect control
      required: true
    - id: 3
      name: service_address
      label: Service Address
      hint: Enter the service address
      type: text
      options: []
      required: true
    - id: 4
      name: pest_control_cleanup_date
      label: Date
      hint: Enter the date of the desired pest control service
      type: date
      options: []
      required: true
    - id: 5
      name: pest_control_cleanup_time
      label: Time
      hint: Enter the time of the desired pest control service
      type: time
      options: []
      required: true
    - id: 6
      name: is_urgent
      label: Is this an urgent request?
      hint: Yes/No
      type: radio
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: contact_phone
      label: Service Contact Number
      hint: Enter the contact number
      type: text
      options: []
      required: true
    - id: 8
      name: contact_email
      label: Service Contact Email
      hint: Enter the contact email
      type: text
      options: []
      required: true
    - id: 9
      name: note
      label: Additional notes
      hint: Enter any additional comments or notes
      type: note
      options: []
      required: false
    - id: 10
      name: pest_control_service_team
      label: Pest Control Services
      hint: Select the service team
      type: select_multiple
      options:
      - Team 1
      - Team 2
      - Team 3
      required: false
    - id: 11
      name: pest_control_cleanup_referral
      label: Pest Control Referral
      hint: Enter the referral information
      type: text
      options: []
      required: false
