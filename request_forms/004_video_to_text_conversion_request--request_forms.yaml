inputSchema:
  type: object
  properties:
    title: video_to_text_conversion_request
    pages:
    - id: 1
      name: upload_video
      label: Upload Video
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: language
      label: Language
      hint: null
      type: select_one
      options:
      - en
      - es
      - fr
      - zh
      required: false
    - id: 3
      name: audio_output
      label: Audio Output
      hint: null
      type: select_multiple
      options:
      - mp3
      - wav
      required: false
    - id: 4
      name: video_file
      label: Video File
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: file_format
      label: File Format
      hint: null
      type: select_multiple
      options:
      - 4K
      - 8K
      - 1080p
      - 1080i
      - 2K
      - 6K
      required: false
    - id: 6
      name: transcription_speed
      label: Transcription Speed
      hint: null
      type: select_one
      options:
      - normal
      - fast
      - priority
      required: false
    - id: 7
      name: email_to
      label: Email To
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: file_size
      label: File Size
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
