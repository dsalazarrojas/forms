inputSchema:
  type: object
  properties:
    title: Sea Access Request Form
    pages:
    - id: 1
      name: user_name
      label: userName
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: userEmail
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 3
      name: user_phone
      label: userPhone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: request_type
      label: Request Type
      hint: null
      type: select_one
      options:
      - New Request
      - Renewal Request
      - Cancellation Request
      required: true
    - id: 5
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: vessel_type
      label: Vessel Type
      hint: null
      type: select_multiple
      options:
      - Small Boat
      - Large Boat
      - JetSki
      - Vessel with a trailer
      required: false
    - id: 8
      name: boat_length
      label: Boat Length
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: request_details
      label: Request Details
      hint: null
      type: note
      options: []
      required: false
