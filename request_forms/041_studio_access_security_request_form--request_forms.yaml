inputSchema:
  type: object
  properties:
    title: Studio Access Security Request Form
    pages:
    - id: 1
      name: request_information
      label: Request Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Full Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Marketing
      - Development
      - Design
      - Administration
      - Operations
      required: true
    - id: 5
      name: date_of_visit
      label: Date of Visit
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_of_visit
      label: Time of Visit
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: reason_for_visit
      label: Reason for Visit
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: studio_details
      label: Studio Details
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: requested_by
      label: Requested By
      hint: null
      type: text
      options: []
      required: false
