inputSchema:
  type: object
  properties:
    title: Concierge Request Form
    pages:
    - id: 1
      name: request_overview
      label: Concierge Request Overview
      hint: Submit your personalized service request
      type: note
      options: []
      required: false
    - id: 2
      name: request_type
      label: Request Type
      hint: Category of service needed
      type: select_one
      options:
      - Restaurant Reservations
      - Transportation Services
      - Event Tickets
      - Tour Booking
      - Shopping Assistance
      - Personal Services
      - Business Services
      - Other
      required: true
    - id: 3
      name: request_date
      label: Request Date
      hint: When you need this service
      type: date
      options: []
      required: true
    - id: 4
      name: request_time
      label: Request Time
      hint: Preferred time
      type: time
      options: []
      required: false
    - id: 5
      name: urgency_level
      label: Urgency Level
      hint: How urgent is this request
      type: select_one
      options:
      - Low No Rush
      - Medium Within 24 Hours
      - High Same Day
      - Urgent Immediate
      required: true
    - id: 6
      name: guest_information
      label: Guest Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 7
      name: guest_name
      label: Guest Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 8
      name: room_number
      label: Room Number
      hint: Hotel room if applicable
      type: text
      options: []
      required: false
    - id: 9
      name: guest_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 10
      name: guest_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 11
      name: stay_dates
      label: Stay Dates
      hint: Check-in and check-out
      type: text
      options: []
      required: false
    - id: 12
      name: service_details
      label: Service Details
      hint: Specific requirements
      type: note
      options: []
      required: false
    - id: 13
      name: number_of_guests
      label: Number of Guests
      hint: How many people
      type: number
      options: []
      required: false
    - id: 14
      name: preferred_vendor
      label: Preferred Vendor
      hint: Any specific company requested
      type: text
      options: []
      required: false
    - id: 15
      name: budget_range
      label: Budget Range
      hint: Estimated budget
      type: select_one
      options:
      - Budget Friendly
      - Moderate
      - Premium
      - No Limit
      required: false
    - id: 16
      name: special_requests
      label: Special Requests
      hint: Any specific preferences
      type: text
      options: []
      required: false
    - id: 17
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: For restaurant bookings
      type: text
      options: []
      required: false
    - id: 18
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any mobility requirements
      type: text
      options: []
      required: false
    - id: 19
      name: additional_services
      label: Additional Services
      hint: Related services needed
      type: select_multiple
      options:
      - Airport Transfer
      - Limousine Service
      - Private Driver
      - Tour Guide
      - Translation Services
      - Childcare Services
      - Pet Services
      required: false
    - id: 20
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Room Charge
      - Credit Card
      - Cash
      - Corporate Account
      required: false
    - id: 21
      name: confirmation_preference
      label: Confirmation Preference
      hint: How to receive confirmation
      type: select_one
      options:
      - Email
      - Phone Call
      - Text Message
      - In Person
      required: true
    - id: 22
      name: previous_requests
      label: Previous Similar Requests
      hint: Have you used this service before
      type: select_one
      options:
      - Yes Same Service
      - Yes Different Service
      - No First Time
      required: false
    - id: 23
      name: referral_source
      label: How Did You Hear About Us
      hint: Source of information
      type: select_one
      options:
      - Hotel Staff
      - Website
      - Friend or Family
      - Travel Agent
      - Previous Stay
      required: false
    - id: 24
      name: feedback_consent
      label: Feedback Consent
      hint: May we follow up for feedback
      type: select_one
      options:
      - Yes Contact Me
      - No Thanks
      required: false
    - id: 25
      name: terms_agreement
      label: Terms Agreement
      hint: Accept concierge terms
      type: select_one
      options:
      - I Accept Terms
      - I Do Not Accept
      required: true
