inputSchema:
  type: object
  properties:
    title: Access Control System Issue Request Form
    pages:
    - id: 1
      name: section_reporter
      label: -- Reporter Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Full Name
      hint: Person reporting the issue
      type: text
      options: []
      required: true
    - id: 3
      name: employee_email
      label: Work Email
      hint: For status updates
      type: email
      options: []
      required: true
    - id: 4
      name: department
      label: Department
      hint: your primary work group
      type: text
      options: []
      required: true
    - id: 5
      name: section_issue
      label: -- Issue Description --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: issue_category
      label: Category of Issue
      hint: Select the primary fault
      type: select_one
      options:
      - Badge or Card Not Working
      - Door Not Opening
      - Door Not Locking
      - System Software Error
      - Intercom Fault
      required: true
    - id: 7
      name: location_of_issue
      label: Specific Door or Access Point Location
      hint: e.g. North Wing - Floor 2 - Lab Entrance
      type: text
      options: []
      required: true
    - id: 8
      name: badge_number
      label: Your Badge Number - if applicable
      hint: Found on the back of the card
      type: text
      options: []
      required: false
    - id: 9
      name: error_message
      label: Describe any error messages or light colors observed
      hint: e.g. flashing red, access denied
      type: text
      options: []
      required: false
    - id: 10
      name: section_severity
      label: -- Severity and Impact --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: priority_level
      label: Priority Level
      hint: Urgency of resolution
      type: select_one
      options:
      - Low - Minor Inconvenience
      - Medium - Impacting Operations
      - High - Security Risk
      required: true
    - id: 12
      name: recurring_issue
      label: Have you experienced this issue before?
      hint: Previous history
      type: select_one
      options:
      - "Yes"
      - "No"
      required: true
    - id: 13
      name: section_attachments
      label: -- Attachments --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: photo_provided
      label: Will you provide a photo of the fault?
      hint: Visual evidence
      type: select_one
      options:
      - Yes - Emailing separately
      - "No"
      required: false
    - id: 15
      name: section_resolution
      label: -- Request Resolution --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: preferred_resolution_time
      label: When is the best time for a technician to visit?
      hint: Availability for repair
      type: text
      options: []
      required: false
    - id: 17
      name: notification_request
      label: Notify me when this is resolved?
      hint: Automated update
      type: select_one
      options:
      - "Yes"
      - "No"
      required: true
