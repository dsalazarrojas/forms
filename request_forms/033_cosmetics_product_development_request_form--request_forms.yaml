inputSchema:
  type: object
  properties:
    title: Cosmetics Product Development Request Form
    pages:
    - id: 1
      name: product_name
      label: Product Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: product_category
      label: Product Category
      hint: null
      type: select_one
      options:
      - skin care
      - hair care
      - make up
      - fragrance
      - personal care
      - other
      required: false
    - id: 3
      name: product_description
      label: Product Description
      hint: Brief description of the product
      type: text
      options: []
      required: false
    - id: 4
      name: product_image
      label: Product Image
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: product_image_alt
      label: Product Image Alt
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: product_price
      label: Product Price
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: product_color
      label: Product Color
      hint: null
      type: select_multiple
      options:
      - red
      - blue
      - black
      - green
      required: false
    - id: 8
      name: product_size
      label: Product Size
      hint: null
      type: select_one
      options:
      - small
      - medium
      - large
      - extra large
      required: false
    - id: 9
      name: product_weight
      label: Product Weight
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: product_packaging
      label: Product Packaging
      hint: null
      type: select_one
      options:
      - tube
      - bottle
      - jar
      - bag
      - box
      - other
      required: true
    - id: 11
      name: product_launch_date
      label: Product Launch Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: company_address
      label: Company Address
      hint: null
      type: text
      options: []
      required: false
