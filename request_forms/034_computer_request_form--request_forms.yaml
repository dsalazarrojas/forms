inputSchema:
  type: object
  properties:
    title: Computer Request Form
    pages:
    - id: 1
      name: section_request_details
      label: -- Request Details --
      hint: Request laptops, tablets, or other hardware
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Full name of requester
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Requesting department
      type: text
      options: []
      required: true
    - id: 4
      name: device_requested
      label: Device requested
      hint: Laptop, Tablet, Desktop, Other
      type: select_one
      options:
      - Laptop
      - Tablet
      - Desktop
      - Other
      required: true
    - id: 5
      name: purpose
      label: Purpose
      hint: Reason for the request
      type: text
      options: []
      required: true
    - id: 6
      name: duration_needed
      label: Duration needed
      hint: Permanent, Temporary with end date
      type: text
      options: []
      required: false
    - id: 7
      name: preferred_specifications
      label: Preferred specifications
      hint: CPU, RAM, storage preferences
      type: text
      options: []
      required: false
    - id: 8
      name: approval_needed
      label: Approval needed
      hint: Manager or procurement approval status
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: additional_notes
      label: Additional notes
      hint: Any additional context
      type: text
      options: []
      required: false
