inputSchema:
  type: object
  properties:
    title: Academic Research Visualization Request Form
    pages:
    - id: 1
      name: section_project_overview
      label: -- Project Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: project_title
      label: Title of the Research Project
      hint: Full name of the study
      type: text
      options: []
      required: true
    - id: 3
      name: principal_investigator
      label: Name of Principal Investigator
      hint: Lead researcher for the project
      type: text
      options: []
      required: true
    - id: 4
      name: pi_email
      label: PI Contact Email
      hint: Official institutional email
      type: email
      options: []
      required: true
    - id: 5
      name: section_viz_reqs
      label: -- Visualization Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: visualization_type
      label: What type of visualization do you need?
      hint: Choose the most appropriate format
      type: select_one
      options:
      - Static Charts or Graphs
      - Interactive Dashboard
      - 3D Models
      - Infographics
      - Geographic Maps
      required: true
    - id: 7
      name: data_description
      label: Briefly describe the dataset to be visualized
      hint: include number of variables and observations
      type: text
      options: []
      required: true
    - id: 8
      name: data_format
      label: Current format of your data
      hint: How will data be provided?
      type: select_one
      options:
      - CSV or Excel
      - JSON
      - SQL Database
      - Raw Text
      - SPSS or Stata
      required: true
    - id: 9
      name: target_audience
      label: Who is the intended audience?
      hint: Select all that apply
      type: select_multiple
      options:
      - Peer Researchers
      - General Public
      - Students
      - Policy Makers
      - Funding Agencies
      required: true
    - id: 10
      name: section_logistics
      label: -- Project Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: preferred_deadline
      label: Desired completion date
      hint: Requested turnaround time
      type: date
      options: []
      required: true
    - id: 12
      name: priority_level
      label: Urgency of the request
      hint: Importance of the timeline
      type: select_one
      options:
      - Low
      - Medium
      - High
      - Critical
      required: true
    - id: 13
      name: publication_ready
      label: Does the visualization need to be publication-ready?
      hint: Requires high resolution and specific formatting
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: color_branding_notes
      label: Specific color or branding requirements
      hint: e.g. institutional color codes
      type: text
      options: []
      required: false
    - id: 15
      name: section_files
      label: -- File Sharing --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: data_link
      label: Link to data repository if applicable
      hint: URL to Dropbox, Drive, or GitHub
      type: text
      options: []
      required: false
