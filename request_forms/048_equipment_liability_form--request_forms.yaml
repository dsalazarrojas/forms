inputSchema:
  type: object
  properties:
    title: Equipment Liability Form
    pages:
    - id: 1
      name: owner_info
      label: Owner Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: equipment_description
      label: Equipment Description
      hint: null
      type: text
      options: []
      required: true
