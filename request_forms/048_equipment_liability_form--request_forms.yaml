      options:
      - Good
      - Fair
      - Poor
      - Unknown
      required: true
    - id: 4
      name: equipment_serial_number
      label: Equipment Serial Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: user_email
      label: User Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: user_phone
      label: User Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: date_purchased
      label: Date Purchased
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: purchase_price
      label: Purchase Price
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: vendor_info
      label: Vendor Information
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: remarks
      label: Remarks
      hint: null
      type: note
      options: []
      required: false
