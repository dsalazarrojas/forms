inputSchema:
  type: object
  properties:
    title: Online Student Major Change Form
    pages:
    - id: 1
      name: student_major_request
      label: Student Major Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: previous_major
      label: Previous Major
      hint: If you are changing to a new major, please select the major you were previously
        in.
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 3
      name: reason_for_change
      label: Reason for Change
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: new_major
      label: New Major
      hint: Please select the new major you wish to enroll in.
      type: select_multiple
      options:
      - '1'
      - '2'
      - '3'
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: signature
      label: Signature
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: date_of_submission
      label: Date of Submission
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: time_of_submission
      label: Time of Submission
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: submitted_by
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: submitted_on
      label: Submitted On
      hint: null
      type: date
      options: []
      required: false
    - id: 14
      name: updated_by
      label: Updated By
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: updated_on
      label: Updated On
      hint: null
      type: date
      options: []
      required: false
    - id: 16
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Open
      - In Progress
      - Closed
      required: false
    - id: 17
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: submitted_to
      label: Submitted to
      hint: null
      type: text
      options: []
      required: false
