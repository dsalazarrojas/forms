      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: true
    - id: 2
      name: start_time
      label: start_time
      hint: "HH:MM AM/PM"
      type: time
      options: []
      required: true
    - id: 3
      name: end_time
      label: end_time
      hint: "HH:MM AM/PM"
      type: time
      options: []
      required: true
    - id: 4
      name: meeting_duration
      label: meeting_duration
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: meeting_location
      label: meeting_location
      hint: null
      type: select_multiple
      options:
      - Room 101
      - Room 202
      - Room 301
      - Room 401
      required: true
    - id: 6
      name: meeting_date
      label: meeting_date
      hint: MM/dd/yyyy
      type: date
      options: []
      required: true
    - id: 7
      name: meeting_time
      label: meeting_time
      hint: MM/dd/yyyy
      type: date
      options: []
      required: true
    - id: 8
      name: meeting_note
      label: meeting_note
      hint: Meeting notes
      type: note
      options: []
