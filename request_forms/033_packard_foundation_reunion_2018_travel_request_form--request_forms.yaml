inputSchema:
  type: object
  properties:
    title: Packard Foundation Reunion 2018 Travel Request Form
    pages:
    - id: 1
      name: traveling
      label: Are you traveling for this event?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: events_attending
      label: Are you attending this event?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: submitting_request
      label: Have you submitted a request?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: travel_purpose
      label: Travel purpose
      hint: null
      type: select_one
      options:
      - Personal
      - Business
      required: true
    - id: 5
      name: travel_arrangement
      label: How are you planning to travel?
      hint: null
      type: select_one
      options:
      - By plane
      - By car
      - Other
      required: true
    - id: 6
      name: travel_info
      label: Travel information
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: form_submission
      label: Form submission
      hint: null
      type: select_one
      options:
      - Submit
      - Not submit
      required: true
    - id: 8
      name: contact_info
      label: Contact information
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: travel_details
      label: Additional travel details
      hint: null
      type: text
      options: []
      required: true
