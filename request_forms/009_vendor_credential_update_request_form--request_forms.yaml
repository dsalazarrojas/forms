      name: vendor_credential_update_request_form
      label: Vendor Credential Update Request Form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: request_type
      label: Request Type
      hint: null
      type: select_one
      options:
      - '{''label'': ''Initial Request'', ''value'': ''initial_request''}'
      - '{''label'': ''Update Request'', ''value'': ''update_request''}'
      required: false
    - id: 3
      name: reason_for_request
      label: Reason For Request
      hint: null
      type: select_multiple
      options:
      - '{''label'': ''Lost or Stolen Certificate'', ''value'': ''lost_or_stolen_certificate''}'
      - '{''label'': ''Expired Certificate'', ''value'': ''expired_certificate''}'
      - '{''label'': ''Other'', ''value'': ''other''}'
      - '{''label'': ''Duplicate or Incorrect Information'', ''value'': ''duplicate_or_incorrect_information''}'
      required: false
    - id: 4
      name: supporting_documentation
      label: Supporting Documentation
      hint: Attach relevant supporting documentation
      type: note
      options: []
      required: false
    - id: 5
      name: vendor_name
      label: Vendor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: vendor_contact_info
      label: Vendor Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: vendor_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: vendor_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: vendor_address
      label: Address
      hint: null
      type: text
      options: []
      required: false
