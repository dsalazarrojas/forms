      name: project_description
      label: Project Description
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: requested_promotions
      label: Requested Promotions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: promotion_type
      label: Promotion Type
      hint: null
      type: select_one
      options:
      - banner ad
      - landing page
      - email
      - graphics for social
      required: false
    - id: 4
      name: file_upload
      label: File Upload
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: first_round_due_date
      label: First Round Due Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: delivery_date
      label: Delivery Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
