inputSchema:
  type: object
  properties:
    title: Commercial Space Optimization Registration Form
    pages:
    - id: 1
      name: organization_information
      label: Organization Information
      hint: Details about your organization
      type: note
      options: []
      required: false
    - id: 2
      name: organization_name
      label: Organization Name
      hint: Full legal name of your organization
      type: text
      options: []
      required: true
    - id: 3
      name: organization_type
      label: Organization Type
      hint: Type of organization
      type: select_one
      options:
      - Corporation
      - Small Business
      - Non-Profit
      - Government Agency
      - Educational Institution
      - Healthcare Facility
      - Retail Business
      required: true
    - id: 4
      name: industry
      label: Industry
      hint: Primary industry sector
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Manufacturing
      - Retail
      - Hospitality
      - Education
      - Government
      - Other
      required: true
    - id: 5
      name: employee_count
      label: Employee Count
      hint: Total number of employees
      type: select_one
      options:
      - 1-10
      - 11-50
      - 51-200
      - 201-500
      - 501-1000
      - 1000+
      required: true
    - id: 6
      name: contact_name
      label: Contact Name
      hint: Full name of primary contact
      type: text
      options: []
      required: true
    - id: 7
      name: contact_title
      label: Contact Title
      hint: Job title or position
      type: text
      options: []
      required: true
    - id: 8
      name: contact_email
      label: Contact Email
      hint: Email address for communications
      type: email
      options: []
      required: true
    - id: 9
      name: contact_phone
      label: Contact Phone
      hint: Direct phone number
      type: text
      options: []
      required: true
    - id: 10
      name: space_details
      label: Space Details
      hint: Information about your commercial space
      type: note
      options: []
      required: false
    - id: 11
      name: facility_type
      label: Facility Type
      hint: Type of commercial facility
      type: select_one
      options:
      - Office Building
      - Warehouse/Distribution
      - Retail Store
      - Manufacturing Plant
      - Mixed-Use
      - Medical Facility
      - Restaurant
      required: true
    - id: 12
      name: total_square_footage
      label: Total Square Footage
      hint: Total area of the space
      type: number
      options: []
      required: true
    - id: 13
      name: number_of_floors
      label: Number of Floors
      hint: How many floors does the space have
      type: number
      options: []
      required: false
    - id: 14
      name: current_occupancy
      label: Current Occupancy
      hint: Current occupancy rate percentage
      type: number
      options: []
      required: false
    - id: 15
      name: optimization_challenges
      label: Optimization Challenges
      hint: What challenges are you facing
      type: select_multiple
      options:
      - Inefficient Layout
      - Storage Issues
      - Poor Traffic Flow
      - Underutilized Space
      - Accessibility Concerns
      - Safety Compliance
      - Energy Efficiency
      - Aesthetic Updates
      required: true
    - id: 16
      name: primary_goals
      label: Primary Goals
      hint: What are your main objectives
      type: select_multiple
      options:
      - Increase Capacity
      - Improve Workflow
      - Reduce Costs
      - Enhance Safety
      - Modernize Design
      - Improve Accessibility
      - Sustainability Goals
      required: true
    - id: 17
      name: budget_range
      label: Budget Range
      hint: Estimated budget for optimization
      type: select_one
      options:
      - Under $10,000
      - $10,000 - $25,000
      - $25,000 - $50,000
      - $50,000 - $100,000
      - $100,000 - $250,000
      - Over $250,000
      required: true
    - id: 18
      name: timeline_preference
      label: Timeline Preference
      hint: When would you like to start
      type: select_one
      options:
      - Immediately
      - Within 1 month
      - 1-3 months
      - 3-6 months
      - Flexible
      required: true
    - id: 19
      name: additional_requirements
      label: Additional Requirements
      hint: Any special requirements or considerations
      type: text
      options: []
      required: false
    - id: 20
      name: preferred_consultation_date
      label: Preferred Consultation Date
      hint: Preferred date for initial consultation
      type: date
      options: []
      required: false
