inputSchema:
  type: object
  properties:
    title: Service Ticket And Part Request Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: customer_email
      label: Customer Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: customer_phone
      label: Customer Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: ticket_type
      label: Ticket Type
      hint: null
      type: select_one
      options:
      - Repair
      - Replacement
      - Other
      required: false
    - id: 5
      name: service_type
      label: Service Type
      hint: null
      type: select_multiple
      options:
      - Service 1
      - Service 2
      - Service 3
      required: false
    - id: 6
      name: part_details
      label: Part Details
      hint: null
      type: note
      options: []
      required: false
