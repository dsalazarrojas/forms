    - id: 4
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - '{''value'': ''High'', ''label'': ''High''}'
      - '{''value'': ''Medium'', ''label'': ''Medium''}'
      - '{''value'': ''Low'', ''label'': ''Low''}'
      required: true
    - id: 5
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: requestor
      label: Requestor
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: date_submitted
      label: Date Submitted
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
