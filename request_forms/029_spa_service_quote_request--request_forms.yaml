inputSchema:
  type: object
  properties:
    title: Spa Service Quote Request
    pages:
    - id: 1
      name: service_interests
      label: Service Interests
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: visit_details
      label: Visit Details
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: visit_date
      label: Visit Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: visit_time
      label: Visit Time
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: service_type
      label: Service Type
      hint: null
      type: select_one
      options:
      - Facial
      - Massage
      - Other
      required: true
    - id: 9
      name: services
      label: Services
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: spa_location
      label: Spa Location
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
