inputSchema:
  type: object
  properties:
    title: CSV Importer Form
    pages:
    - id: 1
      name: requester_name
      label: Requester name
      hint: Person requesting import
      type: text
      options: []
      required: true
    - id: 2
      name: requester_email
      label: Requester email
      hint: For status updates
      type: email
      options: []
      required: true
    - id: 3
      name: system_target
      label: Target system for import
      hint: e g CRM database or reporting system
      type: text
      options: []
      required: true
    - id: 4
      name: data_description
      label: Description of data to import
      hint: Columns and expected formats
      type: text
      options: []
      required: true
    - id: 5
      name: sample_file_link
      label: Sample file link
      hint: Provide a link to sample CSV
      type: text
      options: []
      required: false
    - id: 6
      name: row_count_estimate
      label: Estimated number of rows
      hint: Helps plan import processing
      type: number
      options: []
      required: true
    - id: 7
      name: priority
      label: Request priority
      hint: Business impact for scheduling
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: true
    - id: 8
      name: additional_notes
      label: Additional notes
      hint: Any other information for import team
      type: text
      options: []
      required: false
