inputSchema:
  type: object
  properties:
    title: Rehydration Request Form
    pages:
    - id: 1
      name: patient_info
      label: patient_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: rehydration_type
      label: rehydration_type
      hint: null
      type: select_one
      options:
      - IV
      - Blood transfusion
      required: false
    - id: 3
      name: preferred_date
      label: preferred_date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: preferred_time
      label: preferred_time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: preferred_location
      label: preferred_location
      hint: null
      type: select_multiple
      options:
      - Clinic
      - Wellness Center
      - Mobile IV Service
      required: false
    - id: 6
      name: urgency
      label: urgency
      hint: null
      type: select_multiple
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 7
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
