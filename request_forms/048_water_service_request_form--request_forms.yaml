inputSchema:
  type: object
  properties:
    title: Water Service Request Form
    pages:
    - id: 1
      name: service_requester_name
      label: Service Requester Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: service_requester_email
      label: service_requester_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: service_address
      label: service_address
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: service_address_city
      label: service_address_city
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: service_type
      label: service_type
      hint: null
      type: select_one
      options:
      - Water Service
      - Sewer Service
      - Meter Service
      required: false
    - id: 6
      name: service_problem_type
      label: service_problem_type
      hint: null
      type: select_one
      options:
      - Leaking Faucets
      - Low Water Pressure
      - Discolored Water
      - Other
      required: false
    - id: 7
      name: problem_description
      label: problem_description
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: contact_number
      label: contact_number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: request_date
      label: request_date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: service_requester_comments
      label: service_requester_comments
      hint: null
      type: text
      options: []
      required: false
