inputSchema:
  type: object
  properties:
    title: Airline Pilot Family Engagement Leave Of Absence Form
    pages:
    - id: 1
      name: section_pilot_info
      label: -- Pilot Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: pilot_name
      label: Pilot Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: employee_id
      label: Employee ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: pilot_rank
      label: Current Rank
      hint: null
      type: select_one
      options:
      - Captain
      - First Officer
      - Second Officer
      - Training Captain
      required: true
    - id: 5
      name: fleet_type
      label: Fleet Type
      hint: e.g. A320, B787
      type: text
      options: []
      required: true
    - id: 6
      name: section_leave_details
      label: -- Leave Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: leave_start_date
      label: Leave Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: leave_end_date
      label: Leave End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: leave_category
      label: Leave Category
      hint: null
      type: select_one
      options:
      - Parental Leave
      - Family Care Leave
      - Marriage Leave
      - Bereavement Leave
      - Family Engagement Event
      required: true
    - id: 10
      name: total_days_requested
      label: Total Number of Days Requested
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: reason_for_leave
      label: Description of Leave Purpose
      hint: Please provide a brief explanation for HR records
      type: text
      options: []
      required: true
    - id: 12
      name: section_operational
      label: -- Operational Impact --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: scheduled_flights_affected
      label: Scheduled Flights During Leave Period
      hint: Provide flight numbers if known
      type: text
      options: []
      required: false
    - id: 14
      name: standby_obligations
      label: Are you scheduled for standby during this period?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 15
      name: backup_pilot_available
      label: Has a potential swap or backup been identified?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: pilot_signature_confirmation
      label: I confirm that I am requesting this leave in accordance with the company
        pilot agreement
      hint: null
      type: select_one
      options:
      - I confirm
      - Other
      required: true
