inputSchema:
  type: object
  properties:
    title: Baptism Request Form
    pages:
    - id: 1
      name: request_date
      label: Request Date
      hint: Date of this request
      type: date
      options: []
      required: true
    - id: 2
      name: requester_name
      label: Requester Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Email Address
      hint: Your email contact
      type: email
      options: []
      required: true
    - id: 4
      name: requester_phone
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: request_relationship
      label: Your Relationship to Candidate
      hint: Who is being baptized?
      type: select_one
      options:
      - Myself
      - Child
      - Spouse
      - Parent
      - Sibling
      - Other Family Member
      - Friend
      required: true
    - id: 6
      name: candidate_name
      label: Baptism Candidate Name
      hint: Full name of person to be baptized
      type: text
      options: []
      required: true
    - id: 7
      name: candidate_dob
      label: Candidate Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 8
      name: candidate_age
      label: Current Age
      hint: Age of candidate
      type: number
      options: []
      required: false
    - id: 9
      name: baptism_type_requested
      label: Type of Baptism Requested
      hint: What type of baptism ceremony?
      type: select_one
      options:
      - Infant Baptism
      - Child Baptism
      - Adult Baptism
      - Emergency/Private Baptism
      - Conditional Baptism
      - Reaffirmation of Baptism
      required: true
    - id: 10
      name: reason_for_request
      label: Reason for Baptism Request
      hint: Why are you requesting this?
      type: text
      options: []
      required: true
    - id: 11
      name: faith_commitment
      label: Faith Commitment Statement
      hint: Brief statement of commitment to faith
      type: text
      options: []
      required: false
    - id: 12
      name: preferred_date
      label: Preferred Baptism Date
      hint: When would you like it?
      type: date
      options: []
      required: true
    - id: 13
      name: date_flexibility
      label: Is This Date Flexible?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Somewhat
      required: false
    - id: 14
      name: preferred_time
      label: Preferred Time
      hint: Morning, afternoon, or evening?
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Flexible
      - Weekend Service
      required: false
    - id: 15
      name: service_location
      label: Preferred Service Location
      hint: Where should ceremony be?
      type: select_one
      options:
      - Church Sanctuary
      - Chapel
      - Outdoor Location
      - River or Lake
      - Home
      - No Preference
      required: false
    - id: 16
      name: church_affiliation
      label: Church Affiliation
      hint: Your parish or church
      type: text
      options: []
      required: true
    - id: 17
      name: has_sponsor
      label: Do You Have a Godparent/Sponsor?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Need Help Finding One
      required: true
    - id: 18
      name: sponsor_information
      label: Sponsor Information
      hint: Name and contact of sponsor
      type: text
      options: []
      required: false
    - id: 19
      name: prior_religious_training
      label: Prior Religious Training or Instruction
      hint: Education about baptism completed?
      type: select_one
      options:
      - Yes, Completed
      - In Progress
      - Not Yet Started
      - Not Required
      required: false
    - id: 20
      name: needs_counseling
      label: Would You Like Pre-Baptism Counseling?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Sure
      required: false
    - id: 21
      name: additional_information
      label: Additional Information or Questions
      hint: Anything else we should know?
      type: text
      options: []
      required: false
