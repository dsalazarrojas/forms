inputSchema:
  type: object
  properties:
    title: Tree Trimming Request Form
    pages:
    - id: 1
      name: user
      label: Client Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: tree_location
      label: Tree Location
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: tree_size
      label: Tree Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      required: false
    - id: 4
      name: service_type
      label: Service Type
      hint: null
      type: select_multiple
      options:
      - Tree Trimming
      - Tree Shaping
      - Tree Pruning
      required: false
    - id: 5
      name: service_date
      label: Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: service_time
      label: Service Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: service_notes
      label: Service Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: assigned_tool
      label: Assigned to
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
