inputSchema:
  type: object
  properties:
    title: Trip Request Form
    pages:
    - id: 1
      name: is_business_trip
      label: Is this a business or personal trip?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 2
      name: travel_departure_date
      label: When is the departure date?
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: travel_return_date
      label: When is the return date?
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: trip_purpose
      label: What is the purpose of the trip?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: is_travel_agency_associated
      label: Is this travel agency associated with the trip?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: travel_agency_address
      label: Travel agency address
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: travel_agency_contact
      label: Travel agency contact person
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: travel_agency_phone
      label: Travel agency phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: travel_agency_email
      label: Travel agency email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
