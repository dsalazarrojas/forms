inputSchema:
  type: object
  properties:
    title: Outage Maintenance Request Form
    pages:
    - id: 1
      name: facility_name
      label: Facility Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: date_of_outage
      label: Date of Outage
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Electrical
      - Network
      - Software
      - Hardware
      - Other
      required: false
    - id: 6
      name: description
      label: Description
      hint: Briefly describe the outage.
      type: text
      options: []
      required: false
    - id: 7
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Low
      - Medium
      required: false
    - id: 8
      name: assignee
      label: Assignee
      hint: null
      type: select_multiple
      options:
      - chatjimmy
      - Other
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submitter
      label: Submitter
      hint: null
      type: email
      options: []
      required: false
