inputSchema:
  type: object
  properties:
    title: Birthday Wish List Template
    pages:
    - id: 1
      name: section_intro
      label: -- Birthday Wish List --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_message
      label: Create your birthday wish list
      hint: Share with friends and family what you'd love to receive
      type: note
      options: []
      required: false
    - id: 3
      name: section_person_info
      label: -- Birthday Person Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: birthday_name
      label: Full Name
      hint: Your name
      type: text
      options: []
      required: true
    - id: 5
      name: birthday_date
      label: Birthday Date
      hint: When is your birthday
      type: date
      options: []
      required: true
    - id: 6
      name: birthday_age
      label: Age Turning
      hint: How old are you turning
      type: number
      options: []
      required: true
    - id: 7
      name: email_address
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 8
      name: phone_number
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: false
    - id: 9
      name: section_preferences
      label: -- Gift Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: budget_preferences
      label: Budget Range Preferences
      hint: What is a comfortable gift price
      type: select_one
      options:
      - Under 25 dollars
      - 25 to 50 dollars
      - 50 to 100 dollars
      - 100 to 200 dollars
      - 200 to 500 dollars
      - 500 dollars plus
      - Any Amount
      required: true
    - id: 11
      name: gift_style
      label: Gift Style Preferences
      hint: What type of gifts do you like
      type: select_multiple
      options:
      - Practical Items
      - Luxury Items
      - Experiences
      - Entertainment
      - Technology
      - Fashion
      - Home Goods
      - Books or Media
      - Sports or Hobbies
      - Sentimental Gifts
      - DIY or Handmade
      required: true
    - id: 12
      name: size_measurements
      label: Size and Measurements
      hint: Clothing, shoe sizes, etc.
      type: text
      options: []
      required: false
    - id: 13
