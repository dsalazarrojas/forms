inputSchema:
  type: object
  properties:
    title: Cloth Design Form
    pages:
    - id: 1
      name: customer_name
      label: Customer Name
      hint: Full name as it should appear on the order
      type: text
      options: []
      required: true
    - id: 2
      name: customer_email
      label: Email Address
      hint: We will send order confirmations to this email
      type: email
      options: []
      required: true
    - id: 3
      name: customer_phone
      label: Phone Number
      hint: For order updates and questions
      type: text
      options: []
      required: false
    - id: 4
      name: fabric_type
      label: Fabric Type
      hint: Select your preferred fabric material
      type: select_one
      options:
      - Cotton
      - Silk
      - Polyester
      - Linen
      - Wool
      - Rayon
      - Denim
      required: true
    - id: 5
      name: cloth_category
      label: Cloth Category
      hint: What type of garment do you need
      type: select_one
      options:
      - Shirt
      - Dress
      - Pants
      - Skirt
      - Jacket
      - Suit
      - Other
      required: true
    - id: 6
      name: size_selection
      label: Size
      hint: Select your size
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      - Custom
      required: true
    - id: 7
      name: color_preference
      label: Color Preference
      hint: Primary color for your garment
      type: select_one
      options:
      - Black
      - White
      - Navy
      - Gray
      - Red
      - Blue
      - Green
      - Custom
      required: true
    - id: 8
      name: design_style
      label: Design Style
      hint: Preferred style aesthetic
      type: select_one
      options:
      - Casual
      - Formal
      - Business
      - Sporty
      - Bohemian
      - Classic
      - Trendy
      required: true
    - id: 9
      name: custom_measurements
      label: Custom Measurements
      hint: Provide any specific measurements if needed
      type: text
      options: []
      required: false
    - id: 10
      name: special_instructions
      label: Special Instructions
      hint: Any additional details or requirements
      type: text
      options: []
      required: false
    - id: 11
      name: quantity
      label: Quantity
      hint: Number of items to order
      type: number
      options: []
      required: true
    - id: 12
      name: deadline_date
      label: Desired Completion Date
      hint: When do you need your order ready
      type: date
      options: []
      required: true
    - id: 13
      name: budget_range
      label: Budget Range
      hint: Select your estimated budget
      type: select_one
      options:
      - Under $50
      - $50 - $100
      - $101 - $200
      - $201 - $500
      - Over $500
      required: false
    - id: 14
      name: referral_source
      label: How Did You Hear About Us
      hint: Help us improve our marketing
      type: select_one
      options:
      - Social Media
      - Friend or Family
      - Online Search
      - Advertisement
      - Previous Customer
      - Other
      required: false
    - id: 15
      name: terms_accepted
      label: I Accept Terms and Conditions
      hint: By accepting you agree to our policies
      type: select_one
      options:
      - Yes I Accept
      - false
      required: true
