inputSchema:
  type: object
  properties:
    title: Character Reference Request Form
    pages:
    - id: 1
      name: header
      label: -- Reference Request --
      hint: Request a character reference from a referee with structured details
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: requester name
      hint: name of person requesting the reference
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: requester email
      hint: contact email for follow up
      type: email
      options: []
      required: true
    - id: 4
      name: referee_name
      label: referee name
      hint: person who will write the reference
      type: text
      options: []
      required: true
    - id: 5
      name: referee_contact
      label: referee contact
      hint: email or phone for the referee
      type: text
      options: []
      required: true
    - id: 6
      name: relationship
      label: relationship
      hint: relation of referee to the requester
      type: select_one
      options:
      - Employer
      - Colleague
      - Teacher
      - Friend
      - Other
      required: true
    - id: 7
      name: reason_for_request
      label: reason for request
      hint: why the reference is needed
      type: text
      options: []
      required: true
    - id: 8
      name: deadline
      label: deadline
      hint: date the reference is needed by
      type: date
      options: []
      required: false
    - id: 9
      name: additional_instructions
      label: additional instructions
      hint: any guidance for the referee
      type: text
      options: []
      required: false
    - id: 10
      name: consent_from_subject
      label: consent from subject
      hint: confirm subject has consented to reference request
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
