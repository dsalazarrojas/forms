inputSchema:
  type: object
  properties:
    title: Document Retention Review Request Form
    pages:
    - id: 1
      name: document_retention_request_form
      label: Request Review
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: document_type
      label: Document Type
      hint: null
      type: select_one
      options:
      - Records
      - Correspondence
      - Other
      required: true
    - id: 3
      name: document_location
      label: Document Location
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: reason_for_requesting_review
      label: Reason For Requesting Review
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submitter_id
      label: Submitter ID
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: reviewer_id
      label: Reviewer ID
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: review_status
      label: Review Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: true
