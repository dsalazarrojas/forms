      type: text
      options: []
      required: true
    - id: 5
      name: issue_description
      label: Issue Description
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: schedule_visit
      label: Schedule Visit
      hint: MM/DD/YYYY
      type: date
      options: []
      required: true
    - id: 7
      name: submitter_name
      label: Submitter Name
      hint: null
      type: text
      options: []
