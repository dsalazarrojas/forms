inputSchema:
  type: object
  properties:
    title: Vending Machine Refund Form
    pages:
    - id: 1
      name: customer_details
      label: Customer Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: order_id
      label: Order ID
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: transaction_date
      label: Transaction Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: reason_for_refund
      label: Reason for Refund
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: refund_amount
      label: Refund Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: product_name
      label: Product Name
      hint: null
      type: select_one
      options:
      - Vending Machine A
      - Vending Machine B
      - Vending Machine C
      required: false
    - id: 7
      name: customer_signature
      label: Customer Signature
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 8
      name: machine_serial_number
      label: Machine Serial Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: refund_status
      label: Refund Status
      hint: null
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: false
    - id: 10
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: category
      label: Category
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: false
