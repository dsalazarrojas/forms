inputSchema:
  type: object
  properties:
    title: Exhibition Stall Modification Request Form
    pages:
    - id: 1
      name: exhibitor_name
      label: Exhibitor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: stall_number
      label: Stall Number
      hint: null
      type: number
      options: []
      required: false
    - id: 3
      name: request_type
      label: Request Type
      hint: null
      type: select_one
      options:
      - Request Type
      - Modification
      - Cancellation
      - Swap
      required: false
    - id: 4
      name: request_date
      label: Request Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: file_upload
      label: File Upload
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: preferred_start_date
      label: Preferred Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: preferred_end_date
      label: Preferred End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: priority
      label: Priority
      hint: null
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - chatjimmy
      - other
      - not assigned
      required: false
    - id: 13
      name: status
      label: Status
      hint: null
      type: select_multiple
      options:
      - Requested
      - Pending
      - Approved
      - Rejected
      - Assigned
      - Closed
      required: false
