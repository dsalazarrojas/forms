inputSchema:
  type: object
  properties:
    title: Screen Printing Request Form
    pages:
    - id: 1
      name: form_title
      label: form_title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: artwork_description
      label: artwork_description
