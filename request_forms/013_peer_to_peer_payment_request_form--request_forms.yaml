inputSchema:
  type: object
  properties:
    title: Peer To Peer Payment Request Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Enter your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: last_name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: message
      label: message
      hint: Enter your message
      type: text
      options: []
      required: false
    - id: 6
      name: amount
      label: amount
      hint: Enter the amount
      type: number
      options: []
      required: true
    - id: 7
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - PayPal
      - Stripe
      - Bank Transfer
      required: true
    - id: 8
      name: payment_details
      label: payment_details
      hint: null
      type: note
      options: []
      required: false
