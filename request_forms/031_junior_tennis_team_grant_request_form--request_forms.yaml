inputSchema:
  type: object
  properties:
    title: Junior Tennis Team Grant Request Form
    pages:
    - id: 1
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: team_lead
      label: team_lead
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: team_address
      label: team_address
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: grant_amount_request
      label: grant_amount_request
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: grant_use
      label: grant_use
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: grant_start_date
      label: grant_start_date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: grant_end_date
      label: grant_end_date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: bank_account_name
      label: bank_account_name
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: grant_purpose
      label: grant_purpose
      hint: null
