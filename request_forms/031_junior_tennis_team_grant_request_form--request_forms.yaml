      - Tournament Entry Fees
      - Coaching and Equipment
      - Miscellaneous
      required: false
    - id: 10
      name: grant_type
      label: grant_type
      hint: null
      type: select_multiple
      options:
      - Equipment and Supplies
      - Team Travel
      - Team Training
      - Miscellaneous
      required: false
    - id: 11
      name: bank_name
      label: bank_name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: account_number
      label: account_number
      hint: null
      type: text
      options: []
      required: false
