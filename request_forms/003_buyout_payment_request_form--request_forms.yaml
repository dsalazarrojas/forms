inputSchema:
  type: object
  properties:
    title: Buyout Payment Request Form
    pages:
    - id: 1
      name: requestor_information
      label: -- Requestor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requestor_name
      label: Requestor Name
      hint: Full name of the person submitting the request
      type: text
      options: []
      required: true
    - id: 3
      name: department
      label: Department
      hint: Department requesting the buyout
      type: text
      options: []
      required: true
    - id: 4
      name: employee_name
      label: Employee Name for Buyout
      hint: Name of the employee whose buyout is requested
      type: text
      options: []
      required: true
    - id: 5
      name: employee_id
      label: Employee ID
      hint: Internal identifier if available
      type: text
      options: []
      required: false
    - id: 6
      name: reason_for_buyout
      label: Reason for Buyout
      hint: Explain rationale and any contractual references
      type: text
      options: []
      required: true
    - id: 7
      name: amount_requested
      label: Amount Requested
      hint: Enter numeric value in local currency
      type: number
      options: []
      required: true
    - id: 8
      name: effective_date
      label: Effective Date
      hint: Date when buyout should take effect
      type: date
      options: []
      required: true
    - id: 9
      name: supporting_documents
      label: Supporting Documents Provided
      hint: List document names or paths, or state Not Applicable
      type: text
      options: []
      required: false
    - id: 10
      name: approval_required_from
      label: Approval Required From
      hint: Name or role of approver needed
      type: text
      options: []
      required: true
    - id: 11
      name: urgency
      label: Urgency Level
      hint: Select urgency for processing
      type: select_one
      options:
      - Routine
      - High
      - Critical
      required: true
    - id: 12
      name: additional_notes
      label: Additional Notes
      hint: Any further context for finance and operations
      type: text
      options: []
      required: false
