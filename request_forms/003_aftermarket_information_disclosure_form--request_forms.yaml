inputSchema:
  type: object
  properties:
    title: Aftermarket Information Disclosure Form
    pages:
    - id: 1
      name: contact_details
      label: -- Contact Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Full name of individual making request
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Requester email
      hint: Best contact email
      type: email
      options: []
      required: true
    - id: 4
      name: product_serial
      label: Product serial or model
      hint: Provide serial number or model identifier
      type: text
      options: []
      required: true
    - id: 5
      name: disclosure_reason
      label: Reason for disclosure request
      hint: Briefly describe why information is needed
      type: text
      options: []
      required: true
    - id: 6
      name: data_requested
      label: Data requested
      hint: Specify which aftermarket data fields are needed
      type: select_multiple
      options: [Maintenance history, Parts list, Modification details, Compatibility notes, Pricing history]
      required: true
    - id: 7
      name: intended_use
      label: Intended use of disclosed information
      hint: How will the information be used
      type: text
      options: []
      required: true
    - id: 8
      name: confidentiality_needed
      label: Is confidentiality required
      hint: Select if special handling is requested
      type: select_one
      options: [Yes, No]
      required: true
    - id: 9
      name: preferred_contact_time
      label: Preferred contact time
      hint: Best time to reach requester
      type: time
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Any supporting information or attachments description
      type: text
      options: []
      required: false
