inputSchema:
  type: object
  properties:
    title: Domestic Communication Request Form
    pages:
    - id: 1
      name: user_first_name
      label: User's First Name
      hint: Enter user's first name
      type: text
      options: []
      required: true
    - id: 2
      name: user_last_name
      label: User's Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company
      label: Company
      hint: null
      type: select_one
      options:
      - ABC Inc.
      - DEF Corp.
      - GHI LLC
      - JKL Co.
      required: true
    - id: 6
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - Accounting
      - HR
      - Operations
      - Sales
      required: true
    - id: 7
      name: message
      label: Message
      hint: null
      type: note
      options: []
      required: true
    - id: 8
      name: follow_up_date
      label: Follow-up Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: follow_up_time
      label: Follow-up Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: assigned_to
      label: Assigned to
      hint: null
      type: select_one
      options:
      - ChatJimmy
      - John
      required: true
    - id: 11
      name: status
      label: Status
      hint: null
      type: select_one
      options:
      - Pending
      - In Progress
      - Completed
      required: true
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: attachments
      label: Attachments
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
