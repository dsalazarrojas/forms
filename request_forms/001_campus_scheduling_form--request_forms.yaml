inputSchema:
  type: object
  properties:
    title: Campus Scheduling Form
    pages:
    - id: 1
      name: section_personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester Name
      hint: Full name of the person requesting the booking
      type: text
      options: []
      required: true
    - id: 3
      name: requester_email
      label: Requester Email
      hint: Provide a valid institutional email address
      type: email
      options: []
      required: true
    - id: 4
      name: department_or_org
      label: Department or Organization
      hint: Department, office, or student organization name
      type: text
      options: []
      required: true
    - id: 5
      name: event_title
      label: Event Title
      hint: Short descriptive title of the event
      type: text
      options: []
      required: true
    - id: 6
      name: event_description
      label: Event Description
      hint: Brief overview of purpose and activities
      type: text
      options: []
      required: false
    - id: 7
      name: preferred_date
      label: Preferred Date
      hint: Select the primary requested date
      type: date
      options: []
      required: true
    - id: 8
      name: alternative_date
      label: Alternative Date
      hint: Optional alternate date if primary is unavailable
      type: date
      options: []
      required: false
    - id: 9
      name: start_time
      label: Start Time
      hint: Event start time in 24 hour format
      type: time
      options: []
      required: true
    - id: 10
      name: end_time
      label: End Time
      hint: Event end time in 24 hour format
      type: time
      options: []
      required: true
    - id: 11
      name: expected_attendance
      label: Expected Attendance
      hint: Estimated number of attendees
      type: number
      options: []
      required: false
    - id: 12
      name: preferred_location
      label: Preferred Location
      hint: Building and room or outdoor location
      type: text
      options: []
      required: true
    - id: 13
      name: equipment_needs
      label: Equipment Needs
      hint: AV, tables, chairs, podium, etc
      type: select_multiple
      options:
      - Audio visual equipment
      - Tables and chairs
      - Microphone sound system
      - Podium
      - Internet access
      required: false
    - id: 14
      name: food_or_beverage
      label: Food or Beverage Service
      hint: Indicate if catering or food is planned
      type: select_one
      options:
      - 'False'
      - Yes - light refreshments
      - Yes - full catering
      required: true
    - id: 15
      name: special_requirements
      label: Special Requirements
      hint: Accessibility, security, or other needs
      type: text
      options: []
      required: false
    - id: 16
      name: approval_signature
      label: Approver Name
      hint: Name of department approver or admin
      type: text
      options: []
      required: false
