inputSchema:
  type: object
  properties:
    title: Investment Fund Switch Request Form
    pages:
    - id: 1
      name: first_page
      label: First Page
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: fund_transfer_details
      label: Fund Transfer Details
      hint: Please provide detailed information about the transfer
      type: text
      options: []
      required: true
    - id: 3
      name: select_investment_fund
      label: Select Investment Fund
      hint: Please select the investment fund to transfer
      type: select_one
      options:
      - '1'
      - '2'
      - '3'
      - '4'
      required: true
    - id: 4
      name: transfer_date
      label: Transfer Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: transfer_time
      label: Transfer Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: select_transfer_option
      label: Select Transfer Option
      hint: Please select an option
      type: select_multiple
      options:
      - Option 1
      - Option 2
      required: true
