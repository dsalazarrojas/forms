inputSchema:
  type: object
  properties:
    title: MAG Troubleshooting Request
    pages:
    - id: 1
      name: device_details
      label: Device prophets
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: issue_category
      label: Issue Category
      hint: null
      type: select_one
      options:
      - Hardware
      - Software
      - Network
      - Other
      required: false
    - id: 3
      name: issue_description
      label: Describe the issue
      hint: Provide a detailed description of the issue
      type: text
      options: []
      required: false
    - id: 4
      name: urgency
      label: Urgency
      hint: null
      type: select_multiple
      options:
      - Low
      - Medium
      - High
      required: false
    - id: 5
      name: attachment
      label: Attachments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: files
      label: File
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
