inputSchema:
  type: object
  properties:
    title: Ahm Appointment Request Form
    pages:
    - id: 1
      name: contact_info_header
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: We will confirm via email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: appointment_details_header
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: preferred_date
      label: Preferred Date
      hint: Select a requested date
      type: date
      options: []
      required: true
    - id: 7
      name: preferred_time
      label: Preferred Time
      hint: Best time of day
      type: select_one
      options:
      - Morning (9am - 12pm)
      - Afternoon (12pm - 4pm)
      - Evening (4pm - 7pm)
      required: true
    - id: 8
      name: service_interest
      label: Service Interest
      hint: What can we help you with?
      type: select_multiple
      options:
      - Consultation
      - Graphic Design
      - Photography
      - Branding Strategy
      - Web Development
      - Other
      required: true
    - id: 9
      name: project_description
      label: Project Description
      hint: Tell us about your project
      type: text
      options: []
      required: true
    - id: 10
      name: budget_range
      label: Budget Range
      hint: Estimated budget
      type: select_one
      options:
      - Under $1,000
      - $1,000 - $5,000
      - $5,000 - $10,000
      - $10,000+
      required: false
    - id: 11
      name: referral_source
      label: How did you hear about us?
      hint: null
      type: select_one
      options:
      - Social Media
      - Friend / Referral
      - Google Search
      - Advertisement
      required: false
    - id: 12
      name: urgent_request
      label: Is this urgent?
      hint: Need a rush turnaround?
      type: select_one
      options:
      - true
      - false
      required: true
