inputSchema:
  type: object
  properties:
    title: Co Working Station Reassignment Request Form
    pages:
    - id: 1
      name: header
      label: -- Reassignment Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 3
      name: current_desk
      label: Current desk or station
      hint: Desk number or location
      type: text
      options: []
      required: true
    - id: 4
      name: requested_desk
      label: Requested desk or station
      hint: Preferred desk number or area
      type: text
      options: []
      required: false
    - id: 5
      name: reason_for_request
      label: Reason for request
      hint: Brief justification for reassignment
      type: text
      options: []
      required: true
    - id: 6
      name: date_needed
      label: Date reassignment needed
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 7
      name: manager_approval
      label: Manager approval required
      hint: Obtain manager confirmation
      type: select_one
      options:
      - Pending
      - Approved
      - Denied
      required: true
    - id: 8
      name: contact_phone
      label: Contact phone
      hint: Best phone number to reach employee
      type: text
      options: []
      required: false
    - id: 9
      name: accommodation_needs
      label: Accommodation needs
      hint: Any accessibility or equipment needs
      type: text
      options: []
      required: false
    - id: 10
      name: additional_notes
      label: Additional notes
      hint: Other information for facilities team
      type: text
      options: []
      required: false
