inputSchema:
  type: object
  properties:
    title: Personal Shopper Request Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: session_date
      label: Session Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: requested_products
      label: Requested Products
      hint: null
      type: select_one
      options:
      - Shoes
      - Clothing
      - Accessories
      - Other
      required: false
    - id: 7
      name: shopper_preference
      label: Shopper Preference
      hint: null
      type: select_multiple
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
