inputSchema:
  type: object
  properties:
    title: Book Bundle Removal Request Form
    pages:
    - id: 1
      name: request_header
      label: -- Removal Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Requester name
      hint: Staff or partner requesting removal
      type: text
      options: []
      required: true
    - id: 3
      name: book_bundle_id
      label: Book bundle identifier
      hint: SKU or bundle code
      type: text
      options: []
      required: true
    - id: 4
      name: reason_for_removal
      label: Reason for removal
      hint: Explain why the bundle should be removed
      type: text
      options: []
      required: true
    - id: 5
      name: effective_date
      label: Effective date of removal
      hint: When to remove bundle
      type: date
      options: []
      required: false
    - id: 6
      name: approval_required
      label: Approval required
      hint: Does this action require manager approval
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: approver_name
      label: Approver name
      hint: Name of approving manager
      type: text
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: Any additional information
      type: text
      options: []
      required: false
