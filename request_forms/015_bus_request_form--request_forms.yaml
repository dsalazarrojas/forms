inputSchema:
  type: object
  properties:
    title: Bus Request Form
    pages:
    - id: 1
      name: applicant_info
      label: Applicant Information
      hint: Student and parent details
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Full Name
      hint: Legal name of student
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID Number
      hint: Student identification number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Student birth date
      type: date
      options: []
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 6
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: true
    - id: 7
      name: parent_name
      label: Parent or Guardian Name
      hint: Full name of parent or guardian
      type: text
      options: []
      required: true
    - id: 8
      name: parent_phone
      label: Parent Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 9
      name: parent_email
      label: Parent Email
      hint: Email address for notifications
      type: email
      options: []
      required: true
    - id: 10
      name: home_address
      label: Home Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 11
      name: city
      label: City
      hint: City or town
      type: text
      options: []
      required: true
    - id: 12
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 13
      name: transportation_need
      label: Transportation Need
      hint: Reason for bus transportation request
      type: note
      options: []
      required: false
    - id: 14
      name: request_type
      label: Request Type
      hint: Type of transportation request
      type: select_one
      options:
      - New Request
      - Renewal
      - Change of Route
      - Temporary Transportation
      - Special Needs Transportation
      required: true
    - id: 15
      name: eligibility_reason
      label: Eligibility Reason
      hint: Why is transportation needed
      type: select_one
      options:
      - Distance from School
      - Safety Concerns
      - Disability or Special Needs
      - Temporary Injury
      - Family Hardship
      - Other
      required: true
    - id: 16
      name: distance_from_school
      label: Distance from School
      hint: Approximate distance in miles
      type: number
      options: []
      required: false
    - id: 17
      name: preferred_pickup_location
      label: Preferred Pickup Location
      hint: Where should student be picked up
      type: text
      options: []
      required: true
    - id: 18
      name: preferred_dropoff_location
      label: Preferred Drop-off Location
      hint: Where should student be dropped off
      type: text
      options: []
      required: true
    - id: 19
      name: special_needs
      label: Special Needs or Accommodations
      hint: Does student require special accommodations
      type: select_one
      options:
      - No Special Needs
      - Wheelchair Access
      - Medical Equipment
      - Behavioral Support
      - Other
      required: true
    - id: 20
      name: special_needs_description
      label: Special Needs Description
      hint: Describe any special requirements
      type: text
      options: []
      required: false
    - id: 21
      name: medical_conditions
      label: Medical Conditions
      hint: Any medical conditions staff should know
      type: text
      options: []
      required: false
    - id: 22
      name: emergency_contact
      label: Emergency Contact
      hint: Name and phone of emergency contact
      type: text
      options: []
      required: true
    - id: 23
      name: transportation_schedule
      label: Transportation Schedule
      hint: When is transportation needed
      type: select_one
      options:
      - Morning Only
      - Afternoon Only
      - Morning and Afternoon
      - Midday Routes
      - Activity Buses
      required: true
    - id: 24
      name: sibling_info
      label: Sibling Information
      hint: Are siblings also requesting transportation
      type: text
      options: []
      required: false
    - id: 25
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
