inputSchema:
  type: object
  properties:
    title: Keyboard Settings Request Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: keyboard_preferences
      label: Keyboard Preferences
      hint: null
      type: select_multiple
      options:
      - Keyboard with no numeric keypad
      - Laptop
      - Desktop
      - External keyboard
      - No preference
      required: false
    - id: 3
      name: preferred_keyboards
      label: Preferred Keyboards
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: priority
      label: Priority
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
