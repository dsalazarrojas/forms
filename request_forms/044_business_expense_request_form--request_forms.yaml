inputSchema:
  type: object
  properties:
    title: Business Expense Request Form
    pages:
    - id: 1
      name: requester_info
      label: -- Requester Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: employee_name
      label: Employee Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: employee_email
      label: Employee Email
      hint: Business email
      type: email
      options: []
      required: true
    - id: 4
      name: employee_id
      label: Employee ID
      hint: Your ID number
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: true
    - id: 6
      name: manager_name
      label: Manager Name
      hint: Your direct manager
      type: text
      options: []
      required: true
    - id: 7
      name: request_date
      label: Request Date
      hint: Date of this request
      type: date
      options: []
      required: true
    - id: 8
      name: expense_details
      label: -- Expense Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: expense_type
      label: Type of Expense
      hint: What kind of expense?
      type: select_one
      options:
      - Travel
      - Meals and Entertainment
      - Office Supplies
      - Equipment
      - Professional Development
      - Training
      - Conference Registration
      - Memberships
      - Other
      required: true
    - id: 10
      name: expense_amount
      label: Requested Amount
      hint: Total amount needed
      type: number
      options: []
      required: true
    - id: 11
      name: expense_date
      label: Date Expense Will Be Incurred
      hint: When will you spend?
      type: date
      options: []
      required: true
    - id: 12
      name: vendor_name
      label: Vendor or Merchant Name
      hint: Where will you purchase?
      type: text
      options: []
      required: true
    - id: 13
      name: business_purpose
      label: Business Purpose
      hint: Why is this needed?
      type: text
      options: []
      required: true
    - id: 14
      name: business_benefit
      label: Expected Business Benefit
      hint: How does this help company?
      type: text
      options: []
      required: true
    - id: 15
      name: project_code
      label: Project Code
      hint: Associated project
      type: text
      options: []
      required: false
    - id: 16
      name: cost_center
      label: Cost Center
      hint: Billing cost center
      type: text
      options: []
      required: false
    - id: 17
      name: priority_level
      label: -- Request Priority --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: urgency
      label: Urgency Level
      hint: How urgent is this?
      type: select_one
      options:
      - Routine
      - Standard
      - Urgent
      - Critical
      required: true
    - id: 19
      name: justification
      label: Justification
      hint: Why this is necessary
      type: text
      options: []
      required: true
    - id: 20
      name: alternatives
      label: Alternative Options Considered
      hint: What else did you consider?
      type: text
      options: []
      required: false
