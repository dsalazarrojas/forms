inputSchema:
  type: object
  properties:
    title: Automatic Door Service Request
    pages:
    - id: 1
      name: section_header_contact
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: contact_name
      label: Contact Person Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company or Building Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_location
      label: -- Location Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: service_address
      label: Service Address
      hint: Where is the automatic door located?
      type: text
      options: []
      required: true
    - id: 8
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: door_location_description
      label: Door Location Description
      hint: e.g., Main Entrance, Loading Dock, East Wing
      type: text
      options: []
      required: false
    - id: 12
      name: section_header_door
      label: -- Door Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: door_type
      label: Type of Automatic Door
      hint: null
      type: select_one
      options:
      - Sliding
      - Swing
      - Revolving
      - Folding
      - Overhead Rolling
      - Other
      required: true
    - id: 14
      name: door_model
      label: Door Model or Manufacturer
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: installation_year
      label: Year of Installation
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: section_header_issue
      label: -- Service Issues --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: service_type
      label: Type of Service Needed
      hint: null
      type: select_one
      options:
      - Repair
      - Maintenance
      - Inspection
      - Installation
      - Replacement
      - Emergency Service
      required: true
    - id: 18
      name: issue_description
      label: Describe the Problem
      hint: What is wrong with the door or sensor?
      type: text
      options: []
      required: true
    - id: 19
      name: door_operation
      label: Door Operation Status
      hint: null
      type: select_one
      options:
      - Not Opening
      - Not Closing
      - Opening Slowly
      - Closing Slowly
      - Making Noise
      - Not Responding to Sensor
      - Other
      required: true
    - id: 20
      name: urgency_level
      label: Urgency Level
      hint: null
      type: select_one
      options:
      - Critical - Door Out of Service
      - High - Major Issues
      - Medium - Some Functionality Loss
      - Low - Minor Issues
      required: true
    - id: 21
      name: section_header_appointment
      label: -- Appointment Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: preferred_date
      label: Preferred Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 23
      name: preferred_time
      label: Preferred Time Window
      hint: null
      type: select_one
      options:
      - Morning (8 AM - 12 PM)
      - Afternoon (12 PM - 5 PM)
      - Evening (After 5 PM)
      - Flexible
      required: true
    - id: 24
      name: additional_notes
      label: Additional Notes or Special Instructions
      hint: null
      type: text
      options: []
      required: false
