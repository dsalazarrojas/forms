inputSchema:
  type: object
  properties:
    title: Academic Health Related Leave Of Absence Request
    pages:
    - id: 1
      name: leave_request_intro
      label: Academic Health-Related Leave of Absence Request
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: Full legal name as it appears in student records
      type: text
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID Number
      hint: Your official student identification number
      type: text
      options: []
      required: true
    - id: 4
      name: student_email
      label: Student Email
      hint: Official institutional email address
      type: email
      options: []
      required: true
    - id: 5
      name: student_phone
      label: Phone Number
      hint: Primary contact phone number
      type: text
      options: []
      required: true
    - id: 6
      name: program_major
      label: Program/Major
      hint: Current academic program or major
      type: text
      options: []
      required: true
    - id: 7
      name: academic_year
      label: Academic Year
      hint: Current academic year and term
      type: text
      options: []
      required: true
    - id: 8
      name: leave_type
      label: Type of Health-Related Leave
      hint: What type of health issue requires leave?
      type: select_one
      options:
      - Physical illness or injury
      - Mental health condition
      - Chronic health condition
      - Medical treatment
      - Pregnancy-related
      - Other
      required: true
    - id: 9
      name: leave_start_date
      label: Proposed Leave Start Date
      hint: Date when you would like the leave to begin
      type: date
      options: []
      required: true
    - id: 10
      name: leave_end_date
      label: Proposed Leave End Date
      hint: Expected date when you plan to return
      type: date
      options: []
      required: true
    - id: 11
      name: duration_days
      label: Duration of Leave (Days)
      hint: Total number of days requested
      type: number
      options: []
      required: true
    - id: 12
      name: medical_documentation
      label: Medical Documentation
      hint: Will you provide documentation from a healthcare provider?
      type: select_one
      options:
      - Yes, I will provide documentation
      - In process of obtaining
      - Unable to obtain at this time
      - Documentation attached
      required: true
    - id: 13
      name: impact_on_academics
      label: Impact on Academic Progress
      hint: How will this leave affect your academic standing?
      type: text
      options: []
      required: true
    - id: 14
      name: courses_affected
      label: Courses Affected
      hint: List the courses that will be affected by this leave
      type: text
      options: []
      required: false
    - id: 15
      name: academic_support_needed
      label: Academic Support Needed
      hint: What support will you need upon return?
      type: text
      options: []
      required: false
    - id: 16
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact person
      type: text
      options: []
      required: true
    - id: 17
      name: emergency_contact_relationship
      label: Relationship to Emergency Contact
      hint: How are you related to this person?
      type: text
      options: []
      required: true
