inputSchema:
  type: object
  properties:
    title: Lost Luggage Recovery Request Form
    pages:
    - id: 1
      name: airline_info
      label: Enter Airline Details
      hint: Please enter airline name, flight number, and date of travel
      type: select_multiple
      options:
      - Air Canada
      - British Airways
      - Qantas
      - United Air Lines
      required: false
    - id: 2
      name: passenger_info
      label: Passenger Contact Information
      hint: null
      type: select_one
      options:
      - Mr
      - Mrs
      - Other
      required: false
    - id: 3
      name: baggage_info
      label: Baggage Details
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: flight_info
      label: Flight Information
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: flight_number
      label: Flight Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: baggage_contents
      label: Baggage Contents
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: contact_info
      label: Contact Information
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      required: false
    - id: 8
      name: airline_phone
      label: Airline Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
