inputSchema:
  type: object
  properties:
    title: Computer Survey
    pages:
      - id: 1
        name: section_skill_assessment
        label: -- Skill Assessment --
        hint: Assess computer skills and training needs
        type: note
        options: []
        required: false
      - id: 2
        name: respondent_name
        label: Respondent name
        hint: Optional for anonymous submissions
        type: text
        options: []
        required: false
      - id: 3
        name: proficiency_windows
        label: Proficiency Windows
        hint: Rate Windows skills
        type: select_one
        options: [Expert, Proficient, Beginner, None]
        required: true
      - id: 4
        name: proficiency_mac
        label: Proficiency Mac
        hint: Rate MacOS skills
        type: select_one
        options: [Expert, Proficient, Beginner, None]
        required: true
      - id: 5
        name: networking_skills
        label: Networking skills
        hint: Self rated network troubleshooting ability
        type: select_one
        options: [Strong, Moderate, Basic]
        required: true
      - id: 6
        name: preferred_training_topics
        label: Preferred training topics
        hint: Topics you would like training on
        type: select_multiple
        options: [Hardware troubleshooting, Software installation, Security, Networking]
        required: false
      - id: 7
        name: comments
        label: Comments
        hint: Additional feedback for technicians
        type: text
        options: []
        required: false
