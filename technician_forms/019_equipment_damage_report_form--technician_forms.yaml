inputSchema:
  type: object
  properties:
    title: Equipment Damage Report Form
    pages:
    - id: 1
      name: equipment_id
      label: Equipment ID
      hint: null
      type: number
      options: []
      required: true
    - id: 2
      name: date_and_time
      label: Date and Time
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: description
      label: Description
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: damaged_part
      label: Damaged Part
      hint: null
      type: select_one
      options:
      - Front Door
      - Rear Door
      - Handle
      required: true
    - id: 5
      name: damage_condition
      label: Damage Condition
      hint: null
      type: select_multiple
      options:
      - Broken
      - Cracked
      - Dented
      required: true
    - id: 6
      name: repair_info
      label: Repair Info
      hint: null
      type: text
      options: []
      required: true
