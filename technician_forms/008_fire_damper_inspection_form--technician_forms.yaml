inputSchema:
  type: object
  properties:
    title: Fire Damper Inspection Form
    pages:
    - id: 1
      name: fire_damper_system
      label: Fire Damper System
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: system_type
      label: System Type
      hint: null
      type: select_one
      options:
      - Residential
      - Commercial
      - Industrial
      required: false
