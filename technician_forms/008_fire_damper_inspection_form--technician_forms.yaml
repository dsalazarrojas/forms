      - Semi-Automatic
      - Manual
      required: false
    - id: 4
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: date_of_inspection
      label: Date Of Inspection
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_inspection
      label: Time Of Inspection
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: assigned_inspector
      label: Assigned Inspector
      hint: null
      type: select_one
      options:
      - chatjimmy
      - Other
      required: false
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
