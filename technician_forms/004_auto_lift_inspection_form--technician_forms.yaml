inputSchema:
  type: object
  properties:
    title: Auto Lift Inspection Form
    pages:
    - id: 1
      name: section_header_basic
      label: -- Inspection Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: inspection_date
      label: Inspection Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: inspection_time
      label: Inspection Time
      hint: null
      type: time
      options: []
      required: true
    - id: 4
      name: technician_name
      label: Technician Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: technician_badge_number
      label: Technician Badge Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_header_lift_info
      label: -- Lift Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: lift_model_number
      label: Lift Model Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: lift_serial_number
      label: Lift Serial Number
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: lift_capacity
      label: Lift Capacity (lbs)
      hint: null
      type: number
      options: []
      required: true
    - id: 10
      name: lift_location
      label: Lift Location
      hint: e.g., Bay 1, Bay 2, Service Area
      type: text
      options: []
      required: true
    - id: 11
      name: section_header_condition
      label: -- Mechanical Condition --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: hydraulic_fluid_level
      label: Hydraulic Fluid Level
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Low
      - Critical
      required: true
    - id: 13
      name: hydraulic_leaks
      label: Visible Hydraulic Leaks
      hint: null
      type: select_one
      options:
      - None Detected
      - Minor
      - Moderate
      - Severe
      required: true
    - id: 14
      name: pump_condition
      label: Pump Condition
      hint: null
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      required: true
    - id: 15
      name: platform_damage
      label: Platform or Pad Damage
      hint: null
      type: select_one
      options:
      - None
      - Minor Wear
      - Moderate Damage
      - Requires Replacement
      required: true
    - id: 16
      name: section_header_safety
      label: -- Safety Systems --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: emergency_stop_button
      label: Emergency Stop Button Functions
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Needs Repair
      required: true
    - id: 18
      name: safety_locks
      label: Safety Locks and Latches
      hint: null
      type: select_one
      options:
      - Functioning Properly
      - Stiff Operation
      - Not Engaging
      - Damaged
      required: true
    - id: 19
      name: warning_lights
      label: Warning Light Function
      hint: null
      type: select_one
      options:
      - All Working
      - Some Inoperative
      - All Inoperative
      required: true
    - id: 20
      name: section_header_maintenance
      label: -- Maintenance --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: last_service_date
      label: Last Service Date
      hint: null
      type: date
      options: []
      required: false
    - id: 22
      name: next_service_due
      label: Next Service Due
      hint: null
      type: date
      options: []
      required: true
    - id: 23
      name: inspection_result
      label: Overall Inspection Result
      hint: null
      type: select_one
      options:
      - Pass - Safe to Use
      - Pass with Restrictions
      - Fail - Remove from Service
      required: true
    - id: 24
      name: notes
      label: Additional Notes or Recommendations
      hint: Enter any observations or maintenance recommendations
      type: text
      options: []
      required: false
