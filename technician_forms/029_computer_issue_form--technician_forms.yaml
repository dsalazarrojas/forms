inputSchema:
  type: object
  properties:
    title: Computer Issue Form
    pages:
      - id: 1
        name: section_issue_overview
        label: -- Issue Overview --
        hint: Report computer issues for technician support
        type: note
        options: []
        required: false
      - id: 2
        name: reporter_name
        label: Reporter name
        hint: Your full name
        type: text
        options: []
        required: true
      - id: 3
        name: contact_email
        label: Contact email
        hint: Technician will use to follow up
        type: email
        options: []
        required: true
      - id: 4
        name: device_model
        label: Device model
        hint: Model or serial number
        type: text
        options: []
        required: false
      - id: 5
        name: issue_summary
        label: Issue summary
        hint: Short description of the problem
        type: text
        options: []
        required: true
      - id: 6
        name: steps_to_reproduce
        label: Steps to reproduce
        hint: Steps that consistently reproduce the issue
        type: text
        options: []
        required: false
      - id: 7
        name: error_messages
        label: Error messages
        hint: Copy any error text you see
        type: text
        options: []
        required: false
      - id: 8
        name: severity
        label: Severity
        hint: Impact on work or operations
        type: select_one
        options: [Low, Medium, High, Critical]
        required: true
      - id: 9
        name: preferred_contact
        label: Preferred contact
        hint: How should the technician contact you
        type: select_one
        options: [Email, Phone, Remote session]
        required: true
