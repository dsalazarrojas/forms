inputSchema:
  type: object
  properties:
    title: Auto Service Appointment Form
    pages:
    - id: 1
      name: section_header_customer
      label: -- Customer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: preferred_contact
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text Message
      required: true
    - id: 6
      name: section_header_vehicle
      label: -- Vehicle Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: vehicle_year
      label: Vehicle Year
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: vehicle_make
      label: Vehicle Make
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: vehicle_model
      label: Vehicle Model
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: vehicle_color
      label: Vehicle Color
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: license_plate
      label: License Plate
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: mileage
      label: Current Mileage
      hint: null
      type: number
      options: []
      required: false
    - id: 13
      name: section_header_appointment
      label: -- Appointment Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: preferred_date
      label: Preferred Service Date
      hint: null
      type: date
      options: []
      required: true
    - id: 15
      name: preferred_time
      label: Preferred Time
      hint: null
      type: select_one
      options:
      - 8:00 AM - 9:00 AM
      - 9:00 AM - 10:00 AM
      - 10:00 AM - 11:00 AM
      - 11:00 AM - 12:00 PM
      - 1:00 PM - 2:00 PM
      - 2:00 PM - 3:00 PM
      - 3:00 PM - 4:00 PM
      required: true
    - id: 16
      name: service_type
      label: Type of Service Needed
      hint: null
      type: select_multiple
      options:
      - Oil Change
      - Tire Service
      - Brake Service
      - Battery Service
      - General Inspection
      - Transmission Service
      - Engine Repair
      - Other
      required: true
    - id: 17
      name: section_header_concerns
      label: -- Service Concerns --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: specific_issues
      label: Specific Issues or Concerns
      hint: Please describe any problems with your vehicle
      type: text
      options: []
      required: false
    - id: 19
      name: warning_lights
      label: Are any warning lights on
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: section_header_preferences
      label: -- Service Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: loaner_needed
      label: Do you need a loaner vehicle
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Not Sure
      required: true
    - id: 22
      name: approval_amount
      label: Maximum Approval Amount for Repairs
      hint: We will contact you if repairs exceed this amount
      type: number
      options: []
      required: false
    - id: 23
      name: consent_work
      label: I authorize the shop to perform the service
      hint: null
      type: select_one
      options:
      - Yes, proceed
      - No, contact me first
      required: true
