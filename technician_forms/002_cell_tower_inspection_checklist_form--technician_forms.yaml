inputSchema:
  type: object
  properties:
    title: Cell Tower Inspection Checklist Form
    pages:
      - id: 1
        name: general_info_header
        label: -- General Information --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: date_of_inspection
        label: Date of Inspection
        hint: null
        type: date
        options: []
        required: true
      - id: 3
        name: time_started
        label: Time Started
        hint: null
        type: time
        options: []
        required: true
      - id: 4
        name: tower_id
        label: Tower ID - Location Name
        hint: Enter the unique ID of the tower being inspected
        type: text
        options: []
        required: true
      - id: 5
        name: technician_name
        label: Technician Name
        hint: Full name of the inspector
        type: text
        options: []
        required: true
      - id: 6
        name: structural_components_header
        label: -- Structural Components --
        hint: null
        type: note
        options: []
        required: false
      - id: 7
        name: foundation_condition
        label: Foundation Condition
        hint: Visual assessment of the base
        type: select_one
        options:
          - Excellent
          - Good
          - Fair
          - Poor
        required: true
      - id: 8
        name: guy_wires_anchors
        label: Guy Wires and Anchors
        hint: Verify tension and security
        type: select_one
        options:
          - Pass
          - Fail
          - N/A
        required: true
      - id: 9
        name: rust_corrosion
        label: Rust or Corrosion Status
        hint: Severity of any metal degradation
        type: select_one
        options:
          - None
          - Mild
          - Moderate
          - Severe
        required: true
      - id: 10
        name: antennas_cabling_header
        label: -- Antennas and Cabling --
        hint: null
        type: note
        options: []
        required: false
      - id: 11
        name: antennas_inspected
        label: Types of Antennas Inspected
        hint: Select all that were present and checked
        type: select_multiple
        options:
          - Omni
          - Sector
          - Dish
          - Small Cell
        required: true
      - id: 12
        name: cabling_security
        label: Cabling Security
        hint: Are cables properly lashed and secured
        type: select_one
        options:
          - Secure
          - Needs Adjustment
        required: true
      - id: 13
        name: weatherproofing_status
        label: Weatherproofing Status
        hint: Condition of seals and connectors
        type: select_one
        options:
          - Intact
          - Damaged
        required: true
      - id: 14
        name: lighting_electrical_header
        label: -- Lighting and Electrical --
        hint: null
        type: note
        options: []
        required: false
      - id: 15
        name: faa_lighting
        label: FAA Lighting Functionality
        hint: Verify if obstruction lights are working
        type: select_one
        options:
          - Working
          - Not Working
          - N/A
        required: true
      - id: 16
        name: grounding_system
        label: Grounding System Status
        hint: Has the grounding been verified
        type: select_one
        options:
          - Verified
          - Not Verified
        required: true
      - id: 17
        name: safety_access_header
        label: -- Site Access and Safety --
        hint: null
        type: note
        options: []
        required: false
      - id: 18
        name: fencing_signage
        label: Fencing and Signage Condition
        hint: Status of perimeter security and warnings
        type: select_one
        options:
          - Good
          - Needs Repair
        required: true
      - id: 19
        name: safety_concerns
        label: Safety Concerns or Comments
        hint: Describe any hazards or needed repairs
        type: text
        options: []
        required: false
      - id: 20
        name: certification_header
        label: -- Certification --
        hint: null
        type: note
        options: []
        required: false
      - id: 21
        name: overall_result
        label: Overall Inspection Result
        hint: Final status of the tower inspection
        type: select_one
        options:
          - Pass
          - Fail
        required: true
