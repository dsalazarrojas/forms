inputSchema:
  type: object
  properties:
    title: Fire Pump Inspection Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: department
      label: prophets
      hint: null
      type: select_one
      options:
      - Fire Department
      - Police Department
      - Other
      required: false
    - id: 4
      name: pump_type
      label: pump_type
      hint: null
      type: select_multiple
      options:
      - Fire Pump
      - Test Pump
      - Other Pump
      required: false
    - id: 5
      name: inspection_date
      label: inspection_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: pump_condition
      label: pump_condition
      hint: null
      type: select_one
      options:
      - Normal
      - Broken
      - Malfunctioning
      required: false
    - id: 7
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: fire_station
      label: fire_station
      hint: null
      type: text
      options: []
      required: false
