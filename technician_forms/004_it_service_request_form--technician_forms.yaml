inputSchema:
  type: object
  properties:
    title: IT Service Request Form
    pages:
    - id: 1
      name: service_request
      label: IT Service Request
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: description
      label: Description
      hint: Briefly describe your issue here
      type: text
      options: []
      required: false
    - id: 3
      name: category
      label: Category
      hint: Select one or more categories
      type: select_multiple
      options:
      - Network
      - Server
      - Software
      - Security
      required: true
    - id: 4
      name: priority
      label: Priority
      hint: High, Medium, Low
      type: select_one
      options:
      - High
      - Medium
      - Low
      required: true
    - id: 5
      name: request_type
      label: Request Type
      hint: Select one or more request types
      type: select_multiple
      options:
      - Hardware
      - Software
      - Other
      required: true
    - id: 6
      name: request_date
      label: Request Date
      hint: Date (YYYY-MM-DD)
      type: date
      options: []
      required: false
    - id: 7
      name: request_time
      label: Request Time
      hint: "Time (HH:MM)"
      type: time
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: Choose a tool
      type: select_one
      options:
      - chatjimmy
      - Other
      required: true
    - id: 9
      name: description
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
