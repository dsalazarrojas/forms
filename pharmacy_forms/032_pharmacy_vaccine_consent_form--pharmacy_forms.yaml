inputSchema:
  type: object
  properties:
    title: Pharmacy Vaccine Consent Form
    pages:
    - id: 1
      name: patient_info
      label: patient_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: medical_history
      label: medical_history
      hint: null
      type: note
      options: []
      required: false
    - id: 3
      name: allergies
      label: allergies
      hint: null
      type: select_multiple
      options:
      - Allergic to penicillin
      - Allergic to amoxicillin
      required: true
    - id: 4
      name: vaccine_info
      label: vaccine_info
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: vaccination_date
      label: vaccination_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: vaccination_site
      label: vaccination_site
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: signature
      label: signature
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: medical_practitioner
      label: medical_practitioner
      hint: null
      type: text
      options: []
      required: false
