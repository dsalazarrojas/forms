      hint: null
      type: note
      options: []
      required: false
    - id: 38
      name: screening_approved
      label: Approved for vaccination today
      hint: Pharmacist to complete
      type: select_one
      options:
      - Approved
      - Defer to physician
      - Not approved
      required: false
    - id: 39
      name: pharmacist_name
      label: Pharmacist Name
      hint: null
      type: text
      options: []
      required: false
