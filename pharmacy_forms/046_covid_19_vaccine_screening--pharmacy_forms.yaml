inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine Screening
    pages:
    - id: 1
      name: patient_name
      label: Patient Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: patient_dob
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: patient_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: patient_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: screening_section
      label: -- Health Screening Questions --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: feeling_well
      label: Are you feeling well today
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
