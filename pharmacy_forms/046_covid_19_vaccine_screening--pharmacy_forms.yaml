      label: Difficulty breathing or shortness of breath
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 11
      name: sore_throat
      label: Do you have a sore throat
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 12
      name: loss_taste_smell
      label: Loss of taste or smell
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 13
      name: fatigue
      label: Unusual fatigue or weakness
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
