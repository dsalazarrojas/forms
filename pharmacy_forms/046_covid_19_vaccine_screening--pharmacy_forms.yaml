      name: covid_positive_date
      label: If yes, when
      hint: null
      type: date
      options: []
      required: false
    - id: 33
      name: fully_recovered
      label: Have you fully recovered
      hint: null
      type: select_one
      options:
      - true
      - false
      - Not applicable
      required: true
