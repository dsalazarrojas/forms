      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: fax
      label: Fax
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
