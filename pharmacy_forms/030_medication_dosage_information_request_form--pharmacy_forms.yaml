      hint: null
      type: select_one
      options:
      - Pharmacy A
      - Pharmacy B
      - Pharmacy C
      required: false
    - id: 9
      name: doctor
      label: Which doctor
      hint: null
      type: select_one
      options:
      - Dr. Smith
      - Dr. Jones
      - Dr. Johnson
      required: false
