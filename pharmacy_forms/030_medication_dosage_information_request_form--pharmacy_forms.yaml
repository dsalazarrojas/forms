      name: date_of_birth
      label: date_of_birth
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: medication_name
      label: Medication name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: medication_dosage_frequency
      label: How often
      hint: null
      type: select_multiple
      options:
      - Once a day
      - Twice a day
      - Three times a day
      - Four times a day
      required: false
    - id: 6
      name: medication_dosage_unit
      label: Unit
      hint: Please specify the unit of the medication (e.g. mL, mg, etc.)
      type: text
      options: []
      required: false
