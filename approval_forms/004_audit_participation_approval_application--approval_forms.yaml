inputSchema:
  type: object
  properties:
    title: Audit Participation Approval Application
    pages:
    - id: 1
      name: section_header
      label: -- Audit Participation Request --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: applicant name
      hint: Full name of the individual requesting participation
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_email
      label: applicant email
      hint: Email for notification and approval status
      type: email
      options: []
      required: true
    - id: 4
      name: role_or_title
      label: role or title
      hint: Job title or role in the organization
      type: text
      options: []
      required: true
    - id: 5
      name: audit_name
      label: audit name
      hint: Name or reference of the audit to participate in
      type: text
      options: []
      required: true
    - id: 6
      name: participation_reason
      label: reason for participation
      hint: Why participation is requested and expected contributions
      type: text
      options: []
      required: true
    - id: 7
      name: availability_dates
      label: availability dates
      hint: Dates or date range applicant is available
      type: text
      options: []
      required: false
    - id: 8
      name: manager_approval_required
      label: manager approval required
      hint: Has the direct manager approved this participation
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
