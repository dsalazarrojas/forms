inputSchema:
  type: object
  properties:
    title: Recruitment Approval Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: approval_section
      label: Approval
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not Sure
      required: false
    - id: 3
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: job_description
      label: Job Description
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: job_type
      label: Job Type
      hint: null
      type: select_one
      options:
      - Full-time
      - Part-time
      - Contract
      required: false
    - id: 6
      name: reporting_manager
      label: Reporting Manager
      hint: null
      type: select_multiple
      options:
      - John Smith
      - Jane Doe
      - Bob Johnson
      required: false
    - id: 7
      name: job_status
      label: Job Status
      hint: null
      type: select_one
      options:
      - Approved
      - Rejected
      - Pending
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: email_field
      label: Email
      hint: none
      type: email
      options: []
      required: false
