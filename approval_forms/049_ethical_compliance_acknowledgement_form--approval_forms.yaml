inputSchema:
  type: object
  properties:
    title: Ethical Compliance Acknowledgement Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: report_date
      label: Report Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: review_date
      label: Review Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: acknowledgement
      label: Acknowledgement
      hint: This is the formal acknowledgement of the ethical compliance standards.
      type: select_one
      options:
      - Compliance with our Code of Conduct is mandatory.
      - I am aware and understand the Code of Conduct.
      - Option 3
      required: false
    - id: 7
      name: other_text_field
      label: Other (please specify)
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: acknowledgement_date
      label: Date of Acknowledgement
      hint: Date this document was acknowledged
      type: date
      options: []
      required: false
