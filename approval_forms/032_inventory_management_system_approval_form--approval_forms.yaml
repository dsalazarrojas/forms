inputSchema:
  type: object
  properties:
    title: Inventory Management System Approval Form
    pages:
    - id: 1
      name: form_1
      label: inventory_request_form
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: inventory_status_form
      label: inventory_status
      hint: null
      type: select_one
      options:
      - In progress
      - Completed
      - Not Started
      required: true
    - id: 3
      name: inventory_manager_form
      label: inventory_manager
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: approval_status_form
      label: approval_status
      hint: null
      type: select_multiple
      options:
      - Approved
      - Rejected
      - Waiting on Manager
      required: true
    - id: 5
      name: comments_form
      label: comments
      hint: null
      type: note
      options: []
      required: false
