    - id: 3
      name: experiment_results
      label: Experiment Results
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: validation_comments
      label: Validation Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: experiment_conclusion
      label: Experiment Conclusion
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: next_steps
      label: Next Steps
      hint: null
      type: text
      options: []
      required: false
