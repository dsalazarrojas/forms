      hint: null
      type: select_one
      options:
      - Sabbatical
      - Research fellowship
      - Visiting researcher position
      - Grant-funded research leave
      - Other
      required: true
    - id: 12
      name: section_header_research_plan
      label: -- Research Plan --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: research_title
      label: Title of research project
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: research_description
      label: Description of research objectives and activities
      hint: Include goals, methodology, and expected outcomes
      type: text
      options: []
      required: true
    - id: 15
      name: research_location
      label: Where will the research be conducted
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: funding_source
      label: Funding source for the research
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: section_header_coverage
      label: -- Advising Coverage Plan --
      hint: null
      type: note
      options: []
      required: false
