inputSchema:
  type: object
  properties:
    title: Academic Advisor Research Leave Of Absence Form
    pages:
    - id: 1
      name: section_header_advisor_info
      label: -- Advisor Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: advisor_name
      label: Full name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: advisor_email
      label: Email address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: employee_id
      label: Employee ID
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: department
      label: Department
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: current_position
      label: Current position or title
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: years_of_service
      label: Years of service at the institution
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: section_header_leave_details
      label: -- Leave Request Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: leave_start_date
      label: Requested leave start date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
