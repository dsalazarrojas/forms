      name: current_caseload
      label: Number of students currently in your advising caseload
      hint: null
      type: number
      options: []
      required: true
    - id: 19
      name: coverage_plan
      label: Proposed plan for advising coverage during your absence
      hint: Name of substitute advisor or redistribution plan
      type: text
      options: []
      required: true
    - id: 20
      name: section_header_approvals
      label: -- Approvals --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: department_chair_approval
      label: Department chair or head approval status
      hint: null
      type: select_one
      options:
      - Approved
      - Pending
      - Denied
      required: false
    - id: 22
      name: dean_approval
      label: Dean approval status
      hint: null
      type: select_one
      options:
      - Approved
      - Pending
      - Denied
      required: false
    - id: 23
      name: additional_notes
      label: Additional notes or comments
      hint: null
      type: text
      options: []
      required: false
