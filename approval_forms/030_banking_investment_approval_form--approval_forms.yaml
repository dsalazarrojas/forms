inputSchema:
  type: object
  properties:
    title: Banking Investment Approval Form
    pages:
    - id: 1
      name: applicant_full_name
      label: Applicant Full Name
      hint: Legal name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 4
      name: applicant_address
      label: Mailing Address
      hint: Street, city, state, ZIP
      type: text
      options: []
      required: true
    - id: 5
      name: account_number
      label: Account Number
      hint: Your account
      type: text
      options: []
      required: true
    - id: 6
      name: investment_type
      label: Investment Type
      hint: What type of investment
      type: select_one
      options:
      - Stocks
      - Bonds
      - Mutual Funds
      - ETFs
      - Certificates of Deposit
      - Money Market Funds
      - Annuities
      - Retirement Account
      required: true
    - id: 7
      name: investment_amount
      label: Investment Amount
      hint: Amount to invest
      type: number
      options: []
      required: true
    - id: 8
      name: investment_term
      label: Investment Term
      hint: Duration of investment
      type: select_one
      options:
      - Short-Term (Under 1 year)
      - Medium-Term (1-5 years)
      - Long-Term (5+ years)
      - Open-Ended
      required: true
    - id: 9
      name: risk_tolerance
      label: Risk Tolerance
      hint: How much risk can you accept
      type: select_one
      options:
      - Conservative
      - Moderate
      - Aggressive
      - Very Aggressive
      required: true
    - id: 10
      name: investment_objective
      label: Investment Objective
      hint: What is your goal
      type: select_one
      options:
      - Capital Preservation
      - Income Generation
      - Capital Appreciation
      - Speculation
      - Retirement Planning
      - Education Funding
      required: true
    - id: 11
      name: source_of_funds
      label: Source of Funds
      hint: Where is the money from
      type: select_one
      options:
      - Salary
      - Business Income
      - Inheritance
      - Sale of Assets
      - Gift
      - Other Investments
      - Loan
      required: true
    - id: 12
      name: annual_income
      label: Annual Income
      hint: Gross yearly income
      type: select_one
      options:
      - Under $50000
      - $50000-$99999
      - $100000-$199999
      - $200000-$499999
      - $500000 or more
      required: true
    - id: 13
      name: net_worth
      label: Net Worth
      hint: Total assets minus liabilities
      type: select_one
      options:
      - Under $100000
      - $100000-$499999
      - $500000-$999999
      - $1000000-$4999999
      - $5000000 or more
      required: true
    - id: 14
      name: investment_experience
      label: Investment Experience
      hint: Your experience level
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Professional
      required: true
    - id: 15
      name: liquidity_needs
      label: Liquidity Needs
      hint: When will you need access
      type: select_one
      options:
      - Within 1 year
      - 1-3 years
      - 3-5 years
      - 5+ years
      - No specific needs
      required: true
    - id: 16
      name: tax_considerations
      label: Tax Considerations
      hint: Any tax concerns
      type: select_one
      options:
      - Tax-Deferred Preferred
      - Tax-Free Preferred
      - Taxable Acceptable
      - No Preference
      required: false
    - id: 17
      name: existing_portfolio
      label: Existing Investment Portfolio
      hint: Do you have other investments
      type: select_one
      options:
      - Yes, diversified
      - Yes, limited
      - No, first investment
      required: true
    - id: 18
      name: financial_advisor
      label: Financial Advisor
      hint: Do you have an advisor
      type: select_one
      options:
      - Yes, will provide name
      - No, need recommendation
      - Self-Directed
      required: true
    - id: 19
      name: advisor_name
      label: Advisor Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 20
      name: special_instructions
      label: Special Instructions
      hint: Any specific requirements
      type: text
      options: []
      required: false
    - id: 21
      name: terms_acceptance
      label: Terms Acceptance
      hint: Do you agree to terms
      type: select_one
      options:
      - Yes, I agree
      - 'False'
      required: true
    - id: 22
      name: risk_disclosure_acknowledgment
      label: Risk Disclosure Acknowledgment
      hint: Have you read risk disclosure
      type: select_one
      options:
      - Yes, I acknowledge
      - 'False'
      required: true
    - id: 23
      name: signature_date
      label: Signature Date
      hint: Date of application
      type: date
      options: []
      required: true
