inputSchema:
  type: object
  properties:
    title: Approval Request Form
    pages:
    - id: 1
      name: requester_info
      label: Requester Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: requester_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: requester_title
      label: Position or Title
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: requester_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: requester_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: request_info
      label: Request Details
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: request_type
      label: Type of Request
      hint: null
      type: select_one
      options:
      - Budget Approval
      - Travel Approval
      - Purchase Approval
      - Personnel Approval
      - Leave Approval
      - Other
      required: true
    - id: 8
      name: request_description
      label: Detailed Description
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: cost_amount
      label: Amount or Cost (if applicable)
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: justification
      label: Business Justification
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: timeline
      label: Required Timeline
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: approval_chain
      label: Submit to Approver
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: urgency
      label: Urgency Level
      hint: null
      type: select_one
      options:
      - Routine
      - Timely
      - Urgent
      required: false
