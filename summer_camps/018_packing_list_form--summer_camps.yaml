inputSchema:
  type: object
  properties:
    title: Packing List Form
    pages:
    - id: 1
      name: general_information
      label: General Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: packing_clothing
      label: What type of clothing do you want to pack?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medications
      label: Do you have any medications that you need to pack?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: equipment
      label: List any special equipment you need to bring?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: camp_date
      label: What is your camp date?
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 6
      name: arrival_time
      label: What time do you need to arrive at camp?
      hint: HH -MM AM/PM
      type: time
      options: []
      required: false
    - id: 7
      name: phone_number
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: email
      label: What is your email?
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: medical_conditions
      label: Do you have any medical conditions that we need to know about?
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: dietary_requirements
      label: Do you have any dietary requirements?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: additional_info
      label: Is there anything else you want to tell us about yourself?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: questions_concerns
      label: Do you have any questions or concerns about camp?
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: transportation
      label: Do you need any help with transportation?
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 14
      name: more_info
      label: Do you have any other information you want to share?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: child_info
      label: Is there anything else you want to say about your child?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: first_time_camper
      label: Are you a first-time camper?
      hint: null
      type: radio
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 17
      name: buddy_program
      label: Do you want to join a buddy program?
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 18
      name: behavioral_comments
      label: Do you have any comments or concerns about your child's behavior?
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: additional_forms
      label: Do you need any additional forms or documentation?
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: final_comments
      label: Is there anything else you want to tell us?
      hint: null
      type: text
      options: []
      required: false
