inputSchema:
  type: object
  properties:
    title: Preschool Summer Camp Enrollment Form
    pages:
    - id: 1
      name: form_header
      label: Form Header
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: name
      label: Parent Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Parent Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: birthdate
      label: Birth Date
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 6
      name: camp_name
      label: Camp Name
      hint: null
      type: select_one
      options:
      - Camp A
      - Camp B
      - Camp C
      required: false
    - id: 7
      name: camp_session
      label: Session
      hint: null
      type: select_one
      options:
      - Session 1
      - Session 2
      - Session 3
      required: false
    - id: 8
      name: student_id
      label: Student ID
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: student_dob
      label: Student DOB
      hint: MM/DD/YYYY
      type: date
      options: []
      required: false
    - id: 11
      name: parent_signature
      label: Parent Signature
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: student_signature
      label: Student Signature
      hint: null
      type: text
      options: []
      required: false
