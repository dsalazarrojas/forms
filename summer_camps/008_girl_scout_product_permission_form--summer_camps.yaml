inputSchema:
  type: object
  properties:
    title: Girl Scout Product Permission Form
    pages:
    - id: 1
      name: name
      label: Girl Scout Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: products
      label: Products
      hint: null
      type: select_multiple
      options:
      - Cookie
      - Candy
      - Book
      - Magazine
      - Calendar
      - Card
      required: true
    - id: 5
      name: quantity
      label: Quantity
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: price
      label: Price
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: assigned_to
      label: Assigned To
      hint: null
      type: select_one
      options:
      - John
      - Jane
      - Bob
      required: true
