inputSchema:
  type: object
  properties:
    title: Summer Camp Survey Form For Parents
    pages:
    - id: 1
      name: summer_camp_survey_form_for_parents_question_1
      label: What did you know about our summer camp?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: summer_camp_survey_form_for_parents_question_2
      label: How do you rate our camp's quality in terms of the program?
      hint: On a scale of 1-5
      type: number
      options: []
      required: false
    - id: 3
      name: summer_camp_survey_form_for_parents_question_3
      label: How would you rate our camp's communication about your child's daily
        activities and schedule?
      hint: null
      type: number
      options: []
      required: false
    - id: 4
      name: summer_camp_survey_form_for_parents_question_4
      label: Do you believe your child's social and emotional growth is one of the
        camp's priorities?
      hint: null
      type: select_one
      options:
      - Very Important
      - Somewhat Important
      - Not Very Important
      - Not at All Important
      required: false
    - id: 5
      name: summer_camp_survey_form_for_parents_question_5
      label: How likely are you to recommend our summer camp to other parents?
      hint: null
      type: select_one
      options:
      - Very Likely
      - Somewhat Likely
      - Not Very Likely
      - Not at All Likely
      required: false
