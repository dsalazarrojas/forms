inputSchema:
  type: object
  properties:
    title: Camp Participant Registration Form
    pages:
    - id: 1
      name: participant_first_name
      label: Participant First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_last_name
      label: Participant Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 4
      name: age
      label: Age
      hint: Current age
      type: number
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 6
      name: school_grade
      label: Current School Grade
      hint: Grade completed
      type: select_one
      options:
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      - College or above
      required: true
    - id: 7
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: false
    - id: 8
      name: parent_guardian_name
      label: Parent or Guardian Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 9
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 10
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 11
      name: home_address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 12
      name: city
      label: City
      hint: City or town
      type: text
      options: []
      required: true
    - id: 13
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 14
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 15
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 16
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 17
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to participant
      type: text
      options: []
      required: true
    - id: 18
      name: medical_conditions
      label: Medical Conditions
      hint: List any health conditions
      type: text
      options: []
      required: true
    - id: 19
      name: allergies
      label: Allergies
      hint: Include food, insect, medication
      type: text
      options: []
      required: true
    - id: 20
      name: current_medications
      label: Current Medications
      hint: List with dosages
      type: text
      options: []
      required: false
    - id: 21
      name: physician_name
      label: Primary Physician Name
      hint: Doctor and clinic
      type: text
      options: []
      required: true
    - id: 22
      name: physician_phone
      label: Physician Phone
      hint: Doctor contact
      type: text
      options: []
      required: true
    - id: 23
      name: insurance_provider
      label: Insurance Provider
      hint: Company name
      type: text
      options: []
      required: false
    - id: 24
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Policy or member ID
      type: text
      options: []
      required: false
    - id: 25
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-free
      - Dairy-free
      - Nut allergy
      - Kosher
      - Halal
      - Other
      required: true
    - id: 26
      name: special_needs
      label: Does the Participant Have Special Needs
      hint: Yes or no
      type: select_one
      options:
      - 'False'
      - Yes - learning disability
      - Yes - physical disability
      - Yes - behavioral support
      - Yes - other
      required: true
    - id: 27
      name: special_needs_details
      label: Special Needs Details
      hint: Describe if yes
      type: text
      options: []
      required: false
    - id: 28
      name: camp_session_selection
      label: Camp Session Selection
      hint: Choose your session
      type: select_one
      options:
      - Session 1 - Week 1
      - Session 2 - Week 2
      - Session 3 - Week 3
      - Session 4 - Week 4
      - Full summer program
      required: true
    - id: 29
      name: transportation_needed
      label: Transportation Needed
      hint: Bus service required
      type: select_one
      options:
      - 'False'
      - Yes - morning only
      - Yes - afternoon only
      - Yes - both ways
      required: true
    - id: 30
      name: t_shirt_size
      label: T-Shirt Size
      hint: For camp shirt
      type: select_one
      options:
      - Youth Small
      - Youth Medium
      - Youth Large
      - Adult Small
      - Adult Medium
      - Adult Large
      - Adult XL
      required: true
    - id: 31
      name: how_heard_about_camp
      label: How Did You Hear About This Camp
      hint: Select all that apply
      type: select_multiple
      options:
      - School referral
      - Friend or family
      - Social media
      - Website
      - Previous attendee
      - Community flyer
      - Other
      required: false
