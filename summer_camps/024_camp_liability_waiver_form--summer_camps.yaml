inputSchema:
  type: object
  properties:
    title: Camp Liability Waiver Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: Full name of the camper or participant
      type: text
      options: []
      required: true
    - id: 2
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Name of the adult providing consent
      type: text
      options: []
      required: true
    - id: 3
      name: emergency_contact
      label: Emergency Contact Phone
      hint: Phone number for emergencies
      type: text
      options: []
      required: true
    - id: 4
      name: medical_conditions
      label: Medical Conditions
      hint: Any relevant medical conditions or allergies
      type: text
      options: []
      required: false
    - id: 5
      name: waiver_text
      label: Liability Waiver Text
      hint: Read the waiver text carefully before agreeing
      type: note
      options: []
      required: true
    - id: 6
      name: consent_signature
      label: Signature Name
      hint: Type full name as electronic signature
      type: text
      options: []
      required: true
    - id: 7
      name: date_signed
      label: Date Signed
      hint: Date the waiver is signed
      type: date
      options: []
      required: true
    - id: 8
      name: photo_release
      label: Photo Release Consent
      hint: Consent to use images for camp promotion
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 9
      name: emergency_medical_consent
      label: Emergency Medical Consent
      hint: Permission to seek medical treatment if needed
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: Any other relevant information
      type: text
      options: []
      required: false
