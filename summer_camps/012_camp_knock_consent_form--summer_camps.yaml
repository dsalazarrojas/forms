inputSchema:
  type: object
  properties:
    title: Camp Knock Consent Form
    pages:
    - id: 1
      name: camper_first_name
      label: Camper First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 2
      name: camper_last_name
      label: Camper Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 5
      name: parent_guardian_name
      label: Parent or Guardian Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 6
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 7
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 8
      name: home_address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: City or town
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 12
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 13
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to camper
      type: text
      options: []
      required: true
    - id: 15
      name: medical_conditions
      label: Medical Conditions
      hint: List any health conditions
      type: text
      options: []
      required: true
    - id: 16
      name: allergies
      label: Allergies
      hint: Include food, insect, medication
      type: text
      options: []
      required: true
    - id: 17
      name: current_medications
      label: Current Medications
      hint: List with dosages
      type: text
      options: []
      required: false
    - id: 18
      name: physician_name
      label: Primary Physician Name
      hint: Doctor and clinic
      type: text
      options: []
      required: true
    - id: 19
      name: physician_phone
      label: Physician Phone
      hint: Doctor contact
      type: text
      options: []
      required: true
    - id: 20
      name: insurance_provider
      label: Insurance Provider
      hint: Company name
      type: text
      options: []
      required: false
    - id: 21
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Policy or member ID
      type: text
      options: []
      required: false
    - id: 22
      name: activity_consent
      label: Consent for Camp Activities
      hint: I give permission for my child to participate
      type: select_one
      options:
      - Yes - I consent
      - No - I do not consent
      required: true
    - id: 23
      name: photo_release
      label: Photo and Video Release
      hint: Permission to use photos for camp purposes
      type: select_one
      options:
      - Yes - I give permission
      - No - do not use photos
      required: true
    - id: 24
      name: transportation_consent
      label: Consent for Transportation
      hint: Permission for camp transportation if needed
      type: select_one
      options:
      - Yes - I consent
      - No - I will provide transportation
      required: true
    - id: 25
      name: medical_treatment_consent
      label: Consent for Medical Treatment
      hint: Permission for emergency medical care
      type: select_one
      options:
      - Yes - I consent
      - No - I do not consent
      required: true
    - id: 26
      name: sun_protection_consent
      label: Consent for Sunscreen Application
      hint: Permission for staff to apply sunscreen
      type: select_one
      options:
      - Yes - I consent
      - No - I will provide my own
      required: true
    - id: 27
      name: code_of_conduct_agreement
      label: Code of Conduct Agreement
      hint: Camper agrees to follow camp rules
      type: select_one
      options:
      - Yes - we agree
      - 'False'
      required: true
    - id: 28
      name: liability_waiver
      label: Liability Waiver Acknowledgement
      hint: I understand and accept the liability waiver
      type: select_one
      options:
      - Yes - I accept
      - No - I do not accept
      required: true
    - id: 29
      name: signature
      label: Parent or Guardian Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 30
      name: signature_date
      label: Date Signed
      hint: Date of signature
      type: date
      options: []
      required: true
