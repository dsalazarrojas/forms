inputSchema:
  type: object
  properties:
    title: Camp Staff Expression Of Interest
    pages:
    - id: 1
      name: full_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 5
      name: address
      label: Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: City or town
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 9
      name: interest_type
      label: Type of Interest
      hint: Select your interest
      type: select_one
      options:
      - Volunteer staff member
      - Paid staff member
      - Internship
      - Ministry partner
      - Activity specialist
      - Support staff
      required: true
    - id: 10
      name: roles_interested_in
      label: Roles You Are Interested In
      hint: Select all that apply
      type: select_multiple
      options:
      - Camp counselor
      - Activity leader
      - Lifeguard
      - Worship leader
      - Sports coach
      - Arts and crafts
      - Nature guide
      - Kitchen staff
      - Maintenance
      - Administration
      - Medical staff
      - Other
      required: true
    - id: 11
      name: availability
      label: Your Availability
      hint: Select all that apply
      type: select_multiple
      options:
      - Session 1 only
      - Session 2 only
      - Session 3 only
      - Session 4 only
      - Full summer
      - Weekends only
      - Flexible
      required: true
    - id: 12
      name: previous_volunteer_experience
      label: Do You Have Previous Volunteer Experience
      hint: Yes or no
      type: select_one
      options:
      - Yes - with youth
      - Yes - with adults
      - Yes - at a camp
      - No - first time
      required: true
    - id: 13
      name: volunteer_experience_details
      label: Describe Your Volunteer Experience
      hint: Provide details
      type: text
      options: []
      required: false
    - id: 14
      name: skills_and_talents
      label: Skills and Talents You Can Offer
      hint: Select all that apply
      type: select_multiple
      options:
      - Youth mentoring
      - Sports coaching
      - Music or worship
      - Arts and crafts
      - Outdoor skills
      - First aid or medical
      - Cooking
      - Maintenance or repair
      - Photography
      - Technology
      - Administration
      - Counseling
      - Other
      required: true
    - id: 15
      name: certifications
      label: Relevant Certifications
      hint: Select all that apply
      type: select_multiple
      options:
      - None
      - CPR
      - First aid
      - Lifeguard
      - Water safety
      - Outdoor leadership
      - Youth ministry
      - Teaching
      - Coaching
      - Other
      required: false
    - id: 16
      name: why_interested
      label: Why Are You Interested in Serving at This Camp
      hint: Your motivation
      type: text
      options: []
      required: true
    - id: 17
      name: spiritual_background
      label: Tell Us About Your Spiritual Background
      hint: Optional
      type: text
      options: []
      required: false
    - id: 18
      name: age_group_preference
      label: Preferred Age Group to Work With
      hint: Select all that apply
      type: select_multiple
      options:
      - 5-7 years
      - 8-10 years
      - 11-13 years
      - 14-16 years
      - 17-18 years
      - No preference
      required: true
    - id: 19
      name: comfortable_with_overnight
      label: Are You Comfortable with Overnight Camp Duties
      hint: Yes or no
      type: select_one
      options:
      - Yes - fully comfortable
      - Somewhat comfortable
      - No - day only
      required: true
    - id: 20
      name: team_or_individual
      label: Do You Prefer Working in a Team or Independently
      hint: Select preference
      type: select_one
      options:
      - Prefer team
      - Prefer independent
      - Comfortable with both
      required: true
    - id: 21
      name: references_available
      label: Can You Provide References
      hint: Yes or no
      type: select_one
      options:
      - Yes - 3 references
      - Yes - 2 references
      - Yes - 1 reference
      - false
      required: true
    - id: 22
      name: background_check_willing
      label: Are You Willing to Undergo a Background Check
      hint: Yes or no
      type: select_one
      options:
      - Yes - willing
      - false
      required: true
    - id: 23
      name: how_heard_about_camp
      label: How Did You Hear About This Camp
      hint: Select all that apply
      type: select_multiple
      options:
      - Church referral
      - Friend or family
      - Social media
      - Website
      - Previous volunteer
      - Community event
      - Other
      required: false
    - id: 24
      name: additional_comments
      label: Additional Comments or Questions
      hint: Anything else to share
      type: text
      options: []
      required: false
    - id: 25
      name: signature
      label: Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 26
      name: signature_date
      label: Date Signed
      hint: Date
      type: date
      options: []
      required: true
