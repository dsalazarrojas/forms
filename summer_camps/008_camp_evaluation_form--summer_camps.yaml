inputSchema:
  type: object
  properties:
    title: Camp Evaluation Form
    pages:
      - id: 1
        name: camper_name
        label: Camper Name
        hint: Full name of camper
        type: text
        options: []
        required: true
      - id: 2
        name: parent_name
        label: Parent or Guardian Name
        hint: Name of parent completing evaluation
        type: text
        options: []
        required: true
      - id: 3
        name: email
        label: Email Address
        hint: Contact email
        type: email
        options: []
        required: true
      - id: 4
        name: camp_session
        label: Camp Session Attended
        hint: Which session did your camper attend
        type: select_one
        options:
          - Session 1 - Week 1
          - Session 2 - Week 2
          - Session 3 - Week 3
          - Session 4 - Week 4
          - Full summer program
          - Specialty camp
        required: true
      - id: 5
        name: overall_satisfaction
        label: Overall Satisfaction with Camp
        hint: Rate your overall experience
        type: select_one
        options:
          - 5 - Excellent
          - 4 - Very Good
          - 3 - Good
          - 2 - Fair
          - 1 - Poor
        required: true
      - id: 6
        name: value_for_money
        label: Value for Money
        hint: Was the camp worth the cost
        type: select_one
        options:
          - Excellent value
          - Good value
          - Fair value
          - Poor value
          - Very poor value
        required: true
      - id: 7
        name: staff_friendliness
        label: Staff Friendliness and Professionalism
        hint: Rate the camp staff
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 8
        name: counselor_rating
        label: Counselor Quality
        hint: Rate your camper counselor
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 9
        name: activity_variety
        label: Variety of Activities Offered
        hint: Rate the activity selection
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 10
        name: favorite_activity
        label: What Was Your Camper Favorite Activity
        hint: Select the favorite
        type: select_one
        options:
          - Sports and games
          - Arts and crafts
          - Swimming
          - Nature activities
          - Music and dance
          - Science experiments
          - Team building
          - Field trips
          - Free play time
        required: true
      - id: 11
        name: least_favorite_activity
        label: Least Favorite Activity
        hint: What could be improved
        type: text
        options: []
        required: false
      - id: 12
        name: facility_cleanliness
        label: Facility Cleanliness
        hint: Rate the camp facilities
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 13
        name: safety_measures
        label: Safety Measures
        hint: How would you rate camp safety
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 14
        name: communication_quality
        label: Quality of Camp Communication
        hint: Rate communication from camp
        type: select_one
        options:
          - Excellent
          - Very Good
          - Good
          - Fair
          - Poor
        required: true
      - id: 15
        name: camper_enjoyment
        label: How Much Did Your Camper Enjoy Camp
        hint: Rate their enjoyment
        type: select_one
        options:
          - Loved it
          - Enjoyed it a lot
          - Enjoyed it somewhat
          - Did not enjoy much
          - Did not enjoy at all
        required: true
      - id: 16
        name: social_experience
        label: Social Experience
        hint: Did your camper make friends
        type: select_one
        options:
          - Made many friends
          - Made a few friends
          - Made one friend
          - Did not make friends
          - Already had friends attending
        required: true
      - id: 17
        name: return_likelihood
        label: How Likely Are You to Return Next Year
        hint: Rate likelihood
        type: select_one
        options:
          - Definitely will return
          - Very likely to return
          - Somewhat likely
          - Unlikely to return
          - Definitely will not return
        required: true
      - id: 18
        name: recommend_to_others
        label: Would You Recommend This Camp to Others
        hint: Yes or no
        type: select_one
        options:
          - Definitely yes
          - Probably yes
          - Not sure
          - Probably no
          - Definitely no
        required: true
      - id: 19
        name: improvements_suggested
        label: What Improvements Would You Suggest
        hint: Your suggestions
        type: text
        options: []
        required: false
      - id: 20
        name: additional_comments
        label: Additional Comments
        hint: Any other feedback
        type: text
        options: []
        required: false
