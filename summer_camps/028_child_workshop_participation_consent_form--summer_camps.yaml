inputSchema:
  type: object
  properties:
    title: Child Workshop Participation Consent Form
    pages:
    - id: 1
      name: consent_date
      label: Consent Date
      hint: Date of workshop consent
      type: date
      options: []
      required: true
    - id: 2
      name: parent_guardian_first_name
      label: Parent or Guardian First Name
      hint: Legal first name of parent or guardian
      type: text
      options: []
      required: true
    - id: 3
      name: parent_guardian_last_name
      label: Parent or Guardian Last Name
      hint: Legal last name of parent or guardian
      type: text
      options: []
      required: true
    - id: 4
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Primary email address for contact
      type: email
      options: []
      required: true
    - id: 5
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Primary phone number for contact
      type: text
      options: []
      required: true
    - id: 6
      name: child_first_name
      label: Child First Name
      hint: Legal first name of the child
      type: text
      options: []
      required: true
    - id: 7
      name: child_last_name
      label: Child Last Name
      hint: Legal last name of the child
      type: text
      options: []
      required: true
    - id: 8
      name: child_date_of_birth
      label: Child Date of Birth
      hint: Please provide the child's birth date
      type: date
      options: []
      required: true
    - id: 9
      name: child_age
      label: Child Age
      hint: Current age of the child in years
      type: number
      options: []
      required: true
    - id: 10
      name: child_gender
      label: Child Gender
      hint: Select the child's gender
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: true
    - id: 11
      name: workshop_name
      label: Workshop Name
      hint: Name of the workshop
      type: text
      options: []
      required: true
    - id: 12
      name: workshop_dates
      label: Workshop Dates
      hint: Dates when workshop will be held
      type: text
      options: []
      required: true
    - id: 13
      name: workshop_location
      label: Workshop Location
      hint: Location where workshop will be held
      type: text
      options: []
      required: true
    - id: 14
      name: workshop_type
      label: Workshop Type
      hint: What type of workshop is this?
      type: select_one
      options:
      - Arts and crafts
      - Science and technology
      - Sports and athletics
      - Music and performing arts
      - Academic enrichment
      - Life skills
      - Outdoor adventure
      - Other
      required: true
    - id: 15
      name: full_day_or_half_day
      label: Workshop Schedule
      hint: Is this a full-day or half-day workshop?
      type: select_one
      options:
      - Full day
      - Half day morning
      - Half day afternoon
      - Multiple sessions
      required: true
    - id: 16
      name: transportation_needed
      label: Transportation Needed
      hint: Does your child need transportation to the workshop?
      type: select_one
      options:
      - Yes, to workshop
      - Yes, from workshop
      - Yes, both ways
      - No, will provide own transportation
      required: true
    - id: 17
      name: meal_requirements
      label: Meal Requirements
      hint: Will your child need meals provided?
      type: select_one
      options:
      - Yes, breakfast and lunch
      - Yes, lunch only
      - Yes, snacks only
      - No, will bring own food
      required: true
    - id: 18
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: List any dietary restrictions or food allergies
      type: text
      options: []
      required: true
    - id: 19
      name: medical_conditions
      label: Medical Conditions
      hint: List any medical conditions staff should know about
      type: text
      options: []
      required: true
    - id: 20
      name: current_medications
      label: Current Medications
      hint: List any medications child will need during workshop
      type: text
      options: []
      required: false
    - id: 21
      name: special_needs
      label: Special Needs or Accommodations
      hint: Does your child require any special accommodations?
      type: text
      options: []
      required: false
    - id: 22
      name: behavioral_considerations
      label: Behavioral Considerations
      hint: Any behavioral considerations staff should be aware of
      type: text
      options: []
      required: false
    - id: 23
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of emergency contact
      type: text
      options: []
      required: true
    - id: 24
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
    - id: 25
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to child
      type: select_one
      options:
      - Parent
      - Guardian
      - Grandparent
      - Aunt or Uncle
      - Family friend
      - Other
      required: true
    - id: 26
      name: authorized_pickup_persons
      label: Authorized Pickup Persons
      hint: List names of people authorized to pick up your child
      type: text
      options: []
      required: true
    - id: 27
      name: photo_video_consent
      label: Photo and Video Consent
      hint: Do you consent to your child being photographed or filmed?
      type: select_one
      options:
      - Yes, for any purpose
      - Yes, for internal use only
      - Yes, but no face photos
      - No, do not consent
      required: true
    - id: 28
      name: medical_treatment_consent
      label: Medical Treatment Consent
      hint: Do you consent to emergency medical treatment if needed?
      type: select_one
      options:
      - Yes, I fully consent
      - Yes, but contact me first
      - No, do not consent
      required: true
    - id: 29
      name: workshop_fee_payment
      label: Workshop Fee Payment
      hint: How will you pay the workshop fee?
      type: select_one
      options:
      - Paid in full
      - Payment plan requested
      - Scholarship requested
      - Fee waived
      - Not applicable
      required: true
    - id: 30
      name: additional_comments
      label: Additional Comments
      hint: Any additional information you would like to share
      type: text
      options: []
      required: false
    - id: 31
      name: parent_guardian_signature
      label: Parent or Guardian Signature
      hint: Type your full name as your electronic signature
      type: text
      options: []
      required: true
    - id: 32
      name: signature_date
      label: Signature Date
      hint: Date of electronic signature
      type: date
      options: []
      required: true
