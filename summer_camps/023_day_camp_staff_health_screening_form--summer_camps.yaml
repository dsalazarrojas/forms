inputSchema:
  type: object
  properties:
    title: Day Camp Staff Health Screening Form
    pages:
    - id: 1
      name: camp_staff_health_screening_form
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: staff_information_form
      label: Staff Information
      hint: This template is used to screen staff members before the start of a day
        camp.
      type: text
      options: []
      required: false
    - id: 3
      name: medical_history_form
      label: Medical History Form
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: allergy_form
      label: Allergies
      hint: List all known allergies
      type: select_multiple
      options:
      - Peanuts
      - Tree Nuts
      - Shellfish
      required: false
    - id: 5
      name: medical_condition_form
      label: Medical Condition
      hint: List any medical conditions you're aware of
      type: text
      options: []
      required: false
    - id: 6
      name: staff_medical_clearance_form
      label: Staff Medical Clearance
      hint: Clear staff for medical clearance
      type: select_one
      options:
      - Cleared
      - Not Cleared
      required: false
    - id: 7
      name: medical_history_form_2
      label: Medical History Form 2
      hint: List any past medical history
      type: text
      options: []
      required: false
    - id: 8
      name: vaccination_form
      label: Vaccination
      hint: List any past vaccinations
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact_information_form
      label: Emergency Contact Information
      hint: Provide emergency contact info
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_information_form_2
      label: Emergency Contact Information Form 2
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: medical_record_request_form
      label: Medical Record Request Form
      hint: null
      type: select_one
      options:
      - Request
      - Not Request
      required: false
    - id: 12
      name: medication_form
      label: Medication
      hint: List any ongoing medication
      type: select_multiple
      options:
      - Option 1
      - Medication 1
      - Medication 2
      - Medication 3
      required: false
    - id: 13
      name: medical_history_form_3
      label: Medical History Form 3
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: staff_certification_form
      label: Staff Certification
      hint: List any certifications you hold
      type: text
      options: []
      required: false
    - id: 15
      name: staff_credential_form
      label: Staff Credibility
      hint: Provide staff's level of credibility
      type: select_one
      options:
      - Low
      - Medium
      - High
      required: false
