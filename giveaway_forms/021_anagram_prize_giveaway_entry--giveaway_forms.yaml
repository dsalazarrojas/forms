inputSchema:
  type: object
  properties:
    title: Anagram Prize Giveaway Entry
    pages:
    - id: 1
      name: section_giveaway_entry
      label: -- Giveaway Entry Form --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: social_media_handle
      label: Social Media Handle
      hint: e.g. @username
      type: text
      options: []
      required: false
    - id: 5
      name: section_anagram_challenge
      label: -- The Anagram Challenge --
      hint: Solve the anagram to enter
      type: note
      options: []
      required: false
    - id: 6
      name: anagram_clue
      label: Solve this anagram - LISTEN
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: your_answer
      label: Your Answer
      hint: Hint - It is something you do with your eyes
      type: text
      options: []
      required: true
    - id: 8
      name: section_submission_info
      label: -- Submission Info --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: how_did_you_hear_about_us
      label: How did you hear about this giveaway?
      hint: null
      type: select_one
      options:
      - Instagram
      - Twitter / X
      - Email
      - Friend
      - Other
      required: true
    - id: 10
      name: country_of_residence
      label: Country of Residence
      hint: null
      type: select_one
      options:
      - USA
      - UK
      - Canada
      - Australia
      - Other
      required: true
    - id: 11
      name: agree_to_terms
      label: Do you agree to the Giveaway Terms and Conditions?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: subscribe_to_newsletter
      label: Would you like to subscribe to our newsletter?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
