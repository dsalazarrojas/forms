inputSchema:
  type: object
  properties:
    title: Claim Your Free Item
    pages:
    - id: 1
      name: claimant_name
      label: Claimant name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 2
      name: shipping_address
      label: Shipping address
      hint: Street city postal code
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For shipping updates
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone number
      hint: Optional contact phone
      type: text
      options: []
      required: false
    - id: 5
      name: item_choice
      label: Item choice
      hint: Select free item
      type: select_one
      options:
      - Item A
      - Item B
      - Item C
      required: true
    - id: 6
      name: coupon_code
      label: Coupon code
      hint: Enter claim code if provided
      type: text
      options: []
      required: false
    - id: 7
      name: eligibility_confirmation
      label: Eligibility confirmation
      hint: Confirm eligibility criteria met
      type: select_one
      options:
      - I confirm
      - I do not confirm
      required: true
    - id: 8
      name: delivery_timeframe
      label: Expected delivery timeframe
      hint: Note typical shipping times
      type: note
      options: []
      required: false
    - id: 9
      name: privacy_consent
      label: Consent to use data for fulfillment
      hint: Agree to terms for processing
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 10
      name: submission_date
      label: Submission date
      hint: Use current date
      type: date
      options: []
      required: true
