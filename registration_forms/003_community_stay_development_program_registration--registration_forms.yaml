inputSchema:
  type: object
  properties:
    title: Community Stay Development Program Registration
    pages:
    - id: 1
      name: applicant_full_name
      label: Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: applicant_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 3
      name: applicant_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 5
      name: mailing_address
      label: Mailing Address
      hint: Street address, city, state, zip
      type: text
      options: []
      required: true
    - id: 6
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name of emergency contact
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
    - id: 8
      name: program_interest
      label: Which development program are you interested in?
      hint: Select your primary interest
      type: select_one
      options:
      - Leadership Development
      - Community Engagement
      - Skills Training
      - Cultural Immersion
      - Environmental Stewardship
      - Youth Mentorship
      - Career Development
      - Civic Participation
      required: true
    - id: 9
      name: program_duration
      label: Preferred Program Duration
      hint: How long can you commit?
      type: select_one
      options:
      - 1 Week
      - 2 Weeks
      - 1 Month
      - 3 Months
      - 6 Months
      - 1 Year
      required: true
    - id: 10
      name: preferred_start_date
      label: Preferred Start Date
      hint: When would you like to begin?
      type: date
      options: []
      required: true
    - id: 11
      name: prior_experience
      label: Do you have prior experience in this field?
      hint: Related volunteer or work experience
      type: select_one
      options:
      - No Experience
      - Some Experience (less than 1 year)
      - Moderate Experience (1-3 years)
      - Extensive Experience (3+ years)
      required: true
    - id: 12
      name: motivation_statement
      label: Why do you want to join this program?
      hint: Briefly describe your motivation and goals
      type: text
      options: []
      required: true
    - id: 13
      name: skills_to_contribute
      label: What skills can you contribute to the program?
      hint: List relevant skills or talents
      type: text
      options: []
      required: false
    - id: 14
      name: accommodation_needs
      label: Do you have any accommodation needs?
      hint: Dietary, accessibility, or other requirements
      type: text
      options: []
      required: false
    - id: 15
      name: transportation_method
      label: How will you travel to the program location?
      hint: Your primary mode of transportation
      type: select_one
      options:
      - Personal Vehicle
      - Public Transportation
      - Carpool
      - Program Transportation
      - Walking/Biking
      - Other
      required: true
    - id: 16
      name: medical_conditions
      label: Do you have any medical conditions we should know about?
      hint: Conditions that may require attention during the program
      type: text
      options: []
      required: false
    - id: 17
      name: medical_insurance_provider
      label: Medical Insurance Provider
      hint: Name of your insurance company
      type: text
      options: []
      required: false
    - id: 18
      name: consent_background_check
      label: I consent to a background check if required
      hint: Some programs require background verification
      type: select_one
      options:
      - Yes, I Consent
      - No, I Do Not Consent
      required: true
    - id: 19
      name: consent_media_use
      label: I consent to photos/videos being taken for promotional use
      hint: Program documentation and marketing materials
      type: select_one
      options:
      - Yes, I Consent
      - No, I Do Not Consent
      required: true
    - id: 20
      name: referral_source
      label: How did you hear about this program?
      hint: Where did you learn about us?
      type: select_one
      options:
      - Social Media
      - Friend or Family
      - Community Organization
      - School or University
      - Workplace
      - Website
      - Email Newsletter
      - Other
      required: true
    - id: 21
      name: registration_date
      label: Registration Date
      hint: Today's date
      type: date
      options: []
      required: true
