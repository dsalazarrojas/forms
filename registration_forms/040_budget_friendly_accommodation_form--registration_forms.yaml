inputSchema:
  type: object
  properties:
    title: Budget Friendly Accommodation Form
    pages:
    - id: 1
      name: guest_name
      label: Guest Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: guest_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: guest_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: number_of_guests
      label: Number of Guests
      hint: Total people staying
      type: number
      options: []
      required: true
    - id: 5
      name: check_in_date
      label: Check-In Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: check_out_date
      label: Check-Out Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: destination_city
      label: Destination City or Location
      hint: Where are you traveling to
      type: text
      options: []
      required: true
    - id: 8
      name: accommodation_type
      label: Accommodation Type Preferred
      hint: null
      type: select_one
      options:
      - Hostel
      - Budget Hotel
      - Guesthouse
      - Shared Apartment
      - Airbnb or Vacation Rental
      - Bed and Breakfast
      - Camping
      - Other
      required: true
    - id: 9
      name: room_type
      label: Room Type
      hint: null
      type: select_one
      options:
      - Single Room
      - Double Room
      - Triple Room
      - Shared Dormitory
      - Full Apartment
      - Other
      required: true
    - id: 10
      name: budget_range
      label: Budget Range per Night
      hint: null
      type: select_one
      options:
      - Under $30
      - $30-50
      - $50-75
      - $75-100
      - $100+
      required: true
    - id: 11
      name: amenities_needed
      label: Essential Amenities
      hint: Select all that apply
      type: select_multiple
      options:
      - Free WiFi
      - Kitchen
      - Breakfast
      - Laundry
      - Air Conditioning
      - Heating
      - Parking
      - Pet-Friendly
      required: false
    - id: 12
      name: accessibility_needs
      label: Accessibility Requirements
      hint: Wheelchair, elevator, etc
      type: text
      options: []
      required: false
    - id: 13
      name: dietary_requirements
      label: Dietary Restrictions
      hint: If breakfast is included
      type: text
      options: []
      required: false
    - id: 14
      name: location_preference
      label: Location Preference
      hint: Downtown, near transit, quiet area, etc
      type: text
      options: []
      required: false
    - id: 15
      name: booking_flexibility
      label: Booking Flexibility
      hint: null
      type: select_one
      options:
      - Fixed dates required
      - Flexible dates
      - Open to alternatives
      required: true
    - id: 16
      name: price_guarantee
      label: Price Guarantee Important
      hint: Do you need price locked in advance
      type: select_one
      options:
      - Yes, critical
      - Somewhat important
      - Not important
      required: true
    - id: 17
      name: contact_preference
      label: Preferred Contact Method
      hint: For booking confirmation
      type: select_one
      options:
      - Email
      - Phone
      - Text Message
      - WhatsApp
      required: true
