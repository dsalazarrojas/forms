inputSchema:
  type: object
  properties:
    title: Surfing Club Membership Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: First name of the applicant
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: Date of birth of the applicant
      type: date
      options: []
      required: false
    - id: 6
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Member
      - Member - Family
      - Member - Student
      - Member - Senior
      required: false
    - id: 7
      name: membership_duration
      label: Membership Duration
      hint: null
      type: select_multiple
      options:
      - Month
      - Six Months
      - Year
      - Other
      required: false
    - id: 8
      name: membership_start_date
      label: Membership Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: membership_end_date
      label: Membership End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Bank Transfer
      - PayPal
      - Cash
      required: false
    - id: 11
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
