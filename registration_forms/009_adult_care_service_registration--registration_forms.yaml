inputSchema:
  type: object
  properties:
    title: Adult Care Service Registration
    pages:
    - id: 1
      name: client_first_name
      label: Client First Name
      hint: First name of the adult seeking care
      type: text
      options: []
      required: true
    - id: 2
      name: client_last_name
      label: Client Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: client_date_of_birth
      label: Date of Birth
      hint: Birth date
      type: date
      options: []
      required: true
    - id: 4
      name: client_email
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 5
      name: client_phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 6
      name: client_address
      label: Residential Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 7
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of designated emergency contact
      type: text
      options: []
      required: true
    - id: 8
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number for emergency contact
      type: text
      options: []
      required: true
    - id: 9
      name: emergency_contact_relationship
      label: Relationship to Client
      hint: How they relate to you
      type: text
      options: []
      required: true
    - id: 10
      name: primary_caregiver
      label: Primary Caregiver Name
      hint: If applicable, name of primary caregiver
      type: text
      options: []
      required: false
    - id: 11
      name: insurance_type
      label: Insurance Type
      hint: Medicare, Medicaid, Private, or Other
      type: select_one
      options:
      - Medicare
      - Medicaid
      - Private Insurance
      - Veterans Benefits
      - Self-Pay
      - Other
      required: true
    - id: 12
      name: insurance_provider
      label: Insurance Provider Name
      hint: Name of insurance company
      type: text
      options: []
      required: true
    - id: 13
      name: policy_number
      label: Policy Number
      hint: Insurance policy number
      type: text
      options: []
      required: true
    - id: 14
      name: medical_conditions
      label: Primary Medical Conditions
      hint: List any chronic conditions or diagnoses
      type: text
      options: []
      required: false
    - id: 15
      name: current_medications
      label: Current Medications
      hint: List all medications currently taking
      type: text
      options: []
      required: true
    - id: 16
      name: allergies
      label: Allergies and Adverse Reactions
      hint: Any known allergies or reactions
      type: text
      options: []
      required: false
    - id: 17
      name: primary_physician
      label: Primary Physician Name
      hint: Name of main doctor
      type: text
      options: []
      required: true
    - id: 18
      name: physician_phone
      label: Physician Contact Number
      hint: Doctor's office phone
      type: text
      options: []
      required: false
    - id: 19
      name: care_services_needed
      label: Care Services Needed
      hint: Select types of care services
      type: select_multiple
      options:
      - Assistance with Daily Living
      - Medication Management
      - Transportation
      - Meal Preparation
      - Housekeeping
      - Companionship
      - Medical Care Support
      required: true
    - id: 20
      name: service_frequency
      label: Preferred Service Frequency
      hint: How often services are needed
      type: select_one
      options:
      - Daily
      - Several Times Weekly
      - Weekly
      - Bi-weekly
      - Monthly
      - As Needed
      required: true
    - id: 21
      name: preferred_caregiver_gender
      label: Caregiver Gender Preference
      hint: Any preference for caregiver gender
      type: select_one
      options:
      - Male
      - Female
      - No Preference
      required: false
    - id: 22
      name: special_requirements
      label: Special Requirements or Requests
      hint: Any special needs or preferences
      type: text
      options: []
      required: false
    - id: 23
      name: agree_terms
      label: Agree to Terms and Conditions
      hint: Accept care service terms
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
