inputSchema:
  type: object
  properties:
    title: Academic Interview Registration Form
    pages:
    - id: 1
      name: registration_details
      label: -- Registration Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_name
      label: Applicant full name
      hint: Full name of interviewee
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact email
      hint: Preferred email for scheduling
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Contact phone number
      hint: Include country code if international
      type: text
      options: []
      required: false
    - id: 5
      name: position_applied
      label: Position or role for interview
      hint: Job title or academic role
      type: text
      options: []
      required: true
    - id: 6
      name: availability_preference
      label: Availability preference
      hint: Select preferred date range or times
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 7
      name: interview_format
      label: Preferred interview format
      hint: In person or virtual
      type: select_one
      options:
      - In person
      - Virtual
      - Either
      required: true
    - id: 8
      name: additional_requirements
      label: Additional requirements
      hint: Accessibility needs or accommodations
      type: text
      options: []
      required: false
    - id: 9
      name: consent_recording
      label: Consent to record interview
      hint: Permission for recording if applicable
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: references
      label: References
      hint: Optional references or links to portfolio
      type: text
      options: []
      required: false
