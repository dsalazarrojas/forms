inputSchema:
  type: object
  properties:
    title: Course Selection Form
    pages:
    - id: 1
      name: main_page
      label: Main Page
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: course_selection_page
      label: Which course are you interested in?
      hint: null
      type: select_one
      options:
      - Math
      - Science
      - English
      required: true
    - id: 3
      name: other_projects
      label: Do you have any other projects?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 4
      name: other_info
      label: What is your other info?
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: age
      label: What is your age?
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: What is the date of birth?
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: time_of_selection
      label: What is your time of selection?
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: note
      label: What is your note about other projects?
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: course_selection_multiple
      label: Which course are you interested in (Select Multiple)?
      hint: null
      type: select_multiple
      options:
      - Math
      - Science
      - English
      required: true
    - id: 10
      name: confirm
      label: Is this correct?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: submit_button
      label: Submit
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: other_projects2
      label: Do you have any other projects (Select One)?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
