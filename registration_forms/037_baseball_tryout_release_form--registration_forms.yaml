inputSchema:
  type: object
  properties:
    title: Baseball Tryout Release Form
    pages:
    - id: 1
      name: player_first_name
      label: Player First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 2
      name: player_last_name
      label: Player Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: player_date_of_birth
      label: Player Date of Birth
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 4
      name: player_age
      label: Player Age
      hint: Current age
      type: number
      options: []
      required: true
    - id: 5
      name: parent_guardian_name
      label: Parent or Guardian Full Name
      hint: Legal guardian
      type: text
      options: []
      required: true
    - id: 6
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: For communications
      type: email
      options: []
      required: true
    - id: 7
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 8
      name: home_address
      label: Home Address
      hint: Complete street address
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: Your city
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: Your state
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 12
      name: tryout_date
      label: Tryout Date
      hint: Date of tryout
      type: date
      options: []
      required: true
    - id: 13
      name: team_organization
      label: Team or Organization
      hint: Which team
      type: text
      options: []
      required: true
    - id: 14
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: Any conditions we should know
      type: text
      options: []
      required: false
    - id: 15
      name: current_medications
      label: Current Medications
      hint: List any medications
      type: text
      options: []
      required: false
    - id: 16
      name: insurance_provider
      label: Medical Insurance Provider
      hint: Insurance company
      type: text
      options: []
      required: true
    - id: 17
      name: policy_number
      label: Policy Number
      hint: Insurance policy number
      type: text
      options: []
      required: false
    - id: 18
      name: physician_name
      label: Primary Care Physician Name
      hint: Doctor name
      type: text
      options: []
      required: false
    - id: 19
      name: physician_phone
      label: Physician Phone
      hint: Doctor phone number
      type: text
      options: []
      required: false
    - id: 20
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 21
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 22
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: How are they related
      type: text
      options: []
      required: true
    - id: 23
      name: assumption_of_risk
      label: Assumption of Risk
      hint: I understand tryouts involve physical activity and risk
      type: select_one
      options:
      - I understand and accept the risks
      - I do not accept
      required: true
    - id: 24
      name: liability_release
      label: Liability Release
      hint: I release the organization from liability
      type: select_one
      options:
      - I agree to release liability
      - I do not agree
      required: true
    - id: 25
      name: medical_authorization
      label: Medical Treatment Authorization
      hint: I authorize emergency medical treatment
      type: select_one
      options:
      - I authorize medical treatment
      - I do not authorize
      required: true
    - id: 26
      name: photo_video_consent
      label: Photo and Video Consent
      hint: May organization use photos or videos
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 27
      name: code_of_conduct
      label: Code of Conduct Agreement
      hint: Will follow all rules and instructions
      type: select_one
      options:
      - I agree to follow all rules
      - I do not agree
      required: true
    - id: 28
      name: minor_participant
      label: Is Participant Under 18
      hint: Parental consent required
      type: select_one
      options:
      - Yes, participant is a minor
      - No, participant is 18 or older
      required: true
    - id: 29
      name: parent_guardian_signature
      label: Parent or Guardian Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 30
      name: participant_signature
      label: Participant Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 31
      name: signature_date
      label: Signature Date
      hint: Date signed
      type: date
      options: []
      required: true
    - id: 32
      name: witness_signature
      label: Witness Signature
      hint: For office use
      type: text
      options: []
      required: false
