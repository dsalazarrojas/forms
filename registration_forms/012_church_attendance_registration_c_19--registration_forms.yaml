inputSchema:
  type: object
  properties:
    title: Church Attendance Registration C-19
    pages:
    - id: 1
      name: section_header_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: section_header_attendance
      label: -- Attendance Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: attendance_status
      label: Attendance Status
      hint: null
      type: select_one
      options:
      - Present
      - Absent
      - Late
      - Excused
      required: true
    - id: 11
      name: section_header_health_screening
      label: -- Health Screening --
      hint: COVID-19 related health information for entry screening
      type: note
      options: []
      required: false
    - id: 12
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Fully vaccinated
      - Partially vaccinated
      - Unvaccinated
      - Prefer not to say
      required: false
    - id: 13
      name: symptoms_check
      label: Do you have any COVID-19 symptoms
      hint: Fever, cough, shortness of breath, loss of taste or smell
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Unsure
      required: false
    - id: 14
      name: fever_temp
      label: Have you had a fever in the last 24 hours
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Unsure
      required: false
    - id: 15
      name: exposure_check
      label: Have you been exposed to someone with COVID-19 in the last 2 weeks
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Unsure
      required: false
    - id: 16
      name: positive_test
      label: Have you tested positive for COVID-19 in the last 2 weeks
      hint: null
      type: select_one
      options:
      - 'No'
      - 'Yes'
      - Unsure
      required: false
    - id: 17
      name: section_header_group
      label: -- Group Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: family_group_count
      label: Number of Household Members Attending
      hint: null
      type: number
      options: []
      required: false
    - id: 19
      name: children_attending
      label: Children Under 18 Attending
      hint: null
      type: number
      options: []
      required: false
    - id: 20
      name: section_header_contact_tracing
      label: -- Contact Tracing Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: contact_tracing_consent
      label: I consent to share my information for contact tracing if needed
      hint: Your information will only be used for public health purposes
      type: select_one
      options:
      - Yes, I consent
      - No, I do not consent
      required: true
    - id: 22
      name: privacy_acknowledgment
      label: I acknowledge my information will be kept confidential
      hint: null
      type: select_one
      options:
      - Yes, I acknowledge
      - 'No'
      required: true
    - id: 23
      name: section_header_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: accessibility_needs
      label: Any Accessibility or Accommodation Needs
      hint: null
      type: text
      options: []
      required: false
