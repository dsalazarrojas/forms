      name: user_input
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: webinar_date
      label: Webinar Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: registration_cost
