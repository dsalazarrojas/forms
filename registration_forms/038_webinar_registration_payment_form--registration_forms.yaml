      - PayPal
      - Stripe
      required: true
    - id: 7
      name: attendee_name
      label: Attendee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: attendee_email
      label: Attendee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: attendee_phone
      label: Attendee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: registration_status
      label: Registration Status
      hint: null
      type: select_multiple
      options:
      - Confirmed
      - Pending
      - Declined
      required: false
    - id: 11
      name: payment_status
      label: Payment Status
      hint: null
      type: select_multiple
      options:
      - Paid
      - Partially Paid
      - Unpaid
      required: true
    - id: 12
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
