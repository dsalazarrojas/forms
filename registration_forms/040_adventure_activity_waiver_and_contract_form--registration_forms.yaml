inputSchema:
  type: object
  properties:
    title: Adventure Activity Waiver And Contract Form
    pages:
    - id: 1
      name: waiver_header
      label: -- Waiver and Contract --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Legal name
      type: text
      options: []
      required: true
    - id: 3
      name: contract_terms_acknowledged
      label: Contract terms acknowledged
      hint: Read and agree to activity terms
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 4
      name: risk_acknowledgement
      label: Risk acknowledgement
      hint: Confirm understanding of risks
      type: select_one
      options:
      - I acknowledge
      - I do not acknowledge
      required: true
    - id: 5
      name: medical_clearance
      label: Medical clearance provided
      hint: For high risk activities provide clearance
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not applicable
      required: false
    - id: 6
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Required contact information
      type: text
      options: []
      required: true
    - id: 7
      name: insurance_information
      label: Insurance provider and policy
      hint: For participant coverage
      type: text
      options: []
      required: false
    - id: 8
      name: signature_name
      label: Signature name
      hint: Type full name as electronic signature
      type: text
      options: []
      required: true
    - id: 9
      name: signature_date
      label: Signature date
      hint: Date signed
      type: date
      options: []
      required: true
