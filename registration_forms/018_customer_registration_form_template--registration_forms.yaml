inputSchema:
  type: object
  properties:
    title: Customer Registration Form Template
    pages:
    - id: 1
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: customer_type
      label: Customer Type
      hint: null
      type: select_one
      options:
      - Individual
      - Business
      required: true
    - id: 5
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: postcode
      label: Postcode
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: country
      label: Country
      hint: null
      type: select_one
      options:
      - USA
      - Canada
      - UK
      required: true
    - id: 9
      name: state
      label: State
      hint: null
      type: select_one
      options:
      - CA
      - NY
      - TX
      required: true
    - id: 10
      name: zip
      label: Zip
      hint: null
      type: text
      options: []
      required: true
