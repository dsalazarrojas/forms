inputSchema:
  type: object
  properties:
    title: Child Screening Registration Form
    pages:
    - id: 1
      name: section_registration_info
      label: -- Registration Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: guardian_name
      label: Parent or Guardian Name
      hint: Primary registrant
      type: text
      options: []
      required: true
    - id: 3
      name: guardian_email
      label: Email Address
      hint: For confirmation and results
      type: email
      options: []
      required: true
    - id: 4
      name: guardian_phone
      label: Primary Phone Number
      hint: Daytime contact number
      type: text
      options: []
      required: true
    - id: 5
      name: section_child_details
      label: -- Child Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: child_name
      label: Child Full Name
      hint: Student for screening
      type: text
      options: []
      required: true
    - id: 7
      name: child_dob
      label: Date of Birth
      hint: Select child birthday
      type: date
      options: []
      required: true
    - id: 8
      name: child_gender
      label: Child Gender
      hint: Demographic info
      type: select_one
      options:
      - Male
      - Female
      - Other
      required: false
    - id: 9
      name: section_screening_selection
      label: -- Screening Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: screening_type
      label: Type of Screening Requested
      hint: Select the primary assessment
      type: select_one
      options:
      - Vision Screening
      - Hearing Screening
      - Speech and Language
      - Developmental Milestone
      - Dental Health
      required: true
    - id: 11
      name: preferred_location
      label: Preferred Screening Location
      hint: Choose a convenient site
      type: select_one
      options:
      - Main Medical Clinic
      - School Site Location
      - Community Center
      required: true
    - id: 12
      name: section_screening_history
      label: -- History and Concerns --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: previous_screening
      label: Has child had a previous screening?
      hint: In the requested area
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: current_concerns
      label: List any current concerns regarding the screening area
      hint: Specific behaviors or issues noticed
      type: text
      options: []
      required: false
    - id: 15
      name: preferred_screening_date
      label: Preferred Date for Screening
      hint: Subject to availability
      type: date
      options: []
      required: false
