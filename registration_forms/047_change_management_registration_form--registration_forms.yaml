inputSchema:
  type: object
  properties:
    title: Change Management Registration Form
    pages:
    - id: 1
      name: registration_date
      label: Registration Date
      hint: Date of registration
      type: date
      options: []
      required: true
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Full name of participant
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Email Address
      hint: Email for confirmation
      type: email
      options: []
      required: true
    - id: 4
      name: participant_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: Your current position
      type: text
      options: []
      required: true
    - id: 6
      name: department
      label: Department
      hint: Your department
      type: text
      options: []
      required: true
    - id: 7
      name: organization
      label: Organization
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 8
      name: manager_name
      label: Manager Name
      hint: Name of your supervisor
      type: text
      options: []
      required: false
    - id: 9
      name: training_session
      label: Training Session Selection
      hint: Which session will you attend
      type: select_one
      options:
      - Introduction to change management
      - Advanced change management
      - Change leadership
      - Change practitioner certification
      - Virtual workshop
      - In-person seminar
      required: true
    - id: 10
      name: session_date
      label: Session Date
      hint: Preferred date
      type: date
      options: []
      required: true
    - id: 11
      name: experience_level
      label: Change Management Experience
      hint: Your experience level
      type: select_one
      options:
      - Beginner - No experience
      - Novice - Less than 1 year
      - Intermediate - 1-3 years
      - Advanced - 3-5 years
      - Expert - More than 5 years
      required: true
    - id: 12
      name: learning_objectives
      label: Learning Objectives
      hint: What do you hope to learn
      type: select_multiple
      options:
      - Change management fundamentals
      - Stakeholder analysis
      - Communication strategies
      - Resistance management
      - Change assessment tools
      - Leadership skills
      - Coaching techniques
      - Measurement and metrics
      required: true
    - id: 13
      name: certification_interest
      label: Certification Interest
      hint: Are you interested in certification
      type: select_one
      options:
      - Yes - Full certification
      - Yes - Partial certification
      - No - Professional development only
      required: true
    - id: 14
      name: payment_method
      label: Payment Method
      hint: How will you pay
      type: select_one
      options:
      - Credit card
      - Debit card
      - Company invoice
      - Purchase order
      - Scholarship funded
      required: true
    - id: 15
      name: employer_sponsored
      label: Employer Sponsored
      hint: Is your employer sponsoring
      type: select_one
      options:
      - Yes - Fully sponsored
      - Yes - Partially sponsored
      - No - Self-funded
      required: true
    - id: 16
      name: dietary_requirements
      label: Dietary Requirements
      hint: Any dietary needs
      type: text
      options: []
      required: false
    - id: 17
      name: accessibility_needs
      label: Accessibility Needs
      hint: Do you require accommodations
      type: text
      options: []
      required: false
    - id: 18
      name: how_did_you_hear
      label: How Did You Hear About Us
      hint: Source of awareness
      type: select_one
      options:
      - Website
      - Social media
      - Colleague referral
      - Email newsletter
      - Conference event
      - Search engine
      - Other
      required: false
    - id: 19
      name: special_requests
      label: Special Requests
      hint: Any special requirements
      type: text
      options: []
      required: false
    - id: 20
      name: terms_agreement
      label: Terms and Conditions
      hint: I agree to the terms and conditions
      type: select_one
      options:
      - Yes - I agree
      - No - I do not agree
      required: true
    - id: 21
      name: cancellation_policy
      label: Cancellation Policy
      hint: I understand the cancellation policy
      type: select_one
      options:
      - Yes - I understand
      - No - I do not understand
      required: true
    - id: 22
      name: participant_signature
      label: Participant Signature
      hint: Type your full name as signature
      type: text
      options: []
      required: true
