      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: market_type
      label: Market Type
      hint: null
