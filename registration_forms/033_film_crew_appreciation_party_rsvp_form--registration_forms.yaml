inputSchema:
  type: object
  properties:
    title: Film Crew Appreciation Party RSVP Form
    pages:
    - id: 1
      name: party_details
      label: Party details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: attendees
      label: Attendees
      hint: null
      type: select_multiple
      options:
      - John Doe
      - Jane Doe
      - Mary Johnson
      required: true
    - id: 3
      name: party_date
      label: Party date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: party_time
      label: Party time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: contact_info
      label: Contact info
      hint: Please include a valid email address
      type: email
      options: []
      required: true
