inputSchema:
  type: object
  properties:
    title: Academic Diversity And Equity Network Registration
    pages:
    - id: 1
      name: registration_header
      label: -- Network Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Name as you prefer to be listed
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Contact email
      hint: Institutional or primary email
      type: email
      options: []
      required: true
    - id: 4
      name: institution
      label: Institution or organization
      hint: Your employer or academic institution
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: Select your role
      type: select_one
      options:
        - Student
        - Faculty
        - Staff
        - Administrator
        - Other
      required: true
    - id: 6
      name: areas_of_interest
      label: Areas of interest
      hint: Select relevant DEI topics
      type: select_multiple
      options:
        - Policy development
        - Training and workshops
        - Research
        - Community outreach
      required: false
    - id: 7
      name: accessibility_needs
      label: Accessibility needs
      hint: Indicate any accommodations required
      type: text
      options: []
      required: false
    - id: 8
      name: consent_to_share_contact
      label: Consent to share contact with network
      hint: Agree to have name and email shared
      type: select_one
      options:
