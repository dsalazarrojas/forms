inputSchema:
  type: object
  properties:
    title: Survey Platform Subscription Form
    pages:
    - id: 1
      name: user_name
      label: What is your name?
      hint: Please provide your name.
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: What is your email address?
      hint: Please provide your email address.
      type: email
      options: []
      required: true
    - id: 3
      name: contact_method
      label: How do you want to be contacted (Yes/No)?
      hint: Please select how you want to be contacted.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: birthday
      label: When is your birthday?
      hint: Please provide your birthday.
      type: date
      options: []
      required: true
    - id: 5
      name: preferred_time
      label: What is your preferred contact time?
      hint: Please provide your preferred contact time.
      type: time
      options: []
      required: true
    - id: 6
      name: note
      label: Would you like to leave a note?
      hint: Please provide any additional information.
      type: note
      options: []
      required: false
    - id: 7
      name: phone
      label: What is your phone number?
      hint: Optional - Please provide your phone number.
      type: text
      options: []
      required: false
    - id: 8
      name: select_multiple
      label: Select multiple from the following -
      hint: Please select multiple options.
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 9
      name: date
      label: Do you have a date to share?
      hint: Optional - Please provide a date.
      type: date
      options: []
      required: false
    - id: 10
      name: contact_time
      label: Do you have a preferred contact time?
      hint: Optional - Please provide a contact time.
      type: time
      options: []
      required: false
    - id: 11
      name: text_area
      label: Would you like to provide a note?
      hint: Optional - Please provide any additional information.
      type: text
      options: []
      required: false
