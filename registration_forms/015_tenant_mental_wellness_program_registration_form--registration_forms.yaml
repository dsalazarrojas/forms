inputSchema:
  type: object
  properties:
    title: Tenant Mental Wellness Program Registration Form
    pages:
    - id: 1
      name: tenant_details
      label: What is your name?
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: How can we contact you?
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: program_interest
      label: Are you interested in the mental wellness program?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 4
      name: report_type
      label: What type of report do you need?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 5
      name: contact_method
      label: How would you like to be contacted?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: mental_wellness_provider
      label: Mental Wellness Provider
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: program_start_date
      label: Program Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: program_end_date
      label: Program End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: true
