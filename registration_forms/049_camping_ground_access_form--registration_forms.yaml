inputSchema:
  type: object
  properties:
    title: Camping Ground Access Form
    pages:
    - id: 1
      name: visitor_first_name
      label: Visitor First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 2
      name: visitor_last_name
      label: Visitor Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: address
      label: Street Address
      hint: Your address
      type: text
      options: []
      required: true
    - id: 6
      name: city
      label: City
      hint: City or town
      type: text
      options: []
      required: true
    - id: 7
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 8
      name: zip_code
      label: ZIP Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 9
      name: visit_date
      label: Date of Visit
      hint: When visiting
      type: date
      options: []
      required: true
    - id: 10
      name: arrival_time
      label: Arrival Time
      hint: What time
      type: time
      options: []
      required: true
    - id: 11
      name: departure_time
      label: Departure Time
      hint: When leaving
      type: time
      options: []
      required: false
    - id: 12
      name: purpose_of_visit
      label: Purpose of Visit
      hint: Select purpose
      type: select_one
      options:
      - Day camping
      - Visiting campers
      - Facility use
      - Event attendance
      - Hiking or recreation
      - Business
      - Other
      required: true
    - id: 13
      name: purpose_details
      label: Purpose Details
      hint: Describe if other
      type: text
      options: []
      required: false
    - id: 14
      name: number_in_party
      label: Number in Your Party
      hint: Total visitors
      type: number
      options: []
      required: true
    - id: 15
      name: number_of_vehicles
      label: Number of Vehicles
      hint: Total vehicles
      type: number
      options: []
      required: true
    - id: 16
      name: vehicle_make_model
      label: Vehicle Make and Model
      hint: Primary vehicle
      type: text
      options: []
      required: true
    - id: 17
      name: license_plate
      label: License Plate Number
      hint: Plate number
      type: text
      options: []
      required: true
    - id: 18
      name: license_plate_state
      label: License Plate State
      hint: State of registration
      type: text
      options: []
      required: true
    - id: 19
      name: areas_to_access
      label: Areas You Need to Access
      hint: Select all that apply
      type: select_multiple
      options:
      - Main campground
      - Day use area
      - Hiking trails
      - Swimming area
      - Boat launch
      - Restrooms and showers
      - Visitor center
      - Picnic area
      - Other
      required: true
    - id: 20
      name: bringing_pets
      label: Are You Bringing Pets
      hint: Yes or no
      type: select_one
      options:
      - 'False'
      - Yes - 1 pet
      - Yes - 2 pets
      - Yes - 3 or more
      required: true
    - id: 21
      name: pet_details
      label: Pet Details
      hint: Describe pets
      type: text
      options: []
      required: false
    - id: 22
      name: bringing_firewood
      label: Are You Bringing Firewood
      hint: Yes or no
      type: select_one
      options:
      - 'False'
      - Yes - certified heat-treated
      - Yes - will purchase here
      required: true
    - id: 23
      name: bringing_alcohol
      label: Are You Bringing Alcohol
      hint: Yes or no
      type: select_one
      options:
      - 'False'
      - Yes - for personal consumption
      required: false
    - id: 24
      name: group_affiliation
      label: Are You Part of a Group
      hint: Yes or no
      type: select_one
      options:
      - No - individual visit
      - Yes - family group
      - Yes - organization
      - Yes - commercial group
      required: true
    - id: 25
      name: group_name
      label: Group Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 26
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 27
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number
      type: text
      options: []
      required: true
    - id: 28
      name: medical_conditions
      label: Any Medical Conditions We Should Know
      hint: Describe if any
      type: text
      options: []
      required: false
    - id: 29
      name: access_fee
      label: Access Fee
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 30
      name: fee_paid
      label: Fee Paid
      hint: Yes or no
      type: select_one
      options:
      - Yes - paid online
      - Yes - paid at gate
      - No - not yet
      - Not applicable
      required: false
    - id: 31
      name: rules_acknowledged
      label: I Have Read and Agree to Campground Rules
      hint: Yes or no
      type: select_one
      options:
      - Yes - I acknowledge
      - 'False'
      required: true
    - id: 32
      name: liability_waiver
      label: I Accept the Liability Waiver
      hint: Yes or no
      type: select_one
      options:
      - Yes - I accept
      - 'False'
      required: true
    - id: 33
      name: visitor_signature
      label: Visitor Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 34
      name: signature_date
      label: Date
      hint: Date of access
      type: date
      options: []
      required: true
    - id: 35
      name: staff_initials
      label: Staff Initials
      hint: For office use
      type: text
      options: []
      required: false
