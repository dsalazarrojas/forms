inputSchema:
  type: object
  properties:
    title: Chronic Illness Peer Support Registration
    pages:
    - id: 1
      name: section_header_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: We'll use this to send you session updates
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: Optional - for urgent contact purposes
      type: text
      options: []
      required: false
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: section_header_health_info
      label: -- Health and Support Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: chronic_condition
      label: Primary Chronic Condition
      hint: What condition brings you to peer support
      type: select_one
      options:
      - Arthritis
      - Diabetes
      - Fibromyalgia
      - Chronic Fatigue Syndrome
      - Multiple Sclerosis
      - Other
      required: true
    - id: 9
      name: years_diagnosed
      label: Years Since Diagnosis
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: support_goals
      label: Support Goals (Select all that apply)
      hint: What are you hoping to gain from peer support
      type: select_multiple
      options:
      - Share experiences with others
      - Learn coping strategies
      - Reduce isolation
      - Get practical advice
      - Emotional support
      required: true
    - id: 11
      name: current_treatments
      label: Describe Current Treatments or Management
      hint: Brief overview of medications, therapy, or other treatments
      type: text
      options: []
      required: false
    - id: 12
      name: section_header_preferences
      label: -- Session Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: preferred_meeting_format
      label: Preferred Meeting Format
      hint: null
      type: select_one
      options:
      - In-person
      - Virtual
      - Hybrid
      - No preference
      required: true
    - id: 14
      name: preferred_day_of_week
      label: Preferred Day of Week
      hint: When would you prefer to attend sessions
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Weekend
      - Flexible
      required: false
    - id: 15
      name: preferred_time
      label: Preferred Time of Day
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Flexible
      required: false
    - id: 16
      name: group_size_preference
      label: Preferred Group Size
      hint: Do you prefer small or larger groups
      type: select_one
      options:
      - Small group (5-8 people)
      - Medium group (9-15 people)
      - Large group (16+ people)
      - One-on-one
      required: false
    - id: 17
      name: section_header_emergency
      label: -- Emergency Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: emergency_contact_relationship
      label: Relationship to You
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: agreement_to_confidentiality
      label: I agree to maintain confidentiality of all peer discussions
      hint: All information shared in support groups is confidential
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 22
      name: consent_to_contact
      label: Consent to Contact
      hint: We may reach out to confirm your registration and session details
      type: select_one
      options:
      - Yes, contact me
      - No, contact by email only
      required: true
