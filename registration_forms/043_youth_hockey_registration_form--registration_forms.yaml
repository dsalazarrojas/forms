inputSchema:
  type: object
  properties:
    title: Youth Hockey Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: email
      label: Email
      hint: null
      type: email
      options: []
