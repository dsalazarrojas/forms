      - 'False'
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact_email
      label: Emergency Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: player_position
      label: Player Position
      hint: null
      type: select_multiple
      options:
      - Forward
      - Defense
      - Goalie
      - Other
      required: true
    - id: 11
      name: emergency_contact_relationship
      label: Relationship
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: false
