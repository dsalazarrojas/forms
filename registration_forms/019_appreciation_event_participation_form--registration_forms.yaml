inputSchema:
  type: object
  properties:
    title: Appreciation Event Participation Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: department
      label: Department or Team
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: event_details
      label: Event Details
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: attendance_confirm
      label: Will you attend this appreciation event
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Maybe
      required: true
    - id: 10
      name: num_guests
      label: Number of Guests (including yourself)
      hint: null
      type: number
      options: []
      required: false
    - id: 11
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Dairy-Free
      - Nut Allergies
      - Other
      required: false
    - id: 12
      name: activities_interest
      label: Activities You Are Interested In
      hint: null
      type: select_multiple
      options:
      - Networking
      - Games
      - Food and Drinks
      - Entertainment
      - Awards Ceremony
      required: false
    - id: 13
      name: additional_notes
      label: Special Requests or Comments
      hint: null
      type: text
      options: []
      required: false
