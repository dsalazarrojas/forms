inputSchema:
  type: object
  properties:
    title: investment_compliance_workshop_registration_form
    pages:
    - id: 1
      name: participant_name
      label: Registration Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_email
      label: participant_email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: participant_workshop_attendance_date
      label: Workshop Dates
      hint: Select the workshop dates you want to attend
      type: select_one
      options:
      - '2024-01-01'
      - '2024-01-15'
      required: false
    - id: 4
      name: participant_workshop_attendance_time
      label: Workshop Time
      hint: null
      type: select_one
