inputSchema:
  type: object
  properties:
    title: Digital Caregiver Network Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: caregiver_type
      label: What type of caregiver are you?
      hint: null
      type: select_one
      options:
      - Senior Caregiver
      - Homebound Caregiver
      - Respite Caregiver
      required: true
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: zip
      label: Zip
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: services_needed
      label: What services do you need?
      hint: null
      type: select_multiple
      options:
      - Home Care
      - Respite Care
      - Transportation
      required: true
    - id: 9
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: caregiver_profile
      label: Caregiver Profile
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
