inputSchema:
  type: object
  properties:
    title: Cross Border Registration Form
    pages:
    - id: 1
      name: first_name
      label: first name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: address
      label: address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: country_of_origin
      label: country of origin
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: visa_type
      label: visa type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: passport_number
      label: passport number
      hint: null
      type: text
      options: []
      required: false
