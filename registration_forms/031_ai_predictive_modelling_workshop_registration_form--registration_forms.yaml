inputSchema:
  type: object
  properties:
    title: AI Predictive Modelling Workshop Registration Form
    pages:
    - id: 1
      name: attendee_info_header
      label: '--- Attendee Information ---'
      hint: Please provide your professional details for registration.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: organization_company
      label: Organization / Company
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: technical_background_header
      label: '--- Technical Background & Proficiency ---'
      hint: Help us gauge the technical level of participants.
      type: note
      options: []
      required: false
    - id: 7
      name: programming_skills
      label: Programming Language Proficiency
      hint: Select all that apply.
      type: select_multiple
      options:
      - Python (Pandas, Scikit-learn, etc.)
      - R (Tidyverse, Caret, etc.)
      - SQL (Data extraction)
      - SAS / Stata
      - None / Excel Only
      required: true
    - id: 8
      name: modeling_experience
      label: Previous Experience with Predictive Modelling
      hint: null
      type: select_one
      options:
      - Beginner (No prior experience)
      - Basic (Understand concepts, run basic regressions)
      - Intermediate (Built and deployed models)
      - Advanced (Specialist in deep learning/ensembles)
      required: true
    - id: 9
      name: industry_application
      label: Primary Industry for Application
      hint: Where do you intend to apply these models?
      type: select_one
      options:
      - Finance / Insurance
      - Healthcare / Pharmaceuticals
      - Retail / E-commerce
      - Manufacturing / Supply Chain
      - Energy / Utilities
      - Academic Research
      required: true
    - id: 10
      name: workshop_preferences_header
      label: '--- Workshop Logistics & Preferences ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: workshop_date
      label: Select Your Workshop Date
      hint: null
      type: select_one
      options:
      - August 20-21, 2026 (Summer Intensive)
      - September 15-16, 2026 (Fall Session)
      required: true
    - id: 12
      name: learning_format_preference
      label: Preferred Learning Format
      hint: null
      type: select_one
      options:
      - Hands-on Coding (70% Code, 30% Theory)
      - Theory Focused (70% Concepts, 30% Examples)
      - Balanced (50/50)
      required: true
    - id: 13
      name: interest_topics
      label: Specific Topics of Interest
      hint: Select top 2.
      type: select_multiple
      options:
      - Time Series Forecasting
      - Classification & Anomaly Detection
      - Feature Engineering & Selection
      - Model Interpretation (SHAP/LIME)
      required: true
    - id: 14
      name: hardware_status
      label: Will you bring your own laptop?
      hint: null
      type: select_one
      options:
      - Yes, I will bring my own device
      - No, I request a loaner workstation
      required: true
    - id: 15
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Corporate PO / Invoice
      required: true
    - id: 16
      name: certificate_request
      label: Do you require a Certificate of Completion?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: registration_date
      label: Date of Registration
      hint: null
      type: date
      options: []
      required: true
