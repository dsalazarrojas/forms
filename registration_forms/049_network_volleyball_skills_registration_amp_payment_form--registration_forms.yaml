inputSchema:
  type: object
  properties:
    title: Network Volleyball Skills Registration & Payment Form
    pages:
    - id: 1
      name: user_details
      label: User Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: package_selection
      label: Select Package
      hint: null
      type: select_one
      options:
      - Package A
      - Package B
      - Package C
      - Custom Package
      required: true
    - id: 3
      name: payment_details
      label: Payment Details
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: notes
      label: Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: agreement
      label: Agreement
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
