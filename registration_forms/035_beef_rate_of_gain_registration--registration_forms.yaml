inputSchema:
  type: object
  properties:
    title: Beef Rate Of Gain Registration
    pages:
    - id: 1
      name: section_event_producer_info
      label: -- Event and Producer Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: event_name
      label: Event or Show Name
      hint: e.g. County Fair, Youth Cattle Challenge
      type: text
      options: []
      required: true
    - id: 3
      name: producer_full_name
      label: Producer / Exhibitor Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: organization_affiliate
      label: Club or Organization Affiliate
      hint: e.g. 4-H Club, FFA Chapter, Independent
      type: text
      options: []
      required: false
    - id: 5
      name: contact_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: section_animal_identification
      label: -- Animal Identification --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: animal_tag_id
      label: Animal Tag / ID Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: animal_breed
      label: Primary Breed or Breed Type
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: birth_date_animal
      label: Animal Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: section_weight_measurements
      label: -- Initial Weight and Data --
      hint: Start of measurement period
      type: note
      options: []
      required: false
    - id: 11
      name: initial_weigh_in_date
      label: Initial Weigh-in Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: initial_weight_lbs
      label: Initial Weight (lbs)
      hint: null
      type: number
      options: []
      required: true
    - id: 13
      name: final_weigh_in_date
      label: Final Weigh-in Date (Projected or Actual)
      hint: null
      type: date
      options: []
      required: true
    - id: 14
      name: final_weight_lbs
      label: Final Weight (lbs)
      hint: null
      type: number
      options: []
      required: false
    - id: 15
      name: section_feed_management
      label: -- Feed and Management --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: primary_feed_type
      label: Primary Feed Type
      hint: null
      type: select_one
      options:
      - High Grain / Finishing Ration
      - Grass / Pasture Only
      - Mixed Grain and Forage
      - Commercial Beef Pellets
      required: true
    - id: 17
      name: feed_additives_used
      label: Were any feed additives or supplements used?
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 18
      name: management_notes
      label: Notes on Health or Management
      hint: Vaccination history, health challenges, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: official_witness_name
      label: Official Witness or Weigh-master Name
      hint: null
      type: text
      options: []
      required: true
    - id: 20
      name: certification_statement
      label: I certify the accuracy of these weight measurements
      hint: null
      type: select_one
      options:
      - I Certify
      - Other
      required: true
    - id: 21
      name: registration_date
      label: Date of Registration
      hint: null
      type: date
      options: []
      required: true
