inputSchema:
  type: object
  properties:
    title: Digital Patient Safety Innovation Registration Form
    pages:
    - id: 1
      name: event_title
      label: Event Title
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Conference
      - Workshop
      - Symposium
      required: true
    - id: 3
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 5
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: description
      label: Description
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: category
      label: Category
      hint: null
      type: select_multiple
      options:
      - Registration Forms
      - Event Registration Forms
      required: true
    - id: 8
      name: event_status
      label: Event Status
      hint: null
      type: select_one
      options:
      - Confirmed
      - Not Confirmed
      - Canceled
      required: true
    - id: 9
      name: event_start_date
      label: Event Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: event_end_date
      label: Event End Date
      hint: null
      type: date
      options: []
      required: false
