inputSchema:
  type: object
  properties:
    title: Art Discovery Event Registration
    pages:
    - id: 1
      name: section_attendee_info
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: attendee_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: attendee_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - Under 18
      - 18-25
      - 26-35
      - 36-50
      - 51-65
      - 65+
      - Prefer not to say
      required: false
    - id: 6
      name: section_event_details
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: event_type
      label: Type of Event
      hint: null
      type: select_one
      options:
      - Workshop
      - Lecture or talk
      - Gallery tour
      - Artist demonstration
      - Discussion panel
      - Other
      required: true
    - id: 9
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: section_interests
      label: -- Art Interests and Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: art_interest_level
      label: Art Interest Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Casual interest
      - Regular attendee
      - Active artist
      - Professional
      required: true
    - id: 14
      name: art_forms_interested
      label: Art Forms You are Interested In
      hint: null
      type: select_multiple
      options:
      - Painting
      - Sculpture
      - Photography
      - Digital art
      - Performance art
      - Installation
      - Textiles
      - Ceramics
      required: true
    - id: 15
      name: previous_events
      label: Have you attended previous Art Discovery events
      hint: null
      type: select_one
      options:
      - No - first time
      - Yes - once or twice
      - Yes - regularly
      required: true
    - id: 16
      name: section_accessibility
      label: -- Accessibility and Special Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: accessibility_needs
      label: Do you have accessibility needs
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: true
    - id: 18
      name: accessibility_details
      label: Please describe your needs
      hint: Mobility, vision, hearing, other
      type: text
      options: []
      required: false
    - id: 19
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: For event refreshments
      type: text
      options: []
      required: false
    - id: 20
      name: section_preferences
      label: -- Additional Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: newsletter_signup
      label: Would you like to receive future event announcements
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: referred_by
      label: How did you hear about this event
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: additional_notes
      label: Additional Information or Questions
      hint: null
      type: text
      options: []
      required: false
