inputSchema:
  type: object
  properties:
    title: Club Membership Order Form
    pages:
    - id: 1
      name: section_personal
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: section_address
      label: -- Address Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: state_province
      label: State - Province
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: postal_code
      label: Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: country
      label: Country
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: section_membership
      label: -- Membership Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Standard
      - Premium
      - VIP
      - Student
      - Family
      - Lifetime
      required: true
    - id: 15
      name: membership_duration
      label: Membership Duration
      hint: null
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Annual
      - 2 years
      - Lifetime
      required: true
    - id: 16
      name: membership_term_start
      label: Membership Start Date
      hint: When should membership begin?
      type: date
      options: []
      required: true
    - id: 17
      name: section_interests
      label: -- Interests and Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: primary_interests
      label: Primary Interests or Focus Areas
      hint: What are you interested in?
      type: select_multiple
      options:
      - Networking
      - Learning and development
      - Events and social
      - Community service
      - Competitions
      - Professional growth
      required: true
    - id: 19
      name: newsletter_subscription
      label: Subscribe to Newsletter
      hint: Receive club updates and news
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 20
      name: communication_preference
      label: Preferred Communication Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text
      - Mail
      - Any
      required: true
    - id: 21
      name: section_payment
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: membership_fee
      label: Membership Fee - USD
      hint: Based on tier selected
      type: number
      options: []
      required: true
    - id: 23
      name: initial_payment
      label: Initial Payment Amount - USD
      hint: Amount being paid now
      type: number
      options: []
      required: true
    - id: 24
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit card
      - Debit card
      - Bank transfer
      - Check
      - PayPal
      required: true
    - id: 25
      name: terms_acceptance
      label: I accept the membership terms and conditions
      hint: By signing, you agree to all membership policies
      type: select_one
      options:
      - Yes, I accept
      - No, I do not accept
      required: true
