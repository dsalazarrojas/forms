inputSchema:
  type: object
  properties:
    title: Educational Records Release Form
    pages:
    - id: 1
      name: name
      label: What is your name?
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: student_id
      label: What is your student ID?
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: institution
      label: What is your educational institution?
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: program_info
      label: What is your program information?
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: field_of_study
      label: What is your field of study?
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: major
      label: What is your major?
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: graduation_date
      label: When did you graduate?
      hint: null
      type: date
      options: []
      required: true
    - id: 8
      name: gpa
      label: What is your GPA (if applicable)?
      hint: null
      type: number
      options: []
      required: false
    - id: 9
      name: consent
      label: Do you consent to share your educational records?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: email
      label: What is your current email address?
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: phone
      label: What is your phone number?
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: address
      label: What is your mailing address?
      hint: null
      type: text
      options: []
      required: false
