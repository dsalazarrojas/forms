inputSchema:
  type: object
  properties:
    title: Virtual Course Registration Form
    pages:
    - id: 1
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date Of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: course_type
      label: Course Type
      hint: null
      type: select_one
      options:
      - '{''value'': ''Online Course''}'
      - '{''value'': ''Offline Course''}'
      - '{''value'': ''Hybrid Course''}'
      required: false
    - id: 7
      name: course_level
      label: Course Level
      hint: null
      type: select_multiple
      options:
      - '{''value'': ''Basic''}'
      - '{''value'': ''Intermediate''}'
      - '{''value'': ''Advanced''}'
      required: false
    - id: 8
      name: course_language
      label: Course Language
      hint: null
      type: select_one
      options:
      - '{''value'': ''English''}'
      - '{''value'': ''Spanish''}'
      - '{''value'': ''French''}'
      required: false
    - id: 9
      name: course_duration
      label: Course Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: course_fees
      label: Course Fees
      hint: null
      type: number
      options: []
      required: false
