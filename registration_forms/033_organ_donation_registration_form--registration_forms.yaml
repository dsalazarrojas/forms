inputSchema:
  type: object
  properties:
    title: Organ Donation Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: birthdate
      label: Birthdate
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: medical_condition
      label: Medical Condition
      hint: null
      type: select_one
      options:
      - None
      - Kidney disease
      - diabetes
      - heart disease
      - lung disease
      required: false
    - id: 8
      name: blood_type
      label: Blood Type
      hint: null
      type: select_multiple
      options:
      - None
      - A+
      - A-
      - B+
      - AB+
      - AB-
      - B-
      - O+
      - O-
      - AB
      required: false
    - id: 9
      name: medical_notes
      label: Medical Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: confirm_donation
      label: Confirm Donation
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
    - id: 11
      name: confirm_address
      label: Confirm Address
      hint: null
      type: select_one
      options:
      - 'False'
      - 'True'
      required: false
