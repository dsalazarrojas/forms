inputSchema:
  type: object
  properties:
    title: Expense Allocation Roundtable Registration Form
    pages:
    - id: 1
      name: registration_form
      label: Registration Form
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: E-Mail
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - Admin
      - Manager
      - Other
      required: false
    - id: 6
      name: expense_type
      label: Expense Type
      hint: null
      type: select_multiple
      options:
      - Travel
      - Entertainment
      - Accommodation
      - Other
      required: false
    - id: 7
      name: amount
      label: Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
