inputSchema:
  type: object
  properties:
    title: New User Account Request Form
    pages:
    - id: 1
      name: user_name
      label: Enter your name
      hint: Please enter your full name
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: Enter your email
      hint: Please enter your email
      type: email
      options: []
      required: true
    - id: 3
      name: user_password
      label: Enter your password
      hint: Please enter a password
      type: text
      options: []
      required: true
    - id: 4
      name: confirm_password
      label: Confirm your password
      hint: Please confirm your password
      type: text
      options: []
      required: true
    - id: 5
      name: account_type
      label: Select your account type
      hint: null
      type: select_one
      options:
      - New User
      - Returning User
      - Guest
      required: true
    - id: 6
      name: account_preferences
      label: Select your preferences
      hint: null
      type: select_multiple
      options:
      - Customize my dashboard
      - Receive emails
      - Allow tracking
      required: true
    - id: 7
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: phone
      label: Enter your phone number
      hint: Please enter your phone number
      type: text
      options: []
      required: false
    - id: 9
      name: confirm_email
      label: Confirm your email
      hint: Please confirm your email
      type: email
      options: []
      required: true
    - id: 10
      name: password_2
      label: Password 2
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: confirm_password_2
      label: Confirm Password 2
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: account_preferences_2
      label: Select your account preferences
      hint: null
      type: select_multiple
      options:
      - Customize my dashboard
      - Receive emails
      - Allow tracking
      required: false
    - id: 13
      name: user_phone
      label: User Phone
      hint: Please enter your phone number
      type: text
      options: []
      required: false
    - id: 14
      name: confirm_phone
      label: Confirm your phone number
      hint: Please confirm your phone number
      type: text
      options: []
      required: false
