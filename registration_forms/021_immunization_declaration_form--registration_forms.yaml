inputSchema:
  type: object
  properties:
    title: immunization declaration form
    pages:
    - id: 1
      name: user_info
      label: user info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: vaccination_status
      label: vaccination status
      hint: null
      type: select_multiple
      options:
      - polio
      - measles
      - hep a
      - hep b
      - influenza
      - covid-19
      required: false
    - id: 3
      name: vaccination_date
      label: vaccination date
      hint: mm/dd
      type: date
      options: []
      required: false
    - id: 4
      name: healthcare_provider
      label: healthcare provider
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: school_name
      label: school name
      hint: null
      type: select_one
      options:
      - school name 1
      - school name 2
      - school name 3
      required: true
    - id: 6
      name: consent
      label: consent
      hint: null
      type: select_multiple
      options:
      - 'yes'
      - 'no'
      required: false
