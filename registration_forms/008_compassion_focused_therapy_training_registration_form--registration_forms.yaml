inputSchema:
  type: object
  properties:
    title: Compassion Focused Therapy Training Registration Form
    pages:
    - id: 1
      name: program_details
      label: -- Registration Details --
      hint: fill all required fields
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: participant name
      hint: full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email address
      hint: used for confirmation and materials
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: contact phone number
      hint: include country code if outside local area
      type: text
      options: []
      required: false
    - id: 5
      name: organization
      label: organization or employer
      hint: optional
      type: text
      options: []
      required: false
    - id: 6
      name: professional_role
      label: professional role
      hint: e g therapist nurse counselor
      type: text
      options: []
      required: true
    - id: 7
      name: preferred_session
      label: preferred session date
      hint: select preferred workshop date
      type: select_one
      options:
      - Weekday Evening
      - Weekend Intensive
      - Online Self paced
      required: true
    - id: 8
      name: prior_experience
      label: prior experience with CFT
      hint: brief description
      type: text
      options: []
      required: false
    - id: 9
      name: accessibility_requirements
      label: accessibility requirements
      hint: let us know if you need accommodations
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact
      label: emergency contact name and phone
      hint: include relationship and phone
      type: text
      options: []
      required: false
