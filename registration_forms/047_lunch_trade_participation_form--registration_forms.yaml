inputSchema:
  type: object
  properties:
    title: Lunch Trade Participation Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: Participant email
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: Participant phone number
      type: text
      options: []
      required: false
    - id: 4
      name: schedule
      label: Schedule
      hint: null
      type: select_one
      options:
      - '{''label'': ''Monday''}'
      - '{''label'': ''Tuesday''}'
      - '{''label'': ''Wednesday''}'
      - '{''label'': ''Thursday''}'
      - '{''label'': ''Friday''}'
      - '{''label'': ''Saturday''}'
      - '{''label'': ''Sunday''}'
      required: false
    - id: 5
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - '{''label'': ''chatjimmy''}'
      - Other
      required: false
    - id: 9
      name: participant_count
      label: Participant Count
      hint: null
      type: select_one
      options:
      - '{''label'': 1}'
      - '{''label'': 2}'
      - '{''label'': 3}'
      - '{''label'': 4}'
      - '{''label'': 5}'
      - '{''label'': ''More''}'
      required: false
    - id: 10
      name: confirmed
      label: Confirmed
      hint: null
      type: select_multiple
      options:
      - '{''label'': True}'
      - '{''label'': False}'
      required: false
    - id: 11
      name: notes_confirmed
      label: Notes Confirmed
      hint: null
      type: note
      options: []
      required: false
