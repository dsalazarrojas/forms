inputSchema:
  type: object
  properties:
    title: Editing Techniques Workshop Registration Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: participant_email
      label: Participant EMail
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: workshop_time
      label: Workshop Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: workshop_location
      label: Workshop Location
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: participant_notes
      label: Participant Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: participant_agreement
      label: Participant Agreement
      hint: null
      type: select_one
      options:
      - I am able to attend the entire workshop
      - I am able to attend part of the workshop
      - I am not able to attend the workshop
      required: false
    - id: 9
      name: participant_payment_method
      label: Participant Payment Method
      hint: null
      type: select_multiple
      options:
      - Cash
      - Credit/Debit Card
      - Bank Transfer
      - Other (please specify)
      required: false
    - id: 10
      name: participant_other_payment_method
      label: Participant Other Payment Method
      hint: Only if not already listed
      type: text
      options: []
      required: false
    - id: 11
      name: participant_additional_info
      label: Participant Additional Info
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: workshop_instructor_name
      label: Workshop Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: workshop_instructor_email
      label: Workshop Instructor EMail
      hint: null
      type: email
      options: []
      required: false
    - id: 14
      name: workshop_instructor_phone
      label: Workshop Instructor Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: workshop_instructor_notes
      label: Workshop Instructor Notes
      hint: null
      type: note
      options: []
      required: false
