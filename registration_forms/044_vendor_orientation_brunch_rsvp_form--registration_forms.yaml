inputSchema:
  type: object
  properties:
    title: Vendor Orientation Brunch RSVP Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: rsvp
      label: RSVP
      hint: null
      type: select_one
      options:
      - RSVP Yes
      - RSVP No
      required: true
    - id: 5
      name: guest_count
      label: Guest Count
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: null
      type: text
      options: []
      required: false
