inputSchema:
  type: object
  properties:
    title: Class Attendance Form
    pages:
    - id: 1
      name: class_name
      label: Class or Course Name
      hint: e.g. Mathematics 101
      type: text
      options: []
      required: true
    - id: 2
      name: class_section
      label: Section Number
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 3
      name: teacher_name
      label: Teacher or Instructor Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 4
      name: attendance_date
      label: Date of Class
      hint: MM/DD/YYYY format
      type: date
      options: []
      required: true
    - id: 5
      name: class_time
      label: Class Time
      hint: Start time
      type: time
      options: []
      required: true
    - id: 6
      name: academic_year
      label: Academic Year
      hint: School year
      type: select_one
      options:
      - 2025-2026
      - 2026-2027
      - 2027-2028
      required: true
    - id: 7
      name: semester_term
      label: Semester or Term
      hint: Current term
      type: select_one
      options:
      - Fall Semester
      - Spring Semester
      - Summer Session
      - Winter Term
      required: true
    - id: 8
      name: student_1_name
      label: Student 1 Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 9
      name: student_1_id
      label: Student 1 ID
      hint: Student ID number
      type: text
      options: []
      required: false
    - id: 10
      name: student_1_status
      label: Student 1 Attendance Status
      hint: Select status
      type: select_one
      options:
      - Present
      - Absent - Excused
      - Absent - Unexcused
      - Late
      required: true
    - id: 11
      name: student_2_name
      label: Student 2 Name
      hint: Full name
      type: text
      options: []
      required: true
