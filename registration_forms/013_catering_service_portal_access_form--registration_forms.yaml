inputSchema:
  type: object
  properties:
    title: Catering Service Portal Access Form
    pages:
    - id: 1
      name: section_personal_information
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: This will be your username
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_account_information
      label: -- Account Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: user_role
      label: User Role
      hint: null
      type: select_one
      options:
      - Client
      - Catering Manager
      - Event Planner
      - Administrator
      - Other
      required: true
    - id: 8
      name: company_affiliation
      label: Company or Organization Name
      hint: Optional
      type: text
      options: []
      required: false
    - id: 9
      name: account_type
      label: Account Type
      hint: null
      type: select_one
      options:
      - Individual
      - Business
      - Non-Profit
      - Government
      - Educational
      required: true
    - id: 10
      name: section_access_preferences
      label: -- Access Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: portal_features
      label: Portal Features of Interest
      hint: null
      type: select_multiple
      options:
      - Menu Selection
      - Order Management
      - Payment Processing
      - Reporting and Analytics
      - Customer Feedback
      - Event Scheduling
      - Inventory Management
      required: true
    - id: 12
      name: notification_preference
      label: Notification Preference
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - SMS
      - In-App
      - None
      required: false
    - id: 13
      name: frequency_of_use
      label: Expected Frequency of Portal Use
      hint: null
      type: select_one
      options:
      - Daily
      - Multiple Times Per Week
      - Weekly
      - Monthly
      - Rarely
      required: false
    - id: 14
      name: section_organization_info
      label: -- Organization Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: organization_name
      label: Organization Name
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: organization_address
      label: Organization Address
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: city_state_zip
      label: City, State, Zip Code
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: section_experience
      label: -- Experience Level --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: catering_experience
      label: Years of Catering Experience
      hint: null
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - More than 10 years
      - No experience
      required: false
    - id: 20
      name: tech_proficiency
      label: Technical Proficiency Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
      required: false
    - id: 21
      name: section_preferences
      label: -- Additional Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: language_preference
      label: Language Preference
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      - Chinese
      - Other
      required: false
    - id: 23
      name: additional_requirements
      label: Additional Requirements or Special Requests
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: terms_acceptance
      label: I agree to the terms of service and privacy policy
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: communication_consent
      label: I consent to receive updates and information about catering services
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
