inputSchema:
  type: object
  properties:
    title: Fundamentals Learning Program Registration
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_email
      label: Student E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: student_program
      label: Student Program
      hint: null
      type: select_one
      options:
      - Program A
      - Program B
      - Program C
      required: false
    - id: 5
      name: student_date_of_birth
      label: Student Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: student_program_start_date
      label: Start Date of Program
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: student_program_end_date
      label: End Date of Program
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: student_enrolled
      label: Enrollment Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      - Pending
      required: false
