inputSchema:
  type: object
  properties:
    title: Cardio Fitness Class Admission Form
    pages:
    - id: 1
      name: participant_name
      label: Full Name
      hint: Enter your first and last name
      type: text
      options: []
      required: true
    - id: 2
      name: email_address
      label: Email Address
      hint: We'll use this for class updates and confirmations
      type: email
      options: []
      required: true
    - id: 3
      name: phone_number
      label: Phone Number
      hint: Include area code
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: Required to verify age eligibility
      type: date
      options: []
      required: true
    - id: 5
      name: fitness_experience
      label: Current Fitness Level
      hint: Select the option that best describes you
      type: select_one
      options:
      - Beginner - Little to no exercise experience
      - Intermediate - Exercise 2-3 times per week
      - Advanced - Exercise 4+ times per week
      - Professional Athlete - Formal training background
      required: true
    - id: 6
      name: physician_clearance
      label: Do you have physician clearance for exercise?
      hint: Required if you have pre-existing health conditions
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - I have a condition - please see attached documentation
      required: true
    - id: 7
      name: health_conditions
      label: Do you have any of the following health conditions?
      hint: Select all that apply
      type: select_multiple
      options:
      - Heart disease or hypertension
      - Diabetes
      - Asthma
      - Arthritis or joint problems
      - Recent surgery or injury
      - Pregnancy
      - None of the above
      required: false
    - id: 8
      name: medications
      label: Are you currently taking any medications that affect exercise?
      hint: List medications if applicable
      type: text
      options: []
      required: false
    - id: 9
      name: fitness_goals
      label: What are your primary fitness goals?
      hint: Select all that apply
      type: select_multiple
      options:
      - Weight loss
      - Cardiovascular endurance
      - Build muscle strength
      - Stress relief and wellness
      - Rehabilitation
      - General fitness maintenance
      required: true
    - id: 10
      name: preferred_class_time
      label: Preferred Class Time
      hint: When are you most available?
      type: select_one
      options:
      - Early morning (6-8 AM)
      - Morning (8-12 PM)
      - Afternoon (12-5 PM)
      - Evening (5-8 PM)
      - Late evening (8+ PM)
      required: true
    - id: 11
      name: class_frequency
      label: How many classes per week can you commit to?
      hint: This helps us plan appropriate progression
      type: select_one
      options:
      - 1-2 classes per week
      - 3-4 classes per week
      - 5+ classes per week
      - Flexible - undecided
      required: true
    - id: 12
      name: membership_type
      label: Membership Type
      hint: Select the membership option that works for you
      type: select_one
      options:
      - Monthly Unlimited
      - 10-Class Pack
      - Drop-in Single Class
      - Corporate Partner
      - Student/Senior Discount
      required: true
    - id: 13
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: In case we need to reach someone
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_contact_phone
      label: Emergency Contact Phone Number
      hint: Include area code
      type: text
      options: []
      required: true
    - id: 15
      name: fitness_equipment_experience
      label: Experience with gym equipment?
      hint: Do you need orientation?
      type: select_one
      options:
      - Yes - very comfortable
      - Some experience
      - No - would like orientation
      - Need beginner equipment training
      required: true
    - id: 16
      name: special_requests
      label: Any special requests or accommodations?
      hint: e.g., private trainer, modified exercises, music preferences
      type: text
      options: []
      required: false
    - id: 17
      name: waiver_acknowledgment
      label: I understand the health risks of exercise and assume full responsibility
      hint: Required to proceed
      type: select_one
      options:
      - Yes, I acknowledge and agree
      - No, I do not agree
      required: true
    - id: 18
      name: terms_acceptance
      label: I agree to the terms and conditions of the fitness center
      hint: Must accept to complete registration
      type: select_one
      options:
      - I accept
      - I do not accept
      required: true
