inputSchema:
  type: object
  properties:
    title: Smart Booking Platform Certification Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Credit Card
      - PayPal
      - Bank Transfer
      required: false
    - id: 6
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: participant_info
      label: Participant Information
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: certification_type
      label: Certification Type
      hint: null
      type: select_one
      options:
      - Level 1
      - Level 2
      - Level 3
      required: true
    - id: 9
      name: certification_date
      label: Certification Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: time_in
      label: Time In
      hint: null
      type: time
      options: []
      required: false
