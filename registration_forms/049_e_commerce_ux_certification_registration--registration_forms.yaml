inputSchema:
  type: object
  properties:
    title: E Commerce UX Certification Registration
    pages:
    - id: 1
      name: applicant_details
      label: Applicant details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: experience_level
      label: Experience level minimalist
