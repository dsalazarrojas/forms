      type: text
      options: []
      required: false
    - id: 5
      name: email
      label: Email address
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: phone
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: certification_programs_interested
      label: Certification programs interested in
      hint: null
      type: select_multiple
      options:
      - eCommece UX Certification
      - Certified ECommerce UX
      - Advanced E-Commerce UX certification
      required: false
    - id: 10
      name: name_of_institution
      label: Name of institution
      hint: null
      type: text
      options: []
      required: false
