inputSchema:
  type: object
  properties:
    title: Dance Class Waiver Form
    pages:
    - id: 1
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: waiver_status
      label: Have You Ever Had Any Injuries or Illnesses
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: false
    - id: 5
      name: waiver_text
      label: Waiver Text
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: consent
      label: Do You Consent to Participate
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact_email
      label: Emergency Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: medical_condition
      label: Do You Have Any Medical Conditions
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
