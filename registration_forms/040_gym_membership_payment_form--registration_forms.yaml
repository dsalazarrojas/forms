inputSchema:
  type: object
  properties:
    title: Gym Membership Payment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Free
      - Premium
      - Basic
      required: false
    - id: 6
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Stripe
      - PayPal
      - Bank
      required: false
    - id: 7
      name: payment_date
      label: Payment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: membership_term
      label: Membership Term
      hint: null
      type: select_one
      options:
      - Month
      - Month-to-Month
      - Month-to-Year
      - Year
      required: false
    - id: 9
      name: payment_amount
      label: Payment Amount
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: payment_frequency
      label: Payment Frequency
      hint: null
      type: select_multiple
      options:
      - Monthly
      - Quarterly
      - Annually
      required: false
    - id: 11
      name: note
      label: Note
      hint: null
      type: text
      options: []
      required: false
