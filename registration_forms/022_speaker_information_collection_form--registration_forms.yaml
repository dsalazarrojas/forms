      - 'No'
      required: false
    - id: 12
      name: bio_video
      label: Bio Video
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 13
      name: speaker_photo
      label: Speaker Photo
      hint: null
      type: text
      options: []
      required: false
