      hint: null
      type: text
      options: []
      required: true
    - id: 24
      name: referee_waiver_signed_at
      label: Date of Waiver Signing
      hint: null
      type: date
      options: []
      required: true
    - id: 25
      name: referee_waiver_signed_by_abbrev
      label: Referee Waiver Signed By Abbreviation
      hint: null
      type: text
      options: []
      required: true
