inputSchema:
  type: object
  properties:
    title: Referee Waiver Form
    pages:
    - id: 1
      name: referee_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: referee_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: true
