inputSchema:
  type: object
  properties:
    title: Personal Training Program Access Form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: Client name is required
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: Phone number is required
      type: text
      options: []
      required: true
    - id: 4
      name: training_session_date
      label: Training Session Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: training_session_time
      label: Training Session Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: trainer_preference
      label: Preferred Trainer
      hint: null
      type: select_one
      options:
      - Trainer 1
      - Trainer 2
      - Trainer 3
      - Trainer 4
      required: true
    - id: 7
      name: client_purpose
      label: Client Purpose
      hint: null
      type: select_multiple
      options:
      - Goal 1
      - Goal 2
      - Goal 3
      required: false
    - id: 8
      name: training_session_length
      label: Session Length
      hint: null
      type: select_multiple
      options:
      - 30min
      - 45min
      - 60min
      required: true
    - id: 9
      name: client_notes
      label: Client Notes
      hint: Additional notes about the client
      type: note
      options: []
      required: false
