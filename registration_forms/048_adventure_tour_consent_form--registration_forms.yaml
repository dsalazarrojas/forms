inputSchema:
  type: object
  properties:
    title: Adventure Tour Consent Form
    pages:
    - id: 1
      name: tour_header
      label: -- Tour Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant name
      hint: Full name for travel documentation
      type: text
      options: []
      required: true
    - id: 3
      name: passport_number
      label: Passport or ID number
      hint: Required for international travel
      type: text
      options: []
      required: false
    - id: 4
      name: medical_conditions
      label: Medical conditions and medications
      hint: Important for trip safety
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_contact
      label: Emergency contact name and phone
      hint: Required contact details
      type: text
      options: []
      required: true
    - id: 6
      name: consent_travel_terms
      label: Consent to travel terms and conditions
      hint: Agree to terms to participate
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 7
      name: photo_release
      label: Consent to photo use
      hint: For promotional materials
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 8
      name: dietary_requirements
      label: Dietary requirements
      hint: For tour meal planning
      type: text
      options: []
      required: false
    - id: 9
      name: signature_date
      label: Signature date
      hint: Date of consent
      type: date
      options: []
      required: true
