      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: participant_age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: participant_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: participant_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: section_parent_info
      label: -- Parent or Guardian Information (if under 18) --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: guardian_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: guardian_phone
      label: Parent or Guardian Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: guardian_email
      label: Parent or Guardian Email
      hint: null
      type: email
      options: []
      required: false
    - id: 12
      name: section_health_info
      label: -- Health Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: medical_conditions
      label: Medical Conditions or Disabilities
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: allergies
      label: Known Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: medications
      label: Current Medications
      hint: null
      type: text
      options: []
      required: false
