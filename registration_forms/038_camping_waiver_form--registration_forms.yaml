      name: understand_hazards
      label: I understand the inherent hazards of camping
      hint: null
      type: select_one
      options:
      - Yes, I understand
      - false
      required: true
    - id: 20
      name: release_liability
      label: I release the organizers from all liability claims
      hint: null
      type: select_one
      options:
      - Yes, I release
      - false
      required: true
    - id: 21
      name: authorize_emergency
