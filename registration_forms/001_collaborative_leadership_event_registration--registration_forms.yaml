inputSchema:
  type: object
  properties:
    title: Collaborative Leadership Event Registration
    pages:
    - id: 1
      name: section_participant_info
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Please enter your first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: We will send confirmation to this email
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: Primary contact number
      type: text
      options: []
      required: true
    - id: 5
      name: organization_name
      label: Organization or Group Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_event_details
      label: -- Event Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: registration_group
      label: Registration Group
      hint: Select the group you are attending with
      type: select_one
      options:
      - Executive Leadership
      - Community Advocacy
      - Educational Partners
      - Youth Mentors
      - Non-Profit Representatives
      required: true
    - id: 8
      name: attendance_days
      label: Attendance Days
      hint: Which days will you be attending?
      type: select_multiple
      options:
      - Day 1 - Leadership Workshops
      - Day 2 - Strategy Sessions
      - Day 3 - Networking Gala
      required: true
    - id: 9
      name: dietary_requirements
      label: Dietary Requirements
      hint: Please list any allergies or food restrictions
      type: text
      options: []
      required: false
    - id: 10
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: accommodation_needed
      label: Do you require overnight accommodation?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: accessibility_needs
      label: Accessibility Needs
      hint: Please describe any special requirements for accessibility
      type: text
      options: []
      required: false
    - id: 14
      name: how_did_you_hear
      label: How did you hear about this event?
      hint: null
      type: select_one
      options:
      - Social Media
      - Professional Network
      - Email Invitation
      - Website
      - Word of Mouth
      required: false
    - id: 15
      name: additional_comments
      label: Additional Comments or Questions
      hint: null
      type: text
      options: []
      required: false
