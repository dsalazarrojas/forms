inputSchema:
  type: object
  properties:
    title: Country Club Seasonal Membership Application
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: Your first name
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: Your last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Your phone number
      type: text
      options: []
      required: true
    - id: 5
      name: membership_type
      label: Membership Type
      hint: Select your membership type
      type: select_one
      options:
      - Annual
      - Monthly
      - Quarterly
      required: true
    - id: 6
      name: membership_plan
      label: Membership Plan
      hint: null
      type: select_multiple
      options:
      - Premium
      - Basic
      - Free
      required: false
    - id: 7
      name: e_signature
      label: E-signature
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: submitter_info
      label: Submitter Information
      hint: null
      type: note
      options: []
      required: false
