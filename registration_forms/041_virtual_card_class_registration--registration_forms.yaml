inputSchema:
  type: object
  properties:
    title: virtual_card_class_registration
    pages:
    - id: 1
      name: attendee_details
      label: Attendee Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: class_choices
      label: Class Choices
      hint: null
      type: select_one
      options:
      - Class 1
      - Class 2
      - Class 3
      required: false
    - id: 3
      name: consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - Agree
      - Decline
      - Undetermined
      required: false
    - id: 4
      name: submission
      label: Submission
      hint: Please submit your form to complete the registration process
      type: note
      options: []
      required: false
