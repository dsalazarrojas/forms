      name: participant_t_shirt_size
      label: T-shirt Size
      hint: null
      type: select_one
      options:
      - S
      - M
      - L
      - XL
      - XXL
      required: true
    - id: 13
      name: participant_consent
      label: Consent
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: participant_consent_other
      label: Other (specify)
      hint: null
      type: text
      options: []
      required: false
