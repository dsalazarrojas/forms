inputSchema:
  type: object
  properties:
    title: Sculpture Workshop Reservation Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: email_repeat
      label: Email (again)
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: workshop
      label: Workshop
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Morning''}'
      - '{''id'': 2, ''label'': ''Afternoon''}'
      - '{''id'': 3, ''label'': ''Evening''}'
      required: true
    - id: 7
      name: workshop_date
      label: Workshop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: workshop_time
      label: Workshop Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: num_participants
      label: Number of Participants
      hint: null
      type: number
      options: []
      required: false
