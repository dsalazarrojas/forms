inputSchema:
  type: object
  properties:
    title: Experiment Participant Information Collection Form
    pages:
    - id: 1
      name: experiment_participant_information
      label: Experiment Participant Information
      hint: Brief description of the experiment participant.
      type: text
      options: []
      required: true
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: participant_phone_number
      label: Participant Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: true
    - id: 5
      name: participant_dob
      label: Participant Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: participant_education_level
      label: Participant Education Level
      hint: null
      type: select_one
      options:
      - High School
      - Bachelor
      - Masters
      - Doctoral
      required: true
    - id: 7
      name: participant_education_fields
      label: Participant Education Fields
      hint: null
      type: select_multiple
      options:
      - Arts
      - Engineering
      - Medicine
      - Science
      required: false
    - id: 8
      name: participant_languages_spoken
      label: Participant Languages Spoken
      hint: List of languages spoken by the participant.
      type: text
      options: []
      required: false
    - id: 9
      name: participant_languages_spoken_other
      label: Participant Languages Spoken Other
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: participant_languages_spoken_count
      label: Participant Languages Spoken Count
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: participant_education_institutions
      label: Participant Education Institutions
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: participant_hobbies
      label: Participant Hobbies
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: participant_languages_spoken_other_languages
      label: Participant Languages Spoken Other Languages
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: participant_languages_spoken_count_other_languages
      label: Participant Languages Spoken Count Other Languages
      hint: null
      type: text
      options: []
      required: false
