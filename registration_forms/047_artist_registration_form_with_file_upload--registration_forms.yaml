inputSchema:
  type: object
  properties:
    title: Artist Registration Form With File Upload
    pages:
    - id: 1
      name: section_header_1
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: artist_name
      label: Artist or Stage Name
      hint: How you want to be credited
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: false
    - id: 6
      name: section_header_2
      label: -- Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: email_address
      label: Email Address
      hint: Primary contact email
      type: email
      options: []
      required: true
    - id: 8
      name: phone_number
      label: Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 9
      name: address
      label: Street Address
      hint: Your mailing address
      type: text
      options: []
      required: false
    - id: 10
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: section_header_3
      label: -- Artistic Background --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: primary_discipline
      label: Primary Artistic Discipline
      hint: Your main area of artistic work
      type: select_one
      options:
      - Music
      - Visual Art
      - Theater
      - Dance
      - Comedy
      - Film
      - Writing
      - Digital Media
      - Other
      required: true
    - id: 13
      name: primary_medium
      label: Primary Medium or Style
      hint: Specific focus within your discipline
      type: text
      options: []
      required: true
    - id: 14
      name: years_experience
      label: Years of Experience
      hint: How long have you been creating?
      type: number
      options: []
      required: false
    - id: 15
      name: artist_biography
      label: Artist Biography
      hint: Professional bio (50-100 words)
      type: text
      options: []
      required: true
    - id: 16
      name: section_header_4
      label: -- Professional Experience --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: notable_performances
      label: Notable Performances or Exhibitions
      hint: Major venues or shows
      type: text
      options: []
      required: false
    - id: 18
      name: awards_recognition
      label: Awards or Recognition Received
      hint: Any accolades or honors
      type: text
      options: []
      required: false
    - id: 19
      name: section_header_5
      label: -- File Uploads --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: resume_upload
      label: Resume or CV Upload
      hint: Upload your professional resume
      type: text
      options: []
      required: false
    - id: 21
      name: portfolio_samples
      label: Portfolio Samples or Work Samples
      hint: Upload examples of your work
      type: text
      options: []
      required: false
    - id: 22
      name: headshot_photo
      label: Professional Headshot Photo
      hint: Upload a high-quality headshot
      type: text
      options: []
      required: false
    - id: 23
      name: additional_documents
      label: Additional Documents or Materials
      hint: Any other relevant files
      type: text
      options: []
      required: false
    - id: 24
      name: registration_confirmation
      label: I Confirm All Information is Accurate and Complete
      hint: Verify your registration information
      type: select_one
      options:
      - Yes, I Confirm
      - No, I Need to Make Changes
      required: true
    - id: 25
      name: contact_permission
      label: Organization May Contact Me About Opportunities
      hint: Permission to reach out with opportunities
      type: select_one
      options:
      - Yes, please contact me
      - No, do not contact
      - Email only
      required: false
