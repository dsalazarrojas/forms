inputSchema:
  type: object
  properties:
    title: Community Service Activity Attendance Form
    pages:
    - id: 1
      name: section_participant_info
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: volunteer_type
      label: Volunteer Type
      hint: Select the one that best describes you.
      type: select_one
      options:
      - Returning Volunteer
      - New Volunteer
      - Community Member
      - Student
      required: true
    - id: 6
      name: student_school_name
      label: School Name
      hint: Only required if you are a student.
      type: text
      options: []
      required: false
    - id: 7
      name: section_activity_details
      label: -- Activity Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: activity_title
      label: Title of the Service Activity
      hint: Provide the name of the project or event.
      type: text
      options: []
      required: true
    - id: 9
      name: date_of_activity
      label: Date of the Activity
      hint: null
      type: date
      options: []
      required: true
    - id: 10
      name: arrival_time
      label: Time of Arrival
      hint: null
      type: time
      options: []
      required: true
    - id: 11
      name: departure_time
      label: Time of Departure
      hint: null
      type: time
      options: []
      required: true
    - id: 12
      name: total_hours
      label: Total Hours Completed
      hint: Enter hours and minutes (e.g. 4.5).
      type: number
      options: []
      required: true
    - id: 13
      name: tasks_performed
      label: Brief description of tasks performed
      hint: Describe what you did during the session.
      type: text
      options: []
      required: true
    - id: 14
      name: section_emergency_contact
      label: -- Emergency Contact --
      hint: Information for safety purposes.
      type: note
      options: []
      required: false
    - id: 15
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 17
      name: supervisor_verification
      label: Was your activity supervised?
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 18
      name: supervisor_name
      label: Name of Supervisor on-site
      hint: Who verified your attendance?
      type: text
      options: []
      required: true
