inputSchema:
  type: object
  properties:
    title: Choir Audition Form
    pages:
    - id: 1
      name: applicant_information
      label: Applicant Information
      hint: Your personal details
      type: note
      options: []
      required: false
    - id: 2
      name: applicant_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: applicant_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: age
      label: Age
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-binary
      - Prefer not to say
      - Other
      required: false
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: address
      label: Address
      hint: Street, city, state, zip
      type: text
      options: []
      required: false
    - id: 10
      name: school_or_organization
      label: School or Organization
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 11
      name: grade_level
      label: Grade Level
      hint: If student
      type: text
      options: []
      required: false
    - id: 12
      name: vocal_information
      label: Vocal Information
      hint: Your singing background
      type: note
      options: []
      required: false
    - id: 13
      name: voice_part
      label: Preferred Voice Part
      hint: null
      type: select_one
      options:
      - Soprano
      - Alto
      - Tenor
      - Bass
      - Mezzo-soprano
      - Baritone
      - Not sure
      required: true
    - id: 14
      name: vocal_range
      label: Vocal Range
      hint: Lowest to highest note
      type: text
      options: []
      required: false
    - id: 15
      name: years_singing
      label: How many years have you been singing
      hint: null
      type: number
      options: []
      required: false
    - id: 16
      name: choir_experience
      label: Previous Choir Experience
      hint: null
      type: select_one
      options:
      - None
      - 1-2 years
      - 3-5 years
      - 6-10 years
      - More than 10 years
      required: true
    - id: 17
      name: previous_choirs
      label: List Previous Choirs
      hint: Names and dates
      type: text
      options: []
      required: false
    - id: 18
      name: can_read_music
      label: Can you read sheet music
      hint: null
      type: select_one
      options:
      - Yes, fluently
      - Yes, basically
      - A little
      - 'False'
      required: true
    - id: 19
      name: has_performed_solo
      label: Have you performed solo before
      hint: null
      type: select_one
      options:
      - Yes, frequently
      - Yes, a few times
      - Yes, once
      - 'False'
      required: false
    - id: 20
      name: musical_training
      label: Musical Training
      hint: Lessons or education
      type: text
      options: []
      required: false
    - id: 21
      name: plays_instrument
      label: Do you play any musical instruments
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 22
      name: instruments_list
      label: List Instruments
      hint: If yes
      type: text
      options: []
      required: false
    - id: 23
      name: audition_preferences
      label: Audition Preferences
      hint: Scheduling
      type: note
      options: []
      required: false
    - id: 24
      name: preferred_audition_date
      label: Preferred Audition Date
      hint: null
      type: date
      options: []
      required: true
    - id: 25
      name: preferred_audition_time
      label: Preferred Audition Time
      hint: null
      type: time
      options: []
      required: true
    - id: 26
      name: alternate_dates
      label: Alternate Date Preferences
      hint: Other options
      type: text
      options: []
      required: false
    - id: 27
      name: audition_piece
      label: What piece will you perform
      hint: Song title and composer
      type: text
      options: []
      required: true
    - id: 28
      name: piece_language
      label: Language of Piece
      hint: null
      type: text
      options: []
      required: false
    - id: 29
      name: needs_accompanist
      label: Do you need an accompanist
      hint: null
      type: select_one
      options:
      - 'True'
      - No, I will bring one
      - No, I will sing a cappella
      - No, I have backing track
      required: true
    - id: 30
      name: backing_track
      label: Will you provide backing track
      hint: If no accompanist
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 31
      name: availability
      label: Availability
      hint: Rehearsal times
      type: note
      options: []
      required: false
    - id: 32
      name: available_days
      label: Available Days for Rehearsal
      hint: Select all that apply
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 33
      name: available_times
      label: Available Times
      hint: Select all that apply
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 34
      name: schedule_conflicts
      label: Known Schedule Conflicts
      hint: Dates you cannot attend
      type: text
      options: []
      required: false
    - id: 35
      name: commitment
      label: Commitment
      hint: Your dedication
      type: note
      options: []
      required: false
    - id: 36
      name: understand_commitment
      label: Do you understand the time commitment required
      hint: Rehearsals and performances
      type: select_one
      options:
      - Yes, completely
      - Yes, mostly
      - Somewhat
      - No, need more information
      required: true
    - id: 37
      name: willing_to_practice
      label: Are you willing to practice independently
      hint: null
      type: select_one
      options:
      - Yes, definitely
      - Yes, somewhat
      - Maybe
      - 'False'
      required: true
    - id: 38
      name: performance_attendance
      label: Can you commit to all scheduled performances
      hint: null
      type: select_one
      options:
      - 'True'
      - No, have some conflicts
      - Not sure
      required: true
    - id: 39
      name: additional_skills
      label: Additional Skills
      hint: Other talents
      type: note
      options: []
      required: false
    - id: 40
      name: other_skills
      label: Do you have other relevant skills
      hint: Dance, acting, etc.
      type: text
      options: []
      required: false
    - id: 41
      name: why_join
      label: Why do you want to join this choir
      hint: null
      type: text
      options: []
      required: true
    - id: 42
      name: goals
      label: What are your musical goals
      hint: null
      type: text
      options: []
      required: false
    - id: 43
      name: how_did_you_hear
      label: How Did You Hear About This Choir
      hint: null
      type: select_one
      options:
      - Friend or family
      - School
      - Social media
      - Advertisement
      - Previous performance
      - Website
      - Other
      required: false
    - id: 44
      name: additional_comments
      label: Additional Comments
      hint: Anything else
      type: text
      options: []
      required: false
    - id: 45
      name: applicant_signature
      label: Applicant Signature
      hint: Digital signature
      type: text
      options: []
      required: true
    - id: 46
      name: application_date
      label: Date of Application
      hint: null
      type: date
      options: []
      required: true
