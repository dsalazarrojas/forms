inputSchema:
  type: object
  properties:
    title: Community League Tournament Enrollment Form
    pages:
    - id: 1
      name: team_name
      label: Team Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: sport_category
      label: Tournament Sport Category
      hint: null
      type: select_one
      options:
      - Soccer (Outdoor)
      - Basketball (Indoor)
      - Softball / Baseball
      - Volleyball (Sand or Court)
      - Pickleball
      required: true
    - id: 3
      name: team_division
      label: Competitive Division
      hint: null
      type: select_one
      options:
      - Youth (Under 16)
      - Young Adult (16-25)
      - Adult Open (26-45)
      - Senior (Over 45)
      - Professional / Elite
      required: true
    - id: 4
      name: section_coach
      label: -- Coaching and Management --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: coach_name
      label: Coach or Team Manager Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: coach_email
      label: Coach Contact Email
      hint: Primary point of contact
      type: email
      options: []
      required: true
    - id: 7
      name: coach_phone
      label: Coach Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: player_count
      label: Total Number of Registered Players
      hint: null
      type: number
      options: []
      required: true
    - id: 9
      name: team_roster_summary
      label: Full Team Roster Summary
      hint: List names and jersey numbers
      type: text
      options: []
      required: true
    - id: 10
      name: jersey_colors
      label: Primary and Secondary Jersey Colors
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: home_field_preference
      label: Preferred Home Field or Court Location
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 12
      name: weekend_availability
      label: General Weekend Availability for Games
      hint: Select all that apply
      type: select_multiple
      options:
      - Saturday Morning (8 AM - 12 PM)
      - Saturday Afternoon (12 PM - 5 PM)
      - Sunday Morning (8 AM - 12 PM)
      - Sunday Afternoon (12 PM - 5 PM)
      required: true
    - id: 13
      name: prior_participation
      label: Has this team participated in our tournaments before?
      hint: null
      type: select_one
      options:
      - Yes, previously enrolled
      - No, this is our first time
      required: true
    - id: 14
      name: fee_acknowledgement
      label: I acknowledge the registration fee is due before the first game
      hint: null
      type: select_one
      options:
      - I Understand and Acknowledge
      - Other
      required: true
    - id: 15
      name: registration_date
      label: Date of Enrollment
      hint: null
      type: date
      options: []
      required: true
