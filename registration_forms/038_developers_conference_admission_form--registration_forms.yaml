inputSchema:
  type: object
  properties:
    title: Developers Conference Admission Form
    pages:
    - id: 1
      name: conference_name
      label: Conference Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: attendee_type
      label: Attendee Type
      hint: null
      type: select_one
      options:
      - Developers
      - Organizer
      - Sponsor
      required: false
    - id: 5
      name: preferences
      label: Preferences
      hint: null
      type: select_multiple
      options:
      - Breakfast
      - Lunch
      - Dinner
      - Social Event
      required: false
    - id: 6
      name: arrival_date
      label: Arrival Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
