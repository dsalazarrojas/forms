inputSchema:
  type: object
  properties:
    title: Children's Personality Model Call Registration
    pages:
    - id: 1
      name: parent_information
      label: -- Parent Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: parent_name
      label: Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: We will use this for scheduling
      type: text
      options: []
      required: true
    - id: 5
      name: preferred_contact
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text
      required: true
    - id: 6
      name: child_information
      label: -- Child Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: child_name
      label: Child Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: child_age
      label: Child Age
      hint: In years
      type: number
      options: []
      required: true
    - id: 9
      name: child_birthday
      label: Child Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: grade_level
      label: Grade Level or School Level
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: personality_type
      label: -- Personality Model Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: primary_personality
      label: Child Primary Personality Type
      hint: null
      type: select_one
      options:
      - Director
      - Socializer
      - Thinker
      - Supporter
      - Unsure
      required: false
    - id: 13
      name: personality_description
      label: Describe your child's personality style
      hint: How does your child interact and behave
      type: text
      options: []
      required: false
    - id: 14
      name: communication_style
      label: Child Communication Style
      hint: null
      type: select_one
      options:
      - Verbal and expressive
      - Quiet and thoughtful
      - Active and hands-on
      - Mixed approaches
      required: false
    - id: 15
      name: program_goals
      label: -- Program Goals and Interests --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: program_focus
      label: Areas you want to focus on
      hint: Select all that apply
      type: select_multiple
      options:
      - Social skills
      - Communication
      - Confidence building
      - Self-awareness
      - Leadership skills
      - Academic support
      - Emotional intelligence
      required: true
    - id: 17
      name: specific_concerns
      label: Specific concerns or challenges
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: session_scheduling
      label: -- Session Scheduling --
      hint: null
      type: note
      options: []
      required: false
    - id: 19
      name: preferred_day
      label: Preferred Day for Call
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 20
      name: preferred_time
      label: Preferred Time for Call
      hint: null
      type: select_one
      options:
      - Morning (8am-12pm)
      - Afternoon (12pm-5pm)
      - Evening (5pm-8pm)
      - Flexible
      required: true
    - id: 21
      name: call_duration
      label: Preferred Call Duration
      hint: null
      type: select_one
      options:
      - 15 minutes
      - 30 minutes
      - 45 minutes
      - 1 hour
      - 1.5 hours
      required: true
    - id: 22
      name: timezone
      label: Your Timezone
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: additional_info
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: additional_comments
      label: Additional Information or Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: agreement
      label: I agree to participate in the personality model call
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
