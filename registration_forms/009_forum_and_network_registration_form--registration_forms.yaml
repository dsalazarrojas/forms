inputSchema:
  type: object
  properties:
    title: Forum And Network Registration Form
    pages:
    - id: 1
      name: registration_form
      label: What's the purpose of your registration?
      hint: Tell us a little bit about yourself.
      type: text
      options: []
      required: false
    - id: 2
      name: user_email
      label: User Email
      hint: Enter your email address.
      type: email
      options: []
      required: true
    - id: 3
      name: user_name
      label: User Name
      hint: Enter your name.
      type: text
      options: []
      required: false
    - id: 4
      name: event_date
      label: Event Date
      hint: Select the date of the event.
      type: date
      options: []
      required: false
    - id: 5
      name: event_agreement
      label: Event Agreement
      hint: Any comments or notes about the event.
      type: text
      options: []
      required: false
    - id: 6
      name: agree_terms
      label: Agree to Terms
      hint: Agree to the terms and conditions of the forum.
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 7
      name: event_agreement_note
      label: Event Agreement Note
      hint: Any additional comments about the event.
      type: text
      options: []
      required: false
    - id: 8
      name: user_agreement
      label: User Agreement
      hint: Agreement with the user agreement.
      type: text
      options: []
      required: false
    - id: 9
      name: form_agreement
      label: Form Agreement
      hint: Agreement with the form.
      type: text
      options: []
      required: false
    - id: 10
      name: agreement_date
      label: Agreement Date
      hint: Select the date of the agreement.
      type: date
      options: []
      required: false
    - id: 11
      name: agreement_time
      label: Agreement Time
      hint: Select the time of the agreement.
      type: time
      options: []
      required: false
    - id: 12
      name: agreement_note
      label: Agreement Note
      hint: Any additional comments about the agreement.
      type: text
      options: []
      required: false
