inputSchema:
  type: object
  properties:
    title: online-training-request-form
    pages:
    - id: 1
      name: user_name
      label: User Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: preferred_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: training_session_duration
      label: Training Session Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 7
      name: training_session_type
      label: Training Session Type
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 8
      name: training_session_type_options
      label: Training Session Type Options
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 9
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: confirm_submission
      label: Confirm Submission
      hint: null
      type: select_one
      options:
      - Confirm
      - Other
      required: false
