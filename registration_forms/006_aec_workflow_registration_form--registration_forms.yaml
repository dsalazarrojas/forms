inputSchema:
  type: object
  properties:
    title: AEC Workflow Registration Form
    pages:
    - id: 1
      name: company_info_header
      label: '--- Company and Professional Information ---'
      hint: Details for professional AEC registration
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: professional_discipline
      label: Primary Discipline
      hint: null
      type: select_one
      options:
      - Architecture
      - Structural Engineering
      - MEP Engineering
      - Civil Engineering
      - General Contracting
      - Project Management
      - Interior Design
      required: true
    - id: 5
      name: professional_license_id
      label: Professional License / Membership ID
      hint: e.g., AIA, PE, RIBA number
      type: text
      options: []
      required: false
    - id: 6
      name: work_email
      label: Work Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: work_phone
      label: Work Phone Number
      hint: null
      type: phone
      options: []
      required: true
    - id: 8
      name: workflow_interests_header
      label: '--- Workflow and Software Interests ---'
      hint: Help us place you in the right sessions.
      type: note
      options: []
      required: false
    - id: 9
      name: software_proficiency
      label: Primary Software Used
      hint: Select all that apply.
      type: select_multiple
      options:
      - Autodesk Revit
      - AutoCAD
      - Rhino / Grasshopper
      - ArchiCAD
      - Bluebeam Revu
      - Navisworks
      - Bentley Systems
      required: true
    - id: 10
      name: workflow_focus_areas
      label: Workflow Focus Areas
      hint: Select areas you wish to explore during the event.
      type: select_multiple
      options:
      - BIM Coordination
      - Generative Design
      - Sustainable Design / Analysis
      - VDC (Virtual Design and Construction)
      - Digital Twin Technology
      - Cloud Collaboration
      required: true
    - id: 11
      name: experience_level_bim
      label: BIM Implementation Experience Level
      hint: null
      type: select_one
      options:
      - Beginner (Learning)
      - Intermediate (Regular use)
      - Advanced (Workflow optimization)
      - Expert (Strategic implementation)
      required: true
    - id: 12
      name: session_selection_header
      label: '--- Session and Workshop Selection ---'
      hint: Please select your preferred sessions.
      type: note
      options: []
      required: false
    - id: 13
      name: workshop_selection
      label: Select a Technical Workshop
      hint: Choose one workshop for the afternoon block.
      type: select_one
      options:
      - Automation with Dynamo
      - Clash Detection Best Practices
      - Reality Capture and LiDAR
      - Managing Large-Scale BIM Projects
      required: true
    - id: 14
      name: logistics_header
      label: '--- Logistics and Emergency Contact ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 16
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: phone
      options: []
      required: true
    - id: 17
      name: additional_requirements
      label: Any additional requirements or comments?
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: registration_status
      label: 'Internal Use: Registration Status'
      hint: null
      type: select_one
      options:
      - Pending
      - Confirmed
      - Cancelled
      required: false
