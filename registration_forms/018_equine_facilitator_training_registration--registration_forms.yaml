      name: workshop_date
      label: Desired Workshop Date
      hint: null
      type: date
      options: []
      required: false
    - id: 10
      name: workshop_time
      label: Desired Workshop Time
      hint: null
      type: select_one
      options:
      - 10:00-11:30
      - 13:00-14:00
      - 16:00-17:00
      required: false
    - id: 11
      name: availability
      label: Availability
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: other_equine_experience
      label: Other Equine Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: message
      label: Message
      hint: null
      type: text
      options: []
      required: false
