      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: equine_experience
      label: Equine Experience
      hint: null
      type: select_multiple
      options:
      - Less than 1 year
      - 1-2 years
      - 2-5 years
      - More than 5 years
      required: false
    - id: 7
      name: training_history
      label: Training History
      hint: null
      type: select_one
