inputSchema:
  type: object
  properties:
    title: Leadership Development Volunteer Registration Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: First name of the person registering
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: volunteer_type
      label: Volunteer type
      hint: null
      type: select_one
      options:
      - Option 1
      - Option 2
      - Option 3
      - Option 4
      required: false
    - id: 6
      name: skills
      label: Skills
      hint: null
      type: select_multiple
      options:
      - Skill 1
      - Skill 2
      - Skill 3
      - Skill 4
      required: false
    - id: 7
      name: interests
      label: Interests
      hint: null
      type: select_multiple
      options:
      - Interest 1
      - Interest 2
      - Interest 3
      - Interest 4
      required: false
