inputSchema:
  type: object
  properties:
    title: Yoga Class Reservation Form
    pages:
    - id: 1
      name: user_input
      label: User Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: class_type
      label: Class Type
      hint: null
      type: select_one
      options:
      - Asana
      - Vinyasa
      - Restorative
      required: false
    - id: 6
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: availability
      label: Availability
      hint: null
      type: select_multiple
      options:
      - Available
      - Unavailable
      required: false
    - id: 9
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
