inputSchema:
  type: object
  properties:
    title: Personal Introduction Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: background
      label: Background
      hint: Enter a brief description of your background or experience.
      type: text
      options: []
      required: true
    - id: 6
      name: interests
      label: Interests
      hint: Enter a brief description of your interests or skills.
      type: text
      options: []
      required: true
    - id: 7
      name: photo_url
      label: Profile Picture
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 9
      name: time_of_birth
      label: Time of Birth
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: category
      label: Category
      hint: null
      type: select_one
      options:
      - Programming
      - Design
      - Business
      - Arts
      - Sports
      - Music
      - Politics
      - Health
      required: true
    - id: 12
      name: language
      label: Language
      hint: null
      type: select_multiple
      options:
      - English
      - Spanish
      - French
      - Mandarin
      - Arabic
      - Russian
      - Japanese
      - Korean
      required: true
    - id: 13
      name: workshop_attend
      label: Which workshop you will attend
      hint: null
      type: select_multiple
      options:
      - Workshop A
      - Workshop B
      - Workshop C
      required: true
