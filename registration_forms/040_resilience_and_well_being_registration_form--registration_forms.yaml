inputSchema:
  type: object
  properties:
    title: Resilience And Well Being Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: time_of_registration
      label: Time of Registration
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: program_interest
      label: Which program is the participant interested in?
      hint: null
      type: select_multiple
      options:
      - Physical Resilience
      - Mental Well Being
      - Emotional Well Being
      required: true
    - id: 8
      name: program_frequency
      label: How often is the participant interested in the program?
      hint: null
      type: select_one
      options:
      - Daily
      - Weekly
      - Monthly
      - Quarterly
      - Rarely
      required: true
    - id: 9
      name: additional_comments
      label: Additional Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: terms_and_conditions
      label: Terms and Conditions
      hint: null
      type: text
      options: []
      required: true
