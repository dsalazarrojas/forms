inputSchema:
  type: object
  properties:
    title: investor_relationship_registration_form
    pages:
    - id: 1
      name: user_name
      label: name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: user_email
      label: email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: user_country
      label: Country
      hint: null
      type: select_one
      options:
      - Australia
      - Canada
      - China
      - Germany
      - India
      - Japan
      - New Zealand
      - United States
      required: true
    - id: 4
      name: user_city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: user
      label: Province
      hint: null
      type: select_multiple
      options:
      - Ontario
      - Quebec
      - British Columbia
      - Alberta
      - Saskatchewan
      - Manitoba
      - Nova Scotia
      - New Brunswick
      - Prince Edward Island
      - Newfoundland and Labrador
      required: false
    - id: 6
      name: form_submit_by
      label: Form Submit By
      hint: null
      type: select_one
      options:
      - Form Submit Button
      - Other
      required: true
    - id: 7
      name: form_language
      label: language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      required: true
    - id: 8
      name: form_timezone
      label: timezone
      hint: null
      type: select_one
      options:
      - Eastern Time Zone
      - Pacific Time Zone
      - Central Time Zone
      required: true
    - id: 9
      name: user_message
      label: Message
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: form_submission_status
      label: Form Submission Status
      hint: null
      type: select_one
      options:
      - Draft
      - Submitted
      - Rejected
      required: true
    - id: 11
      name: submit_time
      label: Submission Time
      hint: null
      type: time
      options: []
      required: true
