inputSchema:
  type: object
  properties:
    title: Employee Orientation Week Registration
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: position
      label: Position
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: session_sign_up
      label: Session Sign-up
      hint: Please select sessions you wish to attend
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 4
      name: start_date
      label: Start Date
      hint: Date of session start
      type: date
      options: []
      required: true
    - id: 5
      name: start_time
      label: Start Time
      hint: Time of session start
      type: time
      options: []
      required: true
    - id: 6
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: end_time
      label: End Time
      hint: Time of session end
      type: time
      options: []
      required: true
    - id: 8
      name: new_employees
      label: New Employees
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 9
      name: session_attended
      label: Sessions Attended
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 10
      name: session_details
      label: Session Details
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 11
      name: session_status
      label: Session Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
