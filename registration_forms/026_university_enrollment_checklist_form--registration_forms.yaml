inputSchema:
  type: object
  properties:
    title: University Enrollment Checklist Form
    pages:
    - id: 1
      name: student_info
      label: Student Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: course_selection
      label: Select Courses
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 4
      name: documentation
      label: Upload Documentation
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: confirmation
      label: Confirmation
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: scheduled_event
      label: Scheduled Event
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: comments
      label: Special Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: enrollment_status
      label: Enrollment Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
