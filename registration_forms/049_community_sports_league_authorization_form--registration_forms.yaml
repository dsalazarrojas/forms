      name: authorization_section
      label: Authorization and Consent
      hint: Important agreements
      type: note
      options: []
      required: false
    - id: 35
      name: participation_consent
      label: I Consent to Participation
      hint: null
      type: select_one
      options:
      - Yes - I Consent
      - No - I Do Not Consent
      required: true
    - id: 36
      name: risk_acknowledgment
      label: I Understand There Are Risks
      hint: null
      type: select_one
      options:
      - Yes - I Understand
      - No - I Do Not Understand
      required: true
    - id: 37
      name: liability_release
      label: I Release the Organization from Liability
      hint: null
      type: select_one
      options:
      - Yes - I Agree
      - No - I Do Not Agree
      required: true
    - id: 38
      name: medical_treatment
      label: I Authorize Emergency Medical Treatment
      hint: If needed
      type: select_one
      options:
      - Yes - I Authorize
      - No - I Do Not Authorize
      required: true
    - id: 39
      name: photo_consent
      label: Photo and Video Consent
      hint: null
      type: select_one
      options:
      - Yes - I Consent
      - No - I Do Not Consent
      required: true
    - id: 40
      name: transportation
      label: Transportation Authorization
      hint: For away games
      type: select_one
      options:
      - Yes - I Authorize
      - No - I Do Not Authorize
      required: false
    - id: 41
      name: rules_agreement
      label: I Agree to Follow League Rules
      hint: Code of conduct
      type: select_one
      options:
      - Yes - I Agree
      - No - I Do Not Agree
      required: true
    - id: 42
      name: participant_signature
      label: Participant Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 43
      name: signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
    - id: 44
      name: guardian_signature
      label: Guardian Signature
      hint: If under 18
      type: text
      options: []
      required: false
    - id: 45
      name: guardian_date
      label: Guardian Date
      hint: null
      type: date
      options: []
      required: false
