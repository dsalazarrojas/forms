      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
