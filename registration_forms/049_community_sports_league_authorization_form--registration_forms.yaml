      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: zip_code
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: guardian_info
      label: Parent or Guardian Information
      hint: If participant is under 18
      type: note
      options: []
      required: false
    - id: 16
      name: is_minor
      label: Is Participant Under 18
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 17
      name: guardian_first_name
      label: Guardian First Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 18
      name: guardian_last_name
      label: Guardian Last Name
      hint: null
      type: text
      options: []
      required: false
