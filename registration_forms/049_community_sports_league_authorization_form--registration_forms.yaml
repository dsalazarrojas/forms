    - id: 6
      name: height
      label: Height
      hint: In feet and inches
      type: text
      options: []
      required: false
    - id: 7
      name: weight
      label: Weight
      hint: In pounds
      type: number
      options: []
      required: false
    - id: 8
      name: email
      label: Email Address
