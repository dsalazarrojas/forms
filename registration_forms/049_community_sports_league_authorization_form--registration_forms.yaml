inputSchema:
  type: object
  properties:
    title: Community Sports League Authorization Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: Player details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
