inputSchema:
  type: object
  properties:
    title: ADR Networking Event Application
    pages:
    - id: 1
      name: attendee_info_header
      label: '--- Attendee Information ---'
      hint: Please provide your professional contact details.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: Confirmation will be sent here.
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: organization_firm
      label: Organization / Law Firm
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: professional_role
      label: Professional Role
      hint: null
      type: select_one
      options:
      - Mediator
      - Arbitrator
      - Attorney
      - Academic
      - Student
      - Other
      required: true
    - id: 7
      name: adr_experience_years
      label: Years of Experience in ADR
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: interests_header
      label: '--- Event Interests and Sessions ---'
      hint: Help us tailor the networking experience.
      type: note
      options: []
      required: false
    - id: 9
      name: areas_of_practice
      label: Areas of Practice / Interest
      hint: Select all that apply.
      type: select_multiple
      options:
      - Commercial Mediation
      - Family Law
      - Labor and Employment
      - International Arbitration
      - Community Mediation
      - Online Dispute Resolution (ODR)
      required: true
    - id: 10
      name: networking_goals
      label: What are your primary goals for attending this event?
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: session_preferences
      label: Preferred Breakout Sessions
      hint: null
      type: select_multiple
      options:
      - Advanced Mediation Techniques
      - The Future of Arbitration
      - Ethics in ADR
      - Building a Successful ADR Practice
      required: true
    - id: 12
      name: logistics_header
      label: '--- Logistics and Dietary Requirements ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: dietary_restrictions
      label: Dietary Restrictions / Allergies
      hint: null
      type: select_multiple
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Dairy-Free
      - Nut Allergy
      required: false
    - id: 14
      name: accessibility_needs
      label: Do you have any specific accessibility requirements?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: previous_attendance
      label: Have you attended an ADR networking event with us before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: referral_source
      label: How did you hear about this event?
      hint: null
      type: select_one
      options:
      - Email Invitation
      - LinkedIn
      - Colleague Referral
      - Bar Association Website
      required: false
    - id: 17
      name: additional_comments
      label: Any other comments or questions for the organizers?
      hint: null
      type: text
      options: []
      required: false
