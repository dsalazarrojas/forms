inputSchema:
  type: object
  properties:
    title: Clean Water Project Registration Form
    pages:
    - id: 1
      name: project_intro
      label: -- Clean Water Project Registration --
      hint: Register to support or participate in our clean water initiatives.
      type: note
      options: []
      required: false
    - id: 2
      name: registrant_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: registrant_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: registrant_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: organization_affiliation
      label: Organization Affiliation
      hint: e.g. NGO, School, Corporation, or Individual
      type: text
      options: []
      required: false
    - id: 6
      name: participation_role
      label: Preferred Role
      hint: null
      type: select_one
      options:
      - Volunteer
      - Donor
      - Technical Expert
      - Community Advocate
      - Project Partner
      required: true
    - id: 7
      name: geographic_interest
      label: Geographic Area of Interest
      hint: null
      type: select_multiple
      options:
      - Local Community
      - Regional
      - National
      - International
      required: true
    - id: 8
      name: specific_skills
      label: Specific Skills or Expertise
      hint: e.g. Engineering, Education, Logistics, Fundraising
      type: text
      options: []
      required: false
    - id: 9
      name: availability
      label: Typical Availability
      hint: null
      type: select_one
      options:
      - Weekdays
      - Weekends
      - Evening only
      - Variable
      required: false
    - id: 10
      name: experience_level
      label: Previous experience with water projects?
      hint: null
      type: select_one
      options:
      - None
      - Some experience
      - Experienced
      - Professional Expert
      required: true
    - id: 11
      name: motivation_statement
      label: Why are you interested in this project?
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: consent_header
      label: -- Consent and Acknowledgement --
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: communication_consent
      label: I consent to receive project updates and communications
      hint: null
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 14
      name: liability_waiver
      label: I agree to the terms and volunteer liability waiver
      hint: null
      type: select_one
      options:
      - I agree
      - Other
      required: true
    - id: 15
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: Required for active volunteers
      type: text
      options: []
      required: false
    - id: 16
      name: registration_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
