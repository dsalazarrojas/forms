inputSchema:
  type: object
  properties:
    title: Win A Survival Kit Contest Entry Form
    pages:
    - id: 1
      name: entry_form
      label: Full Name
      hint: Enter your full name as it appears on your ID
      type: text
      options: []
      required: true
    - id: 2
      name: contact_info
      label: Contact Information
      hint: Enter your email address and phone number
      type: text
      options: []
      required: true
    - id: 3
      name: contest_info
      label: Contest Information
      hint: Briefly describe the contest
      type: text
      options: []
      required: true
    - id: 4
      name: contest_rules
      label: Contest Rules
      hint: Acknowledge understanding of the contest rules
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 5
      name: terms_of_service
      label: Terms of Service
      hint: Acknowledge understanding of the terms of service
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 6
      name: winner_notification
      label: Winner Notification
      hint: How would you like to receive the winner notification
      type: select_one
      options:
      - Email
      - Phone
      - Both
      required: true
    - id: 7
      name: additional_comments
      label: Additional Comments
      hint: Any other information you'd like to share
      type: text
      options: []
      required: false
    - id: 8
      name: confirm_contact_info
      label: Confirm Contact Information
      hint: Enter your email address and phone number again
      type: text
      options: []
      required: false
    - id: 9
      name: confirm_contest_info
      label: Confirm Contest Information
      hint: Briefly describe the contest again
      type: text
      options: []
      required: false
    - id: 10
      name: confirm_terms_of_service
      label: Confirm Terms of Service
      hint: Reiterate understanding of the terms of service
      type: checkbox
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 11
      name: confirm_winner_notification
      label: Confirm Winner Notification
      hint: Confirm how you want to receive the winner notification
      type: select_one
      options:
      - Email
      - Phone
      - Both
      required: false
    - id: 12
      name: additional_info
      label: Additional Information
      hint: Is there anything else you'd like to share?
      type: text
      options: []
      required: false
