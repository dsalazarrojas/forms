inputSchema:
  type: object
  properties:
    title: COVID 19 Vaccine Registration Form
    pages:
    - id: 1
      name: registrant_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: registrant_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: registrant_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: address_section
      label: -- Address Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: street_address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: zip_code
      label: Zip Code
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: vaccination_section
      label: -- Vaccination Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: vaccination_status
      label: Vaccination Status
      hint: null
      type: select_one
      options:
      - Not yet vaccinated
      - First dose scheduled
      - First dose completed
      - Second dose scheduled
      - Fully vaccinated
      - Booster due
      required: true
    - id: 12
      name: vaccine_type
      label: Preferred Vaccine Type
      hint: null
      type: select_one
      options:
      - Pfizer
      - Moderna
      - Johnson and Johnson
      - No preference
      - Unsure
      required: true
    - id: 13
      name: first_dose_date
      label: First Dose Date
      hint: If applicable
      type: date
      options: []
      required: false
    - id: 14
      name: second_dose_date
      label: Second Dose Date
      hint: If applicable
      type: date
      options: []
      required: false
    - id: 15
      name: booster_date
      label: Booster Dose Date
      hint: If applicable
      type: date
      options: []
      required: false
    - id: 16
      name: registration_section
      label: -- Registration Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: reason_for_registration
      label: Reason for Registration
      hint: null
      type: select_one
      options:
      - First time registration
      - Schedule new appointment
      - Update information
      - Booster registration
      - Other
      required: true
    - id: 18
      name: preferred_location
      label: Preferred Vaccination Location
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: preferred_appointment_date
      label: Preferred Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 20
      name: preferred_appointment_time
      label: Preferred Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 21
      name: insurance_section
      label: -- Insurance Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: insurance_status
      label: Insurance Status
      hint: null
      type: select_one
      options:
      - Insured
      - Uninsured
      - Medicaid
      - Medicare
      - Veteran
      required: true
    - id: 23
      name: insurance_provider
      label: Insurance Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: insurance_member_id
      label: Insurance Member ID
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: health_section
      label: -- Health Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: allergies
      label: Known allergies
      hint: Medications, vaccines, other
      type: text
      options: []
      required: false
    - id: 27
      name: chronic_conditions
      label: Chronic medical conditions
      hint: Diabetes, heart disease, etc.
      type: text
      options: []
      required: false
    - id: 28
      name: current_medications
      label: Current medications
      hint: null
      type: text
      options: []
      required: false
    - id: 29
      name: immunocompromised
      label: Immunocompromised
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Unsure
      required: true
    - id: 30
      name: emergency_contact_section
      label: -- Emergency Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 31
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 32
      name: emergency_contact_phone
      label: Emergency Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 33
      name: relationship
      label: Relationship to Registrant
      hint: null
      type: text
      options: []
      required: false
    - id: 34
      name: agreement_section
      label: -- Agreement --
      hint: null
      type: note
      options: []
      required: false
    - id: 35
      name: information_accuracy
      label: I confirm the information provided is accurate
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 36
      name: registration_complete
      label: I am ready to complete my vaccination registration
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
