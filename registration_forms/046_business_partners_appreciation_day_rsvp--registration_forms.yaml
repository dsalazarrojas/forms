inputSchema:
  type: object
  properties:
    title: Business Partners Appreciation Day RSVP
    pages:
    - id: 1
      name: attendee_name
      label: Attendee Name
      hint: Full name as it should appear
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_email
      label: Email Address
      hint: Email for confirmation
      type: email
      options: []
      required: true
    - id: 3
      name: attendee_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: false
    - id: 4
      name: company_name
      label: Company Name
      hint: Your organization
      type: text
      options: []
      required: true
    - id: 5
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 6
      name: partnership_duration
      label: Partnership Duration
      hint: How long have you been a partner
      type: select_one
      options:
      - Less than 1 year
      - 1 to 2 years
      - 2 to 5 years
      - 5 to 10 years
      - Over 10 years
      required: true
    - id: 7
      name: attendance_status
      label: Attendance Status
      hint: Will you attend
      type: select_one
      options:
      - Yes - I will attend
      - No - unable to attend
      - Maybe - pending confirmation
      required: true
    - id: 8
      name: event_date
      label: Event Date
      hint: Date of appreciation day
      type: date
      options: []
      required: true
    - id: 9
      name: number_of_guests
      label: Number of Guests
      hint: Total attendees including you
      type: number
      options: []
      required: true
    - id: 10
      name: guest_names
      label: Guest Names
      hint: Names of additional attendees
      type: text
      options: []
      required: false
    - id: 11
      name: meal_preference
      label: Meal Preference
      hint: Select your meal choice
      type: select_one
      options:
      - Chicken
      - Beef
      - Fish
      - Vegetarian
      - Vegan
      - Gluten-free
      required: true
    - id: 12
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: Any allergies or restrictions
      type: text
      options: []
      required: false
    - id: 13
      name: t_shirt_size
      label: T-Shirt Size
      hint: For appreciation gift
      type: select_one
      options:
      - Small
      - Medium
      - Large
      - X-Large
      - XX-Large
      - XXX-Large
      - No shirt needed
      required: false
    - id: 14
      name: activity_preferences
      label: Activity Preferences
      hint: Select activities you are interested in
      type: select_multiple
      options:
      - Awards ceremony
      - Networking session
      - Team building activities
      - Product demonstrations
      - Educational workshops
      - Entertainment
      - All activities
      required: true
    - id: 15
      name: transportation_needed
      label: Transportation Needed
      hint: Do you need transportation assistance
      type: select_one
      options:
      - Yes - need shuttle service
      - Yes - need ride share
      - No - will drive myself
      - No - will use other transport
      required: false
    - id: 16
      name: parking_needed
      label: Parking Needed
      hint: Will you need parking
      type: select_one
      options:
      - Yes - need parking spot
      - No - do not need parking
      required: false
    - id: 17
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any accommodations needed
      type: text
      options: []
      required: false
    - id: 18
      name: award_nomination
      label: Award Nomination
      hint: Would you like to nominate a partner
      type: select_one
      options:
      - Yes - I have a nomination
      - No - no nomination
      required: false
    - id: 19
      name: nomination_details
      label: Nomination Details
      hint: Describe your nomination
      type: text
      options: []
      required: false
    - id: 20
      name: testimonial_interest
      label: Testimonial Interest
      hint: Would you be willing to share a testimonial
      type: select_one
      options:
      - Yes - definitely
      - Maybe - depends on format
      - No - not at this time
      required: false
    - id: 21
      name: partnership_highlights
      label: Partnership Highlights
      hint: What has been the highlight of our partnership
      type: text
      options: []
      required: false
    - id: 22
      name: future_expectations
      label: Future Expectations
      hint: What are you looking forward to
      type: text
      options: []
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
