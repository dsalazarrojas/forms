inputSchema:
  type: object
  properties:
    title: Academic Mentorship Session Recording Consent Form
    pages:
      - id: 1
        name: section_consent_intro
        label: -- Recording Consent --
        hint: null
        type: note
        options: []
        required: false
      - id: 2
        name: participant_name
        label: Participant name
        hint: Full name of mentorship participant
        type: text
        options: []
        required: true
      - id: 3
        name: mentor_name
        label: Mentor name
        hint: Full name of mentor
        type: text
        options: []
        required: false
      - id: 4
        name: session_date
        label: Session date
        hint: Scheduled date of mentorship session
        type: date
        options: []
        required: false
      - id: 5
        name: consent_to_record
        label: Consent to record session
        hint: Permission to record audio or video
        type: select_one
        options:
          - Yes
          - No
        required: true
      - id: 6
        name: use_of_recording
        label: Use of recording
        hint: How the recording will be used
        type: select_one
        options:
          - For participant review only
          - For training materials with consent
          - For research with anonymization
          - Other
        required: true
      - id: 7
        name: retention_period
        label: Retention period for recording
        hint: How long the recording will be stored
        type: select_one
        options:
          - 6 months
          - 1 year
          - Indefinitely
          - Other
        required: false
      - id: 8
        name: access_restrictions
        label: Access restrictions
        hint: Who will have access to the recording
        type: text
        options: []
        required: false
      - id: 9
        name: consent_signature
        label: Signature name
        hint: Type full name to confirm consent
        type: text
        options: []
        required: true
      - id: 10
        name: consent_date
        label: Consent date
        hint: Date the consent was given
        type: date
        options: []
        required: true
