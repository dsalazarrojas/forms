inputSchema:
  type: object
  properties:
    title: After School Program Volunteer Application Form
    pages:
    - id: 1
      name: personal_information_section
      label: Personal Information
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Enter your complete legal name
      type: text
      options: []
      required: true
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: Your date of birth
      type: date
      options: []
      required: true
    - id: 4
      name: address
      label: Address
      hint: Your current residential address
      type: text
      options: []
      required: true
    - id: 5
      name: city_state_zip
      label: City, State, ZIP Code
      hint: City, state, and ZIP code of your address
      type: text
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Phone Number
      hint: Your primary phone number
      type: text
      options: []
      required: true
    - id: 7
      name: email_address
      label: Email Address
      hint: Your primary email address
      type: email
      options: []
      required: true
    - id: 8
      name: emergency_contact_section
      label: Emergency Contact
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of your emergency contact person
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship of emergency contact to you
      type: text
      options: []
      required: true
    - id: 11
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Phone number of your emergency contact
      type: text
      options: []
      required: true
    - id: 12
      name: availability_information_section
      label: Availability Information
      hint: null
      type: note
      options: []
      required: false
    - id: 13
      name: available_days
      label: Available Days
      hint: Which days of the week are you available to volunteer?
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 14
      name: available_time_slots
      label: Available Time Slots
      hint: What time slots are you available to volunteer?
      type: select_multiple
      options:
      - 3:00 PM - 4:00 PM
      - 4:00 PM - 5:00 PM
      - 5:00 PM - 6:00 PM
      - 6:00 PM - 7:00 PM
      - Morning (9:00 AM - 12:00 PM)
      - Afternoon (12:00 PM - 3:00 PM)
      - Weekend mornings
      - Weekend afternoons
      required: true
    - id: 15
      name: volunteer_duration
      label: Expected Volunteer Duration
      hint: How long do you plan to volunteer with our program?
      type: select_one
      options:
      - 1-3 months
      - 3-6 months
      - 6-12 months
      - 1+ years
      - Throughout the school year
      required: true
    - id: 16
      name: preferred_roles_section
      label: Preferred Volunteer Roles
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: tutoring_preference
      label: Tutoring Preference
      hint: Are you interested in tutoring students?
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: true
    - id: 18
      name: preferred_subjects_to_tutor
      label: Preferred Subjects to Tutor
      hint: If interested in tutoring, which subjects would you prefer?
      type: select_multiple
      options:
      - Mathematics
      - Reading
      - Writing
      - Science
      - Social Studies
      - Foreign Language
      - Arts
      - Music
      - Technology
      required: false
    - id: 19
      name: activity_leading_interest
      label: Activity Leading Interest
      hint: Are you interested in leading activities or clubs?
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: true
    - id: 20
      name: preferred_activities_to_lead
      label: Preferred Activities to Lead
      hint: If interested in leading activities, which would you prefer?
      type: select_multiple
      options:
      - Arts and Crafts
      - Sports and Games
      - Science Experiments
      - Cooking/Nutrition
      - Drama/Performance
      - Music
      - Technology/Robotics
      - Gardening
      - Field Trips
      required: false
    - id: 21
      name: administrative_support_interest
      label: Administrative Support Interest
      hint: Are you interested in helping with administrative tasks?
      type: select_one
      options:
      - true
      - false
      - Maybe
      required: true
    - id: 22
      name: background_check_consent_section
      label: Background Check Consent
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: background_check_consent
      label: Background Check Consent
      hint: Do you consent to a background check as part of the volunteer application
        process?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 24
      name: driving_requirement_consent
      label: Driving Requirement Consent
      hint: Are you willing to undergo additional background checks if driving students
        is required?
      type: select_one
      options:
      - true
      - false
      - Only if necessary
      required: true
    - id: 25
      name: qualifications_experience_section
      label: Qualifications and Experience
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: education_level
      label: Education Level
      hint: What is your highest level of education completed?
      type: select_one
      options:
      - High School Diploma
      - Associate Degree
      - Bachelor's Degree
      - Master's Degree
      - Doctoral Degree
      - Other
      required: true
    - id: 27
      name: education_field
      label: Field of Education
      hint: What field did you study in school?
      type: text
      options: []
      required: false
    - id: 28
      name: previous_volunteer_experience
      label: Previous Volunteer Experience
      hint: Do you have previous experience volunteering with children/youth?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 29
      name: previous_volunteer_details
      label: Details of Previous Volunteer Experience
      hint: If yes, please describe your previous volunteer experience with children/youth
      type: text
      options: []
      required: false
    - id: 30
      name: professional_experience
      label: Professional Experience
      hint: Do you have professional experience working with children/youth?
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 31
      name: professional_experience_details
      label: Details of Professional Experience
      hint: If yes, please describe your professional experience working with children/youth
      type: text
      options: []
      required: false
    - id: 32
      name: special_skills_talents
      label: Special Skills or Talents
      hint: What special skills or talents would you bring to the program?
      type: text
      options: []
      required: false
    - id: 33
      name: references_section
      label: References
      hint: null
      type: note
      options: []
      required: false
    - id: 34
      name: reference_1_name
      label: Reference 1 Name
      hint: Name of your first reference
      type: text
      options: []
      required: true
    - id: 35
      name: reference_1_relationship
      label: Reference 1 Relationship
      hint: Your relationship to the first reference
      type: text
      options: []
      required: true
    - id: 36
      name: reference_1_phone
      label: Reference 1 Phone
      hint: Phone number of your first reference
      type: text
      options: []
      required: true
    - id: 37
      name: reference_2_name
      label: Reference 2 Name
      hint: Name of your second reference
      type: text
      options: []
      required: false
    - id: 38
      name: reference_2_relationship
      label: Reference 2 Relationship
      hint: Your relationship to the second reference
      type: text
      options: []
      required: false
    - id: 39
      name: reference_2_phone
      label: Reference 2 Phone
      hint: Phone number of your second reference
      type: text
      options: []
      required: false
    - id: 40
      name: application_agreement_section
      label: Application Agreement
      hint: null
      type: note
      options: []
      required: false
    - id: 41
      name: terms_agreement
      label: Terms Agreement
      hint: I agree to the terms and conditions of the volunteer program
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 42
      name: confidentiality_agreement
      label: Confidentiality Agreement
      hint: I agree to maintain confidentiality of student information
      type: select_one
      options:
      - true
      - false
      required: true
    - id: 43
      name: signature
      label: Electronic Signature
      hint: Sign to submit your volunteer application
      type: text
      options: []
      required: true
