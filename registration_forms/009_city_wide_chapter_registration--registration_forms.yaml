      - Bi-weekly
      - Monthly
      - Quarterly
      - As needed
      - Other
      required: false
    - id: 21
      name: primary_activities
      label: Primary Activities and Focus Areas
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: partner_organizations
      label: Key Partner Organizations
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: additional_contacts
      label: Additional Contact Information
      hint: null
      type: text
      options: []
      required: false
