inputSchema:
  type: object
  properties:
    title: City Wide Chapter Registration
    pages:
    - id: 1
      name: chapter_info_header
      label: -- Chapter Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: chapter_name
      label: Chapter Name
      hint: Official name of your local chapter
      type: text
      options: []
      required: true
    - id: 3
      name: chapter_id
      label: Chapter ID or Number
      hint: If previously assigned
      type: text
      options: []
      required: false
    - id: 4
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: state_province
      label: State or Province
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: chapter_founded_date
      label: Chapter Founded Date
      hint: When was this chapter established
      type: date
      options: []
      required: false
    - id: 7
      name: leadership_header
      label: -- Leadership Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: chapter_president
      label: Chapter President or Director Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: president_email
      label: President Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 10
      name: president_phone
      label: President Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: vice_president
      label: Vice President or Co-Director Name
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: vice_president_email
      label: Vice President Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 13
      name: treasurer_name
      label: Treasurer Name
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: treasurer_email
      label: Treasurer Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 15
      name: contact_header
      label: -- Contact and Operations --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: chapter_phone
      label: Chapter Office Phone
      hint: Main contact number
      type: text
      options: []
      required: false
    - id: 17
      name: chapter_email
      label: Chapter Email Address
      hint: Main contact email
      type: email
      options: []
