inputSchema:
  type: object
  properties:
    title: Dance Class Intake Form
    pages:
    - id: 1
      name: student_information
      label: Student Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_preferences
      label: Contact Preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_method
      label: Payment Method
      hint: null
      type: select_one
      options:
      - Online Payment
      - In Person Payment
      required: false
    - id: 4
      name: experience
      label: Experience
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: select_multiple
      options:
      - Parent
      - Guardian
      - Other
      required: false
    - id: 6
      name: class_preferences
      label: Class Preferences
      hint: null
      type: select_multiple
      options:
      - Ballet
      - Contemporary
      - Hip Hop
      - Tap
      required: false
