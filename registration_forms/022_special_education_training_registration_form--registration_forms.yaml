inputSchema:
  type: object
  properties:
    title: Special Education Training Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: training_session
      label: Training Session
      hint: null
      type: select_multiple
      options:
      - Special Education - Elementary
      - Special Education - Secondary
      - Special Education - Tertiary
      - Special Education - Pre-Service
      required: false
