inputSchema:
  type: object
  properties:
    title: Networking Event Check In Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_first_name
      label: Attendee First Name
      hint: Enter the first name of the attendee
      type: text
      options: []
      required: true
    - id: 3
      name: attendee_last_name
      label: Attendee Last Name
      hint: Enter the last name of the attendee
      type: text
      options: []
      required: true
    - id: 4
      name: event_start_time
      label: Event Start Time
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: event_end_time
      label: Event End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: attendee_organization
      label: Attendee Organization
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: attendee_title
      label: Attendee Title
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: attendee_email
      label: Attendee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: attendee_phone
      label: Attendee Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: checkin_status
      label: Checkin Status
      hint: null
      type: select_one
      options:
      - Checked In
      - Not Checked In
      - Unknown
      required: false
    - id: 11
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Networking Event
      - Conference
      - Meeting
      required: true
    - id: 14
      name: location
      label: Location
      hint: null
      type: text
      options: []
      required: true
