      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: music_instrument
      label: music_instrument
      hint: null
      type: select_one
      options:
      - piano
      - guitar
      - violin
      - drums
      required: true
    - id: 9
      name: music_experience
      label: music_experience
      hint: null
      type: select_multiple
      options:
      - beginner
      - intermediate
      - advanced
      required: true
    - id: 10
      name: emergency_contact_name
