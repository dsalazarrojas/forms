inputSchema:
  type: object
  properties:
    title: Reunion Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: graduation_year
      label: Graduation Year
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: attending
      label: Attending
      hint: null
      type: select_multiple
      options:
      - High School
      - College
      - Not attending
      required: true
    - id: 7
      name: reunion_year
      label: Reunion Year
      hint: null
      type: number
      options: []
      required: true
    - id: 8
      name: reunion_location
      label: Reunion Location
      hint: null
      type: select_one
      options:
      - High School
      - College Campus
      - Online
      required: true
