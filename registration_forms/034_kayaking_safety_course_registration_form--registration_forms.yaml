      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: instructor_instructor_type
      label: Instructor Type
      hint: null
      type: select_multiple
      options:
      - Waterfront
      - Riverine
      - Lakefront
      - Oceanfront
      required: false
    - id: 23
      name: instructor_certification
