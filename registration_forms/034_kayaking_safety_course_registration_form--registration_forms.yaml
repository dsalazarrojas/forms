      type: text
      options: []
      required: false
    - id: 18
      name: instructor_name
      label: Instructor Name
      hint: null
      type: text
      options: []
      required: false
    - id: 19
      name: instructor_phone
      label: Instructor Phone
      hint: null
      type: text
      options: []
