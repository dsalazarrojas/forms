      name: participant_medical_conditions
      label: Participant Medical Conditions
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: participant_medical_certification
      label: Participant Medical Certification
      hint: Please provide participant medical certification document if applicable.
      type: select_multiple
      options:
      - Asthma
      - Diabetes
      - Epilepsy
      - Other
      - Other (Specify)
      required: false
    - id: 14
      name: participant_medical_information
      label: Participant Medical Information
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: participant_dietary_restrictions
