      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: emergency_contact_email
      label: Emergency Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 10
      name: emergency_certification
      label: Emergency Contact Certification
      hint: Please provide emergency contact certification document if applicable.
      type: select_multiple
      options:
      - First Responder
      - EMT
      - Firefighter
      - Doctor
      required: false
    - id: 11
      name: medical_conditions
      label: Medical Conditions
      hint: null
      type: text
      options: []
      required: false
