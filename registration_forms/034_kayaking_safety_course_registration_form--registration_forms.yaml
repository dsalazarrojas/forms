inputSchema:
  type: object
  properties:
    title: Kayaking Safety Course Registration Form
    pages:
    - id: 1
      name: participant_details
      label: Participant Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participants Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participant_email
      label: Participants Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: participants_phone
      label: Participants Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: waiver_acceptance
      label: Participants Waivers
      hint: This is an acknowledgement that participant and their legal guardian(s)
        has read, sign, and submit this waiver.
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: emergency_contact_relationship
      label: Relationship to Participant
      hint: null
      type: select_one
      options:
      - Parent
      - Friend
      - Family
      required: true
