inputSchema:
  type: object
  properties:
    title: Virtual Event Platform Authorization Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: participant_phone
      label: Participant Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: participant_requirements
      label: Participant Requirements
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 6
      name: agreement
      label: Agreement and Consent
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: participant_notes
      label: Additional Participant Notes
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: event_requirements
      label: Event Requirements
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 9
      name: participant_additional_notes
      label: Additional Participant Information
      hint: null
      type: text
      options: []
      required: false
