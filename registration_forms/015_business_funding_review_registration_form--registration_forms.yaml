inputSchema:
  type: object
  properties:
    title: Business Funding Review Registration Form
    pages:
    - id: 1
      name: section_business_identity
      label: -- Business Identity --
      hint: Provide official registration details
      type: note
      options: []
      required: false
    - id: 2
      name: official_business_name
      label: Legal Business Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: business_tax_id_number
      label: Tax ID or Business Registration Number
      hint: e.g. EIN, ABN, or local equivalent
      type: text
      options: []
      required: true
    - id: 4
      name: legal_entity_type
      label: Business Entity Type
      hint: null
      type: select_one
      options:
      - Sole Proprietorship
      - Partnership
      - LLC / Corporation
      - Non-Profit Organization
      required: true
    - id: 5
      name: years_in_active_operation
      label: Years in Active Operation
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: section_financial_status
      label: -- Financial and Funding Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: annual_gross_revenue_range
      label: Annual Gross Revenue (Last Fiscal Year)
      hint: Select the range that applies
      type: select_one
      options:
      - Under 100,000 USD
      - 100,001 - 500,000 USD
      - 500,001 - 2,000,000 USD
      - Above 2,000,000 USD
      required: true
    - id: 8
      name: requested_funding_amount
      label: Funding Amount Requested (USD)
      hint: The total capital you are seeking
      type: number
      options: []
      required: true
    - id: 9
      name: primary_funding_purpose
      label: Primary Purpose of Funding
      hint: Briefly describe how the funds will be used
      type: text
      options: []
      required: true
    - id: 10
      name: current_loan_obligations
      label: Current Outstanding Loan Obligations
      hint: null
      type: select_one
      options:
      - No outstanding loans
      - Under 50,000 USD
      - 50,001 - 250,000 USD
      - Over 250,000 USD
      required: true
    - id: 11
      name: section_contact_person
      label: -- Contact Information --
      hint: Person responsible for the application
      type: note
      options: []
      required: false
    - id: 12
      name: application_contact_name
      label: Primary Contact Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: application_contact_email
      label: Professional Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 14
      name: application_contact_phone
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 15
      name: information_accuracy_confirmation
      label: I certify that all provided data is accurate to my knowledge
      hint: null
      type: select_one
      options:
      - I Certify
      - Other
      required: true
