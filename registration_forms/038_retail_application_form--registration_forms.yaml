inputSchema:
  type: object
  properties:
    title: Retail Application Form
    pages:
    - id: 1
      name: first_name
      label: First name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: date_of_birth
      label: Date of birth
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: job_title
      label: Job title
      hint: null
      type: select_one
      options:
      - Sales Associate
      - Store Manager
      - Assistant Manager
      required: true
    - id: 7
      name: available_to_work
      label: Available to work
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 8
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: store_location
      label: Store location
      hint: null
      type: text
      options: []
      required: true
