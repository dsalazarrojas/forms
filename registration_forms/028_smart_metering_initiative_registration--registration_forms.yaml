inputSchema:
  type: object
  properties:
    title: Smart Metering Initiative Registration
    pages:
    - id: 1
      name: form_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: form_last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: form_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: form_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: form_date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: form_participant_id
      label: Participant ID
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: form_consent
      label: Consent
      hint: null
      type: select_one
      options:
      - I understand and agree to the terms and conditions
      - I do not understand and do not agree to the terms and conditions
      required: false
    - id: 8
      name: form_preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_multiple
      options:
      - Email
      - Phone
      - Text Message
      required: true
    - id: 9
      name: form_comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 10
      name: form_additional_notes
      label: Additional Notes
      hint: null
      type: text
      options: []
      required: false
