inputSchema:
  type: object
  properties:
    title: Street Food Experience Registration
    pages:
    - id: 1
      name: form_data
      label: Registration Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: attendee_name
      label: Attendee Name
      hint: Enter attendee name
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Attendee Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Attendee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: event_preferences
      label: Event Preferences
      hint: null
      type: select_multiple
      options:
      - Food type
      - Time of day
      - Location
      required: true
    - id: 6
      name: consent
      label: Consent
      hint: null
      type: text
      options: []
      required: false
