inputSchema:
  type: object
  properties:
    title: Gym Registration Form
    pages:
    - id: 1
      name: user_info
      label: User Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: membership
      label: Membership
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: emergency_contact
      label: Emergency Contact
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: emergency_contact_name
      label: Name
      hint: Enter name of emergency contact
      type: text
      options: []
      required: false
    - id: 6
      name: emergency_contact_relationship
      label: Relationship
      hint: null
      type: select_one
      options:
      - Mom
      - Dad
      - Brother
      - Sister
      - Friend
      - Other
      required: false
    - id: 7
      name: emergency_contact_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: emergency_contact_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
