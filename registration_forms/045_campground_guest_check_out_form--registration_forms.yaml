inputSchema:
  type: object
  properties:
    title: Campground Guest Check Out Form
    pages:
    - id: 1
      name: guest_first_name
      label: Guest First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 2
      name: guest_last_name
      label: Guest Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 5
      name: campsite_number
      label: Campsite Number
      hint: Your site number
      type: text
      options: []
      required: true
    - id: 6
      name: check_in_date
      label: Check-In Date
      hint: When you arrived
      type: date
      options: []
      required: true
    - id: 7
      name: check_out_date
      label: Check-Out Date
      hint: Today date
      type: date
      options: []
      required: true
    - id: 8
      name: check_out_time
      label: Check-Out Time
      hint: What time leaving
      type: time
      options: []
      required: true
    - id: 9
      name: number_of_nights
      label: Number of Nights Stayed
      hint: Total nights
      type: number
      options: []
      required: true
    - id: 10
      name: number_in_party
      label: Number in Your Party
      hint: Total guests
      type: number
      options: []
      required: true
    - id: 11
      name: number_of_adults
      label: Number of Adults
      hint: Adults in party
      type: number
      options: []
      required: true
    - id: 12
      name: number_of_children
      label: Number of Children
      hint: Children in party
      type: number
      options: []
      required: false
    - id: 13
      name: type_of_accommodation
      label: Type of Accommodation
      hint: What did you use
      type: select_one
      options:
      - Tent camping
      - RV or camper
      - Cabin
      - Glamping tent
      - Other
      required: true
    - id: 14
      name: rv_size
      label: RV Size
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 15
      name: site_condition
      label: How Did You Leave the Site
      hint: Select condition
      type: select_one
      options:
      - Clean and ready for next guest
      - Mostly clean
      - Needs some cleanup
      - Needs significant cleanup
      required: true
    - id: 16
      name: trash_disposed
      label: Have You Disposed of All Trash
      hint: Yes or no
      type: select_one
      options:
      - Yes - all in dumpsters
      - Yes - in site bin
      - Partially
      - false
      required: true
    - id: 17
      name: fire_extinguished
      label: Is the Campfire Completely Extinguished
      hint: Yes or no
      type: select_one
      options:
      - Yes - completely out
      - Yes - drowned and stirred
      - No fire was lit
      - Not sure
      required: true
    - id: 18
      name: utilities_turned_off
      label: Have You Turned Off All Utilities
      hint: Water, electric, etc
      type: select_one
      options:
      - Yes - all off
      - Partially
      - No utilities used
      - Not applicable
      required: true
    - id: 19
      name: equipment_returned
      label: Have You Returned All Rented Equipment
      hint: Yes or no
      type: select_one
      options:
      - Yes - all returned
      - Yes - nothing rented
      - No - still have items
      required: true
    - id: 20
      name: damages_reported
      label: Did Any Damage Occur During Your Stay
      hint: Yes or no
      type: select_one
      options:
      - No damage
      - Yes - minor damage
      - Yes - significant damage
      required: true
    - id: 21
      name: damage_details
      label: Damage Details
      hint: Describe if any
      type: text
      options: []
      required: false
    - id: 22
      name: items_left_behind
      label: Did You Leave Any Items Behind
      hint: Yes or no
      type: select_one
      options:
      - No - took everything
      - Yes - will return for
      - Yes - please dispose
      required: true
    - id: 23
      name: items_description
      label: Items Description
      hint: Describe left items
      type: text
      options: []
      required: false
    - id: 24
      name: overall_experience
      label: Overall Experience Rating
      hint: Rate your stay
      type: select_one
      options:
      - 5 - Excellent
      - 4 - Very Good
      - 3 - Good
      - 2 - Fair
      - 1 - Poor
      required: true
    - id: 25
      name: site_cleanliness
      label: Site Cleanliness Rating
      hint: Rate cleanliness
      type: select_one
      options:
      - 5 - Excellent
      - 4 - Very Good
      - 3 - Good
      - 2 - Fair
      - 1 - Poor
      required: true
    - id: 26
      name: facilities_rating
      label: Facilities Rating
      hint: Rate restrooms, showers, etc
      type: select_one
      options:
      - 5 - Excellent
      - 4 - Very Good
      - 3 - Good
      - 2 - Fair
      - 1 - Poor
      required: true
    - id: 27
      name: staff_rating
      label: Staff Friendliness Rating
      hint: Rate the staff
      type: select_one
      options:
      - 5 - Excellent
      - 4 - Very Good
      - 3 - Good
      - 2 - Fair
      - 1 - Poor
      required: true
    - id: 28
      name: favorite_part
      label: What Was Your Favorite Part
      hint: Describe
      type: text
      options: []
      required: false
    - id: 29
      name: least_favorite_part
      label: What Could We Improve
      hint: Your suggestions
      type: text
      options: []
      required: false
    - id: 30
      name: would_return
      label: Would You Stay With Us Again
      hint: Yes or no
      type: select_one
      options:
      - Yes - definitely
      - Yes - probably
      - Maybe
      - Probably no
      - Definitely no
      required: true
    - id: 31
      name: would_recommend
      label: Would You Recommend Us to Others
      hint: Yes or no
      type: select_one
      options:
      - Yes - definitely
      - Yes - probably
      - Maybe
      - Probably no
      - Definitely no
      required: true
    - id: 32
      name: additional_comments
      label: Additional Comments
      hint: Any other feedback
      type: text
      options: []
      required: false
    - id: 33
      name: guest_signature
      label: Guest Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 34
      name: signature_date
      label: Date
      hint: Date of checkout
      type: date
      options: []
      required: true
