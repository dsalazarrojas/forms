inputSchema:
  type: object
  properties:
    title: Business Transformation Roadmap Session Registration
    pages:
    - id: 1
      name: participant_name
      label: Participant Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 2
      name: participant_title
      label: Your Title or Position
      hint: Your role in the organization
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company Name
      hint: Name of your organization
      type: text
      options: []
      required: true
    - id: 4
      name: company_industry
      label: Industry
      hint: Your industry sector
      type: text
      options: []
      required: false
    - id: 5
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - Small (1-50)
      - Medium (51-250)
      - Large (251-1000)
      - Enterprise (1000+)
      required: true
    - id: 6
      name: participant_email
      label: Email Address
      hint: Your contact email
      type: email
      options: []
      required: true
    - id: 7
      name: participant_phone
      label: Phone Number
      hint: Your contact phone
      type: text
      options: []
      required: true
    - id: 8
      name: preferred_dates
      label: Preferred Session Dates
      hint: Your preferred dates
      type: text
      options: []
      required: true
    - id: 9
      name: session_date_1
      label: First Preferred Date
      hint: Your first choice
      type: date
      options: []
      required: false
    - id: 10
      name: session_date_2
      label: Second Preferred Date
      hint: Your second choice
      type: date
      options: []
      required: false
    - id: 11
      name: session_time_preference
      label: Time Preference
      hint: Morning or afternoon
      type: select_one
      options:
      - Early Morning (8-10 AM)
      - Mid-morning (10 AM-12 PM)
      - Afternoon (1-3 PM)
      - Late Afternoon (3-5 PM)
      - Flexible
      required: true
    - id: 12
      name: session_format
      label: Session Format Preference
      hint: How would you like to meet
      type: select_one
      options:
      - In-person
      - Video Conference
      - Phone Call
      - Hybrid
      required: true
    - id: 13
      name: transformation_areas
      label: Transformation Focus Areas
      hint: What areas do you want to discuss
      type: select_multiple
      options:
      - Digital Transformation
      - Organizational Change
      - Process Improvement
      - Technology Implementation
      - Business Model Change
      - Other
      required: true
    - id: 14
      name: current_transformation_stage
      label: Current Transformation Stage
      hint: Where are you in your journey
      type: select_one
      options:
      - Planning Phase
      - Early Implementation
      - Active Transformation
      - Scaling Phase
      - Post-Implementation
      required: true
    - id: 15
      name: key_challenges
      label: Key Challenges
      hint: What challenges are you facing
      type: text
      options: []
      required: true
    - id: 16
      name: goals_for_session
      label: Goals for This Session
      hint: What do you want to accomplish
      type: text
      options: []
      required: true
    - id: 17
      name: team_attendees
      label: Number of Team Members Attending
      hint: How many will participate
      type: number
      options: []
      required: false
    - id: 18
      name: previous_consulting
      label: Previous Transformation Experience
      hint: Have you done this before
      type: text
      options: []
      required: false
    - id: 19
      name: registration_date
      label: Registration Date
      hint: Today's date
      type: date
      options: []
      required: true
