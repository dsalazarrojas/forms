inputSchema:
  type: object
  properties:
    title: Sandy Bay Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: event
      label: Event
      hint: null
      type: select_one
      options:
      - Event A
      - Event B
      - Event C
      required: true
    - id: 7
      name: shift
      label: Shift
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 8
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
