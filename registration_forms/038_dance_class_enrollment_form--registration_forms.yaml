inputSchema:
  type: object
  properties:
    title: Dance Class Enrollment Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: student_address
      label: Student Address
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: student_city
      label: Student City
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_state
      label: Student State
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: dance_style
      label: Dance Style
      hint: null
      type: select_one
      options:
      - Ballet
      - Contemporary
      - Hip Hop
      - Jazz
      - Tap
      required: true
    - id: 8
      name: class_name
      label: Class Name
      hint: null
      type: select_multiple
      options:
      - Jazz Class
      - Ballet Class
      - Contemporary Class
      - Hip Hop Class
      - Tap Class
      required: true
    - id: 9
      name: class_start_time
      label: Class Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: class_end_time
      label: Class End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 11
      name: enrollment_date
      label: Enrollment Date
      hint: null
      type: date
      options: []
      required: false
