      name: workshop_selection
      label: Workshop Selection
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: rsvp_date
      label: RSVP Date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 6
      name: rsvp_time
      label: RSVP Time
      hint: "HH:MM AM/PM"
      type: time
      options: []
      required: false
    - id: 7
      name: workshop_details
      label: Workshop Details
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: additional_information
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: rsvp_message
      label: RSVP Message
      hint: null
      type: text
      options: []
      required: false
