inputSchema:
  type: object
  properties:
    title: Birthday Event Registration Form
    pages:
    - id: 1
      name: section_intro
      label: -- Birthday Event Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: intro_message
      label: Register for our birthday event celebration
      hint: Complete this form to secure your spot
      type: note
      options: []
      required: false
    - id: 3
      name: section_event_info
      label: -- Event Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: event_name
      label: Event Name
      hint: Which birthday event are you registering for
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Event Date
      hint: When is the event
      type: date
      options: []
      required: true
    - id: 6
      name: event_time
      label: Event Start Time
      hint: What time does it start
      type: time
      options: []
      required: true
    - id: 7
      name: event_location
      label: Event Location
      hint: Where is the event held
      type: text
      options: []
      required: true
    - id: 8
      name: section_birthday_child
      label: -- Birthday Child Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: birthday_child_name
      label: Birthday Child's Name
      hint: Name of child having birthday
      type: text
      options: []
      required: true
    - id: 10
      name: birthday_child_age
      label: Age Turning
      hint: How old is the child turning
      type: number
      options: []
      required: true
    - id: 11
      name: birthday_child_dob
      label: Birth Date
      hint: Child's full birth date
      type: date
      options: []
      required: true
    - id: 12
      name: special_needs_or_allergies
      label: Special Needs or Allergies
      hint: Any special considerations
      type: text
      options: []
      required: false
    - id: 13
      name: section_parent_info
      label: -- Parent or Guardian Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: parent_name
      label: Parent or Guardian Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 15
      name: parent_email
      label: Email Address
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 16
      name: parent_phone
      label: Phone Number
      hint: Contact phone
      type: text
      options: []
      required: true
    - id: 17
      name: parent_address
      label: Home Address
      hint: Street address
      type: text
      options: []
      required: true
    - id: 18
      name: parent_city
      label: City
      hint: City
      type: text
      options: []
      required: true
    - id: 19
      name: parent_state
      label: State or Province
      hint: State
      type: text
      options: []
      required: true
    - id: 20
      name: parent_zip
      label: ZIP or Postal Code
      hint: Postal code
      type: text
      options: []
      required: true
    - id: 21
      name: section_attendees
      label: -- Additional Attendees --
      hint: null
      type: note
      options: []
      required: false
    - id: 22
      name: number_of_guests
      label: Total Number of Guests
      hint: How many people in your party
      type: number
      options: []
      required: true
    - id: 23
      name: guest_names
      label: Names of Other Guests
      hint: List other attendees
      type: text
      options: []
      required: false
    - id: 24
      name: children_count
      label: Number of Children in Party
      hint: How many children total
      type: number
      options: []
      required: false
    - id: 25
      name: adults_count
      label: Number of Adults in Party
      hint: How many adults attending
      type: number
      options: []
      required: false
    - id: 26
      name: section_preferences
      label: -- Preferences and Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 27
      name: party_activities
      label: Interest in Activities
      hint: What activities interest you
      type: select_multiple
      options:
      - Games and Competitions
      - Crafts
      - Dance Party
      - Sports Activities
      - Scavenger Hunt
      - Food and Cake
      - Photo Booth
      - Entertainment
      required: false
    - id: 28
      name: dietary_restrictions
      label: Dietary Restrictions or Food Allergies
      hint: Any food requirements
      type: select_multiple
      options:
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Nut-Free
      - Dairy-Free
      - Other Allergy
      - None
      required: false
    - id: 29
      name: dietary_details
      label: Dietary Details
      hint: Describe specific requirements
      type: text
      options: []
      required: false
    - id: 30
      name: special_requests
      label: Special Requests
      hint: Any other requests or needs
      type: text
      options: []
      required: false
    - id: 31
      name: shirt_size
      label: Birthday Child Shirt Size
      hint: For party favor or t-shirt
      type: select_one
      options:
      - XS (2-3)
      - S (4-5)
      - M (6-7)
      - L (8-10)
      - XL (12-14)
      - 2XL
      required: false
    - id: 32
      name: section_payments
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 33
      name: registration_fee
      label: Registration Fee per Person
      hint: Cost per attendee
      type: number
      options: []
      required: false
    - id: 34
      name: total_guests_fee
      label: Total Registration Fee
      hint: Cost for all guests
      type: number
      options: []
      required: false
    - id: 35
      name: payment_method
      label: Payment Method
      hint: How you will pay
      type: select_one
      options:
      - Credit Card
      - Debit Card
      - Check
      - Cash at Event
      - Bank Transfer
      - PayPal
      required: true
    - id: 36
      name: payment_confirmation
      label: I understand payment is due by the deadline
      hint: Confirm payment understanding
      type: select_one
      options:
      - I Understand
      - I Do Not Understand
      required: true
    - id: 37
      name: section_acknowledgments
      label: -- Acknowledgments and Consent --
      hint: null
      type: note
      options: []
      required: false
    - id: 38
      name: photo_consent
      label: Permission for Event Photos
      hint: Can child's photo be taken at event
      type: select_one
      options:
      - Yes, Permission Granted
      - No, Do Not Take Photos
      - Photos Okay, No Social Media
      required: true
    - id: 39
      name: waiver_acknowledgment
      label: I acknowledge liability and activity risks
      hint: Confirm understanding of risks
      type: select_one
      options:
      - I Acknowledge
      - I Do Not Acknowledge
      required: true
    - id: 40
      name: registration_confirmation
      label: I confirm this registration
      hint: Final confirmation
      type: select_one
      options:
      - I Confirm Registration
      - Cancel Registration
      required: true
