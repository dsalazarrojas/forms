      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: state_province
      label: State - Province
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: postal_code
      label: Postal Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: country
      label: Country
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: intended_major
      label: Intended Major or Program
      hint: null
      type: select_one
      options:
      - Engineering
      - Business
      - Liberal Arts
      - Sciences
      - Nursing
      - Education
      - Other
      required: true
    - id: 14
      name: high_school_name
      label: High School Name
      hint: null
      type: text
      options: []
      required: true
