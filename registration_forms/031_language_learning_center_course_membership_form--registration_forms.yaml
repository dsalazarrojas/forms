inputSchema:
  type: object
  properties:
    title: Language Learning Center Course Membership Form
    pages:
    - id: 1
      name: course_details
      label: Course Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: learner_details
      label: Learner Details
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: preferred_time_slots
      label: Preferred Time Slots
      hint: null
      type: select_multiple
      options:
      - 08:00
      - '600'
      - '840'
      - '960'
      - '1080'
      - '1200'
      required: false
    - id: 4
      name: language_picked
      label: Language Picked
      hint: null
      type: select_one
      options:
      - English
      - French
      - Spanish
      - German
      - Chinese
      - Japanese
      - Korean
      - Arabic
      required: true
    - id: 5
      name: course_picked
      label: Course Picked
      hint: null
      type: select_one
      options:
      - Course 1
      - Course 2
      - Course 3
      - Course 4
      required: true
    - id: 6
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: assigned_tool_type
      label: Assigned Tool Type
      hint: null
      type: select_one
      options:
      - Jotform
      - Other
      required: true
    - id: 9
      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
