inputSchema:
  type: object
  properties:
    title: Airbnb Reservation Information Form
    pages:
    - id: 1
      name: reservation_id
      label: Reservation ID
      hint: Booking reference number
      type: text
      options: []
      required: true
    - id: 2
      name: guest_first_name
      label: Guest First Name
      hint: First name
      type: text
      options: []
      required: true
    - id: 3
      name: guest_last_name
      label: Guest Last Name
      hint: Last name
      type: text
      options: []
      required: true
    - id: 4
      name: guest_email
      label: Guest Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 5
      name: guest_phone
      label: Guest Phone
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: guest_country
      label: Guest Country
      hint: Country of residence
      type: text
      options: []
      required: true
    - id: 7
      name: property_name
      label: Property Name
      hint: Name of rental
      type: text
      options: []
      required: true
    - id: 8
      name: property_address
      label: Property Address
      hint: Full address
      type: text
      options: []
      required: true
    - id: 9
      name: host_name
      label: Host Name
      hint: Host full name
      type: text
      options: []
      required: true
    - id: 10
      name: host_phone
      label: Host Phone
      hint: Host contact number
      type: text
      options: []
      required: true
    - id: 11
      name: host_email
      label: Host Email
      hint: Host contact email
      type: email
      options: []
      required: true
    - id: 12
      name: check_in_date
      label: Check-in Date
      hint: Arrival date
      type: date
      options: []
      required: true
    - id: 13
      name: check_in_time
      label: Check-in Time
      hint: Arrival time
      type: time
      options: []
      required: true
    - id: 14
      name: check_out_date
      label: Check-out Date
      hint: Departure date
      type: date
      options: []
      required: true
    - id: 15
      name: check_out_time
      label: Check-out Time
      hint: Departure time
      type: time
      options: []
      required: true
    - id: 16
      name: number_of_nights
      label: Number of Nights
      hint: Total nights
      type: number
      options: []
      required: true
    - id: 17
      name: number_of_guests
      label: Number of Guests
      hint: Total guests
      type: number
      options: []
      required: true
    - id: 18
      name: adults
      label: Number of Adults
      hint: Adult count
      type: number
      options: []
      required: true
    - id: 19
      name: children
      label: Number of Children
      hint: Children count
      type: number
      options: []
      required: false
    - id: 20
      name: infants
      label: Number of Infants
      hint: Infants under 2
      type: number
      options: []
      required: false
    - id: 21
      name: room_type
      label: Room Type
      hint: Type of accommodation
      type: select_one
      options:
      - Entire home
      - Private room
      - Shared room
      - Hotel room
      required: true
    - id: 22
      name: property_type
      label: Property Type
      hint: Type of property
      type: select_one
      options:
      - House
      - Apartment
      - Condo
      - Villa
      - Cottage
      - Studio
      - Other
      required: true
    - id: 23
      name: nightly_rate
      label: Nightly Rate (USD)
      hint: Rate per night
      type: number
      options: []
      required: true
    - id: 24
      name: cleaning_fee
      label: Cleaning Fee (USD)
      hint: Cleaning fee amount
      type: number
      options: []
      required: false
    - id: 25
      name: service_fee
      label: Service Fee (USD)
      hint: Platform service fee
      type: number
      options: []
      required: false
    - id: 26
      name: total_amount
      label: Total Amount (USD)
      hint: Total reservation cost
      type: number
      options: []
      required: true
    - id: 27
      name: payment_status
      label: Payment Status
      hint: Current payment status
      type: select_one
      options:
      - Paid in full
      - Partially paid
      - Pending
      - Refunded
      required: true
    - id: 28
      name: payment_method
      label: Payment Method
      hint: How was payment made
      type: select_one
      options:
      - Credit card
      - Debit card
      - PayPal
      - Apple Pay
      - Google Pay
      - Other
      required: true
    - id: 29
      name: special_requests
      label: Special Requests
      hint: Guest requests
      type: text
      options: []
      required: false
    - id: 30
      name: accessibility_needs
      label: Accessibility Needs
      hint: Any accessibility requirements
      type: text
      options: []
      required: false
    - id: 31
      name: pets_included
      label: Pets Included
      hint: Are pets part of reservation
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 32
      name: pet_fee
      label: Pet Fee (USD)
      hint: Pet fee if applicable
      type: number
      options: []
      required: false
    - id: 33
      name: security_deposit
      label: Security Deposit (USD)
      hint: Deposit amount
      type: number
      options: []
      required: false
    - id: 34
      name: cancellation_policy
      label: Cancellation Policy
      hint: Policy type
      type: select_one
      options:
      - Flexible
      - Moderate
      - Strict
      - Super strict
      required: true
    - id: 35
      name: booking_source
      label: Booking Source
      hint: Where was booking made
      type: select_one
      options:
      - Airbnb platform
      - Direct booking
      - Other platform
      required: true
    - id: 36
      name: reservation_status
      label: Reservation Status
      hint: Current status
      type: select_one
      options:
      - Confirmed
      - Pending
      - Cancelled
      - Completed
      required: true
    - id: 37
      name: booking_date
      label: Booking Date
      hint: Date reservation made
      type: date
      options: []
      required: true
    - id: 38
      name: notes
      label: Additional Notes
      hint: Any other information
      type: text
      options: []
      required: false
