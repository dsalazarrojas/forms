inputSchema:
  type: object
  properties:
    title: Lightsaber Workshop Registration
    pages:
    - id: 1
      name: registration_info
      label: Registration Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: select_multiple
      options:
      - Phone 1
      - Phone 2
      - Phone 3
      required: true
    - id: 4
      name: session
      label: Session
      hint: null
      type: select_one
      options:
      - Session 1
      - Session 2
      - Session 3
      required: true
    - id: 5
      name: availability
      label: Availability
      hint: Enter a specific time for a special session
      type: time
      options: []
      required: false
    - id: 6
      name: notes
      label: Notes
      hint: Additional comments or questions?
      type: text
      options: []
      required: false
