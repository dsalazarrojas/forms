      name: notes
      label: notes
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: registration_form_data_preferred_food
      label: Preferred Food
      hint: null
      type: select_multiple
      options:
      - Vegetarian
      - Non-Vegetarian
      - Vegan
      required: false
    - id: 9
      name: registration_form_data_preferred_venue
      label: Preferred Venue
      hint: null
      type: select_multiple
      options:
      - On-site
      - Off-site
      - Both
      required: false
    - id: 10
      name: registration_form_data_allergies
      label: Allergies
      hint: null
      type: text
      options: []
      required: false
