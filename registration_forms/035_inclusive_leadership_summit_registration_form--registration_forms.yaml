inputSchema:
  type: object
  properties:
    title: Inclusive Leadership Summit Registration Form
    pages:
    - id: 1
      name: registration_form_data
      label: Registration Data
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: phone
      hint: null
      type: number
      options: []
      required: false
    - id: 5
      name: preferred_date
      label: preferred_date
      hint: 01-09-2024
      type: select_one
      options:
      - '2024-01-01'
      - '2024-02-01'
      - '2024-03-01'
      required: false
    - id: 6
      name: preferred_time
      label: preferred_time
      hint: null
      type: select_multiple
      options:
      - 9:00 AM
      - 10:00 AM
      - 11:00 AM
      required: false
