inputSchema:
  type: object
  properties:
    title: Education Data Governance Workshop Registration Form
    pages:
    - id: 1
      name: personal_info
      label: Personal Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: workshop_attendance_single
      label: Workshop Attendance
      hint: null
      type: select_one
      options:
      - Option A
      - Option B
      required: true
    - id: 3
      name: workshop_attendance_multiple
      label: Workshop Attendance Multiple
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: true
    - id: 4
      name: workshop_participation
      label: Workshop Participation
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: true
    - id: 5
      name: workshop_attendance_confirm
      label: Workshop Attendance Confirm
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 6
      name: repeat_workshop_attendance
      label: Repeat Workshop Attendance
      hint: null
      type: select_multiple
      options:
      - Option A
      - Option B
      required: false
    - id: 7
      name: repeat_workshop_participation
      label: Repeat Workshop Participation
      hint: null
      type: checkbox
      options:
      - Option A
      - Option B
      required: false
    - id: 8
      name: repeat_personal_info
      label: Repeat Personal Info
      hint: null
      type: text
      options: []
      required: false
