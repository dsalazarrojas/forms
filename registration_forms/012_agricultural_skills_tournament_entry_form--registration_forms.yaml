inputSchema:
  type: object
  properties:
    title: Agricultural Skills Tournament Entry Form
    pages:
    - id: 1
      name: participant_info_header
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: participant_name
      label: Participant Name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 3
      name: age_group
      label: Age Group
      hint: Category for competition
      type: select_one
      options:
      - Junior (9-13)
      - Senior (14-18)
      - Young Adult (19-21)
      - Adult (22+)
      required: true
    - id: 4
      name: team_name
      label: Team Name
      hint: If competing as a group
      type: text
      options: []
      required: false
    - id: 5
      name: school_club
      label: School or Club
      hint: FFA Chapter or 4-H Club
      type: text
      options: []
      required: true
    - id: 6
      name: event_selection_header
      label: -- Event Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: events
      label: Event Categories
      hint: Select all events you wish to enter
      type: select_multiple
      options:
      - Tractor Driving Safety
      - Livestock Judging
      - Welding Skills
      - Plant Identification
      - Soil Science
      - Veterinary Science
      - Agricultural Mechanics
      required: true
    - id: 8
      name: emergency_contact_header
      label: -- Emergency Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Parent or Guardian if under 18
      type: text
      options: []
      required: true
    - id: 10
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Best number for emergencies
      type: text
      options: []
      required: true
    - id: 11
      name: medical_conditions
      label: Medical Conditions
      hint: Allergies or conditions we should know
      type: text
      options: []
      required: false
    - id: 12
      name: waiver_agreement
      label: Waiver Agreement
      hint: I agree to the tournament rules and liability waiver
      type: select_one
      options:
      - I Agree
      - Other
      required: true
    - id: 13
      name: parent_signature
      label: Parent/Guardian Signature
      hint: Type name if participant is under 18
      type: text
      options: []
      required: false
