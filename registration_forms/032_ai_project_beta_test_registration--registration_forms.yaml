inputSchema:
  type: object
  properties:
    title: AI Project Beta Test Registration
    pages:
    - id: 1
      name: tester_profile_header
      label: '--- Beta Tester Profile ---'
      hint: Join our early access program and help us shape the future of AI.
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email Address
      hint: We will send beta access instructions here.
      type: email
      options: []
      required: true
    - id: 4
      name: occupation_industry
      label: Occupation / Industry
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: technical_savviness
      label: How would you rate your technical expertise?
      hint: 1 = Basic User, 5 = Developer/Engineer
      type: number
      options: []
      required: true
    - id: 6
      name: hardware_os_header
      label: '--- Technical Environment ---'
      hint: Identify the devices and software you will use for testing.
      type: note
      options: []
      required: false
    - id: 7
      name: primary_os
      label: Primary Operating System
      hint: null
      type: select_one
      options:
      - Windows 10/11
      - macOS
      - Linux (Ubuntu/Debian/etc.)
      - iOS (iPhone/iPad)
      - Android
      required: true
    - id: 8
      name: primary_browser
      label: Primary Web Browser
      hint: null
      type: select_one
      options:
      - Google Chrome
      - Mozilla Firefox
      - Safari
      - Microsoft Edge
      - Brave / Other
      required: true
    - id: 9
      name: hardware_specs
      label: Device Hardware Specs
      hint: e.g., CPU, RAM, GPU (if relevant for local AI testing)
      type: text
      options: []
      required: false
    - id: 10
      name: testing_commitment_header
      label: '--- Commitment & Experience ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: weekly_availability
      label: Weekly hours available for testing
      hint: null
      type: select_one
      options:
      - 1-2 hours
      - 3-5 hours
      - 5-10 hours
      - 10+ hours
      required: true
    - id: 12
      name: previous_beta_experience
      label: Have you participated in software beta tests before?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: motivation_for_joining
      label: Why do you want to test our AI project?
      hint: null
      type: text
      options: []
      required: true
    - id: 14
      name: ai_modules_interest
      label: Which modules are you most interested in testing?
      hint: null
      type: select_multiple
      options:
      - Natural Language Processing (NLP)
      - Image Generation / Vision
      - API Integrations
      - Performance / Speed Benchmarking
      - User Interface (UX) & Design
      required: true
    - id: 15
      name: feedback_channel_preference
      label: Preferred Feedback Channel
      hint: null
      type: select_one
      options:
      - Dedicated Discord Server
      - Email / Support Tickets
      - In-app Feedback Tool
      required: true
    - id: 16
      name: discord_username
      label: Discord Username (Optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: nda_agreement
      label: Confidentiality & NDA Agreement
      hint: null
      type: select_one
      options:
      - I agree to keep all beta features and screenshots confidential.
      - Other
      required: true
    - id: 18
      name: registration_date
      label: Date of Application
      hint: null
      type: date
      options: []
      required: true
