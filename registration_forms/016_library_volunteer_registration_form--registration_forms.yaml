inputSchema:
  type: object
  properties:
    title: Library Volunteer Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: availability
      label: Availability
      hint: null
      type: select_one
      options:
      - Volunteer Days
      - Volunteer Hours
      - Other
      required: false
    - id: 6
      name: volunteer_days
      label: Volunteer Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 7
      name: volunteer_hours
      label: Volunteer Hours
      hint: null
      type: select_multiple
      options:
      - 1 hour
      - 2 hours
      - 3 hours
      - 4 hours
      required: true
    - id: 8
      name: other_days
      label: Other
      hint: null
      type: text
      options: []
      required: false
