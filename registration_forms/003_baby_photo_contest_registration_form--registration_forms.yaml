inputSchema:
  type: object
  properties:
    title: Baby Photo Contest Registration Form
    pages:
    - id: 1
      name: contest_header
      label: -- Baby Photo Contest Registration --
      hint: Please fill out all details to enter
      type: note
      options: []
      required: false
    - id: 2
      name: parent_guardian_name
      label: Parent or Guardian Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_email
      label: Contact Email Address
      hint: We will notify winners via this email
      type: email
      options: []
      required: true
    - id: 4
      name: contact_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: baby_full_name
      label: Baby's Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: baby_birth_date
      label: Baby's Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 7
      name: baby_gender
      label: Baby's Gender
      hint: null
      type: select_one
      options:
      - Boy
      - Girl
      required: true
    - id: 8
      name: entry_category
      label: Contest Category
      hint: Select the most appropriate category
      type: select_one
      options:
      - Newborn (0-3 months)
      - Infants (4-12 months)
      - Toddlers (1-3 years)
      - Action Shots
      - Best Smile
      required: true
    - id: 9
      name: photo_title
      label: Photo Title or Caption
      hint: Give your entry a catchy name
      type: text
      options: []
      required: false
    - id: 10
      name: publicity_consent
      label: I consent to the use of the submitted photo for contest promotion
      hint: This includes social media and website display
      type: select_one
      options:
      - Yes, I agree
      - No, I do not agree
      required: true
    - id: 11
      name: legal_declaration
      label: I certify that I am the legal guardian of the child
      hint: null
      type: select_one
      options:
      - I certify
      - Other
      required: true
    - id: 12
      name: how_did_you_hear
      label: How did you hear about this contest?
      hint: null
      type: select_multiple
      options:
      - Social Media
      - Word of Mouth
      - Local Advertisement
      - Email Newsletter
      - Other
      required: false
