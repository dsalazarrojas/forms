inputSchema:
  type: object
  properties:
    title: Padel And Pilates Experience Registration
    pages:
    - id: 1
      name: session_details
      label: Session Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: attendee_info
      label: Attendee Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: payment_info
      label: Payment Information
      hint: null
      type: text
      options: []
      required: false
