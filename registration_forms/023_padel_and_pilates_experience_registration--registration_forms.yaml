    - id: 5
      name: total_cost
      label: Total Cost
      hint: null
      type: number
      options: []
      required: false
    - id: 6
      name: session_scheduling
      label: Session Scheduling
      hint: null
      type: select_multiple
      options:
      - Morning
      - Afternoon
      - Evening
      required: true
    - id: 7
      name: session_time
      label: Session Time
      hint: null
      type: time
      options: []
      required: false
    - id: 8
      name: attendee_email
      label: Attendee Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: attendee_phone
      label: Attendee Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
