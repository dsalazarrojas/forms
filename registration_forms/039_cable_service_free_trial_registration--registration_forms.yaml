inputSchema:
  type: object
  properties:
    title: Cable Service Free Trial Registration
    pages:
    - id: 1
      name: trial_header
      label: -- Free Trial Sign-up --
      hint: Experience premium cable and high-speed internet for 14 days
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: service_address
      label: Service Installation Address
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email_address
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone_number
      label: Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: current_provider
      label: Who is your current provider
      hint: if any
      type: text
      options: []
      required: false
    - id: 8
      name: package_interest_header
      label: -- Trial Package Selection --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: selected_trial_bundle
      label: Select Trial Package
      hint: null
      type: select_one
      options:
      - Internet 1 Gig Free Trial
      - Premium TV Pack Trial
      - Home Security and Automation Trial
      - The Ultimate Bundle Trial
      required: true
    - id: 10
      name: installation_pref
      label: Installation Preference
      hint: null
      type: select_one
      options:
      - Self-Install Kit (Free)
      - Professional Installation (Fee Applies)
      required: true
    - id: 11
      name: preferred_contact_time
      label: Best time to call for scheduling
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      required: false
    - id: 12
      name: referral_info
      label: How did you hear about this trial offer
      hint: null
      type: select_one
      options:
      - Direct Mail
      - Social Media
      - TV Ad
      - Word of Mouth
      - Search Engine
      required: false
    - id: 13
      name: terms_header
      label: -- Terms and Conditions --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: age_verification
      label: I am at least 18 years of age
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: trial_agreement
      label: I understand the trial automatically converts to a paid plan after 14
        days unless cancelled
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: privacy_policy_ack
      label: I agree to the Privacy Policy
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: submission_date
      label: Registration Date
      hint: null
      type: date
      options: []
      required: true
