inputSchema:
  type: object
  properties:
    title: Dance Event Participation Interest Form
    pages:
    - id: 1
      name: dance_event_participation_interest_form_first_page
      label: Interest
      hint: null
      type: select_one
      options:
      - Dance Style 1
      - Dance Style 2
      - Dance Style 3
      required: false
    - id: 2
      name: dance_event_participation_interest_form_second_page
      label: Availability
      hint: null
      type: select_multiple
      options:
      - 8am
      - 9am
      - 10am
      - 11am
      - 12pm
      - 1pm
      - 2pm
      - 3pm
      required: false
    - id: 3
      name: dance_event_participation_interest_form_third_page
      label: Dance Preference
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: dance_event_participation_interest_form_fourth_page
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: dance_event_participation_interest_form_fifth_page
      label: Phone
      hint: Please include your country code
      type: text
      options: []
      required: false
