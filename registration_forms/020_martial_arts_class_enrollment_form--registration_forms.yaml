inputSchema:
  type: object
  properties:
    title: Martial Arts Class Enrollment Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: birth_date
      label: Birth Date
      hint: null
      type: date
      options: []
      required: false
    - id: 4
      name: martial_arts_style
      label: Martial Arts Style
      hint: null
      type: select_multiple
      options:
      - Karate
      - Judo
      - Boxing
      - Wrestling
      - Tai Chi
      required: false
    - id: 5
      name: class_level
      label: Class Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
    - id: 6
      name: class_preferences
      label: Class Preferences
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 7
      name: contact_number
      label: Contact Number
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 9
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: false
    - id: 10
      name: preferred_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: false
