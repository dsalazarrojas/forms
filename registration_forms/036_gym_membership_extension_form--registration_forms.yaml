inputSchema:
  type: object
  properties:
    title: gym_membership_extension_form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: dob
      label: Date of Birth
      hint: YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 4
      name: membership_id
      label: Membership ID
      hint: null
      type: number
      options: []
      required: true
    - id: 5
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Membership
      - Non-Membership
      required: true
    - id: 6
      name: renewal_option
      label: Renewal Option
      hint: null
      type: select_multiple
      options:
      - Renew Now
      - Renew in 1 Month
      - Renew in 3 Months
      - Renew in 6 Months
      required: true
    - id: 7
      name: payment_details
      label: Payment Details
      hint: Payment method, amount, and payment method details
      type: note
      options: []
      required: true
    - id: 8
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 9
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: extension_start_date
      label: Extension Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 11
      name: extension_end_date
      label: Extension End Date
      hint: null
      type: date
      options: []
      required: true
