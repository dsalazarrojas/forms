inputSchema:
  type: object
  properties:
    title: Jeep Wave Oil Change Registration
    pages:
    - id: 1
      name: vehicle_info
      label: Vehicle Information
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: wave_program
      label: Wave Program
      hint: Select your Wave Program
      type: select_one
      options:
      - Wave
      - Wave Select
      - Wave Plus
      required: false
    - id: 3
      name: wave_program_select
      label: Wave Program Selected
      hint: null
      type: note
      options: []
      required: false
    - id: 4
      name: oil_change_details
      label: Oil Change Details
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: service_center
      label: Service Center
      hint: Select your Service Center
      type: select_one
      options:
      - Center1
      - Center2
      - Center3
      required: false
    - id: 6
      name: oil_type
      label: Oil Type
      hint: null
      type: select_one
      options:
      - Regular
      - Synthetic
      required: false
    - id: 7
      name: appointment_date
      label: Appointment Date
      hint: Select a date for your appointment
      type: date
      options: []
      required: false
    - id: 8
      name: service_details
      label: Service Details
      hint: null
      type: text
      options: []
      required: false
