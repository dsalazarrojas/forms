inputSchema:
  type: object
  properties:
    title: Backflow Tester Registration Survey
    pages:
    - id: 1
      name: tester_name
      label: Tester name
      hint: Full legal name
      type: text
      options: []
      required: true
    - id: 2
      name: license_number
      label: License or certification number
      hint: Provide issuing authority
      type: text
      options: []
      required: true
    - id: 3
      name: company_name
      label: Company name
      hint: Employer or self employed
      type: text
      options: []
      required: false
    - id: 4
      name: years_experience
      label: Years of experience testing backflow
      hint: Whole years
      type: number
      options: []
      required: false
    - id: 5
      name: service_areas
      label: Service areas covered
      hint: Cities or regions
      type: text
      options: []
      required: false
    - id: 6
      name: available_for_inspections
      label: Available for inspections
      hint: Contact for scheduling
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 7
      name: contact_phone
      label: Contact phone
      hint: Best number
      type: text
      options: []
      required: true
    - id: 8
      name: email
      label: Contact email
      hint: For registration confirmation
      type: email
      options: []
      required: true
    - id: 9
      name: insurance_info
      label: Insurance coverage for liability
      hint: Provider and policy number
      type: text
      options: []
      required: false
    - id: 10
      name: registration_date
      label: Registration date
      hint: Date submitted
      type: date
      options: []
      required: true
