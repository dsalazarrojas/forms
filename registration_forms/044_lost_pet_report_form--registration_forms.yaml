inputSchema:
  type: object
  properties:
    title: lost_pet_report_form
    pages:
    - id: 1
      name: pet_description
      label: Pet Description
      hint: Enter a brief description of your pet
      type: text
      options: []
      required: true
    - id: 2
      name: last_known_location
      label: Last Known Location
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: contact_name
      label: Owner Name
      hint: Enter your name as it appears on your identification
      type: text
      options: []
      required: true
    - id: 4
      name: contact_number
      label: Owner Phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 5
      name: contact_email
      label: Owner Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: date_missing
      label: Date Missing
      hint: Date you last saw your pet
      type: date
      options: []
      required: true
    - id: 7
      name: time_missing
      label: Time Missing
      hint: null
      type: time
      options: []
      required: true
    - id: 8
      name: last_seen_location_details
      label: Last Seen Location Details
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: photo_url
      label: Photo Url
      hint: Link to a photo of your pet
      type: text
      options: []
      required: true
    - id: 10
      name: pet_type
      label: Pet Type
      hint: null
      type: select_one
      options:
      - Dog
      - Cat
      - Fish
      - Other
      required: true
    - id: 11
      name: pet_color
      label: Pet Color
      hint: null
      type: select_multiple
      options:
      - Black
      - Brown
      - Green
      - Other
      required: false
    - id: 12
      name: pet_size
      label: Pet Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      - Other
      required: false
    - id: 13
      name: pet_age
      label: Pet Age
      hint: null
      type: number
      options: []
      required: true
    - id: 14
      name: collar_id
      label: Collar ID
      hint: Collar ID or microchip number
      type: text
      options: []
      required: true
    - id: 15
      name: microchip_number
      label: Microchip Number
      hint: Microchip number
      type: text
      options: []
      required: true
    - id: 16
      name: microchip_type
      label: Microchip Type
      hint: null
      type: select_one
      options:
      - RFID
      - GPS
      - Other
      required: true
    - id: 17
      name: vet_info
      label: Vet Information
      hint: null
      type: text
      options: []
      required: true
    - id: 18
      name: report_location
      label: Report Location
      hint: null
      type: text
      options: []
      required: true
    - id: 19
      name: report_date
      label: Report Date
      hint: null
      type: date
      options: []
      required: true
    - id: 20
      name: report_time
      label: Report Time
      hint: null
      type: time
      options: []
      required: true
    - id: 21
      name: report_reason
      label: Report Reason
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: report_details
      label: Report Details
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: owner_signature
      label: Owner Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 24
      name: officer_signature
      label: Officer Signature
      hint: null
      type: text
      options: []
      required: true
    - id: 25
      name: submit
      label: Submit
      hint: null
      type: text
      options: []
      required: false
