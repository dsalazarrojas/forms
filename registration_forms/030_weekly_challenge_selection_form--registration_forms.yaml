inputSchema:
  type: object
  properties:
    title: Weekly Challenge Selection Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: challenge_selection
      label: Challenge Selection
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 3
      name: start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: true
    - id: 4
      name: end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: start_time
      label: Start Time
      hint: null
      type: time
      options: []
      required: true
    - id: 6
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: participant_preferences
      label: Participant Preferences
      hint: null
      type: note
      options: []
      required: true
