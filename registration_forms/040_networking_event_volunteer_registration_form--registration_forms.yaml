inputSchema:
  type: object
  properties:
    title: Networking Event Volunteer Registration Form
    pages:
    - id: 1
      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: shift
      label: Shift
      hint: null
      type: select_one
      options:
      - 8am-12pm
      - 12pm-4pm
      - 4pm-8pm
      required: false
    - id: 3
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: event_start_date
      label: Event Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: event_end_date
      label: Event End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: role
      label: Role
      hint: null
      type: select_multiple
      options:
      - Event Organizer
      - Volunteer
      - Host
      - Sponsor
      required: false
    - id: 9
      name: event_location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: text
      options: []
      required: false
