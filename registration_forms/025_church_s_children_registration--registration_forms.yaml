inputSchema:
  type: object
  properties:
    title: Church's Children Registration
    pages:
    - id: 1
      name: section_header_child_info
      label: -- Child Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: child_first_name
      label: Child's First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: child_last_name
      label: Child's Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: age_group
      label: Age Group
      hint: null
      type: select_one
      options:
      - Infant (0-2)
      - Toddler (2-3)
      - Preschool (3-5)
      - Early Elementary (5-8)
      - Upper Elementary (8-12)
      - Teen (12+)
      required: true
    - id: 6
      name: grade_level
      label: Current Grade Level
      hint: null
      type: select_one
      options:
      - Preschool
      - Kindergarten
      - 1st Grade
      - 2nd Grade
      - 3rd Grade
      - 4th Grade
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: false
    - id: 7
      name: section_header_parent_guardian
      label: -- Parent or Guardian Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: parent_guardian_1_name
      label: Primary Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: parent_guardian_1_relationship
      label: Relationship to Child
      hint: null
      type: select_one
      options:
      - Mother
      - Father
      - Grandmother
      - Grandfather
      - Aunt
      - Uncle
      - Legal guardian
      - Other
      required: true
    - id: 10
      name: parent_guardian_1_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 11
      name: parent_guardian_1_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: parent_guardian_2_name
      label: Secondary Parent or Guardian Name
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: parent_guardian_2_phone
      label: Secondary Parent or Guardian Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: section_header_health
      label: -- Health and Medical Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: allergies
      label: Food or Environmental Allergies
      hint: Please list all known allergies
      type: text
      options: []
      required: false
    - id: 16
      name: medications
      label: Current Medications
      hint: List any medications the child is currently taking
      type: text
      options: []
      required: false
    - id: 17
      name: special_health_conditions
      label: Special Health Conditions or Needs
      hint: Asthma, diabetes, epilepsy, etc
      type: text
      options: []
      required: false
    - id: 18
      name: medical_provider
      label: Primary Medical Provider
      hint: Name and phone number if available
      type: text
      options: []
      required: false
    - id: 19
      name: insurance_provider
      label: Health Insurance Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 20
      name: section_header_emergency
      label: -- Emergency Contact Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: emergency_contact_name
      label: Emergency Contact Name (if not parent)
      hint: null
      type: text
      options: []
      required: false
    - id: 22
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: emergency_contact_relationship
      label: Relationship to Child
      hint: null
      type: text
      options: []
      required: false
    - id: 24
      name: section_header_behavioral
      label: -- Behavioral and Special Needs --
      hint: null
      type: note
      options: []
      required: false
    - id: 25
      name: behavioral_notes
      label: Behavioral Concerns or Special Needs
      hint: ADHD, anxiety, sensory issues, etc
      type: text
      options: []
      required: false
    - id: 26
      name: behavioral_triggers
      label: Known Behavioral Triggers
      hint: What situations may upset the child
      type: text
      options: []
      required: false
    - id: 27
      name: section_header_permissions
      label: -- Permissions and Agreements --
      hint: null
      type: note
      options: []
      required: false
    - id: 28
      name: photo_permission
      label: Permission to Take Photos or Video
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 29
      name: activity_permission
      label: Permission to Participate in Church Activities
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 30
      name: pickup_authorization
      label: Authorized Persons for Pickup
      hint: List names of those allowed to pick up child
      type: text
      options: []
      required: true
    - id: 31
      name: parent_agreement
      label: Parent or Guardian Agrees to Terms and Conditions
      hint: null
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
