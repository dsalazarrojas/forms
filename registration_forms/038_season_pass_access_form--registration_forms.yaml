inputSchema:
  type: object
  properties:
    title: Season Pass Access Form
    pages:
    - id: 1
      name: user_info
      label: User Information
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: season_pass_type
      label: Season Pass Type
      hint: Select one or more season passes to access
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 3
      name: organization_info
      label: Organization Information
      hint: Select your organization from our list
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - Other
      required: true
    - id: 4
      name: expiration_date
      label: Expiration Date
      hint: Select expiration date
      type: date
      options: []
      required: false
    - id: 5
      name: additional_info
      label: Additional Information
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: additional_info_2
      label: Additional Info 2
      hint: null
      type: text
      options: []
      required: false
