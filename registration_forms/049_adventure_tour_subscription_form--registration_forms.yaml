inputSchema:
  type: object
  properties:
    title: Adventure Tour Subscription Form
    pages:
    - id: 1
      name: subscription_header
      label: -- Tour Subscription --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: subscriber_name
      label: Subscriber full name
      hint: Name for booking
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email address
      hint: For subscription confirmations
      type: email
      options: []
      required: true
    - id: 4
      name: tour_preferences
      label: Tour preferences
      hint: Preferred types or destinations
      type: select_multiple
      options:
      - Hiking
      - Rafting
      - Cultural tours
      - Wildlife watching
      required: false
    - id: 5
      name: subscription_type
      label: Subscription type
      hint: Choose subscription frequency
      type: select_one
      options:
      - Monthly
      - Quarterly
      - Annually
      required: true
    - id: 6
      name: payment_info
      label: Payment information
      hint: Card or billing details
      type: text
      options: []
      required: true
    - id: 7
      name: agree_terms
      label: Agree to subscription terms
      hint: Required to activate subscription
      type: select_one
      options:
      - I agree
      - I do not agree
      required: true
    - id: 8
      name: start_date
      label: Subscription start date
      hint: Date to begin subscription
      type: date
      options: []
      required: true
