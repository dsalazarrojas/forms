inputSchema:
  type: object
  properties:
    title: Athletics Training Attendance Form
    pages:
    - id: 1
      name: athlete_name
      label: Athlete Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: athlete_id
      label: Athlete ID Number
      hint: Student or team identification number
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY format
      type: date
      options: []
      required: true
    - id: 4
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 6
      name: sport
      label: Sport
      hint: Primary sport
      type: select_one
      options:
      - Football
      - Basketball
      - Soccer
      - Track and Field
      - Swimming
      - Volleyball
      - Baseball
      - Softball
      - Tennis
      - Wrestling
      - Cross Country
      - Golf
      - Cheerleading
      - Other
      required: true
    - id: 7
      name: team_level
      label: Team Level
      hint: Competition level
      type: select_one
      options:
      - Varsity
      - Junior Varsity
      - Freshman
      - Club Team
      required: true
    - id: 8
      name: training_session_date
      label: Training Session Date
      hint: Date of training
      type: date
      options: []
      required: true
    - id: 9
      name: training_session_time
      label: Training Session Time
      hint: Time of training
      type: time
      options: []
      required: true
    - id: 10
      name: training_type
      label: Training Type
      hint: Type of training session
      type: select_one
      options:
      - Strength Training
      - Conditioning
      - Skill Development
      - Practice
      - Film Study
      - Team Meeting
      - Rehabilitation
      - Other
      required: true
    - id: 11
      name: attendance_status
      label: Attendance Status
      hint: Select your status
      type: select_one
      options:
      - Present
      - Late Arrival
      - Left Early
      - Excused Absence
      - Unexcused Absence
      required: true
    - id: 12
      name: arrival_time
      label: Actual Arrival Time
      hint: If late or for check-in
      type: time
      options: []
      required: false
    - id: 13
      name: departure_time
      label: Departure Time
      hint: Time of departure
      type: time
      options: []
      required: false
    - id: 14
      name: absence_reason
      label: Reason for Absence
      hint: If absent, please explain
      type: select_one
      options:
      - Not Applicable
      - Illness or Injury
      - Family Emergency
      - Academic Commitment
      - Medical Appointment
      - Personal Reason
      - Other
      required: true
    - id: 15
      name: absence_reason_details
      label: Absence Reason Details
      hint: Provide more details
      type: text
      options: []
      required: false
    - id: 16
      name: injury_status
      label: Injury Status
      hint: Are you currently injured
      type: select_one
      options:
      - No Injury
      - Minor Injury - Can Participate
      - Minor Injury - Limited Participation
      - Major Injury - Cannot Participate
      required: true
    - id: 17
      name: injury_description
      label: Injury Description
      hint: Describe injury if applicable
      type: text
      options: []
      required: false
    - id: 18
      name: pain_level
      label: Pain Level
      hint: Rate pain from 1 to 10
      type: number
      options: []
      required: false
    - id: 19
      name: participation_level
      label: Participation Level
      hint: Level of participation in session
      type: select_one
      options:
      - Full Participation
      - Modified Participation
      - Observation Only
      - Did Not Participate
      required: true
    - id: 20
      name: effort_rating
      label: Effort Rating
      hint: Rate your effort from 1 to 10
      type: number
      options: []
      required: true
    - id: 21
      name: coach_name
      label: Coach or Trainer Name
      hint: Name of leading coach
      type: text
      options: []
      required: true
    - id: 22
      name: session_location
      label: Session Location
      hint: Where was training held
      type: text
      options: []
      required: true
    - id: 23
      name: weather_conditions
      label: Weather Conditions
      hint: If outdoor training
      type: select_one
      options:
      - Not Applicable - Indoor
      - Sunny
      - Cloudy
      - Rainy
      - Snowy
      - Hot and Humid
      - Cold
      required: false
    - id: 24
      name: session_notes
      label: Session Notes
      hint: Any notes about the training
      type: text
      options: []
      required: false
    - id: 25
      name: goals_for_next_session
      label: Goals for Next Session
      hint: What do you want to work on
      type: text
      options: []
      required: false
    - id: 26
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
    - id: 27
      name: athlete_signature
      label: Athlete Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 28
      name: signature_date
      label: Signature Date
      hint: Date of signature
      type: date
      options: []
      required: true
