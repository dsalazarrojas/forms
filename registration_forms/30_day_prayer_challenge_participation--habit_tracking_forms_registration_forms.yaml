      options:
      - 5-10 minutes
      - 10-20 minutes
      - 20-30 minutes
      - 30+ minutes
      required: true
    - id: 10
      name: notification_preference
      label: Preferred daily reminder method
      hint: null
      type: select_one
      options:
      - Email only
      - SMS only
      - Both email and SMS
      - No reminders needed
      required: true
    - id: 11
      name: accountability_partner
      label: Will you participate with an accountability partner?
      hint: null
      type: select_one
      options:
      - Yes, already arranged
      - Yes, need to find one
      - No, participating alone
      - No, joining a group
