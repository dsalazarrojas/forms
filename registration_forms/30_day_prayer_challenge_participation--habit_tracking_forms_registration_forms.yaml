inputSchema:
  type: object
  properties:
    title: 30 Day Prayer Challenge Participation
    pages:
    - id: 1
      name: header_welcome
      label: '--- Welcome to the 30-Day Prayer Challenge ---'
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full name
      hint: Please enter your first and last name
      type: text
      options: []
      required: true
    - id: 3
      name: email_address
      label: Email address
      hint: We'll send daily prayer prompts here
      type: email
      options: []
      required: true
    - id: 4
      name: phone_number
      label: Phone number
      hint: Optional - for important updates only
      type: phone
      options: []
      required: false
    - id: 5
      name: age_group
      label: Age group
      hint: null
      type: select_one
      options:
      - Under 18
      - 18-25
      - 26-35
      - 36-50
      - 51-65
      - Over 65
      required: false
    - id: 6
      name: church_affiliation
      label: Church or ministry affiliation
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: prayer_experience
      label: Current prayer practice level
      hint: null
      type: select_one
      options:
      - Just starting
      - Few times a week
      - Daily prayer
      - Extended prayer periods
      - Leading others in prayer
      required: true
    - id: 8
      name: prayer_focus
      label: Primary prayer focus during challenge
      hint: Select all that apply
      type: select_multiple
