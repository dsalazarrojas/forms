inputSchema:
  type: object
  properties:
    title: Customer Journey Mapping Workshop Registration
    pages:
    - id: 1
      name: workshop_name
      label: Workshop Name
      hint: What is the name of this workshop?
      type: text
      options: []
      required: true
    - id: 2
      name: attendee_name
      label: Attendee Name
      hint: What is your name?
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Enter your phone number
      type: text
      options: []
      required: true
    - id: 5
      name: workshop_date
      label: Workshop Date
      hint: What is the date of the workshop?
      type: date
      options: []
      required: true
    - id: 6
      name: workshop_time
      label: Workshop Time
      hint: What is the time of the workshop?
      type: time
      options: []
      required: true
    - id: 7
      name: attendees
      label: Will you be attending with any colleagues or team members?
      hint: null
      type: select_multiple
      options:
      - 'True'
      - 'False'
      required: true
    - id: 8
      name: workshop_status
      label: What is the current status of the workshop?
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 9
      name: workshop_manager
      label: Who is the primary manager of the workshop?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 10
      name: workshop_notes
      label: Are there any additional notes about the workshop?
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: workshop_manager_2
      label: Is this workshop manager available?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: workshop_status_2
      label: Is this workshop active?
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 13
      name: additional_notes
      label: Is there anything else you'd like to share about the workshop?
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: future_workshops
      label: Will you be attending other workshops in the future?
      hint: null
      type: text
      options: []
      required: false
    - id: 15
      name: future_questions
      label: Is there anything else you'd like to share about future workshops?
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: other_questions
      label: Do you have any other questions or concerns about this workshop?
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: thank_you
      label: Thank you for participating in the workshop registration process!
      hint: null
      type: text
      options: []
      required: false
    - id: 18
      name: end_message
      label: End Message
      hint: null
      type: text
      options: []
      required: false
