inputSchema:
  type: object
  properties:
    title: BOR Conference Registration Form
    pages:
    - id: 1
      name: section_personal_info
      label: -- Personal Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email_address
      label: Email Address
      hint: Conference updates will be sent here
      type: email
      options: []
      required: true
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: organization
      label: Organization or Company
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: job_title
      label: Job Title
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: section_conference_info
      label: -- Conference Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: conference_date
      label: Conference Date
      hint: Which dates are you attending?
      type: text
      options: []
      required: true
    - id: 10
      name: registration_type
      label: Registration Type
      hint: null
      type: select_one
      options:
      - Full Conference
      - Single Day
      - Student
      - Group (5+)
      - Professional
      - VIP
      required: true
    - id: 11
      name: section_dinner
      label: -- Dinner Options --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: dinner_option
      label: Dinner Selection
      hint: Select if you want dinner included
      type: select_one
      options:
      - No dinner
      - Included with registration
      - Add dinner ticket
      - Vegetarian dinner
      - Vegan dinner
      - Other dietary restriction
      required: true
    - id: 13
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: section_payment
      label: -- Payment Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: registration_fee
      label: Registration Fee
      hint: Cost will be calculated
      type: number
      options: []
      required: false
    - id: 16
      name: payment_method
      label: Preferred Payment Method
      hint: null
      type: select_one
      options:
      - PayPal
      - Credit Card
      - Bank Transfer
      - Check
      required: true
    - id: 17
      name: section_special_requests
      label: -- Special Requests --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: special_accommodations
      label: Special Accommodations or Requests
      hint: Accessibility needs, seating preferences, etc.
      type: text
      options: []
      required: false
    - id: 19
      name: additional_notes
      label: Additional Comments
      hint: null
      type: text
      options: []
      required: false
