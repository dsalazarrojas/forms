inputSchema:
  type: object
  properties:
    title: Community Outreach Training Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: Your personal details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: email
      label: Email Address
      hint: For training materials and updates
      type: email
      options: []
      required: true
    - id: 5
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: organization
      label: Organization Affiliation
      hint: Company, nonprofit, or group
      type: text
      options: []
      required: false
    - id: 8
      name: job_title
      label: Job Title or Role
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: training_selection
      label: Training Selection
      hint: Choose your training session
      type: note
      options: []
      required: false
    - id: 10
      name: training_program
      label: Training Program
      hint: null
      type: select_one
      options:
      - Community Outreach Basics
      - Advanced Engagement Strategies
      - Volunteer Management
      - Grant Writing for Outreach
      - Cultural Competency Training
      - Crisis Intervention
      - Program Evaluation
      required: true
    - id: 11
      name: training_date
      label: Preferred Training Date
      hint: null
      type: date
      options: []
      required: true
    - id: 12
      name: training_format
      label: Training Format
      hint: null
      type: select_one
      options:
      - In-Person
      - Virtual/Online
      - Hybrid
      required: true
    - id: 13
      name: experience_level
      label: Experience Level
      hint: Your current experience with outreach
      type: select_one
      options:
      - Beginner (No Experience)
      - Intermediate (1-3 Years)
      - Advanced (3-5 Years)
      - Expert (5+ Years)
      required: true
    - id: 14
      name: learning_goals
      label: What Do You Hope to Learn
      hint: Your training objectives
      type: text
      options: []
      required: true
    - id: 15
      name: accessibility_needs
      label: Accessibility Requirements
      hint: Any accommodations needed
      type: text
      options: []
      required: false
    - id: 16
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: If catering is provided
      type: text
      options: []
      required: false
    - id: 17
      name: referral_source
      label: How Did You Hear About This Training
      hint: null
      type: select_one
      options:
      - Organization Website
      - Social Media
      - Email Newsletter
      - Colleague Referral
      - Previous Training
      - Other
      required: false
    - id: 18
      name: employer_sponsored
      label: Is Your Employer Sponsoring This Training
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Partially
      required: true
    - id: 19
      name: certification_needed
      label: Do You Need Certification Upon Completion
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 20
      name: additional_comments
      label: Additional Comments or Questions
      hint: null
      type: text
      options: []
      required: false
    - id: 21
      name: emergency_contact
      label: Emergency Contact Name
      hint: For in-person training
      type: text
      options: []
      required: false
    - id: 22
      name: emergency_phone
      label: Emergency Contact Phone
      hint: null
      type: text
      options: []
      required: false
