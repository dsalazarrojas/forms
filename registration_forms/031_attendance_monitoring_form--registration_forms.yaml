inputSchema:
  type: object
  properties:
    title: Attendance Monitoring Form
    pages:
    - id: 1
      name: program_information
      label: -- Program Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: program_name
      label: Program Name
      hint: Name of the program or course
      type: text
      options: []
      required: true
    - id: 3
      name: program_date
      label: Program Date
      hint: Date of the program session
      type: date
      options: []
      required: true
    - id: 4
      name: program_time
      label: Program Time
      hint: Start time of the session
      type: time
      options: []
      required: true
    - id: 5
      name: program_location
      label: Program Location
      hint: Where is the program held?
      type: text
      options: []
      required: true
    - id: 6
      name: instructor_facilitator
      label: Instructor/Facilitator Name
      hint: Person leading the program
      type: text
      options: []
      required: true
    - id: 7
      name: participant_information
      label: -- Participant Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: participant_name
      label: Participant Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 9
      name: participant_id
      label: Participant ID
      hint: ID number or reference
      type: text
      options: []
      required: false
    - id: 10
      name: email
      label: Email Address
      hint: null
      type: email
      options: []
      required: false
    - id: 11
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: organization_affiliation
      label: Organization/Group
      hint: Which group are you with?
      type: text
      options: []
      required: false
    - id: 13
      name: attendance_tracking
      label: -- Attendance Tracking --
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: attendance_status
      label: Attendance Status
      hint: Are you present?
      type: select_one
      options:
      - Present
      - Absent
      - Late
      - Excused
      - Left Early
      required: true
    - id: 15
      name: arrival_time
      label: Arrival Time
      hint: What time did you arrive?
      type: time
      options: []
      required: false
    - id: 16
      name: departure_time
      label: Departure Time
      hint: What time did you leave?
      type: time
      options: []
      required: false
    - id: 17
      name: session_participation
      label: Session Participation
      hint: Rate your participation level
      type: select_one
      options:
      - Full Participation
      - Active Participation
      - Minimal Participation
      - Observed
      - No Participation
      required: true
    - id: 18
      name: absense_reason
      label: Reason for Absence (if applicable)
      hint: Why were you absent?
      type: text
      options: []
      required: false
    - id: 19
      name: engagement_level
      label: -- Engagement Assessment --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: engagement_rating
      label: Engagement Level
      hint: Rate your engagement with the program
      type: select_one
      options:
      - Highly Engaged
      - Engaged
      - Neutral
      - Disengaged
      - Not Applicable
      required: true
    - id: 21
      name: attention_focus
      label: Attention and Focus
      hint: How focused were you?
      type: select_one
      options:
      - Excellent
      - Good
      - Fair
      - Poor
      - Not Observed
      required: false
    - id: 22
      name: completion_status
      label: Program Completion
      hint: Have you completed the program?
      type: select_one
      options:
      - Completed
      - In Progress
      - Incomplete
      - Not Started
      required: false
    - id: 23
      name: additional_information
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: special_notes
      label: Special Notes or Comments
      hint: Any observations or notes?
      type: text
      options: []
      required: false
    - id: 25
      name: follow_up_required
      label: Follow-up Action Required?
      hint: Is any follow-up needed?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
