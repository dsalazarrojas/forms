inputSchema:
  type: object
  properties:
    title: Cookie and Tea Party Registration
    pages:
    - id: 1
      name: guest_name
      label: Your Full Name
      hint: Name of guest
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email Address
      hint: For confirmation and updates
      type: email
      options: []
      required: true
    - id: 3
      name: phone
      label: Phone Number
      hint: Best contact number
      type: text
      options: []
      required: true
    - id: 4
      name: section_party_details
      label: -- Party Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 5
      name: party_date
      label: Party Date
      hint: Date of the event
      type: date
      options: []
      required: true
    - id: 6
      name: party_time
      label: Party Time
      hint: Time of the event
      type: time
      options: []
      required: true
    - id: 7
      name: party_location
      label: Party Location
      hint: Where will it be held
      type: text
      options: []
      required: true
    - id: 8
      name: section_attendance
      label: -- Attendance --
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: will_attend
      label: Will you attend
      hint: null
      type: select_one
      options:
      - Yes - I will be there
      - No - Cannot attend
      - Maybe - Will confirm later
      required: true
    - id: 10
      name: number_of_guests
      label: Number in Your Party
      hint: Total number attending including you
      type: number
      options: []
      required: true
    - id: 11
      name: guest_names
      label: Names of Other Guests
      hint: List names if known
      type: text
      options: []
      required: false
    - id: 12
      name: children_attending
      label: Number of Children
      hint: If applicable
      type: number
      options: []
      required: false
    - id: 13
      name: children_ages
      label: Ages of Children
      hint: For activity planning
      type: text
      options: []
      required: false
    - id: 14
      name: section_preferences
      label: -- Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: tea_preference
      label: Tea Preference
      hint: null
      type: select_one
      options:
      - Black Tea
      - Green Tea
      - Herbal Tea
      - Earl Grey
      - Chai
      - No Tea
      - Other
      required: true
    - id: 16
      name: cookie_preference
      label: Cookie Preference
      hint: Favorite type of cookies
      type: select_one
      options:
      - Chocolate Chip
      - Oatmeal Raisin
      - Sugar Cookies
      - Shortbread
      - Macarons
      - Assorted
      - Other
      required: true
    - id: 17
      name: dietary_requirements
      label: Dietary Requirements
      hint: Any special dietary needs
      type: select_one
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Dairy-Free
      - Nut Allergy
      - Other
      required: true
    - id: 18
      name: dietary_details
      label: Dietary Details
      hint: Please specify your requirements
      type: text
      options: []
      required: false
    - id: 19
      name: section_activities
      label: -- Activities --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: interested_activities
      label: Activities You Are Interested In
      hint: Select all that apply
      type: select_multiple
      options:
      - Cookie Decorating
      - Tea Tasting
      - Cookie Baking Demo
      - Tea Ceremony
      - Crafts
      - Games
      - Just Socializing
      required: false
    - id: 21
      name: bring_own_apron
      label: Will you bring your own apron
      hint: For activities
      type: select_one
      options:
      - true
      - No - Please provide
      required: false
    - id: 22
      name: section_seating
      label: -- Seating --
      hint: null
      type: note
      options: []
      required: false
    - id: 23
      name: seating_preference
      label: Seating Preference
      hint: null
      type: select_one
      options:
      - Indoor
      - Outdoor
      - No Preference
      required: false
    - id: 24
      name: table_assignment
      label: Table Assignment Request
      hint: Anyone you want to sit with
      type: text
      options: []
      required: false
    - id: 25
      name: section_gifts
      label: -- Gifts --
      hint: null
      type: note
      options: []
      required: false
    - id: 26
      name: bringing_gifts
      label: Will you be bringing any homemade treats
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 27
      name: gift_details
      label: Gift Details
      hint: What will you bring
      type: text
      options: []
      required: false
    - id: 28
      name: section_transportation
      label: -- Transportation --
      hint: null
      type: note
      options: []
      required: false
    - id: 29
      name: parking_needed
      label: Will you need parking
      hint: null
      type: select_one
      options:
      - true
      - false
      required: false
    - id: 30
      name: need_ride_share
      label: Interested in ride sharing
      hint: null
      type: select_one
      options:
      - Yes - Can offer ride
      - Yes - Need a ride
      - false
      required: false
    - id: 31
      name: section_additional
      label: -- Additional Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 32
      name: how_did_you_hear
      label: How did you hear about this event
      hint: null
      type: select_one
      options:
      - Social Media
      - Friend
      - Email Invitation
      - Website
      - Flyer
      - Other
      required: false
    - id: 33
      name: special_requests
      label: Special Requests
      hint: Any special requirements
      type: text
      options: []
      required: false
    - id: 34
      name: additional_comments
      label: Additional Comments
      hint: Anything else you would like to share
      type: text
      options: []
      required: false
    - id: 35
      name: rsvp_deadline
      label: RSVP Date
      hint: Date of your response
      type: date
      options: []
      required: true
