inputSchema:
  type: object
  properties:
    title: Extended Stay Accommodation Form
    pages:
    - id: 1
      name: hotel_name
      label: Hotel Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: address
      label: Address
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: room_type
      label: Room Type
      hint: null
      type: select_one
      options:
      - Hotel Suite
      - Private Room
      - Shared Room
      required: false
    - id: 4
      name: checkin_date
      label: Check-in Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: checkout_date
      label: Check-out Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: guest_name
      label: Guest Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 8
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 9
      name: room_count
      label: Room Count
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: room_service
      label: Room Service
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 11
      name: special_requests
      label: Special Requests
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: arrival_time
      label: Arrival Time
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: departure_time
      label: Departure Time
      hint: null
      type: time
      options: []
      required: false
