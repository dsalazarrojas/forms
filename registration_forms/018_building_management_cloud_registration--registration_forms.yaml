inputSchema:
  type: object
  properties:
    title: Building Management Cloud Registration
    pages:
    - id: 1
      name: registration_date
      label: Registration Date
      hint: When registering for the platform
      type: date
      options: []
      required: true
    - id: 2
      name: property_owner_section
      label: -- Property Owner Information --
      hint: Details about the property owner
      type: note
      options: []
      required: false
    - id: 3
      name: owner_name
      label: Property Owner Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 4
      name: owner_email
      label: Owner Email Address
      hint: Primary email contact
      type: email
      options: []
      required: true
    - id: 5
      name: owner_phone
      label: Owner Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 6
      name: company_name
      label: Company or Organization Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 7
      name: property_section
      label: -- Property Information --
      hint: Details about the building
      type: note
      options: []
      required: false
    - id: 8
      name: property_name
      label: Property Name
      hint: Name of the building
      type: text
      options: []
      required: true
    - id: 9
      name: property_address
      label: Property Address
      hint: Full street address
      type: text
      options: []
      required: true
    - id: 10
      name: city
      label: City
      hint: City name
      type: text
      options: []
      required: true
    - id: 11
      name: state_province
      label: State or Province
      hint: State or province code
      type: text
      options: []
      required: true
    - id: 12
      name: postal_code
      label: Postal Code
      hint: Zip or postal code
      type: text
      options: []
      required: true
    - id: 13
      name: country
      label: Country
      hint: Country name
      type: text
      options: []
      required: true
    - id: 14
      name: property_type
      label: Property Type
      hint: What type of building
      type: select_one
      options:
      - Residential
      - Commercial
      - Industrial
      - Mixed Use
      - Healthcare
      - Education
      - Government
      - Other
      required: true
    - id: 15
      name: building_sqft
      label: Building Square Footage
      hint: Total building size
      type: number
      options: []
      required: false
    - id: 16
      name: num_units
      label: Number of Units or Spaces
      hint: For multi-unit properties
      type: number
      options: []
      required: false
    - id: 17
      name: year_built
      label: Year Built
      hint: Construction year
      type: number
      options: []
      required: false
    - id: 18
      name: manager_section
      label: -- Property Manager Information --
      hint: Manager or administrator details
      type: note
      options: []
      required: false
    - id: 19
      name: manager_name
      label: Property Manager Name
      hint: Full name of manager
      type: text
      options: []
      required: true
    - id: 20
      name: manager_email
      label: Manager Email Address
      hint: Email contact
      type: email
      options: []
      required: true
    - id: 21
      name: manager_phone
      label: Manager Phone Number
      hint: Contact number
      type: text
      options: []
      required: true
    - id: 22
      name: services_section
      label: -- Services of Interest --
      hint: What services do you need
      type: note
      options: []
      required: false
    - id: 23
      name: services_interested
      label: Services You Are Interested In
      hint: Select applicable services
      type: select_multiple
      options:
      - Maintenance Scheduling
      - Tenant Portal
      - Work Order Management
      - Financial Management
      - Compliance Tracking
      - Energy Management
      - Reporting and Analytics
      required: true
    - id: 24
      name: current_system
      label: Currently Using Management System
      hint: What system are you using now
      type: select_one
      options:
      - true
      - false
      - Unsure
      required: false
    - id: 25
      name: estimated_timeline
      label: Estimated Timeline for Full Setup
      hint: When ready to go live
      type: select_one
      options:
      - Immediately
      - Within 1 Month
      - 1-3 Months
      - 3-6 Months
      - More than 6 Months
      required: false
