inputSchema:
  type: object
  properties:
    title: Human Library Participation Agreement
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - Volunteer
      - Participant
      - Organizer
      required: false
    - id: 5
      name: shift
      label: Shift
      hint: null
      type: select_multiple
      options:
      - morning
      - afternoon
      - full-day
      required: false
    - id: 6
      name: confirm
      label: Confirm
      hint: null
      type: select_one
      options:
      - I confirm that I will participate in the event.
      - I do not confirm that I will participate in the event.
      required: false
