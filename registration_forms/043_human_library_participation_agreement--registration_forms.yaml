      name: event_name
      label: Event Name
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: false
    - id: 12
      name: event_start_time
      label: Event Start Time
      hint: null
      type: time
      options: []
      required: false
    - id: 13
      name: event_end_time
      label: Event End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 14
      name: session_time
