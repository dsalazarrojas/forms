inputSchema:
  type: object
  properties:
    title: pocket_pa_client_consultation_form
    pages:
    - id: 1
      name: client_name
      label: Client Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_method
      label: Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Other
      required: true
    - id: 3
      name: contact_method_other
      label: Other Contact Method
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: true
    - id: 5
      name: appointment_duration
      label: Appointment Duration
      hint: null
      type: number
      options: []
      required: true
    - id: 6
      name: available_days
      label: Available Days
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      required: true
    - id: 7
      name: appointment_duration_unit
      label: Appointment Duration prophets
      hint: null
      type: select_one
      options:
      - '15'
      - '30'
      - '45'
      - '60'
      required: true
    - id: 8
      name: client_message
      label: Client Message
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: client_message_2
      label: Client Message 2
      hint: null
      type: text
      options: []
      required: false
