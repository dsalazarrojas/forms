inputSchema:
  type: object
  properties:
    title: horse-registration-form
    pages:
    - id: 1
      name: horse_info
      label: Horse Info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: owner_info
      label: owner-info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: horse_breed
      label: horse-breed
      hint: null
      type: select_one
