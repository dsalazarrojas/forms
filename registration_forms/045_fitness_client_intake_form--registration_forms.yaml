inputSchema:
  type: object
  properties:
    title: Fitness Client Intake Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: health_history
      label: Health History
      hint: Please provide any past injuries or medical conditions that could be relevant
        to your training.
      type: note
      options: []
      required: false
    - id: 6
      name: name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: work_hours
      label: Work Hours
      hint: null
      type: time
      options: []
      required: true
    - id: 9
      name: days_available
      label: Days Available
      hint: null
      type: select_one
      options:
      - Morning
      - Afternoon
      - Evening
      - Weekend
      required: true
    - id: 10
      name: training_goals
      label: Training Goals
      hint: Please describe your fitness goals.
      type: note
      options: []
      required: true
    - id: 11
      name: terms_and_conditions
      label: Terms and Conditions
      hint: Please read and agree to our terms and conditions.
      type: select_multiple
      options:
      - I agree
      - I do not agree
      required: true
    - id: 12
      name: privacy_policy
      label: Privacy Policy
      hint: Please read and agree to our privacy policy.
      type: select_multiple
      options:
      - I agree
      - I do not agree
      required: true
    - id: 13
      name: liability_release
      label: Liability Release
      hint: Please read and agree to our liability release.
      type: select_multiple
      options:
      - I agree
      - I do not agree
      required: true
