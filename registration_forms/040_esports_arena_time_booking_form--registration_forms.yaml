      options: []
      required: false
    - id: 5
      name: end_time
      label: End Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: duration
      label: Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 7
      name: event_details
      label: Event Details
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: event_notes
      label: Event Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: venue
      label: Venue
      hint: null
      type: select_multiple
      options:
      - Arena 1
      - Arena 2
      - Arena 3
      required: false
    - id: 10
      name: contact_number
      label: Contact Number
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
