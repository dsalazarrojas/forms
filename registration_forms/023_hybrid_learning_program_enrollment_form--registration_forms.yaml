inputSchema:
  type: object
  properties:
    title: Hybrid Learning Program Enrollment Form
    pages:
    - id: 1
      name: student_programs
      label: Student Programs
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: program_start_date
      label: Program Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: program_end_date
      label: Program End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: program_duration
      label: Program Duration
      hint: null
      type: number
      options: []
      required: false
    - id: 8
      name: program_status
      label: Program Status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: false
    - id: 9
      name: student_level
      label: Student Level
      hint: null
      type: select_one
      options:
      - High
      - Low
      required: false
    - id: 10
      name: institution_name
      label: Institution Name
      hint: null
      type: text
      options: []
      required: false
