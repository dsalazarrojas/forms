inputSchema:
  type: object
  properties:
    title: IT Support Course Registration Form
    pages:
    - id: 1
      name: course_selection
      label: Select a Course
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: participant_name
      label: Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: participant_email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: participant_phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: participant_notes
      label: Notes
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: course_name
      label: Course Name
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: course_start_date
      label: Start Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: course_end_date
      label: End Date
      hint: null
      type: date
      options: []
      required: false
    - id: 9
      name: confirm_enrollment
      label: Confirm Enrollment
      hint: null
      type: select_one
      options:
      - Enrollment Confirmed
      - Enrollment Not Confirmed
      required: false
    - id: 10
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: course_location
      label: Course Location
      hint: null
      type: select_multiple
      options:
      - Option 1
      - Option 2
      - Option 3
      required: false
