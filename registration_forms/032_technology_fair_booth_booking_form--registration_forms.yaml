inputSchema:
  type: object
  properties:
    title: Technology Fair Booth Booking Form
    pages:
    - id: 1
      name: exhibit_name
      label: Exhibit Name
      hint: Enter your full company name
      type: text
      options: []
      required: true
    - id: 2
      name: booth_type
      label: Booth Type
      hint: null
      type: select_one
      options:
      - 3m X 3m
      - 6m x 6m
      - 12m X 12m
      - Other
      required: true
    - id: 3
      name: number_of_exhibitors
      label: Number of Exhibitors
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: contact_person
      label: Contact Person
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 6
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: booth_requirements
      label: Booth Requirements
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: technology_fair_date
      label: Technology Fair Date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: true
    - id: 9
      name: technology_fair_time
      label: Technology Fair Time
      hint: HH -MM -SS
      type: time
      options: []
      required: true
    - id: 10
      name: technology_fair_location
      label: Technology Fair Location
      hint: null
      type: select_one
      options:
      - Technology Center
      - Science Museum
      - Convention Center
      - Online
      - Other
      required: true
    - id: 11
      name: online_booking
      label: Online Booking
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 12
      name: technology_fair_size
      label: Booth Size
      hint: null
      type: select_one
      options:
      - 3m X 3m
      - 6m x 6m
      - 12m X 12m
      - Other
      required: true
    - id: 13
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
