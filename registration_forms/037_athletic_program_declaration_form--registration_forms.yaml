inputSchema:
  type: object
  properties:
    title: Athletic Program Declaration Form
    pages:
    - id: 1
      name: student_name
      label: Student Athlete Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY format
      type: date
      options: []
      required: true
    - id: 3
      name: student_id
      label: Student ID Number
      hint: School identification number
      type: text
      options: []
      required: true
    - id: 4
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 6
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      required: true
    - id: 7
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 8
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 9
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 10
      name: address
      label: Street Address
      hint: Home address
      type: text
      options: []
      required: true
    - id: 11
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 12
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 13
      name: zip_code
      label: ZIP Code
      hint: ZIP or postal code
      type: text
      options: []
      required: true
    - id: 14
      name: program_declaration
      label: Athletic Program Declaration
      hint: Select program you are declaring for
      type: select_one
      options:
      - Varsity Football
      - Junior Varsity Football
      - Varsity Basketball
      - Junior Varsity Basketball
      - Varsity Soccer
      - Junior Varsity Soccer
      - Track and Field
      - Swimming
      - Volleyball
      - Baseball
      - Softball
      - Tennis
      - Wrestling
      - Cross Country
      - Golf
      - Cheerleading
      required: true
    - id: 15
      name: season
      label: Season
      hint: Which season
      type: select_one
      options:
      - Fall
      - Winter
      - Spring
      - Summer
      required: true
    - id: 16
      name: school_year
      label: School Year
      hint: Academic year
      type: text
      options: []
      required: true
    - id: 17
      name: previous_participation
      label: Previous Participation
      hint: Have you participated before
      type: select_one
      options:
      - Yes - Varsity
      - Yes - Junior Varsity
      - Yes - Freshman
      - No - First Time
      required: true
    - id: 18
      name: other_sports
      label: Other Sports Participating In
      hint: Select all that apply
      type: select_multiple
      options:
      - Football
      - Basketball
      - Soccer
      - Track and Field
      - Swimming
      - Volleyball
      - Baseball
      - Softball
      - Tennis
      - Wrestling
      - Cross Country
      - Golf
      - None
      required: false
    - id: 19
      name: commitment_level
      label: Commitment Level
      hint: Level of commitment to the program
      type: select_one
      options:
      - Full Commitment - All Seasons
      - Primary Sport Commitment
      - Multi-Sport Athlete
      - Recreational Participation
      required: true
    - id: 20
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: List any conditions or allergies
      type: text
      options: []
      required: true
    - id: 21
      name: current_medications
      label: Current Medications
      hint: List any medications
      type: text
      options: []
      required: false
    - id: 22
      name: insurance_provider
      label: Health Insurance Provider
      hint: Name of insurance company
      type: text
      options: []
      required: true
    - id: 23
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Policy or member number
      type: text
      options: []
      required: true
    - id: 24
      name: physician_name
      label: Primary Physician Name
      hint: Name of regular doctor
      type: text
      options: []
      required: true
    - id: 25
      name: physician_phone
      label: Physician Phone
      hint: Doctor contact number
      type: text
      options: []
      required: true
    - id: 26
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact
      type: text
      options: []
      required: true
    - id: 27
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: true
    - id: 28
      name: transportation_plan
      label: Transportation Plan
      hint: How will student get to practices and games
      type: select_one
      options:
      - Parent or Guardian
      - School Bus
      - Personal Vehicle
      - Carpool
      - Other
      required: true
    - id: 29
      name: code_of_conduct
      label: Code of Conduct Agreement
      hint: I agree to follow the athletic code of conduct
      type: select_one
      options:
      - Yes - I Agree
      - 'No'
      required: true
    - id: 30
      name: academic_eligibility
      label: Academic Eligibility Confirmation
      hint: I confirm I meet academic requirements
      type: select_one
      options:
      - Yes - I Am Eligible
      - 'No'
      - Pending Review
      required: true
    - id: 31
      name: assumption_of_risk
      label: Assumption of Risk
      hint: I understand and accept the risks of athletic participation
      type: select_one
      options:
      - Yes - I Understand
      - 'No'
      required: true
    - id: 32
      name: media_release
      label: Media Release
      hint: Permission for photos and media coverage
      type: select_one
      options:
      - Yes - Allowed
      - No - Not Allowed
      required: true
    - id: 33
      name: student_signature
      label: Student Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 34
      name: parent_guardian_signature
      label: Parent or Guardian Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 35
      name: signature_date
      label: Signature Date
      hint: Date of signature
      type: date
      options: []
      required: true
