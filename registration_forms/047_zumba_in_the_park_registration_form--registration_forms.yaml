inputSchema:
  type: object
  properties:
    title: Zumba In The Park Registration Form
    pages:
    - id: 1
      name: user_first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: time
      label: Time
      hint: null
      type: time
      options: []
      required: false
    - id: 6
      name: class_level
      label: Class Level
      hint: null
      type: select_one
      options:
      - Level 1
      - Level 2
      - Level 3
      required: true
    - id: 7
      name: payment_method
      label: Payment Method
      hint: null
      type: select_multiple
      options:
      - Cash
      - Check
      required: true
    - id: 8
      name: class_type
      label: Class Type
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: true
    - id: 9
      name: class_frequency
      label: Class Frequency
      hint: null
      type: select_multiple
      options:
      - Once a week
      - Twice a week
      - Three times a week
      required: true
    - id: 10
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: organization
      label: Organization
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: role
      label: Role
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: contact_email
      label: Contact Email
      hint: null
      type: email
      options: []
      required: false
