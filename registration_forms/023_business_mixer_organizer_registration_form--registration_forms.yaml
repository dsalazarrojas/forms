inputSchema:
  type: object
  properties:
    title: Business Mixer Organizer Registration Form
    pages:
    - id: 1
      name: organizer_name
      label: Organizer Name
      hint: Full name of event organizer
      type: text
      options: []
      required: true
    - id: 2
      name: organizer_email
      label: Organizer Email
      hint: Email for event communication
      type: email
      options: []
      required: true
    - id: 3
      name: organizer_phone
      label: Organizer Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 4
      name: organization_name
      label: Organization Name
      hint: Name of organizing entity
      type: text
      options: []
      required: true
    - id: 5
      name: event_name
      label: Event Name
      hint: Name of the mixer event
      type: text
      options: []
      required: true
    - id: 6
      name: event_date
      label: Event Date
      hint: Date of the mixer
      type: date
      options: []
      required: true
    - id: 7
      name: event_start_time
      label: Event Start Time
      hint: Start time of event
      type: time
      options: []
      required: true
    - id: 8
      name: event_end_time
      label: Event End Time
      hint: End time of event
      type: time
      options: []
      required: true
    - id: 9
      name: event_location
      label: Event Location
      hint: Full venue address
      type: text
      options: []
      required: true
    - id: 10
      name: venue_name
      label: Venue Name
      hint: Name of the venue
      type: text
      options: []
      required: false
    - id: 11
      name: expected_attendees
      label: Expected Number of Attendees
      hint: Approximate headcount
      type: number
      options: []
      required: true
    - id: 12
      name: event_type
      label: Event Type
      hint: Type of mixer event
      type: select_one
      options:
      - Networking mixer
      - Industry meetup
      - Happy hour
      - Breakfast networking
      - Lunch and learn
      - After hours event
      - Other
      required: true
    - id: 13
      name: target_audience
      label: Target Audience
      hint: Who is this event for
      type: select_one
      options:
      - General business
      - Specific industry
      - Entrepreneurs
      - Executives
      - Young professionals
      - Women in business
      - Mixed
      required: true
    - id: 14
      name: registration_fee
      label: Registration Fee
      hint: Cost to attend if any
      type: select_one
      options:
      - Free
      - Under $25
      - $25 to $50
      - $50 to $100
      - Over $100
      required: true
    - id: 15
      name: catering_provided
      label: Catering Provided
      hint: Will food be served
      type: select_one
      options:
      - Yes - full meal
      - Yes - appetizers
      - Yes - light refreshments
      - No - cash bar only
      - No - no catering
      required: true
    - id: 16
      name: alcohol_served
      label: Alcohol Service
      hint: Will alcohol be available
      type: select_one
      options:
      - Yes - open bar
      - Yes - cash bar
      - Yes - limited
      - 'False'
      required: true
    - id: 17
      name: av_requirements
      label: AV Requirements
      hint: Audio visual needs
      type: select_multiple
      options:
      - Microphone
      - Projector
      - Screen
      - Speakers
      - Lighting
      - Live streaming
      - None
      required: false
    - id: 18
      name: registration_deadline
      label: Registration Deadline
      hint: Last day to register
      type: date
      options: []
      required: false
    - id: 19
      name: special_requirements
      label: Special Requirements
      hint: Any special needs or accommodations
      type: text
      options: []
      required: false
    - id: 20
      name: marketing_channels
      label: Marketing Channels
      hint: How will you promote this event
      type: select_multiple
      options:
      - Email
      - Social media
      - Website
      - Print flyers
      - Partner organizations
      - Word of mouth
      - Other
      required: false
    - id: 21
      name: additional_notes
      label: Additional Notes
      hint: Any other information for the registration system
      type: text
      options: []
      required: false
