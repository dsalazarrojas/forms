inputSchema:
  type: object
  properties:
    title: Art Fair Closing Reception RSVP Form
    pages:
    - id: 1
      name: section_guest
      label: -- Guest Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: guest_name
      label: Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: guest_email
      label: Email Address
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: guest_phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: event_date
      label: Closing Reception Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: section_rsvp
      label: -- RSVP Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: rsvp_status
      label: RSVP Status
      hint: null
      type: select_one
      options:
      - Yes - I will attend
      - No - I cannot attend
      - Maybe - Still deciding
      required: true
    - id: 8
      name: additional_guests
      label: Number of Additional Guests
      hint: Besides yourself
      type: number
      options: []
      required: true
    - id: 9
      name: guest_names
      label: Names of Additional Guests
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: section_preferences
      label: -- Preferences --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: vip_interest
      label: Interested in VIP Reception
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - Not sure
      required: false
    - id: 13
      name: accessibility_needs
      label: Accessibility or Special Needs
      hint: null
      type: text
      options: []
      required: false
    - id: 14
      name: section_interests
      label: -- Art Fair Interests --
      hint: null
      type: note
      options: []
      required: false
    - id: 15
      name: artist_meet_greet
      label: Interested in Meeting Artists
      hint: null
      type: select_one
      options:
      - 'True'
      - Maybe
      - 'False'
      required: false
    - id: 16
      name: specific_artists
      label: Specific Artists or Galleries of Interest
      hint: null
      type: text
      options: []
      required: false
    - id: 17
      name: section_participation
      label: -- Event Participation --
      hint: null
      type: note
      options: []
      required: false
    - id: 18
      name: participated_before
      label: Have You Participated in Previous Art Fair Events
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      - This is my first time
      required: false
    - id: 19
      name: participant_type
      label: Participant Type
      hint: null
      type: select_one
      options:
      - Artist or exhibitor
      - Collector
      - Enthusiast
      - Student
      - Professional
      - Other
      required: false
    - id: 20
      name: section_communication
      label: -- Communication --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: contact_preference
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Email
      - Phone
      - Text message
      required: true
    - id: 22
      name: newsletter_interest
      label: Subscribe to Art Fair Newsletter
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 23
      name: additional_comments
      label: Additional Comments or Special Requests
      hint: null
      type: text
      options: []
      required: false
