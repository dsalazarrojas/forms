inputSchema:
  type: object
  properties:
    title: Back Number Reservation Form
    pages:
    - id: 1
      name: reservation_header
      label: -- Player Back Number (Jersey) Reservation --
      hint: Secure your number for the upcoming season
      type: note
      options: []
      required: false
    - id: 2
      name: player_full_name
      label: Player Full Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: team_age_group
      label: Team or Age Group
      hint: e.g., U14 Boys, Varsity Girls
      type: text
      options: []
      required: true
    - id: 4
      name: coach_name
      label: Head Coach Name
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: number_choices_header
      label: -- Jersey Number Preferences --
      hint: Selection is based on seniority and date of submission
      type: note
      options: []
      required: false
    - id: 6
      name: first_choice_number
      label: 1st Choice Number
      hint: Preferred number
      type: number
      options: []
      required: true
    - id: 7
      name: second_choice_number
      label: 2nd Choice Number
      hint: Alternative if 1st choice is unavailable
      type: number
      options: []
      required: true
    - id: 8
      name: third_choice_number
      label: 3rd Choice Number
      hint: Alternative if others are taken
      type: number
      options: []
      required: true
    - id: 9
      name: reason_for_number
      label: Significance of choice (Optional)
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: previous_season_number
      label: Number worn last season
      hint: Enter 0 if new player
      type: number
      options: []
      required: false
    - id: 11
      name: jersey_size_selection
      label: Uniform Jersey Size
      hint: null
      type: select_one
      options:
      - Youth Small
      - Youth Medium
      - Youth Large
      - Adult Small
      - Adult Medium
      - Adult Large
      - Adult X-Large
      required: true
    - id: 12
      name: parent_email_reservation
      label: Parent Email for Confirmation
      hint: null
      type: email
      options: []
      required: true
    - id: 13
      name: reservation_terms
      label: I understand that final number assignments are at the club's discretion
      hint: null
      type: select_one
      options:
      - I understand and agree
      - Other
      required: true
    - id: 14
      name: submission_date_res
      label: Submission Date
      hint: null
      type: date
      options: []
      required: true
