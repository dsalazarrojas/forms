inputSchema:
  type: object
  properties:
    title: Music Studio Access Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email
      hint: Enter a valid email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: Enter 10 digits
      type: text
      options: []
      required: true
    - id: 5
      name: music_style
      label: What genre of music do you play?
      hint: null
      type: select_multiple
      options:
      - Jazz
      - Classical
      - Rock
      - Pop
      - Folk
      - Electronic
      required: false
    - id: 6
      name: preferred_time
      label: Preferred Time
      hint: null
      type: time
      options: []
      required: false
    - id: 7
      name: available_days
      label: Available Days
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 8
      name: preferred_days
      label: Preferred Days
      hint: null
      type: select_one
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: false
    - id: 9
      name: studio_time
      label: Studio Time
      hint: null
      type: time
      options: []
      required: true
    - id: 10
      name: instrument
      label: Instrument
      hint: null
      type: text
      options: []
      required: false
    - id: 11
      name: teacher
      label: Teacher
      hint: null
      type: text
      options: []
      required: false
    - id: 12
      name: level
      label: Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      required: false
