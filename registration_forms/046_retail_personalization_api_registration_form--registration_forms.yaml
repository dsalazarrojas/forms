inputSchema:
  type: object
  properties:
    title: Retail Personalization API Registration Form
    pages:
    - id: 1
      name: user_input
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email_input
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: use_case
      label: Use Case
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: company_name
      label: Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: contact_details
      label: Contact Details
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: api_key
      label: API Key
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: company_type
      label: Company Type
      hint: null
      type: select_one
      options:
      - Retail Tech
      - SaaS
      - Other
      required: true
    - id: 10
      name: company_size
      label: Company Size
      hint: null
      type: select_multiple
      options:
      - Small
      - Medium
      - Large
      - Enterprise
      required: true
    - id: 11
      name: industry
      label: Industry
      hint: null
      type: select_one
      options:
      - Fashion
      - Food and Beverage
      - Healthcare
      - Other
      required: true
    - id: 12
      name: location
      label: Location
      hint: null
      type: select_one
      options:
      - North America
      - Europe
      - Asia
      - Africa
      - Other
      required: true
    - id: 13
      name: timezone
      label: Time Zone
      hint: null
      type: time
      options: []
      required: true
    - id: 14
      name: api_requester
      label: API Requester
      hint: null
      type: text
      options: []
      required: true
