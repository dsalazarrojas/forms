inputSchema:
  type: object
  properties:
    title: Athletic Meet Permission Form
    pages:
    - id: 1
      name: athlete_name
      label: Athlete Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY format
      type: date
      options: []
      required: true
    - id: 3
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      required: true
    - id: 4
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: true
    - id: 5
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 5th Grade
      - 6th Grade
      - 7th Grade
      - 8th Grade
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 6
      name: sport
      label: Sport
      hint: Primary sport
      type: select_one
      options:
      - Track and Field
      - Cross Country
      - Swimming
      - Wrestling
      - Other
      required: true
    - id: 7
      name: meet_name
      label: Meet Name
      hint: Name of athletic meet
      type: text
      options: []
      required: true
    - id: 8
      name: meet_date
      label: Meet Date
      hint: Date of meet
      type: date
      options: []
      required: true
    - id: 9
      name: meet_location
      label: Meet Location
      hint: Where is the meet
      type: text
      options: []
      required: true
    - id: 10
      name: departure_time
      label: Departure Time
      hint: When will team depart
      type: time
      options: []
      required: true
    - id: 11
      name: return_time
      label: Expected Return Time
      hint: When will team return
      type: time
      options: []
      required: true
    - id: 12
      name: transportation_method
      label: Transportation Method
      hint: How will athletes travel
      type: select_one
      options:
      - School Bus
      - Team Van
      - Parent Provided
      - Personal Vehicle
      - Public Transportation
      - Other
      required: true
    - id: 13
      name: parent_pickup
      label: Parent Pickup Arrangements
      hint: Will parent pick up at meet location
      type: select_one
      options:
      - No - Return with Team
      - Yes - Pick Up at Meet
      - Yes - Pick Up at School
      required: true
    - id: 14
      name: events_participating
      label: Events Participating In
      hint: List specific events
      type: text
      options: []
      required: true
    - id: 15
      name: meal_arrangements
      label: Meal Arrangements
      hint: How will meals be provided
      type: select_one
      options:
      - Team Provides Meals
      - Pack Lunch
      - Purchase at Venue
      - Parent Provided
      - Other
      required: true
    - id: 16
      name: dietary_restrictions
      label: Dietary Restrictions or Allergies
      hint: List any restrictions or allergies
      type: text
      options: []
      required: true
    - id: 17
      name: medical_conditions
      label: Medical Conditions
      hint: List any conditions staff should know
      type: text
      options: []
      required: true
    - id: 18
      name: current_medications
      label: Current Medications
      hint: List any medications and dosage
      type: text
      options: []
      required: false
    - id: 19
      name: medication_administration
      label: Medication Administration Permission
      hint: Can staff administer medication if needed
      type: select_one
      options:
      - 'Yes'
      - 'No'
      - N/A - No Medications
      required: true
    - id: 20
      name: insurance_provider
      label: Health Insurance Provider
      hint: Name of insurance company
      type: text
      options: []
      required: true
    - id: 21
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Policy or member number
      type: text
      options: []
      required: true
    - id: 22
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 23
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 24
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 25
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name if different from parent
      type: text
      options: []
      required: false
    - id: 26
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: true
    - id: 27
      name: medical_treatment_permission
      label: Medical Treatment Permission
      hint: Permission to seek emergency medical treatment
      type: select_one
      options:
      - Yes - I Grant Permission
      - 'No'
      required: true
    - id: 28
      name: photo_permission
      label: Photo and Video Permission
      hint: Permission for photos and videos at meet
      type: select_one
      options:
      - Yes - Allowed
      - No - Not Allowed
      required: true
    - id: 29
      name: code_of_conduct_agreement
      label: Code of Conduct Agreement
      hint: Athlete agrees to follow code of conduct
      type: select_one
      options:
      - Yes - I Agree
      - 'No'
      required: true
    - id: 30
      name: parent_guardian_signature
      label: Parent or Guardian Signature
      hint: Type full name as signature
      type: text
      options: []
      required: true
    - id: 31
      name: signature_date
      label: Signature Date
      hint: Date of signature
      type: date
      options: []
      required: true
