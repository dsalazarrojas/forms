inputSchema:
  type: object
  properties:
    title: IT Certification Exam Registration Form
    pages:
    - id: 1
      name: first_name
      label: first name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: last_name
      label: last name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: email
      hint: Enter valid email
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: phone
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: exam_date
      label: exam date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: exam_time
      label: exam time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: course
      label: course name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: organization
      label: organization
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: payment_method
      label: payment method
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 10
      name: payment_amount
      label: payment amount
      hint: null
      type: number
      options: []
      required: true
    - id: 11
      name: payment_status
      label: payment status
      hint: null
      type: select_one
      options:
      - Active
      - Inactive
      required: true
    - id: 12
      name: status
      label: status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      required: true
    - id: 13
      name: comments
      label: comments
      hint: null
      type: note
      options: []
      required: false
    - id: 14
      name: submit
      label: submit
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
