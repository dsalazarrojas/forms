      name: comments
      label: Comments
      hint: null
      type: text
      options: []
      required: false
    - id: 13
      name: registration_date
      label: Registration Date
      hint: YYYY-MM-DD
      type: date
      options: []
      required: false
    - id: 14
      name: registration_time
      label: Registration Time
      hint: null
      type: time
      options: []
      required: false
    - id: 15
      name: submitter
      label: Submitted By
      hint: null
      type: text
      options: []
      required: false
    - id: 16
      name: submitter_email
      label: Submitted By E-Mail
      hint: null
      type: email
      options: []
      required: false
