      type: select_one
      options:
      - Option 1
      - Option 2
      required: false
    - id: 5
      name: contact_email
      label: contact email
      hint: null
      type: email
      options: []
      required: false
    - id: 6
      name: participant_phone
      label: participant phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: registration_date
      label: registration date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: executive_roundtable_booking_form_notes
      label: executive roundtable booking form notes
      hint: null
      type: note
      options: []
      required: false
    - id: 9
      name: participant_additional_info
      label: participant additional info
      hint: null
      type: text
      options: []
      required: false
