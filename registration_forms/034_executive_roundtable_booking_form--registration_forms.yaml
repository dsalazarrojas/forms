      name: executive_roundtable_event
      label: event
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: executive_roundtable_event_id
      label: event id
      hint: null
      type: number
      options: []
      required: false
