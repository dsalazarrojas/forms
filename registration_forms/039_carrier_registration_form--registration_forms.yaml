inputSchema:
  type: object
  properties:
    title: Carrier Registration Form
    pages:
    - id: 1
      name: section_registration_overview
      label: -- Registration Overview --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: registration_type
      label: Registration Type
      hint: select the purpose of this form
      type: select_one
      options:
      - New Carrier
      - Updated Profile
      - Reactivation
      required: true
    - id: 3
      name: company_name
      label: Carrier Company Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: dot_number
      label: DOT Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: mc_number
      label: MC Number
      hint: null
      type: text
      options: []
      required: true
    - id: 6
      name: section_office_contact
      label: -- Primary Office Contact --
      hint: null
      type: note
      options: []
      required: false
    - id: 7
      name: office_contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: office_email
      label: Contact Email
      hint: for all registration correspondence
      type: email
      options: []
      required: true
    - id: 9
      name: office_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: section_coverage
      label: -- Operational Coverage --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: states_of_authority
      label: States of Authority
      hint: list all states where your company is authorized
      type: text
      options: []
      required: true
    - id: 12
      name: intra_state_authority
      label: Do you have Intrastate authority?
      hint: for operations within a single state
      type: select_one
      options:
      - 'True'
      - 'False'
      - N/A
      required: true
    - id: 13
      name: equipment_offered
      label: Equipment for Hire
      hint: select all that apply
      type: select_multiple
      options:
      - Dry Van
      - Flatbed
      - Reefer
      - Step Deck
      - Hopper
      - Tanker
      required: true
    - id: 14
      name: hazmat_capable
      label: Are you capable of hauling Hazmat?
      hint: hazardous materials authority
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: section_safety_insurance
      label: -- Safety and Insurance Verification --
      hint: null
      type: note
      options: []
      required: false
    - id: 16
      name: safety_rating_ack
      label: Carrier confirms a Satisfactory safety rating
      hint: based on latest FMCSA data
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 17
      name: insurance_carrier_name
      label: Insurance Carrier Name
      hint: name of the insurance company
      type: text
      options: []
      required: true
    - id: 18
      name: insurance_policy_number
      label: Policy Number
      hint: primary auto liability policy
      type: text
      options: []
      required: true
    - id: 19
      name: section_banking
      label: -- Banking and Payments --
      hint: null
      type: note
      options: []
      required: false
    - id: 20
      name: payment_preference
      label: Payment Preference
      hint: select how you want to be paid
      type: select_one
      options:
      - ACH
      - Check
      - QuickPay
      - Factor
      required: true
    - id: 21
      name: bank_routing_number
      label: Bank Routing Number
      hint: 9 digit code
      type: text
      options: []
      required: false
    - id: 22
      name: bank_account_number
      label: Bank Account Number
      hint: null
      type: text
      options: []
      required: false
    - id: 23
      name: section_final_sub
      label: -- Final Registration Submission --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: registration_date
      label: Date of Registration
      hint: today's date
      type: date
      options: []
      required: true
    - id: 25
      name: authorized_digital_signature
      label: Authorized Digital Signature
      hint: Type name as digital signature
      type: text
      options: []
      required: true
