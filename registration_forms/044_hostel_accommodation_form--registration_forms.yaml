inputSchema:
  type: object
  properties:
    title: Hostel Accommodation Form
    pages:
    - id: 1
      name: user_info
      label: user_info
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: contact_method
      label: contact_method
      hint: null
      type: select_multiple
      options:
      - email
      - phone
      - other
      required: false
    - id: 3
      name: accommodation_choice
      label: accommodation_choice
      hint: null
      type: select_one
      options:
      - single
      - double
      - triple
      required: true
    - id: 4
      name: checkin_date
      label: checkin_date
      hint: null
      type: date
      options: []
      required: false
    - id: 5
      name: checkout_date
      label: checkout_date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: accommodation_preferences
      label: accommodation_preferences
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: payment_method
      label: payment_method
      hint: null
      type: select_one
      options:
      - credit card
      - bank transfer
      required: false
    - id: 8
      name: note
      label: note
      hint: null
      type: note
      options: []
      required: false
