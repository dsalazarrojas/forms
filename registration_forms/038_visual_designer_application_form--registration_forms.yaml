inputSchema:
  type: object
  properties:
    title: Visual Designer Application Form
    pages:
    - id: 1
      name: username
      label: Username
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 3
      name: password
      label: Password
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: portfolio
      label: Portfolio
      hint: null
      type: select_one
      options:
      - 'False'
      - '1'
      required: true
    - id: 5
      name: skills
      label: Skills
      hint: null
      type: select_multiple
      options:
      - frontend
      - backend
      - ui/ux
      required: false
    - id: 6
      name: experience
      label: Experience
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: resume
      label: Resume
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: portfolio_link
      label: Portfolio Link
      hint: null
      type: text
      options: []
      required: false
