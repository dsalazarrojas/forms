inputSchema:
  type: object
  properties:
    title: Economy Accommodation Request Form
    pages:
    - id: 1
      name: check_in_dates
      label: Check In Dates
      hint: null
      type: date
      options: []
      required: false
    - id: 2
      name: special_requests
      label: Special Requests
      hint: null
      type: select_multiple
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 3
      name: accommodation_type
      label: Accommodation Type
      hint: null
      type: select_one
      options:
      - Hotel
      - Hostel
      - Airbnb
      - Motel
      required: false
    - id: 4
      name: number_of_guests
      label: Number of Guests
      hint: null
      type: number
      options: []
      required: false
