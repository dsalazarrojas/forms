inputSchema:
  type: object
  properties:
    title: Open House Attendance Form
    pages:
    - id: 1
      name: event_details
      label: Event Details
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_info
      label: Contact Info
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: event_attendance
      label: Event Attendance
      hint: null
      type: number
      options: []
      required: true
    - id: 4
      name: event_type
      label: Event Type
      hint: null
      type: select_one
      options:
      - Open House
      - Tour
      - Meeting
      required: false
    - id: 5
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 6
      name: event_time
      label: Event Time
      hint: null
      type: time
      options: []
      required: true
    - id: 7
      name: notes
      label: Notes and Comments
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: form_submitter
      label: Form Submitter
      hint: null
      type: select_multiple
      options:
      - Visitor
      - Staff
      - Guest
      required: false
    - id: 9
      name: location
      label: Event Location
      hint: null
      type: text
      options: []
      required: false
    - id: 10
      name: organizer_info
      label: Event Organizer's Information
      hint: null
      type: text
      options: []
      required: false
