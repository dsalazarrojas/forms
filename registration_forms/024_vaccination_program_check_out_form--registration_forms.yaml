inputSchema:
  type: object
  properties:
    title: Vaccination Program Check Out Form
    pages:
    - id: 1
      name: patient_name
      label: Patient Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: contact_information
      label: Contact Information
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: medical_history
      label: Medical History
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: vaccination_details
      label: Vaccination Details
      hint: null
      type: select_one
      options:
      - Flu
      - COVID-19
      - MMR
      required: false
    - id: 5
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - phone
      - email
      - sms
      required: false
    - id: 6
      name: preferred_language
      label: Preferred Language
      hint: null
      type: select_one
      options:
      - English
      - Spanish
      - French
      required: false
    - id: 7
      name: appointment_date
      label: Appointment Date
      hint: null
      type: date
      options: []
      required: false
    - id: 8
      name: appointment_time
      label: Appointment Time
      hint: null
      type: time
      options: []
      required: false
    - id: 9
      name: follow_up_location
      label: Follow Up Location
      hint: null
      type: select_one
      options:
      - Clinic A
      - Clinic B
      - Clinic C
      required: false
    - id: 10
      name: follow_up_status
      label: Follow Up Status
      hint: null
      type: select_one
      options:
      - Scheduled
      - Rescheduled
      - Completed
      required: false
    - id: 11
      name: vaccination_completed
      label: Vaccination Completed
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
    - id: 12
      name: follow_up_required
      label: Follow Up Required
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: false
