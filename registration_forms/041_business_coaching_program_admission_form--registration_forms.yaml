inputSchema:
  type: object
  properties:
    title: Business Coaching Program Admission Form
    pages:
    - id: 1
      name: applicant_info
      label: Applicant Information
      hint: Your details
      type: note
      options: []
      required: false
    - id: 2
      name: full_name
      label: Full Name
      hint: Your full name
      type: text
      options: []
      required: true
    - id: 3
      name: email
      label: Email Address
      hint: Your email address
      type: email
      options: []
      required: true
    - id: 4
      name: phone
      label: Phone Number
      hint: Your contact number
      type: text
      options: []
      required: true
    - id: 5
      name: company_name
      label: Company Name
      hint: Name of your business
      type: text
      options: []
      required: true
    - id: 6
      name: position
      label: Your Position
      hint: Your title or role
      type: text
      options: []
      required: true
    - id: 7
      name: business_info
      label: Business Information
      hint: About your business
      type: note
      options: []
      required: false
    - id: 8
      name: industry
      label: Industry
      hint: Your industry sector
      type: select_one
      options:
      - Technology
      - Healthcare
      - Finance
      - Manufacturing
      - Retail
      - Professional Services
      - Education
      - Other
      required: true
    - id: 9
      name: years_in_business
      label: Years in Business
      hint: How long operating
      type: select_one
      options:
      - Less than 1 year
      - 1-3 years
      - 3-5 years
      - 5-10 years
      - More than 10 years
      required: true
    - id: 10
      name: number_of_employees
      label: Number of Employees
      hint: Current team size
      type: select_one
      options:
      - Solo
      - 2-5 employees
      - 6-10 employees
      - 11-20 employees
      - 21-50 employees
      - More than 50 employees
      required: true
    - id: 11
      name: annual_revenue
      label: Annual Revenue
      hint: Approximate revenue
      type: select_one
      options:
      - Under $100K
      - $100K-$500K
      - $500K-$1M
      - $1M-$5M
      - $5M-$10M
      - More than $10M
      required: true
    - id: 12
      name: program_info
      label: Program Information
      hint: About the coaching program
      type: note
      options: []
      required: false
    - id: 13
      name: program_interest
      label: Program of Interest
      hint: Which program do you want
      type: select_one
      options:
      - Executive Coaching
      - Leadership Development
      - Business Growth
      - Startup Accelerator
      - Team Coaching
      - Strategic Planning
      required: true
    - id: 14
      name: start_date_preference
      label: Preferred Start Date
      hint: When do you want to begin
      type: select_one
      options:
      - Immediately
      - Within 1 Month
      - Within 3 Months
      - Next Cohort
      - Flexible
      required: true
    - id: 15
      name: application_essay
      label: Application Essay
      hint: Tell us about yourself
      type: note
      options: []
      required: false
    - id: 16
      name: why_apply
      label: Why Do You Want to Join
      hint: Explain your motivation
      type: text
      options: []
      required: true
    - id: 17
      name: biggest_challenge
      label: What Is Your Biggest Challenge
      hint: Describe your main business challenge
      type: text
      options: []
      required: true
    - id: 18
      name: expected_outcomes
      label: What Outcomes Do You Expect
      hint: What do you hope to achieve
      type: text
      options: []
      required: true
    - id: 19
      name: time_commitment
      label: Can You Commit Time Required
      hint: Are you available for the program
      type: select_one
      options:
      - Yes - Fully Committed
      - Yes - With Some Constraints
      - Maybe
      - 'False'
      required: true
    - id: 20
      name: previous_coaching
      label: Have You Had Coaching Before
      hint: Previous coaching experience
      type: select_one
      options:
      - Yes - Positive Experience
      - Yes - Mixed Experience
      - Yes - Negative Experience
      - No - First Time
      required: true
    - id: 21
      name: referral_source
      label: How Did You Hear About Us
      hint: Source of referral
      type: select_one
      options:
      - Website
      - Referral
      - Social Media
      - Conference or Event
      - Advertisement
      - Other
      required: true
    - id: 22
      name: investment_readiness
      label: Investment Readiness
      hint: Are you ready to invest
      type: select_one
      options:
      - Yes - Budget Approved
      - Yes - Can Approve
      - Need More Information
      - Exploring Options
      required: true
    - id: 23
      name: additional_comments
      label: Additional Comments
      hint: Any other information
      type: text
      options: []
      required: false
