inputSchema:
  type: object
  properties:
    title: RSO Online Training Registration Form
    pages:
    - id: 1
      name: rso_session
      label: Select RSO Session
      hint: null
      type: select_one
      options:
      - RSO 1
      - RSO 2
      - RSO 3
      required: true
    - id: 2
      name: rso_date
      label: Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: participant_name
      label: Participant Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: participant_email
      label: Participant Email
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: department
      label: Department
      hint: null
      type: select_multiple
      options:
      - Accounting
      - Engineering
      - Operations
      required: true
    - id: 7
      name: rso_officer
      label: RSO Officer Name
      hint: null
      type: select_one
      options:
      - Officer 1
      - Officer 2
      - Officer 3
      required: true
    - id: 8
      name: rso_training_date
      label: RSO Training Date
      hint: null
      type: date
      options: []
      required: false
