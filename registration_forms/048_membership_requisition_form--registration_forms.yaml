inputSchema:
  type: object
  properties:
    title: membership_requisition_form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: member_since
      label: Member Since
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: role
      label: Role
      hint: null
      type: select_one
      options:
      - Member
      - Leader
      - Officer
      required: true
    - id: 7
      name: committee
      label: Committee
      hint: null
      type: select_multiple
      options:
      - Committee A
      - Committee B
      - Committee C
      required: false
    - id: 8
      name: membership_type
      label: Membership Type
      hint: null
      type: select_one
      options:
      - Monthly
      - Monthly Recurring
      - Quarterly
      - Annually
      required: false
    - id: 9
      name: payment_terms
      label: Payment Terms
      hint: null
      type: number
      options: []
      required: false
    - id: 10
      name: frequency_of_meetings
      label: Frequency of Meetings
      hint: null
      type: select_one
      options:
      - Monthly
      - Bi-Monthly
      - Quarterly
      - Annually
      required: false
    - id: 11
      name: membership_status
      label: Membership Status
      hint: null
      type: select_multiple
      options:
      - Active
      - Inactive
      - Pending
      required: false
    - id: 12
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
