inputSchema:
  type: object
  properties:
    title: Sustainable Supply Chain Webinar Registration
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: First name of the attendee
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: Last name of the attendee
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: company
      label: Company
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: role
      label: Role
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: topic_interest_1
      label: Supply Chain Management
      hint: null
      type: select_one
      options:
      - Supply Chain Management
      - Circular Economy
      - Sustainable Production
      - Supply Chain Transparency
      - Supply Chain Finance
      required: true
    - id: 7
      name: topic_interest_2
      label: Sustainable Business Models
      hint: null
      type: select_multiple
      options:
      - Supply Chain Transparency
      - Supply Chain Finance
      - Sustainable Production
      required: true
    - id: 8
      name: consent
      label: Consent
      hint: Check to receive updates
      type: note
      options: []
      required: false
    - id: 9
      name: terms_of_service
      label: Terms of Service
      hint: Accept terms of service
      type: select_one
      options:
      - Accept
      - Decline
      required: true
