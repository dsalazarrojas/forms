inputSchema:
  type: object
  properties:
    title: Workforce Scheduling Training Registration Form
    pages:
    - id: 1
      name: employee_name
      label: Employee Name
      hint: null
      type: text
      options: []
      required: true
    - id: 2
      name: training_date
      label: Training Date
      hint: null
      type: date
      options: []
      required: true
    - id: 3
      name: training_time
      label: Training Time
      hint: null
      type: time
      options: []
      required: false
    - id: 4
      name: department
      label: Department
      hint: null
      type: select_one
      options:
      - '{''id'': 1, ''label'': ''Sales''}'
      - '{''id'': 2, ''label'': ''Marketing''}'
      - '{''id'': 3, ''label'': ''Support''}'
      required: true
    - id: 5
      name: location
      label: Location
      hint: null
      type: select_multiple
      options:
      - '{''id'': 1, ''label'': ''New York''}'
      - '{''id'': 2, ''label'': ''Chicago''}'
      - '{''id'': 3, ''label'': ''London''}'
      required: true
    - id: 6
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 8
      name: comments
      label: Comments
      hint: null
      type: note
      options: []
      required: false
