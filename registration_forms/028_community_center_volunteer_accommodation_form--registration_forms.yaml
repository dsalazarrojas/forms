inputSchema:
  type: object
  properties:
    title: Community Center Volunteer Accommodation Form
    pages:
    - id: 1
      name: section_volunteer_accommodation_info
      label: -- Volunteer Details --
      hint: Please fill out all required fields to request accommodations.
      type: note
      options: []
      required: false
    - id: 2
      name: volunteer_full_name_acc
      label: Full Name of Volunteer
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: volunteer_email_acc
      label: Email Address
      hint: For follow-up and accommodation status
      type: email
      options: []
      required: true
    - id: 4
      name: volunteer_phone_acc
      label: Primary Contact Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 5
      name: volunteer_id_number_acc
      label: Volunteer ID (If assigned)
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: section_accommodation_needs_acc
      label: -- Accommodation Needs --
      hint: Select the accommodation(s) you are requesting.
      type: note
      options: []
      required: false
    - id: 7
      name: accommodation_category_acc
      label: Category of Accommodation
      hint: Select the most relevant category
      type: select_one
      options:
      - Mobility/Physical Access
      - Visual/Hearing Assistance
      - Learning/Cognitive Support
      - Dietary/Allergy Related
      - Other
      required: true
    - id: 8
      name: detailed_accommodation_description_acc
      label: Detailed Description of the Accommodation Requested
      hint: What do you need help with?
      type: text
      options: []
      required: true
    - id: 9
      name: urgency_level_accommodation_acc
      label: Urgency Level
      hint: Please select the impact of this request
      type: select_one
      options:
      - High (Immediate attention required)
      - Medium (Within 24-48 hours)
      - Low (Non-urgent/Routine)
      required: true
    - id: 10
      name: specific_event_assignment_acc
      label: Which event or program is this accommodation for
      hint: e.g., Senior Social, Youth Sports, Arts and Culture
      type: text
      options: []
      required: true
    - id: 11
      name: section_accessibility_info_acc
      label: -- Accessibility and Requirements --
      hint: null
      type: note
      options: []
      required: false
    - id: 12
      name: physical_mobility_requirements_acc
      label: Do you have any physical mobility requirements
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 13
      name: visual_hearing_assistance_needed_acc
      label: Do you need visual or hearing assistance
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 14
      name: learning_cognitive_support_needed_acc
      label: Do you need learning or cognitive support
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 15
      name: dietary_allergy_restrictions_acc
      label: Do you have any dietary or allergy restrictions
      hint: null
      type: select_one
      options:
      - 'True'
      - 'False'
      required: true
    - id: 16
      name: section_final_submission_acc
      label: -- Final Submission and Acknowledgment --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: accommodation_acknowledgment_acc
      label: I understand that my request will be reviewed and I will be contacted
      hint: null
      type: select_one
      options:
      - I understand
      - Other
      required: true
    - id: 18
      name: submission_date_final_acc
      label: Date of Submission
      hint: null
      type: date
      options: []
      required: true
    - id: 19
      name: volunteer_signature_digital_acc
      label: Digital Signature
      hint: Type full name
      type: text
      options: []
      required: true
    - id: 20
      name: additional_comments_final_acc
      label: Any Additional Comments or Requests
      hint: null
      type: text
      options: []
      required: false
