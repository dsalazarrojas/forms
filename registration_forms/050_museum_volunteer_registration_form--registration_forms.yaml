inputSchema:
  type: object
  properties:
    title: Museum Volunteer Registration Form
    pages:
    - id: 1
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: false
    - id: 3
      name: email
      label: Email
      hint: null
      type: email
      options: []
      required: false
    - id: 4
      name: phone
      label: Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 5
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: date_of_service
      label: Date of Service
      hint: null
      type: date
      options: []
      required: false
    - id: 7
      name: volunteer_area_of_interest
      label: Volunteer Area of Interest
      hint: null
      type: select_one
      options:
      - Volunteer for Events
      - Volunteer for Education
      - Volunteer for Events and Education
      required: false
    - id: 8
      name: volunteer_availability
      label: Volunteer Availability
      hint: null
      type: select_multiple
      options:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
      required: true
    - id: 9
      name: preferred_contact_method
      label: Preferred Contact Method
      hint: null
      type: select_one
      options:
      - Phone
      - Email
      - Text Message
      required: false
