inputSchema:
  type: object
  properties:
    title: Community Sports Event Registration Form
    pages:
    - id: 1
      name: participant_info
      label: Participant Information
      hint: Your personal details
      type: note
      options: []
      required: false
    - id: 2
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 3
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 4
      name: date_of_birth
      label: Date of Birth
      hint: null
      type: date
      options: []
      required: true
    - id: 5
      name: gender
      label: Gender
      hint: null
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      required: false
    - id: 6
      name: email
      label: Email Address
      hint: For event updates
      type: email
      options: []
      required: true
    - id: 7
      name: phone
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: address
      label: Street Address
      hint: null
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: null
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: ZIP Code
      hint: null
      type: text
      options: []
      required: true
    - id: 12
      name: emergency_contact
      label: Emergency Contact Name and Phone
      hint: null
      type: text
      options: []
      required: true
    - id: 13
      name: event_info
      label: Event Information
      hint: Select your event
      type: note
      options: []
      required: false
    - id: 14
      name: event_name
      label: Sports Event
      hint: null
      type: select_one
      options:
      - 5K Fun Run
      - Basketball Tournament
      - Soccer Match
      - Volleyball Tournament
      - Tennis Competition
      - Swimming Meet
      - Track and Field
      - Baseball Game
      - Softball Game
      - Other
      required: true
    - id: 15
      name: event_date
      label: Event Date
      hint: null
      type: date
      options: []
      required: true
    - id: 16
      name: division
      label: Division or Age Group
      hint: null
      type: select_one
      options:
      - Youth (Under 12)
      - Junior (13-17)
      - Adult (18-39)
      - Masters (40+)
      - Open Division
      required: true
    - id: 17
      name: team_info
      label: Team Information
      hint: Are you on a team
      type: select_one
      options:
      - Yes - Registered Team
      - Yes - Forming Team
      - No - Individual Participant
      - No - Need Team Placement
      required: true
    - id: 18
      name: team_name
      label: Team Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 19
      name: team_captain
      label: Team Captain Name
      hint: If applicable
      type: text
      options: []
      required: false
    - id: 20
      name: experience
      label: Sports Experience Level
      hint: null
      type: select_one
      options:
      - Beginner
      - Intermediate
      - Advanced
      - Competitive
      - Professional
      required: true
    - id: 21
      name: medical_info
      label: Medical Information
      hint: For safety
      type: note
      options: []
      required: false
    - id: 22
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: We should know about
      type: text
      options: []
      required: false
    - id: 23
      name: medications
      label: Current Medications
      hint: If relevant
      type: text
      options: []
      required: false
    - id: 24
      name: insurance_provider
      label: Health Insurance Provider
      hint: null
      type: text
      options: []
      required: false
    - id: 25
      name: waiver_section
      label: Waiver and Release
      hint: Important legal information
      type: note
      options: []
      required: false
    - id: 26
      name: risk_acknowledgment
      label: I Understand There Are Risks
      hint: null
      type: select_one
      options:
      - Yes - I Understand
      - No - I Do Not Understand
      required: true
    - id: 27
      name: liability_release
      label: I Release the Organization from Liability
      hint: null
      type: select_one
      options:
      - Yes - I Agree
      - No - I Do Not Agree
      required: true
    - id: 28
      name: medical_consent
      label: I Consent to Emergency Medical Treatment
      hint: If needed
      type: select_one
      options:
      - Yes - I Consent
      - No - I Do Not Consent
      required: true
    - id: 29
      name: photo_consent
      label: Photo and Video Consent
      hint: null
      type: select_one
      options:
      - Yes - I Consent
      - No - I Do Not Consent
      required: true
    - id: 30
      name: rules_agreement
      label: I Agree to Follow All Rules
      hint: Sportsmanship and conduct
      type: select_one
      options:
      - Yes - I Agree
      - No - I Do Not Agree
      required: true
    - id: 31
      name: tshirt_size
      label: T-Shirt Size
      hint: For event shirt
      type: select_one
      options:
      - XS
      - S
      - M
      - L
      - XL
      - XXL
      - XXXL
      required: false
    - id: 32
      name: volunteer_interest
      label: Would You Like to Volunteer
      hint: Help with the event
      type: select_one
      options:
      - 'True'
      - 'False'
      - Maybe
      required: false
    - id: 33
      name: additional_comments
      label: Additional Comments
      hint: Anything else
      type: text
      options: []
      required: false
    - id: 34
      name: participant_signature
      label: Participant Signature
      hint: Type your full name
      type: text
      options: []
      required: true
    - id: 35
      name: signature_date
      label: Date
      hint: null
      type: date
      options: []
      required: true
