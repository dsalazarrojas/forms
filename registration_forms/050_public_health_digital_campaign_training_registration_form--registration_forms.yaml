      - '{''value'': datetime.date(2023, 2, 8), ''label'': ''01/08/2023''}'
      - '{''value'': datetime.date(2023, 2, 15), ''label'': ''01/15/2023''}'
      required: false
    - id: 4
      name: additional_info
      label: Additional Info
      hint: null
      type: note
      options: []
      required: false
