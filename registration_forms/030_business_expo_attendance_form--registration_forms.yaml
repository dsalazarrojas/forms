inputSchema:
  type: object
  properties:
    title: Business Expo Attendance Form
    pages:
    - id: 1
      name: expo_section
      label: -- Expo Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: expo_name
      label: Expo Name
      hint: Name of the business expo
      type: text
      options: []
      required: true
    - id: 3
      name: expo_date
      label: Expo Date
      hint: When is the expo being held?
      type: date
      options: []
      required: true
    - id: 4
      name: expo_location
      label: Expo Location
      hint: Where is the expo?
      type: text
      options: []
      required: true
    - id: 5
      name: attendee_section
      label: -- Attendee Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 6
      name: first_name
      label: First Name
      hint: null
      type: text
      options: []
      required: true
    - id: 7
      name: last_name
      label: Last Name
      hint: null
      type: text
      options: []
      required: true
    - id: 8
      name: email_address
      label: Email Address
      hint: For expo updates and follow-up
      type: email
      options: []
      required: true
    - id: 9
      name: phone_number
      label: Phone Number
      hint: null
      type: text
      options: []
      required: true
    - id: 10
      name: company_section
      label: -- Company Information --
      hint: null
      type: note
      options: []
      required: false
    - id: 11
      name: company_name
      label: Company Name
      hint: Your business or organization
      type: text
      options: []
      required: true
    - id: 12
      name: company_website
      label: Company Website
      hint: Your business website
      type: text
      options: []
      required: false
    - id: 13
      name: job_title
      label: Job Title
      hint: Your position
      type: text
      options: []
      required: true
    - id: 14
      name: industry
      label: Industry
      hint: Select your industry
      type: select_one
      options:
      - Technology
      - Finance
      - Healthcare
      - Retail
      - Manufacturing
      - Services
      - Education
      - Government
      - Non-Profit
      - Other
      required: false
    - id: 15
      name: company_size
      label: Company Size
      hint: Number of employees
      type: select_one
      options:
      - 1-10
      - 11-50
      - 51-200
      - 201-500
      - 500+
      required: false
    - id: 16
      name: attendance_section
      label: -- Attendance Details --
      hint: null
      type: note
      options: []
      required: false
    - id: 17
      name: attendance_type
      label: Attendance Type
      hint: Are you attending as a vendor or attendee?
      type: select_one
      options:
      - Visitor/Attendee
      - Exhibitor/Vendor
      - Sponsor
      - Speaker
      - Media
      required: true
    - id: 18
      name: attending_days
      label: Days Attending
      hint: Which days will you attend?
      type: select_multiple
      options:
      - Day 1
      - Day 2
      - Day 3
      - All Days
      required: true
    - id: 19
      name: special_status
      label: Any special status or requirements?
      hint: VIP, press, etc.
      type: text
      options: []
      required: false
    - id: 20
      name: interests_section
      label: -- Interests and Goals --
      hint: null
      type: note
      options: []
      required: false
    - id: 21
      name: primary_interest
      label: Primary Interest at Expo
      hint: What are you most interested in?
      type: text
      options: []
      required: true
    - id: 22
      name: business_goals
      label: Business Goals
      hint: What do you want to achieve?
      type: select_multiple
      options:
      - Network and Build Relationships
      - Learn About New Products
      - Find Vendors or Partners
      - Showcase Products
      - Scout Competitors
      - General Exploration
      required: false
    - id: 23
      name: logistics_section
      label: -- Logistics --
      hint: null
      type: note
      options: []
      required: false
    - id: 24
      name: dietary_restrictions
      label: Dietary Restrictions
      hint: For catering purposes
      type: select_one
      options:
      - None
      - Vegetarian
      - Vegan
      - Gluten-Free
      - Other
      required: false
    - id: 25
      name: additional_info
      label: Additional Information
      hint: Anything else we should know?
      type: text
      options: []
      required: false
