inputSchema:
  type: object
  properties:
    title: Sustainability Audit Registration Form
    pages:
    - id: 1
      name: audit_request
      label: Audit Request
      hint: null
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: false
    - id: 2
      name: audit_date
      label: Audit Date
      hint: null
      type: date
      options: []
      required: false
    - id: 3
      name: contact_name
      label: Contact Name
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: contact_email
      label: Contact E-mail
      hint: null
      type: email
      options: []
      required: false
    - id: 5
      name: preferred_date
      label: Preferred Date
      hint: null
      type: date
      options: []
      required: false
    - id: 6
      name: contact_phone
      label: Contact Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 7
      name: note
      label: Note
      hint: null
      type: note
      options: []
      required: false
    - id: 8
      name: assigned_tool
      label: Assigned Tool
      hint: null
      type: select_one
      options:
      - chatjimmy
      - another tool
      required: false
