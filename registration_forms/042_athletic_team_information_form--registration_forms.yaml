inputSchema:
  type: object
  properties:
    title: Athletic Team Information Form
    pages:
    - id: 1
      name: athlete_name
      label: Athlete Full Name
      hint: First and last name
      type: text
      options: []
      required: true
    - id: 2
      name: preferred_name
      label: Preferred Name
      hint: What should we call you
      type: text
      options: []
      required: false
    - id: 3
      name: date_of_birth
      label: Date of Birth
      hint: MM-DD-YYYY format
      type: date
      options: []
      required: true
    - id: 4
      name: gender
      label: Gender
      hint: Select gender
      type: select_one
      options:
      - Male
      - Female
      - Non-Binary
      - Prefer Not to Say
      required: true
    - id: 5
      name: athlete_id
      label: Athlete ID Number
      hint: Student or team identification number
      type: text
      options: []
      required: false
    - id: 6
      name: school_name
      label: School Name
      hint: Name of school
      type: text
      options: []
      required: true
    - id: 7
      name: grade_level
      label: Grade Level
      hint: Current grade
      type: select_one
      options:
      - 9th Grade
      - 10th Grade
      - 11th Grade
      - 12th Grade
      required: true
    - id: 8
      name: address
      label: Street Address
      hint: Home address
      type: text
      options: []
      required: true
    - id: 9
      name: city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 10
      name: state
      label: State
      hint: State or province
      type: text
      options: []
      required: true
    - id: 11
      name: zip_code
      label: ZIP Code
      hint: ZIP or postal code
      type: text
      options: []
      required: true
    - id: 12
      name: phone
      label: Athlete Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: false
    - id: 13
      name: email
      label: Athlete Email
      hint: Contact email
      type: email
      options: []
      required: false
    - id: 14
      name: parent_guardian_name
      label: Parent or Guardian Name
      hint: Full name
      type: text
      options: []
      required: true
    - id: 15
      name: parent_guardian_phone
      label: Parent or Guardian Phone
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 16
      name: parent_guardian_email
      label: Parent or Guardian Email
      hint: Contact email
      type: email
      options: []
      required: true
    - id: 17
      name: emergency_contact_name
      label: Emergency Contact Name
      hint: Name of emergency contact
      type: text
      options: []
      required: true
    - id: 18
      name: emergency_contact_phone
      label: Emergency Contact Phone
      hint: Emergency contact number
      type: text
      options: []
      required: true
    - id: 19
      name: emergency_contact_relationship
      label: Emergency Contact Relationship
      hint: Relationship to athlete
      type: text
      options: []
      required: true
    - id: 20
      name: sport
      label: Sport
      hint: Primary sport
      type: select_one
      options:
      - Football
      - Basketball
      - Soccer
      - Track and Field
      - Swimming
      - Volleyball
      - Baseball
      - Softball
      - Tennis
      - Wrestling
      - Cross Country
      - Golf
      - Cheerleading
      - Other
      required: true
    - id: 21
      name: team_level
      label: Team Level
      hint: Competition level
      type: select_one
      options:
      - Varsity
      - Junior Varsity
      - Freshman
      - Club Team
      required: true
    - id: 22
      name: position
      label: Primary Position
      hint: Main position played
      type: text
      options: []
      required: true
    - id: 23
      name: jersey_number
      label: Jersey Number
      hint: Assigned number
      type: number
      options: []
      required: false
    - id: 24
      name: years_experience
      label: Years of Experience
      hint: How long have you played
      type: number
      options: []
      required: true
    - id: 25
      name: height
      label: Height
      hint: In feet and inches or cm
      type: text
      options: []
      required: true
    - id: 26
      name: weight
      label: Weight
      hint: In pounds or kg
      type: number
      options: []
      required: true
    - id: 27
      name: medical_conditions
      label: Medical Conditions or Allergies
      hint: List any conditions or allergies
      type: text
      options: []
      required: true
    - id: 28
      name: current_medications
      label: Current Medications
      hint: List any medications
      type: text
      options: []
      required: false
    - id: 29
      name: previous_injuries
      label: Previous Sports Injuries
      hint: List any significant injuries
      type: text
      options: []
      required: true
    - id: 30
      name: insurance_provider
      label: Health Insurance Provider
      hint: Name of insurance company
      type: text
      options: []
      required: true
    - id: 31
      name: insurance_policy_number
      label: Insurance Policy Number
      hint: Policy or member number
      type: text
      options: []
      required: true
    - id: 32
      name: physician_name
      label: Primary Physician Name
      hint: Name of regular doctor
      type: text
      options: []
      required: true
    - id: 33
      name: physician_phone
      label: Primary Physician Phone
      hint: Doctor contact number
      type: text
      options: []
      required: true
    - id: 34
      name: transportation_plan
      label: Transportation Plan
      hint: How will athlete get to practices and games
      type: select_one
      options:
      - Parent or Guardian
      - School Bus
      - Personal Vehicle
      - Carpool
      - Other
      required: true
    - id: 35
      name: t_shirt_size
      label: T-Shirt Size
      hint: For team apparel
      type: select_one
      options:
      - Youth Small
      - Youth Medium
      - Youth Large
      - Adult Small
      - Adult Medium
      - Adult Large
      - Adult XL
      - Adult 2XL
      required: true
    - id: 36
      name: additional_information
      label: Additional Information
      hint: Anything else the coaching staff should know
      type: text
      options: []
      required: false
