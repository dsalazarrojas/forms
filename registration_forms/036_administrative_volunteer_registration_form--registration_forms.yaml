inputSchema:
  type: object
  properties:
    title: Administrative Volunteer Registration Form
    pages:
    - id: 1
      name: registration_header
      label: -- Administrative Volunteer Registration --
      hint: null
      type: note
      options: []
      required: false
    - id: 2
      name: volunteer_full_name
      label: Full Name
      hint: Enter your legal name
      type: text
      options: []
      required: true
    - id: 3
      name: volunteer_email
      label: Email Address
      hint: Valid email for communication
      type: email
      options: []
      required: true
    - id: 4
      name: volunteer_phone
      label: Phone Number
      hint: Contact phone number
      type: text
      options: []
      required: true
    - id: 5
      name: volunteer_address
      label: Address
      hint: Current residential address
      type: text
      options: []
      required: true
    - id: 6
      name: volunteer_city
      label: City
      hint: City of residence
      type: text
      options: []
      required: true
    - id: 7
      name: volunteer_state
      label: State/Province
      hint: State or province of residence
      type: text
      options: []
      required: true
    - id: 8
      name: volunteer_zip
      label: ZIP/Postal Code
      hint: Postal code of residence
      type: text
      options: []
      required: true
    - id: 9
      name: volunteer_country
      label: Country
      hint: Country of residence
      type: text
      options: []
      required: true
    - id: 10
      name: date_of_birth
      label: Date of Birth
      hint: Your birth date
      type: date
      options: []
      required: true
    - id: 11
      name: position_interested_in
      label: Position Interested In
      hint: What administrative volunteer position are you interested in?
      type: text
      options: []
      required: true
    - id: 12
      name: department_interested_in
      label: Department Interested In
      hint: Which department would you like to volunteer in?
      type: select_one
      options:
      - Administration
      - Human Resources
      - Finance
      - Marketing
      - Operations
      - IT
      - Events
      - Fundraising
      - Other
      required: true
    - id: 13
      name: availability_schedule
      label: Availability Schedule
      hint: What is your availability for volunteering?
      type: text
      options: []
      required: true
    - id: 14
      name: earliest_start_date
      label: Earliest Start Date
      hint: When can you start volunteering?
      type: date
      options: []
      required: true
    - id: 15
      name: expected_commitment_duration
      label: Expected Commitment Duration
      hint: How long do you expect to volunteer with us?
      type: select_one
      options:
      - Less than 3 months
      - 3-6 months
      - 6-12 months
      - 1-2 years
      - 2+ years
      required: true
    - id: 16
      name: hours_per_week
      label: Hours Available Per Week
      hint: How many hours per week can you commit?
      type: number
      options: []
      required: true
    - id: 17
      name: education_level
      label: Highest Education Level
      hint: What is your highest level of education?
      type: select_one
      options:
      - High School
      - Associate Degree
      - Bachelor's Degree
      - Master's Degree
      - Doctorate
      - Other
      required: true
    - id: 18
      name: education_details
      label: Education Details
      hint: Name of school, degree earned, graduation year
      type: text
      options: []
      required: false
    - id: 19
      name: administrative_experience
      label: Administrative Experience
      hint: Describe any relevant administrative experience
      type: text
      options: []
      required: false
    - id: 20
      name: computer_skills
      label: Computer Skills
      hint: List your computer software skills
      type: text
      options: []
      required: true
    - id: 21
      name: languages_spoken
      label: Languages Spoken
      hint: List all languages you speak fluently
      type: text
      options: []
      required: false
    - id: 22
      name: special_skills
      label: Special Skills
      hint: List any special skills that would benefit the organization
      type: text
      options: []
      required: false
    - id: 23
      name: motivation_for_volunteering
      label: Motivation for Volunteering
      hint: Why do you want to volunteer with our organization?
      type: text
      options: []
      required: true
    - id: 24
      name: references_available
      label: References Available
      hint: Are references available upon request?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 25
      name: background_check_consent
      label: Background Check Consent
      hint: Do you consent to a background check if required?
      type: select_one
      options:
      - 'Yes'
      - 'No'
      required: true
    - id: 26
      name: registration_date
      label: Registration Date
      hint: Date of submitting this registration
      type: date
      options: []
      required: true
    - id: 27
      name: volunteer_signature
      label: Volunteer Signature
      hint: Electronic signature to confirm registration
      type: text
      options: []
      required: true
