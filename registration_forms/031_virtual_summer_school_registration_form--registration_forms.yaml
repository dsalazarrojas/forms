inputSchema:
  type: object
  properties:
    title: Virtual Summer School Registration Form
    pages:
    - id: 1
      name: student_name
      label: Student Name
      hint: null
      type: text
      options: []
      required: false
    - id: 2
      name: student_email
      label: Student Email
      hint: null
      type: email
      options: []
      required: false
    - id: 3
      name: student_phone
      label: Student Phone
      hint: null
      type: text
      options: []
      required: false
    - id: 4
      name: parent_name
      label: Parent Name
      hint: Parent name is required if student is a minor
      type: text
      options: []
      required: false
    - id: 5
      name: school_name
      label: School Name
      hint: null
      type: text
      options: []
      required: false
    - id: 6
      name: student_grade_level
      label: Student Grade Level
      hint: null
      type: select_one
      options:
      - Pre-K
      - K-5
      - 6-8
      - 9-12
      required: false
    - id: 7
      name: student_grade_group
      label: Student Grade Group
      hint: null
      type: select_multiple
      options:
      - A
      - B
      - C
      required: false
    - id: 8
      name: teacher_name
      label: Teacher Name
      hint: null
      type: text
      options: []
      required: false
